<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE — Detalhes</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#111}
iframe{width:100%;height:100vh;border:0}
#painel{
 display:none;position:fixed;inset:0;background:#f4f5f7;
 z-index:9999;overflow:auto
}
.topo{
 background:#07111f;color:#fff;padding:16px;
 display:flex;align-items:center;gap:12px;
 position:sticky;top:0
}
.topo button{
 background:#fff;color:#07111f;border:0;border-radius:10px;
 padding:9px 13px;font-size:16px
}
.conteudo{padding:18px;max-width:600px;margin:auto}
.card{
 background:#fff;border-radius:18px;padding:18px;
 box-shadow:0 3px 12px #0001;margin-bottom:15px
}
.equipas{
 display:flex;align-items:center;justify-content:space-between;
 text-align:center;gap:10px
}
.equipa{width:40%;font-weight:bold}
.equipa img{width:55px;height:55px;object-fit:contain;display:block;margin:auto auto 8px}
.resultado{font-size:24px;font-weight:bold}
.badge{
 display:inline-block;padding:6px 10px;border-radius:20px;
 background:#07111f;color:white;font-size:13px
}
.info{margin-top:15px;line-height:1.6}
</style>
</head>

<body>

<iframe id="app" src="index.html"></iframe>

<div id="painel">
 <div class="topo">
  <button onclick="voltar()">← Voltar</button>
  <strong>Detalhes do jogo</strong>
 </div>

 <div class="conteudo">
  <div class="card">
   <div id="competicao" class="badge">Jogo</div>

   <div class="equipas" style="margin-top:20px">
    <div class="equipa">
     <img id="logoCasa">
     <div id="casa">Casa</div>
    </div>

    <div id="resultado" class="resultado">-</div>

    <div class="equipa">
     <img id="logoFora">
     <div id="fora">Fora</div>
    </div>
   </div>

   <div id="estado" class="info"></div>
   <div id="data" class="info"></div>
   <div id="estadio" class="info"></div>
  </div>

  <div id="eventos" class="card"></div>
  <div id="estatisticas" class="card"></div>
 </div>
</div>

<script>
const app=document.getElementById("app");
const painel=document.getElementById("painel");

function abrir(){
 painel.style.display="block";
}

function voltar(){
 painel.style.display="none";
}

function texto(v){
 return v==null?"":String(v);
}

function obterDados(){
 try{
  return app.contentWindow.eval("jogos") || [];
 }catch(e){
  return [];
 }
}

function procurarJogo(el){
 const jogos=obterDados();
 if(!jogos.length)return null;

 const cards=[...app.contentDocument.querySelectorAll(".card")];
 const i=cards.indexOf(el.closest(".card"));
 return i>=0 ? jogos[i] : null;
}

function nomeEquipa(c){
 return texto(
  c?.team?.displayName ||
  c?.team?.shortDisplayName ||
  c?.team?.name ||
  c?.displayName ||
  c?.name
 ) || "Equipa";
}

function logo(c){
 return c?.team?.logo || c?.logo || "";
}

function dadosJogo(j){
 const c=j?.competitions?.[0]||{};
 const home=c.competitors?.find(x=>x.homeAway==="home");
 const away=c.competitors?.find(x=>x.homeAway==="away");

 return {c,home,away};
}

function mostrar(j){
 if(!j)return;

 const {c,home,away}=dadosJogo(j);

 document.getElementById("competicao").textContent=
  j?.league?.name ||
  j?.league?.shortName ||
  c?.league?.name ||
  c?.competition?.name ||
  "Futebol";

 document.getElementById("casa").textContent=nomeEquipa(home);
 document.getElementById("fora").textContent=nomeEquipa(away);

 document.getElementById("logoCasa").src=logo(home);
 document.getElementById("logoFora").src=logo(away);

 document.getElementById("resultado").textContent=
  (home?.score!=null && away?.score!=null)
  ? home.score+" - "+away.score
  : "-";

 const s=c?.status?.type;
 let estado="Próximo";

 if(s?.state==="in")estado="🔴 LIVE";
 else if(s?.completed || s?.state==="post")estado="Resultado";

 document.getElementById("estado").innerHTML=
  "<b>Estado:</b> "+estado+
  (c?.status?.displayClock ? " · "+c.status.displayClock : "");

 const data=j?.date || c?.date;
 document.getElementById("data").innerHTML=
  data ? "<b>Data:</b> "+new Date(data).toLocaleString("pt-PT") : "";

 const venue=c?.venue;
 document.getElementById("estadio").innerHTML=
  venue?.fullName
  ? "<b>🏟️ Estádio:</b> "+venue.fullName
  : "<b>🏟️ Estádio:</b> Informação não disponível";

 const ev=j?.competitions?.[0]?.details || j?.details || [];

 document.getElementById("eventos").innerHTML=
  "<h3>⚽ Eventos</h3>"+
  (Array.isArray(ev)&&ev.length
   ? ev.map(x=>"<p>"+texto(x.text||x.type||x.name)+"</p>").join("")
   : "<p>Eventos adicionais não disponíveis.</p>");

 document.getElementById("estatisticas").innerHTML=
  "<h3>📊 Estatísticas</h3>"+
  "<p>As estatísticas serão mostradas quando estiverem disponíveis nos dados do jogo.</p>";

 abrir();
}

function iniciar(){
 try{
  const doc=app.contentDocument;

  doc.addEventListener("click",function(e){
   const card=e.target.closest(".card");
   if(!card)return;

   if(e.target.closest(".team"))return;

   const jogo=procurarJogo(card);
   if(jogo)mostrar(jogo);
  });
 }catch(e){
  console.log(e);
 }
}

app.addEventListener("load",()=>{
 setTimeout(iniciar,1200);
});
</script>

</body>
</html>
