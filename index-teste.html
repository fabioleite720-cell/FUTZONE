<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE — Detalhes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
iframe{width:100%;height:100vh;border:0}
#detalhes{display:none;position:fixed;inset:0;background:#f4f5f7;z-index:9999;overflow:auto}
.topo{background:#07111f;color:white;padding:15px;position:sticky;top:0}
.topo button{padding:9px 14px;border:0;border-radius:9px;margin-right:10px}
.box{background:white;margin:16px;padding:18px;border-radius:16px;box-shadow:0 3px 12px #0001}
.equipas{display:flex;justify-content:space-between;align-items:center;text-align:center;gap:8px}
.equipa{width:40%;font-weight:bold}
.equipa img{width:55px;height:55px;object-fit:contain;display:block;margin:auto auto 8px}
.resultado{font-size:24px;font-weight:bold}
.badge{display:inline-block;background:#07111f;color:white;padding:6px 10px;border-radius:20px;font-size:13px}
.info{margin-top:14px}
</style>
</head>

<body>

<iframe id="app" src="index.html"></iframe>

<div id="detalhes">

<div class="topo">
<button onclick="fechar()">← Voltar</button>
<b>Detalhes do jogo</b>
</div>

<div class="box">

<div id="competicao" class="badge">Futebol</div>

<div class="equipas" style="margin-top:20px">

<div class="equipa">
<img id="logoCasa">
<div id="casa">Casa</div>
</div>

<div id="resultado" class="resultado">-</div>

<div class="equipa">
<img id="logoFora">
<div id="fora">Fora</div>
</div>

</div>

<div id="estado" class="info"></div>
<div id="data" class="info"></div>
<div id="estadio" class="info"></div>

</div>

<div class="box">
<h3>⚽ Eventos</h3>
<div id="eventos">Informação disponível quando fornecida pelo jogo.</div>
</div>

<div class="box">
<h3>📊 Estatísticas</h3>
<p>As estatísticas serão mostradas quando estiverem disponíveis.</p>
</div>

</div>

<script>

const frame=document.getElementById("app");

function fechar(){
document.getElementById("detalhes").style.display="none";
}

function abrir(jogo){

if(!jogo)return;

const c=jogo?.competitions?.[0]||{};
const equipas=c.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)return;

function nome(x){
return x?.team?.displayName||
x?.team?.shortDisplayName||
x?.displayName||
x?.name||
"Equipa";
}

document.getElementById("casa").textContent=nome(casa);
document.getElementById("fora").textContent=nome(fora);

document.getElementById("logoCasa").src=
casa?.team?.logo||casa?.logo||"";

document.getElementById("logoFora").src=
fora?.team?.logo||fora?.logo||"";

document.getElementById("resultado").textContent=
casa?.score!=null&&fora?.score!=null
?casa.score+" - "+fora.score
:"-";

document.getElementById("competicao").textContent=
jogo?.league?.name||
c?.league?.name||
c?.competition?.name||
"Futebol";

const s=c?.status?.type;

let estado="Próximo";

if(s?.state==="in"){
estado="🔴 LIVE";
if(c?.status?.displayClock)
estado+=" · "+c.status.displayClock;
}
else if(s?.completed||s?.state==="post"){
estado="Resultado";
}

document.getElementById("estado").innerHTML=
"<b>Estado:</b> "+estado;

if(jogo?.date){
document.getElementById("data").innerHTML=
"<b>Data:</b> "+
new Date(jogo.date).toLocaleString("pt-PT");
}

document.getElementById("estadio").innerHTML=
c?.venue?.fullName
?"<b>🏟️ Estádio:</b> "+c.venue.fullName
:"<b>🏟️ Estádio:</b> Informação não disponível";

document.getElementById("detalhes").style.display="block";
}

frame.addEventListener("load",function(){

setTimeout(function(){

try{

const doc=frame.contentDocument;

doc.addEventListener("click",function(e){

const card=e.target.closest(".card");

if(!card)return;

if(e.target.closest(".team"))return;

let jogos=[];

try{
jogos=frame.contentWindow.eval("jogos")||[];
}catch(err){
return;
}

const cards=[
...doc.querySelectorAll(".card")
];

const indice=cards.indexOf(card);

if(indice>=0&&jogos[indice]){
abrir(jogos[indice]);
}

});

}catch(err){

console.log(err);

}

},1500);

});

</script>

</body>
</html>
