<!DOCTYPE html><html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE — Detalhes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
iframe{width:100%;height:100vh;border:0}
#detalhes{display:none;position:fixed;inset:0;background:#f4f5f7;z-index:9999;overflow:auto}
.topo{background:#07111f;color:white;padding:15px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
.topo button{padding:9px 14px;border:0;border-radius:9px;font-size:15px}
.box{background:white;margin:16px;padding:18px;border-radius:16px;box-shadow:0 3px 12px #0001}
.equipas{display:flex;justify-content:space-between;align-items:center;text-align:center;gap:8px}
.equipa{width:40%;font-weight:bold}
.equipa img{width:60px;height:60px;object-fit:contain;display:block;margin:auto auto 8px}
.resultado{font-size:25px;font-weight:bold;white-space:nowrap}
.badge{display:inline-block;background:#07111f;color:white;padding:6px 10px;border-radius:20px;font-size:13px}
.info{margin-top:14px}
.live{color:#d60000;font-weight:bold}
.evento{padding:12px 0;border-bottom:1px solid #eee}
.evento:last-child{border-bottom:0}
.evento-top{display:flex;gap:10px;align-items:center}
.minuto{font-weight:bold;min-width:35px}
.tipo{font-size:20px}
.nome-evento{font-weight:bold}
.assistencia{font-size:13px;color:#666;margin-top:3px}
.stats{width:100%;border-collapse:collapse;margin-top:10px}
.stats th{font-size:13px;padding:8px;text-align:center}
.stats td{padding:10px 4px;border-top:1px solid #eee;text-align:center}
.stats td:first-child{text-align:left;font-weight:bold}
.stats td:last-child{text-align:right}
.sem-dados{color:#777}
</style>
</head><body><iframe id="app" src="index.html"></iframe><div id="detalhes"><div class="topo">
<button onclick="fechar()">← Voltar</button>
<b>Detalhes do jogo</b>
</div><div class="box"><div id="competicao" class="badge">Futebol</div><div class="equipas" style="margin-top:20px"><div class="equipa">
<img id="logoCasa" alt="">
<div id="casa">Casa</div>
</div><div id="resultado" class="resultado">-</div><div class="equipa">
<img id="logoFora" alt="">
<div id="fora">Fora</div>
</div></div><div id="estado" class="info"></div>
<div id="data" class="info"></div>
<div id="estadio" class="info"></div></div><div class="box">
<h3>⚽ Eventos</h3>
<div id="eventos" class="sem-dados">
Informação de eventos não disponível para este jogo.
</div>
</div><div class="box">
<h3>📊 Estatísticas</h3>
<div id="estatisticas" class="sem-dados">
Estatísticas não disponíveis para este jogo.
</div>
</div></div><script>

const frame=document.getElementById("app");

function fechar(){
document.getElementById("detalhes").style.display="none";
}

function textoNormal(texto){
return String(texto||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\s+/g," ")
.trim();
}

function nomeEquipa(e){
return e?.team?.displayName ||
e?.team?.shortDisplayName ||
e?.team?.name ||
e?.displayName ||
e?.name ||
"Equipa";
}

function encontrarJogo(card,jogos){

const textoCard=textoNormal(card.innerText);

let melhor=null;
let pontosMax=0;

for(const jogo of jogos){

const c=jogo?.competitions?.[0];
const equipas=c?.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)continue;

let pontos=0;

const nc=textoNormal(nomeEquipa(casa));
const nf=textoNormal(nomeEquipa(fora));

if(nc&&textoCard.includes(nc))pontos+=10;
if(nf&&textoCard.includes(nf))pontos+=10;

const sc=textoNormal(casa?.team?.shortDisplayName);
const sf=textoNormal(fora?.team?.shortDisplayName);

if(sc&&textoCard.includes(sc))pontos+=3;
if(sf&&textoCard.includes(sf))pontos+=3;

if(pontos>pontosMax){
pontosMax=pontos;
melhor=jogo;
}

}

return melhor;
}

function valorTexto(v){
if(v===undefined||v===null)return"";
return String(v);
}

function nomeJogador(ev){

return ev?.athlete?.displayName ||
ev?.athlete?.fullName ||
ev?.player?.displayName ||
ev?.player?.fullName ||
ev?.participants?.[0]?.athlete?.displayName ||
ev?.participants?.[0]?.displayName ||
ev?.participants?.[0]?.athlete?.fullName ||
ev?.participants?.[0]?.fullName ||
ev?.text?.split(" - ")[0] ||
"Jogador";
}

function nomeAssistencia(ev){

return ev?.assist?.athlete?.displayName ||
ev?.assist?.displayName ||
ev?.assists?.[0]?.athlete?.displayName ||
ev?.assists?.[0]?.displayName ||
ev?.participants?.find(p=>p?.role==="assist")?.athlete?.displayName ||
"";
}

function tipoEvento(ev){

const texto=textoNormal(
ev?.text||
ev?.description||
ev?.type?.text||
ev?.type?.name||
""
);

if(
texto.includes("goal")||
texto.includes("golo")||
texto.includes("score")
)return"goal";

if(
texto.includes("yellow")||
texto.includes("amarelo")||
texto.includes("yellow card")
)return"yellow";

if(
texto.includes("red")||
texto.includes("vermelho")||
texto.includes("red card")
)return"red";

if(
texto.includes("substitut")||
texto.includes("substitution")||
texto.includes("entra")||
texto.includes("sai")
)return"sub";

return"other";
}

function iconeEvento(tipo){

if(tipo==="goal")return"⚽";
if(tipo==="yellow")return"🟨";
if(tipo==="red")return"🟥";
if(tipo==="sub")return"🔄";

return"•";
}

function textoDescricaoEvento(ev,tipo){

let nome=nomeJogador(ev);

if(tipo==="goal"){

const assist=nomeAssistencia(ev);

return{
principal:nome,
extra:assist?"Assistência: "+assist:""
};

}

if(tipo==="yellow"||tipo==="red"){

return{
principal:nome,
extra:""
};

}

if(tipo==="sub"){

const entra=
ev?.athlete?.displayName||
ev?.substitution?.in?.displayName||
ev?.participants?.find(p=>p?.type==="in")?.athlete?.displayName||
"";

const sai=
ev?.substitution?.out?.displayName||
ev?.participants?.find(p=>p?.type==="out")?.athlete?.displayName||
"";

if(entra||sai){

return{
principal:
(entra?"Entra: "+entra:"")+
(entra&&sai?" · ":"")+
(sai?"Sai: "+sai:""),
extra:""
};

}

}

return{
principal:
ev?.text||
ev?.description||
ev?.type?.text||
"Evento",
extra:""
};

}

function obterEventos(jogo){

const c=jogo?.competitions?.[0];

const possiveis=[
c?.details,
c?.plays,
c?.events,
jogo?.details,
jogo?.plays
];

for(const lista of possiveis){

if(Array.isArray(lista)&&lista.length)
return lista;

}

return[];

}

function mostrarEventos(jogo){

const container=document.getElementById("eventos");
const eventos=obterEventos(jogo);

if(!eventos.length){

container.innerHTML=
'<div class="sem-dados">Informação de eventos não disponível para este jogo.</div>';

return;
}

container.innerHTML="";

for(const ev of eventos){

const tipo=tipoEvento(ev);
const dados=textoDescricaoEvento(ev,tipo);

const minuto=
ev?.clock?.displayValue||
ev?.clock?.value||
ev?.time||
"";

const div=document.createElement("div");
div.className="evento";

div.innerHTML=
'<div class="evento-top">'+
'<span class="minuto">'+valorTexto(minuto)+'</span>'+
'<span class="tipo">'+iconeEvento(tipo)+'</span>'+
'<span class="nome-evento">'+dados.principal+'</span>'+
'</div>'+
(dados.extra?
'<div class="assistencia">'+dados.extra+'</div>'
:"");

container.appendChild(div);

}

}

function obterEstatisticas(jogo){

const c=jogo?.competitions?.[0];
const equipas=c?.competitors||[];

return equipas.map(e=>({

nome:nomeEquipa(e),

stats:e?.statistics||[]

}));

}

function encontrarStat(stats,nomes){

for(const s of stats){

const nome=textoNormal(
s?.name||
s?.displayName||
""
);

for(const n of nomes){

if(nome.includes(textoNormal(n)))
return s?.displayValue??s?.value??"-";

}

}

return"-";
}

function mostrarEstatisticas(jogo){

const container=document.getElementById("estatisticas");

const dados=obterEstatisticas(jogo);

if(dados.length<2){

container.innerHTML=
'<div class="sem-dados">Estatísticas não disponíveis para este jogo.</div>';

return;
}

const casa=dados[0];
const fora=dados[1];

const linhas=[

["Posse",
["possessionpct","possession"],
["possessionpct","possession"]],

["Remates",
["totalshots","shots"],
["totalshots","shots"]],

["Remates à baliza",
["shotsontarget"],
["shotsontarget"]],

["Cantos",
["woncorners","corners"],
["woncorners","corners"]],

["Faltas",
["foulscommitted","fouls"],
["foulscommitted","fouls"]],

["Assistências",
["goalassists","assists"],
["goalassists","assists"]]

];

let html=
'<table class="stats">'+
'<thead><tr>'+
'<th>'+casa.nome+'</th>'+
'<th>Estatística</th>'+
'<th>'+fora.nome+'</th>'+
'</tr></thead><tbody>';

for(const linha of linhas){

const a=encontrarStat(casa.stats,linha[1]);
const b=encontrarStat(fora.stats,linha[2]);

html+=
'<tr>'+
'<td>'+a+'</td>'+
'<td>'+linha[0]+'</td>'+
'<td>'+b+'</td>'+
'</tr>';

}

html+="</tbody></table>";

container.innerHTML=html;

}

function abrir(jogo){

if(!jogo)return;

const c=jogo?.competitions?.[0]||{};
const equipas=c?.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)return;

document.getElementById("casa").textContent=nomeEquipa(casa);
document.getElementById("fora").textContent=nomeEquipa(fora);

document.getElementById("logoCasa").src=
casa?.team?.logo||casa?.logo||"";

document.getElementById("logoFora").src=
fora?.team?.logo||fora?.logo||"";

document.getElementById("resultado").textContent=
casa?.score!=null&&fora?.score!=null
?casa.score+" - "+fora.score
:"-";

document.getElementById("competicao").textContent=
jogo?.league?.name||
jogo?.league?.displayName||
c?.league?.name||
c?.competition?.name||
"Futebol";

const s=c?.status?.type;

let estado="Próximo";

if(s?.state==="in"){

estado='<span class="live">🔴 LIVE</span>';

if(c?.status?.displayClock)
estado+=" · "+c.status.displayClock;

}
else if(s?.completed||s?.state==="post"){

estado="Resultado";

}

document.getElementById("estado").innerHTML=
"<b>Estado:</b> "+estado;

document.getElementById("data").innerHTML=
jogo?.date
?"<b>📅 Data:</b> "+new Date(jogo.date).toLocaleString("pt-PT")
:"";

document.getElementById("estadio").innerHTML=
c?.venue?.fullName
?"<b>🏟️ Estádio:</b> "+c.venue.fullName
:"<b>🏟️ Estádio:</b> Informação não disponível";

mostrarEventos(jogo);
mostrarEstatisticas(jogo);

document.getElementById("detalhes").style.display="block";

window.scrollTo(0,0);

}

frame.addEventListener("load",function(){

setTimeout(function(){

try{

const doc=frame.contentDocument;

if(!doc)return;

doc.addEventListener("click",function(e){

const card=e.target.closest(".card");

if(!card)return;

if(e.target.closest(".team"))return;

let jogos=[];

try{

jogos=
frame.contentWindow.eval("jogos")||[];

}catch(err){

return;

}

if(!Array.isArray(jogos))return;

const jogo=encontrarJogo(card,jogos);

if(jogo)abrir(jogo);

});

}catch(err){

console.log(err);

}

},1500);

});

</script></body>
</html>
