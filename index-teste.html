<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE — Detalhes</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 overflow:hidden
}

iframe{
 width:100%;
 height:100vh;
 border:0
}

#detalhes{
 display:none;
 position:fixed;
 inset:0;
 z-index:9999;
 background:#050505;
 overflow-y:auto
}

.topo{
 position:sticky;
 top:0;
 z-index:10;
 background:#000;
 border-bottom:1px solid #252525;
 padding:14px;
 display:flex;
 align-items:center;
 gap:12px
}

.voltar{
 background:#202020;
 color:#fff;
 border:0;
 border-radius:10px;
 padding:10px 14px;
 font-weight:bold
}

.titulo{
 font-size:18px;
 font-weight:900
}

.conteudo{
 max-width:700px;
 margin:auto;
 padding:14px
}

.jogo{
 background:#101010;
 border:1px solid #252525;
 border-radius:16px;
 padding:18px;
 text-align:center
}

.competicao{
 color:#168cff;
 font-size:13px;
 font-weight:bold;
 margin-bottom:12px
}

.estado{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#222;
 color:#aaa;
 font-size:12px;
 font-weight:bold;
 margin-bottom:15px
}

.estado.live{
 background:#ff3030;
 color:#fff
}

.equipas{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:10px
}

.equipa{
 font-weight:bold;
 font-size:15px
}

.logo{
 width:50px;
 height:50px;
 object-fit:contain;
 display:block;
 margin:0 auto 7px
}

.resultado{
 font-size:30px;
 font-weight:900
}

.data{
 color:#888;
 font-size:12px;
 margin-top:14px
}

.bloco{
 background:#101010;
 border:1px solid #252525;
 border-radius:16px;
 margin-top:14px;
 padding:16px
}

.bloco h3{
 margin:0 0 12px;
 font-size:17px
}

.linha{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #222;
 font-size:13px
}

.linha:last-child{
 border-bottom:0
}

.evento{
 display:grid;
 grid-template-columns:42px 30px 1fr;
 gap:8px;
 align-items:start;
 padding:11px 0;
 border-bottom:1px solid #222
}

.evento:last-child{
 border-bottom:0
}

.minuto{
 color:#aaa;
 font-weight:bold
}

.icone{
 font-size:19px
}

.nome{
 font-weight:bold;
 font-size:14px
}

.assistencia{
 color:#888;
 font-size:12px;
 margin-top:4px
}

.stats{
 width:100%;
 border-collapse:collapse
}

.stats td{
 padding:10px 3px;
 border-bottom:1px solid #222;
 font-size:13px
}

.stats td:first-child{
 text-align:left;
 font-weight:bold
}

.stats td:nth-child(2){
 text-align:center;
 color:#168cff;
 font-weight:bold
}

.stats td:last-child{
 text-align:right;
 font-weight:bold
}

.sem{
 color:#777;
 font-size:13px;
 text-align:center;
 padding:10px
}

.btnDetalhes{
 display:block;
 width:100%;
 margin-top:10px;
 padding:10px;
 border:0;
 border-radius:10px;
 background:#168cff;
 color:#fff;
 font-weight:bold
}
</style>
</head>

<body>

<iframe id="principal" src="index.html"></iframe>

<div id="detalhes">

 <div class="topo">
  <button class="voltar" onclick="fechar()">← Voltar</button>
  <div class="titulo">Detalhes do jogo</div>
 </div>

 <div class="conteudo" id="conteudo">
  A carregar...
 </div>

</div>

<script>

const ligas=[
 {
  nome:"Portugal",
  ficheiro:"data/primeira-liga.json",
  slug:"por.1"
 },
 {
  nome:"Inglaterra",
  ficheiro:"data/premier-league.json",
  slug:"eng.1"
 },
 {
  nome:"Espanha",
  ficheiro:"data/la-liga.json",
  slug:"esp.1"
 },
 {
  nome:"Itália",
  ficheiro:"data/serie-a.json",
  slug:"ita.1"
 },
 {
  nome:"Alemanha",
  ficheiro:"data/bundesliga.json",
  slug:"ger.1"
 }
];

let todosJogos=[];
let jogoAtual=null;


/* =========================
   NORMALIZAR NOMES
========================= */

function normalizar(nome){

 return String(nome||"")
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]/g,"");
}


function obterEquipas(jogo){

 const c=
  jogo?.competitions?.[0]?.competitors ||
  jogo?.competitors ||
  [];

 return {
  casa:c.find(x=>x.homeAway==="home")||c[0]||{},
  fora:c.find(x=>x.homeAway==="away")||c[1]||{}
 };
}


function nomeEquipa(c){

 return (
  c?.team?.displayName ||
  c?.team?.shortDisplayName ||
  c?.team?.name ||
  c?.displayName ||
  c?.name ||
  ""
 );
}


function nomesBatem(a,b){

 const x=normalizar(a);
 const y=normalizar(b);

 if(!x||!y) return false;

 return x===y || x.includes(y) || y.includes(x);
}


/* =========================
   CARREGAR OS MESMOS DADOS
   DA FUTZONE
========================= */

async function carregarJogos(){

 for(const liga of ligas){

  try{

   const r=await fetch(
    liga.ficheiro+"?v="+Date.now(),
    {cache:"no-store"}
   );

   if(!r.ok) continue;

   const d=await r.json();

   let lista=[];

   if(Array.isArray(d?.events))
    lista=d.events;

   else if(Array.isArray(d))
    lista=d;

   else if(Array.isArray(d?.games))
    lista=d.games;

   for(const jogo of lista){

    jogo.__liga=liga.nome;
    jogo.__slug=liga.slug;

    todosJogos.push(jogo);
   }

  }catch(e){
   console.log("Erro dados",liga.nome,e);
  }
 }

 ligarCartoes();
}


/* =========================
   IDENTIFICAR JOGO PELO
   TEXTO DO CARTÃO
========================= */

function encontrarJogo(texto){

 const t=normalizar(texto);

 for(const jogo of todosJogos){

  const e=obterEquipas(jogo);

  const casa=normalizar(nomeEquipa(e.casa));
  const fora=normalizar(nomeEquipa(e.fora));

  if(
   casa &&
   fora &&
   t.includes(casa) &&
   t.includes(fora)
  ){
   return jogo;
  }
 }

 return null;
}


/* =========================
   LIGAR BOTÕES AOS CARTÕES
========================= */

function ligarCartoes(){

 try{

  const doc=
   document.getElementById("principal")
   .contentDocument;

  if(!doc) return;

  const cards=doc.querySelectorAll(".card");

  cards.forEach(card=>{

   if(card.dataset.futzoneDetalhes)
    return;

   card.dataset.futzoneDetalhes="1";

   const botao=
    doc.createElement("button");

   botao.textContent="📋 Ver detalhes";

   botao.className="btnDetalhes";

   botao.style.cssText=
    "display:block;width:100%;margin-top:12px;padding:10px;border:0;border-radius:10px;background:#168cff;color:#fff;font-weight:bold;font-size:13px;";

   botao.onclick=function(e){

    e.preventDefault();
    e.stopPropagation();

    const jogo=encontrarJogo(
     card.innerText||""
    );

    if(jogo){
     abrir(jogo);
    }else{
     alert("Não consegui identificar este jogo.");
    }
   };

   card.appendChild(botao);

  });

 }catch(e){

  console.log("Erro cartões",e);
 }
}


/* =========================
   IFRAME
========================= */

document
 .getElementById("principal")
 .addEventListener("load",()=>{

  setTimeout(()=>{
   ligarCartoes();
  },1000);

  setTimeout(()=>{
   ligarCartoes();
  },3000);

 });


/* =========================
   ABRIR DETALHES
========================= */

function abrir(jogo){

 jogoAtual=jogo;

 document
  .getElementById("detalhes")
  .style.display="block";

 document
  .getElementById("conteudo")
  .innerHTML="<div class='sem'>A carregar detalhes...</div>";

 mostrarCabecalho(jogo);

 carregarResumo(jogo);
}


function fechar(){

 document
  .getElementById("detalhes")
  .style.display="none";

 jogoAtual=null;
}


/* =========================
   CABEÇALHO
========================= */

function mostrarCabecalho(jogo){

 const e=obterEquipas(jogo);

 const casa=e.casa;
 const fora=e.fora;

 const estado=
  jogo?.competitions?.[0]?.status?.type;

 let estadoTexto="PRÓXIMO";

 if(estado?.state==="in")
  estadoTexto="LIVE";

 else if(
  estado?.state==="post" ||
  estado?.completed
 )
  estadoTexto="RESULTADO";

 const data=
  jogo?.date
  ?new Date(jogo.date).toLocaleString(
    "pt-PT",
    {
     day:"2-digit",
     month:"2-digit",
     year:"numeric",
     hour:"2-digit",
     minute:"2-digit"
    }
   )
  :"";

 document.getElementById("conteudo").innerHTML=`

  <div class="jogo">

   <div class="competicao">
    ${esc(jogo.__liga)}
   </div>

   <div class="estado ${estadoTexto==="LIVE"?"live":""}">
    ${estadoTexto}
   </div>

   <div class="equipas">

    <div class="equipa">

     ${
      casa?.team?.logo
      ?`<img class="logo" src="${esc(casa.team.logo)}">`
      :""
     }

     ${esc(nomeEquipa(casa))}
    </div>

    <div class="resultado">
     ${esc(casa?.score ?? "-")}
     -
     ${esc(fora?.score ?? "-")}
    </div>

    <div class="equipa">

     ${
      fora?.team?.logo
      ?`<img class="logo" src="${esc(fora.team.logo)}">`
      :""
     }

     ${esc(nomeEquipa(fora))}
    </div>

   </div>

   <div class="data">
    ${esc(data)}
   </div>

  </div>

  <div id="resultadoDetalhes"></div>
 `;
}


/* =========================
   RESUMO ESPN
========================= */

async function carregarResumo(jogo){

 try{

  const url=
   "https://site.api.espn.com/apis/site/v2/sports/soccer/"
   +jogo.__slug+
   "/summary?event="
   +encodeURIComponent(jogo.id);

  const r=await fetch(
   url,
   {cache:"no-store"}
  );

  if(!r.ok)
   throw new Error("HTTP "+r.status);

  const resumo=await r.json();

  mostrarDetalhes(resumo,jogo);

 }catch(e){

  console.log("Erro resumo",e);

  document.getElementById(
   "resultadoDetalhes"
  ).innerHTML=`

   <div class="bloco">
    <h3>Detalhes</h3>
    <div class="sem">
     Não foi possível carregar os detalhes.
    </div>
   </div>
  `;
 }
}


/* =========================
   DETALHES COMPLETOS
========================= */

function mostrarDetalhes(resumo,jogo){

 let html="";

 const comp=
  resumo?.header?.competitions?.[0] ||
  resumo?.competitions?.[0] ||
  {};

 const estadio=
  comp?.venue?.fullName ||
  comp?.venue?.displayName ||
  "";

 if(estadio){

  html+=`

   <div class="bloco">

    <h3>📍 Local</h3>

    <div class="linha">
     <span>Estádio</span>
     <strong>${esc(estadio)}</strong>
    </div>

   </div>
  `;
 }


 /* EVENTOS */

 html+=eventos(resumo);


 /* ESTATÍSTICAS */

 html+=estatisticas(resumo);


 if(!html){

  html=`
   <div class="bloco">
    <div class="sem">
     Não existem detalhes adicionais disponíveis.
    </div>
   </div>
  `;
 }


 document.getElementById(
  "resultadoDetalhes"
 ).innerHTML=html;
}


/* =========================
   EVENTOS / GOLOS
========================= */

function obterEventos(resumo){

 let eventos=[];

 if(Array.isArray(resumo?.scoringPlays))
  eventos.push(...resumo.scoringPlays);

 if(Array.isArray(resumo?.plays))
  eventos.push(
   ...resumo.plays.filter(x=>
    !x.scoringPlay
    &&
    (
     x?.type?.text ||
     x?.type?.name ||
     x?.text
    )
   )
  );

 if(
  Array.isArray(
   resumo?.header?.competitions?.[0]?.details
  )
 )
  eventos.push(
   ...resumo.header.competitions[0].details
  );

 return eventos;
}


function atletas(ev){

 const listas=[
  ev?.athletesInvolved,
  ev?.athletes,
  ev?.participants
 ];

 for(const lista of listas){

  if(Array.isArray(lista)&&lista.length){

   return lista.map(a=>
    a?.displayName ||
    a?.fullName ||
    a?.shortName ||
    a?.athlete?.displayName ||
    a?.athlete?.fullName ||
    ""
   ).filter(Boolean);
  }
 }

 return [];
}


function assistencia(ev){

 const possiveis=[
  ev?.assist,
  ev?.assistAthlete,
  ev?.assistedBy,
  ev?.assistants
 ];

 for(const a of possiveis){

  if(Array.isArray(a)){

   const nomes=a.map(x=>
    x?.displayName ||
    x?.fullName ||
    x?.shortName ||
    x?.athlete?.displayName ||
    ""
   ).filter(Boolean);

   if(nomes.length)
    return nomes.join(", ");
  }

  if(typeof a==="object"&&a){

   const nome=
    a?.displayName ||
    a?.fullName ||
    a?.shortName ||
    a?.athlete?.displayName ||
    "";

   if(nome) return nome;
  }

  if(typeof a==="string"&&a)
   return a;
 }

 return "";
}


function minuto(ev){

 if(ev?.clock?.displayValue)
  return ev.clock.displayValue;

 if(ev?.minute!=null)
  return ev.minute+"'";

 if(ev?.clock?.value!=null)
  return Math.floor(
   Number(ev.clock.value)/60
  )+"'";

 return "";
}


function tipo(ev){

 const t=String(
  ev?.type?.text ||
  ev?.type?.name ||
  ev?.text ||
  ""
 ).toLowerCase();

 if(
  ev?.scoringPlay ||
  t.includes("goal") ||
  t.includes("gol")
 )
  return "gol";

 if(
  ev?.yellowCard ||
  t.includes("yellow")
 )
  return "amarelo";

 if(
  ev?.redCard ||
  t.includes("red card") ||
  t.includes("redcard")
 )
  return "vermelho";

 if(
  t.includes("substitution") ||
  t.includes("substitut")
 )
  return "sub";

 return "";
}


function eventos(resumo){

 const lista=obterEventos(resumo);

 const importantes=[];

 for(const ev of lista){

  const t=tipo(ev);

  if(
   t==="gol" ||
   t==="amarelo" ||
   t==="vermelho" ||
   t==="sub"
  )
   importantes.push(ev);
 }

 const vistos=new Set();

 const finais=importantes.filter(ev=>{

  const chave=
   minuto(ev)+"|"+
   (ev?.id||"")+"|"+
   (ev?.text||"");

  if(vistos.has(chave))
   return false;

  vistos.add(chave);
  return true;
 });


 if(!finais.length)
  return "";


 let html=`

  <div class="bloco">

   <h3>⚽ Acontecimentos</h3>
 `;


 for(const ev of finais){

  const t=tipo(ev);

  let icone="";

  if(t==="gol") icone="⚽";
  if(t==="amarelo") icone="🟨";
  if(t==="vermelho") icone="🟥";
  if(t==="sub") icone="🔄";

  const nomes=atletas(ev);

  let jogador=
   nomes[0] ||
   ev?.athlete?.displayName ||
   "";

  /*
    O ESPN por vezes coloca o nome
    diretamente no texto do evento.
  */

  if(!jogador){

   const texto=
    ev?.text ||
    ev?.type?.text ||
    "";

   jogador=texto || "Jogador";
  }

  const assist=assistencia(ev);

  html+=`

   <div class="evento">

    <div class="minuto">
     ${esc(minuto(ev))}
    </div>

    <div class="icone">
     ${icone}
    </div>

    <div>

     <div class="nome">
      ${esc(jogador)}
     </div>

     ${
      assist
      ?`
       <div class="assistencia">
        Assistência: ${esc(assist)}
       </div>
      `
      :""
     }

    </div>

   </div>
  `;
 }

 html+="</div>";

 return html;
}


/* =========================
   ESTATÍSTICAS
========================= */

function estatisticas(resumo){

 const teams=
  resumo?.boxscore?.teams || [];

 if(!teams.length)
  return "";

 const casa=
  teams.find(x=>x.homeAway==="home")
  ||teams[0];

 const fora=
  teams.find(x=>x.homeAway==="away")
  ||teams[1];

 if(!casa||!fora)
  return "";

 function stat(team,names){

  const lista=team.statistics||[];

  for(const n of names){

   const x=lista.find(s=>
    s?.name===n ||
    s?.displayName===n
   );

   if(x)
    return x.displayValue ??
           x.value ??
           "";
  }

  return "";
 }


 const dados=[
  ["Posse",["possessionPct","possession"]],
  ["Remates",["totalShots","shots"]],
  ["Remates à baliza",["shotsOnTarget"]],
  ["Cantos",["wonCorners","corners"]],
  ["Faltas",["foulsCommitted","fouls"]],
  ["Assistências",["goalAssists","assists"]]
 ];


 let linhas="";

 for(const d of dados){

  const a=stat(casa,d[1]);
  const b=stat(fora,d[1]);

  if(a===""&&b==="")
   continue;

  linhas+=`

   <tr>
    <td>${esc(a)}</td>
    <td>${esc(d[0])}</td>
    <td>${esc(b)}</td>
   </tr>
  `;
 }


 if(!linhas)
  return "";


 return`

  <div class="bloco">

   <h3>📊 Estatísticas</h3>

   <table class="stats">

    <tbody>
     ${linhas}
    </tbody>

   </table>

  </div>
 `;
}


/* =========================
   ESCAPAR HTML
========================= */

function esc(v){

 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =========================
   INICIAR
========================= */

carregarJogos();

</script>

</body>
</html>
