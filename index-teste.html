<!DOCTYPE html><html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE — Detalhes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
iframe{width:100%;height:100vh;border:0}
#detalhes{display:none;position:fixed;inset:0;background:#f4f5f7;z-index:9999;overflow:auto}
.topo{background:#07111f;color:white;padding:15px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
.topo button{padding:9px 14px;border:0;border-radius:9px;font-size:15px}
.box{background:white;margin:16px;padding:18px;border-radius:16px;box-shadow:0 3px 12px #0001}
.equipas{display:flex;justify-content:space-between;align-items:center;text-align:center;gap:8px}
.equipa{width:40%;font-weight:bold}
.equipa img{width:60px;height:60px;object-fit:contain;display:block;margin:auto auto 8px}
.resultado{font-size:25px;font-weight:bold;white-space:nowrap}
.badge{display:inline-block;background:#07111f;color:white;padding:6px 10px;border-radius:20px;font-size:13px}
.info{margin-top:14px}
.live{color:#d60000;font-weight:bold}
.evento{padding:12px 0;border-bottom:1px solid #eee}
.evento:last-child{border-bottom:0}
.evento-top{display:flex;gap:10px;align-items:center}
.minuto{font-weight:bold;min-width:38px}
.tipo{font-size:20px}
.nome-evento{font-weight:bold}
.assistencia{font-size:13px;color:#666;margin-top:4px;margin-left:48px}
.sub-info{font-size:13px;color:#666;margin-top:4px;margin-left:48px}
.loading{color:#777;text-align:center;padding:15px}
.stats{width:100%;border-collapse:collapse;margin-top:10px}
.stats th{font-size:12px;padding:9px;text-align:center}
.stats td{padding:10px 4px;border-top:1px solid #eee;text-align:center}
.stats td:first-child{text-align:left;font-weight:bold}
.stats td:last-child{text-align:right}
.stat-label{font-size:12px;color:#555}
</style>
</head><body><iframe id="app" src="index.html"></iframe><div id="detalhes"><div class="topo">
<button onclick="fechar()">← Voltar</button>
<b>Detalhes do jogo</b>
</div><div class="box"><div id="competicao" class="badge">Futebol</div><div class="equipas" style="margin-top:20px"><div class="equipa">
<img id="logoCasa" alt="">
<div id="casa">Casa</div>
</div><div id="resultado" class="resultado">-</div><div class="equipa">
<img id="logoFora" alt="">
<div id="fora">Fora</div>
</div></div><div id="estado" class="info"></div>
<div id="data" class="info"></div>
<div id="estadio" class="info"></div></div><div class="box">
<h3>⚽ Eventos</h3>
<div id="eventos">
<div class="loading">A carregar eventos...</div>
</div>
</div><div class="box">
<h3>📊 Estatísticas</h3>
<div id="estatisticas">
<div class="loading">A carregar estatísticas...</div>
</div>
</div></div><script>

const frame=document.getElementById("app");

const slugs={
"Portugal":"por.1",
"Inglaterra":"eng.1",
"Espanha":"esp.1",
"Itália":"ita.1",
"Alemanha":"ger.1"
};

function fechar(){
document.getElementById("detalhes").style.display="none";
}

function textoNormal(texto){
return String(texto||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\s+/g," ")
.trim();
}

function nomeEquipa(e){
return e?.team?.displayName||
e?.team?.shortDisplayName||
e?.team?.name||
e?.displayName||
e?.name||
"Equipa";
}

function encontrarJogo(card,jogos){

const textoCard=textoNormal(card.innerText);

let melhor=null;
let pontosMax=0;

for(const jogo of jogos){

const c=jogo?.competitions?.[0];
const equipas=c?.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)continue;

let pontos=0;

const nc=textoNormal(nomeEquipa(casa));
const nf=textoNormal(nomeEquipa(fora));

if(nc&&textoCard.includes(nc))pontos+=10;
if(nf&&textoCard.includes(nf))pontos+=10;

const sc=textoNormal(casa?.team?.shortDisplayName);
const sf=textoNormal(fora?.team?.shortDisplayName);

if(sc&&textoCard.includes(sc))pontos+=3;
if(sf&&textoCard.includes(sf))pontos+=3;

if(pontos>pontosMax){
pontosMax=pontos;
melhor=jogo;
}

}

return melhor;
}


/* =========================
   NOME DO JOGADOR
========================= */

function nomeAtleta(a){

return a?.displayName||
a?.fullName||
a?.shortName||
"";
}


/* =========================
   BUSCAR RESUMO ESPN
========================= */

async function buscarResumo(jogo){

const liga=jogo?.__liga;

const slug=slugs[liga];

if(!slug||!jogo?.id)
return null;

const url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"+
slug+
"/summary?event="+
encodeURIComponent(jogo.id);

try{

const r=await fetch(url,{
cache:"no-store"
});

if(!r.ok)return null;

return await r.json();

}catch(e){

console.log("Erro resumo ESPN",e);

return null;
}


/* =========================
   EVENTOS
========================= */

function obterDetalhesResumo(resumo,jogo){

const listas=[

resumo?.header?.competitions?.[0]?.details,

resumo?.competitions?.[0]?.details,

resumo?.plays,

resumo?.header?.plays

];

for(const lista of listas){

if(Array.isArray(lista)&&lista.length)
return lista;

}

return[];

}


function obterScoringPlays(resumo){

const listas=[

resumo?.scoringPlays,

resumo?.plays,

resumo?.header?.competitions?.[0]?.details

];

for(const lista of listas){

if(Array.isArray(lista)&&lista.length)
return lista;

}

return[];

}


function tipoEvento(ev){

if(ev?.scoringPlay===true)
return"goal";

if(ev?.redCard===true)
return"red";

if(ev?.yellowCard===true)
return"yellow";

const texto=textoNormal(
ev?.text||
ev?.description||
ev?.type?.text||
ev?.type?.name||
""
);

if(texto.includes("goal")||
texto.includes("golo")||
texto.includes("penalty - scored"))
return"goal";

if(texto.includes("yellow")||
texto.includes("amarelo"))
return"yellow";

if(texto.includes("red")||
texto.includes("vermelho"))
return"red";

if(texto.includes("substitut"))
return"sub";

return"other";
}


function iconeEvento(tipo){

if(tipo==="goal")return"⚽";
if(tipo==="yellow")return"🟨";
if(tipo==="red")return"🟥";
if(tipo==="sub")return"🔄";

return"•";
}


function atletasEvento(ev){

const arrays=[

ev?.athletesInvolved,

ev?.athletes,

ev?.participants

];

for(const arr of arrays){

if(Array.isArray(arr)&&arr.length){

return arr
.map(x=>x?.athlete||x)
.map(nomeAtleta)
.filter(Boolean);

}

}

return[];

}


function obterAssistencia(ev,nomeMarcador){

const atletas=atletasEvento(ev);

if(atletas.length>=2){

const possivel=atletas.find(n=>n!==nomeMarcador);

if(possivel)return possivel;

}

const assistencias=[

ev?.assist?.athlete,

ev?.assist,

ev?.assists?.[0]?.athlete,

ev?.assists?.[0],

ev?.assistant?.athlete,

ev?.assistant

];

for(const a of assistencias){

const nome=nomeAtleta(a);

if(nome)return nome;

}

return"";
}


function textoEvento(ev,tipo){

const atletas=atletasEvento(ev);

if(tipo==="goal"){

const marcador=atletas[0]||"Marcador não disponível";

const assist=obterAssistencia(ev,marcador);

return{
principal:marcador,
extra:assist?
"Assistência: "+assist:
""
};

}

if(tipo==="yellow"||tipo==="red"){

return{
principal:
atletas[0]||
"Jogador não disponível",
extra:""
};

}

if(tipo==="sub"){

if(atletas.length>=2){

return{
principal:
"Entra: "+atletas[0],
extra:"Sai: "+atletas[1]
};

}

return{
principal:
ev?.text||
ev?.description||
"Substituição",
extra:""
};

}

return{
principal:
ev?.text||
ev?.description||
ev?.type?.text||
"Evento",
extra:""
};

}


function mostrarEventosResumo(resumo,jogo){

const container=document.getElementById("eventos");

let eventos=obterDetalhesResumo(resumo,jogo);

if(!eventos.length)
eventos=obterScoringPlays(resumo);

if(!eventos.length){

container.innerHTML=
'<div class="loading">Não há eventos disponíveis para este jogo.</div>';

return;
}

container.innerHTML="";

for(const ev of eventos){

const tipo=tipoEvento(ev);

const dados=textoEvento(ev,tipo);

const minuto=
ev?.clock?.displayValue||
ev?.clock?.value||
ev?.time||
"";

const div=document.createElement("div");

div.className="evento";

div.innerHTML=
'<div class="evento-top">'+
'<span class="minuto">'+minuto+'</span>'+
'<span class="tipo">'+iconeEvento(tipo)+'</span>'+
'<span class="nome-evento">'+
dados.principal+
'</span>'+
'</div>'+
(
dados.extra
?
'<div class="'+
(tipo==="sub"?"sub-info":"assistencia")+
'">'+
dados.extra+
'</div>'
:
""
);

container.appendChild(div);

}

}


/* =========================
   ESTATÍSTICAS
========================= */

function obterBoxscore(resumo){

return resumo?.boxscore?.teams||
resumo?.boxscore?.competitors||
[];

}


function nomeStat(s){

return textoNormal(
s?.name||
s?.displayName||
s?.label||
""
);
}


function encontrarStat(stats,palavras){

for(const s of stats||[]){

const n=nomeStat(s);

for(const palavra of palavras){

if(n.includes(textoNormal(palavra)))
return s?.displayValue??s?.value??"-";

}

}

return"-";
}


function mostrarEstatisticasResumo(resumo,jogo){

const container=document.getElementById("estatisticas");

const teams=obterBoxscore(resumo);

if(!teams.length){

container.innerHTML=
'<div class="loading">Estatísticas não disponíveis.</div>';

return;
}

let casa=null;
let fora=null;

for(const t of teams){

const comp=t?.team||
t?.competitor||
{};

const nome=
comp?.displayName||
comp?.shortDisplayName||
t?.displayName||
"";

const entrada={
nome:nome,
stats:t?.statistics||[]
};

const c=jogo?.competitions?.[0]?.competitors||[];

const correspondente=c.find(x=>
x?.team?.id &&
comp?.id &&
String(x.team.id)===String(comp.id)
);

if(correspondente?.homeAway==="home")
casa=entrada;
else if(correspondente?.homeAway==="away")
fora=entrada;
else if(!casa)
casa=entrada;
else if(!fora)
fora=entrada;

}

if(!casa||!fora){

casa=teams[0];
fora=teams[1];

}

const linhas=[

["Posse de bola",
["possessionPct","possession"]],

["Remates",
["totalShots","shots"]],

["Remates à baliza",
["shotsOnTarget"]],

["Cantos",
["wonCorners","corners"]],

["Faltas",
["foulsCommitted","fouls"]],

["Assistências",
["goalAssists","assists"]],

["Golos",
["totalGoals","goals"]]

];

let html=
'<table class="stats">'+
'<thead>'+
'<tr>'+
'<th>'+((casa&&casa.nome)||"Casa")+'</th>'+
'<th>Estatística</th>'+
'<th>'+((fora&&fora.nome)||"Fora")+'</th>'+
'</tr>'+
'</thead>'+
'<tbody>';

for(const linha of linhas){

const a=encontrarStat(casa?.stats,linha[1]);
const b=encontrarStat(fora?.stats,linha[1]);

html+=
'<tr>'+
'<td>'+a+'</td>'+
'<td class="stat-label">'+linha[0]+'</td>'+
'<td>'+b+'</td>'+
'</tr>';

}

html+=
'</tbody>'+
'</table>';

container.innerHTML=html;

}


/* =========================
   ABRIR JOGO
========================= */

async function abrir(jogo){

if(!jogo)return;

const c=jogo?.competitions?.[0]||{};
const equipas=c?.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)return;

document.getElementById("casa").textContent=
nomeEquipa(casa);

document.getElementById("fora").textContent=
nomeEquipa(fora);

document.getElementById("logoCasa").src=
casa?.team?.logo||
casa?.logo||
"";

document.getElementById("logoFora").src=
fora?.team?.logo||
fora?.logo||
"";

document.getElementById("resultado").textContent=
casa?.score!=null&&fora?.score!=null
?casa.score+" - "+fora.score
:"-";

document.getElementById("competicao").textContent=
jogo?.__liga||
"Futebol";

const s=c?.status?.type;

let estado="Próximo";

if(s?.state==="in"){

estado=
'<span class="live">🔴 LIVE</span>';

if(c?.status?.displayClock)
estado+=" · "+c.status.displayClock;

}
else if(s?.completed||s?.state==="post"){

estado="Resultado";

}

document.getElementById("estado").innerHTML=
"<b>Estado:</b> "+estado;

document.getElementById("data").innerHTML=
jogo?.date
?
"<b>📅 Data:</b> "+
new Date(jogo.date).toLocaleString("pt-PT")
:
"";

document.getElementById("estadio").innerHTML=
c?.venue?.fullName
?
"<b>🏟️ Estádio:</b> "+
c.venue.fullName
:
"<b>🏟️ Estádio:</b> Informação não disponível";

document.getElementById("detalhes").style.display="block";

window.scrollTo(0,0);

document.getElementById("eventos").innerHTML=
'<div class="loading">⏳ A carregar jogadores e eventos...</div>';

document.getElementById("estatisticas").innerHTML=
'<div class="loading">⏳ A carregar estatísticas...</div>';

const resumo=await buscarResumo(jogo);

if(resumo){

mostrarEventosResumo(resumo,jogo);

mostrarEstatisticasResumo(resumo,jogo);

}else{

document.getElementById("eventos").innerHTML=
'<div class="loading">Não foi possível carregar os eventos.</div>';

document.getElementById("estatisticas").innerHTML=
'<div class="loading">Não foi possível carregar as estatísticas.</div>';

}

}


/* =========================
   CLIQUE NOS CARTÕES
========================= */

frame.addEventListener("load",function(){

setTimeout(function(){

try{

const doc=frame.contentDocument;

if(!doc)return;

doc.addEventListener("click",function(e){

const card=e.target.closest(".card");

if(!card)return;

if(e.target.closest(".team"))
return;

let jogos=[];

try{

jogos=
frame.contentWindow.eval("jogos")||[];

}catch(err){

console.log(err);
return;

}

if(!Array.isArray(jogos))
return;

const jogo=encontrarJogo(card,jogos);

if(jogo)
abrir(jogo);

});

}catch(err){

console.log("Erro FUTZONE:",err);

}

},1500);

});

</script></body>
</html>
