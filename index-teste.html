<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTZONE — Teste</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f2f4f7;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
#app{
  width:100%;
  height:100vh;
}
iframe{
  width:100%;
  height:100%;
  border:0;
}

/* DETALHES */
#detalhes{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f2f4f7;
  overflow-y:auto;
}

.topo{
  position:sticky;
  top:0;
  z-index:5;
  background:#07111f;
  color:white;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.voltar{
  border:0;
  background:white;
  color:#07111f;
  border-radius:10px;
  padding:9px 13px;
  font-weight:bold;
  font-size:15px;
}

.titulo{
  font-size:18px;
  font-weight:bold;
}

.conteudo{
  max-width:700px;
  margin:auto;
  padding:14px;
}

.cardJogo{
  background:white;
  border-radius:18px;
  padding:20px 14px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
  text-align:center;
}

.competicao{
  font-size:13px;
  color:#657080;
  margin-bottom:12px;
}

.estado{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#e9edf2;
  font-size:12px;
  font-weight:bold;
  margin-bottom:15px;
}

.estado.live{
  background:#e53935;
  color:white;
}

.equipas{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:8px;
}

.equipa{
  font-weight:bold;
  font-size:16px;
}

.logo{
  width:54px;
  height:54px;
  object-fit:contain;
  display:block;
  margin:0 auto 7px;
}

.resultado{
  font-size:30px;
  font-weight:bold;
}

.data{
  margin-top:14px;
  color:#687384;
  font-size:13px;
}

.bloco{
  background:white;
  margin-top:14px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.bloco h3{
  margin:0 0 13px;
  font-size:17px;
}

.info{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #edf0f3;
  font-size:14px;
}

.info:last-child{
  border-bottom:0;
}

.evento{
  display:grid;
  grid-template-columns:45px 32px 1fr;
  align-items:start;
  gap:8px;
  padding:11px 0;
  border-bottom:1px solid #edf0f3;
}

.evento:last-child{
  border-bottom:0;
}

.minuto{
  font-weight:bold;
  color:#4d5866;
}

.icone{
  font-size:20px;
}

.nomeEvento{
  font-weight:bold;
  font-size:14px;
}

.assistencia{
  color:#697586;
  font-size:12px;
  margin-top:4px;
}

.tabelaStats{
  width:100%;
  border-collapse:collapse;
}

.tabelaStats td{
  padding:10px 4px;
  border-bottom:1px solid #edf0f3;
  font-size:13px;
}

.tabelaStats td:nth-child(2){
  text-align:center;
  font-weight:bold;
}

.tabelaStats td:last-child{
  text-align:right;
}

.semDados{
  color:#697586;
  font-size:14px;
  padding:8px 0;
}
</style>
</head>

<body>

<div id="app">
  <iframe id="principal" src="index.html"></iframe>
</div>

<div id="detalhes">

  <div class="topo">
    <button class="voltar" onclick="fecharDetalhes()">← Voltar</button>
    <div class="titulo">Detalhes do jogo</div>
  </div>

  <div class="conteudo" id="conteudoDetalhes">
    A carregar...
  </div>

</div>

<script>

const slugs={
  "Portugal":"por.1",
  "Inglaterra":"eng.1",
  "Espanha":"esp.1",
  "Itália":"ita.1",
  "Alemanha":"ger.1"
};

let jogoAtual=null;

/* ---------------------------
   ABRIR / FECHAR
--------------------------- */

function fecharDetalhes(){
  document.getElementById("detalhes").style.display="none";
  document.getElementById("app").style.display="block";
  jogoAtual=null;
}

/* ---------------------------
   NOMES / EQUIPAS
--------------------------- */

function obterCompeticao(j){
  return j?.competitions?.[0] || {};
}

function obterEquipas(j){
  return obterCompeticao(j)?.competitors || [];
}

function equipaCasa(j){
  return obterEquipas(j).find(x=>x.homeAway==="home") || obterEquipas(j)[0];
}

function equipaFora(j){
  return obterEquipas(j).find(x=>x.homeAway==="away") || obterEquipas(j)[1];
}

function nomeEquipa(c){
  return c?.team?.displayName ||
         c?.team?.shortDisplayName ||
         c?.team?.name ||
         c?.displayName ||
         "Equipa";
}

function logoEquipa(c){
  return c?.team?.logo || c?.team?.logos?.[0]?.href || "";
}

function resultadoEquipa(c){
  return c?.score?.displayValue ??
         c?.score?.value ??
         c?.score ??
         "-";
}

function estadoJogo(j){
  const s=obterCompeticao(j)?.status?.type;

  if(s?.state==="in") return "LIVE";
  if(s?.completed || s?.state==="post") return "RESULTADO";

  return "PRÓXIMO";
}

function dataJogo(j){
  const data=obterCompeticao(j)?.date || j?.date;

  if(!data) return "";

  try{
    return new Date(data).toLocaleString("pt-PT",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch(e){
    return data;
  }
}

/* ---------------------------
   ABRIR JOGO
--------------------------- */

function abrirJogo(j){

  if(!j || !j.id){
    alert("Não foi possível identificar este jogo.");
    return;
  }

  jogoAtual=j;

  document.getElementById("app").style.display="none";
  document.getElementById("detalhes").style.display="block";

  mostrarBase(j);

  carregarDetalhes(j);
}

/* ---------------------------
   BASE
--------------------------- */

function mostrarBase(j){

  const casa=equipaCasa(j);
  const fora=equipaFora(j);
  const estado=estadoJogo(j);

  document.getElementById("conteudoDetalhes").innerHTML=`

    <div class="cardJogo">

      <div class="competicao">
        ${j.__liga || obterCompeticao(j)?.league?.name || "Futebol"}
      </div>

      <div class="estado ${estado==="LIVE"?"live":""}">
        ${estado}
      </div>

      <div class="equipas">

        <div class="equipa">
          ${logoEquipa(casa)?`
            <img class="logo" src="${logoEquipa(casa)}">
          `:""}
          ${nomeEquipa(casa)}
        </div>

        <div class="resultado">
          ${resultadoEquipa(casa)}
          -
          ${resultadoEquipa(fora)}
        </div>

        <div class="equipa">
          ${logoEquipa(fora)?`
            <img class="logo" src="${logoEquipa(fora)}">
          `:""}
          ${nomeEquipa(fora)}
        </div>

      </div>

      <div class="data">
        ${dataJogo(j)}
      </div>

    </div>

    <div id="blocosDetalhes"></div>
  `;
}

/* ---------------------------
   ESPN SUMMARY
--------------------------- */

async function carregarDetalhes(j){

  const liga=j.__liga || "";

  const slug=slugs[liga];

  if(!slug){

    document.getElementById("blocosDetalhes").innerHTML=`
      <div class="bloco">
        <h3>Detalhes</h3>
        <div class="semDados">
          Não foi possível identificar a competição.
        </div>
      </div>
    `;

    return;
  }

  try{

    const url=
      "https://site.api.espn.com/apis/site/v2/sports/soccer/"
      +slug+
      "/summary?event="
      +encodeURIComponent(j.id);

    const resposta=await fetch(url,{
      cache:"no-store"
    });

    if(!resposta.ok){
      throw new Error("HTTP "+resposta.status);
    }

    const resumo=await resposta.json();

    mostrarResumo(j,resumo);

  }catch(erro){

    console.error("Erro ESPN:",erro);

    document.getElementById("blocosDetalhes").innerHTML=`
      <div class="bloco">
        <h3>Detalhes</h3>
        <div class="semDados">
          Não foi possível carregar os detalhes deste jogo.
        </div>
      </div>
    `;
  }
}

/* ---------------------------
   RESUMO
--------------------------- */

function mostrarResumo(j,resumo){

  const blocos=document.getElementById("blocosDetalhes");

  const comp=
    resumo?.header?.competitions?.[0] ||
    resumo?.competitions?.[0] ||
    obterCompeticao(j);

  let html="";

  /* ESTÁDIO */

  const estadio=
    comp?.venue?.fullName ||
    comp?.venue?.displayName ||
    comp?.venue?.address?.city ||
    "";

  if(estadio){

    html+=`
      <div class="bloco">
        <h3>📍 Local</h3>
        <div class="info">
          <span>Estádio</span>
          <strong>${esc(estadio)}</strong>
        </div>
      </div>
    `;
  }

  /* EVENTOS */

  html+=mostrarEventosResumo(resumo,j);

  /* ESTATÍSTICAS */

  html+=mostrarEstatisticasResumo(resumo,j);

  if(!html){

    html=`
      <div class="bloco">
        <h3>Detalhes</h3>
        <div class="semDados">
          Não existem mais informações disponíveis.
        </div>
      </div>
    `;
  }

  blocos.innerHTML=html;
}

/* ---------------------------
   EVENTOS
--------------------------- */

function obterScoringPlays(resumo){

  if(Array.isArray(resumo?.scoringPlays))
    return resumo.scoringPlays;

  if(Array.isArray(resumo?.plays))
    return resumo.plays.filter(x=>x?.scoringPlay);

  return [];
}

function obterTodosEventos(resumo){

  let eventos=[];

  if(Array.isArray(resumo?.header?.competitions?.[0]?.details))
    eventos=eventos.concat(
      resumo.header.competitions[0].details
    );

  if(Array.isArray(resumo?.competitions?.[0]?.details))
    eventos=eventos.concat(
      resumo.competitions[0].details
    );

  if(Array.isArray(resumo?.plays))
    eventos=eventos.concat(
      resumo.plays.filter(x=>
        x?.scoringPlay ||
        x?.type?.text ||
        x?.type?.name
      )
    );

  return eventos;
}

function atletasEvento(ev){

  const listas=[
    ev?.athletesInvolved,
    ev?.athletes,
    ev?.participants
  ];

  for(const lista of listas){

    if(Array.isArray(lista) && lista.length){

      return lista.map(a=>
        a?.displayName ||
        a?.fullName ||
        a?.shortName ||
        a?.athlete?.displayName ||
        a?.athlete?.fullName ||
        ""
      ).filter(Boolean);
    }
  }

  return [];
}

function obterAssistencia(ev){

  const assist=
    ev?.assist ||
    ev?.assistAthlete ||
    ev?.assistedBy ||
    ev?.assistants;

  if(Array.isArray(assist)){
    return assist.map(a=>
      a?.displayName ||
      a?.fullName ||
      a?.shortName ||
      a?.athlete?.displayName ||
      ""
    ).filter(Boolean).join(", ");
  }

  if(typeof assist==="object"){
    return assist?.displayName ||
           assist?.fullName ||
           assist?.shortName ||
           assist?.athlete?.displayName ||
           "";
  }

  return "";
}

function tipoEvento(ev){

  const texto=(
    ev?.type?.text ||
    ev?.type?.name ||
    ev?.type?.description ||
    ev?.text ||
    ""
  ).toLowerCase();

  if(
    ev?.scoringPlay ||
    texto.includes("goal") ||
    texto.includes("gol")
  ){
    return "gol";
  }

  if(
    ev?.yellowCard ||
    texto.includes("yellow")
  ){
    return "amarelo";
  }

  if(
    ev?.redCard ||
    texto.includes("red card") ||
    texto.includes("redcard")
  ){
    return "vermelho";
  }

  if(
    texto.includes("substitut") ||
    texto.includes("substitution")
  ){
    return "substituicao";
  }

  return "";
}

function minutoEvento(ev){

  if(ev?.clock?.displayValue)
    return ev.clock.displayValue;

  if(ev?.clock?.value!=null)
    return Math.floor(Number(ev.clock.value)/60)+"'";

  if(ev?.minute!=null)
    return ev.minute+"'";

  if(ev?.period?.displayValue)
    return ev.period.displayValue;

  return "";
}

function nomeJogadorDireto(ev){

  const atletas=atletasEvento(ev);

  if(atletas.length)
    return atletas[0];

  if(ev?.athlete?.displayName)
    return ev.athlete.displayName;

  return "";
}

function textoEvento(ev){

  return (
    ev?.text ||
    ev?.type?.text ||
    ev?.type?.description ||
    ev?.type?.name ||
    ""
  );
}

function mostrarEventosResumo(resumo,j){

  const scoring=obterScoringPlays(resumo);
  const todos=obterTodosEventos(resumo);

  let eventos=[];

  /* Primeiro golos */

  for(const ev of scoring){

    const tipo=tipoEvento(ev);

    if(tipo==="gol")
      eventos.push(ev);
  }

  /* Depois cartões/substituições */

  for(const ev of todos){

    const tipo=tipoEvento(ev);

    if(
      tipo==="amarelo" ||
      tipo==="vermelho" ||
      tipo==="substituicao"
    ){
      eventos.push(ev);
    }
  }

  /* retirar duplicados */

  const vistos=new Set();

  eventos=eventos.filter(ev=>{

    const chave=
      (ev?.id || "")+
      "|" +
      minutoEvento(ev)+
      "|" +
      textoEvento(ev);

    if(vistos.has(chave))
      return false;

    vistos.add(chave);
    return true;
  });

  if(!eventos.length)
    return "";

  let html=`
    <div class="bloco">
      <h3>⚽ Acontecimentos</h3>
  `;

  for(const ev of eventos){

    const tipo=tipoEvento(ev);

    let icone="";

    if(tipo==="gol") icone="⚽";
    if(tipo==="amarelo") icone="🟨";
    if(tipo==="vermelho") icone="🟥";
    if(tipo==="substituicao") icone="🔄";

    let nome=nomeJogadorDireto(ev);

    /*
      Em alguns jogos o texto do ESPN já traz
      o nome do jogador.
    */

    if(!nome){

      const texto=textoEvento(ev);

      if(texto)
        nome=texto;
    }

    if(!nome)
      nome="Jogador";

    const assist=obterAssistencia(ev);

    html+=`
      <div class="evento">

        <div class="minuto">
          ${esc(minutoEvento(ev))}
        </div>

        <div class="icone">
          ${icone}
        </div>

        <div>

          <div class="nomeEvento">
            ${esc(nome)}
          </div>

          ${
            assist
            ?`
              <div class="assistencia">
                Assistência: ${esc(assist)}
              </div>
            `
            :""
          }

        </div>

      </div>
    `;
  }

  html+="</div>";

  return html;
}

/* ---------------------------
   ESTATÍSTICAS
--------------------------- */

function obterBoxscore(resumo){

  if(Array.isArray(resumo?.boxscore?.teams))
    return resumo.boxscore.teams;

  if(Array.isArray(resumo?.competitions?.[0]?.competitors))
    return resumo.competitions[0].competitors;

  return [];
}

function valorStat(competitor,nomes){

  const stats=competitor?.statistics || [];

  for(const nome of nomes){

    const item=stats.find(s=>
      s?.name===nome ||
      s?.displayName===nome
    );

    if(item){

      return item.displayValue ??
             item.value ??
             "";
    }
  }

  return "";
}

function mostrarEstatisticasResumo(resumo,j){

  const teams=obterBoxscore(resumo);

  if(!teams.length)
    return "";

  const casa=teams.find(x=>
    x.homeAway==="home"
  ) || teams[0];

  const fora=teams.find(x=>
    x.homeAway==="away"
  ) || teams[1];

  if(!casa || !fora)
    return "";

  const estatisticas=[
    {
      nome:"Posse de bola",
      campos:["possessionPct","possession"]
    },
    {
      nome:"Remates",
      campos:["totalShots","shots"]
    },
    {
      nome:"Remates à baliza",
      campos:["shotsOnTarget"]
    },
    {
      nome:"Cantos",
      campos:["wonCorners","corners"]
    },
    {
      nome:"Faltas",
      campos:["foulsCommitted","fouls"]
    },
    {
      nome:"Assistências",
      campos:["goalAssists","assists"]
    },
    {
      nome:"Golos",
      campos:["totalGoals","goals"]
    }
  ];

  let linhas="";

  for(const s of estatisticas){

    const vCasa=valorStat(casa,s.campos);
    const vFora=valorStat(fora,s.campos);

    if(vCasa==="" && vFora==="")
      continue;

    linhas+=`
      <tr>
        <td>${esc(vCasa)}</td>
        <td>${esc(s.nome)}</td>
        <td>${esc(vFora)}</td>
      </tr>
    `;
  }

  if(!linhas)
    return "";

  return`
    <div class="bloco">
      <h3>📊 Estatísticas</h3>

      <table class="tabelaStats">
        <tbody>
          ${linhas}
        </tbody>
      </table>

    </div>
  `;
}

/* ---------------------------
   SEGURANÇA HTML
--------------------------- */

function esc(valor){

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ---------------------------
   CLIQUE NOS JOGOS
--------------------------- */

const iframe=document.getElementById("principal");

iframe.addEventListener("load",()=>{

  try{

    const doc=
      iframe.contentDocument ||
      iframe.contentWindow.document;

    /*
      Capturamos qualquer clique dentro
      do iframe e tentamos descobrir
      qual cartão foi pressionado.
    */

    doc.addEventListener("click",function(e){

      let el=e.target;

      while(el && el!==doc.body){

        /*
          Tentamos obter o jogo guardado
          pelo index.html.
        */

        if(el.dataset && el.dataset.gameId){

          const id=el.dataset.gameId;

          const lista=
            iframe.contentWindow.jogos ||
            iframe.contentWindow.todosJogos ||
            [];

          const jogo=lista.find(x=>
            String(x.id)===String(id)
          );

          if(jogo){
            e.preventDefault();
            e.stopPropagation();
            abrirJogo(jogo);
            return;
          }
        }

        el=el.parentElement;
      }

      /*
        Fallback:
        procuramos o texto das equipas no
        cartão e comparamos com os jogos
        carregados na página.
      */

      const card=
        e.target.closest(
          ".jogo-card,.jogoCard,.card-jogo,.game-card,.card"
        );

      if(!card)
        return;

      const texto=(card.innerText || "").trim();

      const lista=
        iframe.contentWindow.jogos ||
        iframe.contentWindow.todosJogos ||
        [];

      for(const jogo of lista){

        const casa=nomeEquipa(equipaCasa(jogo));
        const fora=nomeEquipa(equipaFora(jogo));

        if(
          texto.includes(casa) &&
          texto.includes(fora)
        ){

          e.preventDefault();
          e.stopPropagation();

          abrirJogo(jogo);
          return;
        }
      }

    },true);

  }catch(erro){

    console.log(
      "Não foi possível ligar os cliques:",
      erro
    );

  }

});

/*
  Tentativa adicional:
  intercepta chamadas de mostrarJogos
  caso o index.html exponha a função.
*/

iframe.addEventListener("load",()=>{

  try{

    const win=iframe.contentWindow;

    if(typeof win.mostrarJogos==="function"){

      const original=win.mostrarJogos;

      win.mostrarJogos=function(){

        const resultado=original.apply(this,arguments);

        setTimeout(ligarCartoes,100);

        return resultado;
      };

    }

    ligarCartoes();

  }catch(e){}

});

function ligarCartoes(){

  try{

    const doc=
      iframe.contentDocument ||
      iframe.contentWindow.document;

    const cartoes=doc.querySelectorAll(
      ".jogo-card,.jogoCard,.card-jogo,.game-card"
    );

    cartoes.forEach(card=>{

      if(card.dataset.futzoneLigado)
        return;

      card.dataset.futzoneLigado="1";

      card.addEventListener("click",function(e){

        const texto=(card.innerText || "").trim();

        const lista=
          iframe.contentWindow.jogos ||
          iframe.contentWindow.todosJogos ||
          [];

        for(const jogo of lista){

          const casa=nomeEquipa(equipaCasa(jogo));
          const fora=nomeEquipa(equipaFora(jogo));

          if(
            texto.includes(casa) &&
            texto.includes(fora)
          ){

            e.preventDefault();
            e.stopPropagation();

            abrirJogo(jogo);

            return;
          }
        }

      },true);

    });

  }catch(e){}
}

</script>

</body>
</html>
