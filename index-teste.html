<!DOCTYPE html><html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE — Detalhes</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#111;
}

iframe{
width:100%;
height:100vh;
border:0;
}

#detalhes{
display:none;
position:fixed;
inset:0;
background:#f4f5f7;
z-index:9999;
overflow:auto;
}

.topo{
background:#07111f;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:5;
display:flex;
align-items:center;
gap:10px;
}

.topo button{
padding:9px 14px;
border:0;
border-radius:9px;
font-size:15px;
}

.box{
background:white;
margin:16px;
padding:18px;
border-radius:16px;
box-shadow:0 3px 12px #0001;
}

.equipas{
display:flex;
justify-content:space-between;
align-items:center;
text-align:center;
gap:8px;
}

.equipa{
width:40%;
font-weight:bold;
}

.equipa img{
width:60px;
height:60px;
object-fit:contain;
display:block;
margin:auto auto 8px;
}

.resultado{
font-size:25px;
font-weight:bold;
white-space:nowrap;
}

.badge{
display:inline-block;
background:#07111f;
color:white;
padding:6px 10px;
border-radius:20px;
font-size:13px;
}

.info{
margin-top:14px;
}

.live{
color:#d60000;
font-weight:bold;
}

.evento{
padding:10px 0;
border-bottom:1px solid #eee;
}

.sem-dados{
color:#777;
}

#erro{
color:#b00020;
font-weight:bold;
}
</style></head><body><iframe id="app" src="index.html"></iframe><div id="detalhes"><div class="topo">
<button onclick="fechar()">← Voltar</button>
<b>Detalhes do jogo</b>
</div><div class="box"><div id="competicao" class="badge">Futebol</div><div class="equipas" style="margin-top:20px"><div class="equipa">
<img id="logoCasa" alt="">
<div id="casa">Casa</div>
</div><div id="resultado" class="resultado">-</div><div class="equipa">
<img id="logoFora" alt="">
<div id="fora">Fora</div>
</div></div><div id="estado" class="info"></div>
<div id="data" class="info"></div>
<div id="estadio" class="info"></div></div><div class="box">
<h3>⚽ Eventos</h3>
<div id="eventos" class="sem-dados">
Informação de eventos não disponível para este jogo.
</div>
</div><div class="box">
<h3>📊 Estatísticas</h3>
<div id="estatisticas" class="sem-dados">
Estatísticas não disponíveis para este jogo.
</div>
</div><div class="box" id="erro" style="display:none"></div></div><script>

const frame=document.getElementById("app");

function fechar(){
document.getElementById("detalhes").style.display="none";
}

function textoNormal(texto){
return String(texto||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\s+/g," ")
.trim();
}

function nomeEquipa(e){
return e?.team?.displayName ||
e?.team?.shortDisplayName ||
e?.team?.name ||
e?.displayName ||
e?.name ||
"Equipa";
}

function encontrarJogo(card,jogos){

const textoCard=textoNormal(card.innerText);

if(!textoCard)return null;

let melhor=null;
let melhorPontuacao=0;

for(const jogo of jogos){

const comp=jogo?.competitions?.[0];
const equipas=comp?.competitors||[];

if(equipas.length<2)continue;

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)continue;

const nomeCasa=textoNormal(nomeEquipa(casa));
const nomeFora=textoNormal(nomeEquipa(fora));

let pontos=0;

if(nomeCasa && textoCard.includes(nomeCasa))pontos+=5;
if(nomeFora && textoCard.includes(nomeFora))pontos+=5;

const shortCasa=textoNormal(casa?.team?.shortDisplayName);
const shortFora=textoNormal(fora?.team?.shortDisplayName);

if(shortCasa && textoCard.includes(shortCasa))pontos+=2;
if(shortFora && textoCard.includes(shortFora))pontos+=2;

if(pontos>melhorPontuacao){
melhorPontuacao=pontos;
melhor=jogo;
}

}

return melhor;
}

function mostrarEventos(jogo){

const container=document.getElementById("eventos");

const competicao=jogo?.competitions?.[0];

const possiveis=[
jogo?.competitions?.[0]?.details,
jogo?.competitions?.[0]?.plays,
jogo?.competitions?.[0]?.events,
jogo?.details,
jogo?.plays
];

let eventos=null;

for(const x of possiveis){
if(Array.isArray(x)&&x.length){
eventos=x;
break;
}
}

if(!eventos){
container.innerHTML=
'<div class="sem-dados">Informação de eventos não disponível para este jogo.</div>';
return;
}

container.innerHTML="";

for(const ev of eventos){

const div=document.createElement("div");
div.className="evento";

const minuto=
ev?.clock?.displayValue ||
ev?.clock?.value ||
ev?.time ||
"";

const descricao=
ev?.text ||
ev?.description ||
ev?.type?.text ||
"Evento";

div.textContent=
(minuto ? minuto+" — " : "")+descricao;

container.appendChild(div);
}

}

function mostrarEstatisticas(jogo){

const container=document.getElementById("estatisticas");

const competicao=jogo?.competitions?.[0];

const stats=
competicao?.competitors?.flatMap(e=>e.statistics||[]) ||
jogo?.statistics ||
[];

if(!Array.isArray(stats)||!stats.length){
container.innerHTML=
'<div class="sem-dados">Estatísticas não disponíveis para este jogo.</div>';
return;
}

container.innerHTML="";

const tabela=document.createElement("div");

for(const s of stats){

const linha=document.createElement("div");
linha.className="evento";

const nome=
s?.name ||
s?.displayName ||
"Estatística";

const valor=
s?.displayValue ??
s?.value ??
"";

linha.innerHTML="<b>"+nome+"</b>: "+valor;

tabela.appendChild(linha);
}

container.appendChild(tabela);
}

function abrir(jogo){

if(!jogo)return;

const c=jogo?.competitions?.[0]||{};
const equipas=c?.competitors||[];

const casa=equipas.find(x=>x.homeAway==="home");
const fora=equipas.find(x=>x.homeAway==="away");

if(!casa||!fora)return;

document.getElementById("casa").textContent=nomeEquipa(casa);
document.getElementById("fora").textContent=nomeEquipa(fora);

document.getElementById("logoCasa").src=
casa?.team?.logo||casa?.logo||"";

document.getElementById("logoFora").src=
fora?.team?.logo||fora?.logo||"";

document.getElementById("resultado").textContent=
casa?.score!=null && fora?.score!=null
?casa.score+" - "+fora.score
:"-";

document.getElementById("competicao").textContent=
jogo?.league?.name ||
jogo?.league?.displayName ||
c?.league?.name ||
c?.competition?.name ||
"Futebol";

const s=c?.status?.type;

let estado="Próximo";

if(s?.state==="in"){
estado='<span class="live">🔴 LIVE</span>';

if(c?.status?.displayClock){
estado+=" · "+c.status.displayClock;
}
}
else if(s?.completed||s?.state==="post"){
estado="Resultado";
}

document.getElementById("estado").innerHTML=
"<b>Estado:</b> "+estado;

if(jogo?.date){

document.getElementById("data").innerHTML=
"<b>📅 Data:</b> "+
new Date(jogo.date).toLocaleString("pt-PT");

}else{

document.getElementById("data").innerHTML="";
}

document.getElementById("estadio").innerHTML=
c?.venue?.fullName
?"<b>🏟️ Estádio:</b> "+c.venue.fullName
:"<b>🏟️ Estádio:</b> Informação não disponível";

mostrarEventos(jogo);
mostrarEstatisticas(jogo);

document.getElementById("erro").style.display="none";

document.getElementById("detalhes").style.display="block";

window.scrollTo(0,0);
}

frame.addEventListener("load",function(){

setTimeout(function(){

try{

const doc=frame.contentDocument;

if(!doc)return;

doc.addEventListener("click",function(e){

const card=e.target.closest(".card");

if(!card)return;

/*
Não abrir quando estamos a tocar
numa equipa dentro do cartão.
*/
if(e.target.closest(".team"))return;

let jogos=[];

try{
jogos=frame.contentWindow.eval("jogos")||[];
}catch(err){
console.log("Não foi possível ler jogos:",err);
return;
}

if(!Array.isArray(jogos)||!jogos.length)return;

const jogo=encontrarJogo(card,jogos);

if(jogo){
abrir(jogo);
}

});

}catch(err){

console.log("Erro FUTZONE:",err);

}

},1500);

});

</script></body>
</html>
