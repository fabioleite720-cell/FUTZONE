<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE</title>
<style>
:root{--blue:#0057B8;--blue2:#1683FF;--blue3:#003B7A;--black:#03060B;--bg:#050912;--card:#09111C;--card2:#0D1724;--line:#1B2A3B;--text:#F4F7FB;--muted:#9DAABB;--red:#FF4054;--yellow:#FFD43B;--green:#20D68A;--wine:#6E1830}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:72px}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:40;background:rgba(3,6,11,.98);border-bottom:1px solid var(--line);padding:12px}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:900;letter-spacing:-1.5px}
.logo span{color:var(--blue2)}
.subtitle{font-size:9px;color:var(--muted);letter-spacing:2px;font-weight:800}
main{padding:10px}
.sectionTitle{font-size:16px;font-weight:900;margin:9px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px}
.leagueBar{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px}
.leagueBar::-webkit-scrollbar{display:none}
.leagueBtn{flex:0 0 auto;background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 10px;font-size:11px;font-weight:800}
.leagueBtn.active{background:var(--blue);border-color:var(--blue2)}
.controls{display:grid;grid-template-columns:1fr auto;gap:6px;margin:8px 0}
.controls input,.controls select{width:100%;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px}
.primary{background:var(--blue)!important;border-color:var(--blue2)!important;color:#fff!important}
.secondary{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px 11px}
.liveBtn{width:100%;background:#761c36;border:1px solid #a33355;color:#fff;border-radius:10px;padding:10px;font-weight:900;margin-bottom:7px}
.allDayBtn{width:100%;margin-top:7px;background:linear-gradient(135deg,#075fd0,#7b2142)!important;border:1px solid #9f3b61!important;color:#fff!important;font-weight:800!important}
#allDayMsg{margin-top:5px}
.gameList{display:flex;flex-direction:column;gap:6px}
.gamePick{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1fr) 18px;grid-template-rows:20px 30px;column-gap:7px;row-gap:2px;min-height:72px;padding:7px 6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.gameTime{grid-column:1;grid-row:1 / span 2;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;background:#071a31;border-radius:9px;border:1px solid #284b73}
.gameTeam{display:flex;align-items:center;gap:5px;min-width:0}
.gameTeam img{width:22px;height:22px;object-fit:contain;flex:0 0 22px}
.gameTeam b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1}
.gameTeam strong{font-size:13px;min-width:14px;text-align:right}
.gamePick .gameTeam:nth-of-type(2){grid-column:2;grid-row:1}
.gamePick .gameTeam:nth-of-type(3){grid-column:3;grid-row:1}
.gamePick .gameStatus{grid-column:2 / span 2;grid-row:2;font-size:9px;color:var(--muted);text-align:center}
.gamePick>i{grid-column:4;grid-row:1 / span 2;font-style:normal;color:#75869b;font-size:18px}
.allDayGame{grid-template-columns:54px minmax(0,1fr) minmax(0,1fr) 18px!important;grid-template-rows:17px 28px 20px!important;min-height:78px!important;border-left:3px solid #8f294c!important}
.allDayGame .leagueLine{grid-column:2 / span 2;grid-row:1;font-size:9px;color:#1683ff;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allDayGame .leagueLine span{color:#9daabb;font-weight:600;margin-left:4px}
.allDayGame .gameTime{grid-column:1;grid-row:1 / span 3}
.allDayGame .gameTeam:nth-of-type(2){grid-column:2;grid-row:2}
.allDayGame .gameTeam:nth-of-type(3){grid-column:3;grid-row:2}
.allDayGame>i{grid-column:4;grid-row:1 / span 3}
.allDayGame .gameStatus{grid-column:2 / span 2;grid-row:3}
.allDayGame img{width:21px;height:21px;flex-basis:21px}
.status{font-size:10px;color:var(--muted)}
.err{background:#35131d!important;border-color:#70273b!important;color:#ffdce3!important}
.hint{font-size:10px;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}
.fz-pageTitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:#111d2b;border:1px solid #26384e;border-radius:20px;padding:5px 8px;font-size:9px;color:#9daabb}
.detailHeader{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.backBtn{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px}
.scoreboard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.scoreTeams{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center}
.scoreTeam{text-align:center;font-weight:900;font-size:13px}
.scoreTeam img{width:46px;height:46px;object-fit:contain;display:block;margin:auto auto 5px}
.scoreMain{text-align:center;font-size:25px;font-weight:900}
.scoreStatus{text-align:center;color:var(--muted);font-size:10px;margin-top:4px}
.detailActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.statGrid{display:grid;grid-template-columns:1fr 65px 1fr;gap:4px}
.statRow{display:contents}
.statCell{padding:8px 4px;border-top:1px solid var(--line);font-size:11px}
.statLeft{text-align:right;font-weight:900}
.statName{text-align:center;color:var(--muted)}
.statRight{text-align:left;font-weight:900}
.eventRow{display:grid;grid-template-columns:42px 1fr 42px;gap:5px;padding:8px 0;border-top:1px solid var(--line);font-size:11px}
.eventTime{color:var(--muted);font-weight:800}
.eventCenter{text-align:center}
.eventSide{text-align:center}
.pitch{position:relative;height:300px;border:2px solid rgba(255,255,255,.75);border-radius:8px;background:#157241;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.8)}
.centerCircle{position:absolute;width:70px;height:70px;border:2px solid rgba(255,255,255,.8);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.centerDot{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.boxTop,.boxBottom{position:absolute;left:25%;width:50%;height:17%;border:2px solid rgba(255,255,255,.75)}
.boxTop{top:0;border-top:0}.boxBottom{bottom:0;border-bottom:0}
.playerDot{position:absolute;transform:translate(-50%,-50%);width:31px;height:31px;border-radius:50%;background:#fff;color:#06101a;border:2px solid var(--blue);font-size:9px;font-weight:900;z-index:3}
.playerLabel{position:absolute;transform:translateX(-50%);font-size:7px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;z-index:4}
.xiCols{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.xiBox{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px}
.xiTitle{font-size:10px;font-weight:900;margin-bottom:4px}
.xiPlayer{display:flex;gap:5px;border-top:1px solid var(--line);padding:6px 1px;font-size:9px;cursor:pointer}
.xiNum{width:19px;color:var(--blue2);font-weight:900}
.xiName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamHero{display:flex;align-items:center;gap:10px}
.teamHero img{width:60px;height:60px;object-fit:contain}
.teamHeroName{font-size:19px;font-weight:900}
.squadRow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.squadRow img{width:35px;height:35px;border-radius:50%;object-fit:cover;background:#182332}
.squadNum{width:24px;color:var(--blue2);font-weight:900}
.squadName{font-size:11px;font-weight:900}
.squadPos{font-size:9px;color:var(--muted)}
.profileHero{display:flex;align-items:center;gap:10px}
.profileHero img{width:70px;height:70px;object-fit:cover;border-radius:50%;background:#172331}
.historyRow{display:grid;grid-template-columns:70px 1fr;gap:7px;padding:8px 0;border-top:1px solid var(--line)}
.historySeason{color:var(--blue2);font-size:10px;font-weight:900}
.historyClub{font-size:11px;font-weight:800}
.historyClub img{width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-right:5px}
.tablesBox{overflow:auto;border:1px solid #27364d;border-radius:10px}.tables{width:100%;border-collapse:collapse;font-size:11px}.tables th{background:#171f2b;color:#9daabb;padding:8px 5px;text-align:center}.tables td{padding:8px 5px;border-top:1px solid #202a36;text-align:center}.tables tr{cursor:pointer}.tables tr:hover{background:#151f2d}.clubCell{display:flex;align-items:center;gap:7px;text-align:left;font-weight:800}.clubCell img{width:25px;height:25px;object-fit:contain}.tableSelect{width:100%;margin-bottom:8px}
.newsCard{display:block;width:100%;text-align:left;background:#0d1520!important;border:1px solid #27364d!important;border-radius:10px!important;padding:11px!important;margin:7px 0!important;color:#fff!important}
.newsMeta{font-size:9px;color:#4da3ff;font-weight:800;text-transform:uppercase;margin-bottom:5px}
.newsTitle{font-size:13px;font-weight:800;line-height:1.3}
.newsDate{font-size:10px;color:#8d98aa;margin-top:6px}
.newsSource{color:#d14a6a}
.favRow{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;background:#0d1520;border:1px solid #27364d;border-radius:9px;padding:9px;margin:6px 0}
.favMain{display:flex;align-items:center;gap:8px;text-align:left;background:transparent!important;border:0!important;padding:0!important;width:100%}
.favMain img{width:28px;height:28px;object-fit:contain}
.favTeams{font-size:11px;font-weight:800}
.favScore{font-size:11px;color:#9daabb;margin-top:2px}
.favRemove{background:#171c24!important;border-color:#303846!important;color:#ff8da5!important;padding:7px!important}
</style>
</head>
<body>
<div id="app">
<header>
<div class="brand">
<div>
<div class="logo">FUT<span>ZONE</span></div>
<div class="subtitle">FUTEBOL EM DIRETO</div>
</div>
</div>
</header>
<main>
<div id="games"></div>
<div id="game" class="hidden"></div>
<div id="profile" class="hidden"></div>
<div id="teamProfile" class="hidden"></div>
</main>
<nav id="fzNav" style="position:fixed;left:0;right:0;bottom:0;z-index:50;background:#090b10;border-top:1px solid #29364a;display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px max(8px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom));gap:6px">
<button class="secondary" id="navNoticias">📰 Notícias</button>
<button id="navTabelas">🏆 Tabelas</button>
<button class="secondary" id="navFav">⭐ Favoritos</button>
</nav>
<script>
const LEAGUES = [
 {id:"por.1",name:"🇵🇹 Liga Portugal"},
 {id:"eng.1",name:"🇬🇧 Premier League"},
 {id:"esp.1",name:"🇪🇸 LaLiga"},
 {id:"ita.1",name:"🇮🇹 Serie A"},
 {id:"ger.1",name:"🇩🇪 Bundesliga"},
 {id:"fra.1",name:"🇫🇷 Ligue 1"},
 {id:"ned.1",name:"🇳🇱 Eredivisie"},
 {id:"tur.1",name:"🇹🇷 Liga Turca"},
 {id:"ksa.1",name:"🇸🇦 Liga Saudita"},
 {id:"usa.1",name:"🇺🇸 MLS"},
 {id:"eng.2",name:"🏴 Championship"},
 {id:"esp.2",name:"🇪🇸 LaLiga 2"},
 {id:"fra.2",name:"🇫🇷 Ligue 2"},
 {id:"ita.2",name:"🇮🇹 Serie B"},
 {id:"uefa.champions",name:"🇪🇺 Champions League"},
 {id:"uefa.europa",name:"🇪🇺 Europa League"},
 {id:"uefa.europa.conf",name:"🇪🇺 Liga Conferência"}
];

const API="https://site.api.espn.com/apis/site/v2/sports/soccer";
const CORE="https://sports.core.api.espn.com/v2/sports/soccer";

let selectedLeague="por.1";
let selectedDate=new Date().toISOString().slice(0,10);
let currentGames=[];
let currentGame=null;

const gamesEl=document.getElementById("games");
const gameEl=document.getElementById("game");
const profileEl=document.getElementById("profile");
const teamEl=document.getElementById("teamProfile");

function esc(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function fmtDate(d){
 const x=new Date(d+"T12:00:00");
 return x.toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}

function dateInput(){
 return `
 <div class="card">
   <div class="fz-pageTitle">
     <b>Jogos</b>
     <span class="pill">${esc(fmtDate(selectedDate))}</span>
   </div>
   <div class="controls">
     <input id="datePicker" type="date" value="${selectedDate}">
     <button class="secondary" id="todayBtn">Hoje</button>
   </div>
   <button class="liveBtn" id="liveBtn">🔴 Jogos ao vivo hoje</button>
   <button class="secondary allDayBtn" id="allDayBtn">📅 Todos os jogos deste dia</button>
 </div>`;
}

function leagueButtons(){
 return `
 <div class="leagueBar">
 ${LEAGUES.map(l=>`
 <button class="leagueBtn ${l.id===selectedLeague?"active":""}" data-league="${l.id}">
 ${esc(l.name)}
 </button>`).join("")}
 </div>`;
}

function startPage(){
 gamesEl.classList.remove("hidden");
 gameEl.classList.add("hidden");
 profileEl.classList.add("hidden");
 teamEl.classList.add("hidden");

 gamesEl.innerHTML=
 dateInput()+
 leagueButtons()+
 `<div id="allDayMsg"></div>
  <div class="sectionTitle">${esc(LEAGUES.find(x=>x.id===selectedLeague)?.name||"Competição")}</div>
  <div id="gameList" class="gameList"><div class="empty">A carregar jogos...</div></div>`;

 document.getElementById("datePicker").onchange=e=>{
   selectedDate=e.target.value;
   loadLeagueGames();
 };

 document.getElementById("todayBtn").onclick=()=>{
   selectedDate=new Date().toISOString().slice(0,10);
   startPage();
   loadLeagueGames();
 };

 document.getElementById("liveBtn").onclick=loadLive;
 document.getElementById("allDayBtn").onclick=loadAllDay;

 document.querySelectorAll(".leagueBtn").forEach(b=>{
   b.onclick=()=>{
     selectedLeague=b.dataset.league;
     startPage();
     loadLeagueGames();
   };
 });

 loadLeagueGames();
}

function hideAll(){
 gamesEl.classList.add("hidden");
 gameEl.classList.add("hidden");
 profileEl.classList.add("hidden");
 teamEl.classList.add("hidden");
}

async function getJSON(url){
 const r=await fetch(url);
 if(!r.ok) throw new Error("HTTP "+r.status);
 return await r.json();
}

function logo(team){
 return team?.logo ||
        team?.logos?.[0]?.href ||
        team?.logos?.[0]?.url ||
        "";
}

function teamObj(c){
 return c?.team || c?.competitor || c || {};
}

function scoreValue(c){
 const s=c?.score;
 if(s===undefined||s===null) return "";
 if(typeof s==="object") return s.displayValue ?? s.value ?? "";
 return s;
}

function gameStatus(g){
 const s=g?.status;
 const t=s?.type;
 if(t?.shortDetail) return t.shortDetail;
 if(t?.detail) return t.detail;
 if(t?.description) return t.description;
 return "";
}

function isLive(g){
 const s=g?.status?.type;
 return !!(s?.state==="in" || s?.shortDetail?.includes("'") ||
            s?.description?.toLowerCase().includes("live"));
}

function gameTime(g){
 if(isLive(g)) return "LIVE";
 const d=new Date(g.date);
 if(isNaN(d)) return "--:--";
 return d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
}

function competitionName(g,fallback){
 return g?.league?.name ||
        g?.competition?.[0]?.league?.name ||
        fallback ||
        "";
}

function gameHTML(g,leagueName="",allDay=false){
 const comps=g?.competitions||[];
 const c=comps[0]||{};
 const competitors=c.competitors||g?.competitors||[];

 let home=competitors.find(x=>x.homeAway==="home")||competitors[0]||{};
 let away=competitors.find(x=>x.homeAway==="away")||competitors[1]||{};

 const ht=teamObj(home);
 const at=teamObj(away);

 const hs=scoreValue(home);
 const as=scoreValue(away);

 return `
 <div class="gamePick ${allDay?"allDayGame":""}" data-id="${esc(g.id)}">
   ${allDay?`
   <div class="leagueLine">
      ${esc(leagueName)}
      <span>${isLive(g)?"🔴 AO VIVO":""}</span>
   </div>`:""}
   <div class="gameTime">${esc(gameTime(g))}</div>

   <div class="gameTeam">
     ${logo(ht)?`<img src="${esc(logo(ht))}" onerror="this.style.display='none'">`:""}
     <b>${esc(ht.displayName||ht.name||"Casa")}</b>
     ${hs!==""?`<strong>${esc(hs)}</strong>`:""}
   </div>

   <div class="gameTeam">
     ${logo(at)?`<img src="${esc(logo(at))}" onerror="this.style.display='none'">`:""}
     <b>${esc(at.displayName||at.name||"Fora")}</b>
     ${as!==""?`<strong>${esc(as)}</strong>`:""}
   </div>

   <div class="gameStatus">${esc(gameStatus(g))}</div>
   <i>›</i>
 </div>`;
}

function attachGameClicks(container){
 container.querySelectorAll(".gamePick").forEach(el=>{
   el.onclick=()=>{
     const g=currentGames.find(x=>String(x.id)===String(el.dataset.id));
     if(g) openGame(g);
   };
 });
}

async function loadLeagueGames(){
 const list=document.getElementById("gameList");
 if(!list)return;

 list.innerHTML=`<div class="empty">A carregar jogos de ${esc(fmtDate(selectedDate))}...</div>`;

 try{
   const url=`${API}/${selectedLeague}/scoreboard?dates=${selectedDate}&limit=100`;
   const d=await getJSON(url);
   currentGames=d.events||[];

   if(!currentGames.length){
     list.innerHTML=`
       <div class="empty">
        Não há jogos disponíveis para esta competição nesta data.
       </div>`;
     return;
   }

   list.innerHTML=currentGames.map(g=>
     gameHTML(g,LEAGUES.find(x=>x.id===selectedLeague)?.name,false)
   ).join("");

   attachGameClicks(list);
 }catch(e){
   list.innerHTML=`
    <div class="empty err">
      Não foi possível carregar os jogos.<br>
      ${esc(e.message)}
    </div>`;
 }
}

async function loadLive(){
 hideAll();
 gamesEl.classList.remove("hidden");

 gamesEl.innerHTML=`
 <div class="card">
   <div class="fz-pageTitle">
    <b>🔴 Jogos ao vivo hoje</b>
    <button class="backBtn" id="backGames">‹ Voltar</button>
   </div>
   <div id="liveList" class="gameList" style="margin-top:8px">
    <div class="empty">A procurar jogos ao vivo...</div>
   </div>
 </div>`;

 document.getElementById("backGames").onclick=()=>{
   startPage();
 };

 const results=[];

 await Promise.all(LEAGUES.map(async league=>{
   try{
     const d=await getJSON(
       `${API}/${league.id}/scoreboard?dates=${new Date().toISOString().slice(0,10)}&limit=100`
     );

     (d.events||[]).forEach(g=>{
       if(isLive(g)) results.push({g,league});
     });
   }catch(e){}
 }));

 results.sort((a,b)=>new Date(a.g.date)-new Date(b.g.date));

 const list=document.getElementById("liveList");

 if(!results.length){
   list.innerHTML=`<div class="empty">Não existem jogos ao vivo neste momento.</div>`;
   return;
 }

 currentGames=results.map(x=>x.g);

 list.innerHTML=results.map(x=>
   gameHTML(x.g,x.league.name,true)
 ).join("");

 attachGameClicks(list);
}

async function loadAllDay(){
 hideAll();
 gamesEl.classList.remove("hidden");

 gamesEl.innerHTML=`
 <div class="card">
   <div class="fz-pageTitle">
    <b>📅 Todos os jogos deste dia</b>
    <button class="backBtn" id="backAll">‹ Voltar</button>
   </div>

   <div class="hint" style="margin:7px 0">
    ${esc(fmtDate(selectedDate))}
   </div>

   <div id="allDayList" class="gameList">
    <div class="empty">A procurar jogos em todas as competições...</div>
   </div>
 </div>`;

 document.getElementById("backAll").onclick=startPage;

 const results=[];

 await Promise.all(LEAGUES.map(async league=>{
   try{
     const d=await getJSON(
       `${API}/${league.id}/scoreboard?dates=${selectedDate}&limit=100`
     );

     (d.events||[]).forEach(g=>{
       results.push({g,league});
     });
   }catch(e){}
 }));

 results.sort((a,b)=>new Date(a.g.date)-new Date(b.g.date));

 const list=document.getElementById("allDayList");

 if(!results.length){
   list.innerHTML=`<div class="empty">Não foram encontrados jogos neste dia.</div>`;
   return;
 }

 currentGames=results.map(x=>x.g);

 list.innerHTML=results.map(x=>
   gameHTML(x.g,x.league.name,true)
 ).join("");

 attachGameClicks(list);
}

startPage();
  </script>
  <script>
async function openGame(g){
 currentGame=g;

 hideAll();
 gameEl.classList.remove("hidden");

function statValue(v){
 if(v===undefined||v===null)return "-";
 if(typeof v==="object"){
   return v.displayValue ?? v.value ?? v.text ?? "-";
 }
 return v;
}

function extractStatsFromSummary(d){
 const rows=[];

 function scan(node){
   if(!node||typeof node!=="object")return;

   if(Array.isArray(node)){
     node.forEach(scan);
     return;
   }

   const label=
     node.label||
     node.name||
     node.displayName||
     node.shortDisplayName||
     "";

   const vals=node.values||node.value;

   if(label && (
      node.homeValue!==undefined ||
      node.awayValue!==undefined ||
      node.home!==undefined ||
      node.away!==undefined ||
      Array.isArray(vals)
   )){
     let left=node.homeValue ?? node.home;
     let right=node.awayValue ?? node.away;

     if(Array.isArray(vals)){
       left=vals[0];
       right=vals[1];
     }

     rows.push({
       name:label,
       home:statValue(left),
       away:statValue(right)
     });
   }

   Object.keys(node).forEach(k=>{
     const v=node[k];
     if(v && typeof v==="object"){
       if(k!=="athletes")scan(v);
     }
   });
 }

 scan(d);

 const seen=new Set();
 return rows.filter(x=>{
   const k=x.name+"|"+x.home+"|"+x.away;
   if(seen.has(k))return false;
   seen.add(k);
   return true;
 });
}

async function loadStats(g){
 const box=document.getElementById("matchStats");
 if(!box)return;

 try{
   const leagueId=g?.league?.id||selectedLeague;

   const d=await getJSON(
     `${API}/${leagueId}/summary?event=${encodeURIComponent(g.id)}`
   );

   let rows=extractStatsFromSummary(d);

   if(!rows.length){
     const comps=getCompetitors(g);
     const h=comps.find(x=>x.homeAway==="home");
     const a=comps.find(x=>x.homeAway==="away");

     const hs=h?.statistics||[];
     const as=a?.statistics||[];

     const map={};

     hs.forEach(x=>{
       const n=x.name||x.displayName||"";
       map[n]=map[n]||{};
       map[n].home=statValue(x.displayValue??x.value);
     });

     as.forEach(x=>{
       const n=x.name||x.displayName||"";
       map[n]=map[n]||{};
       map[n].away=statValue(x.displayValue??x.value);
     });

     rows=Object.entries(map).map(([name,v])=>({
       name,
       home:v.home??"-",
       away:v.away??"-"
     }));
   }

   if(!rows.length){
     box.innerHTML=`<div class="empty">Estatísticas não disponíveis para este jogo.</div>`;
     return;
   }

   box.innerHTML=`
   <div class="statGrid">
    ${rows.slice(0,20).map(r=>`
      <div class="statRow">
        <div class="statCell statLeft">${esc(r.home)}</div>
        <div class="statCell statName">${esc(r.name)}</div>
        <div class="statCell statRight">${esc(r.away)}</div>
      </div>
    `).join("")}
   </div>`;

 }catch(e){
   box.innerHTML=`<div class="empty">Estatísticas não disponíveis.</div>`;
 }
}

async function loadStartingXI(g){
 const box=document.getElementById("startingXI");
 if(!box)return;

 try{
   const leagueId=g?.league?.id||selectedLeague;

   const d=await getJSON(
     `${API}/${leagueId}/summary?event=${encodeURIComponent(g.id)}`
   );

   const comps=getCompetitors(g);

   let all=[];

   function findXI(node){
     if(!node||typeof node!=="object")return;

     if(Array.isArray(node)){
       node.forEach(findXI);
       return;
     }

     if(Array.isArray(node.starters)){
       node.starters.forEach(a=>{
         all.push(a);
       });
     }

     if(Array.isArray(node.startingLineup)){
       node.startingLineup.forEach(a=>{
         all.push(a);
       });
     }

     Object.keys(node).forEach(k=>{
       if(["athletes","statistics"].includes(k))return;
       if(node[k]&&typeof node[k]==="object")findXI(node[k]);
     });
   }

   findXI(d);

   const seen=new Set();
   all=all.filter(a=>{
     const id=athleteIdFromObject(a);
     const key=id||athleteName(a);
     if(seen.has(key))return false;
     seen.add(key);
     return true;
   });

   const homePlayers=[];
   const awayPlayers=[];

   all.forEach(a=>{
     const side=
       a?.team?.homeAway||
       a?.homeAway||
       a?.competitor?.homeAway||
       "";

     if(side==="home")homePlayers.push(a);
     else if(side==="away")awayPlayers.push(a);
   });

   if(homePlayers.length<11||awayPlayers.length<11){
     comps.forEach(c=>{
       const t=teamObj(c);
       const athletes=t?.athletes||c?.athletes||[];
       const side=c.homeAway==="home"?"home":"away";

       athletes.forEach(a=>{
         if(a?.starter){
           (side==="home"?homePlayers:awayPlayers).push(a);
         }
       });
     });
   }

   function unique(arr){
     const s=new Set();
     return arr.filter(a=>{
       const k=athleteIdFromObject(a)||athleteName(a);
       if(s.has(k))return false;
       s.add(k);
       return true;
     }).slice(0,11);
   }

   const hp=unique(homePlayers);
   const ap=unique(awayPlayers);

   if(hp.length||ap.length){
     renderXI(hp,ap);
   }else{
     box.innerHTML=`<div class="empty">Onze inicial não disponível para este jogo.</div>`;
   }

 }catch(e){
   box.innerHTML=`<div class="empty">Onze inicial não disponível.</div>`;
 }
}

async function loadSquad(team){
 const box=document.getElementById("squadBox");
 if(!box)return;

 try{
   let data=null;

   const urls=[
     `${CORE}/leagues/${encodeURIComponent(selectedLeague)}/teams/${encodeURIComponent(team.id)}/roster`,
     `${API}/${encodeURIComponent(selectedLeague)}/teams/${encodeURIComponent(team.id)}/roster`
   ];

   for(const url of urls){
     try{
       data=await getJSON(url);
       if(data)break;
     }catch(e){}
   }

   let players=[];

   function scanRoster(node){
     if(!node||typeof node!=="object")return;

     if(Array.isArray(node)){
       node.forEach(scanRoster);
       return;
     }

     if(Array.isArray(node.athletes)){
       node.athletes.forEach(a=>players.push(a));
     }

     if(Array.isArray(node.entries)){
       node.entries.forEach(a=>players.push(a));
     }

     Object.keys(node).forEach(k=>{
       if(["statistics","stats"].includes(k))return;
       if(node[k]&&typeof node[k]==="object")scanRoster(node[k]);
     });
   }

   scanRoster(data);

   const seen=new Set();
   players=players.filter(p=>{
     const id=athleteIdFromObject(p);
     const key=id||athleteName(p);
     if(seen.has(key))return false;
     seen.add(key);
     return true;
   });

   if(!players.length){
     box.innerHTML=`
      <div class="empty">
       O plantel desta equipa não está disponível na fonte de dados.
      </div>`;
     return;
   }

   box.innerHTML=players.map((p,i)=>{
     const id=athleteIdFromObject(p);
     const pos=p.position?.displayName||
              p.position?.name||
              p.position||
              "";
     return `
      <div class="squadRow" data-player="${esc(id)}">
        ${athletePhoto(p)?`<img src="${esc(athletePhoto(p))}" onerror="this.style.display='none'">`:""}
        <div class="squadNum">${esc(p.jersey||p.number||i+1)}</div>

          <div class="squadName">${esc(athleteName(p))}</div>

   }).join("");

   box.querySelectorAll(".squadRow").forEach(row=>{
     row.onclick=()=>{
       openPlayer(
         row.dataset.player,
         row.querySelector(".squadName")?.textContent||"Jogador"
       );
     };
   });

 }catch(e){
   box.innerHTML=`<div class="empty">Não foi possível carregar o plantel.</div>`;
 }
}

async function loadPlayerHistory(id,name){
 const box=document.getElementById("playerHistory");
 if(!box)return;

 const urls=[
  `${CORE}/athletes/${encodeURIComponent(id)}`,
  `${CORE}/athletes/${encodeURIComponent(id)}/seasons`,
  `${CORE}/athletes/${encodeURIComponent(id)}/statistics`,
  `https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/${encodeURIComponent(id)}`,
  `https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/${encodeURIComponent(id)}/overview`
 ];

 const data=[];

 for(const url of urls){
   try{
     const d=await getJSON(url);
     if(d)data.push(d);
   }catch(e){}
 }

 const history=[];

 function addHistory(season,club,clubLogo){
   if(!club)return;

   const key=
    String(season||"")+
    "|" +
    String(club);

   if(history.some(x=>
      String(x.season||"")+"|"+String(x.club)===key
   ))return;

   history.push({
     season:season||"",
     club,
     logo:clubLogo||""
   });
 }

 function scan(node,currentSeason=""){
   if(!node||typeof node!=="object")return;

   if(Array.isArray(node)){
     node.forEach(x=>scan(x,currentSeason));
     return;
   }

   let season=currentSeason;

   if(node.season){
     if(typeof node.season==="string")season=node.season;
     else season=node.season.displayName||node.season.name||node.season.year||season;
   }

   if(node.seasonName)season=node.seasonName;
   if(node.year)season=String(node.year);

   const team=node.team||node.club||node.squad;

   if(team){
     const tn=team.displayName||
              team.name||
              team.fullName||
              "";

     const tl=logo(team);

     if(tn)addHistory(season,tn,tl);
   }

   if(node.teamName){
     addHistory(season,node.teamName,node.teamLogo||"");
   }

   if(node.clubName){
     addHistory(season,node.clubName,node.clubLogo||"");
   }

   if(node.teams&&Array.isArray(node.teams)){
     node.teams.forEach(t=>{
       addHistory(
         season,
         t.displayName||t.name||t.teamName||t.clubName,
         logo(t)
       );
     });
   }

   if(node.career&&Array.isArray(node.career)){
     node.career.forEach(x=>scan(x,season));
   }

   Object.keys(node).forEach(k=>{
     if(["statistics","stats","splits"].includes(k))return;
     const v=node[k];
     if(v&&typeof v==="object")scan(v,season);
   });
 }

 data.forEach(d=>scan(d));

 if(!history.length){
   box.innerHTML=`
    <div class="empty">
      O histórico de clubes deste jogador não é disponibilizado
      pela fonte de dados para este perfil.
    </div>`;
   return;
 }

 box.innerHTML=history.map(h=>`
   <div class="historyRow">
     <div class="historySeason">${esc(h.season||"Carreira")}</div>
     <div class="historyClub">
       ${h.logo?`<img src="${esc(h.logo)}" onerror="this.style.display='none'">`:""}
       ${esc(h.club)}
     </div>
   </div>
 `).join("");
}

   loadTableData(sel.value);
 };

 loadTableData(selectedLeague);
}

async function loadTableData(league){
 const box=document.getElementById("tableContent");
 if(!box)return;

 box.innerHTML=`<div class="empty">A carregar classificação...</div>`;

 try{
   const d=await getJSON(
     `${API}/${league}/standings`
   );

   let entries=[];

   if(Array.isArray(d?.children)){
     d.children.forEach(c=>{
       if(Array.isArray(c?.standings?.entries)){
         entries.push(...c.standings.entries);
       }
     });
   }

   if(!entries.length&&Array.isArray(d?.standings?.entries)){
     entries=d.standings.entries;
   }

   if(!entries.length){
     box.innerHTML=`<div class="empty">Classificação não disponível.</div>`;
     return;
   }

   box.innerHTML=`
   <div class="tablesBox">
    <table class="tables">
     <thead>
      <tr>
       <th>#</th>
       <th>Clube</th>
       <th>J</th>
       <th>V</th>
       <th>E</th>
       <th>D</th>
       <th>Pts</th>
      </tr>
     </thead>
     <tbody>
     ${entries.map((entry,i)=>{
       const team=entry.team||entry.competitor||{};
       const games=findStandStat(entry,
         ["gamesplayed","gp","games"]);
       const wins=findStandStat(entry,
         ["wins","w"]);
       const draws=findStandStat(entry,
         ["ties","draws","d"]);
       const losses=findStandStat(entry,
         ["losses","l"]);
       const points=findStandStat(entry,
         ["points","pts"]);

       return `
        <tr onclick='openTeam(${JSON.stringify({
          id:team.id||"",
          name:team.displayName||team.name||"Equipa",
          logo:logo(team)
        }).replace(/'/g,"&#39;")})'>
         <td>${i+1}</td>
         <td>
          <div class="clubCell">
           ${logo(team)?`<img src="${esc(logo(team))}" onerror="this.style.display='none'">`:""}
           ${esc(team.displayName||team.name||"Equipa")}
          </div>
         </td>
         <td>${esc(games)}</td>
         <td>${esc(wins)}</td>
         <td>${esc(draws)}</td>
         <td>${esc(losses)}</td>
         <td><b>${esc(points)}</b></td>
        </tr>`;
     }).join("")}
     </tbody>
    </table>
   </div>`;

 }catch(e){
   box.innerHTML=`
    <div class="empty err">
      Não foi possível carregar a classificação.
    </div>`;
 }
}


/* =========================
   FAVORITOS
========================= */

const FZ_FAV_KEY="futzone_favorite_games_v2";

function getFavs(){
 try{
   return JSON.parse(localStorage.getItem(FZ_FAV_KEY)||"[]");
 }catch(e){
   return [];
 }
}

function saveFavs(arr){
 localStorage.setItem(FZ_FAV_KEY,JSON.stringify(arr));
}

function favoriteData(g){
 const {home,away}=getHomeAway(g);
 const ht=teamObj(home);
 const at=teamObj(away);

 return {
   id:String(g.id),
   date:g.date||"",
   status:gameStatus(g),
   home:{
     id:ht.id||"",
     name:ht.displayName||ht.name||"Casa",
     logo:logo(ht),
     score:scoreValue(home)
   },
   away:{
     id:at.id||"",
     name:at.displayName||at.name||"Fora",
     logo:logo(at),
     score:scoreValue(away)
   }
 };
}

function isFavoriteGame(g){
 return getFavs().some(x=>String(x.id)===String(g.id));
}

function toggleFavoriteCurrentGame(){
 if(!currentGame)return;

 const favs=getFavs();
 const id=String(currentGame.id);
 const index=favs.findIndex(x=>String(x.id)===id);

 if(index>=0){
   favs.splice(index,1);
 }else{
   favs.push(favoriteData(currentGame));
 }

 saveFavs(favs);
 updateFavButton();
}

function updateFavButton(){
 const btn=document.getElementById("favGameBtn");
 if(!btn||!currentGame)return;

 btn.textContent=
  isFavoriteGame(currentGame)
  ? "⭐ Remover dos favoritos"
  : "⭐ Adicionar aos favoritos";
}

function showFavorites(){
 hideAll();
 gamesEl.classList.remove("hidden");

 const favs=getFavs();

 gamesEl.innerHTML=`
 <div class="card">
  <div class="fz-pageTitle">
   <b>⭐ Favoritos</b>
   <button class="backBtn" id="backFav">‹ Voltar</button>
  </div>

  <div id="favList" style="margin-top:8px"></div>
 </div>`;

 document.getElementById("backFav").onclick=startPage;

 const box=document.getElementById("favList");

 if(!favs.length){
   box.innerHTML=`
    <div class="empty">
      Ainda não tens jogos favoritos.
    </div>`;
   return;
 }

 box.innerHTML=favs.map((f,i)=>`
  <div class="favRow">
   <button class="favMain" data-index="${i}">
    ${f.home.logo?`<img src="${esc(f.home.logo)}">`:""}
    <div>
     <div class="favTeams">
      ${esc(f.home.name)} — ${esc(f.away.name)}
     </div>
     <div class="favScore">
      ${f.home.score??"-"} : ${f.away.score??"-"}
      · ${esc(f.status||"")}
     </div>
    </div>
   </button>

   <button class="secondary favRemove" data-remove="${i}">
    ✕
   </button>
  </div>
 `).join("");

 box.querySelectorAll(".favMain").forEach(btn=>{
   btn.onclick=async()=>{
     const f=favs[Number(btn.dataset.index)];

     if(!f)return;

     const league=selectedLeague;

     try{
       const d=await getJSON(
        `${API}/${league}/summary?event=${encodeURIComponent(f.id)}`
       );

       const g=Object.assign({
         id:f.id,
         date:f.date,
         competitions:[{
           competitors:[
             {
               homeAway:"home",
               team:{
                 id:f.home.id,
                 displayName:f.home.name,
                 logo:f.home.logo
               },
               score:f.home.score
             },
             {
               homeAway:"away",
               team:{
                 id:f.away.id,
                 displayName:f.away.name,
                 logo:f.away.logo
               },
               score:f.away.score
             }
           ]
         }],
         status:{type:{shortDetail:f.status}}
       },d);

       openGame(g);
     }catch(e){
       alert("Não foi possível abrir este jogo.");
     }
   };
 });

 box.querySelectorAll(".favRemove").forEach(btn=>{
   btn.onclick=()=>{
     const i=Number(btn.dataset.remove);
     favs.splice(i,1);
     saveFavs(favs);
     showFavorites();
   };
 });
}

const FZ_NEWS_FEEDS=[
 "https://news.google.com/rss/search?q=site%3Aabola.pt+futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150",
 "https://news.google.com/rss/search?q=site%3Arecord.pt+futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150",
 "https://news.google.com/rss/search?q=site%3Aojogo.pt+futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150",
 "https://news.google.com/rss/search?q=site%3Artp.pt+desporto+futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150"
];

async function fetchNewsFeed(url){
 const api=
  "https://api.rss2json.com/v1/api.json?rss_url="+
  encodeURIComponent(url);

 const d=await getJSON(api);
 return d?.items||[];
}

function newsSource(link,title){
 const s=(link+" "+title).toLowerCase();

 if(s.includes("abola.pt"))return"A BOLA";
 if(s.includes("record.pt"))return"RECORD";
 if(s.includes("ojogo.pt"))return"O JOGO";
 if(s.includes("rtp.pt"))return"RTP Desporto";

 return"Desporto";
}

async function loadNews(){
 hideAll();
 gamesEl.classList.remove("hidden");

 gamesEl.innerHTML=`
 <div class="card">
  <div class="fz-pageTitle">
   <b>📰 Notícias</b>
   <button class="backBtn" id="backNews">‹ Voltar</button>
  </div>

  <div id="newsList">
   <div class="empty">A carregar notícias...</div>
  </div>
 </div>`;

 document.getElementById("backNews").onclick=startPage;

 const all=[];

 await Promise.all(
  FZ_NEWS_FEEDS.map(async feed=>{
   try{
    const items=await fetchNewsFeed(feed);
    items.forEach(item=>{
      all.push({
       title:item.title||"",
       link:item.link||"",
       date:item.pubDate||"",
       source:newsSource(item.link||"",item.title||"")
      });
    });
   }catch(e){}
  })
 );

 const seen=new Set();

 const news=all
  .filter(x=>{
    const key=x.title.trim().toLowerCase();
    if(!key||seen.has(key))return false;
    seen.add(key);
    return true;
  })
  .sort((a,b)=>
    new Date(b.date||0)-new Date(a.date||0)
  )
  .slice(0,30);

 const box=document.getElementById("newsList");

 if(!news.length){
   box.innerHTML=`
    <div class="empty">
      Não foi possível carregar notícias neste momento.
    </div>`;
   return;
 }

 box.innerHTML=news.map(n=>`
  <button class="newsCard"
    data-link="${esc(n.link)}">
    <div class="newsMeta">
      <span class="newsSource">${esc(n.source)}</span>
    </div>
    <div class="newsTitle">${esc(n.title)}</div>
    <div class="newsDate">${esc(n.date)}</div>
  </button>
 `).join("");

 box.querySelectorAll(".newsCard").forEach(card=>{
   card.onclick=()=>{
     const url=card.dataset.link;
     if(url)window.open(url,"_blank");
   };
 });
}


/* =========================

========================= */

document.getElementById("navNoticias").onclick=loadNews;
document.getElementById("navTabelas").onclick=loadTables;
document.getElementById("navFav").onclick=showFavorites;


/* =========================
   ARRANQUE
========================= */

startPage();
</script>
