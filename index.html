<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --black:#03060B;
  --bg:#050912;
  --card:#09111C;
  --card2:#0D1724;
  --line:#1B2A3B;
  --text:#F4F7FB;
  --muted:#9DAABB;
  --red:#FF4054;
  --yellow:#FFD43B;
  --green:#20D68A;
  --wine:#6E1830;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}
body{
  padding-bottom:82px;
}
button{
  font:inherit;
}
#app{
  width:100%;
  max-width:760px;
  margin:auto;
}
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--line);
  padding:12px 14px 10px;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1.5px;
}
.logo span{
  color:var(--blue2);
}
.subtitle{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  margin-top:1px;
}
.topActions{
  margin-left:auto;
  display:flex;
  gap:6px;
}
.iconBtn{
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  width:38px;
  height:38px;
  border-radius:11px;
  cursor:pointer;
}
.iconBtn:active,
.navBtn:active,
.chip:active,
.game:active{
  transform:scale(.98);
}
main{
  padding:10px;
}
.sectionTitle{
  font-size:16px;
  font-weight:900;
  margin:12px 3px 8px;
}
.sectionSub{
  color:var(--muted);
  font-size:12px;
  margin:0 3px 10px;
}
.leagues{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 1px 7px;
  scrollbar-width:none;
}
.leagues::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card);
  color:#dce5ef;
  border-radius:20px;
  padding:8px 11px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.chip.active{
  background:var(--blue);
  border-color:var(--blue2);
  color:white;
}
.dateBar{
  display:flex;
  gap:7px;
  align-items:center;
  margin:8px 0;
}
.dateBar input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  border-radius:10px;
  padding:11px;
}
.actionBtn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:10px;
  padding:11px 13px;
  font-weight:900;
  cursor:pointer;
}
.actionBtn.live{
  background:#9b1730;
}
.allDayBtn{
  width:100%;
  margin:7px 0 12px;
  border:1px solid var(--blue2);
  background:linear-gradient(135deg,var(--blue3),var(--blue));
  color:white;
  border-radius:12px;
  padding:13px;
  font-weight:900;
  cursor:pointer;
}
.liveBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:8px;
}
.liveBar::-webkit-scrollbar{display:none}
.gameList{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.game{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  cursor:pointer;
}
.gameHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}
.comp{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.status{
  font-size:10px;
  font-weight:900;
  padding:4px 7px;
  border-radius:7px;
  background:#162131;
  color:#dce5ef;
}
.status.live{
  background:#70182b;
  color:#fff;
}
.teams{
  display:grid;
  grid-template-columns:1fr 58px 1fr;
  align-items:center;
  gap:6px;
}
.team{
  min-width:0;
  display:flex;
  align-items:center;
  gap:7px;
}
.team.away{
  justify-content:flex-end;
  text-align:right;
}
.teamLogo{
  width:30px;
  height:30px;
  object-fit:contain;
  flex:0 0 30px;
}
.teamName{
  font-size:13px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
}
.score{
  text-align:center;
  font-size:17px;
  font-weight:900;
}
.time{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}
.star{
  border:0;
  background:transparent;
  color:#69788a;
  font-size:20px;
  cursor:pointer;
}
.star.on{color:var(--yellow)}
.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  background:var(--card);
  border:1px dashed var(--line);
  border-radius:12px;
}
.loader{
  text-align:center;
  padding:25px;
  color:var(--muted);
}
.error{
  padding:15px;
  border-radius:12px;
  background:#32111a;
  border:1px solid #642131;
  color:#ffdce1;
  font-size:13px;
}
.groupTitle{
  display:flex;
  align-items:center;
  gap:8px;
  background:#0a1421;
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 10px;
  margin:10px 0 5px;
}
.groupFlag{
  font-size:19px;
}
.groupName{
  font-size:13px;
  font-weight:900;
}
.detail{
  display:none;
}
.detail.show{
  display:block;
}
.backBtn{
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
  cursor:pointer;
  margin-bottom:9px;
}
.detailCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin-bottom:9px;
}
.detailComp{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.detailTeams{
  display:grid;
  grid-template-columns:1fr 72px 1fr;
  align-items:center;
  gap:8px;
  margin:14px 0;
}
.detailTeam{
  text-align:center;
}
.detailTeam img{
  width:52px;
  height:52px;
  object-fit:contain;
}
.detailTeamName{
  font-size:14px;
  font-weight:900;
  margin-top:5px;
}
.detailScore{
  text-align:center;
  font-size:25px;
  font-weight:900;
}
.detailTime{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}
.favDetailBtn{
  width:100%;
  border:1px solid var(--blue2);
  background:var(--blue3);
  color:white;
  border-radius:10px;
  padding:11px;
  font-weight:900;
  cursor:pointer;
}
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:8px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--muted);
  padding:8px 11px;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.tab.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue2);
}
.statRow{
  display:grid;
  grid-template-columns:1fr 50px 1fr;
  gap:8px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.statRow:last-child{border-bottom:0}
.statVal{
  font-weight:900;
  text-align:center;
}
.statName{
  text-align:center;
  color:var(--muted);
  font-size:11px;
}
.statLeft{text-align:right;font-weight:800}
.statRight{text-align:left;font-weight:800}
.event{
  display:grid;
  grid-template-columns:45px 1fr 45px;
  gap:6px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.event:last-child{border-bottom:0}
.eventTime{
  color:var(--muted);
  font-weight:800;
}
.eventCenter{text-align:center}
.eventHome{text-align:right}
.eventAway{text-align:left}
.eventIcon{font-size:16px}
.pitch{
  position:relative;
  height:310px;
  border:2px solid #d9e9df;
  border-radius:8px;
  background:#13733f;
  overflow:hidden;
}
.pitch:before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  border-top:2px solid rgba(255,255,255,.8);
}
.centerCircle{
  position:absolute;
  width:72px;
  height:72px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.centerDot{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.boxTop,.boxBottom{
  position:absolute;
  left:25%;
  width:50%;
  height:17%;
  border:2px solid rgba(255,255,255,.75);
}
.boxTop{top:0;border-top:0}
.boxBottom{bottom:0;border-bottom:0}
.playerDot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:34px;
  height:34px;
  border-radius:50%;
  background:white;
  color:#06101a;
  border:2px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  z-index:3;
}
.playerLabel{
  position:absolute;
  transform:translateX(-50%);
  color:white;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 1px 3px #000;
  z-index:4;
}
.xiLists{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}
.xiList{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
}
.xiTitle{
  font-size:11px;
  font-weight:900;
  margin-bottom:6px;
}
.xiPlayer{
  display:flex;
  gap:5px;
  align-items:center;
  padding:6px 2px;
  border-bottom:1px solid var(--line);
  font-size:10px;
  cursor:pointer;
}
.xiPlayer:last-child{border-bottom:0}
.xiNum{
  color:var(--blue2);
  width:20px;
  font-weight:900;
}
.xiName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.teamPage,.playerPage{
  display:none;
}
.teamPage.show,.playerPage.show{
  display:block;
}
.teamHero{
  display:flex;
  align-items:center;
  gap:12px;
}
.teamHero img{
  width:64px;
  height:64px;
  object-fit:contain;
}
.teamHeroName{
  font-size:20px;
  font-weight:900;
}
.squad{
  margin-top:10px;
}
.squadPlayer{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.playerNum{
  width:27px;
  color:var(--blue2);
  font-weight:900;
}
.playerPhoto{
  width:34px;
  height:34px;
  object-fit:cover;
  border-radius:50%;
  background:#172331;
}
.playerInfo{
  min-width:0;
}
.playerName{
  font-size:12px;
  font-weight:900;
}
.playerPos{
  color:var(--muted);
  font-size:10px;
}
.historyRow{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.historySeason{
  color:var(--blue2);
  font-size:11px;
  font-weight:900;
}
.historyClub{
  font-size:12px;
  font-weight:800;
}
.tableWrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:430px;
}
th,td{
  padding:8px 5px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  text-align:center;
}
th{
  color:var(--muted);
  font-size:10px;
}
td.clubCell{
  text-align:left;
  font-weight:900;
}
.clubLogo{
  width:22px;
  height:22px;
  object-fit:contain;
  vertical-align:middle;
  margin-right:5px;
}
.newsList{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.newsItem{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  cursor:pointer;
}
.newsSource{
  color:var(--blue2);
  font-size:10px;
  font-weight:900;
  margin-bottom:5px;
}
.newsTitle{
  font-size:13px;
  font-weight:900;
  line-height:1.3;
}
.newsDate{
  color:var(--muted);
  font-size:10px;
  margin-top:6px;
}
.favList{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.favItem{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  cursor:pointer;
}
.favRemove{
  border:0;
  background:transparent;
  color:var(--red);
  font-size:18px;
  cursor:pointer;
}
#detailView,
#teamView,
#playerView,
#tablesView,
#newsView,
#favView{
  display:none;
}
#detailView.show,
#teamView.show,
#playerView.show,
#tablesView.show,
#newsView.show,
#favView.show{
  display:block;
}
.bottomNav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  background:rgba(3,6,11,.98);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
}
.navBtn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 3px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.navBtn.active{
  background:var(--blue3);
  color:white;
}
.navIcon{
  display:block;
  font-size:20px;
  line-height:20px;
  margin-bottom:2px;
}
@media(max-width:420px){
  .teamName{font-size:12px}
  .detailTeamName{font-size:12px}
  .pitch{height:285px}
}
</style>
</head>

<body>
<div id="app">

<header>
  <div class="brand">
    <div>
      <div class="logo">FUT<span>ZONE</span></div>
      <div class="subtitle">FUTEBOL EM DIRETO</div>
    </div>
    <div class="topActions">
      <button class="iconBtn" id="refreshBtn" type="button">↻</button>
    </div>
  </div>
</header>

<main>

<section id="homeView">

  <div class="sectionTitle">Competições</div>

  <div class="leagues" id="leagueList"></div>

  <div class="dateBar">
    <input id="datePicker" type="date">
    <button class="actionBtn" id="loadDateBtn" type="button">Pesquisar</button>
  </div>

  <button class="allDayBtn" id="allDayBtn" type="button">
    📅 Todos os jogos deste dia
  </button>

  <button class="allDayBtn" id="liveAllBtn" type="button">
    🔴 Jogos ao vivo hoje
  </button>

  <div id="homeContent">
    <div class="loader">A carregar jogos...</div>
  </div>

</section>

<section id="detailView"></section>
<section id="teamView"></section>
<section id="playerView"></section>
<section id="tablesView"></section>
<section id="newsView"></section>
<section id="favView"></section>

</main>

<nav class="bottomNav" id="fzNav">
  <button class="navBtn active" id="navNoticias" type="button">
    <span class="navIcon">📰</span>
    Notícias
  </button>

  <button class="navBtn" id="navTabelas" type="button">
    <span class="navIcon">🏆</span>
    Tabelas
  </button>

  <button class="navBtn" id="navFav" type="button">
    <span class="navIcon">⭐</span>
    Favoritos
  </button>
</nav>

</div>
<script>
const API="https://site.api.espn.com/apis/site/v2/sports/soccer";

const LEAGUES=[
 {id:"por.1",name:"🇵🇹 Liga Portugal",flag:"🇵🇹"},
 {id:"eng.1",name:"🇬🇧 Premier League",flag:"🇬🇧"},
 {id:"esp.1",name:"🇪🇸 LaLiga",flag:"🇪🇸"},
 {id:"ita.1",name:"🇮🇹 Serie A",flag:"🇮🇹"},
 {id:"ger.1",name:"🇩🇪 Bundesliga",flag:"🇩🇪"},
 {id:"fra.1",name:"🇫🇷 Ligue 1",flag:"🇫🇷"},
 {id:"ned.1",name:"🇳🇱 Eredivisie",flag:"🇳🇱"},
 {id:"tur.1",name:"🇹🇷 Liga Turca",flag:"🇹🇷"},
 {id:"ksa.1",name:"🇸🇦 Liga Saudita",flag:"🇸🇦"},
 {id:"usa.1",name:"🇺🇸 MLS",flag:"🇺🇸"},
 {id:"eng.2",name:"🏴 Championship",flag:"🏴"},
 {id:"esp.2",name:"🇪🇸 LaLiga 2",flag:"🇪🇸"},
 {id:"fra.2",name:"🇫🇷 Ligue 2",flag:"🇫🇷"},
 {id:"ita.2",name:"🇮🇹 Serie B",flag:"🇮🇹"},
 {id:"uefa.champions",name:"🇪🇺 Champions League",flag:"🇪🇺"},
 {id:"uefa.europa",name:"🇪🇺 Europa League",flag:"🇪🇺"},
 {id:"uefa.europa.conf",name:"🇪🇺 Liga Conferência",flag:"🇪🇺"}
];

let selectedLeague=LEAGUES[0];
let currentDate="";
let currentGames=[];
let currentView="news";
let currentGame=null;
let currentTeam=null;
let currentPlayer=null;

const FZ_FAV_KEY="futzone_favorite_games_v2";

function $(id){
  return document.getElementById(id);
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getFavs(){
  try{
    return JSON.parse(localStorage.getItem(FZ_FAV_KEY)||"[]");
  }catch(e){
    return [];
  }
}

function saveFavs(list){
  localStorage.setItem(FZ_FAV_KEY,JSON.stringify(list));
}

function gameKey(g){
  return String(
    g?.id ||
    g?.uid ||
    `${g?.leagueId||""}_${g?.home?.id||""}_${g?.away?.id||""}_${g?.date||""}`
  );
}

function isFavoriteGame(g){
  return getFavs().some(x=>gameKey(x)===gameKey(g));
}

function toggleFavoriteGame(g){
  const list=getFavs();
  const key=gameKey(g);
  const index=list.findIndex(x=>gameKey(x)===key);

  if(index>=0){
    list.splice(index,1);
  }else{
    list.push(g);
  }

  saveFavs(list);
}

function updateFavButton(){
  const btn=$("favDetailBtn");
  if(!btn || !currentGame)return;

  btn.textContent=isFavoriteGame(currentGame)
    ? "⭐ Remover dos favoritos"
    : "⭐ Adicionar aos favoritos";
}

function formatDate(date){
  if(!date)return "-";

  const d=new Date(date);

  if(Number.isNaN(d.getTime()))return "-";

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function formatTime(date){
  if(!date)return "-";

  const d=new Date(date);

  if(Number.isNaN(d.getTime()))return "-";

  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function normalizeTeam(team){
  if(!team)return {
    id:"",
    name:"-",
    logo:""
  };

  return {
    id:team.id||team.team?.id||"",
    name:
      team.displayName||
      team.shortDisplayName||
      team.team?.displayName||
      team.name||
      "-",
    logo:
      team.logo||
      team.team?.logo||
      team.team?.logos?.[0]?.href||
      ""
  };
}

function normalizeCompetitor(c){
  return normalizeTeam(c?.team||c);
}

function getLeagueById(id){
  return LEAGUES.find(x=>x.id===id)||{
    id:id||"",
    name:"Futebol",
    flag:"⚽"
  };
}

function parseGame(event,league){
  const comp=
    event?.competitions?.[0]||
    event?.competition||
    {};

  const competitors=comp.competitors||[];

  let home=competitors.find(x=>x.homeAway==="home");
  let away=competitors.find(x=>x.homeAway==="away");

  if(!home && competitors[0])home=competitors[0];
  if(!away && competitors[1])away=competitors[1];

  const ht=normalizeCompetitor(home);
  const at=normalizeCompetitor(away);

  const status=comp.status||event.status||{};
  const type=status.type||{};

  return {
    id:event.id,
    uid:event.uid,
    leagueId:league.id,
    leagueName:league.name,
    leagueFlag:league.flag,
    date:event.date,
    home:ht,
    away:at,
    homeScore:
      home?.score ??
      home?.scoreValue ??
      "-",
    awayScore:
      away?.score ??
      away?.scoreValue ??
      "-",
    statusName:type.shortDetail||type.detail||type.description||"",
    state:type.state||"",
    completed:
      !!type.completed ||
      type.state==="post",
    live:
      type.state==="in" ||
      type.name==="STATUS_IN_PROGRESS"
  };
}

async function fetchScoreboard(league,date){
  const url=
    `${API}/${encodeURIComponent(league.id)}/scoreboard`+
    `?dates=${encodeURIComponent(date)}`;

  const res=await fetch(url);

  if(!res.ok){
    throw new Error(`HTTP ${res.status}`);
  }

  const data=await res.json();

  return (data.events||[]).map(e=>parseGame(e,league));
}

async function fetchAllLeagues(date){
  const results=[];

  for(const league of LEAGUES){
    try{
      const games=await fetchScoreboard(league,date);
      results.push(...games);
    }catch(e){
      console.warn("Liga sem dados:",league.id,e);
    }
  }

  results.sort((a,b)=>
    new Date(a.date||0)-new Date(b.date||0)
  );

  return results;
}

function pitchPlayers(players,side){
  const positions=[
    [50,92],
    [15,76],[38,80],[62,80],[85,76],
    [22,58],[50,63],[78,58],
    [18,30],[50,38],[82,30]
  ];

  return players.slice(0,11).map((p,i)=>{
    let x=positions[i][0];
    let y=positions[i][1];

    if(side==="away"){
      y=100-y;
    }

    return `

}

  async function loadPlayerHistory(id){
  const box=$("playerHistory");

  if(!id){
    box.innerHTML=`
      <div class="sectionTitle">Histórico de clubes</div>
      <div class="empty">
        Histórico não disponível para este jogador.
      </div>
    `;

  }

  const urls=[
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/seasons?lang=pt&region=pt`,
    `https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/${encodeURIComponent(id)}`,
    `https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes/${encodeURIComponent(id)}/overview`
  ];

  let history=[];

  for(const url of urls){
    try{
      const res=await fetch(url);

      if(!res.ok)continue;

      const data=await res.json();

      history.push(...extractHistory(data));

    }catch(e){
      console.warn("Histórico:",e);
    }
  }

  history=dedupeHistory(history);

  if(!history.length){
    box.innerHTML=`
      <div class="sectionTitle">Histórico de clubes</div>

      <div class="empty">

      </div>
    `;
    return;
  }

  box.innerHTML=`
    <div class="sectionTitle">
      Histórico de clubes
    </div>

    ${history.map(h=>`
      <div class="historyRow">

        <div class="historySeason">
          ${esc(h.season||"-")}
        </div>

        <div class="historyClub">
          ${
            h.logo
              ? `<img class="clubLogo" src="${esc(h.logo)}" alt="">`
              : ""
          }

          ${esc(h.club||"-")}
        </div>

      </div>
    `).join("")}
  `;
}

function extractHistory(data){
  const result=[];

  function walk(obj,seasonHint=""){
    if(!obj||typeof obj!=="object")return;

    if(Array.isArray(obj)){
      obj.forEach(x=>walk(x,seasonHint));
      return;
    }

    const season=
      obj.season?.displayName||
      obj.season?.year||
      obj.season?.slug||
      obj.year||
      obj.seasonName||
      seasonHint||
      "";

    const team=
      obj.team||
      obj.club||
      obj.squad||
      obj.teams?.[0];

    if(team){
      const club=
        team.displayName||
        team.fullName||
        team.shortDisplayName||
        team.name||
        "";

      if(club){
        result.push({
          season:String(season||""),
          club:String(club),
          logo:
            team.logo||
            team.logos?.[0]?.href||
            ""
        });
      }
    }

    const directClub=
      obj.teamName||
      obj.clubName||
      obj.formerClub||
      obj.previousClub;

    if(directClub){
      result.push({
        season:String(season||""),
        club:String(directClub),
        logo:""
      });
    }

    Object.keys(obj).forEach(key=>{
      const value=obj[key];

      if(
        /team|club|career|history|season|roster|former|previous|statistics|splits/i
          .test(key)
      ){
        walk(value,season);
      }
    });
  }

  walk(data);

  return result;
}

function dedupeHistory(list){
  const map=new Map();

  list.forEach(x=>{
    if(!x.club)return;

    const key=
      `${String(x.season||"").toLowerCase()}|`+
      `${String(x.club||"").toLowerCase()}`;

    if(!map.has(key)){
      map.set(key,x);
    }
  });

  return Array.from(map.values());
}

async function fetchNewsFeed(feed){
  const proxy=
    "https://api.rss2json.com/v1/api.json?rss_url="+
    encodeURIComponent(feed.url);

  const res=await fetch(proxy);

  if(!res.ok){
    throw new Error(`HTTP ${res.status}`);
  }

  const data=await res.json();

  return (data.items||[]).map(item=>({
    source:feed.source,
    title:item.title||"",
    link:item.link||"",
    date:item.pubDate||"",
    description:item.description||"",
    image:item.thumbnail||item.enclosure?.link||""
  }));
}

async function loadNews(){
  const box=$("newsContent");

  try{
    const responses=await Promise.allSettled(
      FZ_NEWS_FEEDS.map(fetchNewsFeed)
    );

    let items=[];

    responses.forEach(r=>{
      if(r.status==="fulfilled"){
        items.push(...r.value);
      }
    });

    const map=new Map();

    items.forEach(item=>{
      const key=
        `${item.title}`.toLowerCase().trim();

      if(key&&!map.has(key)){
        map.set(key,item);
      }
    });

    items=Array.from(map.values());

    items.sort((a,b)=>
      new Date(b.date||0)-new Date(a.date||0)
    );

    items=items.slice(0,30);

    if(!items.length){
      box.innerHTML=`
        <div class="empty">
          Não foi possível carregar notícias neste momento.
        </div>
      `;
      return;
    }

    box.innerHTML=`
      <div class="newsList">

        ${items.map(item=>`
          <div
            class="newsItem"
            onclick="openNews('${esc(item.link)}')"
          >

            <div class="newsSource">
              ${esc(item.source)}
            </div>

            <div class="newsTitle">
              ${esc(item.title)}
            </div>

            ${
              item.date
                ? `<div class="newsDate">${esc(formatNewsDate(item.date))}</div>`
                : ""
            }

          </div>
        `).join("")}

      </div>
    `;

  }catch(e){
    console.error(e);

    box.innerHTML=`
      <div class="empty">
        Não foi possível carregar as notícias.
      </div>
    `;
  }
}

function formatNewsDate(value){
  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

async function loadTableLeague(league){
  const box=$("tableContent");

  box.innerHTML=`

  try{
    const url=
      `https://site.api.espn.com/apis/v2/sports/soccer/`+
      `${encodeURIComponent(league.id)}/standings`;

    const res=await fetch(url);

    if(!res.ok){
      throw new Error(`HTTP ${res.status}`);
    }

    const data=await res.json();

    let entries=[];

    if(Array.isArray(data?.children)){
      data.children.forEach(child=>{
        if(Array.isArray(child?.standings?.entries)){
          entries.push(...child.standings.entries);
        }
      });
    }

    if(!entries.length&&Array.isArray(data?.standings?.entries)){
      entries=data.standings.entries;
    }

    if(!entries.length){
      box.innerHTML=`
        <div class="empty">
          Classificação não disponível para esta competição.
        </div>
      `;
      return;

                    const n=String(
                      s.name||

                      s.displayName||
                      ""
                    ).toLowerCase();

                    return aliases.includes(n);

                  return found?.displayValue??

  $("loadDateBtn").addEventListener("click",()=>{
    currentDate=$("datePicker").value;

    if(!currentDate)return;

    loadLeague();
  });

  $("allDayBtn").addEventListener("click",()=>{
    currentDate=$("datePicker").value||currentDate;

    loadAllDay();
  });

  $("liveAllBtn").addEventListener("click",()=>{
    loadLive();
  });

  $("refreshBtn").addEventListener("click",()=>{
    if(currentView==="news"){
      showNews();
    }else if(currentView==="favorites"){
      showFavorites();
    }else if(currentView==="tables"){
      loadTables();
    }else{
      loadLeague();
    }
  });

  $("navNoticias").addEventListener("click",()=>{
    showNews();
  });

  $("navTabelas").addEventListener("click",()=>{
    loadTables();
  });

  $("navFav").addEventListener("click",()=>{
    showFavorites();
  });

  showNews();
}

document.addEventListener(
  "DOMContentLoaded",
  initialise
);
</script>

</body>
</html>
