<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#071a35}
header{background:#071a35;color:white;padding:18px 16px;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:#b9c8dc}
main{padding:15px;padding-bottom:90px}
h2{margin-top:10px}
.card{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #00000012}
.league{font-weight:bold;font-size:18px;margin-bottom:10px}
.match{border-top:1px solid #eee;padding:12px 0}
.teams{display:flex;justify-content:space-between;gap:10px;align-items:center}
.team{width:42%;text-align:center;font-weight:bold}
.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 5px}
.score{text-align:center;font-size:20px;font-weight:bold}
.status{text-align:center;font-size:12px;color:#68778c;margin-top:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;z-index:20}
nav button{flex:1;border:0;background:white;padding:12px 4px;font-size:11px;color:#64748b}
nav button.active{color:#071a35;font-weight:bold}
.page{display:none}
.page.active{display:block}
button.refresh{background:#071a35;color:white;border:0;padding:10px 15px;border-radius:10px}
select{padding:10px;border-radius:10px;border:1px solid #ddd;width:100%;margin:8px 0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:8px 4px;border-bottom:1px solid #eee;text-align:center}
.table th:nth-child(2),.table td:nth-child(2){text-align:left}
.logo{width:25px;height:25px;object-fit:contain;vertical-align:middle;margin-right:6px}
.loading{text-align:center;padding:30px;color:#64748b}
.error{background:#fff3f3;color:#b91c1c;padding:12px;border-radius:10px}
</style>
</head>

<body>

<header>
<h1>⚽ FUTZONE</h1>
<p>O futebol num só lugar</p>
</header>

<main>

<section id="inicio" class="page active">
<h2>🏠 Início</h2>
<div class="card">
<strong>Bem-vindo à FUTZONE</strong>
<p>Resultados, jogos e classificações das principais ligas.</p>
<button class="refresh" onclick="carregarTudo()">🔄 Atualizar</button>
</div>
<div id="resumo" class="loading">A carregar jogos...</div>
</section>

<section id="jogos" class="page">
<h2>⚽ Jogos</h2>
<select id="ligaSelect" onchange="mostrarJogos()">
<option value="todas">Todas as ligas</option>
<option value="Portugal">🇵🇹 Primeira Liga</option>
<option value="Inglaterra">🏴 Premier League</option>
<option value="Espanha">🇪🇸 La Liga</option>
<option value="Itália">🇮🇹 Serie A</option>
<option value="Alemanha">🇩🇪 Bundesliga</option>
</select>
<div id="jogosLista" class="loading">A carregar...</div>
</section>

<section id="competicoes" class="page">
<h2>🏆 Competições</h2>
<div id="competicoesLista"></div>
</section>

<section id="classificacoes" class="page">
<h2>📊 Classificações</h2>
<select id="classSelect" onchange="mostrarClassificacao()">
<option value="Portugal">🇵🇹 Primeira Liga</option>
<option value="Inglaterra">🏴 Premier League</option>
<option value="Espanha">🇪🇸 La Liga</option>
<option value="Itália">🇮🇹 Serie A</option>
<option value="Alemanha">🇩🇪 Bundesliga</option>
</select>
<div id="classLista" class="loading">A carregar...</div>
</section>

<section id="favoritos" class="page">
<h2>⭐ Favoritos</h2>
<div id="favoritosLista" class="loading">Seleciona equipas favoritas nos jogos.</div>
</section>

</main>

<nav>
<button class="active" onclick="abrir('inicio',this)">🏠<br>Início</button>
<button onclick="abrir('jogos',this)">⚽<br>Jogos</button>
<button onclick="abrir('competicoes',this)">🏆<br>Ligas</button>
<button onclick="abrir('classificacoes',this)">📊<br>Tabela</button>
<button onclick="abrir('favoritos',this)">⭐<br>Favoritos</button>
</nav>

<script>

const ligas={
Portugal:{
 nome:"🇵🇹 Primeira Liga",
 jogos:"data/primeira-liga.json",
 tabela:"data/classificacao.json"
},
Inglaterra:{
 nome:"🏴 Premier League",
 jogos:"data/premier-league.json",
 tabela:"data/premier-league-classificacao.json"
},
Espanha:{
 nome:"🇪🇸 La Liga",
 jogos:"data/la-liga.json",
 tabela:"data/la-liga-classificacao.json"
},
Itália:{
 nome:"🇮🇹 Serie A",
 jogos:"data/serie-a.json",
 tabela:"data/serie-a-classificacao.json"
},
Alemanha:{
 nome:"🇩🇪 Bundesliga",
 jogos:"data/bundesliga.json",
 tabela:"data/bundesliga-classificacao.json"
}
};

let dadosJogos={};

async function obter(url){
 try{
   const r=await fetch(url+"?t="+Date.now());
   if(!r.ok) throw new Error("HTTP "+r.status);
   return await r.json();
 }catch(e){
   console.log("Erro:",url,e);
   return null;
 }
}

function extrairJogos(j){
 if(!j) return [];
 if(Array.isArray(j)) return j;
 if(Array.isArray(j.data)) return j.data;
 if(Array.isArray(j.data?.matches)) return j.data.matches;
 if(Array.isArray(j.matches)) return j.matches;
 return [];
}

function equipa(m,casa){
 const t=casa?m.home_team:m.away_team;
 return t?.team_name || t?.name || t?.team?.team_name || "Equipa";
}

function logo(m,casa){
 const t=casa?m.home_team:m.away_team;
 return t?.team_logo || t?.logo || t?.team?.logo || "";
}

function dataJogo(m){
 return m.match_date || m.date || m.kickoff || "";
}

function placar(m){
 const s=m.score || m.scores || {};
 if(s.home!=null && s.away!=null) return s.home+" - "+s.away;
 if(s.fulltime?.home!=null) return s.fulltime.home+" - "+s.fulltime.away;
 return "vs";
}

function estado(m){
 return m.status_localized || m.status || "Agendado";
}

async function carregarTudo(){

 document.getElementById("resumo").innerHTML='<div class="loading">⏳ A carregar dados reais...</div>';

 for(const chave of Object.keys(ligas)){
   dadosJogos[chave]=extrairJogos(await obter(ligas[chave].jogos));
 }

 mostrarJogos();
 mostrarCompeticoes();
 mostrarClassificacao();
 mostrarResumo();
 mostrarFavoritos();
}

function mostrarResumo(){

 let html="";
 let total=0;

 for(const chave of Object.keys(ligas)){
   const jogos=dadosJogos[chave]||[];
   total+=jogos.length;

   html+=`
   <div class="card">
     <div class="league">${ligas[chave].nome}</div>
     <strong>${jogos.length}</strong> jogos disponíveis
   </div>`;
 }

 document.getElementById("resumo").innerHTML=
   `<div class="card"><strong>${total}</strong> jogos carregados nas 5 ligas.</div>`+html;
}

function mostrarJogos(){

 const filtro=document.getElementById("ligaSelect").value;
 const box=document.getElementById("jogosLista");

 let html="";

 const grupos=filtro==="todas"
   ?Object.keys(ligas)
   :[filtro];

 grupos.forEach(chave=>{

   const jogos=(dadosJogos[chave]||[]).slice(0,30);

   html+=`<div class="card">
   <div class="league">${ligas[chave].nome}</div>`;

   if(!jogos.length){
     html+=`<p>Sem jogos disponíveis.</p>`;
   }

   jogos.forEach(m=>{

     const h=equipa(m,true);
     const a=equipa(m,false);
     const lh=logo(m,true);
     const la=logo(m,false);

     html+=`
     <div class="match">
       <div class="teams">
         <div class="team">
           ${lh?`<img src="${lh}" onerror="this.style.display='none'">`:""}
           ${h}
         </div>

         <div class="score">
           ${placar(m)}
         </div>

         <div class="team">
           ${la?`<img src="${la}" onerror="this.style.display='none'">`:""}
           ${a}
         </div>
       </div>

       <div class="status">
         ${dataJogo(m)} · ${estado(m)}
       </div>

       <div style="text-align:center;margin-top:7px">
         <button onclick="favorito('${h.replace(/'/g,"")}')">⭐</button>
         <button onclick="favorito('${a.replace(/'/g,"")}')">⭐</button>
       </div>
     </div>`;
   });

   html+="</div>";
 });

 box.innerHTML=html||'<div class="error">Não foram encontrados jogos.</div>';
}

function mostrarCompeticoes(){

 let html="";

 Object.keys(ligas).forEach(k=>{
   html+=`
   <div class="card">
     <div class="league">${ligas[k].nome}</div>
     <p>⚽ Jogos e resultados</p>
     <p>📊 Classificação</p>
   </div>`;
 });

 document.getElementById("competicoesLista").innerHTML=html;
}

async function mostrarClassificacao(){

 const chave=document.getElementById("classSelect").value;
 const box=document.getElementById("classLista");

 const j=await obter(ligas[chave].tabela);

 let tabela=[];

 if(Array.isArray(j)) tabela=j;
 else if(Array.isArray(j?.data)) tabela=j.data;
 else if(Array.isArray(j?.data?.standings)) tabela=j.data.standings;
 else if(Array.isArray(j?.standings)) tabela=j.standings;

 if(!tabela.length){
   box.innerHTML='<div class="error">Classificação não disponível.</div>';
   return;
 }

 let html=`
 <div class="card">
 <div class="league">${ligas[chave].nome}</div>
 <table class="table">
 <tr>
 <th>#</th>
 <th>Equipa</th>
 <th>J</th>
 <th>V</th>
 <th>E</th>
 <th>D</th>
 <th>DG</th>
 <th>Pts</th>
 </tr>`;

 tabela.forEach((x,i)=>{

   const t=x.team||{};

   const nome=t.team_name||t.name||x.team_name||"Equipa";
   const logo=t.team_logo||t.logo||"";

   html+=`
   <tr>
    <td>${x.position||x.rank||i+1}</td>
    <td>
      ${logo?`<img class="logo" src="${logo}" onerror="this.style.display='none'">`:""}
      ${nome}
    </td>
    <td>${x.played??x.matches_played??"-"}</td>
    <td>${x.won??x.wins??"-"}</td>
    <td>${x.drawn??x.draws??"-"}</td>
    <td>${x.lost??x.losses??"-"}</td>
    <td>${x.goal_difference??x.goals_diff??"-"}</td>
    <td><strong>${x.points??"-"}</strong></td>
   </tr>`;
 });

 html+="</table></div>";

 box.innerHTML=html;
}

function favorito(nome){

 let f=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");

 if(!f.includes(nome)) f.push(nome);

 localStorage.setItem("futzone_favoritos",JSON.stringify(f));

 mostrarFavoritos();
 alert("⭐ "+nome+" adicionado aos favoritos!");
}

function mostrarFavoritos(){

 const box=document.getElementById("favoritosLista");
 const f=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");

 if(!f.length){
   box.innerHTML="Ainda não tens equipas favoritas.";
   return;
 }

 box.innerHTML=f.map(x=>
 `<div class="card">⭐ <strong>${x}</strong></div>`
 ).join("");
}

function abrir(id,botao){

 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 botao.classList.add("active");

 if(id==="jogos") mostrarJogos();
 if(id==="classificacoes") mostrarClassificacao();
 if(id==="favoritos") mostrarFavoritos();
}

carregarTudo();

</script>

</body>
</html>
