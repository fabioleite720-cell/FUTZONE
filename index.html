<style>

<script>
"use strict";

/* =========================================================
   FUTZONE — MOTOR PRINCIPAL
   ========================================================= */

const API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const STANDINGS_API =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const CORE_API =
  "https://sports.core.api.espn.com/v2/sports/soccer/leagues/";

const ligas = [

  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  ["esp.1","🇪🇸 La Liga"],
  ["esp.2","🇪🇸 La Liga 2"],

  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],

  ["ksa.1","🇸🇦 Liga Saudita"],
  ["usa.1","🇺🇸 MLS"],

  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]

];

let ligaSelecionada = "por.1";
let filtroAtual = "todos";
let diaSelecionado = "";
let modoTodos = false;
let modoLive = false;
let modoResultados = false;
let desporto = "futebol";

let eventosAtuais = [];
let tabelaAtual = [];

let requestToken = 0;

const CACHE = new Map();
const INFLIGHT = new Map();

const favoritos =
  JSON.parse(
    localStorage.getItem("futzone_jogos_favoritos") || "[]"
  );

/* =========================================================
   HISTÓRICO DO OVERLAY
   ========================================================= */

const overlayStack = [];

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function safeUrl(v){

  const s=String(v||"").trim();

  if(
    s.startsWith("https://") ||
    s.startsWith("http://")
  ){
    return s;
  }

  return "";

}

function cacheGet(key,ttl){

  const item=CACHE.get(key);

  if(!item) return null;

  if(
    Date.now()-item.time>ttl
  ){

    CACHE.delete(key);
    return null;

  }

  return item.data;

}

async function fetchJSON(url,timeout=9000){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:controller.signal,
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP "+response.status
      );
    }

    return await response.json();

  }catch(error){

    console.warn(
      "FUTZONE API:",
      error
    );

    return null;

  }finally{

    clearTimeout(timer);

  }

}

async function fetchAPI(
  url,
  timeout=9000,
  ttl=30000
){

  const cached =
    cacheGet(url,ttl);

  if(cached!==null){
    return cached;
  }

  if(INFLIGHT.has(url)){
    return INFLIGHT.get(url);
  }

  const promise =
    fetchJSON(url,timeout)
      .then(data=>{

        if(data!==null){

          CACHE.set(
            url,
            {
              time:Date.now(),
              data
            }
          );

        }

        return data;

      })
      .catch(()=>null)
      .finally(
        ()=>{
          INFLIGHT.delete(url);
        }
      );

  INFLIGHT.set(
    url,
    promise
  );

  return promise;

}

/* =========================================================
   ESPN — EQUIPAS
   ========================================================= */

function getCompetidores(evento){

  if(
    Array.isArray(evento?.competitors)
  ){
    return evento.competitors;
  }

  if(
    Array.isArray(
      evento?.competition?.competitors
    )
  ){
    return evento.competition.competitors;
  }

  if(
    Array.isArray(
      evento?.competitions?.[0]?.competitors
    )
  ){
    return evento.competitions[0].competitors;
  }

  return [];

}

function getTeamObject(c){

  return (
    c?.team ||
    c?.competitor?.team ||
    c?.competitor ||
    c ||
    {}
  );

}

function nomeEquipa(c){

  const t=getTeamObject(c);

  const candidatos=[

    t.displayName,
    t.fullName,
    t.shortDisplayName,
    t.name,

    c?.displayName,
    c?.fullName,
    c?.shortDisplayName,
    c?.name,

    c?.competitor?.displayName,
    c?.competitor?.fullName,
    c?.competitor?.shortDisplayName,
    c?.competitor?.name

  ];

  for(
    const nome of candidatos
  ){

    if(
      typeof nome==="string" &&
      nome.trim()
    ){

      return nome.trim();

    }

  }

  if(
    t.location &&
    t.name
  ){

    return (
      String(t.location)+" "+
      String(t.name)
    ).trim();

  }

  return "";

}

function idEquipa(c){

  const t=getTeamObject(c);

  return String(
    t.id ||
    c?.id ||
    t.uid ||
    c?.uid ||
    ""
  );

}

function logoEquipa(c){

  const t=getTeamObject(c);

  return safeUrl(
    t.logo ||
    t.logos?.[0]?.href ||
    t.logos?.[0]?.url ||
    c?.logo ||
    c?.logos?.[0]?.href ||
    c?.logos?.[0]?.url ||
    ""
  );

}

function obterCasaFora(evento){

  const lista =
    getCompetidores(evento);

  const casa =
    lista.find(
      x=>x.homeAway==="home"
    ) ||
    lista[0] ||
    null;

  const fora =
    lista.find(
      x=>x.homeAway==="away"
    ) ||
    lista[1] ||
    null;

  return {
    casa,
    fora
  };

}

/* =========================================================
   DATAS
   ========================================================= */

function dataHoje(){

  const d=new Date();

  return (
    d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")
  );

}

function adicionarDiasISO(
  iso,
  quantidade
){

  const d=new Date(
    iso+"T12:00:00"
  );

  d.setDate(
    d.getDate()+quantidade
  );

  return d
    .toISOString()
    .slice(0,10);

}

function formatarDataISO(data){

  if(!data) return "";

  const d=new Date(data);

  if(
    Number.isNaN(d.getTime())
  ){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

function formatarHora(data){

  if(!data) return "--:--";

  const d=new Date(data);

  if(
    Number.isNaN(d.getTime())
  ){
    return "--:--";
  }

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function criarDias(){

  const box =
    document.getElementById(
      "dayList"
    );

  const hoje=new Date();

  box.innerHTML="";

  for(
    let i=-1;
    i<=7;
    i++
  ){

    const d=new Date(hoje);

    d.setDate(
      hoje.getDate()+i
    );

    const iso =
      d.toISOString()
        .slice(0,10);

    const nome =
      d.toLocaleDateString(
        "pt-PT",
        {weekday:"short"}
      ).replace(".","");

    const numero =
      d.toLocaleDateString(
        "pt-PT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      );

    const button =
      document.createElement(
        "button"
      );

    button.className="dayChip";

    if(i===0){

      button.classList.add(
        "active"
      );

      diaSelecionado=iso;

    }

    button.innerHTML=
      `<strong>${
        i===0
          ? "HOJE"
          : nome.toUpperCase()
      }</strong>
      <span>${numero}</span>`;

    button.onclick=()=>{

      document
        .querySelectorAll(
          ".dayChip"
        )
        .forEach(
          x=>x.classList.remove(
            "active"
          )
        );

      button.classList.add(
        "active"
      );

      diaSelecionado=iso;

      modoTodos=false;
      modoLive=false;
      modoResultados=false;

      filtroAtual="todos";

      atualizarBotoesFiltro();

      carregarJogos();

    };

    box.appendChild(button);

  }

}

/* =========================================================
   ESTADOS
   ========================================================= */

function isLive(e){

  const s =
    e?.status?.type || {};

  const texto =
    (
      `${s.name||""} `+
      `${s.description||""} `+
      `${s.detail||""}`
    ).toUpperCase();

  return (
    s.state==="in" ||
    s.name==="STATUS_IN_PROGRESS" ||
    s.type==="in" ||
    texto.includes("LIVE") ||
    texto.includes("IN PROGRESS") ||
    texto.includes("IN PLAY")
  );

}

function isFinal(e){

  const s =
    e?.status?.type || {};

  return (
    s.completed===true ||
    s.state==="post" ||
    s.name==="STATUS_FINAL" ||
    s.type==="final"
  );

}

function nomeCompeticao(e,liga){

  return (
    e?.competitions?.[0]?.name ||
    e?.league?.name ||
    ligas.find(
      x=>x[0]===liga
    )?.[1] ||
    "Futebol"
  );

}

function normalizarEvento(e,liga){

  if(!e) return null;

  e.__futzoneLiga =
    liga ||
    e.__futzoneLiga ||
    "";

  return e;

}

function deduplicarEventos(lista){

  const map=new Map();

  lista.forEach(e=>{

    if(!e) return;

    const c=
      getCompetidores(e);

    const a=
      nomeEquipa(c[0]);

    const b=
      nomeEquipa(c[1]);

    const chave=
      e.id ||
      `${e.date||""}-${a}-${b}`;

    if(!map.has(chave)){
      map.set(chave,e);
    }

  });

  return [...map.values()];

}

/* =========================================================
   JOGOS DE UM DIA
   ========================================================= */

async function buscarJogosLiga(
  liga,
  iso
){

  const data =
    iso ||
    diaSelecionado ||
    dataHoje();

  const range =
    data.replaceAll("-","");

  const url =
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    range+
    "&limit=100";

  const json =
    await fetchAPI(
      url,
      9000,
      20000
    );

  let eventos =
    Array.isArray(json?.events)
      ? json.events
      : [];

  eventos=
    eventos
      .map(
        e=>normalizarEvento(
          e,
          liga
        )
      )
      .filter(Boolean);

  return deduplicarEventos(
    eventos
  );

}

/* =========================================================
   RESULTADOS — ÚLTIMOS 30 DIAS
   ========================================================= */

async function buscarJogosPeriodoLiga(
  liga,
  inicio,
  fim
){

  const inicioApi =
    inicio.replaceAll("-","");

  const fimApi =
    fim.replaceAll("-","");

  const url =
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    inicioApi+
    "-"+
    fimApi+
    "&limit=500";

  const json =
    await fetchAPI(
      url,
      15000,
      120000
    );

  if(
    !json ||
    !Array.isArray(json.events)
  ){
    return [];
  }

  return deduplicarEventos(
    json.events
      .map(
        e=>normalizarEvento(
          e,
          liga
        )
      )
      .filter(
        e=>e && isFinal(e)
      )
  );

}

async function buscarResultadosTodasLigas(){

  const hoje=dataHoje();

  const inicio=
    adicionarDiasISO(
      hoje,
      -30
    );

  const resultados=[];

  /*
    Fazemos apenas um pedido por liga,
    usando intervalo de datas.
    As ligas são processadas em grupos
    para não bloquear o telemóvel.
  */

  const tamanhoGrupo=4;

  for(
    let i=0;
    i<ligas.length;
    i+=tamanhoGrupo
  ){

    const grupo=
      ligas.slice(
        i,
        i+tamanhoGrupo
      );

    const grupoResultados=
      await Promise.all(
        grupo.map(
          x=>
            buscarJogosPeriodoLiga(
              x[0],
              inicio,
              hoje
            )
        )
      );

    grupoResultados.forEach(
      lista=>{
        resultados.push(...lista);
      }
    );

    /*
      Pequena pausa entre grupos.
      Evita disparar todos os pedidos
      simultaneamente no telemóvel.
    */

    if(
      i+tamanhoGrupo<ligas.length
    ){

      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            80
          )
      );

    }

  }

  return deduplicarEventos(
    resultados
  )
    .filter(isFinal)
    .sort(
      (a,b)=>
        new Date(b.date||0) -
        new Date(a.date||0)
    );

}

/* =========================================================
   CARREGAR JOGOS
   ========================================================= */

async function carregarJogos(){

  if(
    desporto==="futsal"
  ){

    mostrarFutsal();
    return;

  }

  const token=
    ++requestToken;

  const box=
    document.getElementById(
      "gamesList"
    );

  document
    .getElementById(
      "tableContent"
    )
    .classList.add("hidden");

  box.classList.remove(
    "hidden"
  );

  box.innerHTML=
    `<div class="loading">
      <div class="spinner"></div>
      A carregar jogos...
    </div>`;

  let eventos=[];

  if(
    modoResultados
  ){

    box.innerHTML=
      `<div class="loading">
        <div class="spinner"></div>
        A procurar resultados dos últimos 30 dias...
      </div>`;

    eventos=
      await buscarResultadosTodasLigas();

  }else if(
    modoTodos ||
    modoLive
  ){

    const resultados=[];

    const limite=5;

    for(
      let i=0;
      i<ligas.length;
      i+=limite
    ){

      const grupo=
        ligas.slice(
          i,
          i+limite
        );

      const grupoResultados=
        await Promise.all(
          grupo.map(
            x=>
              buscarJogosLiga(
                x[0],
                diaSelecionado
              )
          )
        );

      grupoResultados.forEach(
        x=>resultados.push(...x)
      );

      if(
        token!==requestToken
      ){
        return;
      }

    }

    eventos=
      deduplicarEventos(
        resultados
      );

  }else{

    eventos=
      await buscarJogosLiga(
        ligaSelecionada,
        diaSelecionado
      );

  }

  if(
    token!==requestToken
  ){
    return;
  }

  eventosAtuais=eventos;

  if(
    !eventos.length &&
    !modoResultados
  ){

    const fallback=
      FALLBACK[
        ligaSelecionada
      ] || [];

    if(
      !modoTodos &&
      !modoLive &&
      fallback.length
    ){

      eventos=
        fallback.map(
          x=>
            criarEventoFallback(
              x[0],
              x[1],
              ligaSelecionada
            )
        );

      eventosAtuais=eventos;

    }

  }

  renderizarJogos(
    eventos
  );

}

/* =========================================================
   RENDER JOGOS
   ========================================================= */

function renderizarJogos(
  eventos
){

  const box=
    document.getElementById(
      "gamesList"
    );

  let lista=[
    ...eventos
  ];

  if(
    modoLive
  ){

    lista=
      lista.filter(
        isLive
      );

  }

  if(
    filtroAtual==="live"
  ){

    lista=
      lista.filter(
        isLive
      );

  }

  if(
    filtroAtual==="proximos"
  ){

    lista=
      lista.filter(
        e=>
          !isLive(e) &&
          !isFinal(e)
      );

  }

  if(
    filtroAtual==="final"
  ){

    lista=
      lista.filter(
        isFinal
      );

  }

  const q=
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();

  if(q){

    lista=
      lista.filter(
        e=>{

          const c=
            getCompetidores(e);

          return c.some(
            x=>
              nomeEquipa(x)
                .toLowerCase()
                .includes(q)
          );

        }
      );

  }

  if(!lista.length){

    box.innerHTML=
      `<div class="empty">

        <div style="font-size:28px">
          ⚽
        </div>

        <strong>
          Sem jogos encontrados
        </strong>

        <div style="margin-top:7px">
          ${
            modoResultados
              ? "Não foram encontrados resultados nos últimos 30 dias."
              : "Tenta outra data, competição ou filtro."
          }
        </div>

      </div>`;

    return;

  }

  lista.sort(
    (a,b)=>{

      if(modoResultados){

        return (
          new Date(b.date||0) -
          new Date(a.date||0)
        );

      }

      return (
        new Date(a.date||0) -
        new Date(b.date||0)
      );

    }
  );

  const grupos=
    new Map();

  lista.forEach(
    e=>{

      const liga=
        e.__futzoneLiga ||
        ligaSelecionada;

      if(
        !grupos.has(liga)
      ){

        grupos.set(
          liga,
          []
        );

      }

      grupos
        .get(liga)
        .push(e);

    }
  );

  box.innerHTML="";

  grupos.forEach(
    (items,liga)=>{

      const bloco=
        document.createElement(
          "div"
        );

      bloco.className=
        "leagueBlock";

      const nome=
        ligas.find(
          x=>x[0]===liga
        )?.[1] ||
        nomeCompeticao(
          items[0],
          liga
        );

      bloco.innerHTML=
        `<div class="leagueBlockTitle">
          ${escapeHtml(nome)}
        </div>`;

      items.forEach(
        e=>{

          bloco.insertAdjacentHTML(
            "beforeend",
            cartaoJogo(e)
          );

        }
      );

      box.appendChild(
        bloco
      );

    }
  );

}

function cartaoJogo(e){

  const {casa,fora}=
    obterCasaFora(e);

    nomeEquipa(casa) ||
    "Equipa da casa";

  const nomeFora=
    nomeEquipa(fora) ||
    "Equipa visitante";

  const logoCasa=
    logoEquipa(casa);

  const logoFora=
    logoEquipa(fora);

  const scoreCasa=
    casa?.score ?? "";

  const scoreFora=
    fora?.score ?? "";

  const live=
    isLive(e);

  const final=
    isFinal(e);

  const estado=
    live
      ? "AO VIVO"
      : final
        ? "FINAL"
        : formatarHora(e.date);

  const fav=
    favoritos.includes(
      String(e.id)
    );

  const liga=
    e.__futzoneLiga ||
    ligaSelecionada;

  const logo1=
    logoCasa
      ? `<img src="${escapeHtml(logoCasa)}"
              onerror="this.style.display='none'"
              alt="">`
      : `<div class="teamLogo">⚽</div>`;

  const logo2=
    logoFora
      ? `<img src="${escapeHtml(logoFora)}"
              onerror="this.style.display='none'"
              alt="">`
      : `<div class="teamLogo">⚽</div>`;

  return `
  <article
    class="gameCard"
    onclick="abrirJogo('${escapeHtml(String(e.id))}')">

    <div class="gameTop">

      <div class="competition">
        ${escapeHtml(
          nomeCompeticao(
            e,
            liga
          )
        )}
      </div>

      <button
        class="favBtn"
        onclick="event.stopPropagation();
                 toggleFavorito('${escapeHtml(String(e.id))}')">

        ${fav ? "★" : "☆"}

      </button>

    </div>

    <div class="gameDate">
      ${formatarDataISO(e.date)}
    </div>

    <div class="teams">

      <div
        class="team"
        onclick="event.stopPropagation();
                 fzAbrirEquipa(
                   '${escapeHtml(idEquipa(casa))}',
                   '${escapeHtml(nomeCasa)}',
                   '${escapeHtml(logoCasa)}',
                   '${escapeHtml(liga)}'
                 )">

        ${logo1}

        <span>
          ${escapeHtml(nomeCasa)}
        </span>

      </div>

      <div class="scoreBox">

        <div class="matchState ${
          live ? "live" : ""
        }">

          ${estado}

        </div>

        <strong>
          ${
            scoreCasa!=="" ||
            scoreFora!==""
              ? `${escapeHtml(scoreCasa)} - ${escapeHtml(scoreFora)}`
              : "vs"
          }
        </strong>

      </div>

      <div
        class="team"
        onclick="event.stopPropagation();
                 fzAbrirEquipa(
                   '${escapeHtml(idEquipa(fora))}',
                   '${escapeHtml(nomeFora)}',
                   '${escapeHtml(logoFora)}',
                   '${escapeHtml(liga)}'
                 )">

        ${logo2}

        <span>
          ${escapeHtml(nomeFora)}
        </span>

      </div>

    </div>

    ${
      live
        ? `<div class="liveBar">
             🔴 JOGO A DECORRER
           </div>`
        : ""
    }

  </article>`;

}

  modoResultados=false;

  if(
    filtro==="live"
  ){

    modoTodos=true;
    modoLive=true;

    document
      .getElementById(
        "liveButton"
      )
      .classList.add(
        "active"
      );

    await carregarJogos();

    return;

  }

  modoLive=false;

  if(
    filtro==="proximos"
  ){

    modoTodos=false;

  }

  renderizarJogos(
    eventosAtuais
  );

}

          .textContent,

      html:
        document
          .getElementById(
            "overlayContent"
          )
          .innerHTML

    });

  }

  document
    .getElementById(
      "overlayTitle"
    )
    .textContent=titulo;

  document
    .getElementById(
      "overlayContent"
    )
    .innerHTML=html;

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "open"
    );

  document
    .getElementById(
      "overlay"
    )
    .scrollTop=0;

}

function fecharOverlay(){

  if(
    overlayStack.length
  ){

    const anterior=
      overlayStack.pop();

    document
      .getElementById(
        "overlayTitle"
      )
      .textContent=
        anterior.title;

    document
      .getElementById(
        "overlayContent"
      )
      .innerHTML=
        anterior.html;

    document
      .getElementById(
        "overlay"
      )
      .scrollTop=0;

    return;

  }

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "open"
    );

}

function abrirOverlayNovo(
  titulo,
  html
){

  overlayStack.length=0;

  abrirOverlayBase(
    titulo,
    html,
    false
  );

}

function extrairJogadores(
  data,
  nomeClube
){

  let arr =
    data?.athletes ||
    data?.roster?.athletes ||
    data?.team?.athletes ||
    data?.team?.roster ||
    data?.roster ||
    [];

  if(
    arr &&
    Array.isArray(arr.items)
  ){

    arr=arr.items;

  }

  if(
    !Array.isArray(arr)
  ){

    return [];

  }

  return arr
    .map(
      p=>{

        const a=
          p?.athlete ||
          p;

        return {

          id:
            String(
              a?.id ||
              a?.uid ||
              ""
            ),

          nome:
            a?.fullName ||
            a?.displayName ||
            a?.name ||
            "Jogador",

          posicao:
            a?.position?.displayName ||
            a?.position?.abbreviation ||
            a?.position?.name ||
            "",

          numero:
            a?.jersey ||
            a?.jerseyNumber ||
            "",

          foto:
            safeUrl(
              a?.headshot?.href ||
              a?.headshot?.url ||
              a?.photo?.href ||
              a?.photo?.url ||
              ""
            ),

          nacionalidade:
            a?.nationality?.displayName ||
            a?.nationality?.name ||
            "",

          idade:
            a?.age ||
            "",

          clube:
            nomeClube || "",

          raw:a

        };

      }
    )
    .filter(
      p=>p.id
    );

}

async function buscarPlantelEquipa(
  liga,
  id,
  nome
){

  if(
    !id ||
    id.startsWith("fallback-")
  ){

    return [];

  }

  const url=
    API+
    encodeURIComponent(liga)+
    "/teams/"+
    encodeURIComponent(id)+
    "/roster";

  const data=
    await fetchAPI(
      url,
      9000,
      120000
    );

  return extrairJogadores(
    data,
    nome
  );

}

async function buscarPerfilJogador(
  liga,
  id
){

  if(!id) return null;

  const urls=[

    CORE_API+
    encodeURIComponent(liga)+
    "/athletes/"+
    encodeURIComponent(id),

    API+
    encodeURIComponent(liga)+
    "/athletes/"+
    encodeURIComponent(id),

    "https://sports.core.api.espn.com/v2/sports/soccer/athletes/"+
    encodeURIComponent(id)

  ];

  for(
    const url of urls
  ){

    const data=
      await fetchAPI(
        url,
        7000,
        300000
      );

    if(data){

      return data;

    }

  }

  return null;

}

function extrairHistoricoJogador(
  data
){

  if(!data) return [];

  const candidatos=[

    data?.teamHistory,
    data?.formerTeams,
    data?.teams,
    data?.athlete?.teamHistory,
    data?.athlete?.formerTeams,
    data?.athlete?.teams,
    data?.history,
    data?.athlete?.history

  ];

  for(
    const arr of candidatos
  ){

    if(
      !Array.isArray(arr)
    ){
      continue;
    }

    const resultado=
      arr
        .map(
          x=>{

            const team=
              x?.team ||
              x;

            return {

              clube:
                team?.displayName ||
                team?.fullName ||
                team?.shortDisplayName ||
                team?.name ||
                x?.teamName ||
                "",

              inicio:
                x?.startDate ||
                x?.startYear ||
                "",

              fim:
                x?.endDate ||
                x?.endYear ||
                "",

              liga:
                x?.league?.displayName ||
                x?.league?.name ||
                ""

            };

          }
        )
        .filter(
          x=>x.clube
        );

    if(resultado.length){

      return resultado;

    }

  }

  return [];

}

function obterValorPerfil(
  data,
  nomes
){

  for(
    const nome of nomes
  ){

    const valor=
      data?.[nome] ??
      data?.athlete?.[nome];

    if(
      valor!==undefined &&
      valor!==null &&
      String(valor).trim()!==""
    ){

      return valor;

    }

  }

  return "";

}

async function abrirJogador(

){

  if(!jogador) return;

  const nome=
    jogador.nome ||
    "Jogador";

  const liga=
    jogador.liga ||
    ligaSelecionada;

  const foto=

      jogador.foto
    );

  const clube=
    jogador.clube ||
    jogador.teamName ||
    "";

  const posicao=
    jogador.posicao ||
    "";

  const numero=
    jogador.numero ||
    "";

  abrirOverlayBase(
    nome,
    `

    <div class="playerProfile">

      ${
        foto
          ? `<img
               class="playerPhoto"
               src="${escapeHtml(foto)}"
               onerror="this.style.display='none'"
               alt="">`
          : `<div class="playerInitial">
               ${escapeHtml(
                 nome
                   .trim()
                   .charAt(0)
                   .toUpperCase()
               )}
             </div>`
      }

      <h2>
        ${escapeHtml(nome)}
      </h2>

      ${
        posicao
          ? `<p>
               Posição: ${escapeHtml(posicao)}
             </p>`
          : ""
      }

      ${
        numero
          ? `<p>
               Número: ${escapeHtml(numero)}
             </p>`
          : ""
      }

      ${
        clube
          ? `<p>
               Clube: ${escapeHtml(clube)}

      }

    </div>

    <div class="detailSection">

      <h3>Histórico do jogador</h3>

        <div class="loading">
          <div class="spinner"></div>
          A carregar histórico...
        </div>

      </div>

    </div>

    `,
    true
  );

  /*
    O pedido tem timeout próprio.
    Se a fonte não responder, a página
    continua perfeitamente utilizável.
  */

  try{

    const perfil=
      await buscarPerfilJogador(
        liga,
        jogador.id
      );

    /*
      O utilizador pode ter carregado
      entretanto noutro jogador.
      Não fazemos nada se o overlay
      já tiver mudado.
    */

    const historyBox=
      document.getElementById(
        "playerHistory"
      );

    if(!historyBox){
      return;
    }

    if(!perfil){

      historyBox.innerHTML=
        `<div class="empty"
              style="margin:0">

          Histórico não disponível
          para este jogador na fonte
          de dados.

        </div>`;

      return;

    }

    const historico=
      extrairHistoricoJogador(
        perfil
      );

    /*
      Alguns perfis trazem estes dados
      diretamente.
    */

    const nacionalidade=
      obterValorPerfil(
        perfil,
        [
          "nationality",
          "citizenship"
        ]
      );

    const nascimento=
      obterValorPerfil(
        perfil,
        [
          "dateOfBirth",
          "birthDate"
        ]
      );

    let html="";

    if(
      nacionalidade ||
      nascimento
    ){

      html+=
        `<div class="eventRow">`;

      if(nacionalidade){

        html+=
          `🌍 ${escapeHtml(
            typeof nacionalidade==="object"
              ? (
                  nacionalidade.displayName ||
                  nacionalidade.name ||
                  ""
                )
              : nacionalidade
          )}`;

      }

      if(
        nascimento
      ){

        html+=
          `${
            nacionalidade
              ? " · "
              : ""
          }🎂 ${escapeHtml(
            nascimento
          )}`;

      }

      html+=
        `</div>`;

    }

    if(historico.length){

      html+=
        historico
          .map(
            item=>
              `<div class="historyItem">

                <strong>
                  ${escapeHtml(
                    item.clube
                  )}
                </strong>

                ${
                  item.inicio ||
                  item.fim
                    ? `<small>
                         ${escapeHtml(
                           item.inicio || ""
                         )}
                         ${
                           item.inicio &&
                           item.fim
                             ? " — "
                             : ""
                         }
                         ${escapeHtml(
                           item.fim || ""
                         )}
                       </small>`
                    : ""
                }

                ${
                  item.liga
                    ? `<small>
                         ${escapeHtml(
                           item.liga
                         )}
                       </small>`
                    : ""
                }

              </div>`
          )
          .join("");

    }else{

      html+=
        `<div class="empty"
              style="margin:0">

          <strong>
            Histórico não disponível
          </strong>

          <div style="margin-top:7px">
            A fonte disponibiliza o perfil
            deste jogador, mas não forneceu
            o histórico dos clubes.
          </div>

        </div>`;

    }

    historyBox.innerHTML=html;

  }catch(error){

    console.warn(
      "FUTZONE jogador:",
      error
    );

    const historyBox=
      document.getElementById(
        "playerHistory"
      );

    if(historyBox){

      historyBox.innerHTML=
        `<div class="empty"
              style="margin:0">

          Histórico temporariamente
          indisponível.

        </div>`;

    }

  }

}

      }

      <h2>
        ${escapeHtml(nome)}
      </h2>

      <p>
        ${escapeHtml(
          ligas.find(
            x=>x[0]===liga
          )?.[1] ||
          "Equipa"
        )}
      </p>

    </div>

    <div class="detailSection">

      <h3>Jogadores</h3>

      <div id="teamPlayers">

        <div class="loading">
          <div class="spinner"></div>
          A carregar jogadores...
        </div>

      </div>

    </div>

    <div class="detailSection">

      <h3>Jogos</h3>

      <div id="teamGames">

        <div class="loading">
          <div class="spinner"></div>
          A carregar jogos...
        </div>

      </div>

    </div>

    `,
    true
  );

  if(
    !id ||
    id.startsWith("fallback-")
  ){

    const players=
      document.getElementById(
        "teamPlayers"
      );

    const games=
      document.getElementById(
        "teamGames"
      );

    if(players){

      players.innerHTML=
        `<div class="empty"
              style="margin:0">
          Plantel detalhado indisponível.
        </div>`;

    }

    if(games){

      games.innerHTML=
        `<div class="empty"
              style="margin:0">
          Informação detalhada indisponível.
        </div>`;

    }

    return;

  }

  /*
    Carregamos plantel e jogos em paralelo.
    Cada pedido tem o seu próprio timeout.
  */

  const [
    jogadores,
    dadosJogos
  ]=
    await Promise.all([
      buscarPlantelEquipa(
        liga,
        id,
        nome
      ),
      buscarJogosEquipa(
        liga,
        id
      )
    ]);

  /*
    Se o utilizador já saiu da equipa,
    não tentamos alterar o DOM.
  */

  const playersBox=
    document.getElementById(
      "teamPlayers"
    );

  const gamesBox=
    document.getElementById(
      "teamGames"
    );

  if(
    playersBox
  ){

    if(
      !jogadores.length
    ){

      playersBox.innerHTML=
        `<div class="empty"
              style="margin:0">

          Plantel não disponível
          para esta equipa.

        </div>`;

    }else{

      playersBox.innerHTML=
        "";

      jogadores.forEach(
        jogador=>{

          /*
            Guardamos os dados no próprio
            botão através de JSON seguro.
            Evita funções dinâmicas frágeis.
          */

          const key=
            registarJogador(
              {
                ...jogador,
                liga,
                teamId:id,
                teamName:nome
              }
            );

          playersBox.insertAdjacentHTML(
            "beforeend",
            `

            <div
              class="playerRow"
              onclick="abrirJogadorPorChave('${key}')">

              <div class="playerAvatar">

                ${
                  jogador.foto
                    ? `<img
                         src="${escapeHtml(
                           jogador.foto
                         )}"
                         onerror="this.parentElement.innerHTML='⚽'"
                         alt="">`
                    : "⚽"
                }

              </div>

              <div style="min-width:0">

                <strong>
                  ${escapeHtml(
                    jogador.nome
                  )}
                </strong>

                <small>

                  ${
                    jogador.posicao
                      ? escapeHtml(
                          jogador.posicao
                        )
                      : "Jogador"
                  }

                  ${
                    jogador.numero
                      ? ` · Nº ${escapeHtml(
                          jogador.numero
                        )}`
                      : ""
                  }

                </small>

              </div>

            </div>

            `
          );

        }
      );

    }

  }

  if(
    gamesBox
  ){

    if(
      !dadosJogos.length
    ){

      gamesBox.innerHTML=
        `<div class="empty"
              style="margin:0">

          Não foram encontrados jogos.

        </div>`;

    }else{

      gamesBox.innerHTML="";

      dadosJogos
        .slice(0,20)
        .forEach(
          e=>{

            const {casa,fora}=
              obterCasaFora(e);

            const a=
              nomeEquipa(casa) ||
              "Casa";

            const b=
              nomeEquipa(fora) ||
              "Fora";

            const final=
              isFinal(e);

            gamesBox.insertAdjacentHTML(
              "beforeend",
              `

              <div class="eventRow">

                ${escapeHtml(a)}

                <strong>
                  ${
                    casa?.score ??
                    ""
                  }
                  -
                  ${
                    fora?.score ??
                    ""
                  }
                </strong>

                ${escapeHtml(b)}

                <br>

                <small>

                  ${
                    final
                      ? "FINAL · "
                      : ""
                  }

                  ${formatarDataISO(
                    e.date
                  )}

                  &nbsp;

                  ${formatarHora(
                    e.date
                  )}

                </small>

              </div>

              `
            );

          }
        );

    }

  }

}

async function buscarJogosEquipa(
  liga,
  id
){

  const url=
    API+
    encodeURIComponent(liga)+
    "/teams/"+
    encodeURIComponent(id)+
    "/schedule?limit=30";

  const data=
    await fetchAPI(
      url,
      9000,
      60000
    );

  if(
    !Array.isArray(
      data?.events
    )
  ){

    return [];

  }

  return data.events
    .map(
      e=>
        normalizarEvento(
          e,
          liga
        )
    )
    .filter(Boolean);

}

/* =========================================================
   CACHE DE JOGADORES
   ========================================================= */

const PLAYER_CACHE=
  new Map();

let playerSequence=0;

function registarJogador(
  jogador
){

  playerSequence++;

  const key=
    "fzplayer_"+playerSequence;

  PLAYER_CACHE.set(
    key,
    jogador
  );

  /*
    Limpeza preventiva.
  */

  if(
    PLAYER_CACHE.size>500
  ){

    const primeira=
      PLAYER_CACHE.keys()
        .next().value;

    PLAYER_CACHE.delete(
      primeira
    );

  }

  return key;

}

function abrirJogadorPorChave(
  key
){

  const jogador=
    PLAYER_CACHE.get(
      key
    );

  if(
    jogador
  ){

    abrirJogador(
      jogador
    );

  }

}

function valorStat(
  stats,
  names
){

  if(
    !Array.isArray(stats)
  ){

    return "";

  }

  for(
    const nome of names
  ){

    const s=
      stats.find(
        x=>
          x?.name===nome ||
          x?.abbreviation===nome ||
          x?.shortDisplayName===nome
      );

    if(s){

      return (
        s.value ??
        s.displayValue ??
        ""
      );

    }

  }

  return "";

}

function extrairTabelaESPN(
  data
){

  const resultado=[];

  const grupos=[];

  if(
    Array.isArray(
      data?.children
    )
  ){

    grupos.push(
      ...data.children
    );

  }

  grupos.push(
    data
  );

  for(
    const grupo of grupos
  ){

    const entries=
      grupo?.standings?.entries ||
      grupo?.entries ||
      grupo?.standings?.results ||
      [];

    if(
      !Array.isArray(entries)
    ){

      continue;

    }

    entries.forEach(
      entry=>{

        const team=
          entry?.team ||
          entry?.competitor ||
          {};

        const stats=
          entry?.stats ||
          entry?.statistics ||
          [];

        const nome=
          team.displayName ||
          team.fullName ||
          team.shortDisplayName ||
          team.name ||
          "";

        if(!nome) return;

        resultado.push({

          id:
            team.id ||
            team.uid ||
            "",

          nome,

          logo:
            safeUrl(
              team.logo ||
              team.logos?.[0]?.href ||
              team.logos?.[0]?.url ||
              ""
            ),

          pos:
            valorStat(
              stats,
              [
                "rank",
                "position",
                "POS"
              ]
            ) ||
            resultado.length+1,

          jogados:
            valorStat(
              stats,
              [
                "gamesPlayed",
                "GP",
                "played",
                "games"
              ]
            ),

          vitorias:
            valorStat(
              stats,
              [
                "wins",
                "W"
              ]
            ),

          empates:
            valorStat(
              stats,
              [
                "ties",
                "draws",
                "D",
                "T"
              ]
            ),

          derrotas:
            valorStat(
              stats,
              [
                "losses",
                "L"
              ]
            ),

          gf:
            valorStat(
              stats,
              [
                "goalsFor",
                "pointsFor",
                "GF",
                "PF"
              ]
            ),

          ga:
            valorStat(
              stats,
              [
                "goalsAgainst",
                "pointsAgainst",
                "GA",
                "PA"
              ]
            ),

          gd:
            valorStat(
              stats,
              [
                "goalDifference",
                "pointDifferential",
                "GD",
                "PD"
              ]
            ),

          pontos:
            valorStat(
              stats,
              [
                "points",
                "PTS"
              ]
            )

        });

      }
    );

  }

  const mapa=
    new Map();

  resultado.forEach(
    x=>{

      const key=
        x.id ||
        x.nome;

      if(
        !mapa.has(key)
      ){

        mapa.set(
          key,
          x
        );

      }

    }
  );

  return [
    ...mapa.values()
  ];

}

async function mostrarTabelaFutebol(){

  document
    .getElementById(
      "gamesList"
    )
    .classList.add(
      "hidden"
    );

  const box=
    document.getElementById(
      "tableContent"
    );

  box.classList.remove(
    "hidden"
  );

  box.innerHTML=
    `<div class="loading">

      <div class="spinner"></div>

      A carregar classificação...

    </div>`;

  const data=
    await buscarTabelaLiga(
      ligaSelecionada
    );

  let tabela=
    data
      ? extrairTabelaESPN(data)
      : [];

  if(
    !tabela.length
  ){

    tabela=
      tabelaFallback(
        ligaSelecionada
      );

  }

  tabelaAtual=tabela;

  const nomeLiga=
    ligas.find(
      x=>x[0]===ligaSelecionada
    )?.[1] ||
    "Classificação";

  if(
    !tabela.length
  ){

    box.innerHTML=
      `<div class="empty">

        <div style="font-size:28px">
          📊
        </div>

        <strong>
          Classificação indisponível
        </strong>

        <div style="margin-top:7px">
          A competição ainda não forneceu
          a tabela.
        </div>

      </div>`;

    return;

  }

  box.innerHTML=
    `<div class="tableTitle">

      ${escapeHtml(
        nomeLiga
      )}

    </div>

    ${renderTabela(tabela)}`;

}

function renderTabela(
  tabela
){

  return `
  <div class="tableWrap">

    <table class="standingsTable">

      <thead>

        <tr>

          <th>#</th>
          <th style="text-align:left">
            Equipa
          </th>
          <th>J</th>
          <th>V</th>
          <th>E</th>
          <th>D</th>
          <th>DG</th>
          <th>Pts</th>

        </tr>

      </thead>

      <tbody>

        ${tabela.map(
          (x,i)=>`

          <tr
            onclick="fzAbrirEquipa(
              '${escapeHtml(x.id)}',
              '${escapeHtml(x.nome)}',
              '${escapeHtml(x.logo)}',
              '${escapeHtml(ligaSelecionada)}'
            )">

            <td>
              ${escapeHtml(
                x.pos || i+1
              )}
            </td>

            <td class="tableTeam">

              ${
                x.logo
                  ? `<img
                       src="${escapeHtml(x.logo)}"
                       onerror="this.style.display='none'"
                       alt="">`
                  : `<span>⚽</span>`
              }

              ${escapeHtml(
                x.nome
              )}

            </td>

            <td>
              ${escapeHtml(
                x.jogados
              )}
            </td>

            <td>
              ${escapeHtml(
                x.vitorias
              )}
            </td>

            <td>
              ${escapeHtml(
                x.empates
              )}
            </td>

            <td>
              ${escapeHtml(
                x.derrotas
              )}
            </td>

            <td>
              ${escapeHtml(
                x.gd
              )}
            </td>

            <td>
              <strong>
                ${escapeHtml(
                  x.pontos
                )}
              </strong>
            </td>

          </tr>

        `
        ).join("")}

      </tbody>

    </table>

  </div>`;

}

    );

  document

    );

}

      "active",
      tipo==="futebol"
    );

    .getElementById(
