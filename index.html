<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTZONE">
<link rel="manifest" href="./manifest.json">
<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;
  --text:#F5F7FA;
  --muted:#9DAABB;
  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
  --white:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:80px;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 14px 10px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue2);
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.3px;
  margin-top:2px;
}

.sportSwitch{
  display:flex;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.sportSwitch button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 10px;
  font-weight:800;
  font-size:12px;
}

.sportSwitch button.active{
  background:var(--blue);
  color:#fff;
}

main{
  padding:14px;
}

.sectionTitle{
  font-size:16px;
  font-weight:900;
  margin:15px 0 10px;
}

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:3px;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.league{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.league.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.toolbar{
  display:flex;
  gap:8px;
  margin:12px 0;
}

.search{
  flex:1;
  min-width:0;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

.search:focus{
  border-color:var(--blue2);
}

.liveBtn{
  border:1px solid var(--red);
  background:rgba(255,64,84,.12);
  color:var(--red);
  border-radius:12px;
  padding:0 13px;
  font-weight:900;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.filter.active{
  background:var(--blue3);
  color:#fff;
  border-color:var(--blue);
}

.featured{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:5px;
}

.featured::-webkit-scrollbar{
  display:none;
}

.featureCard{
  min-width:230px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  border-radius:16px;
  padding:13px;
}

.featureLeague{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-bottom:10px;
}

.featureTeams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.teamMini{
  text-align:center;
  width:82px;
}

.teamMini img{
  width:40px;
  height:40px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px;
}

.teamMiniName{
  font-size:11px;
  font-weight:800;
  line-height:1.2;
}

.featureScore{
  font-size:19px;
  font-weight:900;
}

.matchList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.match{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
  transition:.15s;
}

.match:active{
  transform:scale(.99);
}

.matchTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-bottom:10px;
}

.statusLive{
  color:var(--red);
  font-weight:900;
}

.statusDone{
  color:var(--muted);
}

.matchBody{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  align-items:center;
  gap:6px;
}

.matchTeam{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.matchTeam.away{
  justify-content:flex-end;
  text-align:right;
}

.teamLogo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:0 0 34px;
}

.teamName{
  font-size:13px;
  font-weight:850;
  line-height:1.2;
  overflow:hidden;
  text-overflow:ellipsis;
}

.teamName.clickable{
  cursor:pointer;
  color:#fff;
}

.teamName.clickable:hover{
  color:var(--blue2);
}

.score{
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.matchBottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
}

.matchTime{
  color:var(--muted);
  font-size:11px;
}

.star{
  width:32px;
  height:32px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted);
}

.star.active{
  color:var(--yellow);
  border-color:var(--yellow);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  border:1px dashed var(--border);
  border-radius:15px;
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.error{
  background:rgba(255,64,84,.08);
  border:1px solid rgba(255,64,84,.3);
  color:#ff8c98;
  padding:12px;
  border-radius:12px;
  font-size:12px;
}

.tableWrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--panel);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:520px;
}

th,
td{
  padding:10px 8px;
  border-bottom:1px solid var(--border);
  font-size:11px;
  text-align:center;
}

th{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

td.teamCell{
  text-align:left;
  font-weight:800;
}

.tableTeam{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.tableTeam img{
  width:25px;
  height:25px;
  object-fit:contain;
}

.pos{
  width:25px;
  color:var(--muted);
}

.positive{
  color:var(--green);
}

.negative{
  color:var(--red);
}

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:flex;
  justify-content:center;
  background:rgba(3,6,11,.97);
  border-top:1px solid var(--border);
  padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));
}

.bottomNavInner{
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.navBtn{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:8px 4px;
  font-size:10px;
  font-weight:800;
}

.navBtn.active{
  background:var(--blue3);
  color:#fff;
}

.navIcon{
  display:block;
  font-size:17px;
  margin-bottom:3px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:var(--bg);
  overflow-y:auto;
  display:none;
}

.overlay.open{
  display:block;
}

.overlayHeader{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
  padding:12px 14px;
}

.back{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:#fff;
  font-size:20px;
}

.overlayTitle{
  font-size:16px;
  font-weight:900;
}

.overlayContent{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:14px;
}

.detailHero{
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px 12px;
  text-align:center;
}

.detailLeague{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin-bottom:16px;
}

.detailTeams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:8px;
}

.detailTeam{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.detailTeam img{
  width:65px;
  height:65px;
  object-fit:contain;
}

.detailTeamName{
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.detailScore{
  font-size:28px;
  font-weight:900;
}

.detailDate{
  color:var(--muted);
  font-size:11px;
  margin-top:12px;
}

.detailTabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  margin:13px 0;
}

.detailTabs::-webkit-scrollbar{
  display:none;
}

.detailTab{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
}

.detailTab.active{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
}

.detailSection{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
}

.detailSectionTitle{
  font-size:14px;
  font-weight:900;
  margin-bottom:10px;
}

.event{
  display:grid;
  grid-template-columns:45px 1fr 45px;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--border);
}

.event:last-child{
  border-bottom:0;
}

.eventTime{
  color:var(--muted);
  font-size:11px;
}

.eventText{
  font-size:12px;
  font-weight:700;
}

.eventIcon{
  text-align:center;
}

.stat{
  margin:11px 0;
}

.statHead{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:800;
}

.statBar{
  height:6px;
  background:#172331;
  border-radius:999px;
  margin-top:5px;
  overflow:hidden;
}

.statBar span{
  display:block;
  height:100%;
  background:var(--blue2);
}

.teamHero{
  display:flex;
  align-items:center;
  gap:15px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.teamHero img{
  width:72px;
  height:72px;
  object-fit:contain;
}

.teamHeroInfo{
  flex:1;
}

.teamHeroName{
  font-size:20px;
  font-weight:900;
}

.teamHeroLeague{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.teamFav{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  width:40px;
  height:40px;
  border-radius:10px;
}

.teamFav.active{
  color:var(--yellow);
  border-color:var(--yellow);
}

.rosterGroup{
  margin-top:14px;
}

.rosterGroupTitle{
  font-size:13px;
  font-weight:900;
  color:var(--blue2);
  margin-bottom:7px;
}

.playerRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 5px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.playerRow:last-child{
  border-bottom:0;
}

.playerPhoto{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:var(--panel2);
  border:1px solid var(--border);
}

.playerInfo{
  min-width:0;
  flex:1;
}

.playerName{
  font-size:12px;
  font-weight:900;
}

.playerMeta{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.playerNumber{
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}

.playerDetailHero{
  text-align:center;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.playerDetailPhoto{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--blue);
}

.playerDetailName{
  font-size:21px;
  font-weight:900;
  margin-top:10px;
}

.playerDetailMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.teamGames{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.teamGame{
  display:grid;
  grid-template-columns:1fr 65px 1fr;
  align-items:center;
  gap:7px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}

.teamGameName{
  font-size:11px;
  font-weight:800;
}

.teamGameName.right{
  text-align:right;
}

.teamGameScore{
  text-align:center;
  font-size:14px;
  font-weight:900;
}

.notice{
  background:rgba(0,87,184,.10);
  border:1px solid rgba(22,131,255,.25);
  border-radius:12px;
  padding:11px;
  color:#b9d8ff;
  font-size:11px;
  line-height:1.45;
}

.hidden{
  display:none!important;
}

@media(max-width:480px){
  .logo{
    font-size:25px;
  }

  main{
    padding:12px;
  }

  .detailTeams{
    grid-template-columns:1fr 65px 1fr;
  }

  .detailTeam img{
    width:56px;
    height:56px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div>
      <div class="logo">FUT<span>ZONE</span></div>
      <div class="subtitle">FUTEBOL EM DIRETO</div>
    </div>

    <div class="sportSwitch">
      <button id="footballBtn" class="active" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
      <button id="futsalBtn" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
    </div>
  </div>
</header>

<main id="mainContent">

  <div id="footballContent">

    <div class="sectionTitle">Competições</div>
    <div class="leagues" id="leagueList"></div>

    <div class="toolbar">
      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Pesquisar equipa..."
        oninput="renderJogos()"
      >
      <button class="liveBtn" onclick="setFiltro('live')">● LIVE</button>
    </div>

    <div class="filters">
      <button class="filter active" id="filterTodos" onclick="setFiltro('todos')">Todos</button>
      <button class="filter" id="filterLive" onclick="setFiltro('live')">Live</button>
      <button class="filter" id="filterProximos" onclick="setFiltro('proximos')">Próximos</button>
      <button class="filter" id="filterResultados" onclick="setFiltro('resultados')">Resultados</button>
    </div>

    <div class="sectionTitle">Destaques</div>
    <div class="featured" id="featuredGames"></div>

    <div class="sectionTitle" id="gamesTitle">Jogos</div>
    <div id="gamesContainer" class="matchList">
      <div class="loading">A carregar jogos...</div>
    </div>

  </div>

  <div id="futsalContent" class="hidden">

    <div class="sectionTitle">Futsal</div>

    <div class="notice">
      A área de futsal está preparada para receber os jogos e competições
      assim que existir uma fonte de dados disponível.
    </div>

    <div class="sectionTitle">Próximos jogos</div>
    <div class="empty">
      Ainda não existem dados de futsal disponíveis.
    </div>

  </div>

</main>

<nav class="bottomNav">
  <div class="bottomNavInner">
    <button class="navBtn active" id="navJogos" onclick="navegar('jogos')">
      <span class="navIcon">⚽</span>
      Jogos
    </button>

    <button class="navBtn" id="navTabelas" onclick="navegar('tabelas')">
      <span class="navIcon">📊</span>
      Tabelas
    </button>

    <button class="navBtn" id="navFav" onclick="navegar('favoritos')">
      <span class="navIcon">★</span>
      Favoritos
    </button>

    <button class="navBtn" id="navFutsal" onclick="mudarDesporto('futsal')">
      <span class="navIcon">🥅</span>
      Futsal
    </button>
  </div>
</nav>

</div>

<!-- DETALHE DO JOGO -->
<div class="overlay" id="gameOverlay">

  <div class="overlayHeader">
    <button class="back" onclick="fecharOverlay('gameOverlay')">‹</button>
    <div class="overlayTitle">Detalhe do jogo</div>
  </div>

  <div class="overlayContent" id="gameDetailContent"></div>

</div>

<!-- DETALHE DA EQUIPA -->
<div class="overlay" id="teamOverlay">

  <div class="overlayHeader">
    <button class="back" onclick="fecharOverlay('teamOverlay')">‹</button>
    <div class="overlayTitle">Equipa</div>
  </div>

  <div class="overlayContent" id="teamDetailContent"></div>

</div>

<!-- DETALHE DO JOGADOR -->
<div class="overlay" id="playerOverlay">

  <div class="overlayHeader">
    <button class="back" onclick="fecharOverlay('playerOverlay')">‹</button>
    <div class="overlayTitle">Jogador</div>
  </div>

  <div class="overlayContent" id="playerDetailContent"></div>

</div>

<script>
/* =========================================================
   FUTZONE
   Dados, competições, jogos, classificações, equipas e jogadores
   ========================================================= */

const ESPN_SITE = "https://site.api.espn.com/apis/site/v2/sports/soccer";
const ESPN_CORE = "https://sports.core.api.espn.com/v2/sports/soccer";

const ligas = [
  {id:"por.1", nome:"🇵🇹 Liga Portugal Betclic"},
  {id:"por.2", nome:"🇵🇹 Liga Portugal 2"},
  {id:"por.3", nome:"🇵🇹 Liga 3"},
  {id:"por.w.1", nome:"🇵🇹 Liga BPI Feminina"},
  {id:"eng.1", nome:"🏴 Premier League"},
  {id:"esp.1", nome:"🇪🇸 LaLiga"},
  {id:"ita.1", nome:"🇮🇹 Serie A"},
  {id:"ger.1", nome:"🇩🇪 Bundesliga"},
  {id:"fra.1", nome:"🇫🇷 Ligue 1"},
  {id:"ned.1", nome:"🇳🇱 Eredivisie"},
  {id:"bel.1", nome:"🇧🇪 Jupiler Pro League"},
  {id:"uefa.champions", nome:"⭐ Champions League"},
  {id:"uefa.europa", nome:"🏆 Europa League"},
  {id:"uefa.europa.conf", nome:"🏆 Conference League"}
];

let ligaAtual = "por.1";
let filtroAtual = "todos";
let desportoAtual = "futebol";
let jogosAtuais = [];
let tabelaAtual = [];
let jogoSelecionado = null;
let equipaSelecionada = null;

let favoritosJogos = JSON.parse(
  localStorage.getItem("futzone_jogos_favoritos") || "[]"
);

let favoritosEquipas = JSON.parse(
  localStorage.getItem("futzone_equipas_favoritas") || "[]"
);

/* =========================================================
   FALLBACK — LIGA PORTUGAL 2
   ========================================================= */

document.addEventListener("DOMContentLoaded",()=>{
  renderLigas();
  carregarJogos();
});

function renderLigas(){

  const box=document.getElementById("leagueList");

  box.innerHTML=ligas.map(l=>`
    <button
      class="league ${l.id===ligaAtual?"active":""}"
      onclick="selecionarLiga('${l.id}')">
      ${l.nome}
    </button>
  `).join("");
}

function selecionarLiga(id){

  ligaAtual=id;

  renderLigas();

  filtroAtual="todos";
  atualizarFiltros();

  carregarJogos();
}

function mudarDesporto(tipo){

  desportoAtual=tipo;

  document.getElementById("footballBtn")
    .classList.toggle("active",tipo==="futebol");

  document.getElementById("futsalBtn")
    .classList.toggle("active",tipo==="futsal");

  document.getElementById("footballContent")
    .classList.toggle("hidden",tipo!=="futebol");

  document.getElementById("futsalContent")
    .classList.toggle("hidden",tipo!=="futsal");

  document.getElementById("navFutsal")
    .classList.toggle("active",tipo==="futsal");

  if(tipo==="futebol"){
    carregarJogos();
  }
}

function setFiltro(f){

  filtroAtual=f;

  atualizarFiltros();

  renderJogos();
}

function atualizarFiltros(){

  document.querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  const id={
    todos:"filterTodos",
    live:"filterLive",
    proximos:"filterProximos",
    resultados:"filterResultados"
  }[filtroAtual];

  if(id){
    document.getElementById(id)
      ?.classList.add("active");
  }
}

async function carregarJogos(){

  if(ligaAtual==="por.2"){
    jogosAtuais=converterFallback(LIGA2_JOGOS);
    tabelaAtual=LIGA2_TABELA;
    renderJogos();
    renderDestaques();
    return;
  }

  if(ligaAtual==="por.3"){
    jogosAtuais=converterFallback(LIGA3_JOGOS);
    tabelaAtual=[
      ...LIGA3_TABELA_A.map(x=>({...x,serie:"Série A"})),
      ...LIGA3_TABELA_B.map(x=>({...x,serie:"Série B"}))
    ];
    renderJogos();
    renderDestaques();
    return;
  }

  if(ligaAtual==="por.w.1"){
    jogosAtuais=converterFallback(BPI_JOGOS);
    tabelaAtual=BPI_TABELA;
    renderJogos();
    renderDestaques();
    return;
  }

  const container=document.getElementById("gamesContainer");

  container.innerHTML=`<div class="loading">A carregar jogos...</div>`;

  try{

    const url=
      `${ESPN_SITE}/${ligaAtual}/scoreboard?limit=100`;

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("Falha ao carregar");
    }

    const data=await response.json();

    jogosAtuais=(data.events||[])
      .map(normalizarJogo)
      .filter(Boolean);

    tabelaAtual=[];

    renderJogos();
    renderDestaques();

  }catch(e){

    container.innerHTML=`
      <div class="error">
        Não foi possível carregar os jogos desta competição neste momento.
      </div>
    `;
  }
}

function converterFallback(lista){

  return lista.map((x,i)=>{

    const [date,home,away,score,time]=x;

    const isFinal=score!=="-";

    return {
      id:`fallback-${ligaAtual}-${i}-${date}`,
      date,
      home:{
        id:null,
        name:home,
        logo:logoEquipa(home)
      },
      away:{
        id:null,
        name:away,
        logo:logoEquipa(away)
      },
      homeScore:isFinal?Number(score.split("-")[0]):null,
      awayScore:isFinal?Number(score.split("-")[1]):null,
      status:{
        completed:isFinal,
        live:false,
        name:isFinal?"Final":time
      },
      league:ligaAtual
    };

  });

}

function normalizarJogo(event){

  const comp=event.competitions?.[0];

  if(!comp){
    return null;
  }

  const home=comp.competitors?.find(x=>x.homeAway==="home");
  const away=comp.competitors?.find(x=>x.homeAway==="away");

  if(!home || !away){
    return null;
  }

  const status=comp.status?.type;

  return {
    id:String(event.id),
    date:event.date,
    home:{
      id:home.team?.id||null,
      name:home.team?.displayName||home.team?.name||"Casa",
      logo:home.team?.logo||""
    },
    away:{
      id:away.team?.id||null,
      name:away.team?.displayName||away.team?.name||"Fora",
      logo:away.team?.logo||""
    },
    homeScore:home.score!==undefined?Number(home.score):null,
    awayScore:away.score!==undefined?Number(away.score):null,
    status:{
      completed:!!status?.completed,
      live:status?.state==="in",
      name:status?.shortDetail||status?.detail||""
    },
    league:ligaAtual,
    raw:event
  };

}

    "Vitória SC":"https://a.espncdn.com/i/teamlogos/soccer/500/2168.png"
  };

  return logos[nome]||"";

}

function formatarData(date){

  if(!date){
    return "";
  }

  const d=new Date(date);

  if(Number.isNaN(d.getTime())){
    return date;
  }

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  });

}

function formatarHora(date){

  if(!date){
    return "";
  }

  const d=new Date(date);

  if(Number.isNaN(d.getTime())){
    return date;
  }

  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });

}

function textoStatus(j){

  if(j.status?.live){
    return `<span class="statusLive">● AO VIVO</span>`;
  }

  if(j.status?.completed){
    return `<span class="statusDone">Final</span>`;
  }

  if(j.date){
    return formatarData(j.date)+" · "+formatarHora(j.date);
  }

  return j.status?.name||"";
}

function isFavorito(id){

  return favoritosJogos.includes(String(id));

}

function toggleFavorito(id,event){

  event?.stopPropagation();

  id=String(id);

  if(favoritosJogos.includes(id)){
    favoritosJogos=favoritosJogos.filter(x=>x!==id);
  }else{
    favoritosJogos.push(id);
  }

  localStorage.setItem(
    "futzone_jogos_favoritos",
    JSON.stringify(favoritosJogos)
  );

  renderJogos();

}

function nomeLiga(){

  return ligas.find(x=>x.id===ligaAtual)?.nome||"Futebol";

}

function renderDestaques(){

  const box=document.getElementById("featuredGames");

  const destaque=jogosAtuais
    .filter(x=>x.status?.live || !x.status?.completed)
    .slice(0,8);

  if(!destaque.length){
    box.innerHTML="";
    return;
  }

  box.innerHTML=destaque.map(j=>`

    <div class="featureCard" onclick="abrirJogo('${j.id}')">

      <div class="featureLeague">${nomeLiga()}</div>

      <div class="featureTeams">

        <div class="teamMini">
          ${j.home.logo?`<img src="${j.home.logo}" onerror="this.style.display='none'">`:""}
          <div class="teamMiniName">${j.home.name}</div>
        </div>

        <div class="featureScore">
          ${j.status.completed
            ? `${j.homeScore ?? 0} - ${j.awayScore ?? 0}`
            : "vs"}
        </div>

        <div class="teamMini">
          ${j.away.logo?`<img src="${j.away.logo}" onerror="this.style.display='none'">`:""}
          <div class="teamMiniName">${j.away.name}</div>
        </div>

      </div>

    </div>

  `).join("");

}

function renderJogos(){

  const box=document.getElementById("gamesContainer");

  const pesquisa=
    document.getElementById("searchInput")
      ?.value
      ?.trim()
      .toLowerCase()||"";

  let lista=[...jogosAtuais];

  if(filtroAtual==="live"){
    lista=lista.filter(x=>x.status?.live);
  }

  if(filtroAtual==="proximos"){
    lista=lista.filter(x=>!x.status?.completed && !x.status?.live);
  }

  if(filtroAtual==="resultados"){
    lista=lista.filter(x=>x.status?.completed);
  }

  if(pesquisa){

    lista=lista.filter(x=>
      x.home.name.toLowerCase().includes(pesquisa) ||
      x.away.name.toLowerCase().includes(pesquisa)
    );

  }

  if(!lista.length){

    box.innerHTML=`
      <div class="empty">
        Não existem jogos para mostrar neste filtro.
      </div>
    `;

    return;
  }

  box.innerHTML=lista.map(j=>`

    <div class="match" onclick="abrirJogo('${j.id}')">

      <div class="matchTop">

        <span>${nomeLiga()}</span>

        <span>${textoStatus(j)}</span>

      </div>

      <div class="matchBody">

        <div class="matchTeam">

          ${j.home.logo
            ? `<img class="teamLogo"
                    src="${j.home.logo}"
                    onerror="this.style.display='none'">`
            : ""}

          <div
            class="teamName clickable"
            onclick="event.stopPropagation();abrirEquipaPorNome('${esc(j.home.name)}','${esc(j.home.id||"")}')">
            ${j.home.name}
          </div>

        </div>

        <div class="score">

          ${
            j.status?.completed || j.status?.live
            ? `${j.homeScore ?? 0}-${j.awayScore ?? 0}`
            : "—"
          }

        </div>

        <div class="matchTeam away">

          <div
            class="teamName clickable"
            onclick="event.stopPropagation();abrirEquipaPorNome('${esc(j.away.name)}','${esc(j.away.id||"")}')">
            ${j.away.name}
          </div>

          ${j.away.logo
            ? `<img class="teamLogo"
                    src="${j.away.logo}"
                    onerror="this.style.display='none'">`
            : ""}

        </div>

      </div>

      <div class="matchBottom">

        <div class="matchTime">
          ${
            j.status?.completed
            ? "Resultado final"
            : j.status?.live
              ? "Em direto"
              : `${formatarData(j.date)} ${formatarHora(j.date)}`
          }
        </div>

        <button
          class="star ${isFavorito(j.id)?"active":""}"
          onclick="toggleFavorito('${j.id}',event)">
          ★
        </button>

      </div>

    </div>

  `).join("");

}

function esc(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}

function navegar(sec){

  document.querySelectorAll(".navBtn")
    .forEach(x=>x.classList.remove("active"));

  if(sec==="jogos"){

    document.getElementById("navJogos")
      .classList.add("active");

    document.getElementById("footballContent")
      .classList.remove("hidden");

    document.getElementById("futsalContent")
      .classList.add("hidden");

    desportoAtual="futebol";

  }

  if(sec==="tabelas"){

    document.getElementById("navTabelas")
      .classList.add("active");

    abrirTabela();

  }

  if(sec==="favoritos"){

    document.getElementById("navFav")
      .classList.add("active");

    abrirFavoritos();

  }

}

function abrirTabela(){

  const content=document.getElementById("teamDetailContent");

  content.innerHTML=renderTabela();

  document.getElementById("teamOverlay")
    .classList.add("open");

}

function renderTabela(){

  if(ligaAtual==="por.3"){

    return `

      <div class="detailSection">

        <div class="detailSectionTitle">
          Liga 3 — Série A
        </div>

        ${renderTabelaHtml(LIGA3_TABELA_A)}

      </div>

        <div class="detailSectionTitle">
          Liga 3 — Série B
        </div>

        ${renderTabelaHtml(LIGA3_TABELA_B)}

  let tabela=tabelaAtual;

  if(!tabela.length){

    return `
      <div class="empty">

      </div>
    `;

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        ${nomeLiga()}
      </div>

      ${renderTabelaHtml(tabela)}

    </div>

  `;

}

function renderTabelaHtml(tabela){

  return `

    <div class="tableWrap">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Equipa</th>
            <th>J</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>GM</th>
            <th>GS</th>
            <th>PTS</th>
          </tr>
        </thead>

        <tbody>

          ${tabela.map((x,i)=>{

            const nome=x[0];
            const pts=x[1];
            const j=x[2];
            const v=x[3];
            const e=x[4];
            const d=x[5];
            const gm=x[6];
            const gs=x[7];

            return `

              <tr>

                <td class="pos">${i+1}</td>

                <td class="teamCell">

                  <div
                    class="tableTeam"
                    onclick="abrirEquipaPorNome('${esc(nome)}','')">

                    ${logoEquipa(nome)
                      ? `<img src="${logoEquipa(nome)}">`
                      : ""}

                <td>${d}</td>

                <td><strong>${pts}</strong></td>

            `;

          }).join("")}

      </table>

    </div>

  `;

}

async function carregarDetalhesESPN(jogo){

  try{

    const response=await fetch(
      `${ESPN_SITE}/${ligaAtual}/summary?event=${jogo.id}`
    );

    if(!response.ok){
      return;
    }

    const data=await response.json();

    jogo.summary=data;

    const active=document.querySelector(
      "#gameOverlay .detailTab.active"
    );

    mostrarAbaJogo(
      "resumo",
      active,
      false
    );

  }catch(e){

    console.log("Detalhes ESPN indisponíveis",e);

  }

}

function mostrarAbaJogo(aba,button,reRender=true){

  document.querySelectorAll(
    "#gameOverlay .detailTab"
  ).forEach(x=>x.classList.remove("active"));

  button?.classList.add("active");

  const box=document.getElementById("gameTabContent");

  if(!box || !jogoSelecionado){
    return;
  }

  if(aba==="resumo"){

    box.innerHTML=`

      <div class="detailSection">

        <div class="detailSectionTitle">
          Resumo
        </div>

        ${
          jogoSelecionado.summary
          ? renderResumo(jogoSelecionado.summary)
          : `
            <div class="notice">
              As informações detalhadas deste jogo ainda
              não estão disponíveis.
            </div>
          `
        }

      </div>

    `;

    return;
  }

  if(aba==="eventos"){

    box.innerHTML=renderEventos(
      jogoSelecionado.summary
    );

    return;
  }

  if(aba==="estatisticas"){

    box.innerHTML=renderEstatisticas(
      jogoSelecionado.summary
    );

    return;
  }

  if(aba==="plantéis"){

    carregarPlanteisDoJogo();

    return;
  }

}

function renderResumo(data){

  const competitions=data?.header?.competitions||[];

  const comp=competitions[0];

  if(!comp){

    return `
      <div class="empty">
        Não existem detalhes disponíveis para este jogo.
      </div>
    `;

  }

  const venue=comp.venue?.fullName||"";

  return `

    <div class="detailSection">

      ${
        venue
        ? `
          <div class="detailSectionTitle">
            Estádio
          </div>

          <div class="notice">
            ${venue}
          </div>
        `
        : ""
      }

    </div>

  `;

}

function renderEventos(data){

  const eventos=data?.plays||[];

  if(!eventos.length){

    return `
      <div class="detailSection">

        <div class="detailSectionTitle">
          Eventos
        </div>

        <div class="empty">
          Não existem eventos disponíveis para este jogo.
        </div>

      </div>
    `;

  }

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        Eventos
      </div>

      ${eventos.map(ev=>`

        <div class="event">

          <div class="eventTime">
            ${ev.clock?.displayValue||""}
          </div>

          <div class="eventText">
            ${ev.text||ev.shortText||""}
          </div>

          <div class="eventIcon">
            ${ev.type?.text||""}
          </div>

        </div>

      `).join("")}

    </div>

  `;

}

function renderEstatisticas(data){

  const grupos=data?.boxscore?.teams||[];

  if(!grupos.length){

    return `
      <div class="detailSection">

        <div class="detailSectionTitle">
          Estatísticas
        </div>

        <div class="empty">
          Não existem estatísticas disponíveis.
        </div>

      </div>
    `;

  }

  const home=grupos.find(
    x=>x.team?.id===String(jogoSelecionado.home.id)
  )||grupos[0];

  const away=grupos.find(
    x=>x.team?.id===String(jogoSelecionado.away.id)
  )||grupos[1];

  const stats=home?.statistics||[];

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        Estatísticas
      </div>

      ${
        stats.map((s,i)=>{

          const h=Number(s.displayValue||s.value||0);
          const a=Number(
            away?.statistics?.[i]?.displayValue||
            away?.statistics?.[i]?.value||
            0
          );

          const total=h+a||1;
          const pct=Math.round((h/total)*100);

          return `

            <div class="stat">

              <div class="statHead">
                <span>${h}</span>
                <span>${s.label||s.name||""}</span>
                <span>${a}</span>
              </div>

              <div class="statBar">
                <span style="width:${pct}%"></span>
              </div>

            </div>

          `;

        }).join("")
      }

    </div>

  `;

}

  box.innerHTML=`

/* =========================================================
   OBTENÇÃO DE PLANTÉIS
   ========================================================= */

async function obterPlantel(teamId,nome){

  const urls=[

    `${ESPN_CORE}/leagues/${ligaAtual}/teams/${teamId}/roster`,

    `${ESPN_CORE}/leagues/${ligaAtual}/teams/${teamId}/roster?lang=pt`,

    `${ESPN_CORE}/teams/${teamId}/roster`,

    `${ESPN_SITE}/${ligaAtual}/teams/${teamId}/roster`

  ];

  for(const url of urls){

    try{

      const response=await fetch(url);

      if(!response.ok){
        continue;
      }

      const data=await response.json();

      const atletas=
        data?.athletes||
        data?.items||
        data?.roster?.athletes||
        data?.entries||
        [];

      if(atletas.length){

        return normalizarPlantel(
          atletas,
          teamId,
          nome
        );

      }

    }catch(e){

      console.log(
        "Fonte de plantel indisponível:",
        url
      );

    }

  }

  return null;

}

function normalizarPlantel(lista,teamId,nome){

  const jogadores=[];

  lista.forEach(item=>{

    const athlete=item.athlete||item;

    if(!athlete){
      return;
    }

    const pos=
      athlete.position?.abbreviation||
      athlete.position?.displayName||
      athlete.position?.name||
      item.position?.abbreviation||
      "";

    let grupo="Outros";

    const p=String(pos).toLowerCase();

    if(
      p.includes("goal")||
      p.includes("gk")||
      p.includes("guarda")||
      p==="g"
    ){

      grupo="Guarda-redes";

    }else if(
      p.includes("def")||
      p.includes("back")||
      p.includes("centre-back")||
      p.includes("center-back")
    ){

      grupo="Defesas";

    }else if(
      p.includes("mid")||
      p.includes("med")||
      p.includes("wing")||
      p.includes("volante")
    ){

      grupo="Médios";

    }else if(
      p.includes("for")||
      p.includes("att")||
      p.includes("striker")||
      p.includes("forward")
    ){

      grupo="Avançados";

    }

    jogadores.push({

      id:athlete.id||null,

      nome:
        athlete.displayName||
        athlete.fullName||
        athlete.shortName||
        "Jogador",

      numero:
        athlete.jersey||
        athlete.number||
        item.jersey||
        "",

      posicao:pos||"",

      foto:
        athlete.headshot?.href||
        athlete.headshot?.url||
        "",

      grupo

    });

  });

  return {
    teamId,
    nome,
    jogadores
  };

}

function renderPlantelEquipa(plantel){

  const grupos=[
    "Guarda-redes",
    "Defesas",
    "Médios",
    "Avançados",
    "Outros"
  ];

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        ${plantel.nome}
      </div>

      ${
        grupos.map(grupo=>{

          const jogadores=plantel.jogadores
            .filter(x=>x.grupo===grupo);

          if(!jogadores.length){
            return "";
          }

          return `

            <div class="rosterGroup">

              <div class="rosterGroupTitle">
                ${grupo}
              </div>

              ${jogadores.map(j=>`

                <div
                  class="playerRow"
                  onclick="abrirJogador('${esc(j.id||"")}','${esc(j.nome)}','${esc(j.posicao)}','${esc(j.foto)}')">

                  ${
                    j.foto
                    ? `<img
                        class="playerPhoto"
                        src="${j.foto}"
                        onerror="this.style.display='none'">`
                    : `<div class="playerPhoto"></div>`
                  }

                  <div class="playerInfo">

                    <div class="playerName">
                      ${j.nome}
                    </div>

                    <div class="playerMeta">
                      ${j.posicao||grupo}
                    </div>

                  </div>

                  <div class="playerNumber">
                    ${j.numero ? "#"+j.numero : ""}
                  </div>

                </div>

              `).join("")}

            </div>

          `;

        }).join("")
      }

    </div>

  `;

}

}

async function carregarPlantelEquipa(id,nome){

  const box=document.getElementById("teamRoster");

  if(!box){
    return;
  }

  let plantel=null;

  if(id){
    plantel=await obterPlantel(id,nome);
  }

  if(!plantel){

    const equipaEncontrada=await procurarEquipaESPN(nome);

    if(equipaEncontrada){

      plantel=await obterPlantel(
        equipaEncontrada.id,
        nome
      );

    }

  }

  if(!plantel){

    box.innerHTML=`

      <div class="empty">

        O plantel desta equipa não está disponível
        nesta fonte de dados.

      </div>

    `;

    return;

  }

  box.innerHTML=renderPlantelEquipa(plantel);

}

async function procurarEquipaESPN(nome){

  const tentativas=[
    `${ESPN_SITE}/${ligaAtual}/teams`,
    `${ESPN_SITE}/por.1/teams`,
    `${ESPN_SITE}/por.2/teams`,
    `${ESPN_SITE}/por.3/teams`,
    `${ESPN_SITE}/por.w.1/teams`
  ];

  for(const url of tentativas){

    try{

      const response=await fetch(url);

      if(!response.ok){
        continue;
      }

      const data=await response.json();

      const entries=
        data?.sports?.[0]?.leagues?.[0]?.teams||
        data?.teams||
        [];

      for(const item of entries){

        const team=item.team||item;

        const n=
          team?.displayName||
          team?.name||
          "";

        if(
          n.toLowerCase()===
          String(nome).toLowerCase()
        ){

          return {
            id:team.id,
            name:n
          };

        }

      }

    }catch(e){}

  }

  return null;

}

async function carregarJogosEquipa(id,nome){

  const box=document.getElementById("teamGames");

  if(!box){
    return;
  }

  let jogos=jogosAtuais.filter(x=>
    x.home.name===nome||
    x.away.name===nome||
    (id && (
      String(x.home.id)===String(id)||
      String(x.away.id)===String(id)
    ))
  );

  if(!jogos.length && id){

    try{

      const response=await fetch(
        `${ESPN_SITE}/${ligaAtual}/teams/${id}/schedule?limit=20`
      );

      if(response.ok){

        const data=await response.json();

        jogos=(data.events||[])
          .map(normalizarJogo)
          .filter(Boolean);

      }

    }catch(e){}

  }

  if(!jogos.length){

    box.innerHTML=`
      <div class="empty">
        Não existem jogos disponíveis para esta equipa.
      </div>
    `;

    return;

  }

  box.innerHTML=jogos.slice(0,15).map(j=>`

    <div
      class="teamGame"
      onclick="abrirJogo('${j.id}')">

      <div class="teamGameName">
        ${j.home.name}
      </div>

      <div class="teamGameScore">

        ${
          j.status.completed||
          j.status.live
          ? `${j.homeScore??0}-${j.awayScore??0}`
          : formatarHora(j.date)
        }

      </div>

      <div class="teamGameName right">
        ${j.away.name}
      </div>

    </div>

  `).join("");

}

function toggleEquipaFavorita(nome){

  if(favoritosEquipas.includes(nome)){

    favoritosEquipas=
      favoritosEquipas.filter(x=>x!==nome);

  }else{

    favoritosEquipas.push(nome);

  }

  localStorage.setItem(
    "futzone_equipas_favoritas",
    JSON.stringify(favoritosEquipas)
  );

  const btn=document.querySelector(
    "#teamOverlay .teamFav"
  );

  btn?.classList.toggle(
    "active",
    favoritosEquipas.includes(nome)
  );

}

async function abrirJogador(id,nome,posicao,foto){

  const overlay=document.getElementById("playerOverlay");
  const box=document.getElementById("playerDetailContent");

  overlay.classList.add("open");

  box.innerHTML=`

    <div class="playerDetailHero">

      ${
        foto
        ? `<img
            class="playerDetailPhoto"
            src="${foto}"
            onerror="this.style.display='none'">`
        : ""
      }

      <div class="playerDetailName">
        ${nome}
      </div>

      <div class="playerDetailMeta">
        ${posicao||"Jogador"}
      </div>

    </div>

    <div class="detailSection">

      <div class="detailSectionTitle">
        Informação
      </div>

      <div class="notice">

        ${
          id
          ? "Informação do jogador carregada através da fonte disponível."
          : "Não existem dados adicionais disponíveis para este jogador."
        }

      </div>

    </div>

  `;

  if(id){

    try{

      const response=await fetch(
        `${ESPN_CORE}/athletes/${id}`
      );

      if(response.ok){

        const data=await response.json();

        const info=[];

        if(data.displayName){
          info.push(`<strong>Nome:</strong> ${data.displayName}`);
        }

        if(data.age){
          info.push(`<strong>Idade:</strong> ${data.age}`);
        }

        if(data.height){
          info.push(`<strong>Altura:</strong> ${data.height}`);
        }

        if(data.weight){
          info.push(`<strong>Peso:</strong> ${data.weight}`);
        }

        if(info.length){

          box.innerHTML+=`

            <div class="detailSection">

              <div class="detailSectionTitle">
                Dados
              </div>

              <div class="notice">
                ${info.join("<br><br>")}
              </div>

            </div>

          `;

        }

      }

    }catch(e){}

  }

}
