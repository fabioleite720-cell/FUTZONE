<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>FUTZONE</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#07111f;
      color:#fff;
      padding-bottom:80px
    }

    button{
      font:inherit;
      cursor:pointer
    }

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:#07111f;
      border-bottom:1px solid #18283b;
      padding:14px 16px
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between
    }

    .logo{
      font-size:25px;
      font-weight:900;
      letter-spacing:-1px
    }

    .logo span{color:#20e878}

    .refresh{
      background:#122238;
      color:#fff;
      border:1px solid #263b55;
      border-radius:10px;
      padding:9px 12px
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:14px
    }

    .leagues{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:10px
    }

    .league-btn,.filter-btn{
      border:0;
      border-radius:20px;
      padding:9px 14px;
      white-space:nowrap;
      background:#122238;
      color:#b9c7d8
    }

    .league-btn.active,.filter-btn.active{
      background:#20e878;
      color:#06111d;
      font-weight:bold
    }

    .filters{
      display:flex;
      gap:7px;
      overflow-x:auto;
      margin-bottom:15px
    }

    .card{
      background:#0d1b2c;
      border:1px solid #1b3048;
      border-radius:16px;
      margin-bottom:12px;
      overflow:hidden
    }

    .match{
      padding:15px
    }

    .match-head{
      display:flex;
      justify-content:space-between;
      color:#8293a8;
      font-size:12px;
      margin-bottom:13px
    }

    .teams{
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:8px
    }

    .team{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
      text-align:center;
      min-width:0
    }

    .team img,.team-logo{
      width:42px;
      height:42px;
      object-fit:contain
    }

    .team-name{
      color:#fff;
      font-weight:700;
      border:0;
      background:none;
      padding:0;
      max-width:100%;
      font-size:14px
    }

    .score{
      text-align:center;
      font-size:21px;
      font-weight:900
    }

    .status{
      color:#8496aa;
      font-size:11px;
      margin-top:4px
    }

    .live{
      color:#ff4d5d;
      font-weight:bold
    }

    .section-title{
      font-size:19px;
      font-weight:900;
      margin:20px 0 10px
    }

    .table-row{
      display:grid;
      grid-template-columns:30px 1fr 40px 45px;
      align-items:center;
      gap:7px;
      padding:11px 12px;
      border-bottom:1px solid #1a2b40
    }

    .table-row:last-child{border-bottom:0}

    .table-team{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
      border:0;
      background:none;
      color:#fff;
      text-align:left;
      font-weight:700
    }

    .table-team img{
      width:28px;
      height:28px;
      object-fit:contain;
      flex:none
    }

    .muted{color:#8192a7}

    .empty{
      text-align:center;
      padding:35px 15px;
      color:#8192a7
    }

    .page{
      display:none
    }

    .page.active{display:block}

    .back{
      border:0;
      background:#122238;
      color:#fff;
      border-radius:10px;
      padding:9px 13px;
      margin-bottom:15px
    }

    .team-header{
      text-align:center;
      background:#0d1b2c;
      border:1px solid #1b3048;
      border-radius:18px;
      padding:22px 15px;
      margin-bottom:14px
    }

    .team-header img{
      width:85px;
      height:85px;
      object-fit:contain;
      margin-bottom:10px
    }

    .team-header h1{
      margin:5px 0;
      font-size:24px
    }

    .team-header p{
      margin:4px 0;
      color:#8293a8
    }

    .favorite{
      margin-top:13px;
      border:1px solid #29405a;
      background:#122238;
      color:#fff;
      border-radius:12px;
      padding:10px 16px
    }

    .favorite.on{
      background:#20e878;
      color:#06111d;
      border-color:#20e878
    }

    .mini-match{
      background:#0d1b2c;
      border:1px solid #1b3048;
      border-radius:15px;
      padding:14px;
      margin-bottom:10px
    }

    .mini-date{
      color:#8192a7;
      font-size:12px;
      margin-bottom:9px
    }

    .mini-teams{
      display:grid;
      grid-template-columns:1fr 55px 1fr;
      align-items:center;
      text-align:center;
      gap:5px
    }

    .mini-team{
      font-weight:700;
      font-size:13px
    }

    .mini-team img{
      width:32px;
      height:32px;
      object-fit:contain;
      display:block;
      margin:auto auto 5px
    }

    nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:30;
      background:#091625;
      border-top:1px solid #1b3048;
      display:flex;
      justify-content:space-around;
      padding:9px 5px calc(9px + env(safe-area-inset-bottom))
    }

    nav button{
      border:0;
      background:none;
      color:#8091a5;
      font-size:11px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px
    }

    nav button.active{color:#20e878}

    .error{
      background:#35151b;
      border:1px solid #74303b;
      color:#ff9da8;
      padding:12px;
      border-radius:12px;
      margin-bottom:12px;
      font-size:13px
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">FUT<span>ZONE</span></div>
    <button class="refresh" onclick="location.reload()">↻ Atualizar</button>
  </div>
</header>

<div class="container">

  <!-- INÍCIO -->
  <div id="homePage" class="page active">

    <div class="leagues">
      <button class="league-btn active" onclick="selecionarLiga('por',this)">🇵🇹 Portugal</button>
      <button class="league-btn" onclick="selecionarLiga('eng',this)">🏴 Inglaterra</button>
      <button class="league-btn" onclick="selecionarLiga('esp',this)">🇪🇸 Espanha</button>
      <button class="league-btn" onclick="selecionarLiga('ita',this)">🇮🇹 Itália</button>
      <button class="league-btn" onclick="selecionarLiga('ger',this)">🇩🇪 Alemanha</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="selecionarFiltro('todos',this)">Todos</button>
      <button class="filter-btn" onclick="selecionarFiltro('live',this)">🔴 LIVE</button>
      <button class="filter-btn" onclick="selecionarFiltro('proximos',this)">🕐 Próximos</button>
      <button class="filter-btn" onclick="selecionarFiltro('resultados',this)">✅ Resultados</button>
    </div>

    <div id="jogos"></div>

  </div>

  <!-- TABELA -->
  <div id="tabelaPage" class="page">
    <div class="section-title">🏆 Classificação</div>
    <div id="tabela"></div>
  </div>

  <!-- FAVORITOS -->
  <div id="favoritosPage" class="page">
    <div class="section-title">⭐ Favoritos</div>
    <div id="favoritos"></div>
  </div>

  <!-- EQUIPA -->
  <div id="equipaPage" class="page">
    <button class="back" onclick="voltarInicio()">← Voltar</button>
    <div id="equipaConteudo"></div>
  </div>

</div>

<nav>
  <button id="navInicio" class="active" onclick="abrirPagina('homePage',this)">
    🏠
    <span>Início</span>
  </button>

  <button onclick="abrirPagina('homePage',this); selecionarFiltroPorNome('todos')">
    ⚽
    <span>Jogos</span>
  </button>

  <button onclick="abrirTabela(this)">
    🏆
    <span>Tabela</span>
  </button>

  <button onclick="abrirFavoritos(this)">
    ⭐
    <span>Favoritos</span>
  </button>
</nav>

<script>

const ligas = {

  por:{
    nome:"Primeira Liga",
    jogos:"data/primeira-liga.json",
    tabela:"data/classificacao.json"
  },

  eng:{
    nome:"Premier League",
    jogos:"data/premier-league.json",
    tabela:"data/premier-league-classificacao.json"
  },

  esp:{
    nome:"La Liga",
    jogos:"data/la-liga.json",
    tabela:"data/la-liga-classificacao.json"
  },

  ita:{
    nome:"Serie A",
    jogos:"data/serie-a.json",
    tabela:"data/serie-a-classificacao.json"
  },

  ger:{
    nome:"Bundesliga",
    jogos:"data/bundesliga.json",
    tabela:"data/bundesliga-classificacao.json"
  }

};

let ligaAtual="por";
let filtroAtual="todos";
let dadosJogos={};
let dadosTabelas={};

let equipaAtual=null;

let favoritos=JSON.parse(localStorage.getItem("futzone_favoritos") || "[]");


async function carregar(){

  try{

    const promessas=Object.entries(ligas).map(async ([id,l])=>{

      const [jogos,tabela]=await Promise.all([
        fetch(l.jogos+"?v="+Date.now()).then(r=>r.json()),
        fetch(l.tabela+"?v="+Date.now()).then(r=>r.json())
      ]);

      dadosJogos[id]=jogos;
      dadosTabelas[id]=tabela;

    });

    await Promise.all(promessas);

    mostrarJogos();

  }catch(e){

    document.getElementById("jogos").innerHTML=
      '<div class="error">Não foi possível carregar os dados. Tenta atualizar a página.</div>';

  }

}


function eventosDoJSON(data){

  if(!data) return [];

  if(Array.isArray(data)) return data;

  if(Array.isArray(data.events)) return data.events;

  if(Array.isArray(data.games)) return data.games;

  if(Array.isArray(data.matches)) return data.matches;

  return [];

}


function obterCompeticao(evento){

  return evento?.competitions?.[0] || evento?.competition || {};
}


function obterEquipas(evento){

  const comp=obterCompeticao(evento);

  if(Array.isArray(comp.competitors)){

    let casa=comp.competitors.find(x=>x.homeAway==="home");
    let fora=comp.competitors.find(x=>x.homeAway==="away");

    if(!casa) casa=comp.competitors[0];
