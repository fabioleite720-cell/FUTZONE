   const lote=ligas.slice(i,i+5);await Promise.all(lote.map(async l=>{try{const d=await fetchJSON(API+encodeURIComponent(l[0])+'/scoreboard?dates='+range);(d.events||[]).forEach(e=>{e.__futzoneLiga=l[0];if(!seen.has(String(e.id))){seen.add(String(e.id));out.push(e)}})}catch(e){}}));
