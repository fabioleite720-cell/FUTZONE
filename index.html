<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --black:#03060B;
  --card:#09111C;
  --card2:#0D1724;
  --text:#F5F7FA;
  --muted:#9DAABB;
  --red:#FF4054;
  --yellow:#FFD43B;
  --green:#20D68A;
  --border:rgba(255,255,255,.08);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--black);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}
body{
  padding-bottom:82px;
}

button{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 14px 12px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}
.logo span{
  color:var(--blue2);
}
.subtitle{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  margin-top:2px;
}

.sportSwitch{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.sportBtn{
  flex:1;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:12px;
  padding:10px;
  font-weight:800;
}
.sportBtn.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue2);
}

main{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.sectionTitle{
  font-size:18px;
  font-weight:900;
  margin:12px 0;
}

.leagues{
  display:flex;
  overflow-x:auto;
  gap:8px;
  padding-bottom:5px;
  scrollbar-width:none;
}
.leagues::-webkit-scrollbar{display:none}

.leagueBtn{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
}
.leagueBtn.active{
  background:var(--blue);
  border-color:var(--blue2);
  color:#fff;
}

.liveAll{
  width:100%;
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:14px;
  padding:13px;
  font-weight:900;
  margin:12px 0;
  box-shadow:0 5px 20px rgba(255,64,84,.15);
}

.searchBox{
  width:100%;
  background:var(--card);
  color:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  outline:none;
  margin-bottom:10px;
}
.searchBox:focus{
  border-color:var(--blue2);
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:12px;
}
.filters::-webkit-scrollbar{display:none}

.filterBtn{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:800;
}
.filterBtn.active{
  background:var(--blue3);
  color:#fff;
  border-color:var(--blue2);
}

.gameList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.game{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  cursor:pointer;
}
.game:active{
  transform:scale(.99);
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.competition{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}
.gameStatus{
  font-size:10px;
  font-weight:900;
  color:var(--muted);
}
.gameStatus.live{
  color:var(--red);
}
.gameStatus.final{
  color:var(--green);
}

.teams{
  display:grid;
  grid-template-columns:1fr 62px 1fr;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:6px;
  font-size:12px;
  font-weight:800;
}
.team img{
  width:38px;
  height:38px;
  object-fit:contain;
}
.team img[src=""]{
  display:none;
}

.score{
  text-align:center;
  font-size:21px;
  font-weight:900;
}
.score small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.star{
  float:right;
  border:0;
  background:transparent;
  color:#647084;
  font-size:21px;
}
.star.active{
  color:var(--yellow);
}

.empty{
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border:1px dashed var(--border);
  padding:24px 14px;
  border-radius:16px;
  line-height:1.5;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.tableWrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}
.tableTitle{
  padding:14px;
  font-size:17px;
  font-weight:900;
  border-bottom:1px solid var(--border);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}
th,td{
  padding:9px 5px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.05);
}
th{
  color:var(--muted);
  font-size:10px;
}
td:first-child,th:first-child{
  width:30px;
}
td:nth-child(2),th:nth-child(2){
  text-align:left;
}
.clubCell{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800;
}
.clubCell img{
  width:25px;
  height:25px;
  object-fit:contain;
}
.clickable{
  cursor:pointer;
}
.clickable:active{
  background:rgba(22,131,255,.1);
}

.groupTitle{
  padding:12px;
  font-size:14px;
  font-weight:900;
  background:var(--card2);
  border-top:1px solid var(--border);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--black);
  display:none;
  overflow-y:auto;
}
.overlay.show{
  display:block;
}
.overlayHeader{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.back{
  border:0;
  background:var(--card);
  color:#fff;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:20px;
}
.overlayTitle{
  font-weight:900;
  flex:1;
}

.detail{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.detailScore{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  text-align:center;
}
.detailTeams{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
}
.detailTeam{
  font-weight:900;
  font-size:14px;
}
.detailTeam img{
  width:55px;
  height:55px;
  object-fit:contain;
  display:block;
  margin:auto auto 7px;
}
.detailScoreNum{
  font-size:31px;
  font-weight:900;
}
.detailMeta{
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:7px;
  margin:12px 0;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 11px;
  font-size:11px;
  font-weight:900;
}
.tab.active{
  background:var(--blue);
  color:#fff;
}

.infoCard{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}
.infoTitle{
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
}

.statRow{
  margin-bottom:13px;
}
.statNames{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
  font-size:11px;
}
.statNames span:last-child{
  text-align:right;
}
.statBar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
  height:7px;
  margin-top:5px;
}
.statBar div{
  background:var(--blue2);
  border-radius:5px;
}
.statBar div:last-child{
  background:#33445B;
}

.pitch{
  position:relative;
  width:100%;
  max-width:500px;
  aspect-ratio:68/105;
  margin:auto;
  border-radius:16px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      to bottom,
      #167044 0,
      #167044 9.09%,
      #176B41 9.09%,
      #176B41 18.18%
    );
  border:3px solid rgba(255,255,255,.8);
}
.pitch:before{
  content:"";
  position:absolute;
  inset:8%;
  border:2px solid rgba(255,255,255,.7);
}
.pitch:after{
  content:"";
  position:absolute;
  width:28%;
  aspect-ratio:1;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  left:36%;
  top:40%;
}
.playerDot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff;
  color:var(--blue3);
  border:3px solid var(--blue2);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:11px;
  font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.playerDot small{
  font-size:7px;
  max-width:55px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.event{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.event:last-child{
  border-bottom:0;
}
.eventTime{
  width:38px;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
}
.eventText{
  flex:1;
  font-size:12px;
  font-weight:700;
}

.playerList{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.player{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:11px;
  padding:9px;
  display:flex;
  gap:8px;
  align-items:center;
}
.playerNum{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.playerName{
  font-size:11px;
  font-weight:800;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:80;
  background:rgba(3,6,11,.97);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
}
.navBtn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 3px;
  font-size:10px;
  font-weight:900;
}
.navBtn.active{
  color:#fff;
}
.navIcon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.futsal{
  display:none;
}

.teamHero{
  text-align:center;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:12px;
}
.teamHero img{
  width:75px;
  height:75px;
  object-fit:contain;
}
.teamHero h2{
  margin:8px 0 3px;
}
.teamHero p{
  color:var(--muted);
  margin:0;
  font-size:12px;
}

.notice{
  background:rgba(255,212,59,.08);
  border:1px solid rgba(255,212,59,.2);
  color:#FFE78A;
  padding:11px;
  border-radius:12px;
  font-size:11px;
  line-height:1.45;
  margin-bottom:10px;
}

@media(min-width:700px){
  main,.detail{
    padding:20px;
  }
  .gameList{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="subtitle">FUTEBOL EM DIRETO</div>

  <div class="sportSwitch">
    <button class="sportBtn active" id="sportFootball" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
    <button class="sportBtn" id="sportFutsal" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
  </div>
</header>

<main>

  <section id="footballSection">

    <div class="sectionTitle">Competições</div>
    <div class="leagues" id="leagueList"></div>

    <button class="liveAll" onclick="mostrarTodosLive()">
      🔴 AO VIVO — TODAS AS COMPETIÇÕES
    </button>

    <input
      id="searchInput"
      class="searchBox"
      placeholder="🔎 Procurar equipa..."
      oninput="renderizarJogos()"
    >

    <div class="filters">
      <button class="filterBtn active" data-filter="todos" onclick="setFiltro('todos')">Todos</button>
      <button class="filterBtn" data-filter="live" onclick="setFiltro('live')">🔴 Ao vivo</button>
      <button class="filterBtn" data-filter="proximos" onclick="setFiltro('proximos')">Próximos</button>
      <button class="filterBtn" data-filter="resultados" onclick="setFiltro('resultados')">Resultados</button>
    </div>

    <div id="gameList" class="gameList">
      <div class="loading">A carregar jogos...</div>
    </div>

  </section>

  <section id="futsalSection" class="futsal">
    <div class="sectionTitle">Futsal</div>
    <div id="futsalContent"></div>
  </section>

</main>

<nav class="bottomNav">
  <button class="navBtn active" id="navJogos" onclick="irJogos()">
    <span class="navIcon">⚽</span>
    Jogos
  </button>
  <button class="navBtn" id="navTabelas" onclick="mostrarTabelaFutebol()">
    <span class="navIcon">📊</span>
    Tabelas
  </button>
  <button class="navBtn" id="navFav" onclick="mostrarFavoritos()">
    <span class="navIcon">⭐</span>
    Favoritos
  </button>
  <button class="navBtn" id="navLive" onclick="mostrarTodosLive()">
    <span class="navIcon">🔴</span>
    Ao vivo
  </button>
</nav>

<div class="overlay" id="overlay">
  <div class="overlayHeader">
    <button class="back" onclick="fecharOverlay()">‹</button>
    <div class="overlayTitle" id="overlayTitle">FUTZONE</div>
  </div>
  <div class="detail" id="overlayContent"></div>
</div>

<script>
const API="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const STANDINGS_API="https://site.api.espn.com/apis/v2/sports/soccer/";

const LIGAS=[
  ["por.1","🇵🇹 Liga Portugal","Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2","Portugal 2"],
  ["por.3","🇵🇹 Liga 3","Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina","Liga BPI"],
  ["eng.1","🏴 Premier League","Inglaterra"],
  ["esp.1","🇪🇸 La Liga","Espanha"],
  ["ita.1","🇮🇹 Serie A","Itália"],
  ["ger.1","🇩🇪 Bundesliga","Alemanha"],
  ["fra.1","🇫🇷 Ligue 1","França"],
  ["ned.1","🇳🇱 Eredivisie","Países Baixos"],
  ["bel.1","🇧🇪 Belgian Pro League","Bélgica"],
  ["uefa.champions","🌍 Champions League","Champions"],
  ["uefa.europa","🌍 Europa League","Europa"],
  ["uefa.europa.conf","🌍 Conference League","Conference"]
];

let ligaAtual="por.1";
let filtroAtual="todos";
let desportoAtual="futebol";
let jogosFutebol=[];
let favJogos=[];
let favEquipas=[];
let cacheJogos={};
let tabelaAtual=[];
let liveMode=false;

function escapeHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function hojeISO(offset=0){
  const d=new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10).replace(/-/g,"");
}

function formatarData(v){
  if(!v)return "";
  const d=new Date(v);
  if(isNaN(d))return "";
  return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"});
}

function horaEvento(v){
  if(!v)return "";
  const d=new Date(v);
  if(isNaN(d))return "";
  return d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
}

function nomeEquipa(t){
  return t?.displayName ||
         t?.shortDisplayName ||
         t?.name ||
         t?.team?.displayName ||
         "Equipa";
}

function logoEquipa(t){
  return t?.logo ||
         t?.team?.logo ||
         t?.team?.logos?.[0]?.href ||
         "";
}

function getCompeticao(id){
  return LIGAS.find(x=>x[0]===id);
}

function isLive(ev){
  const s=ev?.status?.type || ev?.competitions?.[0]?.status?.type;
  return !!(
    s?.state==="in" ||
    s?.name==="STATUS_IN_PROGRESS" ||
    s?.description==="In Progress" ||
    ev?.status?.type?.state==="in"
  );
}

function isFinal(ev){
  const s=ev?.status?.type || ev?.competitions?.[0]?.status?.type;
  return !!(
    s?.completed ||
    s?.state==="post" ||
    s?.name==="STATUS_FINAL" ||
    s?.description==="Final"
  );
}

async function fetchJSON(url){
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    console.warn("FUTZONE API:",url,e);
    return null;
  }
}

function desenharLigas(){
  const el=document.getElementById("leagueList");
  el.innerHTML=LIGAS.map(l=>`
    <button class="leagueBtn ${l[0]===ligaAtual?"active":""}"
      onclick="selecionarLiga('${l[0]}')">
      ${escapeHtml(l[1])}
    </button>
  `).join("");
}

function selecionarLiga(id){
  ligaAtual=id;
  liveMode=false;
  desenharLigas();
  carregarJogos();
}

function setFiltro(f){
  filtroAtual=f;
  document.querySelectorAll(".filterBtn").forEach(b=>{
    b.classList.toggle("active",b.dataset.filter===f);
  });
  renderizarJogos();
}

async function obterScoreboardLiga(liga,data){
  const url=API+liga+"/scoreboard?dates="+data;
  const j=await fetchJSON(url);
  return Array.isArray(j?.events)?j.events:[];
}

async function buscarJogosLiga(liga){
  if(cacheJogos[liga])return cacheJogos[liga];

  const lista=[];
  const seen=new Set();

  for(let i=-7;i<=35;i++){
    const eventos=await obterScoreboardLiga(liga,hojeISO(i));
    eventos.forEach(ev=>{
      if(ev?.id && !seen.has(ev.id)){
        seen.add(ev.id);
        lista.push(ev);
      }
    });
  }

  lista.sort((a,b)=>{
    const da=new Date(a?.date||0).getTime();
    const db=new Date(b?.date||0).getTime();
    return da-db;
  });

  cacheJogos[liga]=lista;
  return lista;
}

async function carregarJogos(){
  const list=document.getElementById("gameList");
  list.innerHTML='<div class="loading">A carregar jogos...</div>';

  const jogos=await buscarJogosLiga(ligaAtual);
  jogosFutebol=jogos;
  renderizarJogos();
}

function renderizarJogos(){
  const list=document.getElementById("gameList");

  let jogos=liveMode
    ? jogosFutebol.filter(isLive)
    : [...jogosFutebol];

  const termo=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();

  if(termo){
    jogos=jogos.filter(ev=>{
      const c=ev?.competitions?.[0];
      const a=c?.competitors?.[0]?.team;
      const b=c?.competitors?.[1]?.team;
      return (
        nomeEquipa(a).toLowerCase().includes(termo) ||
        nomeEquipa(b).toLowerCase().includes(termo)
      );
    });
  }

  if(!liveMode){
    if(filtroAtual==="live")jogos=jogos.filter(isLive);
    if(filtroAtual==="proximos")jogos=jogos.filter(ev=>!isFinal(ev)&&!isLive(ev));
    if(filtroAtual==="resultados")jogos=jogos.filter(isFinal);
  }

  if(!jogos.length){
    list.innerHTML=`
      <div class="empty">
        ${liveMode
          ?"Não existem jogos ao vivo neste momento."
          :"Não foram encontrados jogos para esta competição/período."}
      </div>`;
    return;
  }

  list.innerHTML=jogos.map(cartaoJogo).join("");
}

function cartaoJogo(ev){
  const c=ev?.competitions?.[0]||{};
  const comps=c?.competitors||[];
  const home=comps.find(x=>x.homeAway==="home")||comps[0]||{};
  const away=comps.find(x=>x.homeAway==="away")||comps[1]||{};

  const homeTeam=home.team||{};
  const awayTeam=away.team||{};

  const live=isLive(ev);
  const final=isFinal(ev);

  let status=horaEvento(ev.date);
  if(live)status="🔴 AO VIVO";
  if(final)status="FINAL";

  const scoreHome=home.score??"-";
  const scoreAway=away.score??"-";

  const fav=favJogos.includes(String(ev.id));

  return `
    <article class="game" onclick="abrirJogo('${escapeHtml(ev.id)}','${escapeHtml(ligaAtual)}')">
      <div class="gameTop">
        <div class="competition">${escapeHtml(getCompeticao(ligaAtual)?.[1]||"Futebol")}</div>
        <div>
          <span class="gameStatus ${live?"live":final?"final":""}">${escapeHtml(status)}</span>
          <button class="star ${fav?"active":""}"
            onclick="event.stopPropagation();toggleFavJogo('${escapeHtml(ev.id)}')">
            ${fav?"★":"☆"}
          </button>
        </div>
      </div>

      <div class="teams">
        <div class="team" onclick="event.stopPropagation();abrirEquipa('${escapeHtml(homeTeam.id||"")}','${escapeHtml(nomeEquipa(homeTeam))}','${escapeHtml(logoEquipa(homeTeam))}','${escapeHtml(ligaAtual)}')">
          <img src="${escapeHtml(logoEquipa(homeTeam))}" onerror="this.style.visibility='hidden'">
          <span>${escapeHtml(nomeEquipa(homeTeam))}</span>
        </div>

        <div class="score">
          ${escapeHtml(scoreHome)} - ${escapeHtml(scoreAway)}
          <small>${escapeHtml(formatarData(ev.date))}</small>
        </div>

        <div class="team" onclick="event.stopPropagation();abrirEquipa('${escapeHtml(awayTeam.id||"")}','${escapeHtml(nomeEquipa(awayTeam))}','${escapeHtml(logoEquipa(awayTeam))}','${escapeHtml(ligaAtual)}')">
          <img src="${escapeHtml(logoEquipa(awayTeam))}" onerror="this.style.visibility='hidden'">
          <span>${escapeHtml(nomeEquipa(awayTeam))}</span>
        </div>
      </div>
    </article>
  `;
}

function extrairTabela(data){
  const out=[];

  const standings=data?.standings||[];

  standings.forEach(group=>{
    (group?.entries||[]).forEach(entry=>{
      const team=entry?.team||{};
      const stats={};

      (entry?.stats||[]).forEach(s=>{
        if(s?.name)stats[s.name]=s.value??s.displayValue??0;
      });

      out.push({
        id:team.id||"",
        name:team.displayName||team.name||"Equipa",
        logo:team.logos?.[0]?.href||team.logo||"",
        rank:entry?.position||stats.rank||out.length+1,
        played:Number(stats.gamesPlayed??stats.gp??stats.appearances??0),
        win:Number(stats.wins??stats.w??0),
        draw:Number(stats.ties??stats.draws??stats.t??0),
        loss:Number(stats.losses??stats.l??0),
        points:Number(stats.points??stats.pts??0),
        gd:Number(stats.pointDifferential??stats.goalDifference??stats.diff??0),
        group:group?.name||""
      });
    });
  });

  return out;
}

function statVal(obj,names){
  for(const n of names){
    if(obj && obj[n]!==undefined)return obj[n];
  }
  return null;
}

function nStat(v){
  if(v===null||v===undefined)return null;
  const n=parseFloat(String(v).replace("%",""));
  return isNaN(n)?null:n;
}

function estatisticasHTML(data){
  const teams=data?.boxscore?.teams||[];

  if(teams.length<2){
    return `
      <div class="infoCard">
        <div class="infoTitle">Estatísticas</div>
        <div class="empty">Estatísticas não disponíveis.</div>
      </div>`;
  }

  const a=teams[0];
  const b=teams[1];

  const names=[
    ["Posse de bola",["possessionPct","possession"]],
    ["Remates",["shotsTotal","shots"]],
    ["Remates à baliza",["shotsOnTarget"]],
    ["Cantos",["wonCorners","corners"]],
    ["Faltas",["foulsCommitted","fouls"]],
    ["Fora de jogo",["offsides"]],
    ["Cartões amarelos",["yellowCards"]],
    ["Passes",["totalPasses"]]
  ];

  const get=(team,nms)=>{
    const arr=team?.statistics||[];
    for(const x of arr){
      if(nms.includes(x?.name)){
        return x?.displayValue??x?.value??0;
      }
    }
    return 0;
  };

  return `
    <div class="infoCard">
      <div class="infoTitle">Estatísticas</div>
      ${names.map(([label,nms])=>{
        const av=get(a,nms);
        const bv=get(b,nms);
        const an=nStat(av);
        const bn=nStat(bv);

        let ap=50,bp=50;
        if(an!==null&&bn!==null&&(an+bn)>0){
          ap=(an/(an+bn))*100;
          bp=100-ap;
        }

        return `
          <div class="statRow">
            <div class="statNames">
              <span>${escapeHtml(av)}</span>
              <b>${escapeHtml(label)}</b>
              <span>${escapeHtml(bv)}</span>
            </div>
            <div class="statBar">
              <div style="width:${ap}%"></div>
              <div style="width:${bp}%"></div>
            </div>
          </div>`;
      }).join("")}
    </div>
  `;
}

function jogadorEhTitular(a){
  return !!(
    a?.starter===true ||
    a?.starter===1 ||
    a?.isStarter===true ||
    a?.status?.type?.name==="Starter"
  );
}

function jogadorPosicao(a){
  return a?.position?.abbreviation ||
         a?.position?.displayName ||
         a?.position?.name ||
         a?.athlete?.position?.abbreviation ||
         "";
}

function numeroJogador(a){
  return a?.jersey ||
         a?.jerseyNumber ||
         a?.athlete?.jersey ||
         "";
}

function nomeJogador(a){
  return a?.athlete?.displayName ||
         a?.athlete?.fullName ||
         a?.displayName ||
         "Jogador";
}

function obterTitulares(team){
  const arr=team?.roster?.entries||
            team?.roster?.athletes||
            team?.athletes||
            [];

  return arr.filter(jogadorEhTitular);
}

function posicoesCampo(players){
  const out=[];

  const ordem={
    GK:[],
    G:[],
    DF:[],
    D:[],
    MF:[],
    M:[],
    FW:[],
    F:[],
    ST:[]
  };

  players.forEach(p=>{
    const pos=String(jogadorPosicao(p)).toUpperCase();
    if(pos.includes("GK")||pos==="G")ordem.GK.push(p);
    else if(pos.includes("DF")||pos==="D"||pos.includes("BACK"))ordem.DF.push(p);
    else if(pos.includes("MF")||pos==="M"||pos.includes("MID"))ordem.MF.push(p);
    else ordem.FW.push(p);
  });

  const add=(arr,y)=>{
    if(!arr.length)return;
    const step=100/(arr.length+1);
    arr.forEach((p,i)=>{
      out.push({
        p,
        x:step*(i+1),
        y
      });
    });
  };

  add(ordem.GK,91);
  add(ordem.DF,70);
  add(ordem.MF,47);
  add(ordem.FW,24);

  return out;
}

function campoOnze(team){
  const players=obterTitulares(team).slice(0,11);

  if(!players.length){

        <div class="empty">Onze inicial não disponível para esta equipa.</div>

  const positions=posicoesCampo(players);

  return `

      <div class="pitch">
        ${positions.map(x=>`
          <div class="playerDot" style="left:${x.x}%;top:${x.y}%">

            <small>${escapeHtml(nomeJogador(x.p))}</small>

        `).join("")}

    </div>
  `;
}

function renderDetalheTab(tab,button){
  document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));
  if(button)button.classList.add("active");

  const data=window.__FZ_DETAIL_DATA;
  const el=document.getElementById("detailTabContent");
  if(!el)return;

  if(tab==="resumo"){
    el.innerHTML=eventosHTML(data);
    return;
  }

  if(tab==="stats"){
    el.innerHTML=estatisticasHTML(data);
    return;
  }

  if(tab==="onze"){
    const teams=data?.rosters||data?.boxscore?.teams||[];
    if(!teams.length){
      el.innerHTML=`
        <div class="empty">Onze inicial não disponível.</div>`;
      return;
    }

    el.innerHTML=teams.slice(0,2).map(campoOnze).join("");
    return;
  }

  if(tab==="plantel"){
    const teams=data?.rosters||[];
    if(!teams.length){
      el.innerHTML=`
        <div class="empty">Plantéis não disponíveis.</div>`;
      return;
    }

    el.innerHTML=teams.map(listaJogadoresHTML).join("");
  }
}

    favJogos=favJogos.filter(x=>x!==id);
  }else{
    favJogos.push(id);
  }
  localStorage.setItem("futzone_jogos_favoritos",JSON.stringify(favJogos));
  renderizarJogos();
}

function toggleFavEquipa(id){
  id=String(id);

  if(favEquipas.includes(id)){
    favEquipas=favEquipas.filter(x=>x!==id);
  }else{
    favEquipas.push(id);
  }

  localStorage.setItem(
    "futzone_equipas_favoritas",
    JSON.stringify(favEquipas)
  );

  fecharOverlay();
  setTimeout(()=>{
    const el=document.getElementById("gameList");
    if(el)renderizarJogos();
  },50);

function carregarFavoritos(){
  try{
    favJogos=JSON.parse(
      localStorage.getItem("futzone_jogos_favoritos")||"[]"
    );

    favEquipas=JSON.parse(
      localStorage.getItem("futzone_equipas_favoritas")||"[]"
    );

    if(!Array.isArray(favJogos))favJogos=[];
    if(!Array.isArray(favEquipas))favEquipas=[];
  }catch(e){
    favJogos=[];
    favEquipas=[];
  }
}

function mudarDesporto(tipo){
  desportoAtual=tipo;

  document.getElementById("sportFootball")
    .classList.toggle("active",tipo==="futebol");

  document.getElementById("sportFutsal")
    .classList.toggle("active",tipo==="futsal");

  document.getElementById("footballSection").style.display=
    tipo==="futebol"?"block":"none";

  document.getElementById("futsalSection").style.display=
    tipo==="futsal"?"block":"none";

  if(tipo==="futsal"){
    renderizarFutsalCompeticoes();
  }else{
    carregarJogos();
  }
}
