<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#071326;border-bottom:1px solid #17243a;padding:14px 12px}
.logo{font-size:25px;font-weight:900}.logo span{color:#7ed957}
main{padding:12px 10px 85px;max-width:700px;margin:auto}
h2{font-size:18px;margin:15px 0 10px}

.seletor-ligas{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-bottom:15px
}
.liga-btn{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:12px 7px;
color:#fff;
text-align:center;
font-size:13px;
font-weight:bold
}
.liga-btn.active{background:#0d1b30;border-color:#3c6da8}
.liga-icon{font-size:22px;display:block;margin-bottom:5px}

.jogo{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:12px;
margin-bottom:9px;
cursor:pointer
}
.jogo-top{
display:flex;
justify-content:space-between;
color:#9ca9bb;
font-size:11px;
margin-bottom:9px
}
.equipas{
display:grid;
grid-template-columns:1fr 50px 1fr;
align-items:center;
gap:5px
}
.equipa{text-align:center;font-size:13px;font-weight:bold}
.escudo{
width:32px;
height:32px;
object-fit:contain;
display:block;
margin:0 auto 5px
}
.resultado{text-align:center;font-size:19px;font-weight:900}
.vazio{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:20px;
text-align:center;
color:#9ca9bb
}

.direto{
border:1px solid #7ed957;
background:#081a15;
border-radius:14px;
padding:12px;
margin-bottom:16px
}
.direto h2{color:#7ed957;margin-top:0}

.carrossel{
display:flex;
gap:9px;
overflow-x:auto;
padding-bottom:7px;
scrollbar-width:none
}
.carrossel::-webkit-scrollbar{display:none}
.card-mini{
min-width:190px;
max-width:190px;
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:11px;
cursor:pointer
}
.card-mini .jogo-top{font-size:10px}
.card-mini .equipas{
grid-template-columns:1fr 42px 1fr
}
.card-mini .equipa{font-size:11px}
.card-mini .escudo{width:27px;height:27px}
.card-mini .resultado{font-size:16px}

.badge-live{color:#7ed957;font-weight:bold}
.badge-final{color:#9ca9bb}
.badge-futuro{color:#75a9ff}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#071326;
border-top:1px solid #17243a;
display:flex;
z-index:30
}
.bottom button{
background:none;
border:0;
color:#9ca9bb;
font-weight:bold;
width:33%;
font-size:12px
}
.bottom button.active{color:#7ed957}

.overlay{
position:fixed;
inset:0;
background:#050b16;
z-index:50;
overflow:auto
}
.detalhe-header{
position:sticky;
top:0;
background:#071326;
border-bottom:1px solid #17243a;
padding:12px;
z-index:5
}
.voltar{
background:#0b1627;
border:1px solid #243653;
color:#fff;
border-radius:8px;
padding:8px 12px;
font-weight:bold
}
.detalhe{
max-width:700px;
margin:auto;
padding:10px 10px 35px
}

.jogo-grande{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px 10px;
margin-bottom:12px
}
.jogo-grande .equipas{
grid-template-columns:1fr 80px 1fr
}
.jogo-grande .escudo{width:55px;height:55px}
.jogo-grande .equipa{font-size:15px}
.bigscore{text-align:center;font-size:30px;font-weight:900}
.estado{text-align:center;color:#7ed957;font-size:12px;margin-top:5px}

.secao{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
margin:10px 0;
padding:12px
}
.secao h3{font-size:15px;margin:0 0 10px}

.evento{
display:flex;
gap:9px;
padding:8px 0;
border-bottom:1px solid #17243a;
font-size:13px
}
.evento:last-child{border-bottom:0}
.minuto{color:#7ed957;font-weight:bold;min-width:38px}

.stats-head,.stat-row{
display:grid;
grid-template-columns:1fr 90px 1fr;
text-align:center
}
.stats-head{font-size:12px;margin-bottom:7px}
.stat-row{
align-items:center;
border-top:1px solid #17243a;
padding:8px 0;
font-size:12px
}
.stat-row .nome{font-size:10px;color:#9ca9bb}
.stat-home{text-align:right;font-weight:bold}
.stat-away{text-align:left;font-weight:bold}

.lista-jogadores{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}
.jogador{
background:#071326;
border:1px solid #17243a;
border-radius:8px;
padding:9px;
font-size:12px
}
.jogador b{color:#7ed957;margin-right:5px}
.subtitulo{color:#9ca9bb;font-size:11px;margin:8px 0}

.tabela-wrap{overflow-x:auto}
.tabela{
width:100%;
border-collapse:collapse;
font-size:12px;
min-width:500px
}
.tabela th{
color:#9ca9bb;
font-size:10px;
padding:8px 5px;
border-bottom:1px solid #243653
}
.tabela td{
padding:9px 5px;
border-bottom:1px solid #17243a;
text-align:center
}
.tabela td:nth-child(2){text-align:left;font-weight:bold}
.pos{color:#7ed957;font-weight:bold}

.carregando{text-align:center;color:#9ca9bb;padding:20px}
.erro{color:#ff8f8f;text-align:center;padding:15px}

.secao-tabela{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:12px;
margin-top:12px
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<main id="app"></main>

<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ligas=[
{nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
{nome:"França",codigo:"fra.1",icone:"🇫🇷"},
{nome:"Países Baixos",codigo:"ned.1",icone:"🇳🇱"},
{nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
{nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}
];

let jogos=[];
let ligaSelecionada="";
let favoritos=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

function logo(u){
return u
?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`
:"<div style='height:37px'></div>";
}

function comp(j){
return j?.competitions?.[0]||{};
}

function nome(c){
return c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
"Equipa";
}

function normalizar(j,l){

let c=comp(j);
let cs=c.competitors||[];

let h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
let a=cs.find(x=>x.homeAway==="away")||cs[1]||{};

return{
id:String(j.id),
codigo:l.codigo,
liga:l.nome,
data:j.date||"",
home:{
nome:nome(h),
logo:h?.team?.logo||"",
score:h?.score??"-"
},
away:{
nome:nome(a),
logo:a?.team?.logo||"",
score:a?.score??"-"
},
estado:c?.status?.type?.shortDetail||
c?.status?.type?.detail||
c?.status?.type?.description||
"",
estadoCodigo:c?.status?.type?.state||"",
competicao:c
};
}

function botoes(){

return `<div class="seletor-ligas">
${ligas.map(l=>`
<button class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${esc(l.nome)}')">
<span class="liga-icon">${l.icone}</span>
${esc(l.nome)}
</button>
`).join("")}
</div>`;
}

async function carregarJogos(){

let todos=[];

await Promise.all(ligas.map(async l=>{

try{

let url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+encodeURIComponent(l.codigo)
+"/scoreboard?limit=100&_="+Date.now();

let r=await fetch(url);

if(!r.ok)return;

let d=await r.json();

(d.events||[]).forEach(j=>{
todos.push(normalizar(j,l));
});

}catch(e){}

}));

jogos=todos;

if(!ligaSelecionada){
ligaSelecionada="Portugal";
}

mostrarJogos();
}

function selecionarLiga(n){

ligaSelecionada=n;

if(document.getElementById("navTabelas").classList.contains("active")){
mostrarTabelaLiga(n);
}else{
mostrarJogos();
}

scrollTo(0,0);
}

function nav(id){

["navJogos","navTabelas","navFav"].forEach(x=>{
document.getElementById(x).classList.toggle("active",x===id);
});

}

function estaAoVivo(j){

let s=(j.estadoCodigo||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="in" ||
s==="live" ||
/live|ao vivo|half|intervalo|1st|2nd|extra time|penalty/.test(e);
}

function terminou(j){

let s=(j.estadoCodigo||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="post" ||
s==="final" ||
/final|finished|ft|terminou/.test(e);
}

function cartao(j){

return `
<div class="jogo" onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">
<span>${esc(j.liga)}</span>
<span class="${estaAoVivo(j)?"badge-live":terminou(j)?"badge-final":"badge-futuro"}">
${esc(j.estado)}
</span>
</div>

<div class="equipas">

<div class="equipa">
${logo(j.home.logo)}
${esc(j.home.nome)}
</div>

<div class="resultado">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

<div class="equipa">
${logo(j.away.logo)}
${esc(j.away.nome)}
</div>

</div>
</div>`;
}

function cartaoMini(j){

return `
<div class="card-mini"
onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">
<span>${esc(j.liga)}</span>
<span class="${estaAoVivo(j)?"badge-live":terminou(j)?"badge-final":"badge-futuro"}">
${esc(j.estado)}
</span>
</div>

<div class="equipas">

<div class="equipa">
${logo(j.home.logo)}
${esc(j.home.nome)}
</div>

<div class="resultado">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

<div class="equipa">
${logo(j.away.logo)}
${esc(j.away.nome)}
</div>

</div>
</div>`;
}

function mostrarJogos(){

nav("navJogos");

let liga=jogos.filter(j=>j.liga===ligaSelecionada);

let vivos=jogos.filter(estaAoVivo);

let proximos=liga.filter(j=>!estaAoVivo(j)&&!terminou(j));

let resultados=liga.filter(terminou);

app.innerHTML=`

<h2>Ligas</h2>
${botoes()}

<div class="direto">

<h2>🔴 EM DIRETO</h2>

${vivos.length
?`<div class="carrossel">${vivos.map(cartaoMini).join("")}</div>`
:`<div class="vazio">Não existem jogos a decorrer neste momento.</div>`
}

</div>

<h2>⏰ PRÓXIMOS JOGOS</h2>

${proximos.length
?`<div class="carrossel">${proximos.map(cartaoMini).join("")}</div>`
:`<div class="vazio">Não há próximos jogos disponíveis.</div>`
}

<h2>✅ RESULTADOS</h2>

${resultados.length
?`<div class="carrossel">${resultados.slice().reverse().map(cartaoMini).join("")}</div>`
:`<div class="vazio">Não há resultados disponíveis.</div>`
}

`;

}

function txt(v){

return typeof v==="object"
?(v?.displayValue??v?.value??v?.text??"")
:String(v??"");

}

function traduzirEvento(t){

let s=String(t||"");

const trocas=[
[/yellow card/gi,"Cartão amarelo"],
[/red card/gi,"Cartão vermelho"],
[/second yellow/gi,"Segundo cartão amarelo"],
[/substitution/gi,"Substituição"],
[/goal/gi,"Golo"],
[/penalty/gi,"Penálti"],
[/missed penalty/gi,"Penálti falhado"],
[/own goal/gi,"Autogolo"],
[/assist/gi,"Assistência"],
[/offside/gi,"Fora de jogo"]
];

trocas.forEach(x=>s=s.replace(x[0],x[1]));

return s;
}

function extrairEventos(d){

let out=[];
let seen=new Set();

let src=[
...(d.plays||[]),
...(d.keyEvents||[]),
...(d.scoringPlays||[])
];

for(let e of src){

let s=(
(e?.type?.text||"")+" "+
(e?.text||e?.shortText||e?.description||"")
).toLowerCase();

let t=
e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento";

if(!/goal|gol|yellow|amarelo|red|vermelho|substitut|penalty|autogol/.test(s))
continue;

let k=JSON.stringify([
e?.id,
e?.clock?.displayValue,
t
]);

if(seen.has(k))continue;

seen.add(k);

let i=
/yellow|amarelo/.test(s)?"🟨":
/red|vermelho/.test(s)?"🟥":
/substitut/.test(s)?"🔄":
"⚽";

out.push({
m:e?.clock?.displayValue||
e?.period?.displayValue||
"",
t:traduzirEvento(t),
i
});

}

return out;
}

function extrairStats(d){

let grupos=[];

function add(team,ss){

if(!team||!Array.isArray(ss))return;

let id=
team?.id||
team?.team?.id||
team?.displayName||
team?.team?.displayName;

let g=grupos.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:
team?.displayName||
team?.name||
team?.team?.displayName||
team?.team?.name||
"Equipa",
s:[]
};

grupos.push(g);
}

ss.forEach(x=>{

let n=
x?.displayName||
x?.shortDisplayName||
x?.name||
x?.label||
x?.description;

if(n){

g.s.push({
n,
v:txt(x?.displayValue??x?.value??x?.display)
});

}

});

}

(d.boxscore?.teams||[]).forEach(t=>
add(t.team||t,t.statistics||t.stats)
);

(d.header?.competitions?.[0]?.competitors||
d.competitions?.[0]?.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

(d.competitors||[]).forEach(c=>
add(c.team||c,c.statistics)
);

if(grupos.length<2)return[];

let m=new Map();

grupos.forEach((g,gi)=>{

g.s.forEach(x=>{

let k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{n:x.n,h:"-",a:"-"});

let r=m.get(k);

if(gi===0)r.h=x.v;
else if(gi===1)r.a=x.v;

});

});

return [...m.values()];
}

function extrairPlantel(d){

let gs=[];

function add(team,arr){

if(!team||!Array.isArray(arr))return;

let id=
team?.id||
team?.team?.id||
team?.displayName;

let g=gs.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:
team?.displayName||
team?.name||
team?.team?.displayName||
"Equipa",
p:[]
};

gs.push(g);
}

arr.forEach(x=>{

let a=x?.athlete||x?.player||x;

if(!a?.displayName&&!a?.fullName)return;

let n=a.displayName||a.fullName||a.shortName;

if(g.p.some(q=>q.n===n))return;

g.p.push({
n,
num:a.jersey||x.jersey||a.uniformNumber||"",
pos:
a?.position?.abbreviation||
a?.position?.displayName||
x?.position?.displayName||
"",
tit:
x.starter===true||
x.starter==="true"
});

});

}

(d.rosters||[]).forEach(r=>
add(r.team||r,r.roster||r.athletes||r.players)
);

(d.boxscore?.players||[]).forEach(g=>
add(g.team||g,g.statistics||g.athletes||g.roster||g.players)
);

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(c.team||c,c.roster||c.athletes||c.players)
);

return gs.filter(g=>g.p.length);
}

function blocoEventos(a){

return `
<div class="secao">
<h3>⚽ Golos e eventos</h3>

${a.length
?a.map(e=>`
<div class="evento">
<span class="minuto">${esc(e.m)}</span>
<span>${e.i} ${esc(e.t)}</span>
</div>
`).join("")
:`<div class="vazio">Não há golos ou eventos disponíveis.</div>`
}

</div>`;
}

function blocoStats(a){

return `
<div class="secao">
<h3>📊 Estatísticas do jogo</h3>

${a.length
?`
<div class="stats-head">
<span>Casa</span>
<span>ESTAT.</span>
<span>Fora</span>
</div>

${a.map(x=>`
<div class="stat-row">
<div class="stat-home">${esc(x.h)}</div>
<div class="nome">${esc(x.n)}</div>
<div class="stat-away">${esc(x.a)}</div>
</div>
`).join("")}
`
:`<div class="vazio">Estatísticas não disponíveis para este jogo.</div>`
}

</div>`;
}

function blocoPlantel(gs){

if(!gs.length)return"";

return `
<div class="secao">
<h3>👥 Equipas</h3>

${gs.map(g=>{

let titulares=g.p.filter(x=>x.tit);
let suplentes=g.p.filter(x=>!x.tit);

return `
<div style="margin-bottom:18px">

<b>${esc(g.nome)}</b>

${titulares.length
?`
<div class="subtitulo">🟢 TITULARES</div>
<div class="lista-jogadores">
${titulares.map(p=>`
<div class="jogador">
<b>${esc(p.num)}</b>${esc(p.n)}
${p.pos?`<small style="display:block;color:#9ca9bb">${esc(p.pos)}</small>`:""}
</div>
`).join("")}
</div>
`
:""}

${suplentes.length
?`
<div class="subtitulo">🔵 SUPLENTES</div>
<div class="lista-jogadores">
${suplentes.map(p=>`
<div class="jogador">
<b>${esc(p.num)}</b>${esc(p.n)}
${p.pos?`<small style="display:block;color:#9ca9bb">${esc(p.pos)}</small>`:""}
</div>
`).join("")}
</div>
`
:""}

</div>
`;

}).join("")}

</div>`;
}

async function abrirDetalhe(id,codigo){

let j=jogos.find(x=>x.id===id);

if(!j)return;

let o=document.createElement("div");

o.className="overlay";

o.innerHTML=`

<div class="detalhe-header">
<button class="voltar"
onclick="this.closest('.overlay').remove()">
← Voltar
</button>
</div>

<div class="detalhe">

<div class="jogo-grande">

<div class="equipas">

<div class="equipa">
${logo(j.home.logo)}
${esc(j.home.nome)}
</div>

<div>
<div class="bigscore">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

<div class="estado">
${esc(j.estado)}
</div>
</div>

<div class="equipa">
${logo(j.away.logo)}
${esc(j.away.nome)}
</div>

</div>

</div>

<div class="carregando">
A carregar golos, estatísticas e equipas...
</div>

</div>`;

document.body.appendChild(o);

try{

let r=await fetch(
"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+encodeURIComponent(codigo)
+"/summary?event="
+encodeURIComponent(id)
+"&_="+Date.now()
);

if(!r.ok)throw 0;

let d=await r.json();

o.querySelector(".detalhe").insertAdjacentHTML(
"beforeend",
blocoEventos(extrairEventos(d))+
blocoStats(extrairStats(d))+
blocoPlantel(extrairPlantel(d))
);

o.querySelector(".carregando").remove();

}catch(e){

o.querySelector(".carregando").outerHTML=`
<div class="erro">
Não foi possível carregar os dados deste jogo.
</div>`;

}

}

function mostrarFavoritos(){

nav("navFav");

async function mostrarTabelaLiga(nomeLiga){

nav("navTabelas");

ligaSelecionada=nomeLiga;

let l=ligas.find(x=>x.nome===nomeLiga);

if(!l)return;

app.innerHTML=`

<h2>🏆 Tabelas</h2>

${botoes()}

<div class="carregando">
A carregar classificação atual...
</div>

`;

try{

let r=await fetch(
"https://site.api.espn.com/apis/v2/sports/soccer/"
+encodeURIComponent(l.codigo)
+"/standings?_="+Date.now()
);

if(!r.ok)throw 0;

let d=await r.json();

let entries=[];

function procurar(obj){

if(!obj||typeof obj!=="object")return;

if(Array.isArray(obj)){

obj.forEach(procurar);
return;

}

if(
obj.team &&
(obj.stats||obj.records||obj.note)
){

entries.push(obj);

}

Object.keys(obj).forEach(k=>{
if(k!=="team")procurar(obj[k]);
});

}

procurar(d);

let unicos=[];
let ids=new Set();

entries.forEach(e=>{

let id=e.team?.id||e.team?.displayName;

if(!ids.has(String(id))){

ids.add(String(id));
unicos.push(e);

}

});

if(!unicos.length){

app.innerHTML=`

<h2>🏆 ${esc(nomeLiga)}</h2>

${botoes()}

<div class="erro">
Classificação não disponível neste momento.
</div>`;

return;

}

function stat(e,names,def="-"){

let s=(e.stats||[]).find(x=>
names.includes(
String(x.name||x.abbreviation||x.displayName).toLowerCase()
)
);

return s?.value??s?.displayValue??def;
}

let linhas=unicos.map((e,i)=>{

let v=Number(stat(e,["rank","position"],i+1));
let j=Number(stat(e,["gamesplayed","played"],0));
let vitorias=Number(stat(e,["wins","win"],0));
let empates=Number(stat(e,["ties","draws","draw"],0));
let derrotas=Number(stat(e,["losses","loss"],0));
let pts=Number(stat(e,["points","point"],0));
let dg=stat(e,["pointdifferential","differential","goaldifference"],0);

return{
pos:v||i+1,
equipa:e.team?.displayName||"Equipa",
logo:e.team?.logos?.[0]?.href||e.team?.logo||"",
j,
vitorias,
empates,
derrotas,
pts,
dg
};

});

linhas.sort((a,b)=>a.pos-b.pos);

let recentes=jogos
.filter(j=>j.liga===nomeLiga&&terminou(j))
.slice()
.reverse()
.slice(0,15);

app.innerHTML=`

<h2>🏆 ${esc(nomeLiga)}</h2>

${botoes()}

<div class="secao-tabela">

<h3>📊 Classificação atual</h3>

<div class="tabela-wrap">

<table class="tabela">

<thead>
<tr>
<th>#</th>
<th>Equipa</th>
<th>J</th>
<th>V</th>
<th>E</th>
<th>D</th>
<th>PTS</th>
<th>DG</th>
</tr>
</thead>

<tbody>

${linhas.map(x=>`

<tr>

<td class="pos">${x.pos}</td>

<td>
${x.logo?`<img src="${esc(x.logo)}"
style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:5px">`:""}
${esc(x.equipa)}
</td>

<td>${x.j}</td>
<td>${x.vitorias}</td>
<td>${x.empates}</td>
<td>${x.derrotas}</td>
<td><b>${x.pts}</b></td>
<td>${esc(x.dg)}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

</div>

<h2>⚽ Últimos resultados</h2>

${recentes.length
?`<div class="carrossel">
${recentes.map(cartaoMini).join("")}
</div>`
:`<div class="vazio">Não há resultados disponíveis.</div>`
}

`;

}

carregarJogos();

setInterval(carregarJogos,60000);

</script>

</body>
</html>
