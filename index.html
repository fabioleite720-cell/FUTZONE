function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function normalizarData(v){const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function hojeISO(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10).replaceAll("-","")}
function formatarData(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"2-digit"}):""}
function dataCurta(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"}):""}
function horaEvento(e){const d=normalizarData(e?.date);return d?d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}):"--:--"}
function nomeEquipa(t){return t?.displayName||t?.shortDisplayName||t?.name||"Equipa"}
function logoEquipa(t){return t?.logo||t?.logos?.[0]?.href||""}
function isLive(e){return e?.status?.type?.state==="in"||e?.status?.type?.name==="STATUS_IN_PROGRESS"}
function isFinal(e){return e?.status?.type?.completed===true||e?.status?.type?.state==="post"||e?.status?.type?.name==="STATUS_FINAL"}
function getCompeticao(id){return ligas.find(x=>x[0]===id)?.[1]||id}
function favoritoJogo(id){return favoritosJogos.includes(String(id))}

async function fetchJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function makeFallbackEvent(liga,row,i){const [date,home,away,hs,as]=row;const final=hs!==null&&as!==null;return {id:`fz-${liga}-${date}-${i}-${home.replace(/\W+/g,"")}`,date,name:`${home} vs ${away}`,league:{name:getCompeticao(liga)},competitions:[{league:{name:getCompeticao(liga)},competitors:[{id:`${liga}-h-${i}`,homeAway:"home",team:{displayName:home,shortDisplayName:home} ,...(final?{score:String(hs)}:{})},{id:`${liga}-a-${i}`,homeAway:"away",team:{displayName:away,shortDisplayName:away},...(final?{score:String(as)}:{})}],status:{type:{state:final?"post":"pre",completed:final}}}],__futzoneLiga:liga,__fallback:true}}
function fallbackGames(liga){return (FALLBACK[liga]?.games||[]).map((x,i)=>makeFallbackEvent(liga,x,i)).filter(e=>{const d=new Date(e.date);const now=new Date();return d>=new Date(now.getTime()-8*86400000)&&d<=new Date(now.getTime()+45*86400000)})}
async function buscarJogosLiga(liga){let eventos=[];const pedidos=[];for(let i=-7;i<=14;i++){const url=API+encodeURIComponent(liga)+"/scoreboard?dates="+hojeISO(i);pedidos.push(fetchJSON(url).then(x=>x.events||[]).catch(()=>[]))}const rs=await Promise.all(pedidos);rs.flat().forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});if(["por.2","por.3","por.w.1"].includes(liga)){const fb=fallbackGames(liga);fb.forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});if(liga==="por.w.1"&&!eventos.length)eventos=fb}eventos.sort((a,b)=>new Date(a.date)-new Date(b.date));return eventos}
function desenharLigas(){document.getElementById("leagueList").innerHTML=ligas.map(l=>`<button class="league ${l[0]===ligaAtual?"active":""}" onclick="selecionarLiga('${l[0]}')">${escapeHtml(l[1])}</button>`).join("")}

function mudarDesporto(d){desportoAtual=d;document.getElementById("btnFutebol").classList.toggle("active",d==="futebol");document.getElementById("btnFutsal").classList.toggle("active",d==="futsal");document.getElementById("footballSection").style.display=d==="futebol"?"block":"none";document.getElementById("futsalSection").classList.toggle("show",d==="futsal");if(d==="futsal")renderizarFutsalJogos()}
async function carregarJogos(){const c=document.getElementById("footballContent");c.innerHTML='<div class="loading">⏳ A carregar jogos...</div>';try{jogosFutebol=await buscarJogosLiga(ligaAtual);renderizarJogos()}catch(e){console.error(e);jogosFutebol=fallbackGames(ligaAtual);renderizarJogos()}}
function setFiltro(f){filtroAtual=f;document.querySelectorAll(".filter[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));renderizarJogos()}
function passaFiltro(e){if(filtroAtual==="live")return isLive(e);if(filtroAtual==="resultados")return isFinal(e);if(filtroAtual==="proximos")return !isFinal(e)&&!isLive(e);return true}
function renderizarJogos(){const c=document.getElementById("footballContent"),q=(document.getElementById("searchInput").value||"").trim().toLowerCase();let ev=jogosFutebol.filter(passaFiltro).filter(e=>{const cs=e.competitions?.[0]?.competitors||[];const h=cs.find(x=>x.homeAway==="home"),a=cs.find(x=>x.homeAway==="away");return !q||nomeEquipa(h?.team).toLowerCase().includes(q)||nomeEquipa(a?.team).toLowerCase().includes(q)});if(!ev.length){c.innerHTML='<div class="empty">⚽<br><br>Não existem jogos para mostrar neste filtro.</div>';return}const g={};ev.forEach(e=>{const d=new Date(e.date).toISOString().slice(0,10);(g[d]??=[]).push(e)});c.innerHTML=Object.keys(g).sort().map(d=>`<div class="dayTitle"><span>${escapeHtml(formatarData(g[d][0].date))}</span><span>${dataCurta(g[d][0].date)}</span></div>${g[d].map(cartaoJogo).join("")}`).join("")}
function cartaoJogo(e){const cs=e.competitions?.[0]?.competitors||[],h=cs.find(x=>x.homeAway==="home"),a=cs.find(x=>x.homeAway==="away"),live=isLive(e),fin=isFinal(e);let estado=live?'<span class="status live">🔴 AO VIVO</span>':fin?'<span class="status final">FINAL</span>':`<span class="status">${horaEvento(e)}</span>`;let score=live||fin?`<div class="score">${escapeHtml(h?.score??"-")} - ${escapeHtml(a?.score??"-")}</div>`:`<div class="scoreTime">${horaEvento(e)}</div>`;const id=String(e.id).replaceAll("'","");return `<div class="game" onclick="abrirJogo('${id}')"><div class="gameTop"><div class="comp">${escapeHtml(e.league?.name||getCompeticao(e.__futzoneLiga||ligaAtual))}</div>${estado}<button class="star ${favoritoJogo(e.id)?"on":""}" onclick="event.stopPropagation();toggleFavoritoJogo('${id}')">${favoritoJogo(e.id)?"★":"☆"}</button></div><div class="teams"><div class="team">${logoEquipa(h?.team)?`<img class="teamLogo" src="${escapeHtml(logoEquipa(h.team))}">`:""}<div class="teamName">${escapeHtml(nomeEquipa(h?.team))}</div></div>${score}<div class="team away"><div class="teamName">${escapeHtml(nomeEquipa(a?.team))}</div>${logoEquipa(a?.team)?`<img class="teamLogo" src="${escapeHtml(logoEquipa(a.team))}">`:""}</div></div></div>`}
function toggleFavoritoJogo(id){id=String(id);favoritosJogos=favoritosJogos.includes(id)?favoritosJogos.filter(x=>x!==id):[...favoritosJogos,id];guardarFavoritos();renderizarJogos()}
function mostrarFavoritos(){const c=document.getElementById("footballContent");document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));document.getElementById("navFav").classList.add("active");const f=jogosFutebol.filter(x=>favoritosJogos.includes(String(x.id)));c.innerHTML=f.length?f.map(cartaoJogo).join(""):'<div class="empty">⭐ Ainda não tens jogos favoritos nesta competição.</div>'}

async function mostrarTodosLive(){const c=document.getElementById("footballContent");c.innerHTML='<div class="loading">🔴 A procurar jogos ao vivo...</div>';let r=[];await Promise.all(ligas.map(async l=>{try{const d=await fetchJSON(API+encodeURIComponent(l[0])+"/scoreboard?dates="+hojeISO());(d.events||[]).filter(isLive).forEach(e=>{e.__futzoneLiga=l[0];r.push(e)})}catch(e){}}));c.innerHTML=r.length?r.map(cartaoJogo).join(""):'<div class="empty">🔴 Não existem jogos ao vivo neste momento.</div>'}
function extrairTabela(data){const out=[];function walk(o){if(!o||typeof o!=="object")return;if(Array.isArray(o))return o.forEach(walk);if(o.team&&(o.stats||o.records||o.rank))out.push(o);Object.values(o).forEach(walk)}walk(data);const m=new Map();out.forEach(x=>m.set(x.team.id||x.team.uid||x.team.displayName,x));return [...m.values()]}
function statVal(item,names){const a=item.stats||item.records||[];for(const n of names){const x=a.find(s=>s.name===n||s.abbreviation===n||s.type===n);if(x)return x.displayValue??x.value??"0"}return "0"}
function nStat(item,n){const x=parseFloat(String(statVal(item,n)).replace(",","."));return Number.isFinite(x)?x:0}
function renderTabela(t){return `<div class="detailCard"><h3>${escapeHtml(getCompeticao(ligaAtual))}</h3><div style="color:var(--muted);font-size:12px">Classificação atual</div></div><div class="tableWrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>${t.map((x,i)=>{const team=x.team||{},r=x.rank??i+1,j=nStat(x,["gamesPlayed","GP","played"]),v=nStat(x,["wins","W"]),d=nStat(x,["ties","draws","D"]),l=nStat(x,["losses","L"]),gd=statVal(x,["pointDifferential","GD","goalDifference"]),p=statVal(x,["points","PTS"]);return `<tr class="clickTeam" onclick="abrirEquipa('${encodeURIComponent(nomeEquipa(team))}')"><td class="pos">${r}</td><td><div class="teamTable">${logoEquipa(team)?`<img class="tableLogo" src="${escapeHtml(logoEquipa(team))}">`:""}<span>${escapeHtml(nomeEquipa(team))}</span></div></td><td>${j}</td><td>${v}</td><td>${d}</td><td>${l}</td><td>${escapeHtml(gd)}</td><td><strong>${escapeHtml(p)}</strong></td></tr>`}).join("")}</tbody></table></div>`}
function fallbackTable2(){return FALLBACK["por.2"].table.map((x,i)=>({rank:i+1,team:{displayName:x[0]},stats:[{name:"gamesPlayed",value:x[1]},{name:"wins",value:x[2]},{name:"ties",value:x[3]},{name:"losses",value:x[4]},{name:"goalDifference",value:x[5]-x[6]},{name:"points",value:x[7]}]}))}
function fallbackLiga3Table(group){return group.map((x,i)=>({rank:i+1,team:{displayName:x[0]},stats:[{name:"gamesPlayed",value:0},{name:"wins",value:0},{name:"ties",value:0},{name:"losses",value:0},{name:"goalDifference",value:0},{name:"points",value:x[1]}]}))}
function fallbackBpiTable(){const teams=FALLBACK["por.w.1"].teams;const pts=Object.fromEntries(teams.map(x=>[x,0]));pts["SC Braga"]=3;pts["Marítimo"]=0;pts["Sporting CP"]=3;pts["Vitória SC"]=0;return teams.sort((a,b)=>pts[b]-pts[a]).map((x,i)=>({rank:i+1,team:{displayName:x},stats:[{name:"gamesPlayed",value:(x==="SC Braga"||x==="Marítimo"||x==="Sporting CP"||x==="Vitória SC")?1:0},{name:"points",value:pts[x]}]}))}
async function mostrarTabelaFutebol(){document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));document.getElementById("navTabelas").classList.add("active");if(desportoAtual!=="futebol")mudarDesporto("futebol");const c=document.getElementById("footballContent");c.innerHTML='<div class="loading">⏳ A carregar classificação...</div>';if(ligaAtual==="por.2"){c.innerHTML=renderTabela(fallbackTable2());return}if(ligaAtual==="por.3"){c.innerHTML=`<div class="detailCard"><h3>🇵🇹 Liga 3</h3><div style="color:var(--muted);font-size:12px">Classificação por grupos</div></div><div class="detailCard"><h3>Grupo A</h3></div>${renderTabela(fallbackLiga3Table(FALLBACK["por.3"].groups.A)).replace('<div class="detailCard"><h3>🇵🇹 Liga 3</h3><div style="color:var(--muted);font-size:12px">Classificação por grupos</div></div>','')}<div class="detailCard"><h3>Grupo B</h3></div>${renderTabela(fallbackLiga3Table(FALLBACK["por.3"].groups.B)).replace('<div class="detailCard"><h3>🇵🇹 Liga 3</h3><div style="color:var(--muted);font-size:12px">Classificação por grupos</div></div>','')}`;return}if(ligaAtual==="por.w.1"){c.innerHTML=renderTabela(fallbackBpiTable())+`<div style="color:var(--muted);font-size:11px;margin:8px">Dados parciais: apenas resultados confirmados no código foram contabilizados.</div>`;return}try{const d=await fetchJSON(STANDINGS_API+encodeURIComponent(ligaAtual)+"/standings");const t=extrairTabela(d);c.innerHTML=t.length?renderTabela(t):'<div class="empty">Não foi possível obter a classificação desta competição.</div>'}catch(e){c.innerHTML='<div class="error">Não foi possível carregar a classificação.</div>'}}
async function abrirJogo(id){const e=jogosFutebol.find(x=>String(x.id)===String(id));document.getElementById("overlay").classList.add("show");if(!e){document.getElementById("overlayBody").innerHTML='<div class="empty">Jogo não encontrado.</div>';return}renderDetalheJogo(e,null);if(e.__fallback)return;try{const l=e.__futzoneLiga||ligaAtual,d=await fetchJSON(API+encodeURIComponent(l)+"/summary?event="+encodeURIComponent(e.id));renderDetalheJogo(e,d)}catch(err){console.warn(err)}}
function obterRosters(s){return s?[s.rosters,s.roster,s.boxscore?.players,s.players,s.gamepackageJSON?.rosters].find(x=>Array.isArray(x)&&x.length)||[]:[]}
function obterJogadoresEquipa(s,id){const r=obterRosters(s);for(const b of r){const bid=b.team?.id||b.teamId||b.team?.uid;if(String(bid)===String(id))return (b.roster||b.players||[]).map(x=>({...x,athlete:x.athlete||x.player||x}))}return []}
function jogadorEhTitular(j){return j.starter===true||j.starting===true||j.isStarter===true||j.starter===1||j.starter==="true"||j.status?.type==="starter"}

function posicoesCampo(js){const t=js.filter(jogadorEhTitular).slice(0,11),gr=[],df=[],mf=[],fw=[],out=[];t.forEach(j=>{const p=posicaoJogador(j).toLowerCase();if(/gk|goal|keeper|gr/.test(p))gr.push(j);else if(/df|def|back|cb|lb|rb/.test(p))df.push(j);else if(/mf|mid|mc|dm|am/.test(p))mf.push(j);else if(/fw|fwd|st|cf|att|forward/.test(p))fw.push(j);else out.push(j)});const res=[];const add=(a,y)=>a.forEach((j,i)=>res.push({jogador:j,x:a.length===1?50:15+70*i/(a.length-1),y}));add(gr,91);add(df,72);add(mf,51);add(fw,28);add(out,28);return res.slice(0,11)}
function campoOnze(h,a){const H=posicoesCampo(h),A=posicoesCampo(a);const p=(x,away)=>`<div class="pitchPlayer ${away?'away':''}" style="left:${x.x}%;top:${away?100-x.y:x.y}%"><div class="pitchPlayerDot">${escapeHtml(numeroJogador(x.jogador)||"•")}</div><div class="pitchPlayerName">${escapeHtml(nomeJogador(x.jogador))}</div></div>`;return `<div class="footballPitch"><div class="pitchHalf"></div><div class="pitchCircle"></div><div class="pitchCenter"></div><div class="pitchBox top"></div><div class="pitchBox bottom"></div><div class="pitchSmallBox top"></div><div class="pitchSmallBox bottom"></div><div class="pitchGoal top"></div><div class="pitchGoal bottom"></div>${H.map(x=>p(x,false)).join("")}${A.map(x=>p(x,true)).join("")}</div><div class="lineupLegend"><span><i class="lineupDot"></i>Casa</span><span><i class="lineupDot away"></i>Fora</span></div>`}
function estatisticasHTML(s){if(!s)return `<div class="detailCard"><h3>📊 Estatísticas</h3><div style="color:var(--muted);font-size:13px">As estatísticas detalhadas deste jogo ainda não estão disponíveis.</div></div>`;const arr=[];const add=(x,side)=>{(x||[]).forEach(v=>{if(v.name)arr.push({...v,__side:side})})};(s.boxscore?.teams||[]).forEach(t=>add(t.statistics,t.team?.homeAway));if(!arr.length)add(s.statistics);const names=[...new Set(arr.map(x=>x.name))].slice(0,20);if(!names.length)return `<div class="detailCard"><h3>📊 Estatísticas</h3><div style="color:var(--muted);font-size:13px">Sem estatísticas disponíveis.</div></div>`;return `<div class="detailCard"><h3>📊 Estatísticas</h3><div class="matchStatsGrid">${names.map(n=>{const h=arr.find(x=>x.name===n&&x.__side==='home'),a=arr.find(x=>x.name===n&&x.__side==='away');return `<div class="statRow"><div class="statTeam home">${escapeHtml(h?.displayValue??h?.value??"-")}</div><div class="statName">${escapeHtml(n)}</div><div class="statTeam">${escapeHtml(a?.displayValue??a?.value??"-")}</div></div>`}).join("")}</div></div>`}
function eventosHTML(s){const a=s?.plays||s?.commentary||[];if(!a.length)return `<div class="detailCard"><h3>📋 Eventos</h3><div style="color:var(--muted);font-size:13px">Os eventos detalhados deste jogo ainda não estão disponíveis.</div></div>`;return `<div class="detailCard"><h3>📋 Eventos</h3>${a.slice(-50).map(x=>`<div class="event"><div class="eventTime">${escapeHtml(x.clock?.displayValue||x.period?.displayValue||"")}</div><div>${escapeHtml(x.text||x.shortText||x.type?.text||"")}</div></div>`).join("")}</div>`}
function listaJogadoresHTML(js,titulo,logo,tit){const l=js.filter(j=>tit?jogadorEhTitular(j):!jogadorEhTitular(j));if(!l.length)return"";return `<div class="detailCard"><div class="teamLineupTitle">${logo?`<img src="${escapeHtml(logo)}">`:""}${escapeHtml(titulo)}</div><div class="playerList">${l.map(j=>`<div class="playerItem"><div class="playerNumber">${escapeHtml(numeroJogador(j)||"—")}</div><div class="playerInfo"><div class="playerName">${escapeHtml(nomeJogador(j))}</div><div class="playerPosition">${escapeHtml(posicaoJogador(j)||"Jogador")}</div></div></div>`).join("")}</div></div>`}
function renderDetalheJogo(e,s){const cs=e.competitions?.[0]?.competitors||[],h=cs.find(x=>x.homeAway==="home"),a=cs.find(x=>x.homeAway==="away"),live=isLive(e),fin=isFinal(e),res=live||fin?`${escapeHtml(h?.score??"-")} - ${escapeHtml(a?.score??"-")}`:horaEvento(e),jh=h?.team?.id?obterJogadoresEquipa(s,h.team.id):[],ja=a?.team?.id?obterJogadoresEquipa(s,a.team.id):[];const campo=(jh.filter(jogadorEhTitular).length||ja.filter(jogadorEhTitular).length)?`<div class="detailCard"><h3>🏟️ 11 Titular</h3>${campoOnze(jh,ja)}</div>`:`<div class="detailCard"><h3>🏟️ 11 Titular</h3><div style="color:var(--muted);font-size:13px">O 11 titular ainda não foi disponibilizado pela fonte de dados para este jogo.</div></div>`;document.getElementById("overlayBody").innerHTML=`<div class="heroGame"><div style="text-align:center;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:16px">${escapeHtml(e.league?.name||getCompeticao(e.__futzoneLiga||ligaAtual))}</div><div class="heroTeams"><div class="heroTeam">${logoEquipa(h?.team)?`<img class="heroLogo" src="${escapeHtml(logoEquipa(h.team))}">`:""}${escapeHtml(nomeEquipa(h?.team))}</div><div class="heroScore">${res}</div><div class="heroTeam">${logoEquipa(a?.team)?`<img class="heroLogo" src="${escapeHtml(logoEquipa(a.team))}">`:""}${escapeHtml(nomeEquipa(a?.team))}</div></div><div style="text-align:center;color:${live?'var(--red)':'var(--muted)'};font-size:12px;font-weight:900;margin-top:14px">${live?'🔴 AO VIVO':fin?'FINAL':formatarData(e.date)+' · '+horaEvento(e)}</div></div>${eventosHTML(s)}${estatisticasHTML(s)}${campo}${listaJogadoresHTML(jh,nomeEquipa(h?.team),logoEquipa(h?.team),true)}${listaJogadoresHTML(ja,nomeEquipa(a?.team),logoEquipa(a?.team),true)}${listaJogadoresHTML(jh,nomeEquipa(h?.team)+' — Suplentes',logoEquipa(h?.team),false)}${listaJogadoresHTML(ja,nomeEquipa(a?.team)+' — Suplentes',logoEquipa(a?.team),false)}<div class="detailCard"><h3>ℹ️ Informações</h3><div style="color:var(--muted);font-size:13px;line-height function abrirEquipa(encoded){const nome=decodeURIComponent(encoded);const jogos=jogosFutebol.filter(e=>{const c=e.competitions?.[0]?.competitors||[];return c.some(x=>nomeEquipa(x.team)===nome)});document.getElementById("overlay").classList.add("show");document.getElementById("overlayTitle").textContent=nome;document.getElementById("overlayBody").innerHTML=`<div class="heroGame"><div class="heroTeam">${escapeHtml(nome)}</div></div><div class="detailCard"><h3>📅 Jogos carregados</h3>${jogos.length?jogos.slice(0,15).map(e=>{const c=e.competitions?.[0]?.competitors||[];const h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');return `<div class="event" style="cursor:pointer" onclick="abrirJogo('${String(e.id).replaceAll("'","")}')"><div class="eventTime">${horaEvento(e)}</div><div>${escapeHtml(nomeEquipa(h?.team))} — ${escapeHtml(nomeEquipa(a?.team))}</div></div>`}).join(""):'<div style="color:var(--muted)">Sem jogos carregados.</div>'}</div>`}
