<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<title>FUTZONE PREMIUM — TESTE</title>

<style>
:root{
  --blue:#0057b8;
  --blue2:#1683ff;
  --bg:#03060b;
  --card:#0a111b;
  --card2:#0e1723;
  --line:#1c2b3d;
  --text:#f4f7fb;
  --muted:#91a0b3;
  --green:#19c37d;
  --red:#ef5350;
  --yellow:#f5c542;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:linear-gradient(135deg,#0057b8,#1683ff);
  padding:14px 12px 12px;
  box-shadow:0 3px 15px #0008;
}

.header-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:.5px;
}

.header-sub{
  margin-top:3px;
  font-size:11px;
  font-weight:700;
  opacity:.9;
}

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:10px;
  padding-bottom:80px;
}

.section{
  margin-bottom:12px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:8px 2px;
  font-size:16px;
  font-weight:900;
}

.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
  box-shadow:0 4px 14px #0004;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.loading{
  padding:18px 8px;
  text-align:center;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:3px 1px 8px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  border:1px solid #28415e;
  background:#0b1521;
  color:#dce8f5;
  border-radius:999px;
  padding:7px 11px;
  font-size:11px;
  font-weight:800;
}

.chip.active{
  background:var(--blue2);
  border-color:var(--blue2);
  color:#fff;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#07101a;
  border-top:1px solid var(--line);
}

nav button{
  border:0;
  background:transparent;
  color:#8fa1b5;
  padding:9px 3px 8px;
  font-size:10px;
  font-weight:800;
}

nav button.active{
  color:#fff;
}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
}

.badge.high{
  background:#6d263c;
  color:#fff;
}

.badge.low{
  background:#123f30;
  color:#75e6b7;
}

.hidden{
  display:none!important;
}

.err{
  color:#ff7777;
  padding:10px;
  text-align:center;
}

.team-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.team{
  min-width:0;
  font-weight:800;
}

.score{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

.suggestion{
  cursor:pointer;
}

.suggestion:active{
  transform:scale(.99);
}

.small{
  font-size:10px;
}

</style>
</head>

<body>

<header>
  <div class="header-title">FUTZONE PREMIUM</div>
  <div class="header-sub">FUTEBOL EM DIRETO</div>
</header>

<main>

  <section id="homeSection" class="section">

    <div class="section-title">
      <span>🔥 Sugestões Média Alta</span>
      <span class="badge high">5</span>
    </div>

    <div id="suggestionsHigh" class="grid">
      <div class="card loading">A preparar sugestões...</div>

    <div class="section-title">
      <span>🟢 Sugestões Média Baixa</span>

    <div id="suggestionsLow" class="grid">
      <div class="card loading">A preparar sugestões...</div>

  <section id="gamesSection" class="section hidden">

    <div class="section-title">

  <section id="newsSection" class="section hidden">

    </div>

  </section>


  <section id="favoritesSection" class="section hidden">

      </div>

  </section>

    <div class="section-title">

    </div>

    <div id="analysisBox">
      <div class="card loading">A carregar...</div>
    </div>

  </section>

</main>


<nav>

  <button id="navHome" class="active" onclick="showSection('home')">
    🏠<br>Início
  </button>

  <button id="navGames" onclick="showSection('games')">
    ⚽<br>Jogos
  </button>

  <button id="navTables" onclick="showSection('tables')">
    🏆<br>Tabelas
  </button>

  <button id="navNews" onclick="showSection('news')">
    📰<br>Notícias
  </button>

  <button id="navFav" onclick="showSection('favorites')">
    ⭐<br>Favoritos
  </button>

</nav>


<script>

const API =
  'https://site.api.espn.com/apis/site/v2/sports/soccer/';

const CORE =
  'https://sports.core.api.espn.com/v2/sports/soccer/leagues/';

const SOFA =
  'https://www.sofascore.com/api/v1';

let games = [];
let teams = {};
let current = null;
let controller = null;

const LEAGUES = [
  ['Todos','all'],
  ['Liga Portugal','por.1'],
  ['Liga 2','por.2'],
  ['Liga 3','por.3'],
  ['Liga BPI','por.w.1'],
  ['Premier League','eng.1'],
  ['Championship','eng.2'],
  ['LaLiga','esp.1'],
  ['LaLiga 2','esp.2'],
  ['Serie A','ita.1'],
  ['Serie B','ita.2'],
  ['Bundesliga','ger.1'],
  ['Ligue 1','fra.1'],
  ['Eredivisie','ned.1'],
  ['Scotland','sco.1'],
  ['Turquia','tur.1'],
  ['Arábia Saudita','ksa.1'],
  ['MLS','usa.1'],
  ['Champions League','uefa.champions'],
  ['Europa League','uefa.europa'],
  ['Conference League','uefa.europa.conf']
];

function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showSection(name){

  const sections = {
    home:'homeSection',
    games:'gamesSection',
    tables:'tablesSection',
    news:'newsSection',
    favorites:'favoritesSection',
    analysis:'analysisSection'
  };

  Object.values(sections).forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.classList.add('hidden');
  });

  const target=document.getElementById(sections[name]);
  if(target)target.classList.remove('hidden');

  document.querySelectorAll('nav button')
    .forEach(b=>b.classList.remove('active'));

  const nav={
    home:'navHome',
    games:'navGames',
    tables:'navTables',
    news:'navNews',
    favorites:'navFav'
  };

  if(nav[name]){
    document.getElementById(nav[name])
      ?.classList.add('active');
  }
}

function fmtDate(d){
  try{
    return new Date(d).toLocaleDateString(
      'pt-PT',
      {day:'2-digit',month:'2-digit',year:'numeric'}
    );
  }catch(e){
    return '';
  }
}

function completed(e){
  return !!(
    e?.status?.type?.completed===true ||
    String(e?.status?.type?.state||'').toLowerCase()==='post'
  );
}

function scoreValue(x){
  const v=x?.score?.displayValue ??
          x?.score?.value ??
          x?.score;

  const n=Number(v);

  return Number.isFinite(n)?n:null;
}

function teamFromEvent(e,home=true){

  const c=e?.competitions?.[0]?.competitors||[];

  return c.find(x =>
    home
      ? x.homeAway==='home'
      : x.homeAway==='away'
  ) || c[home?0:1] || null;
}

function teamNameFromEvent(e,home=true){
  return teamFromEvent(e,home)
    ?.team?.displayName ||
    (home?'Casa':'Fora');
}

function resultForTeam(e,teamId){

  const c=e?.competitions?.[0]?.competitors||[];

  const me=c.find(x=>String(x?.team?.id)===String(teamId));
  const op=c.find(x=>String(x?.team?.id)!==String(teamId));

  if(!me || !op)return null;

  const gf=scoreValue(me);
  const ga=scoreValue(op);

  if(gf===null || ga===null)return null;

  return {
    date:e.date,
    opponent:op?.team?.displayName||'Adversário',
    gf,
    ga,
    result:gf>ga?'V':gf===ga?'E':'D'
  };
}

async function jsonUrl(url,timeout=10000){

  try{

    const ctl=new AbortController();

    const timer=setTimeout(
      ()=>ctl.abort(),
      timeout
    );

    const r=await fetch(url,{
      signal:ctl.signal,
      cache:'no-store'
    });

    clearTimeout(timer);

    if(!r.ok)return null;

    return await r.json();

  }catch(e){
    return null;
  }
}

<script>

/* ================================
   BLOCO 2
   JOGOS + 10 SUGESTÕES
================================ */

let activeLeague='all';

async function loadLeague(league){

  activeLeague=league;

  const list=document.getElementById('gamesList');

  if(!list)return;

  list.innerHTML=
    '<div class="card loading">A carregar jogos...</div>';

  let data=null;

  try{

    if(league==='all'){

      const urls=[
        API+'scoreboard?limit=100',
        API+'scoreboard?dates='+new Date().toISOString().slice(0,10)
      ];

      for(const u of urls){

        data=await jsonUrl(u);

        if(data?.events?.length)break;
      }

    }else{

      data=await jsonUrl(
        API+league+'/scoreboard?limit=100'
      );

    }

  }catch(e){
    data=null;
  }

  const events=Array.isArray(data?.events)
    ? data.events
    : [];

  games=events;

  if(!events.length){

    list.innerHTML=`
      <div class="card">
        <div class="muted">
          Não foram encontrados jogos nesta competição neste momento.
        </div>
      </div>
    `;

    return;
  }

  renderGames(events);
}


function renderGames(events){

  const list=document.getElementById('gamesList');

  if(!list)return;

  const grouped={};

  events.forEach(e=>{

    const leagueName=
      e?.league?.name ||
      e?.competitions?.[0]?.league?.name ||
      'Futebol';

    if(!grouped[leagueName])
      grouped[leagueName]=[];

    grouped[leagueName].push(e);

  });

  let html='';

  Object.entries(grouped).forEach(
    ([league,arr])=>{

      html+=`
        <div class="section-title">
          <span>${esc(league)}</span>
        </div>
      `;

      arr.forEach(e=>{

        const h=teamFromEvent(e,true);
        const a=teamFromEvent(e,false);

        const hn=h?.team?.displayName || 'Casa';
        const an=a?.team?.displayName || 'Fora';

        const hs=scoreValue(h);
        const as=scoreValue(a);

        const finished=completed(e);

        let score='—';

        if(hs!==null && as!==null)
          score=hs+' - '+as;

        let status='';

        if(finished){

          status='<span class="badge low">FINAL</span>';

        }else if(
          String(e?.status?.type?.state||'')
            .toLowerCase()==='in'
        ){

          status='<span class="badge high">🔴 AO VIVO</span>';

        }else{

          status=
            '<span class="muted">'+
            esc(fmtDate(e.date))+
            '</span>';

        }

        html+=`
          <div class="card suggestion"
               onclick="openMatch('${esc(e.id)}')">

            <div class="team-row">

              <div class="team">
                ${esc(hn)}
              </div>

              <div class="score">
                ${esc(score)}
              </div>

              <div class="team"
                   style="text-align:right">
                ${esc(an)}
              </div>

            </div>

            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              margin-top:8px;
            ">
              <span class="small">
                ${esc(fmtDate(e.date))}
              </span>

              ${status}
            </div>

          </div>
        `;

      });

    }
  );

  list.innerHTML=html;
}


function buildLeagueChips(){

  const box=document.getElementById(
    'competitionChips'
  );

  if(!box)return;

  box.innerHTML=LEAGUES.map(
    ([name,id],i)=>`
      <button
        class="chip ${i===0?'active':''}"
        onclick="selectLeague(
          '${esc(id)}',
          this
        )">
        ${esc(name)}
      </button>
    `
  ).join('');

}


function selectLeague(id,button){

  activeLeague=id;

  document.querySelectorAll(
    '#competitionChips .chip'
  ).forEach(x=>
    x.classList.remove('active')
  );

  button?.classList.add('active');

  loadLeague(id);
}


/* =================================
   SUGESTÕES
================================= */

const FALLBACK_SUGGESTIONS=[

  ['Benfica','Sporting','Médio-Alto'],
  ['FC Porto','Braga','Médio-Alto'],
  ['Real Madrid','Barcelona','Médio-Alto'],
  ['Manchester City','Liverpool','Médio-Alto'],
  ['Bayern München','Borussia Dortmund','Médio-Alto'],

  ['Atlético Madrid','Sevilla','Médio-Baixo'],
  ['Inter','Milan','Médio-Baixo'],
  ['Arsenal','Chelsea','Médio-Baixo'],
  ['PSV','Ajax','Médio-Baixo'],
  ['Galatasaray','Fenerbahçe','Médio-Baixo']

];


function renderSuggestions(){

  const high=
    document.getElementById(
      'suggestionsHigh'
    );

  const low=
    document.getElementById(
      'suggestionsLow'
    );

  if(!high || !low)return;

  const h=FALLBACK_SUGGESTIONS
    .filter(x=>x[2]==='Médio-Alto');

  const l=FALLBACK_SUGGESTIONS
    .filter(x=>x[2]==='Médio-Baixo');


  high.innerHTML=h.map(
    (x,i)=>suggestionCard(
      x[0],
      x[1],
      x[2],
      i
    )
  ).join('');


  low.innerHTML=l.map(
    (x,i)=>suggestionCard(
      x[0],
      x[1],
      x[2],
      i+5
    )
  ).join('');

}


function suggestionCard(
  home,
  away,
  level,
  index
){

  const cls=
    level==='Médio-Alto'
      ? 'high'
      : 'low';

  return `
    <div
      class="card suggestion"
      data-suggestion="${index}"
      onclick="showSection('games')">

      <div>
        <span class="badge ${cls}">
          ${esc(level)}
        </span>
      </div>

      <div style="
        margin-top:9px;
        font-weight:900;
        line-height:1.35;
      ">
        ${esc(home)}
      </div>

      <div class="muted"
           style="margin:3px 0">
        vs
      </div>

      <div style="
        font-weight:900;
        line-height:1.35;
      ">
        ${esc(away)}
      </div>

      <div class="muted"
           style="margin-top:8px">
        Análise baseada nos dados disponíveis
      </div>

    </div>
  `;
}


/* =================================
   ABRIR JOGO
================================= */

async function openMatch(id){

  current=
    games.find(
      e=>String(e.id)===String(id)
    );

  showSection('analysis');

  const box=
    document.getElementById(
      'analysisBox'
    );

  if(!box)return;

  if(!current){

    box.innerHTML=`
      <div class="card err">
        Não foi possível encontrar este jogo.
      </div>
    `;

    return;
  }

  const home=
    teamNameFromEvent(
      current,
      true
    );

  const away=
    teamNameFromEvent(
      current,
      false
    );

  box.innerHTML=`

    <div class="card">

      <div class="team-row">

        <div class="team">
          ${esc(home)}
        </div>

        <div class="score">
          ${scoreValue(
            teamFromEvent(current,true)
          ) ?? '—'}
          -
          ${scoreValue(
            teamFromEvent(current,false)
          ) ?? '—'}
        </div>

        <div class="team"
             style="text-align:right">
          ${esc(away)}
        </div>

      </div>

      <div class="muted"
           style="
             text-align:center;
             margin-top:8px
           ">
        ${esc(fmtDate(current.date))}
      </div>

    </div>

    <div class="card">
      <div class="section-title">
        <span>📊 Informações</span>
      </div>

      <div class="muted">
        Os detalhes do jogo serão carregados
        no Bloco 3 e no Bloco 4.
      </div>
    </div>

  `;

}


/* =================================
   INICIALIZAÇÃO
================================= */

async function initBlock2(){

  buildLeagueChips();

  renderSuggestions();

  showSection('home');

  /*
     Carrega os jogos em segundo plano.
     As 10 sugestões aparecem primeiro.
  */

  setTimeout(
    ()=>loadLeague('all'),
    100
  );

}

initBlock2();

</script>
</script>
<script>

/* =========================================
   BLOCO 3
   ÚLTIMOS 5 + ONDE VER + NOTÍCIAS
========================================= */


/* ---------- SCHEDULE DA EQUIPA ---------- */

async function teamSchedule(teamId){

  if(!teamId)return [];

  const urls=[
    API+'all/teams/'+encodeURIComponent(teamId)+'/schedule?limit=100',
    API+'teams/'+encodeURIComponent(teamId)+'/schedule?limit=100'
  ];

  for(const url of urls){

    const data=await jsonUrl(url,12000);

    const events=
      data?.events ||
      data?.schedule?.events ||
      [];

    if(Array.isArray(events) && events.length)
      return events;
  }

  return [];
}


/* ---------- ÚLTIMOS 5 ---------- */

async function loadLast5(
  teamId,
  boxId,
  excludeId
){

  const box=document.getElementById(boxId);

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A procurar os últimos 5 jogos...</div>';

  if(!teamId){

    box.innerHTML=
      '<div class="muted">Equipa não identificada.</div>';

    return;
  }

  const events=
    await teamSchedule(teamId);

  const rows=[];

  events
    .filter(e=>
      String(e?.id)!==String(excludeId)
    )
    .filter(e=>completed(e))
    .sort(
      (a,b)=>
        new Date(b.date)-new Date(a.date)
    )
    .forEach(e=>{

      if(rows.length>=5)return;

      const result=
        resultForTeam(e,teamId);

      if(result)
        rows.push(result);

    });


  if(!rows.length){

    box.innerHTML=`
      <div class="muted">
        Não foi possível obter os últimos 5 jogos.
      </div>
    `;

    return;
  }


  box.innerHTML=rows.map(r=>{

    let label='Derrota';

    if(r.result==='V')
      label='Vitória';

    if(r.result==='E')
      label='Empate';

    const cls=
      r.result==='V'
        ? 'v'
        : r.result==='E'
          ? 'e'
          : 'd';

    return `
      <div class="card"
           style="margin-top:6px">

        <div class="muted">
          ${esc(fmtDate(r.date))}
        </div>

        <div class="team-row"
             style="margin-top:5px">

          <span class="team">
            ${esc(r.opponent)}
          </span>

          <b>
            ${r.gf} - ${r.ga}
          </b>

        </div>

        <div style="margin-top:5px">
          <span class="badge ${
            cls==='v'
              ? 'low'
              : cls==='e'
                ? ''
                : 'high'
          }">
            ${label}
          </span>
        </div>

      </div>
    `;

  }).join('');

}


/* ---------- ONDE VER ---------- */

async function loadWatch(e){

  const box=
    document.getElementById(
      'watchBox'
    );

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A procurar transmissão...</div>';


  const list=[];

  function add(item){

    if(!item)return;

    const names=[];

    if(Array.isArray(item.names))
      names.push(...item.names);

    if(item.name)
      names.push(item.name);

    if(item.media?.shortName)
      names.push(item.media.shortName);

    if(item.station?.name)
      names.push(item.station.name);

    const name=
      [...new Set(
        names.filter(Boolean)
      )].join(' / ');

    if(!name)return;

    const url=
      item.url ||
      item.links?.web?.href ||
      item.market?.url ||
      '';

    if(!list.some(
      x=>x.name===name
    )){
      list.push({
        name,
        url
      });
    }

  }


  /*
     Primeiro tenta os dados já presentes
     no evento.
  */

  const comp=
    e?.competitions?.[0];

  if(Array.isArray(comp?.broadcasts))
    comp.broadcasts.forEach(add);

  if(Array.isArray(comp?.geoBroadcasts))
    comp.geoBroadcasts.forEach(add);


  /*

  const summaryUrl=
    API+
    'summary?event='+
    encodeURIComponent(e.id);

  const data=
    await jsonUrl(
      summaryUrl,
      12000
    );

  if(Array.isArray(data?.broadcasts))
    data.broadcasts.forEach(add);

  if(Array.isArray(
    data?.header?.competitions?.[0]?.broadcasts
  )){
    data.header
      .competitions[0]

      .forEach(add);

  if(!list.length){

/* ---------- TRADUÇÃO ---------- */

async function translatePT(text){

  if(!text)return '';

  try{

    const url=
      'https://translate.googleapis.com/' +
      'translate_a/single?client=gtx' +
      '&sl=auto&tl=pt&dt=t&q=' +
      encodeURIComponent(text);

    const data=
      await jsonUrl(url,10000);

    if(Array.isArray(data?.[0])){

      return data[0]
        .map(x=>x?.[0]||'')
        .join('');

    }

  }catch(e){}

  return text;
}

async function loadNews(){

  const box=
    document.getElementById(
      'newsList'
    );

  if(!box)return;

  box.innerHTML=
    '<div class="card loading">A carregar notícias...</div>';


  /*
     ESPN disponibiliza notícias gerais
     através do endpoint news.
  */

  const urls=[
    API+'news',
    API+'news?limit=20'
  ];

  let articles=[];

  for(const url of urls){

    const data=
      await jsonUrl(url,12000);

    const arr=
      data?.articles ||
      data?.news ||
      [];

    if(Array.isArray(arr) && arr.length){

      articles=arr;
      break;

    }

  }


  if(!articles.length){

    box.innerHTML=`
      <div class="card">
        <div class="muted">
          Não foi possível carregar as notícias.
        </div>
      </div>
    `;

    return;
  }


  articles=articles.slice(0,15);


  /*
     Mostra primeiro o conteúdo original
     para não deixar a página vazia enquanto
     a tradução é feita.
  */

  box.innerHTML=
    articles.map((x,i)=>{

      const title=
        x?.headline ||
        x?.title ||
        'Notícia';

      const desc=
        x?.description ||
        x?.summary ||
        '';

      const link=
        x?.links?.web?.href ||
        x?.link ||
        '';

      return `
        <div class="card">

          <div
            id="newsTitle${i}"
            style="
              font-weight:900;
              line-height:1.35;
            ">
            ${esc(title)}
          </div>

          ${
            desc
              ? `
                <div
                  id="newsDesc${i}"
                  class="muted"
                  style="
                    margin-top:7px;
                    line-height:1.45;
                  ">
                  ${esc(desc)}
                </div>
              `
              : ''
          }

          ${
            link
              ? `
                <div style="margin-top:8px">
                  <a
                    href="${esc(link)}"
                    target="_blank"
                    rel="noopener"
                    style="
                      color:#58a6ff;
                      font-size:11px;
                      font-weight:800;
                      text-decoration:none;
                    ">
                    Ler notícia
                  </a>
                </div>
              `
              : ''
          }

        </div>
      `;

    }).join('');


  /*
     Tradução artigo a artigo.
  */

  for(
    let i=0;
    i<articles.length;
    i++
  ){

    const x=articles[i];

    const title=
      x?.headline ||
      x?.title ||
      '';

    const desc=
      x?.description ||
      x?.summary ||
      '';


    if(title){

      const translated=
        await translatePT(title);

      const el=
        document.getElementById(
          'newsTitle'+i
        );

      if(el)
        el.textContent=translated;

    }


    if(desc){

      const translated=
        await translatePT(desc);

      const el=
        document.getElementById(
          'newsDesc'+i
        );

      if(el)
        el.textContent=translated;

    }

  }

}

async function loadIncidents4(e){

  const box=
    document.getElementById('incidentsBox');

  if(!box)return;

  const data=
    await getMatchSummary(e.id);

    data?.incidents || [];

     !incidents.length){

    box.innerHTML=
      '<div class="muted">Não existem acontecimentos disponíveis.</div>';

    return;
  }

  const useful=incidents.filter(x=>{

    const type=
      String(
        x?.type?.text ||
        x?.type?.name ||
        ''
      ).toLowerCase();

    return (
      x?.isGoal===true ||
      x?.goal===true ||
      type.includes('goal') ||
      type.includes('card') ||
      type.includes('substitution') ||
      type.includes('sub')
    );

  });


  if(!useful.length){

    box.innerHTML=
      '<div class="muted">Não existem acontecimentos disponíveis.</div>';

    return;
  }


  box.innerHTML=useful.map(x=>{

    const minute=
      x?.clock?.displayValue ||
      x?.time?.displayValue ||
      x?.minute ||
      '';

    const athlete=
      x?.athlete?.displayName ||
      x?.athletes?.[0]?.displayName ||
      '';

    const assist=
      x?.assist?.displayName ||
      x?.assist?.athlete?.displayName ||
      '';

    const type=
      String(
        x?.type?.text ||
        x?.type?.name ||
        ''
      ).toLowerCase();


    let label='Acontecimento';
    let icon='•';

    if(
      x?.isGoal===true ||
      x?.goal===true ||
      type.includes('goal')
    ){

      label='Golo';
      icon='⚽';

    }else if(type.includes('yellow')){

      label='Cartão amarelo';
      icon='🟨';

    }else if(type.includes('red')){

      label='Cartão vermelho';
      icon='🟥';

    }else if(
      type.includes('substitution') ||
      type.includes('sub')
    ){

      label='Substituição';
      icon='🔄';

    }


    let extra='';

    if(
      label==='Golo' &&
      assist
    ){

      extra=
        '<div class="muted">Assistência: '+
        esc(assist)+
        '</div>';

    }


    return `

async function loadStatistics4(e){

  const box=
    document.getElementById('statsBox');

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A carregar estatísticas...</div>';

  const data=
    await getMatchSummary(e.id);

  const comp=
    data?.boxscore?.teams ||
    data?.boxscore?.teamStats ||
    [];

  if(!Array.isArray(comp) || !comp.length){

    box.innerHTML=
      '<div class="muted">Estatísticas não disponíveis.</div>';

    return;
  }


  const rows=[];


  comp.forEach(t=>{

    const team=
      t?.team?.displayName ||
      t?.displayName ||
      '';

    const stats=
      t?.statistics ||
      t?.stats ||
      [];

    const obj={};

    if(Array.isArray(stats)){

      stats.forEach(s=>{

        const name=
          String(
            s?.name ||
            s?.label ||
            ''
          ).toLowerCase();

        obj[name]=
          s?.displayValue ??
          s?.value ??
          '';

      });

    }


    rows.push({
      team,
      stats:obj
    });

  });


  if(!rows.length){

    box.innerHTML=
      '<div class="muted">Estatísticas não disponíveis.</div>';

    return;
  }


  const keys=[
    ['shots','Remates'],
    ['shotsontarget','Remates à baliza'],
    ['possession','Posse'],
    ['corners','Cantos'],
    ['fouls','Faltas'],
    ['yellowcards','Cartões amarelos'],
    ['redcards','Cartões vermelhos']
  ];


  let html=`
    <div style="
      display:grid;
      gap:8px;
    ">
  `;


  keys.forEach(([key,label])=>{

    const values=
      rows.map(r=>{

        const found=
          Object.keys(r.stats)
            .find(k=>k.replace(/[\s_-]/g,'')
              .includes(key));

        return found
          ? r.stats[found]
          : '—';

      });


    html+=`
      <div class="card"
           style="margin:0">

        <div style="
          display:grid;
          grid-template-columns:1fr auto 1fr;
          gap:8px;
          align-items:center;
        ">

          <div style="
            font-weight:800;
          ">
            ${esc(values[0] ?? '—')}
          </div>

          <div class="muted"
               style="text-align:center">
            ${esc(label)}
          </div>

          <div style="
            font-weight:800;
            text-align:right;
          ">
            ${esc(values[1] ?? '—')}
          </div>

        </div>

      </div>
    `;

  });


  html+='</div>';

  box.innerHTML=html;

}

            `
            : ''
        }

      </div>

    </div>

  `;

}
