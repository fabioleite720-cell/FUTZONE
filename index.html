<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<title>FUTZONE PREMIUM</title>

<style>
:root{
  --blue:#0057b8;
  --blue2:#1683ff;
  --bg:#03060b;
  --card:#0a111b;
  --card2:#101a28;
  --green:#20d68a;
  --red:#ff4054;
  --yellow:#ffd43b;
  --text:#f5f7fb;
  --muted:#8d9aaa;
  --line:#1b2635;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{min-height:100vh}

button{
  border:0;
  color:#fff;
  cursor:pointer;
  font-weight:700;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(3,6,11,.96);
  border-bottom:1px solid var(--line);
  padding:14px 12px 10px;
  backdrop-filter:blur(10px);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span{color:var(--blue2)}
.subtitle{
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  margin-top:2px;
}

.nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-top:12px;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
}
.nav button.active{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border-color:var(--blue2);
}

main{
  width:min(1100px,100%);
  margin:auto;
  padding:12px;
}

.section{
  margin-bottom:16px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:8px 0 10px;
}
.section-title h2{
  margin:0;
  font-size:18px;
}
.section-title small{
  color:var(--muted);
}

.quick{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
}
.quick::-webkit-scrollbar{display:none}
.quick button{
  flex:0 0 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 11px;
  font-size:11px;
}

.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 7px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  background:#0b1521;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  font-size:11px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
}

.suggestion{
  min-height:150px;
  cursor:pointer;
}
.suggestion .level{
  font-size:11px;
  margin-bottom:8px;
}
.mediumHigh{color:#ffad42}
.mediumLow{color:var(--green)}

.matchline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  font-size:12px;
  font-weight:800;
}
.matchline .vs{
  color:var(--muted);
  font-size:10px;
}
.comp{
  color:var(--muted);
  font-size:10px;
  margin-top:8px;
}
.market{
  margin-top:9px;
  font-size:13px;
}

.game-card{
  cursor:pointer;
}
.game-card .teams{
  font-size:13px;
  line-height:1.45;
}
.game-card .status{
  margin-top:7px;
  font-size:10px;
  color:var(--muted);
}
.live{
  color:var(--red)!important;
  font-weight:900;
}

.team-head{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  align-items:center;
  gap:8px;
  text-align:center;
}
.team{
  cursor:pointer;
  min-width:0;
}
.team img{
  width:48px;
  height:48px;
  object-fit:contain;
  display:block;
  margin:auto;
}
.team .flag{
  width:48px;
  height:32px;
  object-fit:cover;
  border-radius:4px;
  margin:8px auto 4px;
}
.team-name{
  display:block;
  margin-top:7px;
  font-size:13px;
  font-weight:900;
  line-height:1.2;
  word-break:break-word;
}
.score{
  font-size:21px;
  font-weight:900;
}
.scoreStatus{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

.analysis-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}

.analysis-row{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid var(--line);
}
.analysis-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.analysis-value{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
}

.watch{
  display:grid;
  gap:7px;
  margin-top:7px;
}
.watch a,.watch button{
  display:block;
  text-decoration:none;
  background:#111d2b;
  border:1px solid #26364a;
  border-radius:9px;
  padding:9px;
  color:#fff;
  font-size:11px;
  text-align:left;
}

.last5-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:9px;
}
.last5{
  background:#08111c;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px;
}
.last5-title{
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
}
.form{
  display:flex;
  gap:4px;
  margin-bottom:8px;
}
.form span{
  width:22px;
  height:22px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
}
.form .v{background:#124f3a;color:#54f2b0}
.form .e{background:#554914;color:#ffe36b}
.form .d{background:#571d29;color:#ff8290}

.last-game{
  border-top:1px solid var(--line);
  padding:8px 0;
  font-size:10px;
  line-height:1.35;
  cursor:pointer;
}
.last-game:first-of-type{border-top:0}
.last-game strong{font-size:11px}
.result-v{color:var(--green);font-weight:900}
.result-e{color:var(--yellow);font-weight:900}
.result-d{color:var(--red);font-weight:900}

.roster{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.player{
  background:#0a131f;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px;
}
.player-name{
  font-weight:900;
  font-size:12px;
}
.player-pos{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:12px;
}
table{
  border-collapse:collapse;
  min-width:650px;
  width:100%;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  text-align:left;
}
th{
  background:#0d1723;
  position:sticky;
  top:0;
}
td:first-child,th:first-child{
  min-width:210px;
}

.news{
  cursor:pointer;
}
.news h3{
  margin:0;
  font-size:13px;
}
.news p{
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
}

.hidden{display:none!important}

.loading{
  padding:25px;
  text-align:center;
  color:var(--muted);
}
.error{
  padding:15px;
  color:#ff8290;
  font-size:11px;
}

@media(max-width:600px){
  .grid{gap:7px}
  .card{padding:9px}
  .last5-grid{grid-template-columns:1fr}
  .team-name{font-size:12px}
}

@media(min-width:800px){
  .last5-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">FUTZONE <span>PREMIUM</span></div>
  <div class="subtitle">FUTEBOL EM DIRETO</div>

  <nav class="nav">
    <button class="active" onclick="showSection('premium',this)">🔥 Premium</button>
    <button onclick="showSection('games',this)">⚽ Jogos</button>
    <button onclick="showSection('tables',this)">📊 Tabelas</button>
    <button onclick="showSection('news',this)">📰 Notícias</button>
    <button onclick="showSection('favorites',this)">⭐ Favoritos</button>
    <button onclick="showSection('live',this)">🔴 Diretos</button>
  </nav>
</header>

<main>

<section id="premium" class="section">
  <div class="section-title">
    <h2>🔥 Sugestões do dia</h2>
    <small>Premium</small>
  </div>
  <div id="suggestions" class="grid">
    <div class="loading">A carregar sugestões...</div>
  </div>
</section>

<section id="games" class="section hidden">
  <div class="section-title">
    <h2>⚽ Jogos</h2>
    <small id="gameCount"></small>
  </div>

  <div class="quick">
    <button onclick="showLive()">🔴 Jogos ao vivo</button>
    <button onclick="showToday()">📅 Jogos de hoje</button>
    <button onclick="showAll()">🌍 Todos carregados</button>
    <button onclick="loadClubGames()">🏆 Clubes europeus</button>
    <button onclick="loadSelectionGames()">🌍 Todas as seleções</button>
    <button onclick="loadSouthAmerica()">🌎 América do Sul</button>
  </div>

  <div id="chips" class="chips"></div>
  <div id="gamesList" class="grid">
    <div class="loading">A carregar jogos...</div>
  </div>
</section>

<section id="tables" class="section hidden">
  <div class="section-title">
    <h2>📊 Tabelas</h2>
  </div>
  <div id="tablesList"></div>
</section>

<section id="news" class="section hidden">
  <div class="section-title">
    <h2>📰 Notícias</h2>
  </div>
  <div id="newsList" class="grid">
    <div class="loading">A carregar notícias...</div>
  </div>
</section>

<section id="favorites" class="section hidden">
  <div class="section-title">
    <h2>⭐ Favoritos</h2>
  </div>
  <div id="favoritesList" class="card">
    Ainda não existem favoritos.
  </div>
</section>

<section id="live" class="section hidden">
  <div class="section-title">
    <h2>🔴 Jogos em direto</h2>
  </div>
  <div id="liveList" class="grid">
    <div class="loading">A procurar jogos em direto...</div>
  </div>
</section>

<section id="analysis" class="section hidden">
  <div class="section-title">
    <h2>📋 Análise Premium</h2>
    <button onclick="backFromAnalysis()" style="background:#162231;border-radius:8px;padding:7px 10px;font-size:10px">← Voltar</button>
  </div>
  <div id="analysisBox"></div>
</section>

<section id="rosterSection" class="section hidden">
  <div class="section-title">
    <h2 id="rosterTitle">📋 Plantel</h2>
    <button onclick="backFromRoster()" style="background:#162231;border-radius:8px;padding:7px 10px;font-size:10px">← Voltar</button>
  </div>
  <div id="rosterBox"></div>
</section>

</main>

<script>
const ESPN =
"https://site.api.espn.com/apis/site/v2/sports/soccer/";

const LEAGUES = {
  "por.1":"Liga Portugal",
  "por.2":"Liga 2 Portugal",
  "por.3":"Liga 3 Portugal",
  "por.w.1":"Liga BPI",
  "eng.1":"Premier League",
  "esp.1":"LaLiga",
  "esp.2":"Liga 2 Espanhola",
  "ita.1":"Série A Italiana",
  "ita.2":"Série B Italiana",
  "ger.1":"Bundesliga",
  "ger.2":"Bundesliga 2",
  "fra.1":"Ligue 1",
  "ned.1":"Eredivisie",
  "sco.1":"Liga Escocesa",
  "tur.1":"Liga Turca",
  "tur.2":"Liga Turca 2",
  "ksa.1":"Liga Saudita",
  "usa.1":"MLS",
  "bra.1":"Brasil Série A",
  "bra.2":"Brasil Série B",
  "arg.1":"Argentina",
  "col.1":"Colômbia",
  "par.1":"Paraguai",
  "per.1":"Peru",
  "uru.1":"Uruguai",
  "mex.1":"Liga MX",
  "uefa.champions":"Liga dos Campeões",
  "uefa.europa":"Liga Europa",
  "uefa.europa.conf":"Liga da Conference League",
  "conmebol.libertadores":"Taça Libertadores",
  "conmebol.sudamericana":"Taça Sul-Americana",
  "uefa.nations":"Liga das Nações",
  "uefa.euroq":"Qualificação Campeonato da Europa",
  "uefa.euro_u21_qual":"Qualificação Europeu Sub-21",
  "fifa.worldq.uefa":"Qualificação Mundial — Europa",
  "fifa.worldq.conmebol":"Qualificação Mundial — América do Sul",
  "fifa.friendly":"Amigáveis — Seleções",
  "fifa.friendly.w":"Amigáveis — Seleções Femininas",
  "conmebol.america":"Copa América",
  "conmebol.america_qual":"Qualificação Copa América",
  "concacaf.gold":"Gold Cup",
  "concacaf.nations.league":"Liga das Nações CONCACAF",
  "caf.nations":"CAN",
  "caf.nations_qual":"Qualificação CAN",
  "afc.asian.cup":"Taça Asiática"
};

let allGames=[];
let currentFilter="all";
let currentAnalysisEvent=null;
let currentTeam=null;

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function teamName(team){
  if(!team) return "Seleção";
  return team.displayName ||
         team.fullName ||
         team.shortDisplayName ||
         team.name ||
         team.abbreviation ||
         "Seleção";
}

function competitorTeam(c){
  return c?.team || c?.competitor?.team || c || null;
}

function scoreValue(c){
  const s=c?.score;
  if(typeof s==="number") return s;
  if(typeof s==="string"){
    const n=parseInt(s,10);
    return Number.isFinite(n)?n:0;
  }
  if(s && typeof s==="object"){
    const n=parseInt(s.displayValue ?? s.value ?? 0,10);
    return Number.isFinite(n)?n:0;
  }
  return 0;
}

function eventCompetitors(event){
  return event?.competitions?.[0]?.competitors || [];
}

function getHomeAway(event){
  const cs=eventCompetitors(event);
  let home=cs.find(c=>c.homeAway==="home");
  let away=cs.find(c=>c.homeAway==="away");

  if(!home && cs[0]) home=cs[0];
  if(!away && cs[1]) away=cs[1];

  return {home,away};
}

function eventNames(event){
  const {home,away}=getHomeAway(event);
  return {
    home:teamName(competitorTeam(home)),
    away:teamName(competitorTeam(away))
  };
}

function eventStatus(event){
  const s=event?.status;
  return s?.type?.state || s?.type?.name || "";
}

function eventFinished(event){
  const state=eventStatus(event);
  return state==="post" ||
         state==="final" ||
         state==="completed" ||
         state==="complete";
}

function eventLive(event){
  const state=eventStatus(event);
  return state==="in" ||
         state==="live" ||
         state==="inprogress";
}

function eventDate(event){
  return new Date(event.date || event?.competitions?.[0]?.date || Date.now());
}

function dateText(event){
  const d=eventDate(event);
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  })+" · "+
  d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function competitionName(event){
  return event?.competitions?.[0]?.league?.name ||
         event?.league?.name ||
         event?.season?.displayName ||
         "Futebol";
}

function statusText(event){
  if(eventLive(event)){
    return "🔴 EM DIRETO";
  }
  if(eventFinished(event)){
    return "Terminado";
  }
  return dateText(event);
}

function showSection(id,btn){
  document.querySelectorAll("main > section")
    .forEach(s=>s.classList.add("hidden"));

  document.getElementById(id)?.classList.remove("hidden");

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(btn) btn.classList.add("active");

  if(id==="games" && !allGames.length) loadGames();
  if(id==="tables") loadTables();
  if(id==="news") loadNews();
  if(id==="live") showLive();
}

function renderChips(){
  const el=document.getElementById("chips");
  el.innerHTML="";

  Object.entries(LEAGUES).forEach(([id,name])=>{
    const b=document.createElement("button");
    b.className="chip";
    b.textContent=name;
    b.onclick=()=>loadLeague(id);
    el.appendChild(b);
  });
}

async function fetchJSON(url,timeout=10000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const r=await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{
    clearTimeout(timer);
  }
}

function addEvents(data,leagueId){
  const events=Array.isArray(data?.events)?data.events:[];

  events.forEach(e=>{
    if(!e.id) return;
    if(!e.__leagueId) e.__leagueId=leagueId;
    if(!e.__leagueName) e.__leagueName=LEAGUES[leagueId]||"Futebol";

    if(!allGames.some(x=>x.id===e.id)){
      allGames.push(e);
    }
  });
}

function sortGames(arr){
  return arr.sort((a,b)=>{
    const al=eventLive(a), bl=eventLive(b);
    if(al!==bl) return al?-1:1;

    const ad=eventDate(a).getTime();
    const bd=eventDate(b).getTime();

    return ad-bd;
  });
}

function renderGames(arr=allGames){
  const el=document.getElementById("gamesList");

  if(!arr.length){
    el.innerHTML='<div class="card error">Não foram encontrados jogos nesta seleção.</div>';
    return;
  }

  const list=sortGames([...arr]).slice(0,100);

  el.innerHTML=list.map(event=>{
    const n=eventNames(event);
    const {home,away}=getHomeAway(event);
    const hs=scoreValue(home);
    const as=scoreValue(away);

    return `
      <div class="card game-card" onclick="openMatchById('${esc(event.id)}')">
        <div class="teams">
          <strong>${esc(n.home)}</strong>
          <span class="vs"> vs </span>
          <strong>${esc(n.away)}</strong>
        </div>
        <div class="status ${eventLive(event)?"live":""}">
          ${esc(statusText(event))}
          ${eventFinished(event)||eventLive(event)?` · ${hs} - ${as}`:""}
        </div>
        <div class="comp">${esc(event.__leagueName||competitionName(event))}</div>
      </div>
    `;
  }).join("");

  document.getElementById("gameCount").textContent=
    `${arr.length} jogos`;
}

async function loadLeague(id){
  const el=document.getElementById("gamesList");
  el.innerHTML='<div class="loading">A carregar '+esc(LEAGUES[id]||id)+'...</div>';

  try{
    const data=await fetchJSON(
      ESPN+id+"/scoreboard?limit=100"
    );

    allGames=allGames.filter(x=>x.__leagueId!==id);
    addEvents(data,id);
    currentFilter=id;
    renderGames(allGames.filter(x=>x.__leagueId===id));
  }catch(e){
    el.innerHTML=
      '<div class="card error">Não foi possível carregar esta competição.</div>';
  }
}

async function loadGames(){
  renderChips();

  const el=document.getElementById("gamesList");
  el.innerHTML='<div class="loading">A carregar jogos de hoje...</div>';

  /*
    Primeiro carregamos as competições com maior probabilidade
    de terem jogos atuais. Depois o restante em segundo plano.
  */
  const priority=[
    "por.1","por.2","por.3",
    "eng.1","esp.1","esp.2",
    "ita.1","ita.2",
    "ger.1","ger.2",
    "fra.1","tur.1","tur.2",
    "ksa.1","usa.1",
    "uefa.champions","uefa.europa","uefa.europa.conf",
    "uefa.nations",
    "fifa.worldq.uefa",
    "fifa.worldq.conmebol",
    "fifa.friendly",
    "conmebol.libertadores",
    "conmebol.sudamericana"
  ];

  const first=[...new Set(priority)];
  allGames=[];

  for(let i=0;i<first.length;i+=5){
    const batch=first.slice(i,i+5);

    await Promise.allSettled(
      batch.map(async id=>{
        try{
          const data=await fetchJSON(
            ESPN+id+"/scoreboard?limit=100",
            7000
          );
          addEvents(data,id);
        }catch(_){}
      })
    );

    renderGames(allGames);
  }

  const rest=Object.keys(LEAGUES)
    .filter(id=>!first.includes(id));

  Promise.allSettled(
    rest.map(async id=>{
      try{
        const data=await fetchJSON(
          ESPN+id+"/scoreboard?limit=100",
          7000
        );
        addEvents(data,id);
      }catch(_){}
    })
  ).then(()=>{
    renderGames(allGames);
    generateStartupSuggestions();
  });

  generateStartupSuggestions();
  renderGames(allGames);
}

function todayLocal(d){
  const x=new Date(d);
  const n=new Date();

  return x.getFullYear()===n.getFullYear() &&
         x.getMonth()===n.getMonth() &&

  function makeSuggestion(event,index){
  const n=eventNames(event);

  const high=[
    `${n.home} ou empate (1X)`,
    `${n.away} ou empate (X2)`,
    "Mais de 1.5 golos",
    "Menos de 4.5 golos",
    `${n.home} +0.5`
  ];

  const low=[
    "Mais de 0.5 golos",
    "Menos de 5.5 golos",
    "1X — Casa ou empate",
    "X2 — Fora ou empate",
    "Mais de 1.5 golos"
  ];

  const highMarket=high[index%high.length];
  const lowMarket=low[index%low.length];

  return {event,highMarket,lowMarket};
}

function generateStartupSuggestions(){
  const box=document.getElementById("suggestions");

  /*
    Nunca usar jogos terminados nas sugestões.
    Primeiro entram jogos em direto, depois próximos jogos.
  */
  let candidates=allGames.filter(e=>!eventFinished(e));

  candidates.sort((a,b)=>{
    const al=eventLive(a);
    const bl=eventLive(b);

    if(al!==bl) return al?-1:1;

    return eventDate(a)-eventDate(b);
  });

  /*
    Um jogo só pode aparecer uma vez.
  */
  const unique=[];
  const used=new Set();

  for(const e of candidates){
    if(used.has(e.id)) continue;

    const names=eventNames(e);

    if(!names.home || !names.away) continue;
    if(names.home==="Seleção" && names.away==="Seleção") continue;

    used.add(e.id);
    unique.push(e);

    if(unique.length>=10) break;
  }

  if(!unique.length){
    box.innerHTML=
      '<div class="card error">A procurar os jogos disponíveis para as sugestões do dia...</div>';
    return;
  }

  box.innerHTML=unique.map((e,i)=>
    suggestionCard(makeSuggestion(e,i),i)
  ).join("");
}

function normalizeCompetitor(raw){
  if(!raw) return null;

  if(raw.team) return raw.team;
  if(raw.competitor?.team) return raw.competitor.team;

  return raw;
}

function sameTeam(a,b){
  const x=normalizeCompetitor(a);
  const y=normalizeCompetitor(b);

  if(!x||!y) return false;

  if(x.id && y.id){
    return String(x.id)===String(y.id);
  }

  const xn=teamName(x).toLowerCase();
  const yn=teamName(y).toLowerCase();

  return xn===yn;
}

function resultForTeam(event,team){
  const cs=eventCompetitors(event);
  if(cs.length<2) return null;

  const target=normalizeCompetitor(team);

  let mine=cs.find(c=>sameTeam(c,target));

  if(!mine){
    const targetName=teamName(target).toLowerCase();

    mine=cs.find(c=>
      teamName(competitorTeam(c)).toLowerCase()===targetName
    );
  }

  if(!mine) return null;

  const opponent=cs.find(c=>c!==mine);
  if(!opponent) return null;

  const myScore=scoreValue(mine);
  const oppScore=scoreValue(opponent);

  let form="E";

  if(myScore>oppScore) form="V";
  else if(myScore<oppScore) form="D";

  return {
    form,
    mine:teamName(competitorTeam(mine)),
    opponent:teamName(competitorTeam(opponent)),
    myScore,
    oppScore,
    homeAway:mine.homeAway==="home"?"Casa":"Fora",
    date:eventDate(event)
  };
}

async function loadLast5(team,targetId){
  const box=document.getElementById(targetId);

  if(!box) return;

  const target=normalizeCompetitor(team);
  const targetName=teamName(target);

  if(!target?.id){
    box.innerHTML=
      `<div class="error">
        Não foi possível identificar ${esc(targetName)}.
      </div>`;
    return;
  }

  let events=[];

  /*
    Primeiro calendário global da equipa.
  */
  events=await teamSchedule(target);

  /*
    Junta também jogos já carregados na app.
    Isto é especialmente útil para seleções.
  */
  const merged=[...events];

  allGames.forEach(e=>{
    const cs=eventCompetitors(e);

    if(cs.some(c=>sameTeam(c,target))){
      merged.push(e);
    }
  });

  const unique=[];
  const ids=new Set();

  for(const e of merged){
    if(!e?.id || ids.has(e.id)) continue;
    ids.add(e.id);
    unique.push(e);
  }

  /*
    Apenas jogos efetivamente terminados.
  */
  const finished=unique
    .filter(e=>eventFinished(e))
    .map(e=>({
      event:e,
      result:resultForTeam(e,target)
    }))
    .filter(x=>
      x.result &&
      x.result.opponent &&
      x.result.opponent!=="Seleção"
    )
    .sort((a,b)=>
      b.result.date.getTime()-a.result.date.getTime()
    )
    .slice(0,5);

  if(!finished.length){
    box.innerHTML=
      `<div class="error">
        Não foi possível obter os últimos 5 jogos de
        <strong>${esc(targetName)}</strong>.
      </div>`;
    return;
  }

  const form=finished.map(x=>
    `<span class="${
      x.result.form==="V"?"v":
      x.result.form==="D"?"d":"e"
    }">${x.result.form}</span>`
  ).join("");

  box.innerHTML=`
    <div class="form">${form}</div>

    ${finished.map(x=>{
      const r=x.result;

      return `
        <div class="last-game"
             onclick="openMatchById('${esc(x.event.id)}')">

          <strong>${esc(r.mine)}</strong>
          <br>

          ${r.homeAway==="Casa"
            ? `${esc(r.mine)} ${r.myScore} - ${r.oppScore} ${esc(r.opponent)}`
            : `${esc(r.opponent)} ${r.oppScore} - ${r.myScore} ${esc(r.mine)}`
          }

          <br>

          <span class="${
            r.form==="V"?"result-v":
            r.form==="D"?"result-d":"result-e"
          }">
            ${r.form==="V"?"VITÓRIA":
              r.form==="D"?"DERROTA":"EMPATE"}
          </span>

          · ${esc(r.homeAway)}
          · ${r.date.toLocaleDateString("pt-PT",{
              day:"2-digit",
              month:"2-digit"
            })}
        </div>
      `;
    }).join("")}
  `;
  }
  async function loadWhereToWatch(event){
  const box=document.getElementById("watchBox");
  if(!box) return;

  const broadcasts=
    event?.competitions?.[0]?.broadcasts ||
    event?.competitions?.[0]?.broadcast ||
    [];

  const found=[];

  function addBroadcast(name,url){
    if(!name) return;

    const key=String(name).trim();
    if(!key) return;

    if(found.some(x=>x.name.toLowerCase()===key.toLowerCase())) return;

    found.push({
      name:key,
      url:url||event?.links?.[0]?.href||""
    });
  }

  if(Array.isArray(broadcasts)){
    broadcasts.forEach(b=>{
      const names=[
        b?.names?.[0],
        b?.media?.shortName,
        b?.media?.name,
        b?.station?.name,
        b?.name
      ].filter(Boolean);

      const url=
        b?.links?.[0]?.href ||
        b?.link?.href ||
        b?.url ||
        "";

      names.forEach(n=>addBroadcast(n,url));
    });
  }

  /*
    Algumas respostas da ESPN colocam a informação
    dentro de competition.broadcasts[].market.
  */
  if(Array.isArray(broadcasts)){
    broadcasts.forEach(b=>{
      const market=b?.market?.name || b?.market;

      if(market){
        const names=Array.isArray(market)
          ? market
          : [market];

        names.forEach(n=>addBroadcast(n,b?.url||""));
      }
    });
  }

  const limited=found.slice(0,4);

  if(!limited.length){
    const eventLink=
      event?.links?.find(l=>
        /watch|stream|live|video/i.test(
          String(l?.text||"")+" "+String(l?.href||"")
        )
      )?.href ||
      event?.links?.[0]?.href ||
      "";

    if(eventLink){
      box.innerHTML=`
        <a href="${esc(eventLink)}"
           target="_blank"
           rel="noopener">
          📺 Ver informações de transmissão
        </a>
      `;
    }else{
      box.innerHTML=`
        <div class="error">
          Não foi indicada uma transmissão para este jogo.
        </div>
      `;
    }

    return;
  }

  box.innerHTML=limited.map((x,i)=>`
    <a href="${esc(x.url||"#")}"
       ${x.url?'target="_blank" rel="noopener"':''}>
      📺 ${esc(x.name)}
    </a>
  `).join("");
}

    ESPN+"por.1/news",
    ESPN+"eng.1/news"
  ];

  const articles=[];
  const used=new Set();

  for(const url of urls){
    try{
      const data=await fetchJSON(url,9000);

      (data?.articles||[]).forEach(a=>{
        const id=a?.id||a?.links?.[0]?.href;

        if(!id || used.has(id)) return;

        used.add(id);
        articles.push(a);
      });
    }catch(_){}
  }

  if(!articles.length){
    box.innerHTML=
      '<div class="card error">Não foi possível carregar notícias.</div>';
    return;
  }

  box.innerHTML=articles.slice(0,30).map(a=>{
    const title=
      a?.headline||
      a?.title||
      "Notícia";

    const desc=
      a?.description||
      a?.story||
      "";

    const url=
      a?.links?.web?.href||
      a?.links?.[0]?.href||
      "";

    return `
      <div class="card news"
           ${url?`onclick="window.open('${esc(url)}','_blank')"`:""}>
        <h3>${esc(title)}</h3>
        <p>${esc(desc)}</p>
      </div>
    `;
  }).join("");

  box.dataset.loaded="1";
}

function init(){
  renderChips();

  /*
    Carrega jogos primeiro.
    As sugestões aparecem automaticamente logo
    que existirem jogos disponíveis.
  */
  loadGames();

  /*
    Atualização automática para substituir jogos
    terminados por novos jogos.
  */
  setInterval(async()=>{
    try{
      await loadGames();
    }catch(_){}
  },10*60*1000);
}

init();
</script>
