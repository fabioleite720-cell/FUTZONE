<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE PRO</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#071326;border-bottom:1px solid #17243a;padding:13px 12px}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:#7ed957}
main{padding:10px 10px 85px;max-width:760px;margin:auto}
h2{font-size:18px;margin:15px 0 9px}
h3{font-size:14px;margin:0 0 9px}
.small{font-size:11px;color:#9ca9bb}

.seletor-ligas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.liga-btn{background:#0b1627;border:1px solid #17243a;border-radius:12px;padding:10px 5px;color:#fff;text-align:center;font-size:12px;font-weight:bold}
.liga-btn.active{background:#102442;border-color:#7ed957;box-shadow:0 0 0 1px #7ed95722}
.liga-icon{font-size:20px;display:block;margin-bottom:4px}

.direto{background:linear-gradient(135deg,#071a15,#0b1627);border:1px solid #7ed957;border-radius:14px;padding:12px;margin:12px 0 16px}
.direto-titulo{display:flex;justify-content:space-between;align-items:center;color:#7ed957;font-weight:900;margin-bottom:9px}
.pisca{width:8px;height:8px;background:#7ed957;border-radius:50%;display:inline-block;box-shadow:0 0 10px #7ed957;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}

.carrossel{display:flex;gap:9px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.carrossel::-webkit-scrollbar{display:none}
.card-mini{min-width:205px;max-width:205px;background:#0b1627;border:1px solid #17243a;border-radius:13px;padding:10px;cursor:pointer}
.card-mini:hover{border-color:#31557e}
.card-mini .equipas{grid-template-columns:1fr 43px 1fr}
.card-mini .equipa{font-size:10px}
.card-mini .escudo{width:27px;height:27px}
.card-mini .resultado{font-size:16px}
.card-mini .jogo-top{margin-bottom:7px}

.jogo{background:#0b1627;border:1px solid #17243a;border-radius:13px;padding:11px;margin-bottom:8px;cursor:pointer}
.jogo-top{display:flex;justify-content:space-between;gap:8px;color:#9ca9bb;font-size:10px;margin-bottom:8px}
.equipas{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:5px}
.equipa{text-align:center;font-size:12px;font-weight:bold}
.escudo{width:32px;height:32px;object-fit:contain;display:block;margin:0 auto 5px}
.resultado{text-align:center;font-size:18px;font-weight:900}
.live{color:#7ed957!important;font-weight:bold}
.futuro{color:#75a9ff!important;font-weight:bold}
.final{color:#9ca9bb!important;font-weight:bold}
.star{float:right;background:none;border:0;color:#ffd84d;font-size:18px;padding:0;cursor:pointer}

.vazio{background:#0b1627;border:1px solid #17243a;border-radius:12px;padding:18px;text-align:center;color:#9ca9bb}
.carregando{text-align:center;color:#9ca9bb;padding:20px}
.erro{color:#ff8f8f;text-align:center;padding:15px}

.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#071326;border-top:1px solid #17243a;display:flex;z-index:30}
.bottom button{background:none;border:0;color:#9ca9bb;font-weight:bold;width:33%;font-size:12px}
.bottom button.active{color:#7ed957}

.overlay{position:fixed;inset:0;background:#050b16;z-index:50;overflow:auto}
.detalhe-header{position:sticky;top:0;background:#071326;border-bottom:1px solid #17243a;padding:11px;z-index:5}
.voltar{background:#0b1627;border:1px solid #243653;color:#fff;border-radius:8px;padding:8px 12px;font-weight:bold}
.detalhe{max-width:760px;margin:auto;padding:10px 10px 35px}
.jogo-grande{background:#0b1627;border:1px solid #17243a;border-radius:14px;padding:18px 10px;margin-bottom:10px}
.jogo-grande .equipas{grid-template-columns:1fr 85px 1fr}
.jogo-grande .escudo{width:55px;height:55px}
.jogo-grande .equipa{font-size:14px}
.bigscore{text-align:center;font-size:29px;font-weight:900}
.estado{text-align:center;color:#7ed957;font-size:11px;margin-top:5px}

.secao{background:#0b1627;border:1px solid #17243a;border-radius:13px;margin:10px 0;padding:12px}
.evento{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #17243a;font-size:12px}
.evento:last-child{border-bottom:0}
.minuto{color:#7ed957;font-weight:bold;min-width:38px}

.stats-head,.stat-row{display:grid;grid-template-columns:1fr 90px 1fr;text-align:center}
.stats-head{font-size:11px;color:#9ca9bb;margin-bottom:5px}
.stat-row{align-items:center;border-top:1px solid #17243a;padding:7px 0;font-size:11px}
.stat-row .nome{font-size:9px;color:#9ca9bb}
.stat-home{text-align:right;font-weight:bold}
.stat-away{text-align:left;font-weight:bold}

.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.jogador{background:#071326;border:1px solid #17243a;border-radius:9px;padding:8px;font-size:11px;cursor:pointer}
.jogador b{color:#7ed957;margin-right:5px}
.subtitulo{color:#9ca9bb;font-size:10px;margin:8px 0}

.tabela-caixa{background:#0b1627;border:1px solid #17243a;border-radius:13px;padding:10px;margin-top:10px}
.tabela-scroll{overflow-x:auto}
.tabela{width:100%;border-collapse:collapse;font-size:11px;min-width:480px}
.tabela th{color:#9ca9bb;font-size:9px;padding:8px 4px;border-bottom:1px solid #243653}
.tabela td{padding:8px 4px;border-bottom:1px solid #17243a;text-align:center}
.tabela td:nth-child(2){text-align:left;font-weight:bold}
.posicao{color:#7ed957;font-weight:bold}
.logo-tabela{width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:4px}

.equipa-link{cursor:pointer}
.equipa-link:hover{color:#7ed957}
.team-header{display:flex;align-items:center;gap:12px;background:#0b1627;border:1px solid #17243a;border-radius:14px;padding:15px;margin-bottom:10px}
.team-header img{width:65px;height:65px;object-fit:contain}
.team-header h2{margin:0;font-size:20px}
.posicao-titulo{font-size:12px;color:#7ed957;font-weight:bold;border-bottom:1px solid #17243a;padding:8px 0;margin-top:10px}
.player-card{display:flex;align-items:center;gap:9px;background:#071326;border:1px solid #17243a;border-radius:10px;padding:7px;margin-top:6px}
.player-photo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#0b1627}
.player-num{color:#7ed957;font-weight:900;width:25px}
.player-info{flex:1}
.player-name{font-size:12px;font-weight:bold}
.player-pos{font-size:10px;color:#9ca9bb}
.badge{display:inline-block;font-size:9px;padding:3px 6px;border-radius:20px;background:#12233a;color:#9ca9bb;margin-left:4px}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<main id="app"></main>

<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ligas=[
{nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
{nome:"França",codigo:"fra.1",icone:"🇫🇷"},
{nome:"Países Baixos",codigo:"ned.1",icone:"🇳🇱"},
{nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
{nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}
];

let jogos=[];
let ligaSelecionada="Portugal";
let pagina="jogos";
let favoritos=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");
const app=document.getElementById("app");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function apiBase(codigo){
return "https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(codigo);
}

function logo(u){
if(!u)return "<div style='height:37px'></div>";
return `<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`;
}

function comp(j){return j?.competitions?.[0]||{}}

function nome(c){
return c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
"Equipa";
}

function normalizar(j,l){
let c=comp(j);
let cs=c.competitors||[];
let h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
let a=cs.find(x=>x.homeAway==="away")||cs[1]||{};

return {
id:String(j.id),
codigo:l.codigo,
liga:l.nome,
data:j.date||"",
home:{
id:String(h?.team?.id||h?.id||""),
nome:nome(h),
logo:h?.team?.logo||"",
score:h?.score??"-"
},
away:{
id:String(a?.team?.id||a?.id||""),
nome:nome(a),
logo:a?.team?.logo||"",
score:a?.score??"-"
},
estado:c?.status?.type?.shortDetail||
c?.status?.type?.detail||
c?.status?.type?.description||"",
state:c?.status?.type?.state||"",
statusType:c?.status?.type||{},
competicao:c
};
}

async function carregarJogos(){

let todos=[];

await Promise.all(ligas.map(async l=>{

try{
let url=apiBase(l.codigo)+
"/scoreboard?limit=100&_="+Date.now();

let r=await fetch(url);
if(!r.ok)return;

let d=await r.json();

(d.events||[]).forEach(j=>{
todos.push(normalizar(j,l));
});

}catch(e){}

}));

jogos=todos;

if(pagina==="jogos")mostrarJogos();
if(pagina==="favoritos")mostrarFavoritos();

}

function aoVivo(j){
let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="in"||
s==="live"||
/live|half|intervalo|1st|2nd|extra time|penalty/.test(e);
}

function terminou(j){
let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="post"||
s==="final"||
/final|finished|ft|terminou/.test(e);
}

function futuro(j){
return !aoVivo(j)&&!terminou(j);
}

function dataJogo(j){
if(!j.data)return "";
try{
return new Date(j.data).toLocaleDateString("pt-PT",{
day:"2-digit",month:"2-digit"
});
}catch(e){return ""}
}

function horaJogo(j){
if(!j.data)return "";
try{
return new Date(j.data).toLocaleTimeString("pt-PT",{
hour:"2-digit",minute:"2-digit"
});
}catch(e){return ""}
}

function botoes(){

return `<div class="seletor-ligas">
${ligas.map(l=>`
<button class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${esc(l.nome)}')">
<span class="liga-icon">${l.icone}</span>${esc(l.nome)}
</button>
`).join("")}
</div>`;

}

function selecionarLiga(n){

ligaSelecionada=n;

if(pagina==="tabelas"){
mostrarTabela(n);
}else{
mostrarJogos();
}

scrollTo(0,0);

}

function favorito(id){
return favoritos.includes(String(id));
}

function toggleFavorito(id){
id=String(id);

if(favoritos.includes(id)){
favoritos=favoritos.filter(x=>x!==id);
}else{
favoritos.push(id);
}

localStorage.setItem("futzone_favoritos",JSON.stringify(favoritos));

if(pagina==="favoritos")mostrarFavoritos();
else mostrarJogos();
}

function abrirTeam(id,codigo,nomeEquipa,escudo,event){
if(event)event.stopPropagation();

if(!id){
alert("Plantel desta equipa não disponível.");
return;
}

mostrarEquipa(
id,
codigo,
nomeEquipa,
escudo
);
}

function equipaHTML(e,codigo){

return `
<div class="equipa equipa-link"
onclick="abrirTeam('${esc(e.id)}','${esc(codigo)}','${esc(e.nome)}','${esc(e.logo)}',event)">
${logo(e.logo)}
${esc(e.nome)}
</div>`;

}

function botaoStar(j){
return `<button class="star"
onclick="event.stopPropagation();toggleFavorito('${esc(j.id)}')">
${favorito(j.id)?"★":"☆"}
</button>`;
}

function cartao(j){

let classe=aoVivo(j)?"live":terminou(j)?"final":"futuro";

return `
<div class="jogo"
onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">
<span>${esc(j.liga)} · ${dataJogo(j)} ${horaJogo(j)}</span>
<span class="${classe}">
${aoVivo(j)?"🔴 AO VIVO":terminou(j)?"FINAL":esc(j.estado)}
</span>
${botaoStar(j)}
</div>

<div class="equipas">
${equipaHTML(j.home,j.codigo)}

<div class="resultado">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

${equipaHTML(j.away,j.codigo)}
</div>

</div>`;
}

function cartaoMini(j){

let classe=aoVivo(j)?"live":terminou(j)?"final":"futuro";

return `
<div class="card-mini"
onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">
<span>${esc(j.liga)}</span>
<span class="${classe}">
${aoVivo(j)?"🔴 LIVE":terminou(j)?"FINAL":horaJogo(j)}
</span>
</div>

<div class="equipas">

<div class="equipa">
${logo(j.home.logo)}
${esc(j.home.nome)}
</div>

<div class="resultado">
${esc(j.home.score)}-${esc(j.away.score)}
</div>

<div class="equipa">
${logo(j.away.logo)}
${esc(j.away.nome)}
</div>

</div>
</div>`;
}

function mostrarJogos(){

pagina="jogos";
nav("navJogos");

let ligaJogos=jogos.filter(j=>j.liga===ligaSelecionada);

let vivos=jogos.filter(aoVivo);
let proximos=ligaJogos.filter(futuro)
.sort((a,b)=>new Date(a.data)-new Date(b.data));

let resultados=ligaJogos.filter(terminou)
.sort((a,b)=>new Date(b.data)-new Date(a.data));

app.innerHTML=`

<h2>🌍 Ligas</h2>
${botoes()}

${vivos.length?`
<div class="direto">
<div class="direto-titulo">
<span>🔴 EM DIRETO</span>
<span><i class="pisca"></i> ${vivos.length}</span>
</div>

<div class="carrossel">
${vivos.slice(0,20).map(cartaoMini).join("")}
</div>
</div>
`:`
<div class="direto">
<div class="direto-titulo">
<span>🔴 EM DIRETO</span>
</div>
<div class="small">Não existem jogos em direto neste momento.</div>
</div>
`}

<h2>⏰ ${esc(ligaSelecionada)} — Próximos</h2>

${proximos.length?
`<div class="carrossel">${proximos.slice(0,30).map(cartaoMini).join("")}</div>`:
`<div class="vazio">Não há próximos jogos disponíveis.</div>`}

<h2>✅ ${esc(ligaSelecionada)} — Resultados</h2>

${resultados.length?
`<div class="carrossel">${resultados.slice(0,30).map(cartaoMini).join("")}</div>`:
`<div class="vazio">Não há resultados recentes disponíveis.</div>`}

<h2>📅 Jogos da liga</h2>

${ligaJogos.length?
ligaJogos.slice().sort((a,b)=>new Date(a.data)-new Date(b.data)).map(cartao).join(""):
`<div class="vazio">Não há jogos disponíveis.</div>`}

`;

}

function nav(id){
["navJogos","navTabelas","navFav"].forEach(x=>{
document.getElementById(x).classList.toggle("active",x===id);
});
}

function txt(v){
return typeof v==="object"?
(v?.displayValue??v?.value??v?.text??""):
String(v??"");
}

function traduzEvento(t){

let s=String(t||"");

const mapa=[
[/second yellow/ig,"Segundo cartão amarelo"],
[/yellow card/ig,"Cartão amarelo"],
[/red card/ig,"Cartão vermelho"],
[/substitution/ig,"Substituição"],
[/missed penalty/ig,"Penálti falhado"],
[/penalty/ig,"Penálti"],
[/own goal/ig,"Autogolo"],
[/assist/ig,"Assistência"],
[/offside/ig,"Fora de jogo"],
[/goal/ig,"Golo"]
];

mapa.forEach(x=>s=s.replace(x[0],x[1]));

return s;
}

function extrairEventos(d){

let out=[];
let seen=new Set();

let src=[
...(d.plays||[]),
...(d.keyEvents||[]),
...(d.scoringPlays||[])
];

for(let e of src){

let raw=
(e?.type?.text||"")+" "+
(e?.text||e?.shortText||e?.description||"");

let s=raw.toLowerCase();

if(!/goal|yellow|red|substitut|penalty|own goal|offside|cartão|golo/.test(s))
continue;

let t=
e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento";

let k=JSON.stringify([
e?.id,
e?.clock?.displayValue,
t
]);

if(seen.has(k))continue;

seen.add(k);

let icon=
/second yellow|yellow/.test(s)?"🟨":
/red/.test(s)?"🟥":
/substitut/.test(s)?"🔄":
/penalty/.test(s)?"⚽":
"⚽";

out.push({
m:e?.clock?.displayValue||
e?.period?.displayValue||
"",
t:traduzEvento(t),
i:icon
});

}

return out;
}

function extrairStats(d){

let grupos=[];

function add(team,ss){

if(!team||!Array.isArray(ss))return;

let id=
team?.id||
team?.team?.id||
team?.displayName||
team?.team?.displayName;

let g=grupos.find(x=>String(x.id)===String(id));

if(!g){
g={
id,
nome:
team?.displayName||
team?.name||
team?.team?.displayName||
team?.team?.name||
"Equipa",
s:[]
};
grupos.push(g);
}

ss.forEach(x=>{

let n=
x?.displayName||
x?.shortDisplayName||
x?.name||
x?.label||
x?.description;

if(n){
g.s.push({
n,
v:txt(x?.displayValue??x?.value??x?.display)
});
}

});

}

(d.boxscore?.teams||[]).forEach(t=>
add(t.team||t,t.statistics||t.stats));

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

(d.competitions?.[0]?.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

(d.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

if(grupos.length<2)return[];

let m=new Map();

grupos.forEach((g,gi)=>{
g.s.forEach(x=>{

let k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{n:x.n,h:"-",a:"-"});

let r=m.get(k);

if(gi===0)r.h=x.v;
else r.a=x.v;

});
});

return [...m.values()];

}

function extrairPlantel(d){

let gs=[];

function add(team,arr){

if(!team||!Array.isArray(arr))return;

let id=
team?.id||
team?.team?.id||
team?.displayName;

let g=gs.find(x=>String(x.id)===String(id));

if(!g){
g={
id,
nome:
team?.displayName||
team?.name||
team?.team?.displayName||
"Equipa",
p:[]
};
gs.push(g);
}

arr.forEach(x=>{

let a=x?.athlete||x?.player||x;

if(!a?.displayName&&!a?.fullName)return;

let n=a.displayName||a.fullName||a.shortName;

if(g.p.some(q=>q.n===n))return;

g.p.push({
n,
num:a.jersey||x.jersey||a.uniformNumber||"",
pos:a?.position?.abbreviation||
a?.position?.displayName||
x?.position?.displayName||
"",
tit:x.starter===true||x.starter==="true",
foto:a?.headshot?.href||a?.headshot||""
});

});

}

(d.rosters||[]).forEach(r=>
add(r.team||r,r.roster||r.athletes||r.players));

(d.boxscore?.players||[]).forEach(g=>
add(g.team||g,g.statistics||g.athletes||g.roster||g.players));

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(c.team||c,c.roster||c.athletes||c.players));

return gs.filter(g=>g.p.length);

}

function blocoEventos(a){

return `
<div class="secao">
<h3>⚽ Golos e eventos</h3>

${a.length?
a.map(e=>`
<div class="evento">
<span class="minuto">${esc(e.m)}</span>
<span>${e.i} ${esc(e.t)}</span>
</div>
`).join(""):
`<div class="vazio">Não há golos ou eventos disponíveis.</div>`}

</div>`;
}

function blocoStats(a){

return `
<div class="secao">

function valorStat(stats,nomes,defaultValue="-"){

if(!Array.isArray(stats))return defaultValue;

for(let s of stats){

let n=String(
s?.name||
s?.displayName||
s?.shortDisplayName||
""
).toLowerCase();

if(nomes.some(x=>n===x||n.includes(x)))
return s?.value??s?.displayValue??defaultValue;

}

return defaultValue;
}

function encontrarEquipasTabela(d){

let arr=[];

function walk(x){

if(!x||typeof x!=="object")return;

if(Array.isArray(x)){
x.forEach(walk);
return;
}

if(x.team&&
(x.stats||x.statistics||x.records||
x.note||x.rank||
x.team.displayName)){

arr.push(x);
}

Object.keys(x).forEach(k=>{

if(k!=="team")walk(x[k]);

});

}

walk(d);

let seen=new Set();

return arr.filter(x=>{

let id=x.team?.id||x.team?.displayName;

if(!id||seen.has(id))return false;

seen.add(id);
return true;

});

}

function parseTabelaItem(x,index){

let stats=x.stats||x.statistics||[];

let records=x.records||[];

if(!Array.isArray(stats))stats=[];
if(!Array.isArray(records))records=[];

let all=[...stats,...records.flatMap(r=>r?.stats||[])];

let team=x.team||{};

let get=(keys,def="-")=>{

let v=valorStat(all,keys,def);

if(v!=="-")return v;

return valorStat(x?.team?.stats||[],keys,def);

};

let jogosV=get(["gamesplayed","played","gp","j"],"-");
let vitorias=get(["wins","win","v"],"-");
let empates=get(["ties","draws","draw","e"],"-");
let derrotas=get(["losses","loss","d"],"-");
let pontos=get(["points","pts","pontos"],"-");
let gd=get(["pointdifferential","goaldifference","differential","gd"],"-");

let rank=
x.rank||
get(["rank","position","pos"],index+1);

return {
rank,
nome:team.displayName||
team.shortDisplayName||
team.name||
"Equipa",
logo:team.logo||"",
jogos:jogosV,
v:vitorias,
e:empates,
d:derrotas,
pts:pontos,
gd
};

}

async function carregarRecentes(l){

let el=document.getElementById("recentes");
if(!el)return;

let hoje=new Date();
let inicio=new Date();
inicio.setDate(hoje.getDate()-14);

let fmt=d=>d.toISOString().slice(0,10).replace(/-/g,"");

try{

let url=apiBase(l.codigo)+
"/scoreboard?dates="+fmt(inicio)+"-"+fmt(hoje)+
"&limit=1000&_="+Date.now();

let r=await fetch(url);

if(!r.ok)throw 0;

let d=await r.json();

let recentes=(d.events||[])
.map(j=>normalizar(j,l))
.filter(terminou)
.sort((a,b)=>new Date(b.data)-new Date(a.data));

if(!recentes.length){

el.innerHTML=
`<div class="vazio">Não há resultados recentes disponíveis.</div>`;

return;

}

el.className="carrossel";
el.innerHTML=recentes.slice(0,30).map(cartaoMini).join("");

}catch(e){

el.innerHTML=
`<div class="vazio">Resultados recentes indisponíveis.</div>`;

}

function grupoPosicao(pos){

let p=String(pos||"").toLowerCase();

if(/goal|gk|keeper|guarda|port/.test(p))
return "Guarda-redes";

if(/def|back|centre|center|cb|rb|lb|lateral/.test(p))
return "Defesas";

if(/mid|medio|méd|wing|volante|cm|dm|am/.test(p))
return "Médios";

if(/forward|striker|attack|avanç|att|fw|st/.test(p))
return "Avançados";

return "Outros";
}

function extrairJogadoresTeam(d){

let raw=[];

function walk(x){

if(!x||typeof x!=="object")return;

if(Array.isArray(x)){
x.forEach(walk);
return;
}

if(x.athlete||x.player||
x.displayName&&
(x.jersey||x.position||x.headshot)){

raw.push(x.athlete||x.player||x);

}

if(Array.isArray(x.athletes))
x.athletes.forEach(a=>raw.push(a));

if(Array.isArray(x.roster))
x.roster.forEach(a=>walk(a));

Object.keys(x).forEach(k=>{
if(!["athlete","player","athletes","roster"].includes(k))
walk(x[k]);
});

}

walk(d);

let seen=new Set();

return raw.map(a=>{

let id=a.id||a.uid||a.displayName;

if(!id||seen.has(id))return null;

seen.add(id);

return {
id,
nome:a.displayName||a.fullName||a.shortName||"Jogador",
numero:a.jersey||a.uniformNumber||"",
pos:a.position?.displayName||
a.position?.abbreviation||
"",
foto:a.headshot?.href||
a.headshot||
""
};

}).filter(Boolean);

}

apiBase(codigo)+"/teams/"+encodeURIComponent(teamId)+"?_="+Date.now()

let r=await fetch(url);

if(r.ok){
dados=await r.json();
break;
}

}catch(e){}

}

if(!dados)throw 0;

let players=extrairJogadoresTeam(dados);

if(!players.length)throw 0;

});

let ordem=[

"Defesas",

"Avançados",
"Outros"
];

let html="";

ordem.forEach(g=>{

if(!grupos[g]?.length)return;

html+=`

${g}
</div>

${grupos[g].map(p=>`

<div class="player-card">

${p.foto?
`<img class="player-photo"
src="${esc(p.foto)}"
onerror="this.style.visibility='hidden'">`:
`<div class="player-photo"></div>`}

<div class="player-num">
${esc(p.numero||"-")}
</div>

<div class="player-info">

<div class="player-name">
${esc(p.nome)}
</div>

<div class="player-pos">
${esc(p.pos||g)}
</div>

</div>

</div>

`).join("")}

</div>
`;

});

detalhe.querySelector(".carregando").outerHTML=
html||`<div class="vazio">Plantel não disponível.</div>`;

}catch(e){

o.querySelector(".carregando").outerHTML=
`<div class="erro">
O plantel desta equipa não está disponível neste momento.
</div>`;

}

}
