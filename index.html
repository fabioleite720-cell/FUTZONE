<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060B;color:#FFF;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#09111C;border-bottom:1px solid #1B2A3B;padding:14px 12px}
.logo{font-size:25px;font-weight:900}.logo span{color:#1683FF}.sub{font-size:10px;color:#9DAABB;margin-top:2px}
main{padding:12px 10px 85px;max-width:720px;margin:auto}h2{font-size:18px;margin:15px 0 10px}
.seletor-ligas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.liga-btn{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:10px 5px;color:#FFF;font-size:12px;font-weight:bold}.liga-btn.active{background:#003B7A;border-color:#1683FF}.liga-icon{display:block;font-size:20px;margin-bottom:4px}
.live-button{width:100%;background:#09111C;border:1px solid #FF4054;color:#FFF;border-radius:11px;padding:12px;margin-bottom:12px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;background:#FF4054;border-radius:50%;margin-right:5px}
.filtro{display:flex;gap:7px;margin:8px 0 12px}.filtro button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:8px;font-size:11px}.filtro button.active{color:#FFF;border-color:#1683FF;background:#003B7A}
.jogo{background:#09111C;border:1px solid #1B2A3B;border-radius:13px;padding:11px;margin-bottom:8px;cursor:pointer}.jogo-top{display:flex;justify-content:space-between;color:#9DAABB;font-size:10px;margin-bottom:8px}.equipas{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;gap:5px}.equipa{text-align:center;font-size:12px;font-weight:bold}.escudo{width:31px;height:31px;object-fit:contain;display:block;margin:0 auto 4px}.resultado{text-align:center;font-size:18px;font-weight:900}.estado-live{color:#FF4054;font-weight:900}.estado-final{color:#9DAABB}.vazio,.erro,.carregando{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:18px;text-align:center;color:#9DAABB}.erro{color:#FF8F8F}
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#09111C;border-top:1px solid #1B2A3B;display:flex;z-index:30}.bottom button{background:none;border:0;color:#9DAABB;font-weight:bold;width:33%;font-size:12px}.bottom button.active{color:#1683FF}
.overlay{position:fixed;inset:0;background:#03060B;z-index:50;overflow:auto}.detalhe-header{position:sticky;top:0;background:#09111C;border-bottom:1px solid #1B2A3B;padding:11px;z-index:5}.voltar{background:#0D1724;border:1px solid #243653;color:#FFF;border-radius:8px;padding:8px 12px;font-weight:bold}.detalhe{max-width:720px;margin:auto;padding:10px 10px 35px}
.jogo-grande{background:#09111C;border:1px solid #1B2A3B;border-radius:14px;padding:18px 8px;margin-bottom:10px}.jogo-grande .equipas{grid-template-columns:1fr 85px 1fr}.jogo-grande .escudo{width:52px;height:52px}.jogo-grande .equipa{font-size:14px}.bigscore{text-align:center;font-size:29px;font-weight:900}.estado{text-align:center;color:#1683FF;font-size:11px;margin-top:4px}
.secao{background:#09111C;border:1px solid #1B2A3B;border-radius:12px;margin:10px 0;padding:11px}.secao h3{font-size:14px;margin:0 0 9px}.evento{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1B2A3B;font-size:12px}.evento:last-child{border:0}.minuto{color:#1683FF;font-weight:bold;min-width:35px}
.stats-head,.stat-row{display:grid;grid-template-columns:1fr 95px 1fr;text-align:center}.stats-head{font-size:11px;color:#9DAABB}.stat-row{padding:8px 0;border-top:1px solid #1B2A3B;font-size:11px}.nome{color:#9DAABB;font-size:10px}.stat-home{text-align:right;font-weight:bold}.stat-away{text-align:left;font-weight:bold}
.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:6px}.jogador{background:#0D1724;border:1px solid #1B2A3B;border-radius:7px;padding:8px;font-size:11px}.jogador b{color:#1683FF;margin-right:4px}.subtitulo{color:#9DAABB;font-size:10px;margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px 4px;border-bottom:1px solid #1B2A3B;text-align:center}th{color:#9DAABB}
.desporto{display:flex;gap:7px;margin:8px 0 12px}.desporto button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:9px;font-weight:bold}.desporto button.active{color:#FFF;border-color:#1683FF;background:#003B7A}
</style>
</head>
<body>
<header><div class="logo">FUT<span>ZONE</span></div><div class="sub">FUTEBOL EM DIRETO</div></header>
<main id="app"></main>
<div class="bottom"><button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button><button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button><button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button></div>
<script>
const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ligas=[
{name:"Portugal",code:"por.1",icon:"🇵🇹"},{name:"Inglaterra",code:"eng.1",icon:"🏴"},{name:"Espanha",code:"esp.1",icon:"🇪🇸"},{name:"Itália",code:"ita.1",icon:"🇮🇹"},{name:"Alemanha",code:"ger.1",icon:"🇩🇪"},{name:"França",code:"fra.1",icon:"🇫🇷"},{name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},{name:"Bélgica",code:"bel.1",icon:"🇧🇪"},{name:"Champions",code:"uefa.champions",icon:"🏆"},{name:"Europa",code:"uefa.europa",icon:"🏆"},{name:"Conference",code:"uefa.europa.conf",icon:"🏆"}];
let ligaAtual=ligas[0],jogosAtuais=[],modoJogos="todos",desportoAtual="futebol",futsalAtuais=[],futsalTabelaAtual=null;
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function logo(u){return u?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`:"<div style='height:35px'></div>"}
function nav(id){["navJogos","navTabelas","navFav"].forEach(x=>document.getElementById(x).classList.toggle("active",x===id))}
function data8(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}
function estado(ev){
 const s=ev?.status||ev?.competitions?.[0]?.status||{},t=s.type||{};
 if(t.state==="in")return{txt:t.shortDetail||t.detail||t.displayClock||"DIRETO",live:true,final:false};
 if(t.state==="post")return{txt:t.shortDetail||t.detail||"FINAL",live:false,final:true};
 return{txt:t.shortDetail||t.detail||t.name||"",live:false,final:false}
}
function normalizar(ev,l){
 const c=ev.competitions?.[0]||{},cs=c.competitors||[],h=cs.find(x=>x.homeAway==="home")||cs[0]||{},a=cs.find(x=>x.homeAway==="away")||cs[1]||{},s=estado(ev);
 return{id:String(ev.id),date:ev.date||"",status:ev.status||c.status||{},home:{nome:h.team?.displayName||h.team?.shortDisplayName||"Casa",logo:h.team?.logo||"",score:h.score??"-",id:h.team?.id},away:{nome:a.team?.displayName||a.team?.shortDisplayName||"Fora",logo:a.team?.logo||"",score:a.score??"-",id:a.team?.id},estado:s,liga:l.name,code:l.code}
}
async function buscarEventos(l){
 const hoje=new Date(),ini=new Date(hoje),fim=new Date(hoje);
 ini.setDate(ini.getDate()-120);fim.setDate(fim.getDate()+120);
 const urls=[
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`
 ];
 for(const u of urls){
  try{const r=await fetch(u);if(!r.ok)continue;const d=await r.json();if(Array.isArray(d.events)&&d.events.length)return d.events}catch(e){}
 }
 return[]
}
async function carregarJogos(){
 app.innerHTML='<div class="carregando">A carregar jogos das ligas...</div>';
 let lista=[];
 for(const l of ligas){
  const evs=await buscarEventos(l);
  evs.forEach(e=>lista.push(normalizar(e,l)));
 }
 const mapa=new Map();
 lista.forEach(j=>mapa.set(j.id,j));
 jogosAtuais=[...mapa.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
 mostrarJogos()
}
function botoesLigas(){return`<div class="seletor-ligas">${ligas.map(l=>`<button class="liga-btn ${l.code===ligaAtual.code?"active":""}" onclick="selecionarLiga('${l.code}')"><span class="liga-icon">${l.icon}</span>${esc(l.name)}</button>`).join("")}</div>`}
function selecionarLiga(code){ligaAtual=ligas.find(l=>l.code===code)||ligas[0];modoJogos="todos";mostrarJogos()}
function dataLocal(d){try{return new Intl.DateTimeFormat("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d))}catch(e){return""}}
function cartao(j){
 const l=j.estado.live?`<span class="estado-live">🔴 ${esc(j.estado.txt)}</span>`:j.estado.final?`<span class="estado-final">${esc(j.estado.txt)}</span>`:`${esc(dataLocal(j.date))}`;
 return `<div class="jogo" onclick="abrirJogo('${esc(j.id)}','${esc(j.code)}')"><div class="jogo-top"><span>${esc(j.liga)}</span><span>${l}</span></div><div class="equipas"><div class="equipa">${logo(j.home.logo)}${esc(j.home.nome)}</div><div class="resultado">${esc(j.home.score)} - ${esc(j.away.score)}</div><div class="equipa">${logo(j.away.logo)}${esc(j.away.nome)}</div></div></div>`
}
function botoesDesporto(){return `<div class="desporto"><button class="${desportoAtual==='futebol'?'active':''}" onclick="desportoAtual='futebol';mostrarJogos()">⚽ Futebol</button><button class="${desportoAtual==='futsal'?'active':''}" onclick="desportoAtual='futsal';carregarFutsal()">🥅 Futsal</button></div>`}
async function buscarFutsal(){
 const hoje=new Date(),arr=[];
 for(let i=-7;i<=14;i++){
  const d=new Date(hoje);d.setDate(d.getDate()+i);const iso=d.toISOString().slice(0,10);
  try{const r=await fetch(`https://www.sofascore.com/api/v1/sport/futsal/scheduled-events/${iso}`);if(!r.ok)continue;const x=await r.json();(x.events||[]).forEach(e=>arr.push(e))}catch(e){}
 }
 const m=new Map();arr.forEach(e=>m.set(String(e.id),e));return [...m.values()].sort((a,b)=>new Date(a.startTimestamp*1000)-new Date(b.startTimestamp*1000));
}
function cartaoFutsal(e){
 const live=e.status?.type==='inprogress'||e.status?.type==='inprogress';
 const fin=e.status?.type==='finished';
 const h=e.homeTeam||{},a=e.awayTeam||{};
 const hs=live||fin?e.homeScore?.current??e.homeScore?.normaltime??0:'-';
 const as=live||fin?e.awayScore?.current??e.awayScore?.normaltime??0:'-';
 const hora=live?'🔴 AO VIVO':fin?'FINAL':dataLocal(new Date(e.startTimestamp*1000));
 return `<div class="jogo"><div class="jogo-top"><span>${esc(e.tournament?.name||'Futsal')}</span><span>${hora}</span></div><div class="equipas"><div class="equipa"><div style="height:35px"></div>${esc(h.name||'Casa')}</div><div class="resultado">${esc(hs)} - ${esc(as)}</div><div class="equipa"><div style="height:35px"></div>${esc(a.name||'Fora')}</div></div></div>`;
}
async function carregarFutsal(){
 desportoAtual='futsal';nav('navJogos');app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}<div class="carregando">A carregar futsal...</div>`;
 try{futsalAtuais=await buscarFutsal();const l=futsalAtuais;app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}<button class="live-button" onclick="mostrarFutsalLive()"><span class="dot"></span>🥅 Futsal ao Vivo</button>${l.length?l.map(cartaoFutsal).join(''):'<div class="vazio">Não foram encontrados jogos de futsal neste período.</div>'}`}
 catch(e){app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}<div class="erro">Não foi possível carregar o futsal.</div>`}
}
function mostrarFutsalLive(){const l=futsalAtuais.filter(e=>e.status?.type==='inprogress');app.innerHTML=`<h2>🥅 Futsal ao Vivo</h2>${botoesDesporto()}${l.length?l.map(cartaoFutsal).join(''):'<div class="vazio">Não há jogos de futsal ao vivo neste momento.</div>'}`}
function mostrarJogos(){
 nav("navJogos");
 let l=jogosAtuais.filter(j=>j.liga===ligaAtual.name);
 if(modoJogos==="passados")l=l.filter(j=>j.estado.final);
 if(modoJogos==="futuros")l=l.filter(j=>!j.estado.final&&!j.estado.live);
 if(modoJogos==="live")l=l.filter(j=>j.estado.live);
 app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}<button class="live-button" onclick="modoJogos='live';mostrarJogos()"><span class="dot"></span>🔴 Jogos ao Vivo</button>${botoesLigas()}<div class="filtro"><button class="${modoJogos==='todos'?'active':''}" onclick="modoJogos='todos';mostrarJogos()">Todos</button><button class="${modoJogos==='passados'?'active':''}" onclick="modoJogos='passados';mostrarJogos()">Já realizados</button><button class="${modoJogos==='futuros'?'active':''}" onclick="modoJogos='futuros';mostrarJogos()">Futuros</button></div><h2>${esc(ligaAtual.name)}</h2>${l.length?l.map(cartao).join(""):'<div class="vazio">Não há jogos encontrados neste período.</div>'}`
}
function mostrarJogosAoVivo(){modoJogos="live";mostrarJogos()}
function txt(v){return typeof v==="object"?(v?.displayValue??v?.value??v?.text??""):String(v??"")}
function extrairEventos(d){
 let out=[],seen=new Set(),arr=[...(d.plays||[]),...(d.keyEvents||[]),...(d.scoringPlays||[])];
 for(const e of arr){
  const raw=((e?.type?.text||"")+" "+(e?.text||e?.shortText||e?.description||"")).toLowerCase();
  if(!/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(raw))continue;
  const k=String(e?.id||"")+raw+(e?.clock?.displayValue||"");if(seen.has(k))continue;seen.add(k);
  const ic=/yellow|amarelo/.test(raw)?"🟨":/red|vermelho/.test(raw)?"🟥":/substitut/.test(raw)?"🔄":"⚽";
  out.push({m:e?.clock?.displayValue||"",t:e?.text||e?.shortText||e?.description||e?.type?.text||"Evento",i:ic})
 }
 return out
}
function extrairStats(d){
 const gs=[];
 function add(team,stats){
  if(!team||!Array.isArray(stats))return;
  const id=team.id||team.team?.id||team.displayName||team.team?.displayName;
  let g=gs.find(x=>String(x.id)===String(id));if(!g){g={id,nome:team.displayName||team.name||team.team?.displayName||"Equipa",s:[]};gs.push(g)}
  stats.forEach(x=>{const n=x.displayName||x.shortDisplayName||x.name||x.label||x.description;if(n)g.s.push({n,v:txt(x.displayValue??x.value??x.display)})})
 }
 (d.boxscore?.teams||[]).forEach(x=>add(x.team||x,x.statistics||x.stats));
 (d.header?.competitions?.[0]?.competitors||[]).forEach(x=>add(x.team||x,x.statistics));
 (d.competitions?.[0]?.competitors||[]).forEach(x=>add(x.team||x,x.statistics));
 if(gs.length<2)return[];
 const m=new Map();gs.slice(0,2).forEach((g,i)=>g.s.forEach(x=>{const k=x.n.toLowerCase();if(!m.has(k))m.set(k,{n:x.n,h:"-",a:"-"});if(i===0)m.get(k).h=x.v;else m.get(k).a=x.v}));
 return [...m.values()]
}
function extrairPlantel(d){
 const gs=[];
 function add(team,arr){
  if(!team||!Array.isArray(arr))return;
  const id=team.id||team.team?.id||team.displayName||team.team?.displayName;let g=gs.find(x=>String(x.id)===String(id));
  if(!g){g={id,nome:team.displayName||team.name||team.team?.displayName||"Equipa",p:[]};gs.push(g)}
  arr.forEach(x=>{const a=x?.athlete||x?.player||x;if(!a?.displayName&&!a?.fullName)return;const n=a.displayName||a.fullName;if(!g.p.some(p=>p.n===n))g.p.push({n,num:a.jersey||x.jersey||"",pos:a.position?.abbreviation||a.position?.displayName||"",tit:x.starter===true})})
 }
 (d.rosters||[]).forEach(r=>add(r.team||r,r.roster||r.athletes||r.players));
 (d.boxscore?.players||[]).forEach(r=>add(r.team||r,r.statistics||r.athletes||r.roster||r.players));
 return gs.filter(x=>x.p.length)
}
function blocoEventos(a){return`<div class="secao"><h3>⚽ Golos, cartões e eventos</h3>${a.length?a.map(e=>`<div class="evento"><span class="minuto">${esc(e.m)}</span><span>${e.i} ${esc(e.t)}</span></div>`).join(""):'<div class="vazio">Sem eventos disponíveis.</div>'}</div>`}
function blocoStats(a){return`<div class="secao"><h3>📊 Estatísticas</h3>${a.length?`<div class="stats-head"><span>Casa</span><span>ESTAT.</span><span>Fora</span></div>${a.map(x=>`<div class="stat-row"><div class="stat-home">${esc(x.h)}</div><div class="nome">${esc(x.n)}</div><div class="stat-away">${esc(x.a)}</div></div>`).join("")}`:'<div class="vazio">Estatísticas não disponíveis para este jogo.</div>'}</div>`}
function blocoPlantel(gs){return gs.length?`<div class="secao"><h3>👥 Titulares / Plantel</h3>${gs.map(g=>`<div style="margin-bottom:14px"><b>${esc(g.nome)}</b><div class="subtitulo">Jogadores</div><div class="lista-jogadores">${g.p.map(p=>`<div class="jogador"><b>${esc(p.num)}</b>${esc(p.n)}${p.pos?`<small style="display:block;color:#9DAABB">${esc(p.pos)}</small>`:""}</div>`).join("")}</div></div>`).join("")}</div>`:""}
async function abrirJogo(id,code){
 const j=jogosAtuais.find(x=>x.id===id);if(!j)return;
 const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="detalhe-header"><button class="voltar" onclick="this.closest('.overlay').remove()">← Voltar</button></div><div class="detalhe"><div class="jogo-grande"><div class="equipas"><div class="equipa">${logo(j.home.logo)}${esc(j.home.nome)}</div><div><div class="bigscore">${esc(j.home.score)} - ${esc(j.away.score)}</div><div class="estado">${esc(j.estado.txt||dataLocal(j.date))}</div></div><div class="equipa">${logo(j.away.logo)}${esc(j.away.nome)}</div></div></div><div class="carregando">A carregar detalhes...</div></div>`;document.body.appendChild(o);
 try{const r=await fetch(`${ESPN}${encodeURIComponent(code)}/summary?event=${encodeURIComponent(id)}&_=${Date.now()}`);if(!r.ok)throw 0;const d=await r.json();o.querySelector(".detalhe").insertAdjacentHTML("beforeend",blocoEventos(extrairEventos(d))+blocoStats(extrairStats(d))+blocoPlantel(extrairPlantel(d)));o.querySelector(".carregando").remove()}catch(e){o.querySelector(".carregando").outerHTML='<div class="erro">Não foi possível carregar os detalhes deste jogo.</div>'}
}
function mostrarFavoritos(){nav("navFav");app.innerHTML='<h2>⭐ Favoritos</h2><div class="vazio">Seleciona jogos favoritos para os guardares aqui.</div>'}
function valorStat(e,keys,def='-'){
 const ss=Array.isArray(e?.stats)?e.stats:[];const x=ss.find(z=>{const n=String(z?.name||z?.displayName||z?.shortDisplayName||'').toLowerCase();return keys.some(k=>n===k||n.includes(k))});
 return x?.displayValue??x?.value??def;
}
function gruposTabela(d){
 const out=[];const walk=n=>{if(!n||typeof n!=='object')return;if(Array.isArray(n.entries)&&n.entries.length)out.push({nome:n.name||n.displayName||'Classificação',entries:n.entries});if(Array.isArray(n.children))n.children.forEach(walk)};
 if(Array.isArray(d?.children))d.children.forEach(walk);if(!out.length&&Array.isArray(d?.entries)&&d.entries.length)out.push({nome:'Classificação',entries:d.entries});return out;
}
function htmlTabela(grupos){
 if(!grupos.length)return '<div class="vazio">Classificação não disponível.</div>';
 return grupos.map(g=>`<div class="secao"><h3>🏆 ${esc(g.nome)}</h3><div style="overflow-x:auto"><table><thead><tr><th>#</th><th style="text-align:left">Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>${[...g.entries].sort((a,b)=>Number(valorStat(a,['rank','position'],9999))-Number(valorStat(b,['rank','position'],9999))).map((e,i)=>{const t=e.team||e.competitor||{};const n=t.displayName||t.shortDisplayName||t.name||e.name||'Equipa';const pos=valorStat(e,['rank','position'],i+1);return `<tr><td><b>${esc(pos)}</b></td><td style="text-align:left">${esc(n)}</td><td>${esc(valorStat(e,['gamesplayed','played','gp']))}</td><td>${esc(valorStat(e,['wins','won','w']))}</td><td>${esc(valorStat(e,['ties','draws','drawn']))}</td><td>${esc(valorStat(e,['losses','lost','l']))}</td><td>${esc(valorStat(e,['goaldifference','pointdifferential','gd']))}</td><td><b>${esc(valorStat(e,['points','pts','p']))}</b></td></tr>`}).join('')}</tbody></table></div></div>`).join('');
}
async function mostrarTabelas(){
 nav('navTabelas');
 app.innerHTML=`<h2>🏆 Tabelas</h2>${botoesDesporto()}${desportoAtual==='futebol'?botoesLigas():''}<div class="carregando">A carregar classificação...</div>`;
 try{
  if(desportoAtual==='futsal'){
   if(!futsalAtuais.length)futsalAtuais=await buscarFutsal();
   const e=futsalAtuais.find(x=>x.tournament?.uniqueTournament?.id&&x.season?.id)||futsalAtuais.find(x=>x.tournament?.uniqueTournament?.id);
   if(!e)throw 0;
   const tid=e.tournament.uniqueTournament.id, sid=e.season?.id;
   if(!sid)throw 0;
   const r=await fetch(`https://www.sofascore.com/api/v1/unique-tournament/${tid}/season/${sid}/standings/total`);if(!r.ok)throw 0;const d=await r.json();
   const entries=(d?.standings?.[0]?.rows||[]).map(x=>({team:x.team,stats:[{name:'rank',value:x.position},{name:'gamesplayed',value:x.matches},{name:'wins',value:x.wins},{name:'ties',value:x.draws},{name:'losses',value:x.losses},{name:'goaldifference',value:x.goalDifference},{name:'points',value:x.points}]}));
   const a=app.querySelector('.carregando');a.outerHTML=htmlTabela([{nome:e.tournament.uniqueTournament.name,entries}]);
  }else{
   const urls=[`https://site.api.espn.com/apis/v2/sports/soccer/${encodeURIComponent(ligaAtual.code)}/standings?_=${Date.now()}`,`https://site.api.espn.com/apis/v2/sports/soccer/${encodeURIComponent(ligaAtual.code)}/standings?season=${new Date().getFullYear()}&_=${Date.now()}`];let d=null;
   for(const u of urls){try{const r=await fetch(u);if(r.ok){d=await r.json();if(d)break}}catch(e){}}
   if(!d)throw 0;app.querySelector('.carregando').outerHTML=htmlTabela(gruposTabela(d));
  }
 }catch(e){const a=app.querySelector('.carregando');if(a)a.outerHTML='<div class="erro">Não foi possível carregar a classificação desta competição.</div>'}
}

carregarJogos();setInterval(carregarJogos,120000);
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
