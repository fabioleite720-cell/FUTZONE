<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:80px
}
header{
background:#000;
border-bottom:1px solid #222;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:20
}
.logo{font-size:28px;font-weight:900;color:#168cff}
.logo span{color:#fff}
.container{padding:15px;max-width:900px;margin:auto}
button{
border:0;
border-radius:10px;
padding:10px 14px;
background:#168cff;
color:#fff;
font-weight:bold
}
.filters{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 0
}
.filters button{
white-space:nowrap;
background:#151515;
border:1px solid #333
}
.filters button.active{
background:#168cff;
border-color:#168cff
}
.card{
background:#101010;
border:1px solid #252525;
border-radius:14px;
padding:14px;
margin-bottom:12px
}
.league{
color:#168cff;
font-size:13px;
font-weight:bold;
margin-bottom:8px
}
.teams{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:10px
}
.team{
font-weight:bold;
cursor:pointer
}
.team:last-child{text-align:right}
.team:hover{color:#168cff}
.team-logo{
width:35px;
height:35px;
object-fit:contain;
vertical-align:middle;
margin-right:7px
}
.score{
font-size:20px;
font-weight:900
}
.status{
font-size:12px;
color:#aaa;
margin-top:8px
}
.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#080808;
border-top:1px solid #252525;
display:flex;
justify-content:space-around;
align-items:center;
z-index:30
}
.nav button{
background:none;
color:#aaa;
padding:8px
}
.nav button.active{color:#168cff}
h2{margin-top:5px}
.back{margin-bottom:15px;background:#202020}
.plantel-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
.player{
background:#151515;
border:1px solid #292929;
border-radius:14px;
padding:12px;
text-align:center;
cursor:pointer
}
.player:hover{
border-color:#168cff;
transform:translateY(-2px)
}
.player img{
width:80px;
height:80px;
object-fit:cover;
border-radius:50%;
background:#222;
margin-bottom:8px
}
.player-name{
font-weight:bold;
font-size:14px
}
.player-info{
color:#999;
font-size:12px;
margin-top:5px
}
.player-profile{text-align:center;padding:10px}
.player-profile img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
background:#181818;
border:3px solid #168cff
}
.player-profile h1{margin:15px 0 5px}
.position{
color:#168cff;
font-weight:bold
}
.info-box{
background:#111;
border:1px solid #292929;
border-radius:14px;
margin-top:20px;
overflow:hidden
}
.info-row{
display:flex;
justify-content:space-between;
padding:14px;
border-bottom:1px solid #222
}
.info-row:last-child{border-bottom:0}
.info-label{color:#888}
.info-value{font-weight:bold}
.empty{
text-align:center;
color:#777;
padding:30px
}
table{
width:100%;
border-collapse:collapse;
background:#101010
}
th,td{
padding:10px 6px;
border-bottom:1px solid #252525;
text-align:center;
font-size:13px
}
th{color:#168cff}
@media(max-width:500px){
.plantel-grid{grid-template-columns:repeat(2,1fr)}
.player img{width:70px;height:70px}
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<div class="container" id="app"></div>

<div class="nav">
<button id="navJogos" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;

const ligas=[
{nome:"Portugal",arquivo:"data/primeira-liga.json"},
{nome:"Inglaterra",arquivo:"data/premier-league.json"},
{nome:"Espanha",arquivo:"data/la-liga.json"},
{nome:"Itália",arquivo:"data/serie-a.json"},
{nome:"Alemanha",arquivo:"data/bundesliga.json"}
];

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function obterCompeticao(j){
return j.competitions?.[0]||{};
}

function obterEquipas(j){

const c=obterCompeticao(j);
const comps=c.competitors||[];

let home=comps.find(x=>x.homeAway==="home")||comps[0]||{};
let away=comps.find(x=>x.homeAway==="away")||comps[1]||{};

return {home,away};
}

function nomeEquipa(c){
return c.team?.displayName||
c.team?.shortDisplayName||
c.team?.name||
"Equipa";
}

function idEquipa(c){
return c.team?.id||c.id||null;
}

function logoEquipa(c){
return c.team?.logo||"";
}

function estadoJogo(j){

const s=obterCompeticao(j).status?.type;

if(s?.state==="in")return"LIVE";
if(s?.completed)return"RESULTADO";

return"PRÓXIMO";
}

async function carregar(){

jogos=[];

for(const liga of ligas){

try{

const r=await fetch(liga.arquivo+"?v="+Date.now());

if(!r.ok)continue;

const d=await r.json();

const lista=Array.isArray(d.events)?d.events:[];

lista.forEach(j=>{
j.__liga=liga.nome;
jogos.push(j);
});

}catch(e){}

}

mostrarJogos();
}

function mostrarJogos(){

document.getElementById("navJogos").classList.add("active");
document.getElementById("navTabelas").classList.remove("active");
document.getElementById("navFav").classList.remove("active");

let html=`

<h2>Jogos</h2>

<div class="filters">

${["Todos","LIVE","Próximos","Resultados"].map(x=>`

<button
class="${filtroAtual===x?"active":""}"
onclick="filtroAtual='${x}';mostrarJogos()">
${x}
</button>

`).join("")}

</div>

<div class="filters">

${["Todos",...ligas.map(x=>x.nome)].map(x=>`

<button
class="${ligaAtual===x?"active":""}"
onclick="ligaAtual='${x}';mostrarJogos()">
${x}
</button>

`).join("")}

</div>

<div id="lista"></div>
`;

document.getElementById("app").innerHTML=html;

let lista=jogos.filter(j=>{

let ligaOK=
ligaAtual==="Todos"||
j.__liga===ligaAtual;

let estado=estadoJogo(j);

let filtroOK=
filtroAtual==="Todos"||
filtroAtual==="LIVE"&&estado==="LIVE"||
filtroAtual==="Próximos"&&estado==="PRÓXIMO"||
filtroAtual==="Resultados"&&estado==="RESULTADO";

return ligaOK&&filtroOK;
});

const div=document.getElementById("lista");

if(!lista.length){
div.innerHTML='<div class="empty">Não há jogos disponíveis.</div>';
return;
}

div.innerHTML=lista.map(jogoCard).join("");
}

function jogoCard(j){

const e=obterEquipas(j);

const hn=nomeEquipa(e.home);
const an=nomeEquipa(e.away);

const hid=idEquipa(e.home);
const aid=idEquipa(e.away);

const hl=logoEquipa(e.home);
const al=logoEquipa(e.away);

const comp=obterCompeticao(j);
const estado=estadoJogo(j);

let hs=e.home.score??"-";
let as=e.away.score??"-";

return`

<div class="card">

<div class="league">${esc(j.__liga)}</div>

<div class="teams">

<div class="team"
onclick='abrirEquipa(${JSON.stringify({
id:hid,
name:hn,
league:j.__liga,
logo:hl
})})'>

${hl?`<img class="team-logo" src="${esc(hl)}">`:""}

${esc(hn)}

</div>

<div class="score">
${esc(hs)} - ${esc(as)}
</div>

<div class="team"
onclick='abrirEquipa(${JSON.stringify({
id:aid,
name:an,
league:j.__liga,
logo:al
})})'>

${al?`<img class="team-logo" src="${esc(al)}">`:""}

${esc(an)}

</div>

</div>

<div class="status">

${estado}
${j.date?" • "+esc(j.date):""}

</div>

</div>
`;
}

/* EQUIPA */

function abrirEquipa(e){

equipaAtual=e;

mostrarEquipa();
}

async function mostrarEquipa(){

document.getElementById("app").innerHTML=`

<button class="back" id="voltar">
← Voltar
</button>

<div style="text-align:center">

${equipaAtual.logo?
`<img src="${esc(equipaAtual.logo)}"
style="width:80px;height:80px;object-fit:contain">`
:""}

<h2>${esc(equipaAtual.name)}</h2>

<div class="league">
${esc(equipaAtual.league)}
</div>

</div>

<h3>👥 Plantel</h3>

<div id="plantel">
<div class="empty">A carregar plantel...</div>
</div>

<h3>⚽ Jogos</h3>

<div id="jogos-equipa"></div>
`;

document.getElementById("voltar").onclick=mostrarJogos;

const relacionados=jogos.filter(j=>{

const e=obterEquipas(j);

return String(idEquipa(e.home))===String(equipaAtual.id)||
String(idEquipa(e.away))===String(equipaAtual.id);

});

document.getElementById("jogos-equipa").innerHTML=
relacionados.length
?relacionados.map(jogoCard).join("")
:'<div class="empty">Sem jogos encontrados.</div>';

try{

const r=await fetch("data/planteis.json?v="+Date.now());

if(!r.ok)throw new Error();

const dados=await r.json();

let plantel=dados[String(equipaAtual.id)];

if(!plantel&&dados.teams){

const t=dados.teams.find(x=>
String(x.id)===String(equipaAtual.id));

plantel=t?.players||t?.roster;
}

if(Array.isArray(dados)&&!plantel){

const t=dados.find(x=>
String(x.id)===String(equipaAtual.id));

plantel=t?.players||t?.roster;
}

if(!plantel){

document.getElementById("plantel").innerHTML=
'<div class="empty">Plantel não disponível.</div>';

return;
}

if(!Array.isArray(plantel))
plantel=Object.values(plantel);

document.getElementById("plantel").innerHTML=`

<div class="plantel-grid">

${plantel.map((p,i)=>{

const jogador={
id:p.id||p.playerId||i,
name:p.name||p.displayName||p.fullName||"Jogador",
number:p.number||p.jersey||p.jerseyNumber||"-",
position:p.position||p.positionName||"—",
age:p.age||"—",
nationality:p.nationality||p.country||"—",
photo:p.photo||p.headshot||p.image||""
};

return`

<div class="player"
onclick='abrirJogador(${JSON.stringify(jogador)})'>

${jogador.photo?

`<img src="${esc(jogador.photo)}">`

:

`<div style="
width:80px;
height:80px;
border-radius:50%;
background:#222;
margin:auto auto 8px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px">
⚽
</div>`

}

<div class="player-name">
${esc(jogador.name)}
</div>

<div class="player-info">
#${esc(jogador.number)} • ${esc(jogador.position)}
</div>

</div>

`;

}).join("")}

</div>
`;

}catch(e){

document.getElementById("plantel").innerHTML=
'<div class="empty">Não foi possível carregar o plantel.</div>';

}
}

/* JOGADOR */

function abrirJogador(p){

document.getElementById("app").innerHTML=`

<button class="back" id="voltarJogador">
← Voltar ao plantel
</button>

<div class="player-profile">

${p.photo?

`<img src="${esc(p.photo)}">`

:

`<div style="
width:150px;
height:150px;
border-radius:50%;
background:#181818;
border:3px solid #168cff;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:60px">
⚽
</div>`

}

<h1>${esc(p.name)}</h1>

<div class="position">
${esc(p.position)}
</div>

<div class="info-box">

<div class="info-row">
<span class="info-label">Número</span>
<span class="info-value">#${esc(p.number)}</span>
</div>

<div class="info-row">
<span class="info-label">Posição</span>
<span class="info-value">${esc(p.position)}</span>
</div>

<div class="info-row">
<span class="info-label">Idade</span>
<span class="info-value">${esc(p.age)}</span>
</div>

<div class="info-row">
<span class="info-label">Nacionalidade</span>
<span class="info-value">${esc(p.nationality)}</span>
</div>

</div>

</div>
`;

document.getElementById("voltarJogador").onclick=mostrarEquipa;
}

/* TABELAS */

async function mostrarTabelas(){

document.getElementById("navJogos").classList.remove("active");
document.getElementById("navTabelas").classList.add("active");
document.getElementById("navFav").classList.remove("active");

document.getElementById("app").innerHTML=`

<h2>Tabelas</h2>

<div id="tabelas">
<div class="empty">A carregar...</div>
</div>
`;

let html="";

for(const liga of ligas){

try{

const ficheiro=
liga.arquivo.replace(".json","-classificacao.json");

const r=await fetch(ficheiro+"?v="+Date.now());

if(!r.ok)continue;

const d=await r.json();

const entries=procurarEntries(d);

if(entries.length)
html+=criarTabela(liga.nome,entries);

}catch(e){}

}

document.getElementById("tabelas").innerHTML=
html||'<div class="empty">Tabelas indisponíveis.</div>';
}

function procurarEntries(d){

if(Array.isArray(d))return d;

if(Array.isArray(d.entries))
return d.entries;

if(Array.isArray(d.standings))
return d.standings;

if(d.children){

for(const c of d.children){

const x=procurarEntries(c);

if(x.length)return x;
}

}

return[];
}

function stat(e,n){

if(e.stats){

const s=e.stats.find(x=>
x.name===n||
x.shortDisplayName===n
);

if(s)return s.value??s.displayValue??"-";
}

return e[n]??"-";
}

function criarTabela(nome,entries){

return`

<div class="card">

<div class="league">${esc(nome)}</div>

<table>

<tr>
<th>#</th>
<th>Equipa</th>
<th>J</th>
<th>V</th>
<th>E</th>
<th>D</th>
<th>Pts</th>
</tr>

${entries.map((e,i)=>{

const t=e.team||e;

return`

<tr>

<td>${i+1}</td>

<td class="team"
onclick='abrirEquipa(${JSON.stringify({
id:t.id,
name:t.displayName||t.name||"Equipa",
league:nome,
logo:t.logo||""
})})'>

${esc(t.displayName||t.name||"Equipa")}

</td>

<td>${esc(stat(e,"gamesPlayed"))}</td>
<td>${esc(stat(e,"wins"))}</td>
<td>${esc(stat(e,"ties")||stat(e,"draws"))}</td>
<td>${esc(stat(e,"losses"))}</td>
<td><b>${esc(stat(e,"points"))}</b></td>

</tr>

`;

}).join("")}

</table>

</div>
`;
}

/* FAVORITOS */

function mostrarFavoritos(){

document.getElementById("navJogos").classList.remove("active");
document.getElementById("navTabelas").classList.remove("active");
document.getElementById("navFav").classList.add("active");

document.getElementById("app").innerHTML=`

<h2>⭐ Favoritos</h2>

<div class="card">

<div class="empty">
Favoritos em breve.
</div>

</div>
`;
}

carregar();

</script>

</body>
</html>
