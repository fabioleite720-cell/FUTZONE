                  "wins",                             "win"                         ),                      e:                         procurarStat(                             "ties",                             "draws",                             "draw"                         ),                      d:                         procurarStat(                             "losses",                             "loss"                         ),                      gm:                         procurarStat(                             "pointsFor",                             "goalsFor",                             "goals"                         ),                      gs:                         procurarStat(                             "pointsAgainst",                             "goalsAgainst"                         ),                      pts:                         procurarStat(                             "points",                             "pts"                         )                  });              }          }      }       /* =====================================================        FALLBACK DAS COMPETIÇÕES QUE JÁ EXISTEM NA APP        ===================================================== */      if(!tabelaAtual.length){          const f =             FALLBACK[ligaAtual];          if(f?.tabela){              tabelaAtual =                 f.tabela.map((x,i)=>({                      grupo:"",                      nome:x[0],                      logo:"",                      j:x[2] || 0,                      v:x[3] || 0,                      e:x[4] || 0,                      d:x[5] || 0,                      gm:x[6] || 0,                      gs:x[7] || 0,                      pts:x[1] || 0                  }));          }      }      return tabelaAtual;  }   /* =========================================================    EXTRAÇÃO DOS TITULARES    ========================================================= */  function obterTitulares(data,competitor){      const todos =         obterAtletas(data,competitor) || [];      if(!todos.length){         return [];     }      /* Elimina jogadores duplicados */     const unicos = [];      const ids = new Set();      for(const p of todos){          const id =             p?.id ||             p?.athlete?.id ||             (                 p?.displayName ||                 p?.fullName ||                 p?.shortName ||                 Math.random()             );          if(ids.has(String(id))){             continue;         }          ids.add(String(id));          unicos.push(p);      }       /* Procura informação explícita de titular */     const marcados =         unicos.filter(p => {              return (                 p?.starter === true ||                 p?.starter === 1 ||                 p?.starter === "true" ||                 p?.isStarter === true ||                 p?.isStarter === 1 ||                 p?.statistics?.some?.(                     s =>                     s?.starter === true ||                     s?.starter === 1 ||                     s?.starter === "true"                 )             );          });      if(marcados.length >= 7){          return marcados.slice(0,11);      }       /* Se a ESPN não enviar a flag starter,        usamos os primeiros jogadores disponíveis,        mantendo a ordem da fonte. */     return unicos.slice(0,11);  }   /* =========================================================    POSIÇÕES NO CAMPO    ========================================================= */  function distribuirTitularesCampo(lista,away=false){      const grupos = {          "Guarda-redes":[],          "Defesa":[],          "Médio":[],          "Avançado":[],          "Jogador":[]      };      lista.forEach(p => {          const pos =             posicaoJogador(p);          if(grupos[pos]){             grupos[pos].push(p);         }else{             grupos.Jogador.push(p);         }      });       /* Se houver jogadores sem posição,        tentamos colocá-los na linha do meio */     if(grupos.Jogador.length){          grupos["Médio"] =             grupos["Médio"].concat(                 grupos.Jogador             );          grupos.Jogador = [];      }       const linhas = [          {             grupo:"Guarda-redes",             y:away ? 92 : 8         },          {             grupo:"Defesa",             y:away ? 77 : 23         },          {             grupo:"Médio",             y:away ? 63 : 37         },          {             grupo:"Avançado",             y:away ? 52 : 48         }      ];      const resultado = [];       linhas.forEach(linha => {          const jogadores =             grupos[linha.grupo] || [];          const total =             jogadores.length;          jogadores.forEach((p,index)=>{              let x = 50;              if(total > 1){                  x =                     15 +                     (                         70 *                         index /                         (total-1)                     );              }              resultado.push({                  jogador:p,                  x,                  y:linha.y,                  away              });          });      });       return resultado;  }   /* =========================================================    CAMPO DE FUTEBOL    ========================================================= */  function renderCampoOnze(     home,     away,     homeNome,     awayNome ){      const homeCampo =         distribuirTitularesCampo(             home,             false         );      const awayCampo =         distribuirTitularesCampo(             away,             true         );       const jogadores =         homeCampo.concat(             awayCampo         );       if(!jogadores.length){          return`         <div class="empty">             11 inicial não disponível neste momento.         </div>         `;      }       return`      <div class="detailCard">          <h3>⚽ 11 Inicial</h3>          <div class="footballPitch">              <div class="pitchHalf"></div>              <div class="pitchCircle"></div>              <div class="pitchCenter"></div>              <div class="pitchBox top"></div>              <div class="pitchBox bottom"></div>              <div class="pitchSmallBox top"></div>              <div class="pitchSmallBox bottom"></div>              <div class="pitchGoal top"></div>              <div class="pitchGoal bottom"></div>               ${jogadores.map(item => {                  const p =                     item.jogador;                  const nome =                     p?.displayName ||                     p?.fullName ||                     p?.shortName ||                     "Jogador";                  const numero =                     p?.jersey ??                     p?.jerseyNumber ??                     p?.uniformNumber ??                     p?.number ??                     "—";                  const pos =                     posicaoJogador(p);                  return`                  <div                     class="pitchPlayer ${item.away?"away":""}"                     style="                         left:${item.x}%;                         top:${item.y}%;                     "                     title="${escapeHtml(nome)}"                 >                      <div class="pitchPlayerDot">                         ${escapeHtml(numero)}                     </div>                      <div class="pitchPlayerName">                         ${escapeHtml(nome)}                     </div>                  </div>                  `;              }).join("")}          </div>           <div class="lineupLegend">              <span>                 <i class="lineupDot"></i>                 ${escapeHtml(homeNome)}             </span>              <span>                 <i class="lineupDot away"></i>                 ${escapeHtml(awayNome)}             </span>          </div>      </div>      `;  }   /* =========================================================    11 INICIAL — SUBSTITUI A LISTA ANTIGA NO JOGO    ========================================================= */  function onzesHTML(data,e){      const comps =         data?.header?.competitions?.[0] ||         data?.competitions?.[0] ||         e?.competitions?.[0];      const competitors =         comps?.competitors || [];      if(!competitors.length){         return "";     }       const home =         competitors.find(             x=>x.homeAway==="home"         ) ||         competitors[0];      const away =         competitors.find(             x=>x.homeAway==="away"         ) ||         competitors[1];       if(!home || !away){         return "";     }       const homeTitulares =         obterTitulares(             data,             home         );      const awayTitulares =         obterTitulares(             data,             away         );       if(         !homeTitulares.length &&         !awayTitulares.length     ){          return`          <div class="detailCard">              <h3>⚽ 11 Inicial</h3>              <div class="empty">                 Os titulares ainda não estão disponíveis para este jogo.             </div>          </div>          `;      }       return renderCampoOnze(          homeTitulares,          awayTitulares,          nomeEquipa(home.team),          nomeEquipa(away.team)      );  }   /* =========================================================    FIM DAS CORREÇÕES FUTZONE    ========================================================= */ </script> </body> </html>
