:root{
--blue:#0057B8;--blue2:#1683FF;--blue3:#003B7A;
--bg:#03060B;--panel:#09111C;--panel2:#0D1724;
--border:#1B2A3B;--text:#F5F7FA;--muted:#9DAABB;
--red:#FF4054;--green:#20D68A;--yellow:#FFD43B;--white:#fff
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:78px}
.app{width:100%;max-width:720px;margin:auto}
.header{position:sticky;top:0;z-index:30;padding:16px 15px 13px;background:rgba(3,6,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font-size:28px;line-height:1;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--blue2)}
.subtitle{margin-top:4px;font-size:11px;color:var(--muted);letter-spacing:1.3px;font-weight:700}
.sportSwitch{display:flex;gap:8px;margin-top:14px}
.sportBtn{flex:1;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:12px;font-weight:800}
.sportBtn.active{background:var(--blue);color:white;border-color:var(--blue)}
main{padding:14px}
.sectionTitle{font-size:17px;font-weight:900;margin:5px 0 10px}
.leagues{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.leagues::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.league{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800}
.league.active{color:white;background:var(--blue3);border-color:var(--blue2)}
.liveAll{width:100%;border:0;border-radius:13px;padding:13px;margin:3px 0 12px;background:linear-gradient(135deg,#8f0012,#e01832);color:white;font-weight:900}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.filter{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}
.filter.active{background:var(--blue);border-color:var(--blue);color:white}
.search{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:white;outline:none;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;margin-bottom:10px;padding:12px}
.cardTop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;margin-bottom:9px}
.teams{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:8px}
.team{text-align:center;font-size:12px;font-weight:800}
.team img{display:block;width:34px;height:34px;object-fit:contain;margin:0 auto 5px}
.score{text-align:center;font-size:18px;font-weight:900}
.status{font-size:10px;color:var(--muted);margin-top:3px}
.live{color:var(--red)!important}
.star{background:none;border:0;color:var(--muted);font-size:20px;padding:0}
.star.active{color:var(--yellow)}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:8px 4px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
th{color:var(--muted)}
td:first-child,th:first-child{text-align:left}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(3,6,11,.97);border-top:1px solid var(--border);display:flex;justify-content:center}
.nav button{width:25%;max-width:180px;border:0;background:transparent;color:var(--muted);padding:10px 4px 9px;font-size:11px;font-weight:800}
.nav button.active{color:white}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow:auto;display:none}
.overlay.show{display:block}
.overlayHead{position:sticky;top:0;background:rgba(3,6,11,.97);border-bottom:1px solid var(--border);padding:13px 14px;z-index:2}
.back{border:0;background:var(--panel);color:white;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:800}
.detail{padding:14px}
.detailTitle{font-size:20px;font-weight:900;margin:10px 0}
.section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}
.section h3{font-size:14px;margin:0 0 10px}
.pitch{height:330px;background:#075c36;border-radius:14px;position:relative;border:2px solid #1683FF}
.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.6)}
.pitch:after{content:"";position:absolute;width:90px;height:90px;border:1px solid rgba(255,255,255,.6);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.playerDot{position:absolute;width:28px;height:28px;border-radius:50%;background:white;color:#111;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.bottomSpace{height:15px}
@media(min-width:700px){
main{padding:18px}
.card{padding:14px}
}
</style>

function normalizarESPN(ev,liga){
const c=ev?.competitions?.[0]||{};
const cs=c.competitors||[];
const h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
const a=cs.find(x=>x.homeAway==="away")||cs[1]||{};
const st=c.status||ev.status||{};
const type=st.type||{};
let estado="";

if(type.state==="in")estado="DIRETO";
else if(type.state==="post")estado="FINAL";
else if(type.name==="STATUS_POSTPONED")estado="ADIADO";
else if(type.name==="STATUS_CANCELED")estado="CANCELADO";
else estado=type.shortDetail||type.detail||type.description||"";

return{
id:String(ev.id),
codigo:liga,
data:ev.date||c.date||"",
home:{
id:h?.team?.id||h?.id||null,
nome:h?.team?.displayName||h?.team?.shortDisplayName||h?.team?.name||"Casa",
logo:h?.team?.logo||"",
score:h?.score??null
},
away:{
id:a?.team?.id||a?.id||null,
nome:a?.team?.displayName||a?.team?.shortDisplayName||a?.team?.name||"Fora",
logo:a?.team?.logo||"",
score:a?.score??null
},
estado
};
}

async function buscarESPN(liga){
try{
const r=await fetch(API+encodeURIComponent(liga)+"/scoreboard?limit=100");
if(!r.ok)return[];
const j=await r.json();
return(j.events||[]).map(e=>normalizarESPN(e,liga));
}catch(e){
console.warn("ESPN:",e);
return[];
}
}

 <script>
/* =========================================================
   FUTZONE — PARTE 2/3
   MOTOR DE JOGOS + TABELAS + FUTSAL + EQUIPAS
   ========================================================= */

function makeFallbackGame(liga,row,i){
  const [data,hora,casa,fora,hs,as] = row;

  const id = "fzfb-" + liga + "-" + i + "-" +
    String(casa+"-"+fora).toLowerCase()
      .replace(/[^a-z0-9]+/g,"-");

  let status = "scheduled";
  let statusText = "Próximo";

  if(hs !== null && as !== null){
    status = "final";
    statusText = "Final";
  }

  return {
    id,
    date: data,
    dateStr: data + (hora ? "T" + hora + ":00Z" : ""),
    league: liga,
    home: {
      name: casa,
      logo: ""
    },
    away: {
      name: fora,
      logo: ""
    },
    homeScore: hs,
    awayScore: as,
    status,
    statusText,
    venue: "",
    fallback: true
  };
}


function fallbackGames(liga){
  const rows = FALLBACK[liga] && FALLBACK[liga].games
    ? FALLBACK[liga].games
    : [];

  return rows.map((r,i)=>makeFallbackGame(liga,r,i));
}


function jogoKey(j){
  const d = j.date || j.dateStr || "";
  const h = j.home?.name || "";
  const a = j.away?.name || "";

  return (
    String(d).slice(0,10) + "|" +
    normalizarESPN(h) + "|" +
    normalizarESPN(a)
  ).toLowerCase();
}


function ordenarJogos(lista){
  return lista.sort((a,b)=>{
    const da = new Date(a.dateStr || a.date || 0).getTime();
    const db = new Date(b.dateStr || b.date || 0).getTime();
    return da-db;
  });
}


async function buscarJogosLiga(liga){

  const fallback = fallbackGames(liga);
  const encontrados = [];

  const hojeBase = new Date();

  for(let offset=-7; offset<=14; offset++){

    const d = new Date(hojeBase);
    d.setDate(d.getDate()+offset);

    const data = d.toISOString().slice(0,10);

    try{
      const url =
        API +
        liga +
        "/scoreboard?dates=" +
        data.replaceAll("-","");

      const dados = await buscarESPN(url);

      if(dados && Array.isArray(dados.events)){
        for(const ev of dados.events){

          const c = ev.competitions?.[0];
          if(!c) continue;

          const comps = c.competitors || [];

          const home = comps.find(x=>x.homeAway==="home");
          const away = comps.find(x=>x.homeAway==="away");

          if(!home || !away) continue;

          encontrados.push({
            id: ev.id,
            date: ev.date,
            dateStr: ev.date,
            league: liga,
            home:{
              name: home.team?.displayName ||
                   home.team?.shortDisplayName ||
                   "Casa",
              logo: home.team?.logo || ""
            },
            away:{
              name: away.team?.displayName ||
                   away.team?.shortDisplayName ||
                   "Fora",
              logo: away.team?.logo || ""
            },
            homeScore:
              home.score !== undefined && home.score !== null
                ? Number(home.score)
                : null,
            awayScore:
              away.score !== undefined && away.score !== null
                ? Number(away.score)
                : null,
            status:
              c.status?.type?.state ||
              ev.status?.type?.state ||
              "scheduled",
            statusText:
              c.status?.type?.shortDetail ||
              ev.status?.type?.shortDetail ||
              c.status?.type?.description ||
              "Próximo",
            venue:
              c.venue?.fullName ||
              c.venue?.address?.city ||
              ""
          });
        }
      }

    }catch(e){
      console.warn("FUTZONE ESPN:",e);
    }
  }

  const mapa = new Map();

  for(const j of fallback){
    mapa.set(jogoKey(j),j);
  }

  for(const j of encontrados){

    const key = jogoKey(j);
    const anterior = mapa.get(key);

    /*
      Se a ESPN tem o jogo, damos prioridade à ESPN.
      Se o fallback tiver resultado e a ESPN não tiver,
      mantemos o resultado confirmado.
    */
    if(!anterior){
      mapa.set(key,j);
    }else{

      const temResultado =
        j.homeScore !== null &&
        j.awayScore !== null;

      const fallbackTemResultado =
        anterior.homeScore !== null &&
        anterior.awayScore !== null;

      if(temResultado || !fallbackTemResultado){
        mapa.set(key,j);
      }
    }
  }

  return ordenarJogos([...mapa.values()]);
}


/* =========================================================
   FORMATAÇÃO
   ========================================================= */

function formatarDataJogo(j){

  const valor = j.dateStr || j.date;

  if(!valor) return "";

  const d = new Date(valor);

  if(Number.isNaN(d.getTime())){

    const partes = String(valor).split("-");

    if(partes.length===3){
      return partes[2] + "/" +
             partes[1] + "/" +
             partes[0];
    }

    return valor;
  }

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  });
}


function formatarHoraJogo(j){

  const valor = j.dateStr || j.date;

  if(!valor) return "";

  const d = new Date(valor);

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}


function estadoJogo(j){

  if(j.status==="in" ||
     j.status==="live" ||
     j.status==="inprogress"){
    return "live";
  }

  if(
    j.homeScore !== null &&
    j.awayScore !== null
  ){
    return "finished";
  }

  return "upcoming";
}

/* =========================================================
   FILTROS
   ========================================================= */

function filtrarJogos(lista){

  const pesquisa =
    document.getElementById("searchInput")?.value
      ?.trim()
      .toLowerCase() || "";

  return lista.filter(j=>{

    const texto =
      `${j.home?.name || ""} ${j.away?.name || ""}`
      .toLowerCase();

    if(pesquisa && !texto.includes(pesquisa)){
      return false;
    }

    const estado = estadoJogo(j);

    if(filtroAtual==="live" && estado!=="live"){
      return false;
    }

    if(filtroAtual==="upcoming" && estado!=="upcoming"){
      return false;
    }

    if(filtroAtual==="results" && estado!=="finished"){
      return false;
    }

    return true;
  });
}

          (v*3+e);

async function carregarTabela(){

  const container =
    document.getElementById("gamesList");

  if(!container) return;

  container.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      A carregar classificação...
    </div>
  `;

  if(ligaAtual==="por.2"){
    container.innerHTML =
      renderTabelaFallback2();
    return;
  }

  if(ligaAtual==="por.3"){
    container.innerHTML =
      renderTabelaLiga3(
        "A",
        "Liga 3 — Grupo A"
      ) +
      renderTabelaLiga3(
        "B",
        "Liga 3 — Grupo B"
      );
    return;
  }

  if(ligaAtual==="por.w.1"){
    container.innerHTML =
      renderTabelaBPI();
    return;
  }

  try{

    const url =
      API_CORE +
      "leagues/" +
      ligaAtual +
      "/standings";

    const dados =
      await buscarESPN(url);

    let rows = [];

    if(Array.isArray(dados?.standings)){
      rows = dados.standings;
    }

    if(dados?.children){
      dados.children.forEach(child=>{
        if(Array.isArray(child.standings)){
          rows.push(...child.standings);
        }
      });
    }

    if(!rows.length){

      container.innerHTML = `
        <div class="emptyState">
          <h3>Classificação indisponível</h3>
          <p>
            A competição ainda não disponibilizou
            a tabela através da fonte de dados.
          </p>
        </div>
      `;

      return;
    }

    const convertidas = rows.map((item)=>{

      const team =
        item.team ||
        item.entry ||
        {};

      const stats = {};

      if(Array.isArray(item.stats)){
        item.stats.forEach(s=>{
          if(s.name){
            stats[s.name] =
              s.value ??
              s.displayValue ??
              0;
          }
        });
      }

      return {
        name:
          team.displayName ||
          team.name ||
          "Equipa",

        logo:
          team.logos?.[0]?.href ||
          team.logo ||
          "",

        played:
          stats.gamesPlayed ||
          stats.played ||
          0,

        wins:
          stats.wins ||
          0,

        draws:
          stats.ties ||
          stats.draws ||
          0,

        losses:
          stats.losses ||
          0,

        gf:
          stats.pointsFor ||
          stats.goalsFor ||
          0,

        ga:
          stats.pointsAgainst ||
          stats.goalsAgainst ||
          0,

        points:
          stats.points ||
          0
      };
    });

    container.innerHTML =
      renderTabela(
        convertidas,
        LIGAS[ligaAtual] || "Classificação"
      );

  }catch(e){

    console.warn("Tabela:",e);

    container.innerHTML = `
      <div class="emptyState">
        <h3>Não foi possível carregar</h3>
        <p>Tente novamente.</p>
      </div>
    `;
  }
}

/* =========================================================
   FUTSAL — CLASSIFICAÇÃO
   ========================================================= */

function calcularTabelaFutsal(){

  corrigirResultadosFutsal();

  const mapa = {};

  FUTSAL_TEAMS.forEach(nome=>{
    mapa[nome] = {
      name:nome,
      played:0,
      wins:0,
      draws:0,
      losses:0,
      gf:0,
      ga:0,
      gd:0,
      points:0
    };
  });

  FUTSAL_GAMES.forEach(g=>{

    const casa = g[1];
    const fora = g[2];
    const hs = g[3];
    const as = g[4];

    if(
      hs===null ||
      as===null ||
      hs===undefined ||
      as===undefined
    ){
      return;
    }

    if(!mapa[casa]){
      mapa[casa]={
        name:casa,
        played:0,
        wins:0,
        draws:0,
        losses:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    if(!mapa[fora]){
      mapa[fora]={
        name:fora,
        played:0,
        wins:0,
        draws:0,
        losses:0,
        gf:0,
        ga:0,
        gd:0,
        points:0
      };
    }

    const C = mapa[casa];
    const F = mapa[fora];

    C.played++;
    F.played++;

    C.gf += Number(hs);
    C.ga += Number(as);

    F.gf += Number(as);
    F.ga += Number(hs);

    if(hs>as){

      C.wins++;
      C.points += 3;
      F.losses++;

    }else if(hs<as){

      F.wins++;
      F.points += 3;
      C.losses++;

    }else{

      C.draws++;
      F.draws++;

      C.points++;
      F.points++;
    }
  });

  Object.values(mapa).forEach(t=>{
    t.gd=t.gf-t.ga;
  });

  return Object.values(mapa).sort((a,b)=>{

    if(b.points!==a.points){
      return b.points-a.points;
    }

    if(b.gd!==a.gd){
      return b.gd-a.gd;
    }

    return b.gf-a.gf;
  });
}


function renderFutsalTabela(){

  const container =
    document.getElementById("gamesList");

  if(!container) return;

  const tabela =
    calcularTabelaFutsal();

/* =========================================================
   DETALHE DO JOGO
   ========================================================= */

function abrirJogo(id){

  const jogo =
    jogosFutebol.find(
      j=>String(j.id)===String(id)
    );

  if(!jogo) return;

  const overlay =
    document.getElementById("detailOverlay");

  const content =
    document.getElementById("detailContent");

  if(!overlay || !content) return;

  const terminado =
    jogo.homeScore!==null &&
    jogo.awayScore!==null;

  const logoCasa =
    jogo.home?.logo
      ? `<img src="${esc(jogo.home.logo)}" alt="">`
      : `<span class="detailLogo">⚽</span>`;

  const logoFora =
    jogo.away?.logo
      ? `<img src="${esc(jogo.away.logo)}" alt="">`
      : `<span class="detailLogo">⚽</span>`;

  content.innerHTML = `

    <div class="detailHeader">

      <button
        class="backBtn"
        onclick="fecharDetalhe()">
        ← Voltar
      </button>

      <span>
        ${esc(LIGAS[jogo.league] || "Futebol")}
      </span>

    </div>

    <div class="matchHero">

      <div class="detailTeam">

        ${logoCasa}

        <strong>
          ${esc(jogo.home?.name || "Casa")}
        </strong>

      </div>

      <div class="detailScore">

        ${
          terminado
            ? `
              <strong>
                ${jogo.homeScore}
                -
                ${jogo.awayScore}
              </strong>
            `
            : `
              <strong>
                ${esc(formatarHoraJogo(jogo))}
              </strong>
            `
        }

        <span>
          ${
            terminado
              ? "FINAL"
              : esc(formatarDataJogo(jogo))
          }
        </span>

      </div>

      <div class="detailTeam">

        ${logoFora}

        <strong>
          ${esc(jogo.away?.name || "Fora")}
        </strong>

      </div>

    </div>

    <div class="detailSections">

      <section class="detailBox">

        <h3>Informação do jogo</h3>

        <div class="infoLine">
          <span>Competição</span>
          <strong>
            ${esc(LIGAS[jogo.league] || "Futebol")}
          </strong>
        </div>

        <div class="infoLine">
          <span>Data</span>
          <strong>
            ${esc(formatarDataJogo(jogo))}
          </strong>
        </div>

        <div class="infoLine">
          <span>Hora</span>
          <strong>
            ${esc(formatarHoraJogo(jogo))}
          </strong>
        </div>

        ${
          jogo.venue
          ? `
            <div class="infoLine">
              <span>Estádio</span>
              <strong>${esc(jogo.venue)}</strong>
            </div>
          `
          : ""
        }

      </section>

      <section class="detailBox">

        <h3>Estado</h3>

        <div class="detailStatus">
          ${
            estadoJogo(jogo)==="live"
              ? "🔴 AO VIVO"
              : terminado
                ? "🏁 JOGO TERMINADO"
                : "🕐 PRÓXIMO JOGO"
          }
        </div>

      </section>

    </div>
  `;

  overlay.classList.add("show");
  overlay.style.display="block";
}


function fecharDetalhe(){

  const overlay =
    document.getElementById("detailOverlay");

  if(!overlay) return;

  overlay.classList.remove("show");
  overlay.style.display="none";
}


/* =========================================================
   EQUIPAS
   ========================================================= */

function abrirEquipa(nome){

  const container =
    document.getElementById("gamesList");

  if(!container) return;

  const fav =
    favoritosEquipas.has(nome);

  const jogos =
    jogosFutebol.filter(j=>
      j.home?.name===nome ||
      j.away?.name===nome
    );

  container.innerHTML = `

    <div class="teamProfile">

      <div class="teamProfileLogo">⚽</div>

      <h2>${esc(nome)}</h2>

      <button
        class="primaryBtn"
        onclick="toggleFavoritoEquipa('${esc(nome)}')">
        ${fav
          ? "★ Remover dos favoritos"
          : "☆ Adicionar aos favoritos"}
      </button>

    </div>

    <div class="tableTitle">
      Jogos
    </div>

    ${
      jogos.length
      ? jogos.map(renderGameCard).join("")
      : `
        <div class="emptyState">
          <p>
            Não existem jogos disponíveis
            para esta equipa.
          </p>
        </div>
      `
    }
  `;
}


function mostrarEquipas(){

  if(desportoAtual==="futsal"){
    renderFutsalEquipas();
    return;
  }

  const container =
    document.getElementById("gamesList");

  if(!container) return;

  const nomes = new Set();

  jogosFutebol.forEach(j=>{
    if(j.home?.name) nomes.add(j.home.name);
    if(j.away?.name) nomes.add(j.away.name);
  });

  const lista =
    [...nomes].sort();

  container.innerHTML = `
    <div class="tableTitle">
      Equipas
    </div>

    <div class="teamGrid">

      ${
        lista.length
        ? lista.map(nome=>{

            const fav =
              favoritosEquipas.has(nome);

            return `
              <div
                class="teamCard"
                onclick="abrirEquipa('${esc(nome)}')">

                <div class="teamCardLogo">
                  ⚽
                </div>

                <div class="teamCardName">
                  ${esc(nome)}
                </div>

                <button
                  class="starBtn ${fav ? "active":""}"
                  onclick="
                    event.stopPropagation();
                    toggleFavoritoEquipa('${esc(nome)}')
                  ">
                  ${fav ? "★":"☆"}
                </button>

              </div>
            `;

          }).join("")
        : `
          <div class="emptyState">
            <p>
              Carregue primeiro os jogos
              para visualizar as equipas.
            </p>
          </div>
        `
      }

    </div>
  `;
}


/* =========================================================
   FAVORITOS
   ========================================================= */

function mostrarFavoritos(){

  const container =
    document.getElementById("gamesList");

  if(!container) return;

  const jogos =
    jogosFutebol.filter(j=>
      favoritosJogos.has(String(j.id))
    );

  const equipas =
    [...favoritosEquipas];

  container.innerHTML = `

    <div class="tableTitle">
      ⭐ Jogos favoritos
    </div>

    ${
      jogos.length
      ? jogos.map(renderGameCard).join("")
      : `
        <div class="emptyState">
          <div class="emptyIcon">⭐</div>
          <h3>Sem jogos favoritos</h3>
          <p>
            Toque na estrela de um jogo
            para o guardar aqui.
          </p>
        </div>
      `
    }

    <div class="tableTitle favoritosEquipasTitle">
      ⭐ Equipas favoritas
    </div>

    ${
      equipas.length
      ? `
        <div class="teamGrid">
          ${equipas.map(nome=>`
            <div
              class="teamCard"
              onclick="abrirEquipa('${esc(nome)}')">

              <div class="teamCardLogo">⚽</div>

              <div class="teamCardName">
                ${esc(nome)}
              </div>

              <button
                class="starBtn active"
                onclick="
                  event.stopPropagation();
                  toggleFavoritoEquipa('${esc(nome)}')
                ">
                ★
              </button>

            </div>
          `).join("")}
        </div>
      `
      : `
        <div class="emptyState">
          <p>
            Ainda não existem equipas favoritas.
          </p>
        </div>
      `
    }
  `;
}


/* =========================================================
   NAVEGAÇÃO PRINCIPAL
   ========================================================= */

function ativarNav(id){

  document
    .querySelectorAll(".bottomNav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  const btn =
    document.getElementById(id);

  if(btn){
    btn.classList.add("active");
  }
}


function nav(section){

  if(section==="jogos"){

    ativarNav("navJogos");

    desportoAtual="futebol";

    const main =
      document.getElementById("mainContent");

    if(main) main.style.display="block";

    carregarJogos();

    return;
  }

  if(section==="tabelas"){

    ativarNav("navTabelas");

    if(desportoAtual==="futsal"){
      renderFutsalTabela();
    }else{
      carregarTabela();
    }

    return;
  }

  if(section==="favoritos"){

    ativarNav("navFav");

    mostrarFavoritos();

    return;
  }
}


/* =========================================================
   DESPORTO — FUTEBOL / FUTSAL
   ========================================================= */

function mudarDesporto(tipo){

  desportoAtual=tipo;

  const futebolBtn =
    document.getElementById("btnFutebol");

  const futsalBtn =
    document.getElementById("btnFutsal");

  if(futebolBtn){
    futebolBtn.classList.toggle(
      "active",
      tipo==="futebol"
    );
  }

  if(futsalBtn){
    futsalBtn.classList.toggle(
      "active",
      tipo==="futsal"
    );
  }

  const leagues =
    document.getElementById("leagueList");

  if(leagues){

    if(tipo==="futebol"){

      renderCompeticoes();

    }else{

      leagues.innerHTML = `
        <button
          class="leagueChip active"
          onclick="mostrarFutsalJogos()">
          🇵🇹 Liga Placard
        </button>

        <button
          class="leagueChip"
          onclick="mostrarFutsalTabela()">
          📊 Classificação
        </button>

        <button
          class="leagueChip"
          onclick="mostrarFutsalEquipas()">
          👥 Equipas
        </button>

        <button
          class="leagueChip"
          onclick="mostrarFutsalCompeticoes()">
          🏆 Competições
        </button>
      `;
    }
  }

  if(tipo==="futsal"){

    mostrarFutsalJogos();

  }else{

    carregarJogos();
  }
}


/* =========================================================
   CABEÇALHO
   ========================================================= */

function renderHeader(){

  const title =
    document.getElementById("sectionTitle");

  if(title){

    if(desportoAtual==="futsal"){
      title.textContent="Futsal";
    }else{
      title.textContent =
        LIGAS[ligaAtual] ||
        "Jogos";
    }
  }
}


/* =========================================================
   BASE DA APLICAÇÃO
   ========================================================= */

function renderBase(){

  renderCompeticoes();

  const input =
    document.getElementById("searchInput");

  if(input){

    input.addEventListener(
      "input",
      ()=>{
        if(desportoAtual==="futebol"){
          mostrarJogos();
        }
      }
    );
  }

  document
    .querySelectorAll(".filterBtn")
    .forEach(btn=>{
      btn.addEventListener("click",()=>{
        setFiltro(
          btn.dataset.filter || "all"
        );
      });
    });

  const btnFutebol =
    document.getElementById("btnFutebol");

  const btnFutsal =
    document.getElementById("btnFutsal");

  if(btnFutebol){
    btnFutebol.onclick=()=>{
      mudarDesporto("futebol");
    };
  }

  if(btnFutsal){
    btnFutsal.onclick=()=>{
      mudarDesporto("futsal");
    };
  }

  const navJogos =
    document.getElementById("navJogos");

  const navTabelas =
    document.getElementById("navTabelas");

  const navFav =
    document.getElementById("navFav");

  if(navJogos){
    navJogos.onclick=()=>{
      nav("jogos");
    };
  }

  if(navTabelas){
    navTabelas.onclick=()=>{
      nav("tabelas");
    };
  }

  if(navFav){
    navFav.onclick=()=>{
      nav("favoritos");
    };
  }

  renderHeader();
}


/* =========================================================
   ARRANQUE
   ========================================================= */

corrigirResultadosFutsal();

renderBase();

carregarJogos();

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

</script>
