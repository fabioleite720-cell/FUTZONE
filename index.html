<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f7;
  color:#101828;
}
header{
  background:linear-gradient(135deg,#06132d,#0d2d66);
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 12px #0003;
}
.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span{color:#35a7ff}
.container{
  max-width:900px;
  margin:auto;
  padding:14px;
  padding-bottom:90px;
}
h2{margin:8px 0 15px}
h3{margin:10px 0}
.card{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}
.leagues{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 0 12px;
}
.league-btn{
  border:0;
  background:#dce5f2;
  color:#17233a;
  padding:9px 13px;
  border-radius:20px;
  white-space:nowrap;
  font-weight:bold;
}
.league-btn.active{
  background:#0b5bd3;
  color:white;
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0 9px;
}
.game{
  position:relative;
  cursor:pointer;
}
.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#667085;
  margin-bottom:10px;
}
.teams{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:5px;
}
.team{
  text-align:center;
  font-weight:bold;
}
.team img{
  width:42px;
  height:42px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px;
}
.score{
  text-align:center;
  font-size:22px;
  font-weight:900;
}
.live{
  color:#e31b23;
  font-weight:900;
}
.star{
  position:absolute;
  right:10px;
  top:8px;
  border:0;
  background:none;
  font-size:23px;
  cursor:pointer;
}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:white;
  border-top:1px solid #d8dee8;
  display:flex;
  justify-content:space-around;
  z-index:30;
}
.nav button{
  flex:1;
  border:0;
  background:white;
  font-weight:bold;
  color:#667085;
}
.nav button.active{color:#075bd4}
.empty{
  text-align:center;
  padding:30px 10px;
  color:#667085;
}
.loading{
  text-align:center;
  padding:25px;
  color:#667085;
}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e2;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
}
.news-img{
  width:100%;
  max-height:190px;
  object-fit:cover;
  border-radius:11px;
  margin-bottom:10px;
}
.news-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:7px;
}
.news-desc{
  color:#667085;
  line-height:1.4;
  font-size:14px;
}
.small{
  color:#667085;
  font-size:12px;
}
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:100;
  overflow:auto;
  padding:15px;
}
.modal-box{
  background:#f7f9fc;
  max-width:700px;
  margin:15px auto;
  border-radius:18px;
  padding:16px;
}
.close{
  float:right;
  border:0;
  background:#e5eaf1;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:20px;
}
.detail-head{
  background:linear-gradient(135deg,#06132d,#0d2d66);
  color:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:12px;
}
.detail-teams{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  text-align:center;
}
.detail-teams img{
  width:60px;
  height:60px;
  object-fit:contain;
}
.detail-score{
  font-size:30px;
  font-weight:900;
}
.event{
  display:flex;
  gap:10px;
  padding:11px 4px;
  border-bottom:1px solid #e2e6ec;
  align-items:flex-start;
}
.event-time{
  min-width:45px;
  font-weight:bold;
}
.event-icon{font-size:19px}
.event-text{flex:1}
.stats-table{
  width:100%;
  border-collapse:collapse;
}
.stats-table td{
  padding:10px 4px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
}
.stats-table td:first-child,
.stats-table td:last-child{
  font-weight:bold;
  width:25%;
}
.stat-name{
  font-size:12px;
  color:#667085;
}
.bar{
  height:7px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}
.bar-inner{
  height:100%;
  background:#0b63ce;
}
.player-card{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}
.player-card img{
  width:48px;
  height:48px;
  object-fit:contain;
}
.profile{
  text-align:center;
}
.profile-photo{
  width:100px;
  height:100px;
  object-fit:contain;
  border-radius:50%;
  background:#e6ebf2;
}
.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.info{
  background:#eef3f8;
  padding:10px;
  border-radius:10px;
}
.history-row{
  display:grid;
  grid-template-columns:85px 1fr;
  gap:10px;
  padding:12px 3px;
  border-bottom:1px solid #e1e6ed;
}
.history-year{
  font-weight:bold;
  color:#0b5bd3;
}
.team-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.team-row img{
  width:38px;
  height:38px;
  object-fit:contain;
}
.button{
  border:0;
  background:#0b5bd3;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}
.notice{
  padding:10px;
  background:#fff7d6;
  border-radius:10px;
  margin-bottom:10px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span> ⚽</div>
</header>

<div class="container">
  <div id="app"></div>
</div>

<div class="nav">
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
  <button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>
/* =========================================================
   FUTZONE
   ========================================================= */

const ESPN_SITE =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ESPN_V2 =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const ESPN_CDN =
  "https://cdn.espn.com/core/soccer/game?xhr=1&gameId=";

const ligas = [
  {code:"por.1",name:"Portugal"},
  {code:"eng.1",name:"Inglaterra"},
  {code:"esp.1",name:"Espanha"},
  {code:"ita.1",name:"Itália"},
  {code:"ger.1",name:"Alemanha"},
  {code:"fra.1",name:"França"},
  {code:"ned.1",name:"Países Baixos"},
  {code:"bel.1",name:"Bélgica"},
  {code:"uefa.champions",name:"Champions"},
  {code:"uefa.europa",name:"Europa League"},
  {code:"uefa.europa.conf",name:"Conference League"}
];

let ligaAtual = ligas[0];
let jogosAtuais = [];
let noticiasAtuais = [];
let favoritosJogos =
  JSON.parse(localStorage.getItem("futzone_fav_jogos") || "[]");

let favoritosEquipas =
  JSON.parse(localStorage.getItem("futzone_fav_equipas") || "[]");

let favoritosJogadores =
  JSON.parse(localStorage.getItem("futzone_fav_jogadores") || "[]");

let notificacoesPermitidas =
  localStorage.getItem("futzone_notificacoes") === "1";

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function guardarTudo(){
  localStorage.setItem(
    "futzone_fav_jogos",
    JSON.stringify(favoritosJogos)
  );

  localStorage.setItem(
    "futzone_fav_equipas",
    JSON.stringify(favoritosEquipas)
  );

  localStorage.setItem(
    "futzone_fav_jogadores",
    JSON.stringify(favoritosJogadores)
  );
}

function nomeLiga(code){
  return ligas.find(x => x.code === code)?.name || "Futebol";
}

function dataHora(v){
  if(!v) return "";
  const d = new Date(v);
  if(isNaN(d)) return "";
  return d.toLocaleString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function dataPublicacao(v){
  if(!v) return "";
  const d = new Date(v);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

function atualizarNav(id){
  ["navJogos","navTabelas","navFav"].forEach(x=>{
    document.getElementById(x)?.classList.remove("active");
  });
  document.getElementById(id)?.classList.add("active");
}

function mostrarJogos(){
  atualizarNav("navJogos");

  document.getElementById("app").innerHTML = `
    <h2>⚽ Jogos</h2>

    <div class="leagues">
      ${ligas.map((l,i)=>`
        <button
          class="league-btn ${l.code===ligaAtual.code?"active":""}"
          onclick="selecionarLiga(${i})">
          ${esc(l.name)}
        </button>
      `).join("")}
    </div>

    <div id="jogosArea">
      <div class="loading">A carregar jogos...</div>
    </div>
  `;

  carregarJogos();
}

function selecionarLiga(i){
  ligaAtual = ligas[i];
  mostrarJogos();
}

/* =========================================================
   JOGOS
   ========================================================= */

async function carregarJogos(){
  const area = document.getElementById("jogosArea");
  if(!area) return;

  area.innerHTML = `<div class="loading">A carregar jogos...</div>`;

  try{
    const url =
      ESPN_SITE +
      ligaAtual.code +
      "/scoreboard";

    const r = await fetch(url);
    if(!r.ok) throw new Error("Erro ESPN");

    const data = await r.json();

    jogosAtuais = data.events || [];

    let html = "";

    const diretos = jogosAtuais.filter(e =>
      e.competitions?.[0]?.status?.type?.state === "in"
    );

    const proximos = jogosAtuais.filter(e =>
      e.competitions?.[0]?.status?.type?.state !== "in"
    );

    html += `
      <div class="section-title">
        <h3>🔴 Em direto</h3>
      </div>
    `;

    if(diretos.length){
      html += diretos.map(renderJogo).join("");
    }else{
      html += `<div class="card empty">Não há jogos em direto.</div>`;
    }

    html += `
      <div class="section-title">
        <h3>📅 Jogos</h3>
      </div>
    `;

    if(proximos.length){
      html += proximos.map(renderJogo).join("");
    }else{
      html += `<div class="card empty">Sem jogos encontrados.</div>`;
    }

    html += `
      <div class="section-title">
        <h3>📰 Últimas notícias de futebol</h3>
      </div>
      <div id="noticiasArea">
        <div class="loading">A carregar notícias...</div>
      </div>
    `;

    area.innerHTML = html;

    carregarNoticias();
    monitorizarFavoritos();

  }catch(e){
    console.error(e);
    area.innerHTML = `
      <div class="card empty">
        Não foi possível carregar os jogos.<br>
        Tenta novamente dentro de alguns segundos.
      </div>
    `;
  }
}

function renderJogo(event){
  const c = event.competitions?.[0];
  if(!c) return "";

  const home = c.competitors?.find(x=>x.homeAway==="home");
  const away = c.competitors?.find(x=>x.homeAway==="away");

  const status = c.status?.type;
  const aoVivo = status?.state === "in";

  const id = event.id;

  const favorito = favoritosJogos.some(
    x => String(x.id) === String(id)
  );

  return `
    <div class="card game" onclick="abrirJogo('${esc(id)}','${esc(ligaAtual.code)}')">

      <button
        class="star"
        onclick="event.stopPropagation();toggleFavJogo('${esc(id)}')">
        ${favorito ? "⭐" : "☆"}
      </button>

      <div class="game-top">
        <span>${aoVivo ? '<span class="live">● DIRETO</span>' : esc(status?.shortDetail || dataHora(event.date))}</span>
        <span>${esc(ligaAtual.name)}</span>
      </div>

      <div class="teams">

        <div class="team">
          <img src="${esc(home?.team?.logo || "")}">
          ${esc(home?.team?.displayName || "Casa")}
        </div>

        <div class="score">
          ${aoVivo || status?.completed
            ? `${esc(home?.score ?? "0")} - ${esc(away?.score ?? "0")}`
            : "vs"}
        </div>

        <div class="team">
          <img src="${esc(away?.team?.logo || "")}">
          ${esc(away?.team?.displayName || "Fora")}
        </div>

      </div>
    </div>
  `;
}

/* =========================================================
   FAVORITOS
   ========================================================= */

function toggleFavJogo(id){
  const existente = favoritosJogos.findIndex(
    x => String(x.id) === String(id)
  );

  const jogo = jogosAtuais.find(x=>String(x.id)===String(id));
  const c = jogo?.competitions?.[0];

  if(existente >= 0){
    favoritosJogos.splice(existente,1);
  }else if(jogo && c){
    favoritosJogos.push({
      id,
      league: ligaAtual.code,
      home: c.competitors?.find(x=>x.homeAway==="home")?.team?.displayName,
      away: c.competitors?.find(x=>x.homeAway==="away")?.team?.displayName
    });
  }

  guardarTudo();
  mostrarJogos();
}

function toggleFavEquipa(team){
  const id = String(team.id);

  const i = favoritosEquipas.findIndex(
    x => String(x.id) === id
  );

  if(i>=0){
    favoritosEquipas.splice(i,1);
  }else{
    favoritosEquipas.push({
      id:team.id,
      name:team.displayName || team.name,
      logo:team.logo || ""
    });
  }

  guardarTudo();
}

function toggleFavJogador(player){
  const id = String(player.id);

  const i = favoritosJogadores.findIndex(
    x => String(x.id) === id
  );

  if(i>=0){
    favoritosJogadores.splice(i,1);
  }else{
    favoritosJogadores.push({
      id:player.id,
      name:player.fullName || player.displayName || player.name,
      photo:player.photo || ""
    });
  }

  guardarTudo();
}

function mostrarFavoritos(){
  atualizarNav("navFav");

  document.getElementById("app").innerHTML = `
    <h2>⭐ Favoritos</h2>

    <div class="card">
      <h3>⚽ Jogos favoritos</h3>
      <div id="favJogos"></div>
    </div>

    <div class="card">
      <h3>🛡️ Equipas favoritas</h3>
      <div id="favEquipas"></div>
    </div>

    <div class="card">
      <h3>👤 Jogadores favoritos</h3>
      <div id="favJogadores"></div>
    </div>

    <div class="card">
      <h3>🔔 Notificações</h3>
      <button class="button" onclick="ativarNotificacoes()">
        ${notificacoesPermitidas
          ? "🔔 Notificações ativadas"
          : "Ativar notificações"}
      </button>
    </div>
  `;

  document.getElementById("favJogos").innerHTML =
    favoritosJogos.length
      ? favoritosJogos.map(x=>`
          <div class="team-row" style="padding:8px 0">
            ⭐ <b>${esc(x.home || "")}</b>
            <span>vs</span>
            <b>${esc(x.away || "")}</b>
          </div>
        `).join("")
      : `<div class="empty">Ainda não tens jogos favoritos.</div>`;

  document.getElementById("favEquipas").innerHTML =
    favoritosEquipas.length
      ? favoritosEquipas.map(x=>`
          <div class="team-row" style="padding:8px 0;cursor:pointer"
               onclick="abrirEquipa('${esc(x.id)}','${esc(x.name)}','${esc(x.logo)}')">
            <img src="${esc(x.logo)}">
            <b>${esc(x.name)}</b>
          </div>
        `).join("")
      : `<div class="empty">Ainda não tens equipas favoritas.</div>`;

  document.getElementById("favJogadores").innerHTML =
    favoritosJogadores.length
      ? favoritosJogadores.map(x=>`
          <div class="player-card" style="padding:8px 0"
               onclick="abrirJogador('${esc(x.id)}')">
            <img src="${esc(x.photo || "")}">
            <b>${esc(x.name)}</b>
          </div>
        `).join("")
      : `<div class="empty">Ainda não tens jogadores favoritos.</div>`;
}

/* =========================================================
   NOTIFICAÇÕES
   ========================================================= */

async function ativarNotificacoes(){
  if(!("Notification" in window)){
    alert("Este navegador não suporta notificações.");
    return;
  }

  const p = await Notification.requestPermission();

  if(p==="granted"){
    notificacoesPermitidas=true;
    localStorage.setItem("futzone_notificacoes","1");

    new Notification("FUTZONE",{
      body:"Notificações dos teus favoritos ativadas!"
    });

    mostrarFavoritos();
  }
}

async function monitorizarFavoritos(){
  if(!notificacoesPermitidas || !favoritosJogos.length) return;

  const ligasFavoritas = [
    ...new Set(
      favoritosJogos.map(x=>x.league || ligaAtual.code)
    )
  ];

  let snapshot =
    JSON.parse(localStorage.getItem("futzone_snapshot") || "{}");

  for(const codigo of ligasFavoritas){
    try{
      const r = await fetch(
        ESPN_SITE + codigo + "/scoreboard"
      );

      if(!r.ok) continue;

      const data = await r.json();

      for(const evento of (data.events || [])){
        const fav = favoritosJogos.find(
          x=>String(x.id)===String(evento.id)
        );

        if(!fav) continue;

        const c = evento.competitions?.[0];
        const estado =
          c?.status?.type?.state || "";

        const home =
          c?.competitors?.find(x=>x.homeAway==="home");

        const away =
          c?.competitors?.find(x=>x.homeAway==="away");

        const valor =
          `${estado}|${home?.score}|${away?.score}`;

        if(snapshot[evento.id] &&
           snapshot[evento.id]!==valor){

          if("Notification" in window &&
             Notification.permission==="granted"){

            new Notification("⚽ FUTZONE",{
              body:
                `${home?.team?.displayName || "Casa"} `+
                `${home?.score || 0} - ${away?.score || 0} `+
                `${away?.team?.displayName || "Fora"}`
            });
          }
        }

        snapshot[evento.id]=valor;
      }

    }catch(e){
      console.log("Notificação:",e);
    }
  }

  localStorage.setItem(
    "futzone_snapshot",
    JSON.stringify(snapshot)
  );
}

/* =========================================================
   NOTÍCIAS
   ========================================================= */

async function carregarNoticias(){
  const area = document.getElementById("noticiasArea");
  if(!area) return;

  const codigos = [
    ligaAtual.code,
    "eng.1",
    "esp.1",
    "ita.1",
    "ger.1",
    "uefa.champions"
  ];

  try{
    const resultados = await Promise.allSettled(
      codigos.map(async code=>{
        const r = await fetch(
          ESPN_SITE + code + "/news?limit=10"
        );

        if(!r.ok) throw new Error();

        const d = await r.json();

        return (d.articles || []).map(n=>({
          ...n,
          _leagueCode:code
        }));
      })
    );

    let lista=[];

    resultados.forEach(r=>{
      if(r.status==="fulfilled"){
        lista.push(...r.value);
      }
    });

    const vistos=new Set();

    lista=lista.filter(n=>{
      const chave =
        n.id ||
        n.links?.web?.href ||
        n.headline;

      if(vistos.has(chave)) return false;

      vistos.add(chave);
      return true;
    });

    lista.sort((a,b)=>
      new Date(b.published || 0) -
      new Date(a.published || 0)
    );

    noticiasAtuais=lista.slice(0,20);

    if(!noticiasAtuais.length){
      area.innerHTML=
        `<div class="card empty">Sem notícias disponíveis.</div>`;
      return;
    }

    area.innerHTML=noticiasAtuais.map((n,i)=>{

      const img =
        n.images?.[0]?.url ||
        n.image?.url ||
        "";

      const titulo =
        traduzirNoticias(
          n.headline || n.title || "Notícia"
        );

      const desc =
        traduzirNoticias(
          n.description ||
          n.summary ||
          ""
        );

      return `
        <div class="card" onclick="abrirNoticia(${i})"
             style="cursor:pointer">

          ${img ? `<img class="news-img" src="${esc(img)}">` : ""}

          <div class="small">
            📰 ${esc(nomeLiga(n._leagueCode))}
            ${n.published ? " · "+dataPublicacao(n.published) : ""}
          </div>

          <div class="news-title">
            ${esc(titulo)}
          </div>

async function abrirJogo(id,leagueCode){

  document.body.insertAdjacentHTML("beforeend",`

      <div class="modal-box">
        <button class="close"
                onclick="fecharModal('modalJogo')">×</button>

        <div id="detalheJogo">
          <div class="loading">A carregar jogo...</div>
        </div>
      </div>
    </div>
  `);

  try{

    const [summaryResp,cdnResp] =
      await Promise.allSettled([
        fetch(
          ESPN_SITE +
          leagueCode +
          "/summary?event=" +
          encodeURIComponent(id)
        ),
        fetch(ESPN_CDN + encodeURIComponent(id))
      ]);

    let summary={};
    let pacote={};

    if(summaryResp.status==="fulfilled" &&
       summaryResp.value.ok){

      summary=await summaryResp.value.json();
    }

    if(cdnResp.status==="fulfilled" &&
       cdnResp.value.ok){

      try{
        const cdn=await cdnResp.value.json();

        pacote=
          cdn.gamepackageJSON ||
          cdn.gamepackage ||
          cdn;

        if(typeof pacote==="string"){
          try{
            pacote=JSON.parse(pacote);
          }catch(e){}
        }

      }catch(e){}
    }

    const header =
      summary.header ||
      pacote.header ||
      {};

    const competition =
      header.competitions?.[0] ||
      summary.competitions?.[0] ||
      pacote.competitions?.[0];

    const home =
      competition?.competitors?.find(
        x=>x.homeAway==="home"
      );

    const away =
      competition?.competitors?.find(
        x=>x.homeAway==="away"
      );

    const plays =
      summary.plays?.length
        ? summary.plays
        : pacote.plays || [];

    const boxscore =
      summary.boxscore?.teams?.length
        ? summary.boxscore
        : pacote.boxscore || {};

    document.getElementById("detalheJogo").innerHTML=`

      <div class="detail-head">

        <div class="small" style="color:#dce8ff">
          ${esc(nomeLiga(leagueCode))}

          <div>
            <img src="${esc(home?.team?.logo || "")}">
            <div>${esc(home?.team?.displayName || "Casa")}</div>

          <div class="detail-score">
            ${esc(home?.score ?? "0")}

            <div>${esc(away?.team?.displayName || "Fora")}</div>
          </div>

        <div style="text-align:center;margin-top:10px">
          ${esc(
            competition?.status?.type?.detail ||
            competition?.status?.type?.shortDetail ||
            ""

      ${renderAcontecimentos(plays,home,away)}

      ${renderEstatisticas(boxscore,home,away)}

  }catch(e){

    document.getElementById("detalheJogo").innerHTML=`
      <div class="card empty">

/* =========================================================
   ACONTECIMENTOS
   Só golos, assistências, cartões e substituições
   ========================================================= */

function renderAcontecimentos(plays,home,away){

  if(!Array.isArray(plays) || !plays.length){
    return `
      <div class="card">
        <h3>⚽ Acontecimentos</h3>
        <div class="empty">
          Não há acontecimentos disponíveis.
        </div>
      </div>
    `;
  }

  const eventos=[];

  plays.forEach(p=>{

    const textoOriginal =
      p.text ||
      p.description ||
      p.shortText ||
      p.type?.text ||
      "";

    const texto =
      String(textoOriginal);

    const lower=texto.toLowerCase();

    let tipo="";

    if(
      lower.includes("goal") ||
      lower.includes("golo") ||
      lower.includes("scores")
    ){
      tipo="golo";
    }
    else if(
      lower.includes("assist")
    ){
      tipo="assistencia";
    }
    else if(
      lower.includes("yellow card") ||
      lower.includes("yellow-card") ||
      lower.includes("cartão amarelo")
    ){
      tipo="amarelo";
    }
    else if(
      lower.includes("red card") ||
      lower.includes("red-card") ||
      lower.includes("cartão vermelho")
    ){
      tipo="vermelho";
    }
    else if(
      lower.includes("substitution") ||
      lower.includes("substituted") ||
      lower.includes("substituição")
    ){
      tipo="substituicao";
    }

    if(!tipo) return;

    let icon="";

    if(tipo==="golo") icon="⚽";
    if(tipo==="assistencia") icon="🎯";
    if(tipo==="amarelo") icon="🟨";
    if(tipo==="vermelho") icon="🟥";
    if(tipo==="substituicao") icon="🔄";

    let minuto =
      p.clock?.displayValue ||
      p.clock?.value ||
      p.period?.displayValue ||
      "";

    if(typeof minuto==="number"){
      minuto=Math.floor(minuto/60)+"'";
    }

    eventos.push({
      tipo,
      icon,
      minuto,
      texto: traduzirAcontecimento(texto),
      jogador:
        p.athletesInvolved?.[0]?.displayName ||
        p.athlete?.displayName ||
        ""
    });
  });

  if(!eventos.length){
    return `
      <div class="card">
        <h3>⚽ Acontecimentos</h3>
        <div class="empty">
          Ainda não existem golos, assistências,
          cartões ou substituições disponíveis.
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h3>⚽ Acontecimentos</h3>

      ${eventos.map(e=>`
        <div class="event">

          <div class="event-time">
            ${esc(e.minuto)}
          </div>

          <div class="event-icon">
            ${e.icon}
          </div>

          <div class="event-text">
            ${esc(e.jogador || e.texto)}
            ${e.jogador && e.texto ?
              `<div class="small">${esc(e.texto)}</div>`:""}
          </div>

        </div>
      `).join("")}

    </div>
  `;
}

function traduzirAcontecimento(texto){

  let t=String(texto || "");

  const trocas=[
    [/\bYellow Card\b/gi,"Cartão amarelo"],
    [/\bRed Card\b/gi,"Cartão vermelho"],
    [/\bSubstitution\b/gi,"Substituição"],
    [/\bSubstituted\b/gi,"Substituído"],
    [/\bGoal\b/gi,"Golo"],
    [/\bAssist\b/gi,"Assistência"],
    [/\bPenalty\b/gi,"Penálti"],
    [/\bCorner\b/gi,"Canto"],
    [/\bOffside\b/gi,"Fora de jogo"],
    [/\bFoul\b/gi,"Falta"],
    [/\bFree Kick\b/gi,"Livre"],
    [/\bShot\b/gi,"Remate"],
    [/\bSaved\b/gi,"Defendido"],
    [/\bMissed\b/gi,"Falhou"],
    [/\bVAR\b/gi,"VAR"],
    [/\bKickoff\b/gi,"Início do jogo"],

   ESTATÍSTICAS
   ========================================================= */

function renderEstatisticas(boxscore,home,away){

  const teams =
    Array.isArray(boxscore?.teams)
      ? boxscore.teams
      : [];

  if(!teams.length){
    return `
      <div class="card">
        <h3>📊 Estatísticas</h3>
        <div class="empty">
          Estatísticas ainda não disponíveis.
        </div>
      </div>
    `;
  }

  const ht =
    teams.find(x=>
      String(x.team?.id)===String(home?.team?.id)
    ) || teams[0];

  const at =
    teams.find(x=>
      String(x.team?.id)===String(away?.team?.id)
    ) || teams[1];

  if(!ht || !at){
    return `
      <div class="card">
        <h3>📊 Estatísticas</h3>
        <div class="empty">
          Estatísticas ainda não disponíveis.
        </div>
      </div>
    `;
  }

  const estatisticas=[
    ["Posse de bola",[
      "possession","possessionPct","Possession"
    ],true],

    ["Remates à baliza",[
      "shotsOnTarget","Shots on Goal",
      "shotsOnGoal","Shots on Target"
    ],false],

    ["Remates",[
      "totalShots","Total Shots","shots"
    ],false],

    ["Cantos",[
      "cornerKicks","Corner Kicks","corners"
    ],false],

    ["Faltas",[
      "fouls","Fouls"
    ],false],

    ["Fora de jogo",[
      "offsides","Offsides"
    ],false],

    ["Cartões amarelos",[
      "yellowCards","Yellow Cards"
    ],false],

    ["Cartões vermelhos",[
      "redCards","Red Cards"
    ],false],

    ["Defesas",[
      "saves","Saves"
    ],false],

    ["Passes",[
      "totalPasses","Total Passes","passes"
    ],false],

    ["Precisão de passe",[
      "passCompletion","Pass Completion",
      "passingPct"
    ],true]
  ];

  const linhas=[];

  estatisticas.forEach(([nome,chaves,percent])=>{

    const h=encontrarStat(ht.statistics,chaves);
    const a=encontrarStat(at.statistics,chaves);

    if(h==null && a==null) return;

    const hv=numeroStat(h);
    const av=numeroStat(a);

    const total=hv+av;

    let hp=50;

    if(total>0){
      hp=(hv/total)*100;
    }

    const hDisplay =
      percent
        ? formatStat(h,true)
        : formatStat(h,false);

    const aDisplay =
      percent
        ? formatStat(a,true)
        : formatStat(a,false);

    linhas.push(`
      <tr>
        <td>${esc(hDisplay)}</td>

        <td>
          <div class="stat-name">
            ${esc(nome)}
          </div>

          <div class="bar">
            <div class="bar-inner"
                 style="width:${Math.max(2,Math.min(100,hp))}%">
            </div>
          </div>
        </td>

        <td>${esc(aDisplay)}</td>
      </tr>
    `);
  });

  if(!linhas.length){
    return `
      <div class="card">
        <h3>📊 Estatísticas</h3>
        <div class="empty">
          Estatísticas ainda não disponíveis.
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h3>📊 Estatísticas</h3>

      <table class="stats-table">

        <tr>
          <td>
            ${esc(ht.team?.displayName || "Casa")}
          </td>
          <td></td>
          <td>
            ${esc(at.team?.displayName || "Fora")}
          </td>
        </tr>

        ${linhas.join("")}

      </table>
    </div>
  `;
}

function encontrarStat(lista,chaves){

  if(!Array.isArray(lista)) return null;

  for(const chave of chaves){

    const encontrado=lista.find(s=>{

      const valores=[
        s.name,
        s.displayName,
        s.shortDisplayName,
        s.abbreviation
      ]
      .filter(Boolean)
      .map(x=>String(x).toLowerCase());

      return valores.includes(
        String(chave).toLowerCase()
      );
    });

    if(encontrado){
      return encontrado;
    }
  }

  return null;
}

function numeroStat(stat){

  if(stat==null) return 0;

  const valor =
    stat.value ??
    stat.displayValue ??
    stat.display ??
    stat;

  const n=parseFloat(
    String(valor)
      .replace("%","")
      .replace(",",".")
      .replace(/[^\d.-]/g,"")
  );

  return isNaN(n) ? 0 : n;
}

function formatStat(stat,percent){

  if(stat==null) return "0";

  if(stat.displayValue != null){
    return String(stat.displayValue);
  }

  const n=numeroStat(stat);

  return percent
    ? `${n}%`
    : String(n);
}

                    displayName:${JSON.stringify(nome)},
                    logo:${JSON.stringify(logo)}
                  })">
            ${favoritosEquipas.some(x=>String(x.id)===String(id))
              ? "⭐ Favorita"
              : "☆ Adicionar aos favoritos"}
          </button>
        </div>

        <div id="equipaConteudo">
          <div class="loading">A carregar equipa...</div>
        </div>

      </div>
    </div>
  `);

  try{

    const rosterUrl =
      ESPN_SITE +
      ligaAtual.code +
      "/teams/" +
      encodeURIComponent(id) +
      "/roster";

    const r=await fetch(rosterUrl);

    if(!r.ok) throw new Error();

    const data=await r.json();

    const atletas=[];

    function recolher(obj){

      if(!obj || typeof obj!=="object") return;

      if(Array.isArray(obj)){
        obj.forEach(recolher);
        return;
      }

      if(obj.athlete){
        atletas.push(obj.athlete);
      }

      if(obj.fullName && obj.id){
        atletas.push(obj);
      }

      Object.keys(obj).forEach(k=>{
        if(
          k!=="athlete" &&
          k!=="team"
        ){
          const v=obj[k];
          if(v && typeof v==="object"){
            recolher(v);
          }
        }
      });
    }

    recolher(data);

    const unicos=[];
    const ids=new Set();

    atletas.forEach(p=>{
      if(p.id && !ids.has(String(p.id))){
        ids.add(String(p.id));
        unicos.push(p);
      }
    });

    document.getElementById("equipaConteudo").innerHTML=`

      <h3>👥 Plantel</h3>

      ${
        unicos.length
        ? unicos.map(p=>`

          <div class="card player-card"

              p.headshot?.href ||
              p.photo ||
              ""
            )}">

              <b>${esc(
                p.fullName ||
                p.displayName ||
                p.shortName ||
                "Jogador"
              )}</b>

              <div class="small">
                ${esc(p.position?.displayName || p.position?.name || "")}
              </div>
            </div>

          </div>

        `).join("")
        : `<div class="empty">Plantel não disponível.</div>`
      }

    `;

  }catch(e){

    document.getElementById("equipaConteudo").innerHTML=`
      <div class="card empty">
        Não foi possível carregar o plantel.
      </div>
    `;
  }
}

          A procurar histórico de clubes...
        </div>
      </div>

      <div id="statsJogador">
        <div class="loading">
          A procurar estatísticas atuais...
        </div>
      </div>

    `;

    carregarHistoricoJogador(id,p);

  }catch(e){

    console.error(e);

    document.getElementById("jogadorConteudo").innerHTML=`
      <div class="card empty">
        Não foi possível carregar o perfil do jogador.
      </div>
    `;
  }
}

/* =========================================================
   HISTÓRICO DO JOGADOR
   ========================================================= */

async function carregarHistoricoJogador(id,p){

  const area=document.getElementById("historicoJogador");
  const statsArea=document.getElementById("statsJogador");

  let historico=[];

  /*
   * A ESPN disponibiliza diferentes endpoints para
   * histórico/logs dependendo do atleta.
   * Tentamos várias fontes sem inventar clubes.
   */

  const urls=[
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/statistics`,
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/statisticslog`,
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/gamelog`
  ];

  for(const url of urls){

    try{

      const r=await fetch(url);

      if(!r.ok) continue;

      const d=await r.json();

      recolherHistorico(d,historico);

    }catch(e){}
  }

  /*
   * Retira duplicados.
   */

  const unicos=[];
  const chaves=new Set();

  historico.forEach(x=>{

    const chave=
      `${x.season || ""}|${x.teamId || ""}|${x.teamName || ""}`;

    if(!chaves.has(chave)){
      chaves.add(chave);
      unicos.push(x);
    }
  });

  /*
   * Se a API tiver equipa atual, garante que ela
   * aparece no topo.
   */

  if(p.team?.id || p.team?.displayName){

    const atual={
      season:"Atual",
      teamId:p.team?.id,
      teamName:
        p.team?.displayName ||
        p.team?.name ||
        "Equipa atual",
      logo:
        p.team?.logos?.[0]?.href ||
        p.team?.logo ||
        ""
    };

    const jaExiste=unicos.some(x=>
      String(x.teamId||"")===String(atual.teamId||"") ||
      (
        x.teamName &&
        atual.teamName &&
        x.teamName.toLowerCase()===
        atual.teamName.toLowerCase()
      )
    );

    if(!jaExiste){
      unicos.unshift(atual);
    }
  }

  if(!unicos.length){

    area.innerHTML=`
      <div class="card">

        <h3>🏟️ Histórico de clubes</h3>

        <div class="notice">
          A informação histórica deste jogador
          não está disponível na fonte de dados.
        </div>

        ${
          p.team?.displayName
          ? `
            <div class="history-row">

              <div class="history-year">
                Atual
              </div>

              <div class="team-row">

                <img src="${esc(
                  p.team?.logos?.[0]?.href ||
                  p.team?.logo ||
                  ""
                )}">

                <b>${esc(
                  p.team?.displayName ||
                  p.team?.name
                )}</b>

              </div>

            </div>
          `
          : ""
        }

      </div>
    `;

  }else{

    area.innerHTML=`

      <div class="card">

        <h3>🏟️ Histórico de clubes</h3>

        ${unicos.map(x=>`

          <div class="history-row">

            <div class="history-year">
              ${esc(
                x.season ||
                x.year ||
                "—"
              )}
            </div>

            <div class="team-row">

              ${
                x.logo
                ? `<img src="${esc(x.logo)}">`
                : ""
              }

              <div>
                <b>${esc(
                  x.teamName ||
                  "Clube não identificado"
                )}</b>

                ${
                  x.competition
                  ? `
                    <div class="small">
                      ${esc(x.competition)}
                    </div>
                  `
                  : ""
                }

              </div>

            </div>

          </div>

        `).join("")}

      </div>
    `;
  }

  carregarStatsJogador(id);
}

function recolherHistorico(obj,saida,context={}){

  if(!obj || typeof obj!=="object") return;

  if(Array.isArray(obj)){
    obj.forEach(x=>
      recolherHistorico(x,saida,context)
    );
    return;
  }

  const team =
    obj.team ||
    obj.teams?.[0] ||
    obj.statistics?.team;

  const season =
    obj.season?.displayName ||
    obj.season?.year ||
    obj.seasonYear ||
    obj.year;

  if(team && (team.id || team.displayName || team.name)){

    saida.push({
      season:season || "",
      teamId:team.id,
      teamName:
        team.displayName ||
        team.name ||
        team.shortDisplayName,
      logo:
        team.logos?.[0]?.href ||
        team.logo ||
        "",
      competition:
        obj.league?.name ||
        obj.competition?.name ||
        ""
    });
  }

  Object.keys(obj).forEach(k=>{

    const v=obj[k];

    if(v && typeof v==="object"){
      recolherHistorico(v,saida,context);
    }

  });
}

/* =========================================================
   ESTATÍSTICAS ATUAIS DO JOGADOR
   ========================================================= */

async function carregarStatsJogador(id){

  const area=document.getElementById("statsJogador");
  if(!area) return;

  const urls=[
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/statistics`,
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/statisticslog`
  ];

  let dados=[];

  for(const url of urls){

    try{

      const r=await fetch(url);

      if(!r.ok) continue;

      const d=await r.json();

      recolherStats(d,dados);

    }catch(e){}
  }

  const stats={};

  dados.forEach(s=>{

    if(s.name){
      stats[s.name]=
        s.displayValue ??
        s.value ??
        s.display ??
        "0";
    }
  });

  const importantes=[
    ["Jogos",[
      "appearances","gamesPlayed","games"
    ]],
    ["Titular",[
      "starts"
    ]],
    ["Minutos",[
      "minutes","minutesPlayed"
    ]],
    ["Golos",[
      "goals","goal"
    ]],
    ["Assistências",[
      "assists","assistsTotal"
    ]],
    ["Cartões amarelos",[
      "yellowCards"
    ]],
    ["Cartões vermelhos",[
      "redCards"
    ]]
  ];

  let encontrados=[];

  importantes.forEach(([nome,chaves])=>{

    let valor=null;

    for(const chave of chaves){

      const encontrado=
        Object.keys(stats).find(k=>
          k.toLowerCase()===chave.toLowerCase()
        );

      if(encontrado){
        valor=stats[encontrado];
        break;
      }
    }

    if(valor!=null){
      encontrados.push(`
        <div class="info">
          <b>${esc(nome)}</b><br>
          ${esc(valor)}
        </div>
      `);
    }
  });

  area.innerHTML=`

    <div class="card">

      <h3>📊 Estatísticas atuais</h3>

      ${
        encontrados.length
        ? `<div class="info-grid">
             ${encontrados.join("")}
           </div>`
        : `
          <div class="empty">
            Estatísticas atuais não disponíveis
            para este jogador.
          </div>
        `
      }

    </div>
  `;
}

function recolherStats(obj,saida){

  if(!obj || typeof obj!=="object") return;

  if(Array.isArray(obj)){
    obj.forEach(x=>recolherStats(x,saida));
    return;
  }

  if(
    obj.name &&
    (
      obj.value!=null ||
      obj.displayValue!=null ||
      obj.display!=null
    )
  ){
    saida.push(obj);
  }

  Object.keys(obj).forEach(k=>{

    const v=obj[k];

    if(v && typeof v==="object"){
      recolherStats(v,saida);
    }

  });
}

/* =========================================================
   PESQUISA DE EQUIPAS
   ========================================================= */

async function pesquisarEquipas(){

  const termo=prompt("Que equipa procuras?");

  if(!termo) return;

  document.getElementById("app").innerHTML=`
    <h2>🔎 Equipas</h2>
    <div class="loading">A procurar...</div>
  `;

  try{

    const url=
      ESPN_SITE +
      ligaAtual.code +
      "/teams";

    const r=await fetch(url);

    if(!r.ok) throw new Error();

    const d=await r.json();

    const teams=[];

    function recolher(obj){

      if(!obj || typeof obj!=="object") return;

      if(Array.isArray(obj)){
        obj.forEach(recolher);
        return;
      }

      if(obj.team?.id){
        teams.push(obj.team);
      }

      if(obj.id && (obj.displayName || obj.name)){
        teams.push(obj);
      }

      Object.values(obj).forEach(v=>{
        if(v && typeof v==="object"){
          recolher(v);
        }
      });
    }

    recolher(d);

    const resultados=teams.filter(t=>
      String(t.displayName || t.name || "")
      .toLowerCase()
      .includes(termo.toLowerCase())
    );

    document.getElementById("app").innerHTML=`
      <h2>🔎 Equipas</h2>

      ${
        resultados.length
        ? resultados.map(t=>`

          <div class="card team-row"
               onclick="abrirEquipa(
                 '${esc(t.id)}',
                 '${esc(t.displayName || t.name)}',
                 '${esc(t.logos?.[0]?.href || t.logo || "")}'
               )"
               style="cursor:pointer">

            <img src="${esc(
              t.logos?.[0]?.href ||
              t.logo ||
              ""
            )}">

            <b>${esc(t.displayName || t.name)}</b>

          </div>

        `).join("")
        : `<div class="card empty">Nenhuma equipa encontrada.</div>`
      }
    `;

  }catch(e){

    document.getElementById("app").innerHTML=`
      <div class="card empty">
        Não foi possível pesquisar equipas.
      </div>
    `;
  }
}
