<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0057b8">

<title>FUTZONE PREMIUM</title>

<style>

:root{
  --blue:#0057b8;
  --blue2:#1683ff;
  --bg:#03060b;
  --card:#0a111b;
  --card2:#0e1723;
  --line:#1c2b3d;
  --text:#f4f7fb;
  --muted:#91a0b3;
  --green:#19c37d;
  --red:#ef5350;
  --yellow:#f5c542;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:70px;
}

header{
  background:linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
  );
  padding:14px 12px;
  box-shadow:0 3px 15px #0008;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.subtitle{
  margin-top:3px;
  font-size:11px;
  font-weight:700;
  opacity:.9;
}

main{
  max-width:1100px;
  margin:auto;
  padding:10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px;
  font-size:16px;
  font-weight:900;
}

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  margin-bottom:8px;
  box-shadow:0 4px 14px #0004;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:8px;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
}

.high{
  background:#70233c;
  color:#fff;
}

.low{
  background:#123f30;
  color:#75e6b7;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.loading{
  text-align:center;
  padding:20px 8px;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

button{
  font:inherit;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:64px;

  display:grid;
  grid-template-columns:
    repeat(5,1fr);

  background:#07101a;
  border-top:1px solid var(--line);
}

nav button{
  border:0;
  background:transparent;
  color:#8fa1b5;
  font-size:10px;
  font-weight:800;
}

nav button.active{
  color:#fff;
}

.suggestion{
  cursor:pointer;
}

.suggestion:active{
  transform:scale(.98);
}

.team-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.team{
  flex:1;
  min-width:0;
  font-weight:800;
}

.score{
  white-space:nowrap;
  font-size:17px;
  font-weight:900;
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:3px 1px 8px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid #28415e;
  background:#0b1521;
  color:#dce8f5;
  font-size:11px;
  font-weight:800;
}

.chip.active{
  background:var(--blue2);
  border-color:var(--blue2);
  color:#fff;
}

.err{
  color:#ff7777;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUTZONE PREMIUM
  </div>

  <div class="subtitle">
    FUTEBOL EM DIRETO
  </div>

</header>


<main>

  <!-- INÍCIO -->

  <section id="home">

    <div class="section-title">
      <span>🔥 Sugestões Média Alta</span>
      <span class="badge high">5</span>
    </div>

    <div id="highSuggestions"
         class="grid">

      <div class="card loading">
        A preparar sugestões...
      </div>

    </div>


    <div class="section-title">
      <span>🟢 Sugestões Média Baixa</span>
      <span class="badge low">5</span>
    </div>

    <div id="lowSuggestions"
         class="grid">

      <div class="card loading">
        A preparar sugestões...
      </div>

    </div>

  </section>


  <!-- JOGOS -->

  <section id="games"
           class="hidden">

    <div class="section-title">
      <span>⚽ Jogos</span>
    </div>

    <div id="leagueChips"
         class="chips">
    </div>

    <div id="gamesList">

      <div class="card loading">
        A carregar jogos...
      </div>

    </div>

  </section>


  <!-- TABELAS -->

  <section id="tables"
           class="hidden">

    <div class="section-title">
      <span>🏆 Tabelas</span>
    </div>

    <div class="card">

      <div class="muted">
        Tabelas serão carregadas nesta área.
      </div>

    </div>

  </section>


  <!-- NOTÍCIAS -->

  <section id="news"
           class="hidden">

    <div class="section-title">
      <span>📰 Notícias</span>
    </div>

    <div id="newsList">

      <div class="card loading">
        A carregar notícias...
      </div>

    </div>

  </section>


  <!-- FAVORITOS -->

  <section id="favorites"
           class="hidden">

    <div class="section-title">
      <span>⭐ Favoritos</span>
    </div>

    <div class="card">

      <div class="muted">
        Ainda não existem favoritos.
      </div>

    </div>

  </section>


  <!-- ANÁLISE -->

  <section id="analysis"
           class="hidden">

    <div id="analysisBox"></div>

  </section>

</main>


<nav>

  <button id="navHome"
          class="active"
          onclick="showPage('home')">
    🏠<br>Início
  </button>

  <button id="navGames"
          onclick="showPage('games')">
    ⚽<br>Jogos
  </button>

  <button id="navTables"
          onclick="showPage('tables')">
    🏆<br>Tabelas
  </button>

  <button id="navNews"
          onclick="showPage('news')">
    📰<br>Notícias
  </button>

  <button id="navFavorites"
          onclick="showPage('favorites')">
    ⭐<br>Favoritos
  </button>

</nav>


<script>

const API =
'https://site.api.espn.com/apis/site/v2/sports/soccer/';

let games=[];
let current=null;


function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function showPage(page){

  const pages=[
    'home',
    'games',
    'tables',
    'news',
    'favorites',
    'analysis'
  ];

  pages.forEach(name=>{

    const el=
      document.getElementById(name);

    if(el)
      el.classList.toggle(
        'hidden',
        name!==page
      );

  });


  document
    .querySelectorAll('nav button')
    .forEach(x=>
      x.classList.remove('active')
    );


  const nav={
    home:'navHome',
    games:'navGames',
    tables:'navTables',
    news:'navNews',
    favorites:'navFavorites'
  };


  if(nav[page]){

    document
      .getElementById(nav[page])
      ?.classList.add('active');

  }

}


const suggestionsHigh=[

  ['Benfica','Sporting'],
  ['FC Porto','Braga'],
  ['Real Madrid','Barcelona'],
  ['Manchester City','Liverpool'],
  ['Bayern München','Borussia Dortmund']

];


const suggestionsLow=[

  ['Arsenal','Chelsea'],
  ['Inter','Milan'],
  ['PSV','Ajax'],
  ['Galatasaray','Fenerbahçe'],
  ['Atlético Madrid','Sevilla']

];


function drawSuggestions(){

  const high=
    document.getElementById(
      'highSuggestions'
    );

  const low=
    document.getElementById(
      'lowSuggestions'
    );


  high.innerHTML=
    suggestionsHigh.map(
      (x,i)=>`

        <div class="card suggestion"
             onclick="showPage('games')">

          <span class="badge high">
            Médio-Alto
          </span>

          <div style="
            margin-top:9px;
            font-weight:900;
          ">
            ${esc(x[0])}
          </div>

          <div class="muted"
               style="margin:4px 0">
            vs
          </div>

          <div style="
            font-weight:900;
          ">
            ${esc(x[1])}
          </div>

        </div>

      `
    ).join('');


  low.innerHTML=
    suggestionsLow.map(
      (x,i)=>`

        <div class="card suggestion"
             onclick="showPage('games')">

          <span class="badge low">
            Médio-Baixo
          </span>

          <div style="
            margin-top:9px;
            font-weight:900;
          ">
            ${esc(x[0])}
          </div>

          <div class="muted"
               style="margin:4px 0">
            vs
          </div>

          <div style="
            font-weight:900;
          ">
            ${esc(x[1])}
          </div>

        </div>

      `
    ).join('');

}


drawSuggestions();

console.log(
  'FUTZONE TESTE — BLOCO 1 OK'
);

</script>
<script>

/* =========================================
   FUTZONE TESTE — BLOCO 2
   JOGOS REAIS + COMPETIÇÕES
========================================= */

const LEAGUES_TEST = [

  ['Todos','all'],

  ['Liga Portugal','por.1'],
  ['Liga 2','por.2'],
  ['Liga 3','por.3'],
  ['Liga BPI','por.w.1'],

  ['Premier League','eng.1'],
  ['Championship','eng.2'],

  ['LaLiga','esp.1'],
  ['LaLiga 2','esp.2'],

  ['Serie A','ita.1'],
  ['Serie B','ita.2'],

  ['Bundesliga','ger.1'],
  ['2. Bundesliga','ger.2'],

  ['Ligue 1','fra.1'],

  ['Eredivisie','ned.1'],

  ['Escócia','sco.1'],

  ['Turquia','tur.1'],

  ['Arábia Saudita','ksa.1'],

  ['MLS','usa.1']

];


function scoreFromTeam(team){

  const value=
    team?.score?.displayValue ??
    team?.score?.value ??
    team?.score;

  const n=Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function getHome(event){

  return event
    ?.competitions?.[0]
    ?.competitors
    ?.find(x=>x.homeAway==='home');

}


function getAway(event){

  return event
    ?.competitions?.[0]
    ?.competitors
    ?.find(x=>x.homeAway==='away');

}


function teamName(team){

  return team
    ?.team
    ?.displayName ||
    'Equipa';

}


function formatTime(date){

  if(!date)return '';

  try{

    return new Date(date)
      .toLocaleTimeString(
        'pt-PT',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      );

  }catch(e){

    return '';

  }

}


function isLive(event){

  const state=
    String(
      event
        ?.status
        ?.type
        ?.state ||
      ''
    ).toLowerCase();

  return state==='in';

}


function isFinished(event){

  return !!(
    event
      ?.status
      ?.type
      ?.completed===true ||
    String(
      event
        ?.status
        ?.type
        ?.state ||
      ''
    ).toLowerCase()==='post'
  );

}


/* =========================================
   COMPETIÇÕES
========================================= */

function drawLeagueButtons(){

  const box=
    document.getElementById(
      'leagueChips'
    );

  if(!box)return;


  box.innerHTML=
    LEAGUES_TEST.map(
      (x,i)=>`

        <button
          class="chip ${i===0?'active':''}"
          onclick="
            selectLeagueTest(
              '${esc(x[1])}',
              this
            )
          ">

          ${esc(x[0])}

        </button>

      `
    ).join('');

}


function selectLeagueTest(
  league,
  button
){

  document
    .querySelectorAll(
      '#leagueChips .chip'
    )
    .forEach(x=>
      x.classList.remove('active')
    );


  button?.classList.add('active');


  loadGamesTest(league);

}


/* =========================================
   CARREGAR JOGOS
========================================= */

async function getJSON(
  url
){

  try{

    const response=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!response.ok)
      return null;

    return await response.json();

  }catch(error){

    console.log(
      'Erro API:',
      error
    );

    return null;

  }

}


async function loadGamesTest(
  league='all'
){

  const box=
    document.getElementById(
      'gamesList'
    );

  if(!box)return;


  box.innerHTML=
    `
      <div class="card loading">
        A carregar jogos...
      </div>
    `;


  let data=null;


  if(league==='all'){

    data=
      await getJSON(
        API+
        'scoreboard?limit=100'
      );

  }else{

    data=
      await getJSON(
        API+
        league+
        '/scoreboard?limit=100'
      );

  }


  const events=
    Array.isArray(
      data?.events
    )
      ? data.events
      : [];


  games=events;


  if(!events.length){

    box.innerHTML=`

      <div class="card">

        <div class="muted">
          Não existem jogos disponíveis
          neste momento nesta competição.
        </div>

      </div>

    `;

    return;

  }


  renderGamesTest(events);

}


/* =========================================
   MOSTRAR JOGOS
========================================= */

function renderGamesTest(
  events
){

  const box=
    document.getElementById(
      'gamesList'
    );

  if(!box)return;


  const groups={};


  events.forEach(event=>{

    const league=
      event
        ?.league
        ?.name ||
      event
        ?.competitions?.[0]
        ?.league
        ?.name ||
      'Futebol';


    if(!groups[league])
      groups[league]=[];


    groups[league].push(event);

  });


  let html='';


  Object
    .entries(groups)
    .forEach(
      ([league,list])=>{

        html+=`

          <div class="section-title">
            <span>
              ${esc(league)}
            </span>
          </div>

        `;


        list.forEach(event=>{

          const home=
            getHome(event);

          const away=
            getAway(event);


          const homeName=
            teamName(home);

          const awayName=
            teamName(away);


          const homeScore=
            scoreFromTeam(home);

          const awayScore=
            scoreFromTeam(away);


          let score='—';


          if(
            homeScore!==null &&
            awayScore!==null
          ){

            score=
              homeScore+
              ' - '+
              awayScore;

          }


          let status='';


          if(isLive(event)){

            status=`
              <span
                class="badge high">
                🔴 AO VIVO
              </span>
            `;

          }else if(isFinished(event)){

            status=`
              <span
                class="badge low">
                FINAL
              </span>
            `;

          }else{

            status=`
              <span class="muted">
                ${esc(
                  formatTime(
                    event.date
                  )
                )}
              </span>
            `;

          }


          html+=`

            <div
              class="card suggestion"
              onclick="
                openTestMatch(
                  '${esc(event.id)}'
                )
              ">

              <div
                class="team-row">

                <div class="team">
                  ${esc(homeName)}
                </div>

                <div class="score">
                  ${esc(score)}
                </div>

                <div
                  class="team"
                  style="
                    text-align:right;
                  ">

                  ${esc(awayName)}

                </div>

              </div>


              <div
                style="
                  display:flex;
                  justify-content:
                    space-between;
                  align-items:center;
                  margin-top:8px;
                ">

                <span
                  class="muted">

                  ${esc(
                    formatTime(
                      event.date
                    )
                  )}

                </span>

                ${status}

              </div>

            </div>

          `;

        });

      }
    );


  box.innerHTML=html;

}


/* =========================================
   ABRIR JOGO
========================================= */

async function openTestMatch(
  id
){

  current=
    games.find(
      x=>String(x.id)===String(id)
    );


  if(!current){

    return;

  }


  showPage('analysis');


  const box=
    document.getElementById(
      'analysisBox'
    );


  box.innerHTML=`

    <div class="card">

      <div
        class="team-row">

        <div class="team">
          ${esc(
            teamName(
              getHome(current)
            )
          )}
        </div>

        <div class="score">
          ${scoreFromTeam(
            getHome(current)
          ) ?? '—'}
          -
          ${scoreFromTeam(
            getAway(current)
          ) ?? '—'}
        </div>

        <div
          class="team"
          style="
            text-align:right;
          ">

          ${esc(
            teamName(
              getAway(current)
            )
          )}

        </div>

      </div>


      <div
        class="muted"
        style="
          text-align:center;
          margin-top:7px;
        ">

        ${esc(
          formatTime(
            current.date
          )
        )}

      </div>

    </div>


    <div class="card">

      <div class="section-title">
        <span>
          📋 Detalhes
        </span>
      </div>

      <div class="muted">

        No próximo bloco entram:
        Últimos 5 jogos,
        Onde ver,
        acontecimentos,
        estatísticas e
        11 titular.

      </div>

    </div>

  `;

}


/* =========================================
   ARRANQUE
========================================= */

drawLeagueButtons();


/*
   Não substitui as sugestões.
   Apenas prepara os jogos.
*/

setTimeout(
  ()=>{
    loadGamesTest('all');
  },
  300
);

          </script>
</body>
</html>
