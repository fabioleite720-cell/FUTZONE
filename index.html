<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTZONE">
<meta name="description" content="FUTZONE — Futebol em direto">

<title>FUTZONE — Futebol em Direto</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#03060B;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:82px;
}

button{
  font:inherit;
}

button,a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #172331;
  padding:14px 14px 10px;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:29px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
  color:#fff;
}

.logo span{
  color:#1683FF;
}

.subtitle{
  margin-top:4px;
  font-size:10px;
  letter-spacing:1.8px;
  font-weight:800;
  color:#9DAABB;
}

.sportSwitch{
  display:flex;
  background:#09111C;
  border:1px solid #1B2A3B;
  border-radius:13px;
  padding:3px;
}

.sportSwitch button{
  border:0;
  border-radius:9px;
  background:transparent;
  color:#9DAABB;
  padding:8px 10px;
  font-weight:800;
  font-size:12px;
}

.sportSwitch button.active{
  background:#0057B8;
  color:#fff;
}

.liveGlobal{
  margin:12px 12px 0;
  width:calc(100% - 24px);
  border:1px solid #FF4054;
  background:linear-gradient(135deg,#42121B,#17090D);
  color:#fff;
  border-radius:14px;
  min-height:48px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.liveDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#FF4054;
  box-shadow:0 0 12px #FF4054;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }
  50%{
    opacity:.45;
    transform:scale(.75)
  }
}

.content{
  padding:12px;
}

.sectionTitle{
  font-size:17px;
  font-weight:900;
  margin:10px 2px;
}

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 8px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.leagueChip{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#AEBACA;
  padding:9px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.leagueChip.active{
  background:#0057B8;
  border-color:#1683FF;
  color:#fff;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 1px 10px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#0D1724;
  color:#AEBACA;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.filterBtn.active{
  color:#fff;
  background:#003B7A;
  border-color:#1683FF;
}

.searchBox{
  position:relative;
  margin:4px 0 12px;
}

.searchBox input{
  width:100%;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#fff;
  border-radius:13px;
  padding:12px 13px 12px 39px;
  outline:none;
}

.searchBox input:focus{
  border-color:#1683FF;
}

.searchIcon{
  position:absolute;
  left:13px;
  top:10px;
  color:#728197;
}

.games{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.gameCard{
  background:linear-gradient(145deg,#0D1724,#09111C);
  border:1px solid #172638;
  border-radius:16px;
  padding:11px;
  cursor:pointer;
  transition:.15s;
}

.gameCard:active{
  transform:scale(.985);
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.gameLeague{
  color:#8EA0B6;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.status{
  font-size:10px;
  font-weight:900;
  padding:4px 7px;
  border-radius:7px;
  background:#182536;
  color:#AEBACA;
  white-space:nowrap;
}

.status.live{
  color:#fff;
  background:#9C1E2F;
}

.status.finished{
  color:#CBD5E1;
  background:#182536;
}

.teams{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  min-width:0;
}

.team img{
  width:40px;
  height:40px;
  object-fit:contain;
  margin-bottom:5px;
}

.teamName{
  font-size:12px;
  font-weight:800;
  line-height:1.15;
  max-width:105px;
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.score small{
  display:block;
  color:#738198;
  font-size:9px;
  margin-top:4px;
}

.favoriteBtn{
  border:0;
  background:transparent;
  color:#66768B;
  font-size:21px;
  line-height:1;
  padding:3px;
}

.favoriteBtn.active{
  color:#FFD43B;
}

.empty{
  text-align:center;
  padding:35px 15px;
  border:1px dashed #25364A;
  border-radius:15px;
  color:#8392A7;
  background:#08101A;
}

.loading{
  text-align:center;
  padding:30px;
  color:#8796AA;
}

.errorBox{
  padding:15px;
  border-radius:14px;
  border:1px solid #54212A;
  background:#180B0E;
  color:#FF9BA6;
  font-size:13px;
  line-height:1.45;
}

.bottomNav{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:rgba(5,10,16,.97);
  border-top:1px solid #1A2838;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(15px);
}

.navBtn{
  border:0;
  background:transparent;
  color:#718198;
  padding:7px 3px;
  font-size:11px;
  font-weight:800;
  border-radius:11px;
}

.navIcon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.navBtn.active{
  color:#fff;
  background:#003B7A;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* TABELAS */

.tableWrap{
  overflow-x:auto;
  border:1px solid #172638;
  border-radius:15px;
  background:#09111C;
}

.standings{
  width:100%;
  border-collapse:collapse;
  min-width:420px;
}

.standings th{
  color:#708097;
  font-size:10px;
  text-transform:uppercase;
  padding:10px 6px;
  text-align:center;
  border-bottom:1px solid #1A293A;
}

.standings th:nth-child(2){
  text-align:left;
}

.standings td{
  padding:9px 6px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  border-bottom:1px solid #111F2E;
}

.standings td:nth-child(2){
  text-align:left;
}

.position{
  width:28px;
  color:#8291A6;
}

.clubCell{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:160px;
  cursor:pointer;
}

.clubCell img{
  width:25px;
  height:25px;
  object-fit:contain;
}

.clubCell strong{
  font-size:12px;
}

.pts{
  color:#fff;
  font-size:13px !important;
}

.zoneChampions{
  border-left:3px solid #1683FF;
}

.zoneEuropa{
  border-left:3px solid #FFD43B;
}

.zoneDown{
  border-left:3px solid #FF4054;
}

/* DETALHE */

.detailOverlay{
  position:fixed;
  z-index:100;
  inset:0;
  background:#03060B;
  overflow-y:auto;
  display:none;
}

.detailOverlay.open{
  display:block;
}

.detailHeader{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:rgba(3,6,11,.96);
  border-bottom:1px solid #172638;
}

.backBtn{
  border:0;
  background:#0D1724;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:20px;
}

.detailTitle{
  font-weight:900;
  font-size:15px;
}

.detailBody{
  padding:13px;
  max-width:760px;
  margin:auto;
}

.matchHero{
  background:linear-gradient(145deg,#0D1724,#09111C);
  border:1px solid #1B2A3B;
  border-radius:18px;
  padding:18px 12px;
}

.matchCompetition{
  text-align:center;
  color:#8190A5;
  font-size:11px;
  font-weight:800;
  margin-bottom:14px;
}

.matchTeams{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:7px;
}

.heroTeam{
  text-align:center;
  cursor:pointer;
}

.heroTeam img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.heroTeamName{
  font-size:14px;
  font-weight:900;
  margin-top:7px;
}

.heroScore{
  text-align:center;
  font-size:29px;
  font-weight:900;
}

.heroScore small{
  display:block;
  font-size:10px;
  color:#7C8BA0;
  margin-top:4px;
}

.detailStatus{
  text-align:center;
  margin-top:13px;
  font-weight:900;
  font-size:12px;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin:12px 0;
}

.tabBtn{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#8392A6;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  font-weight:900;
}

.tabBtn.active{
  background:#0057B8;
  color:#fff;
  border-color:#1683FF;
}

.detailSection{
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px;
  margin-bottom:10px;
  overflow:hidden;
}

.detailSectionTitle{
  padding:12px;
  font-size:13px;
  font-weight:900;
  border-bottom:1px solid #172638;
}

.eventRow{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:8px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #101D2A;
  font-size:12px;
}

.eventMinute{
  color:#8290A3;
  font-weight:900;
}

.eventCenter{
  text-align:center;
  font-weight:800;
}

.eventIcon{
  text-align:center;
  font-size:18px;
}

.statRow{
  display:grid;
  grid-template-columns:70px 1fr 70px;
  gap:7px;
  align-items:center;
  padding:9px 12px;
}

.statVal{
  font-weight:900;
  font-size:12px;
  text-align:center;
}

.statLabel{
  text-align:center;
  color:#8997A9;
  font-size:10px;
  font-weight:800;
}

.statBar{
  height:5px;
  background:#1A2939;
  border-radius:999px;
  overflow:hidden;
}

.statBar i{
  display:block;
  height:100%;
  background:#1683FF;
  border-radius:999px;
}

/* CAMPO */

.pitch{
  position:relative;
  margin:12px auto;
  width:min(100%,430px);
  aspect-ratio:.68;
  border:2px solid rgba(255,255,255,.65);
  border-radius:8px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0 14%,
      transparent 14% 28%,
      rgba(255,255,255,.025) 28% 42%,
      transparent 42% 56%,
      rgba(255,255,255,.025) 56% 70%,
      transparent 70% 84%,
      rgba(255,255,255,.025) 84% 100%
    ),
    #146B42;
}

.pitch:before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:29%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.65);
  border-radius:50%;
}

.pitch:after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  border-top:2px solid rgba(255,255,255,.65);
}

.penalty{
  position:absolute;
  left:50%;
  width:48%;
  height:15%;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.65);
}

.penalty.top{
  top:-1px;
  border-top:0;
}

.penalty.bottom{
  bottom:-1px;
  border-bottom:0;
}

.goalArea{
  position:absolute;
  left:50%;
  width:22%;
  height:6%;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.65);
}

.goalArea.top{
  top:-1px;
  border-top:0;
}

.goalArea.bottom{
  bottom:-1px;
  border-bottom:0;
}

.playerDot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0057B8;
  border:2px solid #fff;
  box-shadow:0 2px 7px rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:2;
}

.playerDot span{
  font-size:14px;
  font-weight:900;
}

.playerDot small{
  display:block;
  position:absolute;
  top:42px;
  width:95px;
  color:#fff;
  text-shadow:0 1px 3px #000;
  text-align:center;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

.pitchLegend{
  text-align:center;
  color:#8291A5;
  font-size:10px;
  margin-bottom:12px;
}

/* EQUIPA */

.teamHero{
  display:flex;
  align-items:center;
  gap:13px;
  background:#09111C;
  border:1px solid #172638;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.teamHero img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.teamHero h2{
  margin:0 0 4px;
  font-size:19px;
}

.teamHero p{
  margin:0;
  color:#8190A4;
  font-size:11px;
}

/* LIVE */

.liveCard{
  border-color:#76202D;
}

.liveScore{
  color:#FF6878;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(15px);
  background:#152334;
  border:1px solid #2A3D55;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.emptyBox{
  text-align:center;
  padding:25px 15px;
  color:#8392A7;
  font-size:12px;
}

.detailScore{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:8px;
  background:linear-gradient(145deg,#0D1724,#09111C);
  border:1px solid #172638;
  border-radius:18px;
  padding:18px 10px;
}

.detailTeam{
  text-align:center;
}

.detailTeam img{
  width:55px;
  height:55px;
  object-fit:contain;
}

.detailTeam strong{
  display:block;
  margin-top:7px;
  font-size:13px;
}

.detailCenter{
  text-align:center;
}

.detailScoreNumber{
  font-size:26px;
  font-weight:900;
}

.detailDate{
  color:#7C8BA0;
  font-size:10px;
  margin-top:5px;
}

.detailSummary{
  margin:10px 0;
  padding:12px;
  border-radius:13px;
  background:#09111C;
  border:1px solid #172638;
  color:#AEBACA;
  font-size:12px;
}

.eventsList{
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px;
  overflow:hidden;
}

.eventText strong,
.eventText small{
  display:block;
}

.eventText small{
  color:#78889D;
  margin-top:3px;
  font-size:9px;
}

.statsHeader{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  padding:12px;
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px 15px 0 0;
  text-align:center;
  font-size:10px;
}

.statsList{
  background:#09111C;
  border:1px solid #172638;
  border-top:0;
  border-radius:0 0 15px 15px;
}

.statValue{
  text-align:center;
  font-weight:900;
}

.statName{
  text-align:center;
  color:#8997A9;
  font-size:10px;
}

.lineupTitle{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  gap:5px;
  text-align:center;
  font-size:10px;
  margin:12px 0;
}

.pitchWrap{
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px;
  padding:10px;
  margin-bottom:12px;
}

.pitchTeamLabel{
  text-align:center;
  font-size:12px;
  font-weight:900;
}

.playerOnPitch{
  position:absolute;
  transform:translate(-50%,-50%);
  width:43px;
  height:43px;
  border-radius:50%;
  background:#0057B8;
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  box-shadow:0 2px 7px rgba(0,0,0,.45);
}

.shirtNumber{
  font-size:13px;
  font-weight:900;
}

.playerName{
  position:absolute;
  top:44px;
  width:85px;
  text-align:center;
  font-size:8px;
  font-weight:900;
  color:#fff;
  text-shadow:0 1px 3px #000;
}

.lineupList{
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px;
  margin-bottom:12px;
  overflow:hidden;
}

.lineupList h3{
  margin:0;
  padding:12px;
  font-size:13px;
  border-bottom:1px solid #172638;
}

.playerListRow{
  display:grid;
  grid-template-columns:32px 1fr 50px;
  gap:8px;
  align-items:center;
  padding:9px 12px;
  border-bottom:1px solid #101D2A;
  font-size:11px;
}

.playerListRow small{
  color:#75859A;
  text-align:right;
}

.numberBadge{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#003B7A;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.favTeamBtn{
  margin-left:auto;
  border:1px solid #1B2A3B;
  background:#0D1724;
  color:#FFD43B;
  border-radius:10px;
  padding:8px;
  font-size:10px;
  font-weight:900;
}

@media(max-width:390px){

  .logo{
    font-size:25px;
  }

  .teams{
    grid-template-columns:1fr 50px 1fr;
  }

  .team img{
    width:35px;
    height:35px;
  }

  .playerOnPitch{
    width:39px;
    height:39px;
  }

  .detailScore{
    grid-template-columns:1fr 80px 1fr;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="headerTop">

    <div>
      <div class="logo">FUT<span>ZONE</span></div>
      <div class="subtitle">FUTEBOL EM DIRETO</div>
    </div>

    <div class="sportSwitch">

      <button
        id="btnFutebol"
        class="active"
        onclick="mudarDesporto('futebol')"
      >
        ⚽ Futebol
      </button>

      <button
        id="btnFutsal"
        onclick="mudarDesporto('futsal')"
      >
        🥅 Futsal

/* =========================================================

async function fetchJSON(url){

  const resposta =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!resposta.ok){

    throw new Error(
      "HTTP " + resposta.status
    );

  }

  return await resposta.json();

}


function escapeHTML(valor){

  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(valor){

  return String(valor ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"&#039;")
    .replace(/"/g,"&quot;");

}


function guardarStorage(chave,valor){

  localStorage.setItem(
    chave,
    JSON.stringify(valor)
  );

}


function mostrarToast(texto){

  const toast =
    document.getElementById("toast");

  if(!toast) return;

  toast.textContent = texto;

  toast.classList.add("show");

  setTimeout(
    () => toast.classList.remove("show"),
    2200
  );

}


function nomeLiga(id){

  const liga =
    LIGAS.find(
      l => l.id === id
    );

  return liga?.nome || id || "Futebol";

}


function nomeEquipa(competidor){

  return (
    competidor?.team?.displayName ||
    competidor?.team?.shortDisplayName ||
    competidor?.team?.name ||
    competidor?.displayName ||
    competidor?.name ||
    "Equipa"
  );

}


function logoEquipa(competidor){

  return (
    competidor?.team?.logos?.[0]?.href ||
    competidor?.team?.logo ||
    competidor?.logo ||
    ""
  );

}


function idEquipa(competidor){

  return (
    competidor?.team?.id ||
    competidor?.id ||
    ""
  );

}


function obterCompetidor(evento,lado){

  const lista =
    evento?.competitions?.[0]?.competitors ||
    evento?.competitors ||
    [];

  if(typeof lado === "number"){
    return lista[lado];
  }

  if(lado === "home"){
    return (
      lista.find(
        x => x.homeAway === "home"
      ) ||
      lista[0]
    );
  }

  if(lado === "away"){
    return (
      lista.find(
        x => x.homeAway === "away"
      ) ||
      lista[1]
    );
  }

  return lista[0];

}


function eventoEmDireto(evento){

  const estado =
    evento?.status?.type;

  return !!(
    estado?.state === "in" ||
    estado?.name === "STATUS_IN_PROGRESS" ||
    estado?.shortDetail === "LIVE" ||
    estado?.description === "In Progress" ||
    estado?.type === "in"
  );

}


function eventoTerminado(evento){

  const estado =
    evento?.status?.type;

  return !!(
    estado?.completed === true ||
    estado?.state === "post" ||
    estado?.name === "STATUS_FINAL"
  );

}


function eventoFuturo(evento){

  return !eventoEmDireto(evento) &&
         !eventoTerminado(evento) &&
         !eventoAdiado(evento);

}


function eventoAdiado(evento){

  const texto =
    String(
      evento?.status?.type?.description ||
      evento?.status?.type?.detail ||
      evento?.status?.type?.name ||
      ""
    ).toLowerCase();

  return (
    texto.includes("postpon") ||
    texto.includes("delay") ||
    texto.includes("adiad")
  );

}


function formatoData(data){

  if(!data) return "";

  const d =
    new Date(data);

  if(Number.isNaN(d.getTime()))
    return "";

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function formatoHora(data){

  if(!data) return "";

  const d =
    new Date(data);

  if(Number.isNaN(d.getTime()))
    return "";

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function ordenarEventos(a,b){

  const da =
    new Date(
      a?.date ||
      a?.competitions?.[0]?.date ||
      0
    ).getTime();

  const db =
    new Date(
      b?.date ||
      b?.competitions?.[0]?.date ||
      0
    ).getTime();

  const la =
    eventoEmDireto(a);

  const lb =
    eventoEmDireto(b);

  if(la && !lb) return -1;

  if(!la && lb) return 1;

  return da-db;

}


/* =========================================================
   OBTÉM JOGOS DE UMA LIGA
========================================================= */

async function obterJogosLiga(ligaId){

  const hoje =
    new Date();

  const datas = [];

  /*
    Procuramos jogos desde 7 dias atrás
    até 14 dias à frente.
  */

  for(
    let i=-7;
    i<=14;
    i++
  ){

    const d =
      new Date(hoje);

    d.setDate(
      hoje.getDate()+i
    );

    datas.push(
      d.toISOString().slice(0,10)
    );

  }


  const resultados = [];


  /*
    Fazemos pedidos em grupos pequenos
    para evitar falhas.
  */

  for(
    let i=0;
    i<datas.length;
    i+=4
  ){

    const grupo =
      datas.slice(i,i+4);

    const pedidos =
      grupo.map(
        data =>
          fetchJSON(
            `${API}${ligaId}/scoreboard?dates=${data}`
          )
          .then(
            data => data.events || []
          )
          .catch(
            () => []
          )
      );

    const partes =
      await Promise.all(
        pedidos
      );

    partes.forEach(
      eventos =>
        resultados.push(...eventos)
    );

  }


  const mapa =
    new Map();

  resultados.forEach(
    evento => {

      if(!evento?.id)
        return;

      evento.__ligaId =
        ligaId;

      mapa.set(
        String(evento.id),
        evento
      );

    }
  );


  return Array.from(
    mapa.values()
  );

}

  /* =========================================================
   FUTZONE — PARTE 2/3
   Jogos, Favoritos, Classificações, Live Global e Detalhes
   ========================================================= */

function renderJogos(){

  const container = document.getElementById("games");
  if(!container) return;

  let lista = [...jogosFutebol];

  if(filtroAtual === "live"){
    lista = lista.filter(eventoEmDireto);
  }

  if(filtroAtual === "proximos"){
    lista = lista.filter(eventoFuturo);
  }

  if(filtroAtual === "resultados"){
    lista = lista.filter(eventoTerminado);
  }

  const pesquisa = (document.getElementById("searchInput")?.value || "")
    .trim()
    .toLowerCase();

  if(pesquisa){
    lista = lista.filter(jogo => {

      const home = obterCompetidor(jogo, "home");
      const away = obterCompetidor(jogo, "away");

      return (
        nomeEquipa(home).toLowerCase().includes(pesquisa) ||
        nomeEquipa(away).toLowerCase().includes(pesquisa) ||
        nomeLiga(jogo.league?.slug || ligaAtual).toLowerCase().includes(pesquisa)
      );
    });
  }

  lista = ordenarEventos(lista);

  if(!lista.length){
    container.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">⚽</div>
        <div>Não existem jogos para mostrar.</div>
      </div>
    `;
    return;
  }

  container.innerHTML = lista.map(criarCardJogo).join("");
}


function criarCardJogo(jogo){

  const home = obterCompetidor(jogo, "home");
  const away = obterCompetidor(jogo, "away");

  const id = jogo.id || "";
  const liga = nomeLiga(jogo.league?.slug || ligaAtual);

  const live = eventoEmDireto(jogo);
  const futuro = eventoFuturo(jogo);

  const fav = favJogos.has(String(id));

  const homeScore = home?.score ?? "";
  const awayScore = away?.score ?? "";

  let estado = "";

  if(live){
    estado = `<span class="liveBadge">● AO VIVO</span>`;
  }else if(futuro){
    estado = `<span class="matchTime">${formatoData(jogo)} ${formatoHora(jogo)}</span>`;
  }else if(eventoAdiado(jogo)){
    estado = `<span class="statusBadge">ADIADO</span>`;
  }else{
    estado = `<span class="statusBadge">FINAL</span>`;
  }

  return `
    <article class="gameCard"
      onclick="abrirDetalhe('${escapeAttr(id)}')">

      <div class="gameTop">
        <span class="leagueName">${escapeHTML(liga)}</span>

        <button
          class="favBtn ${fav ? "active" : ""}"
          onclick="event.stopPropagation();toggleFavJogo('${escapeAttr(id)}')">
          ${fav ? "★" : "☆"}
        </button>
      </div>

      <div class="gameStatus">
        ${estado}
      </div>

      <div class="teams">

        <div class="team"
          onclick="event.stopPropagation();abrirEquipa('${escapeAttr(idEquipa(home))}')">

          <img
            src="${escapeAttr(logoEquipa(home))}"
            onerror="this.style.display='none'">

          <strong>${escapeHTML(nomeEquipa(home))}</strong>

          <b>${homeScore}</b>
        </div>

        <div class="vs">VS</div>

        <div class="team"
          onclick="event.stopPropagation();abrirEquipa('${escapeAttr(idEquipa(away))}')">

          <img
            src="${escapeAttr(logoEquipa(away))}"
            onerror="this.style.display='none'">

          <strong>${escapeHTML(nomeEquipa(away))}</strong>

          <b>${awayScore}</b>
        </div>

      </div>

      ${
        live
        ? `
        <div class="liveLine">
          ${jogo.status?.type?.shortDetail || jogo.status?.type?.detail || "Ao vivo"}
        </div>
        `
        : ""
      }

    </article>
  `;
}


/* =========================================================
   FAVORITOS
   ========================================================= */

function toggleFavJogo(id){

  id = String(id);

  if(favJogos.has(id)){
    favJogos.delete(id);
  }else{
    favJogos.add(id);
  }

  guardarStorage("futzone_jogos_favoritos", [...favJogos]);

  renderJogos();
  renderFavoritos();

  mostrarToast(
    favJogos.has(id)
    ? "Jogo adicionado aos favoritos"
    : "Jogo removido dos favoritos"
  );
}


function toggleFavEquipa(id){

  id = String(id);

  if(!id || id === "undefined") return;

  if(favEquipas.has(id)){
    favEquipas.delete(id);
  }else{
    favEquipas.add(id);
  }

  guardarStorage("futzone_equipas_favoritas", [...favEquipas]);

  renderFavoritos();
}


function mostrarFavTipo(tipo){

  favTipoAtual = tipo;

  document
    .querySelectorAll(".favTab")
    .forEach(el => el.classList.remove("active"));

  const ativo = document.querySelector(`[data-fav="${tipo}"]`);
  if(ativo) ativo.classList.add("active");

  renderFavoritos();
}


function renderFavoritos(){

  const container = document.getElementById("favoritesContainer");
  if(!container) return;

  if(favTipoAtual === "jogos"){

    const mapa = new Map();

    [...jogosFutebol, ...liveGlobalCache].forEach(j => {
      if(j?.id) mapa.set(String(j.id), j);
    });

    const lista = [...mapa.values()]
      .filter(j => favJogos.has(String(j.id)))
      .sort((a,b) => {
        const da = new Date(a.date || a.startDate || 0);
        const db = new Date(b.date || b.startDate || 0);
        return da - db;
      });

    if(!lista.length){
      container.innerHTML = `

  if(favTipoAtual === "equipas"){

    if(!ids.length){

          <div class="emptyIcon">⚽</div>

    container.innerHTML = ids.map(id => {

function encontrarEquipaCarregada(id){

  id = String(id);

  for(const jogo of jogosFutebol){

    const home = obterCompetidor(jogo, "home");
    const away = obterCompetidor(jogo, "away");

    if(String(idEquipa(home)) === id){
      return {
        id:id,
        name:nomeEquipa(home),
        logo:logoEquipa(home)
      };
    }

    if(String(idEquipa(away)) === id){
      return {
        id:id,
        name:nomeEquipa(away),
        logo:logoEquipa(away)
      };
    }
  }

  return null;
}

async function obterStandings(slug){

  const liga = LIGAS[slug];
  if(!liga) return null;

  const urls = [

    `${API}/sports/soccer/leagues/${encodeURIComponent(liga.id)}/standings`,

    `${API}/sports/soccer/${encodeURIComponent(liga.id)}/standings`,

    `${API}/sports/soccer/${encodeURIComponent(liga.id)}/standings?region=pt`
  ];

  for(const url of urls){

    try{

      const data = await fetchJSON(url);

      if(data){
        const grupos = extrairGruposStandings(data);

        if(grupos.length){
          return grupos;
        }
      }

    }catch(e){}
  }

  return null;
}


function extrairGruposStandings(data){

  if(!data) return [];

  if(Array.isArray(data.standings)){
    return data.standings;
  }

  if(Array.isArray(data.children)){

    return data.children
      .map(c => {

        if(Array.isArray(c.standings)){
          return c.standings;
        }

        if(c.standings?.entries){
          return c.standings;
        }

        return null;

      })
      .filter(Boolean);
  }

  if(data.standings?.entries){
    return [data.standings];
  }

  if(data.content?.standings?.entries){
    return [data.content.standings];
  }

  return [];
}


function extrairValorStat(entry, nomes){

  const stats = entry?.stats || entry?.statistics || [];

  for(const nome of nomes){

    const stat = stats.find(s => {

      const n = String(
        s.name ||
        s.abbreviation ||
        s.displayName ||
        ""
      ).toLowerCase();

      return n === nome.toLowerCase();
    });

    if(stat){

      if(stat.value !== undefined){
        return stat.value;
      }

      if(stat.displayValue !== undefined){
        return stat.displayValue;
      }
    }
  }

  return "";
}


function obterEquipaStanding(entry){

  return (
    entry?.team ||
    entry?.competitor?.team ||
    entry?.competitor ||
    {}
  );
}


function valorStanding(entry, tipo){

  if(tipo === "pos"){
    return entry?.rank ??
      entry?.position ??
      extrairValorStat(entry,["rank","position"]);
  }

  if(tipo === "jogos"){
    return extrairValorStat(entry,[
      "gamesPlayed",
      "gp",
      "played",
      "games"
    ]);
  }

  if(tipo === "v"){
    return extrairValorStat(entry,[
      "wins",
      "w"
    ]);
  }

  if(tipo === "e"){
    return extrairValorStat(entry,[
      "ties",
      "draws",
      "d"
    ]);
  }

  if(tipo === "d"){
    return extrairValorStat(entry,[
      "losses",
      "l"
    ]);
  }

  if(tipo === "gm"){
    return extrairValorStat(entry,[
      "pointsFor",
      "goalsFor",
      "gf"
    ]);
  }

  if(tipo === "gs"){
    return extrairValorStat(entry,[
      "pointsAgainst",
      "goalsAgainst",
      "ga"
    ]);
  }

  if(tipo === "dg"){
    return extrairValorStat(entry,[
      "pointDifferential",
      "goalDifference",
      "gd"
    ]);
  }

  if(tipo === "pts"){
    return extrairValorStat(entry,[
      "points",
      "pts"
    ]);
  }

  return "";
}


function renderTabelaGrupo(grupo){

  const entries =
    grupo?.entries ||
    grupo?.standings?.entries ||
    [];

  if(!entries.length){
    return "";
  }

  const nomeGrupo =
    grupo?.name ||
    grupo?.displayName ||
    grupo?.title ||
    "";

  return `
    <div class="tableBlock">

      ${
        nomeGrupo
        ? `<div class="tableGroupTitle">${escapeHTML(nomeGrupo)}</div>`
        : ""
      }

      <div class="tableHeader">
        <span>#</span>
        <span>Equipa</span>
        <span>J</span>
        <span>V</span>
        <span>E</span>
        <span>D</span>
        <span>DG</span>
        <span>Pts</span>
      </div>

      ${entries.map((entry,index) => {

        const equipa = obterEquipaStanding(entry);

        const id = equipa.id || "";

        const pos =
          valorStanding(entry,"pos") ||
          index + 1;

        return `
          <div class="tableRow"
            onclick="abrirEquipa('${escapeAttr(id)}')">

            <span class="position">${pos}</span>

            <span class="standingTeam">

              ${
                equipa.logo
                ? `<img src="${escapeAttr(equipa.logo)}"
                        onerror="this.style.display='none'">`
                : ""
              }

              <strong>
                ${escapeHTML(
                  equipa.displayName ||
                  equipa.name ||
                  "Equipa"
                )}
              </strong>

            </span>

            <span>${valorStanding(entry,"jogos")}</span>
            <span>${valorStanding(entry,"v")}</span>
            <span>${valorStanding(entry,"e")}</span>
            <span>${valorStanding(entry,"d")}</span>
            <span>${valorStanding(entry,"dg")}</span>
            <span class="points">${valorStanding(entry,"pts")}</span>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


async function carregarClassificacao(slug){

  const container =
    document.getElementById("standingsContainer");

  if(!container) return;

  const liga = LIGAS[slug];

  container.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      A carregar classificação de
      <strong>${escapeHTML(liga?.nome || slug)}</strong>...
    </div>
  `;

  const grupos = await obterStandings(slug);

  if(grupos?.length){

    container.innerHTML = grupos
      .map(renderTabelaGrupo)
      .join("");

    return;
  }

  const alternativa =
    await tentarClassificacaoAlternativa(slug);

  if(alternativa?.length){

    container.innerHTML = alternativa
      .map(renderTabelaGrupo)
      .join("");

    return;
  }

  container.innerHTML = `
    <div class="empty">
      <div class="emptyIcon">📊</div>

      <strong>
        Classificação indisponível
      </strong>

      <div>
        A classificação desta competição
        não está disponível neste momento
        através da fonte de dados.
      </div>
    </div>
  `;
}


async function tentarClassificacaoAlternativa(slug){

  const liga = LIGAS[slug];

  if(!liga) return null;

  try{

    const url =
      `${API_CORE}/leagues/${encodeURIComponent(liga.id)}/standings`;

    const data = await fetchJSON(url);

    if(data){

      const grupos = extrairGruposStandings(data);

      if(grupos.length){
        return grupos;
      }
    }

  }catch(e){}

  return null;
}

async function carregarLiveGlobal(){

  const agora = Date.now();

  if(
    liveGlobalCache.length &&
    agora - liveGlobalTimestamp < 30000
  ){
    return liveGlobalCache;
  }

  const mapa = new Map();

  await Promise.all(
    Object.keys(LIGAS).map(async slug => {

      try{

        const jogos =
          await obterScoreboardLiga(slug);

        jogos
          .filter(eventoEmDireto)
          .forEach(jogo => {

            if(jogo?.id){
              mapa.set(String(jogo.id),{
                ...jogo,
                league:{
                  ...(jogo.league || {}),
                  slug
                }
              });
            }

          });

      }catch(e){}

    })
  );

  liveGlobalCache = [...mapa.values()];
  liveGlobalTimestamp = agora;

  return liveGlobalCache;
}


async function abrirLiveGlobal(){

  const overlay =
    document.getElementById("liveOverlay");

  const body =
    document.getElementById("liveBody");

  const texto =
    document.getElementById("liveGlobalText");

  if(!overlay || !body) return;

  overlay.classList.add("open");

  if(texto){
    texto.textContent = "A procurar jogos ao vivo...";
  }

  body.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      A procurar jogos ao vivo em todas as competições...
    </div>
  `;

  const jogos = await carregarLiveGlobal();

  if(texto){
    texto.textContent =
      `${jogos.length} jogo${jogos.length === 1 ? "" : "s"} ao vivo`;
  }

  if(!jogos.length){

    body.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">🔴</div>
        <strong>Nenhum jogo ao vivo</strong>
        <div>
          Neste momento não existem jogos
          ao vivo nas competições disponíveis.
        </div>
      </div>
    `;

    return;
  }

  body.innerHTML =
    jogos
      .sort((a,b) =>
        new Date(a.date || 0) -
        new Date(b.date || 0)
      )
      .map(criarCardJogo)
      .join("");
}


function fecharLiveGlobal(){

  const overlay =
    document.getElementById("liveOverlay");

  if(overlay){
    overlay.classList.remove("open");
  }
}

/* =========================================================
   EVENTOS
   ========================================================= */

function extrairEventos(data){

  const candidatos = [

    data?.keyEvents,

    data?.plays,

    data?.leaders?.events,

    data?.header?.competitions?.[0]?.details

  ];

  for(const lista of candidatos){

    if(Array.isArray(lista) && lista.length){

      return lista;
    }
  }

  return [];
}

function eventoTipoIcon(evento){

  const texto =
    JSON.stringify(evento || {})
      .toLowerCase();

  if(
    texto.includes("goal") ||
    texto.includes("score")
  ){
    return "⚽";
  }

  if(
    texto.includes("yellow")
  ){
    return "🟨";
  }

  if(
    texto.includes("red")
  ){
    return "🟥";
  }

  if(
    texto.includes("substitut")
  ){
    return "🔄";
  }

  return "•";
}

function eventosHTML(data){

  const eventos =
    extrairEventos(data);

  if(!eventos.length){

    return `
      <div class="empty">
        Ainda não existem eventos disponíveis.
      </div>
    `;
  }

  return `
    <div class="detailSection">

      <div class="detailSectionTitle">
        ⚡ Eventos da partida
      </div>

      ${
        eventos.map(ev=>{

          const minuto =
            ev?.clock?.displayValue ||
            ev?.clock?.value ||
            ev?.time?.displayValue ||
            ev?.time ||
            "";

          const texto =
            ev?.text ||
            ev?.description ||
            ev?.shortText ||
            ev?.type?.text ||
            "Evento";

          return `

            <div class="eventRow">

              <div class="eventMinute">
                ${escapeHTML(minuto)}
              </div>

              <div class="eventCenter">
                ${escapeHTML(texto)}
              </div>

              <div class="eventIcon">
                ${eventoTipoIcon(ev)}
              </div>

            </div>

          `;

        }).join("")
      }

    </div>
  `;
}

/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

function extrairStats(data){

  const grupos = [];

  const candidatos = [

    data?.boxscore?.teams,

    data?.boxscore?.teams?.[0]?.statistics,

    data?.statistics,

    data?.leaders

  ];

  for(const candidato of candidatos){

    if(Array.isArray(candidato)){

      candidato.forEach(item=>{

        if(
          item?.statistics ||
          item?.stats
        ){

          grupos.push(item);
        }

      });

    }

  }

  /*
   * Formato habitual do summary:
   * boxscore.teams[].statistics
   */
  const teams =
    data?.boxscore?.teams;

  if(Array.isArray(teams)){

    const home =
      teams.find(
        x=>x?.homeAway==="home"
      ) ||
      teams[0];

    const away =
      teams.find(
        x=>x?.homeAway==="away"
      ) ||
      teams[1];

    if(home || away){

      return {
        home,
        away
      };
    }
  }

  return {
    home:null,
    away:null
  };
}

function normalizarStats(team){

  if(!team) return [];

  const lista =
    team.statistics ||
    team.stats ||
    [];

  if(!Array.isArray(lista)) return [];

  return lista.map(stat=>{

    return {
      nome:
        stat?.displayName ||
        stat?.name ||
        stat?.label ||
        "",

      valor:
        stat?.displayValue ??
        stat?.value ??
        stat?.displayValue ||
        "0"
    };

  });
}

function estatisticasHTML(data){

  const stats =
    extrairStats(data);

  const homeStats =
    normalizarStats(stats.home);

  const awayStats =
    normalizarStats(stats.away);

  if(!homeStats.length && !awayStats.length){

    return `
      <div class="empty">
        As estatísticas desta partida ainda
        não estão disponíveis.
      </div>
    `;
  }

  const nomes = new Set();

  homeStats.forEach(x=>{
    if(x.nome) nomes.add(x.nome);
  });

  awayStats.forEach(x=>{
    if(x.nome) nomes.add(x.nome);
  });

  const homeName =
    nomeEquipa(
      stats.home?.team ||
      stats.home
    );

  const awayName =
    nomeEquipa(
      stats.away?.team ||
      stats.away
    );

  const mapaHome =
    Object.fromEntries(
      homeStats.map(x=>[x.nome,x.valor])
    );

  const mapaAway =
    Object.fromEntries(
      awayStats.map(x=>[x.nome,x.valor])
    );

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        📊 Estatísticas
      </div>

      <div style="
        display:grid;
        grid-template-columns:1fr 1fr;
        padding:11px 12px;
        color:#8290A4;
        font-size:10px;
        font-weight:900;
        text-align:center
      ">
        <div>${escapeHTML(homeName)}</div>
        <div>${escapeHTML(awayName)}</div>
      </div>

      ${
        Array.from(nomes).map(nome=>{

          const hv =
            mapaHome[nome] ?? "0";

          const av =
            mapaAway[nome] ?? "0";

          const hn =
            Number(
              String(hv).replace("%","")
            ) || 0;

          const an =
            Number(
              String(av).replace("%","")
            ) || 0;

          const total =
            hn+an;

          const hp =
            total
              ? Math.round(hn/total*100)
              : 50;

          const ap =
            total
              ? Math.round(an/total*100)
              : 50;

          return `

            <div class="statRow">

              <div class="statVal">
                ${escapeHTML(hv)}
              </div>

              <div class="statLabel">
                ${escapeHTML(nome)}
              </div>

              <div class="statVal">
                ${escapeHTML(av)}
              </div>

            </div>

            <div style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:2px;
              padding:0 12px 7px
            ">

              <div class="statBar">
                <i style="width:${hp}%"></i>
              </div>

              <div class="statBar">
                <i style="width:${ap}%"></i>
              </div>

            </div>

          `;

        }).join("")
      }

    </div>
  `;
}

/* =========================================================
   TITULARES
   ========================================================= */

function obterTitulares(data){

  const resultado = {
    home:[],
    away:[]
  };

  /*
   * Formato 1:
   * rosters
   */
  if(Array.isArray(data?.rosters)){

    data.rosters.forEach(roster=>{

      const team =
        roster?.team ||
        {};

      const jogadores =
        roster?.roster ||
        roster?.players ||
        [];

      const titulares =
        jogadores.filter(j=>
          j?.starter === true ||
          j?.starter === "true" ||
          j?.isStarter === true ||
          j?.athlete?.starter === true
        );

      const destino =
        roster?.homeAway==="home"
          ? "home"
          : roster?.homeAway==="away"
            ? "away"
            : null;

      if(destino){

        resultado[destino].push(
          ...titulares
        );

      }else{

        const teamId =
          idEquipa(team);

        const comp =
          data?.header?.competitions?.[0]
            ?.competitors
            ?.find(c=>
              idEquipa(c)===teamId
            );

        if(comp?.homeAway==="home"){
          resultado.home.push(...titulares);
        }else if(comp?.homeAway==="away"){
          resultado.away.push(...titulares);
        }
      }

    });

  }

  /*
   * Formato 2:
   * lineups
   */
  if(
    !resultado.home.length &&
    !resultado.away.length &&
    Array.isArray(data?.lineups)
  ){

    data.lineups.forEach(lineup=>{

      const jogadores =
        lineup?.roster ||
        lineup?.players ||
        lineup?.athletes ||
        [];

      const titulares =
        jogadores.filter(j=>
          j?.starter === true ||
          j?.starter === "true" ||
          j?.isStarter === true
        );

      if(lineup?.homeAway==="home"){
        resultado.home.push(...titulares);
      }else if(lineup?.homeAway==="away"){
        resultado.away.push(...titulares);
      }

    });

  }

  /*
   * Formato 3:
   * boxscore players
   */
  if(
    !resultado.home.length &&
    !resultado.away.length &&
    Array.isArray(data?.boxscore?.players)
  ){

    data.boxscore.players.forEach(grupo=>{

      const jogadores =
        grupo?.statistics ||
        grupo?.players ||
        grupo?.athletes ||
        [];

      const titulares =
        jogadores.filter(j=>
          j?.starter === true ||
          j?.starter === "true" ||
          j?.isStarter === true
        );

      if(grupo?.homeAway==="home"){
        resultado.home.push(...titulares);
      }else if(grupo?.homeAway==="away"){
        resultado.away.push(...titulares);
      }

    });

  }

  /*
   * Formato 4:
   * competitors rosters
   */
  const competitors =
    data?.header?.competitions?.[0]?.competitors ||
    [];

  competitors.forEach(comp=>{

    const jogadores =
      comp?.roster ||
      comp?.players ||
      comp?.athletes ||
      [];

    const titulares =
      jogadores.filter(j=>
        j?.starter === true ||
        j?.starter === "true" ||
        j?.isStarter === true
      );

    if(comp?.homeAway==="home"){
      resultado.home.push(...titulares);
    }

    if(comp?.homeAway==="away"){
      resultado.away.push(...titulares);
    }

  });

  /*
   * Remover duplicados
   */
  resultado.home =
    deduplicarJogadores(
      resultado.home
    ).slice(0,11);

  resultado.away =
    deduplicarJogadores(
      resultado.away
    ).slice(0,11);

  return resultado;
}

function deduplicarJogadores(lista){

  const mapa =
    new Map();

  lista.forEach((j,index)=>{

    const atleta =
      j?.athlete ||
      j?.player ||
      j;

    const id =
      atleta?.id ||
      j?.id ||
      ("jogador-"+index);

    if(!mapa.has(String(id))){

      mapa.set(
        String(id),
        j
      );

    }

  });

  return Array.from(mapa.values());
}

function atletaInfo(jogador){

  const atleta =
    jogador?.athlete ||
    jogador?.player ||
    jogador ||
    {};

  return {
    id:
      atleta?.id ||
      jogador?.id ||
      "",

    nome:
      atleta?.displayName ||
      atleta?.fullName ||
      atleta?.shortName ||
      jogador?.displayName ||
      jogador?.fullName ||
      jogador?.name ||
      "Jogador",

    numero:
      atleta?.jersey ||
      jogador?.jersey ||
      jogador?.number ||
      atleta?.number ||
      "?"
  };
}

/*
 * Distribuição 4-3-3.
 *
 * A API pode fornecer posições reais, mas para garantir que
 * os 11 jogadores aparecem sempre no campo, usamos posições
 * visuais equilibradas.
 */
function posicoesCampo(){

  return [

    {x:50,y:94}, // GR

    {x:18,y:77},
    {x:39,y:80},
    {x:61,y:80},
    {x:82,y:77},

    {x:25,y:55},
    {x:50,y:59},
    {x:75,y:55},

    {x:20,y:29},
    {x:50,y:24},
    {x:80,y:29}

  ];
}

function renderPitch(jogadores,modo){

  const posicoes =
    posicoesCampo();

  /*
   * Para a equipa visitante virada para o outro lado,
   * invertimos verticalmente o campo.
   */
  return `
    <div class="pitch">

      <div class="penalty top"></div>
      <div class="penalty bottom"></div>

      <div class="goalArea top"></div>
      <div class="goalArea bottom"></div>

      ${
        jogadores.map((jogador,index)=>{

          const p =
            posicoes[index] ||
            posicoes[10];

          const info =
            atletaInfo(jogador);

          const y =
            modo==="away"
              ? 100-p.y
              : p.y;

          return `

            <div
              class="playerDot"
              style="
                left:${p.x}%;
                top:${y}%;
              "
              title="${escapeAttr(info.nome)}"
            >

              <span>
                ${escapeHTML(info.numero)}
              </span>

              <small>
                ${escapeHTML(info.nome)}
              </small>

            </div>

          `;

        }).join("")
      }

    </div>
  `;
}

function onzesHTML(data){

  const titulares =
    obterTitulares(data);

  if(
    !titulares.home.length &&
    !titulares.away.length
  ){

    return `
      <div class="empty">

        <div style="font-size:30px;margin-bottom:10px">
          👕
        </div>

        Os titulares desta partida
        ainda não foram disponibilizados
        pela fonte de dados.

      </div>
    `;
  }

  const competitors =
    data?.header?.competitions?.[0]?.competitors ||
    [];

  const home =
    competitors.find(
      x=>x.homeAway==="home"
    ) ||
    competitors[0] ||
    {};

  const away =
    competitors.find(
      x=>x.homeAway==="away"
    ) ||
    competitors[1] ||
    {};

  return `

    <div class="detailSection">

      <div class="detailSectionTitle">
        👕 Titulares — ${escapeHTML(nomeEquipa(home))}
      </div>

      ${renderPitch(titulares.home,"home")}

      <div class="pitchLegend">
        Número da camisola + nome do jogador
      </div>

    </div>

    <div class="detailSection">

      <div class="detailSectionTitle">
        👕 Titulares — ${escapeHTML(nomeEquipa(away))}
      </div>

      ${renderPitch(titulares.away,"away")}

      <div class="pitchLegend">
        Campo invertido para a equipa visitante
      </div>

    </div>
  `;
}

/* =========================================================
   EQUIPA
   ========================================================= */

async function abrirEquipa(id,nome,logo){

  if(!id){

    mostrarToast(
      "Não foi possível identificar esta equipa."
    );

    return;
  }

  const overlay =
    document.getElementById("teamOverlay");

  const body =
    document.getElementById("teamBody");

  if(!overlay || !body) return;

  overlay.classList.add("open");

  document.getElementById("teamHeaderTitle").textContent =
    nome || "Equipa";

  const favorita =
    favEquipas.some(
      x=>String(x.id)===String(id)
    );

  body.innerHTML = `

    <div class="teamHero">

      ${
        logo
          ? `<img src="${escapeAttr(logo)}" alt="">`
          : `<div style="font-size:45px">🛡️</div>`
      }

      <div style="flex:1">

        <h2>
          ${escapeHTML(nome || "Equipa")}
        </h2>

        <p>
          Página da equipa
        </p>

      </div>

      <button
        class="favoriteBtn ${favorita?"active":""}"
        onclick="toggleFavEquipa({
          id:'${escapeAttr(String(id))}',
          name:'${escapeAttr(nome || "Equipa")}',
          logo:'${escapeAttr(logo || "")}'
        })"
      >
        ${favorita ? "★" : "☆"}
      </button>

    </div>

    <div class="detailSection">

      <div class="detailSectionTitle">
        ⚽ Próximos jogos
      </div>

      <div
        id="teamGames"
        class="games"
        style="padding:10px"
      >
        <div class="loading">
          A procurar jogos da equipa...
        </div>
      </div>

    </div>
  `;

  await carregarJogosEquipa(
    id,
    nome
  );
}

async function carregarJogosEquipa(id,nome){

  const container =
    document.getElementById("teamGames");

  if(!container) return;

  const eventos = [];

  try{

    /*
     * Procuramos nos jogos já carregados
     * e no cache global.
     */
    const todos = [
      ...jogosFutebol,
      ...liveGlobalCache
    ];

    const mapa =
      new Map();

    todos.forEach(evento=>{

      const casa =
        obterCompetidor(evento,0);

      const fora =
        obterCompetidor(evento,1);

      if(
        String(idEquipa(casa))===String(id) ||
        String(idEquipa(fora))===String(id)
      ){

        mapa.set(
          String(evento.id),
          evento
        );
      }

    });

    mapa.forEach(x=>eventos.push(x));

    eventos.sort(ordenarEventos);

    if(!eventos.length){

      container.innerHTML = `
        <div class="empty">
          Os jogos desta equipa serão carregados
          quando estiverem disponíveis na competição.
        </div>
      `;

      return;
    }

    container.innerHTML =
      eventos
        .slice(0,20)
        .map(criarCardJogo)
        .join("");

  }catch(e){

    container.innerHTML = `
      <div class="empty">
        Não foi possível carregar os jogos.
      </div>
    `;
  }
}

function fecharEquipa(){

  document
    .getElementById("teamOverlay")
    ?.classList
    .remove("open");
}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function mostrarToast(texto){

  const toast =
    document.getElementById("toast");

  if(!toast) return;

  toast.textContent =
    texto;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);
}

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ========================================================= */

async function atualizarDados(){

  /*
   * Só atualizamos a vista de jogos se estiver visível.
   */
  if(
    document
      .getElementById("viewJogos")
      ?.classList
      .contains("active")
  ){

    await carregarJogos();

  }

  /*
   * Atualizamos o cache global.
   */
  liveGlobalTimestamp = 0;

  const live =
    await carregarLiveGlobal();

  document.getElementById("liveGlobalText").textContent =
    live.length
      ? `AO VIVO — ${live.length} JOGO${live.length===1?"":"S"}`
      : "AO VIVO — TODOS OS CAMPEONATOS";
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

function iniciarFutzone(){

  renderLeagueLists();

  carregarJogos();

  /*
   * Atualização a cada 60 segundos.
   */
  setInterval(()=>{

    atualizarDados()
      .catch(console.error);

  },60000);

}

document.addEventListener(
  "DOMContentLoaded",
  iniciarFutzone
);

/*
 * Fechar overlays com ESC.
 */
document.addEventListener(
  "keydown",
  event=>{

    if(event.key!=="Escape") return;

    fecharDetalhe();
    fecharEquipa();
    fecharLiveGlobal();

  }
);

/*
 * Impede que o botão de voltar do Android
 * deixe a página num estado estranho quando
 * existe um detalhe aberto.
 */
window.addEventListener(
  "popstate",
  ()=>{

    fecharDetalhe();
    fecharEquipa();
    fecharLiveGlobal();

  }
);

</script>
