<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}

header{
 background:#000;
 border-bottom:1px solid #222;
 padding:18px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 font-size:28px;
 font-weight:900;
 color:#168cff
}

.logo span{color:#fff}

.container{
 padding:15px;
 max-width:900px;
 margin:auto
}

button{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:#168cff;
 color:#fff;
 font-weight:bold
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:10px 0
}

.filters button{
 white-space:nowrap;
 background:#151515;
 border:1px solid #333
}

.filters button.active{
 background:#168cff;
 border-color:#168cff
}

.card{
 background:#101010;
 border:1px solid #252525;
 border-radius:14px;
 padding:14px;
 margin-bottom:12px
}

.league{
 color:#168cff;
 font-size:13px;
 font-weight:bold;
 margin-bottom:8px
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:10px
}

.team{
 font-weight:bold;
 cursor:pointer
}

.team:last-child{text-align:right}

.team:hover{color:#168cff}

.team-logo{
 width:35px;
 height:35px;
 object-fit:contain;
 vertical-align:middle;
 margin-right:7px
}

.score{
 font-size:20px;
 font-weight:900;
 white-space:nowrap
}

.status{
 font-size:12px;
 color:#aaa;
 margin-top:8px
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#080808;
 border-top:1px solid #252525;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30
}

.nav button{
 background:none;
 color:#aaa;
 padding:8px
}

.nav button.active{color:#168cff}

.back{
 margin-bottom:15px;
 background:#202020
}

.plantel-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.player{
 background:#151515;
 border:1px solid #292929;
 border-radius:14px;
 padding:12px;
 text-align:center;
 cursor:pointer
}

.player:hover{
 border-color:#168cff;
 transform:translateY(-2px)
}

.player img{
 width:80px;
 height:80px;
 object-fit:cover;
 border-radius:50%;
 background:#222;
 margin-bottom:8px
}

.player-name{
 font-weight:bold;
 font-size:14px
}

.player-info{
 color:#999;
 font-size:12px;
 margin-top:5px
}

.player-profile{
 text-align:center;
 padding:10px
}

.player-profile img{
 width:150px;
 height:150px;
 border-radius:50%;
 object-fit:cover;
 background:#181818;
 border:3px solid #168cff
}

.position{
 color:#168cff;
 font-weight:bold
}

.info-box{
 background:#111;
 border:1px solid #292929;
 border-radius:14px;
 margin-top:20px;
 overflow:hidden
}

.info-row{
 display:flex;
 justify-content:space-between;
 padding:14px;
 border-bottom:1px solid #222
}

.info-row:last-child{border-bottom:0}

.info-label{color:#888}

.info-value{font-weight:bold}

.empty{

 color:#777;
 padding:30px

.table-wrap{
 overflow-x:auto
}

table{
 width:100%;
 min-width:430px;
 border-collapse:collapse;
 background:#101010
}

th,td{
 padding:10px 6px;
 border-bottom:1px solid #252525;
 text-align:center;
 font-size:13px
}

th{color:#168cff}

@media(max-width:500px){
 .plantel-grid{grid-template-columns:repeat(2,1fr)}
 .player img{width:70px;height:70px}

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>
</header>

<div class="container" id="app"></div>

<div class="nav">
 <button id="navJogos" onclick="mostrarJogos()">⚽<br>Jogos</button>
 <button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
 <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;

const ligas=[
 {nome:"Portugal",arquivo:"data/primeira-liga.json"},
 {nome:"Inglaterra",arquivo:"data/premier-league.json"},
 {nome:"Espanha",arquivo:"data/la-liga.json"},
 {nome:"Itália",arquivo:"data/serie-a.json"},
 {nome:"Alemanha",arquivo:"data/bundesliga.json"}
];

/* =========================
   SEGURANÇA
========================= */

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function normalizar(texto){
 return String(texto||"")
 .toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-z0-9]/g,"");
}

/* =========================
   EQUIPAS
========================= */

function obterCompeticao(j){
 return j?.competitions?.[0] || {};
}

function obterEquipas(j){

 let c=obterCompeticao(j).competitors;

 if(!Array.isArray(c))
   c=j?.competitors;

 if(!Array.isArray(c))
   c=[];

 return{
   home:c.find(x=>x.homeAway==="home")||c[0]||{},
   away:c.find(x=>x.homeAway==="away")||c[1]||{}
 };
}

function nomeEquipa(c){

 return(
   c?.team?.displayName||
   c?.team?.shortDisplayName||
   c?.team?.name||
   c?.displayName||
   c?.name||
   null
 );
}

function nomeEquipaSeguro(c,j,home){

 const nome=nomeEquipa(c);

 if(nome)return nome;

 if(j?.name){

   const partes=j.name.split(" at ");

   if(partes.length===2)
     return home?partes[1]:partes[0];
 }

 return"Equipa";
}

function idEquipa(c){

 return(
   c?.team?.id||
   c?.id||
   null
 );
}

function logoEquipa(c){

 return(
   c?.team?.logo||
   c?.team?.logos?.[0]?.href||
   c?.logo||
   c?.logos?.[0]?.href||
   ""
 );
}

/* =========================
   JOGOS
========================= */

function resultado(c){

 if(c?.score===undefined||c?.score===null)
   return"-";

 if(typeof c.score==="object")
   return c.score.displayValue||c.score.value||"-";

 return c.score;
}

function estadoJogo(j){

 const s=obterCompeticao(j)?.status?.type;

 if(s?.state==="in")
   return"LIVE";

 if(s?.completed||s?.state==="post")
   return"RESULTADO";

 return"PRÓXIMO";
}

function dataJogo(j){

 if(!j?.date)return"";

 try{

   return new Date(j.date).toLocaleString(
     "pt-PT",
     {
       day:"2-digit",
       month:"2-digit",
       hour:"2-digit",
       minute:"2-digit"
     }
   );

 }catch(e){

   return j.date;
 }
}

/* =========================
   CARREGAR JOGOS
========================= */

async function carregar(){

 jogos=[];

 for(const liga of ligas){

   try{

     const r=await fetch(
       liga.arquivo+"?v="+Date.now()
     );

     if(!r.ok)continue;

     const d=await r.json();

     let lista=[];

     if(Array.isArray(d?.events))
       lista=d.events;
     else if(Array.isArray(d))
       lista=d;

     lista.forEach(j=>{
       j.__liga=liga.nome;
       jogos.push(j);
     });

   }catch(e){

     console.log("Erro jogos",liga.arquivo,e);
   }
 }

 mostrarJogos();
}

/* =========================
   JOGOS
========================= */

function mostrarJogos(){

 document.getElementById("navJogos").classList.add("active");
 document.getElementById("navTabelas").classList.remove("active");
 document.getElementById("navFav").classList.remove("active");

 document.getElementById("app").innerHTML=`

 <h2>⚽ Jogos</h2>

 <div class="filters">

 ${
 ["Todos","LIVE","Próximos","Resultados"].map(x=>`

 <button
 class="${filtroAtual===x?"active":""}"
 onclick="filtroAtual='${x}';mostrarJogos()">

 ${x}

 </button>

 `).join("")
 }

 </div>

 <div class="filters">

 ${
 ["Todos",...ligas.map(x=>x.nome)].map(x=>`

 <button
 class="${ligaAtual===x?"active":""}"
 onclick="ligaAtual='${x}';mostrarJogos()">

 ${x}

 </button>

 `).join("")
 }

 </div>

 <div id="lista"></div>
 `;

 const lista=jogos.filter(j=>{

   const ligaOK=
     ligaAtual==="Todos"||
     j.__liga===ligaAtual;

   const estado=estadoJogo(j);

   const filtroOK=
     filtroAtual==="Todos"||
     (filtroAtual==="LIVE"&&estado==="LIVE")||
     (filtroAtual==="Próximos"&&estado==="PRÓXIMO")||
     (filtroAtual==="Resultados"&&estado==="RESULTADO");

   return ligaOK&&filtroOK;
 });

 const div=document.getElementById("lista");

 if(!lista.length){

   div.innerHTML=
     '<div class="empty">Não há jogos disponíveis.</div>';

   return;
 }

 div.innerHTML=lista.map(jogoCard).join("");
}

function jogoCard(j){

 const e=obterEquipas(j);

 const hn=nomeEquipaSeguro(e.home,j,true);
 const an=nomeEquipaSeguro(e.away,j,false);

 const hid=idEquipa(e.home);
 const aid=idEquipa(e.away);

 const hl=logoEquipa(e.home);
 const al=logoEquipa(e.away);

 const estado=estadoJogo(j);

 return`

 <div class="card">

 <div class="league">${esc(j.__liga)}</div>

 <div class="teams">

 <div class="team"
 onclick="abrirEquipaPorId(
 '${esc(hid||"")}',
 '${esc(hn)}',
 '${esc(j.__liga)}',
 '${esc(hl)}'
 )">

 ${
 hl
 ?`<img class="team-logo" src="${esc(hl)}">`
 :""
 }

 ${esc(hn)}

 </div>

 <div class="score">
 ${esc(resultado(e.home))} - ${esc(resultado(e.away))}
 </div>

 <div class="team"
 onclick="abrirEquipaPorId(
 '${esc(aid||"")}',
 '${esc(an)}',
 '${esc(j.__liga)}',
 '${esc(al)}'
 )">

 ${
 al
 ?`<img class="team-logo" src="${esc(al)}">`
 :""
 }

 ${esc(an)}

 </div>

 </div>

 <div class="status">

 ${
 estado==="LIVE"
 ?"🔴 AO VIVO"
 :estado
 }

 ${
 j.date
 ?" • "+esc(dataJogo(j))
 :""
 }

 </div>

 </div>
 `;
}

/* =========================
   EQUIPA
========================= */

function abrirEquipaPorId(id,name,league,logo){

 equipaAtual={
   id:id,
   name:name,
   league:league,
   logo:logo
 };

 mostrarEquipa();
}

function abrirEquipa(e){

 equipaAtual=e;
 mostrarEquipa();
}

async function mostrarEquipa(){

 document.getElementById("app").innerHTML=`

 <button class="back" id="voltar">
 ← Voltar
 </button>

 <div style="text-align:center">

 ${
 equipaAtual.logo
 ?`
 <img
 src="${esc(equipaAtual.logo)}"
 style="width:80px;height:80px;object-fit:contain">
 `
 :""
 }

 <h2>${esc(equipaAtual.name)}</h2>

 <div class="league">
 ${esc(equipaAtual.league)}
 </div>

 </div>

 <h3>👥 Plantel</h3>

 <div id="plantel">
 <div class="empty">
 A carregar plantel...
 </div>
 </div>

 <h3>⚽ Jogos</h3>

 <div id="jogos-equipa"></div>
 `;

 document.getElementById("voltar").onclick=mostrarJogos;

 const relacionados=jogos.filter(j=>{

   const e=obterEquipas(j);

   return(
     String(idEquipa(e.home))===String(equipaAtual.id)||
     String(idEquipa(e.away))===String(equipaAtual.id)
   );
 });

 document.getElementById("jogos-equipa").innerHTML=
 relacionados.length
 ?relacionados.map(jogoCard).join("")
 :'<div class="empty">Sem jogos encontrados.</div>';

 await carregarPlantel();
}

/* =========================
   PLANTÉIS
========================= */

function extrairPlantel(entrada){

 if(!entrada)return null;

 if(Array.isArray(entrada))
   return entrada;

 for(const chave of["players","roster","squad"]){

   if(Array.isArray(entrada[chave]))
     return entrada[chave];

   if(
     entrada[chave]&&
     typeof entrada[chave]==="object"
   )
     return Object.values(entrada[chave]);
 }

 return null;
}

/*
 CORRESPONDÊNCIA DE EQUIPAS
 Mesmo que ESPN e TheSportsDB usem
 nomes ou IDs diferentes.
*/

function aliasesEquipa(nome){

 const n=normalizar(nome);

 const grupos=[
   ["sporting","sportingcp","sportingclubedeportugal"],
   ["braga","scbraga","sportingclubedebraga"],
   ["bayern","bayernmunich","bayernmunchen","fcbayern"],
   ["inter","internazionale","intermilan","intermilano"],
   ["estrela","estrelamadora","cfestrelamadora"],
   ["nacional","cdnacional","cdnacionalmadeira"],
   ["porto","fcporto"],
   ["benfica","slbenfica","slbenficaeagles"],
   ["famalicao","famalicaofc","fcfamalicao"],
   ["moreirense","moreirensefc"],
   ["guimaraes","vitoriaguimaraes","vitoriasc"],
   ["alverca","fcalverca"],
   ["arouca","fcarouca"],
   ["boavista","boavistafc"],
   ["gilvicente","gilvicentefc"],
   ["estoril","estorilpraia"],
   ["rioave","rioavefc"],
   ["avs","avsfs"],
   ["psv","psveindhoven"],
   ["ajax","ajaxamsterdam"],
   ["manchesterunited","manutd"],
   ["manchestercity","mancity"],
   ["tottenham","tottenhamhotspur"],
   ["westham","westhamunited"],
   ["newcastle","newcastleunited"],
   ["wolves","wolverhampton"],
   ["nottinghamforest","nottmforest"],
   ["athleticbilbao","athleticclub"],
   ["atleticomadrid","atleticodemadrid"],
   ["realmadrid","realmadridcf"],
   ["barcelona","fcbarcelona"],
   ["intermilan","internazionale"],
   ["acmilan","milan"],
   ["napoli","sscnapoli"]
 ];

 for(const grupo of grupos){

   if(grupo.includes(n))
     return grupo;
 }

 return[n];
}

function equipasCorrespondem(a,b){

 const aa=aliasesEquipa(a);
 const bb=aliasesEquipa(b);

 for(const x of aa){

   for(const y of bb){

     if(
       x===y||
       x.includes(y)||
       y.includes(x)
     )
       return true;
   }
 }

 return false;
}

function encontrarPlantel(dados){

 const nomeAtual=equipaAtual.name;
 const idAtual=String(equipaAtual.id||"");

 /* 1 - ID direto */

 if(
   dados&&
   !Array.isArray(dados)&&
   dados[idAtual]
 ){

   const p=extrairPlantel(dados[idAtual]);

   if(p&&p.length)
     return p;
 }

 /* 2 - procurar todas as equipas */

 const entradas=[];

 function recolher(obj){

   if(!obj||typeof obj!=="object")
     return;

   const p=extrairPlantel(obj);

   if(p&&p.length)
     entradas.push(obj);

   if(Array.isArray(obj)){

     obj.forEach(recolher);

   }else{

     Object.values(obj).forEach(recolher);
   }
 }

 recolher(dados);

 /* 3 - correspondência por ID */

 for(const entrada of entradas){

   const ids=[
     entrada.id,
     entrada.idTeam,
     entrada.teamId
   ]
   .filter(Boolean)
   .map(String);

   if(ids.includes(idAtual)){

     const p=extrairPlantel(entrada);

     if(p&&p.length)
       return p;
   }
 }

 /* 4 - correspondência por nome */

 for(const entrada of entradas){

   const nomes=[
     entrada.name,
     entrada.strTeam,
     entrada.teamName,
     entrada.displayName,
     entrada.shortDisplayName
   ].filter(Boolean);

   for(const nome of nomes){

     if(equipasCorrespondem(nomeAtual,nome)){

       const p=extrairPlantel(entrada);

       if(p&&p.length)
         return p;
     }
   }
 }

 return null;
}

/* =========================
   IDADE
========================= */

function idadeJogador(p){

 const valor=p.age;

 /*
  TheSportsDB usa "age" como data
  de nascimento.
 */

 if(
   valor&&
   /^\d{4}-\d{2}-\d{2}/.test(String(valor))
 ){

   return calcularIdade(valor);
 }

 const nascimento=
   p.dateBorn||
   p.dateOfBirth||
   p.birthDate||
   "";

 if(nascimento)
   return calcularIdade(nascimento);

 if(
   valor&&
   /^\d+$/.test(String(valor))
 )
   return valor;

 return"-";
}

function calcularIdade(dataNascimento){

 const data=new Date(dataNascimento);

 if(isNaN(data.getTime()))
   return"-";

 const hoje=new Date();

 let idade=
   hoje.getFullYear()-
   data.getFullYear();

 const mes=
   hoje.getMonth()-
   data.getMonth();

 if(
   mes<0||
   (
     mes===0&&
     hoje.getDate()<data.getDate()
   )
 )
   idade--;

 return idade>=0?idade:"-";
}

/* =========================
   CARREGAR PLANTEL
========================= */

async function carregarPlantel(){

 try{

   const r=await fetch(
     "data/planteis.json?v="+Date.now()
   );

   if(!r.ok)
     throw new Error("Plantel");

   const dados=await r.json();

   let plantel=encontrarPlantel(dados);

   if(!plantel){

     document.getElementById("plantel").innerHTML=
       '<div class="empty">Plantel não disponível.</div>';

     return;
   }

   plantel=plantel.filter(p=>{

     const pos=String(
       p.position||
       p.strPosition||
       ""
     ).toLowerCase();

     return(
       !pos.includes("manager")&&
       !pos.includes("coach")&&
       !pos.includes("head coach")
     );
   });

   if(!plantel.length){

     document.getElementById("plantel").innerHTML=
       '<div class="empty">Plantel vazio.</div>';

     return;
   }

   document.getElementById("plantel").innerHTML=`

   <div class="plantel-grid">

   ${
     plantel.map((p,i)=>{

       const jogador={

         id:
           p.id||
           p.idPlayer||
           p.playerId||
           i,

         name:
           p.name||
           p.strPlayer||
           p.displayName||
           p.fullName||
           "Jogador",

         number:
           p.number||
           p.strNumber||
           p.jersey||
           p.jerseyNumber||
           "-",

         position:
           typeof p.position==="object"
           ?
           (
             p.position.displayName||
             p.position.name||
             "-"
           )
           :
           (
             p.position||
             p.strPosition||
             p.positionName||
             "-"
           ),

         age:idadeJogador(p),

         nationality:
           typeof p.nationality==="object"
           ?
           (
             p.nationality.displayName||
             p.nationality.name||
             "-"
           )
           :
           (
             p.nationality||
             p.strNationality||
             p.country||
             "-"
           ),

         photo:
           p.photo||
           p.strThumb||
           p.strCutout||
           p.headshot||
           p.image||
           ""
       };

       return`

       <div class="player"
       onclick='abrirJogador(${JSON.stringify(jogador)})'>

       ${
         jogador.photo

         ?

         `<img
         src="${esc(jogador.photo)}"
         onerror="this.style.display='none'">`

         :

         `<div style="
         width:80px;
         height:80px;
         border-radius:50%;
         background:#222;
         margin:auto auto 8px;
         display:flex;
         align-items:center;
         justify-content:center;
         font-size:30px">
         ⚽
         </div>`
       }

       <div class="player-name">
       ${esc(jogador.name)}
       </div>

       <div class="player-info">
       #${esc(jogador.number)}
       •
       ${esc(jogador.position)}
       </div>

       </div>
       `;

     }).join("")
   }

   </div>
   `;

 }catch(e){

   console.log("Erro plantel",e);

   document.getElementById("plantel").innerHTML=
     '<div class="empty">Não foi possível carregar o plantel.</div>';
 }
}

/* =========================
   JOGADOR
========================= */

function abrirJogador(p){

 document.getElementById("app").innerHTML=`

 <button class="back" id="voltarJogador">
 ← Voltar ao plantel
 </button>

 <div class="player-profile">

 ${
   p.photo

   ?

   `<img
   src="${esc(p.photo)}"
   onerror="this.style.display='none'">`

   :

   `<div style="
   width:150px;
   height:150px;
   border-radius:50%;
   background:#181818;
   border:3px solid #168cff;
   margin:auto;
   display:flex;
   align-items:center;
   justify-content:center;
   font-size:60px">
   ⚽
   </div>`
 }

 <h1>${esc(p.name)}</h1>

 <div class="position">
 ${esc(p.position)}
 </div>

 <div class="info-box">

 <div class="info-row">
 <span class="info-label">Número</span>
 <span class="info-value">#${esc(p.number)}</span>
 </div>

 <div class="info-row">
 <span class="info-label">Posição</span>
 <span class="info-value">${esc(p.position)}</span>
 </div>

 <div class="info-row">
 <span class="info-label">Idade</span>
 <span class="info-value">${esc(p.age)}</span>
 </div>

 <div class="info-row">
 <span class="info-label">Nacionalidade</span>
 <span class="info-value">${esc(p.nationality)}</span>
 </div>

 </div>

 </div>
 `;

 document.getElementById("voltarJogador").onclick=mostrarEquipa;
}

/* =========================
   CLASSIFICAÇÕES
========================= */

function encontrarListaClassificacao(obj){

 if(!obj)
   return null;

 /* Se já for uma lista */

 if(Array.isArray(obj)){

   const pareceTabela=obj.some(x=>
     x&&(
       x.team||
       x.stats||
       x.teamId||
       x.points!==undefined||
       x.wins!==undefined||
       x.losses!==undefined
     )
   );

   if(pareceTabela)
     return obj;

   for(const item of obj){

     const resultado=
       encontrarListaClassificacao(item);

     if(resultado)
       return resultado;
   }

   return null;
 }

 if(typeof obj!=="object")
   return null;

 /*
  ESPN:
  children
    standings
      entries
 */

 if(
   obj.entries&&
   Array.isArray(obj.entries)
 ){

   return obj.entries;
 }

 if(
   obj.standings&&
   typeof obj.standings==="object"
 ){

   const resultado=
     encontrarListaClassificacao(obj.standings);

   if(resultado)
     return resultado;
 }

 if(Array.isArray(obj.children)){

   for(const child of obj.children){

     const resultado=
       encontrarListaClassificacao(child);

     if(resultado)
       return resultado;
   }
 }

 /*
  Fallback para outros formatos
 */

 for(const chave of[
   "teams",
   "items",
   "rows",
   "groups"
 ]){

   if(obj[chave]){

     const resultado=
       encontrarListaClassificacao(obj[chave]);

     if(resultado)
       return resultado;
   }
 }

 return null;
}

/* =========================
   ESTATÍSTICAS
========================= */

function encontrarStat(e,numeros){

 if(!e)
   return"-";

 if(Array.isArray(e.stats)){

   for(const s of e.stats){

     const nome=String(
       s.name||
       s.shortDisplayName||
       s.abbreviation||
       ""
     ).toLowerCase().replace(/\s/g,"");

     if(
       numeros.some(n=>
         nome===n||
         nome.includes(n)
       )
     ){

       return(
         s.value!==undefined
         ?s.value
         :
         s.displayValue!==undefined
         ?s.displayValue
         :
         "-"
       );
     }
   }
 }

 for(const n of numeros){

   if(e[n]!==undefined)
     return e[n];
 }

 return"-";
}

function valorPontos(e){

 return encontrarStat(
   e,
   ["points","pts","pontos"]
 );
}

function valorJogos(e){

 return encontrarStat(
   e,
   ["gamesplayed","gp","played","jogos"]
 );
}

function valorVitorias(e){

 return encontrarStat(
   e,
   ["wins","w","vitorias"]
 );
}

function valorEmpates(e){

 return encontrarStat(
   e,
   ["ties","draws","draw","d","empates"]
 );
}

function valorDerrotas(e){

 return encontrarStat(
   e,
   ["losses","l","derrotas"]
 );
}

async function mostrarTabelas(){

 document.getElementById("navJogos").classList.remove("active");
 document.getElementById("navTabelas").classList.add("active");
 document.getElementById("navFav").classList.remove("active");

 document.getElementById("app").innerHTML=`

 <h2>📊 Tabelas</h2>

 <div class="filters">

 ${
 ligas.map(l=>`

 <button
 onclick="carregarTabelaUnica('${esc(l.nome)}')">

 ${esc(l.nome)}

 </button>

 `).join("")
 }

 </div>

 <div id="tabelas">

 <div class="empty">
 A carregar classificações...
 </div>

 </div>
 `;

 let html="";

 for(const liga of ligas){

   try{

     const ficheiro=
       liga.arquivo.replace(
         ".json",
         "-classificacao.json"
       );

     const r=await fetch(
       ficheiro+"?v="+Date.now()
     );

     if(!r.ok)
       continue;

     const d=await r.json();

     const entries=
       encontrarListaClassificacao(d);

     if(entries&&entries.length){

       html+=criarTabela(
         liga.nome,
         entries
       );
     }

   }catch(e){

     console.log(
       "Erro classificação",
       liga.nome,
       e
     );
   }
 }

 document.getElementById("tabelas").innerHTML=
   html||
   '<div class="empty">Tabelas indisponíveis.</div>';
}

async function carregarTabelaUnica(nome){

 const liga=ligas.find(
   x=>x.nome===nome
 );

 if(!liga)return;

 const div=document.getElementById("tabelas");

 if(!div)return;

 div.innerHTML=
   '<div class="empty">A carregar...</div>';

 try{

   const ficheiro=
     liga.arquivo.replace(
       ".json",
       "-classificacao.json"
     );

   const r=await fetch(
     ficheiro+"?v="+Date.now()
   );

   if(!r.ok)
     throw new Error("Tabela");

   const d=await r.json();

   const entries=
     encontrarListaClassificacao(d);

   if(!entries||!entries.length){

     div.innerHTML=
       '<div class="empty">Classificação indisponível.</div>';

     return;
   }

   div.innerHTML=
     criarTabela(
       liga.nome,
       entries
     );

 }catch(e){

   console.log(e);

   div.innerHTML=
     '<div class="empty">Erro ao carregar classificação.</div>';
 }
}

function criarTabela(nome,entries){

 return`

 <div class="card">

 <div class="league">
 ${esc(nome)}
 </div>

 <div class="table-wrap">

 <table>

 <tr>
 <th>#</th>
 <th>Equipa</th>
 <th>J</th>
 <th>V</th>
 <th>E</th>
 <th>D</th>
 <th>Pts</th>
 </tr>

 ${
 entries.map((e,i)=>{

   const t=e.team||e;

   const id=
     t.id||
     e.teamId||
     "";

   const nomeTabela=
     t.displayName||
     t.name||
     t.shortDisplayName||
     e.name||
     "Equipa";

   const logo=
     t.logo||
     t.logos?.[0]?.href||
     "";

   return`

   <tr>

   <td>${i+1}</td>

   <td
   class="team"
   onclick="abrirEquipaPorId(
   '${esc(id)}',
   '${esc(nomeTabela)}',
   '${esc(nome)}',
   '${esc(logo)}'
   )">

   ${
     logo
     ?
     `<img
     src="${esc(logo)}"
     style="
     width:22px;
     height:22px;
     object-fit:contain;
     vertical-align:middle;
     margin-right:5px">`
     :""
   }

   ${esc(nomeTabela)}

   </td>

   <td>${esc(valorJogos(e))}</td>
   <td>${esc(valorVitorias(e))}</td>
   <td>${esc(valorEmpates(e))}</td>
   <td>${esc(valorDerrotas(e))}</td>
   <td><b>${esc(valorPontos(e))}</b></td>

   </tr>
   `;

 }).join("")
 }

 </table>

 </div>

 </div>
 `;
}
