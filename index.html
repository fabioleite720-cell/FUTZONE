<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#03060B;
color:#FFF;
font-family:Arial,sans-serif
}

header{
position:sticky;
top:0;
z-index:20;
background:#09111C;
border-bottom:1px solid #1B2A3B;
padding:10px
}

.logo{font-size:23px;font-weight:900}
.logo span{color:#1683FF}
.sub{font-size:9px;color:#9DAABB;margin-top:1px}

main{
padding:8px 8px 75px;
max-width:720px;
margin:auto
}

h2{font-size:17px;margin:9px 0 7px}

.seletor-ligas{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
margin-bottom:8px
}

.liga-btn{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:8px;
padding:7px 3px;
color:#FFF;
font-size:10px;
font-weight:bold
}

.liga-btn.active{
background:#003B7A;
border-color:#1683FF
}

.liga-icon{
display:block;
font-size:16px;
margin-bottom:2px
}

.acoes-jogos{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
margin-bottom:8px
}

.janela-btn{
background:#09111C;
border:1px solid #1B2A3B;
color:#FFF;
border-radius:8px;
padding:8px 3px;
font-size:10px;
font-weight:900;
min-height:39px
}

.janela-btn.live{border-color:#FF4054}

.janela-btn:active{opacity:.7}

.dot{
display:inline-block;
width:7px;
height:7px;
background:#FF4054;
border-radius:50%;
margin-right:2px
}

.pesquisa{
width:100%;
background:#09111C;
border:1px solid #1B2A3B;
border-radius:8px;
color:#FFF;
padding:9px;
font-size:11px;
margin-bottom:8px;
outline:none
}

.pesquisa:focus{border-color:#1683FF}

.jogo{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:9px;
padding:8px;
margin-bottom:5px;
cursor:pointer
}

.jogo-top{
display:flex;
justify-content:space-between;
color:#9DAABB;
font-size:9px;
margin-bottom:5px
}

.equipas{
display:grid;
grid-template-columns:1fr 52px 1fr;
align-items:center;
gap:3px
}

.equipa{
text-align:center;
font-size:11px;
font-weight:bold
}

.team-click{
cursor:pointer
}

.team-click:active{opacity:.7}

.escudo{
width:27px;
height:27px;
object-fit:contain;
display:block;
margin:0 auto 3px
}

.resultado{
text-align:center;
font-size:16px;
font-weight:900
}

.estado-live{
color:#FF4054;
font-weight:900
}

.estado-final{color:#9DAABB}

.vazio,.erro,.carregando{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:8px;
padding:11px;
text-align:center;
color:#9DAABB;
font-size:11px
}

.erro{color:#FF8F8F}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:56px;
background:#09111C;
border-top:1px solid #1B2A3B;
display:flex;
z-index:30
}

.bottom button{
background:none;
border:0;
color:#9DAABB;
font-weight:bold;
width:33%;
font-size:11px
}

.bottom button.active{color:#1683FF}

.overlay{
position:fixed;
inset:0;
background:#03060B;
z-index:50;
overflow:auto
}

.detalhe-header{
position:sticky;
top:0;
background:#09111C;
border-bottom:1px solid #1B2A3B;
padding:7px;
z-index:5
}

.voltar{
background:#0D1724;
border:1px solid #243653;
color:#FFF;
border-radius:7px;
padding:6px 9px;
font-weight:bold;
font-size:11px
}

.detalhe{
max-width:720px;
margin:auto;
padding:7px 8px 25px
}

.jogo-grande{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:10px;
padding:12px 6px;
margin-bottom:7px
}

.jogo-grande .equipas{
grid-template-columns:1fr 70px 1fr
}

.jogo-grande .escudo{
width:45px;
height:45px
}

.jogo-grande .equipa{font-size:13px}

.bigscore{
text-align:center;
font-size:25px;
font-weight:900
}

.estado{
text-align:center;
color:#1683FF;
font-size:10px;
margin-top:3px
}

.fav-btn{
background:#0D1724;
border:1px solid #243653;
color:#FFF;
border-radius:7px;
padding:6px 10px;
font-size:12px;
font-weight:bold
}

.fav-btn.on{
border-color:#1683FF;
color:#1683FF
}

.detalhe-acoes{
display:flex;
justify-content:center;
gap:6px;
margin-top:7px
}

.secao{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:9px;
margin:7px 0;
padding:8px
}

.secao h3{
font-size:13px;
margin:0 0 6px
}

.evento{
display:flex;
gap:6px;
padding:6px 0;
border-bottom:1px solid #1B2A3B;
font-size:11px
}

.evento:last-child{border:0}

.minuto{
color:#1683FF;
font-weight:bold;
min-width:30px
}

.evento-icone{
width:20px;
text-align:center
}

.evento-info{flex:1}

.evento-equipa{
display:block;
color:#9DAABB;
font-size:9px;
margin-top:2px
}

.evento-grupo{
margin-bottom:8px
}

.evento-grupo-titulo{
font-size:10px;
font-weight:900;
padding:5px 0;
color:#1683FF
}

.stats-head,.stat-row{
display:grid;
grid-template-columns:1fr 80px 1fr;
text-align:center
}

.stats-head{
font-size:10px;
color:#9DAABB
}

.stat-row{
padding:6px 0;
border-top:1px solid #1B2A3B;
font-size:10px
}

.nome{
color:#9DAABB;
font-size:9px
}

.stat-home{
text-align:right;
font-weight:bold
}

.stat-away{
text-align:left;
font-weight:bold
}

.lista-jogadores{
display:grid;
grid-template-columns:1fr 1fr;
gap:4px
}

.jogador{
background:#0D1724;
border:1px solid #1B2A3B;
border-radius:6px;
padding:6px;
font-size:10px
}

.jogador b{
color:#1683FF;
margin-right:3px
}

.subtitulo{
color:#9DAABB;
font-size:9px;
margin:5px 0
}

.badge{
font-size:8px;
color:#1683FF;
border:1px solid #1683FF;
border-radius:4px;
padding:2px 4px
}

table{
width:100%;
border-collapse:collapse;
font-size:10px
}

th,td{
padding:6px 3px;
border-bottom:1px solid #1B2A3B;
text-align:center
}

th{color:#9DAABB}

.tabela-wrap{overflow-x:auto}

.tabela-wrap table{min-width:400px}

.team-cell{
text-align:left;
font-weight:bold;
cursor:pointer
}

.team-head{
text-align:center;
padding:9px
}

.team-head img{
width:65px;
height:65px;
object-fit:contain
}

.team-name{
font-size:18px;
font-weight:900;
margin-top:6px
}

.team-meta{
font-size:10px;
color:#9DAABB;
margin-top:3px
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
<div class="sub">FUTEBOL EM DIRETO</div>
</header>

<main id="app"></main>

<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[
{name:"Portugal",code:"por.1",icon:"🇵🇹"},
{name:"Inglaterra",code:"eng.1",icon:"🏴"},
{name:"Espanha",code:"esp.1",icon:"🇪🇸"},
{name:"Itália",code:"ita.1",icon:"🇮🇹"},
{name:"Alemanha",code:"ger.1",icon:"🇩🇪"},
{name:"França",code:"fra.1",icon:"🇫🇷"},
{name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},
{name:"Bélgica",code:"bel.1",icon:"🇧🇪"},
{name:"Champions",code:"uefa.champions",icon:"🏆"},
{name:"Europa",code:"uefa.europa",icon:"🏆"},
{name:"Conference",code:"uefa.europa.conf",icon:"🏆"}
];

let ligaAtual=ligas[0];
let jogosAtuais=[];
let carregandoJogos=false;

let favoritos=
JSON.parse(
localStorage.getItem("futzone_favoritos")||"[]"
);

let intervaloJogo=null;

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

function logo(u){

return u
?
`<img class="escudo"
src="${esc(u)}"
onerror="this.style.visibility='hidden'">`
:
"<div style='height:31px'></div>";

}

function nav(id){

["navJogos","navTabelas","navFav"]
.forEach(x=>
document.getElementById(x)
.classList.toggle(
"active",
x===id
)
);

}

function data8(d){

return d.getFullYear()+
String(d.getMonth()+1).padStart(2,"0")+
String(d.getDate()).padStart(2,"0");

}

function estado(ev){

const s=
ev?.status||
ev?.competitions?.[0]?.status||
{};

const t=s.type||{};

if(
t.state==="in"||
t.name==="STATUS_IN_PROGRESS"
){

return{
txt:
t.shortDetail||
t.detail||
t.displayClock||
"DIRETO",
live:true,
final:false
};

}

if(
t.state==="post"||
t.name==="STATUS_FINAL"
){

return{
txt:
t.shortDetail||
t.detail||
"FINAL",
live:false,
final:true
};

}

return{
txt:
t.shortDetail||
t.detail||
t.name||
"",
live:false,
final:false
};

}

function normalizar(ev,l){

const c=
ev.competitions?.[0]||{};

const cs=c.competitors||[];

const h=
cs.find(x=>x.homeAway==="home")||
cs[0]||{};

const a=
cs.find(x=>x.homeAway==="away")||
cs[1]||{};

return{

id:String(ev.id),

date:ev.date||"",

status:
ev.status||
c.status||
{},

home:{

nome:
h.team?.displayName||
h.team?.shortDisplayName||
"Casa",

logo:
h.team?.logo||
"",

score:
h.score??"-",

id:
h.team?.id||
""

},

away:{

nome:
a.team?.displayName||
a.team?.shortDisplayName||
"Fora",

logo:
a.team?.logo||
"",

score:
a.score??"-",

id:
a.team?.id||
""

},

estado:
estado(ev),

liga:l.name,

code:l.code

};

}

async function buscarEventos(l){

const hoje=new Date();

const ini=new Date(hoje);
const fim=new Date(hoje);

ini.setDate(
ini.getDate()-120
);

fim.setDate(
fim.getDate()+120
);

const urls=[

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`

];

for(const u of urls){

try{

const r=await fetch(u);

if(!r.ok)continue;

const d=await r.json();

if(
Array.isArray(d.events)&&
d.events.length
)
return d.events;

}catch(e){}

}

return[];

}

async function carregarJogos(){

if(carregandoJogos)
return;

carregandoJogos=true;

if(!jogosAtuais.length)
mostrarJogos();

let lista=[];

for(const l of ligas){

const evs=
await buscarEventos(l);

evs.forEach(e=>{
lista.push(
normalizar(e,l)
);
});

}

const mapa=new Map();

lista.forEach(j=>{
mapa.set(j.id,j);
});

jogosAtuais=
[...mapa.values()]
.sort(
(a,b)=>
new Date(a.date)-
new Date(b.date)
);

carregandoJogos=false;

mostrarJogos();

}

function botoesLigas(){

return`

<div class="seletor-ligas">

${ligas.map(l=>`

<button
class="liga-btn ${
l.code===ligaAtual.code
?"active":""
}"
onclick="selecionarLiga('${l.code}')">

<span class="liga-icon">
${l.icon}
</span>

${esc(l.name)}

</button>

`).join("")}

</div>

`;

}

function selecionarLiga(code){

ligaAtual=
ligas.find(
l=>l.code===code
)||
ligas[0];

mostrarJogos();

}

function dataLocal(d){

try{

return new Intl.DateTimeFormat(
"pt-PT",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
).format(new Date(d));

}catch(e){

return"";

}

}

function teamHtml(t,code){

return`

<div
class="equipa team-click"
onclick="
event.stopPropagation();
abrirEquipa(
'${esc(code)}',
'${esc(t.id||"")}',
'${esc(t.nome)}',
'${esc(t.logo)}'
);
">

${logo(t.logo)}

${esc(t.nome)}

</div>

`;

}

function cartao(j){

const estadoHtml=
j.estado.live
?
`<span class="estado-live">
🔴 ${esc(j.estado.txt)}
</span>`
:
j.estado.final
?
`<span class="estado-final">
${esc(j.estado.txt)}
</span>`
:
esc(dataLocal(j.date));

return`

<div
class="jogo"
onclick="
abrirJogo(
'${esc(j.id)}',
'${esc(j.code)}'
)">

<div class="jogo-top">

<span>
${esc(j.liga)}
</span>

<span>
${estadoHtml}
</span>

</div>

<div class="equipas">

${teamHtml(j.home,j.code)}

<div class="resultado">
${esc(j.home.score)}
-
${esc(j.away.score)}
</div>

${teamHtml(j.away,j.code)}

</div>

</div>

`;

}

function mostrarJogos(){

nav("navJogos");

const pesquisa=
document.getElementById("pesquisa")?.value
?.toLowerCase()||
"";

let l=
jogosAtuais.filter(j=>
j.liga===ligaAtual.name &&
!j.estado.final
);

if(pesquisa){

l=l.filter(j=>
(
j.home.nome+
" "+
j.away.nome
)
.toLowerCase()
.includes(pesquisa)
);

}

const totalLive=
jogosAtuais.filter(
j=>j.estado.live
).length;

app.innerHTML=`

<h2>⚽ Jogos</h2>

<div class="acoes-jogos">

<button
class="janela-btn live"
onclick="abrirJanelaJogos('live')">

<span class="dot"></span>
Ao Vivo
${totalLive?` (${totalLive})`:""}

</button>

<button
class="janela-btn"
onclick="abrirJanelaJogos('futuros')">

📅 Futuros

</button>

<button
class="janela-btn"
onclick="abrirJanelaJogos('realizados')">

✅ Resultados

</button>

<button
class="janela-btn"
onclick="carregarJogos()">

🔄 Atualizar

</button>

</div>

<input
id="pesquisa"
class="pesquisa"
placeholder="🔎 Procurar equipa..."
value="${esc(pesquisa)}"
oninput="filtrarJogos(this.value)"
>

${botoesLigas()}

<h2>${esc(ligaAtual.name)}</h2>

${
l.length
?
l.slice(0,10)
.map(cartao)
.join("")
:
carregandoJogos
?
'<div class="carregando">⏳ A carregar jogos...</div>'
:
'<div class="vazio">Não há jogos próximos encontrados.</div>'
}

`;

}

function filtrarJogos(){

const p=
document.getElementById("pesquisa");

if(!p)
return;

const valor=p.value.toLowerCase();

let l=
jogosAtuais.filter(j=>
j.liga===ligaAtual.name &&
!j.estado.final
);

if(valor){

l=l.filter(j=>
(
j.home.nome+
" "+
j.away.nome
)
.toLowerCase()
.includes(valor)
);

}

const h=
document.querySelector(
"main h2:nth-of-type(2)"
);

const cards=
document.querySelectorAll(
"main .jogo"
);

cards.forEach(x=>x.remove());

const titulo=
document.querySelector(
"main h2:nth-of-type(2)"
);

if(titulo){

titulo.insertAdjacentHTML(
"afterend",
l.length
?
l.slice(0,10)
.map(cartao)
.join("")
:
'<div class="vazio">Nenhuma equipa encontrada.</div>'
);

}

}

function botoesLigasJanela(tipo,selecionada){

return`

<div class="seletor-ligas">

<button
class="liga-btn ${
selecionada==="todas"
?"active":""
}"
onclick="
abrirJanelaJogos(
'${tipo}',
'todas'
)">

<span class="liga-icon">🌍</span>
Todas

</button>

${ligas.map(l=>`

<button
class="liga-btn ${
l.code===selecionada
?"active":""
}"
onclick="
abrirJanelaJogos(
'${tipo}',
'${l.code}'
)">

<span class="liga-icon">
${l.icon}
</span>

${esc(l.name)}

</button>

`).join("")}

</div>

`;

}

function abrirJanelaJogos(
tipo,
ligaCode="todas"
){

let lista=[];
let titulo="";

if(tipo==="live"){

lista=jogosAtuais.filter(
j=>j.estado.live
);

titulo="🔴 Ao Vivo";

}

if(tipo==="futuros"){

lista=
jogosAtuais
.filter(j=>
!j.estado.final &&
!j.estado.live
)
.sort(
(a,b)=>
new Date(a.date)-
new Date(b.date)
);

titulo="📅 Futuros";

}

if(tipo==="realizados"){

lista=
jogosAtuais
.filter(j=>j.estado.final)
.sort(
(a,b)=>
new Date(b.date)-
new Date(a.date)
);

titulo="✅ Resultados";

}

if(ligaCode!=="todas"){

lista=
lista.filter(
j=>j.code===ligaCode
);

}

const nomeLiga=
ligaCode==="todas"
?
"Todas as ligas"
:
(
ligas.find(
x=>x.code===ligaCode
)?.name||
""
);

const old=
document.querySelector(
".janela-lista-overlay"
);

if(old)
old.remove();

const o=
document.createElement("div");

o.className=
"overlay janela-lista-overlay";

o.innerHTML=`

<div class="detalhe-header">

<button
class="voltar"
onclick="
this.closest('.overlay').remove()
">

← Voltar

</button>

</div>

<div
class="detalhe janela-jogos">

<div class="janela-titulo">

<h2>${titulo}</h2>

</div>

${botoesLigasJanela(
tipo,
ligaCode
)}

<div class="contador">
${lista.length} jogo(s) • ${esc(nomeLiga)}
</div>

${
lista.length
?
lista.map(cartao).join("")
:
'<div class="vazio">Não há jogos nesta categoria para esta liga.</div>'
}

</div>

`;

document.body.appendChild(o);

}

function isFavorito(id){

return favoritos.includes(
String(id)
);

}

function alternarFavorito(id){

id=String(id);

if(isFavorito(id)){

favoritos=
favoritos.filter(
x=>x!==id
);

}else{

favoritos.push(id);

}

localStorage.setItem(
"futzone_favoritos",
JSON.stringify(favoritos)
);

}

function txt(v){

return typeof v==="object"
?
(
v?.displayValue??
v?.value??
v?.text??
""
)
:
String(v??"");

}
