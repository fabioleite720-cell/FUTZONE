<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTZONE">
<meta name="description" content="FUTZONE — Futebol em direto">

<title>FUTZONE — Futebol em Direto</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#03060B;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:82px;
}

button{
  font:inherit;
}

button,a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #172331;
  padding:14px 14px 10px;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:29px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
  color:#fff;
}

.logo span{
  color:#1683FF;
}

.subtitle{
  margin-top:4px;
  font-size:10px;
  letter-spacing:1.8px;
  font-weight:800;
  color:#9DAABB;
}

.sportSwitch{
  display:flex;
  background:#09111C;
  border:1px solid #1B2A3B;
  border-radius:13px;
  padding:3px;
}

.sportSwitch button{
  border:0;
  border-radius:9px;
  background:transparent;
  color:#9DAABB;
  padding:8px 10px;
  font-weight:800;
  font-size:12px;
}

.sportSwitch button.active{
  background:#0057B8;
  color:#fff;
}

.liveGlobal{
  margin:12px 12px 0;
  width:calc(100% - 24px);
  border:1px solid #FF4054;
  background:linear-gradient(135deg,#42121B,#17090D);
  color:#fff;
  border-radius:14px;
  min-height:48px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.liveDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#FF4054;
  box-shadow:0 0 12px #FF4054;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.75)}
}

.content{
  padding:12px;
}

.sectionTitle{
  font-size:17px;
  font-weight:900;
  margin:10px 2px;
}

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 1px 8px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.leagueChip{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#AEBACA;
  padding:9px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.leagueChip.active{
  background:#0057B8;
  border-color:#1683FF;
  color:#fff;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 1px 10px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#0D1724;
  color:#AEBACA;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.filterBtn.active{
  color:#fff;
  background:#003B7A;
  border-color:#1683FF;
}

.searchBox{
  position:relative;
  margin:4px 0 12px;
}

.searchBox input{
  width:100%;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#fff;
  border-radius:13px;
  padding:12px 13px 12px 39px;
  outline:none;
}

.searchBox input:focus{
  border-color:#1683FF;
}

.searchIcon{
  position:absolute;
  left:13px;
  top:10px;
  color:#728197;
}

.games{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.gameCard{
  background:linear-gradient(145deg,#0D1724,#09111C);
  border:1px solid #172638;
  border-radius:16px;
  padding:11px;
  cursor:pointer;
  transition:.15s;
}

.gameCard:active{
  transform:scale(.985);
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.gameLeague{
  color:#8EA0B6;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.status{
  font-size:10px;
  font-weight:900;
  padding:4px 7px;
  border-radius:7px;
  background:#182536;
  color:#AEBACA;
  white-space:nowrap;
}

.status.live{
  color:#fff;
  background:#9C1E2F;
}

.status.finished{
  color:#CBD5E1;
  background:#182536;
}

.teams{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  min-width:0;
}

.team img{
  width:40px;
  height:40px;
  object-fit:contain;
  margin-bottom:5px;
}

.teamName{
  font-size:12px;
  font-weight:800;
  line-height:1.15;
  max-width:105px;
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.score small{
  display:block;
  color:#738198;
  font-size:9px;
  margin-top:4px;
}

.favoriteBtn{
  border:0;
  background:transparent;
  color:#66768B;
  font-size:21px;
  line-height:1;
  padding:3px;
}

.favoriteBtn.active{
  color:#FFD43B;
}

.empty{
  text-align:center;
  padding:35px 15px;
  border:1px dashed #25364A;
  border-radius:15px;
  color:#8392A7;
  background:#08101A;
}

.loading{
  text-align:center;
  padding:30px;
  color:#8796AA;
}

.errorBox{
  padding:15px;
  border-radius:14px;
  border:1px solid #54212A;
  background:#180B0E;
  color:#FF9BA6;
  font-size:13px;
  line-height:1.45;
}

.bottomNav{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:rgba(5,10,16,.97);
  border-top:1px solid #1A2838;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(15px);
}

.navBtn{
  border:0;
  background:transparent;
  color:#718198;
  padding:7px 3px;
  font-size:11px;
  font-weight:800;
  border-radius:11px;
}

.navIcon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.navBtn.active{
  color:#fff;
  background:#003B7A;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* TABELAS */

.tableWrap{
  overflow-x:auto;
  border:1px solid #172638;
  border-radius:15px;
  background:#09111C;
}

.standings{
  width:100%;
  border-collapse:collapse;
  min-width:420px;
}

.standings th{
  color:#708097;
  font-size:10px;
  text-transform:uppercase;
  padding:10px 6px;
  text-align:center;
  border-bottom:1px solid #1A293A;
}

.standings th:nth-child(2){
  text-align:left;
}

.standings td{
  padding:9px 6px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  border-bottom:1px solid #111F2E;
}

.standings td:nth-child(2){
  text-align:left;
}

.position{
  width:28px;
  color:#8291A6;
}

.clubCell{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:160px;
  cursor:pointer;
}

.clubCell img{
  width:25px;
  height:25px;
  object-fit:contain;
}

.clubCell strong{
  font-size:12px;
}

.pts{
  color:#fff;
  font-size:13px !important;
}

.zoneChampions{
  border-left:3px solid #1683FF;
}

.zoneEuropa{
  border-left:3px solid #FFD43B;
}

.zoneDown{
  border-left:3px solid #FF4054;
}

/* DETALHE */

.detailOverlay{
  position:fixed;
  z-index:100;
  inset:0;
  background:#03060B;
  overflow-y:auto;
  display:none;
}

.detailOverlay.open{
  display:block;
}

.detailHeader{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:rgba(3,6,11,.96);
  border-bottom:1px solid #172638;
}

.backBtn{
  border:0;
  background:#0D1724;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:20px;
}

.detailTitle{
  font-weight:900;
  font-size:15px;
}

.detailBody{
  padding:13px;
  max-width:760px;
  margin:auto;
}

.matchHero{
  background:linear-gradient(145deg,#0D1724,#09111C);
  border:1px solid #1B2A3B;
  border-radius:18px;
  padding:18px 12px;
}

.matchCompetition{
  text-align:center;
  color:#8190A5;
  font-size:11px;
  font-weight:800;
  margin-bottom:14px;
}

.matchTeams{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:7px;
}

.heroTeam{
  text-align:center;
  cursor:pointer;
}

.heroTeam img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.heroTeamName{
  font-size:14px;
  font-weight:900;
  margin-top:7px;
}

.heroScore{
  text-align:center;
  font-size:29px;
  font-weight:900;
}

.heroScore small{
  display:block;
  font-size:10px;
  color:#7C8BA0;
  margin-top:4px;
}

.detailStatus{
  text-align:center;
  margin-top:13px;
  font-weight:900;
  font-size:12px;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin:12px 0;
}

.tabBtn{
  flex:0 0 auto;
  border:1px solid #1B2A3B;
  background:#09111C;
  color:#8392A6;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  font-weight:900;
}

.tabBtn.active{
  background:#0057B8;
  color:#fff;
  border-color:#1683FF;
}

.detailSection{
  background:#09111C;
  border:1px solid #172638;
  border-radius:15px;
  margin-bottom:10px;
  overflow:hidden;
}

.detailSectionTitle{
  padding:12px;
  font-size:13px;
  font-weight:900;
  border-bottom:1px solid #172638;
}

.eventRow{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:8px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #101D2A;
  font-size:12px;
}

.eventMinute{
  color:#8290A3;
  font-weight:900;
}

.eventCenter{
  text-align:center;
  font-weight:800;
}

.eventIcon{
  text-align:center;
  font-size:18px;
}

.statRow{
  display:grid;
  grid-template-columns:70px 1fr 70px;
  gap:7px;
  align-items:center;
  padding:9px 12px;
}

.statVal{
  font-weight:900;
  font-size:12px;
  text-align:center;
}

.statLabel{
  text-align:center;
  color:#8997A9;
  font-size:10px;
  font-weight:800;
}

.statBar{
  height:5px;
  background:#1A2939;
  border-radius:999px;
  overflow:hidden;
}

.statBar i{
  display:block;
  height:100%;
  background:#1683FF;
  border-radius:999px;
}

/* CAMPO */

.pitch{
  position:relative;
  margin:12px auto;
  width:min(100%,430px);
  aspect-ratio:0.68;
  border:2px solid rgba(255,255,255,.65);
  border-radius:8px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0 14%,
      transparent 14% 28%,
      rgba(255,255,255,.025) 28% 42%,
      transparent 42% 56%,
      rgba(255,255,255,.025) 56% 70%,
      transparent 70% 84%,
      rgba(255,255,255,.025) 84% 100%
    ),
    #146B42;
}

.pitch:before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:29%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.65);
  border-radius:50%;
}

.pitch:after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  border-top:2px solid rgba(255,255,255,.65);
}

.penalty{
  position:absolute;
  left:50%;
  width:48%;
  height:15%;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.65);
}

.penalty.top{
  top:-1px;
  border-top:0;
}

.penalty.bottom{
  bottom:-1px;
  border-bottom:0;
}

.goalArea{
  position:absolute;
  left:50%;
  width:22%;
  height:6%;
  transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.65);
}

.goalArea.top{
  top:-1px;
  border-top:0;
}

.goalArea.bottom{
  bottom:-1px;
  border-bottom:0;
}

.playerDot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0057B8;
  border:2px solid #fff;
  box-shadow:0 2px 7px rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:2;
}

.playerDot span{
  font-size:14px;
  font-weight:900;
}

.playerDot small{
  display:block;
  position:absolute;
  top:42px;
  width:95px;
  color:#fff;
  text-shadow:0 1px 3px #000;
  text-align:center;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

.pitchLegend{
  text-align:center;
  color:#8291A5;
  font-size:10px;
  margin-bottom:12px;
}

/* EQUIPA */

.teamHero{
  display:flex;
  align-items:center;
  gap:13px;
  background:#09111C;
  border:1px solid #172638;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.teamHero img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.teamHero h2{
  margin:0 0 4px;
  font-size:19px;
}

.teamHero p{
  margin:0;
  color:#8190A4;
  font-size:11px;
}

/* LIVE */

.liveCard{
  border-color:#76202D;
}

.liveScore{
  color:#FF6878;
}

/* RESPONSIVO */

@media(max-width:390px){
  .logo{font-size:25px}
  .teams{grid-template-columns:1fr 50px 1fr}
  .team img{width:35px;height:35px}
  .playerDot{width:39px;height:39px}
  .playerDot small{top:37px;font-size:7px}
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(15px);
  background:#152334;
  border:1px solid #2A3D55;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="headerTop">
    <div>
      <div class="logo">FUT<span>ZONE</span></div>
      <div class="subtitle">FUTEBOL EM DIRETO</div>
    </div>

    <div class="sportSwitch">
      <button id="btnFutebol" class="active" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
      <button id="btnFutsal" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
    </div>
  </div>
</header>

<button class="liveGlobal" onclick="abrirLiveGlobal()">
  <span class="liveDot"></span>
  <span id="liveGlobalText">AO VIVO — TODOS OS CAMPEONATOS</span>
</button>

<main class="content">

  <!-- JOGOS -->
  <section id="viewJogos" class="view active">

    <div class="sectionTitle">Competições</div>

    <div class="leagues" id="leagueList"></div>

    <div class="filters">
      <button class="filterBtn active" data-filter="todos" onclick="alterarFiltro('todos',this)">Todos</button>
      <button class="filterBtn" data-filter="live" onclick="alterarFiltro('live',this)">🔴 Ao vivo</button>
      <button class="filterBtn" data-filter="upcoming" onclick="alterarFiltro('upcoming',this)">Próximos</button>
      <button class="filterBtn" data-filter="finished" onclick="alterarFiltro('finished',this)">Resultados</button>
    </div>

    <div class="searchBox">
      <span class="searchIcon">⌕</span>
      <input id="searchInput" type="search" placeholder="Procurar equipa..." oninput="renderJogos()">
    </div>

    <div id="games" class="games">
      <div class="loading">A carregar jogos...</div>
    </div>

  </section>

  <!-- TABELAS -->
  <section id="viewTabelas" class="view">

    <div class="sectionTitle">Classificações</div>

    <div class="leagues" id="tableLeagueList"></div>

    <div id="standingsContainer">
      <div class="loading">A carregar classificação...</div>
    </div>

  </section>

  <!-- FAVORITOS -->
  <section id="viewFavoritos" class="view">

    <div class="sectionTitle">Favoritos</div>

    <div class="filters">
      <button class="filterBtn active" id="favJogosBtn" onclick="mostrarFavTipo('jogos',this)">⚽ Jogos</button>
      <button class="filterBtn" onclick="mostrarFavTipo('equipas',this)">🛡️ Equipas</button>
    </div>

    <div id="favoritesContainer"></div>

  </section>

</main>

<nav class="bottomNav">

  <button class="navBtn active" id="navJogos" onclick="mostrarVista('jogos')">
    <span class="navIcon">⚽</span>
    Jogos
  </button>

  <button class="navBtn" id="navTabelas" onclick="mostrarVista('tabelas')">
    <span class="navIcon">📊</span>
    Tabelas
  </button>

  <button class="navBtn" id="navFav" onclick="mostrarVista('favoritos')">
    <span class="navIcon">⭐</span>
    Favoritos
  </button>

</nav>

</div>

<!-- DETALHE DO JOGO -->

<div id="detailOverlay" class="detailOverlay">

  <div class="detailHeader">
    <button class="backBtn" onclick="fecharDetalhe()">‹</button>
    <div class="detailTitle" id="detailHeaderTitle">Detalhe do jogo</div>
  </div>

  <div class="detailBody" id="detailBody"></div>

</div>

<!-- DETALHE DA EQUIPA -->

<div id="teamOverlay" class="detailOverlay">

  <div class="detailHeader">
    <button class="backBtn" onclick="fecharEquipa()">‹</button>
    <div class="detailTitle" id="teamHeaderTitle">Equipa</div>
  </div>

  <div class="detailBody" id="teamBody"></div>

</div>

<!-- LIVE GLOBAL -->

<div id="liveOverlay" class="detailOverlay">

  <div class="detailHeader">
    <button class="backBtn" onclick="fecharLiveGlobal()">‹</button>
    <div class="detailTitle">🔴 Jogos ao vivo</div>
  </div>

  <div class="detailBody" id="liveBody"></div>

</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   FUTZONE
   CONFIGURAÇÃO
   ========================================================= */

const API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const API_CORE = "https://site.api.espn.com/apis/v2/sports/soccer/";

const LIGAS = [
  {

    curto:"🇵🇹 Liga Portugal"
  },
  {
    id:"por.2",
    nome:"Liga Portugal 2",
    curto:"🇵🇹 Liga 2"
  },
  {
    id:"por.3",
    nome:"Liga 3",
    curto:"🇵🇹 Liga 3"
  },
  {
    id:"por.w.1",
    nome:"Liga BPI Feminina",
    curto:"🇵🇹 Liga BPI"
  },
  {
    id:"eng.1",
    nome:"Premier League",
    curto:"🏴 Premier League"
  },
  {
    id:"eng.2",

    curto:"🏴 Championship"
  },
  {
    id:"esp.1",
    nome:"LaLiga",
    curto:"🇪🇸 LaLiga"
  },

function lerStorage(chave,valorPadrao){

  try{
    const valor = localStorage.getItem(chave);

    if(!valor) return valorPadrao;

    const parsed = JSON.parse(valor);

    return parsed;
  }catch(e){
    return valorPadrao;
  }
}

function guardarStorage(chave,valor){

  try{
    localStorage.setItem(chave,JSON.stringify(valor));
  }catch(e){}
}

/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function escapeHTML(valor){

  if(valor===undefined || valor===null) return "";

  return String(valor)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function nomeLiga(id){

  const liga = LIGAS.find(x=>x.id===id);

  return liga ? liga.nome : id;
}

function logoEquipa(team){

  if(!team) return "";

  return team.logo ||
         team.logos?.[0]?.href ||
         team.logo?.href ||
         "";
}

function nomeEquipa(team){

  if(!team) return "Equipa";

  return team.displayName ||
         team.shortDisplayName ||
         team.name ||
         team.team?.displayName ||
         "Equipa";
}

function idEquipa(team){

  if(!team) return "";

  return String(
    team.id ||
    team.team?.id ||
    ""
  );
}

function obterCompetidor(evento,indice){

  if(!evento?.competitions?.[0]?.competitors) return null;

  return evento.competitions[0].competitors[indice] || null;
}

function formatoData(data){

  if(!data) return "";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  });
}

function formatoHora(data){

  if(!data) return "";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function eventoEmDireto(evento){

  const status = evento?.status;

  const tipo = status?.type;

  const state = String(
    tipo?.state ||
    status?.type?.state ||
    ""
  ).toLowerCase();

  const name = String(
    tipo?.name ||
    ""
  ).toLowerCase();

  const detail = String(
    tipo?.detail ||
    ""
  ).toLowerCase();

  if(state==="in") return true;

  if(
    name.includes("progress") ||
    name.includes("live") ||
    detail.includes("live") ||
    detail.includes("ao vivo")
  ) return true;

  const clock = status?.displayClock;

  if(clock && !["post","final","completed"].includes(state)){
    return true;
  }

  return false;
}

function eventoTerminado(evento){

  const state = String(
    evento?.status?.type?.state ||
    ""
  ).toLowerCase();

  const name = String(
    evento?.status?.type?.name ||
    ""
  ).toLowerCase();

  return (
    state==="post" ||
    state==="final" ||
    name==="final" ||
    name==="post"
  );
}

function eventoAdiado(evento){

  const nome = String(
    evento?.status?.type?.name ||
    evento?.status?.type?.detail ||
    ""
  ).toLowerCase();

  return (
    nome.includes("postpon") ||
    nome.includes("cancel") ||
    nome.includes("adiad")
  );
}

function eventoFuturo(evento){

  return !eventoEmDireto(evento) &&
         !eventoTerminado(evento);
}

/*
 * Tentamos primeiro o scoreboard normal.
 * Se não houver jogos, fazemos várias consultas por data.
 * Isto é importante para apanhar:
 * - jogos já realizados
 * - jogos de hoje
 * - próximos jogos
 */

async function fetchJSON(url){

  const resposta = await fetch(
    url,
    {
      cache:"no-store"
    }
  );

  if(!resposta.ok){
    throw new Error(
      "HTTP " + resposta.status
    );
  }

  return await resposta.json();
}

async function obterScoreboardLiga(ligaId){

  const resultados = [];
  const ids = new Set();

  async function buscar(url){

    try{

      const data = await fetchJSON(url);

      const events = Array.isArray(data?.events)
        ? data.events
        : [];

      events.forEach(evento=>{

        if(!evento?.id) return;

        if(!ids.has(String(evento.id))){

          ids.add(String(evento.id));

          resultados.push({
            ...evento,
            __ligaId:ligaId
          });
        }

      });

    }catch(e){
      console.warn("FUTZONE scoreboard:",url,e);
    }
  }

  /*
   * Primeiro pedido normal
   */
  await buscar(
    API +
    encodeURIComponent(ligaId) +
    "/scoreboard?limit=100"
  );

  /*
   * Depois pesquisamos uma janela de datas.
   * O ESPN aceita YYYYMMDD.
   */
  const agora = new Date();

  for(let offset=-7;offset<=14;offset++){

    const d = new Date(agora);

    d.setDate(
      d.getDate()+offset
    );

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    const data = `${y}${m}${day}`;

    await buscar(
      API +
      encodeURIComponent(ligaId) +
      "/scoreboard?dates=" +
      data +
      "&limit=100"
    );

  }

  return resultados;
}

async function carregarJogos(){

  const container =
    document.getElementById("games");

  if(!container) return;

  container.innerHTML =
    `<div class="loading">A carregar jogos...</div>`;

  if(desporto!=="futebol") return;

  try{

    const eventos =
      await obterScoreboardLiga(ligaAtual);

    jogosFutebol =
      eventos.sort(
        ordenarEventos
      );

    if(!jogosFutebol.length){

      const fallback =
        FALLBACK[ligaAtual] || [];

      jogosFutebol =
        fallback.slice();

    }

    renderJogos();

  }catch(e){

    console.error(e);

    container.innerHTML = `
      <div class="errorBox">
        Não foi possível carregar os jogos desta competição neste momento.
        <br><br>
        Tenta atualizar novamente dentro de alguns segundos.
      </div>
    `;
  }
}

function ordenarEventos(a,b){

  const da =
    new Date(
      a?.date ||
      a?.competitions?.[0]?.date ||
      0
    ).getTime();

  const db =
    new Date(
      b?.date ||
      b?.competitions?.[0]?.date ||
      0
    ).getTime();

  /*
   * Ao vivo primeiro.
   */
  const la = eventoEmDireto(a);
  const lb = eventoEmDireto(b);

  if(la && !lb) return -1;
  if(!la && lb) return 1;

  return da-db;
}

/*

 * A área Tabelas usa a mesma lista LIGAS da aplicação.

async function obterStandings(ligaId){

  const urls=[

    API_CORE+
    "leagues/"+
    encodeURIComponent(ligaId)+
    "/standings",

    API+
    encodeURIComponent(ligaId)+
    "/standings"

  ];

  for(const url of urls){

    try{

      const data=await fetchJSON(url);

      const grupos=extrairGruposStandings(data);

      if(grupos.length){

        return{
          data,
          grupos
        };
      }

    }catch(e){

      console.warn(
        "FUTZONE standings:",
        url,
        e
      );
    }
  }

  return{
    data:null,
    grupos:[]
  };
}

function extrairGruposStandings(data){

  const encontrados=[];

  function adicionarGrupo(nome,entries){

    if(
      !Array.isArray(entries)||
      !entries.length
    )return;

    encontrados.push({
      nome:nome||"Classificação",
      entries
    });
  }

  if(Array.isArray(data?.children)){

    data.children.forEach(child=>{

      adicionarGrupo(
        child?.name||
        child?.shortName||
        child?.abbreviation,
        child?.standings?.entries
      );

      if(
        !child?.standings?.entries&&
        Array.isArray(child?.standings)
      ){

        child.standings.forEach(st=>{
          adicionarGrupo(
            st?.name,
            st?.entries
          );
        });
      }

    });
  }

  if(Array.isArray(data?.standings)){

    data.standings.forEach(st=>{

      if(Array.isArray(st?.entries)){

        adicionarGrupo(
          st?.name,
          st.entries
        );

      }

    });
  }

  if(Array.isArray(data?.entries)){

    adicionarGrupo(
      "Classificação",
      data.entries
    );
  }

  if(Array.isArray(data?.groups)){

    data.groups.forEach(group=>{

      adicionarGrupo(
        group?.name,
        group?.standings?.entries||
        group?.entries
      );

    });
  }

  return encontrados;
}

function extrairValorStat(entry,nome,alternativas=[]){

  const stats=
    Array.isArray(entry?.stats)
      ? entry.stats
      : [];

  const nomes=[
    nome,
    ...alternativas
  ]
  .filter(Boolean)
  .map(x=>String(x).toLowerCase());

  const stat=stats.find(s=>
    nomes.includes(
      String(
        s?.name||
        s?.abbreviation||
        s?.displayName||
        ""
      ).toLowerCase()
    )
  );

  if(!stat)return"";

  return(
    stat.value??
    stat.displayValue??
    ""
  );
}

function obterEquipaStanding(entry){

/*
 * Determina automaticamente os valores J/V/E/D/DG/PTS.
 * Isto torna o parser mais tolerante às diferentes
 * estruturas devolvidas pela API.
 */
function valorStanding(entry,nomes){

  const stats=
    Array.isArray(entry?.stats)
      ? entry.stats
      : [];

  for(const nome of nomes){

    const alvo=stats.find(s=>
      String(
        s?.name||
        s?.abbreviation||
        s?.displayName||
        ""
      ).toLowerCase()===String(nome).toLowerCase()
    );

    if(alvo){

      return(
        alvo.displayValue??
        alvo.value??
        ""
      );
    }
  }

  return "";
}

function renderTabelaGrupo(grupo){

  const entries=
    Array.isArray(grupo.entries)
      ? grupo.entries
      : [];

  entries.sort((a,b)=>{

    const ra=Number(
      a?.position||
      valorStanding(a,[
        "rank",
        "position"
      ])||
      999
    );

    const rb=Number(
      b?.position||
      valorStanding(b,[
        "rank",
        "position"
      ])||
      999
    );

    return ra-rb;
  });

  return`

    <div class="sectionTitle" style="font-size:14px">
      ${escapeHTML(grupo.nome)}
    </div>

    <div class="tableWrap">

      <table class="standings">

        <thead>
          <tr>
            <th>#</th>
            <th>Equipa</th>
            <th>J</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>DG</th>
            <th>Pts</th>
          </tr>
        </thead>

        <tbody>

          ${
            entries.map((entry,index)=>{

              const team=
                obterEquipaStanding(entry);

              const pos=
                entry?.position||
                valorStanding(entry,[
                  "rank",
                  "position"
                ])||
                index+1;

              const jogos=
                valorStanding(entry,[
                  "gamesPlayed",
                  "gp",
                  "games",
                  "played"
                ]);

              const vitorias=
                valorStanding(entry,[
                  "wins",
                  "win",
                  "w"
                ]);

              const empates=
                valorStanding(entry,[
                  "ties",
                  "draws",
                  "draw",
                  "t"
                ]);

              const derrotas=
                valorStanding(entry,[
                  "losses",
                  "loss",
                  "l"
                ]);

              const gd=
                valorStanding(entry,[
                  "pointDifferential",
                  "goalDifference",
                  "differential",
                  "gd"
                ]);

              const pontos=
                valorStanding(entry,[
                  "points",
                  "pts",
                  "p"
                ]);

              const teamId=idEquipa(team);
              const logo=logoEquipa(team);

              return`

                <tr>

                  <td class="position">
                    ${escapeHTML(pos)}
                  </td>

                  <td>

                    <div
                      class="clubCell"
                      onclick="
                        event.stopPropagation();
                        abrirEquipa(
                          '${escapeAttr(teamId)}',
                          '${escapeAttr(nomeEquipa(team))}',
                          '${escapeAttr(logo)}'
                        )
                      "
                    >

                      ${
                        logo
                          ? `<img
                              src="${escapeAttr(logo)}"
                              alt=""
                            >`
                          : `<div
                              style="
                                width:25px;
                                height:25px
                              "
                            ></div>`
                      }

                      <strong>
                        ${escapeHTML(nomeEquipa(team))}
                      </strong>

                    </div>

                  </td>

                  <td>${escapeHTML(jogos)}</td>
                  <td>${escapeHTML(vitorias)}</td>
                  <td>${escapeHTML(empates)}</td>
                  <td>${escapeHTML(derrotas)}</td>
                  <td>${escapeHTML(gd)}</td>
                  <td class="pts">
                    ${escapeHTML(pontos)}
                  </td>

                </tr>

              `;

            }).join("")
          }

        </tbody>

      </table>

    </div>
  `;
}

/*
 * Mostra a classificação da liga selecionada.
 *
 * O seletor de ligas é criado a partir de LIGAS,
 * portanto todas as ligas da aplicação ficam disponíveis.
 */
async function carregarClassificacao(){

  const container=
    document.getElementById("standingsContainer");

  if(!container)return;

  container.innerHTML=`
    <div class="loading">
      A carregar classificação de
      ${escapeHTML(nomeLiga(ligaAtual))}...
    </div>
  `;

  try{

    const resultado=
      await obterStandings(ligaAtual);

    tabelaAtual=resultado.grupos||[];

    if(!tabelaAtual.length){

      /*
       * Segunda tentativa específica.
       * Algumas competições podem disponibilizar a tabela
       * num endpoint de scoreboard/season diferente.
       */
      const alternativa=
        await tentarClassificacaoAlternativa(ligaAtual);

      if(alternativa.length){

        tabelaAtual=alternativa;

      }else{

        container.innerHTML=`

          <div class="empty">

            <div style="
              font-size:30px;
              margin-bottom:10px
            ">
              📊
            </div>

            <strong>
              ${escapeHTML(nomeLiga(ligaAtual))}
            </strong>

            <br><br>

            A classificação desta competição
            não está disponível neste momento
            através da fonte de dados.

          </div>

        `;

        return;
      }
    }

    container.innerHTML=
      tabelaAtual
        .map(renderTabelaGrupo)
        .join("");

  }catch(e){

    console.error(e);

    container.innerHTML=`
      <div class="errorBox">
        Não foi possível carregar a classificação.
        <br><br>
        Tenta novamente dentro de alguns segundos.
      </div>
    `;
  }
}

/*
 * Tentativa adicional de classificação.
 */
async function tentarClassificacaoAlternativa(ligaId){

  const urls=[

    API+
    encodeURIComponent(ligaId)+
    "/standings?limit=100",

    API_CORE+
    "leagues/"+
    encodeURIComponent(ligaId)+
    "/standings?limit=100"

  ];

  for(const url of urls){

    try{

      const data=await fetchJSON(url);

      const grupos=extrairGruposStandings(data);

      if(grupos.length)
        return grupos;

    }catch(e){
      console.warn(
        "Classificação alternativa:",
        e
      );
    }
  }

  return[];
}

/* =========================================================

   ========================================================= */

async function carregarLiveGlobal(){

  const agora=Date.now();

  if(
    liveGlobalTimestamp&&
    agora-liveGlobalTimestamp<30000
  ){
    return liveGlobalCache;
  }

  const mapa=new Map();

  /*
   * Todas as ligas da aplicação.
   * O botão AO VIVO deixa de estar preso à liga atual.
   */
  const promessas=LIGAS.map(async liga=>{

    try{

      const eventos=
        await obterScoreboardLiga(liga.id);

      eventos
        .filter(eventoEmDireto)
        .forEach(evento=>{

          const id=String(evento.id);

          if(!mapa.has(id)){

            mapa.set(id,{
              ...evento,
              __ligaId:liga.id
            });

          }

        });

    }catch(e){

      console.warn(
        "Live global:",
        liga.id,
        e
      );

    }

  });

  await Promise.all(promessas);

  liveGlobalCache=
    Array.from(mapa.values())
      .sort(ordenarEventos);

  liveGlobalTimestamp=Date.now();

  return liveGlobalCache;
}

  const body=

  if(!overlay||!body)return;

  body.innerHTML=`
    <div class="loading">
      🔴 A procurar jogos ao vivo
      em todos os campeonatos...

      jogos.length
        ? `AO VIVO — ${jogos.length} JOGO${jogos.length===1?"":"S"}`

            margin-bottom:10px
          ">
            🔴
          </div>

        </div>

    }

    body.innerHTML=`

        ao vivo
      </div>

      <div class="games">

function encontrarEventoPorId(id){

  const procurado=String(id);

  const local=jogosFutebol.find(
    x=>String(x.id)===procurado
  );

  if(local)return local;

  const live=liveGlobalCache.find(
    x=>String(x.id)===procurado
  );

  return live||null;
}

/* ---------------------------------------------------------

--------------------------------------------------------- */

function resumoHTML(jogo, resumo){

  const comp = obterCompetidor(jogo, "home");
  const away = obterCompetidor(jogo, "away");

  const hs = comp ? (comp.score ?? 0) : "-";
  const as = away ? (away.score ?? 0) : "-";

  let estado = "Próximo";
  if(eventoEmDireto(jogo)) estado = "AO VIVO";
  else if(eventoTerminado(jogo)) estado = "Terminado";
  else if(eventoAdiado(jogo)) estado = "Adiado";

  let texto = "";

  if(resumo){
    texto =
      resumo.description ||
      resumo.headline ||
      resumo.type?.text ||
      "";
  }

  return `
    <div class="detailScore">
      <div class="detailTeam">
        <img src="${escapeAttr(logoEquipa(comp))}" alt="">
        <strong>${escapeHTML(nomeEquipa(comp))}</strong>
      </div>

      <div class="detailCenter">
        <div class="detailScoreNumber">${hs} - ${as}</div>
        <div class="detailStatus">${escapeHTML(estado)}</div>
        <div class="detailDate">${formatoData(jogo)}</div>
      </div>

      <div class="detailTeam">
        <img src="${escapeAttr(logoEquipa(away))}" alt="">
        <strong>${escapeHTML(nomeEquipa(away))}</strong>
      </div>
    </div>

    ${
      texto
      ? `<div class="detailSummary">${escapeHTML(texto)}</div>`
      : ""
    }
  `;
}


/* ---------------------------------------------------------
   EVENTOS
--------------------------------------------------------- */

function eventosHTML(jogo, resumo){

  const eventos =
    resumo?.plays ||
    resumo?.keyEvents ||
    jogo?.plays ||
    [];

  if(!eventos.length){
    return `
      <div class="emptyBox">
        Ainda não existem eventos disponíveis para este jogo.
      </div>
    `;
  }

  return `
    <div class="eventsList">
      ${eventos.map(ev => {

        const minuto =
          ev.clock?.displayValue ||
          ev.clock?.value ||
          ev.time?.displayValue ||
          "";

        const texto =
          ev.text ||
          ev.shortText ||
          ev.type?.text ||
          "";

        const equipa =
          ev.team?.displayName ||
          ev.team?.name ||
          "";

        const atleta =
          ev.participants?.[0]?.athlete?.displayName ||
          ev.athlete?.displayName ||
          "";

        let icon = "⚽";

        const t = String(texto).toLowerCase();

        if(t.includes("yellow") || t.includes("amarelo")){
          icon = "🟨";
        }else if(t.includes("red") || t.includes("vermelho")){
          icon = "🟥";
        }else if(t.includes("substitution") || t.includes("substituição")){
          icon = "🔄";
        }else if(t.includes("var")){
          icon = "📺";
        }

        return `
          <div class="eventRow">
            <div class="eventMinute">${escapeHTML(String(minuto))}</div>
            <div class="eventIcon">${icon}</div>
            <div class="eventText">
              <strong>${escapeHTML(atleta || texto)}</strong>
              ${
                equipa
                ? `<small>${escapeHTML(equipa)}</small>`
                : ""
              }
              ${
                atleta && texto && texto !== atleta
                ? `<small>${escapeHTML(texto)}</small>`
                : ""
              }
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}


/* ---------------------------------------------------------
   ESTATÍSTICAS
--------------------------------------------------------- */

function estatisticasHTML(jogo, resumo){

  const grupos =
    resumo?.boxscore?.teams ||
    resumo?.boxscore?.statistics ||
    resumo?.statistics ||
    [];

  if(!Array.isArray(grupos) || !grupos.length){
    return `
      <div class="emptyBox">
        As estatísticas ainda não estão disponíveis para este jogo.
      </div>
    `;
  }

  const home = obterCompetidor(jogo, "home");
  const away = obterCompetidor(jogo, "away");

  const homeNome = nomeEquipa(home);
  const awayNome = nomeEquipa(away);

  let rows = [];

  grupos.forEach(g => {

    const stats = g.statistics || [];

    stats.forEach(s => {

      const nome =
        s.displayName ||
        s.name ||
        s.label ||
        "";

      const valor =
        s.displayValue ??
        s.value ??
        "";

      rows.push({
        nome,
        valor,
        equipa: g.team?.displayName || ""
      });

    });
  });

  if(!rows.length){
    return `
      <div class="emptyBox">
        As estatísticas ainda não estão disponíveis.
      </div>
    `;
  }

  const mapa = {};

  rows.forEach(r => {

    if(!mapa[r.nome]){
      mapa[r.nome] = {
        home: "-",
        away: "-"
      };
    }

    if(r.equipa === homeNome){
      mapa[r.nome].home = r.valor;
    }else if(r.equipa === awayNome){
      mapa[r.nome].away = r.valor;
    }
  });

  return `
    <div class="statsHeader">
      <strong>${escapeHTML(homeNome)}</strong>
      <span>ESTATÍSTICAS</span>
      <strong>${escapeHTML(awayNome)}</strong>
    </div>

    <div class="statsList">

      ${Object.entries(mapa).map(([nome,val]) => `
        <div class="statRow">

          <div class="statValue home">
            ${escapeHTML(String(val.home))}
          </div>

          <div class="statName">
            ${escapeHTML(nome)}
          </div>

          <div class="statValue away">
            ${escapeHTML(String(val.away))}
          </div>

        </div>
      `).join("")}

    </div>
  `;
}


/* ---------------------------------------------------------
   OBTÉM ONZE INICIAL
--------------------------------------------------------- */

function obterTitulares(resumo, jogo){

  const candidatos = [];

  if(resumo?.rosters) candidatos.push(...resumo.rosters);
  if(resumo?.lineups) candidatos.push(...resumo.lineups);

  if(resumo?.boxscore?.players){
    candidatos.push(...resumo.boxscore.players);
  }

  if(jogo?.rosters){
    candidatos.push(...jogo.rosters);
  }

  const jogadores = [];

  function adicionarJogador(p, equipa){

    if(!p) return;

    const atleta =
      p.athlete ||
      p.player ||
      p;

    const nome =
      atleta.displayName ||
      atleta.fullName ||
      atleta.name;

    if(!nome) return;

    const starter =
      p.starter === true ||
      p.isStarter === true ||
      p.starter?.value === true ||
      p.position?.abbreviation ||
      p.position?.displayName;

    if(!starter) return;

    const id =
      atleta.id ||
      p.id ||
      `${nome}-${equipa}`;

    if(jogadores.some(x => String(x.id) === String(id))){
      return;
    }

    jogadores.push({
      id,
      nome,
      numero:
        atleta.jersey ||
        p.jersey ||
        p.uniformNumber ||
        atleta.uniformNumber ||
        "",
      posicao:
        p.position?.abbreviation ||
        p.position?.displayName ||
        atleta.position?.abbreviation ||
        "",
      equipa:
        equipa ||
        p.team?.displayName ||
        atleta.team?.displayName ||
        "",
      foto:
        atleta.headshot?.href ||
        atleta.photo ||
        ""
    });
  }

  candidatos.forEach(item => {

    if(Array.isArray(item?.athletes)){

      item.athletes.forEach(p =>
        adicionarJogador(
          p,
          item.team?.displayName
        )
      );

    }else if(Array.isArray(item?.players)){

      item.players.forEach(p =>
        adicionarJogador(
          p,
          item.team?.displayName
        )
      );

    }else{
      adicionarJogador(
        item,
        item.team?.displayName
      );
    }

  });

  return jogadores;
}


/* ---------------------------------------------------------
   POSIÇÃO NO CAMPO
--------------------------------------------------------- */

function posicaoCampo(pos, indice, total){

  const p = String(pos || "").toLowerCase();

  if(
    p.includes("gk") ||
    p.includes("goal") ||
    p.includes("guarda") ||
    p.includes("keeper")
  ){
    return {x:8, y:50};
  }

  if(
    p.includes("cb") ||
    p.includes("back") ||
    p.includes("def") ||
    p.includes("df")
  ){

    const ordem = indice % 4;

    return {
      x:27,
      y:[18,39,61,82][ordem]
    };
  }

  if(
    p.includes("dm") ||
    p.includes("mid") ||
    p.includes("mc") ||
    p.includes("mf") ||
    p.includes("med")
  ){

    const ordem = indice % 4;

    return {
      x:50,
      y:[15,38,62,85][ordem]
    };
  }

  if(
    p.includes("fw") ||
    p.includes("st") ||
    p.includes("att") ||
    p.includes("fwd") ||
    p.includes("av")
  ){

    const ordem = indice % 3;

    return {
      x:74,
      y:[25,50,75][ordem]
    };
  }

  const fallback = [
    {x:15,y:50},
    {x:30,y:25},
    {x:30,y:75},
    {x:50,y:35},
    {x:50,y:65},
    {x:70,y:25},
    {x:70,y:75},
    {x:82,y:50}
  ];

  return fallback[indice % fallback.length];
}


/* ---------------------------------------------------------
   CAMPO DE FUTEBOL
--------------------------------------------------------- */

function renderPitch(jogadores, equipaNome){

  const lista =
    jogadores.filter(j =>
      !equipaNome ||
      j.equipa === equipaNome
    );

  if(!lista.length){
    return `
      <div class="emptyBox">
        O onze inicial ainda não está disponível.
      </div>
    `;
  }

  const porPosicao = {};

  lista.forEach(j => {

    const chave = j.posicao || "other";

    if(!porPosicao[chave]){
      porPosicao[chave] = [];
    }

    porPosicao[chave].push(j);
  });

  const usados = [];

  Object.keys(porPosicao).forEach(k => {

    porPosicao[k].forEach((j,i) => {

      const p = posicaoCampo(
        j.posicao,
        i,
        porPosicao[k].length
      );

      usados.push({
        ...j,
        x:p.x,
        y:p.y
      });

    });
  });

  return `
    <div class="pitch">

      <div class="pitchLine halfway"></div>
      <div class="pitchCircle"></div>

      <div class="penalty homePenalty"></div>
      <div class="penalty awayPenalty"></div>

      <div class="goal homeGoal"></div>
      <div class="goal awayGoal"></div>

      ${usados.map(j => `

        <div
          class="playerOnPitch"
          style="left:${j.x}%;top:${j.y}%"
          onclick="abrirJogador('${escapeAttr(String(j.id))}')"
        >

          <div class="shirtNumber">
            ${escapeHTML(String(j.numero || "?"))}
          </div>

          <div class="playerName">
            ${escapeHTML(j.nome.split(" ").slice(-1)[0])}
          </div>

        </div>

      `).join("")}

    </div>
  `;
}


/* ---------------------------------------------------------
   ONZE INICIAL
--------------------------------------------------------- */

function onzesHTML(jogo, resumo){

  const jogadores = obterTitulares(resumo, jogo);

  if(!jogadores.length){
    return `
      <div class="emptyBox">
        Os onze iniciais ainda não foram disponibilizados pela fonte de dados.
      </div>
    `;
  }

  const home = obterCompetidor(jogo, "home");
  const away = obterCompetidor(jogo, "away");

  const homeNome = nomeEquipa(home);
  const awayNome = nomeEquipa(away);

  const homePlayers = jogadores.filter(
    j => j.equipa === homeNome
  );

  const awayPlayers = jogadores.filter(
    j => j.equipa === awayNome
  );

  return `
    <div class="lineupTitle">
      <strong>${escapeHTML(homeNome)}</strong>
      <span>ONZE INICIAL</span>
      <strong>${escapeHTML(awayNome)}</strong>
    </div>

    <div class="pitchWrap">

      <div class="pitchTeamLabel homeLabel">
        ${escapeHTML(homeNome)}
      </div>

      ${renderPitch(homePlayers, homeNome)}

    </div>

    <div class="lineupList">

      <h3>${escapeHTML(homeNome)}</h3>

      ${
        homePlayers.length
        ? homePlayers.map(j => `
            <div class="playerListRow">
              <span class="numberBadge">
                ${escapeHTML(String(j.numero || "-"))}
              </span>

              <span>${escapeHTML(j.nome)}</span>

              <small>${escapeHTML(j.posicao || "")}</small>
            </div>
          `).join("")
        : `<div class="emptyBox">Onze não disponível.</div>`
      }

    </div>

    <div class="pitchWrap">

      <div class="pitchTeamLabel awayLabel">
        ${escapeHTML(awayNome)}
      </div>

      ${renderPitch(awayPlayers, awayNome)}

    </div>

    <div class="lineupList">

      <h3>${escapeHTML(awayNome)}</h3>

      ${
        awayPlayers.length
        ? awayPlayers.map(j => `
            <div class="playerListRow">
              <span class="numberBadge">
                ${escapeHTML(String(j.numero || "-"))}
              </span>

              <span>${escapeHTML(j.nome)}</span>

              <small>${escapeHTML(j.posicao || "")}</small>
            </div>
          `).join("")
        : `<div class="emptyBox">Onze não disponível.</div>`
      }

    </div>
  `;
}


/* ---------------------------------------------------------
   JOGADOR
--------------------------------------------------------- */

function abrirJogador(id){

  const jogador =
    (dadosDetalheAtual?.rosters || [])
      .flatMap(r => r.athletes || r.players || [])
      .map(p => p.athlete || p)
      .find(p => String(p.id) === String(id));

  if(!jogador){

    mostrarToast("Informação do jogador indisponível.");

    return;
  }

  mostrarToast(
    jogador.displayName ||
    jogador.fullName ||
    jogador.name ||
    "Jogador"
  );
}

function renderDetalheTab(){

  const body =

  if(!body || !jogoDetalheAtual){

  }

  const jogo = jogoDetalheAtual;
  const resumo = dadosDetalheAtual;

  if(detalheTabAtual === "resumo"){

    body.innerHTML = `

      <div class="detailSection">
        <h3>Eventos</h3>
        ${eventosHTML(jogo, resumo)}
      </div>
    `;

    return;
  }

  if(detalheTabAtual === "estatisticas"){

    body.innerHTML = `
      ${estatisticasHTML(jogo, resumo)}
    `;

    return;
  }

  if(detalheTabAtual === "onzes"){

    body.innerHTML = `
      ${onzesHTML(jogo, resumo)}
    `;

}

/* ---------------------------------------------------------
   EQUIPA
--------------------------------------------------------- */

async function abrirEquipa(teamId, teamName){

  const overlay =
    document.getElementById("teamOverlay");

  const body =
    document.getElementById("teamBody");

  const title =
    document.getElementById("teamHeaderTitle");

  if(!overlay || !body) return;

  overlay.classList.add("open");

  if(title){
    title.textContent =
      teamName || "Equipa";
  }

  body.innerHTML = `
    <div class="loading">
      A carregar equipa...
    </div>
  `;

  const liga =
    ligaAtual ||
    "por.1";

  try{

    const data =
      await fetchJSON(
        `${API}/${liga}/teams/${encodeURIComponent(teamId)}`
      );

    const team =
      data?.team ||
      data?.sports?.[0]?.leagues?.[0]?.teams?.[0]?.team ||
      data?.team;

    const nome =
      team?.displayName ||
      team?.name ||
      teamName ||
      "Equipa";

    const logo =
      team?.logos?.[0]?.href ||
      team?.logo ||
      "";

    const jogosEquipa =
      jogosFutebol.filter(j => {

        const h = obterCompetidor(j,"home");
        const a = obterCompetidor(j,"away");

        return (
          String(idEquipa(h)) === String(teamId) ||
          String(idEquipa(a)) === String(teamId)
        );
      });

    body.innerHTML = `

      <div class="teamHero">

        ${
          logo
          ? `<img src="${escapeAttr(logo)}" alt="">`
          : `<div class="teamLogoFallback">⚽</div>`
        }

        <h2>${escapeHTML(nome)}</h2>

        <button
          class="favTeamBtn"
          onclick="toggleFavEquipa('${escapeAttr(String(teamId))}')"
        >
          ${
            favEquipas.includes(String(teamId))
            ? "★ Remover dos favoritos"
            : "☆ Adicionar aos favoritos"
          }
        </button>

      </div>

      <div class="detailSection">

        <h3>Jogos</h3>

        ${
          jogosEquipa.length
          ? jogosEquipa
              .slice(0,10)
              .map(criarCardJogo)
              .join("")
          : `
            <div class="emptyBox">
              Não existem jogos carregados desta equipa.
            </div>
          `
        }

      </div>
    `;

  }catch(e){

    body.innerHTML = `
      <div class="emptyBox">
        Não foi possível carregar esta equipa neste momento.
      </div>
    `;

  }
}


function fecharEquipa(){

  const overlay =
    document.getElementById("teamOverlay");

  if(overlay){
    overlay.classList.remove("open");
  }
}


/* ---------------------------------------------------------
   FAVORITO DE EQUIPA
--------------------------------------------------------- */

function toggleFavEquipa(id){

  id = String(id);

  const pos =
    favEquipas.indexOf(id);

  if(pos >= 0){
    favEquipas.splice(pos,1);
    mostrarToast("Equipa removida dos favoritos.");
  }else{
    favEquipas.push(id);
    mostrarToast("Equipa adicionada aos favoritos.");
  }

  guardarStorage(
    "futzone_equipas_favoritas",
    favEquipas
  );

  renderFavoritos();
}

/* ---------------------------------------------------------
   NAVEGAÇÃO PRINCIPAL
--------------------------------------------------------- */

function mostrarPagina(nome){

  const jogos =
    document.getElementById("viewJogos");

  const tabelas =
    document.getElementById("viewTabelas");

  const favoritos =
    document.getElementById("viewFavoritos");

  if(jogos) jogos.style.display = "none";
  if(tabelas) tabelas.style.display = "none";
  if(favoritos) favoritos.style.display = "none";

  document
    .querySelectorAll(".bottomNav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  if(nome === "jogos"){

    if(jogos) jogos.style.display = "";

    document
      .getElementById("navJogos")
      ?.classList.add("active");

  }

  if(nome === "tabelas"){

    if(tabelas) tabelas.style.display = "";

    document
      .getElementById("navTabelas")
      ?.classList.add("active");

    carregarClassificacao(
      ligaAtual,
      "standingsContainer"
    );

  }

  if(nome === "favoritos"){

    if(favoritos) favoritos.style.display = "";

    document
      .getElementById("navFav")
      ?.classList.add("active");

    renderFavoritos();

  }

}

/* ---------------------------------------------------------
   AUTO REFRESH
--------------------------------------------------------- */

let ultimoRefresh = 0;

async function refreshAutomatico(){

  const agora = Date.now();

  if(
    agora - ultimoRefresh <
    45000
  ){
    return;
  }

  ultimoRefresh = agora;

  try{

    await carregarJogos();

    if(
      document
        .getElementById("viewTabelas")
        ?.style.display !== "none"
    ){

      carregarClassificacao(
        ligaAtual,
        "standingsContainer"
      );

    }

  }catch(e){

    console.warn(
      "Erro no refresh automático:",
      e
    );

  }
}

setInterval(
  refreshAutomatico,
  60000
);
