:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;

  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;

  --text:#F5F7FA;
  --muted:#9DAABB;

  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
  --white:#FFFFFF;

  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;

body{

button,
input{

button{
  cursor:pointer;

.app{

.header{

  top:0;
  z-index:30;
  padding:16px 15px 13px;
  background:rgba(3,6,11,.97);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.logo{

  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{

}

.subtitle{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);

}

.sportSwitch{

}

.sportBtn{

  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:10px 12px;
  border-radius:12px;
  font-weight:800;
}

.sportBtn.active{

  color:white;
  border-color:var(--blue);
}

main{
  padding:14px;
}

.sectionTitle{
  font-size:17px;

}

.sectionSub{
  color:var(--muted);
  font-size:12px;

}

.leagues{

  gap:8px;
  overflow-x:auto;
  padding:2px 0 10px;

}

.leagues::-webkit-scrollbar,
.filters::-webkit-scrollbar{

}

.league{

  border:1px solid var(--border);

.filters{

.filter{

.filter.active{

.status.final{

.team{

.score{

.time{

.star{

.empty{

  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  border-left:1px solid rgba(255,255,255,.6);
}

.pitch:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border:1px solid rgba(255,255,255,.6);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

  height:28px;

function esc(v){

  return String(v ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


function getLiga(id){

  return (
    LIGAS.find(function(liga){
      return liga.id === id;
    })
    ||
    {
      id:id,
      nome:id,
      curta:id
    }
  );

}


function normalizarNome(nome){

  return String(nome || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");

}


function dataTexto(valor){

  const d = new Date(valor);

  if(isNaN(d.getTime())){
    return "";
  }

  return (
    d.toLocaleDateString(
      "pt-PT",
      {
        day:"2-digit",
        month:"2-digit"
      }
    )
    +
    " · "
    +
    d.toLocaleTimeString(

function hojeISO(){

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return y + m + day;

}


function addDias(data,quantidade){

  const d = new Date(data);

  d.setDate(d.getDate()+quantidade);

  return d;

}


function dataISO(d){

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return y + "-" + m + "-" + day;

}


function dataQuery(d){

  return (
    d.getFullYear() +
    String(d.getMonth()+1).padStart(2,"0") +
    String(d.getDate()).padStart(2,"0")
  );

}

async function fetchJSON(url){

  try{

    const resposta = await fetch(
      url,
      {
        cache:"no-store"
      }
    );

    if(!resposta.ok){
      throw new Error("HTTP " + resposta.status);
    }

    return await resposta.json();

  }catch(erro){

      "FUTZONE API:",
      url,
      erro
    );

    return null;

  }

}


/* =========================================================
   NORMALIZAÇÃO DOS JOGOS ESPN
   ========================================================= */

function normalizarESPN(evento,liga){

  if(!evento){
    return null;
  }

  const competicao =
    evento.competitions?.[0];

  if(!competicao){
    return null;
  }

  const concorrentes =
    competicao.competitors || [];

  const casa =
    concorrentes.find(
      c => c.homeAway === "home"
    )
    ||
    concorrentes[0]
    ||
    {};

  const fora =
    concorrentes.find(
      c => c.homeAway === "away"
    )
    ||
    concorrentes[1]
    ||
    {};

  const status =
    competicao.status ||
    evento.status ||
    {};

  const tipo =
    status.type ||
    {};

  let estado = "upcoming";

  if(
    tipo.state === "in" ||
    tipo.name === "STATUS_IN_PROGRESS"
  ){
    estado = "live";
  }

  if(
    tipo.completed === true ||
    tipo.state === "post" ||
    tipo.name === "STATUS_FINAL"
  ){
    estado = "final";
  }

  const placarCasa =
    numeroSeguro(
      casa.score
    );

  const placarFora =
    numeroSeguro(
      fora.score
    );

  const equipaCasa =
    casa.team ||
    {};

  const equipaFora =
    fora.team ||
    {};

  return {

    id:
      String(
        evento.id ||
        competicao.id ||
        Date.now()
      ),

    liga:liga,

    ligaNome:
      getLiga(liga).nome,

    data:
      evento.date ||
      competicao.date ||
      "",

    estado:estado,

    estadoTexto:
      tipo.shortDetail ||
      tipo.detail ||
      tipo.description ||
      "",

    casa:{
      id:
        equipaCasa.id ||
        "",
      nome:
        equipaCasa.displayName ||
        equipaCasa.fullName ||
        equipaCasa.shortDisplayName ||
        equipaCasa.name ||
        "Casa",
      logo:
        equipaCasa.logo ||
        equipaCasa.logos?.[0]?.href ||
        ""
    },

    fora:{
      id:
        equipaFora.id ||
        "",
      nome:
        equipaFora.displayName ||
        equipaFora.fullName ||
        equipaFora.shortDisplayName ||
        equipaFora.name ||
        "Fora",
      logo:
        equipaFora.logo ||
        equipaFora.logos?.[0]?.href ||
        ""
    },

    scoreCasa:
      placarCasa,

    scoreFora:
      placarFora,

    eventoOriginal:evento,

    competicaoOriginal:competicao

  };

}


/* =========================================================
   BUSCAR JOGOS DE UM DIA
   ========================================================= */

async function buscarESPNDia(
  liga,
  data
){

  const url =
    API +
    encodeURIComponent(liga) +
    "/scoreboard?dates=" +
    encodeURIComponent(
      dataQuery(data)
    );

  const json =
    await fetchJSON(url);

  if(!json){
    return [];
  }

  const eventos =
    Array.isArray(json.events)
      ? json.events
      : [];

  return eventos
    .map(
      evento =>
        normalizarESPN(
          evento,
          liga
        )
    )
    .filter(Boolean);

}


/* =========================================================
   CHAVE ÚNICA DO JOGO
   ========================================================= */

function chaveJogo(jogo){

  if(!jogo){
    return "";
  }

  if(jogo.id){
    return String(jogo.id);
  }

  return [

    normalizarNome(
      jogo.casa?.nome
    ),

    normalizarNome(
      jogo.fora?.nome
    ),

    jogo.data || ""

  ].join("|");

}


/* =========================================================
   ELIMINAR DUPLICADOS
   ========================================================= */

function deduplicarJogos(jogos){

  const mapa =
    new Map();

  (jogos || []).forEach(
    jogo => {

      const chave =
        chaveJogo(jogo);

      if(!chave){
        return;
      }

      mapa.set(
        chave,
        jogo
      );

    }
  );

  return [
    ...mapa.values()
  ];

}


/* =========================================================
   ORDENAR JOGOS
   ========================================================= */

function ordenarJogos(jogos){

  return [
    ...(jogos || [])
  ].sort(
    (a,b) => {

      const da =
        new Date(a.data || 0)
          .getTime();

      const db =
        new Date(b.data || 0)
          .getTime();

      return da - db;

    }
  );

}


/* =========================================================
   CARREGAR JOGOS DA COMPETIÇÃO
   ========================================================= */

async function carregarJogosLiga(){

  if(desportoAtual !== "futebol"){
    return;
  }

  carregando = true;

  renderLoading();

  const agora =
    new Date();

  /*
    Mantemos a base da versão atual,
    mas evitamos dezenas de pedidos.
    Procuramos jogos de alguns dias
    antes e depois da data atual.
  */

  const datas = [];

  for(
    let i = -7;
    i <= 14;
    i++
  ){

    datas.push(
      addDias(
        agora,
        i
      )
    );

  }

  let resultados = [];

  /*
    Os pedidos são feitos em pequenos grupos
    para evitar sobrecarregar a API.
  */

  for(
    let inicio = 0;
    inicio < datas.length;
    inicio += 5
  ){

    const grupo =
      datas.slice(
        inicio,
        inicio + 5
      );

    const respostas =
      await Promise.all(
        grupo.map(
          data =>
            buscarESPNDia(
              ligaAtual,
              data
            )
        )
      );

    respostas.forEach(
      lista => {

        resultados =
          resultados.concat(
            lista
          );

      }
    );

  }

  resultados =
    deduplicarJogos(
      resultados
    );

  resultados =
    ordenarJogos(
      resultados
    );

  /*
    Se a ESPN não devolver determinados jogos,
    mantemos os dados de fallback existentes
    da versão anterior.
  */

  const fallback =
    FALLBACK[ligaAtual];

  if(
    fallback &&
    Array.isArray(
      fallback.games
    )
  ){

    const jogosFallback =
      fallback.games.map(
        jogo =>
          typeof jogo === "object"
            ? jogo
            : null
      ).filter(Boolean);

    resultados =
      deduplicarJogos(
        resultados.concat(
          jogosFallback
        )
      );

    resultados =
      ordenarJogos(
        resultados
      );

  }

  jogosFutebol =
    resultados;

  carregando = false;

  if(paginaAtual === "jogos"){
    renderJogos();
  }

}

/* =========================================================

   ========================================================= */

function extrairTabelasESPN(
  json
){

  if(!json){
    return [];
  }

  const grupos =
    Array.isArray(json.children)
      ? json.children
      : [];

  const tabelas = [];

  grupos.forEach(
    grupo => {

      const entries =
        grupo.standings?.entries ||
        grupo.entries ||
        [];

      if(
        Array.isArray(entries) &&
        entries.length
      ){

        tabelas.push({

          nome:
            grupo.name ||
            grupo.abbreviation ||
            "",

          entries:
            entries

        });

      }

    }
  );

  /*
    Algumas competições devolvem
    standings diretamente.
  */

  if(
    !tabelas.length &&
    Array.isArray(
      json.standings?.entries
    )
  ){

    tabelas.push({

      nome:
        json.name ||
        "",

      entries:
        json.standings.entries

    });

  }

  if(
    !tabelas.length &&
    Array.isArray(
      json.entries
    )
  ){

    tabelas.push({

      nome:
        json.name ||
        "",

      entries:
        json.entries

    });

  }

  return tabelas;

}

function valorStanding(

            s.displayName ||
            ""
          ).toLowerCase()
          ===
          String(nome)

      );

      );

/* =========================================================
   CARREGAR EQUIPAS DA LIGA
   ========================================================= */

async function carregarEquipasLiga(
  liga
){

  if(
    cacheEquipas[liga]
  ){

    return cacheEquipas[liga];

  }

  const url =
    API +
    encodeURIComponent(liga) +
    "/teams";

  const json =
    await fetchJSON(url);

  if(!json){
    return [];
  }

  const lista =
    Array.isArray(
      json.sports
    )
      ? json.sports
      : [];

  const resultado = [];

  /*
    ESPN pode devolver as equipas
    dentro de groups[].teams ou
    directamente teams.
  */

  function adicionarEquipa(
    equipa
  ){

    if(!equipa){
      return;
    }

    const t =
      equipa.team ||
      equipa;

    const id =
      t.id;

    const nome =
      t.displayName ||
      t.fullName ||
      t.name ||
      t.shortDisplayName;

    if(!id || !nome){
      return;
    }

    if(
      resultado.some(
        x => String(x.id) === String(id)
      )
    ){
      return;
    }

    resultado.push({

      id:String(id),

      nome:nome,

      nomeCurto:
        t.shortDisplayName ||
        t.name ||
        nome,

      logo:
        t.logo ||
        t.logos?.[0]?.href ||
        "",

      liga:liga,

      original:t

    });

  }


  lista.forEach(
    sport => {

      if(
        Array.isArray(
          sport.leagues
        )
      ){

        sport.leagues.forEach(
          league => {

            if(
              Array.isArray(
                league.teams
              )
            ){

              league.teams.forEach(
                adicionarEquipa
              );

            }

          }
        );

      }

    }
  );


  /*
    Algumas respostas da ESPN
    usam teams directamente.
  */

  if(
    Array.isArray(
      json.teams
    )
  ){

    json.teams.forEach(
      adicionarEquipa
    );

  }


  /*
    Outra estrutura possível:
    leagues -> teams
  */

  if(
    Array.isArray(
      json.leagues
    )
  ){

    json.leagues.forEach(
      league => {

        (
          league.teams ||
          []
        ).forEach(
          adicionarEquipa
        );

      }
    );

  }


  cacheEquipas[liga] =
    resultado;

  return resultado;

}

/* =========================================================
   ENCONTRAR ID DE UMA EQUIPA
   ========================================================= */

async function encontrarEquipa(
  nome,
  liga
){

  if(!nome){
    return null;
  }

  const equipas =
    await carregarEquipasLiga(
      liga
    );

  const normalizado =
    normalizarNome(
      nome
    );

  let equipa =
    equipas.find(
      e =>
        normalizarNome(e.nome)
        ===
        normalizado
    );

  if(equipa){
    return equipa;
  }

  equipa =
    equipas.find(
      e => {

        const n =
          normalizarNome(
            e.nome
          );

        return (
          n.includes(normalizado) ||
          normalizado.includes(n)
        );

      }
    );

  return equipa || null;

}

          f.id || f

/* ---------------------------------------------------------
   FALLBACK -> JOGO NORMALIZADO
   --------------------------------------------------------- */

function fallbackParaJogo(item, liga){
  if(!Array.isArray(item)) return null;

  const [data,casa,fora,sc,ssf] = item;

  const terminado =
    typeof sc === "number" &&
    typeof ssf === "number";

  return {
    id: "fallback_" + liga + "_" +
      normalizarNome(casa) + "_" +
      normalizarNome(fora) + "_" +
      String(data),

    liga,
    ligaNome: getLiga(liga)?.nome || liga,
    data,
    estado: terminado ? "STATUS_FINAL" : "STATUS_SCHEDULED",
    estadoTexto: terminado ? "Terminado" : "Por começar",

    casa:{
      id:"",
      nome:casa,
      logo:""
    },

    fora:{
      id:"",
      nome:fora,
      logo:""
    },

    scoreCasa:terminado ? sc : null,
    scoreFora:terminado ? ssf : null,
    eventoOriginal:null,
    competicaoOriginal:null,
    fallback:true
  };
}

function obterFallbackJogos(liga){
  const f = FALLBACK[liga];
  if(!f || !Array.isArray(f.games)) return [];

  return f.games
    .map(x => fallbackParaJogo(x,liga))
    .filter(Boolean);
}

/* ---------------------------------------------------------
   FILTROS
   --------------------------------------------------------- */

function filtrarJogos(){
  const busca = (document.getElementById("searchInput")?.value || "")
    .trim()
    .toLowerCase();

  let lista = [...jogosFutebol];

  if(filtroAtual === "hoje"){
    const h = hojeISO();
    lista = lista.filter(j => String(j.data).slice(0,10) === h);
  }

  if(filtroAtual === "proximos"){
    const agora = Date.now();
    lista = lista.filter(j => {
      const d = new Date(j.data).getTime();
      return !isNaN(d) && d >= agora;
    });
  }

  if(filtroAtual === "resultados"){
    const agora = Date.now();
    lista = lista.filter(j => {
      const d = new Date(j.data).getTime();
      return (
        j.scoreCasa !== null &&
        j.scoreFora !== null &&
        (!isNaN(d) ? d < agora : true)
      );
    });
  }

  if(filtroAtual === "favoritos"){
    lista = lista.filter(j => {
      const k = chaveJogo(j);
      return favoritosJogos.includes(k) ||
        favoritosJogos.includes(String(j.id));
    });
  }

  if(busca){
    lista = lista.filter(j =>
      normalizarNome(j.casa.nome).includes(normalizarNome(busca)) ||
      normalizarNome(j.fora.nome).includes(normalizarNome(busca)) ||
      normalizarNome(j.ligaNome).includes(normalizarNome(busca))
    );
  }

  return lista;
}

async function carregarResumoJogo(j){
  if(!j || !j.id || String(j.id).startsWith("fallback_")){
    return null;
  }

  if(cacheDetalhesJogos[j.id]){
    return cacheDetalhesJogos[j.id];
  }

  try{
    const url =
      API +
      encodeURIComponent(j.liga) +
      "/summary?event=" +
      encodeURIComponent(j.id);

    const json = await fetchJSON(url);

    cacheDetalhesJogos[j.id] = json;
    return json;
  }catch(e){
    console.warn("Resumo ESPN indisponível",e);
    return null;
  }
}

/* ---------------------------------------------------------
   EQUIPA / ATLETA
   --------------------------------------------------------- */

function nomePessoa(x){
  if(!x) return "Jogador";

  return x.displayName ||
    x.fullName ||
    x.name ||
    x.athlete?.displayName ||
    x.athlete?.fullName ||
    "Jogador";
}

function idPessoa(x){
  return String(
    x?.id ||
    x?.athlete?.id ||
    ""
  );
}

/* ---------------------------------------------------------
   GOLOS E ASSISTÊNCIAS
   --------------------------------------------------------- */

function extrairGolos(summary){
  const out = [];

  const scoring =
    Array.isArray(summary?.scoringPlays)
      ? summary.scoringPlays
      : [];

  scoring.forEach(p => {
    const texto = String(
      p?.text ||
      p?.shortText ||
      p?.description ||
      ""
    );

    const atleta =
      p?.athlete ||
      p?.participants?.find(x =>
        String(x?.type || "").toLowerCase().includes("scorer")
      ) ||
      p?.participants?.[0];

    let nome = nomePessoa(atleta);

    if(nome === "Jogador"){
      const m = texto.match(/^([^,]+?)(?:\s+\(|,|\s+GOAL|\s+golo)/i);
      if(m) nome = m[1].trim();
    }

    let assist = "";

    if(Array.isArray(p?.assists) && p.assists.length){
      assist = nomePessoa(p.assists[0]);
    }else if(p?.assist){
      assist = nomePessoa(p.assist);
    }

    out.push({
      minuto:
        p?.clock?.displayValue ||
        p?.clock?.value ||
        p?.period?.displayValue ||
        "",
      jogador:nome,
      assistencia:assist,
      texto
    });
  });

  return out;
}

/* ---------------------------------------------------------
   CARTÕES
   --------------------------------------------------------- */

function extrairCartoes(summary){
  const out = [];

  const plays =
    Array.isArray(summary?.plays)
      ? summary.plays
      : [];

  plays.forEach(p => {
    const tipo = String(
      p?.type?.text ||
      p?.type?.name ||
      p?.type ||
      ""
    ).toLowerCase();

    const texto = String(
      p?.text ||
      p?.shortText ||
      p?.description ||
      ""
    );

    const combinado = `${tipo} ${texto}`.toLowerCase();

    let cartao = "";

    if(
      combinado.includes("red card") ||
      combinado.includes("cartão vermelho") ||
      combinado.includes("cartao vermelho") ||
      combinado.includes("red-card")
    ){
      cartao = "🔴 Vermelho";
    }else if(
      combinado.includes("yellow card") ||
      combinado.includes("cartão amarelo") ||
      combinado.includes("cartao amarelo") ||
      combinado.includes("yellow-card")
    ){
      cartao = "🟨 Amarelo";
    }

    if(!cartao) return;

    const atleta =
      p?.athlete ||
      p?.participants?.[0];

    out.push({
      minuto:
        p?.clock?.displayValue ||
        "",
      jogador:nomePessoa(atleta),
      cartao,
      texto
    });
  });

  return out;
}

/* ---------------------------------------------------------
   SUBSTITUIÇÕES
   --------------------------------------------------------- */

function extrairSubstituicoes(summary){
  const out = [];

  const plays =
    Array.isArray(summary?.plays)
      ? summary.plays
      : [];

  plays.forEach(p => {
    const tipo = String(
      p?.type?.text ||
      p?.type?.name ||
      p?.type ||
      ""
    ).toLowerCase();

    const texto = String(
      p?.text ||
      p?.shortText ||
      p?.description ||
      ""
    );

    if(
      !tipo.includes("substitut") &&
      !texto.toLowerCase().includes("substitution") &&
      !texto.toLowerCase().includes("substituição") &&
      !texto.toLowerCase().includes("substituicao")
    ){
      return;
    }

    const atletas =
      Array.isArray(p?.participants)
        ? p.participants
        : [];

    out.push({
      minuto:p?.clock?.displayValue || "",
      texto,
      atletas:atletas.map(nomePessoa)
    });
  });

  return out;
}

/* ---------------------------------------------------------
   ESTATÍSTICAS DA PARTIDA
   --------------------------------------------------------- */

function valorStat(stat){
  if(stat == null) return null;

  if(typeof stat === "string" || typeof stat === "number"){
    return stat;
  }

  return (
    stat.displayValue ??
    stat.value ??
    stat.displayValueHome ??
    stat.valueHome ??
    null
  );
}

function nomeStat(stat){
  return String(
    stat?.name ||
    stat?.label ||
    stat?.displayName ||
    ""
  ).toLowerCase();
}

function extrairEstatisticas(summary){
  const blocos =
    summary?.boxscore?.teams ||
    summary?.boxscore?.teamsStatistics ||
    [];

  if(!Array.isArray(blocos) || !blocos.length){
    return [];
  }

  const resultado = {};

  blocos.forEach((team,index) => {
    const nome =
      team?.team?.displayName ||
      team?.team?.name ||
      team?.displayName ||
      `Equipa ${index+1}`;

    const stats =
      team?.statistics ||
      team?.stats ||
      [];

    resultado[nome] = {};

    if(Array.isArray(stats)){
      stats.forEach(s => {
        const n = nomeStat(s);
        const v = valorStat(s);

        if(n) resultado[n] = v;
      });
    }
  });

  const nomes = Object.keys(resultado);

  if(nomes.length < 1) return [];

  const mapa = [
    ["Posse de bola","possession"],
    ["Remates","shots"],
    ["Remates enquadrados","shots on target"],
    ["Cantos","corners"],
    ["Faltas","fouls"],
    ["Fora de jogo","offsides"],
    ["Passes","passes"],
    ["Passes completos","accurate passes"],
    ["Defesas","saves"],
    ["Cartões amarelos","yellow cards"],
    ["Cartões vermelhos","red cards"]
  ];

  return mapa.map(([label,chave]) => {
    const valores = nomes.map(nome => {
      const obj = resultado[nome];

      const k = Object.keys(obj).find(k =>
        k === chave ||
        k.includes(chave) ||
        chave.includes(k)
      );

      return k ? obj[k] : "Não disponível";
    });

    return {
      label,
      casa:valores[0] ?? "Não disponível",
      fora:valores[1] ?? "Não disponível",
      casaNome:nomes[0],
      foraNome:nomes[1]
    };
  });
}

/* ---------------------------------------------------------
   ONZE TITULAR
   --------------------------------------------------------- */

function extrairOnze(summary){
  const rosters =
    Array.isArray(summary?.rosters)
      ? summary.rosters
      : [];

  const resultado = [];

  rosters.forEach(teamBlock => {
    const equipa =
      teamBlock?.team?.displayName ||
      teamBlock?.team?.name ||
      "Equipa";

    const atletas =
      teamBlock?.roster ||
      teamBlock?.athletes ||
      teamBlock?.players ||
      [];

    const titulares = atletas.filter(a =>
      a?.starter === true ||
      a?.isStarter === true ||
      a?.starter?.value === true
    );

    resultado.push({
      equipa,
      jogadores:titulares.length
        ? titulares
        : atletas
    });
  });

  if(resultado.length) return resultado;

  const players =
    summary?.boxscore?.players ||
    [];

  players.forEach(block => {
    const equipa =
      block?.team?.displayName ||
      block?.team?.name ||
      "Equipa";

    const atletas = block?.statistics || [];

    const titulares = atletas.filter(a =>
      a?.starter === true ||
      a?.isStarter === true
    );

    resultado.push({
      equipa,
      jogadores:titulares
    });
  });

  return resultado;
}

/* ---------------------------------------------------------
   ANTECEDENTES / FORMA
   --------------------------------------------------------- */

function antecedentesEquipa(nome,liga){
  const jogos = jogosFutebol
    .filter(j =>
      mesmaEquipa(j.casa.nome,nome) ||
      mesmaEquipa(j.fora.nome,nome)
    )
    .filter(j =>
      j.scoreCasa !== null &&
      j.scoreFora !== null
    )
    .sort((a,b) =>
      new Date(b.data) - new Date(a.data)
    )
    .slice(0,5);

  return jogos;
}

function headToHead(casa,fora){
  return jogosFutebol
    .filter(j =>
      (
        mesmaEquipa(j.casa.nome,casa) &&
        mesmaEquipa(j.fora.nome,fora)
      ) ||
      (
        mesmaEquipa(j.casa.nome,fora) &&
        mesmaEquipa(j.fora.nome,casa)
      )
    )
    .filter(j =>
      j.scoreCasa !== null &&
      j.scoreFora !== null
    )
    .sort((a,b) =>
      new Date(b.data) - new Date(a.data)
    )
    .slice(0,5);
}
