<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060B;color:#FFF;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#09111C;border-bottom:1px solid #1B2A3B;padding:14px 12px}
.logo{font-size:25px;font-weight:900}.logo span{color:#1683FF}.sub{font-size:10px;color:#9DAABB;margin-top:2px}
main{padding:12px 10px 85px;max-width:720px;margin:auto}h2{font-size:18px;margin:15px 0 10px}
.seletor-ligas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.liga-btn{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:10px 5px;color:#FFF;font-size:12px;font-weight:bold}.liga-btn.active{background:#003B7A;border-color:#1683FF}.liga-icon{display:block;font-size:20px;margin-bottom:4px}
.live-button{width:100%;background:#09111C;border:1px solid #FF4054;color:#FFF;border-radius:11px;padding:12px;margin-bottom:12px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;background:#FF4054;border-radius:50%;margin-right:5px}
.filtro{display:flex;gap:7px;margin:8px 0 12px}.filtro button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:8px;font-size:11px}.filtro button.active{color:#FFF;border-color:#1683FF;background:#003B7A}
.jogo{background:#09111C;border:1px solid #1B2A3B;border-radius:13px;padding:11px;margin-bottom:8px;cursor:pointer}.jogo-top{display:flex;justify-content:space-between;color:#9DAABB;font-size:10px;margin-bottom:8px}.equipas{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;gap:5px}.equipa{text-align:center;font-size:12px;font-weight:bold}.escudo{width:31px;height:31px;object-fit:contain;display:block;margin:0 auto 4px}.resultado{text-align:center;font-size:18px;font-weight:900}.estado-live{color:#FF4054;font-weight:900}.estado-final{color:#9DAABB}.vazio,.erro,.carregando{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:18px;text-align:center;color:#9DAABB}.erro{color:#FF8F8F}
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#09111C;border-top:1px solid #1B2A3B;display:flex;z-index:30}.bottom button{background:none;border:0;color:#9DAABB;font-weight:bold;width:33%;font-size:12px}.bottom button.active{color:#1683FF}
.overlay{position:fixed;inset:0;background:#03060B;z-index:50;overflow:auto}.detalhe-header{position:sticky;top:0;background:#09111C;border-bottom:1px solid #1B2A3B;padding:11px;z-index:5}.voltar{background:#0D1724;border:1px solid #243653;color:#FFF;border-radius:8px;padding:8px 12px;font-weight:bold}.detalhe{max-width:720px;margin:auto;padding:10px 10px 35px}
.jogo-grande{background:#09111C;border:1px solid #1B2A3B;border-radius:14px;padding:18px 8px;margin-bottom:10px}.jogo-grande .equipas{grid-template-columns:1fr 85px 1fr}.jogo-grande .escudo{width:52px;height:52px}.jogo-grande .equipa{font-size:14px}.bigscore{text-align:center;font-size:29px;font-weight:900}.estado{text-align:center;color:#1683FF;font-size:11px;margin-top:4px}
.secao{background:#09111C;border:1px solid #1B2A3B;border-radius:12px;margin:10px 0;padding:11px}.secao h3{font-size:14px;margin:0 0 9px}.evento{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1B2A3B;font-size:12px}.evento:last-child{border:0}.minuto{color:#1683FF;font-weight:bold;min-width:35px}
.stats-head,.stat-row{display:grid;grid-template-columns:1fr 95px 1fr;text-align:center}.stats-head{font-size:11px;color:#9DAABB}.stat-row{padding:8px 0;border-top:1px solid #1B2A3B;font-size:11px}.nome{color:#9DAABB;font-size:10px}.stat-home{text-align:right;font-weight:bold}.stat-away{text-align:left;font-weight:bold}
.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:6px}.jogador{background:#0D1724;border:1px solid #1B2A3B;border-radius:7px;padding:8px;font-size:11px}.jogador b{color:#1683FF;margin-right:4px}.subtitulo{color:#9DAABB;font-size:10px;margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px 4px;border-bottom:1px solid #1B2A3B;text-align:center}th{color:#9DAABB}
.desporto{display:flex;gap:7px;margin:8px 0 12px}.desporto button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:9px;font-weight:bold}.desporto button.active{color:#FFF;border-color:#1683FF;background:#003B7A}

.campo-futzone{background:linear-gradient(90deg,#0a5b32,#0d7a42);border:3px solid #fff;border-radius:14px;margin-top:10px;padding:10px;position:relative;min-height:430px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.campo-futzone:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.9);transform:translateX(-50%)}
.campo-futzone:after{content:"";position:absolute;width:105px;height:105px;border:2px solid rgba(255,255,255,.9);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.campo-meio{position:absolute;left:50%;top:50%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);z-index:1}
.area-home,.area-away{position:absolute;width:92px;height:180px;border:2px solid #fff;top:50%;transform:translateY(-50%);z-index:0}.area-home{left:0;border-left:0}.area-away{right:0;border-right:0}
.campo-titulo{font-weight:900;text-align:center;font-size:12px;margin-bottom:7px}.campo-sub{font-size:10px;color:#9DAABB;text-align:center;margin-bottom:6px}
.jogador-campo{position:absolute;transform:translate(-50%,-50%);width:72px;text-align:center;z-index:3;font-size:9px;font-weight:900;line-height:1.05}.jogador-campo .camisa{width:30px;height:30px;border-radius:50%;background:#1683FF;border:2px solid #fff;margin:auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.jogador-campo.fora .camisa{background:#f4f4f4;color:#111}.jogador-campo .nome-campo{background:rgba(3,6,11,.85);border-radius:5px;padding:2px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.campo-legenda{display:flex;justify-content:center;gap:16px;font-size:10px;margin-top:7px;color:#9DAABB}.campo-legenda span{display:flex;align-items:center;gap:4px}.bola-leg{width:12px;height:12px;border-radius:50%;background:#1683FF;border:1px solid #fff}.bola-leg.fora{background:#f4f4f4}
.campo-futsal{min-height:350px}.campo-futsal .area-home,.campo-futsal .area-away{width:70px;height:150px}.campo-futsal:after{width:85px;height:85px}

/* FUTZONE SCOREBOARD — visual inspirado em apps de resultados */
.score-toolbar{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px;padding-bottom:2px}.score-toolbar button{flex:0 0 auto;background:#0D1724;border:1px solid #1B2A3B;color:#B9C4D2;border-radius:7px;padding:7px 10px;font-size:10px;font-weight:800}.score-toolbar button.active{background:#0057B8;border-color:#1683FF;color:#fff}
.dia-header{display:flex;align-items:center;justify-content:space-between;background:#101B29;border-left:3px solid #1683FF;padding:9px 10px;margin:12px 0 6px;border-radius:7px;font-size:11px;font-weight:900}.dia-header span:last-child{color:#7F8DA0;font-size:9px}
.competicao-header{display:flex;align-items:center;gap:7px;padding:8px 4px;color:#B9C4D2;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.fs-card{background:#09111C;border:1px solid #1B2A3B;border-radius:8px;margin-bottom:5px;overflow:hidden}.fs-card-main{display:grid;grid-template-columns:52px 1fr 58px;align-items:center;min-height:70px}.fs-time{text-align:center;color:#9DAABB;font-size:10px}.fs-time.live{color:#FF4054;font-weight:900}.fs-teams{padding:7px 4px}.fs-team{display:grid;grid-template-columns:1fr 25px;align-items:center;gap:4px;font-size:11px;font-weight:800;line-height:1.7}.fs-team img{width:21px;height:21px;object-fit:contain;grid-column:2;grid-row:1}.fs-team span{grid-column:1;grid-row:1;text-align:left}.fs-score{text-align:center;font-size:14px;font-weight:900;line-height:1.8}.fs-score.live{color:#FF4054}.fs-bottom{border-top:1px solid #162333;padding:4px 8px;color:#657488;font-size:8px;display:flex;justify-content:space-between}.fs-live-dot{color:#FF4054;font-weight:900}.tabela-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tabela-top small{color:#6F7E90;font-size:9px}.tabela-scroll{overflow-x:auto}.tabela-flash th{background:#101B29;position:sticky;top:0}.tabela-flash td,.tabela-flash th{padding:8px 5px}.tabela-flash tbody tr:nth-child(even){background:#0B1420}.tabela-flash td:first-child{font-weight:900;color:#9DAABB}.tabela-flash td:nth-child(2){font-weight:800;text-align:left;white-space:nowrap}.tabela-flash td:last-child{font-weight:900;color:#fff}.pontos-destaque{color:#1683FF!important;font-size:12px}.forma-mini{font-size:8px;color:#6F7E90}
</style>
</head>
<body>
<header><div class="logo">FUT<span>ZONE</span></div><div class="sub">FUTEBOL EM DIRETO</div></header>
<main id="app"></main>
<div class="bottom"><button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button><button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button><button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button></div>
<script>
const SOFA='https://www.sofascore.com/api/v1';
const ligas=[
{name:'Portugal',code:'por',icon:'🇵🇹',tid:238},{name:'Inglaterra',code:'eng',icon:'🏴',tid:17},{name:'Espanha',code:'esp',icon:'🇪🇸',tid:8},{name:'Itália',code:'ita',icon:'🇮🇹',tid:23},{name:'Alemanha',code:'ger',icon:'🇩🇪',tid:35}
];
let ligaAtual=ligas[0],jogosAtuais=[],modoJogos='todos',desportoAtual='futebol',futsalAtuais=[],futsalFiltro='todos',futsalInfo=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nav(id){['navJogos','navTabelas','navFav'].forEach(x=>document.getElementById(x).classList.toggle('active',x===id))}
function dataLocal(d){try{return new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}catch(e){return ''}}
function logo(u){return u?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`:'<div style="height:35px"></div>'}
function statusSofa(e){const t=e?.status?.type||'';return{live:t==='inprogress'||t==='inprogress',final:t==='finished'||t==='ended',txt:e?.status?.description||e?.status?.type||''}}
function normSofa(e,liga){const st=statusSofa(e),h=e.homeTeam||{},a=e.awayTeam||{};return{id:String(e.id),date:e.startTimestamp?new Date(e.startTimestamp*1000).toISOString():'',home:{id:h.id,nome:h.name||h.shortName||'Casa',logo:h.id?`https://api.sofascore.com/api/v1/team/${h.id}/image`:''},away:{id:a.id,nome:a.name||a.shortName||'Fora',logo:a.id?`https://api.sofascore.com/api/v1/team/${a.id}/image`:''},homeScore:e.homeScore?.current??e.homeScore?.display??'-',awayScore:e.awayScore?.current??e.awayScore?.display??'-',estado:st,liga:liga.name,code:liga.code,round:e.roundInfo?.round||''}}
async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return r.json()}
async function seasonAtual(tid){const d=await getJSON(`${SOFA}/unique-tournament/${tid}/seasons`);const ss=d.seasons||[];return (ss.find(s=>/2026\/2027|26\/27|2026/.test(String(s.name||s.year)))||ss[0])?.id}
async function eventosPaginas(tid,sid,kind){const out=[];for(let p=0;p<8;p++){const url=kind==='last'?`${SOFA}/unique-tournament/${tid}/season/${sid}/events/last/${p}`:`${SOFA}/unique-tournament/${tid}/season/${sid}/events/next/${p}`;try{const d=await getJSON(url);(d.events||[]).forEach(e=>out.push(e));if(d.hasNextPage===false)break}catch(e){break}}return out}
async function eventosDias(sport,daysBack,daysForward){const out=[];const now=new Date();for(let i=-daysBack;i<=daysForward;i++){const d=new Date(now);d.setDate(d.getDate()+i);const iso=d.toISOString().slice(0,10);try{const x=await getJSON(`${SOFA}/sport/${sport}/scheduled-events/${iso}`);(x.events||[]).forEach(e=>out.push(e))}catch(e){}}const m=new Map();out.forEach(e=>m.set(String(e.id),e));return [...m.values()]}
async function carregarLiga(l){const sid=await seasonAtual(l.tid);const [last,next]=await Promise.all([eventosPaginas(l.tid,sid,'last'),eventosPaginas(l.tid,sid,'next')]);const all=[...last,...next];const m=new Map();all.forEach(e=>m.set(String(e.id),e));return [...m.values()].map(e=>normSofa(e,l)).sort((a,b)=>new Date(a.date)-new Date(b.date))}
async function carregarJogos(){
 if(desportoAtual!=='futebol')return carregarFutsal();
 app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}${botoesLigas()}<div class="carregando">A carregar jogos e resultados...</div>`;nav('navJogos');
 try{jogosAtuais=await carregarLiga(ligaAtual);renderJogosFutebol()}catch(e){app.querySelector('.carregando').outerHTML='<div class="erro">Não foi possível carregar os jogos. Tenta novamente.</div>'}
}
function botoesDesporto(){return`<div class="desporto"><button class="${desportoAtual==='futebol'?'active':''}" onclick="desportoAtual='futebol';carregarJogos()">⚽ Futebol</button><button class="${desportoAtual==='futsal'?'active':''}" onclick="desportoAtual='futsal';carregarFutsal()">🥅 Futsal</button></div>`}
function botoesLigas(){return`<div class="seletor-ligas">${ligas.map(l=>`<button class="liga-btn ${l.tid===ligaAtual.tid?'active':''}" onclick="selecionarLiga(${l.tid})"><span class="liga-icon">${l.icon}</span>${esc(l.name)}</button>`).join('')}</div>`}
function selecionarLiga(tid){ligaAtual=ligas.find(l=>l.tid===tid)||ligas[0];modoJogos='todos';carregarJogos()}
function cartao(j){const h=j.homeScore,a=j.awayScore;const hora=j.estado.live?'<span class="fs-live-dot">● AO VIVO</span>':j.estado.final?'FINAL':dataLocal(j.date);return`<div class="fs-card" onclick="abrirJogo('${esc(j.id)}')"><div class="fs-card-main"><div class="fs-time ${j.estado.live?'live':''}">${hora}</div><div class="fs-teams"><div class="fs-team"><span onclick="event.stopPropagation();abrirEquipa('${esc(j.home.id)}','${esc(j.home.nome)}')">${esc(j.home.nome)}</span>${logo(j.home.logo)}</div><div class="fs-team"><span onclick="event.stopPropagation();abrirEquipa('${esc(j.away.id)}','${esc(j.away.nome)}')">${esc(j.away.nome)}</span>${logo(j.away.logo)}</div></div><div class="fs-score ${j.estado.live?'live':''}">${esc(h)}<br>${esc(a)}</div></div><div class="fs-bottom"><span>${esc(j.liga)}${j.round?` · J${esc(j.round)}`:''}</span><span>${j.estado.live?'🔴 direto':j.estado.final?'resultado final':'agendado'}</span></div></div>`}
function renderJogosFutebol(){const l=jogosAtuais.filter(j=>modoJogos==='live'?j.estado.live:modoJogos==='resultados'?j.estado.final:modoJogos==='futuros'?!j.estado.live&&!j.estado.final:true);app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}${botoesLigas()}<button class="live-button" onclick="mostrarJogosAoVivo()"><span class="dot"></span> AO VIVO</button><div class="score-toolbar"><button class="${modoJogos==='todos'?'active':''}" onclick="modoJogos='todos';renderJogosFutebol()">TODOS</button><button class="${modoJogos==='live'?'active':''}" onclick="modoJogos='live';renderJogosFutebol()">AO VIVO</button><button class="${modoJogos==='futuros'?'active':''}" onclick="modoJogos='futuros';renderJogosFutebol()">PRÓXIMOS</button><button class="${modoJogos==='resultados'?'active':''}" onclick="modoJogos='resultados';renderJogosFutebol()">RESULTADOS</button></div>${l.length?htmlJogosFutebol(l):'<div class="vazio">Não há jogos nesta categoria.</div>'}`}
function mostrarJogosAoVivo(){modoJogos='live';renderJogosFutebol()}
function htmlJogosFutebol(lista){const m=new Map();lista.forEach(j=>{const d=new Date(j.date);const k=d.toLocaleDateString('pt-PT',{weekday:'long',day:'2-digit',month:'2-digit'});if(!m.has(k))m.set(k,[]);m.get(k).push(j)});return [...m.entries()].map(([d,a])=>`<div class="dia-header"><span>${esc(d.charAt(0).toUpperCase()+d.slice(1))}</span><span>${a.length} jogos</span></div>${a.map(cartao).join('')}`).join('')}
async function descobrirFutsal(){if(futsalInfo)return futsalInfo;const evs=await eventosDias('futsal',14,30);const e=evs.find(x=>/liga placard/i.test([x.tournament?.name,x.tournament?.uniqueTournament?.name,x.uniqueTournament?.name].filter(Boolean).join(' ')));if(!e)throw new Error('Liga Placard não encontrada');const tid=e.tournament?.uniqueTournament?.id||e.uniqueTournament?.id||e.tournament?.id;const sid=e.season?.id||await seasonAtual(tid);futsalInfo={tid,sid,name:'Liga Placard'};return futsalInfo}
async function carregarFutsal(){desportoAtual='futsal';nav('navJogos');app.innerHTML=`<h2>Jogos</h2>${botoesDesporto()}<div class="carregando">A carregar Liga Placard, resultados e jornadas...</div>`;try{const info=await descobrirFutsal();const [last,next]=await Promise.all([eventosPaginas(info.tid,info.sid,'last'),eventosPaginas(info.tid,info.sid,'next')]);const all=[...last,...next];const m=new Map();all.forEach(e=>m.set(String(e.id),e));futsalAtuais=[...m.values()].sort((a,b)=>(a.startTimestamp||0)-(b.startTimestamp||0));renderFutsal()}catch(e){app.querySelector('.carregando').outerHTML='<div class="erro">Não foi possível carregar a Liga Placard neste momento.</div>'}}
function renderFutsal(){const l=futsalAtuais.filter(e=>futsalFiltro==='live'?e.status?.type==='inprogress':futsalFiltro==='resultados'?e.status?.type==='finished':futsalFiltro==='futuros'?!['inprogress','finished'].includes(e.status?.type):true);app.innerHTML=`<h2>Futsal · Liga Placard</h2>${botoesDesporto()}<button class="live-button" onclick="futsalFiltro='live';renderFutsal()"><span class="dot"></span> AO VIVO</button><div class="score-toolbar"><button class="${futsalFiltro==='todos'?'active':''}" onclick="futsalFiltro='todos';renderFutsal()">TODOS</button><button class="${futsalFiltro==='live'?'active':''}" onclick="futsalFiltro='live';renderFutsal()">AO VIVO</button><button class="${futsalFiltro==='futuros'?'active':''}" onclick="futsalFiltro='futuros';renderFutsal()">PRÓXIMOS</button><button class="${futsalFiltro==='resultados'?'active':''}" onclick="futsalFiltro='resultados';renderFutsal()">RESULTADOS</button></div>${l.length?htmlJogosFutsal(l):'<div class="vazio">Não há jogos de futsal nesta categoria.</div>'}`}
function cartaoFutsal(e){const h=e.homeTeam||{},a=e.awayTeam||{},st=statusSofa(e),hs=st.live||st.final?(e.homeScore?.current??e.homeScore?.normaltime??0):'-',as=st.live||st.final?(e.awayScore?.current??e.awayScore?.normaltime??0):'-';return`<div class="fs-card" onclick="abrirFutsalJogo('${esc(e.id)}')"><div class="fs-card-main"><div class="fs-time ${st.live?'live':''}">${st.live?'🔴 AO VIVO':st.final?'FINAL':dataLocal(new Date(e.startTimestamp*1000))}</div><div class="fs-teams"><div class="fs-team"><span onclick="event.stopPropagation();abrirEquipaFutsal('${esc(h.id)}','${esc(h.name||h.shortName)}')">${esc(h.name||h.shortName)}</span>${logo(h.id?`${SOFA}/team/${h.id}/image`: '')}</div><div class="fs-team"><span onclick="event.stopPropagation();abrirEquipaFutsal('${esc(a.id)}','${esc(a.name||a.shortName)}')">${esc(a.name||a.shortName)}</span>${logo(a.id?`${SOFA}/team/${a.id}/image`: '')}</div></div><div class="fs-score ${st.live?'live':''}">${hs}<br>${as}</div></div><div class="fs-bottom"><span>Liga Placard${e.roundInfo?.round?` · J${esc(e.roundInfo.round)}`:''}</span><span>${st.live?'direto':st.final?'resultado final':'agendado'}</span></div></div>`}
function htmlJogosFutsal(l){const m=new Map();l.forEach(e=>{const r=e.roundInfo?.round||'Jornada';if(!m.has(r))m.set(r,[]);m.get(r).push(e)});return [...m.entries()].sort((a,b)=>Number(a[0])-Number(b[0])).map(([r,a])=>`<div class="dia-header"><span>📅 Jornada ${esc(r)}</span><span>${a.length} jogos</span></div>${a.map(cartaoFutsal).join('')}`).join('')}
async function abrirJogo(id){const o=overlayBase('');document.body.appendChild(o);try{const d=await getJSON(`${SOFA}/event/${id}`);const h=d.event?.homeTeam||{},a=d.event?.awayTeam||{},st=statusSofa(d.event||{});o.querySelector('.detalhe').innerHTML=cartaoDetalheSofa(d.event)+await blocosDetalheSofa(id,false); }catch(e){o.querySelector('.detalhe').innerHTML='<div class="erro">Não foi possível carregar os detalhes.</div>'}}
async function abrirFutsalJogo(id){const o=overlayBase('');document.body.appendChild(o);try{const d=await getJSON(`${SOFA}/event/${id}`);o.querySelector('.detalhe').innerHTML=cartaoDetalheSofa(d.event,true)+await blocosDetalheSofa(id,true)}catch(e){o.querySelector('.detalhe').innerHTML='<div class="erro">Não foi possível carregar os detalhes do jogo.</div>'}}
function overlayBase(t){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="detalhe-header"><button class="voltar" onclick="this.closest('.overlay').remove()">← Voltar</button></div><div class="detalhe"><div class="carregando">A carregar...</div></div>`;return o}
function cartaoDetalheSofa(e,futsal=false){const h=e.homeTeam||{},a=e.awayTeam||{},st=statusSofa(e),hs=st.live||st.final?(e.homeScore?.current??e.homeScore?.display??0):'-',as=st.live||st.final?(e.awayScore?.current??e.awayScore?.display??0):'-';return`<div class="jogo-grande"><div class="equipas"><div class="equipa">${logo(h.id?`${SOFA}/team/${h.id}/image`: '')}${esc(h.name||h.shortName)}</div><div><div class="bigscore">${hs} - ${as}</div><div class="estado">${st.live?'🔴 AO VIVO':st.final?'FINAL':dataLocal(new Date((e.startTimestamp||0)*1000))}</div></div><div class="equipa">${logo(a.id?`${SOFA}/team/${a.id}/image`: '')}${esc(a.name||a.shortName)}</div></div></div>`}
async function blocosDetalheSofa(id,futsal){const parts=[];try{const inc=await getJSON(`${SOFA}/event/${id}/incidents`);parts.push(blocoIncidentesSofa(inc.incidents||[]))}catch(e){}try{const st=await getJSON(`${SOFA}/event/${id}/statistics`);parts.push(blocoStatsSofa(st.statistics||[]))}catch(e){}try{const lu=await getJSON(`${SOFA}/event/${id}/lineups`);parts.push(await blocoLineupsSofa(lu,id,futsal))}catch(e){parts.push('<div class="secao"><h3>👕 Plantel / 5 inicial</h3><div class="vazio">As formações ainda não foram disponibilizadas.</div></div>')}return parts.join('')}
function blocoIncidentesSofa(a){const x=a.filter(i=>['goal','yellowCard','redCard','substitution'].includes(i.incidentType));return `<div class="secao"><h3>⚽ Eventos</h3>${x.length?x.map(i=>`<div class="evento"><span class="minuto">${esc(i.time?i.time+"'":'')}</span><span>${i.incidentType==='goal'?'⚽':i.incidentType==='yellowCard'?'🟨':i.incidentType==='redCard'?'🟥':'🔄'} ${esc(i.player?.name||i.assist1?.name||i.incidentType)}</span></div>`).join(''):'<div class="subtitulo">Sem eventos disponíveis.</div>'}</div>`}
function blocoStatsSofa(groups){let rows=[];(groups||[]).forEach(g=>(g.groups||[]).forEach(gr=>(gr.statisticsItems||[]).forEach(x=>rows.push(x))));if(!rows.length)return '';return `<div class="secao"><h3>📊 Estatísticas</h3>${rows.slice(0,16).map(x=>`<div class="stat-row"><div class="stat-home">${esc(x.homeValue??'-')}</div><div class="nome">${esc(x.name||x.displayName||'')}</div><div class="stat-away">${esc(x.awayValue??'-')}</div></div>`).join('')}</div>`}
async function blocoLineupsSofa(d,id,futsal){const hs=d.home?.players||[],as=d.away?.players||[];const five=(arr)=>arr.filter(x=>x.substitute===false||x.starter===true);const h5=five(hs),a5=five(as);let html=`<div class="secao"><h3>👕 ${futsal?'5 inicial':'11 titular'}</h3>`;if(futsal)html+=campoFutsal(h5,a5);else html+=listaJogadores(h5,a5);html+='</div>';return html}
function nomeP(x){return x?.player?.name||x?.name||'Jogador'}
function listaJogadores(h,a){return `<div class="lista-jogadores">${[...h.map(x=>`<div class="jogador"><b>${esc(x.shirtNumber||'')}</b>${esc(nomeP(x))}</div>`),...a.map(x=>`<div class="jogador"><b>${esc(x.shirtNumber||'')}</b>${esc(nomeP(x))}</div>`)].join('')}</div>`}
function campoFutsal(h,a){const pos=[[18,50],[35,20],[35,80],[62,35],[62,65]];const pos2=[[82,50],[65,20],[65,80],[38,35],[38,65]];return`<div class="campo-futzone campo-futsal"><div class="campo-titulo">🏟️ 5 inicial</div><div class="campo-meio"></div>${h.slice(0,5).map((x,i)=>`<div class="jogador-campo" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><div class="camisa">${esc(x.shirtNumber||'')}</div><div class="nome-campo">${esc(nomeP(x))}</div></div>`).join('')}${a.slice(0,5).map((x,i)=>`<div class="jogador-campo fora" style="left:${pos2[i][0]}%;top:${pos2[i][1]}%"><div class="camisa">${esc(x.shirtNumber||'')}</div><div class="nome-campo">${esc(nomeP(x))}</div></div>`).join('')}</div>`}
async function abrirEquipa(id,nome){const o=overlayBase('');document.body.appendChild(o);try{const d=await getJSON(`${SOFA}/team/${id}`);const ev=await getJSON(`${SOFA}/team/${id}/events/next/0`).catch(()=>({events:[]}));const last=await getJSON(`${SOFA}/team/${id}/events/last/0`).catch(()=>({events:[]}));const players=await getJSON(`${SOFA}/team/${id}/players`).catch(()=>({players:[]}));o.querySelector('.detalhe').innerHTML=`<div class="secao"><h3>⚽ ${esc(d.team?.name||nome)}</h3><div class="subtitulo">Equipa</div>${d.team?.id?logo(`${SOFA}/team/${d.team.id}/image`):''}</div><div class="secao"><h3>👥 Plantel</h3>${(players.players||[]).map(x=>`<div class="jogador">${esc(x.player?.name||'Jogador')}</div>`).join('')||'<div class="vazio">Plantel não disponível.</div>'}</div><div class="secao"><h3>📅 Próximos jogos</h3>${(ev.events||[]).slice(0,10).map(e=>cartaoMiniTeam(e)).join('')||'<div class="vazio">Sem jogos.</div>'}</div><div class="secao"><h3>✅ Últimos resultados</h3>${(last.events||[]).slice(0,10).map(e=>cartaoMiniTeam(e)).join('')||'<div class="vazio">Sem resultados.</div>'}</div>`}catch(e){o.querySelector('.detalhe').innerHTML='<div class="erro">Não foi possível carregar a equipa.</div>'}}
function cartaoMiniTeam(e){const st=statusSofa(e);return`<div class="evento"><span class="minuto">${dataLocal(new Date((e.startTimestamp||0)*1000))}</span><span>${esc(e.homeTeam?.shortName||e.homeTeam?.name)} ${st.final?esc(e.homeScore?.current??'-'):'-'} x ${st.final?esc(e.awayScore?.current??'-'):'-'} ${esc(e.awayTeam?.shortName||e.awayTeam?.name)}</span></div>`}
function abrirEquipaFutsal(id,nome){abrirEquipa(id,nome)}
function mostrarFavoritos(){nav('navFav');app.innerHTML='<h2>⭐ Favoritos</h2><div class="vazio">Seleciona jogos favoritos para os guardares aqui.</div>'}
async function mostrarTabelas(){nav('navTabelas');app.innerHTML=`<h2>🏆 Tabelas</h2>${botoesDesporto()}${desportoAtual==='futebol'?botoesLigas():''}<div class="carregando">A atualizar classificação...</div>`;try{if(desportoAtual==='futsal'){const info=await descobrirFutsal();const d=await getJSON(`${SOFA}/unique-tournament/${info.tid}/season/${info.sid}/standings/total`);const rows=(d.standings||[]).flatMap(x=>x.rows||[]);app.querySelector('.carregando').outerHTML=htmlTabelaSofa(rows,'Liga Placard')}else{const sid=await seasonAtual(ligaAtual.tid);const d=await getJSON(`${SOFA}/unique-tournament/${ligaAtual.tid}/season/${sid}/standings/total`);const rows=(d.standings||[]).flatMap(x=>x.rows||[]);app.querySelector('.carregando').outerHTML=htmlTabelaSofa(rows,ligaAtual.name)}}catch(e){app.querySelector('.carregando').outerHTML='<div class="erro">Não foi possível atualizar a classificação.</div>'}}
function htmlTabelaSofa(rows,nome){const rs=[...rows].sort((a,b)=>(a.position||999)-(b.position||999));return`<div class="secao"><div class="tabela-top"><h3>🏆 ${esc(nome)}</h3><small>Atualizada agora</small></div><div class="tabela-scroll"><table class="tabela-flash"><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rs.map((r,i)=>`<tr onclick="abrirEquipa('${esc(r.team?.id||'')}','${esc(r.team?.name||'Equipa')}')"><td>${r.position||i+1}</td><td>${esc(r.team?.name||r.team?.shortName)}</td><td>${r.matches??0}</td><td>${r.wins??0}</td><td>${r.draws??0}</td><td>${r.losses??0}</td><td>${r.goalDifference??((r.scoresFor??0)-(r.scoresAgainst??0))}</td><td class="pontos-destaque">${r.points??0}</td></tr>`).join('')}</tbody></table></div></div>`}
carregarJogos();setInterval(()=>{if(desportoAtual==='futebol')carregarJogos();else carregarFutsal()},120000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
