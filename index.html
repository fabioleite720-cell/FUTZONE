<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const STANDINGS_API =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const CORE_API =
  "https://sports.core.api.espn.com/v2/sports/soccer/leagues/";


/* =========================================================
   COMPETIÇÕES
   ========================================================= */

const ligas = [

  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  ["esp.1","🇪🇸 La Liga"],
  ["esp.2","🇪🇸 La Liga 2"],

  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],

  ["ksa.1","🇸🇦 Liga Saudita"],
  ["usa.1","🇺🇸 MLS"],

  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]

];


/* =========================================================
   ESTADO
   ========================================================= */

let ligaSelecionada = "por.1";
let filtroAtual = "todos";
let diaSelecionado = "";
let modoTodos = false;
let modoLive = false;
let modoResultados = false;
let desporto = "futebol";

let eventosAtuais = [];
let tabelaAtual = [];

let requestToken = 0;

const CACHE = new Map();
const INFLIGHT = new Map();

const favoritos =
  JSON.parse(
    localStorage.getItem(
      "futzone_jogos_favoritos"
    ) || "[]"
  );

const overlayStack = [];

const PLAYER_CACHE = new Map();

let playerSequence = 0;


/* =========================================================
   FUNÇÕES DE REDE
   ========================================================= */

async function fetchJSON(
  url,
  timeout = 10000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    return await response.json();

  }finally{

    clearTimeout(timer);

  }

}


async function fetchAPI(
  url,
  timeout = 10000,
  cacheTime = 120000
){

  const agora = Date.now();

  const cached =
    CACHE.get(url);

  if(
    cached &&
    agora - cached.time <
    cacheTime
  ){

    return cached.data;

  }


  if(INFLIGHT.has(url)){

    return INFLIGHT.get(url);

  }


  const pedido =
    fetchJSON(
      url,
      timeout
    )

    .then(data => {

      CACHE.set(
        url,
        {
          data,
          time:Date.now()
        }
      );

      return data;

    })

    .catch(err => {

      console.warn(
        "FUTZONE API:",
        url,
        err
      );

      return null;

    })

    .finally(() => {

      INFLIGHT.delete(url);

    });


  INFLIGHT.set(
    url,
    pedido
  );


  return pedido;

}


/* =========================================================
   COMPETIDORES ESPN
   ========================================================= */

function getCompetidores(evento){

  if(
    Array.isArray(
      evento?.competitors
    )
  ){

    return evento.competitors;

  }

  if(
    Array.isArray(
      evento?.competition?.competitors
    )
  ){

    return evento
      .competition
      .competitors;

  }

  if(
    Array.isArray(
      evento?.competitions?.[0]
        ?.competitors
    )
  ){

    return evento
      .competitions[0]
      .competitors;

  }

  return [];

}


function getTeamObject(
  competitor
){

  return (
    competitor?.team ||
    competitor?.athlete ||
    competitor ||
    {}
  );

}


function nomeEquipa(
  competitor
){

  const team =
    getTeamObject(
      competitor
    );

  return (
    team.displayName ||
    team.shortDisplayName ||
    team.name ||
    team.abbreviation ||
    "Equipa"
  );

}


function idEquipa(
  competitor
){

  const team =
    getTeamObject(
      competitor
    );

  return String(
    team.id ||
    competitor?.team?.id ||
    ""
  );

}


function logoEquipa(
  competitor
){

  const team =
    getTeamObject(
      competitor
    );

  return (
    team.logo ||
    team.logos?.[0]?.href ||
    competitor?.team?.logo ||
    ""
  );

}


function obterCasaFora(
  evento
){

  const lista =
    getCompetidores(
      evento
    );

  const casa =
    lista.find(
      c => c.homeAway === "home"
    ) ||
    lista[0] ||
    null;

  const fora =
    lista.find(
      c => c.homeAway === "away"
    ) ||
    lista[1] ||
    null;

  return {
    casa,
    fora
  };

}


/* =========================================================
   DATAS
   ========================================================= */

function dataHoje(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function adicionarDiasISO(
  iso,
  dias
){

  const d =
    new Date(
      iso + "T12:00:00Z"
    );

  d.setUTCDate(
    d.getUTCDate() + dias
  );

  return d
    .toISOString()
    .slice(0,10);

}


function formatarDataISO(
  iso
){

  if(!iso){
    return "";
  }

  const d =
    new Date(iso);

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function formatarHora(
  iso
){

  if(!iso){
    return "--:--";
  }

  const d =
    new Date(iso);

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =========================================================
   NORMALIZAÇÃO DOS JOGOS
   ========================================================= */

function isLive(evento){

  const state =
    evento?.status?.type?.state ||
    evento?.status?.state ||
    "";

  return (
    state === "in"
    ||
    state === "live"
    ||
    evento?.status?.type?.name === "STATUS_IN_PROGRESS"
  );

}


function isFinal(evento){

  const state =
    evento?.status?.type?.state ||
    evento?.status?.state ||
    "";

  return (
    state === "post"
    ||
    state === "final"
    ||
    evento?.status?.type?.completed === true
    ||
    evento?.status?.type?.name === "STATUS_FINAL"
  );

}


function nomeCompeticao(
  evento,
  liga
){

  return (
    evento?.league?.name ||
    evento?.competition?.name ||
    evento?.competitions?.[0]
      ?.name ||
    ligas.find(
      x => x[0] === liga
    )?.[1] ||
    liga
  );

}


function normalizarEvento(
  evento,
  liga
){

  if(!evento){
    return null;
  }

  const {
    casa,
    fora
  } =
    obterCasaFora(
      evento
    );

  if(!casa && !fora){
    return null;
  }

  const estado =
    evento?.status?.type?.shortDetail ||
    evento?.status?.type?.detail ||
    evento?.status?.type?.description ||
    "";

  return {

    ...evento,

    id:String(
      evento.id || ""
    ),

    liga,

    league:{
      id:liga,
      name:nomeCompeticao(
        evento,
        liga
      )
    },

    homeTeam:{
      id:idEquipa(casa),
      name:nomeEquipa(casa),
      logo:logoEquipa(casa)
    },

    awayTeam:{
      id:idEquipa(fora),
      name:nomeEquipa(fora),
      logo:logoEquipa(fora)
    },

    date:
      evento.date ||
      evento?.competitions?.[0]?.date ||
      "",

    status:{
      ...(evento.status || {}),
      detail:estado
    }

  };

}


function deduplicarEventos(
  eventos
){

  const mapa =
    new Map();

  eventos.forEach(
    evento => {

      if(
        evento &&
        evento.id
      ){

        mapa.set(
          String(evento.id),
          evento
        );

      }

    }
  );

  return Array.from(
    mapa.values()
  );

}


/* =========================================================
   JOGOS DE UMA LIGA
   ========================================================= */

async function buscarJogosLiga(
  liga,
  iso
){

  const dataAPI =
    iso.replaceAll(
      "-",
      ""
    );

  const url =
    API +
    encodeURIComponent(liga) +
    "/scoreboard?dates=" +
    dataAPI +
    "&limit=100";

  const json =
    await fetchAPI(
      url,
      10000,
      120000
    );

  if(
    !json ||
    !Array.isArray(
      json.events
    )
  ){

    return [];

  }

  return deduplicarEventos(
    json.events
      .map(
        e =>
          normalizarEvento(
            e,
            liga
          )
      )
      .filter(Boolean)
  );

}


/* =========================================================
   RESULTADOS HISTÓRICOS — BLOCO 2
   ========================================================= */

const RESULTADOS_DIAS = 30;
const RESULTADOS_GRUPO = 5;

function dataOffset(
  iso,
  delta
){

  const d =
    new Date(
      iso + "T12:00:00Z"
    );

  d.setUTCDate(
    d.getUTCDate() + delta
  );

  return d
    .toISOString()
    .slice(0,10);

}


async function buscarJogosDiaHistorico(
  liga,
  iso
){

  try{

    const dataAPI =
      iso.replaceAll(
        "-",
        ""
      );

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      dataAPI +
      "&limit=100";

    const json =
      await fetchAPI(
        url,
        10000,
        180000
      );

    if(
      !json ||
      !Array.isArray(
        json.events
      )
    ){

      return [];

    }

    return json.events
      .map(
        e =>
          normalizarEvento(
            e,
            liga
          )
      )
      .filter(
        e =>
          e &&
          isFinal(e)
      );

  }catch(err){

    console.warn(
      "FUTZONE histórico:",
      liga,
      iso,
      err
    );

    return [];

  }

}


async function buscarResultadosHistoricosLiga(
  liga,
  dias = RESULTADOS_DIAS
){

  const base =
    diaSelecionado ||
    dataHoje();

  const datas = [];

  for(
    let i=1;
    i<=dias;
    i++
  ){

    datas.push(
      dataOffset(
        base,
        -i
      )
    );

  }

  const resultados = [];

  for(
    let i=0;
    i<datas.length;
    i+=RESULTADOS_GRUPO
  ){

    const grupo =
      datas.slice(
        i,
        i + RESULTADOS_GRUPO
      );

    const respostas =
      await Promise.all(
        grupo.map(
          data =>
            buscarJogosDiaHistorico(
              liga,
              data
            )
        )
      );

    respostas.forEach(
      lista => {

        if(
          Array.isArray(lista)
        ){

          resultados.push(
            ...lista
          );

        }

      }
    );

    if(
      i + RESULTADOS_GRUPO <
      datas.length
    ){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            80
          )
      );

    }

  }

  return deduplicarEventos(
    resultados
  )
  .filter(isFinal)
  .sort(
    (a,b) =>
      new Date(
        b.date || 0
      ) -
      new Date(
        a.date || 0
      )
  );

}

/* =========================================================

function eventoPassaFiltro(e){

  if(modoLive && !isLive(e)){
    return false;
  }

  if(
    filtroAtual==="live" &&
    !isLive(e)
  ){
    return false;
  }

  if(
    filtroAtual==="finished" &&
    !isFinal(e)
  ){
    return false;
  }

  if(
    filtroAtual==="upcoming" &&
    (isFinal(e)||isLive(e))
  ){
    return false;
  }

  const input=
    document.getElementById(
      "searchInput"
    );

  const pesquisa=
    (input?.value||"")
    .trim()
    .toLowerCase();

  if(pesquisa){

    const texto=[

      nomeEquipa(e.home),
      nomeEquipa(e.away),
      e.leagueName||"",
      e.competitionName||"",
      e.statusText||""

    ].join(" ").toLowerCase();

    if(!texto.includes(pesquisa)){
      return false;
    }
  }

  return true;
}

   ========================================================= */

function renderizarJogos(eventos){

    "mainContent"
  );

  if(!main)return;

  let lista=Array.isArray(eventos)
    ? eventos.slice()
    : [];

  lista=lista.filter(
    eventoPassaFiltro
  );

  lista.sort((a,b)=>{

    if(isLive(a)!==isLive(b)){

      return isLive(a)?-1:1;
    }

    if(isFinal(a)!==isFinal(b)){

      return isFinal(a)?1:-1;
    }

    return new Date(
      a.date||0
    )-new Date(
      b.date||0
    );
  });


  if(!lista.length){

    let mensagem=
      "Não existem jogos para mostrar.";

        <span>

      e.competitionName||

          </span>

          <span>
            ${jogos.length}
          </span>

      );

        ev=>{

            )
          );

        }
      );

    });

}

/* =========================================================

   ========================================================= */

function renderEventosJogo(resumo){

  const plays=
    resumo?.plays||
    resumo?.keyEvents||
    [];

  if(
    !Array.isArray(plays)||
    !plays.length
  ){

    return `
      <div class="mutedBox">
        Sem eventos disponíveis.
      </div>
    `;
  }


  return plays.map(p=>{

    const minuto=
      p.clock?.displayValue||
      p.period?.displayValue||
      "";


    const texto=
      p.text||
      p.type?.text||
      p.type?.description||
      "Evento";


    return `

      <div class="eventRow">

        <span class="eventMinute">
          ${minuto}
        </span>

        <span>
          ${texto}
        </span>

      </div>

    `;

  }).join("");
}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

function renderEstatisticasJogo(
  resumo
){

  const grupos=
    resumo?.boxscore
      ?.teams||
    resumo?.statistics||
    [];


  if(
    !Array.isArray(grupos)||
    !grupos.length
  ){

    return `
      <div class="mutedBox">
        Estatísticas ainda não disponíveis.
      </div>
    `;
  }


  let html="";


  grupos.forEach(grupo=>{

    const stats=
      grupo.statistics||
      grupo.stats||
      [];

    if(!Array.isArray(stats))return;


    stats.forEach(stat=>{

      const nome=
        stat.name||
        stat.displayName||
        stat.label||
        "";


      const valor=
        stat.displayValue||
        stat.value||
        "";


      if(nome){

        html+=`

          <div class="statRow">

            <span>
              ${nome}
            </span>

            <strong>
              ${valor}
            </strong>

          </div>

        `;
      }

    });

  });


  return html||
    `
      <div class="mutedBox">
        Estatísticas ainda não disponíveis.
      </div>
    `;
}

    CORE_API+

function obterValorPerfil(
  obj,
  ...chaves
){

  for(
    const chave of chaves
  ){

    const partes=
      chave.split(".");

    let valor=obj;


    for(
      const parte of partes
    ){

      if(valor==null)break;

      valor=valor[parte];
    }


    if(
      valor!==undefined &&
      valor!==null &&
      valor!==""
    ){

      return valor;
    }
  }


  return "";
}


/* =========================================================
   HISTÓRICO BASE
   ========================================================= */

function extrairHistoricoJogador(
  data
){

  if(!data)return[];


  const fontes=[

    data.teamHistory,
    data.formerTeams,
    data.teams,
    data.history,
    data.career?.teams,
    data.career?.teamHistory

  ];


  const resultado=[];


  fontes.forEach(lista=>{

    if(!Array.isArray(lista)){
      return;
    }


    lista.forEach(item=>{

      const equipa=
        item.team||
        item.club||
        item;


      const nome=
        equipa.displayName||
        equipa.name||
        equipa.shortName||
        item.teamName||
        item.clubName||
        "";


      if(!nome)return;


      resultado.push({

        teamId:
          equipa.id||
          item.teamId||
          "",

        name:nome,

        start:
          item.startDate||
          item.from||
          item.start||
          "",

        end:
          item.endDate||
          item.to||
          item.end||
          "",

        season:
          item.season?.displayName||
          item.seasonName||
          ""

      });

    });

  });


  const mapa=new Map();


  resultado.forEach(item=>{

    const chave=[

      item.teamId,
      item.name,
      item.season,
      item.start,
      item.end

    ].join("|");


    if(!mapa.has(chave)){
      mapa.set(
        chave,
        item
      );
    }

  });


  return Array.from(
    mapa.values()
  );
}


/* =========================================================
   EVENTLOG
   ========================================================= */

function obterAnoAtual(){

  return new Date()
    .getUTCFullYear();
}


function extrairEquipasEventlog(
  data
){

  const resultado=[];


  const inserir=(
    team,
    ano
  )=>{

    if(!team)return;


    const t=
      team.team||
      team;


    const id=
      t.id||
      team.teamId||
      "";


    const nome=
      t.displayName||
      t.name||
      t.shortName||
      team.teamName||
      "";


    if(!nome)return;


    resultado.push({

      teamId:id,

      name:nome,

      season:
        String(
          ano||""
        )

    });

  };


  const processar=(
    item,
    ano
  )=>{

    if(!item)return;


    if(
      Array.isArray(
        item.teams
      )
    ){

      item.teams.forEach(
        team=>
          inserir(
            team,
            ano
          )
      );

    }


    if(item.team){

      inserir(
        item.team,
        ano
      );
    }


    const competitors=
      item.competitions?.[0]
        ?.competitors||
      item.competition
        ?.competitors||
      [];


    if(
      Array.isArray(
        competitors
      )
    ){

      competitors.forEach(
        c=>
          inserir(
            c.team||c,
            ano
          )
      );

    }

  };


  if(
    Array.isArray(
      data?.teams
    )
  ){

    data.teams.forEach(
      team=>
        inserir(
          team,
          data.season?.year
        )
    );

  }


  const items=
    data?.events?.items||
    data?.items||
    data?.events||
    [];


  if(
    Array.isArray(items)
  ){

    items.forEach(
      item=>
        processar(
          item,
          data.season?.year
        )
    );

  }


  return resultado;
}


async function buscarEventlogJogador(
  liga,
  athleteId,
  ano
){

  if(!athleteId){
    return null;
  }


  const url=
    "https://sports.core.api.espn.com/v2/sports/soccer/leagues/"+
    encodeURIComponent(liga)+
    "/seasons/"+
    encodeURIComponent(ano)+
    "/athletes/"+
    encodeURIComponent(athleteId)+
    "/eventlog";


  try{

    return await fetchJSON(
      url,
      7000
    );

  }catch(err){

    return null;
  }
}


async function buscarHistoricoEventlog(
  liga,
  athleteId
){

  const atual=
    obterAnoAtual();


  const anos=[];


  for(let i=0;i<6;i++){

    anos.push(
      atual-i
    );
  }


  const resultado=[];


  for(
    let i=0;
    i<anos.length;
    i+=2
  ){

    const grupo=
      anos.slice(
        i,
        i+2
      );


    const respostas=
      await Promise.all(
        grupo.map(
          ano=>
            buscarEventlogJogador(
              liga,
              athleteId,
              ano
            )
        )
      );


    respostas.forEach(
      data=>{

        if(data){

          resultado.push(
            ...extrairEquipasEventlog(
              data
            )
          );

        }

      }
    );


    await new Promise(
      resolve=>
        setTimeout(
          resolve,
          60
        )
    );

  }


  const mapa=new Map();


  resultado.forEach(item=>{

    const chave=[

      item.teamId,
      item.name,
      item.season

    ].join("|");


    if(!mapa.has(chave)){

      mapa.set(
        chave,
        item
      );

    }

  });


  return Array.from(
    mapa.values()
  );
}

function formatarPeriodo(
  inicio,
  fim
){

  if(!inicio&&!fim){
    return "";
  }

  if(inicio&&fim){

    return `${inicio} — ${fim}`;
  }

  return inicio||fim||"";
}


/* =========================================================
   TABELAS
   ========================================================= */

async function buscarTabelaLiga(
  liga
){

  const urls=[

    STANDINGS_API+
    encodeURIComponent(liga)+
    "/standings",

    API+
    encodeURIComponent(liga)+
    "/standings",

    CORE_API+
    encodeURIComponent(liga)+
    "/standings"

  ];


  for(
    const url of urls
  ){

    try{

      const data=
        await fetchJSON(
          url,
          10000
        );


      if(data){

        const tabela=
          extrairTabelaESPN(
            data
          );


        if(tabela.length){
          return tabela;
        }
      }

    }catch(err){}
  }


  return[];
}


function extrairTabelaESPN(
  data
){

  const resultado=[];


  const grupos=[];


  if(
    Array.isArray(
      data?.children
    )
  ){

    grupos.push(
      ...data.children
    );

  }


  if(
    Array.isArray(
      data?.standings
    )
  ){

    grupos.push(data);
  }


  if(
    data?.standings?.entries
  ){

    grupos.push(data);
  }


  function processar(
    obj
  ){

    const entries=
      obj?.standings?.entries||
      obj?.entries||
      [];


    if(!Array.isArray(entries)){
      return;
    }


    entries.forEach(
      (entry,index)=>{

        const team=
          entry.team||
          {};


        const stats=
          entry.stats||
          entry.statistics||
          [];


        const getStat=(
          ...nomes
        )=>{

          for(
            const s of stats
          ){

            const n=
              String(
                s.name||
                s.abbreviation||
                s.type||
                ""
              ).toLowerCase();


            if(
              nomes.some(
                x=>
                  n===x||
                  n.includes(x)
              )
            ){

              return(
                s.value ??
                s.displayValue ??
                0
              );

            }

          }


          return 0;
        };


        resultado.push({

          position:
            Number(
              entry.position
            )||index+1,

          teamId:
            team.id||
            "",

          name:
            team.displayName||
            team.name||
            team.shortDisplayName||
            "Equipa",

          logo:
            team.logos?.[0]?.href||
            team.logo||
            "",

          played:
            Number(
              getStat(
                "gamesplayed",
                "gp",
                "played"
              )
            )||0,

          won:
            Number(
              getStat(
                "wins",
                "w"
              )
            )||0,

          draw:
            Number(
              getStat(
                "ties",
                "draws",
                "d"
              )
            )||0,

          lost:
            Number(
              getStat(
                "losses",
                "l"
              )
            )||0,

          gf:
            Number(
              getStat(
                "pointsfor",
                "goalsfor",
                "gf"
              )
            )||0,

          ga:
            Number(
              getStat(
                "pointsagainst",
                "goalsagainst",
                "ga"
              )
            )||0,

          gd:
            Number(
              getStat(
                "pointdifferential",
                "goaldifference",
                "gd"
              )
            )||0,

          points:
            Number(
              getStat(
                "points",
                "pts"
              )
            )||0

        });

      }
    );
  }


  grupos.forEach(
    processar
  );


  const mapa=new Map();


  resultado.forEach(
    item=>{

      const chave=
        item.teamId||
        item.name;


      if(!mapa.has(chave)){

        mapa.set(
          chave,
          item
        );
      }

    }
  );


  return Array.from(
    mapa.values()
  );
}

function renderTabela(
  tabela
){

  const main=
    document.getElementById(
      "mainContent"
    );

  if(!main)return;


  if(
    !Array.isArray(tabela)||
    !tabela.length
  ){

    main.innerHTML=
      tabelaFallback();

    return;
  }


  let html=`

    <section class="standings">

      <div class="standingsHeader">

        <span>#</span>

        <span>Equipa</span>

        <span>J</span>

        <span>V</span>

        <span>E</span>

        <span>D</span>

        <span>DG</span>

        <span>PTS</span>

      </div>

  `;


  tabela.forEach(
    (t,index)=>{

      html+=`

        <button
          class="standingRow"
          data-team-id="${t.teamId||""}"
          data-team-name="${t.name||"Equipa"}"
        >

          <span class="position">
            ${t.position||index+1}
          </span>


          <span class="standingTeam">

            ${
              t.logo

              ?

              `
                <img
                  src="${t.logo}"
                  alt=""
                  onerror="this.style.visibility='hidden'"
                >
              `

              :

              ""
            }


            <strong>
              ${t.name}
            </strong>

          </span>


          <span>
            ${t.played}
          </span>

          <span>
            ${t.won}
          </span>

          <span>
            ${t.draw}
          </span>

          <span>
            ${t.lost}
          </span>

          <span>
            ${t.gd}
          </span>

          <strong class="points">
            ${t.points}
          </strong>

        </button>

      `;
    }
  );


  html+=`

    </section>

  `;


  main.innerHTML=html;


  main
    .querySelectorAll(
      ".standingRow"
    )
    .forEach(row=>{

      row.addEventListener(
        "click",
        ()=>{

          const id=
            row.dataset.teamId;


          if(id){

            fzAbrirEquipa(
              id,
              row.dataset.teamName||
              "Equipa"
            );

          }

        }
      );

    });
}
