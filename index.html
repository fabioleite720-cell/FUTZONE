<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#07111f;
 color:#fff;
 font-family:Arial,sans-serif;
}

header{
 padding:18px 15px;
 text-align:center;
 background:#0b1728;
 position:sticky;
 top:0;
 z-index:10;
}

header h1{
 margin:0;
 font-size:28px;
}

header p{
 margin:5px 0 0;
 color:#9fb0c4;
 font-size:12px;
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:12px 12px 90px;
}

.filters{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:5px 0 10px;
 scrollbar-width:none;
}

.filters::-webkit-scrollbar{
 display:none;
}

.filters button,
.nav button,
.back,
.favbtn{
 border:0;
 border-radius:10px;
 padding:10px 12px;
 background:#14243a;
 color:#fff;
 font-weight:bold;
}

.filters button.active,
.nav button.active{
 background:#1976d2;
}

.card{
 background:#0d1b2d;
 border:1px solid #1c3048;
 border-radius:14px;
 padding:12px;
 margin:9px 0;
}

.league-title{
 font-weight:bold;
 font-size:14px;
 margin-bottom:8px;
 color:#9ecbff;
}

.game{
 display:grid;
 grid-template-columns:1fr 80px 1fr;
 gap:8px;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.team{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 font-weight:bold;
 min-width:0;
}

.team span{
 overflow:hidden;
 text-overflow:ellipsis;
}

.team img,
.logo{
 width:38px;
 height:38px;
 object-fit:contain;
 flex-shrink:0;
}

.score{
 font-size:22px;
 font-weight:bold;
}

.status{
 font-size:11px;
 color:#9fb0c4;
 margin-top:4px;
}

.live{
 color:#ff5252;
 font-weight:bold;
}

.section{
 font-size:19px;
 font-weight:bold;
 margin:15px 2px 8px;
}

.small{
 font-size:12px;
 color:#9fb0c4;
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#0b1728;
 display:flex;
 justify-content:center;
 gap:8px;
 padding:9px;
 z-index:20;
}

.nav button{
 flex:1;
 max-width:180px;
 background:#14243a;
}

.empty{
 text-align:center;
 padding:30px 10px;
 color:#9fb0c4;
}

.back{
 margin-bottom:10px;
}

.teamhead{
 display:flex;
 align-items:center;
 gap:12px;
}

.teamhead h2{
 margin:0;
}

.star{
 margin-left:auto;
 border:0;
 background:none;
 color:#ffd54a;
 font-size:28px;
}

.player{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #1c3048;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}

th,td{
 padding:8px 4px;
 border-bottom:1px solid #1c3048;
 text-align:center;
}

th:nth-child(2),
td:nth-child(2){
 text-align:left;
}

.error{
 color:#ff8a80;
}

@media(max-width:500px){

 .game{
  grid-template-columns:1fr 65px 1fr;
 }

 .team{
  font-size:13px;
 }

 .team img{
  width:32px;
  height:32px;
 }

 .score{
  font-size:20px;
 }

}
</style>
</head>

<body>

<header>
<h1>⚽ FUTZONE</h1>
<p>Futebol em direto, resultados e estatísticas</p>
</header>

<div class="wrap">
<div id="app"></div>
</div>

<div class="nav">

<button id="navJogos" onclick="mostrarJogos()">
⚽<br>Jogos
</button>

<button id="navTabelas" onclick="mostrarTabelas()">
📊<br>Tabelas
</button>

<button id="navFav" onclick="mostrarFavoritos()">
⭐<br>Favoritos
</button>

</div>

<script>

/* =========================
   CONFIGURAÇÃO
========================= */

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;
let ultimaAtualizacao=null;
let intervaloLive=null;

const ligas=[

 {
  nome:"Portugal",
  arquivo:"data/primeira-liga.json"
 },

 {
  nome:"Inglaterra",
  arquivo:"data/premier-league.json"
 },

 {
  nome:"Espanha",
  arquivo:"data/la-liga.json"
 },

 {
  nome:"Itália",
  arquivo:"data/serie-a.json"
 },

 {
  nome:"Alemanha",
  arquivo:"data/bundesliga.json"
 }

];


/* =========================
   SEGURANÇA HTML
========================= */

function esc(valor){

 return String(valor ?? "")
  .replace(/[&<>'"]/g,function(m){

   return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"

   }[m];

  });

}


/* =========================
   ESPN
========================= */

function extrairEventos(dados){

 if(!dados) return [];

 if(Array.isArray(dados))
  return dados;

 if(Array.isArray(dados.events))
  return dados.events;

 if(Array.isArray(dados.leagues)){

  let resultado=[];

  dados.leagues.forEach(liga=>{

   if(Array.isArray(liga.events)){

    resultado.push(
     ...liga.events
    );

   }

  });

  return resultado;

 }

 return [];

}


/* =========================
   EQUIPAS ESPN
========================= */

function obterCompeticao(jogo){

 if(
  jogo &&
  Array.isArray(jogo.competitions) &&
  jogo.competitions.length
 ){

  return jogo.competitions[0];

 }

 return null;
}


function obterCompetidores(jogo){

 let comp=obterCompeticao(jogo);

 if(
  comp &&
  Array.isArray(comp.competitors)
 ){

  return comp.competitors;

 }

 return [];

}


function obterEquipa(jogo,casa){

 let lista=
  obterCompetidores(jogo);

 let equipa=
  lista.find(function(x){

   if(casa)
    return x.homeAway==="home";

   return x.homeAway==="away";

  });

 return equipa || null;

}


function nomeEquipa(equipa){

 if(!equipa)
  return "Equipa";

 return(
  equipa.team?.displayName ||
  equipa.team?.shortDisplayName ||
  equipa.team?.name ||
  equipa.displayName ||
  equipa.name ||
  "Equipa"
 );

}


function idEquipa(equipa){

 if(!equipa)
  return "";

 return(
  equipa.team?.id ||
  equipa.id ||
  nomeEquipa(equipa)
 );

}


function logoEquipa(equipa){

 if(!equipa)
  return "";

 if(
  equipa.team &&
  Array.isArray(equipa.team.logos) &&
  equipa.team.logos.length
 ){

  return equipa.team.logos[0].href || "";

 }

 return(
  equipa.team?.logo ||
  equipa.team?.crest ||
  equipa.logo ||
  ""
 );

}


/* =========================
   RESULTADO
========================= */

function scoreEquipa(equipa){

 if(!equipa)
  return null;

 return(
  equipa.score ??
  equipa.score?.value ??
  null
 );

}


function resultado(jogo){

 let casa=
  obterEquipa(jogo,true);

 let fora=
  obterEquipa(jogo,false);

 let h=scoreEquipa(casa);
 let a=scoreEquipa(fora);

 if(h!==null && a!==null)
  return `${h} - ${a}`;

 return "-";

}


/* =========================
   ESTADO
========================= */

function estadoJogo(jogo){

 let comp=
  obterCompeticao(jogo);

 let tipo=
  comp?.status?.type;

 let estado=
  String(
   tipo?.state ||
   tipo?.name ||
   tipo?.description ||
   jogo.status ||
   ""
  ).toLowerCase();

 if(
  estado.includes("in") ||
  estado.includes("live") ||
  estado.includes("progress")
 ){

  return "🔴 AO VIVO";

 }

 if(
  estado.includes("final") ||
  estado.includes("post")
 ){

  return "Final";

 }

 return "Próximo";

}


/* =========================
   DATA
========================= */

function dataJogo(jogo){

 return(
  jogo.date ||
  obterCompeticao(jogo)?.date ||
  ""
 );

}


/* =========================
   FAVORITOS
========================= */

function obterFavoritos(){

 try{

  return JSON.parse(
   localStorage.getItem(
    "futzone_favoritos"
   ) || "[]"
  );

 }catch(e){

  return [];

 }

}


function eFavorito(id){

 return obterFavoritos()
  .some(function(x){

   return String(x.id)===
          String(id);

  });

}


function alternarFavorito(
 id,
 nome,
 liga,
 logo
){

 let lista=
  obterFavoritos();

 let indice=
  lista.findIndex(function(x){

   return String(x.id)===
          String(id);

  });


 if(indice>=0){

  lista.splice(indice,1);

 }else{

  lista.push({

   id:id,
   name:nome,
   league:liga,
   logo:logo

  });

 }


 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(lista)
 );


 if(equipaAtual)
  mostrarEquipa();
 else
  mostrarFavoritos();

}


/* =========================
   DETALHES
========================= */

function abrirDetalhes(jogo){

 let id=
  jogo.id;

 if(!id)
  return;

 let liga=
  encodeURIComponent(
   jogo.__liga || ""
  );

 location.href=
  "detalhes.html?id="+
  encodeURIComponent(id)+
  "&liga="+
  liga;

}


/* =========================
   EQUIPA
========================= */

function abrirEquipaPorId(
 id,
 nome,
 liga,
 logo
){

 equipaAtual={

  id:id,
  name:nome,
  league:liga,
  logo:logo

 };

 mostrarEquipa();

}


/* =========================
   CARREGAR TODAS AS LIGAS
========================= */

async function carregar(){

 let todos=[];

 for(
  const liga of ligas
 ){

  try{

   const resposta=
    await fetch(
     liga.arquivo+
     "?v="+Date.now(),
     {
      cache:"no-store"
     }
    );


   if(!resposta.ok)
    continue;


   const dados=
    await resposta.json();


   const eventos=
    extrairEventos(dados);


   eventos.forEach(function(jogo){

    jogo.__liga=
     liga.nome;

    todos.push(jogo);

   });


  }catch(erro){

   console.log(
    "Erro:",
    liga.nome,
    erro
   );

  }

 }


 jogos=todos;

 ultimaAtualizacao=
  new Date();

 mostrarJogos();

}


/* =========================
   FILTROS
========================= */

function setFiltro(valor){

 filtroAtual=
  valor;

 mostrarJogos();

}


function setLiga(valor){

 ligaAtual=
  valor;

 mostrarJogos();

}


function passaFiltro(jogo){

 if(
  ligaAtual!=="Todos" &&
  jogo.__liga!==ligaAtual
 ){

  return false;

 }


 let estado=
  estadoJogo(jogo);


 if(
  filtroAtual==="🔴 Ao vivo"
 ){

  return estado==="🔴 AO VIVO";

 }


 if(
  filtroAtual==="Resultados"
 ){

  return estado==="Final";

 }


 if(
  filtroAtual==="Próximos"
 ){

  return estado==="Próximo";

 }


 if(
  filtroAtual==="Hoje"
 ){

  let data=
   dataJogo(jogo);

  if(!data)
   return false;

  return(
   new Date(data)
    .toDateString()
   ===
   new Date()
    .toDateString()
  );

 }


 return true;

}


/* =========================
   BOTÕES FILTROS
========================= */

function filtros(){

 return`

 <div class="filters">

  ${[
   "Todos",
   "Hoje",
   "🔴 Ao vivo",
   "Resultados",
   "Próximos"
  ].map(function(x){

   return`

   <button
    class="${
     filtroAtual===x
     ?"active":""
    }"
    onclick="setFiltro('${x}')"
   >
    ${x}
   </button>

   `;

  }).join("")}

 </div>


 <div class="filters">

  ${[
   "Todos",
   ...ligas.map(x=>x.nome)
  ].map(function(x){

   return`

   <button
    class="${
     ligaAtual===x
     ?"active":""
    }"
    onclick="setLiga('${x}')"
   >
    ${x}
   </button>

   `;

  }).join("")}

 </div>

 `;

}


/* =========================
   CARTÃO JOGO
========================= */

function cardJogo(jogo){

 let casa=
  obterEquipa(jogo,true);

 let fora=
  obterEquipa(jogo,false);


 let nomeCasa=
  nomeEquipa(casa);

 let nomeFora=
  nomeEquipa(fora);


 let idCasa=
  idEquipa(casa);

 let idFora=
  idEquipa(fora);


 let logoCasa=
  logoEquipa(casa);

 let logoFora=
  logoEquipa(fora);


 let estado=
  estadoJogo(jogo);


 return`

 <div class="card">

  <div class="league-title">
   ${esc(jogo.__liga)}
  </div>


  <div
   class="game"
   onclick='abrirDetalhes(${JSON.stringify(jogo).replace(/</g,"\\u003c")})'
  >

   <div class="team">

    ${
     logoCasa
     ?
     `<img src="${esc(logoCasa)}"
       onerror="this.style.display='none'">`
     :
     ""
    }

    <span>
     ${esc(nomeCasa)}
    </span>

   </div>


   <div>

    <div class="score">
     ${esc(resultado(jogo))}
    </div>

    <div class="${
     estado==="🔴 AO VIVO"
     ?"status live"
     :"status"
    }">

     ${esc(estado)}

    </div>

   </div>


   <div class="team">

    <span>
     ${esc(nomeFora)}
    </span>

    ${
     logoFora
     ?
     `<img src="${esc(logoFora)}"
       onerror="this.style.display='none'">`
     :
     ""
    }

   </div>

  </div>


  <div
   style="
    display:flex;
    gap:6px;
    margin-top:9px;
    overflow-x:auto
   "
  >

   <button
    class="favbtn"
    onclick="
     event.stopPropagation();
     abrirEquipaPorId(
      '${esc(idCasa)}',
      '${esc(nomeCasa)}',
      '${esc(jogo.__liga)}',
      '${esc(logoCasa)}'
     )
    "
   >
    🏠 ${esc(nomeCasa)}
   </button>


   <button
    class="favbtn"
    onclick="
     event.stopPropagation();
     abrirEquipaPorId(
      '${esc(idFora)}',
      '${esc(nomeFora)}',
      '${esc(jogo.__liga)}',
      '${esc(logoFora)}'
     )
    "
   >
    🏠 ${esc(nomeFora)}
   </button>

  </div>

 </div>

 `;

}


/* =========================
   JOGOS
========================= */

function mostrarJogos(){

 document
  .getElementById("navJogos")
  .classList.add("active");

 document
  .getElementById("navTabelas")
  .classList.remove("active");

 document
  .getElementById("navFav")
  .classList.remove("active");


 let lista=
  jogos.filter(passaFiltro);


 document
  .getElementById("app")
  .innerHTML=`

  <div class="section">
   ⚽ Jogos
  </div>

  ${filtros()}

  <div class="small">

   ${
    ultimaAtualizacao
    ?
    "Atualizado "+
    ultimaAtualizacao
     .toLocaleTimeString("pt-PT")
    :
    ""
   }

  </div>


  ${
   lista.length

   ?

   lista
    .sort(function(a,b){

     return(
      new Date(
       dataJogo(a)
      )
      -
      new Date(
       dataJogo(b)
      )
     );

    })
    .map(cardJogo)
    .join("")

   :

   `

    <div class="card">

     <div class="empty">
      Sem jogos para este filtro.
     </div>

    </div>

   `

  }

 `;

}


/* =========================
   TABELAS
========================= */

async function mostrarTabelas(){

 document
  .getElementById("navJogos")
  .classList.remove("active");

 document
  .getElementById("navTabelas")
  .classList.add("active");

 document
  .getElementById("navFav")
  .classList.remove("active");


 document
  .getElementById("app")
  .innerHTML=`

  <div class="section">
   📊 Tabelas
  </div>

  <div class="filters">

   ${
    ligas.map(function(l){

     return`

      <button
       onclick="
        carregarTabela(
         '${l.nome}',
         '${l.arquivo.replace(
          ".json",
          "-classificacao.json"
         )}'
        )
       "
      >
       ${l.nome}
      </button>

     `;

    }).join("")
   }

  </div>


  <div
   id="tabela"
   class="card"
  >

   <div class="empty">
    Escolhe uma liga.
   </div>

  </div>

 `;

}


async function carregarTabela(
 nome,
 arquivo
){

 let el=
  document.getElementById(
   "tabela"
  );


 el.innerHTML=`

  <div class="empty">
   A carregar...
  </div>

 `;


 try{

  let resposta=
   await fetch(
    arquivo+
    "?v="+Date.now()
   );


  if(!resposta.ok)
   throw new Error();


  let dados=
   await resposta.json();


  let lista=
   Array.isArray(dados)
   ?
   dados
   :
   (
    dados.standings ||
    dados.children ||
    dados.classificacao ||
    dados.table ||
    []
   );


  if(
   lista.length &&
   lista[0].entries
  ){

   lista=
    lista[0].entries;

  }


  el.innerHTML=`

   <h3>
    ${esc(nome)}
   </h3>

   <table>

    <tr>
     <th>#</th>
     <th>Equipa</th>
     <th>J</th>
     <th>V</th>
     <th>E</th>
     <th>D</th>
     <th>Pts</th>
    </tr>

    ${
     lista.map(function(x,i){

      let equipa=
       x.team ||
       x.equipa ||
       x;

      let stats=
       x.stats ||
       [];

      function stat(nome){

       let s=
        stats.find(function(a){

         return(
          a.name===nome ||
          a.type===nome
         );

        });

       return s?.value ??
              s?.displayValue ??
              0;

      }


      return`

       <tr>

        <td>
         ${
          x.position ||
          x.rank ||
          i+1
         }
        </td>

        <td>
         ${esc(
          nomeEquipa(equipa)
         )}
        </td>

        <td>
         ${
          x.played ??
          stat("gamesPlayed") ??
          0
         }
        </td>

        <td>
         ${
          x.wins ??
          x.won ??
          stat("wins") ??
          0
         }
        </td>

        <td>
         ${
          x.ties ??
          x.draw ??
          stat("ties") ??
          0
         }
        </td>

        <td>
         ${
          x.losses ??
          x.lost ??
          stat("losses") ??
          0
         }
        </td>

        <td>
         <b>
          ${
           x.points ??
           stat("points") ??
           0
          }
         </b>
        </td>

       </tr>

      `;

     }).join("")
    }

   </table>

  `;


 }catch(e){

  el.innerHTML=`

   <div class="empty error">
    Não foi possível carregar
    a classificação.
   </div>

  `;

 }

}


/* =========================
   FAVORITOS
========================= */

function mostrarFavoritos(){

 document
  .getElementById("navJogos")
  .classList.remove("active");

 document
  .getElementById("navTabelas")
  .classList.remove("active");

 document
  .getElementById("navFav")
  .classList.add("active");


 let lista=
  obterFavoritos();


 document
  .getElementById("app")
  .innerHTML=`

  <div class="section">
   ⭐ Favoritos
  </div>


  ${
   lista.length

   ?

   lista.map(function(x){

    return`

     <div class="card">

      <div class="teamhead">

       ${
        x.logo
        ?
        `<img
          class="logo"
          src="${esc(x.logo)}"
          onerror="
           this.style.display='none'
          "
        >`
        :
        ""
       }


       <div>

        <h2>
         ${esc(x.name)}
        </h2>

        <div class="small">
         ${esc(x.league)}
        </div>

       </div>


       <button
        class="star"
        onclick="
         alternarFavorito(
          '${esc(x.id)}'
         )
        "
       >
        ⭐
       </button>

      </div>

     </div>

    `;

   }).join("")

   :

   `

    <div class="card">

     <div class="empty">

      Ainda não tens equipas favoritas.

      <br><br>

      Abre uma equipa nos jogos
      e carrega na estrela ⭐.

     </div>

    </div>

   `

  }

 `;

}


/* =========================
   EQUIPA
========================= */

function mostrarEquipa(){

 let e=
  equipaAtual;


 let favorito=
  eFavorito(e.id);


 let relacionados=
  jogos.filter(function(jogo){

   let casa=
    obterEquipa(
     jogo,
     true
    );

   let fora=
    obterEquipa(
     jogo,
     false
    );


   return(

    String(
     idEquipa(casa)
    )===
    String(e.id)

    ||

    String(
     idEquipa(fora)
    )===
    String(e.id)

    ||

    nomeEquipa(casa)===
    e.name

    ||

    nomeEquipa(fora)===
    e.name

   );

  });


 document
  .getElementById("app")
  .innerHTML=`

  <button
   class="back"
   onclick="mostrarJogos()"
  >
   ← Voltar
  </button>


  <div class="card">

   <div class="teamhead">

    ${
     e.logo
     ?
     `<img
       class="logo"
       src="${esc(e.logo)}"
      >`
     :
     ""
    }


    <div>

     <h2>
      ${esc(e.name)}
     </h2>

     <div class="small">
      ${esc(e.league)}
     </div>

    </div>


    <button
     class="star"
     onclick="
      alternarFavorito(
       '${esc(e.id)}',
       '${esc(e.name)}',
       '${esc(e.league)}',
       '${esc(e.logo)}'
      )
     "
    >
     ${favorito?"⭐":"☆"}
    </button>

   </div>

  </div>


  <div class="section">
   Jogos da equipa
  </div>


  ${
   relacionados.length

   ?

   relacionados
    .map(cardJogo)
    .join("")

   :

   `

    <div class="card">

     <div class="empty">
      Sem jogos encontrados.
     </div>

    </div>

   `

  }

 `;

}


/* =========================
   ARRANQUE
========================= */

carregar();


if(!intervaloLive){

 intervaloLive=
  setInterval(
   carregar,
   60000
  );

}

</script>

</body>
</html>
