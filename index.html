<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#07111f;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}

header{
 background:#07111f;
 border-bottom:1px solid #1b3048;
 padding:15px
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:26px;
 font-weight:900
}

.logo span{color:#20e878}

.refresh{
 background:#122238;
 color:white;
 border:1px solid #29405a;
 border-radius:10px;
 padding:9px 12px
}

.container{
 max-width:700px;
 margin:auto;
 padding:15px
}

.tabs,.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:10px
}

.tabs button,.filters button{
 border:0;
 border-radius:20px;
 padding:9px 14px;
 white-space:nowrap;
 background:#122238;
 color:#b9c7d8
}

.tabs button.active,.filters button.active{
 background:#20e878;
 color:#06111d;
 font-weight:bold
}

.card{
 background:#0d1b2c;
 border:1px solid #1b3048;
 border-radius:15px;
 margin-bottom:12px;
 padding:15px
}

.match-date{
 color:#8192a7;
 font-size:12px;
 display:flex;
 justify-content:space-between;
 margin-bottom:14px
}

.teams{
 display:grid;
 grid-template-columns:1fr 70px 1fr;
 align-items:center;
 gap:8px
}

.team{
 text-align:center
}

.team img{
 width:45px;
 height:45px;
 object-fit:contain;
 display:block;
 margin:auto auto 7px
}

.team button{
 background:none;
 border:0;
 color:white;
 font-weight:bold;
 font-size:14px
}

.score{
 text-align:center;
 font-size:21px;
 font-weight:bold
}

.status{
 font-size:11px;
 color:#8192a7;
 margin-top:5px
}

.live{
 color:#ff4757!important;
 font-weight:bold
}

.title{
 font-size:20px;
 font-weight:bold;
 margin:10px 0 12px
}

.table-row{
 display:grid;
 grid-template-columns:32px 1fr 45px;
 align-items:center;
 gap:8px;
 padding:11px 0;
 border-bottom:1px solid #1b3048
}

.table-row:last-child{
 border-bottom:0
}

.table-team{
 display:flex;
 align-items:center;
 gap:8px;
 background:none;
 border:0;
 color:white;
 font-weight:bold;
 text-align:left
}

.table-team img{
 width:30px;
 height:30px;
 object-fit:contain
}

.empty{
 text-align:center;
 color:#8192a7;
 padding:35px 10px
}

.page{display:none}
.page.active{display:block}

.back{
 background:#122238;
 color:white;
 border:0;
 border-radius:10px;
 padding:10px 14px;
 margin-bottom:12px
}

.team-header{
 background:#0d1b2c;
 border:1px solid #1b3048;
 border-radius:16px;
 text-align:center;
 padding:22px 15px;
 margin-bottom:15px
}

.team-header img{
 width:85px;
 height:85px;
 object-fit:contain
}

.team-header h1{
 margin:10px 0 5px
}

.team-header p{
 color:#8192a7
}

.star{
 margin-top:12px;
 padding:10px 16px;
 border-radius:10px;
 border:1px solid #29405a;
 background:#122238;
 color:white
}

.star.active{
 background:#20e878;
 color:#06111d
}

.mini{
 background:#0d1b2c;
 border:1px solid #1b3048;
 border-radius:14px;
 padding:13px;
 margin-bottom:10px
}

.mini-date{
 color:#8192a7;
 font-size:12px;
 margin-bottom:10px
}

.mini-teams{
 display:grid;
 grid-template-columns:1fr 50px 1fr;
 text-align:center;
 align-items:center
}

.mini img{
 width:32px;
 height:32px;
 object-fit:contain;
 display:block;
 margin:auto auto 5px
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:70px;
 background:#091625;
 border-top:1px solid #1b3048;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:50
}

nav button{
 background:none;
 border:0;
 color:#8192a7;
 font-size:11px
}

nav button.active{
 color:#20e878
}

nav span{
 display:block;
 margin-top:4px
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo">FUT<span>ZONE</span></div>
<button class="refresh" onclick="location.reload()">↻</button>
</div>
</header>

<div class="container">

<!-- INÍCIO -->
<section id="inicio" class="page active">

<div class="tabs">

<button class="active" onclick="liga('por',this)">🇵🇹 Portugal</button>
<button onclick="liga('eng',this)">🏴 Inglaterra</button>
<button onclick="liga('esp',this)">🇪🇸 Espanha</button>
<button onclick="liga('ita',this)">🇮🇹 Itália</button>
<button onclick="liga('ger',this)">🇩🇪 Alemanha</button>

</div>

<div class="filters">

<button class="active" onclick="filtro('todos',this)">Todos</button>
<button onclick="filtro('live',this)">🔴 LIVE</button>
<button onclick="filtro('proximos',this)">🕐 Próximos</button>
<button onclick="filtro('resultados',this)">✅ Resultados</button>

</div>

<div id="jogos"></div>

</section>


<!-- TABELA -->
<section id="tabelaPage" class="page">

<div class="title">🏆 Classificação</div>

<div class="card" id="tabela"></div>

</section>


<!-- FAVORITOS -->
<section id="favoritosPage" class="page">

<div class="title">⭐ Favoritos</div>

<div id="favoritos"></div>

</section>


<!-- EQUIPA -->
<section id="equipaPage" class="page">

<button class="back" onclick="inicio()">← Voltar</button>

<div id="equipa"></div>

</section>

</div>


<nav>

<button id="navInicio" class="active" onclick="inicio()">
🏠
<span>Início</span>
</button>

<button onclick="inicio()">
⚽
<span>Jogos</span>
</button>

<button onclick="abrirTabela()">
🏆
<span>Tabela</span>
</button>

<button onclick="abrirFavoritos()">
⭐
<span>Favoritos</span>
</button>

</nav>


<script>

const ligas={
 por:{
  nome:"Primeira Liga",
  jogos:"data/primeira-liga.json",
  tabela:"data/classificacao.json"
 },
 eng:{
  nome:"Premier League",
  jogos:"data/premier-league.json",
  tabela:"data/premier-league-classificacao.json"
 },
 esp:{
  nome:"La Liga",
  jogos:"data/la-liga.json",
  tabela:"data/la-liga-classificacao.json"
 },
 ita:{
  nome:"Serie A",
  jogos:"data/serie-a.json",
  tabela:"data/serie-a-classificacao.json"
 },
 ger:{
  nome:"Bundesliga",
  jogos:"data/bundesliga.json",
  tabela:"data/bundesliga-classificacao.json"
 }
};

let ligaAtual="por";
let filtroAtual="todos";
let jogos={};
let tabelas={};
let equipaAtual=null;

let favoritos=JSON.parse(
 localStorage.getItem("futzone_favoritos")||"[]"
);


function eventos(data){

 if(!data)return[];

 if(Array.isArray(data))return data;

 if(Array.isArray(data.events))return data.events;

 return [];
}


function comp(e){
 return e?.competitions?.[0]||{};
}


function equipas(e){

 let c=comp(e).competitors||[];

 return{
  casa:c.find(x=>x.homeAway==="home")||c[0],
  fora:c.find(x=>x.homeAway==="away")||c[1]
 };
}


function nome(t){

 return t?.team?.displayName||
 t?.team?.name||
 t?.displayName||
 t?.name||
 "Equipa";
}


function logo(t){

 return t?.team?.logo||
 t?.team?.logos?.[0]?.href||
 t?.logo||
 "";
}


function score(t){

 if(t?.score===undefined)return"-";

 if(typeof t.score==="object")
 return t.score.displayValue||t.score.value||"-";

 return t.score;
}


function estado(e){

 return e?.status?.type?.state||"";
}


function detalhe(e){

 return e?.status?.type?.shortDetail||
 e?.status?.type?.detail||
 "";
}


function data(e){

 if(!e?.date)return"";

 let d=new Date(e.date);

 return d.toLocaleDateString(
 "pt-PT",
 {day:"2-digit",month:"2-digit"}
 )+
 " "+
 d.toLocaleTimeString(
 "pt-PT",
 {hour:"2-digit",minute:"2-digit"}
 );
}


async function carregar(){

 try{

  for(let id in ligas){

   let l=ligas[id];

   let r1=await fetch(
    l.jogos+"?v="+Date.now()
   );

   let r2=await fetch(
    l.tabela+"?v="+Date.now()
   );

   jogos[id]=await r1.json();
   tabelas[id]=await r2.json();

  }

  mostrarJogos();

 }catch(e){

  document.getElementById("jogos").innerHTML=
  '<div class="empty">Erro ao carregar os dados.</div>';

 }

}


function liga(id,btn){

 ligaAtual=id;

 document.querySelectorAll(".tabs button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 mostrarJogos();

}


function filtro(id,btn){

 filtroAtual=id;

 document.querySelectorAll(".filters button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 mostrarJogos();

}


function mostrarJogos(){

 let lista=eventos(jogos[ligaAtual]);

 lista=lista.filter(e=>{

  if(filtroAtual==="live")
   return estado(e)==="in";

  if(filtroAtual==="resultados")
   return estado(e)==="post";

  if(filtroAtual==="proximos")
   return estado(e)!=="in"&&estado(e)!=="post";

  return true;

 });

 if(!lista.length){

  document.getElementById("jogos").innerHTML=
  '<div class="empty">Não há jogos para mostrar.</div>';

  return;
 }

 document.getElementById("jogos").innerHTML=
 lista.map(jogoHTML).join("");

}


function jogoHTML(e){

 let x=equipas(e);

 if(!x.casa||!x.fora)return"";

 let nc=nome(x.casa);
 let nf=nome(x.fora);

 let lc=logo(x.casa);
 let lf=logo(x.fora);

 let live=estado(e)==="in";
 let final=estado(e)==="post";

 let st=live
 ?"🔴 LIVE"
 :final
 ?"Final"
 :detalhe(e)||"Próximo";

 return`

 <div class="card">

  <div class="match-date">
   <span>${ligas[ligaAtual].nome}</span>
   <span>${data(e)}</span>
  </div>

  <div class="teams">

   <div class="team">

    ${lc?`<img src="${lc}">`:""}

    <button onclick="abrirEquipa('${esc(nc)}','${esc(lc)}')">
     ${nc}
    </button>

   </div>

   <div class="score">

    ${score(x.casa)} - ${score(x.fora)}

    <div class="status ${live?'live':''}">
     ${st}
    </div>

   </div>

   <div class="team">

    ${lf?`<img src="${lf}">`:""}

    <button onclick="abrirEquipa('${esc(nf)}','${esc(lf)}')">
     ${nf}
    </button>

   </div>

  </div>

 </div>

 `;

}


function esc(s){

 return String(s||"")
 .replace(/\\/g,"\\\\")
 .replace(/'/g,"\\'");

}


function extrairTabela(d){

 if(!d)return[];

 if(Array.isArray(d.entries))
 return d.entries;

 if(Array.isArray(d.standings?.entries))
 return d.standings.entries;

 if(Array.isArray(d.children)){

  let a=[];

  d.children.forEach(c=>{

   if(Array.isArray(c.entries))
   a=a.concat(c.entries);

   if(Array.isArray(c.standings?.entries))
   a=a.concat(c.standings.entries);

  });

  return a;

 }

 return[];

}


function stat(e,names){

 let a=e?.stats||[];

 for(let n of names){

  let s=a.find(x=>
   x.name===n||
   x.abbreviation===n||
   x.shortDisplayName===n
  );

  if(s)
  return s.displayValue??s.value??"-";

 }

 return"-";

}


function pontos(e){

 if(e?.points!==undefined)return e.points;

 return stat(e,["points","PTS","P"]);

}


function mostrarTabela(){

 let a=extrairTabela(tabelas[ligaAtual]);

 if(!a.length){

  document.getElementById("tabela").innerHTML=
  '<div class="empty">Classificação indisponível.</div>';

  return;

 }

 document.getElementById("tabela").innerHTML=
 a.map((e,i)=>{

  let n=nome(e);
  let l=logo(e);

  return`

  <div class="table-row">

   <strong>${i+1}</strong>

   <button class="table-team"
    onclick="abrirEquipa('${esc(n)}','${esc(l)}')">

    ${l?`<img src="${l}">`:""}

    <span>${n}</span>

   </button>

   <strong>${pontos(e)}</strong>

  </div>

  `;

 }).join("");

}


function abrirTabela(){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("tabelaPage")
 .classList.add("active");

 mostrarTabela();

}


function estaFavorito(n){

 return favoritos.some(x=>x.nome===n);

}


function alternarFavorito(){

 let n=equipaAtual.nome;
 let l=equipaAtual.logo;

 if(estaFavorito(n)){

  favoritos=favoritos.filter(x=>x.nome!==n);

 }else{

  favoritos.push({
   nome:n,
   logo:l
  });

 }

 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(favoritos)
 );

 mostrarEquipa();

}


function abrirFavoritos(){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("favoritosPage")
 .classList.add("active");

 let el=document.getElementById("favoritos");

 if(!favoritos.length){

  el.innerHTML=
  '<div class="empty">Ainda não tens equipas favoritas.</div>';

  return;

 }

 el.innerHTML=favoritos.map(f=>`

  <div class="card">

   <button class="table-team"
    onclick="abrirEquipa('${esc(f.nome)}','${esc(f.logo)}')">

    ${f.logo?`<img src="${f.logo}">`:""}

    <span>${f.nome}</span>

   </button>

  </div>

 `).join("");

}


function abrirEquipa(n,l){

 equipaAtual={
  nome:n,
  logo:l
 };

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("equipaPage")
 .classList.add("active");

 mostrarEquipa();

}


function procurarJogos(n){

 let resultado=[];

 for(let id in jogos){

  for(let e of eventos(jogos[id])){

   let x=equipas(e);

   if(!x.casa||!x.fora)continue;

   let a=nome(x.casa).toLowerCase();
   let b=nome(x.fora).toLowerCase();
   let q=n.toLowerCase();

   if(a===q||b===q){

    resultado.push(e);

   }

  }

 }

 return resultado;

}


function encontrarTabela(n){

 for(let id in tabelas){

  let a=extrairTabela(tabelas[id]);

  let e=a.find(x=>
   nome(x).toLowerCase()===n.toLowerCase()
  );

  if(e)
  return{
   entry:e,
   liga:id
  };

 }

 return null;

}


function mostrarEquipa(){

 let n=equipaAtual.nome;
 let l=equipaAtual.logo;

 let jogosEquipa=procurarJogos(n);
 let tab=encontrarTabela(n);

 let pos="—";
 let pts="—";
 let ligaNome="";

 if(tab){

  let a=extrairTabela(
   tabelas[tab.liga]
  );

  let index=a.findIndex(x=>
   nome(x).toLowerCase()===n.toLowerCase()
  );

  if(index>=0)
   pos=index+1;

  pts=pontos(tab.entry);
  ligaNome=ligas[tab.liga].nome;

 }

 let html=`

 <div class="team-header">

  ${l?`<img src="${l}">`:""}

  <h1>${n}</h1>

  ${ligaNome?`<p>${ligaNome}</p>`:""}

  <button
   class="star ${estaFavorito(n)?'active':''}"
   onclick="alternarFavorito()">

   ${estaFavorito(n)
    ?"⭐ Favorito"
    :"☆ Adicionar aos favoritos"}

  </button>

 </div>

 <div class="card">

  <div class="table-row">

   <strong>🏆</strong>

   <span>Classificação</span>

   <strong>${pos}º</strong>

  </div>

  <div class="table-row">

   <strong>⭐</strong>

   <span>Pontos</span>

   <strong>${pts}</strong>

  </div>

 </div>

 <div class="title">
  ⚽ Jogos da equipa
 </div>

 `;

 if(!jogosEquipa.length){

  html+=`
  <div class="empty">
   Não há jogos disponíveis neste momento.
  </div>
  `;

 }else{

  html+=jogosEquipa
  .map(miniJogo)
  .join("");

 }

 document.getElementById("equipa").innerHTML=html;

}


function miniJogo(e){

 let x=equipas(e);

 if(!x.casa||!x.fora)return"";

 let live=estado(e)==="in";
 let final=estado(e)==="post";

 return`

 <div class="mini">

  <div class="mini-date">
   ${data(e)}
   ·
   ${live?"🔴 LIVE":final?"Final":"Próximo"}
  </div>

  <div class="mini-teams">

   <div>

    ${logo(x.casa)?
    `<img src="${logo(x.casa)}">`
    :""}

    ${nome(x.casa)}

   </div>

   <strong>

    ${score(x.casa)}
    -
    ${score(x.fora)}

   </strong>

   <div>

    ${logo(x.fora)?
    `<img src="${logo(x.fora)}">`
    :""}

    ${nome(x.fora)}

   </div>

  </div>

 </div>

 `;

}


function inicio(){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("inicio")
 .classList.add("active");

}


carregar();

</script>

</body>
</html>
