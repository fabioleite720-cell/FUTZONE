<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061a40">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#111827;
}
header{
  background:#061a40;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-size:27px;
  font-weight:900;
}
.logo span{color:#18c964}
.subtitle{
  font-size:12px;
  opacity:.75;
  margin-top:3px;
}
.container{
  max-width:800px;
  margin:auto;
  padding:15px 12px 90px;
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}
.tab{
  border:0;
  background:white;
  padding:10px 14px;
  border-radius:20px;
  font-weight:bold;
  white-space:nowrap;
}
.tab.active{
  background:#061a40;
  color:white;
}
.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 12px #0000000d;
}
.league{
  font-weight:800;
  font-size:17px;
  margin-bottom:12px;
}
.match{
  border-top:1px solid #eee;
  padding:13px 0;
}
.teams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.team{
  width:40%;
  text-align:center;
  font-weight:700;
  font-size:13px;
}
.team img{
  width:38px;
  height:38px;
  object-fit:contain;
  display:block;
  margin:0 auto 6px;
}
.score{
  font-size:21px;
  font-weight:900;
  min-width:55px;
  text-align:center;
}
.status{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  margin-top:6px;
}
.loading{
  text-align:center;
  padding:35px;
  color:#6b7280;
}
.error{
  background:#fff1f2;
  color:#be123c;
  padding:15px;
  border-radius:12px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:9px 5px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th:first-child,td:first-child,
th:nth-child(2),td:nth-child(2){
  text-align:left;
}
.pos{font-weight:bold}
.teamtable{
  display:flex;
  align-items:center;
  gap:7px;
}
.teamtable img{
  width:25px;
  height:25px;
  object-fit:contain;
}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
  font-size:15px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}
.bottom button{
  border:0;
  background:none;
  font-size:11px;
  color:#6b7280;
}
.bottom button.active{
  color:#061a40;
  font-weight:bold;
}
.icon{font-size:21px;display:block}
.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
.refresh{
  float:right;
  background:#18c964;
  border:0;
  color:white;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <button class="refresh" onclick="carregarTudo()">↻</button>
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="subtitle">Futebol em direto</div>
</header>

<div class="container">

  <div class="tabs" id="ligasTabs"></div>

  <div id="conteudo">
    <div class="loading">A carregar FUTZONE...</div>
  </div>

</div>

<nav class="bottom">
  <button id="navInicio" class="active" onclick="pagina('inicio')">
    <span class="icon">🏠</span>Início
  </button>

  <button id="navJogos" onclick="pagina('jogos')">
    <span class="icon">⚽</span>Jogos
  </button>

  <button id="navTabela" onclick="pagina('tabela')">
    <span class="icon">📊</span>Tabela
  </button>

  <button id="navFav" onclick="pagina('favoritos')">
    <span class="icon">⭐</span>Favoritos
  </button>
</nav>

<script>

const ligas = {
  portugal:{
    nome:"🇵🇹 Primeira Liga",
    jogos:"data/primeira-liga.json",
    tabela:"data/classificacao.json"
  },
  inglaterra:{
    nome:"🏴 Premier League",
    jogos:"data/premier-league.json",
    tabela:"data/premier-league-classificacao.json"
  },
  espanha:{
    nome:"🇪🇸 La Liga",
    jogos:"data/la-liga.json",
    tabela:"data/la-liga-classificacao.json"
  },
  italia:{
    nome:"🇮🇹 Serie A",
    jogos:"data/serie-a.json",
    tabela:"data/serie-a-classificacao.json"
  },
  alemanha:{
    nome:"🇩🇪 Bundesliga",
    jogos:"data/bundesliga.json",
    tabela:"data/bundesliga-classificacao.json"
  }
};

let dadosJogos={};
let dadosTabelas={};
let ligaAtual="portugal";
let paginaAtual="inicio";

const favoritos =
  JSON.parse(localStorage.getItem("futzone_favoritos") || "[]");

function guardarFavoritos(){
  localStorage.setItem(
    "futzone_favoritos",
    JSON.stringify(favoritos)
  );
}

function normalizarNome(nome){
  return (nome || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function obterEventos(json){

  if(!json) return [];

  if(Array.isArray(json)) return json;

  if(Array.isArray(json.events))
    return json.events;

  if(Array.isArray(json.data))
    return json.data;

  if(json.data && Array.isArray(json.data.events))
    return json.data.events;

  if(Array.isArray(json.matches))
    return json.matches;

  return [];
}

function obterCompeticao(evento){

  try{
    return evento.competitions?.[0];
  }catch(e){
    return null;
  }
}

function obterEquipas(evento){

  const comp=obterCompeticao(evento);

  if(comp && comp.competitors){

    const home=comp.competitors.find(
      x=>x.homeAway==="home"
    );

    const away=comp.competitors.find(
      x=>x.homeAway==="away"
    );

    return {
      home:home?.team || {},
      away:away?.team || {},
      homeScore:home?.score ?? "-",
      awayScore:away?.score ?? "-",
      status:evento.status?.type?.shortDetail ||
             evento.status?.type?.detail ||
             evento.status?.type?.description ||
             ""
    };
  }

  return {
    home:evento.home_team || {},
    away:evento.away_team || {},
    homeScore:evento.score?.home ?? "-",
    awayScore:evento.score?.away ?? "-",
    status:evento.status || ""
  };
}

function nomeEquipa(equipe){
  return equipe?.displayName ||
         equipe?.shortDisplayName ||
         equipe?.name ||
         equipe?.team_name ||
         "Equipa";
}

function logoEquipa(equipe){

  return equipe?.logo ||
         equipe?.logos?.[0]?.href ||
         "";
}

function formatarData(data){

  if(!data) return "";

  const d=new Date(data);

  if(isNaN(d)) return "";

  return d.toLocaleString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function favoritado(nome){

  return favoritos.includes(normalizarNome(nome));
}

function alternarFavorito(nome){

  const n=normalizarNome(nome);

  const pos=favoritos.indexOf(n);

  if(pos>=0)
    favoritos.splice(pos,1);
  else
    favoritos.push(n);

  guardarFavoritos();

  renderizar();
}

async function carregarJSON(url){

  const resposta=await fetch(
    url+"?t="+Date.now()
  );

  if(!resposta.ok)
    throw new Error("Erro "+resposta.status);

  return await resposta.json();
}

async function carregarTudo(){

  document.getElementById("conteudo").innerHTML =
    `<div class="loading">⚽ A atualizar dados...</div>`;

  try{

    for(const chave of Object.keys(ligas)){

      const liga=ligas[chave];

      try{
        dadosJogos[chave]=await carregarJSON(liga.jogos);
      }catch(e){
        dadosJogos[chave]={events:[]};
      }

      try{
        dadosTabelas[chave]=await carregarJSON(liga.tabela);
      }catch(e){
        dadosTabelas[chave]={};
      }
    }

    criarTabs();
    renderizar();

  }catch(e){

    document.getElementById("conteudo").innerHTML=
      `<div class="error">
        Não foi possível carregar os dados.
        <br><br>
        Tenta carregar novamente.
      </div>`;
  }
}

function criarTabs(){

  const el=document.getElementById("ligasTabs");

  el.innerHTML="";

  Object.keys(ligas).forEach(chave=>{

    const b=document.createElement("button");

    b.className=
      "tab "+(chave===ligaAtual?"active":"");

    b.textContent=ligas[chave].nome;

    b.onclick=()=>{

      ligaAtual=chave;
      paginaAtual="inicio";

      document.querySelectorAll(".bottom button")
        .forEach(x=>x.classList.remove("active"));

      document
        .getElementById("navInicio")
        .classList.add("active");

      criarTabs();
      renderizar();
    };

    el.appendChild(b);
  });
}

function renderizar(){

  if(paginaAtual==="inicio")
    renderInicio();

  if(paginaAtual==="jogos")
    renderJogos();

  if(paginaAtual==="tabela")
    renderTabela();

  if(paginaAtual==="favoritos")
    renderFavoritos();
}

function renderInicio(){

  const nome=ligas[ligaAtual].nome;

  const eventos=obterEventos(
    dadosJogos[ligaAtual]
  );

  let html=`
    <div class="card">
      <div class="league">${nome}</div>
      <div style="font-size:13px;color:#777">
        Jogos disponíveis
      </div>
    </div>
  `;

  if(!eventos.length){

    html+=`
      <div class="card empty">
        ⚽ Não existem jogos disponíveis neste momento.
      </div>
    `;

  }else{

    html+=`
      <div class="card">
        <div class="league">⚽ Jogos</div>
        ${eventos.slice(0,20).map(criarJogo).join("")}
      </div>
    `;
  }

  document.getElementById("conteudo").innerHTML=html;
}

function criarJogo(evento){

  const eq=obterEquipas(evento);

  const home=nomeEquipa(eq.home);
  const away=nomeEquipa(eq.away);

  const favHome=favoritado(home);
  const favAway=favoritado(away);

  return `
    <div class="match">

      <div class="teams">

        <div class="team"
             onclick="alternarFavorito('${home.replace(/'/g,"")}')">

          ${
            logoEquipa(eq.home)
            ? `<img src="${logoEquipa(eq.home)}"
                    onerror="this.style.display='none'">`
            : "⚽"
          }

          ${home}
          <div>${favHome?"⭐":"☆"}</div>
        </div>

        <div class="score">
          ${eq.homeScore} - ${eq.awayScore}
        </div>

        <div class="team"
             onclick="alternarFavorito('${away.replace(/'/g,"")}')">

          ${
            logoEquipa(eq.away)
            ? `<img src="${logoEquipa(eq.away)}"
                    onerror="this.style.display='none'">`
            : "⚽"
          }

          ${away}
          <div>${favAway?"⭐":"☆"}</div>
        </div>

      </div>

      <div class="status">
        ${eq.status || formatarData(evento.date || evento.match_date)}
      </div>

    </div>
  `;
}

function renderJogos(){

  const eventos=obterEventos(
    dadosJogos[ligaAtual]
  );

  let html=`
    <div class="card">
      <div class="league">
        ⚽ ${ligas[ligaAtual].nome}
      </div>
  `;

  if(!eventos.length){

    html+=`
      <div class="empty">
        Não há jogos disponíveis.
      </div>
    `;

  }else{

    html+=eventos.map(criarJogo).join("");
  }

  html+="</div>";

  document.getElementById("conteudo").innerHTML=html;
}

function encontrarEntradasTabela(json){

  if(!json) return [];

  if(Array.isArray(json))
    return json;

  if(Array.isArray(json.entries))
    return json.entries;

  if(json.standings &&
     Array.isArray(json.standings.entries))
    return json.standings.entries;

  if(Array.isArray(json.standings))
    return json.standings;

  if(json.children){

    for(const child of json.children){

      if(child.standings &&
         Array.isArray(child.standings.entries))
        return child.standings.entries;
    }
  }

  if(json.data){

    if(Array.isArray(json.data))
      return json.data;

    if(Array.isArray(json.data.standings))
      return json.data.standings;
  }

  return [];
}

function obterStat(entrada,nome){

  const stat=
    entrada.stats?.find(
      s=>s.name===nome ||
         s.abbreviation===nome
    );

  return stat?.value ??
         stat?.displayValue ??
         entrada[nome] ??
         "-";
}

function obterTeamTabela(entrada){

  return entrada.team ||
         entrada.teamData ||
         {};
}

function renderTabela(){

  const entradas=encontrarEntradasTabela(
    dadosTabelas[ligaAtual]
  );

  let html=`
    <div class="card">

      <div class="league">
        📊 ${ligas[ligaAtual].nome}
      </div>

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Equipa</th>
            <th>J</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>Pts</th>
          </tr>
        </thead>

        <tbody>
  `;

  if(!entradas.length){

    html+=`
      <tr>
        <td colspan="7">
          Classificação indisponível.
        </td>
      </tr>
    `;

  }else{

    entradas
      .sort((a,b)=>{

        const pa=Number(
          obterStat(a,"rank") ||
          obterStat(a,"position") ||
          999
        );

        const pb=Number(
          obterStat(b,"rank") ||
          obterStat(b,"position") ||
          999
        );

        return pa-pb;
      })
      .forEach((entrada,i)=>{

        const team=obterTeamTabela(entrada);

        const nome=
          team.displayName ||
          team.shortDisplayName ||
          team.name ||
          team.team_name ||
          "Equipa";

        const logo=logoEquipa(team);

        const pos=
          obterStat(entrada,"rank") ||
          obterStat(entrada,"position") ||
          i+1;

        const jogos=
          obterStat(entrada,"gamesPlayed") ||
          obterStat(entrada,"played") ||
          obterStat(entrada,"GP");

        const vitorias=
          obterStat(entrada,"wins") ||
          obterStat(entrada,"won") ||
          obterStat(entrada,"W");

        const empates=
          obterStat(entrada,"ties") ||
          obterStat(entrada,"draws") ||
          obterStat(entrada,"E");

        const derrotas=
          obterStat(entrada,"losses") ||
          obterStat(entrada,"lost") ||
          obterStat(entrada,"D");

        const pontos=
          obterStat(entrada,"points") ||
          obterStat(entrada,"PTS");

        html+=`
          <tr>

            <td class="pos">${pos}</td>

            <td>
              <div class="teamtable">

                ${
                  logo
                  ? `<img src="${logo}"
                           onerror="this.style.display='none'">`
                  : "⚽"
                }

                <span>${nome}</span>

              </div>
            </td>

            <td>${jogos}</td>
            <td>${vitorias}</td>
            <td>${empates}</td>
            <td>${derrotas}</td>
            <td><b>${pontos}</b></td>

          </tr>
        `;
      });
  }

  html+=`
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("conteudo").innerHTML=html;
}

function renderFavoritos(){

  let html=`
    <div class="card">

      <div class="league">
        ⭐ Equipas favoritas
      </div>

      <input
        class="search"
        placeholder="🔎 Procurar equipa..."
        oninput="filtrarFavoritos(this.value)"
      >

      <div id="listaFav">
  `;

  if(!favoritos.length){

    html+=`
      <div class="empty">
        Ainda não tens equipas favoritas.
        <br><br>
        Toca numa equipa nos jogos para adicionar ⭐
      </div>
    `;

  }else{

    favoritos.forEach(nome=>{

      html+=`
        <div class="match favorito">
          ⚽ ${nome}
          <button
            onclick="alternarFavorito('${nome}')"
            style="float:right;border:0;background:none">
            ❌
          </button>
        </div>
      `;
    });
  }

  html+=`
      </div>
    </div>
  `;

  document.getElementById("conteudo").innerHTML=html;
}

function filtrarFavoritos(texto){

  const termo=normalizarNome(texto);

  document.querySelectorAll(".favorito")
    .forEach(el=>{

      el.style.display=
        el.textContent.toLowerCase()
          .includes(termo)
          ? "block"
          : "none";
    });
}

function pagina(nome){

  paginaAtual=nome;

  document.querySelectorAll(".bottom button")
    .forEach(x=>x.classList.remove("active"));

  if(nome==="inicio")
    document.getElementById("navInicio")
      .classList.add("active");

  if(nome==="jogos")
    document.getElementById("navJogos")
      .classList.add("active");

  if(nome==="tabela")
    document.getElementById("navTabela")
      .classList.add("active");

  if(nome==="favoritos")
    document.getElementById("navFav")
      .classList.add("active");

  renderizar();
}

carregarTudo();

</script>

</body>
</html>
