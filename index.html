<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2
   JOGOS + DATAS + TODAS AS LIGAS + AO VIVO + TABELAS
   ========================================================= */

const FZ_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const FZ_STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [
  { id:"por.1", name:"Liga Portugal", flag:"🇵🇹" },
  { id:"por.2", name:"Liga Portugal 2", flag:"🇵🇹" },
  { id:"por.3", name:"Liga 3", flag:"🇵🇹" },
  { id:"por.w.1", name:"Liga BPI Feminina", flag:"🇵🇹" },

  { id:"eng.1", name:"Premier League", flag:"🇬🇧" },
  { id:"eng.2", name:"Championship", flag:"🇬🇧" },

  { id:"esp.1", name:"LaLiga", flag:"🇪🇸" },
  { id:"esp.2", name:"LaLiga 2", flag:"🇪🇸" },

  { id:"ita.1", name:"Serie A", flag:"🇮🇹" },
  { id:"ita.2", name:"Serie B", flag:"🇮🇹" },

  { id:"ger.1", name:"Bundesliga", flag:"🇩🇪" },
  { id:"ger.2", name:"2. Bundesliga", flag:"🇩🇪" },

  { id:"fra.1", name:"Ligue 1", flag:"🇫🇷" },
  { id:"fra.2", name:"Ligue 2", flag:"🇫🇷" },

  { id:"ned.1", name:"Eredivisie", flag:"🇳🇱" },
  { id:"bel.1", name:"Belgian Pro League", flag:"🇧🇪" },

  { id:"ksa.1", name:"Saudi Pro League", flag:"🇸🇦" },
  { id:"usa.1", name:"MLS", flag:"🇺🇸" },

  { id:"uefa.champions", name:"Champions League", flag:"🏆" },
  { id:"uefa.europa", name:"Europa League", flag:"🏆" },
  { id:"uefa.europa.conf", name:"Conference League", flag:"🏆" }
];

/* =========================================================
   ESTADO
   ========================================================= */

let FZ_ligaSelecionada = "ALL";
let FZ_modo = "jogos";
let FZ_dataSelecionada = FZ_dataISO(new Date());
let FZ_aAtualizar = null;
let FZ_carregando = false;

/* =========================================================
   DATAS
   ========================================================= */

function FZ_dataISO(data = new Date()) {
  const d = new Date(data);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2,"0");
  const dia = String(d.getDate()).padStart(2,"0");
  return `${ano}-${mes}-${dia}`;
}

function FZ_dataAPI(iso) {
  return String(iso).replace(/-/g,"");
}

function FZ_dataObj(iso) {
  const [a,m,d] = iso.split("-").map(Number);
  return new Date(a,m-1,d);
}

function FZ_formatarData(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function FZ_dataCurta(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    day:"2-digit",
    month:"2-digit"
  });
}

function FZ_mudarData(dias) {
  const d = FZ_dataObj(FZ_dataSelecionada);
  d.setDate(d.getDate() + dias);

  FZ_dataSelecionada = FZ_dataISO(d);

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_irHoje() {
  FZ_dataSelecionada = FZ_dataISO(new Date());

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_dataEscolhida(valor) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return;

  FZ_dataSelecionada = valor;

  FZ_renderDataBarra();
  FZ_carregarModo();
}

/* =========================================================
   FETCH SEGURO
   ========================================================= */

async function FZ_fetch(url) {

  const controlador = new AbortController();

  const tempo = setTimeout(() => {
    controlador.abort();
  }, 15000);

  try {

    const resposta = await fetch(url, {
      method:"GET",
      cache:"no-store",
      signal:controlador.signal
    });

    if (!resposta.ok) {
      throw new Error("HTTP " + resposta.status);
    }

    return await resposta.json();

  } finally {
    clearTimeout(tempo);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */

function FZ_liga(id) {
  return FZ_LIGAS.find(l => l.id === id);
}

function FZ_nomeLiga(id) {
  const liga = FZ_liga(id);
  return liga ? `${liga.flag} ${liga.name}` : id;
}

function FZ_escape(valor) {
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function FZ_horaEvento(evento) {

  if (!evento.date) return "--:--";

  const d = new Date(evento.date);

  return d.toLocaleTimeString("pt-PT", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function FZ_dataEvento(evento) {

  if (!evento.date) return "";

  return FZ_dataISO(new Date(evento.date));
}

function FZ_nomeEquipa(team) {

  return (
    team?.displayName ||
    team?.shortDisplayName ||
    team?.name ||
    "Equipa"
  );
}

function FZ_logoEquipa(team) {

  return (
    team?.logo ||
    team?.logos?.[0]?.href ||
    ""
  );
}

/* =========================================================
   BARRA DE COMPETIÇÕES
   ========================================================= */

function FZ_renderCompeticoes() {

  const el = document.getElementById("competicoes");

  if (!el) return;

  let html = `
    <button
      class="league-chip ${FZ_ligaSelecionada === "ALL" ? "active" : ""}"
      data-liga="ALL">
      🌍 Todas
    </button>
  `;

  for (const liga of FZ_LIGAS) {

    html += `
      <button
        class="league-chip ${FZ_ligaSelecionada === liga.id ? "active" : ""}"
        data-liga="${liga.id}">
        ${liga.flag} ${FZ_escape(liga.name)}
      </button>
    `;
  }

  el.innerHTML = html;
}

function FZ_selecionarLiga(id) {

  FZ_ligaSelecionada = id;

  FZ_renderCompeticoes();

  if (FZ_modo === "tabelas" && id === "ALL") {
    FZ_carregarModo();
    return;
  }

  FZ_carregarModo();
}

/* =========================================================
   BARRA DE DATA
   ========================================================= */

function FZ_renderDataBarra() {

  let barra = document.getElementById("fzDataBar");

  if (!barra) {

    barra = document.createElement("div");

    barra.id = "fzDataBar";

    const conteudo = document.getElementById("conteudo");

    if (conteudo && conteudo.parentNode) {
      conteudo.parentNode.insertBefore(barra, conteudo);
    } else {
      document.body.appendChild(barra);
    }
  }

  const hoje = FZ_dataISO(new Date());

  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);

  const amanha = new Date();
  amanha.setDate(amanha.getDate() + 1);

  const ontemISO = FZ_dataISO(ontem);
  const amanhaISO = FZ_dataISO(amanha);

  barra.innerHTML = `
    <div style="
      background:#03060B;
      border:1px solid #722F37;
      border-radius:14px;
      padding:10px;
      margin:10px 0;
    ">

      <div style="
        display:flex;
        align-items:center;
        gap:6px;
      ">

        <button
          onclick="FZ_mudarData(-1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ‹
        </button>

        <button
          onclick="FZ_dataEscolhida('${ontemISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === ontemISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === ontemISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          ONTEM
          <br>
          <small>${FZ_dataCurta(ontemISO)}</small>
        </button>

        <button
          onclick="FZ_irHoje()"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === hoje ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === hoje ? "#0057B8" : "#0D1724"};
            color:white;
            font-weight:700;
          ">
          HOJE
          <br>
          <small>${FZ_dataCurta(hoje)}</small>
        </button>

        <button
          onclick="FZ_dataEscolhida('${amanhaISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === amanhaISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === amanhaISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          AMANHÃ
          <br>
          <small>${FZ_dataCurta(amanhaISO)}</small>
        </button>

        <button
          onclick="FZ_mudarData(1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ›
        </button>

      </div>

      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-top:9px;
      ">

        <input
          id="fzCalendar"
          type="date"
          value="${FZ_dataSelecionada}"
          onchange="FZ_dataEscolhida(this.value)"
          style="
            flex:1;
            min-height:42px;
            border-radius:10px;
            border:1px solid #333;
            background:#0D1724;
            color:white;
            padding:0 10px;
          "
        >

        <button
          onclick="FZ_carregarModo()"
          style="
            min-width:46px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#0057B8;
            color:white;
            font-size:20px;
          ">
          🔄
        </button>

      </div>

      <div style="
        text-align:center;
        color:#D9DEE8;
        font-size:13px;
        margin-top:8px;
        text-transform:capitalize;
      ">
        ${FZ_escape(FZ_formatarData(FZ_dataSelecionada))}
      </div>

    </div>
  `;
}

/* =========================================================
   ESTADO
   ========================================================= */

function FZ_estado(texto, erro=false) {

  const el = document.getElementById("estado");

  if (!el) return;

  el.innerHTML = `
    <div style="
      padding:10px;
      text-align:center;
      color:${erro ? "#FF4054" : "#9DAABB"};
      font-size:13px;
    ">
      ${FZ_escape(texto)}
    </div>
  `;
}

/* =========================================================
   CARD DE JOGO
   ========================================================= */

function FZ_cardJogo(evento, ligaId) {

  const comp = evento.competitions?.[0];

  const competitors = comp?.competitors || [];

  const casa =
    competitors.find(x => x.homeAway === "home") ||
    competitors[0];

  const fora =
    competitors.find(x => x.homeAway === "away") ||
    competitors[1];

  const casaNome = FZ_nomeEquipa(casa?.team);
  const foraNome = FZ_nomeEquipa(fora?.team);

  const casaLogo = FZ_logoEquipa(casa?.team);
  const foraLogo = FZ_logoEquipa(fora?.team);

  const status = evento.status?.type;

  const concluido =
    status?.completed === true ||
    status?.state === "post";

  const aoVivo =
    status?.state === "in" ||
    status?.name === "STATUS_IN_PROGRESS";

  let hora = FZ_horaEvento(evento);

  if (aoVivo) {
    hora = "🔴 AO VIVO";
  }

  if (concluido) {
    hora = "FINAL";
  }

  const scoreCasa =
    casa?.score ??
    "-";

  const scoreFora =
    fora?.score ??
    "-";

  const ligaNome = FZ_nomeLiga(ligaId);

  return `
    <div
      class="fz-game-card"
      style="
        background:#09111C;
        border:1px solid ${aoVivo ? "#722F37" : "#1B2635"};
        border-radius:15px;
        padding:12px;
        margin:8px 0;
        box-shadow:0 3px 12px rgba(0,0,0,.25);
      "
      onclick="FZ_abrirJogoSeguro('${FZ_escape(evento.id)}','${FZ_escape(ligaId)}')"
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:#9DAABB;
        font-size:11px;
        margin-bottom:10px;
      ">
        <span>${FZ_escape(ligaNome)}</span>
        <strong style="
          color:${aoVivo ? "#FF4054" : concluido ? "#9DAABB" : "#1683FF"};
        ">
          ${hora}
        </strong>
      </div>

      <div style="
        display:grid;
        grid-template-columns:1fr 55px 1fr;
        align-items:center;
        gap:6px;
      ">

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            casaLogo
            ? `<img src="${FZ_escape(casaLogo)}"
                    style="width:38px;height:38px;object-fit:contain;display:block;margin:auto auto 5px;">`
            : `<div style="height:43px;"></div>`
          }

          <div>${FZ_escape(casaNome)}</div>
        </div>

        <div style="
          text-align:center;
          font-size:20px;
          font-weight:900;
          color:white;
        ">
          ${scoreCasa}
          <br>
          <span style="font-size:12px;color:#9DAABB;">-</span>
          <br>
          ${scoreFora}
        </div>

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            foraLogo

/* =========================================================
   BUSCAR JOGOS DE UMA LIGA
   ========================================================= */

async function FZ_buscarJogosLiga(ligaId, dataISO) {

  const data = FZ_dataAPI(dataISO);

  const url =
    `${FZ_API}${ligaId}/scoreboard?dates=${data}`;

  const json = await FZ_fetch(url);

  const eventos = Array.isArray(json.events)
    ? json.events
    : [];

  return {
    ligaId,
    eventos
  };
}

/* =========================================================
   BUSCAR TODAS AS LIGAS
   ========================================================= */

async function FZ_buscarTodasAsLigas(dataISO) {

  const resultados = [];

  const tamanhoLote = 5;

  for (
    let inicio = 0;
    inicio < FZ_LIGAS.length;
    inicio += tamanhoLote
  ) {

    const lote = FZ_LIGAS.slice(
      inicio,
      inicio + tamanhoLote
    );

    const respostas = await Promise.allSettled(
      lote.map(liga =>
        FZ_buscarJogosLiga(liga.id,dataISO)
      )
    );

    respostas.forEach((r,i) => {

      if (r.status === "fulfilled") {

        resultados.push(r.value);

      } else {

        console.warn(
          "Falha ao carregar",
          lote[i].id,
          r.reason
        );

        resultados.push({
          ligaId:lote[i].id,
          eventos:[]
        });
      }
    });
  }

  return resultados;
}

      await FZ_buscarTodasAsLigas(

/* =========================================================
   STANDINGS — EXTRAIR ENTRIES
   ========================================================= */

function FZ_extrairEntries(obj) {

  const encontrados = [];
  const vistos = new Set();

  function procurar(valor) {

    if (!valor || typeof valor !== "object") {
      return;
    }

    if (Array.isArray(valor.entries)) {

      valor.entries.forEach(entry => {

        if (
          entry &&
          entry.team &&
          entry.team.id
        ) {

          if (!vistos.has(entry.team.id)) {

            vistos.add(entry.team.id);
            encontrados.push(entry);
          }
        }
      });
    }

    Object.keys(valor).forEach(chave => {

      const item = valor[chave];

      if (
        item &&
        typeof item === "object"
      ) {
        procurar(item);
      }
    });
  }

  procurar(obj);

  return encontrados;
}

/* =========================================================
   STAT DAS CLASSIFICAÇÕES
   ========================================================= */

function FZ_stat(entry,nome,alternativas=[]) {

  const nomes = [
    nome,
    ...alternativas
  ];

  const stats =
    Array.isArray(entry.stats)
      ? entry.stats
      : [];

  const stat =
    stats.find(s =>
      nomes.includes(s.name)
    );

  if (!stat) return "-";

  return (
    stat.displayValue ??
    stat.value ??
    "-"
  );
}

          padding:20px;
          color:white;
        ">

          <button
            onclick="FZ_carregarModo()"
            style="
              border:0;
              border-radius:9px;
              padding:9px 14px;
              background:#722F37;
              color:white;
            ">
            ← Voltar
          </button>

          <div style="text-align:center;margin-top:20px;">

            ${
              FZ_logoEquipa(team)
              ? `<img src="${FZ_escape(FZ_logoEquipa(team))}"
                      style="width:90px;height:90px;object-fit:contain;">`
              : ""
            }

            <h2>
              ${FZ_escape(FZ_nomeEquipa(team))}
            </h2>

          </div>

        </div>
      `;

    })
    .catch(() => {
      FZ_estado(
        "Não foi possível carregar a equipa.",
        true
      );
    });
}

/* =========================================================
   MODOS
   ========================================================= */

async function FZ_carregarModo() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();

  if (FZ_modo === "jogos") {
    await FZ_jogosDoDia();
    return;
  }

  if (FZ_modo === "jornadas") {
    await FZ_jornadas();
    return;
  }

  if (FZ_modo === "tabelas") {
    await FZ_carregarTabelas();
    return;
  }

  if (FZ_modo === "ao-vivo") {
    await FZ_aoVivo();
    return;
  }

  await FZ_jogosDoDia();
}

/* =========================================================
   MUDAR MODO
   ========================================================= */

function FZ_mudarModo(modo) {

  FZ_modo = modo;

  document
    .querySelectorAll("[data-modo]")
    .forEach(botao => {

      botao.classList.toggle(
        "active",
        botao.dataset.modo === modo
      );
    });

  FZ_carregarModo();
}

/* =========================================================
   CLIQUES
   ========================================================= */

document.addEventListener("click", function(event) {

  const liga =
    event.target.closest("[data-liga]");

  if (liga) {

    FZ_selecionarLiga(
      liga.dataset.liga
    );

    return;
  }

  const modo =
    event.target.closest("[data-modo]");

  if (modo) {

    const valor =
      modo.dataset.modo;

    if (valor === "aoVivo") {
      FZ_mudarModo("ao-vivo");
    } else {
      FZ_mudarModo(valor);
    }
  }
});

/* =========================================================
   AUTO REFRESH
   ========================================================= */

function FZ_configurarAtualizacao() {

  if (FZ_aAtualizar) {
    clearInterval(FZ_aAtualizar);
  }

  FZ_aAtualizar = setInterval(() => {

    const hoje =
      FZ_dataISO(new Date());

    if (
      FZ_dataSelecionada === hoje ||
      FZ_modo === "ao-vivo"
    ) {

      FZ_carregarModo();

    }

  }, FZ_modo === "ao-vivo" ? 30000 : 60000);
}

/* =========================================================
   INICIAR
   ========================================================= */

function FZ_iniciar() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();
  FZ_configurarAtualizacao();

  FZ_carregarModo();
}

window.FZ_dataEscolhida = FZ_dataEscolhida;
window.FZ_mudarData = FZ_mudarData;
window.FZ_irHoje = FZ_irHoje;
window.FZ_jogosDoDia = FZ_jogosDoDia;
window.FZ_aoVivo = FZ_aoVivo;
window.FZ_jornadas = FZ_jornadas;
window.FZ_carregarTabelas = FZ_carregarTabelas;
window.FZ_carregarModo = FZ_carregarModo;
window.FZ_mudarModo = FZ_mudarModo;
window.FZ_selecionarLiga = FZ_selecionarLiga;
window.FZ_abrirJogoSeguro = FZ_abrirJogoSeguro;
window.FZ_abrirEquipaSeguro = FZ_abrirEquipaSeguro;

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    FZ_iniciar
  );

} else {

  FZ_iniciar();
}

</script>

<script>
/* =========================================================
   FUTZONE — BLOCO 3
   FUTEBOL
   DETALHES • CLUBES • JOGADORES • HISTÓRICO • FAVORITOS
   NÃO ALTERAR O BLOCO 2
   ========================================================= */

(function () {

  const FZ3_API =
    "https://site.api.espn.com/apis/site/v2/sports/soccer/";

  const FZ3_FAV_JOGOS =
    "futzone_jogos_favoritos";

  const FZ3_FAV_EQUIPAS =
    "futzone_equipas_favoritas";

  const FZ3_FAV_JOGADORES =
    "futzone_jogadores_favoritos";

  /* -------------------------------------------------------
     UTILITÁRIOS
     ------------------------------------------------------- */

  function FZ3_esc(v) {
    return String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function FZ3_get(url) {

    const r = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    if (!r.ok)
      throw new Error("HTTP " + r.status);

    return await r.json();
  }

  function FZ3_getFav(key) {

    try {
      return JSON.parse(
        localStorage.getItem(key) || "[]"
      );
    } catch (e) {
      return [];
    }
  }

  function FZ3_setFav(key, data) {
    localStorage.setItem(
      key,
      JSON.stringify(data)
    );
  }

  function FZ3_isFav(key, id) {

    return FZ3_getFav(key).some(
      x => String(x.id) === String(id)
    );
  }

  function FZ3_toggleFav(key, obj) {

    const arr = FZ3_getFav(key);

    const index = arr.findIndex(
      x => String(x.id) === String(obj.id)
    );

    if (index >= 0)
      arr.splice(index, 1);
    else
      arr.unshift(obj);

    FZ3_setFav(key, arr);

    return index < 0;
  }

  function FZ3_content() {
    return document.getElementById("conteudo");
  }

  function FZ3_loading(text) {

    if (!FZ3_content()) return;

    FZ3_content().innerHTML =
      `<div class="fz3-loading">${FZ3_esc(
        text || "A carregar..."
      )}</div>`;
  }

  function FZ3_error(text) {

    if (!FZ3_content()) return;

    FZ3_content().innerHTML =
      `<div class="fz3-error">${FZ3_esc(
        text || "Não foi possível carregar os dados."
      )}</div>`;
  }

  function FZ3_logo(url, name) {

    if (url) {
      return `
        <img
          class="fz3-logo"
          src="${FZ3_esc(url)}"
          alt=""
          onerror="this.style.display='none'"
        >
      `;
    }

    return `
      <div class="fz3-logo fz3-logo-empty">
        ${FZ3_esc((name || "?").charAt(0))}
      </div>
    `;
  }

  function FZ3_header(title, sub) {

    return `
      <div class="fz3-header">

        <button
          class="fz3-back"
          onclick="FZ3_voltar()"
        >←</button>

        <div>
          <div class="fz3-title">
            ${FZ3_esc(title)}
          </div>

          <div class="fz3-sub">
            ${FZ3_esc(sub || "")}
          </div>
        </div>

      </div>
    `;
  }

  window.FZ3_voltar = function () {

    if (typeof window.FZ_mudarModo === "function") {

      try {
        window.FZ_mudarModo("jogos");
        return;
      } catch (e) {}
    }

    if (typeof window.FZ_jogosDoDia === "function") {

      try {
        window.FZ_jogosDoDia();
        return;
      } catch (e) {}
    }

    location.reload();
  };

  /* ========================================================
     DETALHE DO JOGO
     ======================================================== */

  window.FZ_abrirJogo = async function (
    eventId,
    leagueId
  ) {

    if (!eventId) return;

    leagueId =
      leagueId ||
      window.FZ_ligaSelecionada ||
      "por.1";

    FZ3_loading(
      "A carregar detalhes do jogo..."
    );

    try {

      const data = await FZ3_get(
        FZ3_API +
        leagueId +
        "/summary?event=" +
        encodeURIComponent(eventId)
      );

      FZ3_renderJogo(
        data,
        eventId,
        leagueId
      );

    } catch (e) {

      console.error(e);

      FZ3_error(
        "Não foi possível carregar os detalhes deste jogo."
      );
    }
  };

  window.FZ_abrirJogoSeguro =
    window.FZ_abrirJogo;

  function FZ3_renderJogo(
    data,
    eventId,
    leagueId
  ) {

    const header = data.header || {};

    const competition =
      header.competitions?.[0] || {};

    const teams =
      competition.competitors || [];

    const home =
      teams.find(
        x => x.homeAway === "home"
      ) || teams[0] || {};

    const away =
      teams.find(
        x => x.homeAway === "away"
      ) || teams[1] || {};

    const homeTeam =
      home.team || {};

    const awayTeam =
      away.team || {};

    const fav =
      FZ3_isFav(
        FZ3_FAV_JOGOS,
        eventId
      );

    const homeScore =
      home.score ?? "-";

    const awayScore =
      away.score ?? "-";

    const status =
      competition.status?.type?.shortDetail ||
      competition.status?.type?.detail ||
      header.status?.type?.detail ||
      "";

    FZ3_content().innerHTML = `

      ${FZ3_header(
        "Detalhes do jogo",
        header.season?.displayName || ""
      )}

      <div class="fz3-match">

        <button
          class="fz3-team"
          onclick="FZ_abrirEquipa(
            '${FZ3_esc(homeTeam.id || "")}',
            '${FZ3_esc(leagueId)}'
          )"
        >

          ${FZ3_logo(
            homeTeam.logo,
            homeTeam.displayName ||
            homeTeam.name
          )}

          <strong>
            ${FZ3_esc(
              homeTeam.displayName ||
              homeTeam.name ||
              "Casa"
            )}
          </strong>

        </button>

        <div class="fz3-score">

          <div class="fz3-score-number">
            ${FZ3_esc(homeScore)}
            -
            ${FZ3_esc(awayScore)}
          </div>

          <small>
            ${FZ3_esc(status)}
          </small>

          <button
            class="fz3-fav"
            onclick="
              event.stopPropagation();
              FZ3_favoritarJogo(
                '${FZ3_esc(eventId)}',
                '${FZ3_esc(leagueId)}',
                '${FZ3_esc(
                  homeTeam.displayName ||
                  homeTeam.name ||
                  ""
                )}',
                '${FZ3_esc(
                  awayTeam.displayName ||
                  awayTeam.name ||
                  ""
                )}'
              )
            "
          >
            ${fav ? "★" : "☆"} Favorito
          </button>

        </div>

        <button
          class="fz3-team"
          onclick="FZ_abrirEquipa(
            '${FZ3_esc(awayTeam.id || "")}',
            '${FZ3_esc(leagueId)}'
          )"
        >

          ${FZ3_logo(
            awayTeam.logo,
            awayTeam.displayName ||
            awayTeam.name
          )}

          <strong>
            ${FZ3_esc(
              awayTeam.displayName ||
              awayTeam.name ||
              "Fora"
            )}
          </strong>

        </button>

      </div>

      <section class="fz3-section">
        <h3>⚽ Eventos</h3>
        <div id="fz3-eventos"></div>
      </section>

      <section class="fz3-section">
        <h3>📊 Estatísticas</h3>
        <div id="fz3-stats"></div>
      </section>

      <section class="fz3-section">
        <h3>👥 Titulares</h3>
        <div id="fz3-lineups"></div>
      </section>
    `;

    FZ3_renderEventos(data);
    FZ3_renderStats(data);
    FZ3_renderLineups(
      data,
      leagueId
    );
  }

  function FZ3_renderEventos(data) {

    const box =
      document.getElementById(
        "fz3-eventos"
      );

    if (!box) return;

    const plays =
      data.plays || [];

    if (!plays.length) {

      box.innerHTML =
        `<div class="fz3-empty">
          Não existem eventos disponíveis.
        </div>`;

      return;
    }

    box.innerHTML =
      plays.map(play => {

        const time =
          play.clock?.displayValue ||
          play.clock?.value ||
          "";

        const text =
          play.text ||
          play.shortText ||
          "";

        return `
          <div class="fz3-event">
            <span>
              ${FZ3_esc(time)}
            </span>
            <div>
              ${FZ3_esc(text)}
            </div>
          </div>
        `;

      }).join("");
  }

  function FZ3_renderStats(data) {

    const box =
      document.getElementById(
        "fz3-stats"
      );

    if (!box) return;

    const teams =
      data.boxscore?.teams || [];

    if (!teams.length) {

      box.innerHTML =
        `<div class="fz3-empty">
          Estatísticas não disponíveis.
        </div>`;

      return;
    }

    box.innerHTML =
      teams.map(teamData => {

        const team =
          teamData.team || {};

        const stats =
          teamData.statistics || [];

        return `

          <div class="fz3-stat-team">

            <strong>
              ${FZ3_esc(
                team.displayName ||
                team.name ||
                "Equipa"
              )}
            </strong>

            ${stats.map(stat => `

              <div class="fz3-stat-row">

                <span>
                  ${FZ3_esc(
                    stat.label ||
                    stat.name ||
                    ""
                  )}
                </span>

                <b>
                  ${FZ3_esc(
                    stat.displayValue ??
                    stat.value ??
                    ""
                  )}
                </b>

              </div>

            `).join("")}

          </div>
        `;

      }).join("");
  }

  function FZ3_renderLineups(
    data,
    leagueId
  ) {

    const box =
      document.getElementById(
        "fz3-lineups"
      );

    if (!box) return;

    const rosters =
      data.rosters ||
      data.roster ||
      [];

    if (!rosters.length) {

      box.innerHTML =
        `<div class="fz3-empty">
          Os titulares não estão disponíveis
          para este jogo.
        </div>`;

      return;
    }

    let players = [];

    rosters.forEach(roster => {

      const team =
        roster.team || {};

      const list =
        roster.roster ||
        roster.players ||
        [];

      list.forEach(player => {

        const athlete =
          player.athlete ||
          player.player ||
          {};

        if (
          player.starter === true ||
          player.starter?.value === true
        ) {

          players.push({
            athlete,
            player,
            team
          });
        }
      });
    });

    if (!players.length) {

      box.innerHTML =
        `<div class="fz3-empty">
          Os titulares não estão disponíveis
          para este jogo.
        </div>`;

      return;
    }

    box.innerHTML = `

      <div class="fz3-pitch">

        ${players.map((p, index) => {

          const athlete =
            p.athlete || {};

          const player =
            p.player || {};

          const id =
            athlete.id ||
            player.id ||
            "";

          return `

            <button
              class="fz3-pitch-player"
              style="--fz-index:${index}"
              onclick="
                FZ_abrirJogador(
                  '${FZ3_esc(id)}',
                  '${FZ3_esc(leagueId)}'
                )
              "
            >

              <span>
                ${FZ3_esc(
                  player.jersey ||
                  athlete.jersey ||
                  ""
                )}
              </span>

              <small>
                ${FZ3_esc(
                  athlete.displayName ||
                  athlete.fullName ||
                  player.name ||
                  "Jogador"
                )}
              </small>

            </button>
          `;

        }).join("")}

      </div>
    `;
  }

  /* ========================================================
     EQUIPA
     ======================================================== */

  window.FZ_abrirEquipa =
    async function (
      teamId,
      leagueId
    ) {

      if (!teamId) return;

        window.FZ_ligaSelecionada ||
        "por.1";

      FZ3_loading(
        "A carregar equipa..."
      );

        const data =
          await FZ3_get(
            FZ3_API +
            leagueId +
            "/teams/" +
            encodeURIComponent(teamId)

          data,
          teamId,
          leagueId
        );

        FZ3_carregarPlantel(
          teamId,
          leagueId
        );

      } catch (e) {

        console.error(e);

        FZ3_error(
          "Não foi possível carregar esta equipa."
        );
      }
    };

  window.FZ_abrirEquipaSeguro =
    window.FZ_abrirEquipa;

  function FZ3_renderEquipa(
    data,
    teamId,
    leagueId
  ) {

    const team =
      data.team || data;

    const fav =
      FZ3_isFav(
        FZ3_FAV_EQUIPAS,
        teamId
      );

    FZ3_content().innerHTML = `

      ${FZ3_header(
        team.displayName ||
        team.name ||
        "Equipa",
        team.abbreviation || ""
      )}

      <div class="fz3-club">

        ${FZ3_logo(
          team.logo,
          team.displayName ||
          team.name
        )}

        <div class="fz3-club-info">

          <h2>
            ${FZ3_esc(
              team.displayName ||
              team.name ||
              "Equipa"
            )}
          </h2>

          <small>
            ${FZ3_esc(
              team.location || ""
            )}
          </small>

        </div>

        <button
          class="fz3-fav"
          onclick="
            FZ3_favoritarEquipa(
              '${FZ3_esc(teamId)}',
              '${FZ3_esc(leagueId)}',
              '${FZ3_esc(
                team.displayName ||
                team.name ||
                ""
              )}',
              '${FZ3_esc(
                team.logo || ""
              )}'
            )
          "
        >
          ${fav ? "★" : "☆"}
        </button>

      </div>

      <section class="fz3-section">

        <h3>👥 Plantel</h3>

        <div id="fz3-plantel">
          <div class="fz3-loading-small">
            A carregar jogadores...
          </div>
        </div>

      </section>
    `;
  }

  async function FZ3_carregarPlantel(
    teamId,
    leagueId
  ) {

    const box =
      document.getElementById(
        "fz3-plantel"
      );

    if (!box) return;

    try {

      const data =
        await FZ3_get(
          FZ3_API +
          leagueId +
          "/teams/" +
          encodeURIComponent(teamId) +
          "/roster"
        );

      const players =
        data.athletes ||
        data.roster ||
        data.players ||
        [];

      if (!players.length) {

        box.innerHTML =
          `<div class="fz3-empty">
            O plantel não está disponível.
          </div>`;

        return;
      }

      box.innerHTML =
        players.map(item => {

          const p =
            item.athlete ||
            item.player ||
            item;

          return `

            <button
              class="fz3-player-row"
              onclick="
                FZ_abrirJogador(
                  '${FZ3_esc(p.id || "")}',
                  '${FZ3_esc(leagueId)}'
                )
              "
            >

              ${
                p.headshot?.href
                ?
                `<img
                  src="${FZ3_esc(
                    p.headshot.href
                  )}"
                  alt=""
                >`
                :
                `<span class="fz3-avatar">
                  👤
                </span>`
              }

              <span>

                <strong>
                  ${FZ3_esc(
                    p.displayName ||
                    p.fullName ||
                    p.name ||
                    "Jogador"
                  )}
                </strong>

                <small>
                  ${FZ3_esc(
                    item.position?.displayName ||
                    item.position?.name ||
                    ""
                  )}
                </small>

              </span>

            </button>
          `;

        }).join("");

    } catch (e) {

      box.innerHTML =
        `<div class="fz3-empty">
          O plantel não está disponível
          para esta equipa.
        </div>`;
    }
  }

  /* ========================================================
     JOGADOR
     ======================================================== */

  window.FZ_abrirJogador =
    async function (
      playerId,
      leagueId
    ) {

      if (!playerId) return;

      leagueId =
        leagueId ||
        window.FZ_ligaSelecionada ||
        "por.1";

      FZ3_loading(
        "A carregar jogador..."
      );

      try {

        let data;

        try {

          data =
            await FZ3_get(
              FZ3_API +
              leagueId +
              "/athletes/" +
              encodeURIComponent(
                playerId
              )
            );

        } catch (e) {

          data =
            await FZ3_get(
              "https://sports.core.api.espn.com/v2/sports/soccer/leagues/" +
              encodeURIComponent(
                leagueId
              ) +
              "/athletes/" +
              encodeURIComponent(
                playerId
              )
            );
        }

        FZ3_renderJogador(
          data,
          playerId,
          leagueId
        );

      } catch (e) {

        console.error(e);

        FZ3_error(
          "Não foi possível carregar este jogador."
        );
      }
    };

  function FZ3_renderJogador(
    data,
    playerId,
    leagueId
  ) {

    const athlete =
      data.athlete ||
      data;

    const name =
      athlete.displayName ||
      athlete.fullName ||
      athlete.name ||
      "Jogador";

    const photo =
      athlete.headshot?.href ||
      athlete.photo ||
      athlete.image?.href ||
      "";

    const fav =
      FZ3_isFav(
        FZ3_FAV_JOGADORES,
        playerId
      );

    FZ3_content().innerHTML = `

      ${FZ3_header(
        name,
        athlete.position?.displayName ||
        athlete.position?.name ||
        ""
      )}

      <div class="fz3-player">

        ${
          photo
          ?
          `<img
            src="${FZ3_esc(photo)}"
            alt=""
          >`
          :
          `<div class="fz3-player-empty">
            👤
          </div>`
        }

        <div>

          <h2>
            ${FZ3_esc(name)}
          </h2>

          <small>
            ${FZ3_esc(
              athlete.position?.displayName ||
              athlete.position?.name ||
              ""
            )}
          </small>

          <br>

          <button
            class="fz3-fav"
            onclick="
              FZ3_favoritarJogador(
                '${FZ3_esc(playerId)}',
                '${FZ3_esc(leagueId)}',
                '${FZ3_esc(name)}',
                '${FZ3_esc(photo)}'
              )
            "
          >
            ${fav ? "★ Favorito" : "☆ Favorito"}
          </button>

        </div>

      </div>

      <section class="fz3-section">

        <h3>📋 Informações</h3>

        <div class="fz3-info">

          ${
            athlete.age
            ?
            `<div>
              <small>Idade</small>
              <b>${FZ3_esc(
                athlete.age
              )}</b>
            </div>`
            : ""
          }

          ${
            athlete.height
            ?
            `<div>
              <small>Altura</small>
              <b>${FZ3_esc(
                athlete.height
              )}</b>
            </div>`
            : ""
          }

          ${
            athlete.weight
            ?
            `<div>
              <small>Peso</small>
              <b>${FZ3_esc(
                athlete.weight
              )}</b>
            </div>`
            : ""
          }

          ${
            athlete.dateOfBirth
            ?
            `<div>
              <small>Nascimento</small>
              <b>${FZ3_esc(
                athlete.dateOfBirth
              )}</b>
            </div>`
            : ""
          }

          ${
            athlete.nationality
            ?
            `<div>
              <small>Nacionalidade</small>
              <b>${FZ3_esc(
                athlete.nationality
              )}</b>
            </div>`
            : ""
          }

        </div>

      </section>

      <section
        class="fz3-section"
        id="fz3-career"
      >

        <h3>📚 Histórico / carreira</h3>

        <div class="fz3-loading-small">
          A procurar histórico...
        </div>

      </section>
    `;

    FZ3_carreira(
      athlete,
      leagueId
    );
  }

  function FZ3_carreira(
    athlete,
    leagueId
  ) {

    const box =
      document.getElementById(
        "fz3-career"
      );

    if (!box) return;

    const entries = [];

    function scan(obj) {

      if (!obj || typeof obj !== "object")
        return;

      if (Array.isArray(obj)) {

        obj.forEach(scan);
        return;
      }

      if (
        obj.team &&
        typeof obj.team === "object"
      ) {

        entries.push({
          team: obj.team,
          season:
            obj.season ||
            obj.year ||
            obj.seasonName ||
            ""
        });
      }

      Object.keys(obj).forEach(key => {

        if (
          key === "headshot" ||
          key === "image"
        )
          return;

        scan(obj[key]);
      });
    }

    scan(athlete);

    const unique=[];
    const seen=new Set();

    entries.forEach(item => {

      const id =
        item.team.id ||
        item.team.displayName ||
        item.team.name;

      if (!id) return;

      if (seen.has(String(id)))
        return;

      seen.add(String(id));
      unique.push(item);
    });

    if (!unique.length) {

      box.innerHTML = `

        <h3>📚 Histórico / carreira</h3>

        <div class="fz3-empty">
          O histórico completo deste jogador
          não está disponível na fonte de dados.
        </div>
      `;

      return;
    }

    box.innerHTML = `

      <h3>📚 Histórico / carreira</h3>

      <div class="fz3-career">

        ${unique.map(item => `

          <button
            class="fz3-career-row"
            onclick="
              FZ_abrirEquipa(
                '${FZ3_esc(
                  item.team.id || ""
                )}',
                '${FZ3_esc(
                  leagueId
                )}'
              )
            "
          >

            ${FZ3_logo(
              item.team.logo,
              item.team.displayName ||
              item.team.name
            )}

            <span>

              <strong>
                ${FZ3_esc(
                  item.team.displayName ||
                  item.team.name ||
                  "Equipa"
                )}
              </strong>

              <small>
                ${FZ3_esc(
                  typeof item.season === "object"
                  ?
                  (
                    item.season.displayName ||
                    item.season.year ||
                    ""
                  )
                  :
                  item.season || ""
                )}
              </small>

            </span>

          </button>

        `).join("")}

      </div>
    `;
  }

  /* ========================================================
     FAVORITOS
     ======================================================== */

  window.FZ3_favoritarJogo =
    function (
      id,
      league,
      home,
      away
    ) {

      FZ3_toggleFav(
        FZ3_FAV_JOGOS,
        {
          id: String(id),
          league,
          home,
          away
        }
      );

      FZ_abrirJogo(
        id,
        league
      );
    };

  window.FZ3_favoritarEquipa =
    function (
      id,
      league,
      nome,
      logo
    ) {

      FZ3_toggleFav(
        FZ3_FAV_EQUIPAS,
        {
          id: String(id),
          league,
          nome,
          logo
        }
      );

      FZ_abrirEquipa(
        id,
        league
      );
    };

  window.FZ3_favoritarJogador =
    function (
      id,
      league,
      nome,
      foto
    ) {

      FZ3_toggleFav(
        FZ3_FAV_JOGADORES,
        {
          id: String(id),
          league,
          nome,
          foto
        }
      );

      FZ_abrirJogador(
        id,
        league
      );
    };

  /* nomes usados pelos botões */
  window.FZ_favoritarJogo =
    window.FZ3_favoritarJogo;

  window.FZ_favoritarEquipa =
    window.FZ3_favoritarEquipa;

  window.FZ_favoritarJogador =
    window.FZ3_favoritarJogador;

  /* ========================================================
     PÁGINA FAVORITOS
     ======================================================== */

  window.FZ_mostrarFavoritos =
    function () {

      const jogos =
        FZ3_getFav(
          FZ3_FAV_JOGOS
        );

      const equipas =
        FZ3_getFav(
          FZ3_FAV_EQUIPAS
        );

      const jogadores =
        FZ3_getFav(
          FZ3_FAV_JOGADORES
        );

      FZ3_content().innerHTML = `

        ${FZ3_header(
          "Favoritos",
          "Os teus favoritos"
        )}

        <section class="fz3-section">

          <h3>⚽ Jogos</h3>

          ${
            jogos.length
            ?
            jogos.map(j => `

              <button
                class="fz3-fav-row"
                onclick="
                  FZ_abrirJogo(
                    '${FZ3_esc(j.id)}',
                    '${FZ3_esc(j.league)}'
                  )
                "
              >

                <span>⚽</span>

                <span>
                  <strong>
                    ${FZ3_esc(
                      j.home
                    )}
                    —
                    ${FZ3_esc(
                      j.away

                  </strong>

                  <small>
                    Ver detalhes
                  </small>
                </span>

              </button>

            `).join("")
            :
            `<div class="fz3-empty">
              Não tens jogos favoritos.
            </div>`
          }

        </section>

        <section class="fz3-section">

          <h3>🏟️ Equipas</h3>

          ${
            equipas.length
            ?
            equipas.map(t => `

              <button

            `).join("")
            :
            `<div class="fz3-empty">
              Não tens equipas favoritas.
            </div>`
          }

        </section>

        <section class="fz3-section">

          <h3>👤 Jogadores</h3>

          ${
            jogadores.length
            ?
            jogadores.map(p => `

              <button
                class="fz3-fav-row"
                onclick="
                  FZ_abrirJogador(

                "
              >

                ${
                  p.foto
                  ?
                  `<img
                    src="${FZ3_esc(p.foto)}"
                    alt=""
                  >`
                  :
                  `<span>👤</span>`
                }

                <span>

                  <strong>
                    ${FZ3_esc(p.nome)}
                  </strong>

                  <small>
                    Ver jogador
                  </small>

                </span>

              </button>

            `).join("")
            :
            `<div class="fz3-empty">
              Não tens jogadores favoritos.
            </div>`
          }

        </section>
      `;
    };

  /* ========================================================
     NAVEGAÇÃO INFERIOR
     ======================================================== */

  document.addEventListener(
    "click",
    function (event) {

      const fav =
        event.target.closest(
          "#navFav"
        );

      if (fav) {

        event.preventDefault();
        event.stopPropagation();

        FZ_mostrarFavoritos();

        return;
      }

    },
    true
  );

  /* ========================================================
     CSS
     ======================================================== */

  const style =
    document.createElement("style");

  style.textContent = `

    }

      font-size:12px;
    }

    .fz3-match{
      display:grid;
      grid-template-columns:1fr auto 1fr;

    }

    .fz3-team{
      border:0;

    }

    }

    .fz3-logo{

    .fz3-logo-empty{

<script>
/* =========================================================
   FUTZONE — BLOCO 4
   FUTSAL
   JOGOS • DATAS • AO VIVO • COMPETIÇÕES • CLASSIFICAÇÕES
   ========================================================= */

(function(){

  const FZ4_API =
    "https://www.sofascore.com/api/v1";

  let FZ4_data = new Date();

  function esc(v){
    return String(v ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function dateISO(d){

    return [
      d.getFullYear(),
      String(d.getMonth()+1).padStart(2,"0"),
      String(d.getDate()).padStart(2,"0")
    ].join("-");
  }

  async function get(url){

    const r=await fetch(
      url,
      {
        cache:"no-store"
      }
    );

    if(!r.ok)
      throw new Error("HTTP "+r.status);

    return await r.json();
  }

  function area(){

    return document.getElementById(
      "conteudo"
    );
  }

  /* =====================================================
     ENTRADA FUTSAL
     ===================================================== */

  window.FZ_abrirFutsal =
    function(){

      if(!area()) return;

      area().innerHTML=`

        <div class="fz4-header">

          <button
            class="fz4-back"
            onclick="FZ3_voltar()"
          >←</button>

          <div>

            <strong>🥅 FUTSAL</strong>

            <small>
              Futebol de salão
            </small>

          </div>

        </div>

        <div class="fz4-menu">

          <button
            onclick="FZ4_jogos()"
          >
            ⚽ Jogos
          </button>

          <button
            onclick="FZ4_live()"
          >
            🔴 AO VIVO
          </button>

          <button
            onclick="FZ4_competicoes()"
          >
            🏆 Competições
          </button>

        </div>

        <div id="fz4-area"></div>
      `;

      FZ4_jogos();
    };

  /* =====================================================
     JOGOS
     ===================================================== */

  window.FZ4_jogos =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML=`

        <div class="fz4-dates">

          <button
            onclick="FZ4_dia(-1)"
          >‹</button>

          <button
            onclick="FZ4_hoje()"
          >HOJE</button>

          <input
            type="date"
            value="${dateISO(FZ4_data)}"
            onchange="FZ4_data(this.value)"
          >

          <button
            onclick="FZ4_dia(1)"
          >›</button>

        </div>

        <div class="fz4-loading">
          A carregar jogos de futsal...
        </div>
      `;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/scheduled-events/" +
            dateISO(FZ4_data)
          );

        const events =
          data.events || [];

        if(!events.length){

          box.innerHTML += `
            <div class="fz4-empty">
              Não existem jogos de futsal
              registados para este dia.
            </div>
          `;

          return;
        }

        box.innerHTML =
          box.innerHTML.split(
            '<div class="fz4-loading">'
          )[0] +
          events.map(card).join("");

      }catch(e){

        box.innerHTML += `
          <div class="fz4-empty">
            Não foi possível carregar
            os jogos de futsal.
          </div>
        `;
      }
    };

  function card(ev){

    const home =
      ev.homeTeam || {};

    const away =
      ev.awayTeam || {};

    const hs =
      ev.homeScore?.current;

    const as =
      ev.awayScore?.current;

    const time =
      ev.startTimestamp
      ?
      new Date(
        ev.startTimestamp*1000
      ).toLocaleTimeString(
        "pt-PT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
      :
      "--:--";

    return `

      <button
        class="fz4-game"
        onclick="
          FZ4_detalhe(
            '${esc(ev.id)}'
          )
        "
      >

        <small class="fz4-league">
          ${esc(
            ev.tournament?.name ||
            "Futsal"
          )}
        </small>

        <div class="fz4-teams">

          <span>
            ${esc(
              home.name ||
              "Casa"
            )}
          </span>

          <strong>

            ${
              hs !== undefined &&
              as !== undefined
              ?
              `${esc(hs)} - ${esc(as)}`
              :
              time
            }

          </strong>

          <span>
            ${esc(
              away.name ||
              "Fora"
            )}
          </span>

        </div>

      </button>
    `;
  }

  /* =====================================================
     DATAS
     ===================================================== */

  window.FZ4_dia =
    function(delta){

      FZ4_data.setDate(
        FZ4_data.getDate()+delta
      );

      FZ4_jogos();
    };

  window.FZ4_hoje =
    function(){

      FZ4_data =
        new Date();

      FZ4_jogos();
    };

  window.FZ4_data =
    function(value){

      if(!value) return;

      const p =
        value.split("-");

      FZ4_data =
        new Date(
          Number(p[0]),
          Number(p[1])-1,
          Number(p[2])
        );

      FZ4_jogos();
    };

  /* =====================================================
     AO VIVO
     ===================================================== */

  window.FZ4_live =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A procurar jogos ao vivo...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/events/live"
          );

        const events =
          data.events || [];

        if(!events.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Não existem jogos de futsal
              ao vivo neste momento.
            </div>`;

          return;
        }

        box.innerHTML =
          events.map(card).join("");

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível obter
            os jogos ao vivo.
          </div>`;
      }
    };

  /* =====================================================
     DETALHE
     ===================================================== */

  window.FZ4_detalhe =
    async function(id){

      if(!area()) return;

      area().innerHTML =
        `<div class="fz4-loading">
          A carregar jogo...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/event/" +
            encodeURIComponent(id)
          );

        const ev =
          data.event || {};

        const home =
          ev.homeTeam || {};

        const away =
          ev.awayTeam || {};

        area().innerHTML=`

          <div class="fz4-header">

            <button
              class="fz4-back"
              onclick="FZ_abrirFutsal()"
            >←</button>

            <div>
              <strong>🥅 FUTSAL</strong>
              <small>
                ${esc(
                  ev.tournament?.name ||
                  ""
                )}
              </small>
            </div>

          </div>

          <div class="fz4-detail">

            <div>
              ${esc(
                home.name ||
                "Casa"
              )}
            </div>

            <strong>
              ${
                ev.homeScore?.current !== undefined
                ?
                `${esc(
                  ev.homeScore.current
                )}
                -
                ${esc(
                  ev.awayScore?.current
                )}`
                :
                "vs"
              }
            </strong>

            <div>
              ${esc(
                away.name ||
                "Fora"
              )}
            </div>

          </div>

          <div id="fz4-stats"></div>

          <div id="fz4-players"></div>
        `;

        FZ4_stats(id);
        FZ4_players(id);

      }catch(e){

        area().innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            este jogo.
          </div>`;
      }
    };

  async function FZ4_stats(id){

    const box =
      document.getElementById(
        "fz4-stats"
      );

    if(!box) return;

    try{

      const data =
        await get(
          FZ4_API +
          "/event/" +
          encodeURIComponent(id) +
          "/statistics"
        );

      const groups =
        data.statistics || [];

      if(!groups.length) return;

      let html=`
        <section class="fz4-section">
          <h3>📊 Estatísticas</h3>
      `;

      groups.forEach(period => {

        (period.groups || [])
          .forEach(group => {

            (group.statisticsItems || [])
              .forEach(stat => {

                html += `

                  <div class="fz4-stat">

                    <span>
                      ${esc(
                        stat.name || ""
                      )}
                    </span>

                    <b>
                      ${esc(
                        stat.home ?? ""
                      )}
                      -
                      ${esc(
                        stat.away ?? ""
                      )}
                    </b>

                  </div>
                `;
              });
          });
      });

      html += "</section>";

      box.innerHTML=html;

    }catch(e){}
  }

  async function FZ4_players(id){

    const box =
      document.getElementById(
        "fz4-players"
      );

    if(!box) return;

    try{

      const data =
        await get(
          FZ4_API +
          "/event/" +
          encodeURIComponent(id) +
          "/lineups"
        );

      const teams=[
        data.home,
        data.away
      ].filter(Boolean);

      if(!teams.length) return;

      box.innerHTML=`

        <section class="fz4-section">

          <h3>👥 Jogadores</h3>

          ${teams.map(team => `

            <h4>
              ${esc(
                team.team?.name ||
                "Equipa"
              )}
            </h4>

            ${(team.players || [])
              .map(p => {

                const player =
                  p.player || {};

                return `

                  <div class="fz4-stat">

                    <span>
                      ${esc(
                        player.name ||
                        "Jogador"
                      )}
                    </span>

                    <b>
                      ${esc(
                        p.position ||
                        ""
                      )}
                    </b>

                  </div>
                `;
              }).join("")}

          `).join("")}

        </section>
      `;

    }catch(e){}
  }

  /* =====================================================
     COMPETIÇÕES
     ===================================================== */

  window.FZ4_competicoes =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A carregar competições...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/unique-tournaments"
          );

        let list =
          data.uniqueTournaments ||
          [];

        if(!list.length){

          const groups =
            data.groups || [];

          list =
            groups.flatMap(
              g =>
                g.uniqueTournaments || []
            );
        }

        if(!list.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Não foi possível obter
              as competições.
            </div>`;

          return;
        }

        box.innerHTML = `

          <section class="fz4-section">

            <h3>
              🏆 Competições de Futsal
            </h3>

            ${list.map(t => `

              <button
                class="fz4-competition"
                onclick="
                  FZ4_classificacao(
                    '${esc(t.id)}',
                    '${esc(
                      t.name || ""
                    )}'
                  )
                "
              >

                <span>🏆</span>

                <span>
                  <strong>
                    ${esc(
                      t.name ||
                      "Competição"
                    )}
                  </strong>

                  <small>
                    ${esc(
                      t.category?.name ||
                      ""
                    )}
                  </small>
                </span>

              </button>

            `).join("")}

          </section>
        `;

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            as competições.
          </div>`;
      }
    };

  /* =====================================================
     CLASSIFICAÇÃO
     ===================================================== */

  window.FZ4_classificacao =
    async function(
      tournamentId,
      tournamentName
    ){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A carregar classificação...
        </div>`;

      try{

        const seasons =
          await get(
            FZ4_API +
            "/unique-tournament/" +
            encodeURIComponent(
              tournamentId
            ) +
            "/seasons"
          );

        const season =
          seasons.seasons?.[0];

        if(!season){

          box.innerHTML =
            `<div class="fz4-empty">
              Não existe classificação
              disponível.
            </div>`;

          return;
        }

        const data =
          await get(
            FZ4_API +
            "/unique-tournament/" +
            encodeURIComponent(
              tournamentId
            ) +
            "/season/" +
            encodeURIComponent(
              season.id
            ) +
            "/standings/total"
          );

        const rows =
          data.standings?.[0]?.rows ||
          [];

        if(!rows.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Classificação não disponível.
            </div>`;

          return;
        }

        box.innerHTML=`

          <section class="fz4-section">

            <h3>
              🏆 ${esc(
                tournamentName
              )}
            </h3>

            <div class="fz4-table">

              <div class="fz4-tr fz4-head">
                <span>#</span>
                <span>Equipa</span>
                <span>J</span>
                <span>Pts</span>
              </div>

              ${rows.map(row => `

                <div class="fz4-tr">

                  <span>
                    ${esc(
                      row.position
                    )}
                  </span>

                  <span>
                    ${esc(
                      row.team?.name ||
                      ""
                    )}
                  </span>

                  <span>
                    ${esc(
                      row.matches ??
                      ""
                    )}
                  </span>

                  <strong>
                    ${esc(
                      row.points ??
                      ""
                    )}
                  </strong>

                </div>

              `).join("")}

            </div>

          </section>
        `;

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            a classificação.
          </div>`;
      }
    };

  /* =====================================================
     CSS
     ===================================================== */

  const style =
    document.createElement("style");

  style.textContent = `

    .fz4-header{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .fz4-header strong{
      display:block;
      font-size:20px;
    }

    .fz4-header small{
      display:block;
      color:#9daabb;
      margin-top:2px;
    }

    .fz4-back{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#722f37;
      color:#fff;
      font-size:24px;
    }

    .fz4-menu{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
      margin-bottom:12px;
    }

    .fz4-menu button{
      border:0;
      border-radius:12px;
      padding:11px 4px;
      background:#722f37;
      color:#fff;
      font-weight:800;
    }

    .fz4-dates{
      display:grid;
      grid-template-columns:42px 1fr 1.5fr 42px;
      gap:6px;
      margin-bottom:12px;
    }

    .fz4-dates button,
    .fz4-dates input{
      min-height:42px;
      border:1px solid #263140;
      border-radius:11px;
      background:#09111c;
      color:#fff;
      text-align:center;
    }

    .fz4-game{
      display:block;
      width:100%;
      border:1px solid #202d3b;
      border-radius:17px;
      background:#09111c;
      color:#fff;
      padding:13px;
      margin-bottom:8px;
      text-align:left;
    }

    .fz4-league{
      display:block;
      color:#9daabb;
      font-size:11px;
      margin-bottom:10px;
    }

    .fz4-teams{
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:7px;
    }

    .fz4-teams span:first-child{
      text-align:right;
    }

    .fz4-teams span:last-child{
      text-align:left;
    }

    .fz4-teams strong{
      text-align:center;
      font-size:17px;
    }

    .fz4-loading,
    .fz4-empty{
      padding:18px;
      border-radius:16px;
      background:#0d1724;
      color:#dce5ef;
      text-align:center;
      margin:10px 0;
    }

    .fz4-detail{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
      align-items:center;
      padding:20px 10px;
      border-radius:18px;
      background:#09111c;
      border:1px solid #202d3b;
      text-align:center;
    }

    .fz4-detail strong{
      font-size:27px;
    }

    .fz4-section{
      margin-top:14px;
      padding:15px;
      border-radius:18px;
      background:#09111c;
      border:1px solid #202d3b;
    }

    .fz4-section h3{
      margin:0 0 12px;
    }

    .fz4-section h4{
      margin:12px 0 6px;
    }

    .fz4-stat{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #1d2733;
      font-size:13px;
    }

    .fz4-competition{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px;
      margin-bottom:7px;
      border:0;
      border-radius:13px;
      background:#0d1724;
      color:#fff;
      text-align:left;
    }

    .fz4-competition span:last-child{
      display:flex;
      flex-direction:column;
    }

    .fz4-competition small{
      color:#9daabb;
      margin-top:3px;
    }

    .fz4-table{
      overflow:hidden;
      border-radius:12px;
    }

    .fz4-tr{
      display:grid;
      grid-template-columns:32px 1fr 32px 45px;
      gap:5px;
      align-items:center;
      padding:10px 6px;
      border-bottom:1px solid #1d2733;
      font-size:12px;
    }

    .fz4-head{
      color:#9daabb;
      font-weight:800;
      background:#0d1724;
    }

  `;

  document.head.appendChild(style);

})();
</script>
  </body>
</html>
