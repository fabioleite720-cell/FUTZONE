<style>
:root{--blue:#0057b8;--blue2:#1683ff;--bg:#03060b;--card:#0a111b;--line:#223047;--text:#fff;--muted:#9daabb;--green:#20d68a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:16px;background:#06101c;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:25px}
h1 span{color:#1683ff}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.wrap{max-width:900px;margin:auto;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
select,button{background:#101b2a;color:#fff;border:1px solid #30415b;border-radius:11px;padding:11px 12px;font-size:14px}
button{cursor:pointer;background:var(--blue)}
button.secondary{background:#101b2a}
.status{color:var(--muted);font-size:13px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.teamBtn{border:0;background:transparent;padding:4px;color:#fff;width:100%}
.teamBtn img{width:58px;height:58px;object-fit:contain;display:block;margin:auto}
.teamBtn b{display:block;margin-top:5px}
.score{font-size:24px;font-weight:800}
.pitchWrap{overflow:hidden;border-radius:20px;border:1px solid #31435a;background:#0c1622;padding:10px}
.pitch{position:relative;width:100%;aspect-ratio:105/68;max-height:520px;margin:auto;overflow:hidden;border-radius:14px;background:linear-gradient(90deg,#126b3b,#168247 48%,#126b3b);box-shadow:inset 0 0 55px #001b0b,0 15px 40px #000;transform:perspective(900px) rotateX(2deg)}
.pitch:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 9.09%,rgba(255,255,255,.045) 9.09% 18.18%);pointer-events:none}
.line{position:absolute;border:2px solid rgba(255,255,255,.8);pointer-events:none}
.outer{inset:4%}
.half{left:4%;right:4%;top:50%;border-top-width:2px}
.circle{width:23%;aspect-ratio:1;left:38.5%;top:38.5%;border-radius:50%}
.box{left:25%;right:25%;top:4%;height:18%;border-bottom:0}
.box2{left:25%;right:25%;bottom:4%;height:18%;border-top:0}
.goal{left:39%;right:39%;top:4%;height:4%;border-top:0}
.goal2{left:39%;right:39%;bottom:4%;height:4%;border-bottom:0}
.player{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;z-index:2}
.player button{display:block;background:transparent;border:0;padding:0;margin:auto;width:100%;font-size:10px}
.dot{width:34px;height:34px;margin:auto;border-radius:50%;background:#fff;color:#0057b8;border:3px solid #0057b8;box-shadow:0 5px 12px #0009;font-weight:900;display:flex;align-items:center;justify-content:center}
.player.away .dot{background:#0057b8;color:#fff;border-color:#fff}
.pn{font-size:10px;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.profile img{width:76px;height:76px;object-fit:cover;border-radius:50%;background:#111}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kv div{padding:10px;border:1px solid var(--line);border-radius:10px}
.kv b{display:block;margin-top:3px}
.squad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.squad button{background:#0d1724;width:100%;text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#111;vertical-align:middle;margin-right:8px}
.hidden{display:none}
.err{color:#ff8793}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.sectionTitle{font-size:20px;font-weight:900;margin:14px 0 8px}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#101b2a;color:#cdd7e4;font-size:11px;margin:3px}

@media(max-width:500px){
.player{width:52px}
.dot{width:29px;height:29px;font-size:11px}
.pn{font-size:8px}
.teams{font-size:12px}
.kv{grid-template-columns:1fr 1fr}
.squad{grid-template-columns:1fr}
}

.controlCard{padding:10px!important}
.leagueScroller{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.leagueScroller::-webkit-scrollbar{display:none}
.leagueChip{flex:0 0 auto;border:1px solid #30415b;background:#0d1724;color:#dbe7f5;border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px}
.leagueChip.active{background:#0057b8;border-color:#1683ff;color:#fff;box-shadow:0 0 0 2px #1683ff33}
.controls input{background:#101b2a;color:#fff;border:1px solid #30415b;border-radius:11px;padding:11px}
.liveBtn{background:#b51f35!important;border-color:#e04a60!important}
.hidden{display:none!important}

.pitch{aspect-ratio:105/68!important;max-height:310px!important;border-radius:12px!important}
.starting-grid{grid-template-columns:1fr 1fr!important}
.startcol{background:#07101a;border:1px solid #223047;border-radius:12px;padding:8px}
.starthead{position:sticky;top:0;display:flex;align-items:center;gap:7px;padding:4px 2px 8px;background:#07101a;z-index:1}
.starthead img{width:30px;height:30px;object-fit:contain}
.starter-row{min-height:38px!important}
.statCompare{overflow:hidden;border:1px solid #26384f;border-radius:12px}
.statCompare .statTitle{display:grid;grid-template-columns:1fr 1.5fr 1fr;padding:9px;background:#0d1724;font-weight:800;text-align:center}
.statCompare .statLine{display:grid;grid-template-columns:1fr 1.5fr 1fr;padding:9px;border-top:1px solid #223047;text-align:center;align-items:center}
.statCompare .statLine b:first-child{text-align:right}
.statCompare .statLine b:last-child{text-align:left}
.statCompare .statName{color:#9daabb;font-size:11px}
.event-row{padding:8px 0;border-bottom:1px solid #223047}

@media(max-width:520px){
.pitch{max-height:280px!important}
.startcol{padding:6px}
.starter-row{font-size:10px!important;padding:5px!important}
.leagueChip{font-size:11px;padding:7px 10px}
}
</style>

<script>

const API =
'https://site.api.espn.com/apis/site/v2/sports/soccer/';

const CORE =
'https://sports.core.api.espn.com/v2/sports/soccer/';

const WEB =
'https://site.web.api.espn.com/apis/common/v3/sports/soccer/';

const $ = id => document.getElementById(id);


function esc(v){

 return String(v ?? '')
   .replace(/&/g,'&amp;')
   .replace(/</g,'&lt;')
   .replace(/>/g,'&gt;')
   .replace(/"/g,'&quot;')
   .replace(/'/g,'&#39;');

}


function localDate(){

 const d=new Date();

 const y=d.getFullYear();

 const m=String(d.getMonth()+1).padStart(2,'0');

 const day=String(d.getDate()).padStart(2,'0');

 return `${y}-${m}-${day}`;

}


$('date').value=localDate();


async function get(url){

function formatGameTime(dateString){

 if(!dateString) return '--:--';

 const d=new Date(dateString);

 if(Number.isNaN(d.getTime())) return '--:--';

 return d.toLocaleTimeString('pt-PT',{
   hour:'2-digit',
   minute:'2-digit',
   hour12:false
 });

}

function getStatValue(stat){

 if(stat==null) return '-';

 if(typeof stat==='string' ||
    typeof stat==='number') return stat;

 return stat.displayValue||
        stat.value||
        stat.summary||
        '-';

}


function renderStats(comp){

 const stats=[];

 const competitors=getCompetitors(comp);

 const home=competitors[0];

 const away=competitors[1];

 const hs=home?.statistics||[];

 const as=away?.statistics||[];

 const map={};

 hs.forEach(s=>{

   const name=s.name||s.label||s.displayName;

   if(name) map[name]={
     name:name,
     home:getStatValue(s)
   };

 });

 as.forEach(s=>{

   const name=s.name||s.label||s.displayName;

   if(name){

     if(!map[name])
       map[name]={name:name};

     map[name].away=getStatValue(s);

   }

 });


 Object.values(map).forEach(x=>{

   if(x.home!==undefined ||
      x.away!==undefined){

     stats.push(x);

   }

 });


 if(!stats.length){

   return `
   <div class="card">

     <div class="sectionTitle">
       📊 Estatísticas
     </div>

     <div class="status">
       Ainda não existem estatísticas disponíveis.
     </div>

   </div>
   `;

 }


 return `

 <div class="card">

   <div class="sectionTitle">
     📊 Estatísticas do jogo
   </div>

   <div class="statCompare">

     <div class="statTitle">

       <span>
         ${esc(home?.team?.shortDisplayName||'Casa')}
       </span>

       <span>ESTATÍSTICA</span>

       <span>
         ${esc(away?.team?.shortDisplayName||'Fora')}
       </span>

     </div>

     ${stats.map(s=>`

       <div class="statLine">

         <b>${esc(s.home??'-')}</b>

         <span class="statName">
           ${esc(s.name)}
         </span>

         <b>${esc(s.away??'-')}</b>

       </div>

     `).join('')}

   </div>

 </div>

 `;

}

function markerPosition(index,total,side){

   [50,92],

   [28,61],[50,65],[72,61],

   [25,38],[50,31],[75,38]

 ];

         [50,50];

 return {

   x:p[0],

   y:side==='away'
     ?100-p[1]
     :p[1]

 };

}

async function openPlayer(id){

 if(!id) return;

 $('games').classList.add('hidden');

 $('game').classList.add('hidden');

 $('teamProfile').classList.add('hidden');

 $('profile').classList.remove('hidden');

 $('profile').innerHTML=
   '<div class="card">A carregar jogador…</div>';

 try{

   let d={};

   try{

     d=await get(
       CORE+
       'athletes/'+
       id+
       '?lang=pt'
     );

   }catch(_){

     d={};

   }


   const a=d.athlete||d;

   const name=
     a.displayName||
     a.fullName||
     a.name||
     'Jogador';


   const headshot=
     a.headshot?.href||
     a.headshot||
     '';


   let history=[];


   const urls=[

     CORE+
     'athletes/'+id+'/seasons',

     CORE+
     'athletes/'+id+'/statistics',

     WEB+
     'athletes/'+id+'/overview'

   ];


   for(const url of urls){

     try{

       const x=await get(url);

       const candidates=[

         x.seasons,

         x.items,

         x.entries,

         x.career,

         x.history,

         x.clubs,

         x.teams,

         x.formerTeams,

         x.previousTeams

       ];

       candidates.forEach(arr=>{

         if(Array.isArray(arr)){

           arr.forEach(item=>{

             const team=
               item.team||
               item.club||
               item.teams?.[0]||
               item;

             const teamName=
               team.displayName||
               team.name||
               team.teamName||
               item.teamName||
               item.clubName;


             if(teamName){

               history.push({

                 name:teamName,

                 logo:
                   team.logo||
                   team.logos?.[0]?.href||
                   '',

                 season:
                   item.season?.displayName||
                   item.season?.name||
                   item.seasonName||
                   ''

               });

             }

           });

         }

       });

     }catch(_){}

   }


   const seen=new Set();

   history=history.filter(x=>{

     const key=
       x.name+'|'+x.season;

     if(seen.has(key))
       return false;

     seen.add(key);

     return true;

   });


   $('profile').innerHTML=`

   <div class="card">

     <button
       onclick="
         $('profile').classList.add('hidden');
         $('games').classList.remove('hidden')
       "
     >
       ← Voltar
     </button>

     <div
       class="profile"
       style="margin-top:12px"
     >

       ${
         headshot
         ?`<img
              src="${esc(headshot)}"
              alt=""
              onerror="this.style.visibility='hidden'"
            >`
         :''
       }

       <div>

         <h2 style="margin:0">
           ${esc(name)}
         </h2>

         <div class="status">

           ${
             a.position?.displayName||
             a.position?.name||
             ''
           }

         </div>

       </div>

     </div>


     <div class="kv">

       <div>
         Número
         <b>
           ${esc(a.jersey||'-')}
         </b>
       </div>

       <div>
         Nacionalidade
         <b>
           ${esc(
             a.citizenship||
             a.nationality||
             '-'
           )}
         </b>
       </div>

     </div>

   </div>


   <div class="card fz-history">

     <div class="sectionTitle">
       📚 Histórico de clubes
     </div>

     ${
       history.length

       ?history.map(h=>`

         <div class="fz-club">

           ${
             h.logo
             ?`<img
                  src="${esc(h.logo)}"
                  alt=""
                  onerror="this.style.visibility='hidden'"
                >`
             :'⚽'
           }

           <div>

             <b>
               ${esc(h.name)}
             </b>

             ${
               h.season
               ?`<span>${esc(h.season)}</span>`
               :''
             }

           </div>

         </div>

       `).join('')

       :`
         <div class="status">
           O histórico de clubes não está disponível
           nesta fonte para este jogador.
         </div>
       `
     }

   </div>

   `;


   window.scrollTo({
     top:0,
     behavior:'smooth'
   });


 }catch(e){

   $('profile').innerHTML=`

   <div class="card">

     <button
       onclick="
         $('profile').classList.add('hidden');
         $('games').classList.remove('hidden')
       "
     >
       ← Voltar
     </button>

     <div class="err" style="margin-top:12px">
       ${esc(e.message)}
     </div>

   </div>

   `;

 }

}
