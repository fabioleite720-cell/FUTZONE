<title>FUTZONE</title>  <style>

body{

header{

.vazio,.erro,.carregando{  
background:#09111C;  
border:1px solid #1B2A3B;

.janela-jogos{

border:0;

color:#1683FF

.overlay{

inset:0;  
background:#03060B;  
z-index:50;  
overflow:auto

.detalhe-header{  
position:sticky;  
top:0;  
background:#09111C;  
border-bottom:1px solid #1B2A3B;  
padding:7px;  
z-index:5  
}  
  
.voltar{  
background:#0D1724;  
border:1px solid #243653;  
color:#FFF;  
border-radius:7px;  
padding:6px 9px;  
font-weight:bold;  
font-size:11px  
}  
  
.detalhe{  
max-width:720px;  
margin:auto;  
padding:7px 8px 25px  
}  
  
.jogo-grande{  
background:#09111C;  
border:1px solid #1B2A3B;  
border-radius:10px;  
padding:12px 6px;  
margin-bottom:7px  
}  
  
.jogo-grande .equipas{  
grid-template-columns:1fr 70px 1fr  
}  
  
.jogo-grande .escudo{  
width:45px;  
height:45px  
}  
  
.jogo-grande .equipa{  
font-size:13px  
}  
  
.bigscore{  
text-align:center;  
font-size:25px;  
font-weight:900  
}  
  
.estado{  
text-align:center;  
color:#1683FF;  
font-size:10px;  
margin-top:3px

.secao{  
background:#09111C;  
border:1px solid #1B2A3B;

gap:6px;

.stat-home{

.lista-jogadores{  
display:grid;  
grid-template-columns:1fr 1fr;

background:#0D1724;  
border:1px solid #1B2A3B;  
border-radius:6px;

.jogador b{  
color:#1683FF;  
margin-right:3px

.subtitulo{  
color:#9DAABB;  
font-size:9px;  
margin:5px 0  
}  
  
table{  
width:100%;  
border-collapse:collapse;

th,td{

th{  
color:#9DAABB

.tabela-wrap{  
overflow-x:auto

min-width:400px

.team-cell{  
text-align:left;  
font-weight:bold;  
cursor:pointer

.team-head{  
text-align:center;  
padding:9px  
}  
  
.team-head img{  
width:65px;  
height:65px;  
object-fit:contain  
}  
  
.team-name{  
font-size:18px;  
font-weight:900;  
margin-top:6px  
}  
  
.team-meta{  
font-size:10px;  
color:#9DAABB;  
margin-top:3px  
}  
</style>  </head>  <body>  <header>  
<div class="logo">FUT<span>ZONE</span></div>  
<div class="sub">FUTEBOL EM DIRETO</div>  
</header>  <main id="app"></main>  <div class="bottom">  
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>  
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>  
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>  
</div>  <script>  
  
const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";  
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";  
  
const ligas=[  
{name:"Portugal",code:"por.1",icon:"🇵🇹"},  
{name:"Inglaterra",code:"eng.1",icon:"🏴"},  
{name:"Espanha",code:"esp.1",icon:"🇪🇸"},  
{name:"Itália",code:"ita.1",icon:"🇮🇹"},  
{name:"Alemanha",code:"ger.1",icon:"🇩🇪"},  
{name:"França",code:"fra.1",icon:"🇫🇷"},  
{name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},  
{name:"Bélgica",code:"bel.1",icon:"🇧🇪"},  
{name:"Champions",code:"uefa.champions",icon:"🏆"},  
{name:"Europa",code:"uefa.europa",icon:"🏆"},  
{name:"Conference",code:"uefa.europa.conf",icon:"🏆"}  
];  
  
let ligaAtual=ligas[0];  
let jogosAtuais=[];  
let carregandoJogos=false;  
  
const app=document.getElementById("app");  
  
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({  
"&":"&amp;",  
"<":"&lt;",  
">":"&gt;",  
'"':"&quot;",  
"'":"&#039;"  
}[m]));  
  
function logo(u){  
return u  
?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`  
:"<div style='height:31px'></div>";  
}  
  
function nav(id){  
["navJogos","navTabelas","navFav"]  
.forEach(x=>  
document.getElementById(x)  
.classList.toggle("active",x===id)  
);  
}  
  
function data8(d){  
return d.getFullYear()+  
String(d.getMonth()+1).padStart(2,"0")+  
String(d.getDate()).padStart(2,"0");  
}  
  
function estado(ev){  
  
const s=ev?.status||ev?.competitions?.[0]?.status||{};  
const t=s.type||{};  
  
if(t.state==="in")  
return{  
txt:t.shortDetail||t.detail||t.displayClock||"DIRETO",  
live:true,  
final:false  
};  
  
if(t.state==="post")  
return{  
txt:t.shortDetail||t.detail||"FINAL",  
live:false,  
final:true  
};  
  
return{  
txt:t.shortDetail||t.detail||t.name||"",  
live:false,  
final:false  
};  
}  
  
function normalizar(ev,l){  
  
const c=ev.competitions?.[0]||{};  
const cs=c.competitors||[];  
  
const h=  
cs.find(x=>x.homeAway==="home")||  
cs[0]||{};  
  
const a=  
cs.find(x=>x.homeAway==="away")||  
cs[1]||{};  
  
const s=estado(ev);  
  
return{  
id:String(ev.id),  
date:ev.date||"",  
status:ev.status||c.status||{},  
  
home:{  
nome:h.team?.displayName||h.team?.shortDisplayName||"Casa",  
logo:h.team?.logo||"",  
score:h.score??"-",  
id:h.team?.id  
},  
  
away:{  
nome:a.team?.displayName||a.team?.shortDisplayName||"Fora",  
logo:a.team?.logo||"",  
score:a.score??"-",  
id:a.team?.id  
},  
  
estado:s,  
liga:l.name,  
code:l.code  
};  
}  
  
async function buscarEventos(l){  
  
const hoje=new Date();  
const ini=new Date(hoje);  
const fim=new Date(hoje);  
  
ini.setDate(ini.getDate()-120);  
fim.setDate(fim.getDate()+120);  
  
const urls=[  
  
`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,  
  
`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,  
  
`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`  
  
];  
  
for(const u of urls){  
  
try{  
  
const r=await fetch(u);  
  
if(!r.ok)continue;  
  
const d=await r.json();  
  
if(Array.isArray(d.events)&&d.events.length)  
return d.events;  
  
}catch(e){}  
  
}  
  
return[];  
}  
  
async function carregarJogos(){  
  
if(carregandoJogos)return;  
  
carregandoJogos=true;  
  
if(!jogosAtuais.length)  
mostrarJogos();  
  
let lista=[];  
  
for(const l of ligas){  
  
const evs=await buscarEventos(l);  
  
evs.forEach(e=>{  
lista.push(normalizar(e,l));  
});  
  
}  
  
const mapa=new Map();  
  
lista.forEach(j=>{  
mapa.set(j.id,j);  
});  
  
jogosAtuais=  
[...mapa.values()]  
.sort((a,b)=>new Date(a.date)-new Date(b.date));  
  
carregandoJogos=false;  
  
mostrarJogos();  
}  
  
function botoesLigas(){  
  
return`  
<div class="seletor-ligas">  
  
${ligas.map(l=>`  
  
<button  
class="liga-btn ${l.code===ligaAtual.code?"active":""}"  
onclick="selecionarLiga('${l.code}')">  
  
<span class="liga-icon">${l.icon}</span>  
  
${esc(l.name)}  
  
</button>  
  
`).join("")}  
  
</div>  
`;  
}  
  
function botoesLigasJanela(tipo,selecionada){  
  
return`  
<div class="seletor-ligas">  
  
<button  
class="liga-btn ${selecionada==="todas"?"active":""}"  
onclick="abrirJanelaJogos('${tipo}','todas')">  
  
<span class="liga-icon">🌍</span>  
Todas  
  
</button>  
  
${ligas.map(l=>`  
  
<button  
class="liga-btn ${l.code===selecionada?"active":""}"  
onclick="abrirJanelaJogos('${tipo}','${l.code}')">  
  
<span class="liga-icon">${l.icon}</span>  
${esc(l.name)}  
  
</button>  
  
`).join("")}  
  
</div>  
`;  
}  
  
function selecionarLiga(code){  
  
ligaAtual=  
ligas.find(l=>l.code===code)||  
ligas[0];  
  
mostrarJogos();  
}  
  
function dataLocal(d){  
  
try{  
  
return new Intl.DateTimeFormat(  
"pt-PT",  
{  
day:"2-digit",  
month:"2-digit",  
hour:"2-digit",  
minute:"2-digit"  
}  
).format(new Date(d));  
  
}catch(e){  
  
return"";  
  
}  
}  
  
function teamHtml(t,code){  
  
return`  
<div  
class="equipa team-click"  
onclick="  
event.stopPropagation();  
abrirEquipa(  
'${esc(code)}',  
'${esc(t.id||"")}',  
'${esc(t.nome)}',  
'${esc(t.logo)}'  
);  
">  
  
${logo(t.logo)}  
  
${esc(t.nome)}  
  
</div>  
`;  
}  
  
function cartao(j){  
  
const l=  
j.estado.live  
?  
`<span class="estado-live">  
🔴 ${esc(j.estado.txt)}  
</span>`  
:  
j.estado.final  
?  
`<span class="estado-final">  
${esc(j.estado.txt)}  
</span>`  
:  
esc(dataLocal(j.date));  
  
return`  
  
<div  
class="jogo"  
onclick="abrirJogo('${esc(j.id)}','${esc(j.code)}')">  
  
<div class="jogo-top">  
  
<span>${esc(j.liga)}</span>  
  
<span>${l}</span>  
  
</div>  
  
<div class="equipas">  
  
${teamHtml(j.home,j.code)}  
  
<div class="resultado">  
${esc(j.home.score)}  
-  
${esc(j.away.score)}  
</div>  
  
${teamHtml(j.away,j.code)}  
  
</div>  
  
</div>  
`;  
}  
  
function mostrarJogos(){  
  
nav("navJogos");  
  
const l=  
jogosAtuais.filter(j=>  
j.liga===ligaAtual.name &&  
!j.estado.final  
);  
  
const totalLive=  
jogosAtuais.filter(j=>j.estado.live).length;  
  
app.innerHTML=`  
  
<h2>⚽ Jogos</h2>  
  
<div class="acoes-jogos">  
  
<button  
class="janela-btn live"  
onclick="abrirJanelaJogos('live')">  
  
<span class="dot"></span>  
🔴 Ao Vivo  
${totalLive?` (${totalLive})`:""}  
  
</button>  
  
<button  
class="janela-btn"  
onclick="abrirJanelaJogos('futuros')">  
  
📅 Futuros  
  
</button>  
  
<button  
class="janela-btn"  
onclick="abrirJanelaJogos('realizados')">  
  
✅ Resultados  
  
</button>  
  
<button  
class="janela-btn"  
onclick="carregarJogos()">  
  
🔄 Atualizar  
  
</button>  
  
</div>  
  
${botoesLigas()}  
  
<h2>${esc(ligaAtual.name)}</h2>  
  
${  
l.length  
?  
l.slice(0,10).map(cartao).join("")  
:  
carregandoJogos  
?  
'<div class="carregando">⏳ A carregar jogos...</div>'  
:  
'<div class="vazio">Não há jogos próximos encontrados.</div>'  
}  
  
`;  
}  
  
function abrirJanelaJogos(tipo,ligaCode="todas"){  
  
let lista=[];  
let titulo="";  
  
if(tipo==="live"){  
  
lista=jogosAtuais.filter(j=>j.estado.live);  
  
titulo="🔴 Ao Vivo";  
  
}  
  
if(tipo==="futuros"){  
  
lista=jogosAtuais  
.filter(j=>!j.estado.final&&!j.estado.live)  
.sort((a,b)=>new Date(a.date)-new Date(b.date));  
  
titulo="📅 Futuros";  
  
}  
  
if(tipo==="realizados"){  
  
lista=jogosAtuais  
.filter(j=>j.estado.final)  
.sort((a,b)=>new Date(b.date)-new Date(a.date));  
  
titulo="✅ Resultados";  
  
}  
  
if(ligaCode!=="todas"){  
  
lista=lista.filter(j=>j.code===ligaCode);  
  
}  
  
let nomeLiga="Todas as ligas";  
  
if(ligaCode!=="todas"){  
  
const l=ligas.find(x=>x.code===ligaCode);  
  
if(l)nomeLiga=l.name;  
  
}  
  
const subtitulo=  
lista.length+  
" jogo(s) • "+  
nomeLiga;  
  
const old=document.querySelector(".janela-lista-overlay");  
  
if(old)old.remove();  
  
const o=document.createElement("div");  
  
o.className="overlay janela-lista-overlay";  
  
o.innerHTML=`  
  
<div class="detalhe-header">  
  
<button  
class="voltar"  
onclick="this.closest('.overlay').remove()">  
  
← Voltar  
  
</button>  
  
</div>  
  
<div class="detalhe janela-jogos">  
  
<div class="janela-titulo">  
  
<h2>${titulo}</h2>  
  
</div>  
  
${botoesLigasJanela(tipo,ligaCode)}  
  
<div class="contador">  
${esc(subtitulo)}  
</div>  
  
${  
lista.length  
?  
lista.map(cartao).join("")  
:  
'<div class="vazio">Não há jogos nesta categoria para esta liga.</div>'  
}  
  
</div>  
`;  
  
document.body.appendChild(o);  
}  
  
function txt(v){  
  
return typeof v==="object"  
?  
(v?.displayValue??v?.value??v?.text??"")  
:  
String(v??"");  
  
}  
  
function extrairEventos(d){  
  
let out=[];  
let seen=new Set();  
  
let arr=[  
...(d.plays||[]),  
...(d.keyEvents||[]),  
...(d.scoringPlays||[])  
];  
  
for(const e of arr){  
  
const raw=  
(  
(e?.type?.text||"")+" "+  
(e?.text||e?.shortText||e?.description||"")  
).toLowerCase();  
  
if(!/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(raw))  
continue;  
  
const k=  
String(e?.id||"")+  
raw+  
(e?.clock?.displayValue||"");  
  
if(seen.has(k))  
continue;  
  
seen.add(k);  
  
const ic=  
/yellow|amarelo/.test(raw)  
?"🟨"  
:  
/red|vermelho/.test(raw)  
?"🟥"  
:  
/substitut/.test(raw)  
?"🔄"  
:"⚽";  
  
out.push({  
  
m:e?.clock?.displayValue||"",

});

function extrairStats(d){  
  
const gs=[];  
  
function add(team,stats){  
  
if(!team||!Array.isArray(stats))  
return;  
  
const id=  
team.id||  
team.team?.id||  
team.displayName||  
team.team?.displayName;  
  
let g=  
gs.find(x=>String(x.id)===String(id));  
  
if(!g){  
  
g={  
id,  
nome:  
team.displayName||  
team.name||  
team.team?.displayName||  
"Equipa",  
s:[]  
};  
  
gs.push(g);  
  
}  
  
stats.forEach(x=>{  
  
const n=  
x.displayName||  
x.shortDisplayName||  
x.name||  
x.label||  
x.description;  
  
if(n)  
g.s.push({  
n,  
v:txt(  
x.displayValue??  
x.value??  
x.display  
)  
});  
  
});  
  
}  
  
(d.boxscore?.teams||[])  
.forEach(x=>add(  
x.team||x,  
x.statistics||x.stats  
));  
  
(d.header?.competitions?.[0]?.competitors||[])  
.forEach(x=>add(  
x.team||x,  
x.statistics  
));  
  
(d.competitions?.[0]?.competitors||[])  
.forEach(x=>add(  
x.team||x,  
x.statistics  
));  
  
if(gs.length<2)  
return[];  
  
const m=new Map();  
  
gs.slice(0,2).forEach((g,i)=>{  
  
g.s.forEach(x=>{  
  
const k=x.n.toLowerCase();  
  
if(!m.has(k))  
m.set(k,{  
n:x.n,  
h:"-",  
a:"-"  
});  
  
if(i===0)  
m.get(k).h=x.v;  
else  
m.get(k).a=x.v;  
  
});  
  
});  
  
return[...m.values()];  
}  
  
function extrairPlantel(d){  
  
const gs=[];  
  
function add(team,arr){  
  
if(!team||!Array.isArray(arr))  
return;  
  
const id=  
team.id||  
team.team?.id||  
team.displayName||  
team.team?.displayName;  
  
let g=  
gs.find(x=>String(x.id)===String(id));  
  
if(!g){  
  
g={  
id,  
nome:  
team.displayName||  
team.name||  
team.team?.displayName||  
"Equipa",  
p:[]  
};  
  
gs.push(g);  
  
}  
  
arr.forEach(x=>{  
  
const a=x?.athlete||  
x?.player||  
x;  
  
if(!a?.displayName&&!a?.fullName)  
return;  
  
const n=  
a.displayName||  
a.fullName;  
  
if(!g.p.some(p=>p.n===n)){  
  
g.p.push({  
  
n,  
num:a.jersey||x.jersey||"",  
pos:  
a.position?.abbreviation||  
a.position?.displayName||  
"",  
  
tit:x.starter===true  
  
});  
  
}  
  
});  
  
}  
  
(d.rosters||[])  
.forEach(r=>add(  
r.team||r,  
r.roster||  
r.athletes||  
r.players  
));  
  
(d.boxscore?.players||[])  
.forEach(r=>add(  
r.team||r,  
r.statistics||  
r.athletes||

));

function statVal(e,aliases){  
  
for(const a of aliases){  
  
if(e[a]!==undefined)  
return e[a];  
  
if(e.stats&&e.stats[a]!==undefined)  
return e.stats[a];  
  
}  
  
return"";  
}  
  
function grupos(o){  
  
let out=[];  
  
function walk(x){  
  
if(!x||typeof x!=="object")  
return;  
  
if(Array.isArray(x.entries))  
out.push(x.entries);  
  
if(Array.isArray(x.children))  
x.children.forEach(walk);  
  
for(const k of Object.keys(x)){  
  
if(  
k!=="entries"&&  
k!=="children"&&  
x[k]&&  
typeof x[k]==="object"  
)  
walk(x[k]);  
  
}  
  
}  
  
walk(o);  
  
return out.find(a=>a.length)||[];  
}  
  
function linhas(entries){  
  
return entries.map((e,i)=>{  
  
const t=e.team||e;  
  
return{  
  
rank:  
statVal(e,["rank","position"])||  
i+1,  
  
team:  
t.displayName||  
t.name||  
t.team?.displayName||  
"Equipa",  
  
id:  
t.id||  
t.team?.id||  
"",  
  
logo:  
t.logo||  
t.team?.logos?.[0]?.href||  
t.team?.logo||  
"",  
  
j:  
statVal(e,[  
"gamesPlayed",  
"played",  
"gp"  
]),  
  
v:  
statVal(e,[  
"wins",  
"won",  
"w"  
]),  
  
e:  
statVal(e,[  
"ties",  
"draws",  
"drawn",  
"d"  
]),  
  
d:  
statVal(e,[  
"losses",  
"lost",  
"l"  
]),  
  
dg:  
statVal(e,[  
"pointDifferential",  
"goalDifference",  
"gd"  
]),  
  
pts:  
statVal(e,[  
"points",  
"pts"  
])  
  
};  
  
});  
}
