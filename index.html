<!DOCTYPE html>
<html lang="pt-PT">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;

  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;

  --text:#F5F7FA;
  --muted:#9DAABB;

  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
  --white:#FFFFFF;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:78px;
}

button,
input{

}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:30;
  padding:16px 15px 13px;
  background:rgba(3,6,11,.97);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue2);
}

.subtitle{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
  letter-spacing:1.3px;
  font-weight:700;
}

/* FUTEBOL / FUTSAL */

.sportSwitch{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.sportBtn{
  flex:1;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:10px 12px;
  border-radius:12px;
  font-weight:800;
}

.sportBtn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* MAIN */

main{
  padding:14px;
}

.sectionTitle{
  font-size:17px;
  font-weight:900;
  margin:5px 0 10px;
}

.sectionSub{
  color:var(--muted);
  font-size:12px;
  margin:-4px 0 12px;
}

/* COMPETIÇÕES */

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar,
.filters::-webkit-scrollbar{
  display:none;
}

.league{
  flex:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:12px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
}

.league.active{
  color:white;
  background:var(--blue3);
  border-color:var(--blue2);
}

/* BOTÃO LIVE */

.liveAll{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin:3px 0 12px;
  background:linear-gradient(135deg,#8f0012,#e01832);
  color:white;
  font-weight:900;
}

/* FILTROS */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.filter{
  flex:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.filter.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

/* PESQUISA */

.search{
  width:100%;
  padding:11px 13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  outline:none;
  margin-bottom:12px;
}

.search::placeholder{
  color:#718096;
}

/* JOGOS */

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  margin-bottom:10px;
  padding:12px;
}

.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:10px;
  margin-bottom:9px;
}

.teams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.team img{
  display:block;
  width:34px;
  height:34px;
  object-fit:contain;
  margin:0 auto 5px;
}

.score{
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.status{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  text-align:center;
}

.live{
  color:var(--red)!important;
}

.star{
  background:none;
  border:0;
  color:var(--muted);
  font-size:20px;
  padding:0;
}

.star.active{
  color:var(--yellow);
}

.cardButton{
  width:100%;
  border:0;
  background:none;
  color:inherit;
  padding:0;
  text-align:inherit;
}

/* ESTADOS */

.empty{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.loading{
  padding:35px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.errorBox{
  background:#210b10;
  border:1px solid #63202a;
  color:#ff9ca7;
  padding:14px;
  border-radius:13px;
  font-size:12px;
  line-height:1.5;
}

/* TABELAS */

.tableWrap{
  overflow-x:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:4px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,
td{
  padding:8px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
  white-space:nowrap;
}

th{
  color:var(--muted);
}

td:first-child,
th:first-child{
  text-align:left;
}

tr:last-child td{
  border-bottom:0;
}

/* EQUIPAS */

.teamList{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.teamBox{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 9px;
  text-align:center;
}

.teamBox strong{
  display:block;
  font-size:12px;
  margin-top:6px;
}

.teamLogo{
  width:42px;
  height:42px;
  object-fit:contain;
  display:block;
  margin:auto;
}

/* SECÇÕES */

.section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin:10px 0;
}

.section h3{
  font-size:14px;
  margin:0 0 10px;
}

.detailTitle{
  font-size:20px;
  font-weight:900;
  margin:10px 0;
}

/* NAVEGAÇÃO */

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  background:rgba(3,6,11,.98);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:center;
}

.nav button{
  width:25%;
  max-width:180px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 4px 9px;
  font-size:11px;
  font-weight:800;
}

.nav button.active{
  color:white;
}

.nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

/* DETALHE */

.overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:100;
  overflow:auto;
  display:none;
}

.overlay.show{
  display:block;
}

.overlayHead{
  position:sticky;
  top:0;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
  padding:13px 14px;
  z-index:2;
}

.back{
  border:0;
  background:var(--panel);
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
}

.detail{
  padding:14px;
}

/* CAMPO */

.pitch{
  height:330px;
  background:#075c36;
  border-radius:14px;
  position:relative;
  border:2px solid #1683FF;
  overflow:hidden;
}

.pitch:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  border-left:1px solid rgba(255,255,255,.6);
}

.pitch:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border:1px solid rgba(255,255,255,.6);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.playerDot{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%);
}

.bottomSpace{
  height:15px;
}

.smallBtn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  padding:8px 10px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
}

.smallBtn.active{
  background:var(--blue);
  border-color:var(--blue);
}

.buttonRow{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
}

.buttonRow::-webkit-scrollbar{
  display:none;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

@media(min-width:700px){
  main{
    padding:18px;
  }

  .card{
    padding:14px;
  }
}
</style>
</head>

function esc(v){

  return String(v ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


function getLiga(id){

    })
    ||

      id:id,
      nome:id,

    }

}


function normalizarNome(nome){

  return String(nome || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");

}


function dataTexto(valor){

  const d = new Date(valor);

  if(isNaN(d.getTime())){
    return "";
  }

  return (
    d.toLocaleDateString(
      "pt-PT",
      {
        day:"2-digit",
        month:"2-digit"
      }
    )
    +
    " · "
    +
    d.toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  );

}


function hojeISO(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return y + m + day;

}


function addDias(data, quantidade){

function dataISO(d){

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return y + "-" + m + "-" + day;

}


function dataQuery(d){

    d.getFullYear() +
    String(d.getMonth()+1).padStart(2,"0") +
    String(d.getDate()).padStart(2,"0")
  );

}

/* =========================================================
   CONVERTER FALLBACK PARA O FORMATO DA APP
   ========================================================= */

function makeFallbackGame(liga,row,index){

  const data = row[0];
  const casa = row[1];
  const fora = row[2];
  const scoreCasa = row[3];
  const scoreFora = row[4];

  let estado = "upcoming";

  if(
    scoreCasa !== null &&
    scoreCasa !== undefined &&
    scoreFora !== null &&
    scoreFora !== undefined
  ){
    estado = "finished";
  }

  return {

    id:
      "fb-" +
      liga +
      "-" +
      index +
      "-" +
      normalizarNome(casa) +
      "-" +
      normalizarNome(fora),

    league:liga,

    date:data,

    home:{
      id:null,
      name:casa,
      logo:""
    },

    away:{
      id:null,
      name:fora,
      logo:""
    },

    homeScore:scoreCasa,
    awayScore:scoreFora,

    state:estado,

    statusText:
      estado === "finished"
        ? "FINAL"
        : "Por começar"

  };

}


/* =========================================================
   NORMALIZAR EVENTO ESPN
   ========================================================= */

function normalizarESPN(ev,liga){

  const competition =
    ev?.competitions?.[0] || {};

  const competitors =
    competition.competitors || [];

  const home =
    competitors.find(
      x => x.homeAway === "home"
    )
    ||
    competitors[0]
    ||
    {};

  const away =
    competitors.find(
      x => x.homeAway === "away"
    )
    ||
    competitors[1]
    ||
    {};

  const status =
    competition.status ||
    ev.status ||
    {};

  const type =
    status.type ||
    {};

  let state = "upcoming";

  if(type.state === "in"){
    state = "live";
  }
  else if(type.state === "post"){
    state = "finished";
  }

  let statusText =
    type.shortDetail ||
    type.detail ||
    type.description ||
    "";

  if(state === "live"){
    statusText = "DIRETO";
  }

  if(state === "finished"){
    statusText = "FINAL";
  }

  const homeScore =
    home.score !== undefined &&
    home.score !== null &&
    home.score !== ""
      ? Number(home.score)
      : null;

  const awayScore =
    away.score !== undefined &&
    away.score !== null &&
    away.score !== ""
      ? Number(away.score)
      : null;

  return {

    id:String(ev.id),

    league:liga,

    date:
      ev.date ||
      competition.date ||
      "",

    home:{
      id:
        home?.team?.id ||
        home?.id ||
        null,

      name:
        home?.team?.displayName ||
        home?.team?.shortDisplayName ||
        home?.team?.name ||
        "Casa",

      logo:
        home?.team?.logo ||
        ""
    },

    away:{
      id:
        away?.team?.id ||
        away?.id ||
        null,

      name:
        away?.team?.displayName ||
        away?.team?.shortDisplayName ||
        away?.team?.name ||
        "Fora",

      logo:
        away?.team?.logo ||
        ""
    },

    homeScore:
      Number.isNaN(homeScore)
        ? null
        : homeScore,

    awayScore:
      Number.isNaN(awayScore)
        ? null
        : awayScore,

    state:state,

    statusText:statusText

  };

}


/* =========================================================
   BUSCAR UM DIA NA ESPN
   ========================================================= */

async function buscarESPNDia(liga,data){

  try{

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      dataQuery(data) +
      "&limit=100";

    const resposta =
      await fetch(url,{
        cache:"no-store"
      });

    if(!resposta.ok){
      return [];
    }

    const json =
      await resposta.json();

    return (json.events || [])
      .map(
        evento =>
          normalizarESPN(
            evento,
            liga
          )
      );

  }
  catch(erro){

    console.warn(
      "ESPN erro:",
      liga,
      erro
    );

    return [];

  }

}


/* =========================================================
   CHAVE PARA EVITAR DUPLICADOS
   ========================================================= */

function chaveJogo(jogo){

  return [
    jogo.league,
    String(jogo.date).slice(0,10),
    normalizarNome(jogo.home.name),
    normalizarNome(jogo.away.name)
  ].join("|");

}


/* =========================================================
   REMOVER DUPLICADOS
   ========================================================= */

function deduplicarJogos(lista){

  const mapa = new Map();

  lista.forEach(function(jogo){

    const chave =
      chaveJogo(jogo);

    if(!mapa.has(chave)){
      mapa.set(chave,jogo);
      return;
    }

    const antigo =
      mapa.get(chave);

    /*
      Se a ESPN tiver informação mais completa,
      damos prioridade ao jogo ESPN.
    */

    if(
      jogo.id &&
      !String(jogo.id).startsWith("fb-")
    ){
      mapa.set(chave,jogo);
    }
    else if(
      antigo.state === "upcoming" &&
      jogo.state === "finished"
    ){
      mapa.set(chave,jogo);
    }

  });

  return Array.from(mapa.values());

}


/* =========================================================
   ORDENAR JOGOS
   ========================================================= */

function ordenarJogos(lista){

  return lista.sort(function(a,b){

    return (
      new Date(a.date).getTime() -
      new Date(b.date).getTime()
    );

  });

}


/* =========================================================
   CARREGAR JOGOS DA COMPETIÇÃO
   ========================================================= */

async function carregarJogosLiga(liga){

  const fallback =
    FALLBACK[liga]?.games || [];

  const fallbackJogos =
    fallback.map(function(row,index){

      return makeFallbackGame(
        liga,
        row,
        index
      );

    });

  /*
    Procuramos alguns dias para trás
    e alguns dias para a frente.
  */

  const hoje = new Date();

  const pedidos = [];

  for(
    let i = -7;
    i <= 14;
    i++
  ){

    pedidos.push(
      buscarESPNDia(
        liga,
        addDias(hoje,i)
      )
    );

  }

  let resultados = [];

  try{

    const respostas =
      await Promise.all(pedidos);

    respostas.forEach(function(lista){

      resultados =
        resultados.concat(lista);

    });

  }
  catch(erro){

    console.warn(
      "Falha ao carregar ESPN:",
      erro
    );

  }

  let jogos =
    deduplicarJogos(
      resultados.concat(fallbackJogos)
    );

  /*
    Se não houver ESPN nem fallback,
    devolvemos lista vazia.
  */

  ordenarJogos(jogos);

  return jogos;

}

/* =========================================================
   TEXTO DO ESTADO DO JOGO
   ========================================================= */

function textoEstado(jogo){

  if(jogo.state === "live"){
    return "DIRETO";
  }

  if(jogo.state === "finished"){

    if(
      jogo.homeScore !== null &&
      jogo.awayScore !== null
    ){
      return "FINAL";
    }

    return "FINAL";
  }

  const d =
    new Date(jogo.date);

  if(!isNaN(d.getTime())){

    return d.toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

  return "Por começar";

}


/* =========================================================
   FILTRAR JOGOS
   ========================================================= */

function filtrarJogos(lista){

  let resultado =
    Array.from(lista);

  if(filtroAtual === "hoje"){

    const agora = new Date();

    const ano =
      agora.getFullYear();

    const mes =
      agora.getMonth();

    const dia =
      agora.getDate();

    resultado =
      resultado.filter(
        function(jogo){

          const d =
            new Date(jogo.date);

          return (
            d.getFullYear() === ano &&
            d.getMonth() === mes &&
            d.getDate() === dia
          );

        }
      );

  }

  else if(filtroAtual === "live"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "live"
      );

  }

  else if(filtroAtual === "proximos"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "upcoming"
      );

  }

  else if(filtroAtual === "resultados"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "finished"
      );

  }

  const input =
    document.getElementById(
      "searchInput"
    );

  const pesquisa =
    input
      ? input.value.trim().toLowerCase()
      : "";

  if(pesquisa){

    resultado =
      resultado.filter(
        function(jogo){

          return (
            jogo.home.name
              .toLowerCase()
              .includes(pesquisa)
            ||
            jogo.away.name
              .toLowerCase()
              .includes(pesquisa)
          );

        }
      );

  }

  return resultado;

}

/* =========================================================
   CONVERTER FALLBACK PARA O FORMATO DA APP
   ========================================================= */

function makeFallbackGame(liga,row,index){

  const data = row[0];
  const casa = row[1];
  const fora = row[2];
  const scoreCasa = row[3];
  const scoreFora = row[4];

  let estado = "upcoming";

  if(
    scoreCasa !== null &&
    scoreCasa !== undefined &&
    scoreFora !== null &&
    scoreFora !== undefined
  ){
    estado = "finished";
  }

  return {

    id:
      "fb-" +
      liga +
      "-" +
      index +
      "-" +
      normalizarNome(casa) +
      "-" +
      normalizarNome(fora),

    league:liga,

    date:data,

    home:{
      id:null,
      name:casa,
      logo:""
    },

    away:{
      id:null,
      name:fora,
      logo:""
    },

    homeScore:scoreCasa,
    awayScore:scoreFora,

    state:estado,

    statusText:
      estado === "finished"
        ? "FINAL"
        : "Por começar"

  };

}


/* =========================================================
   NORMALIZAR EVENTO ESPN
   ========================================================= */

function normalizarESPN(ev,liga){

  const competition =
    ev?.competitions?.[0] || {};

  const competitors =
    competition.competitors || [];

  const home =
    competitors.find(
      x => x.homeAway === "home"
    )
    ||
    competitors[0]
    ||
    {};

  const away =
    competitors.find(
      x => x.homeAway === "away"
    )
    ||
    competitors[1]
    ||
    {};

  const status =
    competition.status ||
    ev.status ||
    {};

  const type =
    status.type ||
    {};

  let state = "upcoming";

  if(type.state === "in"){
    state = "live";
  }
  else if(type.state === "post"){
    state = "finished";
  }

  let statusText =
    type.shortDetail ||
    type.detail ||
    type.description ||
    "";

  if(state === "live"){
    statusText = "DIRETO";
  }

  if(state === "finished"){
    statusText = "FINAL";
  }

  const homeScore =
    home.score !== undefined &&
    home.score !== null &&
    home.score !== ""
      ? Number(home.score)
      : null;

  const awayScore =
    away.score !== undefined &&
    away.score !== null &&
    away.score !== ""
      ? Number(away.score)
      : null;

  return {

    id:String(ev.id),

    league:liga,

    date:
      ev.date ||
      competition.date ||
      "",

    home:{
      id:
        home?.team?.id ||
        home?.id ||
        null,

      name:
        home?.team?.displayName ||
        home?.team?.shortDisplayName ||
        home?.team?.name ||
        "Casa",

      logo:
        home?.team?.logo ||
        ""
    },

    away:{
      id:
        away?.team?.id ||
        away?.id ||
        null,

      name:
        away?.team?.displayName ||
        away?.team?.shortDisplayName ||
        away?.team?.name ||
        "Fora",

      logo:
        away?.team?.logo ||
        ""
    },

    homeScore:
      Number.isNaN(homeScore)
        ? null
        : homeScore,

    awayScore:
      Number.isNaN(awayScore)
        ? null
        : awayScore,

    state:state,

    statusText:statusText

  };

}


/* =========================================================
   BUSCAR UM DIA NA ESPN
   ========================================================= */

async function buscarESPNDia(liga,data){

  try{

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      dataQuery(data) +
      "&limit=100";

    const resposta =
      await fetch(url,{
        cache:"no-store"
      });

    if(!resposta.ok){
      return [];
    }

    const json =
      await resposta.json();

    return (json.events || [])
      .map(
        evento =>
          normalizarESPN(
            evento,
            liga
          )
      );

  }
  catch(erro){

    console.warn(
      "ESPN erro:",
      liga,
      erro
    );

    return [];

  }

}


/* =========================================================
   CHAVE PARA EVITAR DUPLICADOS
   ========================================================= */

function chaveJogo(jogo){

  return [
    jogo.league,
    String(jogo.date).slice(0,10),
    normalizarNome(jogo.home.name),
    normalizarNome(jogo.away.name)
  ].join("|");

}


/* =========================================================
   REMOVER DUPLICADOS
   ========================================================= */

function deduplicarJogos(lista){

  const mapa = new Map();

  lista.forEach(function(jogo){

    const chave =
      chaveJogo(jogo);

    if(!mapa.has(chave)){
      mapa.set(chave,jogo);
      return;
    }

    const antigo =
      mapa.get(chave);

    /*
      Se a ESPN tiver informação mais completa,
      damos prioridade ao jogo ESPN.
    */

    if(
      jogo.id &&
      !String(jogo.id).startsWith("fb-")
    ){
      mapa.set(chave,jogo);
    }
    else if(
      antigo.state === "upcoming" &&
      jogo.state === "finished"
    ){
      mapa.set(chave,jogo);
    }

  });

  return Array.from(mapa.values());

}


/* =========================================================
   ORDENAR JOGOS
   ========================================================= */

function ordenarJogos(lista){

  return lista.sort(function(a,b){

    return (
      new Date(a.date).getTime() -
      new Date(b.date).getTime()
    );

  });

}


/* =========================================================
   CARREGAR JOGOS DA COMPETIÇÃO
   ========================================================= */

async function carregarJogosLiga(liga){

  const fallback =
    FALLBACK[liga]?.games || [];

  const fallbackJogos =
    fallback.map(function(row,index){

      return makeFallbackGame(
        liga,
        row,
        index
      );

    });

  /*
    Procuramos alguns dias para trás
    e alguns dias para a frente.
  */

  const hoje = new Date();

  const pedidos = [];

  for(
    let i = -7;
    i <= 14;
    i++
  ){

    pedidos.push(
      buscarESPNDia(
        liga,
        addDias(hoje,i)
      )
    );

  }

  let resultados = [];

  try{

    const respostas =
      await Promise.all(pedidos);

    respostas.forEach(function(lista){

      resultados =
        resultados.concat(lista);

    });

  }
  catch(erro){

    console.warn(
      "Falha ao carregar ESPN:",
      erro
    );

  }

  let jogos =
    deduplicarJogos(
      resultados.concat(fallbackJogos)
    );

  /*
    Se não houver ESPN nem fallback,
    devolvemos lista vazia.
  */

  ordenarJogos(jogos);

  return jogos;

}

/* =========================================================
   TEXTO DO ESTADO DO JOGO
   ========================================================= */

function textoEstado(jogo){

  if(jogo.state === "live"){
    return "DIRETO";
  }

  if(jogo.state === "finished"){

    if(
      jogo.homeScore !== null &&
      jogo.awayScore !== null
    ){
      return "FINAL";
    }

    return "FINAL";
  }

  const d =
    new Date(jogo.date);

  if(!isNaN(d.getTime())){

    return d.toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

  return "Por começar";

}


/* =========================================================
   FILTRAR JOGOS
   ========================================================= */

function filtrarJogos(lista){

  let resultado =
    Array.from(lista);

  if(filtroAtual === "hoje"){

    const agora = new Date();

    const ano =
      agora.getFullYear();

    const mes =
      agora.getMonth();

    const dia =
      agora.getDate();

    resultado =
      resultado.filter(
        function(jogo){

          const d =
            new Date(jogo.date);

          return (
            d.getFullYear() === ano &&
            d.getMonth() === mes &&
            d.getDate() === dia
          );

        }
      );

  }

  else if(filtroAtual === "live"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "live"
      );

  }

  else if(filtroAtual === "proximos"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "upcoming"
      );

  }

  else if(filtroAtual === "resultados"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "finished"
      );

  }

  const input =
    document.getElementById(
      "searchInput"
    );

  const pesquisa =
    input
      ? input.value.trim().toLowerCase()
      : "";

  if(pesquisa){

    resultado =
      resultado.filter(
        function(jogo){

          return (
            jogo.home.name
              .toLowerCase()
              .includes(pesquisa)
            ||
            jogo.away.name
              .toLowerCase()
              .includes(pesquisa)
          );

        }
      );

  }

  return resultado;

}

/* =========================================================
   CONVERTER FALLBACK PARA O FORMATO DA APP
   ========================================================= */

function makeFallbackGame(liga,row,index){

  const data = row[0];
  const casa = row[1];
  const fora = row[2];
  const scoreCasa = row[3];
  const scoreFora = row[4];

  let estado = "upcoming";

  if(
    scoreCasa !== null &&
    scoreCasa !== undefined &&
    scoreFora !== null &&
    scoreFora !== undefined
  ){
    estado = "finished";
  }

  return {

    id:
      "fb-" +
      liga +
      "-" +
      index +
      "-" +
      normalizarNome(casa) +
      "-" +
      normalizarNome(fora),

    league:liga,

    date:data,

    home:{
      id:null,
      name:casa,
      logo:""
    },

    away:{
      id:null,
      name:fora,
      logo:""
    },

    homeScore:scoreCasa,
    awayScore:scoreFora,

    state:estado,

    statusText:
      estado === "finished"
        ? "FINAL"
        : "Por começar"

  };

}


/* =========================================================
   NORMALIZAR EVENTO ESPN
   ========================================================= */

function normalizarESPN(ev,liga){

  const competition =
    ev?.competitions?.[0] || {};

  const competitors =
    competition.competitors || [];

  const home =
    competitors.find(
      x => x.homeAway === "home"
    )
    ||
    competitors[0]
    ||
    {};

  const away =
    competitors.find(
      x => x.homeAway === "away"
    )
    ||
    competitors[1]
    ||
    {};

  const status =
    competition.status ||
    ev.status ||
    {};

  const type =
    status.type ||
    {};

  let state = "upcoming";

  if(type.state === "in"){
    state = "live";
  }
  else if(type.state === "post"){
    state = "finished";
  }

  let statusText =
    type.shortDetail ||
    type.detail ||
    type.description ||
    "";

  if(state === "live"){
    statusText = "DIRETO";
  }

  if(state === "finished"){
    statusText = "FINAL";
  }

  const homeScore =
    home.score !== undefined &&
    home.score !== null &&
    home.score !== ""
      ? Number(home.score)
      : null;

  const awayScore =
    away.score !== undefined &&
    away.score !== null &&
    away.score !== ""
      ? Number(away.score)
      : null;

  return {

    id:String(ev.id),

    league:liga,

    date:
      ev.date ||
      competition.date ||
      "",

    home:{
      id:
        home?.team?.id ||
        home?.id ||
        null,

      name:
        home?.team?.displayName ||
        home?.team?.shortDisplayName ||
        home?.team?.name ||
        "Casa",

      logo:
        home?.team?.logo ||
        ""
    },

    away:{
      id:
        away?.team?.id ||
        away?.id ||
        null,

      name:
        away?.team?.displayName ||
        away?.team?.shortDisplayName ||
        away?.team?.name ||
        "Fora",

      logo:
        away?.team?.logo ||
        ""
    },

    homeScore:
      Number.isNaN(homeScore)
        ? null
        : homeScore,

    awayScore:
      Number.isNaN(awayScore)
        ? null
        : awayScore,

    state:state,

    statusText:statusText

  };

}


/* =========================================================
   BUSCAR UM DIA NA ESPN
   ========================================================= */

async function buscarESPNDia(liga,data){

  try{

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      dataQuery(data) +
      "&limit=100";

    const resposta =
      await fetch(url,{
        cache:"no-store"
      });

    if(!resposta.ok){
      return [];
    }

    const json =
      await resposta.json();

    return (json.events || [])
      .map(
        evento =>
          normalizarESPN(
            evento,
            liga
          )
      );

  }
  catch(erro){

    console.warn(
      "ESPN erro:",
      liga,
      erro
    );

    return [];

  }

}


/* =========================================================
   CHAVE PARA EVITAR DUPLICADOS
   ========================================================= */

function chaveJogo(jogo){

  return [
    jogo.league,
    String(jogo.date).slice(0,10),
    normalizarNome(jogo.home.name),
    normalizarNome(jogo.away.name)
  ].join("|");

}


/* =========================================================
   REMOVER DUPLICADOS
   ========================================================= */

function deduplicarJogos(lista){

  const mapa = new Map();

  lista.forEach(function(jogo){

    const chave =
      chaveJogo(jogo);

    if(!mapa.has(chave)){
      mapa.set(chave,jogo);
      return;
    }

    const antigo =
      mapa.get(chave);

    /*
      Se a ESPN tiver informação mais completa,
      damos prioridade ao jogo ESPN.
    */

    if(
      jogo.id &&
      !String(jogo.id).startsWith("fb-")
    ){
      mapa.set(chave,jogo);
    }
    else if(
      antigo.state === "upcoming" &&
      jogo.state === "finished"
    ){
      mapa.set(chave,jogo);
    }

  });

  return Array.from(mapa.values());

}


/* =========================================================
   ORDENAR JOGOS
   ========================================================= */

function ordenarJogos(lista){

  return lista.sort(function(a,b){

    return (
      new Date(a.date).getTime() -
      new Date(b.date).getTime()
    );

  });

}


/* =========================================================
   CARREGAR JOGOS DA COMPETIÇÃO
   ========================================================= */

async function carregarJogosLiga(liga){

  const fallback =
    FALLBACK[liga]?.games || [];

  const fallbackJogos =
    fallback.map(function(row,index){

      return makeFallbackGame(
        liga,
        row,
        index
      );

    });

  /*
    Procuramos alguns dias para trás
    e alguns dias para a frente.
  */

  const hoje = new Date();

  const pedidos = [];

  for(
    let i = -7;
    i <= 14;
    i++
  ){

    pedidos.push(
      buscarESPNDia(
        liga,
        addDias(hoje,i)
      )
    );

  }

  let resultados = [];

  try{

    const respostas =
      await Promise.all(pedidos);

    respostas.forEach(function(lista){

      resultados =
        resultados.concat(lista);

    });

  }
  catch(erro){

    console.warn(
      "Falha ao carregar ESPN:",
      erro
    );

  }

  let jogos =
    deduplicarJogos(
      resultados.concat(fallbackJogos)
    );

  /*
    Se não houver ESPN nem fallback,
    devolvemos lista vazia.
  */

  ordenarJogos(jogos);

  return jogos;

}

/* =========================================================
   TEXTO DO ESTADO DO JOGO
   ========================================================= */

function textoEstado(jogo){

  if(jogo.state === "live"){
    return "DIRETO";
  }

  if(jogo.state === "finished"){

    if(
      jogo.homeScore !== null &&
      jogo.awayScore !== null
    ){
      return "FINAL";
    }

    return "FINAL";
  }

  const d =
    new Date(jogo.date);

  if(!isNaN(d.getTime())){

    return d.toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

  return "Por começar";

}


/* =========================================================
   FILTRAR JOGOS
   ========================================================= */

function filtrarJogos(lista){

  let resultado =
    Array.from(lista);

  if(filtroAtual === "hoje"){

    const agora = new Date();

    const ano =
      agora.getFullYear();

    const mes =
      agora.getMonth();

    const dia =
      agora.getDate();

    resultado =
      resultado.filter(
        function(jogo){

          const d =
            new Date(jogo.date);

          return (
            d.getFullYear() === ano &&
            d.getMonth() === mes &&
            d.getDate() === dia
          );

        }
      );

  }

  else if(filtroAtual === "live"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "live"
      );

  }

  else if(filtroAtual === "proximos"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "upcoming"
      );

  }

  else if(filtroAtual === "resultados"){

    resultado =
      resultado.filter(
        jogo =>
          jogo.state === "finished"
      );

  }

  const input =
    document.getElementById(
      "searchInput"
    );

  const pesquisa =
    input
      ? input.value.trim().toLowerCase()
      : "";

  if(pesquisa){

    resultado =
      resultado.filter(
        function(jogo){

          return (
            jogo.home.name
              .toLowerCase()
              .includes(pesquisa)
            ||
            jogo.away.name
              .toLowerCase()
              .includes(pesquisa)
          );

        }
      );

  }

  return resultado;

}

/* =========================================================
   CALCULAR TABELA FUTSAL
   ========================================================= */

function tabelaFutsal(){

  const mapa = {};

  FUTSAL_TEAMS.forEach(
    function(nome){

      mapa[
        normalizarNome(nome)
      ] = {

        nome:nome,
        j:0,
        v:0,
        e:0,
        d:0,
        gm:0,
        gs:0,
        pts:0

      };

    }
  );

  FUTSAL_GAMES.forEach(
    function(row){

      const casa =
        mapa[
          normalizarNome(row[1])
        ];

      const fora =
        mapa[
          normalizarNome(row[2])
        ];

      if(
        !casa ||
        !fora ||
        row[3] === null ||
        row[4] === null
      ){
        return;
      }

      const gc =
        Number(row[3]);

      const gf =
        Number(row[4]);

      casa.j++;
      fora.j++;

      casa.gm += gc;
      casa.gs += gf;

      fora.gm += gf;
      fora.gs += gc;

      if(gc > gf){

        casa.v++;
        casa.pts += 3;
        fora.d++;

      }
      else if(gc < gf){

        fora.v++;
        fora.pts += 3;
        casa.d++;

      }
      else{

        casa.e++;
        fora.e++;

        casa.pts++;
        fora.pts++;

      }

    }
  );

  return Object.values(mapa)
    .sort(
      function(a,b){

        if(b.pts !== a.pts){
          return b.pts - a.pts;
        }

        const dgA =
          a.gm - a.gs;

        const dgB =
          b.gm - b.gs;

        return dgB - dgA;

      }
    )
    .map(
      function(t){

        return [
          t.nome,
          t.j,
          t.v,
          t.e,
          t.d,
          t.gm,
          t.gs,
          t.pts
        ];

      }
    );

}

/* =========================================================
   EQUIPAS
   ========================================================= */

function listaEquipasFutebol(){

  const nomes = [];

  jogosFutebol.forEach(
    function(jogo){

      if(
        jogo.home?.name &&
        !nomes.some(
          x =>
            normalizarNome(x) ===
            normalizarNome(jogo.home.name)
        )
      ){
        nomes.push(
          jogo.home.name
        );
      }

      if(
        jogo.away?.name &&
        !nomes.some(
          x =>
            normalizarNome(x) ===
            normalizarNome(jogo.away.name)
        )
      ){
        nomes.push(
          jogo.away.name
        );
      }

    }
  );

  return nomes.sort(
    function(a,b){
      return a.localeCompare(
        b,
        "pt-PT"
      );
    }
  );

}


function mostrarEquipas(){

  paginaAtual = "equipas";

  nav("navEquipas");

  const main =
    document.getElementById(
      "main"
    );

  let equipas =
    desportoAtual === "futsal"
      ? FUTSAL_TEAMS.slice()
      : listaEquipasFutebol();

  equipas =
    equipas.sort(
      function(a,b){
        return a.localeCompare(
          b,
          "pt-PT"
        );
      }
    );

  main.innerHTML = `

    <div class="sectionTitle">
      👥 Equipas
    </div>

    <div class="sectionSub">
      ${desportoAtual === "futsal"
        ? "Equipas da Liga Placard."
        : "Equipas encontradas nos jogos carregados."}
    </div>

    <div class="teamList">

      ${
        equipas.length
          ? equipas.map(
              renderEquipaBox
            ).join("")
          : `
            <div class="empty">
              Ainda não existem equipas carregadas.
            </div>
          `
      }

    </div>

  `;

}


function renderEquipaBox(nome){

  const favorita =
    isFavoritaEquipa(nome);

  return `

    <div
      class="teamBox"
      onclick="abrirEquipa('${esc(nome)}')">

      <button
        class="star ${
          favorita
            ? "active"
            : ""
        }"
        onclick="
          event.stopPropagation();
          toggleFavoritaEquipa('${esc(nome)}')
        ">

        ${favorita ? "★" : "☆"}

      </button>

      <strong>
        ${esc(nome)}
      </strong>

    </div>

  `;

}


/* =========================================================
   ABRIR EQUIPA
   ========================================================= */

function abrirEquipa(nome){

  const overlay =
    document.getElementById(
      "overlay"
    );

  const content =
    document.getElementById(
      "overlayContent"
    );

  let jogos = [];

  if(desportoAtual === "futsal"){

    jogos =
      getFutsalGames()
        .filter(
          function(jogo){

            return (
              normalizarNome(
                jogo.home.name
              ) === normalizarNome(nome)
              ||
              normalizarNome(
                jogo.away.name
              ) === normalizarNome(nome)
            );

          }
        );

  }
  else{

    jogos =
      jogosFutebol.filter(
        function(jogo){

          return (
            normalizarNome(
              jogo.home.name
            ) === normalizarNome(nome)
            ||
            normalizarNome(
              jogo.away.name
            ) === normalizarNome(nome)
          );

        }
      );

  }

  content.innerHTML = `

    <div class="detailTitle">
      ${esc(nome)}
    </div>

    <div class="section">

      <h3>
        ⭐ Favorito
      </h3>

      <button
        class="smallBtn ${
          isFavoritaEquipa(nome)
            ? "active"
            : ""
        }"
        onclick="
          toggleFavoritaEquipa('${esc(nome)}');
          abrirEquipa('${esc(nome)}');
        ">

        ${
          isFavoritaEquipa(nome)
            ? "★ Equipa favorita"
            : "☆ Adicionar aos favoritos"
        }

      </button>

    </div>

    <div class="section">

      <h3>
        Jogos
      </h3>

      ${
        jogos.length
          ? jogos.map(
              renderJogoCard
            ).join("")
          : `
            <div class="empty">
              Não existem jogos carregados
              para esta equipa.
            </div>
          `
      }

    </div>

  `;

  overlay.classList.add(
    "show"
  );

}


/* =========================================================
   ABRIR JOGO
   ========================================================= */

function abrirJogo(id){

  let jogo =
    jogosFutebol.find(
      x =>
        String(x.id) === String(id)
    );

  if(!jogo){

    jogo =
      getFutsalGames().find(
        x =>
          String(x.id) === String(id)
      );

  }

  if(!jogo){
    return;
  }

  const overlay =
    document.getElementById(
      "overlay"
    );

  const content =
    document.getElementById(
      "overlayContent"
    );

  const favorito =
    isFavoritoJogo(jogo.id);

  let resultado =
    "Por começar";

  if(
    jogo.homeScore !== null &&
    jogo.awayScore !== null
  ){

    resultado =
      jogo.homeScore +
      " - " +
      jogo.awayScore;

  }

  content.innerHTML = `

    <div
      class="detailTitle"
      style="text-align:center">

      ${esc(jogo.home.name)}
      <br>

      <span
        style="
          color:var(--blue2);
          font-size:28px;
          display:block;
          margin:8px 0;
        ">

        ${esc(resultado)}

      </span>

      ${esc(jogo.away.name)}

    </div>

    <div
      class="section"
      style="text-align:center">

      <div
        style="
          color:${
            jogo.state === "live"
              ? "var(--red)"
              : "var(--muted)"
          };
          font-weight:900;
          margin-bottom:8px;
        ">

        ${esc(
          textoEstado(jogo)
        )}

      </div>

      <div
        style="
          color:var(--muted);
          font-size:12px;
        ">

        ${esc(
          dataTexto(jogo.date)
        )}

      </div>

    </div>

    <div
      class="section"
      style="text-align:center">

      <button
        class="smallBtn ${
          favorito
            ? "active"
            : ""
        }"
        onclick="
          toggleFavoritoJogo('${esc(jogo.id)}');
          abrirJogo('${esc(jogo.id)}');
        ">

        ${
          favorito
            ? "★ Jogo favorito"
            : "☆ Adicionar aos favoritos"
        }

      </button>

    </div>

    <div class="section">

      <h3>
        📊 Informações
      </h3>

      <div class="notice">

        Competição:
        <strong>
          ${esc(
            getLiga(jogo.league).nome
          )}
        </strong>

        <br><br>

        ${
          jogo.state === "finished"
            ? "Jogo terminado."
            : jogo.state === "live"
              ? "Jogo a decorrer."
              : "Jogo ainda não começou."
        }

      </div>

    </div>

  `;

  overlay.classList.add(
    "show"
  );

}


/* =========================================================
   FECHAR DETALHE
   ========================================================= */

function fecharDetalhe(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

}


/* =========================================================
   RENDERIZAR PÁGINA ATUAL
   ========================================================= */

function renderPaginaAtual(){

  if(paginaAtual === "tabelas"){

    mostrarTabelas();

    return;

  }

  if(paginaAtual === "favoritos"){

    mostrarFavoritos();

    return;

  }

  if(paginaAtual === "equipas"){

    mostrarEquipas();

    return;

  }

  mostrarJogos();

}


/* =========================================================
   ARRANQUE DA APP
   ========================================================= */

async function iniciarApp(){

  try{

    desportoAtual = "futebol";

    ligaAtual = "por.1";

    filtroAtual = "todos";

    paginaAtual = "jogos";

    document
      .getElementById(
        "btnFutebol"
      )
      .classList.add("active");

    document
      .getElementById(
        "btnFutsal"
      )
      .classList.remove("active");

    await mostrarJogos();

  }
  catch(erro){

    console.error(
      "Erro ao iniciar FUTZONE:",
      erro
    );

    const main =
      document.getElementById(
        "main"
      );

    if(main){

      main.innerHTML = `

        <div class="errorBox">

          <strong>
            FUTZONE iniciou com um erro.
          </strong>

          <br><br>

          Atualiza a página e tenta novamente.

        </div>

      `;

    }

  }

}


/* =========================================================
   INICIAR
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  iniciarApp
);

   FECHO DO JAVASCRIPT
   ========================================================= */

</script>
