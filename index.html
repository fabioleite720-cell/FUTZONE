const ligas=[
 ["por.1","🇵🇹 Liga Portugal"],["por.2","🇵🇹 Liga Portugal 2"],["por.3","🇵🇹 Liga 3"],["por.w.1","🇵🇹 Liga BPI Feminina"],
 ["eng.1","🇬🇧 Premier League"],["eng.2","🇬🇧 Championship"],["esp.1","🇪🇸 LaLiga"],["esp.2","🇪🇸 LaLiga 2"],

];
let ligaAtual=ligas[0][0],filtroAtual="todos",favoritos=JSON.parse(localStorage.getItem("futzone_jogos_favoritos")||"[]");

function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function fetchJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}

function formatarData(x){try{return new Date(x).toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"long"})}catch(e){return""}}
function nomeEquipa(t){return t?.displayName||t?.shortDisplayName||t?.name||"Equipa"}

function isLive(e){return e?.status?.type?.state==="in"||e?.status?.type?.name==="STATUS_IN_PROGRESS"}
function isFinal(e){return e?.status?.type?.completed||e?.status?.type?.state==="post"}
function placar(e){
 const c=e?.competitions?.[0]?.competitors||[];
 const h=c.find(x=>x.homeAway==="home"),a=c.find(x=>x.homeAway==="away");
 return {h,a,hs:h?.score??"-",as:a?.score??"-"}
}

function cartaoJogo(e){
 const c=e?.competitions?.[0]?.competitors||[];
 const h=c.find(x=>x.homeAway==="home")||c[0],a=c.find(x=>x.homeAway==="away")||c[1];
 const p=placar(e),live=isLive(e),fin=isFinal(e);
 const fav=favoritos.includes(String(e.id));
 const hora=dataCurta(e.date);
 const comp=e?.league?.name||e?.competitions?.[0]?.league?.name||"Futebol";
 return `<div class="game" onclick="abrirJogo('${String(e.id).replaceAll("'","")}')">
  <div class="gameTop">
   <div class="comp">${escapeHtml(comp)}</div>
   <div class="status ${live?"live":fin?"final":""}">${live?"🔴 AO VIVO":fin?"FINAL":hora}</div>
   <button class="star ${fav?"on":""}" onclick="event.stopPropagation();toggleFavorito('${String(e.id).replaceAll("'","")}')">${fav?"★":"☆"}</button>

function fzAbrirJogador(id,nome,liga){
 id=decodeURIComponent(id||"");nome=decodeURIComponent(nome||"Jogador");liga=decodeURIComponent(liga||ligaAtual);
 document.getElementById("overlay").classList.add("show");document.getElementById("overlayTitle").textContent=nome;
 document.getElementById("overlayBody").innerHTML='<div class="loading">⏳ A carregar jogador...</div>';
 const timeout=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))]);
 const primeiro=v=>Array.isArray(v)?v[0]:v;
 const dataValor=claim=>{const v=claim?.mainsnak?.datavalue?.value;return v?.time?v.time.replace(/^\+/,"").split("T")[0]:v};
 const entidadeId=claim=>claim?.mainsnak?.datavalue?.value?.id||"";
 (async()=>{
  let a={},wikidata=null,wdEntities={};
  try{
   if(id){
    const d=await timeout(fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/"+encodeURIComponent(id)));
    a=d?.athlete||d||{};
   }
  }catch(e){}
  try{
   const termo=String(a.displayName||a.fullName||nome).trim();
   const q="https://www.wikidata.org/w/api.php?action=wbsearchentities&search="+encodeURIComponent(termo)+"&language=pt&uselang=pt&format=json&origin=*&limit=8";
   const sr=await timeout(fetchJSON(q)),results=sr?.search||[];
   const exact=results.find(x=>String(x.label||"").toLowerCase()===termo.toLowerCase())||results[0];
   if(exact?.id){
    const er=await timeout(fetchJSON("https://www.wikidata.org/w/api.php?action=wbgetentities&ids="+encodeURIComponent(exact.id)+"&props=claims%7Clabels%7Cdescriptions&languages=pt%7Cen&format=json&origin=*"));
    wikidata=er?.entities?.[exact.id]||null;
    const ids=new Set();
    (wikidata?.claims?.P54||[]).forEach(c=>{const x=entidadeId(c);if(x)ids.add(x)});
    ["P27","P413"].forEach(prop=>(wikidata?.claims?.[prop]||[]).forEach(c=>{const x=entidadeId(c);if(x)ids.add(x)}));
    if(ids.size){
     const labels=await timeout(fetchJSON("https://www.wikidata.org/w/api.php?action=wbgetentities&ids="+encodeURIComponent([...ids].join("|"))+"&props=labels&languages=pt%7Cen&format=json&origin=*"));
     wdEntities=labels?.entities||{};
    }
   }
  }catch(e){}
  const claims=wikidata?.claims||{};
  const labelWD=qid=>wdEntities?.[qid]?.labels?.pt?.value||wdEntities?.[qid]?.labels?.en?.value||qid;
  const claimLabel=prop=>labelWD(entidadeId(primeiro(claims[prop])));
  const wdNome=wikidata?.labels?.pt?.value||wikidata?.labels?.en?.value||"";
  const nomeFinal=a.displayName||a.fullName||wdNome||nome;
  const nacionalidade=a.nationality?.displayName||a.nationality||claimLabel("P27")||"-";
  const nascimento=a.dateOfBirth||a.birthDate||dataValor(primeiro(claims.P569))||"-";
  const altura=a.displayHeight||a.height||(claims.P2048?.[0]?.mainsnak?.datavalue?.value?.amount?Math.round(Number(claims.P2048[0].mainsnak.datavalue.value.amount))+" cm":"-");
  const peso=a.displayWeight||a.weight||(claims.P2067?.[0]?.mainsnak?.datavalue?.value?.amount?Math.round(Number(claims.P2067[0].mainsnak.datavalue.value.amount))+" kg":"-");
  const posicao=a.position?.displayName||a.position?.name||claimLabel("P413")||"Jogador";
  const foto=a.headshot?.href||"";
  const historico=[];
  (claims.P54||[]).forEach(c=>{
   const equipa=entidadeId(c);if(!equipa)return;
   const q=c.qualifiers||{},inicio=dataValor(primeiro(q.P580)),fim=dataValor(primeiro(q.P582));
   historico.push({equipa:labelWD(equipa),inicio,fim});
  });
  const uniq=new Map();historico.forEach(x=>uniq.set(x.equipa+"|"+(x.inicio||"")+"|"+(x.fim||""),x));
  const hist=[...uniq.values()].sort((x,y)=>String(y.inicio||"").localeCompare(String(x.inicio||"")));
  const temporada=x=>x.inicio?(x.inicio.slice(0,4)+(x.fim&&x.fim.slice(0,4)!==x.inicio.slice(0,4)?"–"+x.fim.slice(0,4):"")):"";
  let histHtml=hist.length?hist.map(x=>`<div class="event"><strong>${escapeHtml(temporada(x)||"Percurso")}</strong><br>${escapeHtml(x.equipa)}${x.inicio||x.fim?`<div style="color:var(--muted);font-size:11px;margin-top:3px">${escapeHtml(x.inicio||"")} ${x.fim?"→ "+escapeHtml(x.fim):"→ atual"}</div>`:""}</div>`).join(""):'<div style="color:var(--muted);font-size:13px">O histórico deste jogador não está registado na fonte consultada.</div>';
  document.getElementById("overlayBody").innerHTML=`<div class="detailCard" style="text-align:center">${foto?`<img src="${escapeHtml(foto)}" style="width:90px;height:90px;object-fit:contain">`:''}<h3>👤 ${escapeHtml(nomeFinal)}</h3><div style="color:var(--muted)">${escapeHtml(posicao)}</div></div><div class="detailCard"><h3>📊 Dados</h3><div style="color:var(--muted);font-size:13px">Nacionalidade: ${escapeHtml(nacionalidade)}<br>Data de nascimento: ${escapeHtml(nascimento)}<br>Altura: ${escapeHtml(altura)}<br>Peso: ${escapeHtml(peso)}</div></div><div class="detailCard"><h3>📚 Histórico de clubes</h3>${histHtml}</div>`;
 })();
}

async function fzBuscarTodos(){

 ini.setDate(ini.getDate()-1);fim.setDate(fim.getDate()+14);
 const ds=x=>x.toISOString().slice(0,10).replaceAll("-","");
 const range=ds(ini)+"-"+ds(fim);
 const out=[],seen=new Set();
 for(let i=0;i<ligas.length;i+=5){
  const lote=ligas.slice(i,i+5);
  await Promise.all(lote.map(async l=>{
   try{
    const d=await fetchJSON(API+encodeURIComponent(l[0])+"/scoreboard?dates="+range);
    (d.events||[]).forEach(e=>{
     e.__futzoneLiga=l[0];
     if(!seen.has(String(e.id))){seen.add(String(e.id));out.push(e)}
    });
   }catch(e){}
  }));
 }
 out.sort((a,b)=>new Date(a.date)-new Date(b.date));
 return out;
}

 if(!arr.length){c.innerHTML='<div class="empty">⚽<br><br>Não existem jogos para esta data.</div>';return}
 c.innerHTML=`<div class="fzAllHead"><b>⚽ FUTEBOL — TODAS AS COMPETIÇÕES</b><span>${arr.length} jogos</span></div>`+
 Object.keys(grupos).sort().map(d=>`<div class="dayTitle"><span>${escapeHtml(formatarData(grupos[d][0].date))}</span><span>${dataCurta(grupos[d][0].date)}</span></div>${grupos[d].map(fzCartaoComLiga).join("")}`).join("");
}

const fzCarregarJogosOriginal=carregarJogos;
carregarJogos=async function(){if(fzModoTodos){fzRenderTodos();return}return fzCarregarJogosOriginal()};

const fzSelecionarLigaOriginal=selecionarLiga;
selecionarLiga=function(id){fzModoTodos=false;fzSelecionarLigaOriginal(id)};

const fzRenderizarJogosOriginal=renderizarJogos;
renderizarJogos=function(){if(fzModoTodos){fzRenderTodos();return}return fzRenderizarJogosOriginal()};

const fzMostrarLiveOriginal=mostrarTodosLive;
mostrarTodosLive=async function(){
 fzModoTodos=true;
 fzDiaSelecionado=new Date().toISOString().slice(0,10);
 document.querySelectorAll(".fzDay").forEach(x=>x.classList.toggle("active",x.dataset.date===fzDiaSelecionado));
 const c=document.getElementById("footballContent");
 c.innerHTML='<div class="loading">🔴 A procurar jogos ao vivo em todas as competições...</div>';
 const ev=await fzBuscarTodos(),live=ev.filter(isLive);
 c.innerHTML=live.length?`<div class="fzAllHead"><b>🔴 AO VIVO — TODAS AS COMPETIÇÕES</b><span>${live.length}</span></div>`+live.map(cartaoJogo).join(""):'<div class="empty">🔴 Não existem jogos ao vivo neste momento.</div>';
};

/* Futsal: categorias nacionais FPF, sem inventar resultados atuais */
const FZ_FUTSAL_COMP=[
 ["placard","Liga Placard — I Divisão","https://www.fpf.pt/competicoes/futsal/masculino/i-divisao-futsal/jogos"],
 ["ii","II Divisão Masculina","https://www.fpf.pt/competicoes/futsal/masculino/ii-divisao-futsal/agenda"],
 ["iii","III Divisão Masculina","https://www.fpf.pt/competicoes/futsal/masculino/iii-divisao-futsal/agenda"],
 ["fem1","Liga Feminina — I Divisão","https://www.fpf.pt/competicoes/futsal/feminino/i-divisao-futsal/agenda"],
 ["fem2","II Divisão Feminina","https://www.fpf.pt/competicoes/futsal/feminino/ii-divisao-futsal/agenda"],
 ["u19","Sub-19 Masculino","https://www.fpf.pt/competicoes/futsal/masculino/sub-19"],
 ["u17","Sub-17 Masculino","https://www.fpf.pt/competicoes/futsal/masculino/sub-17"],
 ["u15","Sub-15 Masculino","https://www.fpf.pt/competicoes/futsal/masculino/sub-15"],
 ["fu19","Sub-19 Feminino","https://www.fpf.pt/competicoes/futsal/feminino/sub-19"],
 ["fu15","Sub-15 Feminino","https://www.fpf.pt/competicoes/futsal/feminino/sub-15"],
 ["taca","Taça de Portugal Futsal","https://resultados.fpf.pt/"],
 ["tn","Taças Nacionais","https://resultados.fpf.pt/"]
];

function fzFutsalCompeticoes(){
 return `<div class="fzFutComp">${FZ_FUTSAL_COMP.map((x,i)=>`<button class="${i===0?"active":""}" onclick="fzAbrirFutsalFonte(${i})">${escapeHtml(x[1])}</button>`).join("")}</div><div class="fzSource">Competições nacionais listadas segundo a estrutura FPF. Os resultados são apresentados apenas quando a fonte fornece dados; sem resultados inventados. <a href="https://resultados.fpf.pt/" target="_blank" rel="noopener">Centro de Resultados FPF ↗</a></div>`;
}

function fzAbrirFutsalFonte(i){
 const x=FZ_FUTSAL_COMP[i];
 document.querySelectorAll(".fzFutComp button").forEach((b,n)=>b.classList.toggle("active",n===i));
 document.getElementById("futsalContent").innerHTML=fzFutsalCompeticoes()+`<div class="detailCard"><h3>🥅 ${escapeHtml(x[1])}</h3><p style="color:var(--muted);font-size:13px;line-height:1.6">A fonte oficial FPF está disponível para consultar jogos, resultados e classificações desta competição. Nesta versão não são fabricados resultados quando a FPF não os disponibiliza diretamente ao navegador.</p><a href="${x[2]}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;background:var(--blue);color:#fff;padding:10px 12px;border-radius:9px;font-weight:800;text-decoration:none">Abrir dados FPF ↗</a></div>`;
}

const fzMudarDesportoOriginal=mudarDesporto;
mudarDesporto=function(d){
 fzMudarDesportoOriginal(d);
 if(d==="futebol"){
  setTimeout(()=>{fzCriarCabecalhoDias();fzTodosButton()},0);
 }else if(d==="futsal"){
  setTimeout(()=>{
   const c=document.getElementById("futsalContent");
   if(c&&!document.querySelector(".fzFutComp"))c.insertAdjacentHTML("afterbegin",fzFutsalCompeticoes());
  },0);
 }
};

criarLigas();
document.getElementById("futsalSection").classList.add("hide");
fzCriarCabecalhoDias();
fzTodosButton();

setTimeout(()=>{
 fzCriarCabecalhoDias();
 fzTodosButton();
 fzDiaSelecionado=new Date().toISOString().slice(0,10);
 fzRenderTodos();
},250);

</script>
