<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>FUTZONE ⚽</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;padding-bottom:20px}
header{background:#07111f;color:white;text-align:center;padding:24px}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0;opacity:.8}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:16px;padding:15px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
h2{margin:0 0 14px;font-size:20px}
.leagues{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:12px 7px;border:0;border-radius:10px;background:#07111f;color:white;font-weight:bold;font-size:14px}
button.active{background:#1769aa}
.match{border:1px solid #e1e5e9;border-radius:12px;padding:12px;margin:8px 0}
.date{font-size:12px;color:#68737d;margin-bottom:8px}
.team{display:flex;align-items:center;gap:10px;font-weight:bold;margin:7px 0}
.team img{width:32px;height:32px;object-fit:contain}
.score{text-align:center;font-size:20px;font-weight:bold;margin:5px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 5px;border-bottom:1px solid #e5e5e5;text-align:center}
th:nth-child(2),td:nth-child(2){text-align:left}
.table-team{display:flex;align-items:center;gap:7px}
.table-team img{width:25px;height:25px;object-fit:contain}
.loading{text-align:center;padding:20px;color:#68737d}
footer{text-align:center;font-size:11px;color:#68737d;padding:15px}
</style>
</head>

<body>

<header>
<h1>⚽ FUTZONE</h1>
<p>O teu futebol num só lugar</p>
</header>

<main>

<section class="card">
<h2>🏆 Competições</h2>

<div class="leagues">

<button class="active" onclick="liga('PPL','Primeira Liga',this)">
🇵🇹 Primeira Liga
</button>

<button onclick="liga('PL','Premier League',this)">
🏴 Premier League
</button>

<button onclick="liga('PD','La Liga',this)">
🇪🇸 La Liga
</button>

<button onclick="liga('SA','Serie A',this)">
🇮🇹 Serie A
</button>

<button onclick="liga('BL1','Bundesliga',this)">
🇩🇪 Bundesliga
</button>

</div>
</section>

<section class="card">
<h2 id="rt">🔴 Resultados — Primeira Liga</h2>
<div id="resultados" class="loading">A carregar...</div>
</section>

<section class="card">
<h2 id="jt">⚽ Próximos jogos — Primeira Liga</h2>
<div id="jogos" class="loading">A carregar...</div>
</section>

<section class="card">
<h2 id="ct">📊 Classificação — Primeira Liga</h2>
<div id="tabela" class="loading">A carregar...</div>
</section>

</main>

<footer>
Data provided by football-data.org
</footer>

<script>

const dados={
PPL:['data/primeira-liga.json','data/classificacao.json','Primeira Liga'],
PL:['data/premier-league.json','data/premier-league-classificacao.json','Premier League'],
PD:['data/la-liga.json','data/la-liga-classificacao.json','La Liga'],
SA:['data/serie-a.json','data/serie-a-classificacao.json','Serie A'],
BL1:['data/bundesliga.json','data/bundesliga-classificacao.json','Bundesliga']
};

function escudo(team){
return team.crest ||
'https://via.placeholder.com/40?text=⚽';
}

function equipa(team){
return `
<div class="team">
<img src="${escudo(team)}" alt="">
<span>${team.name}</span>
</div>
`;
}

async function liga(codigo,nome,botao){

document.querySelectorAll('.leagues button')
.forEach(b=>b.classList.remove('active'));

botao.classList.add('active');

document.getElementById('rt').textContent='🔴 Resultados — '+nome;
document.getElementById('jt').textContent='⚽ Próximos jogos — '+nome;
document.getElementById('ct').textContent='📊 Classificação — '+nome;

document.getElementById('resultados').innerHTML='A carregar...';
document.getElementById('jogos').innerHTML='A carregar...';
document.getElementById('tabela').innerHTML='A carregar...';

try{

const j=await fetch(dados[codigo][0]+'?t='+Date.now());
const jogos=await j.json();

const t=await fetch(dados[codigo][1]+'?t='+Date.now());
const tabela=await t.json();

mostrarResultados(jogos);
mostrarJogos(jogos);
mostrarTabela(tabela);

}catch(e){

document.getElementById('resultados').innerHTML='Erro ao carregar resultados.';
document.getElementById('jogos').innerHTML='Erro ao carregar jogos.';
document.getElementById('tabela').innerHTML='Erro ao carregar classificação.';

}

}

function mostrarResultados(dados){

const lista=dados.matches
.filter(x=>x.status==='FINISHED')
.sort((a,b)=>new Date(b.utcDate)-new Date(a.utcDate))
.slice(0,15);

if(!lista.length){
document.getElementById('resultados').innerHTML='Ainda não existem resultados.';
return;
}

document.getElementById('resultados').innerHTML=lista.map(x=>{

const d=new Date(x.utcDate);

return `
<div class="match">

<div class="date">
${d.toLocaleDateString('pt-PT')}
</div>

${equipa(x.homeTeam)}

<div class="score">
${x.score.fullTime.home} - ${x.score.fullTime.away}
</div>

${equipa(x.awayTeam)}

</div>
`;

}).join('');

}

function mostrarJogos(dados){

const agora=new Date();

const lista=dados.matches
.filter(x=>x.status!=='FINISHED')
.filter(x=>new Date(x.utcDate)>=agora)
.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate))
.slice(0,15);

if(!lista.length){
document.getElementById('jogos').innerHTML='Não existem próximos jogos.';
return;
}

document.getElementById('jogos').innerHTML=lista.map(x=>{

const d=new Date(x.utcDate);

return `
<div class="match">

<div class="date">
${d.toLocaleDateString('pt-PT')} —
${d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}
</div>

${equipa(x.homeTeam)}

<div style="text-align:center;font-weight:bold">🆚</div>

${equipa(x.awayTeam)}

</div>
`;

}).join('');

}

function mostrarTabela(dados){

const s=dados.standings.find(x=>x.type==='TOTAL')||dados.standings[0];

document.getElementById('tabela').innerHTML=`
<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Equipa</th>
<th>J</th>
<th>V</th>
<th>Pts</th>
</tr>
</thead>
<tbody>

${s.table.map(x=>`
<tr>
<td>${x.position}</td>
<td>
<div class="table-team">
<img src="${escudo(x.team)}" alt="">
<span>${x.team.name}</span>
</div>
</td>
<td>${x.playedGames}</td>
<td>${x.won}</td>
<td><b>${x.points}</b></td>
</tr>
`).join('')}

</tbody>
</table>
</div>
`;

}

liga('PPL','Primeira Liga',document.querySelector('.leagues button'));

</script>

</body>
</html>
