<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}

header{
 background:#000;
 border-bottom:1px solid #222;
 padding:18px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 font-size:28px;
 font-weight:900;
 color:#168cff
}

.logo span{color:#fff}

.container{
 padding:15px;
 max-width:900px;
 margin:auto
}

button{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.6
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:10px 0
}

.filters button{
 white-space:nowrap;
 background:#151515;
 border:1px solid #333
}

.filters button.active{
 background:#168cff;
 border-color:#168cff
}

.card{
 background:#101010;
 border:1px solid #252525;
 border-radius:14px;
 padding:14px;
 margin-bottom:12px
}

/* =========================
   CARTÃO DO JOGO
========================= */

.game-card{
 cursor:pointer;
 transition:.2s;
}

.game-card:hover{
 border-color:#168cff;
 transform:translateY(-1px)
}

.game-open{
 text-align:center;
 color:#168cff;
 font-size:11px;
 font-weight:bold;
 margin-top:12px
}

.league{
 color:#168cff;
 font-size:13px;
 font-weight:bold;
 margin-bottom:8px
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:10px
}

.team{
 font-weight:bold;
 cursor:pointer
}

.team:last-child{
 text-align:right
}

.team:hover{
 color:#168cff
}

.team-logo{
 width:35px;
 height:35px;
 object-fit:contain;
 vertical-align:middle;
 margin-right:7px
}

.score{
 font-size:20px;
 font-weight:900;
 white-space:nowrap
}

.status{
 font-size:12px;
 color:#aaa;
 margin-top:8px
}

.live-status{
 color:#ff3030;
 font-weight:900
}

.live-dot{
 display:inline-block;
 width:8px;
 height:8px;
 background:#ff3030;
 border-radius:50%;
 margin-right:5px
}

.update-bar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin:5px 0 10px
}

.update-text{
 color:#777;
 font-size:11px
}

.update-button{
 background:#168cff;
 padding:8px 12px;
 font-size:12px
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#080808;
 border-top:1px solid #252525;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30
}

.nav button{
 background:none;
 color:#aaa;
 padding:8px
}

.nav button.active{
 color:#168cff
}

.back{
 margin-bottom:15px;
 background:#202020
}

/* =========================
   DETALHES DO JOGO
========================= */

.match-detail{
 background:#101010;
 border:1px solid #252525;
 border-radius:16px;
 padding:18px;
 margin-bottom:15px
}

.match-header{
 text-align:center;
 color:#168cff;
 font-size:13px;
 font-weight:bold;
 margin-bottom:20px
}

.match-teams{
 display:grid;
 grid-template-columns:1fr 100px 1fr;
 align-items:center;
 gap:10px;
 text-align:center
}

.match-team{
 font-weight:900;
 font-size:15px;
 cursor:pointer
}

.match-team img{
 display:block;
 width:65px;
 height:65px;
 object-fit:contain;
 margin:0 auto 8px
}

.match-score{
 font-size:32px;
 font-weight:900
}

.match-state{
 margin-top:12px;
 text-align:center;
 font-size:13px;
 color:#aaa
}

.match-state.live{
 color:#ff3030;
 font-weight:900
}

.detail-section{
 background:#101010;
 border:1px solid #252525;
 border-radius:14px;
 margin-bottom:12px;
 overflow:hidden
}

.detail-title{
 padding:14px;
 font-weight:900;
 border-bottom:1px solid #252525;
 color:#168cff
}

.detail-content{
 padding:14px
}

.event{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #202020
}

.event:last-child{
 border-bottom:0
}

.event-time{
 width:45px;
 color:#168cff;
 font-weight:bold;
 text-align:center
}

.event-icon{
 font-size:18px;
 width:28px;
 text-align:center
}

.event-text{
 flex:1;
 font-size:13px
}

.info-row{
 display:flex;
 justify-content:space-between;
 padding:12px 14px;
 border-bottom:1px solid #222;
 gap:15px
}

.info-row:last-child{
 border-bottom:0
}

.info-label{
 color:#888
}

.info-value{
 font-weight:bold;
 text-align:right
}

.empty{
 text-align:center;
 color:#777;
 padding:30px
}

.table-wrap{
 overflow-x:auto
}

table{
 width:100%;
 border-collapse:collapse;
 background:#101010;
 min-width:520px
}

th,td{
 padding:10px 6px;
 border-bottom:1px solid #252525;
 text-align:center;
 font-size:13px
}

th{
 color:#168cff
}

.team-table{
 text-align:left;
 white-space:nowrap
}

.position-number{
 font-weight:bold
}

.points{
 font-weight:900;
 color:#168cff
}

/* =========================
   PLANTEL
========================= */

.plantel-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.player{
 background:#151515;
 border:1px solid #292929;
 border-radius:14px;
 padding:12px;
 text-align:center;
 cursor:pointer;
 transition:.2s
}

.player:hover{
 border-color:#168cff;
 transform:translateY(-2px)
}

.player img{
 width:80px;
 height:80px;
 object-fit:cover;
 border-radius:50%;
 background:#222;
 margin-bottom:8px
}

.player-name{
 font-weight:bold;
 font-size:14px
}

.player-info{
 color:#999;
 font-size:12px;
 margin-top:5px
}

.player-profile{
 text-align:center;
 padding:10px
}

.player-profile img{
 width:150px;
 height:150px;
 border-radius:50%;
 object-fit:cover;
 background:#181818;
 border:3px solid #168cff
}

.position{
 color:#168cff;
 font-weight:bold
}

@media(max-width:500px){

 .plantel-grid{
   grid-template-columns:repeat(2,1fr)
 }

 .player img{
   width:70px;
   height:70px
 }

 .teams{
   gap:5px
 }

 .team{
   font-size:13px
 }

 .score{
   font-size:18px
 }

 .match-teams{
   grid-template-columns:1fr 80px 1fr
 }

 .match-team{
   font-size:13px
 }

 .match-team img{
   width:50px;
   height:50px
 }

 .match-score{
   font-size:27px
 }
}
</style>
</head>

 </button>

</div>
