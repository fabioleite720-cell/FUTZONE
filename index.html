<style>

body{

header{

main{

h2{

.seletor-ligas{

.liga-btn{

.live-button{

.dot{

height:9px;
background:#FF4054;

.filtro{

gap:7px;

.filtro button{

background:#003B7A
}

.jogo{
background:#09111C;
border:1px solid #1B2A3B;

padding:11px;
margin-bottom:8px;

}

.jogo-top{
display:flex;

.team-click{

height:31px;

.vazio,.erro,.carregando{
background:#09111C;
border:1px solid #1B2A3B;

padding:18px;

color:#9DAABB

color:#FF8F8F

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:64px;
background:#09111C;
border-top:1px solid #1B2A3B;
display:flex;
z-index:30
}

.bottom button{
background:none;
border:0;
color:#9DAABB;
font-weight:bold;
width:33%;
font-size:12px
}

.bottom button.active{
color:#1683FF
}

.overlay{
position:fixed;
inset:0;
background:#03060B;
z-index:50;
overflow:auto
}

.detalhe-header{
position:sticky;
top:0;
background:#09111C;
border-bottom:1px solid #1B2A3B;
padding:11px;
z-index:5
}

.voltar{
background:#0D1724;
border:1px solid #243653;
color:#FFF;
border-radius:8px;
padding:8px 12px;
font-weight:bold
}

.detalhe{
max-width:720px;
margin:auto;
padding:10px 10px 35px
}

.jogo-grande{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:14px;
padding:18px 8px;
margin-bottom:10px
}

.jogo-grande .equipas{
grid-template-columns:1fr 85px 1fr
}

.jogo-grande .escudo{
width:52px;
height:52px
}

.jogo-grande .equipa{
font-size:14px
}

.bigscore{
text-align:center;
font-size:29px;
font-weight:900
}

.estado{
text-align:center;
color:#1683FF;
font-size:11px;
margin-top:4px
}

.secao{
background:#09111C;
border:1px solid #1B2A3B;
border-radius:12px;
margin:10px 0;
padding:11px
}

.secao h3{
font-size:14px;
margin:0 0 9px
}

.evento{
display:flex;
gap:8px;
padding:8px 0;
border-bottom:1px solid #1B2A3B;
font-size:12px
}

.evento:last-child{
border:0
}

.minuto{

font-weight:bold;
min-width:35px

.stats-head,.stat-row{

grid-template-columns:1fr 95px 1fr;

.stats-head{

.stat-row{

border-top:1px solid #1B2A3B;
font-size:11px
}

font-size:10px
}

font-weight:bold

.stat-away{

font-weight:bold

.lista-jogadores{

grid-template-columns:1fr 1fr;
gap:6px

.jogador{
background:#0D1724;
border:1px solid #1B2A3B;

color:#1683FF;
margin-right:4px

table{

}

.tabela-wrap{

}

.tabela-wrap table{
min-width:430px
}

text-align:center;

width:80px;

object-fit:contain

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
<div class="sub">FUTEBOL EM DIRETO</div>
</header>

<main id="app"></main>

<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[
{name:"Portugal",code:"por.1",icon:"🇵🇹"},
{name:"Inglaterra",code:"eng.1",icon:"🏴"},
{name:"Espanha",code:"esp.1",icon:"🇪🇸"},
{name:"Itália",code:"ita.1",icon:"🇮🇹"},
{name:"Alemanha",code:"ger.1",icon:"🇩🇪"},
{name:"França",code:"fra.1",icon:"🇫🇷"},
{name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},
{name:"Bélgica",code:"bel.1",icon:"🇧🇪"},
{name:"Champions",code:"uefa.champions",icon:"🏆"},
{name:"Europa",code:"uefa.europa",icon:"🏆"},
{name:"Conference",code:"uefa.europa.conf",icon:"🏆"}
];

let ligaAtual=ligas[0];
let jogosAtuais=[];
let modoJogos="todos";

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

function logo(u){
return u
?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`
:"<div style='height:35px'></div>";
}

function nav(id){
["navJogos","navTabelas","navFav"]
.forEach(x=>document.getElementById(x).classList.toggle("active",x===id));
}

function data8(d){
return d.getFullYear()+
String(d.getMonth()+1).padStart(2,"0")+
String(d.getDate()).padStart(2,"0");
}

function estado(ev){

const s=ev?.status||ev?.competitions?.[0]?.status||{};
const t=s.type||{};

if(t.state==="in")
return{
txt:t.shortDetail||t.detail||t.displayClock||"DIRETO",
live:true,
final:false
};

if(t.state==="post")
return{
txt:t.shortDetail||t.detail||"FINAL",
live:false,
final:true
};

return{
txt:t.shortDetail||t.detail||t.name||"",
live:false,
final:false
};
}

function normalizar(ev,l){

const c=ev.competitions?.[0]||{};
const cs=c.competitors||[];

const h=
cs.find(x=>x.homeAway==="home")||
cs[0]||{};

const a=
cs.find(x=>x.homeAway==="away")||
cs[1]||{};

const s=estado(ev);

return{
id:String(ev.id),
date:ev.date||"",
status:ev.status||c.status||{},

home:{
nome:h.team?.displayName||h.team?.shortDisplayName||"Casa",
logo:h.team?.logo||"",
score:h.score??"-",
id:h.team?.id
},

away:{
nome:a.team?.displayName||a.team?.shortDisplayName||"Fora",
logo:a.team?.logo||"",
score:a.score??"-",
id:a.team?.id
},

estado:s,
liga:l.name,
code:l.code
};
}

async function buscarEventos(l){

const hoje=new Date();
const ini=new Date(hoje);
const fim=new Date(hoje);

ini.setDate(ini.getDate()-120);
fim.setDate(fim.getDate()+120);

const urls=[

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,

`${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`

];

for(const u of urls){

try{

const r=await fetch(u);

if(!r.ok)continue;

const d=await r.json();

if(Array.isArray(d.events)&&d.events.length)
return d.events;

}catch(e){}

}

return[];
}

async function carregarJogos(){

app.innerHTML=
'<div class="carregando">A carregar jogos das ligas...</div>';

let lista=[];

for(const l of ligas){

const evs=await buscarEventos(l);

evs.forEach(e=>{
lista.push(normalizar(e,l));
});

}

const mapa=new Map();

lista.forEach(j=>{
mapa.set(j.id,j);
});

jogosAtuais=
[...mapa.values()]
.sort((a,b)=>new Date(a.date)-new Date(b.date));

if(modoJogos==="live")
mostrarJogosAoVivo();
else
mostrarJogos();
}

function botoesLigas(){

return`
<div class="seletor-ligas">

${ligas.map(l=>`

<button
class="liga-btn ${l.code===ligaAtual.code?"active":""}"
onclick="selecionarLiga('${l.code}')">

<span class="liga-icon">${l.icon}</span>

${esc(l.name)}

</button>

`).join("")}

</div>
`;
}

function selecionarLiga(code){

ligaAtual=
ligas.find(l=>l.code===code)||
ligas[0];

modoJogos="todos";

mostrarJogos();
}

function dataLocal(d){

try{

return new Intl.DateTimeFormat(
"pt-PT",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
).format(new Date(d));

}catch(e){

return"";

}
}

function teamHtml(t,code){

return`
<div
class="equipa team-click"
onclick="
event.stopPropagation();
abrirEquipa(
'${esc(code)}',
'${esc(t.id||"")}',
'${esc(t.nome)}',
'${esc(t.logo)}'
);
">

${logo(t.logo)}

${esc(t.nome)}

</div>
`;
}

function cartao(j){

const l=
j.estado.live
?
`<span class="estado-live">
🔴 ${esc(j.estado.txt)}
</span>`
:
j.estado.final
?
`<span class="estado-final">
${esc(j.estado.txt)}
</span>`
:
esc(dataLocal(j.date));

return`

<div
class="jogo"
onclick="abrirJogo('${esc(j.id)}','${esc(j.code)}')">

<div class="jogo-top">

<span>${esc(j.liga)}</span>

<span>${l}</span>

</div>

<div class="equipas">

${teamHtml(j.home,j.code)}

<div class="resultado">
${esc(j.home.score)}
-
${esc(j.away.score)}
</div>

${teamHtml(j.away,j.code)}

</div>

</div>
`;
}

function mostrarJogos(){

nav("navJogos");

let l=
jogosAtuais
.filter(j=>j.liga===ligaAtual.name);

if(modoJogos==="passados")
l=l.filter(j=>j.estado.final);

if(modoJogos==="futuros")
l=l.filter(j=>!j.estado.final&&!j.estado.live);

if(modoJogos==="live")
l=l.filter(j=>j.estado.live);

const totalLive=
jogosAtuais.filter(j=>j.estado.live).length;

app.innerHTML=`

<h2>Jogos</h2>

<button
class="live-button"
onclick="mostrarJogosAoVivo()">

<span class="dot"></span>

🔴 Jogos ao Vivo

${totalLive?` (${totalLive})`:""}

</button>

${botoesLigas()}

<div class="filtro">

<button
class="${modoJogos==='todos'?'active':''}"
onclick="modoJogos='todos';mostrarJogos()">

Todos

</button>

<button
class="${modoJogos==='passados'?'active':''}"
onclick="modoJogos='passados';mostrarJogos()">

Já realizados

</button>

<button
class="${modoJogos==='futuros'?'active':''}"
onclick="modoJogos='futuros';mostrarJogos()">

Futuros

</button>

</div>

<h2>${esc(ligaAtual.name)}</h2>

${l.length
?l.map(cartao).join("")
:'<div class="vazio">Não há jogos encontrados neste período.</div>'}

`;
}

function mostrarJogosAoVivo(){

modoJogos="live";

nav("navJogos");

const l=
jogosAtuais
.filter(j=>j.estado.live);

app.innerHTML=`

<h2>🔴 Jogos ao Vivo</h2>

<div class="vazio" style="margin-bottom:12px">

${l.length
?l.length+" jogo(s) ao vivo em todas as ligas"
:"Não há jogos ao vivo neste momento."}

</div>

${l.length
?l.map(cartao).join("")
:""}

`;
}

function txt(v){

return typeof v==="object"
?
(v?.displayValue??v?.value??v?.text??"")
:
String(v??"");

}

function extrairEventos(d){

let out=[];
let seen=new Set();

let arr=[
...(d.plays||[]),
...(d.keyEvents||[]),
...(d.scoringPlays||[])
];

for(const e of arr){

const raw=
(
(e?.type?.text||"")+" "+
(e?.text||e?.shortText||e?.description||"")
).toLowerCase();

if(!/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(raw))
continue;

const k=
String(e?.id||"")+
raw+
(e?.clock?.displayValue||"");

if(seen.has(k))
continue;

seen.add(k);

const ic=
/yellow|amarelo/.test(raw)
?"🟨"
:
/red|vermelho/.test(raw)
?"🟥"
:
/substitut/.test(raw)
?"🔄"
:"⚽";

out.push({

m:e?.clock?.displayValue||"",

t:e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento",

i:ic

});

}

return out;
}

function extrairStats(d){

const gs=[];

function add(team,stats){

if(!team||!Array.isArray(stats))
return;

const id=
team.id||
team.team?.id||
team.displayName||
team.team?.displayName;

let g=
gs.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:
team.displayName||
team.name||
team.team?.displayName||
"Equipa",
s:[]
};

gs.push(g);

}

stats.forEach(x=>{

const n=
x.displayName||
x.shortDisplayName||
x.name||
x.label||
x.description;

if(n)
g.s.push({
n,
v:txt(
x.displayValue??
x.value??
x.display
)
});

});

}

(d.boxscore?.teams||[])
.forEach(x=>add(
x.team||x,
x.statistics||x.stats
));

(d.header?.competitions?.[0]?.competitors||[])
.forEach(x=>add(
x.team||x,
x.statistics
));

(d.competitions?.[0]?.competitors||[])
.forEach(x=>add(
x.team||x,
x.statistics
));

if(gs.length<2)
return[];

const m=new Map();

gs.slice(0,2).forEach((g,i)=>{

g.s.forEach(x=>{

const k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{
n:x.n,
h:"-",
a:"-"
});

if(i===0)
m.get(k).h=x.v;
else
m.get(k).a=x.v;

});

});

return[...m.values()];
}

function extrairPlantel(d){

const gs=[];

function add(team,arr){

if(!team||!Array.isArray(arr))
return;

const id=
team.id||
team.team?.id||
team.displayName||
team.team?.displayName;

let g=
gs.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:
team.displayName||
team.name||
team.team?.displayName||
"Equipa",
p:[]
};

gs.push(g);

}

arr.forEach(x=>{

const a=x?.athlete||
x?.player||
x;

if(!a?.displayName&&!a?.fullName)
return;

const n=
a.displayName||
a.fullName;

if(!g.p.some(p=>p.n===n)){

g.p.push({

n,
num:a.jersey||x.jersey||"",
pos:
a.position?.abbreviation||
a.position?.displayName||
"",

tit:x.starter===true

});

}

});

}

(d.rosters||[])
.forEach(r=>add(
r.team||r,
r.roster||
r.athletes||
r.players
));

(d.boxscore?.players||[])
.forEach(r=>add(
r.team||r,
r.statistics||
r.athletes||
r.roster||
r.players
));

return gs.filter(x=>x.p.length);
}

function blocoEventos(a){

return`

<div class="secao">

<h3>⚽ Golos, cartões e eventos</h3>

${a.length

?
a.map(e=>`

<div class="evento">

<span class="minuto">
${esc(e.m)}
</span>

<span>
${e.i}
${esc(e.t)}
</span>

</div>

`).join("")

:
'<div class="vazio">Sem eventos disponíveis.</div>'
}

</div>
`;
}

function blocoStats(a){

return`

<div class="secao">

<h3>📊 Estatísticas</h3>

${a.length

?
`

<div class="stats-head">

<span>Casa</span>
<span>ESTAT.</span>
<span>Fora</span>

</div>

${a.map(x=>`

<div class="stat-row">

<div class="stat-home">
${esc(x.h)}
</div>

<div class="nome">
${esc(x.n)}
</div>

<div class="stat-away">
${esc(x.a)}
</div>

</div>

`).join("")}

`

:
'<div class="vazio">Estatísticas não disponíveis para este jogo.</div>'
}

</div>
`;
}

function blocoPlantel(gs){

return gs.length
?

`

<div class="secao">

<h3>👥 Titulares / Plantel</h3>

${gs.map(g=>`

<div style="margin-bottom:14px">

<b>${esc(g.nome)}</b>

<div class="subtitulo">
Jogadores
</div>

<div class="lista-jogadores">

${g.p.map(p=>`

<div class="jogador">

<b>${esc(p.num)}</b>

${esc(p.n)}

${p.pos
?`
<small
style="display:block;color:#9DAABB">
${esc(p.pos)}
</small>
`
:""}

</div>

`).join("")}

</div>

</div>

`).join("")}

</div>

`

:"";
}

async function abrirJogo(id,code){

const j=
jogosAtuais.find(x=>x.id===id);

if(!j)
return;

const o=document.createElement("div");

o.className="overlay";

o.innerHTML=`

<div class="detalhe-header">

<button
class="voltar"
onclick="this.closest('.overlay').remove()">

← Voltar

</button>

</div>

<div class="detalhe">

<div class="jogo-grande">

<div class="equipas">

${teamHtml(j.home,code)}

<div>

<div class="bigscore">

function statVal(e,aliases){

for(const a of aliases){

if(e[a]!==undefined)
return e[a];

if(e.stats&&e.stats[a]!==undefined)
return e.stats[a];

}

return"";
}

function grupos(o){

let out=[];

function walk(x){

if(!x||typeof x!=="object")
return;

if(Array.isArray(x.entries))
out.push(x.entries);

if(Array.isArray(x.children))
x.children.forEach(walk);

for(const k of Object.keys(x)){

if(
k!=="entries"&&
k!=="children"&&
x[k]&&
typeof x[k]==="object"
)
walk(x[k]);

}

}

walk(o);

return out.find(a=>a.length)||[];
}

function linhas(entries){

return entries.map((e,i)=>{

const t=e.team||e;

return{

rank:
statVal(e,["rank","position"])||
i+1,

team:
t.displayName||
t.name||
t.team?.displayName||
"Equipa",

id:
t.id||
t.team?.id||
"",

logo:
t.logo||
t.team?.logos?.[0]?.href||
t.team?.logo||
"",

j:
statVal(e,[
"gamesPlayed",
"played",
"gp"
]),

v:
statVal(e,[
"wins",
"won",
"w"
]),

e:
statVal(e,[
"ties",
"draws",
"drawn",
"d"
]),

d:
statVal(e,[
"losses",
"lost",
"l"
]),

dg:
statVal(e,[
"pointDifferential",
"goalDifference",
"gd"
]),

pts:
statVal(e,[
"points",
"pts"
])

};

});
}
