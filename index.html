<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060B;color:#FFF;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#09111C;border-bottom:1px solid #1B2A3B;padding:14px 12px}
.logo{font-size:25px;font-weight:900}.logo span{color:#1683FF}.sub{font-size:10px;color:#9DAABB;margin-top:2px}
main{padding:12px 10px 85px;max-width:720px;margin:auto}h2{font-size:18px;margin:15px 0 10px}
.seletor-ligas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.liga-btn{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:10px 5px;color:#FFF;font-size:12px;font-weight:bold}.liga-btn.active{background:#003B7A;border-color:#1683FF}.liga-icon{display:block;font-size:20px;margin-bottom:4px}
.live-button{width:100%;background:#09111C;border:1px solid #FF4054;color:#FFF;border-radius:11px;padding:12px;margin-bottom:12px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;background:#FF4054;border-radius:50%;margin-right:5px}
.filtro{display:flex;gap:7px;margin:8px 0 12px}.filtro button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:8px;font-size:11px}.filtro button.active{color:#FFF;border-color:#1683FF;background:#003B7A}
.jogo{background:#09111C;border:1px solid #1B2A3B;border-radius:13px;padding:11px;margin-bottom:8px;cursor:pointer}.jogo-top{display:flex;justify-content:space-between;color:#9DAABB;font-size:10px;margin-bottom:8px}.equipas{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;gap:5px}.equipa{text-align:center;font-size:12px;font-weight:bold}.escudo{width:31px;height:31px;object-fit:contain;display:block;margin:0 auto 4px}.resultado{text-align:center;font-size:18px;font-weight:900}.estado-live{color:#FF4054;font-weight:900}.estado-final{color:#9DAABB}.vazio,.erro,.carregando{background:#09111C;border:1px solid #1B2A3B;border-radius:11px;padding:18px;text-align:center;color:#9DAABB}.erro{color:#FF8F8F}
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#09111C;border-top:1px solid #1B2A3B;display:flex;z-index:30}.bottom button{background:none;border:0;color:#9DAABB;font-weight:bold;width:33%;font-size:12px}.bottom button.active{color:#1683FF}
.overlay{position:fixed;inset:0;background:#03060B;z-index:50;overflow:auto}.detalhe-header{position:sticky;top:0;background:#09111C;border-bottom:1px solid #1B2A3B;padding:11px;z-index:5}.voltar{background:#0D1724;border:1px solid #243653;color:#FFF;border-radius:8px;padding:8px 12px;font-weight:bold}.detalhe{max-width:720px;margin:auto;padding:10px 10px 35px}
.jogo-grande{background:#09111C;border:1px solid #1B2A3B;border-radius:14px;padding:18px 8px;margin-bottom:10px}.jogo-grande .equipas{grid-template-columns:1fr 85px 1fr}.jogo-grande .escudo{width:52px;height:52px}.jogo-grande .equipa{font-size:14px}.bigscore{text-align:center;font-size:29px;font-weight:900}.estado{text-align:center;color:#1683FF;font-size:11px;margin-top:4px}
.secao{background:#09111C;border:1px solid #1B2A3B;border-radius:12px;margin:10px 0;padding:11px}.secao h3{font-size:14px;margin:0 0 9px}.evento{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1B2A3B;font-size:12px}.evento:last-child{border:0}.minuto{color:#1683FF;font-weight:bold;min-width:35px}
.stats-head,.stat-row{display:grid;grid-template-columns:1fr 95px 1fr;text-align:center}.stats-head{font-size:11px;color:#9DAABB}.stat-row{padding:8px 0;border-top:1px solid #1B2A3B;font-size:11px}.nome{color:#9DAABB;font-size:10px}.stat-home{text-align:right;font-weight:bold}.stat-away{text-align:left;font-weight:bold}
.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:6px}.jogador{background:#0D1724;border:1px solid #1B2A3B;border-radius:7px;padding:8px;font-size:11px}.jogador b{color:#1683FF;margin-right:4px}.subtitulo{color:#9DAABB;font-size:10px;margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px 4px;border-bottom:1px solid #1B2A3B;text-align:center}th{color:#9DAABB}
.desporto{display:flex;gap:7px;margin:8px 0 12px}.desporto button{flex:1;background:#0D1724;border:1px solid #1B2A3B;color:#9DAABB;border-radius:8px;padding:9px;font-weight:bold}.desporto button.active{color:#FFF;border-color:#1683FF;background:#003B7A}

.campo-futzone{background:linear-gradient(90deg,#0a5b32,#0d7a42);border:3px solid #fff;border-radius:14px;margin-top:10px;padding:10px;position:relative;min-height:430px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.campo-futzone:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.9);transform:translateX(-50%)}
.campo-futzone:after{content:"";position:absolute;width:105px;height:105px;border:2px solid rgba(255,255,255,.9);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.campo-meio{position:absolute;left:50%;top:50%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);z-index:1}
.area-home,.area-away{position:absolute;width:92px;height:180px;border:2px solid #fff;top:50%;transform:translateY(-50%);z-index:0}.area-home{left:0;border-left:0}.area-away{right:0;border-right:0}
.campo-titulo{font-weight:900;text-align:center;font-size:12px;margin-bottom:7px}.campo-sub{font-size:10px;color:#9DAABB;text-align:center;margin-bottom:6px}
.jogador-campo{position:absolute;transform:translate(-50%,-50%);width:72px;text-align:center;z-index:3;font-size:9px;font-weight:900;line-height:1.05}.jogador-campo .camisa{width:30px;height:30px;border-radius:50%;background:#1683FF;border:2px solid #fff;margin:auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.jogador-campo.fora .camisa{background:#f4f4f4;color:#111}.jogador-campo .nome-campo{background:rgba(3,6,11,.85);border-radius:5px;padding:2px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.campo-legenda{display:flex;justify-content:center;gap:16px;font-size:10px;margin-top:7px;color:#9DAABB}.campo-legenda span{display:flex;align-items:center;gap:4px}.bola-leg{width:12px;height:12px;border-radius:50%;background:#1683FF;border:1px solid #fff}.bola-leg.fora{background:#f4f4f4}
.campo-futsal{min-height:350px}.campo-futsal .area-home,.campo-futsal .area-away{width:70px;height:150px}.campo-futsal:after{width:85px;height:85px}

/* FUTZONE SCOREBOARD — visual inspirado em apps de resultados */
.score-toolbar{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px;padding-bottom:2px}.score-toolbar button{flex:0 0 auto;background:#0D1724;border:1px solid #1B2A3B;color:#B9C4D2;border-radius:7px;padding:7px 10px;font-size:10px;font-weight:800}.score-toolbar button.active{background:#0057B8;border-color:#1683FF;color:#fff}
.dia-header{display:flex;align-items:center;justify-content:space-between;background:#101B29;border-left:3px solid #1683FF;padding:9px 10px;margin:12px 0 6px;border-radius:7px;font-size:11px;font-weight:900}.dia-header span:last-child{color:#7F8DA0;font-size:9px}
.competicao-header{display:flex;align-items:center;gap:7px;padding:8px 4px;color:#B9C4D2;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.fs-card{background:#09111C;border:1px solid #1B2A3B;border-radius:8px;margin-bottom:5px;overflow:hidden}.fs-card-main{display:grid;grid-template-columns:52px 1fr 58px;align-items:center;min-height:70px}.fs-time{text-align:center;color:#9DAABB;font-size:10px}.fs-time.live{color:#FF4054;font-weight:900}.fs-teams{padding:7px 4px}.fs-team{display:grid;grid-template-columns:1fr 25px;align-items:center;gap:4px;font-size:11px;font-weight:800;line-height:1.7}.fs-team img{width:21px;height:21px;object-fit:contain;grid-column:2;grid-row:1}.fs-team span{grid-column:1;grid-row:1;text-align:left}.fs-score{text-align:center;font-size:14px;font-weight:900;line-height:1.8}.fs-score.live{color:#FF4054}.fs-bottom{border-top:1px solid #162333;padding:4px 8px;color:#657488;font-size:8px;display:flex;justify-content:space-between}.fs-live-dot{color:#FF4054;font-weight:900}.tabela-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tabela-top small{color:#6F7E90;font-size:9px}.tabela-scroll{overflow-x:auto}.tabela-flash th{background:#101B29;position:sticky;top:0}.tabela-flash td,.tabela-flash th{padding:8px 5px}.tabela-flash tbody tr:nth-child(even){background:#0B1420}.tabela-flash td:first-child{font-weight:900;color:#9DAABB}.tabela-flash td:nth-child(2){font-weight:800;text-align:left;white-space:nowrap}.tabela-flash td:last-child{font-weight:900;color:#fff}.pontos-destaque{color:#1683FF!important;font-size:12px}.forma-mini{font-size:8px;color:#6F7E90}
</style>
</head>
<body>
<header><div class="logo">FUT<span>ZONE</span></div></header>
<main id="app"></main>
<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>
<script>
