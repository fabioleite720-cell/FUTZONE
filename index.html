<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0057b8">
<title>FUTZONE PREMIUM</title>

<style>
:root{
  --blue:#0057b8;
  --blue2:#1683ff;
  --bg:#03060b;
  --card:#0a111b;
  --card2:#101a28;
  --green:#20d68a;
  --red:#ff4054;
  --yellow:#ffd43b;
  --text:#f5f7fb;
  --muted:#8d9aaa;
  --line:#1b2635;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#050a12;
  border-bottom:1px solid var(--line);
  padding:14px 12px 10px;
}

.brand{
  font-size:26px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand span{
  color:var(--blue2);
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
  letter-spacing:1.4px;
}

.nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-top:12px;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:9px 12px;
  font-weight:700;
}

.nav button.active{
  background:var(--blue);
  border-color:var(--blue2);
}

main{
  max-width:900px;
  margin:0 auto;
  padding:12px;
  padding-bottom:90px;
}

section{
  display:block;
}

.hidden{
  display:none!important;
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:6px 0 12px;
}

.title h2{
  margin:0;
  font-size:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.muted{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

@media(min-width:650px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

.btn,
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--text);
  border-radius:10px;
  padding:9px 12px;
  text-decoration:none;
  font-weight:700;
}

.btn:hover,
.chip:hover{
  border-color:var(--blue2);
}

.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.teamBtn,
.teamCard,
.playerCard,
.last5Row,
.clickableRow{
  color:var(--text);
}

.teamCard{
  width:100%;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.playerCard{
  width:100%;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.playerImg{
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:50%;
  margin:0 auto 7px;
  display:block;
}

.game{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin-bottom:9px;
}

.gameHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.gameTeams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.gameTeam{
  text-align:center;
  font-weight:800;
}

.gameScore{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.status{
  font-size:12px;
  color:var(--muted);
}

.liveDot{
  color:var(--green);
  font-weight:900;
}

.suggestion{
  border-left:4px solid var(--green);
}

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.statBox{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.statNumber{
  font-size:21px;
  font-weight:900;
}

.statRow{
  display:grid;
  grid-template-columns:1fr 1.3fr 1fr;
  align-items:center;
  gap:8px;
  background:var(--card2);
  border-bottom:1px solid var(--line);
  padding:10px;
}

.eventRow{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.last5List{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.last5Row{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
}

.win{
  color:var(--green);
  font-weight:900;
}

.draw{
  color:var(--yellow);
  font-weight:900;
}

.loss{
  color:var(--red);
  font-weight:900;
}

.watch{
  background:var(--card2);
  border-radius:10px;
  padding:10px;
}

.newsCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:10px;
}

.newsImg{
  width:100%;
  max-height:220px;
  object-fit:cover;
  display:block;
}

.newsBody{
  padding:13px;
}

.newsBody h3{
  margin:0 0 8px;
  font-size:17px;
}

.tableWrap{
  overflow-x:auto;
}

.standings{
  width:100%;
  border-collapse:collapse;
  min-width:480px;
}

.standings th,
.standings td{
  padding:10px 7px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.standings th{
  color:var(--muted);
  font-size:12px;
}

.clickableRow{
  cursor:pointer;
}

.clickableRow:hover{
  background:var(--card2);
}

@media(max-width:420px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .gameTeams{
    gap:4px;
  }

  .gameScore{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitle">
    FUTEBOL EM DIRETO
  </div>

  <nav class="nav">

    <button onclick="showSection('premium')" id="navPremium">
      ⭐ Premium
    </button>

    <button onclick="showSection('games')" id="navGames">
      ⚽ Jogos
    </button>

    <button onclick="showSection('tables')" id="navTables">
      📊 Tabelas
    </button>

    <button onclick="showSection('news')" id="navNews">
      📰 Notícias
    </button>

    <button onclick="showSection('favorites')" id="navFavorites">
      ⭐ Favoritos
    </button>

    <button onclick="showSection('live')" id="navLive">
      🔴 Diretos
    </button>

  </nav>

</header>

<main>

<section id="premium">

  <div class="title">
    <h2>⭐ FUTZONE PREMIUM</h2>
  </div>

  <div id="suggestions">

    <div class="card">
      <div class="muted">
        A carregar sugestões...
      </div>
    </div>

  </div>

</section>


<section id="games" class="hidden">

  <div class="title">

    <h2>⚽ Jogos</h2>

    <button class="btn" onclick="showToday()">
      Hoje
    </button>

  </div>

  <div id="gamesFilters"></div>

  <div id="gamesList">

    <div class="card">
      <div class="muted">
        A carregar jogos...
      </div>
    </div>

  </div>

</section>


<section id="tables" class="hidden">

  <div class="title">
    <h2>📊 Tabelas</h2>
  </div>

  <div id="tableButtons"></div>

  <div id="tableContent">

    <div class="card">
      <div class="muted">
        A carregar classificações...
      </div>
    </div>

  </div>

</section>


<section id="news" class="hidden">

  <div class="title">
    <h2>📰 Notícias</h2>
  </div>

  <div id="newsContent">

    <div class="card">
      <div class="muted">
        A carregar notícias...
      </div>
    </div>

  </div>

</section>


<section id="favorites" class="hidden">

  <div class="title">
    <h2>⭐ Favoritos</h2>
  </div>

  <div id="favoritesContent"></div>

</section>


<section id="live" class="hidden">

  <div class="title">
    <h2>🔴 Diretos</h2>
  </div>

  <div id="liveContent">

    <div class="card">
      <div class="muted">
        A carregar jogos em direto...
      </div>
    </div>

  </div>

</section>


<section id="analysis" class="hidden">

  <div class="title">

    <h2>📋 Análise do jogo</h2>

    <button class="btn" onclick="back()">
      ← Voltar
    </button>

  </div>

  <div id="analysisBox"></div>

</section>


<section id="roster" class="hidden">

  <div class="title">

    <h2 id="rosterTitle">
      👥 Equipa
    </h2>

    <button class="btn" onclick="backRoster()">
      ← Voltar
    </button>

  </div>

  <div id="rosterBox"></div>

</section>


<section id="player" class="hidden">

  <div class="title">

    <h2 id="playerTitle">
      👤 Jogador
    </h2>

    <button class="btn" onclick="backPlayer()">
      ← Voltar
    </button>

  </div>

  <div id="playerBox"></div>

</section><script>
/* =========================================================
   FUTZONE PREMIUM — BLOCO 2
   BASE / API / NAVEGAÇÃO / JOGOS / SUGESTÕES
   ========================================================= */

const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';

let games=[];
let teams={};
let current=null;
let currentTeam=null;
let previousSection='premium';

const leagues=[
  'por.1',
  'por.2',
  'por.3',
  'por.w.1',
  'esp.1',
  'eng.1',
  'ita.1',
  'ger.1',
  'fra.1',
  'ned.1',
  'bel.1',
  'tur.1',
  'sco.1',
  'usa.1',
  'sau.1',
  'uefa.champions',
  'uefa.europa',
  'uefa.europaconf',
  'fifa.friendly'
];

const lname={
  'por.1':'Liga Portugal',
  'por.2':'Liga 2',
  'por.3':'Liga 3',
  'por.w.1':'Liga BPI Feminina',
  'esp.1':'La Liga',
  'eng.1':'Premier League',
  'ita.1':'Serie A',
  'ger.1':'Bundesliga',
  'fra.1':'Ligue 1',
  'ned.1':'Eredivisie',
  'bel.1':'Liga Belga',
  'tur.1':'Super Lig',
  'sco.1':'Scottish Premiership',
  'usa.1':'MLS',
  'sau.1':'Saudi Pro League',
  'uefa.champions':'Champions League',
  'uefa.europa':'Europa League',
  'uefa.europaconf':'Conference League',
  'fifa.friendly':'Seleções'
};


/* =========================================================
   FUNÇÕES BÁSICAS
   ========================================================= */

function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function normal(v){
  return String(v ?? '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}

function ct(e){
  return e?.competitions?.[0] || {};
}

function tn(c){
  return c?.team?.displayName ||
         c?.team?.shortDisplayName ||
         c?.team?.name ||
         'Equipa';
}

function cs(c){
  const v=c?.score;

  if(v===undefined || v===null || v===''){
    return '—';
  }

  return v;
}

function dt(v){
  if(!v) return 'Data indisponível';

  try{
    return new Date(v).toLocaleString(
      'pt-PT',
      {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      }
    );
  }catch(e){
    return String(v);
  }
}

function live(e){
  const s=ct(e)?.status || e?.status || {};
  const type=s?.type || {};

  return type?.state==='in' ||
         type?.name==='STATUS_IN_PROGRESS' ||
         type?.description==='In Progress' ||
         type?.detail==='In Progress';
}

function fin(e){
  const s=ct(e)?.status || e?.status || {};
  const type=s?.type || {};

  return type?.state==='post' ||
         type?.completed===true ||
         type?.name==='STATUS_FINAL' ||
         type?.description==='Final';
}

function st(s){
  return s?.type?.shortDetail ||
         s?.type?.detail ||
         s?.type?.description ||
         s?.type?.name ||
         '';
}

async function get(url){
  const r=await fetch(url);

  if(!r.ok){
    throw new Error(
      'HTTP '+r.status
    );
  }

  return await r.json();
}

function rememberTeam(t){
  if(!t?.id) return;

  const id=String(t.id);

  teams[id]={
    ...(teams[id] || {}),
    ...t
  };
}

function add(e,league){
  if(!e?.id) return;

  const id=String(e.id);

  if(games.some(x=>String(x.id)===id)){
    return;
  }

  e._league=league;

  const comps=ct(e);

  (comps?.competitors || []).forEach(c=>{
    if(c?.team){
      rememberTeam({
        ...c.team,
        league
      });
    }
  });

  games.push(e);
}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

function sec(name){

  const sections=[
    'premium',
    'games',
    'tables',
    'news',
    'favorites',
    'live',
    'analysis',
    'roster',
    'player'
  ];

  sections.forEach(x=>{
    const el=document.getElementById(x);

    if(el){
      el.classList.toggle(
        'hidden',
        x!==name
      );
    }
  });

  const navMap={
    premium:'navPremium',
    games:'navGames',
    tables:'navTables',
    news:'navNews',
    favorites:'navFavorites',
    live:'navLive'
  };

  Object.values(navMap).forEach(id=>{
    const b=document.getElementById(id);

    if(b){
      b.classList.remove('active');
    }
  });

  if(navMap[name]){
    const b=document.getElementById(
      navMap[name]
    );

    if(b){
      b.classList.add('active');
    }
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}


/* =========================================================
   RENDER DOS JOGOS
   ========================================================= */

function render(list){

  const box=document.getElementById(
    'gamesList'
  );

  if(!box) return;

  if(!Array.isArray(list) || !list.length){

    box.innerHTML=`
      <div class="card">
        <div class="muted">
          Não existem jogos disponíveis.
        </div>
      </div>
    `;

    return;
  }

  const sorted=[...list].sort((a,b)=>{
    return new Date(
      ct(a)?.date || a?.date || 0
    ) -
    new Date(
      ct(b)?.date || b?.date || 0
    );
  });

  const groups={};

  sorted.forEach(e=>{
    const league=e?._league || 'Outros';

    if(!groups[league]){
      groups[league]=[];
    }

    groups[league].push(e);
  });

  box.innerHTML=Object.keys(groups).map(
    league=>`

      <div class="card">

        <h3 style="margin-top:0">
          ${esc(lname[league] || league)}
        </h3>

        ${groups[league].map(gameCard).join('')}

      </div>
    `
  ).join('');
}

function gameCard(e){

  const c=ct(e);

  const comps=c?.competitors || [];

  const home=
    comps.find(x=>x.homeAway==='home') ||
    comps[0] ||
    {};

  const away=
    comps.find(x=>x.homeAway==='away') ||
    comps[1] ||
    {};

  const status=c?.status || {};

  const isLive=live(e);

  return `
    <button
      class="game"
      onclick="openMatch('${esc(e.id)}')"
      style="
        width:100%;
        text-align:left;
        color:inherit;
        cursor:pointer;
      ">

      <div class="gameHead">

        <span class="status">
          ${esc(
            e?._league
            ? (lname[e._league] || e._league)
            : ''
          )}
        </span>

        <span class="${
          isLive
          ? 'liveDot'
          : 'status'
        }">
          ${
            isLive
            ? '● AO VIVO'
            : esc(
                st(status) ||
                dt(c?.date || e?.date)
              )
          }
        </span>

      </div>

      <div class="gameTeams">

        <div class="gameTeam">

          ${
            home?.team
            ? visual(home.team)
            : ''
          }

          <div>
            ${esc(tn(home))}
          </div>

        </div>

        <div class="gameScore">

          ${
            cs(home)
          }

          -

          ${
            cs(away)
          }

        </div>

        <div class="gameTeam">

          ${
            away?.team
            ? visual(away.team)
            : ''
          }

          <div>
            ${esc(tn(away))}
          </div>

        </div>

      </div>

    </button>
  `;
}


/* =========================================================
   FILTROS
   ========================================================= */

function showAll(){
  sec('games');

  render(games);
}

function showToday(){

  sec('games');

  const now=new Date();

  const today=games.filter(e=>{

    const d=new Date(
      ct(e)?.date ||
      e?.date ||
      0
    );

    return d.getFullYear()===now.getFullYear() &&
           d.getMonth()===now.getMonth() &&
           d.getDate()===now.getDate();

  });

  render(today);
}

function showLive(){

  sec('live');

  const box=document.getElementById(
    'liveContent'
  );

  if(!box) return;

  const list=games.filter(live);

  if(!list.length){

    box.innerHTML=`
      <div class="card">
        <div class="muted">
          Não existem jogos em direto neste momento.
        </div>
      </div>
    `;

    return;
  }

  box.innerHTML=list.map(gameCard).join('');
}


/* =========================================================
   SUGESTÕES PREMIUM
   ========================================================= */

function suggestMarket(e){

  const comps=ct(e)?.competitors || [];

  if(comps.length<2){
    return {
      title:'Jogo em análise',
      market:'Dados insuficientes'
    };
  }

  const home=
    comps.find(x=>x.homeAway==='home') ||
    comps[0];

  const away=
    comps.find(x=>x.homeAway==='away') ||
    comps[1];

  const h=Number(home?.score);
  const a=Number(away?.score);

  if(fin(e) && Number.isFinite(h) && Number.isFinite(a)){

    if(h>a){
      return {
        title:'Resultado',
        market:home?.team?.displayName+
               ' venceu'
      };
    }

    if(a>h){
      return {
        title:'Resultado',
        market:away?.team?.displayName+
               ' venceu'
      };
    }

    return {
      title:'Resultado',
      market:'Empate'
    };
  }

  return {
    title:'Análise Premium',
    market:
      (home?.team?.displayName || 'Casa')+
      ' vs '+
      (away?.team?.displayName || 'Fora')
  };
}

function suggestions(list){

  const box=document.getElementById(
    'suggestions'
  );

  if(!box) return;

  const available=(list || [])
    .filter(e=>!fin(e))
    .slice(0,5);

  if(!available.length){

    box.innerHTML=`
      <div class="card">
        <h3>⭐ Sugestões Premium</h3>

        <div class="muted">
          A procurar novos jogos para análise...
        </div>
      </div>
    `;

    return;
  }

  box.innerHTML=`
    <div class="card">
      <h3 style="margin-top:0">
        ⭐ Sugestões Premium
      </h3>

      <div class="muted" style="margin-bottom:10px">
        Jogos selecionados automaticamente.
      </div>

      ${available.map((e,i)=>{

        const c=ct(e);
        const comps=c?.competitors || [];

        const home=
          comps.find(x=>x.homeAway==='home') ||
          comps[0] ||
          {};

        const away=
          comps.find(x=>x.homeAway==='away') ||
          comps[1] ||
          {};

        const s=suggestMarket(e);

        return `
          <button
            class="card suggestion"
            onclick="openMatch('${esc(e.id)}')"
            style="
              width:100%;
              text-align:left;
              color:inherit;
            ">

            <div class="muted">
              Sugestão ${i+1}
            </div>

            <div style="
              font-size:17px;
              font-weight:900;
              margin:6px 0;
            ">
              ${esc(
                tn(home)
              )}
              vs
              ${esc(
                tn(away)
              )}
            </div>

            <div>
              <b>${esc(s.title)}:</b>
              ${esc(s.market)}
            </div>

            <div class="muted" style="margin-top:6px">
              ${esc(
                dt(c?.date || e?.date)
              )}
            </div>

          </button>
        `;

      }).join('')}

    </div>
  `;

function statValue(stats,names){

  if(!Array.isArray(stats)){
    return '—';
  }

  const wanted=names.map(normal);

  for(const s of stats){

    const n=normal(
      s?.name ||
      s?.displayName ||
      s?.label ||
      s?.abbreviation ||
      ''
    );

    if(
      wanted.some(
        x=>n===x ||
        n.includes(x) ||
        x.includes(n)
      )
    ){
      return s?.displayValue ??
             s?.value ??
             '—';
    }
  }

  return '—';
}

   ========================================================= */

function importantEvents(d,e){

  const pool=[];

  if(Array.isArray(d?.keyEvents)){
    pool.push(...d.keyEvents);
  }

  if(Array.isArray(d?.plays)){
    pool.push(...d.plays);
  }

  if(Array.isArray(e?.keyEvents)){
    pool.push(...e.keyEvents);
  }

  const result=[];
  const seen=new Set();

  pool.forEach(p=>{

    const raw=[
      p?.type?.text,
      p?.type?.name,
      p?.text,
      p?.description,
      p?.shortText
    ]
    .filter(Boolean)
    .join(' ');

    const n=normal(raw);

    let kind='';

    if(
      n.includes('own goal') ||
      n.includes('autogolo') ||
      n.includes('goal') ||
      n.includes('gol')
    ){
      kind='⚽ Golo';
    }
    else if(
      n.includes('yellow card') ||
      n.includes('yellowcard') ||
      n.includes('cartao amarelo')
    ){
      kind='🟨 Cartão amarelo';
    }
    else if(
      n.includes('red card') ||
      n.includes('redcard') ||
      n.includes('cartao vermelho') ||
      n.includes('sending off')
    ){
      kind='🟥 Cartão vermelho';
    }
    else if(
      n.includes('substitution') ||
      n.includes('substitu')
    ){
      kind='🔄 Substituição';
    }

    if(!kind){
      return;
    }

    const text=String(
      p?.text ||
      p?.description ||
      p?.shortText ||
      raw
    )
    .replace(/\s+/g,' ')
    .trim();

    const key=
      kind+'|'+text;

    if(seen.has(key)){
      return;
    }

    seen.add(key);

    result.push({
      kind,
      text
    });

  });

  if(!result.length){

    return `
      <div class="muted">
        Não existem eventos relevantes disponíveis.
      </div>
    `;
  }

  return result.map(x=>`

    <div class="eventRow">

      <div>
        <b>${esc(x.kind)}</b>
      </div>

      <div>
        ${esc(x.text)}
      </div>

    </div>

  `).join('');
}

async function last5(
  teamId,
  exclude
){

  if(!teamId){
    return [];
  }

  const urls=[];

  const cached=
    teams[String(teamId)];

  if(cached?.league){

    urls.push(
      API+
      cached.league+
      '/teams/'+
      teamId+
      '/schedule?limit=200'
    );

  }

  urls.push(
    API+
    'all/teams/'+
    teamId+
    '/schedule?limit=200'
  );

  const found=[];

  for(const url of urls){

    try{

      const d=
        await get(url);

      const events=
        Array.isArray(d?.events)
        ? d.events
        : [];

      events.forEach(ev=>{

        if(
          String(ev?.id)===
          String(exclude)
        ){
          return;
        }

        const comp=
          ev?.competitions?.[0];

        const status=
          comp?.status ||
          ev?.status ||
          {};

        const type=
          status?.type ||
          {};

        const completed=
          type?.completed===true ||
          type?.state==='post' ||
          type?.name==='STATUS_FINAL';

        if(!completed){
          return;
        }

        const competitors=
          comp?.competitors || [];

        if(competitors.length<2){
          return;
        }

        const me=
          competitors.find(
            c=>
              String(c?.team?.id)===
              String(teamId)
          );

        if(!me){
          return;
        }

        const opponent=
          competitors.find(
            c=>
              String(c?.team?.id)!==
              String(teamId)
          );

        if(!opponent){
          return;
        }

        const myScore=
          Number(me?.score);

        const oppScore=
          Number(opponent?.score);

        if(
          !Number.isFinite(myScore) ||
          !Number.isFinite(oppScore)
        ){
          return;
        }

        let outcome='E';

        if(myScore>oppScore){
          outcome='V';
        }
        else if(myScore<oppScore){
          outcome='D';
        }

        found.push({

          id:String(ev.id),

          date:
            ev?.date ||
            comp?.date,

          opponent:
            opponent?.team?.displayName ||
            opponent?.team?.name ||
            'Adversário',

          score:
            myScore+
            ' - '+
            oppScore,

          outcome,

          timestamp:
            new Date(
              ev?.date ||
              comp?.date ||
              0
            ).getTime()

        });

      });

      if(found.length>=5){
        break;
      }

    }catch(err){

      console.warn(
        'Últimos 5:',
        err
      );

    }
  }

  const unique=[];
  const seen=new Set();

  found
    .sort(
      (a,b)=>
        b.timestamp-a.timestamp
    )
    .forEach(x=>{

      if(
        !seen.has(x.id)
      ){

        seen.add(x.id);
        unique.push(x);

      }

    });

  return unique.slice(0,5);
}

function extractPlayerStats(

){

  const all=[];

  function collect(x){

    if(Array.isArray(x)){
      all.push(...x);
    }

    if(
      Array.isArray(
        x?.statistics
      )
    ){
      all.push(
        ...x.statistics
      );
    }

  }

  collect(p);
  collect(d);

  let games=
    statValue(
      all,
      [
        'games played',
        'appearances',
        'games',
        'matches'
      ]
    );

  let goals=
    statValue(
      all,
      [
        'goals',
        'total goals'
      ]
    );

  let assists=
    statValue(
      all,
      [
        'assists',
        'total assists'
      ]
    );

  let yellow=
    statValue(
      all,
      [
        'yellow cards',
        'yellowcard',
        'yellow'
      ]
    );

  let red=
    statValue(
      all,
      [
        'red cards',
        'redcard',
        'red'
      ]
    );

  const raw=
    JSON.stringify(
      d ||
      p ||
      {}
    );

  if(games==='—'){

    const m=
      raw.match(
        /"gamesPlayed"\s*:\s*(\d+)/
      );

    if(m){
      games=m[1];
    }

  }

  if(goals==='—'){

    const m=
      raw.match(
        /"goals"\s*:\s*(\d+)/
      );

    if(m){
      goals=m[1];
    }

  }

  if(assists==='—'){

    const m=
      raw.match(
        /"assists"\s*:\s*(\d+)/
      );

    if(m){
      assists=m[1];
    }

  }

  return {
    games,
    goals,
    assists,
    yellow,
    red
  };
}

async function loadTable(
  league
){

  const box=
    document.getElementById(
      'tableContent'
    );

  if(!box) return;

  box.innerHTML=`
    <div class="card">
      <div class="muted">
        A carregar classificação...
      </div>
    </div>
  `;

  try{

    const d=
      await get(
        API+
        league+
        '/standings?limit=100'
      );

    let entries=[];

    if(
      Array.isArray(
        d?.children
      )
    ){

      d.children.forEach(group=>{

        if(
          Array.isArray(
            group?.standings?.entries
          )
        ){

          entries.push(
            ...group.standings.entries
          );

        }

      });

    }

    if(
      !entries.length &&
      Array.isArray(
        d?.standings?.entries
      )
    ){

      entries=
        d.standings.entries;

    }

    if(!entries.length){

      box.innerHTML=`
        <div class="card">
          <div class="muted">
            Classificação indisponível para esta competição.
          </div>
        </div>
      `;

      return;
    }


    function getStat(
      entry,
      names
    ){

      const stats=
        entry?.stats || [];

      const wanted=
        names.map(normal);

      for(
        const s of stats
      ){

        const n=
          normal(
            s?.name ||
            s?.displayName ||
            ''
          );

        if(
          wanted.some(
            x=>
              n===x ||
              n.includes(x)
          )
        ){

          return (
            s?.displayValue ??
            s?.value ??
            '—'
          );

        }

      }

      return '—';
    }


    const rows=
      entries.map(
        (entry,index)=>{

          const t=
            entry?.team || {};

          rememberTeam({
            ...t,
            league
          });

          return {

            team:t,

            pos:
              getStat(
                entry,
                [
                  'rank',
                  'position'
                ]
              ) !== '—'
              ? getStat(
                  entry,
                  [
                    'rank',
                    'position'
                  ]
                )
              : index+1,

            games:
              getStat(
                entry,
                [
                  'games played',
                  'gamesplayed',
                  'gp'
                ]
              ),

            diff:
              getStat(
                entry,
                [
                  'goal differential',
                  'point differential',
                  'differential'
                ]
              ),

            points:
              getStat(
                entry,
                [
                  'points',
                  'pts'
                ]
              )

          };

        }
      );


    box.innerHTML=`

      <div class="card">

        <div class="tableWrap">

                    openTeam(
                      '${esc(
                        r.team?.id || ''
                      )}'
                    )
                  ">

                  <td>
                    ${esc(r.pos)}
                  </td>

                  <td>

                    <div style="
                      display:flex;
                      align-items:center;
                      gap:8px;
                    ">

                      ${
                        r.team?.logos?.[0]?.href
                        ? `
                          <img
                            src="${esc(
                              r.team.logos[0].href
                            )}"
                            style="
                              width:28px;
                              height:28px;
                              object-fit:contain;
                            "
                            onerror="
                              this.style.display='none'
                            "
                          >
                        `
                        : ''
                      }

                      <span>
                        ${esc(
                          r.team?.displayName ||
                          r.team?.name ||
                          'Equipa'
                        )}
                      </span>

                    </div>

                  </td>

                  <td>
                    ${esc(r.games)}
                  </td>

                  <td>
                    ${esc(r.diff)}
                  </td>

                  <td>
                    <b>
                      ${esc(r.points)}
                    </b>
                  </td>

                </tr>

              `).join('')}

            </tbody>

          </table>

        </div>

      </div>

    `;

  }catch(err){

    );

        </div>

      </div>
    `;

  }
}

function extractNews(d){

  const result=[];

  const lists=[
    d?.articles,
    d?.headlines,
    d?.news,
    d?.feed
  ];

  lists.forEach(list=>{

    if(!Array.isArray(list)){
      return;
    }

    list.forEach(item=>{

      const title=
        item?.headline ||
        item?.title ||
        item?.name ||
        item?.story?.headline ||
        '';

      if(!title){
        return;
      }

      const description=
        item?.description ||
        item?.summary ||
        item?.story?.description ||
        '';

      const image=
        item?.images?.[0]?.url ||
        item?.images?.[0]?.href ||
        item?.image?.url ||
        '';

      const link=
        item?.links?.web?.href ||
        item?.links?.[0]?.href ||
        item?.link ||
        item?.url ||
        '';

      result.push({
        title,
        description,
        image,
        link
      });

    });

  });

  const unique=[];
  const seen=new Set();

  result.forEach(item=>{

    const key=
      normal(item.title);

    if(
      !seen.has(key)
    ){

      seen.add(key);
      unique.push(item);

    }

  });

  return unique;
}

    }catch(err){

      console.warn(

  }


  const unique=[];

  news.forEach(item=>{

    const key=
      normal(item.title);

    if(
      !seen.has(key)
    ){

      seen.add(key);
      unique.push(item);

    }

  });


  if(!unique.length){

    box.innerHTML=`

  }


  box.innerHTML=

          ${

                src="${esc(item.image)}"

              `

            }

            ${

            }

        </article>

      `)
      .join('');

}

async function loadLeague(
  league
){

  try{

    const d=
      await get(
        API+
        league+
        '/scoreboard?limit=100'
      );

    const events=
      Array.isArray(d?.events)
      ? d.events
      : [];

    events.forEach(
      event=>{
        add(
          event,
          league
        );
      }
    );

  }catch(err){

    console.warn(
      'Liga não carregada:',
      league,
      err
    );

  }

}


/* =========================================================
   CARREGAR TODOS OS JOGOS
   ========================================================= */

async function loadAllGames(){

  games=[];

  /*
   * Carrega em pequenos grupos para não
   * bloquear o telemóvel com demasiados pedidos.
   */

  const chunk=3;

  for(
    let i=0;
    i<leagues.length;
    i+=chunk
  ){

    const group=
      leagues.slice(
        i,
        i+chunk
      );

    await Promise.all(
      group.map(
        loadLeague
      )
    );

  }

  render(games);

  suggestions(games);

  loadFavorites();

}


/* =========================================================
   FUNÇÃO PRINCIPAL
   ========================================================= */

async function load(){

  try{

    await loadAllGames();

  }catch(err){

    console.error(
      'Erro FUTZONE:',
      err
    );

  }

}
