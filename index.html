<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a33">
<title>FUTZONE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f7;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#06152b,#0b3768);
  color:white;
  padding:18px 16px 14px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#4da3ff;
}

.header-sub{
  font-size:12px;
  opacity:.8;
  margin-top:3px;
}

nav{
  display:flex;
  background:white;
  border-bottom:1px solid #dbe2ea;
  position:sticky;
  top:72px;
  z-index:40;
}

nav button{
  flex:1;
  border:0;
  background:white;
  padding:13px 5px;
  font-size:13px;
  font-weight:700;
  color:#64748b;
}

nav button.active{
  color:#0756a6;
  border-bottom:3px solid #0756a6;
}

#app{
  max-width:900px;
  margin:auto;
  padding:12px;
  padding-bottom:80px;
}

h2{
  margin:8px 0 14px;
  font-size:21px;
}

h3{
  margin:0 0 10px;
}

.card{
  background:white;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 2px 9px rgba(15,23,42,.08);
  overflow:hidden;
}

button{
  font-family:inherit;
}

.league-title{
  padding:13px 14px;
  font-weight:800;
  color:#0b3768;
  border-bottom:1px solid #edf1f5;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.game{
  padding:13px;
  border-bottom:1px solid #edf1f5;
  cursor:pointer;
}

.game:last-child{
  border-bottom:0;
}

.game:hover{
  background:#fafcff;
}

.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.game-date{
  font-size:11px;
  color:#64748b;
}

.star{
  border:0;
  background:none;
  font-size:22px;
  padding:0 2px;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.team{
  width:40%;
  text-align:center;
  cursor:pointer;
}

.team-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  margin:auto;
  display:block;
}

.team-name{
  font-size:13px;
  font-weight:700;
  margin-top:5px;
}

.score{
  min-width:55px;
  text-align:center;
  font-size:21px;
  font-weight:900;
}

.status{
  font-size:11px;
  color:#64748b;
  margin-top:4px;
}

.live{
  color:#dc2626;
  font-weight:900;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filters button{
  flex:none;
  border:1px solid #cbd5e1;
  background:white;
  border-radius:20px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
}

.filters button.selected{
  background:#0756a6;
  color:white;
  border-color:#0756a6;
}

.empty{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
}

.loading{
  text-align:center;
  padding:30px;
  color:#64748b;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

.back{
  border:0;
  background:white;
  color:#0756a6;
  font-weight:800;
  padding:9px 0;
  margin-bottom:10px;
}

.detail-head{
  padding:18px 12px;
  background:linear-gradient(135deg,#06152b,#0b3768);
  color:white;
}

.detail-competition{
  text-align:center;
  font-size:12px;
  opacity:.8;
  margin-bottom:15px;
}

.detail-teams{
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.detail-team{
  width:35%;
  text-align:center;
}

.detail-team img{
  width:65px;
  height:65px;
  object-fit:contain;
}

.detail-team-name{
  font-size:14px;
  font-weight:800;
  margin-top:7px;
}

.detail-score{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

.detail-status{
  font-size:12px;
  margin-top:4px;
  text-align:center;
  opacity:.8;
}

.section{
  background:white;
  border-radius:15px;
  margin-top:12px;
  padding:14px;
  box-shadow:0 2px 9px rgba(15,23,42,.08);
}

.event-group{
  margin-bottom:14px;
}

.event-group:last-child{
  margin-bottom:0;
}

.event-title{
  font-weight:900;
  font-size:15px;
  margin-bottom:8px;
  color:#0b3768;
}

.event{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #edf1f5;
}

.event:last-child{
  border-bottom:0;
}

.event-minute{
  width:42px;
  font-size:12px;
  color:#64748b;
  font-weight:700;
  flex:none;
}

.event-icon{
  width:22px;
  text-align:center;
}

.event-info{
  flex:1;
  font-size:13px;
}

.event-player{
  font-weight:800;
}

.event-team{
  color:#64748b;
  font-size:11px;
  margin-top:2px;
}

.sub-in{
  color:#15803d;
  font-weight:800;
}

.sub-out{
  color:#dc2626;
  font-weight:800;
}

.stats-table{
  width:100%;
  border-collapse:collapse;
}

.stats-table td{
  padding:9px 4px;
  border-bottom:1px solid #edf1f5;
  font-size:13px;
}

.stats-table td:nth-child(2){
  text-align:center;
  font-weight:900;
  width:70px;
}

.stats-table td:last-child{
  text-align:right;
}

.stat-name{
  color:#475569;
}

.table-row{
  display:flex;
  align-items:center;
  padding:10px 7px;
  border-bottom:1px solid #edf1f5;
}

.table-pos{
  width:30px;
  font-weight:900;
  color:#64748b;
}

.table-team{
  flex:1;
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
  font-weight:700;
}

.table-team img{
  width:30px;
  height:30px;
  object-fit:contain;
}

.table-points{
  font-weight:900;
  width:45px;
  text-align:right;
}

.team-page-head{
  text-align:center;
  padding:18px;
}

.team-page-head img{
  width:75px;
  height:75px;
  object-fit:contain;
}

.team-page-head h2{
  margin:10px 0 4px;
}

.fav-button{
  border:1px solid #cbd5e1;
  background:white;
  border-radius:20px;
  padding:8px 14px;
  font-weight:700;
}

.player-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #edf1f5;
  cursor:pointer;
}

.player-card:last-child{
  border-bottom:0;
}

.player-photo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#e2e8f0;
}

.player-info{
  flex:1;
}

.player-name{
  font-weight:800;
}

.player-position{
  color:#64748b;
  font-size:11px;
  margin-top:3px;
}

.player-number{
  font-size:18px;
  font-weight:900;
  color:#0756a6;
}

.profile{
  text-align:center;
  padding:20px;
}

.profile img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  background:#e2e8f0;
}

.profile-name{
  font-size:23px;
  font-weight:900;
  margin:10px 0 5px;
}

.profile-meta{
  color:#64748b;
  font-size:13px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.info-box{
  background:#f1f5f9;
  border-radius:10px;
  padding:10px;
}

.info-label{
  color:#64748b;
  font-size:10px;
}

.info-value{
  font-weight:800;
  margin-top:3px;
}

.news-card{
  padding:0;
  cursor:pointer;
}

.news-image{
  width:100%;
  height:175px;
  object-fit:cover;
  background:#dbe2ea;
}

.news-content{
  padding:12px;
}

.news-title{
  font-weight:900;
  line-height:1.25;
}

.news-date{
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  display:none;
  padding:20px 12px;
  overflow-y:auto;
}

.modal.show{
  display:block;
}

.modal-box{
  background:white;
  max-width:700px;
  margin:20px auto;
  border-radius:16px;
  overflow:hidden;
}

.modal-close{
  float:right;
  border:0;
  background:white;
  font-size:25px;
  padding:8px 12px;
}

.modal-body{
  padding:15px;
}

.modal-body img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px;
}

.modal-body h2{
  margin-top:15px;
}

.modal-link{
  display:inline-block;
  margin-top:10px;
  background:#0756a6;
  color:white;
  padding:10px 14px;
  border-radius:9px;
  text-decoration:none;
  font-weight:800;
}

@media(max-width:500px){
  #app{
    padding-left:9px;
    padding-right:9px;
  }

  .detail-team img{
    width:52px;
    height:52px;
  }

  .news-image{
    height:155px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="header-sub">Futebol em direto, resultados, equipas e estatísticas</div>
</header>

<nav>
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽ Jogos</button>
  <button id="navTabelas" onclick="mostrarTabelas()">🏆 Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐ Favoritos</button>
</nav>

<div id="app"></div>

<div id="modal" class="modal" onclick="fecharModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="fecharModal()">×</button>
    <div id="modalContent" class="modal-body"></div>
  </div>
</div>

<script>

/* =========================================================
   FUTZONE
   ========================================================= */

const ESPN_SITE =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ESPN_V2 =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const ESPN_CDN =
  "https://cdn.espn.com/core/soccer/game?xhr=1&gameId=";


/* =========================================================
   LIGAS
   ========================================================= */

const ligas = [
  {code:"por.1", nome:"🇵🇹 Portugal — Liga Portugal"},
  {code:"eng.1", nome:"🏴 Inglaterra — Premier League"},
  {code:"esp.1", nome:"🇪🇸 Espanha — LaLiga"},
  {code:"ita.1", nome:"🇮🇹 Itália — Serie A"},
  {code:"ger.1", nome:"🇩🇪 Alemanha — Bundesliga"},
  {code:"fra.1", nome:"🇫🇷 França — Ligue 1"},
  {code:"ned.1", nome:"🇳🇱 Países Baixos — Eredivisie"},
  {code:"bel.1", nome:"🇧🇪 Bélgica — Jupiler Pro League"},
  {code:"uefa.champions", nome:"⭐ Liga dos Campeões"},
  {code:"uefa.europa", nome:"🏆 Liga Europa"},
  {code:"uefa.europa.conf", nome:"🏆 Conference League"}
];


/* =========================================================
   ESTADO
   ========================================================= */

let ligaAtual = ligas[0];
let jogosAtuais = [];
let noticiasAtuais = [];

let favoritosJogos =
  JSON.parse(localStorage.getItem("futzone_fav_jogos") || "[]");

let favoritosEquipas =
  JSON.parse(localStorage.getItem("futzone_fav_equipas") || "[]");

let favoritosJogadores =
  JSON.parse(localStorage.getItem("futzone_fav_jogadores") || "[]");


/* =========================================================
   HELPERS
   ========================================================= */

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function jsArg(v){
  return JSON.stringify(String(v ?? ""))
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function guardarTudo(){
  localStorage.setItem(
    "futzone_fav_jogos",
    JSON.stringify(favoritosJogos)
  );

  localStorage.setItem(
    "futzone_fav_equipas",
    JSON.stringify(favoritosEquipas)
  );

  localStorage.setItem(
    "futzone_fav_jogadores",
    JSON.stringify(favoritosJogadores)
  );
}

function nomeLiga(code){
  const l = ligas.find(x => x.code === code);
  return l ? l.nome : code;
}

function dataHora(data){
  if(!data) return "";

  const d = new Date(data);

  return d.toLocaleString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function dataPublicacao(data){
  if(!data) return "";

  const d = new Date(data);

  return d.toLocaleString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function setNav(id){
  ["navJogos","navTabelas","navFav"].forEach(x=>{
    const el=document.getElementById(x);
    if(el) el.classList.remove("active");
  });

  const el=document.getElementById(id);

  if(el) el.classList.add("active");
}


/* =========================================================
   JOGOS
   ========================================================= */

async function mostrarJogos(){

  setNav("navJogos");

  document.getElementById("app").innerHTML = `
    <h2>⚽ Jogos</h2>

    <div class="filters">
      ${ligas.map(l => `
        <button
          class="${ligaAtual.code === l.code ? "selected":""}"
          onclick="selecionarLiga('${l.code}')">
          ${esc(l.nome)}
        </button>
      `).join("")}
    </div>

    <div id="jogosArea" class="loading">
      A carregar jogos...
    </div>

    <div id="noticiasArea"></div>
  `;

  carregarJogos();
  carregarNoticias();
}

function selecionarLiga(code){

  const l=ligas.find(x=>x.code===code);

  if(!l) return;

  ligaAtual=l;

  mostrarJogos();
}

async function carregarJogos(){

  const area=document.getElementById("jogosArea");

  try{

    const url =
      ESPN_SITE +
      ligaAtual.code +
      "/scoreboard?limit=100";

    const resposta=await fetch(url);

    if(!resposta.ok)
      throw new Error("Erro ao carregar jogos");

    const dados=await resposta.json();

    jogosAtuais=dados.events || [];

    if(!jogosAtuais.length){

      area.innerHTML=`
        <div class="card">
          <div class="empty">
            Não existem jogos encontrados para esta competição.
          </div>
        </div>
      `;

      return;
    }

    area.innerHTML=`
      <div class="card">
        <div class="league-title">
          <span>${esc(nomeLiga(ligaAtual.code))}</span>
          <span>${jogosAtuais.length}</span>
        </div>

        ${jogosAtuais.map(renderJogo).join("")}
      </div>
    `;

  }catch(e){

    area.innerHTML=`
      <div class="error">
        Não foi possível carregar os jogos.
      </div>
    `;

  }
}

function renderJogo(jogo){

  const comp=jogo.competitions?.[0];
  const competitors=comp?.competitors || [];

  const home=
    competitors.find(x=>x.homeAway==="home") ||
    competitors[0] || {};

  const away=
    competitors.find(x=>x.homeAway==="away") ||
    competitors[1] || {};

  const id=jogo.id;

  const status=
    comp?.status?.type?.shortDetail ||
    comp?.status?.type?.detail ||
    "";

  const completed=
    comp?.status?.type?.completed;

  const live=
    comp?.status?.type?.state==="in";

  const fav=favoritosJogos.some(x=>String(x.id)===String(id));

  const homeName=
    home.team?.displayName ||
    home.team?.shortDisplayName ||
    home.displayName ||
    "Casa";

  const awayName=
    away.team?.displayName ||
    away.team?.shortDisplayName ||
    away.displayName ||
    "Fora";

  const homeLogo=
    home.team?.logo ||
    home.logo ||
    "";

  const awayLogo=
    away.team?.logo ||
    away.logo ||
    "";

  return `
    <div
      class="game"
      onclick="abrirJogo(${jsArg(id)},${jsArg(ligaAtual.code)})">

      <div class="game-top">
        <div class="game-date">
          ${dataHora(jogo.date)}
        </div>

        <button
          class="star"
          onclick="event.stopPropagation();toggleFavJogo(${jsArg(id)},${jsArg(ligaAtual.code)},${jsArg(homeName)},${jsArg(awayName)})">
          ${fav ? "⭐" : "☆"}
        </button>
      </div>

      <div class="teams">

        <div
          class="team"
          onclick="event.stopPropagation();abrirEquipa(${jsArg(home.team?.id || home.id)},${jsArg(homeName)},${jsArg(homeLogo)})">

          ${
            homeLogo
            ? `<img class="team-logo" src="${esc(homeLogo)}">`
            : `<div class="team-logo"></div>`
          }

          <div class="team-name">
            ${esc(homeName)}
          </div>
        </div>

        <div class="score">

          ${
            completed || live
            ? `${esc(home.score ?? "-")} - ${esc(away.score ?? "-")}`
            : "vs"
          }

          <div class="status ${live ? "live":""}">
            ${live ? "🔴 DIRETO" : esc(status)}
          </div>

        </div>

        <div
          class="team"
          onclick="event.stopPropagation();abrirEquipa(${jsArg(away.team?.id || away.id)},${jsArg(awayName)},${jsArg(awayLogo)})">

          ${
            awayLogo
            ? `<img class="team-logo" src="${esc(awayLogo)}">`
            : `<div class="team-logo"></div>`
          }

          <div class="team-name">
            ${esc(awayName)}
          </div>
        </div>

      </div>
    </div>
  `;
}


/* =========================================================
   FAVORITOS — JOGOS
   ========================================================= */

function toggleFavJogo(id,leagueCode,home,away){

  const index=
    favoritosJogos.findIndex(x=>String(x.id)===String(id));

  if(index>=0){

    favoritosJogos.splice(index,1);

  }else{

    favoritosJogos.push({
      id:String(id),
      leagueCode,
      home,
      away
    });

  }

  guardarTudo();

  mostrarJogos();
}


/* =========================================================
   FAVORITOS — EQUIPAS
   ========================================================= */

function toggleFavEquipa(id,nome,logo){

  id=String(id);

  const index=
    favoritosEquipas.findIndex(x=>String(x.id)===id);

  if(index>=0){

    favoritosEquipas.splice(index,1);

  }else{

    favoritosEquipas.push({
      id,
      nome,
      logo
    });

  }

  guardarTudo();
}


/* =========================================================
   FAVORITOS — JOGADORES
   ========================================================= */

function toggleFavJogador(id,nome,imagem){

  id=String(id);

  const index=
    favoritosJogadores.findIndex(x=>String(x.id)===id);

  if(index>=0){

    favoritosJogadores.splice(index,1);

  }else{

    favoritosJogadores.push({
      id,
      nome,
      imagem
    });

  }

  guardarTudo();
}


/* =========================================================
   FAVORITOS
   ========================================================= */

function mostrarFavoritos(){

  setNav("navFav");

  document.getElementById("app").innerHTML=`
    <h2>⭐ Favoritos</h2>

    <div class="card">
      <div class="league-title">
        ⚽ Jogos favoritos
      </div>

      <div id="favJogos"></div>
    </div>

    <div class="card">
      <div class="league-title">
        🛡️ Equipas favoritas
      </div>

      <div id="favEquipas"></div>
    </div>

    <div class="card">
      <div class="league-title">
        👤 Jogadores favoritos
      </div>

      <div id="favJogadores"></div>
    </div>
  `;

  const fj=document.getElementById("favJogos");
  const fe=document.getElementById("favEquipas");
  const fp=document.getElementById("favJogadores");

  fj.innerHTML=
    favoritosJogos.length
    ? favoritosJogos.map(x=>`
      <div class="game"
        onclick="abrirJogo(${jsArg(x.id)},${jsArg(x.leagueCode)})">

        <div class="teams">
          <div class="team">
            <div class="team-name">${esc(x.home)}</div>
          </div>

          <div class="score">⚽</div>

async function carregarNoticias(){

  const area=document.getElementById("noticiasArea");

  if(!area) return;

  try{

    const codigos=[
      ligaAtual.code,
      "eng.1",
      "esp.1",
      "ita.1",
      "ger.1",
      "uefa.champions"
    ];

    const resultados=await Promise.all(

      codigos.map(async code=>{

        try{

          let r=await fetch(
            ESPN_SITE +
            code +
            "/news?limit=20&lang=pt&region=pt"
          );

          if(!r.ok)
            throw new Error();

          let d=await r.json();

          return (d.articles || []).map(a=>({
            ...a,
            _leagueCode:code
          }));

        }catch(e){

          try{

            const r=await fetch(
              ESPN_SITE +
              code +
              "/news?limit=20"
            );

            const d=await r.json();

            return (d.articles || []).map(a=>({
              ...a,
              _leagueCode:code
            }));

          }catch(e2){

            return [];

          }

        }

      })

    );

    const mapa=new Map();

    resultados.flat().forEach(n=>{

      const chave=
        n.id ||
        n.links?.[0]?.href ||
        n.headline;

      if(chave && !mapa.has(chave))
        mapa.set(chave,n);

    });

    noticiasAtuais=
      [...mapa.values()]
      .sort(
        (a,b)=>
          new Date(b.published || 0) -
          new Date(a.published || 0)
      )
      .slice(0,20);

    if(!noticiasAtuais.length)
      return;

    area.innerHTML=`
      <h2 style="margin-top:20px">📰 Notícias</h2>

      ${noticiasAtuais.map(
        (n,i)=>renderNoticia(n,i)
      ).join("")}
    `;

  }catch(e){

    area.innerHTML="";

  }
}

function renderNoticia(n,index){

  const imagem=
    n.images?.[0]?.url ||
    n.image ||
    "";

  const titulo=
    traduzirNoticias(
      n.headline ||
      n.title ||
      "Notícia"
    );

  return `
    <div
      class="card news-card"
      onclick="abrirNoticia(${index})">

      ${
        imagem
        ? `<img class="news-image" src="${esc(imagem)}">`
        : ""
      }

      <div class="news-content">

        <div class="news-title">
          ${esc(titulo)}
        </div>

        <div class="news-date">
          ${dataPublicacao(n.published)}
        </div>

      </div>
    </div>
  `;
}

function traduzirNoticias(texto){

  let t=String(texto || "");

  const traducoes={
    "Manchester United":"Manchester United",
    "Liverpool":"Liverpool",
    "Chelsea":"Chelsea",
    "Arsenal":"Arsenal",
    "Real Madrid":"Real Madrid",
    "Barcelona":"Barcelona",
    "Bayern Munich":"Bayern Munique",
    "Manchester City":"Manchester City",
    "Champions League":"Liga dos Campeões",
    "Europa League":"Liga Europa",
    "Premier League":"Premier League",
    "LaLiga":"LaLiga",
    "Serie A":"Serie A",
    "Bundesliga":"Bundesliga",
    "Ligue 1":"Ligue 1",
    "match":"jogo",
    "Match":"Jogo",
    "win":"vitória",
    "Win":"Vitória",
    "wins":"vence",
    "Wins":"Vence",
    "lost":"perdeu",
    "Lost":"Perdeu",
    "draw":"empate",
    "Draw":"Empate",
    "goal":"golo",
    "Goal":"Golo",
    "goals":"golos",
    "Goals":"Golos",
    "player":"jogador",
    "Player":"Jogador",
    "manager":"treinador",
    "Manager":"Treinador",
    "transfer":"transferência",
    "Transfer":"Transferência"
  };

  Object.keys(traducoes).forEach(k=>{
    t=t.replaceAll(k,traducoes[k]);
  });

  return t;
}

function abrirNoticia(index){

  const n=noticiasAtuais[index];

  if(!n) return;

  const titulo=
    traduzirNoticias(
      n.headline ||
      n.title ||
      "Notícia"
    );

    traduzirNoticias(
      n.description ||
      n.story ||
      ""
    );

  const imagem=
    n.images?.[0]?.url ||
    n.image ||
    "";

  const link=
    n.links?.web?.href ||

  document.getElementById("modalContent").innerHTML=`

    ${

}

function fecharModal(event){

  if(
    !event ||
    event.target.id==="modal"
  ){

    document
      .getElementById("modal")

}

    const [r1,r2]=await Promise.all([

      fetch(
        ESPN_SITE +
        leagueCode +
        "/summary?event=" +
        encodeURIComponent(id)
      ),

      fetch(
        ESPN_CDN +
        encodeURIComponent(id)
      )

    ]);

    const summary=
      r1.ok ? await r1.json() : {};

    const pacote=

    const awayLogo=
      away.team?.logo ||
      away.logo ||

    const homeScore=
      home.score ?? "-";

    const awayScore=
      away.score ?? "-";

    const status=
      comp.status?.type?.shortDetail ||
      comp.status?.type?.detail ||

    document.getElementById("app").innerHTML=`

        ← Voltar aos jogos

        <div class="detail-competition">

/* =========================================================
   FUNÇÕES AUXILIARES DOS ACONTECIMENTOS
   ========================================================= */

function nomeJogador(obj){

  if(!obj) return "";

  if(typeof obj==="string")
    return obj;

  if(typeof obj!=="object")
    return "";

  const campos=[
    "displayName",
    "fullName",
    "shortName",
    "name",
    "athleteName"
  ];

  for(const c of campos){

    if(
      typeof obj[c]==="string" &&
      obj[c].trim()
    )
      return obj[c].trim();

  }

  if(obj.athlete){

    const n=nomeJogador(obj.athlete);

    if(n) return n;
  }

  if(obj.player){

    const n=nomeJogador(obj.player);

    if(n) return n;
  }

  if(obj.person){

    const n=nomeJogador(obj.person);

    if(n) return n;
  }

  return "";
}

function textoEvento(e){

  return [
    e?.text,
    e?.description,
    e?.shortText,
    e?.type?.text,
    e?.type?.name,
    e?.type?.abbreviation,
    e?.comment
  ]
  .filter(Boolean)
  .join(" ");
}

function jogadoresEvento(e){

  const encontrados=[];

  const adicionar=(x)=>{

    if(!x) return;

    if(Array.isArray(x)){

      x.forEach(adicionar);
      return;

    }

    const nome=nomeJogador(x);

    if(nome)
      encontrados.push(nome);
  };

  adicionar(e.player);
  adicionar(e.athlete);
  adicionar(e.scorer);
  adicionar(e.assister);
  adicionar(e.participant);
  adicionar(e.athletesInvolved);
  adicionar(e.players);

  if(e.substitution){
    adicionar(e.substitution.playerIn);
    adicionar(e.substitution.playerOut);
    adicionar(e.substitution.in);
    adicionar(e.substitution.out);
  }

  adicionar(e.playerIn);
  adicionar(e.playerOut);
  adicionar(e.athleteIn);
  adicionar(e.athleteOut);

  return [...new Set(encontrados)];
}

function jogadorPorFuncao(e,funcao){

  const procurar=(obj)=>{

    if(!obj) return "";

    if(Array.isArray(obj)){

      for(const item of obj){

        const n=procurar(item);

        if(n) return n;

      }

      return "";
    }

    if(typeof obj!=="object")
      return "";

    const tipo=[
      obj.role,
      obj.type,
      obj.type?.name,
      obj.type?.text,
      obj.position
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    if(
      tipo.includes(funcao) ||
      (funcao==="assist" &&
       tipo.includes("assisted"))
    ){

      const n=nomeJogador(obj);

      if(n) return n;
    }

    return "";
  };

  const candidatos=[
    e.assist,
    e.assists,
    e.assister,
    e.assistedBy,
    e.athletesInvolved,
    e.players,
    e.participants
  ];

  for(const c of candidatos){

    const n=procurar(c);

    if(n) return n;

  }

  return "";
}/* =========================================================
   ACONTECIMENTOS DO JOGO
   ========================================================= */

function renderAcontecimentos(summary,pacote,homeName,awayName){

  const area=document.getElementById("acontecimentos");

  if(!area) return;

  let plays=[];

  if(Array.isArray(summary.plays))
    plays=summary.plays;

  else if(Array.isArray(summary.header?.plays))
    plays=summary.header.plays;

  else if(Array.isArray(pacote.plays))
    plays=pacote.plays;

  else if(Array.isArray(pacote.header?.plays))
    plays=pacote.header.plays;

  /*
    Procuramos também acontecimentos dentro
    de estruturas mais profundas do pacote ESPN.
  */

  function procurarPlays(obj){

    if(!obj || typeof obj!=="object")
      return [];

    let encontrados=[];

    if(Array.isArray(obj)){

      for(const item of obj){

        if(
          item &&
          typeof item==="object" &&
          (
            item.text ||
            item.description ||
            item.type?.text ||
            item.type?.name ||
            item.scoringPlay
          )
        ){
          encontrados.push(item);
        }

        encontrados.push(...procurarPlays(item));
      }

    }else{

      for(const key of Object.keys(obj)){

        const valor=obj[key];

        if(
          key.toLowerCase().includes("play") &&
          Array.isArray(valor)
        ){
          encontrados.push(...valor);
        }

        if(
          valor &&
          typeof valor==="object"
        ){
          encontrados.push(...procurarPlays(valor));
        }

      }

    }

    return encontrados;
  }

  if(!plays.length){

    plays=procurarPlays(summary);

    if(!plays.length)
      plays=procurarPlays(pacote);

  }

  /*
    Remover duplicados
  */

  const mapa=new Map();

  plays.forEach(p=>{

    const chave=
      p.id ||
      [
        p.period?.number,
        p.clock?.displayValue,
        p.text,
        p.description
      ].join("|");

    if(!mapa.has(chave))
      mapa.set(chave,p);

  });

  plays=[...mapa.values()];


  function texto(p){
    return textoEvento(p).toLowerCase();
  }

  function eGolo(p){

    const t=texto(p);

    return Boolean(
      p.scoringPlay===true ||
      p.isGoal===true ||
      t.includes("goal") ||
      t.includes("golo") ||
      t.includes("scores") ||
      t.includes("marcou")
    );
  }

  function eAssistencia(p){

    const t=texto(p);

    return Boolean(
      p.assist ||
      p.assister ||
      p.assistedBy ||
      t.includes("assist") ||
      t.includes("assistência") ||
      t.includes("assistencia")
    );
  }

  function eAmarelo(p){

    const t=texto(p);

    if(
      t.includes("second yellow") ||
      t.includes("segundo amarelo") ||
      t.includes("red card") ||
      t.includes("red-card") ||
      t.includes("cartão vermelho") ||
      t.includes("cartao vermelho") ||
      t.includes("sent off") ||
      t.includes("expuls")
    )
      return false;

    return Boolean(
      t.includes("yellow card") ||
      t.includes("yellow-card") ||
      t.includes("cartão amarelo") ||
      t.includes("cartao amarelo") ||
      t.includes("yellow")
    );
  }

  function eVermelho(p){

    const t=texto(p);

    return Boolean(
      t.includes("red card") ||
      t.includes("red-card") ||
      t.includes("cartão vermelho") ||
      t.includes("cartao vermelho") ||
      t.includes("sent off") ||
      t.includes("expuls") ||
      t.includes("second yellow") ||
      t.includes("segundo amarelo")
    );
  }

  function eSubstituicao(p){

    const t=texto(p);

    return Boolean(
      p.substitution ||
      p.playerIn ||
      p.playerOut ||
      p.athleteIn ||
      p.athleteOut ||
      t.includes("substitution") ||
      t.includes("substituted") ||
      t.includes("substituição") ||
      t.includes("substituicao")
    );
  }


  const golos=[];
  const assistencias=[];
  const amarelos=[];
  const vermelhos=[];
  const substituicoes=[];


  plays.forEach(p=>{

    if(eSubstituicao(p)){

      let nomes=jogadoresEvento(p);

      let entrada=
        nomeJogador(p.playerIn) ||
        nomeJogador(p.athleteIn) ||
        nomeJogador(p.substitution?.playerIn) ||
        nomeJogador(p.substitution?.in) ||
        "";

      let saida=
        nomeJogador(p.playerOut) ||
        nomeJogador(p.athleteOut) ||
        nomeJogador(p.substitution?.playerOut) ||
        nomeJogador(p.substitution?.out) ||
        "";

      if(!entrada && nomes.length>=2)
        entrada=nomes[1];

      if(!saida && nomes.length>=1)
        saida=nomes[0];

      substituicoes.push({
        p,
        entrada,
        saida
      });

      return;
    }

    if(eVermelho(p)){

      vermelhos.push(p);

      return;
    }

    if(eAmarelo(p)){

      amarelos.push(p);

      return;
    }

    if(eGolo(p)){

      golos.push(p);

      /*
        Se a assistência estiver no próprio
        acontecimento, guardamos também.
      */

      if(eAssistencia(p))
        assistencias.push(p);

      return;
    }

    if(eAssistencia(p)){

      assistencias.push(p);

    }

  });


  function minuto(p){

    return (
      p.clock?.displayValue ||
      p.clock?.value ||
      p.period?.displayValue ||
      p.period?.number ||
      ""
    );
  }


  function equipaEvento(p){

    const team=
      p.team ||
      p.teamRef ||
      p.competitor ||
      p.participant?.team ||
      null;

    if(team){

      return nomeJogador(team) ||
        team.displayName ||
        team.shortDisplayName ||
        "";
    }

    const tid=
      p.team?.id ||
      p.teamId;

    if(tid){

      if(
        String(tid) ===
        String(
          summary.header?.competitions?.[0]
          ?.competitors?.[0]?.team?.id
        )
      )
        return homeName;

      if(
        String(tid) ===
        String(
          summary.header?.competitions?.[0]
          ?.competitors?.[1]?.team?.id
        )
      )
        return awayName;

    }

    return "";
  }


  function nomeMarcador(p){

    /*
      Primeiro tentamos campos específicos
      de marcador.
    */

    const direto=
      nomeJogador(p.scorer) ||
      nomeJogador(p.shooter) ||
      nomeJogador(p.player) ||
      nomeJogador(p.athlete);

    if(direto)
      return direto;

    /*
      Depois tentamos athletesInvolved.
    */

    if(Array.isArray(p.athletesInvolved)){

      for(const a of p.athletesInvolved){

        const n=nomeJogador(a);

        if(n) return n;

      }

    }

    /*
      Último recurso: jogadores encontrados.
    */

    const nomes=jogadoresEvento(p);

    return nomes[0] || "";
  }


  function nomeAssistente(p){

    const direto=
      nomeJogador(p.assister) ||
      nomeJogador(p.assist) ||
      nomeJogador(p.assistedBy) ||
      jogadorPorFuncao(p,"assist");

    if(direto)
      return direto;

    /*
      Alguns formatos ESPN colocam assistências
      numa lista de atletas envolvidos.
    */

    if(Array.isArray(p.athletesInvolved)){

      for(const a of p.athletesInvolved){

        const tipo=[
          a.role,
          a.type,
          a.type?.name,
          a.type?.text
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        if(
          tipo.includes("assist") ||
          tipo.includes("assister")
        ){

          const n=nomeJogador(a);

          if(n) return n;
        }

      }

    }

    /*
      Se não houver identificação estruturada,
      tentamos encontrar "assisted by Nome".
    */

    const original=textoEvento(p);

    const match=
      original.match(
        /assisted\s+by\s+([^,.;]+)/i
      );

    if(match)
      return match[1].trim();

    const matchPT=
      original.match(
        /assist[êe]ncia(?:\s+de)?\s+([^,.;]+)/i
      );

    if(matchPT)
      return matchPT[1].trim();

    return "";
  }


  function renderEvento(p,icone,nome,extra=""){

    const nomeFinal=
      nome ||
      "Jogador não identificado";

    const team=
      equipaEvento(p);

    return `
      <div class="event">

        <div class="event-minute">
          ${esc(minuto(p))}
        </div>

        <div class="event-icon">
          ${icone}
        </div>

        <div class="event-info">

          <div class="event-player">
            ${esc(nomeFinal)}
          </div>

          ${
            extra
            ? `<div>${extra}</div>`
            : ""
          }

          ${
            team
            ? `<div class="event-team">
                ${esc(team)}
              </div>`
            : ""
          }

        </div>

      </div>
    `;
  }


  let html="";


  /* =========================
     GOLOS
     ========================= */

  if(golos.length){

    html+=`
      <div class="section">
        <div class="event-group">

          <div class="event-title">
            ⚽ Golos
          </div>

          ${golos.map(p=>{

            const marcador=
              nomeMarcador(p);

            const assistente=
              nomeAssistente(p);

            let extra="";

            if(assistente){

              extra=`
                <span style="color:#64748b">
                  🎯 Assistência:
                </span>
                <strong>
                  ${esc(assistente)}
                </strong>
              `;
            }

            return renderEvento(
              p,
              "⚽",
              marcador,
              extra
            );

          }).join("")}

        </div>
      </div>
    `;
  }


  /* =========================
     ASSISTÊNCIAS
     ========================= */

  /*
    Só mostramos aqui assistências que
    não tenham sido mostradas juntamente
    com o golo.
  */

  const assistSeparadas=
    assistencias.filter(a=>{
      return !golos.includes(a);
    });

  if(assistSeparadas.length){

    html+=`
      <div class="section">
        <div class="event-group">

          <div class="event-title">
            🎯 Assistências
          </div>

          ${assistSeparadas.map(p=>

            renderEvento(
              p,
              "🎯",
              nomeAssistente(p) ||
              nomeMarcador(p)
            )

          ).join("")}

        </div>
      </div>
    `;

  }


  /* =========================
     AMARELOS
     ========================= */

  if(amarelos.length){

    html+=`
      <div class="section">
        <div class="event-group">

          <div class="event-title">
            🟨 Cartões amarelos
          </div>

          ${amarelos.map(p=>

            renderEvento(
              p,
              "🟨",
              nomeMarcador(p)
            )

          ).join("")}

        </div>
      </div>
    `;

  }


  /* =========================
     VERMELHOS
     ========================= */

  if(vermelhos.length){

    html+=`
      <div class="section">
        <div class="event-group">

          <div class="event-title">
            🟥 Cartões vermelhos
          </div>

          ${vermelhos.map(p=>

            renderEvento(
              p,
              "🟥",
              nomeMarcador(p)
            )

          ).join("")}

        </div>
      </div>
    `;

  }


  /* =========================
     SUBSTITUIÇÕES
     ========================= */

  if(substituicoes.length){

    html+=`
      <div class="section">
        <div class="event-group">

          <div class="event-title">
            🔄 Substituições
          </div>

          ${substituicoes.map(x=>{

            let extra="";

            if(x.saida || x.entrada){

              extra=`
                ${
                  x.saida
                  ? `<span class="sub-out">
                       ${esc(x.saida)}
                     </span>`
                  : ""
                }

                ${
                  x.saida && x.entrada
                  ? " → "
                  : ""
                }

                ${
                  x.entrada
                  ? `<span class="sub-in">
                       ${esc(x.entrada)}
                     </span>`
                  : ""
                }
              `;

            }else{

              extra=
                esc(
                  x.p.text ||
                  x.p.description ||
                  "Substituição"
                );

            }

            return renderEvento(
              x.p,
              "🔄",
              "",
              extra
            );

          }).join("")}

        </div>
      </div>
    `;

  }


  if(!html){

    html=`
      <div class="section">
        <div class="empty">
          Ainda não existem golos, assistências,
          cartões ou substituições disponíveis.
        </div>
      </div>
    `;

  }

  area.innerHTML=html;
}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

function renderEstatisticas(
  summary,
  pacote,
  homeName,
  awayName
){

  const area=document.getElementById("estatisticas");

  if(!area) return;

  const competitors=
    summary.header?.competitions?.[0]?.competitors ||
    pacote.header?.competitions?.[0]?.competitors ||
    [];

  const home=
    competitors.find(x=>x.homeAway==="home") ||
    competitors[0] ||
    {};

  const away=
    competitors.find(x=>x.homeAway==="away") ||
    competitors[1] ||
    {};


  function todosObjetos(obj,resultado=[]){

    if(!obj || typeof obj!=="object")
      return resultado;

    if(Array.isArray(obj)){

      obj.forEach(x=>
        todosObjetos(x,resultado)
      );

      return resultado;
    }

    resultado.push(obj);

    Object.values(obj).forEach(x=>{

      if(
        x &&
        typeof x==="object"
      )
        todosObjetos(x,resultado);

    });

    return resultado;
  }


  const objetos=
    todosObjetos(summary)
    .concat(todosObjetos(pacote));


  function procurarStat(
    lado,
    nomes
  ){

    const arrays=[];

    function recolher(obj){

      if(!obj || typeof obj!=="object")
        return;

      if(Array.isArray(obj)){

        obj.forEach(recolher);
        return;

      }

      if(
        obj.home ||
        obj.away ||
        obj.homeValue ||
        obj.awayValue
      ){

        arrays.push(obj);

      }

      Object.values(obj).forEach(x=>{

        if(
          x &&
          typeof x==="object"
        )
          recolher(x);

      });

    }

    recolher(lado);

    const todos=[
      ...arrays,
      ...objetos
    ];

    for(const s of todos){

      const nome=String(
        s.name ||
        s.label ||
        s.displayName ||
        s.shortName ||
        s.type?.name ||
        ""
      ).toLowerCase();

      if(
        nomes.some(n=>nome.includes(n))
      ){

        const valor=
          lado===home
          ? (
              s.homeValue ??
              s.home?.value ??
              s.value ??
              s.displayValue ??
              ""
            )
          : (
              s.awayValue ??
              s.away?.value ??
              s.value ??
              s.displayValue ??
              ""
            );

        if(
          valor!=="" &&
          valor!==null &&
          valor!==undefined
        )
          return valor;

      }

    }

    return "-";
  }


  const stats=[
    {
      nome:"Posse",
      procura:["possession","posse"],
      unidade:"%"
    },
    {
      nome:"Remates à baliza",
      procura:[
        "shots on target",
        "shotsontarget",
        "on target"
      ]
    },
    {
      nome:"Remates",
      procura:[
        "total shots",
        "shots",
        "remates"
      ]
    },
    {
      nome:"Cantos",
      procura:["corners","cantos"]
    },
    {
      nome:"Faltas",
      procura:["fouls","faltas"]
    },
    {
      nome:"Fora de jogo",
      procura:[
        "offsides",
        "offside",
        "fora de jogo"
      ]
    },
    {
      nome:"Cartões amarelos",
      procura:[
        "yellow cards",
        "yellow",
        "cartões amarelos"
      ]
    },
    {
      nome:"Cartões vermelhos",
      procura:[
        "red cards",
        "red",
        "cartões vermelhos"
      ]
    },
    {
      nome:"Defesas",
      procura:["saves","defesas"]
    },
    {
      nome:"Passes",
      procura:["passes"]
    },
    {
      nome:"Precisão de passe",
      procura:[
        "pass completion",
        "passing accuracy",
        "pass accuracy"
      ],
      unidade:"%"
    }
  ];


  let linhas="";

  stats.forEach(s=>{

    const h=
      procurarStat(home,s.procura);

    const a=
      procurarStat(away,s.procura);

    if(h==="-" && a==="-")
      return;

    linhas+=`
      <tr>

        <td class="stat-name">
          ${esc(s.nome)}
        </td>

        <td>
          ${esc(h)}${s.unidade || ""}
        </td>

        <td>
          ${esc(a)}${s.unidade || ""}
        </td>

      </tr>
    `;

  });


  if(!linhas){

    area.innerHTML=`
      <div class="section">
        <h3>📊 Estatísticas</h3>

        <div class="empty">
          Estatísticas ainda não disponíveis.
        </div>
      </div>
    `;

    return;
  }


  area.innerHTML=`
    <div class="section">

      <h3>📊 Estatísticas</h3>

      <table class="stats-table">

        <tr>
          <td></td>
          <td>${esc(homeName)}</td>
          <td>${esc(awayName)}</td>
        </tr>

        ${linhas}

      </table>

    </div>
  `;
}

async function carregarTabela(){

  const area=
    document.getElementById("tabelaArea");

  try{

    const r=await fetch(
      ESPN_V2 +
      ligaAtual.code +
      "/standings"
    );

    if(!r.ok)
      throw new Error();

    const dados=await r.json();

    const entries=[];


    function recolher(obj){

      if(!obj || typeof obj!=="object")
        return;

      if(Array.isArray(obj)){

        obj.forEach(recolher);
        return;

      }

      if(
        obj.team &&
        (
          obj.stats ||
          obj.note ||
          obj.name
        )
      ){

        entries.push(obj);

      }

      Object.values(obj).forEach(x=>{

        if(
          x &&
          typeof x==="object"
        )
          recolher(x);

      });

    }


    recolher(dados);


    const mapa=new Map();

    entries.forEach(e=>{

      const id=
        e.team?.id ||
        e.team?.uid ||
        e.team?.displayName;

      if(
        id &&
        !mapa.has(id)
      )
        mapa.set(id,e);

    });


    const lista=
      [...mapa.values()];


    if(!lista.length){

      area.innerHTML=`
        <div class="card">
          <div class="empty">
            Tabela não disponível para esta competição.
          </div>
        </div>
      `;

      return;
    }


    function valor(e,nomes){

      const stats=e.stats || [];

      for(const s of stats){

        const n=String(
          s.name ||
          s.abbreviation ||
          s.displayName ||
          ""
        ).toLowerCase();

        if(
          nomes.some(x=>n.includes(x))
        ){

          return (
            s.value ??
            s.displayValue ??
            "-"
          );

        }

      }

      return "-";
    }


    lista.sort((a,b)=>{

      const pa=parseFloat(
        valor(a,["points","pontos"])
      );

      const pb=parseFloat(
        valor(b,["points","pontos"])
      );

      if(
        !Number.isNaN(pa) &&
        !Number.isNaN(pb)
      )
        return pb-pa;

      return 0;

    });


    area.innerHTML=`
      <div class="card">

        <div class="league-title">
          ${esc(nomeLiga(ligaAtual.code))}
        </div>

        ${lista.map((e,i)=>{

          const team=e.team || {};

          const id=
            team.id ||
            team.uid ||
            "";

          const nome=
            team.displayName ||
            team.shortDisplayName ||
            team.name ||
            "Equipa";

          const logo=
            team.logos?.[0]?.href ||
            team.logo ||
            "";

          const pontos=
            valor(
              e,
              ["points","pontos"]
            );

          return `

            <div class="table-row">

              <div class="table-pos">
                ${i+1}
              </div>

              <div
                class="table-team"
                onclick="abrirEquipa(
                  ${jsArg(id)},
                  ${jsArg(nome)},
                  ${jsArg(logo)}
                )">

                ${
                  logo
                  ? `<img src="${esc(logo)}">`
                  : ""
                }

                <span>
                  ${esc(nome)}
                </span>

              </div>

              <div class="table-points">
                ${esc(pontos)}
              </div>

            </div>

          `;

        }).join("")}

      </div>
    `;


  }catch(e){

    area.innerHTML=`
      <div class="error">
        Não foi possível carregar a tabela.
      </div>
    `;

  }

}

/* =========================================================
   HISTÓRICO DO JOGADOR
   ========================================================= */

async function carregarHistoricoJogador(
  id,
  jogador,
  equipaAtual
){

  const area=
    document.getElementById(
      "historicoJogador"
    );

  if(!area) return;


  const endpoints=[
    "statistics",
    "statisticslog",
    "gamelog"
  ];


  const resultados=[];


  for(const endpoint of endpoints){

    try{

      const r=await fetch(
        "https://sports.core.api.espn.com/v2/sports/soccer/athletes/" +
        encodeURIComponent(id) +
        "/" +
        endpoint +
        "?lang=pt&region=pt"
      );

      if(!r.ok) continue;

      const d=await r.json();

      resultados.push(d);

    }catch(e){}

  }


  const historico=[];


  function extrair(obj){

    if(!obj || typeof obj!=="object")
      return;


    if(Array.isArray(obj)){

      obj.forEach(extrair);
      return;

    }


    const team=
      obj.team ||
      obj.teamRef ||
      null;


    const teamNome=
      team?.displayName ||
      team?.name ||
      team?.fullName ||
      "";


    const season=
      obj.season?.displayName ||
      obj.season?.name ||
      obj.season?.year ||
      obj.year ||
      obj.seasonYear ||
      "";


    if(teamNome || season){

      historico.push({
        team,
        teamNome,
        season
      });

    }


    Object.values(obj).forEach(x=>{

      if(
        x &&
        typeof x==="object"
      )
        extrair(x);

    });

  }


  resultados.forEach(extrair);


  /*
    Se a API indicar diretamente a equipa atual,
    adicionamos ao histórico.
  */

  if(
    jogador.team &&
    (
      jogador.team.displayName ||
      jogador.team.name
    )
  ){

    historico.push({

      team:jogador.team,

      teamNome:
        jogador.team.displayName ||
        jogador.team.name,

      season:"Atual"

    });

  }


  const mapa=new Map();


  historico.forEach(h=>{

    const chave=
      String(h.teamNome || "") +
      "|" +
      String(h.season || "");

    if(
      h.teamNome &&
      !mapa.has(chave)
    )
      mapa.set(chave,h);

  });


  const lista=[...mapa.values()];


  if(!lista.length){

    area.innerHTML=`
      <div class="section">

        <h3>📚 Histórico</h3>

        <div class="empty">
          Histórico de equipas não disponível
          através dos dados fornecidos pela API.
        </div>

      </div>
    `;

    return;

  }


  area.innerHTML=`

    <div class="section">

      <h3>📚 Histórico de equipas</h3>

      ${lista.map(h=>{

        const team=h.team || {};

        const idTeam=
          team.id ||
          team.uid ||
          "";

        const nome=
          h.teamNome;

        const logo=
          team.logo ||
          team.logos?.[0]?.href ||
          "";


        return `

          <div
            class="player-card"
            onclick="${
              idTeam
              ? `abrirEquipa(
                  ${jsArg(idTeam)},
                  ${jsArg(nome)},
                  ${jsArg(logo)}
                )`
              : ""
            }">

            ${
              logo
              ? `<img
                   class="player-photo"
                   src="${esc(logo)}">`
              : `<div class="player-photo"></div>`
            }

            <div class="player-info">

              <div class="player-name">
                ${esc(nome)}
              </div>

              <div class="player-position">
                ${esc(
                  h.season ||
                  ""
                )}
              </div>

            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;

}


/* =========================================================
   ESTATÍSTICAS DO JOGADOR
   ========================================================= */

async function carregarStatsJogador(id){

  const area=
    document.getElementById(
      "statsJogador"
    );

  if(!area) return;


  const endpoints=[
    "statistics",
    "statisticslog"
  ];


  const dados=[];


  for(const endpoint of endpoints){

    try{

      const r=await fetch(
        "https://sports.core.api.espn.com/v2/sports/soccer/athletes/" +
        encodeURIComponent(id) +
        "/" +
        endpoint +
        "?lang=pt&region=pt"
      );

      if(!r.ok) continue;

      dados.push(await r.json());

    }catch(e){}

  }


  if(!dados.length){

    area.innerHTML="";
    return;

  }


  const todos=[];


  function extrair(obj){

    if(!obj || typeof obj!=="object")
      return;


    if(Array.isArray(obj)){

      obj.forEach(extrair);
      return;

    }


    if(
      obj.stats ||
      obj.statistics ||
      obj.categories ||
      obj.displayName
    ){

      todos.push(obj);

    }


    Object.values(obj).forEach(x=>{

      if(
        x &&
        typeof x==="object"
      )
        extrair(x);

    });

  }


  dados.forEach(extrair);


  function encontrar(nomes){

    for(const obj of todos){

      const stats=
        obj.stats ||
        obj.statistics ||
        [];


      if(!Array.isArray(stats))
        continue;


      for(const s of stats){

        const nome=
          String(
            s.name ||
            s.displayName ||
            s.abbreviation ||
            ""
          ).toLowerCase();


        if(
          nomes.some(x=>
            nome.includes(x)
          )
        ){

          return (
            s.displayValue ??
            s.value ??
            "-"
          );

        }

      }

    }

    return "-";
  }


  const jogos=
    encontrar([
      "games",
      "appearances",
      "jogos"
    ]);

  const titulares=
    encontrar([
      "starts",
      "titulares"
    ]);

  const minutos=
    encontrar([
      "minutes",
      "minutos"
    ]);

  const golos=
    encontrar([
      "goals",
      "golos"
    ]);

  const assistencias=
    encontrar([
      "assists",
      "assistências",
      "assistencias"
    ]);

  const amarelos=
    encontrar([
      "yellow cards",
      "yellow",
      "amarelos"
    ]);

  const vermelhos=
    encontrar([
      "red cards",
      "red",
      "vermelhos"
    ]);


  const valores=[
    ["Jogos",jogos],
    ["Titularidades",titulares],
    ["Minutos",minutos],
    ["Golos",golos],
    ["Assistências",assistencias],
    ["Amarelos",amarelos],
    ["Vermelhos",vermelhos]
  ];


  const validos=
    valores.filter(
      x=>x[1]!=="-"
    );


  if(!validos.length){

    area.innerHTML="";
    return;

  }


  area.innerHTML=`

    <div class="section">

      <h3>📊 Estatísticas do jogador</h3>

      <div class="info-grid">

        ${validos.map(x=>`

          <div class="info-box">

            <div class="info-label">
              ${esc(x[0])}
            </div>

            <div class="info-value">
              ${esc(x[1])}
            </div>

          </div>

        `).join("")}

      </div>

    </div>

  `;

}


/* =========================================================
   PESQUISA DE EQUIPAS
   ========================================================= */

async function pesquisarEquipas(){

  try{

    const r=await fetch(
      ESPN_SITE +
      ligaAtual.code +
      "/teams?limit=100"
    );

    if(!r.ok)
      throw new Error();

    const dados=await r.json();

    const equipas=[];


    function extrair(obj){

      if(!obj || typeof obj!=="object")
        return;


      if(Array.isArray(obj)){

        obj.forEach(extrair);
        return;

      }


      if(
        obj.team &&
        (
          obj.team.id ||
          obj.team.displayName
        )
      ){

        equipas.push(obj.team);

      }


      if(
        obj.id &&
        (
          obj.displayName ||
          obj.name
        )
      ){

        equipas.push(obj);

      }


      Object.values(obj).forEach(x=>{

        if(
          x &&
          typeof x==="object"
        )
          extrair(x);

      });

    }


    extrair(dados);


    const mapa=new Map();


    equipas.forEach(e=>{

      if(
        e.id &&
        !mapa.has(String(e.id))
      )
        mapa.set(String(e.id),e);

    });


    return [...mapa.values()];


  }catch(e){

    return [];

  }

}


/* =========================================================
   NOTIFICAÇÕES DOS FAVORITOS
   ========================================================= */

async function ativarNotificacoes(){

  if(!("Notification" in window)){

    alert(
      "Este navegador não suporta notificações."
    );

    return;

  }


  try{

    const permissao=
      await Notification.requestPermission();

    if(permissao!=="granted"){

      alert(
        "As notificações não foram autorizadas."
      );

      return;

    }


    alert(
      "🔔 Notificações FUTZONE ativadas."
    );

    monitorizarFavoritos();

  }catch(e){

    alert(
      "Não foi possível ativar as notificações."
    );

  }

}


async function monitorizarFavoritos(){

  if(
    !("Notification" in window) ||
    Notification.permission!=="granted"
  )
    return;


  if(!favoritosJogos.length)
    return;


  for(const fav of favoritosJogos){

    try{

      const r=await fetch(
        ESPN_SITE +
        fav.leagueCode +
        "/summary?event=" +
        encodeURIComponent(fav.id)
      );

      if(!r.ok) continue;

      const d=await r.json();

      const comp=
        d.header?.competitions?.[0];

      if(!comp) continue;

      const estado=
        comp.status?.type?.state;

      if(estado==="in"){

        const chave=
          "futzone_notificado_" +
          fav.id;

        if(
          !localStorage.getItem(chave)
        ){

          new Notification(
            "🔴 FUTZONE — Jogo em direto",
            {
              body:
                fav.home +
                " vs " +
                fav.away
            }
          );

          localStorage.setItem(
            chave,
            "1"
          );

        }

      }

    }catch(e){}

  }

}

   ========================================================= */

mostrarJogos();


/*

*/

setInterval(()=>{

  if(
    document.getElementById("navJogos")
      ?.classList.contains("active")
  ){

    carregarJogos();
    carregarNoticias();

  }

},60000);


/*
  Verificação periódica dos favoritos.
*/

setInterval(
  monitorizarFavoritos,
  60000
);
