<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
--blue:#0057B8;
--blue2:#1683FF;
--blue3:#003B7A;
--bg:#03060B;
--panel:#09111C;
--panel2:#0D1724;
--border:#1B2A3B;
--text:#F5F7FA;
--muted:#9DAABB;
--red:#FF4054;
--green:#20D68A;
--yellow:#FFD43B;
--white:#fff
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
margin:0;
min-height:100%;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif
}

body{padding-bottom:78px}

.app{
width:100%;
max-width:720px;
margin:auto
}

.header{
position:sticky;
top:0;
z-index:30;
padding:16px 15px 13px;
background:rgba(3,6,11,.96);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--border)
}

.logo{
font-size:28px;
line-height:1;
font-weight:900;
letter-spacing:-1px
}

.logo span{color:var(--blue2)}

.subtitle{
margin-top:4px;
font-size:11px;
color:var(--muted);
letter-spacing:1.3px;
font-weight:700
}

.sportSwitch{
display:flex;
gap:8px;
margin-top:14px
}

.sportBtn{
flex:1;
border:1px solid var(--border);
background:var(--panel);
color:var(--muted);
padding:10px 12px;
border-radius:12px;
font-weight:800
}

.sportBtn.active{
background:var(--blue);
color:white;
border-color:var(--blue)
}

main{padding:14px}

.sectionTitle{
font-size:17px;
font-weight:900;
margin:5px 0 10px
}

.leagues{
display:flex;
gap:8px;
overflow-x:auto;
padding:2px 0 10px;
scrollbar-width:none
}

.leagues::-webkit-scrollbar,
.filters::-webkit-scrollbar{display:none}

.league{
flex:none;
border:1px solid var(--border);
background:var(--panel);
color:var(--muted);
border-radius:12px;
padding:9px 12px;
font-size:12px;
font-weight:800
}

.league.active{
color:white;
background:var(--blue3);
border-color:var(--blue2)
}

.liveAll{
width:100%;
border:0;
border-radius:13px;
padding:13px;
margin:3px 0 12px;
background:linear-gradient(135deg,#8f0012,#e01832);
color:white;
font-weight:900
}

.filters{
display:flex;
gap:7px;
overflow-x:auto;
margin-bottom:14px;
scrollbar-width:none
}

.filter{
flex:none;
border:1px solid var(--border);
background:var(--panel);
color:var(--muted);
padding:8px 12px;
border-radius:10px;
font-size:12px;
font-weight:800
}

.filter.active{
background:var(--blue);
border-color:var(--blue);
color:white
}

.search{
width:100%;
background:var(--panel);
border:1px solid var(--border);
color:white;
border-radius:12px;
padding:12px;
outline:none;
margin-bottom:12px
}

.search:focus{border-color:var(--blue2)}

.loading,.empty,.error{
background:var(--panel);
border:1px solid var(--border);
border-radius:15px;
padding:22px 15px;
text-align:center;
color:var(--muted)
}

.error{color:#ff9ba6}

.dayTitle{
display:flex;
justify-content:space-between;
align-items:center;
margin:18px 2px 8px;
font-size:13px;
font-weight:900;
color:var(--muted)
}

.game{
background:var(--panel);
border:1px solid var(--border);
border-radius:15px;
padding:12px;
margin-bottom:9px;
cursor:pointer
}

.game:active{transform:scale(.99)}

.gameTop{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin-bottom:9px
}

.comp{
color:var(--muted);
font-size:10px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.status{
font-size:10px;
font-weight:900;
color:var(--muted)
}

.status.live{color:var(--red)}
.status.final{color:var(--green)}

.teams{
display:grid;
grid-template-columns:1fr 58px 1fr;
align-items:center;
gap:7px
}

.team{
display:flex;
align-items:center;
gap:8px;
min-width:0
}

.team.away{
justify-content:flex-end;
text-align:right
}

.teamLogo{
width:28px;
height:28px;
object-fit:contain;
flex:none
}

.teamName{
font-size:13px;
font-weight:800;
line-height:1.15;
overflow:hidden;
text-overflow:ellipsis
}

.score{
text-align:center;
font-size:19px;
font-weight:900
}

.scoreTime{
text-align:center;
font-size:13px;
font-weight:900;
color:var(--muted)
}

.star{
border:0;
background:none;
color:#657284;
font-size:21px;
padding:2px
}

.star.on{color:var(--yellow)}

.bottomNav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:50;
max-width:720px;
margin:auto;
height:68px;
display:grid;
grid-template-columns:repeat(4,1fr);
background:rgba(9,17,28,.97);
border-top:1px solid var(--border);
backdrop-filter:blur(15px)
}

.navBtn{
border:0;
background:none;
color:var(--muted);
font-size:11px;
font-weight:800
}

.navBtn.active{color:white}

.navIcon{
display:block;
font-size:20px;
margin-bottom:3px
}

.overlay{
position:fixed;
inset:0;
z-index:100;
display:none;
background:var(--bg);
overflow-y:auto
}

.overlay.show{display:block}

.detailHeader{
position:sticky;
top:0;
z-index:5;
display:flex;
align-items:center;
gap:12px;
padding:14px;
background:rgba(3,6,11,.96);
border-bottom:1px solid var(--border)
}

.back{
width:38px;
height:38px;
border:1px solid var(--border);
border-radius:11px;
background:var(--panel);
color:white
}

.detailTitle{font-weight:900}

.detailBody{
padding:15px;
max-width:720px;
margin:auto
}

.heroGame,.detailCard{
background:var(--panel);
border:1px solid var(--border);
border-radius:18px;
padding:18px 12px;
margin-bottom:12px
}

.heroTeams{
display:grid;
grid-template-columns:1fr 80px 1fr;
align-items:center;
gap:10px
}

.heroTeam{
text-align:center;
font-weight:900
}

.heroLogo{
width:50px;
height:50px;
object-fit:contain;
display:block;
margin:0 auto 8px
}

.heroScore{
text-align:center;
font-size:28px;
font-weight:900
}

.detailCard{
border-radius:15px;
padding:14px;
margin-bottom:10px
}

.detailCard h3{
margin:0 0 12px;
font-size:15px
}

.event{
display:flex;
gap:10px;
padding:8px 0;
border-bottom:1px solid var(--border);
font-size:13px
}

.event:last-child{border-bottom:0}

.eventTime{
color:var(--muted);
width:35px;
flex:none
}

.tableWrap{
overflow-x:auto;
background:var(--panel);
border:1px solid var(--border);
border-radius:15px
}

table{
width:100%;
border-collapse:collapse;
min-width:480px
}

th,td{
padding:10px 8px;
border-bottom:1px solid var(--border);
text-align:center;
font-size:12px
}

th{
color:var(--muted);
font-size:10px
}

td:first-child,
th:first-child{text-align:left}

.pos{
width:25px;
color:var(--muted)
}

.teamTable{
display:flex;
align-items:center;
gap:7px
}

.tableLogo{
width:23px;
height:23px;
object-fit:contain
}

.clickTeam{cursor:pointer}

.futsal{display:none}
.futsal.show{display:block}

.matchStatsGrid{
display:grid;
gap:10px
}

.statRow{
display:grid;
grid-template-columns:1fr 90px 1fr;
align-items:center;
gap:8px;
font-size:12px
}

.statTeam{font-weight:900}

.statTeam.home{text-align:right}

.statName{
text-align:center;
color:var(--muted);
font-size:10px;
font-weight:800
}

.footballPitch{
position:relative;
width:100%;
height:560px;
margin-top:12px;
border:3px solid #fff;
border-radius:10px;
overflow:hidden;
background:repeating-linear-gradient(
90deg,
#075b3d 0,
#075b3d 50px,
#086443 50px,
#086443 100px
)
}

.pitchHalf{
position:absolute;
top:50%;
left:0;
right:0;
border-top:2px solid rgba(255,255,255,.9)
}

.pitchCircle{
position:absolute;
width:105px;
height:105px;
border:2px solid rgba(255,255,255,.9);
border-radius:50%;
top:calc(50% - 52px);
left:calc(50% - 52px)
}

.pitchCenter{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
background:#fff;
left:calc(50% - 5px);
top:calc(50% - 5px)
}

.pitchBox{
position:absolute;
width:145px;
height:85px;
left:calc(50% - 72px);
border:2px solid rgba(255,255,255,.9)
}

.pitchBox.top{top:-2px}
.pitchBox.bottom{bottom:-2px}

.pitchSmallBox{
position:absolute;
width:65px;
height:35px;
left:calc(50% - 32px);
border:2px solid rgba(255,255,255,.9)
}

.pitchSmallBox.top{top:-2px}
.pitchSmallBox.bottom{bottom:-2px}

.pitchGoal{
position:absolute;
width:55px;
height:10px;
border:2px solid white;
left:calc(50% - 27px)
}

.pitchGoal.top{top:-3px}
.pitchGoal.bottom{bottom:-3px}

.pitchPlayer{
position:absolute;
transform:translate(-50%,-50%);
width:64px;
text-align:center;
z-index:3
}

.pitchPlayerDot{
width:32px;
height:32px;
margin:auto;
border-radius:50%;
background:var(--blue2);
border:2px solid white;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:900;
box-shadow:0 2px 8px rgba(0,0,0,.4)
}

.pitchPlayer.away .pitchPlayerDot{
background:var(--blue3)
}

.pitchPlayerName{
margin-top:3px;
font-size:8px;
line-height:1.1;
font-weight:900;
color:white;
text-shadow:0 1px 3px #000;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.lineupLegend{
display:flex;
justify-content:center;
gap:16px;
margin-top:10px;
color:var(--muted);
font-size:10px;
font-weight:800
}

.lineupLegend span{
display:flex;
align-items:center;
gap:5px
}

.lineupDot{
width:10px;
height:10px;
border-radius:50%;
background:var(--blue2);
border:1px solid white
}

.lineupDot.away{background:var(--blue3)}

.playerList{display:grid}

.playerItem{
display:flex;
align-items:center;
gap:9px;
padding:8px 0;
border-bottom:1px solid var(--border)
}

.playerNumber{
width:28px;
height:28px;
border-radius:8px;
background:var(--panel2);
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:900;
