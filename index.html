<!DOCTYPE html>

<style>
*{box-sizing:border-box}

html,body{

.app{

.header{

.logo{

.sportSwitch{

.sportBtn{

.sectionTitle{

}

.leagues,

.leagueChip{

.actionRow{

.allGamesBtn,

.search{

.search input{

.tableTeam img{

</style>

<body>

<div class="app">

<header class="header">

  <div>

          class="navBtn"

</div>

            onclick="fecharOverlay()">

    <div id="overlayTitle" class="overlayTitle">
      FUTZONE
    </div>

  </div>

  <div id="overlayContent" class="detailContent"></div>

<script>
"use strict";

/* =========================================================
   FUTZONE
   MOTOR DE DADOS
   ========================================================= */

const API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const STANDINGS_API =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas = [

  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  ["esp.1","🇪🇸 La Liga"],
  ["esp.2","🇪🇸 La Liga 2"],

  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],

  ["ksa.1","🇸🇦 Liga Saudita"],
  ["usa.1","🇺🇸 MLS"],

  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]

];

let ligaSelecionada = "por.1";
let filtroAtual = "todos";
let diaSelecionado = "";
let modoTodos = false;
let modoLive = false;
let desporto = "futebol";
let eventosAtuais = [];
let tabelaAtual = [];
let requestToken = 0;

const CACHE = new Map();
const INFLIGHT = new Map();

const favoritos =
  JSON.parse(localStorage.getItem("futzone_jogos_favoritos") || "[]");

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function cacheGet(key,ttl){

  const item = CACHE.get(key);

  if(!item) return null;

  if(Date.now()-item.time > ttl){

    CACHE.delete(key);
    return null;

  }

  return item.data;

}

async function fetchJSON(url,timeout=9000){

  const controller = new AbortController();

  const timer = setTimeout(
    ()=>controller.abort(),
    timeout
  );

  try{

    const response =
      await fetch(url,{
        signal:controller.signal,
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    return await response.json();

  }catch(error){

    console.warn("FUTZONE API:",url,error);
    return null;

  }finally{

    clearTimeout(timer);

  }

}

async function fetchAPI(url,timeout=9000,ttl=30000){

  const cached = cacheGet(url,ttl);

  if(cached !== null){
    return cached;
  }

  if(INFLIGHT.has(url)){
    return INFLIGHT.get(url);
  }

  const promise =
    fetchJSON(url,timeout)
      .then(data=>{

        if(data !== null){

          CACHE.set(
            url,
            {
              time:Date.now(),
              data
            }
          );

        }

        return data;

      })
      .catch(()=>null)
      .finally(()=>{
        INFLIGHT.delete(url);
      });

  INFLIGHT.set(url,promise);

  return promise;

}

/* =========================================================
   CORREÇÃO PRINCIPAL ESPN
   ========================================================= */

function getCompetidores(evento){

  if(Array.isArray(evento?.competitors)){
    return evento.competitors;
  }

  if(Array.isArray(evento?.competition?.competitors)){
    return evento.competition.competitors;
  }

  if(Array.isArray(evento?.competitions?.[0]?.competitors)){
    return evento.competitions[0].competitors;
  }

  return [];

}

function getTeamObject(c){

  return (
    c?.team ||
    c?.competitor?.team ||
    c?.competitor ||
    c ||
    {}
  );

}

function nomeEquipa(c){

  const t = getTeamObject(c);

  const candidatos = [

    t.displayName,
    t.fullName,
    t.shortDisplayName,
    t.name,

    c?.displayName,
    c?.fullName,
    c?.shortDisplayName,
    c?.name,

    c?.competitor?.displayName,
    c?.competitor?.fullName,
    c?.competitor?.shortDisplayName,
    c?.competitor?.name

  ];

  for(const nome of candidatos){

    if(
      typeof nome === "string" &&
      nome.trim()
    ){
      return nome.trim();
    }

  }

  if(t.location && t.name){

    return (
      String(t.location)+" "+
      String(t.name)
    ).trim();

  }

  return "";

}

function idEquipa(c){

  const t = getTeamObject(c);

  return String(
    t.id ||
    c?.id ||
    t.uid ||
    c?.uid ||
    ""
  );

}

function logoEquipa(c){

  const t = getTeamObject(c);

  return (
    t.logo ||
    t.logos?.[0]?.href ||
    t.logos?.[0]?.url ||
    c?.logo ||
    c?.logos?.[0]?.href ||
    c?.logos?.[0]?.url ||
    ""
  );

}

function obterCasaFora(evento){

  const lista = getCompetidores(evento);

  const casa =
    lista.find(x=>x.homeAway==="home") ||
    lista[0] ||
    null;

  const fora =
    lista.find(x=>x.homeAway==="away") ||
    lista[1] ||
    null;

  return {
    casa,
    fora
  };

}

/* =========================================================
   DATAS
   ========================================================= */

function dataHoje(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function formatarDataISO(data){

  if(!data) return "";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

function formatarHora(data){

  if(!data) return "--:--";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())){
    return "--:--";
  }

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function criarDias(){

  const box =
    document.getElementById("dayList");

  const hoje = new Date();

  box.innerHTML = "";

  for(let i=-1;i<=7;i++){

    const d = new Date(hoje);

    d.setDate(
      hoje.getDate()+i
    );

    const iso =
      d.toISOString().slice(0,10);

    const nome =
      d.toLocaleDateString(
        "pt-PT",
        {weekday:"short"}
      ).replace(".","");

    const numero =
      d.toLocaleDateString(
        "pt-PT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      );

    const button =
      document.createElement("button");

    button.className =
      "dayChip";

    if(i===0){
      button.classList.add("active");
      diaSelecionado=iso;
    }

    button.innerHTML =
      `<strong>${i===0 ? "HOJE" : nome.toUpperCase()}</strong>
       <span>${numero}</span>`;

    button.onclick = ()=>{

      document
        .querySelectorAll(".dayChip")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      diaSelecionado=iso;
      modoTodos=false;
      modoLive=false;

      carregarJogos();

    };

    box.appendChild(button);

  }

}

/* =========================================================
   LIGAS
   ========================================================= */

function criarLigas(){

  const box =
    document.getElementById("leagueList");

  box.innerHTML = "";

  ligas.forEach(
    ([id,nome])=>{

      const button =
        document.createElement("button");

      button.className =
        "leagueChip";

      if(id===ligaSelecionada){
        button.classList.add("active");
      }

      button.textContent=nome;

      button.onclick=()=>{

        ligaSelecionada=id;

        modoTodos=false;
        modoLive=false;

        document
          .querySelectorAll(".leagueChip")
          .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        carregarJogos();

      };

      box.appendChild(button);

    }
  );

}

/* =========================================================
   EVENTOS
   ========================================================= */

function isLive(e){

  const s = e?.status?.type || {};

  const texto =
    `${s.name || ""} ${s.description || ""} ${s.detail || ""}`
      .toUpperCase();

  return (
    s.state==="in" ||
    s.name==="STATUS_IN_PROGRESS" ||
    s.type==="in" ||
    texto.includes("LIVE") ||
    texto.includes("IN PROGRESS") ||
    texto.includes("IN PLAY")
  );

}

function isFinal(e){

  const s = e?.status?.type || {};

  return (
    s.completed===true ||
    s.state==="post" ||
    s.name==="STATUS_FINAL" ||
    s.type==="final"
  );

}

function nomeCompeticao(e,liga){

  return (
    e?.competitions?.[0]?.name ||
    e?.league?.name ||
    ligas.find(x=>x[0]===liga)?.[1] ||
    "Futebol"
  );

}

function normalizarEvento(e,liga){

  if(!e) return null;

  e.__futzoneLiga =
    liga ||
    e.__futzoneLiga ||
    "";

  return e;

}

function deduplicarEventos(lista){

  const map = new Map();

  lista.forEach(e=>{

    if(!e) return;

    const c =
      getCompetidores(e);

    const a =
      nomeEquipa(c[0]);

    const b =
      nomeEquipa(c[1]);

    const chave =
      e.id ||
      `${e.date||""}-${a}-${b}`;

    if(!map.has(chave)){
      map.set(chave,e);
    }

  });

  return [...map.values()];

}

/* =========================================================
   BUSCAR JOGOS
   ========================================================= */

async function buscarJogosLiga(liga,iso){

  const data =
    iso ||
    diaSelecionado ||
    dataHoje();

  const range =
    data.replaceAll("-","");

  const url =
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    range+
    "&limit=100";

  const json =
    await fetchAPI(
      url,
      9000,
      20000
    );

  let eventos =
    Array.isArray(json?.events)
      ? json.events
      : [];

  eventos =
    eventos
      .map(e=>normalizarEvento(e,liga))
      .filter(Boolean);

  return deduplicarEventos(eventos);

}

/* =========================================================
   CARREGAR JOGOS
   ========================================================= */

async function carregarJogos(){

  if(desporto==="futsal"){

    mostrarFutsal();
    return;

  }

  const token =
    ++requestToken;

  const box =
    document.getElementById("gamesList");

  document
    .getElementById("tableContent")
    .classList.add("hidden");

  box.classList.remove("hidden");

  box.innerHTML =
    `<div class="loading">
       <div class="spinner"></div>
       A carregar jogos...
     </div>`;

  let eventos=[];

  if(modoTodos || modoLive){

    const resultados=[];

    const limite=5;

    for(
      let i=0;
      i<ligas.length;
      i+=limite
    ){

      const grupo =
        ligas.slice(i,i+limite);

      const grupoResultados =
        await Promise.all(
          grupo.map(
            x=>buscarJogosLiga(
              x[0],
              diaSelecionado
            )
          )
        );

      grupoResultados.forEach(
        x=>resultados.push(...x)
      );

      if(token!==requestToken){
        return;
      }

    }

    eventos =
      deduplicarEventos(resultados);

  }else{

    eventos =
      await buscarJogosLiga(
        ligaSelecionada,
        diaSelecionado
      );

  }

  if(token!==requestToken){
    return;
  }

  eventosAtuais=eventos;

  if(!eventos.length){

    const fallback =
      FALLBACK[ligaSelecionada] || [];

    if(
      !modoTodos &&
      !modoLive &&
      fallback.length
    ){

      eventos =
        fallback.map(
          x=>criarEventoFallback(
            x[0],
            x[1],
            ligaSelecionada
          )
        );

      eventosAtuais=eventos;

    }

  }

  renderizarJogos(eventos);

}

/* =========================================================
   RENDER JOGOS
   ========================================================= */

function renderizarJogos(eventos){

  const box =
    document.getElementById("gamesList");

  let lista=[...eventos];

  if(modoLive){

    lista =
      lista.filter(isLive);

  }

  if(filtroAtual==="live"){

    lista =
      lista.filter(isLive);

  }

  if(filtroAtual==="proximos"){

    lista =
      lista.filter(
        e=>!isLive(e) && !isFinal(e)
      );

  }

  if(filtroAtual==="final"){

    lista =
      lista.filter(isFinal);

  }

  const q =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(q){

    lista =
      lista.filter(e=>{

        const c =
          getCompetidores(e);

        return c.some(
          x=>
            nomeEquipa(x)
              .toLowerCase()
              .includes(q)
        );

      });

  }

  if(!lista.length){

    box.innerHTML =
      `<div class="empty">
        <div class="emptyIcon">⚽</div>
        <strong>Sem jogos encontrados</strong>
        <div style="margin-top:7px">
          Tenta outra data, competição ou filtro.
        </div>
      </div>`;

    return;

  }

  lista.sort(
    (a,b)=>
      new Date(a.date||0) -
      new Date(b.date||0)
  );

  const grupos = new Map();

  lista.forEach(e=>{

    const liga =
      e.__futzoneLiga ||
      ligaSelecionada;

    if(!grupos.has(liga)){
      grupos.set(liga,[]);
    }

    grupos.get(liga).push(e);

  });

  box.innerHTML="";

  grupos.forEach(
    (items,liga)=>{

      const bloco =
        document.createElement("div");

      bloco.className="leagueBlock";

      const nome =
        ligas.find(x=>x[0]===liga)?.[1] ||
        nomeCompeticao(items[0],liga);

      bloco.innerHTML =
        `<div class="leagueBlockTitle">
          ${escapeHtml(nome)}
        </div>`;

      items.forEach(
        e=>{
          bloco.insertAdjacentHTML(
            "beforeend",
            cartaoJogo(e)
          );
        }
      );

      box.appendChild(bloco);

    }
  );

}

async function buscarTabelaLiga(liga){

  const urls=[

    STANDINGS_API+
    encodeURIComponent(liga)+
    "/standings",

    API+
    encodeURIComponent(liga)+
    "/standings"

  ];

  for(const url of urls){

    const data =
      await fetchAPI(
        url,
        9000,
        120000
      );

    if(data){
      return data;
    }

  }

  return null;

}

function valorStat(stats,names){

  if(!Array.isArray(stats)){
    return "";
  }

  for(const nome of names){

    const s =
      stats.find(
        x=>
          x?.name===nome ||
          x?.abbreviation===nome ||
          x?.shortDisplayName===nome
      );

    if(s){

      return (
        s.value ??
        s.displayValue ??
        ""
      );

    }

  }

  return "";

}

function extrairTabelaESPN(data){

  const resultado=[];

  const grupos=[];

  if(Array.isArray(data?.children)){
    grupos.push(...data.children);
  }

  grupos.push(data);

  for(const grupo of grupos){

    const entries =

      grupo?.standings?.entries ||
      grupo?.entries ||
      grupo?.standings?.results ||
      [];

    if(!Array.isArray(entries)){
      continue;
    }

    entries.forEach(entry=>{

      const team =
        entry?.team ||
        entry?.competitor ||
        {};

      const stats =
        entry?.stats ||
        entry?.statistics ||
        [];

      const nome =
        team.displayName ||
        team.fullName ||
        team.shortDisplayName ||
        team.name ||
        "";

      if(!nome) return;

      const pos =
        valorStat(
          stats,
          ["rank","position","POS"]
        );

      const jogados =
        valorStat(
          stats,
          [
            "gamesPlayed",
            "GP",
            "played",
            "games"
          ]
        );

      const vitorias =
        valorStat(
          stats,
          [
            "wins",
            "W"
          ]
        );

      const empates =
        valorStat(
          stats,
          [
            "ties",
            "draws",
            "D",
            "T"
          ]
        );

      const derrotas =
        valorStat(
          stats,
          [
            "losses",
            "L"
          ]
        );

      const gf =
        valorStat(
          stats,
          [
            "goalsFor",
            "pointsFor",
            "GF",
            "PF"
          ]
        );

      const ga =
        valorStat(
          stats,
          [
            "goalsAgainst",
            "pointsAgainst",
            "GA",
            "PA"
          ]
        );

      const gd =
        valorStat(
          stats,
          [
            "goalDifference",
            "pointDifferential",
            "GD",
            "PD"
          ]
        );

      const pontos =
        valorStat(
          stats,
          [
            "points",
            "PTS"
          ]
        );

      resultado.push({

        id:
          team.id ||
          team.uid ||
          "",

        nome,

        logo:
          team.logo ||
          team.logos?.[0]?.href ||
          team.logos?.[0]?.url ||
          "",

        pos:
          pos || resultado.length+1,

        jogados,

        vitorias,

        empates,

        derrotas,

        gf,

        ga,

        gd,

        pontos

      });

    });

  }

  const mapa = new Map();

  resultado.forEach(x=>{

    const key =
      x.id ||
      x.nome;

    if(!mapa.has(key)){
      mapa.set(key,x);
    }

  });

  return [...mapa.values()];

}

  async function fzBuscarCalendario(liga){

    const hoje = new Date();

    const inicio = new Date(hoje);
    inicio.setDate(inicio.getDate() - 90);

    const fim = new Date(hoje);
    fim.setDate(fim.getDate() + 150);

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      fzDataAPI(inicio) +
      "-" +
      fzDataAPI(fim) +
      "&limit=1000";

    try{

      await fetchAPI(
       url,
       15000,
       60000
  
      );
      
      let eventos = data?.events || [];

      if(eventos.length){
        return eventos;
      }

    }catch(e){
      console.warn("FUTZONE calendário:",e);
    }


    /* fallback por blocos */

    const resultado = [];

    let cursor = new Date(inicio);

    while(cursor <= fim){

      const blocoInicio = new Date(cursor);

      const blocoFim = new Date(cursor);
      blocoFim.setDate(blocoFim.getDate()+13);

      if(blocoFim > fim){
        blocoFim.setTime(fim.getTime());
      }

      try{

        const urlBloco =
          API +
          encodeURIComponent(liga) +
          "/scoreboard?dates=" +
          fzDataAPI(blocoInicio) +
          "-" +
          fzDataAPI(blocoFim) +
          "&limit=100";

        await fetchAPI(
         url,
         15000,
         60000
         );

        if(data?.events){
          resultado.push(...data.events);
        }

      }catch(e){
        console.warn(e);
      }

      cursor = new Date(blocoFim);
      cursor.setDate(cursor.getDate()+1);
    }

    return resultado;
  }

    if(jogosProximos.length){

        .sort((a,b)=>new Date(a.date)-new Date(b.date))
        .slice(0,30)
        .forEach(e=>{
          html += fzMiniJogo(e);
        });

    }else{

      html += `
        <div style="padding:15px;color:#64748B;font-size:12px">
          Sem próximos jogos disponíveis.
        </div>
      `;

    }

    html += `</div>`;


    /* PLANTEL */

    html += `
      <div class="fz-extra-section">

        <div class="fz-extra-title">
          👥 PLANTEL — JOGADORES
        </div>
    `;

    if(plantel.length){

      plantel.forEach(p=>{

        const pid = p.id || "";
        const pname =
          p.fullName ||
          p.displayName ||
          p.shortName ||
          "Jogador";

        const pos =
          p.position?.displayName ||
          p.position?.name ||
          p.position ||
          "";

        const numero =
          p.jersey ||
          p.number ||
          "";

        const foto =
          p.headshot?.href ||
          p.headshot ||
          p.photo ||
          "";

        html += `
          <div class="fz-player"
               onclick="fzAbrirJogador(
                 '${fzEsc(pid)}',
                 '${fzEsc(pname)}',
                 '${fzEsc(nome || "")}',
                 '${fzEsc(foto)}',
                 '${fzEsc(liga)}'
               )">

            <div class="fz-player-avatar">

              ${
                foto
                ? `<img src="${fzEsc(foto)}" alt="">`
                : `⚽`
              }

            </div>

            <div>

              <div class="fz-player-name">
                ${fzEsc(pname)}
              </div>

              <div class="fz-player-info">
                ${numero ? "N.º " + fzEsc(numero) + " • " : ""}
                ${fzEsc(pos || "Jogador")}
              </div>

            </div>

          </div>
        `;

      });

    }else{

      html += `
        <div style="padding:15px;color:#64748B;font-size:12px">
          O plantel desta equipa não está disponível nesta competição.
        </div>
      `;

    }

    html += `</div>`;

    content.innerHTML = html;
  };


  /* ---------- EXTRAIR JOGADORES ---------- */

  function fzExtrairJogadores(data){

    const encontrados = [];
    const ids = new Set();


    function adicionar(p){

      if(!p || typeof p !== "object") return;

      const id =
        p.id ||
        p.athlete?.id;

      const nome =
        p.fullName ||
        p.displayName ||
        p.shortName ||
        p.athlete?.fullName ||
        p.athlete?.displayName;

      if(!id || !nome) return;

      if(ids.has(String(id))) return;

      ids.add(String(id));

      encontrados.push(
        p.athlete || p
      );
    }


    function procurar(node){

      if(!node) return;

      if(Array.isArray(node)){

        node.forEach(procurar);

        return;
      }


      if(typeof node !== "object") return;


      if(
        node.id &&
        (
          node.fullName ||
          node.displayName ||
          node.shortName
        )
      ){

        adicionar(node);

      }


      if(node.athletes){
        procurar(node.athletes);
      }

      if(node.items){
        procurar(node.items);
      }

      if(node.entries){
        procurar(node.entries);
      }

      if(node.roster){
        procurar(node.roster);
      }

      if(node.groups){
        procurar(node.groups);
      }

    }


    procurar(
      data?.athletes ||
      data?.roster ||
      data
    );

    return encontrados;
  }


  /* =========================================================
     JOGADOR
     ========================================================= */

  window.fzAbrirJogador = async function(
    id,
    nome,
    equipa,
    foto,
    liga
  ){

    const overlay = document.getElementById("overlay");
    const title = document.getElementById("overlayTitle");
    const content = document.getElementById("overlayContent");

    overlay.classList.add("open");

    title.textContent = "Jogador";

    content.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        A carregar jogador...
      </div>
    `;


    let atleta = null;


    try{

      const url =
        API +
        encodeURIComponent(liga || ligaSelecionada) +
        "/athletes/" +
        encodeURIComponent(id);

      await fetchAPI(
      url,
      15000,
      60000
      );

      atleta =
        data?.athlete ||
        data ||
        null;

    }catch(e){

      console.warn("FUTZONE jogador",e);

    }


    atleta = atleta || {};


    const nomeFinal =
      atleta.fullName ||
      atleta.displayName ||
      atleta.shortName ||
      nome ||
      "Jogador";


    const fotoFinal =
      atleta.headshot?.href ||
      atleta.headshot ||
      foto ||
      "";


    const pos =
      atleta.position?.displayName ||
      atleta.position?.name ||
      atleta.position ||
      "";


    const numero =
      atleta.jersey ||
      atleta.number ||
      "";


    const nacionalidade =
      atleta.nationality?.displayName ||
      atleta.nationality?.name ||
      atleta.nationality ||
      "";


    const nascimento =
      atleta.dateOfBirth ||
      atleta.birthDate ||
      "";


    const altura =
      atleta.height ||
      atleta.displayHeight ||
      "";


    const peso =
      atleta.weight ||
      atleta.displayWeight ||
      "";


    content.innerHTML = `

      <div class="fz-extra-section">

        <div class="fz-player-detail">

          ${
            fotoFinal
            ? `<img
                 class="fz-player-detail-photo"
                 src="${fzEsc(fotoFinal)}"
                 alt=""
               >`
            : `<div
                 class="fz-player-detail-photo"
                 style="
                   display:flex;
                   align-items:center;
                   justify-content:center;
                   font-size:40px;
                 "
               >⚽</div>`
          }

          <h2>${fzEsc(nomeFinal)}</h2>

          <p>
            ${fzEsc(equipa || "")}
          </p>

          ${
            pos
            ? `<p>📍 Posição: ${fzEsc(pos)}</p>`
            : ""
          }

          ${
            numero
            ? `<p>🔢 Número: ${fzEsc(numero)}</p>`
            : ""
          }

          ${
            nacionalidade
            ? `<p>🌍 Nacionalidade: ${fzEsc(nacionalidade)}</p>`
            : ""
          }

          ${
            nascimento
            ? `<p>🎂 Nascimento: ${fzEsc(nascimento)}</p>`
            : ""
          }

          ${
            altura
            ? `<p>📏 Altura: ${fzEsc(altura)}</p>`
            : ""
          }

          ${
            peso
            ? `<p>⚖️ Peso: ${fzEsc(peso)}</p>`
            : ""
          }

        </div>

      </div>

    `;
  };


  /* =========================================================
     EQUIPAS CLICÁVEIS
     ========================================================= */

  function fzTornarEquipasClicaveis(){

    document
      .querySelectorAll(".team")
      .forEach(el=>{

        if(el.dataset.fzReady) return;

        el.dataset.fzReady = "1";

        el.classList.add("fz-team-click");

      });

  }


  /* ---------- BOTÃO JORNADAS AO INICIAR ---------- */

  setTimeout(
    fzAdicionarBotaoJornadas,
    300
  );


  /* ---------- OBSERVADOR ---------- */

  const observer =
    new MutationObserver(()=>{

      fzAdicionarBotaoJornadas();
      fzTornarEquipasClicaveis();

    });


  const alvo =
    document.getElementById("mainContent");

  if(alvo){

    observer.observe(
      alvo,
      {
        childList:true,
        subtree:true
      }
    );

  }


})();
</script>
