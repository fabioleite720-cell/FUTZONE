<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --black:#03060B;
  --card:#09111C;
  --card2:#0D1724;
  --text:#F4F7FB;
  --muted:#9DAABB;
  --red:#FF4054;
  --yellow:#FFD43B;
  --green:#20D68A;
  --wine:#67152A;
  --border:rgba(255,255,255,.09);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--black);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:82px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(3,6,11,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.headerInner{
  max-width:900px;
  margin:auto;
  padding:14px 15px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--blue2);
}

.subtitle{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.4px;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:7px;
}

.iconBtn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:white;
  display:grid;
  place-items:center;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.sectionTitle{
  font-size:18px;
  font-weight:900;
  margin:16px 2px 10px;
}

.leagues{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 7px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.leagueBtn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:#dfe8f5;
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:800;
}

.leagueBtn.active{
  background:var(--blue);
  border-color:var(--blue2);
  color:white;
}

.controls{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin:10px 0;
}

.dateInput{
  width:100%;
  min-height:44px;
  background:var(--card);
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
}

.primaryBtn{
  min-height:44px;
  border:0;
  border-radius:12px;
  padding:0 14px;
  background:var(--blue);
  color:white;
  font-weight:900;
}

.primaryBtn:active,
.leagueBtn:active,
.iconBtn:active{
  transform:scale(.98);
}

.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:8px 0 12px;
}

.actionBtn{
  min-height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:white;
  font-weight:900;
}

.actionBtn.live{
  background:linear-gradient(135deg,var(--red),#a50e22);
  border-color:rgba(255,255,255,.14);
}

.games{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.game{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
}

.gameTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  border-bottom:1px solid var(--border);
}

.competition{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.status{
  font-size:10px;
  font-weight:900;
  color:var(--green);
}

.gameBody{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  padding:12px 10px;
}

.team{
  min-width:0;
  text-align:center;
}

.teamName{
  font-size:13px;
  font-weight:900;
  line-height:1.2;
}

.teamLogo{
  width:38px;
  height:38px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px;
}

.score{
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.time{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.gameBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  border-top:1px solid var(--border);
}

.smallBtn{
  border:0;
  background:transparent;
  color:#b9d8ff;
  font-size:11px;
  font-weight:900;
  padding:5px;
}

.starBtn{
  border:0;
  background:transparent;
  color:var(--yellow);
  font-size:21px;
}

.loading{
  padding:25px 10px;
  text-align:center;
  color:var(--muted);
}

.empty{
  padding:28px 14px;
  text-align:center;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  color:var(--muted);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:var(--black);
  overflow-y:auto;
}

.overlay.open{
  display:block;
}

.detailHeader{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
}

.detailHeadInner{
  max-width:900px;
  margin:auto;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
}

.backBtn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:white;
}

.detailTitle{
  font-size:15px;
  font-weight:900;
}

.detailContent{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.matchHero{
  background:linear-gradient(145deg,#0d1d31,#07101b);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
}

.matchTeams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.matchTeam{
  text-align:center;
}

.matchTeam img{
  width:58px;
  height:58px;
  object-fit:contain;
  margin-bottom:7px;
}

.matchTeamName{
  font-size:14px;
  font-weight:900;
}

.bigScore{
  font-size:27px;
  font-weight:900;
}

.matchMeta{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}

.detailTabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin:12px 0;
  scrollbar-width:none;
}

.detailTabs::-webkit-scrollbar{
  display:none;
}

.detailTab{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  font-size:11px;
  font-weight:900;
}

.detailTab.active{
  background:var(--blue);
  color:white;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
  margin-bottom:10px;
}

.panelTitle{
  font-size:14px;
  font-weight:900;
  margin-bottom:10px;
}

.statRow{
  display:grid;
  grid-template-columns:1fr 54px 1fr;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.statRow:last-child{
  border-bottom:0;
}

.statValue{
  font-weight:900;
  text-align:center;
}

.statName{
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

.statLeft{
  text-align:right;
  font-weight:900;
}

.statRight{
  text-align:left;
  font-weight:900;
}

.event{
  display:grid;
  grid-template-columns:52px 1fr 52px;
  gap:7px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.event:last-child{
  border-bottom:0;
}

.eventTime{
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.eventText{
  font-size:12px;
  font-weight:800;
}

.eventIcon{
  text-align:center;
  font-size:17px;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  background:rgba(3,6,11,.98);
  border-top:1px solid var(--border);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.nav button{
  min-height:52px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
}

.nav button.active{
  background:var(--blue);
  color:white;
}

.searchBox{
  width:100%;
  min-height:42px;
  margin:8px 0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  padding:0 12px;
}

.teamHeader{
  display:flex;
  align-items:center;
  gap:12px;
}

.teamHeader img{
  width:65px;
  height:65px;
  object-fit:contain;
}

.teamHeaderName{
  font-size:20px;
  font-weight:900;
}

.playerCard{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.playerCard:last-child{
  border-bottom:0;
}

.playerPhoto{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#182331;
}

.playerName{
  font-size:13px;
  font-weight:900;
}

.playerMeta{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.historyRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.historyRow:last-child{
  border-bottom:0;
}

.newsItem{
  display:block;
  text-decoration:none;
  color:white;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.newsItem:last-child{
  border-bottom:0;
}

.newsTitle{
  font-size:13px;
  font-weight:900;
  line-height:1.3;
}

.newsMeta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:470px;
}

th,td{
  padding:9px 7px;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:11px;
  text-align:center;
}

th{
  color:var(--muted);
  font-size:10px;
}

td:nth-child(2),
th:nth-child(2){
  text-align:left;
}

.clickable{
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  z-index:300;
  background:#111d2b;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  font-size:12px;
  font-weight:800;
  display:none;
}

.toast.show{
  display:block;
}

@media(max-width:430px){
  main,
  .detailContent{
    padding-left:9px;
    padding-right:9px;
  }

  .brand{
    font-size:25px;
  }

  .teamName{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="headerInner">
    <div>
      <div class="brand">FUT<span>ZONE</span></div>
      <div class="subtitle">FUTEBOL EM DIRETO</div>
    </div>

    <div class="headerActions">
      <button class="iconBtn" onclick="refreshCurrent()">↻</button>
    </div>
  </div>
</header>

<main id="mainContent">

  <div class="sectionTitle">Competições</div>

  <div class="leagues" id="leagueList"></div>

  <div class="controls">
    <input id="dateInput" class="dateInput" type="date">
    <button class="primaryBtn" onclick="loadSelectedDay()">Atualizar</button>
  </div>

  <div class="actionRow">
    <button class="actionBtn live" onclick="showLiveGames()">🔴 Jogos ao vivo hoje</button>
    <button class="actionBtn" onclick="showAllDayGames()">📅 Todos os jogos deste dia</button>
  </div>

  <div id="pageContent">
    <div class="loading">A carregar jogos...</div>
  </div>

</main>

</div>

<div id="detailOverlay" class="overlay">
  <div class="detailHeader">
    <div class="detailHeadInner">
      <button class="backBtn" onclick="closeDetail()">←</button>
      <div class="detailTitle" id="detailTitle">Detalhes do jogo</div>
    </div>
  </div>

  <div class="detailContent" id="detailContent"></div>
</div>

<div id="toast" class="toast"></div>

<nav class="nav">
  <button id="navNoticias" onclick="showNews()">📰<br>Notícias</button>
  <button id="navTabelas" onclick="showTables()">🏆<br>Tabelas</button>
  <button id="navFav" onclick="showFavorites()">⭐<br>Favoritos</button>
</nav>
<script>
const API_BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer";

const LEAGUES = [
  {id:"por.1",name:"🇵🇹 Liga Portugal"},
  {id:"eng.1",name:"🇬🇧 Premier League"},
  {id:"esp.1",name:"🇪🇸 LaLiga"},
  {id:"ita.1",name:"🇮🇹 Serie A"},
  {id:"ger.1",name:"🇩🇪 Bundesliga"},
  {id:"fra.1",name:"🇫🇷 Ligue 1"},
  {id:"ned.1",name:"🇳🇱 Eredivisie"},
  {id:"tur.1",name:"🇹🇷 Liga Turca"},
  {id:"ksa.1",name:"🇸🇦 Liga Saudita"},
  {id:"usa.1",name:"🇺🇸 MLS"},
  {id:"eng.2",name:"🏴 Championship"},
  {id:"esp.2",name:"🇪🇸 LaLiga 2"},
  {id:"fra.2",name:"🇫🇷 Ligue 2"},
  {id:"ita.2",name:"🇮🇹 Serie B"},
  {id:"uefa.champions",name:"🇪🇺 Champions League"},
  {id:"uefa.europa",name:"🇪🇺 Europa League"},
  {id:"uefa.europa.conf",name:"🇪🇺 Liga Conferência"}
];

let currentLeague = "por.1";
let currentDate = "";
let currentGames = [];
let currentView = "games";
let currentGame = null;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("pt-PT",{
    weekday:"long",
    day:"2-digit",
    month:"long"
  });
}

function toast(msg){
  const t = $("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.fzToastTimer);
  window.fzToastTimer = setTimeout(
    ()=>t.classList.remove("show"),
    2200
  );
}

function leagueName(id){
  return LEAGUES.find(x=>x.id===id)?.name || id;
}

function teamData(competitor){
  if(!competitor) return {
    id:"",
    name:"Equipa",
    logo:"",
    shortName:"Equipa"
  };

  return {
    id:competitor.id || competitor.team?.id || "",
    name:
      competitor.team?.displayName ||
      competitor.team?.name ||
      competitor.displayName ||
      competitor.name ||
      "Equipa",
    shortName:
      competitor.team?.shortDisplayName ||
      competitor.team?.abbreviation ||
      competitor.shortDisplayName ||
      competitor.abbreviation ||
      competitor.displayName ||
      competitor.name ||
      "Equipa",
    logo:
      competitor.team?.logo ||
      competitor.team?.logos?.[0]?.href ||
      competitor.logo ||
      competitor.logos?.[0]?.href ||
      ""
  };
}

function gameData(event, league){
  const comp =
    event.competitions?.[0] ||
    event.competition ||
    {};

  const competitors = comp.competitors || [];
  const home = teamData(
    competitors.find(x=>x.homeAway==="home") || competitors[0]
  );
  const away = teamData(
    competitors.find(x=>x.homeAway==="away") || competitors[1]
  );

  const status = event.status || comp.status || {};
  const type = status.type || {};

  return {
    id:String(event.id || comp.id || ""),
    league,
    leagueName:leagueName(league),
    name:event.name || `${away.name} - ${home.name}`,
    home,
    away,
    date:event.date || comp.date || "",
    statusType:type.name || "",
    statusText:type.shortDetail || type.detail || type.description || "",
    state:type.state || "",
    period:type.period || 0,
    clock:type.clock || "",
    homeScore:
      home.id
        ? (competitors.find(x=>x.team?.id==home.id)?.score ?? "0")
        : "0",
    awayScore:
      away.id
        ? (competitors.find(x=>x.team?.id==away.id)?.score ?? "0")
        : "0",
    raw:event
  };
}

async function fetchJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}

async function fetchLeagueScoreboard(league,date){
  const url =
    `${API_BASE}/${league}/scoreboard?dates=${date.replaceAll("-","")}`;

  try{
    const data = await fetchJSON(url);
    return (data.events || []).map(e=>gameData(e,league));
  }catch(e){
    console.warn("Erro liga",league,e);
    return [];
  }
}

function renderLeagueButtons(){
  const box = $("leagueList");
  if(!box) return;

  box.innerHTML = LEAGUES.map(l=>`
    <button
      class="leagueBtn ${l.id===currentLeague?"active":""}"
      onclick="selectLeague('${l.id}')"
    >${esc(l.name)}</button>
  `).join("");
}

function selectLeague(id){
  currentLeague = id;
  currentView = "games";
  renderLeagueButtons();
  loadSelectedDay();
}

function gameStatus(g){
  if(g.state==="in") return `<span class="status">🔴 ${esc(g.statusText || "AO VIVO")}</span>`;
  if(g.state==="post") return `<span class="status" style="color:#9DAABB">Finalizado</span>`;
  if(g.state==="pre") return `<span class="status" style="color:#FFD43B">${esc(g.statusText || "Por começar")}</span>`;
  return "";
}

function gameScore(g){
  if(g.state==="pre"){
    const d = new Date(g.date);
    return `
      <div class="score">
        ${d.toLocaleTimeString("pt-PT",{
          hour:"2-digit",
          minute:"2-digit"
        })}
      </div>
    `;
  }

  return `
    <div class="score">
      ${esc(g.homeScore)} - ${esc(g.awayScore)}
    </div>
  `;
}

function renderGame(g){
  const fav = isFavoriteGame(g);

  return `
    <article class="game clickable" onclick="openGame('${esc(g.id)}')">

      <div class="gameTop">
        <div class="competition">${esc(g.leagueName)}</div>
        <div>${gameStatus(g)}</div>
      </div>

      <div class="gameBody">

        <div class="team">
          ${
            g.home.logo
            ? `<img class="teamLogo" src="${esc(g.home.logo)}" alt="">`
            : ""
          }
          <div class="teamName">${esc(g.home.name)}</div>
        </div>

        <div>
          ${gameScore(g)}
          <div class="time">
            ${
              g.state==="in"
              ? esc(g.clock || "")
              : ""
            }
          </div>
        </div>

        <div class="team">
          ${
            g.away.logo
            ? `<img class="teamLogo" src="${esc(g.away.logo)}" alt="">`
            : ""
          }
          <div class="teamName">${esc(g.away.name)}</div>
        </div>

      </div>

      <div class="gameBottom">
        <button
          class="smallBtn"
          onclick="event.stopPropagation();openTeam('${esc(g.home.id)}','${esc(g.home.name)}','${esc(g.home.logo)}')"
        >${esc(g.home.shortName)}</button>

        <button
          class="starBtn"

<script>
function getSummaryCompetitors(data){
  return data?.header?.competitions?.[0]?.competitors ||
         data?.header?.competitors ||
         currentGame?.raw?.competitions?.[0]?.competitors ||
         [];
}

function findCompetitor(data,id){
  return getSummaryCompetitors(data).find(
    c=>String(c.id||c.team?.id||"")===String(id)
  );
}

function getTeamStats(data,teamId){
  const out = {};

  const groups = [
    ...(data?.boxscore?.teams || []),
    ...(data?.leaders || []),
    ...(data?.statistics || [])
  ];

  function walk(value){
    if(!value) return;

    if(Array.isArray(value)){
      value.forEach(walk);
      return;
    }

    if(typeof value!=="object") return;

    const team =
      value.team ||
      value.competitor?.team ||
      value.competitor;

    const id =
      team?.id ||
      value.teamId ||
      value.teamID;

    if(id && String(id)===String(teamId)){
      const stats =
        value.statistics ||
        value.stats ||
        value.teamStatistics ||
        [];

      if(Array.isArray(stats)){
        stats.forEach(s=>{
          const key = String(
            s.name ||
            s.abbreviation ||
            s.displayName ||
            ""
          ).toLowerCase();

          out[key] =
            s.displayValue ??
            s.value ??
            s.displayValue;
        });
      }
    }

    Object.values(value).forEach(walk);
  }

  groups.forEach(walk);

  return out;
}

function statValue(stats,aliases){
  for(const a of aliases){
    const key=String(a).toLowerCase();

    if(stats[key]!==undefined &&
       stats[key]!==null &&
       stats[key]!=="" ){
      return stats[key];
    }
  }

  return "-";
}

function renderMatchStats(data,g){
  const box=$("matchStats");
  if(!box) return;

  const hs=getTeamStats(data,g.home.id);
  const as=getTeamStats(data,g.away.id);

  const rows=[
    ["Posse de bola",
      ["possession","possessionpercentage","possession %"],
      ["possession","possessionpercentage","possession %"]
    ],
    ["Remates",
      ["shots","totalshots","total shots"],
      ["shots","totalshots","total shots"]
    ],
    ["Remates à baliza",
      ["shotsontarget","shots on target","shots_on_target"],
      ["shotsontarget","shots on target","shots_on_target"]
    ],
    ["Cantos",
      ["corners","cornerkicks","corner kicks"],
      ["corners","cornerkicks","corner kicks"]
    ],
    ["Faltas",
      ["fouls","totalfouls"],
      ["fouls","totalfouls"]
    ],
    ["Foras de jogo",
      ["offsides","offside"],
      ["offsides","offside"]
    ],
    ["Cartões amarelos",
      ["yellowcards","yellow cards","yellow"],
      ["yellowcards","yellow cards","yellow"]
    ]
  ];

  let html=`<div class="panelTitle">Estatísticas</div>`;

  let found=false;

  rows.forEach(r=>{
    const left=statValue(hs,r[1]);
    const right=statValue(as,r[2]);

    if(left!=="-" || right!=="-"){
      found=true;

      html+=`
        <div class="statRow">
          <div class="statLeft">${esc(left)}</div>
          <div class="statName">${esc(r[0])}</div>
          <div class="statRight">${esc(right)}</div>
        </div>
      `;
    }
  });

  if(!found){
    html+=`
      <div class="empty">
        Estatísticas detalhadas não disponíveis para este jogo.
      </div>
    `;
  }

  box.innerHTML=html;
}

function extractPlays(data){
  const possible=[
    data?.plays,
    data?.gamepackage?.plays,
    data?.header?.plays,
    data?.competitions?.[0]?.plays
  ];

  for(const p of possible){
    if(Array.isArray(p) && p.length) return p;
  }

  return [];
}

function playText(play){
  const type =
    play?.type?.text ||
    play?.type?.description ||
    play?.type?.displayName ||
    "";

  const text =
    play?.text ||
    play?.description ||
    "";

  return text || type || "";
}

function renderMatchEvents(data,g){
  const box=$("matchEvents");
  if(!box) return;

  const plays=extractPlays(data);

  if(!plays.length){
    box.innerHTML=`
      <div class="panelTitle">Eventos</div>
      <div class="empty">
        Não existem eventos detalhados disponíveis.
      </div>
    `;
    return;
  }

  let html=`<div class="panelTitle">Eventos</div>`;

  plays.forEach(p=>{
    const minute =
      p.clock?.displayValue ||
      p.clock?.value ||
      p.period?.displayValue ||
      "";

    const text=playText(p);

    let icon="⚽";

    const lower=String(text).toLowerCase();

    if(lower.includes("yellow") ||
       lower.includes("amarelo")){
      icon="🟨";
    }else if(lower.includes("red") ||
             lower.includes("vermelho")){
      icon="🟥";
    }else if(lower.includes("substitut") ||
             lower.includes("substitution")){
      icon="🔄";
    }else if(lower.includes("goal") ||
             lower.includes("golo")){
      icon="⚽";
    }

    html+=`
      <div class="event">
        <div class="eventTime">${esc(minute)}</div>
        <div class="eventText">${esc(text || "Evento")}</div>
        <div class="eventIcon">${icon}</div>
      </div>
    `;
  });

  box.innerHTML=html;
}

function getRoster(data,teamId){
  const found=[];

  function walk(value){
    if(!value) return;

    if(Array.isArray(value)){
      value.forEach(walk);
      return;
    }

    if(typeof value!=="object") return;

    const athlete =
      value.athlete ||
      value.player ||
      value.person;

    const team =
      value.team ||
      value.competitor?.team ||
      value.competitor;

    const id =
      team?.id ||
      value.teamId ||
      value.teamID;

    if(
      athlete &&
      id &&
      String(id)===String(teamId)
    ){
      found.push({
        athlete,
        starter:
          value.starter === true ||
          value.starter === 1 ||
          value.status?.type?.name==="starter",
        position:
          value.position?.displayName ||
          value.position?.name ||
          "",
        jersey:
          value.jersey ||
          athlete.jersey ||
          ""
      });
    }

    Object.values(value).forEach(walk);
  }

  walk(data);

  const unique=[];
  const ids=new Set();

  found.forEach(x=>{
    const id=String(
      x.athlete.id ||
      x.athlete.uid ||
      x.athlete.displayName ||
      ""
    );

    if(id && !ids.has(id)){
      ids.add(id);
      unique.push(x);
    }
  });

  return unique;
}

function athleteData(a){
  return {
    id:a?.id || a?.uid || "",
    name:
      a?.displayName ||
      a?.fullName ||
      a?.shortName ||
      "Jogador",
    photo:
      a?.headshot?.href ||
      a?.headshot?.url ||
      a?.photo ||
      "",
    position:
      a?.position?.displayName ||
      a?.position?.name ||
      "",
    jersey:a?.jersey || ""
  };
}

function playerButton(player){
  const p=athleteData(player);

  return `
    <div
      class="playerCard clickable"
      onclick="openPlayer('${esc(p.id)}','${esc(p.name)}','${esc(p.photo)}')"
    >
      ${
        p.photo
        ? `<img class="playerPhoto" src="${esc(p.photo)}" alt="">`
        : `<div class="playerPhoto"></div>`
      }

      <div>
        <div class="playerName">${esc(p.name)}</div>
        <div class="playerMeta">
          ${esc(p.position || "")}
          ${p.jersey ? ` · Nº ${esc(p.jersey)}` : ""}
        </div>
      </div>
    </div>
  `;
}

function renderTeamXI(team,players){
  const starters=players.filter(x=>x.starter);

  const list=
    starters.length
    ? starters
    : players.slice(0,11);

  return `
    <div class="panelTitle">${esc(team.name)}</div>

    ${
      list.length
      ? list.map(x=>playerButton(x.athlete)).join("")
      : `<div class="empty">Onze inicial não disponível.</div>`
    }
  `;
}

function renderMatchXI(data,g){
  const box=$("matchXI");
  if(!box) return;

  const homePlayers=getRoster(data,g.home.id);
  const awayPlayers=getRoster(data,g.away.id);

  const homeStarters=homePlayers.filter(x=>x.starter);
  const awayStarters=awayPlayers.filter(x=>x.starter);

  if(
    !homePlayers.length &&
    !awayPlayers.length
  ){
    box.innerHTML=`
      <div class="panelTitle">Onze inicial</div>
      <div class="empty">
        Onze inicial não disponível para este jogo.
      </div>
    `;
    return;
  }

  box.innerHTML=`
    <div class="panelTitle">Onze inicial</div>

    <div style="
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    ">

      <div class="panel" style="margin:0">
        ${renderTeamXI(
          g.home,
          homeStarters.length
            ? homeStarters
            : homePlayers
        )}
      </div>

      <div class="panel" style="margin:0">
        ${renderTeamXI(
          g.away,
          awayStarters.length
            ? awayStarters
            : awayPlayers
        )}
      </div>

    </div>
  `;
}

     <script>
async function loadPlayerHistory(id){
  const urls=[
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}/seasons`,
    `https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/${encodeURIComponent(id)}`,
    `https://sports.core.api.espn.com/v2/sports/soccer/athletes/${encodeURIComponent(id)}`
  ];

  const history=[];

  for(const url of urls){
    try{
      const data=await fetchJSON(url);

      function walk(value){
        if(!value) return;

        if(Array.isArray(value)){
          value.forEach(walk);
          return;
        }

        if(typeof value!=="object") return;

        const team =
          value.team ||
          value.club ||
          value.teamData ||
          value.clubData;

        if(team){
          const teamName =
            team.displayName ||
            team.name ||
            team.shortDisplayName;

          if(teamName){
            const season =
              value.season?.displayName ||
              value.season?.name ||
              value.season?.year ||
              value.year ||
              "";

            const competition =
              value.league?.name ||
              value.competition?.name ||
              value.league?.displayName ||
              "";

            history.push({
              team:teamName,
              season:String(season || ""),
              competition:String(competition || "")
            });
          }
        }

        Object.values(value).forEach(walk);
      }

      walk(data);

    }catch(e){}
  }

  const unique=[];
  const seen=new Set();

  history.forEach(h=>{
    const key=
      `${h.team}|${h.season}|${h.competition}`.toLowerCase();

    if(!seen.has(key)){
      seen.add(key);
      unique.push(h);
    }
  });

  return unique;
}

const FAV_KEY="futzone_favorite_games_v2";

function getFavs(){
  try{
    return JSON.parse(
      localStorage.getItem(FAV_KEY) || "[]"
    );
  }catch(e){
    return [];
  }
}

function saveFavs(list){
  localStorage.setItem(
    FAV_KEY,
    JSON.stringify(list)
  );
}

function isFavoriteGame(game){
  if(!game) return false;

  return getFavs().some(
    x=>String(x.id)===String(game.id)
  );
}

function toggleFavorite(id){
  const game=currentGames.find(
    x=>String(x.id)===String(id)
  );

  if(!game) return;

  let favs=getFavs();

  if(favs.some(x=>String(x.id)===String(id))){
    favs=favs.filter(
      x=>String(x.id)!==String(id)
    );

    toast("Removido dos favoritos.");
  }else{
    favs.push({
      id:game.id,
      league:game.league,
      leagueName:game.leagueName,
      name:game.name,
      date:game.date,
      home:game.home,
      away:game.away,
      homeScore:game.homeScore,
      awayScore:game.awayScore,
      state:game.state,
      statusText:game.statusText
    });

    toast("Adicionado aos favoritos.");
  }

  saveFavs(favs);

  if(currentView==="favorites"){
    showFavorites();
  }else{
    renderGames(
      currentGames,
      currentView==="all"
        ? `Todos os jogos deste dia · ${formatDate(currentDate)}`
        : currentView==="live"
          ? "🔴 Jogos ao vivo hoje"
          : `Jogos do dia · ${formatDate(currentDate)}`
    );
  }

  if(currentGame){
    openGame(currentGame.id);
  }
}

function toggleFavoriteCurrentGame(){
  if(!currentGame) return;

  toggleFavorite(currentGame.id);
}

function showFavorites(){
  currentView="favorites";
  setNav("navFav");

  const favs=getFavs();

  if(!favs.length){
    $("pageContent").innerHTML=`
      <div class="sectionTitle">⭐ Favoritos</div>

      <div class="empty">
        Ainda não tens jogos favoritos.
        <br><br>
        Toca na estrela ⭐ de um jogo para o guardar.
      </div>
    `;

    return;
  }

  currentGames=favs;

  $("pageContent").innerHTML=`
    <div class="sectionTitle">⭐ Favoritos</div>

    <div class="games">
      ${favs.map(renderGame).join("")}
    </div>
  `;
}

  const favs=getFavs().filter(

}

const NEWS_FEEDS=[
  {
    source:"A BOLA",
    url:
      "https://news.google.com/rss/search?q=site%3Aabola.pt%20futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150"
  },
  {

    url:

  },
  {
    source:"O JOGO",
    url:
      "https://news.google.com/rss/search?q=site%3Aojogo.pt%20futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150"
  },
  {
    source:"RTP Desporto",
    url:
      "https://news.google.com/rss/search?q=site%3Artp.pt%20desporto%20futebol&hl=pt-PT&gl=PT&ceid=PT%3Apt-150"
  }
];

async function fetchNewsFeed(feed){
  const api=
    "https://api.rss2json.com/v1/api.json?rss_url="+
    encodeURIComponent(feed.url);

  try{
    const data=await fetchJSON(api);

    return (data.items || []).map(item=>({
      title:item.title || "",
      link:item.link || "",
      date:item.pubDate || "",
      source:feed.source
    }));

  }catch(e){
    return [];
  }
}

async function loadNews(){
  const results=await Promise.all(
    NEWS_FEEDS.map(fetchNewsFeed)
  );

  const all=results.flat();

  const unique=[];
  const seen=new Set();

  all.forEach(n=>{
    const key=(n.link || n.title).toLowerCase();

    if(!seen.has(key)){
      seen.add(key);
      unique.push(n);
    }
  });

  unique.sort(
    (a,b)=>
      new Date(b.date||0)-new Date(a.date||0)
  );

  return unique.slice(0,30);
}

  currentView="news";

  const news=await loadNews();

      <div class="empty">
        Não foi possível carregar as notícias neste momento.

  $("pageContent").innerHTML=`

    <div class="panel">
      ${news.map(n=>`
        <a
          class="newsItem"
          href="${esc(n.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="newsTitle">
            ${esc(n.title)}
          </div>

          <div class="newsMeta">
            ${esc(n.source)}
            ${n.date
              ? " · "+esc(
                  new Date(n.date).toLocaleString(

                    {

                    }
                  )
                )
              : ""}

        </a>
      `).join("")}
    </div>
  `;

function findStandStat(entry,aliases){
  const stats=entry?.stats || [];

  const s=stats.find(x=>{
    const values=[
      x.name,
      x.abbreviation,
      x.displayName
    ]
    .filter(Boolean)
    .map(
      v=>String(v).toLowerCase()
    );

    return aliases.some(
      a=>values.includes(
        String(a).toLowerCase()
      )
    );
  });

  return s?.displayValue ??
         s?.value ??
         "-";
}

  currentView="tables";
  setNav("navTabelas");

  $("pageContent").innerHTML=`

    </div>
  `;

  await loadTables(currentLeague);

async function loadTables(league){
  try{
    const url=
      `https://site.api.espn.com/apis/v2/sports/soccer/${league}/standings`;

    const data=await fetchJSON(url);

    let entries=[];

    if(Array.isArray(data?.children)){
      data.children.forEach(child=>{
        if(Array.isArray(child?.standings?.entries)){
          entries.push(
            ...child.standings.entries
          );
        }
      });
    }

    if(!entries.length &&
       Array.isArray(data?.standings?.entries)){
      entries=data.standings.entries;
    }

    if(!entries.length){
      $("pageContent").innerHTML=`
        <div class="sectionTitle">
          🏆 ${esc(leagueName(league))}
        </div>

        <div class="empty">
          Classificação não disponível.
        </div>
      `;

      return;
    }

    $("pageContent").innerHTML=`
      <div class="sectionTitle">
        🏆 ${esc(leagueName(league))}
      </div>

      <div class="leagues">
        ${LEAGUES.map(l=>`
          <button
            class="leagueBtn ${l.id===league?"active":""}"
            onclick="loadTables('${l.id}')"
          >${esc(l.name)}</button>
        `).join("")}
      </div>

      <div class="panel">
        <div class="tableWrap">

          <table>

            <thead>
              <tr>
                <th>#</th>
                <th>Clube</th>
                <th>J</th>
                <th>V</th>
                <th>E</th>
                <th>D</th>
                <th>Pts</th>
              </tr>
            </thead>

            <tbody>
              ${entries.map((entry,index)=>{
                const team=entry.team || {};

                const name=
                  team.displayName ||
                  team.name ||
                  entry.name ||
                  "Clube";

                const logo=
                  team.logos?.[0]?.href ||
                  team.logo ||
                  "";

                const teamId=
                  team.id ||
                  entry.teamId ||
                  "";

                const gp=findStandStat(
                  entry,
                  ["gamesplayed","gp","games"]
                );

                const w=findStandStat(
                  entry,
                  ["wins","w"]
                );

                const d=findStandStat(
                  entry,
                  ["ties","draws","d"]
                );

                const l=findStandStat(
                  entry,
                  ["losses","l"]
                );

                const pts=findStandStat(
                  entry,
                  ["points","pts"]
                );

                return `
                  <tr
                    class="clickable"
                    onclick="openTeam('${esc(teamId)}','${esc(name)}','${esc(logo)}')"
                  >
                    <td>${index+1}</td>

                    <td>
                      <div style="
                        display:flex;
                        align-items:center;
                        gap:7px;
                      ">
                        ${
                          logo
                          ? `<img
                              src="${esc(logo)}"
                              style="
                                width:25px;
                                height:25px;
                                object-fit:contain;
                              "
                            >`
                          : ""
                        }

                        <span>${esc(name)}</span>
                      </div>
                    </td>

                    <td>${esc(gp)}</td>
                    <td>${esc(w)}</td>
                    <td>${esc(d)}</td>
                    <td>${esc(l)}</td>
                    <td><strong>${esc(pts)}</strong></td>
                  </tr>
                `;
              }).join("")}
            </tbody>

          </table>

        </div>
      </div>
    `;

  }catch(e){

    console.warn("Tabelas:",e);

    $("pageContent").innerHTML=`
      <div class="sectionTitle">
        🏆 ${esc(leagueName(league))}
      </div>

      <div class="empty">
        Não foi possível carregar a classificação.
      </div>
    `;
  }
}
