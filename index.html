<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050b16;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:82px
}

header{
background:#071326;
padding:18px 15px;
text-align:center;
border-bottom:1px solid #17243a
}

header h1{margin:0;font-size:30px}
header p{margin:5px 0 0;color:#9eabc0;font-size:14px}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:12px
}

.loading,.empty{
text-align:center;
padding:35px 10px;
color:#9eabc0
}

/* LIGAS */
.seletor-ligas{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-bottom:15px
}

.liga-btn{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:12px 7px;
color:#fff;
text-align:center;
font-size:13px;
font-weight:bold;
cursor:pointer
}

.liga-btn.active{
background:#0d1b30;
border-color:#3c6da8
}

.liga-icon{
font-size:23px;
display:block;
margin-bottom:5px
}

.liga{margin-bottom:18px}

.liga-title{
background:#0d1b30;
padding:11px 12px;
border-radius:11px 11px 0 0;
font-size:16px;
font-weight:bold;
border-bottom:1px solid #1b2a42
}

/* JOGOS */
.game{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:12px;
margin-top:8px;
cursor:pointer
}

.game:active{transform:scale(.985)}

.game-top{
display:flex;
justify-content:space-between;
align-items:center;
font-size:11px;
color:#8998ad;
margin-bottom:10px
}

.live{color:#ff4d4d;font-weight:bold}

.teams{
display:grid;
grid-template-columns:1fr 65px 1fr;
align-items:center;
gap:6px
}

.team{text-align:center;min-width:0}

.team img{
width:42px;
height:42px;
object-fit:contain;
display:block;
margin:0 auto 6px
}

.team-name{
font-size:14px;
font-weight:bold;
line-height:18px;
word-break:break-word
}

.score{
font-size:23px;
font-weight:bold;
text-align:center
}

.status{
font-size:10px;
text-align:center;
color:#7ed957;
margin-top:5px
}

.favorite{text-align:right;margin-top:6px}

.favorite button{
background:none;
border:0;
color:#ffd400;
font-size:22px;
padding:0 2px;
cursor:pointer
}

/* MENU */
.bottom-nav{
position:fixed;
z-index:9999;
left:0;
right:0;
bottom:0;
height:70px;
background:#071326;
border-top:1px solid #17243a;
display:flex
}

.bottom-nav button{
flex:1;
border:0;
background:none;
color:#8795aa;
font-size:12px;
cursor:pointer
}

.bottom-nav button.active{color:#fff}

/* DETALHES */
#detalhes{
display:none;
position:fixed;
z-index:10000;
inset:0;
background:#050b16;
overflow:auto
}

.detalhes-box{
max-width:700px;
margin:auto;
padding:12px 12px 90px
}

.voltar{
background:#0d1b30;
border:1px solid #1b2a42;
color:#fff;
border-radius:10px;
padding:11px 15px;
font-size:14px;
margin-bottom:12px;
cursor:pointer
}

.detalhes-header{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px 10px;
text-align:center
}

.detalhes-equipas{
display:grid;
grid-template-columns:1fr 90px 1fr;
align-items:center;
gap:5px
}

.detalhes-equipa img{
width:58px;
height:58px;
object-fit:contain;
margin-bottom:7px
}

.detalhes-nome{
font-weight:bold;
font-size:15px
}

.detalhes-score{
font-size:30px;
font-weight:bold
}

.detalhes-estado{
font-size:12px;
color:#7ed957;
margin-top:5px
}

.bloco{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
margin-top:12px;
padding:12px
}

.bloco h3{
margin:0 0 12px;
font-size:17px
}

/* CONSTITUIÇÕES */
.const-equipas{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px
}

.const-btn{
background:#071326;
border:1px solid #17243a;
color:#fff;
padding:10px 5px;
border-radius:9px;
font-weight:bold;
cursor:pointer
}

.const-btn.active{
border-color:#4c83c3;
background:#0d1b30
}

.campo{
position:relative;
height:500px;
border-radius:14px;
overflow:hidden;
background:linear-gradient(#1d6335,#23743e);
border:2px solid #fff;
margin-top:10px
}

.campo:before{
content:"";
position:absolute;
left:50%;
top:0;
bottom:0;
width:2px;
background:#fff
}

.campo:after{
content:"";
position:absolute;
width:110px;
height:110px;
border:2px solid #fff;
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%)
}

.linha-campo{
position:absolute;
left:0;
right:0;
display:flex;
justify-content:space-around;
z-index:2
}

.linha-campo.gk{top:10px}
.linha-campo.def{top:105px}
.linha-campo.mid{top:215px}
.linha-campo.att{top:350px}

.jogador-campo{
width:78px;
text-align:center;
font-size:10px;
font-weight:bold
}

.jogador-bola{
width:36px;
height:36px;
border-radius:50%;
background:#fff;
color:#111;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
border:2px solid #ddd
}

.jogador-nome{
background:#071326;
border-radius:5px;
padding:3px;
margin-top:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.banco{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.jogador-lista{
background:#071326;
border:1px solid #17243a;
border-radius:8px;
padding:9px;
font-size:12px
}

.jogador-num{
color:#7ed957;
font-weight:bold;
margin-right:5px
}

/* EVENTOS */
.linha{
display:flex;
justify-content:space-between;
gap:10px;
padding:8px 0;
border-bottom:1px solid #17243a;
font-size:13px
}

.linha:last-child{border-bottom:0}

.casa-text{text-align:left;flex:1}
.centro{text-align:center;min-width:70px;font-weight:bold}
.fora-text{text-align:right;flex:1}

.evento{
padding:9px 0;
border-bottom:1px solid #17243a;
font-size:13px
}

.evento:last-child{border-bottom:0}

.badge{
display:inline-block;
padding:3px 6px;
border-radius:5px;
font-size:11px;
margin-right:5px
}

.golo{background:#173b24}
.amarelo{background:#665800}
.vermelho{background:#5c1d1d}
.sub{background:#193653}

.erro{
color:#ff8e8e;
text-align:center;
padding:25px 5px
}

/* TABELA */
table{
width:100%;
border-collapse:collapse;
background:#0b1627;
border-radius:10px;
overflow:hidden
}

th,td{
padding:9px 4px;
border-bottom:1px solid #17243a;
text-align:center;
font-size:12px
}

th{
background:#0d1b30;
color:#9eabc0
}

td:nth-child(2){
text-align:left;
font-weight:bold
}
</style>
</head>

<body>

<header>
<h1>⚽ FUTZONE</h1>
<p>Futebol em direto, resultados e estatísticas</p>
</header>

<div id="conteudo" class="container">
<div class="loading">⚽ A carregar jogos...</div>
</div>

<div id="detalhes">
<div class="detalhes-box">

<button class="voltar" onclick="fecharDetalhes()">← Voltar aos jogos</button>

<div id="detalhesConteudo">
<div class="loading">A carregar detalhes...</div>
</div>

</div>
</div>

<nav class="bottom-nav">

<button id="navJogos" class="active" onclick="mostrarJogos()">
⚽<br>Jogos
</button>

<button id="navTabelas" onclick="mostrarTabelas()">
📊<br>Tabelas
</button>

<button id="navFav" onclick="mostrarFavoritos()">
⭐<br>Favoritos
</button>

</nav>

<script>

/* ================================
   LIGAS
================================ */

const ligas=[
{nome:"Portugal",arquivo:"data/primeira-liga.json",codigo:"por.1"},
{nome:"Inglaterra",arquivo:"data/premier-league.json",codigo:"eng.1"},
{nome:"Espanha",arquivo:"data/la-liga.json",codigo:"esp.1"},
{nome:"Itália",arquivo:"data/serie-a.json",codigo:"ita.1"},
{nome:"Alemanha",arquivo:"data/bundesliga.json",codigo:"ger.1"},
{nome:"Champions League",arquivo:"data/champions-league.json",codigo:"uefa.champions"},
{nome:"Liga Europa",arquivo:"data/liga-europa.json",codigo:"uefa.europa"},
{nome:"Liga Conferência",arquivo:"data/liga-conferencia.json",codigo:"uefa.europa.conf"}
];

const iconesLiga={
"Portugal":"🇵🇹",
"Inglaterra":"🏴",
"Espanha":"🇪🇸",
"Itália":"🇮🇹",
"Alemanha":"🇩🇪",
"Champions League":"🏆",
"Liga Europa":"🏆",
"Liga Conferência":"🏆"
};

let todosJogos=[];
let ligaSelecionada="Portugal";
let favoritos=[];

try{
favoritos=JSON.parse(
localStorage.getItem("futzone_favoritos")||"[]"
);
if(!Array.isArray(favoritos))favoritos=[];
}catch(e){favoritos=[]}


/* ================================
   SEGURANÇA
================================ */

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* ================================
   ESTRUTURA ESPN
================================ */

function competencia(j){
return j?.competitions?.[0]||{};
}

function equipas(j){
return competencia(j).competitors||[];
}

function casa(j){
return equipas(j).find(x=>x.homeAway==="home")||{};
}

function fora(j){
return equipas(j).find(x=>x.homeAway==="away")||{};
}

function nomeEquipa(e,alternativa){
return e?.team?.displayName||
e?.team?.shortDisplayName||
e?.team?.name||
alternativa;
}

function logoEquipa(e){
return e?.team?.logo||
e?.team?.logos?.[0]?.href||
"";
}

function scoreEquipa(e){
return e?.score??"-";
}

function obterId(j){
return String(j?.id||j?.eventId||j?.gameId||"");
}

function estado(j){
return competencia(j)?.status?.type?.shortDetail||
competencia(j)?.status?.type?.detail||
competencia(j)?.status?.type?.description||
"";
}

function live(j){
const s=String(estado(j)).toLowerCase();
return s.includes("live")||
s.includes("in progress")||
s.includes("ao vivo")||
s.includes("1st")||
s.includes("2nd")||
s.includes("half");
}


/* ================================
   FAVORITOS
================================ */

function eFavorito(id){
return favoritos.includes(String(id));
}

function alternarFavorito(id,event){
if(event)event.stopPropagation();

id=String(id);

if(eFavorito(id)){
favoritos=favoritos.filter(x=>String(x)!==id);
}else{
favoritos.push(id);
}

localStorage.setItem(
"futzone_favoritos",
JSON.stringify(favoritos)
);

mostrarJogos();
}


/* ================================
   SELETOR DE LIGAS
================================ */

function selecionarLiga(nome){
ligaSelecionada=nome;
mostrarJogos();
}

function seletorLigas(){

return `
<div class="seletor-ligas">

<button class="liga-btn ${ligaSelecionada==="Todas"?"active":""}"
onclick="selecionarLiga('Todas')">

<span class="liga-icon">🌍</span>
Todas

</button>

${ligas.map(liga=>`

<button class="liga-btn ${ligaSelecionada===liga.nome?"active":""}"
onclick="selecionarLiga('${esc(liga.nome)}')">

<span class="liga-icon">
${iconesLiga[liga.nome]||"⚽"}
</span>

${esc(liga.nome)}

</button>

`).join("")}

</div>
`;
}


/* ================================
   CARD JOGO
================================ */

function cardJogo(jogo){

const id=obterId(jogo);
const h=casa(jogo);
const a=fora(jogo);

const nomeH=nomeEquipa(h,"Casa");
const nomeA=nomeEquipa(a,"Fora");

const logoH=logoEquipa(h);
const logoA=logoEquipa(a);

const scoreH=scoreEquipa(h);
const scoreA=scoreEquipa(a);

const st=estado(jogo);

return `

<div class="game"
onclick="abrirDetalhes('${esc(id)}','${esc(jogo.__liga)}')">

<div class="game-top">

<span>${esc(jogo.__liga)}</span>

<span class="${live(jogo)?"live":""}">
${live(jogo)?"🔴 ":""}${esc(st)}
</span>

</div>

<div class="teams">

<div class="team">

${
logoH
?`<img src="${esc(logoH)}"
onerror="this.style.display='none'">`
:"⚽"
}

<div class="team-name">${esc(nomeH)}</div>

</div>

<div>

<div class="score">
${esc(scoreH)} - ${esc(scoreA)}
</div>

<div class="status">Ver detalhes</div>

</div>

<div class="team">

${
logoA
?`<img src="${esc(logoA)}"
onerror="this.style.display='none'">`
:"⚽"
}

<div class="team-name">${esc(nomeA)}</div>

</div>

</div>

<div class="favorite">

<button onclick="alternarFavorito('${esc(id)}',event)">
${eFavorito(id)?"★":"☆"}
</button>

</div>

</div>
`;
}


/* ================================
   EXTRAIR JOGOS
================================ */

function extrairJogos(dados){

if(Array.isArray(dados))return dados;
if(Array.isArray(dados.events))return dados.events;
if(Array.isArray(dados.jogos))return dados.jogos;
if(Array.isArray(dados.games))return dados.games;
if(Array.isArray(dados.matches))return dados.matches;
if(Array.isArray(dados.data))return dados.data;

return [];
}


/* ================================
   CARREGAR
================================ */

async function carregar(){

const resultados=[];

await Promise.all(

ligas.map(async liga=>{

try{

const resposta=await fetch(
liga.arquivo+"?v="+Date.now(),
{cache:"no-store"}
);

if(!resposta.ok)return;

const dados=await resposta.json();

extrairJogos(dados).forEach(jogo=>{

if(!jogo||typeof jogo!=="object")return;

jogo.__liga=liga.nome;
jogo.__codigo=liga.codigo;

resultados.push(jogo);

});

}catch(e){
console.log("Erro "+liga.nome,e);
}

})

);

todosJogos=resultados;
mostrarJogos();
}


/* ================================
   MOSTRAR JOGOS
================================ */

function mostrarJogos(){

ativarNav("navJogos");

const conteudo=document.getElementById("conteudo");

let html=seletorLigas();

const ligasMostrar=
ligaSelecionada==="Todas"
?ligas
:ligas.filter(x=>x.nome===ligaSelecionada);

let encontrou=false;

ligasMostrar.forEach(liga=>{

const jogos=todosJogos.filter(
j=>j.__liga===liga.nome
);

if(!jogos.length)return;

encontrou=true;

html+=`

<section class="liga">

<div class="liga-title">
${iconesLiga[liga.nome]||"⚽"}
${esc(liga.nome)}
</div>

${jogos.map(cardJogo).join("")}

</section>

`;

});

if(!encontrou){

html+=`

<div class="empty">

⚽<br><br>
Não existem jogos disponíveis nesta liga.

</div>

`;

}

conteudo.innerHTML=html;
}


/* ================================
   DETALHES
================================ */

async function abrirDetalhes(id,liga){

if(!id){
alert("Este jogo não tem ID.");
return;
}

document.getElementById("detalhes").style.display="block";
document.body.style.overflow="hidden";

const alvo=document.getElementById("detalhesConteudo");

alvo.innerHTML=`
<div class="loading">⚽ A carregar detalhes...</div>
`;

const codigo=
ligas.find(x=>x.nome===liga)?.codigo||liga;

try{

const url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"+
encodeURIComponent(codigo)+
"/summary?event="+
encodeURIComponent(id)+
"&_="+Date.now();

const resposta=await fetch(url);

if(!resposta.ok)throw new Error("Erro API");

const dados=await resposta.json();

renderDetalhes(dados,liga);

}catch(e){

console.log(e);

alvo.innerHTML=`
<div class="erro">
Não foi possível carregar os detalhes deste jogo.
<br><br>
Tenta novamente dentro de alguns segundos.
</div>
`;

}
}

function fecharDetalhes(){

document.getElementById("detalhes").style.display="none";
document.body.style.overflow="";

}


/* ================================
   CONSTITUIÇÕES
================================ */

function obterAtletas(dados){

const grupos=dados?.boxscore?.players||[];

if(!Array.isArray(grupos))return [];

return grupos.map(g=>({

equipa:
g.team?.displayName||
g.team?.name||
"Equipa",

logo:g.team?.logo||"",

atletas:g.statistics||
g.athletes||
[]

})).filter(x=>x.atletas.length);

}

function dadosJogador(a){

const atleta=a?.athlete||a;

let nome=
atleta?.displayName||
atleta?.fullName||
atleta?.shortName||
a?.displayName||
"Jogador";

let numero=
atleta?.jersey||
a?.jersey||
a?.uniformNumber||
"";

let pos=
atleta?.position?.abbreviation||
atleta?.position?.displayName||
a?.position?.abbreviation||
"";

let titular=
a?.starter===true||
a?.starter==="true";

let suplente=
a?.substitute===true||
a?.substitute==="true";

return {nome,numero,pos,titular,suplente};
}

function jogadorCampo(j,numero){

return `

<div class="jogador-campo">

<div class="jogador-bola">
${esc(numero||"")}
</div>

<div class="jogador-nome">
${esc(j.nome)}
</div>

</div>

`;
}

function construirCampo(atletas){

let jogadores=atletas.map(dadosJogador);

let titulares=jogadores.filter(j=>j.titular);

if(titulares.length<5){
titulares=jogadores.slice(0,11);
}

titulares=titulares.slice(0,11);

const gk=[];
const def=[];
const mid=[];
const att=[];

titulares.forEach((j,i)=>{

const p=j.pos.toLowerCase();

if(
p.includes("goal")||
p.includes("gk")||
p.includes("guarda")
){
gk.push(j);
}else if(
p.includes("def")||
p.includes("back")
){
def.push(j);
}else if(
p.includes("mid")||
p.includes("medio")||
p.includes("meio")
){
mid.push(j);
}else{
att.push(j);
}

});

if(!gk.length&&titulares.length)gk.push(titulares[0]);

while(def.length+mid.length+att.length>10){
att.pop();
}

if(!def.length){
def=titulares.slice(1,5);
}

if(!mid.length){
mid=titulares.slice(5,8);
}

if(!att.length){
att=titulares.slice(8,11);
}

return `

<div class="campo">

<div class="linha-campo gk">
${gk.slice(0,1).map(j=>jogadorCampo(j,j.numero)).join("")}
</div>

<div class="linha-campo def">
${def.slice(0,4).map(j=>jogadorCampo(j,j.numero)).join("")}
</div>

<div class="linha-campo mid">
${mid.slice(0,4).map(j=>jogadorCampo(j,j.numero)).join("")}
</div>

<div class="linha-campo att">
${att.slice(0,3).map(j=>jogadorCampo(j,j.numero)).join("")}
</div>

</div>
`;
}

function construirConstituicao(grupos){

if(!grupos.length){

return `
<div class="bloco">

<h3>👥 Constituições</h3>

<div class="empty">
As constituições ainda não estão disponíveis para este jogo.
</div>

</div>
`;

}

let botoes="";
let conteudos="";

grupos.forEach((g,i)=>{

const jogadores=g.atletas.map(dadosJogador);

const titulares=jogadores.filter(j=>j.titular);
const suplentes=jogadores.filter(j=>j.suplente||!j.titular);

botoes+=`

<button class="const-btn ${i===0?"active":""}"
onclick="mudarConstituicao(${i})"
id="constBtn${i}">

${esc(g.equipa)}

</button>
`;

conteudos+=`

<div class="const-equipa-conteudo"
id="constConteudo${i}"
style="${i===0?"":"display:none"}">

<h4 style="margin:10px 0">
🟢 Onze inicial
</h4>

${
titulares.length
?construirCampo(g.atletas)
:`<div class="empty">Onze inicial indisponível.</div>`
}

<h4 style="margin:18px 0 10px">
🪑 Suplentes
</h4>

<div class="banco">

${
suplentes.length
?suplentes.map(j=>`

<div class="jogador-lista">

<span class="jogador-num">
${esc(j.numero)}
</span>

${esc(j.nome)}

${j.pos?`<small> · ${esc(j.pos)}</small>`:""}

</div>

`).join("")
:`<div class="empty">Suplentes indisponíveis.</div>`
}

</div>

</div>
`;

});

return `

<div class="bloco">

<h3>👥 Constituições</h3>

<div class="const-equipas">
${botoes}
</div>

${conteudos}

</div>

`;
}

function mudarConstituicao(indice){

document.querySelectorAll(".const-equipa-conteudo")
.forEach(x=>x.style.display="none");

document.querySelectorAll(".const-btn")
.forEach(x=>x.classList.remove("active"));

const conteudo=
document.getElementById("constConteudo"+indice);

const botao=
document.getElementById("constBtn"+indice);

if(conteudo)conteudo.style.display="block";
if(botao)botao.classList.add("active");
}


/* ================================
   RENDER DETALHES
================================ */

function renderDetalhes(dados,liga){

const compet=
dados?.header?.competitions?.[0]||
dados?.competitions?.[0]||
{};

const comps=compet.competitors||[];

const h=comps.find(x=>x.homeAway==="home")||{};
const a=comps.find(x=>x.homeAway==="away")||{};

const nomeH=h.team?.displayName||h.team?.name||"Casa";
const nomeA=a.team?.displayName||a.team?.name||"Fora";

const logoH=h.team?.logo||"";
const logoA=a.team?.logo||"";

const scoreH=h.score??"-";
const scoreA=a.score??"-";

const status=
compet.status?.type?.detail||
compet.status?.type?.description||
"";

let html=`

<div class="detalhes-header">

<div style="font-size:12px;color:#9eabc0;margin-bottom:12px">
${esc(liga||"FUTZONE")}
</div>

<div class="detalhes-equipas">

<div class="detalhes-equipa">

${
logoH
?`<img src="${esc(logoH)}">`
:"⚽"
}

<div class="detalhes-nome">
${esc(nomeH)}
</div>

</div>

<div>

<div class="detalhes-score">
${esc(scoreH)} - ${esc(scoreA)}
</div>

<div class="detalhes-estado">
${esc(status)}
</div>

</div>

<div class="detalhes-equipa">

${
logoA
?`<img src="${esc(logoA)}">`
:"⚽"
}

<div class="detalhes-nome">
${esc(nomeA)}
</div>

</div>

</div>

</div>
`;


/* CONSTITUIÇÕES */
const grupos=obterAtletas(dados);

html+=construirConstituicao(grupos);


/* EVENTOS */
const eventos=[];

if(Array.isArray(dados.plays))
dados.plays.forEach(x=>eventos.push(x));

if(Array.isArray(dados.keyEvents))
dados.keyEvents.forEach(x=>eventos.push(x));

if(Array.isArray(dados.scoringPlays))
dados.scoringPlays.forEach(x=>eventos.push(x));

const unicos=[];
const vistos=new Set();

eventos.forEach(ev=>{

const chave=
ev.id||
(ev.text||"")+"-"+(ev.clock?.displayValue||"");

if(!vistos.has(chave)){
vistos.add(chave);
unicos.push(ev);
}

});

let eventosHtml="";

unicos.forEach(ev=>{

const texto=
ev.text||
ev.shortText||
ev.description||
"";

const tipo=
String(
ev.type?.text||
ev.type?.name||
""
).toLowerCase();

const minuto=
ev.clock?.displayValue||
ev.period?.displayValue||
"";

let classe="";
let icone="";

const t=texto.toLowerCase();

if(
tipo.includes("goal")||
t.includes("goal")||
t.includes("golo")
){
classe="golo";
icone="⚽";
}else if(
tipo.includes("yellow")||
t.includes("yellow")||
t.includes("amarelo")
){
classe="amarelo";
icone="🟨";
}else if(
tipo.includes("red")||
t.includes("red card")||
t.includes("vermelho")
){
classe="vermelho";
icone="🟥";
}else if(
tipo.includes("sub")||
t.includes("substitution")||
t.includes("substituição")
){
classe="sub";
icone="🔄";
}else{
return;
}

eventosHtml+=`

<div class="evento">

<span class="badge ${classe}">
${icone} ${esc(minuto)}
</span>

${esc(texto)}

</div>
`;

});

html+=`

<div class="bloco">

<h3>⚡ Acontecimentos</h3>

${
eventosHtml||
`<div class="empty">
Ainda não existem acontecimentos disponíveis.
</div>`
}

</div>
`;


/* ESTATÍSTICAS */
let stats=[];

if(
dados.boxscore&&
Array.isArray(dados.boxscore.teams)
){

dados.boxscore.teams.forEach(team=>{

const equipa=
team.team?.displayName||
team.team?.name||
"";

(team.statistics||[]).forEach(s=>{

stats.push({
equipa,
nome:s.name||s.label||"",
valor:s.displayValue??s.value??""
});

});

});
}

if(Array.isArray(dados.statistics)){

dados.statistics.forEach(s=>{

if(s.name||s.label)stats.push(s);

});

}

if(stats.length){

const gruposStats={};

stats.forEach(s=>{

const chave=s.nome||s.name||s.label||"";

if(!gruposStats[chave])
gruposStats[chave]=[];

gruposStats[chave].push(s);

});

let statsHtml="";

Object.keys(gruposStats)
.slice(0,30)
.forEach(nome=>{

const arr=gruposStats[nome];

statsHtml+=`

<div class="linha">

<div class="casa-text">
${esc(arr[0]?.valor??arr[0]?.displayValue??"")}
</div>

<div class="centro">
${esc(nome)}
</div>

<div class="fora-text">
${esc(arr[1]?.valor??arr[1]?.displayValue??"")}
</div>

</div>
`;

});

html+=`

<div class="bloco">

<h3>📊 Estatísticas</h3>

${statsHtml}

</div>
`;

}else{

html+=`

<div class="bloco">

<h3>📊 Estatísticas</h3>

<div class="empty">
As estatísticas ficam disponíveis quando a fonte do jogo as fornece.
</div>

</div>
`;
}

document.getElementById("detalhesConteudo").innerHTML=html;
}


/* ================================
   TABELAS
================================ */

async function mostrarTabelas(){

ativarNav("navTabelas");

const conteudo=document.getElementById("conteudo");

conteudo.innerHTML=`

<h2>📊 Classificações</h2>

<div class="loading">
A carregar tabelas...
</div>
`;

let html="";

for(const liga of ligas){

try{

const url=
"https://site.api.espn.com/apis/v2/sports/soccer/"+
liga.codigo+
"/standings?_="+Date.now();

const resposta=await fetch(url);

if(!resposta.ok)continue;

const dados=await resposta.json();

const entries=
dados?.children?.[0]?.standings?.entries||
dados?.standings?.entries||
[];

if(!entries.length)continue;

html+=`

<div class="bloco">

<h3>
${iconesLiga[liga.nome]||"⚽"}
${esc(liga.nome)}
</h3>

<table>

<tr>
<th>#</th>
<th>Equipa</th>
<th>J</th>
<th>V</th>
<th>E</th>
<th>D</th>
<th>Pts</th>
</tr>
`;

entries.forEach((item,i)=>{

const equipa=
item.team?.displayName||
item.team?.name||
"Equipa";

const stats={};

(item.stats||[]).forEach(s=>{
stats[s.name]=s.value;
});

html+=`

<tr>

<td>${i+1}</td>

<td>${esc(equipa)}</td>

<td>${stats.gamesPlayed??stats.gp??"-"}</td>

<td>${stats.wins??"-"}</td>

<td>${stats.ties??stats.draws??"-"}</td>

<td>${stats.losses??"-"}</td>

<td>${stats.points??"-"}</td>

</tr>
`;

});

html+=`

</table>

</div>
`;

}catch(e){
console.log("Erro tabela",liga.nome,e);
}

}

if(!html){

html=`

<div class="empty">

📊<br><br>
As classificações não estão disponíveis neste momento.

</div>
`;
}

conteudo.innerHTML=
`<h2>📊 Classificações</h2>`+html;
}
