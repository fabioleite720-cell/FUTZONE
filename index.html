<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE ⚽</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#111}
header{background:#07111f;color:white;text-align:center;padding:22px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:15px}
button{padding:12px;margin:4px;border:0;border-radius:10px;background:#07111f;color:white;font-weight:bold}
.active{background:#1769aa}
.match{padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:center}
td:nth-child(2),th:nth-child(2){text-align:left}
</style>
</head>
<body>

<header>
<h1>⚽ FUTZONE</h1>
<p>O teu futebol num só lugar</p>
</header>

<main>

<div class="card">
<h2>🏆 Competições</h2>

<button class="active" onclick="liga('PPL','Primeira Liga',this)">🇵🇹 Primeira Liga</button>
<button onclick="liga('PL','Premier League',this)">🏴 Premier League</button>
<button onclick="liga('PD','La Liga',this)">🇪🇸 La Liga</button>
<button onclick="liga('SA','Serie A',this)">🇮🇹 Serie A</button>
<button onclick="liga('BL1','Bundesliga',this)">🇩🇪 Bundesliga</button>
</div>

<div class="card">
<h2 id="jt">⚽ Próximos jogos — Primeira Liga</h2>
<div id="jogos">A carregar...</div>
</div>

<div class="card">
<h2 id="ct">📊 Classificação — Primeira Liga</h2>
<div id="tabela">A carregar...</div>
</div>

</main>

<footer style="text-align:center;padding:15px;font-size:12px">
Data provided by football-data.org
</footer>

<script>

const dados={
PPL:['data/primeira-liga.json','data/classificacao.json','Primeira Liga'],
PL:['data/premier-league.json','data/premier-league-classificacao.json','Premier League'],
PD:['data/la-liga.json','data/la-liga-classificacao.json','La Liga'],
SA:['data/serie-a.json','data/serie-a-classificacao.json','Serie A'],
BL1:['data/bundesliga.json','data/bundesliga-classificacao.json','Bundesliga']
};

async function liga(codigo,nome,botao){

document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
botao.classList.add('active');

document.getElementById('jt').textContent='⚽ Próximos jogos — '+nome;
document.getElementById('ct').textContent='📊 Classificação — '+nome;

try{

let r=await fetch(dados[codigo][0]);
let j=await r.json();

let proximos=j.matches.filter(x=>x.status!='FINISHED').slice(0,15);

document.getElementById('jogos').innerHTML=proximos.map(x=>{

let d=new Date(x.utcDate);

return '<div class="match"><b>'+
d.toLocaleDateString('pt-PT')+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})+
'</b><br>'+x.homeTeam.name+'<br>🆚<br>'+x.awayTeam.name+
'</div>';

}).join('');

let t=await fetch(dados[codigo][1]);
let tabela=await t.json();

let tab=tabela.standings.find(x=>x.type=='TOTAL')||tabela.standings[0];

document.getElementById('tabela').innerHTML=
'<table><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>Pts</th></tr>'+
tab.table.map(x=>
'<tr><td>'+x.position+'</td><td>'+x.team.name+
'</td><td>'+x.playedGames+'</td><td>'+x.won+
'</td><td><b>'+x.points+'</b></td></tr>'
).join('')+
'</table>';

}catch(e){

document.getElementById('jogos').textContent='Erro ao carregar dados.';
document.getElementById('tabela').textContent='Erro ao carregar classificação.';

}

}

liga('PPL','Primeira Liga',document.querySelector('button'));

</script>

</body>
</html>
