body{

background:var(--bg);

.orange{color:#ffad42}

.market{

.status{

.name{

.score{

.row{

.label{
font-size:10px;

}
.value{
font-size:13px;
font-weight:800;
margin-top:5px
}
.watch{

gap:7px;
margin-top:7px

.watch a{
background:#111d2b;
color:#fff;

padding:9px;
border-radius:8px;
font-size:11px;
border:1px solid #26364a

.lastgrid,.statsgrid,.lineups{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
.last,.statbox,.lineup{

border:1px solid var(--l);

padding:8px;
margin-top:8px
}
.form{
display:flex;
gap:4px;
margin:7px 0
}
.form b{
width:22px;
height:22px;
display:flex;
align-items:center;
justify-content:center;
border-radius:5px;
font-size:10px
}
.v{background:#124f3a;color:#54f2b0}
.e{background:#554914;color:#ffe36b}
.d{background:#571d29;color:#ff8290}
.game{cursor:pointer}
.leagueGroup{grid-column:1/-1}
.leagueHead{
font-size:15px;
font-weight:900;
padding:10px 4px 5px;
border-bottom:1px solid var(--l);
margin-top:8px
}
.eventList{
display:grid;
gap:7px
}
.eventItem{
font-size:10px;
padding:7px;
border-top:1px solid var(--l)
}
.roster{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px

.player{
background:#0a131f;
border:1px solid var(--l);
border-radius:8px;
padding:8px;
font-size:11px;
cursor:pointer
}
.pos{
color:var(--m);
font-size:10px;
margin-top:3px
}
.loading{

color:var(--m);
padding:25px
}
.err{
color:#ff8290;
font-size:11px;
padding:12px
}
.statbox{text-align:center}
.statbox b{font-size:13px}
.statbox span{
display:block;
color:var(--m);
font-size:9px;

}
.tablewrap{overflow-x:auto}
.table{
width:100%;
border-collapse:collapse;

}
.table th,.table td{

border-bottom:1px solid var(--l);
text-align:left;

.table th{color:var(--m)}

@media(max-width:600px){
.grid,.lastgrid,.statsgrid,.lineups{

<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const CORE='https://sports.core.api.espn.com/v2/sports/soccer/leagues/';
const SOFA='https://www.sofascore.com/api/v1';

let games=[];
let teams={};
let current=null;
let controller=null;

const LEAGUES=[
['por.1','Liga Portugal'],
['por.2','Liga 2'],
['por.3','Liga 3'],
['por.w.1','Liga BPI Feminina'],
['eng.1','Premier League'],
['esp.1','La Liga'],
['ita.1','Serie A'],
['ger.1','Bundesliga'],
['fra.1','Ligue 1'],
['tur.1','Super Lig'],
['ksa.1','Saudi Pro League'],
['usa.1','MLS'],
['uefa.champions','Liga dos Campeões'],
['uefa.europa','Liga Europa'],
['uefa.europa.conf','Liga Conferência'],
['uefa.nations','Liga das Nações'],
['fifa.worldq.uefa','Qualificação Mundial UEFA'],
['fifa.worldq.conmebol','Qualificação Mundial CONMEBOL'],
['fifa.friendly','Amigáveis'],
['conmebol.libertadores','Libertadores'],
['conmebol.sudamericana','Sul-Americana']
];

const esc=s=>String(s??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');

function sec(id,btn){
document.querySelectorAll('main>section')
.forEach(x=>x.classList.add('hidden'));

const el=document.getElementById(id);
if(el)el.classList.remove('hidden');

document.querySelectorAll('.nav button')
.forEach(x=>x.classList.remove('active'));

if(btn)btn.classList.add('active');

if(id==='tables')loadTables();
if(id==='news')loadNews();
if(id==='live')showLive();
}

function add(parent,html){
const el=document.createElement('div');
el.innerHTML=html;
parent.appendChild(el.firstElementChild);
}

function fmtDate(d){
try{
return new Date(d).toLocaleDateString('pt-PT',{
day:'2-digit',
month:'2-digit',
year:'numeric'
});
}catch(e){return ''}
}

function fmtTime(d){
try{
return new Date(d).toLocaleTimeString('pt-PT',{
hour:'2-digit',
minute:'2-digit'
});
}catch(e){return ''}
}

async function get(path){
if(controller)controller.abort();

controller=new AbortController();

const timer=setTimeout(()=>{
try{controller.abort()}catch(e){}
},12000);

try{

const r=await fetch(API+path,{
cache:'no-store',
signal:controller.signal
});

if(!r.ok)throw new Error('HTTP '+r.status);

return await r.json();

}finally{
clearTimeout(timer);
}
}


async function jsonUrl(url,timeout=10000){

const c=new AbortController();

const timer=setTimeout(()=>{
try{c.abort()}catch(e){}
},timeout);

try{

const r=await fetch(url,{
cache:'no-store',
signal:c.signal
});

if(!r.ok)throw new Error('HTTP '+r.status);

return await r.json();

}catch(e){
return null;
}finally{
clearTimeout(timer);
}

}


function teamFromEvent(e,home=true){

const c=e?.competitions?.[0]?.competitors||[];

return c.find(x=>home?
x.homeAway==='home':
x.homeAway==='away')||c[home?0:1]||null;

}


function teamIdFromEvent(e,home=true){

return teamFromEvent(e,home)?.team?.id||'';

}


function teamNameFromEvent(e,home=true){

return teamFromEvent(e,home)?.team?.displayName||
teamFromEvent(e,home)?.team?.shortDisplayName||
'Equipa';

}


function scoreValue(c){

if(!c)return null;

const v=[
c.score?.value,
c.score?.displayValue,
c.score,
c.statistics?.find?.(x=>x.name==='goals')?.value
];

for(const x of v){

if(x!==undefined&&x!==null&&x!==''){

const n=parseFloat(String(x).replace(',','.'));

if(Number.isFinite(n))return n;

}

}

if(Array.isArray(c.linescores)){

const s=c.linescores.reduce((a,x)=>a+(Number(x.value)||0),0);

if(Number.isFinite(s))return s;

}

return null;

}


function completed(e){

return !!(
e?.status?.type?.completed===true||
['post','final','finished','completed']
.includes(String(e?.status?.type?.state||'').toLowerCase())
);

}


function resultForTeam(e,teamId){

const cs=e?.competitions?.[0]?.competitors||[];

const me=cs.find(c=>String(c.team?.id)===String(teamId));

if(!me)return null;

const op=cs.find(c=>String(c.team?.id)!==String(teamId));

const gf=scoreValue(me);
const ga=scoreValue(op);

if(gf===null||ga===null)return null;

return{
date:e.date,
opponent:op?.team?.displayName||'Adversário',
gf,
ga,
result:gf>ga?'V':gf===ga?'E':'D',
event:e
};

}


async function last5(team,id,exclude){

const box=document.getElementById(id);

if(!box)return;

box.innerHTML='<div class="loading">A procurar os últimos 5 jogos...</div>';

let events=[];

const urls=[
API+'all/teams/'+encodeURIComponent(team)+'/schedule?limit=100',
API+'teams/'+encodeURIComponent(team)+'/schedule?limit=100'
];

for(const u of urls){

const d=await jsonUrl(u);

if(Array.isArray(d?.events)){
events.push(...d.events);
}

if(events.length)break;

}

let rows=events
.filter(e=>completed(e))
.filter(e=>String(e.id)!==String(exclude))
.map(e=>resultForTeam(e,team))
.filter(Boolean)
.sort((a,b)=>new Date(b.date)-new Date(a.date))
.slice(0,5);

if(!rows.length){

box.innerHTML='<div class="muted">Não foi possível obter os últimos jogos.</div>';
return;

}

box.innerHTML=rows.map(r=>`

<div class="last">

<div class="muted">${fmtDate(r.date)}</div>

<div class="match">
<span>${esc(r.opponent)}</span>
<b>${r.gf}-${r.ga}</b>
</div>

<div class="form">
<b class="${r.result==='V'?'v':r.result==='E'?'e':'d'}">
${r.result}
</b>
</div>

</div>

`).join('');

}


function marketLabel(m){

const s=String(m||'');

if(/over/i.test(s))return s.replace(/Over/ig,'Mais de');
if(/under/i.test(s))return s.replace(/Under/ig,'Menos de');
if(/draw/i.test(s))return 'Empate';
if(/home win/i.test(s))return 'Vitória da casa';
if(/away win/i.test(s))return 'Vitória visitante';

return s;

}


function suggestMarket(e){

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

if(!h||!a)return null;

return{
high:h.team.displayName+' ou empate (1X)',
low:'Mais de 0,5 golos'
};

}


function suggestions(){

const box=document.getElementById('suggestions');

if(!box)return;

const valid=games
.filter(e=>e.competitions?.[0])
.slice(0,10);

if(!valid.length){

box.innerHTML='<div class="loading">Sem sugestões disponíveis.</div>';
return;

}

box.innerHTML=valid.map((e,i)=>{

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

const s=suggestMarket(e);

return`

<div class="card suggest game"
onclick="openMatch('${esc(e.id)}')">

<div class="match">

<span>${esc(h?.team?.displayName||'Casa')}</span>

<span>vs</span>

<span>${esc(a?.team?.displayName||'Visitante')}</span>

</div>

<div class="market orange">
Médio-alto
</div>

<div class="value">
${esc(s?.high||'Análise Premium')}
</div>

<div class="market green">
Médio-baixo
</div>

<div class="value">
${esc(s?.low||'Mais de 0,5 golos')}
</div>

<div class="status">
${fmtDate(e.date)} ${fmtTime(e.date)}
</div>

</div>

`;

}).join('');

}


function render(list=games){

const box=document.getElementById('gamesList');

if(!box)return;

if(!list.length){

box.innerHTML='<div class="loading">Não existem jogos disponíveis.</div>';
return;

}

const groups={};

list.forEach(e=>{

const l=e.leagueName||
e.league?.name||
e.competitions?.[0]?.league?.name||
'Futebol';

(groups[l]??=[]).push(e);

});

box.innerHTML=Object.entries(groups).map(([league,arr])=>`

<div class="leagueGroup">

<div class="leagueHead">
${esc(league)}
</div>

<div class="eventList">

${arr.map(e=>{

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

return`

<div class="card game" onclick="openMatch('${esc(e.id)}')">

<div class="match">

<span>${esc(h?.team?.displayName||'Casa')}</span>

<b>
${completed(e)?
(scoreValue(h)||0)+' - '+(scoreValue(a)||0):
'vs'}
</b>

<span>${esc(a?.team?.displayName||'Visitante')}</span>

</div>

<div class="status">

${completed(e)?
'Terminado':
(e.status?.type?.shortDetail||
fmtDate(e.date)+' '+fmtTime(e.date))}

</div>

</div>

`;

}).join('')}

</div>

</div>

<script>
/* =========================================================
   FUTZONE PREMIUM — TESTE DE ANÁLISE INTELIGENTE
   Não assume vantagem da equipa da casa
   ========================================================= */

function FZ_teamName(e, home){
  const t=teamFromEvent(e,home);
  return t?.team?.displayName || (home?'Casa':'Visitante');
}


/* ---------------------------------------------------------
   ESTIMATIVA BASE
   Usa odds/predictor da ESPN quando existirem.
   Caso contrário, evita inventar vantagem da casa.
   --------------------------------------------------------- */

function FZ_getOdds(e){

  const comp=e?.competitions?.[0];

  const odds=
    comp?.odds?.[0] ||
    e?.odds?.[0] ||
    null;

  if(!odds)return null;

  return odds;
}


function FZ_probability(e){

  const o=FZ_getOdds(e);

  if(!o)return null;

  const home=
    Number(
      o?.homeTeamOdds?.winPercentage ??
      o?.homeTeamOdds?.win ??
      NaN
    );

  const away=
    Number(
      o?.awayTeamOdds?.winPercentage ??
      o?.awayTeamOdds?.win ??
      NaN
    );

  const draw=
    Number(
      o?.drawPercentage ??
      o?.draw?.winPercentage ??
      NaN
    );

  if(
    Number.isFinite(home) ||
    Number.isFinite(away) ||
    Number.isFinite(draw)
  ){

    return{
      home:Number.isFinite(home)?home:0,
      draw:Number.isFinite(draw)?draw:0,
      away:Number.isFinite(away)?away:0
    };

  }

  return null;
}


/* ---------------------------------------------------------
   ANÁLISE PREMIUM
   --------------------------------------------------------- */

function suggestMarket(e){

  const h=teamFromEvent(e,true);
  const a=teamFromEvent(e,false);

  if(!h || !a)return null;

  const home=FZ_teamName(e,true);
  const away=FZ_teamName(e,false);

  const p=FZ_probability(e);

  /*
   * REGRA 1
   * Se existir probabilidade da ESPN, ela tem prioridade.
   */

  if(p){

    const vals=[
      {type:'home',value:p.home},
      {type:'draw',value:p.draw},
      {type:'away',value:p.away}
    ].sort((x,y)=>y.value-x.value);

    const best=vals[0];
    const second=vals[1];

    /*
     * Grande diferença:
     * não deixar a vantagem da casa substituir
     * uma diferença clara de qualidade.
     */

    if(
      best.value>=60 &&
      best.value-second.value>=15
    ){

      let high='';

      if(best.type==='home')
        high='Vitória '+home;

      if(best.type==='away')
        high='Vitória '+away;

      if(best.type==='draw')
        high='Empate';

      return{
        high:high,
        low:
          best.type==='draw'
            ? 'Dupla possibilidade: 1X ou X2'
            : (
              best.type==='home'
                ? home+' ou empate (1X)'
                : away+' ou empate (X2)'
            )
      };

    }


    /*
     * Jogo equilibrado:
     * não inventar favorito.
     */

    if(
      Math.abs(best.value-second.value)<10
    ){

      return{
        high:'Dupla possibilidade',
        low:'Menos de 3,5 golos'
      };

    }


    /*
     * Diferença moderada.
     */

    if(best.type==='home'){

      return{
        high:home+' ou empate (1X)',
        low:'Mais de 0,5 golos'
      };

    }

    if(best.type==='away'){

      return{
        high:away+' ou empate (X2)',
        low:'Mais de 0,5 golos'
      };

    }

  }


  /*
   * SEM odds/probabilidades:
   *
   * NÃO assumir que a casa é favorita.
   *
   * Usamos um mercado conservador até existirem
   * dados suficientes para escolher um vencedor.
   */

  return{

    high:'Dupla possibilidade',
    low:'Mais de 0,5 golos'

  };

}


/* ---------------------------------------------------------
   10 SUGESTÕES
   --------------------------------------------------------- */

function suggestions(){

  const box=document.getElementById('suggestions');

  if(!box)return;

  const valid=games
    .filter(e=>
      e &&
      e.competitions?.[0] &&
      !completed(e)
    )
    .slice(0,30);


  if(!valid.length){

    box.innerHTML=
      '<div class="loading">'+
      'Sem sugestões disponíveis.'+
      '</div>';

    return;

  }


  /*
   * Calcula todas primeiro.
   */

  const analysed=valid.map(e=>{

    const s=suggestMarket(e);

    return{
      event:e,
      suggestion:s
    };

  })
  .filter(x=>x.suggestion);


  /*
   * Primeiro os jogos com informação mais forte.
   */

  const high=analysed
    .filter(x=>
      !/Dupla possibilidade/i
        .test(x.suggestion.high)
    )
    .slice(0,5);


  /*
   * Completa até 5 se não houver

async function sofaEventId(e){

const h=teamFromEvent(e,true);

).toLowerCase();

a?.team?.displayName||
a?.team?.shortDisplayName||
''
).toLowerCase();

const searchNames=[

`${hn} ${an}`,
`${an} ${hn}`

];

for(const q of searchNames){

const u=
'https://www.sofascore.com/api/v1/sport/football/search/'+
encodeURIComponent(q);

const d=await jsonUrl(u);

const ev=d?.results||d?.events||[];

if(Array.isArray(ev)){

for(const x of ev){

const evh=String(
x?.homeTeam?.name||
x?.homeTeam?.shortName||
''
).toLowerCase();

const eva=String(
x?.awayTeam?.name||
x?.awayTeam?.shortName||
''
).toLowerCase();

const xd=String(
x?.startTimestamp?
new Date(x.startTimestamp*1000).toISOString().slice(0,10):
''
);

if(
(
evh.includes(hn.split(' ')[0])||
hn.includes(evh.split(' ')[0])
)&&
(
eva.includes(an.split(' ')[0])||
an.includes(eva.split(' ')[0])
)&&

){

}

}

return null;

}

function statNumber(x){

if(x==null)return null;

if(typeof x==='number')return x;

const v=
x.displayValue??
x.value??
x.displayValue;

if(v==null)return null;

const n=parseFloat(
String(v).replace('%','').replace(',','.')
);

return Number.isFinite(n)?n:null;

}


function normaliseStatName(s){

return String(s||'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/[^a-z0-9]/g,'');

}


function statLabel(name){

const n=normaliseStatName(name);

const map={

possession:'Posse',
possessionpercentage:'Posse',

shots:'Remates',
totalshots:'Remates',
attemptedshots:'Remates',

shotsontarget:'Remates à baliza',
shotsontargettotal:'Remates à baliza',
ontarget:'Remates à baliza',

corners:'Cantos',
cornerkicks:'Cantos',

fouls:'Faltas',
foulscommitted:'Faltas',

offsides:'Foras de jogo',
offside:'Foras de jogo',

saves:'Defesas',
goalkeepersaves:'Defesas',

passes:'Passes',
totalpasses:'Passes',
accuratepasses:'Passes certos',

passaccuracy:'Precisão de passe',
passingaccuracy:'Precisão de passe'

};

return map[n]||null;

}


function extractStats(d){

const out=[];

function walk(node,teamName=''){

if(!node)return;

if(Array.isArray(node)){

node.forEach(x=>walk(x,teamName));
return;

}

if(typeof node!=='object')return;

const name=
node.name||
node.label||
node.displayName||
node.shortName;

const label=statLabel(name);

if(label){

const value=
node.displayValue??
node.value;

if(value!=null){

out.push({
label,
value,
team:teamName
});

}

}

const nextTeam=
node.team?.displayName||
node.team?.shortDisplayName||
teamName;

for(const k of Object.keys(node)){

if(
k==='statistics'||
k==='stats'||
k==='groups'||
k==='entries'||
k==='data'||
k==='content'||
k==='teams'||
k==='boxscore'
){

walk(node[k],nextTeam);

}

}

}

walk(d);

return out;

}

function findStandings(d){

const out=[];

function walk(x){

if(!x)return;

if(Array.isArray(x)){

x.forEach(walk);
return;

}

if(typeof x!=='object')return;

if(Array.isArray(x.entries)){

out.push(...x.entries);

}

if(Array.isArray(x.standings?.entries)){

out.push(...x.standings.entries);

}

if(Array.isArray(x.children)){

x.children.forEach(walk);

}

if(Array.isArray(x.groups)){

x.groups.forEach(walk);

}

}

walk(d);

const map=new Map();

out.forEach(x=>{

const id=
x?.team?.id||
x?.team?.uid||
x?.id;

if(id&&!map.has(id))
map.set(id,x);

});

return [...map.values()];

}

<script>

/* =========================================================
   FUTZONE PREMIUM — BLOCO 4 CORRIGIDO
   Dados do jogo directamente pela ESPN
   ========================================================= */

const FZ_WEB='https://site.web.api.espn.com/apis/site/v2/sports/soccer/';
const FZ_SITE='https://site.api.espn.com/apis/site/v2/sports/soccer/';

async function fzJson(url,timeout=15000){

  const c=new AbortController();

  const timer=setTimeout(()=>{
    try{c.abort()}catch(e){}
  },timeout);

  try{

    const r=await fetch(url,{
      cache:'no-store',
      signal:c.signal
    });

    if(!r.ok)throw new Error('HTTP '+r.status);

    return await r.json();

  }catch(e){

    console.warn('FUTZONE API:',url,e);

    return null;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   RESUMO COMPLETO DO JOGO
   ========================================================= */

async function fzSummary(e){

  if(!e)return null;

  const league=
    e?.league?.id||
    e?.competitions?.[0]?.league?.id||
    e?.leagueId||
    'all';

  const id=e.id;

  const urls=[

    FZ_SITE+league+'/summary?event='+encodeURIComponent(id),

    FZ_WEB+league+'/summary?event='+encodeURIComponent(id),

    FZ_SITE+'all/summary?event='+encodeURIComponent(id),

    FZ_WEB+'all/summary?event='+encodeURIComponent(id)

  ];

  for(const url of urls){

    const d=await fzJson(url);

    if(d && (
      d.header||
      d.boxscore||
      d.keyEvents||
      d.plays||
      d.broadcasts||
      d.rosters
    ))return d;

  }

  return null;

}

function fzStatName(name){

  const n=String(name||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');

  const map={

    possession:'Posse',
    possessionpct:'Posse',
    possessionpercentage:'Posse',

    totalshots:'Remates',
    shots:'Remates',
    attemptedshots:'Remates',

    shotsontarget:'Remates à baliza',
    ontarget:'Remates à baliza',

    corners:'Cantos',
    cornerkicks:'Cantos',

    fouls:'Faltas',
    foulscommitted:'Faltas',

    offsides:'Foras de jogo',
    offside:'Foras de jogo',

    saves:'Defesas',
    goalkeepersaves:'Defesas',

    passes:'Passes',
    totalpasses:'Passes',
    accuratepasses:'Passes',

    passaccuracy:'Precisão de passe',
    passingaccuracy:'Precisão de passe'

  };

  return map[n]||null;

}


function fzExtractStats(d){

  const result=[];

  const teams=
    d?.boxscore?.teams||
    d?.boxscore?.teamStatistics||
    [];

  if(Array.isArray(teams)){

    teams.forEach(t=>{

      const team=
        t?.team?.displayName||
        t?.team?.shortDisplayName||
        '';

      const stats=
        t?.statistics||
        t?.stats||
        [];

      if(Array.isArray(stats)){

        stats.forEach(s=>{

          const label=fzStatName(
            s?.name||
            s?.label||
            s?.displayName
          );

          if(!label)return;

          const value=
            s?.displayValue??
            s?.value;

          if(value!==undefined&&value!==null){

            result.push({
              label,
              team,
              value
            });

          }

        });

      }

    });

  }

  /* fallback: procura estatísticas recursivamente */

  if(!result.length){

    function walk(x){

      if(!x)return;

      if(Array.isArray(x)){

        x.forEach(walk);
        return;

      }

      if(typeof x!=='object')return;

      const label=fzStatName(
        x.name||
        x.label||
        x.displayName
      );

      if(label){

        const value=
          x.displayValue??
          x.value;

        if(value!==undefined&&value!==null){

          result.push({
            label,
            team:'',
            value
          });

        }

      }

      Object.values(x).forEach(v=>{

        if(v&&typeof v==='object')
          walk(v);

      });

    }

    walk(d);

  }

  return result;

}


async function loadStatistics(e){

  const box=document.getElementById('statsBox');

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A carregar estatísticas...</div>';

    'Cantos',
    'Faltas',
    'Foras de jogo',
    'Defesas',
    'Passes',
    'Precisão de passe'

  ];

  const rows=[];

  wanted.forEach(label=>{

    const found=stats.filter(
      x=>x.label===label
    );

    if(!found.length)return;

    const vals=found
      .slice(0,2)
      .map(x=>x.value);

    rows.push({

      label,

      value:vals.join(' — ')

    });

  });

  if(!rows.length){

    box.innerHTML=
      '<div class="muted">Estatísticas detalhadas não disponíveis para este jogo.</div>';

    return;

  }

  box.innerHTML=`

    <div class="statsgrid">

      ${rows.map(x=>`

        <div class="statbox">

          <b>${esc(x.value)}</b>

          <span>${esc(x.label)}</span>

        </div>

      `).join('')}

    </div>

  `;

}

function fzFindRosters(d){

  const out=[];

  function walk(x){

    if(!x)return;

    if(Array.isArray(x)){

      x.forEach(walk);
      return;

    }

    if(typeof x!=='object')return;

    if(Array.isArray(x.roster))
      out.push(...x.roster);

    if(Array.isArray(x.players))
      out.push(...x.players);

    Object.keys(x).forEach(k=>{

      if(
        k==='rosters'||
        k==='teams'||
        k==='roster'||
        k==='players'
      ){

        walk(x[k]);

      }

    });

  }

  walk(d);

  return out;

}


function fzPlayerName(p){

  return p?.athlete?.displayName||
    p?.athlete?.fullName||
    p?.player?.displayName||
    p?.player?.fullName||
    p?.displayName||
    p?.fullName||
    p?.name||
    '';

}


function fzIsStarter(p){

  if(p?.starter===true)return true;

  if(p?.isStarter===true)return true;

  if(p?.starter?.value===true)return true;

  if(
    String(
      p?.position?.displayName||
      p?.position?.name||
      ''
    ).toLowerCase().includes('starter')
  )return true;

  return false;

}


async function loadLineups(e){

  const box=document.getElementById('lineupBox');

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A carregar 11 titular...</div>';

  const d=await fzSummary(e);

  const rosters=fzFindRosters(d);

  const homeId=String(
    teamFromEvent(e,true)?.team?.id||''
  );

  const awayId=String(
    teamFromEvent(e,false)?.team?.id||''
  );

  let home=[];
  let away=[];

  rosters.forEach(r=>{

    const tid=String(
      r?.team?.id||
      r?.team?.uid||
      ''
    );

    const player=
      r?.athlete||
      r?.player?
        r:
        r;

    if(tid===homeId)
      home.push(player);

    else if(tid===awayId)
      away.push(player);

  });

  /* fallback: alguns feeds colocam os atletas directamente */

  if(!home.length||!away.length){

    const raw=
      d?.rosters||
      d?.boxscore?.rosters||
      [];

    if(Array.isArray(raw)){

      raw.forEach(r=>{

        const tid=String(r?.team?.id||'');

        const players=
          r?.roster||
          r?.players||
          [];

        if(tid===homeId)
          home=players;

        if(tid===awayId)
          away=players;

      });

    }

  }

  function starters(arr){

    const s=arr.filter(fzIsStarter);

    if(s.length>=11)
      return s.slice(0,11);

    return arr.slice(0,11);

  }

  home=starters(home);
  away=starters(away);

  function renderTeam(name,players){

    return`

      <div>

        <div class="value">
          ${esc(name)}
        </div>

        <div class="roster">

          ${players.map((p,i)=>`

            <div class="player">

              <b>
                ${i+1}. ${esc(fzPlayerName(p)||'Jogador')}
              </b>

              <div class="pos">
                ${esc(
                  p?.position?.displayName||
                  p?.position?.abbreviation||
                  p?.position||
                  ''
                )}
              </div>

            </div>

          `).join('')}

        </div>

      </div>

    `;

  }

  if(!home.length&&!away.length){

    box.innerHTML=
      '<div class="muted">11 titular ainda não disponível para este jogo.</div>';

    return;

  }

  box.innerHTML=`

    <div class="lineups">

      ${renderTeam(
        teamNameFromEvent(e,true),
        home
      )}

      ${renderTeam(
        teamNameFromEvent(e,false),
        away
      )}

    </div>

  `;

}

async function fzTeamSchedule(teamId){

      String(e?.status?.type?.state||'').toLowerCase()==='post'||
      String(e?.status?.type?.name||'').toLowerCase()==='status_final'

        String(x?.team?.id)===String(teamId)

        <span>${esc(r.opponent)}</span>

        </b>

      </div>

async function loadWatch(e){

  if(!box)return;

  box.innerHTML=
    '<div class="loading">A procurar transmissão...</div>';

  const d=await fzSummary(e);

      names.push(...x.names);

    if(x.name)

    const name=[...new Set(names)].join(' / ');

    const url=
      x.url||
      x.links?.web?.href||
      x.market?.url||
      '';

    if(!list.some(y=>y.name===name))

  const b1=d?.broadcasts;

  if(Array.isArray(b1))
    b1.forEach(addBroadcast);

  const b2=d?.header?.competitions?.[0]?.broadcasts;

    b2.forEach(addBroadcast);

function fzEntries(d){

  const out=[];

  function walk(x){

    if(!x)return;

    if(Array.isArray(x)){

      x.forEach(walk);
      return;

    }

    if(typeof x!=='object')return;

    if(Array.isArray(x.entries))
      out.push(...x.entries);

    if(Array.isArray(x.standings?.entries))
      out.push(...x.standings.entries);

    Object.keys(x).forEach(k=>{

      if(
        k==='children'||
        k==='groups'||
        k==='standings'||
        k==='content'
      ){

        walk(x[k]);

      }

    });

  }

  walk(d);

  const map=new Map();

  out.forEach(x=>{

    const id=
      x?.team?.id||
      x?.team?.uid||
      x?.uid;

    if(id&&!map.has(id))
      map.set(id,x);

  });

  return [...map.values()];

}


function fzStat(entry,names){

  const arr=entry?.stats||[];

  for(const name of names){

    const x=arr.find(s=>
      String(s?.name||'').toLowerCase()===name
    );

    if(x)
      return x.displayValue??x.value;

  }

  return '—';

}

async function fzTranslate(text){

  if(!text)return '';

  try{

    const url=
      'https://translate.googleapis.com/translate_a/single'+
      '?client=gtx'+
      '&sl=auto'+
      '&tl=pt'+
      '&dt=t'+
      '&q='+encodeURIComponent(text);

    const d=await fzJson(url,8000);

    if(Array.isArray(d?.[0])){

      return d[0]
        .map(x=>x?.[0]||'')
        .join('');

    }

  }catch(e){}

  return text;

}

      }

  /* tradução assíncrona */

  for(let i=0;i<articles.length;i++){

  const ids=new Set();


  /*
     Carregamos 4 ligas de cada vez.
     Assim não sobrecarrega o telemóvel,
     mas nenhum pedido cancela outro.
  */

  for(
    let i=0;
    i<LEAGUES.length;
    i+=4
  ){

    const batch =
      LEAGUES.slice(
        i,
        i+4
      );


    const results =
      await Promise.all(

        batch.map(
          async ([league,name])=>{

            try{

              const data =
                await jsonUrl(
                  API+
                  league+
                  '/scoreboard?limit=100',
                  15000
                );


              return (
                data?.events || []
              ).map(e=>({

                ...e,

                leagueName:
                  name

            }catch(error){

              console.warn(
                'FUTZONE liga:',
                league,
                error
              );

              return [];

            }

          }
        )

      );


    results
      .flat()
      .forEach(e=>{

        const id =
          String(e?.id || '');

        if(
          id &&
          !ids.has(id)
        ){

          ids.add(id);

          all.push(e);

        }

      });

  all.sort(
    (a,b)=>
      new Date(a.date) -
      new Date(b.date)
  );


  games=all;


  /* Mostrar todos os jogos separados pelas ligas */

  window.suggestions();


  const count =
    document.getElementById(
      'count'
    );

  if(count){

      games.length +
      (
        games.length===1
          ? ' jogo'

      '<div class="loading">A procurar os últimos 5 jogos...</div>';

      const urls = [

        '/schedule?limit=100',

      events = events.filter(e => {

        new Date(b.date || 0) - new Date(a.date || 0)
      );

      /* Retira possíveis duplicados */
      const seen = new Set();

      events = events.filter(e => {

        const key = String(e.id || '') +
          '|' + String(e.date || '');

        if(seen.has(key)) return false;

        seen.add(key);
        return true;

      });

      events = events.slice(0,5);

  function fzFinished(e){

    const s=e?.status?.type;

    if(s?.completed===true) return true;
    if(s?.state==='post') return true;

    if(
      e?.status?.type?.name==='STATUS_FINAL' ||
      e?.status?.type?.name==='STATUS_FULL_TIME'
    ) return true;

    return false;
  }


  function fzTeamScore(c){

    const v=c?.score?.value;

    if(v!==undefined && v!==null && v!==''){
      const n=Number(v);
      if(Number.isFinite(n)) return n;
    }

    const d=c?.score?.displayValue;

    if(d!==undefined && d!==null){
      const n=parseInt(String(d),10);
      if(Number.isFinite(n)) return n;
    }

    return null;
  }


  function fzResult(e,teamId){

    const competitors=
      e?.competitions?.[0]?.competitors || [];

    const opponent=competitors.find(c=>
      String(c?.team?.id)!==String(teamId)
    );

    if(!mine || !opponent) return null;

    const gf=fzTeamScore(mine);

    if(gf===null || ga===null) return null;

    let result='E';

      if(Array.isArray(x?.names))
        names.push(...x.names);

      if(x?.name)
        names.push(x.name);

      if(x?.media?.shortName)
        names.push(x.media.shortName);

      if(x?.station?.name)
        names.push(x.station.name);

      const url=
        x?.url||
        x?.market?.url||
        x?.links?.web?.href||
        '';

      const country=
        x?.market?.country?.name||
        x?.market?.country||
        x?.region||
        '';

      names.forEach(n=>add(n,url,country));

    });

  }catch(err){}


  /* ESPN summary */

  try{

    const d=await fzSummary(e);

    const arrays=[
      d?.broadcasts,
      d?.header?.competitions?.[0]?.broadcasts,
      d?.header?.competitions?.[0]?.geoBroadcasts
    ];

    arrays.forEach(arr=>{

      if(!Array.isArray(arr))return;

      arr.forEach(x=>{

        const names=[];

        if(Array.isArray(x?.names))
          names.push(...x.names);

        if(x?.name)
          names.push(x.name);

        if(x?.media?.shortName)
          names.push(x.media.shortName);

        if(x?.station?.name)
          names.push(x.station.name);

        const url=
          x?.url||
          x?.links?.web?.href||
          x?.market?.url||
          '';

        const country=
          x?.market?.country?.name||
          x?.market?.country||
          x?.region||
          '';

        names.forEach(n=>add(n,url,country));

      });

    });

  }catch(err){}


  /* SofaScore */

  try{

    const sid=await sofaEventId(e);

    if(sid){

      const d=await fzJson(
        SOFA+'/event/'+sid+'/tv-stations'
      );

      const stations=d?.tvStations||[];

      if(Array.isArray(stations)){

        stations.forEach(x=>{

          add(
            x?.station?.name||
            x?.name,
            x?.url||
            x?.station?.url||
            '',
            x?.country?.name||
            x?.country?.alpha2||
            ''
          );

        });

      }

    }

  }catch(err){}


  if(!list.length){

    box.innerHTML=
      '<div class="muted">Não foi indicada uma transmissão para este jogo.</div>';

    return;
  }

  box.innerHTML=`

    <div class="fz-fix-watch">

      ${list.map(x=>`

        <div class="fz-fix-watch-row">

          <div>

            <div class="fz-fix-channel">
              📺 ${esc(x.name)}
            </div>

            ${
              x.country
              ?
              `<div class="muted fz-fix-country">
                ${esc(x.country)}
              </div>`
              :
              ''
            }

          </div>

          ${
            x.url
            ?
            `<a
              href="${esc(x.url)}"
              target="_blank"
              rel="noopener"
              class="fz-fix-watch-button">
              Ver
            </a>`
            :
            ''
          }

        </div>

      `).join('')}

    </div>

  `;

}

/* ---------- NOTÍCIAS PT ---------- */

async function FZ_NEWS_FIX(){

  const box=document.getElementById('newsList');
  if(!box)return;

  box.innerHTML=
    '<div class="loading">A carregar notícias...</div>';

  try{

    const d=await fzJson(
      FZ_SITE+'news'
    );

    let articles=
      d?.articles||
      d?.news||
      d?.items||
      [];

    if(!Array.isArray(articles))
      articles=[];

    articles=articles.slice(0,15);

    if(!articles.length){

      box.innerHTML=
        '<div class="muted">Não existem notícias disponíveis.</div>';

      return;
    }

    box.innerHTML=articles.map((x,i)=>`

      <div class="card" style="margin-bottom:8px">

        <div id="fzFixNewsTitle${i}" class="value">
          ${esc(x?.headline||x?.title||'Notícia')}
        </div>

        ${
          x?.description||
          x?.summary
          ?
          `<div
             id="fzFixNewsDesc${i}"
             class="muted"
             style="margin-top:6px">
             ${esc(x.description||x.summary||'')}
           </div>`
          :
          ''
        }

        ${
          x?.links?.web?.href
          ?
          `<a
             href="${esc(x.links.web.href)}"
             target="_blank"
             rel="noopener"
             style="display:block;margin-top:8px;color:#1683ff;font-size:11px">
             Ler notícia
           </a>`
          :
          ''
        }

      </div>

    `).join('');

    /* Tradução em paralelo */

    await Promise.all(
      articles.map(async(x,i)=>{

        const title=
          x?.headline||
          x?.title||
          '';

        const desc=
          x?.description||
          x?.summary||
          '';

        try{

          if(title){

            const pt=await fzTranslate(title);

            const el=document.getElementById(
              'fzFixNewsTitle'+i
            );

            if(el && pt)
              el.textContent=pt;

          }

        }catch(err){}

        try{

          if(desc){

            const pt=await fzTranslate(desc);

            const el=document.getElementById(
              'fzFixNewsDesc'+i
            );

            if(el && pt)
              el.textContent=pt;

          }

        }catch(err){}

      })
    );

  }catch(err){

    console.warn('FUTZONE Notícias',err);

    box.innerHTML=
      '<div class="muted">Não foi possível carregar as notícias.</div>';

  }

}
