<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2
   JOGOS + DATAS + TODAS AS LIGAS + AO VIVO + TABELAS
   ========================================================= */

const FZ_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const FZ_STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [
  { id:"por.1", name:"Liga Portugal", flag:"🇵🇹" },
  { id:"por.2", name:"Liga Portugal 2", flag:"🇵🇹" },
  { id:"por.3", name:"Liga 3", flag:"🇵🇹" },
  { id:"por.w.1", name:"Liga BPI Feminina", flag:"🇵🇹" },

  { id:"eng.1", name:"Premier League", flag:"🇬🇧" },
  { id:"eng.2", name:"Championship", flag:"🇬🇧" },

  { id:"esp.1", name:"LaLiga", flag:"🇪🇸" },
  { id:"esp.2", name:"LaLiga 2", flag:"🇪🇸" },

  { id:"ita.1", name:"Serie A", flag:"🇮🇹" },
  { id:"ita.2", name:"Serie B", flag:"🇮🇹" },

  { id:"ger.1", name:"Bundesliga", flag:"🇩🇪" },
  { id:"ger.2", name:"2. Bundesliga", flag:"🇩🇪" },

  { id:"fra.1", name:"Ligue 1", flag:"🇫🇷" },
  { id:"fra.2", name:"Ligue 2", flag:"🇫🇷" },

  { id:"ned.1", name:"Eredivisie", flag:"🇳🇱" },
  { id:"bel.1", name:"Belgian Pro League", flag:"🇧🇪" },

  { id:"ksa.1", name:"Saudi Pro League", flag:"🇸🇦" },
  { id:"usa.1", name:"MLS", flag:"🇺🇸" },

  { id:"uefa.champions", name:"Champions League", flag:"🏆" },
  { id:"uefa.europa", name:"Europa League", flag:"🏆" },
  { id:"uefa.europa.conf", name:"Conference League", flag:"🏆" }
];

/* =========================================================
   ESTADO
   ========================================================= */

let FZ_ligaSelecionada = "ALL";
let FZ_modo = "jogos";
let FZ_dataSelecionada = FZ_dataISO(new Date());
let FZ_aAtualizar = null;
let FZ_carregando = false;

/* =========================================================
   DATAS
   ========================================================= */

function FZ_dataISO(data = new Date()) {
  const d = new Date(data);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2,"0");
  const dia = String(d.getDate()).padStart(2,"0");
  return `${ano}-${mes}-${dia}`;
}

function FZ_dataAPI(iso) {
  return String(iso).replace(/-/g,"");
}

function FZ_dataObj(iso) {
  const [a,m,d] = iso.split("-").map(Number);
  return new Date(a,m-1,d);
}

function FZ_formatarData(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function FZ_dataCurta(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    day:"2-digit",
    month:"2-digit"
  });
}

function FZ_mudarData(dias) {
  const d = FZ_dataObj(FZ_dataSelecionada);
  d.setDate(d.getDate() + dias);

  FZ_dataSelecionada = FZ_dataISO(d);

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_irHoje() {
  FZ_dataSelecionada = FZ_dataISO(new Date());

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_dataEscolhida(valor) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return;

  FZ_dataSelecionada = valor;

  FZ_renderDataBarra();
  FZ_carregarModo();
}

/* =========================================================
   FETCH SEGURO
   ========================================================= */

async function FZ_fetch(url) {

  const controlador = new AbortController();

  const tempo = setTimeout(() => {
    controlador.abort();
  }, 15000);

  try {

    const resposta = await fetch(url, {
      method:"GET",
      cache:"no-store",
      signal:controlador.signal
    });

    if (!resposta.ok) {
      throw new Error("HTTP " + resposta.status);
    }

    return await resposta.json();

  } finally {
    clearTimeout(tempo);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */

function FZ_liga(id) {
  return FZ_LIGAS.find(l => l.id === id);
}

function FZ_nomeLiga(id) {
  const liga = FZ_liga(id);
  return liga ? `${liga.flag} ${liga.name}` : id;
}

function FZ_escape(valor) {
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function FZ_horaEvento(evento) {

  if (!evento.date) return "--:--";

  const d = new Date(evento.date);

  return d.toLocaleTimeString("pt-PT", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function FZ_dataEvento(evento) {

  if (!evento.date) return "";

  return FZ_dataISO(new Date(evento.date));
}

function FZ_nomeEquipa(team) {

  return (
    team?.displayName ||
    team?.shortDisplayName ||
    team?.name ||
    "Equipa"
  );
}

function FZ_logoEquipa(team) {

  return (
    team?.logo ||
    team?.logos?.[0]?.href ||
    ""
  );
}

/* =========================================================
   BARRA DE COMPETIÇÕES
   ========================================================= */

function FZ_renderCompeticoes() {

  const el = document.getElementById("competicoes");

  if (!el) return;

  let html = `
    <button
      class="league-chip ${FZ_ligaSelecionada === "ALL" ? "active" : ""}"
      data-liga="ALL">
      🌍 Todas
    </button>
  `;

  for (const liga of FZ_LIGAS) {

    html += `
      <button
        class="league-chip ${FZ_ligaSelecionada === liga.id ? "active" : ""}"
        data-liga="${liga.id}">
        ${liga.flag} ${FZ_escape(liga.name)}
      </button>
    `;
  }

  el.innerHTML = html;
}

function FZ_selecionarLiga(id) {

  FZ_ligaSelecionada = id;

  FZ_renderCompeticoes();

  if (FZ_modo === "tabelas" && id === "ALL") {
    FZ_carregarModo();
    return;
  }

  FZ_carregarModo();
}

/* =========================================================
   BARRA DE DATA
   ========================================================= */

function FZ_renderDataBarra() {

  let barra = document.getElementById("fzDataBar");

  if (!barra) {

    barra = document.createElement("div");

    barra.id = "fzDataBar";

    const conteudo = document.getElementById("conteudo");

    if (conteudo && conteudo.parentNode) {
      conteudo.parentNode.insertBefore(barra, conteudo);
    } else {
      document.body.appendChild(barra);
    }
  }

  const hoje = FZ_dataISO(new Date());

  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);

  const amanha = new Date();
  amanha.setDate(amanha.getDate() + 1);

  const ontemISO = FZ_dataISO(ontem);
  const amanhaISO = FZ_dataISO(amanha);

  barra.innerHTML = `
    <div style="
      background:#03060B;
      border:1px solid #722F37;
      border-radius:14px;
      padding:10px;
      margin:10px 0;
    ">

      <div style="
        display:flex;
        align-items:center;
        gap:6px;
      ">

        <button
          onclick="FZ_mudarData(-1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ‹
        </button>

        <button
          onclick="FZ_dataEscolhida('${ontemISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === ontemISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === ontemISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          ONTEM
          <br>
          <small>${FZ_dataCurta(ontemISO)}</small>
        </button>

        <button
          onclick="FZ_irHoje()"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === hoje ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === hoje ? "#0057B8" : "#0D1724"};
            color:white;
            font-weight:700;
          ">
          HOJE
          <br>
          <small>${FZ_dataCurta(hoje)}</small>
        </button>

        <button
          onclick="FZ_dataEscolhida('${amanhaISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === amanhaISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === amanhaISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          AMANHÃ
          <br>
          <small>${FZ_dataCurta(amanhaISO)}</small>
        </button>

        <button
          onclick="FZ_mudarData(1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ›
        </button>

      </div>

      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-top:9px;
      ">

        <input
          id="fzCalendar"
          type="date"
          value="${FZ_dataSelecionada}"
          onchange="FZ_dataEscolhida(this.value)"
          style="
            flex:1;
            min-height:42px;
            border-radius:10px;
            border:1px solid #333;
            background:#0D1724;
            color:white;
            padding:0 10px;
          "
        >

        <button
          onclick="FZ_carregarModo()"
          style="
            min-width:46px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#0057B8;
            color:white;
            font-size:20px;
          ">
          🔄
        </button>

      </div>

      <div style="
        text-align:center;
        color:#D9DEE8;
        font-size:13px;
        margin-top:8px;
        text-transform:capitalize;
      ">
        ${FZ_escape(FZ_formatarData(FZ_dataSelecionada))}
      </div>

    </div>
  `;
}

/* =========================================================
   ESTADO
   ========================================================= */

function FZ_estado(texto, erro=false) {

  const el = document.getElementById("estado");

  if (!el) return;

  el.innerHTML = `
    <div style="
      padding:10px;
      text-align:center;
      color:${erro ? "#FF4054" : "#9DAABB"};
      font-size:13px;
    ">
      ${FZ_escape(texto)}
    </div>
  `;
}

/* =========================================================
   CARD DE JOGO
   ========================================================= */

function FZ_cardJogo(evento, ligaId) {

  const comp = evento.competitions?.[0];

  const competitors = comp?.competitors || [];

  const casa =
    competitors.find(x => x.homeAway === "home") ||
    competitors[0];

  const fora =
    competitors.find(x => x.homeAway === "away") ||
    competitors[1];

  const casaNome = FZ_nomeEquipa(casa?.team);
  const foraNome = FZ_nomeEquipa(fora?.team);

  const casaLogo = FZ_logoEquipa(casa?.team);
  const foraLogo = FZ_logoEquipa(fora?.team);

  const status = evento.status?.type;

  const concluido =
    status?.completed === true ||
    status?.state === "post";

  const aoVivo =
    status?.state === "in" ||
    status?.name === "STATUS_IN_PROGRESS";

  let hora = FZ_horaEvento(evento);

  if (aoVivo) {
    hora = "🔴 AO VIVO";
  }

  if (concluido) {
    hora = "FINAL";
  }

  const scoreCasa =
    casa?.score ??
    "-";

  const scoreFora =
    fora?.score ??
    "-";

  const ligaNome = FZ_nomeLiga(ligaId);

  return `
    <div
      class="fz-game-card"
      style="
        background:#09111C;
        border:1px solid ${aoVivo ? "#722F37" : "#1B2635"};
        border-radius:15px;
        padding:12px;
        margin:8px 0;
        box-shadow:0 3px 12px rgba(0,0,0,.25);
      "
      onclick="FZ_abrirJogoSeguro('${FZ_escape(evento.id)}','${FZ_escape(ligaId)}')"
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:#9DAABB;
        font-size:11px;
        margin-bottom:10px;
      ">
        <span>${FZ_escape(ligaNome)}</span>
        <strong style="
          color:${aoVivo ? "#FF4054" : concluido ? "#9DAABB" : "#1683FF"};
        ">
          ${hora}
        </strong>
      </div>

      <div style="
        display:grid;
        grid-template-columns:1fr 55px 1fr;
        align-items:center;
        gap:6px;
      ">

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            casaLogo
            ? `<img src="${FZ_escape(casaLogo)}"
                    style="width:38px;height:38px;object-fit:contain;display:block;margin:auto auto 5px;">`
            : `<div style="height:43px;"></div>`
          }

          <div>${FZ_escape(casaNome)}</div>
        </div>

        <div style="
          text-align:center;
          font-size:20px;
          font-weight:900;
          color:white;
        ">
          ${scoreCasa}
          <br>
          <span style="font-size:12px;color:#9DAABB;">-</span>
          <br>
          ${scoreFora}
        </div>

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            foraLogo

/* =========================================================
   BUSCAR JOGOS DE UMA LIGA
   ========================================================= */

async function FZ_buscarJogosLiga(ligaId, dataISO) {

  const data = FZ_dataAPI(dataISO);

  const url =
    `${FZ_API}${ligaId}/scoreboard?dates=${data}`;

  const json = await FZ_fetch(url);

  const eventos = Array.isArray(json.events)
    ? json.events
    : [];

  return {
    ligaId,
    eventos
  };
}

/* =========================================================
   BUSCAR TODAS AS LIGAS
   ========================================================= */

async function FZ_buscarTodasAsLigas(dataISO) {

  const resultados = [];

  const tamanhoLote = 5;

  for (
    let inicio = 0;
    inicio < FZ_LIGAS.length;
    inicio += tamanhoLote
  ) {

    const lote = FZ_LIGAS.slice(
      inicio,
      inicio + tamanhoLote
    );

    const respostas = await Promise.allSettled(
      lote.map(liga =>
        FZ_buscarJogosLiga(liga.id,dataISO)
      )
    );

    respostas.forEach((r,i) => {

      if (r.status === "fulfilled") {

        resultados.push(r.value);

      } else {

        console.warn(
          "Falha ao carregar",
          lote[i].id,
          r.reason
        );

        resultados.push({
          ligaId:lote[i].id,
          eventos:[]
        });
      }
    });
  }

  return resultados;
}

/* =========================================================
   STANDINGS — EXTRAIR ENTRIES
   ========================================================= */

function FZ_extrairEntries(obj) {

  const encontrados = [];
  const vistos = new Set();

  function procurar(valor) {

    if (!valor || typeof valor !== "object") {
      return;
    }

    if (Array.isArray(valor.entries)) {

      valor.entries.forEach(entry => {

        if (
          entry &&
          entry.team &&
          entry.team.id
        ) {

          if (!vistos.has(entry.team.id)) {

            vistos.add(entry.team.id);
            encontrados.push(entry);
          }
        }
      });
    }

    Object.keys(valor).forEach(chave => {

      const item = valor[chave];

      if (
        item &&
        typeof item === "object"
      ) {
        procurar(item);
      }
    });
  }

  procurar(obj);

  return encontrados;
}

/* =========================================================
   STAT DAS CLASSIFICAÇÕES
   ========================================================= */

function FZ_stat(entry,nome,alternativas=[]) {

  const nomes = [
    nome,
    ...alternativas
  ];

  const stats =
    Array.isArray(entry.stats)
      ? entry.stats
      : [];

  const stat =
    stats.find(s =>
      nomes.includes(s.name)
    );

  if (!stat) return "-";

  return (
    stat.displayValue ??
    stat.value ??
    "-"
  );
}

/* =========================================================
   COMPETIÇÕES / JORNADAS
   ========================================================= */

async function FZ_jornadas() {

  const conteudo = document.getElementById("conteudo");

  if (!conteudo) return;

  if (FZ_ligaSelecionada === "ALL") {

    conteudo.innerHTML = `
      <div style="
        background:#09111C;
        border-radius:15px;
        padding:25px;
        text-align:center;
        color:#9DAABB;
      ">

        <div style="font-size:40px;">📅</div>

        <h3 style="color:white;">
          Escolhe uma competição
        </h3>

        <p>
          Seleciona uma liga para consultar
          resultados passados e jogos futuros.
        </p>

      </div>
    `;

    FZ_estado("Seleciona uma competição.");

    return;
  }

  const liga = FZ_liga(FZ_ligaSelecionada);

  conteudo.innerHTML = `
    <div style="
      text-align:center;
      padding:30px;
      color:#9DAABB;
    ">
      📅 A carregar jornadas...
    </div>
  `;

  FZ_estado(
    `A procurar resultados e próximos jogos de ${liga?.name || ""}...`
  );

  try {

    const centro = FZ_dataObj(FZ_dataSelecionada);

    const inicio = new Date(centro);
    inicio.setDate(inicio.getDate() - 45);

    const fim = new Date(centro);
    fim.setDate(fim.getDate() + 90);

    const dataInicio = FZ_dataAPI(FZ_dataISO(inicio));
    const dataFim = FZ_dataAPI(FZ_dataISO(fim));

    const url =
      `${FZ_API}${FZ_ligaSelecionada}/scoreboard?dates=${dataInicio}-${dataFim}`;

    const dados = await FZ_fetch(url);

    const eventos =
      Array.isArray(dados.events)
        ? dados.events
        : [];

    const porDia = {};

    eventos.forEach(evento => {

      const data = FZ_dataEvento(evento);

      if (!data) return;

      if (!porDia[data]) {
        porDia[data] = [];
      }

      porDia[data].push(evento);
    });

    const dias =
      Object.keys(porDia)
        .sort((a,b) =>
          FZ_dataObj(a) - FZ_dataObj(b)
        );

    if (!dias.length) {

      conteudo.innerHTML = `
        <div style="
          background:#09111C;
          border-radius:15px;
          padding:25px;
          text-align:center;
          color:#9DAABB;
        ">

          <div style="font-size:40px;">📅</div>

          <h3 style="color:white;">
            Sem jogos disponíveis
          </h3>

          <p>
            A fonte de dados não devolveu
            jornadas para este período.
          </p>

        </div>
      `;

      return;
    }

    conteudo.innerHTML = dias.map(data => {

      const lista = porDia[data];

      const passado =
        FZ_dataObj(data) < FZ_dataObj(FZ_dataSelecionada);

      const titulo =
        passado
        ? "RESULTADOS"
        : data === FZ_dataSelecionada
          ? "HOJE"
          : "PRÓXIMOS JOGOS";

      return `
        <section style="margin-bottom:20px;">

          <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:9px 5px;
          ">

            <strong style="color:white;">
              ${titulo}
            </strong>

            <span style="color:#9DAABB;font-size:12px;">
              ${FZ_escape(
                new Date(data + "T12:00:00")
                  .toLocaleDateString("pt-PT",{
                    weekday:"short",
                    day:"2-digit",
                    month:"2-digit"
                  })
              )}
            </span>

          </div>

          ${lista
            .sort((a,b)=>
              new Date(a.date)-new Date(b.date)
            )
            .map(ev =>
              FZ_cardJogo(ev,FZ_ligaSelecionada)
            )
            .join("")}

        </section>
      `;

    }).join("");

    FZ_estado(
      `${eventos.length} jogos encontrados no período`
    );

  } catch(e) {

    console.error(e);

    conteudo.innerHTML = `
      <div style="
        background:#09111C;
        border-radius:15px;
        padding:25px;
        text-align:center;
        color:white;
      ">

        <div style="font-size:40px;">⚠️</div>

        <h3>Não foi possível carregar as jornadas</h3>

        <button
          onclick="FZ_jornadas()"
          style="
            border:0;
            border-radius:9px;
            padding:10px 16px;
            background:#0057B8;
            color:white;
          ">
          🔄 Tentar novamente
        </button>

      </div>
    `;

    FZ_estado(
      "Erro ao carregar jornadas.",
      true
    );
  }
}

/* =========================================================
   EQUIPA — COMPATIBILIDADE COM BLOCO 3
   ========================================================= */

function FZ_abrirEquipaSeguro(id,liga) {

  if (!id) return;

  if (typeof FZ_abrirEquipa === "function") {
    return FZ_abrirEquipa(id,liga);
  }

  FZ_estado("A abrir equipa...");

  const url =
    `${FZ_API}${liga}/teams/${id}`;

  FZ_fetch(url)
    .then(dados => {

      const conteudo =
        document.getElementById("conteudo");

      if (!conteudo) return;

      const team =
        dados.team || dados;

      conteudo.innerHTML = `
        <div style="
          background:#09111C;
          border-radius:15px;
          padding:20px;
          color:white;
        ">

          <button
            onclick="FZ_carregarModo()"
            style="
              border:0;
              border-radius:9px;
              padding:9px 14px;
              background:#722F37;
              color:white;
            ">
            ← Voltar
          </button>

          <div style="text-align:center;margin-top:20px;">

            ${
              FZ_logoEquipa(team)
              ? `<img src="${FZ_escape(FZ_logoEquipa(team))}"
                      style="width:90px;height:90px;object-fit:contain;">`
              : ""
            }

            <h2>
              ${FZ_escape(FZ_nomeEquipa(team))}
            </h2>

          </div>

        </div>
      `;

    })
    .catch(() => {
      FZ_estado(
        "Não foi possível carregar a equipa.",
        true
      );
    });
}

/* =========================================================
   MODOS
   ========================================================= */

async function FZ_carregarModo() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();

  if (FZ_modo === "jogos") {
    await FZ_jogosDoDia();
    return;
  }

  if (FZ_modo === "jornadas") {
    await FZ_jornadas();
    return;
  }

  if (FZ_modo === "tabelas") {
    await FZ_carregarTabelas();
    return;
  }

  if (FZ_modo === "ao-vivo") {
    await FZ_aoVivo();
    return;
  }

  await FZ_jogosDoDia();
}

/* =========================================================
   MUDAR MODO
   ========================================================= */

function FZ_mudarModo(modo) {

  FZ_modo = modo;

  document
    .querySelectorAll("[data-modo]")
    .forEach(botao => {

      botao.classList.toggle(
        "active",
        botao.dataset.modo === modo
      );
    });

  FZ_carregarModo();
}

/* =========================================================
   CLIQUES
   ========================================================= */

document.addEventListener("click", function(event) {

  const liga =
    event.target.closest("[data-liga]");

  if (liga) {

    FZ_selecionarLiga(
      liga.dataset.liga
    );

    return;
  }

  const modo =
    event.target.closest("[data-modo]");

  if (modo) {

    const valor =
      modo.dataset.modo;

    if (valor === "aoVivo") {
      FZ_mudarModo("ao-vivo");
    } else {
      FZ_mudarModo(valor);
    }
  }
});

/* =========================================================
   AUTO REFRESH
   ========================================================= */

function FZ_configurarAtualizacao() {

  if (FZ_aAtualizar) {
    clearInterval(FZ_aAtualizar);
  }

  FZ_aAtualizar = setInterval(() => {

    const hoje =
      FZ_dataISO(new Date());

    if (
      FZ_dataSelecionada === hoje ||
      FZ_modo === "ao-vivo"
    ) {

      FZ_carregarModo();

    }

  }, FZ_modo === "ao-vivo" ? 30000 : 60000);
}

/* =========================================================
   INICIAR
   ========================================================= */

function FZ_iniciar() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();
  FZ_configurarAtualizacao();

  FZ_carregarModo();
}

window.FZ_dataEscolhida = FZ_dataEscolhida;
window.FZ_mudarData = FZ_mudarData;
window.FZ_irHoje = FZ_irHoje;
window.FZ_jogosDoDia = FZ_jogosDoDia;
window.FZ_aoVivo = FZ_aoVivo;
window.FZ_jornadas = FZ_jornadas;
window.FZ_carregarTabelas = FZ_carregarTabelas;
window.FZ_carregarModo = FZ_carregarModo;
window.FZ_mudarModo = FZ_mudarModo;
window.FZ_selecionarLiga = FZ_selecionarLiga;
window.FZ_abrirJogoSeguro = FZ_abrirJogoSeguro;
window.FZ_abrirEquipaSeguro = FZ_abrirEquipaSeguro;

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    FZ_iniciar
  );

} else {

  FZ_iniciar();
}

</script>

<script>
/* =========================================================
   FUTZONE — BLOCO 4
   FUTSAL
   JOGOS • DATAS • AO VIVO • COMPETIÇÕES • CLASSIFICAÇÕES
   ========================================================= */

(function(){

  const FZ4_API =
    "https://www.sofascore.com/api/v1";

  let FZ4_data = new Date();

  function esc(v){
    return String(v ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function dateISO(d){

    return [
      d.getFullYear(),
      String(d.getMonth()+1).padStart(2,"0"),
      String(d.getDate()).padStart(2,"0")
    ].join("-");
  }

  async function get(url){

    const r=await fetch(
      url,
      {
        cache:"no-store"
      }
    );

    if(!r.ok)
      throw new Error("HTTP "+r.status);

    return await r.json();
  }

  function area(){

    return document.getElementById(
      "conteudo"
    );
  }

  /* =====================================================
     ENTRADA FUTSAL
     ===================================================== */

  window.FZ_abrirFutsal =
    function(){

      if(!area()) return;

      area().innerHTML=`

        <div class="fz4-header">

          <button
            class="fz4-back"
            onclick="FZ3_voltar()"
          >←</button>

          <div>

            <strong>🥅 FUTSAL</strong>

            <small>
              Futebol de salão
            </small>

          </div>

        </div>

        <div class="fz4-menu">

          <button
            onclick="FZ4_jogos()"
          >
            ⚽ Jogos
          </button>

          <button
            onclick="FZ4_live()"
          >
            🔴 AO VIVO
          </button>

          <button
            onclick="FZ4_competicoes()"
          >
            🏆 Competições
          </button>

        </div>

        <div id="fz4-area"></div>
      `;

      FZ4_jogos();
    };

  /* =====================================================
     JOGOS
     ===================================================== */

  window.FZ4_jogos =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML=`

        <div class="fz4-dates">

          <button
            onclick="FZ4_dia(-1)"
          >‹</button>

          <button
            onclick="FZ4_hoje()"
          >HOJE</button>

          <input
            type="date"
            value="${dateISO(FZ4_data)}"
            onchange="FZ4_data(this.value)"
          >

          <button
            onclick="FZ4_dia(1)"
          >›</button>

        </div>

        <div class="fz4-loading">
          A carregar jogos de futsal...
        </div>
      `;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/scheduled-events/" +
            dateISO(FZ4_data)
          );

        const events =
          data.events || [];

        if(!events.length){

          box.innerHTML += `
            <div class="fz4-empty">
              Não existem jogos de futsal
              registados para este dia.
            </div>
          `;

          return;
        }

        box.innerHTML =
          box.innerHTML.split(
            '<div class="fz4-loading">'
          )[0] +
          events.map(card).join("");

      }catch(e){

        box.innerHTML += `
          <div class="fz4-empty">
            Não foi possível carregar
            os jogos de futsal.
          </div>
        `;
      }
    };

  function card(ev){

    const home =
      ev.homeTeam || {};

    const away =
      ev.awayTeam || {};

    const hs =
      ev.homeScore?.current;

    const as =
      ev.awayScore?.current;

    const time =
      ev.startTimestamp
      ?
      new Date(
        ev.startTimestamp*1000
      ).toLocaleTimeString(
        "pt-PT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
      :
      "--:--";

    return `

      <button
        class="fz4-game"
        onclick="
          FZ4_detalhe(
            '${esc(ev.id)}'
          )
        "
      >

        <small class="fz4-league">
          ${esc(
            ev.tournament?.name ||
            "Futsal"
          )}
        </small>

        <div class="fz4-teams">

          <span>
            ${esc(
              home.name ||
              "Casa"
            )}
          </span>

          <strong>

            ${
              hs !== undefined &&
              as !== undefined
              ?
              `${esc(hs)} - ${esc(as)}`
              :
              time
            }

          </strong>

          <span>
            ${esc(
              away.name ||
              "Fora"
            )}
          </span>

        </div>

      </button>
    `;
  }

  /* =====================================================
     DATAS
     ===================================================== */

  window.FZ4_dia =
    function(delta){

      FZ4_data.setDate(
        FZ4_data.getDate()+delta
      );

      FZ4_jogos();
    };

  window.FZ4_hoje =
    function(){

      FZ4_data =
        new Date();

      FZ4_jogos();
    };

  window.FZ4_data =
    function(value){

      if(!value) return;

      const p =
        value.split("-");

      FZ4_data =
        new Date(
          Number(p[0]),
          Number(p[1])-1,
          Number(p[2])
        );

      FZ4_jogos();
    };

  /* =====================================================
     AO VIVO
     ===================================================== */

  window.FZ4_live =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A procurar jogos ao vivo...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/events/live"
          );

        const events =
          data.events || [];

        if(!events.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Não existem jogos de futsal
              ao vivo neste momento.
            </div>`;

          return;
        }

        box.innerHTML =
          events.map(card).join("");

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível obter
            os jogos ao vivo.
          </div>`;
      }
    };

  /* =====================================================
     DETALHE
     ===================================================== */

  window.FZ4_detalhe =
    async function(id){

      if(!area()) return;

      area().innerHTML =
        `<div class="fz4-loading">
          A carregar jogo...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/event/" +
            encodeURIComponent(id)
          );

        const ev =
          data.event || {};

        const home =
          ev.homeTeam || {};

        const away =
          ev.awayTeam || {};

        area().innerHTML=`

          <div class="fz4-header">

            <button
              class="fz4-back"
              onclick="FZ_abrirFutsal()"
            >←</button>

            <div>
              <strong>🥅 FUTSAL</strong>
              <small>
                ${esc(
                  ev.tournament?.name ||
                  ""
                )}
              </small>
            </div>

          </div>

          <div class="fz4-detail">

            <div>
              ${esc(
                home.name ||
                "Casa"
              )}
            </div>

            <strong>
              ${
                ev.homeScore?.current !== undefined
                ?
                `${esc(
                  ev.homeScore.current
                )}
                -
                ${esc(
                  ev.awayScore?.current
                )}`
                :
                "vs"
              }
            </strong>

            <div>
              ${esc(
                away.name ||
                "Fora"
              )}
            </div>

          </div>

          <div id="fz4-stats"></div>

          <div id="fz4-players"></div>
        `;

        FZ4_stats(id);
        FZ4_players(id);

      }catch(e){

        area().innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            este jogo.
          </div>`;
      }
    };

  async function FZ4_stats(id){

    const box =
      document.getElementById(
        "fz4-stats"
      );

    if(!box) return;

    try{

      const data =
        await get(
          FZ4_API +
          "/event/" +
          encodeURIComponent(id) +
          "/statistics"
        );

      const groups =
        data.statistics || [];

      if(!groups.length) return;

      let html=`
        <section class="fz4-section">
          <h3>📊 Estatísticas</h3>
      `;

      groups.forEach(period => {

        (period.groups || [])
          .forEach(group => {

            (group.statisticsItems || [])
              .forEach(stat => {

                html += `

                  <div class="fz4-stat">

                    <span>
                      ${esc(
                        stat.name || ""
                      )}
                    </span>

                    <b>
                      ${esc(
                        stat.home ?? ""
                      )}
                      -
                      ${esc(
                        stat.away ?? ""
                      )}
                    </b>

                  </div>
                `;
              });
          });
      });

      html += "</section>";

      box.innerHTML=html;

    }catch(e){}
  }

  async function FZ4_players(id){

    const box =
      document.getElementById(
        "fz4-players"
      );

    if(!box) return;

    try{

      const data =
        await get(
          FZ4_API +
          "/event/" +
          encodeURIComponent(id) +
          "/lineups"
        );

      const teams=[
        data.home,
        data.away
      ].filter(Boolean);

      if(!teams.length) return;

      box.innerHTML=`

        <section class="fz4-section">

          <h3>👥 Jogadores</h3>

          ${teams.map(team => `

            <h4>
              ${esc(
                team.team?.name ||
                "Equipa"
              )}
            </h4>

            ${(team.players || [])
              .map(p => {

                const player =
                  p.player || {};

                return `

                  <div class="fz4-stat">

                    <span>
                      ${esc(
                        player.name ||
                        "Jogador"
                      )}
                    </span>

                    <b>
                      ${esc(
                        p.position ||
                        ""
                      )}
                    </b>

                  </div>
                `;
              }).join("")}

          `).join("")}

        </section>
      `;

    }catch(e){}
  }

  /* =====================================================
     COMPETIÇÕES
     ===================================================== */

  window.FZ4_competicoes =
    async function(){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A carregar competições...
        </div>`;

      try{

        const data =
          await get(
            FZ4_API +
            "/sport/futsal/unique-tournaments"
          );

        let list =
          data.uniqueTournaments ||
          [];

        if(!list.length){

          const groups =
            data.groups || [];

          list =
            groups.flatMap(
              g =>
                g.uniqueTournaments || []
            );
        }

        if(!list.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Não foi possível obter
              as competições.
            </div>`;

          return;
        }

        box.innerHTML = `

          <section class="fz4-section">

            <h3>
              🏆 Competições de Futsal
            </h3>

            ${list.map(t => `

              <button
                class="fz4-competition"
                onclick="
                  FZ4_classificacao(
                    '${esc(t.id)}',
                    '${esc(
                      t.name || ""
                    )}'
                  )
                "
              >

                <span>🏆</span>

                <span>
                  <strong>
                    ${esc(
                      t.name ||
                      "Competição"
                    )}
                  </strong>

                  <small>
                    ${esc(
                      t.category?.name ||
                      ""
                    )}
                  </small>
                </span>

              </button>

            `).join("")}

          </section>
        `;

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            as competições.
          </div>`;
      }
    };

  /* =====================================================
     CLASSIFICAÇÃO
     ===================================================== */

  window.FZ4_classificacao =
    async function(
      tournamentId,
      tournamentName
    ){

      const box =
        document.getElementById(
          "fz4-area"
        );

      if(!box) return;

      box.innerHTML =
        `<div class="fz4-loading">
          A carregar classificação...
        </div>`;

      try{

        const seasons =
          await get(
            FZ4_API +
            "/unique-tournament/" +
            encodeURIComponent(
              tournamentId
            ) +
            "/seasons"
          );

        const season =
          seasons.seasons?.[0];

        if(!season){

          box.innerHTML =
            `<div class="fz4-empty">
              Não existe classificação
              disponível.
            </div>`;

          return;
        }

        const data =
          await get(
            FZ4_API +
            "/unique-tournament/" +
            encodeURIComponent(
              tournamentId
            ) +
            "/season/" +
            encodeURIComponent(
              season.id
            ) +
            "/standings/total"
          );

        const rows =
          data.standings?.[0]?.rows ||
          [];

        if(!rows.length){

          box.innerHTML =
            `<div class="fz4-empty">
              Classificação não disponível.
            </div>`;

          return;
        }

        box.innerHTML=`

          <section class="fz4-section">

            <h3>
              🏆 ${esc(
                tournamentName
              )}
            </h3>

            <div class="fz4-table">

              <div class="fz4-tr fz4-head">
                <span>#</span>
                <span>Equipa</span>
                <span>J</span>
                <span>Pts</span>
              </div>

              ${rows.map(row => `

                <div class="fz4-tr">

                  <span>
                    ${esc(
                      row.position
                    )}
                  </span>

                  <span>
                    ${esc(
                      row.team?.name ||
                      ""
                    )}
                  </span>

                  <span>
                    ${esc(
                      row.matches ??
                      ""
                    )}
                  </span>

                  <strong>
                    ${esc(
                      row.points ??
                      ""
                    )}
                  </strong>

                </div>

              `).join("")}

            </div>

          </section>
        `;

      }catch(e){

        box.innerHTML =
          `<div class="fz4-empty">
            Não foi possível carregar
            a classificação.
          </div>`;
      }
    };

  /* =====================================================
     CSS
     ===================================================== */

  const style =
    document.createElement("style");

  style.textContent = `

    .fz4-header{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .fz4-header strong{
      display:block;
      font-size:20px;
    }

    .fz4-header small{
      display:block;
      color:#9daabb;
      margin-top:2px;
    }

    .fz4-back{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#722f37;
      color:#fff;
      font-size:24px;
    }

    .fz4-menu{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
      margin-bottom:12px;
    }

    .fz4-menu button{
      border:0;
      border-radius:12px;
      padding:11px 4px;
      background:#722f37;
      color:#fff;
      font-weight:800;
    }

    .fz4-dates{
      display:grid;
      grid-template-columns:42px 1fr 1.5fr 42px;
      gap:6px;
      margin-bottom:12px;
    }

    .fz4-dates button,
    .fz4-dates input{
      min-height:42px;
      border:1px solid #263140;
      border-radius:11px;
      background:#09111c;
      color:#fff;
      text-align:center;
    }

    .fz4-game{
      display:block;
      width:100%;
      border:1px solid #202d3b;
      border-radius:17px;
      background:#09111c;
      color:#fff;
      padding:13px;
      margin-bottom:8px;
      text-align:left;
    }

    .fz4-league{
      display:block;
      color:#9daabb;
      font-size:11px;
      margin-bottom:10px;
    }

    .fz4-teams{
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:7px;
    }

    .fz4-teams span:first-child{
      text-align:right;
    }

    .fz4-teams span:last-child{
      text-align:left;
    }

    .fz4-teams strong{
      text-align:center;
      font-size:17px;
    }

    .fz4-loading,
    .fz4-empty{
      padding:18px;
      border-radius:16px;
      background:#0d1724;
      color:#dce5ef;
      text-align:center;
      margin:10px 0;
    }

    .fz4-detail{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
      align-items:center;
      padding:20px 10px;
      border-radius:18px;
      background:#09111c;
      border:1px solid #202d3b;
      text-align:center;
    }

    .fz4-detail strong{
      font-size:27px;
    }

    .fz4-section{
      margin-top:14px;
      padding:15px;
      border-radius:18px;
      background:#09111c;
      border:1px solid #202d3b;
    }

    .fz4-section h3{
      margin:0 0 12px;
    }

    .fz4-section h4{
      margin:12px 0 6px;
    }

    .fz4-stat{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #1d2733;
      font-size:13px;
    }

    .fz4-competition{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px;
      margin-bottom:7px;
      border:0;
      border-radius:13px;
      background:#0d1724;
      color:#fff;
      text-align:left;
    }

    .fz4-competition span:last-child{
      display:flex;
      flex-direction:column;
    }

    .fz4-competition small{
      color:#9daabb;
      margin-top:3px;
    }

    .fz4-table{
      overflow:hidden;
      border-radius:12px;
    }

    .fz4-tr{
      display:grid;
      grid-template-columns:32px 1fr 32px 45px;
      gap:5px;
      align-items:center;
      padding:10px 6px;
      border-bottom:1px solid #1d2733;
      font-size:12px;
    }

    .fz4-head{
      color:#9daabb;
      font-weight:800;
      background:#0d1724;
    }

  `;

  document.head.appendChild(style);

})();
</script>
 
</body>
</html>
