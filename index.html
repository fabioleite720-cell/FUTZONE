<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE — Futebol em Direto</title>
<style>
:root{
 --blue:#0057B8;
 --blue2:#1683FF;
 --blue3:#003B7A;
 --black:#03060B;
 --card:#09111C;
 --card2:#0D1724;
 --muted:#9DAABB;
 --red:#FF4054;
 --yellow:#FFD43B;
 --green:#20D68A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--black);color:#F5F7FA;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;background:var(--black)}
.header{padding:14px 14px 10px;background:linear-gradient(180deg,#071426,#03060B);border-bottom:1px solid #12243A;position:sticky;top:0;z-index:20}
.brand{font-size:25px;font-weight:1000;letter-spacing:-1px}
.brand span{color:var(--blue2)}
.subtitle{font-size:10px;color:#8EA2B8;font-weight:900;letter-spacing:1.2px;margin-top:2px}
.sportSwitch{display:flex;gap:8px;margin-top:12px}
.sportBtn{flex:1;border:1px solid #1B3550;border-radius:10px;padding:9px;background:#09111C;color:#AFC0D1;font-size:11px;font-weight:900}
.sportBtn.active{background:linear-gradient(180deg,#0872E8,#00458F);border-color:#1683FF;color:#fff}
main{padding:10px 10px 80px}
.sectionTitle{font-size:14px;font-weight:1000;margin:8px 2px 10px}
.leagues{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}
.league{flex:0 0 auto;border:1px solid #1B3550;border-radius:10px;background:#09111C;color:#AFC0D1;padding:8px 10px;font-size:10px;font-weight:900}
.league.active{background:#0057B8;border-color:#1683FF;color:#fff}
.searchBox{margin:5px 0 9px}
.searchBox input{width:100%;background:#09111C;border:1px solid #1B3550;border-radius:10px;color:#fff;padding:10px 12px;outline:none}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px}
.filter{border:1px solid #1B3550;border-radius:9px;background:#09111C;color:#AFC0D1;padding:7px 10px;font-size:10px;font-weight:900}
.filter.active{background:#0057B8;color:#fff;border-color:#1683FF}
.games{display:flex;flex-direction:column;gap:8px}
.gameCard{background:linear-gradient(180deg,#0D1724,#09111C);border:1px solid #142B43;border-radius:12px;padding:10px}
.gameTop{display:flex;justify-content:space-between;align-items:center;color:#7890A8;font-size:9px;font-weight:900}
.gameTeams{display:grid;grid-template-columns:1fr 52px 1fr;align-items:center;gap:6px;margin-top:8px}
.team{font-size:12px;font-weight:900;line-height:1.25}
.team.home{text-align:right}
.team.away{text-align:left}
.score{text-align:center;font-size:17px;font-weight:1000}
.score small{display:block;font-size:8px;color:#7890A8;margin-top:2px}
.star{border:0;background:transparent;color:#71869B;font-size:20px;padding:0}
.star.on{color:var(--yellow)}
.live{color:#FF4054;font-weight:1000}
.finished{color:#7E91A5}
.upcoming{color:#20D68A}
.event{background:#0B1622;border:1px solid #142B43;border-radius:9px;padding:9px;margin-top:7px}
.eventTime{font-size:9px;color:#7E91A5;font-weight:900;margin-bottom:3px}
.detailCard{background:#09111C;border:1px solid #142B43;border-radius:12px;padding:11px;margin-bottom:9px}
.detailCard h3{margin:0 0 9px;font-size:13px}
.loading{text-align:center;color:#8EA2B8;padding:30px 10px}
.empty{text-align:center;color:#7E91A5;padding:25px 10px}
.overlay{position:fixed;inset:0;background:#03060B;z-index:100;display:none;overflow:auto}
.overlay.show{display:block}
.overlayHeader{position:sticky;top:0;background:#071426;border-bottom:1px solid #16314D;padding:13px;display:flex;align-items:center;gap:10px;z-index:2}
.backBtn{border:0;background:#0D1B2A;color:#fff;border-radius:9px;padding:8px 11px;font-weight:900}
.overlayTitle{font-size:15px;font-weight:1000}
.overlayBody{padding:12px 10px 30px;max-width:720px;margin:auto}
.heroGame{background:linear-gradient(180deg,#0D1B2A,#07111C);border:1px solid #17324D;border-radius:13px;padding:15px;margin-bottom:10px}
.heroTeams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center}
.heroTeam{text-align:center;font-size:13px;font-weight:1000}
.heroLogo{width:55px;height:55px;object-fit:contain;display:block;margin:0 auto 7px}
.playerList{display:flex;flex-direction:column;gap:6px}
.playerItem{display:flex;align-items:center;gap:10px;background:#0B1622;border:1px solid #142B43;border-radius:9px;padding:8px}
.playerNumber{width:28px;text-align:center;font-weight:1000;color:#7FA6D2}
.playerName{font-size:12px;font-weight:900}
.playerPosition{font-size:9px;color:#71869B;margin-top:2px}
.bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#050B12;border-top:1px solid #142B43;display:flex;justify-content:center}
.bottomNavInner{width:100%;max-width:720px;display:flex}
.navBtn{flex:1;border:0;background:transparent;color:#71869B;padding:9px 4px 10px;font-size:10px;font-weight:900}
.navBtn.active{color:#1683FF}
.fzDayBar{display:flex!important;flex-wrap:nowrap!important;gap:7px!important;overflow-x:auto!important;overflow-y:hidden!important;margin:0 -2px 12px!important;padding:6px 2px 10px!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;background:linear-gradient(180deg,rgba(0,87,184,.10),rgba(0,0,0,0))!important;border-bottom:1px solid #12304A!important}
.fzDayBar::-webkit-scrollbar{display:none!important}
.fzDay{appearance:none!important;-webkit-appearance:none!important;flex:0 0 68px!important;height:58px!important;border:1px solid #1B3550!important;border-radius:12px!important;background:linear-gradient(180deg,#0D1B2A,#07111C)!important;color:#91A5BA!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;font-size:10px!important;font-weight:900!important;letter-spacing:.3px!important;box-shadow:0 3px 10px rgba(0,0,0,.22)!important}
.fzDay strong{display:block!important;color:#F5F7FA!important;font-size:14px!important;line-height:1!important}
.fzDay.active{background:linear-gradient(180deg,#0872E8,#00458F)!important;border-color:#1683FF!important;color:#fff!important;box-shadow:0 0 0 1px rgba(22,131,255,.22),0 6px 16px rgba(0,87,184,.30)!important}
.fzTodosDiaBtn{display:flex!important;width:100%!important;align-items:center!important;justify-content:center!important;margin:2px 0 8px!important;padding:10px 12px!important;border:1px solid #1683FF!important;border-radius:10px!important;background:linear-gradient(180deg,#0B65C8,#003B7A)!important;color:#fff!important;font-size:11px!important;font-weight:900!important;letter-spacing:.35px!important;box-shadow:0 4px 12px rgba(0,87,184,.22)!important}
.fzTodosDiaBtn:active{transform:scale(.99)!important}
.fzFutsalBar{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;padding:5px 2px 12px;margin:0 -2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fzFutsalBar::-webkit-scrollbar{display:none}
.fzFutsalChip{flex:0 0 150px;min-height:66px;border:1px solid #1B3550;border-radius:12px;background:linear-gradient(180deg,#0D1B2A,#07111C);color:#C4CDD7;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.fzFutsalChip span{font-size:15px;line-height:1}
.fzFutsalChip b{font-size:12px;color:#F5F7FA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzFutsalChip small{font-size:9px;color:#7FA6D2;text-transform:uppercase;font-weight:900}
.fzFutsalChip.active{background:linear-gradient(180deg,#0872E8,#00458F);border-color:#1683FF;color:#fff;box-shadow:0 0 0 1px rgba(22,131,255,.2),0 6px 16px rgba(0,87,184,.3)}
.fzFutsalChip.active b,.fzFutsalChip.active small{color:#fff}
.fzFutComp{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 12px;scrollbar-width:none}
.fzFutComp::-webkit-scrollbar{display:none}
.fzFutComp button{flex:0 0 170px;border:1px solid #1B3550;border-radius:11px;background:#09111C;color:#B7C5D3;padding:10px;text-align:left;font-size:11px;font-weight:900}
.fzFutComp button.active{background:#0057B8;border-color:#1683FF;color:#fff}
.fzSource{font-size:10px;color:#71869B;line-height:1.45;margin:4px 2px 12px}
.fzSource a{color:#1683FF;text-decoration:none}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="brand">FUT<span>ZONE</span></div>
<div class="subtitle">FUTEBOL EM DIRETO</div>
<div class="sportSwitch">
<button id="btnFootball" class="sportBtn active" onclick="mudarDesporto('football')">⚽ Futebol</button>
<button id="btnFutsal" class="sportBtn" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
</div>
</header>

<main>
<section id="footballSection">
<div class="sectionTitle">Competições</div>
<div class="leagues" id="leagueList"></div>
<div class="searchBox"><input id="searchInput" placeholder="🔎 Procurar equipa ou jogador..." oninput="renderizarJogos()"></div>
<div class="filters">
<button class="filter active" onclick="setFiltro('all',this)">Todos</button>
<button class="filter" onclick="setFiltro('live',this)">🔴 Ao vivo</button>
<button class="filter" onclick="setFiltro('upcoming',this)">Próximos</button>
<button class="filter" onclick="setFiltro('finished',this)">Resultados</button>
</div>
<div id="footballContent" class="games"></div>
</section>

<section id="futsalSection" style="display:none">
<div class="sectionTitle">🥅 Futsal</div>
<div id="futsalContent"></div>
</section>
</main>
</div>

<div class="overlay" id="overlay">
<div class="overlayHeader">
<button class="backBtn" onclick="fecharOverlay()">← Voltar</button>
<div class="overlayTitle" id="overlayTitle">FUTZONE</div>
</div>
<div class="overlayBody" id="overlayBody"></div>
</div>

<div class="bottomNav">
<div class="bottomNavInner">
<button class="navBtn active" id="navJogos" onclick="navegar('jogos')">⚽<br>Jogos</button>
<button class="navBtn" id="navTabelas" onclick="navegar('tabelas')">🏆<br>Tabelas</button>
<button class="navBtn" id="navFav" onclick="navegar('favoritos')">☆<br>Favoritos</button>
</div>
</div>

<script>
  const API="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const STANDINGS_API="https://site.api.espn.com/apis/v2/sports/soccer/";
const ligas=[
 ["por.1","🇵🇹 Liga Portugal"],["por.2","🇵🇹 Liga Portugal 2"],["por.3","🇵🇹 Liga 3"],["por.w.1","🇵🇹 Liga BPI Feminina"],
 ["eng.1","🏴 Premier League"],["esp.1","🇪🇸 LaLiga"],["ita.1","🇮🇹 Serie A"],["ger.1","🇩🇪 Bundesliga"],
 ["fra.1","🇫🇷 Ligue 1"],["ned.1","🇳🇱 Eredivisie"],["bel.1","🇧🇪 Jupiler Pro League"],
 ["uefa.champions","🏆 Champions League"],["uefa.europa","🏆 Europa League"],["uefa.europa.conf","🏆 Conference League"]
];

let ligaAtual="por.1";
let modo="jogos";
let fzModoTodos=false;
let fzDiaSelecionado=new Date().toISOString().slice(0,10);
let cacheJogos={};
let cacheTabelas={};
let cacheEquipas={};
let cacheJogadores={};

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function dataCurta(v){
 if(!v)return "—";
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return "—";
 return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"});
}

function horaEvento(v){
 if(!v)return "—";
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return "—";
 return d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
}

function fzDataCompleta(v){
 if(!v)return "—";
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return "—";
 return d.toLocaleDateString("pt-PT",{weekday:"short",day:"2-digit",month:"2-digit"});
}

function fzEscudo(t){
 return t?.logo||t?.logos?.[0]?.href||"";
}

function fzNomeEquipa(t){
 return t?.displayName||t?.shortDisplayName||t?.name||"Equipa";
}

function fzLigaNome(id){
 const x=ligas.find(l=>l[0]===id);
 return x?x[1]:id;
}

function fzStatus(e){
 const s=e?.status;
 if(!s)return "";
 const type=s.type||{};
 if(type.completed)return "FIM";
 if(type.state==="in")return "AO VIVO";
 if(type.name==="STATUS_HALFTIME")return "INTERVALO";
 if(type.name==="STATUS_SCHEDULED")return "";
 return type.shortDetail||type.detail||"";
}

function fzEquipaHtml(team,click=true){
 if(!team)return "";
 const id=team.id||team.uid||"";
 const nome=fzNomeEquipa(team);
 const img=fzEscudo(team);
 return `<button class="fzTeamBtn" ${click?`onclick="fzAbrirEquipa('${esc(id)}','${esc(nome)}','${esc(ligaAtual)}')"`:""}>${img?`<img src="${esc(img)}" onerror="this.style.display='none'">`:""}<span>${esc(nome)}</span></button>`;
}

function cartaoJogo(e,ligaId){
 const c=e.competitions?.[0]||{};
 const home=c.competitors?.find(x=>x.homeAway==="home")||c.competitors?.[0]||{};
 const away=c.competitors?.find(x=>x.homeAway==="away")||c.competitors?.[1]||{};
 const status=fzStatus(e);
 const live=status==="AO VIVO"||status==="INTERVALO";
 const completed=!!c.status?.type?.completed||!!e.status?.type?.completed;
 const hs=home.score??"";
 const as=away.score??"";
 const eventoId=e.id||"";
 return `<article class="gameCard ${live?"live":""}" onclick="fzAbrirJogo('${esc(eventoId)}','${esc(ligaId)}')">
   <div class="gameTop"><span>${esc(fzLigaNome(ligaId))}</span><b>${live?"🔴 AO VIVO":completed?"FIM":esc(horaEvento(e.date))}</b></div>
   <div class="teams">
    <div class="teamSide">${fzEquipaHtml(home.team||home,true)}<strong>${esc(hs)}</strong></div>
    <div class="gameMid">${live?`<em>${esc(status)}</em>`:`<small>${esc(dataCurta(e.date))}</small>`}</div>
    <div class="teamSide">${fzEquipaHtml(away.team||away,true)}<strong>${esc(as)}</strong></div>
   </div>
 </article>`;
}

async function fzFetch(url){
 const r=await fetch(url);
 if(!r.ok)throw new Error("HTTP "+r.status);
 return r.json();
}

async function buscarJogosLiga(liga,data){
 const urls=[
  `${API}leagues/${liga}/scoreboard?dates=${data}`,
  `${API}leagues/${liga}/scoreboard?dates=${data.replaceAll("-","")}`
 ];
 for(const u of urls){
  try{
   const x=await fzFetch(u);
   if(x&&Array.isArray(x.events))return x.events;
  }catch(e){}
 }
 return [];
}

async function fallbackGames(liga){
 const d=fzDiaSelecionado||new Date().toISOString().slice(0,10);
 return buscarJogosLiga(liga,d);
}

async function fzCarregarJogos(liga){
 const key=liga+"_"+fzDiaSelecionado;
 if(cacheJogos[key])return cacheJogos[key];
 const eventos=await buscarJogosLiga(liga,fzDiaSelecionado);
 cacheJogos[key]=eventos;
 return eventos;
}

function fzLoading(el,text="A carregar…"){
 if(el)el.innerHTML=`<div class="loading">${esc(text)}</div>`;
}

async function fzRenderJogos(){
 fzModoTodos=false;
 const content=document.getElementById("footballContent");
 if(!content)return;
 fzLoading(content);
 try{
  const eventos=await fzCarregarJogos(ligaAtual);
  if(!eventos.length){
   content.innerHTML=`<div class="empty">Não existem jogos para esta competição neste dia.</div>`;
   return;
  }
  content.innerHTML=eventos.map(e=>cartaoJogo(e,ligaAtual)).join("");
 }catch(e){
  console.error(e);
  content.innerHTML=`<div class="empty">Não foi possível carregar os jogos.</div>`;
 }
}

async function fzRenderTodos(){
 const content=document.getElementById("footballContent");
 if(!content)return;
 fzLoading(content,"A carregar todos os jogos do dia…");
 try{
  const blocos=await Promise.all(ligas.map(async l=>{
   try{
    const ev=await fallbackGames(l[0]);
    return {liga:l[0],nome:l[1],eventos:ev||[]};
   }catch(e){
    return {liga:l[0],nome:l[1],eventos:[]};
   }
  }));
  const total=blocos.reduce((n,b)=>n+b.eventos.length,0);
  if(!total){
   content.innerHTML=`<div class="empty">Não existem jogos encontrados para este dia.</div>`;
   return;
  }
  content.innerHTML=blocos.filter(b=>b.eventos.length).map(b=>`
   <section class="fzAllLeague">
    <div class="sectionTitle">${esc(b.nome)} <span>${b.eventos.length}</span></div>
    ${b.eventos.map(e=>cartaoJogo(e,b.liga)).join("")}
   </section>`).join("");
 }catch(e){
  console.error(e);
  content.innerHTML=`<div class="empty">Não foi possível carregar os jogos.</div>`;
 }
}

async function fzCarregarTabela(liga){
 if(cacheTabelas[liga])return cacheTabelas[liga];
 try{
  const data=await fzFetch(`${STANDINGS_API}leagues/${liga}/standings`);
  cacheTabelas[liga]=data;
  return data;
 }catch(e){
  console.error(e);
  return null;
 }
}

function fzExtrairTabela(data){
 const entries=data?.children?.[0]?.standings?.entries||
               data?.standings?.entries||
               data?.children?.flatMap(x=>x?.standings?.entries||[])||[];
 return entries;
}

async function fzRenderTabela(){
 const content=document.getElementById("footballContent");
 if(!content)return;
 fzLoading(content,"A carregar classificação…");
 try{
  const data=await fzCarregarTabela(ligaAtual);
  const entries=fzExtrairTabela(data);
  if(!entries.length){
   content.innerHTML=`<div class="empty">Classificação indisponível para esta competição.</div>`;
   return;
  }
  content.innerHTML=`
   <div class="tableWrap">
    <div class="tableHead"><span>#</span><span>Equipa</span><span>J</span><span>V</span><span>E</span><span>D</span><span>DG</span><span>P</span></div>
    ${entries.map((x,i)=>{
      const t=x.team||{};
      const s=x.stats||[];
      const val=n=>{const q=s.find(z=>z.name===n||z.abbreviation===n);return q?.value??q?.displayValue??0};
      return `<div class="tableRow" onclick="fzAbrirEquipa('${esc(t.id||"")}','${esc(fzNomeEquipa(t))}','${esc(ligaAtual)}')">
       <span>${i+1}</span>
       <span class="tableTeam">${fzEscudo(t)?`<img src="${esc(fzEscudo(t))}">`:""}${esc(fzNomeEquipa(t))}</span>
       <span>${val("gamesPlayed")}</span>
       <span>${val("wins")}</span>
       <span>${val("ties")}</span>
       <span>${val("losses")}</span>
       <span>${val("pointDifferential")}</span>
       <b>${val("points")}</b>
      </div>`;
    }).join("")}
   </div>`;
 }catch(e){
  console.error(e);
  content.innerHTML=`<div class="empty">Não foi possível carregar a classificação.</div>`;
 }
}

function fzSelecionarLiga(id,btn){
 ligaAtual=id;
 fzModoTodos=false;
 document.querySelectorAll(".league").forEach(x=>x.classList.remove("active"));
 btn?.classList.add("active");
 if(modo==="tabela")fzRenderTabela();
 else fzRenderJogos();
}

function fzSelecionarDia(iso,btn){
 fzDiaSelecionado=iso;
 fzModoTodos=true;
 document.querySelectorAll(".fzDay").forEach(x=>x.classList.toggle("active",x.dataset.date===iso));
 const all=document.getElementById("fzTodosDiaBtn");
 if(all)all.classList.add("active");
 fzRenderTodos();
}

function fzTodosButton(){
 const list=document.getElementById("leagueList");if(!list)return;
 const antigo=document.getElementById("fzTodasBtn");if(antigo)antigo.remove();
 if(!document.getElementById("fzTodosDiaBtn")){
  const b=document.createElement("button");
  b.id="fzTodosDiaBtn";
  b.className="fzTodosDiaBtn";
  b.textContent="📅 TODOS OS JOGOS DO DIA";
  b.onclick=()=>fzMostrarTodosJogosDoDia(b);
  list.prepend(b);
 }
}

function fzMostrarTodosJogosDoDia(btn){
 fzModoTodos=true;
 const hoje=new Date();hoje.setHours(12,0,0,0);
 fzDiaSelecionado=hoje.toISOString().slice(0,10);
 ligaAtual=ligas[0][0];
 document.querySelectorAll(".league").forEach(x=>x.classList.remove("active"));
 btn?.classList.add("active");
 document.querySelectorAll(".fzDay").forEach(x=>x.classList.toggle("active",x.dataset.date===fzDiaSelecionado));
 fzRenderTodos();
}

function fzCriarCabecalhoDias(){
 const sec=document.getElementById("footballSection");if(!sec)return;
 let old=document.getElementById("fzDayBar");if(old)old.remove();
 const bar=document.createElement("div");bar.id="fzDayBar";bar.className="fzDayBar";
 const hoje=new Date();
 for(let i=-1;i<=14;i++){
  const d=new Date(hoje);d.setHours(12,0,0,0);d.setDate(d.getDate()+i);
  const iso=d.toISOString().slice(0,10);
  const nomes=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  const b=document.createElement("button");
  b.className="fzDay"+(i===0?" active":"");
  b.dataset.date=iso;
  b.innerHTML=`${i===0?"HOJE":nomes[d.getDay()]}<strong>${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}</strong>`;
  b.onclick=()=>fzSelecionarDia(iso,b);
  bar.appendChild(b);
 }
 const anchor=sec.querySelector(".sectionTitle");
 if(anchor)anchor.insertAdjacentElement("afterend",bar);
 else sec.prepend(bar);
}

async function fzAbrirJogo(id,liga){

 const body=document.getElementById("overlayBody");
 if(!overlay||!body)return;
 overlay.classList.add("show");
 body.innerHTML=`<div class="loading">A carregar jogo…</div>`;
 try{
  const data=await fzFetch(`${API}summary?event=${encodeURIComponent(id)}`);

  const comps=c.competitors||[];
  const home=comps.find(x=>x.homeAway==="home")||comps[0]||{};
  const away=comps.find(x=>x.homeAway==="away")||comps[1]||{};
  const estat=data?.boxscore?.teams||[];
  const leaders=data?.leaders||[];
  const events=data?.plays||[];
  const starters=[...new Map(
    comps.flatMap(t=>(t.roster||[]).filter(p=>p.starter).map(p=>[p.athlete?.id,p]))
  ).values()];
  body.innerHTML=`
   <div class="detailTop">
    <button onclick="fzFecharOverlay()">←</button>
    <span>${esc(fzLigaNome(liga))}</span>
   </div>
   <div class="matchHero">
    <div>${fzEquipaHtml(home.team||home,true)}<strong>${esc(home.score??"")}</strong></div>
    <div class="heroStatus">${esc(fzStatus(c))}<small>${esc(fzDataCompleta(data?.header?.competitions?.[0]?.date||c.date))}</small></div>
    <div>${fzEquipaHtml(away.team||away,true)}<strong>${esc(away.score??"")}</strong></div>
   </div>
   <div class="detailSection">
    <h3>ESTATÍSTICAS</h3>
    ${estat.length?estat.map(t=>`<div class="statLine"><b>${esc(fzNomeEquipa(t.team))}</b><span>${(t.statistics||[]).map(s=>`${esc(s.label||s.name)}: ${esc(s.displayValue||s.value)}`).join(" · ")}</span></div>`).join(""):"<div class='empty'>Estatísticas não disponíveis.</div>"}
   </div>
   <div class="detailSection">
    <h3>ONZE INICIAL</h3>
    <div class="pitch">${starters.length?starters.map(p=>`<button class="pitchPlayer" onclick="fzAbrirJogador('${esc(p.athlete?.id||"")}','${esc(p.athlete?.displayName||"Jogador")}','${esc(liga)}')"><b>${esc(p.jersey||p.athlete?.jersey||"")}</b><span>${esc(p.athlete?.shortName||p.athlete?.displayName||"Jogador")}</span></button>`).join(""):"<div class='empty'>Onze inicial não disponível.</div>"}</div>
   </div>
   <div class="detailSection">
    <h3>EVENTOS</h3>
    ${events.length?events.map(x=>`<div class="eventLine"><span>${esc(x.clock?.displayValue||"")}</span><b>${esc(x.type?.text||x.text||"")}</b></div>`).join(""):"<div class='empty'>Eventos não disponíveis.</div>"}
   </div>`;
 }catch(e){
  console.error(e);
  body.innerHTML=`<div class="empty">Não foi possível carregar os detalhes deste jogo.</div>`;
 }
}

 document.getElementById("overlay")?.classList.remove("show");

async function fzAbrirEquipa(id,nome,liga){
 const overlay=document.getElementById("overlay");
 const body=document.getElementById("overlayBody");
 if(!overlay||!body)return;
 overlay.classList.add("show");
 body.innerHTML=`<div class="loading">A carregar equipa…</div>`;
 try{
  const data=await fzFetch(`${API}leagues/${liga}/teams`);
  const items=data?.sports?.[0]?.leagues?.[0]?.teams||data?.teams||[];
  const item=items.find(x=>String(x.team?.id||x.id)===String(id))||{};
  const team=item.team||item;
  const roster=team.roster||item.roster||[];
  const events=await fallbackGames(liga);
  const jogos=events.filter(e=>e.competitions?.[0]?.competitors?.some(c=>String(c.team?.id)===String(id))).slice(0,12);
  body.innerHTML=`
   <div class="detailTop"><button onclick="fzFecharOverlay()">←</button><span>EQUIPA</span></div>
   <div class="clubHero">${fzEscudo(team)?`<img src="${esc(fzEscudo(team))}">`:""}<h2>${esc(nome||fzNomeEquipa(team))}</h2><small>${esc(fzLigaNome(liga))}</small></div>
   <div class="detailSection">
    <h3>PLANTEL</h3>
    ${roster.length?roster.map(p=>{
      const a=p.athlete||p;
      return `<button class="listPlayer" onclick="fzAbrirJogador('${esc(a.id||"")}','${esc(a.displayName||a.fullName||"Jogador")}','${esc(liga)}')">${esc(a.displayName||a.fullName||"Jogador")}</button>`;
    }).join(""):"<div class='empty'>Plantel não disponível.</div>"}
   </div>
   <div class="detailSection">
    <h3>JOGOS</h3>
    ${jogos.length?jogos.map(e=>cartaoJogo(e,liga)).join(""):"<div class='empty'>Jogos não disponíveis.</div>"}
   </div>`;
 }catch(e){
  console.error(e);
  body.innerHTML=`<div class="empty">Não foi possível carregar a equipa.</div>`;
 }
}

async function fzAbrirJogador(id,nome,liga){
 const overlay=document.getElementById("overlay");
 const body=document.getElementById("overlayBody");
 if(!overlay||!body)return;
 overlay.classList.add("show");
 body.innerHTML=`<div class="loading">A carregar jogador…</div>`;
 try{
  let a={};
  if(id){
   try{a=await fzFetch(`${API}athletes/${encodeURIComponent(id)}`)}catch(e){}
  }
  const termo=String(a.displayName||a.fullName||nome||"").trim();
  let wd=null;
  try{
   const sr=await fzFetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(termo)}&language=pt&format=json&origin=*`);
   wd=sr?.search?.[0]?.id||null;
  }catch(e){}
  let entidade=null;
  if(wd){
   try{entidade=await fzFetch(`https://www.wikidata.org/wiki/Special:EntityData/${wd}.json`)}catch(e){}
  }
  const ent=entidade?.entities?.[wd];
  const claims=ent?.claims||{};
  const labelWD=(pid)=>{
   const q=claims[pid]?.[0]?.mainsnak?.datavalue?.value?.id;
   return q||"";
  };
  const qTeam=(claims.P54||[]).map(c=>c.mainsnak?.datavalue?.value?.id).filter(Boolean);
  const labels={};
  if(qTeam.length){
   try{
    const x=await fzFetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qTeam.join("|")}&props=labels&languages=pt&format=json&origin=*`);
    Object.entries(x.entities||{}).forEach(([k,v])=>labels[k]=v.labels?.pt?.value||v.labels?.en?.value||k);
   }catch(e){}
  }
  const historico=(claims.P54||[]).map(c=>{
   const teamId=c.mainsnak?.datavalue?.value?.id;
   if(!teamId)return null;
   const ini=c.qualifiers?.P580?.[0]?.datavalue?.value?.time||"";
   const fim=c.qualifiers?.P582?.[0]?.datavalue?.value?.time||"";
   return {equipa:labels[teamId]||teamId,inicio:ini?ini.slice(1,11):"",fim:fim?fim.slice(1,11):""};
  }).filter(Boolean);
  const foto=a.headshot?.href||a.headshot||"";
  body.innerHTML=`
   <div class="detailTop"><button onclick="fzFecharOverlay()">←</button><span>JOGADOR</span></div>
   <div class="playerHero">
    ${foto?`<img src="${esc(foto)}">`:""}
    <h2>${esc(a.displayName||a.fullName||nome||"Jogador")}</h2>
    <div>${esc(a.position?.displayName||a.position?.abbreviation||"")}</div>
   </div>
   <div class="detailSection">
    <h3>INFORMAÇÃO</h3>
    <div class="infoGrid">
     <span>Nacionalidade<strong>${esc(a.birthPlace?.country||"—")}</strong></span>
     <span>Equipa<strong>${esc(a.team?.displayName||"—")}</strong></span>
     <span>Posição<strong>${esc(a.position?.displayName||"—")}</strong></span>
     <span>N.º<strong>${esc(a.jersey||"—")}</strong></span>
    </div>
   </div>
   <div class="detailSection">
    <h3>HISTÓRICO DO JOGADOR</h3>
    ${historico.length?historico.map(h=>`<div class="historyRow"><b>${esc(h.equipa)}</b><span>${esc(h.inicio||"—")} ${h.fim?"→ "+esc(h.fim):"→ atual"}</span></div>`).join(""):"<div class='empty'>Histórico não disponível para este jogador.</div>"}
   </div>`;
 }catch(e){
  console.error(e);
  body.innerHTML=`<div class="empty">Não foi possível carregar o jogador.</div>`;
 }
}
