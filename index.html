<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>FUTZONE ⚽</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #101820;
      padding-bottom: 75px;
    }

    header {
      background: #07111f;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 6px;
      opacity: .8;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .league-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 8px;
      background: #07111f;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.active {
      background: #1769aa;
    }

    .match {
      border: 1px solid #e3e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafbfc;
    }

    .date {
      font-size: 12px;
      color: #68737d;
      margin-bottom: 7px;
    }

    .teams {
      font-weight: bold;
      line-height: 1.5;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 9px 5px;
      border-bottom: 1px solid #e6e9ec;
      text-align: center;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #68737d;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #07111f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    nav button {
      background: transparent;
      padding: 8px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #68737d;
      font-size: 11px;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ FUTZONE</h1>
  <p>O teu futebol num só lugar</p>
</header>

<main>

  <section class="card">
    <h2>🏆 Competições</h2>

    <div class="league-buttons">
      <button class="active" onclick="selecionarLiga('PPL', 'Primeira Liga', this)">
        🇵🇹 Primeira Liga
      </button>

      <button onclick="selecionarLiga('PL', 'Premier League', this)">
        🏴 Premier League
      </button>

      <button onclick="selecionarLiga('PD', 'La Liga', this)">
        🇪🇸 La Liga
      </button>

      <button onclick="selecionarLiga('SA', 'Serie A', this)">
        🇮🇹 Serie A
      </button>

      <button onclick="selecionarLiga('BL1', 'Bundesliga', this)">
        🇩🇪 Bundesliga
      </button>
    </div>
  </section>

  <section class="card">
    <h2 id="tituloJogos">⚽ Próximos jogos — Primeira Liga</h2>
    <div id="jogos" class="loading">A carregar jogos...</div>
  </section>

  <section class="card">
    <h2 id="tituloTabela">📊 Classificação — Primeira Liga</h2>
    <div id="classificacao" class="loading">A carregar classificação...</div>
  </section>

</main>

<footer>
  Data provided by football-data.org
</footer>

<nav>
  <button onclick="window.scrollTo({top:0, behavior:'smooth'})">🏠<br>Início</button>
  <button onclick="document.getElementById('jogos').scrollIntoView({behavior:'smooth'})">⚽<br>Jogos</button>
  <button onclick="document.querySelector('.league-buttons').scrollIntoView({behavior:'smooth'})">🏆<br>Ligas</button>
  <button onclick="document.getElementById('classificacao').scrollIntoView({behavior:'smooth'})">📊<br>Tabela</button>
</nav>

<script>

  const ligas = {
    PPL: {
      nome: "Primeira Liga",
      jogos: "data/primeira-liga.json",
      tabela: "data/classificacao.json"
    },

    PL: {
      nome: "Premier League",
      jogos: "data/premier-league.json",
      tabela: "data/premier-league-classificacao.json"
    },

    PD: {
      nome: "La Liga",
      jogos: "data/la-liga.json",
      tabela: "data/la-liga-classificacao.json"
    },

    SA: {
      nome: "Serie A",
      jogos: "data/serie-a.json",
      tabela: "data/serie-a-classificacao.json"
    },

    BL1: {
      nome: "Bundesliga",
      jogos: "data/bundesliga.json",
      tabela: "data/bundesliga-classificacao.json"
    }
  };

  async function selecionarLiga(codigo, nome, botao) {

    document.querySelectorAll(".league-buttons button")
      .forEach(b => b.classList.remove("active"));

    botao.classList.add("active");

    document.getElementById("tituloJogos").textContent =
      "⚽ Próximos jogos — " + nome;

    document.getElementById("tituloTabela").textContent =
      "📊 Classificação — " + nome;

    document.getElementById("jogos").innerHTML =
      '<div class="loading">A carregar jogos...</div>';

    document.getElementById("classificacao").innerHTML =
      '<div class="loading">A carregar classificação...</div>';

    const liga = ligas[codigo];

    try {
      const [jogosResposta, tabelaResposta] = await Promise.all([
        fetch(liga.jogos + "?t=" + Date.now()),
        fetch(liga.tabela + "?t=" + Date.now())
      ]);

      const jogos = await jogosResposta.json();
      const tabela = await tabelaResposta.json();

      mostrarJogos(jogos);
      mostrarTabela(tabela);

    } catch (erro) {
      document.getElementById("jogos").innerHTML =
        "Não foi possível carregar os jogos.";

      document.getElementById("classificacao").innerHTML =
        "Não foi possível carregar a classificação.";
    }
  }

  function mostrarJogos(dados) {

    const container = document.getElementById("jogos");

    if (!dados.matches || dados.matches.length === 0) {
      container.innerHTML = "Não existem jogos disponíveis.";
      return;
    }

    const jogos = dados.matches
      .filter(jogo => jogo.status !== "FINISHED")
      .slice(0, 15);

    if (jogos.length === 0) {
      container.innerHTML = "Não existem próximos jogos.";
      return;
    }

    container.innerHTML = jogos.map(jogo => {

      const data = new Date(jogo.utcDate);

      return `
        <div class="match">
          <div class="date">
            ${data.toLocaleDateString("pt-PT")} —
            ${data.toLocaleTimeString("pt-PT", {
              hour: "2-digit",
              minute: "2-digit"
            })}
          </div>

          <div class="teams">
            ${jogo.homeTeam.name}<br>
            🆚<br>
            ${jogo.awayTeam.name}
          </div>
        </div>
      `;

    }).join("");
  }

  function mostrarTabela(dados) {

    const container = document.getElementById("classificacao");

    if (!dados.standings || !dados.standings.length) {
      container.innerHTML = "Classificação indisponível.";
      return;
    }

    const tabela =
      dados.standings.find(s => s.type === "TOTAL") ||
      dados.standings[0];

    container.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Equipa</th>
              <th>J</th>
              <th>P</th>
              <th>Pts</th>
            </tr>
          </thead>

          <tbody>

            ${tabela.table.map(equipa => `
              <tr>
                <td>${equipa.position}</td>
                <td>${equipa.team.name}</td>
                <td>${equipa.playedGames}</td>
                <td>${equipa.won}</td>
                <td><strong>${equipa.points}</strong></td>
              </tr>
            `).join("")}

          </tbody>
        </table>
      </div>
    `;
  }

  selecionarLiga(
    "PPL",
    "Primeira Liga",
    document.querySelector(".league-buttons button")
  );

</script>

</body>
</html>
