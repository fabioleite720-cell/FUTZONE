<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE — Futebol em Direto</title>
<style>
:root{--blue:#0057B8;--blue2:#1683FF;--blue3:#003B7A;--bg:#03060B;--panel:#09111C;--panel2:#0D1724;--border:#1B2A3B;--text:#F5F7FA;--muted:#9DAABB;--red:#FF4054;--green:#20D68A;--yellow:#FFD43B;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:78px}
.app{width:100%;max-width:720px;margin:auto}
.header{position:sticky;top:0;z-index:30;padding:16px 15px 13px;background:rgba(3,6,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font-size:28px;line-height:1;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--blue2)}
.subtitle{margin-top:4px;font-size:11px;color:var(--muted);letter-spacing:1.3px;font-weight:700}
.sportSwitch{display:flex;gap:8px;margin-top:14px}
.sportBtn{flex:1;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:12px;font-weight:800}
.sportBtn.active{background:var(--blue);color:white;border-color:var(--blue)}
main{padding:14px}
.sectionTitle{font-size:17px;font-weight:900;margin:5px 0 10px}
.leagues{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.leagues::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.league{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800}
.league.active{color:white;background:var(--blue3);border-color:var(--blue2)}
.fzTodosDiaBtn{display:flex!important;width:100%!important;align-items:center!important;justify-content:center!important;margin:2px 0 8px!important;padding:10px 12px!important;border:1px solid #1683FF!important;border-radius:10px!important;background:linear-gradient(180deg,#0B65C8,#003B7A)!important;color:#fff!important;font-size:11px!important;font-weight:900!important;letter-spacing:.35px!important;box-shadow:0 4px 12px rgba(0,87,184,.22)!important}
.fzTodosDiaBtn:active{transform:scale(.99)!important}
.liveAll{width:100%;border:0;border-radius:13px;padding:13px;margin:3px 0 12px;background:linear-gradient(135deg,#8f0012,#e01832);color:white;font-weight:900}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.filter{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}
.filter.active{background:var(--blue);border-color:var(--blue);color:white}
.search{width:100%;background:var(--panel);border:1px solid var(--border);color:white;border-radius:12px;padding:12px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--blue2)}
.loading,.empty,.error{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:22px 15px;text-align:center;color:var(--muted)}
.error{color:#ff9ba6}
.dayTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-size:13px;font-weight:900;color:var(--muted)}
.game{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:12px;margin-bottom:9px;cursor:pointer}
.game:active{transform:scale(.99)}
.gameTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.comp{color:var(--muted);font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:10px;font-weight:900;color:var(--muted)}
.status.live{color:var(--red)}
.status.final{color:var(--green)}
.teams{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:7px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.away{justify-content:flex-end;text-align:right}
.teamLogo{width:28px;height:28px;object-fit:contain;flex:none}
.teamName{font-size:13px;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.score{text-align:center;font-size:19px;font-weight:900}
.scoreTime{text-align:center;font-size:13px;font-weight:900;color:var(--muted)}
.star{border:0;background:none;color:#657284;font-size:21px;padding:2px}
.star.on{color:var(--yellow)}
.bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:720px;margin:auto;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(9,17,28,.97);border-top:1px solid var(--border);backdrop-filter:blur(15px)}
.navBtn{border:0;background:none;color:var(--muted);font-size:11px;font-weight:800}
.navBtn.active{color:white}
.navIcon{display:block;font-size:20px;margin-bottom:3px}
.overlay{position:fixed;inset:0;z-index:100;display:none;background:var(--bg);overflow-y:auto}
.overlay.show{display:block}
.detailHeader{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px;background:rgba(3,6,11,.96);border-bottom:1px solid var(--border)}
.back{width:38px;height:38px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:white}
.detailTitle{font-weight:900}
.detailBody{padding:15px;max-width:720px;margin:auto}
.heroGame,.detailCard{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px 12px;margin-bottom:12px}
.heroTeams{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:10px}
.heroTeam{text-align:center;font-weight:900}
.heroLogo{width:50px;height:50px;object-fit:contain;display:block;margin:0 auto 8px}
.heroScore{text-align:center;font-size:28px;font-weight:900}
.detailCard{border-radius:15px;padding:14px;margin-bottom:10px}
.detailCard h3{margin:0 0 12px;font-size:15px}
.event{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.event:last-child{border-bottom:0}
.eventTime{color:var(--muted);width:35px;flex:none}
.tableWrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:center;font-size:12px}
th{color:var(--muted);font-size:10px}
td:first-child,th:first-child{text-align:left}
.pos{width:25px;color:var(--muted)}
.teamTable{display:flex;align-items:center;gap:7px}
.tableLogo{width:23px;height:23px;object-fit:contain}
.clickTeam{cursor:pointer}
.futsal{display:none}
.futsal.show{display:block}
.matchStatsGrid{display:grid;gap:10px}
.statRow{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;font-size:12px}
.statTeam{font-weight:900}
.statTeam.home{text-align:right}
.statName{text-align:center;color:var(--muted);font-size:10px;font-weight:800}
.footballPitch{position:relative;width:100%;height:560px;margin-top:12px;border:3px solid #fff;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(90deg,#075b3d 0,#075b3d 50px,#086443 50px,#086443 100px)}
.pitchHalf{position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(255,255,255,.9)}
.pitchCircle{position:absolute;width:105px;height:105px;border:2px solid rgba(255,255,255,.9);border-radius:50%;top:calc(50% - 52px);left:calc(50% - 52px)}
.pitchCenter{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:calc(50% - 5px);top:calc(50% - 5px)}
.pitchBox{position:absolute;width:145px;height:85px;left:calc(50% - 72px);border:2px solid rgba(255,255,255,.9)}
.pitchBox.top{top:-2px}.pitchBox.bottom{bottom:-2px}
.pitchSmallBox{position:absolute;width:65px;height:35px;left:calc(50% - 32px);border:2px solid rgba(255,255,255,.9)}
.pitchSmallBox.top{top:-2px}.pitchSmallBox.bottom{bottom:-2px}
.pitchGoal{position:absolute;width:55px;height:10px;border:2px solid white;left:calc(50% - 27px)}
.pitchGoal.top{top:-3px}.pitchGoal.bottom{bottom:-3px}
.pitchPlayer{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;z-index:3}
.pitchPlayerDot{width:32px;height:32px;margin:auto;border-radius:50%;background:var(--blue2);border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pitchPlayer.away .pitchPlayerDot{background:var(--blue3)}
.pitchPlayerName{margin-top:3px;font-size:8px;line-height:1.1;font-weight:900;color:white;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lineupLegend{display:flex;justify-content:center;gap:16px;margin-top:10px;color:var(--muted);font-size:10px;font-weight:800}
.lineupLegend span{display:flex;align-items:center;gap:5px}
.lineupDot{width:10px;height:10px;border-radius:50%;background:var(--blue2);border:1px solid white}
.lineupDot.away{background:var(--blue3)}
.playerList{display:grid}
.playerItem{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.playerNumber{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--muted);flex:none}
.playerInfo{min-width:0;flex:1}
.playerName{font-size:12px;font-weight:900}
.playerPosition{font-size:10px;color:var(--muted);margin-top:2px}
.teamLineupTitle{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:900}
.teamLineupTitle img{width:25px;height:25px;object-fit:contain}
.hide{display:none!important}
@media(max-width:420px){.footballPitch{height:520px}.pitchPlayer{width:55px}.pitchPlayerName{font-size:7px}.pitchPlayerDot{width:29px;height:29px}}

.fzDayBar{display:flex!important;flex-wrap:nowrap!important;gap:7px!important;overflow-x:auto!important;overflow-y:hidden!important;margin:0 -2px 12px!important;padding:6px 2px 10px!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;background:linear-gradient(180deg,rgba(0,87,184,.10),rgba(0,0,0,0))!important;border-bottom:1px solid #12304A!important}
.fzDayBar::-webkit-scrollbar{display:none!important}
.fzDay{appearance:none!important;-webkit-appearance:none!important;flex:0 0 68px!important;height:58px!important;border:1px solid #1B3550!important;border-radius:12px!important;background:linear-gradient(180deg,#0D1B2A,#07111C)!important;color:#91A5BA!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;font-size:10px!important;font-weight:900!important;letter-spacing:.3px!important;box-shadow:0 3px 10px rgba(0,0,0,.22)!important}
.fzDay strong{display:block!important;color:#F5F7FA!important;font-size:14px!important;line-height:1!important}
.fzDay.active{background:linear-gradient(180deg,#0872E8,#00458F)!important;border-color:#1683FF!important;color:#fff!important;box-shadow:0 0 0 1px rgba(22,131,255,.22),0 6px 16px rgba(0,87,184,.30)!important}
.fzDay.active strong{color:#fff!important}
#footballSection>.sectionTitle{font-size:12px!important;text-transform:uppercase!important;letter-spacing:1px!important;color:#8EA6BE!important;margin:4px 2px 9px!important}
#leagueList{border-radius:14px!important;padding:2px 0 9px!important}
#leagueList .league{background:#091624!important;border-color:#18324B!important;color:#A8B8C9!important;border-radius:10px!important;padding:9px 13px!important}
#leagueList .league.active{background:linear-gradient(180deg,#075FBE,#003B7A)!important;border-color:#1683FF!important;color:#fff!important;box-shadow:0 4px 12px rgba(0,87,184,.25)!important}
.liveAll{background:linear-gradient(90deg,#B80A25,#FF4054)!important;color:#fff!important;font-size:12px!important;font-weight:900!important;letter-spacing:.2px!important;box-shadow:0 5px 15px rgba(255,64,84,.18)!important}
.filters{background:#07111C!important;border:1px solid #132A40!important;border-radius:12px!important;padding:4px!important}
.filter{border-radius:9px!important;color:#8FA5BA!important}
.filter.active{background:#0057B8!important;color:#fff!important}
.dayTitle{background:linear-gradient(90deg,#0B1D30,#09111C)!important;border-left:3px solid #1683FF!important;border-radius:8px!important;padding:10px 11px!important;margin:18px 1px 9px!important;color:#fff!important}
.dayTitle span:first-child{color:#F5F7FA!important}
.dayTitle span:last-child{color:#1683FF!important}
.game{background:linear-gradient(180deg,#0B1724,#08111A)!important;border-color:#173149!important;border-radius:13px!important;box-shadow:0 3px 12px rgba(0,0,0,.16)!important}
.gameTop{border-bottom:1px solid #12273A!important;padding-bottom:8px!important}
.comp{color:#7F96AC!important}
.teamName{color:#F5F7FA!important}
.score{color:#fff!important}
.scoreTime{color:#1683FF!important}
.fzAllHead{background:linear-gradient(90deg,#0057B8,#003B7A)!important;color:#fff!important;border-radius:12px!important;padding:12px 13px!important;margin:2px 0 10px!important;display:flex!important;justify-content:space-between!important;align-items:center!important}
.fzAllHead span{color:#D9ECFF!important}
@media(max-width:390px){.fzDay{flex-basis:64px!important;height:56px!important}.fzDay strong{font-size:13px!important}}

.fzFutsalBar{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;padding:5px 2px 12px;margin:0 -2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fzFutsalBar::-webkit-scrollbar{display:none}
.fzFutsalChip{flex:0 0 150px;min-height:66px;border:1px solid #1B3550;border-radius:12px;background:linear-gradient(180deg,#0D1B2A,#07111C);color:#C4CDD7;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.fzFutsalChip span{font-size:15px;line-height:1}
.fzFutsalChip b{font-size:12px;color:#F5F7FA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzFutsalChip small{font-size:9px;color:#7FA6D2;text-transform:uppercase;font-weight:900}
.fzFutsalChip.active{background:linear-gradient(180deg,#0872E8,#00458F);border-color:#1683FF;color:#fff;box-shadow:0 0 0 1px rgba(22,131,255,.2),0 6px 16px rgba(0,87,184,.3)}
.fzFutsalChip.active b,.fzFutsalChip.active small{color:#fff}
.fzFutComp{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.fzFutComp::-webkit-scrollbar{display:none}
.fzFutComp button{flex:0 0 auto;border:1px solid #173149;background:#07131E;color:#AAB6C4;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:800}
.fzFutComp button.active{background:#0057B8;border-color:#1683FF;color:#fff}
.fzSource{font-size:11px;color:#8FA5BA;line-height:1.5;margin:5px 0 12px}
.fzSource a{color:#1683FF}
</style>

<style id="futzone-skin-safe">
:root{--blue:#0088FF;--blue2:#1683FF;--blue3:#003B7A;--bg:#02080F;--panel:#03111B;--panel2:#071A28;--border:#0C2636;--text:#F7F9FC;--muted:#AAB4C1}
html,body{background:#02080F;color:#F7F9FC}.app{max-width:720px;background:#02080F}
.header{background:linear-gradient(180deg,#03111B 0%,#020B13 100%);border-bottom:1px solid #0B2637}.logo{font-size:31px;font-style:italic;letter-spacing:-1.5px;text-transform:uppercase}.logo span{color:#1683FF}.subtitle{color:#F7F9FC;letter-spacing:1.7px}
.sportBtn{background:#061520;border-color:#12354A}.sportBtn.active{background:#0088FF;border-color:#1683FF}
.leagues{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;gap:8px!important;padding:10px 14px 12px!important;background:#02080F;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}.league{display:block!important;flex:0 0 auto!important;white-space:nowrap!important;background:#061520!important;border-color:#12354A!important;color:#C4CDD7!important;border-radius:9px!important}.league.active{background:#0057B8!important;border-color:#1683FF!important;color:#fff!important}
#footballSection>.sectionTitle,#futsalSection>.sectionTitle{background:#001C2A;color:#1683FF;text-transform:uppercase;letter-spacing:1.2px}
.game{background:#020D15;border-color:#0A2533}.filter{background:#061520;border-color:#12354A}.filter.active{background:#0057B8;border-color:#1683FF}.search{background:#061520;border-color:#12354A}
.liveAll{background:#0057B8;border-radius:8px}.bottomNav{height:78px;grid-template-columns:repeat(4,1fr);background:#03131E;border-top:1px solid #0B2A3B}.navBtn.active{color:#1683FF}.navIcon{font-size:25px}

<style id="fzNoSeparateFutsal">.sportSwitch #btnFutsal,#navFutsal{display:none!important}</style>

<body>
<div class="app">
<header class="header">
<div class="logo">FUT<span>ZONE</span></div>
<div class="subtitle">FUTEBOL EM DIRETO</div>
<div class="sportSwitch">
<button class="sportBtn active" id="btnFutebol" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
<button class="sportBtn" id="btnFutsal" onclick="mudarDesporto('futsal')">&#129358; Futsal</button>
</div>
</header>

<main>
<section id="footballSection">
<div class="sectionTitle">Competi&ccedil;&otilde;es</div>
<div class="leagues" id="leagueList"></div>
<button class="liveAll" onclick="mostrarTodosLive()">🔴 LIVE — TODAS AS LIGAS</button>
<input class="search" id="searchInput" type="search" placeholder="🔎 Procurar equipa..." oninput="renderizarJogos()">
<div class="filters">
<button class="filter active" data-filter="todos" onclick="setFiltro('todos')">Todos</button>
<button class="filter" data-filter="live" onclick="setFiltro('live')">🔴 Live</button>
<button class="filter" data-filter="proximos" onclick="setFiltro('proximos')">Pr&oacute;ximos</button>
<button class="filter" data-filter="resultados" onclick="setFiltro('resultados')">Resultados</button>
</div>
<div id="footballContent"></div>
</section>

<section id="futsalSection" class="futsal">
<div class="sectionTitle">&#129358; Futsal</div>
<div class="filters">
<button class="filter active" onclick="futsalTab('jogos',this)">Jogos</button>
<button class="filter" onclick="futsalTab('tabela',this)">Tabela</button>
<button class="filter" onclick="futsalTab('equipas',this)">Equipas</button>
<button class="filter" onclick="futsalTab('competicoes',this)">Competi&ccedil;&otilde;es</button>
</div>
<div id="futsalContent"></div>
</section>
</main>

<nav class="bottomNav">
<button class="navBtn active" id="navJogos" onclick="irJogos()"><span class="navIcon">⚽</span>Jogos</button>
<button class="navBtn" id="navTabelas" onclick="mostrarTabelaFutebol()"><span class="navIcon">🏆</span>Tabelas</button>
<button class="navBtn" id="navFav" onclick="mostrarFavoritos()"><span class="navIcon">⭐</span>Favoritos</button>
<button class="navBtn" id="navFutsal" onclick="mudarDesporto('futsal')"><span class="navIcon">&#129358;</span>Futsal</button>
</nav>
</div>

<div class="overlay" id="overlay">
<div class="detailHeader">
<button class="back" onclick="fecharOverlay()">←</button>
<div class="detailTitle" id="overlayTitle">Detalhes</div>
</div>
<div class="detailBody" id="overlayBody"></div>
</div>

<script>
const API="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const STANDINGS_API="https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[
["por.1","🇵🇹 Liga Portugal"],
["por.2","🇵🇹 Liga Portugal 2"],
["por.3","🇵🇹 Liga 3"],
["por.w.1","🇵🇹 Liga BPI Feminina"],
["eng.1","🏴 Premier League"],
["eng.2","🏴 Championship"],
["esp.1","🇪🇸 La Liga"],
["esp.2","🇪🇸 La Liga 2"],
["ita.1","🇮🇹 Serie A"],
["ita.2","🇮🇹 Serie B"],
["ger.1","🇩🇪 Bundesliga"],
["ger.2","🇩🇪 2. Bundesliga"],

["fra.2","🇫🇷 Ligue 2"],
["ned.1","🇳🇱 Eredivisie"],
["bel.1","🇧🇪 Jupiler Pro League"],
["ksa.1","🇸🇦 Liga Saudita"],
["usa.1","🇺🇸 MLS"],
["uefa.champions","🏆 Champions League"],
["uefa.europa","🏆 Europa League"],
["uefa.europa.conf","🏆 Conference League"],
["futsal:liga","🥅 Liga Placard"],
["futsal:ii","🥅 Futsal II Divisão"],
["futsal:iii","🥅 Futsal III Divisão"],

["futsal:taca","🏆 Taça de Portugal Futsal"]
];

const LIGAS_FUTEBOL=ligas.filter(x=>!String(x[0]).startsWith("futsal:"));

let ligaAtual="por.1";
let filtroAtual="todos";
let jogosFutebol=[];
let desportoAtual="futebol";

let favoritosJogos=JSON.parse(localStorage.getItem("futzone_jogos_favoritos")||"[]");
let favoritosEquipas=JSON.parse(localStorage.getItem("futzone_equipas_favoritas")||"[]");

const FALLBACK={
"por.2":{
games:[

function escapeHtml(v){
return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function normalizarData(v){
const d=new Date(v);
return Number.isNaN(d.getTime())?null:d;
}

function hojeISO(offset=0){
const d=new Date();
d.setDate(d.getDate()+offset);
return d.toISOString().slice(0,10).replaceAll("-","");
}

function formatarData(v){
const d=normalizarData(v);
return d?d.toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"2-digit"}):"";
}

function dataCurta(v){
const d=normalizarData(v);
return d?d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"}):"";
}

function horaEvento(e){
const d=normalizarData(e?.date);
return d?d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}):"--:--";
}

function nomeEquipa(t){
return t?.displayName||t?.shortDisplayName||t?.name||"Equipa";
}

function logoEquipa(t){
return t?.logo||t?.logos?.[0]?.href||"";
}

function isLive(e){
return e?.status?.type?.state==="in"||
e?.status?.type?.name==="STATUS_IN_PROGRESS"||
e?.status?.type?.name==="STATUS_HALFTIME";
}

function isFinal(e){
return e?.status?.type?.completed===true||
e?.status?.type?.state==="post"||
e?.status?.type?.name==="STATUS_FINAL";
}

function getCompeticao(id){
return ligas.find(x=>x[0]===id)?.[1]||id;
}

function favoritoJogo(id){
return favoritosJogos.includes(String(id));
}

function guardarFavoritos(){
localStorage.setItem("futzone_jogos_favoritos",JSON.stringify(favoritosJogos));
localStorage.setItem("futzone_equipas_favoritas",JSON.stringify(favoritosEquipas));
}

async function fetchJSON(url,timeoutMs=9000){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeoutMs);
try{
const r=await fetch(url,{cache:"no-store",signal:controller.signal});
if(!r.ok)throw Error("HTTP "+r.status);
return await r.json();
}finally{
clearTimeout(timer);
}
}

function makeFallbackEvent(liga,row,i){
const [date,home,away,hs,as]=row;
const final=hs!==null&&as!==null;
return {
id:`fz-${liga}-${date}-${i}-${home.replace(/\W+/g,"")}`,
date,
name:`${home} vs ${away}`,
league:{name:getCompeticao(liga)},
competitions:[{
league:{name:getCompeticao(liga)},
competitors:[
{id:`${liga}-h-${i}`,homeAway:"home",team:{displayName:home,shortDisplayName:home},...(final?{score:String(hs)}:{})},
{id:`${liga}-a-${i}`,homeAway:"away",team:{displayName:away,shortDisplayName:away},...(final?{score:String(as)}:{})}
],
status:{type:{state:final?"post":"pre",completed:final}}
}],
__futzoneLiga:liga,
__fallback:true
};
}

function fallbackGames(liga){
return (FALLBACK[liga]?.games||[])
.map((x,i)=>makeFallbackEvent(liga,x,i))
.filter(e=>{
const d=new Date(e.date);
const now=new Date();
return d>=new Date(now.getTime()-8*86400000)&&d<=new Date(now.getTime()+45*86400000);
});
}

/* Pesquisa apenas a competição escolhida. */
async function buscarJogosLiga(liga){
if(String(liga).startsWith("futsal:"))return [];

let eventos=[];
const pedidos=[];

/* Janela menor para acelerar o carregamento. */
for(let i=-3;i<=10;i++){
const url=API+encodeURIComponent(liga)+"/scoreboard?dates="+hojeISO(i);
pedidos.push(fetchJSON(url,7000).then(x=>x.events||[]).catch(()=>[]));
}

const rs=await Promise.all(pedidos);

rs.flat().forEach(e=>{
if(!eventos.some(x=>String(x.id)===String(e.id))){
e.__futzoneLiga=liga;
eventos.push(e);
}
});

if(["por.2","por.3","por.w.1"].includes(liga)){
const fb=fallbackGames(liga);
fb.forEach(e=>{
if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e);
});
}

eventos.sort((a,b)=>new Date(a.date)-new Date(b.date));
return eventos;
}

function setFiltro(f){

document.querySelectorAll(".filter[data-filter]")
.forEach(b=>b.classList.toggle("active",b.dataset.filter===f));

if(fzModoTodos){
fzRenderTodos();
}else{
renderizarJogos();
}
}

function passaFiltro(e){
if(filtroAtual==="live")return isLive(e);
if(filtroAtual==="resultados")return isFinal(e);
if(filtroAtual==="proximos")return !isFinal(e)&&!isLive(e);
return true;
}

function renderizarJogos(){
if(fzModoTodos){
fzRenderTodos();
return;
}

const c=document.getElementById("footballContent");
const q=(document.getElementById("searchInput").value||"").trim().toLowerCase();

let ev=jogosFutebol
.filter(passaFiltro)
.filter(e=>{
const cs=e.competitions?.[0]?.competitors||[];
const h=cs.find(x=>x.homeAway==="home");
const a=cs.find(x=>x.homeAway==="away");

return !q||
nomeEquipa(h?.team).toLowerCase().includes(q)||
nomeEquipa(a?.team).toLowerCase().includes(q);
});

if(!ev.length){
c.innerHTML='<div class="empty">⚽<br><br>Não existem jogos para mostrar neste filtro.</div>';
return;
}

const g={};

ev.forEach(e=>{
const d=new Date(e.date).toISOString().slice(0,10);
(g[d]??=[]).push(e);
});

c.innerHTML=Object.keys(g).sort().map(d=>`
<div class="dayTitle">
<span>${escapeHtml(formatarData(g[d][0].date))}</span>
<span>${dataCurta(g[d][0].date)}</span>
</div>
${g[d].map(cartaoJogo).join("")}
`).join("");
}

function cartaoJogo(e){
const cs=e.competitions?.[0]?.competitors||[];
const h=cs.find(x=>x.homeAway==="home")||cs[0];
const a=cs.find(x=>x.homeAway==="away")||cs[1];

const live=isLive(e);
const fin=isFinal(e);

let estado=live
?'<span class="status live">🔴 AO VIVO</span>'
:fin
?'<span class="status final">FINAL</span>'
:`<span class="status">${horaEvento(e)}</span>`;

let score=live||fin
?`<div class="score">${escapeHtml(h?.score??"-")} - ${escapeHtml(a?.score??"-")}</div>`
:`<div class="scoreTime">${horaEvento(e)}</div>`;

const id=String(e.id).replaceAll("'","");
const liga=e.__futzoneLiga||ligaAtual;

return `
<div class="game" onclick="abrirJogo('${id}')">

<div class="gameTop">
<div class="comp">${escapeHtml(e.league?.name||getCompeticao(liga))}</div>
${estado}
<button class="star ${favoritoJogo(e.id)?"on":""}"
onclick="event.stopPropagation();toggleFavoritoJogo('${id}')">
${favoritoJogo(e.id)?"★":"☆"}
</button>
</div>

<div class="teams">

<div class="team clickTeam"
onclick="event.stopPropagation();fzAbrirEquipa('${encodeURIComponent(h?.team?.id||"")}','${encodeURIComponent(nomeEquipa(h?.team))}','${encodeURIComponent(logoEquipa(h?.team))}','${encodeURIComponent(liga)}')">

${logoEquipa(h?.team)?`<img class="teamLogo" src="${escapeHtml(logoEquipa(h.team))}">`:""}

<div class="teamName">${escapeHtml(nomeEquipa(h?.team))}</div>
</div>

${score}

<div class="team away clickTeam"
onclick="event.stopPropagation();fzAbrirEquipa('${encodeURIComponent(a?.team?.id||"")}','${encodeURIComponent(nomeEquipa(a?.team))}','${encodeURIComponent(logoEquipa(a?.team))}','${encodeURIComponent(liga)}')">

<div class="teamName">${escapeHtml(nomeEquipa(a?.team))}</div>

${logoEquipa(a?.team)?`<img class="teamLogo" src="${escapeHtml(logoEquipa(a.team))}">`:""}

</div>
</div>
</div>`;
}

/* Cache para não descarregar novamente todas as ligas a cada filtro. */
const fzCacheTodos=new Map();

async function fzBuscarTodos(){

const agora=new Date();
const ini=new Date(agora);
ini.setDate(ini.getDate()-1);

const fim=new Date(agora);
fim.setDate(fim.getDate()+14);

const ds=x=>x.toISOString().slice(0,10).replaceAll("-","");
const range=ds(ini)+"-"+ds(fim);

const out=[];
const seen=new Set();

for(let i=0;i<LIGAS_FUTEBOL.length;i+=5){

const lote=LIGAS_FUTEBOL.slice(i,i+5);

await Promise.all(lote.map(async l=>{

const liga=l[0];

if(fzCacheTodos.has(liga)){

fzCacheTodos.get(liga).forEach(e=>{
if(!seen.has(String(e.id))){
seen.add(String(e.id));
out.push(e);
}
});

return;
}

try{

const d=await fetchJSON(
API+encodeURIComponent(liga)+"/scoreboard?dates="+range,
8000
);

const eventos=(d.events||[]).map(e=>{
e.__futzoneLiga=liga;
return e;
});

fzCacheTodos.set(liga,eventos);

eventos.forEach(e=>{
if(!seen.has(String(e.id))){
seen.add(String(e.id));
out.push(e);
}
});

}catch(e){

console.warn("FUTZONE:",liga,e);

}

}));

}

out.sort((a,b)=>new Date(a.date)-new Date(b.date));

return out;
}

async function fzRenderTodos(){

const c=document.getElementById("footballContent");
if(!c)return;

c.innerHTML='<div class="loading">⏳ A carregar todas as competições...</div>';

const ev=await fzBuscarTodos();

let arr=ev;

function extrairTabela(data){

const out=[];

function walk(o){

if(!o||typeof o!=="object")return;

if(Array.isArray(o)){
o.forEach(walk);
return;
}

if(o.team&&(o.stats||o.records||o.rank)){
out.push(o);
}

Object.values(o).forEach(walk);
}

walk(data);

const m=new Map();

out.forEach(x=>{
const id=x.team?.id||x.team?.uid||x.team?.displayName;
if(id)m.set(id,x);
});

return [...m.values()];
}

function statVal(item,names){

const a=item.stats||item.records||[];

for(const n of names){

const x=a.find(s=>
s.name===n||
s.abbreviation===n||
s.type===n
);

if(x)return x.displayValue??x.value??"0";
}

return "0";
}

function nStat(item,n){

const x=parseFloat(
String(statVal(item,n)).replace(",",".")
);

return Number.isFinite(x)?x:0;
}

function normalizarTabela(t){

return [...t].map((x,i)=>{

const team=x.team||{};

return {
...x,
rank:Number(x.rank)||i+1,
team:{
...team,
displayName:nomeEquipa(team)
}
};

}).sort((a,b)=>
(Number(a.rank)||999)-(Number(b.rank)||999)
);
}

<tbody>

${tabela.map((x,i)=>{

const team=x.team||{};
const r=x.rank??i+1;

const j=nStat(x,["gamesPlayed","GP","played"]);
const v=nStat(x,["wins","W"]);

function obterRosters(s){

return s
?[s.rosters,s.roster,s.boxscore?.players,s.players,s.gamepackageJSON?.rosters]
.find(x=>Array.isArray(x)&&x.length)||[]
:[];

function obterJogadoresEquipa(s,id){

const r=obterRosters(s);

for(const b of r){

const bid=b.team?.id||b.teamId||b.team?.uid;

if(String(bid)===String(id)){

return (b.roster||b.players||[])
.map(x=>({...x,athlete:x.athlete||x.player||x}));
}

}

return [];
}

function jogadorEhTitular(j){

return j.starter===true||
j.starting===true||
j.isStarter===true||
j.starter===1||
j.starter==="true"||
j.status?.type==="starter";
}

function nomeJogador(j){

const a=j.athlete||j.player||j;

return a.displayName||
a.fullName||
a.shortName||
a.name||
"Jogador";
}

function numeroJogador(j){

const a=j.athlete||j.player||j;

return j.jersey||
j.jerseyNumber||
a.jersey||
a.jerseyNumber||
"";
}

function posicaoJogador(j){

const a=j.athlete||j.player||j;

return j.position?.abbreviation||
j.position?.displayName||
a.position?.abbreviation||
a.position?.displayName||
"";
}

function posicoesCampo(js){

const t=js.filter(jogadorEhTitular).slice(0,11);

const gr=[],df=[],mf=[],fw=[],out=[];

t.forEach(j=>{

const p=posicaoJogador(j).toLowerCase();

if(/gk|goal|keeper|gr/.test(p))gr.push(j);
else if(/df|def|back|cb|lb|rb/.test(p))df.push(j);
else if(/mf|mid|mc|dm|am/.test(p))mf.push(j);
else if(/fw|fwd|st|cf|att|forward/.test(p))fw.push(j);
else out.push(j);

});

const res=[];

const add=(a,y)=>
a.forEach((j,i)=>
res.push({
jogador:j,
x:a.length===1?50:15+70*i/(a.length-1),
y
})
);

add(gr,91);
add(df,72);
add(mf,51);
add(fw,28);
add(out,28);

return res.slice(0,11);
}

function fzAbrirJogador(id,nome,liga){

id=decodeURIComponent(id||"");
nome=decodeURIComponent(nome||"Jogador");
liga=decodeURIComponent(liga||ligaAtual);

document.getElementById("overlay").classList.add("show");
document.getElementById("overlayTitle").textContent=nome;

document.getElementById("overlayBody").innerHTML=
'<div class="loading">⏳ A carregar jogador...</div>';

const timeout=p=>
Promise.race([
p,
new Promise((_,rej)=>
setTimeout(()=>rej(new Error("timeout")),8000)
)
]);

const primeiro=v=>
Array.isArray(v)?v[0]:v;

const dataValor=claim=>{

const v=claim?.mainsnak?.datavalue?.value;

return v?.time
?v.time.replace(/^\+/,"").split("T")[0]
:v;
};

const entidadeId=claim=>
claim?.mainsnak?.datavalue?.value?.id||"";

(async()=>{

let a={};
let wikidata=null;
let wdEntities={};

try{

if(id){

const d=await timeout(
fetchJSON(
"https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/"+
encodeURIComponent(id),
8000
)
);

a=d?.athlete||d||{};
}

}catch(e){

console.warn("FUTZONE ESPN jogador:",e);

}

try{

const termo=
String(a.displayName||a.fullName||nome).trim();

const q=
"https://www.wikidata.org/w/api.php?action=wbsearchentities"+
"&search="+encodeURIComponent(termo)+
"&language=pt&uselang=pt&format=json&origin=*&limit=8";

const sr=await timeout(fetchJSON(q,8000));

const results=sr?.search||[];

const exact=
results.find(x=>
String(x.label||"").toLowerCase()===termo.toLowerCase()
)||
results[0];

if(exact?.id){

const er=await timeout(
fetchJSON(
"https://www.wikidata.org/w/api.php?action=wbgetentities"+
"&ids="+encodeURIComponent(exact.id)+
"&props=claims%7Clabels%7Cdescriptions"+
"&languages=pt%7Cen&format=json&origin=*",
8000
)
);

wikidata=er?.entities?.[exact.id]||null;

const ids=new Set();

(wikidata?.claims?.P54||[])
.forEach(c=>{
const x=entidadeId(c);
if(x)ids.add(x);
});

["P27","P413"].forEach(prop=>
(wikidata?.claims?.[prop]||[])
.forEach(c=>{
const x=entidadeId(c);
if(x)ids.add(x);
})
);

if(ids.size){

const labels=await timeout(
fetchJSON(
"https://www.wikidata.org/w/api.php?action=wbgetentities"+
"&ids="+encodeURIComponent([...ids].join("|"))+
"&props=labels&languages=pt%7Cen&format=json&origin=*",
8000
)
);

wdEntities=labels?.entities||{};
}

}

}catch(e){

console.warn("FUTZONE Wikidata jogador:",e);

}

const claims=wikidata?.claims||{};

const labelWD=qid=>
wdEntities?.[qid]?.labels?.pt?.value||
wdEntities?.[qid]?.labels?.en?.value||
qid;

const claimLabel=prop=>
labelWD(entidadeId(primeiro(claims[prop])));

const wdNome=
wikidata?.labels?.pt?.value||
wikidata?.labels?.en?.value||
"";

const nomeFinal=
a.displayName||
a.fullName||
wdNome||
nome;

const nacionalidade=
a.nationality?.displayName||
a.nationality||
claimLabel("P27")||
"-";

const nascimento=
a.dateOfBirth||
a.birthDate||
dataValor(primeiro(claims.P569))||
"-";

const altura=
a.displayHeight||
a.height||
(claims.P2048?.[0]?.mainsnak?.datavalue?.value?.amount
?Math.round(Number(
claims.P2048[0].mainsnak.datavalue.value.amount
))+" cm"
:"-");

const peso=
a.displayWeight||
a.weight||
(claims.P2067?.[0]?.mainsnak?.datavalue?.value?.amount
?Math.round(Number(
claims.P2067[0].mainsnak.datavalue.value.amount
))+" kg"
:"-");

const posicao=
a.position?.displayName||
a.position?.name||
claimLabel("P413")||
"Jogador";

const foto=a.headshot?.href||"";

const historico=[];

(claims.P54||[]).forEach(c=>{

const equipa=entidadeId(c);

if(!equipa)return;

const q=c.qualifiers||{};

const inicio=dataValor(primeiro(q.P580));
const fim=dataValor(primeiro(q.P582));

historico.push({
equipa:labelWD(equipa),
inicio,
fim
});

});

const uniq=new Map();

historico.forEach(x=>
uniq.set(
x.equipa+"|"+(x.inicio||"")+"|"+(x.fim||""),
x
)
);

const hist=[...uniq.values()]
.sort((x,y)=>
String(y.inicio||"").localeCompare(String(x.inicio||""))
);

const temporada=x=>
x.inicio
?x.inicio.slice(0,4)+
(
x.fim&&x.fim.slice(0,4)!==x.inicio.slice(0,4)
?"–"+x.fim.slice(0,4)
:""
)
:"";

let histHtml=hist.length
?hist.map(x=>`

<div class="event">

<strong>
${escapeHtml(temporada(x)||"Percurso")}
</strong>

<br>

${escapeHtml(x.equipa)}

${x.inicio||x.fim
?`
<div style="color:var(--muted);font-size:11px;margin-top:3px">
${escapeHtml(x.inicio||"")}
${x.fim?" → "+escapeHtml(x.fim):" → atual"}
</div>
`
:""}

</div>

`).join("")
:'<div style="color:var(--muted);font-size:13px">O histórico deste jogador não está registado na fonte consultada.</div>';

const temDados=
Object.keys(a).length||
wikidata;

if(!temDados){

histHtml=
'<div style="color:var(--muted);font-size:13px">Não foi possível obter dados deste jogador.</div>';

}

document.getElementById("overlayBody").innerHTML=`

<div class="detailCard" style="text-align:center">

${foto
?`<img src="${escapeHtml(foto)}"
style="width:90px;height:90px;object-fit:contain">`
:""}

<h3>👤 ${escapeHtml(nomeFinal)}</h3>

<div style="color:var(--muted)">
${escapeHtml(posicao)}
</div>

</div>

<div class="detailCard">

<h3>📊 Dados</h3>

<div style="color:var(--muted);font-size:13px">

Nacionalidade:
${escapeHtml(nacionalidade)}

<br>

Data de nascimento:
${escapeHtml(nascimento)}

<br>

Altura:
${escapeHtml(altura)}

<br>

Peso:
${escapeHtml(peso)}

</div>

</div>

<div class="detailCard">

<h3>📚 Histórico de clubes</h3>

${histHtml}

</div>
`;

})().catch(e=>{

console.warn("FUTZONE jogador final:",e);

document.getElementById("overlayBody").innerHTML=
'<div class="detailCard"><h3>👤 '+
escapeHtml(nome)+
'</h3><div style="color:var(--muted);font-size:13px">Não foi possível carregar todos os dados deste jogador neste momento.</div></div>';

});

}
