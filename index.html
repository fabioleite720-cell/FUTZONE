<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0057B8">
<title>FUTZONE</title>

<style>
:root{
 --blue:#0057B8;
 --blue2:#1683FF;
 --blue3:#003B7A;
 --black:#03060B;
 --card:#09111C;
 --card2:#0D1724;
 --white:#FFF;
 --gray:#9DAABB;
 --line:#1B2A3B;
 --red:#FF4054;
 --yellow:#FFD43B;
 --green:#20D68A;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 background:#03060B;
 color:white;
 font-family:Arial,Helvetica,sans-serif;
}

body{
 min-height:100vh;
 background:
 radial-gradient(circle at top,#003B7A 0%,#03060B 38%,#03060B 100%);
}

button{
 font:inherit;
 cursor:pointer;
}

.header{
 position:sticky;
 top:0;
 z-index:50;
 padding:13px 15px 11px;
 background:rgba(3,6,11,.96);
 backdrop-filter:blur(15px);
 border-bottom:1px solid var(--line);
}

.logo{
 font-size:29px;
 font-weight:900;
 letter-spacing:1px;
}

.logo span{
 color:var(--blue2);
 text-shadow:0 0 18px rgba(22,131,255,.55);
}

.subtitle{
 color:var(--gray);
 font-size:9px;
 letter-spacing:2.5px;
 margin-top:2px;
}

.container{
 max-width:950px;
 margin:auto;
 padding:13px 12px 95px;
}

.section-title{
 font-size:21px;
 font-weight:900;
 margin:8px 0 12px;
}

.section-title span{
 color:var(--blue2);
}

.leagues{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none;
 padding:2px 0 12px;
}

.leagues::-webkit-scrollbar{
 display:none;
}

.league-btn{
 flex-shrink:0;
 border:1px solid var(--line);
 background:var(--card);
 color:var(--gray);
 padding:9px 13px;
 border-radius:22px;
 font-size:11px;
 font-weight:800;
}

.league-btn.active{
 background:linear-gradient(135deg,var(--blue),var(--blue2));
 color:white;
 border-color:transparent;
 box-shadow:0 5px 20px rgba(0,87,184,.4);
}

.card{
 background:linear-gradient(145deg,var(--card2),var(--card));
 border:1px solid var(--line);
 border-radius:17px;
 margin-bottom:11px;
 overflow:hidden;
 box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.game{
 padding:13px;
 cursor:pointer;
}

.game-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:11px;
}

.game-league{
 color:var(--gray);
 font-size:9px;
 font-weight:700;
}

.live{
 background:var(--red);
 color:white;
 border-radius:20px;
 padding:4px 8px;
 font-size:8px;
 font-weight:900;
 animation:pulse 1.4s infinite;
}

@keyframes pulse{
 50%{opacity:.5}
}

.teams{
 display:grid;
 grid-template-columns:1fr 70px 1fr;
 align-items:center;
 gap:5px;
}

.team{
 text-align:center;
 font-size:12px;
 font-weight:800;
}

.team img{
 width:43px;
 height:43px;
 object-fit:contain;
 display:block;
 margin:0 auto 6px;
}

.score{
 text-align:center;
 font-size:21px;
 font-weight:900;
}

.status{
 text-align:center;
 color:var(--gray);
 font-size:9px;
 margin-top:4px;
}

.star{
 border:0;
 background:none;
 color:#64758A;
 font-size:21px;
 padding:0;
}

.star.on{
 color:var(--yellow);
}

.loading{
 text-align:center;
 padding:30px 10px;
 color:var(--gray);
}

.empty{
 text-align:center;
 padding:30px 15px;
 color:var(--gray);
 font-size:12px;
}

.refresh{
 width:100%;
 background:var(--card);
 color:white;
 border:1px solid var(--line);
 padding:11px;
 border-radius:12px;
 font-weight:800;
}

.search{
 width:100%;
 background:var(--card);
 color:white;
 border:1px solid var(--line);
 border-radius:13px;
 padding:12px 14px;
 outline:none;
 margin-bottom:12px;
}

.search:focus{
 border-color:var(--blue2);
}

.feature-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:18px 0 9px;
}

.feature-title strong{
 font-size:15px;
}

.feature-title span{
 font-size:9px;
 color:var(--gray);
}

.horizontal{
 display:flex;
 gap:10px;
 overflow-x:auto;
 scrollbar-width:none;
 padding-bottom:3px;
}

.horizontal::-webkit-scrollbar{
 display:none;
}

.mini-game{
 flex:0 0 245px;
 background:linear-gradient(145deg,#0E1C2C,#09111C);
 border:1px solid var(--line);
 border-radius:16px;
 padding:11px;
 cursor:pointer;
}

.mini-top{
 display:flex;
 justify-content:space-between;
 color:var(--gray);
 font-size:8px;
 margin-bottom:9px;
}

.mini-teams{
 display:grid;
 grid-template-columns:1fr 55px 1fr;
 align-items:center;
}

.mini-team{
 text-align:center;
 font-size:10px;
 font-weight:800;
}

.mini-team img{
 width:32px;
 height:32px;
 object-fit:contain;
 display:block;
 margin:auto auto 4px;
}

.mini-score{
 text-align:center;
 font-weight:900;
 font-size:18px;
}

.next{
 color:var(--blue2);
}

.live-title{
 color:var(--red);
}

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:68px;
 z-index:100;
 display:flex;
 background:rgba(3,6,11,.98);
 border-top:1px solid var(--line);
 backdrop-filter:blur(15px);
}

.nav{
 flex:1;
 background:none;
 border:0;
 color:#718095;
 font-size:9px;
 font-weight:800;
}

.nav div{
 font-size:22px;
 margin-bottom:2px;
}

.nav.active{
 color:var(--blue2);
 text-shadow:0 0 13px rgba(22,131,255,.6);
}

.overlay{
 position:fixed;
 inset:0;
 z-index:200;
 background:var(--black);
 overflow-y:auto;
 display:none;
}

.overlay.show{
 display:block;
}

.detail-head{
 position:sticky;
 top:0;
 z-index:10;
 display:flex;
 align-items:center;
 gap:12px;
 background:rgba(3,6,11,.97);
 border-bottom:1px solid var(--line);
 padding:12px;
}

.back{
 width:38px;
 height:38px;
 border:0;
 border-radius:12px;
 background:var(--card);
 color:white;
 font-size:22px;
}

.detail-content{
 max-width:900px;
 margin:auto;
 padding:15px;
}

.detail-score{
 text-align:center;
 padding:18px 5px;
}

.detail-score .teams{
 grid-template-columns:1fr 90px 1fr;
}

.detail-score .team img{
 width:65px;
 height:65px;
}

.big-score{
 font-size:34px;
 font-weight:900;
}

.detail-status{
 color:var(--blue2);
 font-size:11px;
 font-weight:900;
 margin-top:5px;
}

.box-title{
 font-size:15px;
 font-weight:900;
 margin:19px 0 9px;
}

.event{
 display:flex;
 gap:9px;
 padding:9px;
 border-bottom:1px solid var(--line);
 font-size:11px;
}

.event-time{
 width:38px;
 color:var(--blue2);
 font-weight:900;
}

.stat{
 display:grid;
 grid-template-columns:55px 1fr 55px;
 gap:8px;
 align-items:center;
 padding:8px 0;
}

.stat-value{
 text-align:center;
 font-weight:900;
}

.stat-name{
 text-align:center;
 color:var(--gray);
 font-size:9px;
}

.bar{
 height:5px;
 background:#172536;
 border-radius:10px;
 overflow:hidden;
}

.bar-fill{
 height:100%;
 background:linear-gradient(90deg,var(--blue),var(--blue2));
}

.table-card{
 overflow-x:auto;
}

.standings{
 width:100%;
 min-width:560px;
 border-collapse:collapse;
}

.standings th{
 color:#7F90A4;
 font-size:8px;
 padding:10px 5px;
 text-align:center;
}

.standings td{
 border-top:1px solid var(--line);
 padding:10px 5px;
 text-align:center;
 font-size:10px;
}

.standings tr{
 cursor:pointer;
}

.standings tr:active{
 background:#102033;
}

.club-cell{
 text-align:left!important;
 min-width:175px;
 font-weight:800;
}

.club-mini{
 width:27px;
 height:27px;
 object-fit:contain;
 vertical-align:middle;
 margin-right:6px;
}

.pos{
 color:var(--gray);
 font-weight:900;
}

.pts{
 color:var(--blue2);
 font-weight:900;
}

.team-cover{
 text-align:center;
 padding:20px 10px;
}

.team-cover img{
 width:85px;
 height:85px;
 object-fit:contain;
}

.team-cover h1{
 margin:9px 0 3px;
 font-size:23px;
}

.team-cover p{
 color:var(--gray);
 font-size:10px;
}

.team-actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.team-actions button{
 flex:1;
}

.player-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.player{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 padding:10px;
 text-align:center;
 cursor:pointer;
}

.player img{
 width:65px;
 height:65px;
 border-radius:50%;
 object-fit:cover;
 background:#172638;
 margin-bottom:6px;
}

.player-name{
 font-size:11px;
 font-weight:900;
}

.player-position{
 color:var(--gray);
 font-size:9px;
 margin-top:4px;
}

.player-profile{
 text-align:center;
 padding:20px 10px;
}

.player-profile img{
 width:120px;
 height:120px;
 border-radius:50%;
 object-fit:cover;
 background:#172638;
 border:3px solid var(--blue);
 box-shadow:0 0 25px rgba(0,87,184,.35);
}

.player-profile h1{
 font-size:24px;
 margin:12px 0 5px;
}

.player-profile p{
 color:var(--gray);
 font-size:11px;
 margin:4px;
}

.info-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.info{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:13px;
 padding:11px;
}

.info small{
 display:block;
 color:var(--gray);
 font-size:8px;
 margin-bottom:5px;
}

.info strong{
 font-size:11px;
}

.history-item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 border-bottom:1px solid var(--line);
 cursor:pointer;
}

.history-item img{
 width:36px;
 height:36px;
 object-fit:contain;
}

.history-item strong{
 font-size:11px;
}

.history-item span{
 display:block;
 color:var(--gray);
 font-size:9px;
 margin-top:3px;
}

.notice{
 background:rgba(0,87,184,.12);
 border:1px solid rgba(22,131,255,.25);
 border-radius:13px;
 padding:12px;
 color:#BDD7F2;
 font-size:10px;
 line-height:1.5;
}

.notification-box{
 background:linear-gradient(145deg,#0D1D31,#09111C);
 border:1px solid rgba(22,131,255,.3);
 border-radius:16px;
 padding:14px;
 margin-bottom:15px;
}

.notification-row{
 display:flex;
 align-items:center;
 gap:12px;
}

.bell{
 font-size:27px;
}

.notification-row div:nth-child(2){
 flex:1;
}

.notification-title{
 font-weight:900;
 font-size:13px;
}

.notification-sub{
 color:var(--gray);
 font-size:9px;
 margin-top:4px;
}

.switch{
 width:48px;
 height:27px;
 border-radius:20px;
 border:0;
 background:#263648;
 position:relative;
}

.switch:after{
 content:"";
 position:absolute;
 top:4px;
 left:4px;
 width:19px;
 height:19px;
 background:white;
 border-radius:50%;
 transition:.2s;
}

.switch.on{
 background:var(--blue);
}

.switch.on:after{
 left:25px;
}

.result-win{
 color:var(--green);
 font-weight:900;
}

.result-loss{
 color:var(--red);
 font-weight:900;
}

.result-draw{
 color:var(--yellow);
 font-weight:900;
}

.search-result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
 border-bottom:1px solid var(--line);
 cursor:pointer;
}

.search-result img{
 width:40px;
 height:40px;
 object-fit:contain;
}

.search-result strong{
 font-size:11px;
}

.search-result small{
 display:block;
 color:var(--gray);
 margin-top:3px;
}

@media(min-width:700px){
 .player-grid{
  grid-template-columns:repeat(4,1fr);
 }
}
</style>
</head>

<body>

<header class="header">
 <div class="logo">FUT<span>ZONE</span></div>
 <div class="subtitle">FUTEBOL EM DIRETO</div>
</header>

<main class="container" id="app"></main>

<nav class="bottom">

 <button class="nav active" id="navJogos" onclick="mostrarJogos()">
  <div>⚽</div>
  Jogos
 </button>

 <button class="nav" id="navTabelas" onclick="mostrarTabelas()">
  <div>🏆</div>
  Tabelas
 </button>

 <button class="nav" id="navFav" onclick="mostrarFavoritos()">
  <div>⭐</div>
  Favoritos
 </button>

</nav>

<div class="overlay" id="overlay">

 <div class="detail-head">
  <button class="back" onclick="fecharOverlay()">‹</button>
  <strong id="overlayTitle">FUTZONE</strong>
 </div>

 <div class="detail-content" id="overlayContent"></div>

</div>

<script>

const ESPN_SITE=
"https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ESPN_STANDINGS=
"https://site.api.espn.com/apis/v2/sports/soccer/";

const ESPN_CORE=
"https://sports.core.api.espn.com/v2/sports/soccer/leagues/";

const leagues=[
 {name:"Portugal",code:"por.1"},
 {name:"Inglaterra",code:"eng.1"},
 {name:"Espanha",code:"esp.1"},
 {name:"Itália",code:"ita.1"},
 {name:"Alemanha",code:"ger.1"},
 {name:"França",code:"fra.1"},
 {name:"Países Baixos",code:"ned.1"},
 {name:"Bélgica",code:"bel.1"},
 {name:"Champions",code:"uefa.champions"},
 {name:"Europa",code:"uefa.europa"},
 {name:"Conference",code:"uefa.europa.conf"}
];

let ligaAtual=leagues[0];
let jogosAtuais=[];
let viewAtual="jogos";

let favoritosJogos=
 JSON.parse(localStorage.getItem("futzone_jogos_favoritos")||"[]");

let favoritosEquipas=
 JSON.parse(localStorage.getItem("futzone_equipas_favoritas")||"[]");

let favoritosJogadores=
 JSON.parse(localStorage.getItem("futzone_jogadores_favoritos")||"[]");

let notificacoesAtivas=
 localStorage.getItem("futzone_notificacoes_ativadas")==="true";

let snapshot=
 JSON.parse(localStorage.getItem("futzone_notificacao_snapshot")||"{}");

function esc(text){
 return String(text??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function logo(team){
 return team?.logo||
 team?.logos?.[0]?.href||
 "";
}

function teamName(team){
 return team?.displayName||
 team?.shortDisplayName||
 team?.name||
 "Equipa";
}

function playerName(p){
 return p?.displayName||
 p?.fullName||
 p?.name||
 "Jogador";
}

function datePT(date){
 if(!date)return "";
 const d=new Date(date);
 if(isNaN(d))return "";
 return d.toLocaleDateString("pt-PT",{
  day:"2-digit",
  month:"2-digit"
 });
}

function timePT(date){
 if(!date)return "";
 const d=new Date(date);
 if(isNaN(d))return "";
 return d.toLocaleTimeString("pt-PT",{
  hour:"2-digit",
  minute:"2-digit"
 });
}

function statusText(status){
 if(!status)return "";

 if(status.type?.state==="in")
  return status.displayClock||"DIRETO";

 if(status.type?.state==="post")
  return "FINAL";

 if(status.type?.name==="STATUS_POSTPONED")
  return "ADIADO";

 return timePT(status.date);
}

function live(status){
 return status?.type?.state==="in";
}

function idade(date){
 if(!date)return "";

 const d=new Date(date);
 const now=new Date();

 let a=
 now.getFullYear()-d.getFullYear();

 if(
  now.getMonth()<d.getMonth()||
  (
   now.getMonth()===d.getMonth()&&
   now.getDate()<d.getDate()
  )
 )a--;

 return a;
}

function statValue(stats,name){
 const s=(stats||[]).find(x=>
  x.name===name||
  x.shortDisplayName===name||
  x.abbreviation===name
 );

 return s?
  (s.displayValue??s.value??0):
  0;
}

function overlay(title,html){

 document.getElementById("overlayTitle").textContent=title;

 document.getElementById("overlayContent").innerHTML=html;

 document.getElementById("overlay").classList.add("show");

 document.body.style.overflow="hidden";
}

function fecharOverlay(){
 document.getElementById("overlay").classList.remove("show");
 document.body.style.overflow="";
}

function nav(id){
 ["navJogos","navTabelas","navFav"].forEach(x=>
  document.getElementById(x)?.classList.remove("active")
 );

 document.getElementById(id)?.classList.add("active");
}


/* ================= JOGOS ================= */

function mostrarJogos(){

 viewAtual="jogos";
 nav("navJogos");

 document.getElementById("app").innerHTML=`

 <div class="section-title">
  ⚽ <span>Futebol</span>
 </div>

 <input
  class="search"
  id="pesquisa"
  placeholder="🔎 Procurar equipa..."
  oninput="pesquisarEquipas(this.value)"
 >

 <div id="searchResults"></div>

 <div class="leagues">

 ${leagues.map((l,i)=>`

  <button
   class="league-btn ${l.code===ligaAtual.code?"active":""}"
   onclick="selecionarLiga(${i})">

   ${esc(l.name)}

  </button>

 `).join("")}

 </div>

 <div id="highlights"></div>

 <div class="section-title">
  ⚽ <span>Jogos</span>
 </div>

 <div id="games">
  <div class="loading">
   A carregar jogos...
  </div>
 </div>
 `;

 carregarJogos();
}

function selecionarLiga(i){
 ligaAtual=leagues[i];

 document.querySelectorAll(".league-btn")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("league-"+i)?.classList.add("active");

 carregarJogos();
}

async function carregarJogos(){

 const area=document.getElementById("games");

 if(!area)return;

 try{

  const r=await fetch(
   ESPN_SITE+
   ligaAtual.code+
   "/scoreboard?limit=100"
  );

  if(!r.ok)throw new Error();

  const data=await r.json();

  jogosAtuais=(data.events||[]).map(ev=>{

   const c=ev.competitions?.[0];

   const h=
    c?.competitors?.find(x=>x.homeAway==="home")||
    c?.competitors?.[0]||
    {};

   const a=
    c?.competitors?.find(x=>x.homeAway==="away")||
    c?.competitors?.[1]||
    {};

   return{
    id:ev.id,
    date:ev.date,
    status:ev.status,
    home:h.team||{},
    away:a.team||{},
    homeScore:h.score??"-",
    awayScore:a.score??"-",
    league:ligaAtual
   };
  });

  verificarNotificacoes();
  renderHighlights();
  renderJogos();

 }catch(e){

  area.innerHTML=`

  <div class="card">
   <div class="empty">
    Não foi possível carregar os jogos.
    <br><br>
    <button class="refresh" onclick="carregarJogos()">
     Tentar novamente
    </button>
   </div>
  </div>`;

 }
}

function renderHighlights(){

 const area=document.getElementById("highlights");

 if(!area)return;

 const aoVivo=jogosAtuais.filter(j=>live(j.status));

 const proximos=jogosAtuais
 .filter(j=>
  !live(j.status)&&
  j.status?.type?.state!=="post"
 )
 .sort((a,b)=>new Date(a.date)-new Date(b.date))
 .slice(0,8);

 let html="";

 if(aoVivo.length){

  html+=`

  <div class="feature-title">
   <strong class="live-title">
    🔴 EM DIRETO
   </strong>
   <span>${aoVivo.length} jogo(s)</span>
  </div>

  <div class="horizontal">
   ${aoVivo.map(miniGame).join("")}
  </div>`;
 }

 if(proximos.length){

  html+=`

  <div class="feature-title">
   <strong class="next">
    🕐 PRÓXIMOS JOGOS
   </strong>
   <span>Hoje / próximos</span>
  </div>

  <div class="horizontal">
   ${proximos.map(miniGame).join("")}
  </div>`;
 }

 area.innerHTML=html;
}

function miniGame(j){

 return`

 <div class="mini-game"
  onclick="abrirJogo('${j.id}')">

  <div class="mini-top">
   <span>${esc(j.league.name)}</span>

   <span>
    ${live(j.status)
     ?"🔴 DIRETO"
     :datePT(j.date)+" "+timePT(j.date)}
   </span>
  </div>

  <div class="mini-teams">

   <div class="mini-team">
    <img src="${logo(j.home)}">
    ${esc(teamName(j.home))}
   </div>

   <div class="mini-score">
    ${j.homeScore} - ${j.awayScore}
   </div>

   <div class="mini-team">
    <img src="${logo(j.away)}">
    ${esc(teamName(j.away))}
   </div>

  </div>
 </div>`;
}

   <table class="standings">

    </thead>

     const t=entry.team||{};
     const s=entry.stats||[];

     const pos=
      statValue(s,"rank")||
      statValue(s,"playoffSeed")||
      i+1;

     const pj=statValue(s,"gamesPlayed");
     const v=statValue(s,"wins");
     const e=
      statValue(s,"ties")||
      statValue(s,"draws");
     const d=statValue(s,"losses");

     const gm=
      statValue(s,"goalsFor")||
      statValue(s,"pointsFor");

     const gs=
      statValue(s,"goalsAgainst")||
      statValue(s,"pointsAgainst");

     const dg=
      statValue(s,"pointDifferential")||
      statValue(s,"goalDifferential");

     const pts=statValue(s,"points");

     return`

     <tr onclick="abrirEquipa('${t.id}','${ligaAtual.code}')">

      <td class="pos">${esc(pos)}</td>

       <img class="club-mini"

      <td>${esc(d)}</td>

       ${esc(pts)}
      </td>

     </tr>`;

    </tbody>
   </table>
  </div>`

  ).join("");

 }catch(e){

  area.innerHTML=`
  <div class="card">
   <div class="empty">

    Erro ao carregar classificação.

    <br><br>

    <button class="refresh"
     onclick="carregarTabela()">
     Tentar novamente
    </button>

   </div>
  </div>`;

 }
}

function extrairTabelas(data){

 const result=[];

 function scan(o){

  if(!o||typeof o!=="object")return;

  if(
   o.standings&&
   Array.isArray(o.standings.entries)
  ){

   result.push({
    name:o.name||"",
    entries:o.standings.entries
   });

   return;
  }

  if(
   Array.isArray(o.entries)&&
   o.entries.some(x=>x.team)
  ){

   result.push({
    name:o.name||"",
    entries:o.entries
   });

   return;
  }

  Object.values(o).forEach(v=>{

   if(Array.isArray(v))
    v.forEach(scan);
   else if(v&&typeof v==="object")
    scan(v);

  });
 }

 scan(data);

 const seen=new Set();

 return result.filter(g=>{

  const key=g.entries
   .map(x=>x.team?.id)
   .join(",");

  if(seen.has(key))return false;

  seen.add(key);
  return true;
 });
}

async function carregarHistorico(id,league,p){

 const area=document.getElementById("playerHistory");

 if(!area)return;

 let html="";

 /*
  Tentamos obter informação de carreira
  através dos dados disponibilizados pelo ESPN.
 */

 const possiveis=[
  p.career,
  p.careerHistory,
  p.history,
  p.teams
 ];

 const teams=[];

 function scan(o){

  if(!o)return;

  if(Array.isArray(o)){
   o.forEach(scan);
   return;
  }

  if(typeof o!=="object")return;

  if(o.team&&typeof o.team==="object")
   teams.push(o.team);

  if(o.id&&(
   o.displayName||
   o.name
  )){
   teams.push(o);
  }

  Object.values(o).forEach(v=>{
   if(v&&typeof v==="object")
    scan(v);
  });
 }

 possiveis.forEach(scan);

 const unique=[];

 teams.forEach(t=>{

  if(
   t.id&&
   !unique.some(
    x=>String(x.id)===String(t.id)
   )
  ){
   unique.push(t);
  }

 });

 if(unique.length){

  html+=unique.map(t=>`

   <div class="history-item"
    onclick="abrirEquipa('${t.id}','${league}')">

    <img src="${logo(t)}">

    <div style="flex:1">

     <strong>
      ${esc(teamName(t))}
     </strong>

     <span>
      Ver clube
     </span>

    </div>

    <span>›</span>

   </div>`

  ).join("");

 }else{

  html+=`
  <div class="notice">

   O ESPN não disponibilizou neste momento
   um histórico completo de clubes para este jogador.

   <br><br>

   O perfil, clube atual e restantes dados
   disponíveis continuam apresentados acima.

  </div>`;

 }

 try{

  const r=await fetch(
   ESPN_CORE+
   league+
   "/athletes/"+
   id+
   "/statistics"
  );

  if(r.ok){

   const d=await r.json();

   const stats=
    d.statistics||
    d.items||
    d.splits||
    [];

   if(Array.isArray(stats)&&stats.length){

    html+=`
    <div class="box-title">
     📈 Estatísticas
    </div>`;

    stats.slice(0,25).forEach(s=>{

     const name=
      s.name||
      s.displayName||
      s.label||
      "Estatística";

     const value=
      s.displayValue??
      s.value??
      "";

     if(value==="")return;

     html+=`

     <div class="history-item">

      <div style="flex:1">
       <strong>${esc(name)}</strong>
      </div>

      <strong>${esc(value)}</strong>

     </div>`;

    });

   }
  }

 }catch(e){}

 area.innerHTML=html;
}

  area.innerHTML=`

   ${filtradas.map(t=>`

    <div class="search-result"
     onclick="abrirEquipa('${t.id}','${ligaAtual.code}')">

     <img src="${logo(t)}">

     <div>
      <strong>${esc(teamName(t))}</strong>
      <small>${esc(ligaAtual.name)}</small>
     </div>

     <span style="margin-left:auto">›</span>

    </div>`

   ).join("")}

  </div>`;

 }catch(e){

  area.innerHTML="";
 }
}


/* ================= NOTIFICAÇÕES ================= */

async function ativarNotificacoes(){

 if(!("Notification" in window)){

  alert(
   "Este navegador não suporta notificações."
  );

  return;
 }

 if(Notification.permission==="denied"){

  alert(
   "As notificações estão bloqueadas no navegador."
  );

  return;
 }

 if(Notification.permission!=="granted"){

  const permission=
   await Notification.requestPermission();

  if(permission!=="granted"){

   notificacoesAtivas=false;

   localStorage.setItem(
    "futzone_notificacoes_ativadas",
    "false"
   );

   return;
  }
 }

 notificacoesAtivas=true;

 localStorage.setItem(
  "futzone_notificacoes_ativadas",
  "true"
 );

 mostrarFavoritos();
}

function desativarNotificacoes(){

 notificacoesAtivas=false;

 localStorage.setItem(
  "futzone_notificacoes_ativadas",
  "false"
 );

 mostrarFavoritos();
}

function toggleNotificacoes(){

 if(notificacoesAtivas)
  desativarNotificacoes();
 else
  ativarNotificacoes();
}

function enviarNotificacao(title,text){

 if(!notificacoesAtivas)return;

 if(!("Notification" in window))return;

 if(Notification.permission!=="granted")return;

 try{

  new Notification(title,{
   body:text
  });

 }catch(e){}
}

async function verificarNotificacoes(){

 if(!notificacoesAtivas)return;

 if(!jogosAtuais.length)return;

 for(const j of jogosAtuais){

  const id=String(j.id);

  const novo={
   home:String(j.homeScore),
   away:String(j.awayScore),
   status:j.status?.type?.state||""
  };

  const antigo=snapshot[id];

  /*
   Só avisamos de alterações em jogos
   que o utilizador marcou como favorito.
  */

  const favorito=favoritosJogos.includes(id);

  if(antigo&&favorito){

   if(
    antigo.home!==novo.home||
    antigo.away!==novo.away
   ){

    enviarNotificacao(
     "⚽ FUTZONE — GOLO!",
     teamName(j.home)+
     " "+j.homeScore+
     " - "+j.awayScore+
     " "+teamName(j.away)
    );
   }

   if(
    antigo.status==="in"&&
    novo.status==="post"
   ){

    enviarNotificacao(
     "🏁 FUTZONE — FIM DO JOGO",
     teamName(j.home)+
     " "+j.homeScore+
     " - "+j.awayScore+
     " "+teamName(j.away)
    );
   }
  }

  snapshot[id]=novo;
 }

 localStorage.setItem(
  "futzone_notificacao_snapshot",
  JSON.stringify(snapshot)
 );
}

/* ================= GUARDAR NOMES DOS FAVORITOS ================= */

/*
 Sempre que abrimos uma equipa/jogador favorito,
 tentamos guardar o nome e logo para que a
 página de favoritos fique mais bonita.
*/

const oldToggleEquipa=toggleEquipa;

toggleEquipa=async function(id,league){

 id=String(id);

 const index=favoritosEquipas.findIndex(
  x=>String(x.id)===id
 );

 if(index>=0){

  favoritosEquipas.splice(index,1);

  localStorage.setItem(
   "futzone_equipas_favoritas",
   JSON.stringify(favoritosEquipas)
  );

  abrirEquipa(id,league);
  return;
 }

 try{

  const r=await fetch(
   ESPN_SITE+
   league+
   "/teams/"+
   id
  );

  const d=await r.json();

  const t=d.team||d;

  favoritosEquipas.push({
   id:id,
   league:league,
   name:teamName(t),
   logo:logo(t)
  });

 }catch(e){

  favoritosEquipas.push({
   id:id,
   league:league,
   name:"Equipa favorita"
  });

 }

 localStorage.setItem(
  "futzone_equipas_favoritas",
  JSON.stringify(favoritosEquipas)
 );

 abrirEquipa(id,league);
};

const oldToggleJogador=toggleJogador;

toggleJogador=async function(id,league){

 id=String(id);

 const index=favoritosJogadores.findIndex(
  x=>String(x.id||x)===id
 );

 if(index>=0){

  favoritosJogadores.splice(index,1);

  localStorage.setItem(
   "futzone_jogadores_favoritos",
   JSON.stringify(favoritosJogadores)
  );

  abrirJogador(id,league);
  return;
 }

 try{

  const r=await fetch(
   ESPN_CORE+
   league+
   "/athletes/"+
   id
  );

  const d=await r.json();

  const p=d.athlete||d;

  favoritosJogadores.push({
   id:id,
   league:league,
   name:playerName(p),
   photo:p.headshot?.href||p.photo||""
  });

 }catch(e){

  favoritosJogadores.push({
   id:id,
   league:league,
   name:"Jogador favorito"
  });

 }

 localStorage.setItem(
  "futzone_jogadores_favoritos",
  JSON.stringify(favoritosJogadores)
 );

 abrirJogador(id,league);
};
