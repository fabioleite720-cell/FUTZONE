<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#03060B;
 color:#FFF;
 font-family:Arial,sans-serif
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#09111C;
 border-bottom:1px solid #1B2A3B;
 padding:14px 12px
}

.logo{
 font-size:25px;
 font-weight:900
}

.logo span{
 color:#1683FF
}

.sub{
 font-size:10px;
 color:#9DAABB;
 margin-top:2px
}

main{
 padding:12px 10px 85px;
 max-width:720px;
 margin:auto
}

h2{
 font-size:18px;
 margin:15px 0 10px
}

h3{
 font-size:14px
}

.seletor-ligas{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-bottom:14px
}

.liga-btn{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:10px 5px;
 color:#FFF;
 font-size:12px;
 font-weight:bold
}

.liga-btn.active{
 background:#003B7A;
 border-color:#1683FF
}

.liga-icon{
 display:block;
 font-size:20px;
 margin-bottom:4px
}

/* BOTÕES DE CATEGORIAS */

.categorias-jogos{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:10px 0 14px
}

.categoria-btn{
 background:#09111C;
 border:1px solid #1B2A3B;
 color:#9DAABB;
 border-radius:11px;
 padding:11px 4px;
 font-size:11px;
 font-weight:900
}

.categoria-btn.active{
 background:#003B7A;
 border-color:#1683FF;
 color:#FFF
}

.categoria-icon{
 display:block;
 font-size:19px;
 margin-bottom:4px
}

.categoria-btn.live{
 border-color:#FF4054
}

/* CASINHAS DAS SECÇÕES */

.grupo-jogos{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:13px;
 margin:10px 0;
 padding:10px
}

.grupo-titulo{
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-size:14px;
 font-weight:900;
 padding:2px 2px 10px
}

.grupo-contagem{
 color:#9DAABB;
 font-size:10px;
 font-weight:normal
}

.jogo{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:11px;
 margin-bottom:7px;
 cursor:pointer
}

.jogo:last-child{
 margin-bottom:0
}

.jogo-top{
 display:flex;
 justify-content:space-between;
 color:#9DAABB;
 font-size:10px;
 margin-bottom:8px
}

.equipas{
 display:grid;
 grid-template-columns:1fr 65px 1fr;
 align-items:center;
 gap:5px
}

.equipa{
 text-align:center;
 font-size:12px;
 font-weight:bold
}

.equipa-clicavel{
 cursor:pointer
}

.equipa-clicavel:active{
 opacity:.7
}

.escudo{
 width:31px;
 height:31px;
 object-fit:contain;
 display:block;
 margin:0 auto 4px
}

.resultado{
 text-align:center;
 font-size:18px;
 font-weight:900
}

.estado-live{
 color:#FF4054;
 font-weight:900
}

.estado-final{
 color:#9DAABB
}

.vazio,
.erro,
.carregando{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:18px;
 text-align:center;
 color:#9DAABB
}

.erro{
 color:#FF8F8F
}

/* MENU */

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:64px;
 background:#09111C;
 border-top:1px solid #1B2A3B;
 display:flex;
 z-index:30
}

.bottom button{
 background:none;
 border:0;
 color:#9DAABB;
 font-weight:bold;
 width:33%;
 font-size:12px
}

.bottom button.active{
 color:#1683FF
}

/* DETALHES */

.overlay{
 position:fixed;
 inset:0;
 background:#03060B;
 z-index:50;
 overflow:auto
}

.detalhe-header{
 position:sticky;
 top:0;
 background:#09111C;
 border-bottom:1px solid #1B2A3B;
 padding:11px;
 z-index:5
}

.voltar{
 background:#0D1724;
 border:1px solid #243653;
 color:#FFF;
 border-radius:8px;
 padding:8px 12px;
 font-weight:bold
}

.detalhe{
 max-width:720px;
 margin:auto;
 padding:10px 10px 35px
}

.jogo-grande{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:14px;
 padding:18px 8px;
 margin-bottom:10px
}

.jogo-grande .equipas{
 grid-template-columns:1fr 85px 1fr
}

.jogo-grande .escudo{
 width:52px;
 height:52px
}

.jogo-grande .equipa{
 font-size:14px
}

.bigscore{
 text-align:center;
 font-size:29px;
 font-weight:900
}

.estado{
 text-align:center;
 color:#1683FF;
 font-size:11px;
 margin-top:4px
}

.secao{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:12px;
 margin:10px 0;
 padding:11px
}

.secao h3{
 margin:0 0 9px
}

.evento{
 display:flex;
 gap:8px;
 padding:8px 0;
 border-bottom:1px solid #1B2A3B;
 font-size:12px
}

.evento:last-child{
 border:0
}

.minuto{
 color:#1683FF;
 font-weight:bold;
 min-width:35px
}

/* ESTATÍSTICAS */

.stats-head,
.stat-row{
 display:grid;
 grid-template-columns:1fr 95px 1fr;
 text-align:center
}

.stats-head{
 font-size:11px;
 color:#9DAABB
}

.stat-row{
 padding:8px 0;
 border-top:1px solid #1B2A3B;
 font-size:11px
}

.nome{
 color:#9DAABB;
 font-size:10px
}

.stat-home{
 text-align:right;
 font-weight:bold
}

.stat-away{
 text-align:left;
 font-weight:bold
}

/* PLANTEL */

.lista-jogadores{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px
}

.jogador{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:7px;
 padding:8px;
 font-size:11px
}

.jogador b{
 color:#1683FF;
 margin-right:4px
}

.subtitulo{
 color:#9DAABB;
 font-size:10px;
 margin:7px 0
}

/* TABELAS */

.tabela-caixa{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:13px;
 padding:10px;
 margin-top:10px;
 overflow-x:auto
}

.tabela-titulo{
 display:flex;
 align-items:center;
 gap:8px;
 font-size:15px;
 font-weight:900;
 margin-bottom:10px
}

.tabela-scroll{
 overflow-x:auto
}

table{
 width:100%;
 min-width:520px;
 border-collapse:collapse;
 font-size:11px
}

th,
td{
 padding:8px 4px;
 border-bottom:1px solid #1B2A3B;
 text-align:center
}

th{
 color:#9DAABB
}

.team-cell{
 text-align:left;
 font-weight:bold;
 cursor:pointer
}

.team-cell:active{
 color:#1683FF
}

.posicao{
 color:#9DAABB;
 width:25px
}

/* CLUBE */

.equipa-header{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:13px;
 padding:18px 10px;
 text-align:center;
 margin-bottom:10px
}

.equipa-header .escudo{
 width:70px;
 height:70px
}

.equipa-nome{
 font-size:19px;
 font-weight:900;
 margin-top:8px
}

.jogo-equipa{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:10px;
 padding:9px;
 margin-bottom:7px;
 cursor:pointer
}

.clube-equipas{
 display:grid;
 grid-template-columns:1fr 55px 1fr;
 align-items:center;
 text-align:center;
 font-size:11px;
 font-weight:bold
}

.clube-score{
 font-size:16px;
 font-weight:900
}

.clube-tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-bottom:10px
}

.clube-tab{
 background:#0D1724;
 border:1px solid #1B2A3B;
 color:#9DAABB;
 border-radius:8px;
 padding:9px;
 font-size:11px;
 font-weight:bold
}

.clube-tab.active{
 background:#003B7A;
 color:#FFF;
 border-color:#1683FF
}
</style>
</head>

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>
 <div class="sub">FUTEBOL EM DIRETO</div>
</header>

<main id="app"></main>

<div class="bottom">
 <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
 <button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
 <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[
 {name:"Portugal",code:"por.1",icon:"🇵🇹"},
 {name:"Inglaterra",code:"eng.1",icon:"🏴"},
 {name:"Espanha",code:"esp.1",icon:"🇪🇸"},
 {name:"Itália",code:"ita.1",icon:"🇮🇹"},
 {name:"Alemanha",code:"ger.1",icon:"🇩🇪"},
 {name:"França",code:"fra.1",icon:"🇫🇷"},
 {name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},
 {name:"Bélgica",code:"bel.1",icon:"🇧🇪"},
 {name:"Champions",code:"uefa.champions",icon:"🏆"},
 {name:"Europa",code:"uefa.europa",icon:"🏆"},
 {name:"Conference",code:"uefa.europa.conf",icon:"🏆"}
];

let ligaAtual=ligas[0];
let jogosAtuais=[];
let modoJogos="todos";
let clubeAtual=null;

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m])
);

function logo(u){
 return u
 ? `<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`
 : `<div style="height:35px"></div>`;
}

function nav(id){
 ["navJogos","navTabelas","navFav"].forEach(x=>{
  document.getElementById(x).classList.toggle("active",x===id)
 });
}

function data8(d){
 return d.getFullYear()+
 String(d.getMonth()+1).padStart(2,"0")+
 String(d.getDate()).padStart(2,"0");
}

function estado(ev){

 const s=ev?.status||ev?.competitions?.[0]?.status||{};
 const t=s.type||{};

 if(t.state==="in"){
  return{
   txt:t.shortDetail||t.detail||t.displayClock||"DIRETO",
   live:true,
   final:false
  };
 }

 if(t.state==="post"){
  return{
   txt:t.shortDetail||t.detail||"FINAL",
   live:false,
   final:true
  };
 }

 return{
  txt:t.shortDetail||t.detail||t.name||"",
  live:false,
  final:false
 };
}

function normalizar(ev,l){

 const c=ev.competitions?.[0]||{};
 const cs=c.competitors||[];

 const h=
  cs.find(x=>x.homeAway==="home")||
  cs[0]||
  {};

 const a=
  cs.find(x=>x.homeAway==="away")||
  cs[1]||
  {};

 const s=estado(ev);

 return{
  id:String(ev.id),
  date:ev.date||"",
  status:ev.status||c.status||{},
  home:{
   nome:h.team?.displayName||
        h.team?.shortDisplayName||
        "Casa",
   logo:h.team?.logo||"",
   score:h.score??"-",
   id:h.team?.id||""
  },
  away:{
   nome:a.team?.displayName||
        a.team?.shortDisplayName||
        "Fora",
   logo:a.team?.logo||"",
   score:a.score??"-",
   id:a.team?.id||""
  },
  estado:s,
  liga:l.name,
  code:l.code
 };
}

async function buscarEventos(l){

 const hoje=new Date();
 const ini=new Date(hoje);
 const fim=new Date(hoje);

 ini.setDate(ini.getDate()-120);
 fim.setDate(fim.getDate()+120);

 const urls=[
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`
 ];

 for(const u of urls){

  try{

   const r=await fetch(u);

   if(!r.ok)continue;

   const d=await r.json();

   if(Array.isArray(d.events)&&d.events.length){
    return d.events;
   }

  }catch(e){}
 }

 return [];
}

async function carregarJogos(){

 let lista=[];

 for(const l of ligas){

  const evs=await buscarEventos(l);

  evs.forEach(e=>{
   lista.push(normalizar(e,l));
  });
 }

 const mapa=new Map();

 lista.forEach(j=>{
  mapa.set(j.id,j);
 });

 jogosAtuais=[...mapa.values()].sort(
  (a,b)=>new Date(a.date)-new Date(b.date)
 );

 if(document.getElementById("navJogos")?.classList.contains("active")){
  mostrarJogos();
 }
}

function botoesLigas(){

 return `
 <div class="seletor-ligas">
 ${ligas.map(l=>`
  <button
   class="liga-btn ${l.code===ligaAtual.code?"active":""}"
   onclick="selecionarLiga('${l.code}')">

   <span class="liga-icon">${l.icon}</span>
   ${esc(l.name)}

  </button>
 `).join("")}
 </div>
 `;
}

function selecionarLiga(code){

 ligaAtual=
  ligas.find(l=>l.code===code)||
  ligas[0];

 modoJogos="todos";

 mostrarJogos();
}

function dataLocal(d){

 try{

  return new Intl.DateTimeFormat(
   "pt-PT",
   {
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
   }
  ).format(new Date(d));

 }catch(e){
  return "";
 }
}

/* BOTÕES DE JOGOS */

function botoesCategorias(){

 return `
 <div class="categorias-jogos">

  <button
   class="categoria-btn live ${modoJogos==="live"?"active":""}"
   onclick="modoJogos='live';mostrarJogos()">

   <span class="categoria-icon">🔴</span>
   Ao Vivo

  </button>

  <button
   class="categoria-btn ${modoJogos==="futuros"?"active":""}"
   onclick="modoJogos='futuros';mostrarJogos()">

   <span class="categoria-icon">📅</span>
   Futuros

  </button>

  <button
   class="categoria-btn ${modoJogos==="passados"?"active":""}"
   onclick="modoJogos='passados';mostrarJogos()">

   <span class="categoria-icon">✅</span>
   Realizados

  </button>

 </div>
 `;
}

/* EQUIPA CLICÁVEL */

function teamHtml(team,code){

 if(!team)return "";

 return `
 <div
  class="equipa equipa-clicavel"
  onclick="event.stopPropagation();abrirEquipa(
   '${esc(code)}',
   '${esc(team.id||"")}',
   '${esc(team.nome||"Equipa")}',
   '${esc(team.logo||"")}'
  )">

  ${logo(team.logo)}
  ${esc(team.nome)}

 </div>
 `;
}

/* CARTÃO DE JOGO */

function cartao(j){

 let estadoJogo;

 if(j.estado.live){

  estadoJogo=
   `<span class="estado-live">
    🔴 ${esc(j.estado.txt)}
   </span>`;

 }else if(j.estado.final){

  estadoJogo=
   `<span class="estado-final">
    ${esc(j.estado.txt)}
   </span>`;

 }else{

  estadoJogo=
   `${esc(dataLocal(j.date))}`;
 }

 return `
 <div
  class="jogo"
  onclick="abrirJogo('${esc(j.id)}','${esc(j.code)}')">

  <div class="jogo-top">
   <span>${esc(j.liga)}</span>
   <span>${estadoJogo}</span>
  </div>

  <div class="equipas">

   ${teamHtml(j.home,j.code)}

   <div class="resultado">
    ${esc(j.home.score)}
    -
    ${esc(j.away.score)}
   </div>

   ${teamHtml(j.away,j.code)}

  </div>

 </div>
 `;
}

/* GRUPO DE JOGOS */

function grupoJogos(titulo,lista,icone){

 if(!lista.length)return "";

 return `
 <div class="grupo-jogos">

  <div class="grupo-titulo">
   <span>${icone} ${titulo}</span>
   <span class="grupo-contagem">
    ${lista.length} jogo${lista.length!==1?"s":""}
   </span>
  </div>

  ${lista.map(cartao).join("")}

 </div>
 `;
}

/* JOGOS */

function mostrarJogos(){

 nav("navJogos");

 let lista=jogosAtuais;

 if(modoJogos==="live"){

  /* TODOS OS JOGOS AO VIVO */

  lista=jogosAtuais.filter(j=>j.estado.live);

  app.innerHTML=`

   <h2>⚽ Jogos</h2>

   ${botoesCategorias()}

   ${lista.length
    ?grupoJogos(
      "Jogos ao Vivo",
      lista,
      "🔴"
     )
    :`<div class="vazio">
       Não existem jogos ao vivo neste momento.
      </div>`
   }

  `;

  return;
 }

 /* JOGOS DA COMPETIÇÃO ESCOLHIDA */

 const daLiga=
  jogosAtuais.filter(j=>j.liga===ligaAtual.name);

 if(modoJogos==="futuros"){

  const futuros=
   daLiga.filter(
    j=>!j.estado.final&&!j.estado.live
   );

  app.innerHTML=`

   <h2>⚽ Jogos</h2>

   ${botoesCategorias()}

   ${botoesLigas()}

   ${
    futuros.length
    ?grupoJogos("Próximos jogos",futuros,"📅")
    :`<div class="vazio">
       Não há próximos jogos encontrados.
      </div>`
   }

  `;

  return;
 }

 if(modoJogos==="passados"){

  const passados=
   daLiga.filter(j=>j.estado.final);

  app.innerHTML=`

   <h2>⚽ Jogos</h2>

   ${botoesCategorias()}

   ${botoesLigas()}

   ${
    passados.length
    ?grupoJogos("Jogos realizados",passados,"✅")
    :`<div class="vazio">
       Não há jogos realizados encontrados.
      </div>`
   }

  `;

  return;
 }

 /* TODOS = 3 CASINHAS */

 const aoVivo=
  daLiga.filter(j=>j.estado.live);

 const futuros=
  daLiga.filter(
   j=>!j.estado.final&&!j.estado.live
  );

 const realizados=
  daLiga.filter(j=>j.estado.final);

 app.innerHTML=`

  <h2>⚽ Jogos</h2>

  ${botoesCategorias()}

  ${botoesLigas()}

  ${
   aoVivo.length
   ?grupoJogos("Ao Vivo",aoVivo,"🔴")
   :""
  }

  ${
   futuros.length
   ?grupoJogos("Próximos jogos",futuros,"📅")
   :""
  }

  ${
   realizados.length
   ?grupoJogos("Jogos realizados",realizados,"✅")
   :""
  }

  ${
   !aoVivo.length&&!futuros.length&&!realizados.length
   ?`<div class="vazio">
      Não há jogos encontrados neste período.
     </div>`
   :""
  }

 `;
}

/* TABELAS */

function normalizarTabela(d){

 let grupos=[];

 if(Array.isArray(d?.children)){
  grupos=d.children;
 }

 if(Array.isArray(d?.standings)){
  grupos=d.standings;
 }

 if(d?.standings?.entries){
  grupos=[d.standings];
 }

 let entries=[];

 function recolher(obj){

  if(!obj)return;

  if(Array.isArray(obj.entries)){
   entries.push(...obj.entries);
  }

  if(Array.isArray(obj.children)){
   obj.children.forEach(recolher);
  }

  if(Array.isArray(obj.standings)){
   obj.standings.forEach(recolher);
  }
 }

 grupos.forEach(recolher);

 if(!entries.length && Array.isArray(d?.entries)){
  entries=d.entries;
 }

 return entries;
}

function valorTabela(entry,nome){

 const stats=entry.stats||[];

 const s=stats.find(
  x=>
   x.name===nome||
   x.shortName===nome||
   x.abbreviation===nome
 );

 if(!s)return 0;

 return Number(
  s.value??
  s.displayValue??
  0
 )||0;
}

function nomeCompeticao(d){

 return d?.name||
        d?.league?.name||
        d?.standings?.name||
        ligaAtual.name;
}

async function buscarTabela(){

 const urls=[
  `${ESPN2}${encodeURIComponent(ligaAtual.code)}/standings?_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(ligaAtual.code)}/standings?_=${Date.now()}`
 ];

 for(const u of urls){

  try{

   const r=await fetch(u);

   if(!r.ok)continue;

   const d=await r.json();

   const entries=normalizarTabela(d);

   if(entries.length){
    return{
     data:d,

    };
   }

  }catch(e){}
 }

 return null;
}

async function buscarInfoEquipa(code,id){

 const urls=[
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}?_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}/?_= ${Date.now()}`
 ];

 for(const u of urls){

  try{

   const r=await fetch(u.replace("?_=", "?_="));

   if(!r.ok)continue;

   const d=await r.json();

   return d.team||d;

  }catch(e){}
 }

 return null;
}

async function buscarPlantelEquipa(code,id){

 const urls=[
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}/roster?_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}?enable=roster&_=${Date.now()}`
 ];

 for(const u of urls){

  try{

   const r=await fetch(u);

   if(!r.ok)continue;

   const d=await r.json();

   const arr=
    d.athletes||
    d.roster||
    d.team?.athletes||
    [];

   if(Array.isArray(arr)){

    return arr.map(x=>{

     const a=x.athlete||x;

     return{
      nome:a.displayName||
           a.fullName||
           "Jogador",
      num:a.jersey||
          x.jersey||
          "",
      pos:a.position?.abbreviation||
          a.position?.displayName||
          ""
     };

    });

   }

  }catch(e){}
 }

 return [];
}

async function buscarJogosEquipa(code,id){

 const urls=[
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}/schedule?_=${Date.now()}`,
  `${ESPN}${encodeURIComponent(code)}/teams/${encodeURIComponent(id)}?enable=events&_=${Date.now()}`
 ];

 for(const u of urls){

  try{

   const r=await fetch(u);

   if(!r.ok)continue;

   const d=await r.json();

   const evs=
    d.events||
    d.schedule?.events||
    d.team?.events||
    [];

   if(Array.isArray(evs)&&evs.length){

    return evs.map(e=>
     normalizar(
      e,
      ligas.find(x=>x.code===code)||ligaAtual
     )
    );

   }

  }catch(e){}
 }

 return [];
}

/* EVENTOS DO JOGO */

function txt(v){

 return typeof v==="object"
 ?(
   v?.displayValue??
   v?.value??
   v?.text??
   ""
  )
 :String(v??"");

}

function extrairEventos(d){

 let out=[];
 let seen=new Set();

 let arr=[
  ...(d.plays||[]),
  ...(d.keyEvents||[]),
  ...(d.scoringPlays||[])
 ];

 for(const e of arr){

  const raw=(
   (e?.type?.text||"")+" "+
   (e?.text||e?.shortText||e?.description||"")
  ).toLowerCase();

  if(!/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(raw)){
   continue;
  }

  const k=
   String(e?.id||"")+
   raw+
   (e?.clock?.displayValue||"");

  if(seen.has(k))continue;

  seen.add(k);

  const ic=
   /yellow|amarelo/.test(raw)
    ?"🟨"
    :/red|vermelho/.test(raw)
    ?"🟥"
    :/substitut/.test(raw)
    ?"🔄"
    :"⚽";

  out.push({
   m:e?.clock?.displayValue||"",
   t:e?.text||
     e?.shortText||
     e?.description||
     e?.type?.text||
     "Evento",
   i:ic
  });

 }

 return out;
}

/* ESTATÍSTICAS */

function extrairStats(d){

 const gs=[];

 function add(team,stats){

  if(!team||!Array.isArray(stats))return;

  const id=
   team.id||
   team.team?.id||
   team.displayName||
   team.team?.displayName;

  let g=
   gs.find(x=>String(x.id)===String(id));

  if(!g){

   g={
    id,
    nome:
     team.displayName||
     team.name||
     team.team?.displayName||
     "Equipa",
    s:[]
   };

   gs.push(g);
  }

  stats.forEach(x=>{

   const n=
    x.displayName||
    x.shortDisplayName||
    x.name||
    x.label||
    x.description;

   if(n){

    g.s.push({
     n,
     v:txt(
      x.displayValue??
      x.value??
      x.display
     )
    });

   }

  });

 }

 (d.boxscore?.teams||[])
  .forEach(x=>
   add(
    x.team||x,
    x.statistics||x.stats
   )
  );

 (d.header?.competitions?.[0]?.competitors||[])
  .forEach(x=>
   add(
    x.team||x,
    x.statistics
   )
  );

 (d.competitions?.[0]?.competitors||[])
  .forEach(x=>
   add(
    x.team||x,
    x.statistics
   )
  );

 if(gs.length<2)return[];

 const m=new Map();

 gs.slice(0,2).forEach((g,i)=>{

  g.s.forEach(x=>{

   const k=x.n.toLowerCase();

   if(!m.has(k)){

    m.set(k,{
     n:x.n,
     h:"-",
     a:"-"
    });

   }

   if(i===0){
    m.get(k).h=x.v;
   }else{
    m.get(k).a=x.v;
   }

  });

 });

 return [...m.values()];
}

/* PLANTEL DO JOGO */

function extrairPlantel(d){

 const gs=[];

 function add(team,arr){

  if(!team||!Array.isArray(arr))return;

  const id=
   team.id||
   team.team?.id||
   team.displayName||
   team.team?.displayName;

  let g=
   gs.find(x=>String(x.id)===String(id));

  if(!g){

   g={
    id,
    nome:
     team.displayName||
     team.name||
     team.team?.displayName||
     "Equipa",
    p:[]
   };

   gs.push(g);
  }

  arr.forEach(x=>{

   const a=
    x?.athlete||
    x?.player||
    x;

   if(!a?.displayName&&!a?.fullName)return;

   const n=
    a.displayName||
    a.fullName;

   if(!g.p.some(p=>p.n===n)){

    g.p.push({
     n,
     num:a.jersey||
         x.jersey||
         "",
     pos:a.position?.abbreviation||
         a.position?.displayName||
         "",
     tit:x.starter===true
    });

   }

  });

 }

 (d.rosters||[])
  .forEach(r=>
   add(
    r.team||r,
    r.roster||
    r.athletes||
    r.players
   )
  );

 (d.boxscore?.players||[])
  .forEach(r=>
   add(
    r.team||r,
    r.statistics||
    r.athletes||
    r.roster||
    r.players
   )
  );

 return gs.filter(x=>x.p.length);
}
