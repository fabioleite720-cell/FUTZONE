function fzLocalISO(d=new Date()){
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function fzYmdDate(d){
  return fzLocalISO(d).replaceAll("-","");
}

function fzDateRange(a,b){
  return fzYmdDate(a)+"-"+fzYmdDate(b);
}

function escapeHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizarData(v){
  if(!v)return "";
  const d=new Date(v);
  return isNaN(d.getTime())?"":d.toISOString();
}

function hojeISO(offset=0){
  const d=new Date();
  d.setDate(d.getDate()+offset);
  return fzLocalISO(d);
}

function formatarData(v){
  if(!v)return "";
  const d=new Date(v);
  if(isNaN(d.getTime()))return "";
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function dataCurta(v){
  if(!v)return "";
  const d=new Date(v);
  if(isNaN(d.getTime()))return "";
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  });
}

function horaEvento(e){
  if(!e?.date)return "--:--";
  const d=new Date(e.date);
  if(isNaN(d.getTime()))return "--:--";
  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function nomeEquipa(t){
  return t?.team?.displayName ||
         t?.team?.shortDisplayName ||
         t?.team?.name ||
         t?.displayName ||
         t?.name ||
         "Equipa";
}

function logoEquipa(t){
  return t?.team?.logo ||
         t?.team?.logos?.[0]?.href ||
         t?.logo ||
         "";
}

function isLive(e){
  const s=e?.status?.type;
  return !!(
    e?.status?.type?.state==="in" ||
    s?.state==="in" ||
    s?.name==="STATUS_IN_PROGRESS" ||
    /LIVE|IN_PROGRESS|IN_PLAY/i.test(s?.name||"") ||
    /LIVE|IN_PROGRESS/i.test(s?.description||"")
  );
}

function isFinal(e){
  const s=e?.status?.type;
  return !!(
    s?.completed ||
    s?.state==="post" ||
    /FINAL|POST/i.test(s?.name||"")
  );
}

function getCompeticao(id){

async function fetchJSON(url,timeoutMs=7000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);

  try{
    const r=await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    return null;
  }finally{
    clearTimeout(timer);
  }
}

function fzCacheGet(key,ttl){
  const x=FZ_CACHE.get(key);
  if(!x)return null;
  if(Date.now()-x.t>ttl){
    FZ_CACHE.delete(key);
    return null;
  }
  return x.data;
}

async function fzFetch(url,timeoutMs=7000,ttl=30000){
  const hit=fzCacheGet(url,ttl);
  if(hit!==null)return hit;

  if(FZ_INFLIGHT.has(url)){
    return FZ_INFLIGHT.get(url);
  }

  const p=fetchJSON(url,timeoutMs)
    .then(data=>{
      if(data!==null){
        FZ_CACHE.set(url,{
          t:Date.now(),
          data
        });
      }
      return data;
    })
    .catch(()=>null)
    .finally(()=>{
      FZ_INFLIGHT.delete(url);
    });

  FZ_INFLIGHT.set(url,p);
  return p;
}

function makeFallbackEvent(liga,row,i){
  const [date,home,away,hs,as]=row;

  return {
    id:"fz-fallback-"+liga+"-"+i+"-"+home+"-"+away,
    date,
    name:home+" vs "+away,
    __futzoneLiga:liga,
    competitions:[{
      name:getCompeticao(liga),
      abbreviation:getCompeticao(liga)
    }],
    status:{
      type:{
        state:(hs!==""&&as!=="")?"post":"pre",
        completed:(hs!==""&&as!=="")
      }
    },
    competitors:[
      {
        id:"fz-"+home,
        team:{
          id:"fz-"+home,
          displayName:home,
          shortDisplayName:home
        },
        homeAway:"home",
        score:hs===""?undefined:String(hs)
      },
      {
        id:"fz-"+away,
        team:{
          id:"fz-"+away,
          displayName:away,
          shortDisplayName:away
        },
        homeAway:"away",
        score:as===""?undefined:String(as)
      }
    ]
  };
}

function fallbackGames(liga){
  const data=FALLBACK[liga];
  if(!data?.games)return [];

  const agora=new Date();
  const inicio=new Date(agora);
  inicio.setDate(inicio.getDate()-8);

  const fim=new Date(agora);
  fim.setDate(fim.getDate()+45);

  return data.games
    .map((x,i)=>makeFallbackEvent(liga,x,i))
    .filter(e=>{
      const d=new Date(e.date);
      return d>=inicio&&d<=fim;
    });
}

/* =========================================================
   JOGOS DE UMA LIGA
   ========================================================= */

async function buscarJogosLiga(liga){
  if(String(liga).startsWith("futsal:"))return [];

  const agora=new Date();
  const inicio=new Date(agora);
  inicio.setDate(inicio.getDate()-1);

  const fim=new Date(agora);
  fim.setDate(fim.getDate()+7);

  const range=fzDateRange(inicio,fim);

  const url=
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    range+
    "&limit=200";

  let data=await fzFetch(url,7000,30000);
  let eventos=Array.isArray(data?.events)?data.events:[];

  eventos=eventos.map(e=>{
    e.__futzoneLiga=liga;
    return e;
  });

  /*
   * Se o intervalo não responder ou vier vazio,
   * fazemos poucas pesquisas individuais.
   * Nunca mais 14 pedidos simultâneos.
   */
  if(!eventos.length){
    const datas=[];

    for(let i=-1;i<=7;i++){
      datas.push(hojeISO(i).replaceAll("-",""));
    }

    for(let i=0;i<datas.length;i+=3){
      const grupo=datas.slice(i,i+3);

      const rs=await Promise.all(
        grupo.map(async dia=>{
          const u=
            API+
            encodeURIComponent(liga)+
            "/scoreboard?dates="+
            dia+
            "&limit=100";

          const d=await fzFetch(u,7000,20000);
          return Array.isArray(d?.events)?d.events:[];
        })
      );

      rs.flat().forEach(e=>{
        if(!eventos.some(x=>String(x.id)===String(e.id))){
          e.__futzoneLiga=liga;
          eventos.push(e);
        }
      });
    }
  }

  if(["por.2","por.3","por.w.1"].includes(liga)){
    fallbackGames(liga).forEach(e=>{
      if(!eventos.some(x=>String(x.id)===String(e.id))){
        eventos.push(e);
      }
    });
  }

  eventos.sort((a,b)=>{
    return new Date(a.date)-new Date(b.date);
  });

  return eventos;
}

function desenharLigas(){
  const box=document.getElementById("leagueList");
  if(!box)return;

  box.innerHTML=ligas.map(([id,nome])=>`
    <button
      class="leagueChip ${id===ligaAtual?"active":""}"
      onclick="selecionarLiga('${id}')">
      ${escapeHtml(nome)}
    </button>
  `).join("");
}

function selecionarLiga(id){
  ligaAtual=id;

  const isFutsal=String(id).startsWith("futsal:");

  if(isFutsal){
    desportoAtual="futsal";
    fzModoTodos=false;

    try{
      renderizarFutsalNoFutebol(id);
    }catch(e){}

    return;
  }

  desportoAtual="futebol";
  fzModoTodos=false;

  document.querySelectorAll(".leagueChip").forEach(b=>{
    b.classList.remove("active");
  });

  const botoes=[...document.querySelectorAll(".leagueChip")];

  const alvo=botoes.find(b=>
    b.getAttribute("onclick")?.includes("'"+id+"'")
  );

  if(alvo)alvo.classList.add("active");

  carregarJogos();
}

function mudarDesporto(d){
  desportoAtual=d;

  if(d==="futsal"){
    const id=ligaAtual.startsWith("futsal:")
      ?ligaAtual
      :"futsal:liga";

    ligaAtual=id;
    fzModoTodos=false;

    try{
      renderizarFutsalNoFutebol(id);
    }catch(e){}

    return;
  }

  ligaAtual="por.1";
  fzModoTodos=false;
  desenharLigas();
  carregarJogos();
}

   ========================================================= */

async function carregarJogos(){
  if(desportoAtual!=="futebol")return;

  const c=document.getElementById("gamesList");
  if(!c)return;

  const token=++fzRequestToken;

  c.innerHTML=`
    <div class="loading">
      <div class="spinner"></div>
      A carregar ${escapeHtml(getCompeticao(ligaAtual))}...
    </div>
  `;

  const eventos=await buscarJogosLiga(ligaAtual);

  if(token!==fzRequestToken)return;

  jogosFutebol=eventos;

  renderizarJogos();
}

function setFiltro(f){
  filtroAtual=f;
  renderizarJogos();
}

function passaFiltro(e){
  if(filtroAtual==="live")return isLive(e);
  if(filtroAtual==="final")return isFinal(e);
  if(filtroAtual==="proximos")return !isFinal(e)&&!isLive(e);
  return true;
}

function renderizarJogos(){
  if(fzModoTodos){
    fzRenderTodos();
    return;
  }

  const c=document.getElementById("gamesList");
  if(!c)return;

  let arr=[...jogosFutebol];

  const q=
    (document.getElementById("searchInput")?.value||"")
      .trim()
      .toLowerCase();

  if(q){
    arr=arr.filter(e=>
      String(e.name||"").toLowerCase().includes(q) ||
      e.competitors?.some(x=>
        nomeEquipa(x).toLowerCase().includes(q)
      )
    );
  }

  arr=arr.filter(passaFiltro);

  if(!arr.length){
    c.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">⚽</div>
        <div>Não existem jogos para mostrar.</div>
      </div>
    `;
    return;
  }

  c.innerHTML=arr.map(cartaoJogo).join("");
}

function cartaoJogo(e){
  const comps=e.competitions||[];
  const comp=
    comps[0]?.name||
    getCompeticao(e.__futzoneLiga||ligaAtual);

  const home=e.competitors?.find(x=>x.homeAway==="home")||e.competitors?.[0];
  const away=e.competitors?.find(x=>x.homeAway==="away")||e.competitors?.[1];

  const live=isLive(e);
  const final=isFinal(e);

  const hs=home?.score??"";
  const as=away?.score??"";

  const estado=live
    ?"AO VIVO"
    :final
      ?"FINAL"
      :horaEvento(e);

  const star=favoritoJogo(e.id)?"★":"☆";

  return `
    <article class="gameCard" onclick="abrirJogo('${escapeHtml(e.id)}')">

      <div class="gameTop">
        <span class="competition">${escapeHtml(comp)}</span>

        <button
          class="favBtn"
          onclick="event.stopPropagation();toggleFavoritoJogo('${escapeHtml(e.id)}')">
          ${star}
        </button>
      </div>

      <div class="gameDate">
        ${dataCurta(e.date)}
      </div>

      <div class="teams">

        <div
          class="team"
          onclick="event.stopPropagation();fzAbrirEquipa('${escapeHtml(home?.id||"")}','${escapeHtml(nomeEquipa(home))}','${escapeHtml(logoEquipa(home))}','${escapeHtml(e.__futzoneLiga||ligaAtual)}')">

          ${logoEquipa(home)
            ?`<img src="${escapeHtml(logoEquipa(home))}" loading="lazy">`
            :`<div class="teamLogo">⚽</div>`}

          <span>${escapeHtml(nomeEquipa(home))}</span>
        </div>

        <div class="scoreBox">
          <div class="matchState ${live?"live":""}">
            ${escapeHtml(estado)}
          </div>

          <strong>
            ${final||live
              ?escapeHtml(hs)+" - "+escapeHtml(as)
              :"VS"}
          </strong>
        </div>

        <div
          class="team"
          onclick="event.stopPropagation();fzAbrirEquipa('${escapeHtml(away?.id||"")}','${escapeHtml(nomeEquipa(away))}','${escapeHtml(logoEquipa(away))}','${escapeHtml(e.__futzoneLiga||ligaAtual)}')">

          ${logoEquipa(away)
            ?`<img src="${escapeHtml(logoEquipa(away))}" loading="lazy">`
            :`<div class="teamLogo">⚽</div>`}

          <span>${escapeHtml(nomeEquipa(away))}</span>
        </div>

      </div>

      ${live?`<div class="liveBar">● EM DIRETO</div>`:""}

    </article>
  `;
}

function toggleFavoritoJogo(id){
  const s=String(id);

  if(favoritosJogos.map(String).includes(s)){
    favoritosJogos=favoritosJogos.filter(x=>String(x)!==s);
  }else{
    favoritosJogos.push(id);
  }

  guardarFavoritos();

  if(fzModoTodos){
    fzRenderTodos();
  }else{
    renderizarJogos();
  }
}

function mostrarFavoritos(){
  fzModoTodos=false;

  const c=document.getElementById("gamesList");
  if(!c)return;

  const favs=favoritosJogos.map(String);

  const arr=jogosFutebol.filter(e=>
    favs.includes(String(e.id))
  );

  if(!arr.length){
    c.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">☆</div>
        <div>Ainda não tens jogos favoritos.</div>
      </div>
    `;
    return;
  }

  c.innerHTML=arr.map(cartaoJogo).join("");
}

function irJogos(){
  fzModoTodos=false;

  document.getElementById("navJogos")?.classList.add("active");
  document.getElementById("navFav")?.classList.remove("active");

  carregarJogos();
}

function fzCriarCabecalhoDias(){
  const box=document.getElementById("dayList");
  if(!box)return;

  let html="";

  for(let i=-1;i<=7;i++){
    const d=new Date();
    d.setDate(d.getDate()+i);

    const iso=fzLocalISO(d);

    const titulo=
      i===0
        ?"HOJE"
        :i===1
          ?"AMANHÃ"
          :d.toLocaleDateString("pt-PT",{
             weekday:"short"
           }).toUpperCase();

    html+=`
      <button
        class="dayChip"
        data-day="${iso}"
        onclick="fzSelecionarDia('${iso}',this)">
        <strong>${titulo}</strong>
        <span>${dataCurta(d)}</span>
      </button>
    `;
  }

  box.innerHTML=html;

  const hoje=box.querySelector(
    `[data-day="${fzLocalISO()}"]`
  );

  if(hoje)hoje.classList.add("active");
}

function fzSelecionarDia(iso,btn){
  fzDiaSelecionado=iso;
  fzModoTodos=true;

  document.querySelectorAll(".dayChip")
    .forEach(x=>x.classList.remove("active"));

  btn?.classList.add("active");

  fzRenderTodos();
}

   TODOS OS JOGOS
   ========================================================= */

async function fzBuscarTodosDia(iso,liveOnly=false){
  const dia=iso.replaceAll("-","");
  const cacheKey="ALL|"+dia;

  const cached=fzCacheGet(cacheKey,15000);

  if(cached){
    return liveOnly
      ?cached.filter(isLive)
      :cached;
  }

  const ids=LIGAS_FUTEBOL.map(x=>x[0]);
  const resultado=[];
  const seen=new Set();

  /*
   * Só um dia.
   * 5 ligas de cada vez.
   * Isto evita o congelamento do telemóvel.
   */

  for(let i=0;i<ids.length;i+=5){

    const grupo=ids.slice(i,i+5);

    const rs=await Promise.all(
      grupo.map(async liga=>{
        const url=
          API+
          encodeURIComponent(liga)+
          "/scoreboard?dates="+
          dia+
          "&limit=100";

        const d=await fzFetch(url,7000,15000);

        return (d?.events||[]).map(e=>{
          e.__futzoneLiga=liga;
          return e;
        });
      })
    );

    rs.flat().forEach(e=>{
      if(!seen.has(String(e.id))){
        seen.add(String(e.id));
        resultado.push(e);
      }
    });
  }

  /*
   * Fallback apenas para as três competições portuguesas
   * que precisamos de garantir.
   */

  ["por.2","por.3","por.w.1"].forEach(liga=>{
    fallbackGames(liga).forEach(e=>{
      if(fzLocalISO(new Date(e.date))===iso){
        if(!seen.has(String(e.id))){
          seen.add(String(e.id));
          resultado.push(e);
        }
      }
    });
  });

  resultado.sort((a,b)=>
    new Date(a.date)-new Date(b.date)
  );

  FZ_CACHE.set(cacheKey,{
    t:Date.now(),
    data:resultado
  });

  return liveOnly
    ?resultado.filter(isLive)
    :resultado;
}

function statVal(item,names){
  const stats=item?.stats||item?.statistics||[];

  for(const n of names){
    const s=stats.find(x=>
      String(x.name||x.type||"").toLowerCase()===
      String(n).toLowerCase()
    );

    if(s?.value!==undefined)return s.value;
    if(s?.displayValue!==undefined)return s.displayValue;
  }

  return null;
}

function nStat(item,n){
  const v=statVal(item,[n]);
  const x=Number(v);
  return Number.isFinite(x)?x:0;
}

function normalizarTabela(t){
  if(!Array.isArray(t))return [];

  return t.map((x,i)=>{
    const team=x?.team||x?.competitor||x?.entry||x;

    return {
      pos:Number(
        x?.rank||
        x?.position||
        x?.order||
        i+1
      ),
      id:String(
        team?.id||
        x?.teamId||
        "team-"+i
      ),
      nome:
        team?.displayName||
        team?.name||
        team?.shortDisplayName||
        x?.name||
        "Equipa",
      logo:
        team?.logos?.[0]?.href||
        team?.logo||
        "",
      pj:Number(
        x?.stats?.find?.(s=>
          /played|gamesplayed|gp/i.test(s.name)
        )?.value ??
        x?.played ??
        0
      ),
      v:Number(
        x?.stats?.find?.(s=>
          /^wins$|^w$/i.test(s.name)
        )?.value ??
        x?.wins ??
        0
      ),
      e:Number(
        x?.stats?.find?.(s=>
          /^ties$|^draws$|^d$/i.test(s.name)
        )?.value ??
        x?.draws ??
        0
      ),
      d:Number(
        x?.stats?.find?.(s=>
          /^losses$|^l$/i.test(s.name)
        )?.value ??
        x?.losses ??
        0
      ),
      pts:Number(
        x?.stats?.find?.(s=>
          /^points$|^pts$/i.test(s.name)
        )?.value ??
        x?.points ??
        0
      ),
      gd:Number(
        x?.stats?.find?.(s=>
          /point.?differ|goal.?diff/i.test(s.name)
        )?.value ??
        x?.goalDifference ??
        0
      )
    };
  });
}

function extrairTabela(data){
  const out=[];

  const grupos=data?.children||[];

  function procurar(obj){
    if(!obj||typeof obj!=="object")return;

    if(Array.isArray(obj.entries)){
      obj.entries.forEach(x=>out.push(x));
    }

    if(Array.isArray(obj.standings)){
      obj.standings.forEach(x=>out.push(x));
    }

    if(Array.isArray(obj.rows)){
      obj.rows.forEach(x=>out.push(x));
    }

    if(Array.isArray(obj.children)){
      obj.children.forEach(procurar);
    }
  }

  if(grupos.length){
    grupos.forEach(procurar);
  }else{
    procurar(data);
  }

  const unique=[];
  const ids=new Set();

  out.forEach(x=>{
    const id=
      x?.team?.id||
      x?.competitor?.id||
      x?.id;

    if(id&&!ids.has(String(id))){
      ids.add(String(id));
      unique.push(x);
    }
  });

  return unique.length?unique:out;
}

  const body=document.getElementById("playerBody");

  let atleta=null;

  if(id){
    const urls=[
      "https://sports.core.api.espn.com/v2/sports/soccer/athletes/"+encodeURIComponent(id),
      "https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(liga||"por.1")+"/athletes/"+encodeURIComponent(id)
    ];

    for(const u of urls){
      const d=await fzFetch(u,8000,120000);
      if(d){
        atleta=d;
        break;
      }
    }
  }

  if(!atleta){
    body.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">👤</div>
        <div>Informação do jogador indisponível.</div>
      </div>
    `;
    return;
  }

  const a=atleta.athlete||atleta;

  const nacionalidade=
    a.birthPlace?.country||
    a.birthPlace?.countryName||
    a.citizenship||
    a.nationality||
    "—";

  const nascimento=
    a.dateOfBirth||
    a.birthDate||
    "—";

  const altura=
    a.displayHeight||
    a.height||
    "—";

  const peso=
    a.displayWeight||
    a.weight||
    "—";

  body.innerHTML=`

    <div class="playerHero">

      ${a.headshot?.href
        ?`<img src="${escapeHtml(a.headshot.href)}">`
        :`<div class="playerPlaceholder">👤</div>`
      }

      <h2>${escapeHtml(
        a.displayName||
        a.fullName||
        nome
      )}</h2>

      <span>${escapeHtml(
        a.position?.displayName||
        a.position?.abbreviation||
        ""
      )}</span>
    </div>

    <div class="detailSection">
      <h3>ℹ️ Dados</h3>

      <div class="playerInfoGrid">
        <div>
          <small>Nacionalidade</small>
          <strong>${escapeHtml(nacionalidade)}</strong>
        </div>

        <div>
          <small>Nascimento</small>
          <strong>${escapeHtml(
            nascimento!=="—"
              ?formatarData(nascimento)
              :"—"
          )}</strong>
        </div>

        <div>
          <small>Altura</small>
          <strong>${escapeHtml(altura)}</strong>
        </div>

        <div>
          <small>Peso</small>
          <strong>${escapeHtml(peso)}</strong>
        </div>
      </div>
    </div>

    <div class="detailSection">
      <h3>🏟️ Histórico de clubes</h3>
      <div id="playerHistory">
        <div class="loading">A procurar histórico...</div>
      </div>
    </div>
  `;

  const history=document.getElementById("playerHistory");

  /*
   * Tentativa de histórico através da informação ESPN.
   * Se não existir, não inventamos clubes.
   */

  const hist=
    a.careerHistory||
    a.teams||
    a.teamHistory||
    [];

  if(Array.isArray(hist)&&hist.length){
    history.innerHTML=hist.map(x=>`
      <div class="historyRow">
        <strong>${escapeHtml(
          x.team?.displayName||
          x.team?.name||
          x.displayName||
          x.name||
          "Clube"
        )}</strong>

        <span>${escapeHtml(
          x.startDate||
          x.from||
          ""
        )}${x.endDate?" — "+escapeHtml(x.endDate):""}</span>
      </div>
    `).join("");
  }else{
    history.innerHTML=`
      <div class="muted">
        O histórico de clubes não está disponível na fonte de dados.
      </div>
    `;
  }
}

    renderizarFutsalTabela();
    return;
  }

  mostrarTabelaFutebol();
}

function irTabelas(){
  fzModoTodos=false;

  document.getElementById("navJogos")?.classList.remove("active");
  document.getElementById("navTabelas")?.classList.add("active");
  document.getElementById("navFav")?.classList.remove("active");

  mostrarTabela();

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

function fzInicializar(){
  desenharLigas();
  fzCriarCabecalhoDias();
  fzTodosButton();
  fzPrepararPesquisa();

  /*
   * Começamos apenas pela Liga Portugal.
   * O botão "Todos os Jogos do Dia" carrega as restantes
   * ligas quando o utilizador pedir.
   */
  fzDiaSelecionado=fzLocalISO();
  fzModoTodos=false;
  filtroAtual="todos";

  carregarJogos();

  /*
   * Só atualizamos automaticamente se estivermos a ver
   * AO VIVO. Nunca voltamos a descarregar todas as ligas
   * de minuto a minuto.
   */
  setInterval(async()=>{
    if(
      desportoAtual!=="futebol"||
      fzRefreshing||
      !fzModoTodos||
      filtroAtual!=="live"
    ){
      return;
    }

    fzRefreshing=true;

    try{
      const dia=fzLocalISO();

      FZ_CACHE.delete("ALL|"+dia);

      await mostrarTodosLive();
    }finally{
      fzRefreshing=false;
    }
  },60000);
}

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

if(document.readyState==="loading"){
  document.addEventListener(
    "DOMContentLoaded",
    fzInicializar,
    {once:true}
  );
}else{
  fzInicializar();
}
