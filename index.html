.stat-away{

}

.lista-jogadores{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.jogador{
background:#071326;
border:1px solid #17243a;
border-radius:8px;
padding:9px;
font-size:12px;
display:flex;
align-items:center;
gap:7px;

}

.jogador:active{border-color:#7ed957}

.jogador b{
color:#7ed957;
margin-right:2px
}

.jogador img{
width:35px;
height:35px;
border-radius:50%;
object-fit:cover
}

.subtitulo{
color:#9ca9bb;

margin:8px 0
}

.carregando{

color:#9ca9bb;
padding:20px
}

.erro{
color:#ff8f8f;
text-align:center;
padding:15px
}

.equipa-cabecalho{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px;
text-align:center;
margin-bottom:12px
}

.equipa-logo-grande{
width:75px;
height:75px;
object-fit:contain;
display:block;
margin:0 auto 10px
}

.equipa-nome-grande{
font-size:20px;
font-weight:900
}

.tabela-caixa{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:12px;
margin-top:10px
}

.tabela-scroll{overflow-x:auto}

.tabela{
width:100%;
border-collapse:collapse;
font-size:12px;
min-width:520px
}

.tabela th{
color:#9ca9bb;
font-size:10px;
padding:9px 5px;
border-bottom:1px solid #243653
}

.tabela td{
padding:9px 5px;
border-bottom:1px solid #17243a;

}

}

.posicao{

font-weight:bold
}

.logo-tabela{
width:21px;
height:21px;
object-fit:contain;
vertical-align:middle;
margin-right:5px
}

.equipa-tabela-link{
cursor:pointer;
display:flex;
align-items:center;
gap:4px;
min-width:150px;
padding:3px;
border-radius:7px
}

.equipa-tabela-link:active{background:#17243a}

.notificacao-caixa{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:13px;
margin-bottom:10px
}

.notificacao-btn{
width:100%;
background:#071326;
border:1px solid #243653;
border-radius:10px;
color:#fff;
padding:11px;
font-weight:bold;
font-size:13px
}

.notificacao-btn.ativa{

color:#7ed957
}

.equipa-favorita-card{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:11px;
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px
}

.equipa-favorita-card img{
width:38px;
height:38px;
object-fit:contain
}

.equipa-favorita-nome{
flex:1;
font-weight:bold;
font-size:13px;

.remover-favorito{

color:#ff8f8f;

/* =========================
PERFIL DO JOGADOR
========================= */

.jogador-perfil{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px 12px;

}

.jogador-foto-grande{
width:105px;
height:105px;
border-radius:50%;
object-fit:cover;

}

.jogador-nome-grande{

margin-bottom:5px
}

.jogador-dados{

}

.jogador-numero{

}

.jogador-fav-btn.active{

border-color:#7ed957
}

.historico-clubes{
display:flex;
flex-direction:column;
gap:7px
}

.clube-historico{

}

.clube-historico img{

}

.clube-historico span{

}

.clube-ano{

</style>
</head>

<body>

<header>
<div class="brand">

<div class="brand-mark">

<svg
viewBox="0 0 100 100"
xmlns="http://www.w3.org/2000/svg"
aria-label="FUTZONE">

<circle
cx="50"
cy="50"
r="43"
fill="none"
stroke="#7ed957"
stroke-width="6"/>

<path
d="M50 27 L67 39 L61 59 L39 59 L33 39 Z"
fill="#7ed957"/>

<path
d="M50 27 L50 12
M67 39 L84 34
M61 59 L72 76
M39 59 L28 76
M33 39 L16 34"
fill="none"
stroke="#fff"
stroke-width="5"
stroke-linecap="round"/>

<path
d="M43 38
L70 38
M43 38
L43 76
M43 57
L62 57"
fill="none"
stroke="#fff"
stroke-width="7"
stroke-linecap="round"
stroke-linejoin="round"/>

</svg>

</div>

<div>

<div class="logo">
FUT<span>ZONE</span>
</div>

<div class="logo-sub">
FUTEBOL EM DIRETO
</div>

</div>

</div>
</header>

<main id="app"></main>

<div class="bottom">

<button
id="navJogos"
class="active"
onclick="mostrarJogos()">
⚽<br>Jogos
</button>

<button
id="navTabelas"
onclick="mostrarTabelas()">
🏆<br>Tabelas
</button>

<button
id="navFav"
onclick="mostrarFavoritos()">
⭐<br>Favoritos
</button>

</div>

<script>

const ligas=[

{nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
{nome:"França",codigo:"fra.1",icone:"🇫🇷"},
{nome:"Países Baixos",codigo:"ned.1",icone:"🇳🇱"},
{nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
{nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}

];

let jogos=[];
let ligaSelecionada="Portugal";
let pagina="jogos";

let favoritos=JSON.parse(
localStorage.getItem("futzone_favoritos")||"[]"
);

let equipasFavoritas=JSON.parse(
localStorage.getItem("futzone_equipas_favoritas")||"[]"
);

/* NOVO - FAVORITOS DE JOGADORES */

let jogadoresFavoritos=JSON.parse(
localStorage.getItem("futzone_jogadores_favoritos")||"[]"
);

let notificacoesAtivas=
localStorage.getItem("futzone_notificacoes_ativadas")==="1";

let snapshotAnterior=JSON.parse(
localStorage.getItem("futzone_notificacao_snapshot")||"{}"
);

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

function logo(u){

if(!u)
return "<div style='height:37px'></div>";

return `
<img
class="escudo"
src="${esc(u)}"
onerror="this.style.visibility='hidden'">
`;

}

function comp(j){
return j?.competitions?.[0]||{};
}

function nome(c){

return c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
"Equipa";

}

function normalizar(j,l){

let c=comp(j);
let cs=c.competitors||[];

let h=
cs.find(x=>x.homeAway==="home")||
cs[0]||
{};

let a=
cs.find(x=>x.homeAway==="away")||
cs[1]||
{};

return {

id:String(j.id),

codigo:l.codigo,

liga:l.nome,

data:j.date||"",

home:{
id:h?.team?.id||"",
nome:nome(h),
logo:h?.team?.logo||"",
score:h?.score??"-"
},

away:{
id:a?.team?.id||"",
nome:nome(a),
logo:a?.team?.logo||"",
score:a?.score??"-"
},

estado:
c?.status?.type?.shortDetail||
c?.status?.type?.detail||
c?.status?.type?.description||
"",

state:
c?.status?.type?.state||
"",

competicao:c

};

}

/* =========================
JOGOS
========================= */

async function carregarJogos(){

let todos=[];

await Promise.all(

ligas.map(async l=>{

try{

let url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(l.codigo)
+
"/scoreboard?limit=100&_="+Date.now();

let r=await fetch(url);

if(!r.ok)return;

let d=await r.json();

(d.events||[]).forEach(j=>{
todos.push(normalizar(j,l));
});

}catch(e){}

})

);

jogos=todos;

if(pagina==="jogos")
mostrarJogos();

if(pagina==="favoritos")
mostrarFavoritos();

if(notificacoesAtivas){
verificarNotificacoes();
}

}

/* =========================
ESTADOS
========================= */

function aoVivo(j){

let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="in"||
s==="live"||
/live|ao vivo|half|intervalo|1st|2nd|extra time|penalty/.test(e);

}

function terminou(j){

let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="post"||
s==="final"||
/final|finished|ft|terminou/.test(e);

}

/* =========================
LIGAS
========================= */

function botoes(){

return `

<div class="seletor-ligas">

${ligas.map(l=>`

<button
class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${esc(l.nome)}')">

<span class="liga-icon">
${l.icone}
</span>

${esc(l.nome)}

</button>

`).join("")}

</div>

`;

}

function selecionarLiga(n){

ligaSelecionada=n;

if(pagina==="tabelas"){

mostrarTabela(n);

}else{

mostrarJogos();

}

scrollTo(0,0);

}

/* =========================
FAVORITOS DE JOGOS
========================= */

function alternarFavorito(id){

if(favoritos.includes(id)){

favoritos=
favoritos.filter(x=>x!==id);

}else{

favoritos.push(id);

}

localStorage.setItem(
"futzone_favoritos",
JSON.stringify(favoritos)
);

if(pagina==="favoritos")
mostrarFavoritos();
else
mostrarJogos();

}

/* =========================
FAVORITOS DE EQUIPAS
========================= */

function equipaEstaFavorita(id,codigo){

return equipasFavoritas.some(
x=>
String(x.id)===String(id)&&
String(x.codigo)===String(codigo)
);

}

function alternarEquipaFavorita(
id,
codigo,
nomeEquipa,
logoEquipa
){

if(!id)
return;

let existe=equipasFavoritas.findIndex(
x=>
String(x.id)===String(id)&&
String(x.codigo)===String(codigo)
);

if(existe>=0){

equipasFavoritas.splice(existe,1);

}else{

equipasFavoritas.push({

id:String(id),
codigo:String(codigo),
nome:nomeEquipa||"Equipa",
logo:logoEquipa||""

});

}

localStorage.setItem(
"futzone_equipas_favoritas",
JSON.stringify(equipasFavoritas)
);

if(pagina==="favoritos"){
mostrarFavoritos();
}

}

/* =========================
FAVORITOS DE JOGADORES
========================= */

function jogadorEstaFavorito(id){

return jogadoresFavoritos.some(
x=>String(x.id)===String(id)
);

}

function alternarJogadorFavorito(
id,
nomeJogador,
foto,
numero,
posicao,
equipa,
equipaId,
codigo
){

if(!id)
return;

let indice=jogadoresFavoritos.findIndex(
x=>String(x.id)===String(id)
);

if(indice>=0){

jogadoresFavoritos.splice(indice,1);

}else{

jogadoresFavoritos.push({

id:String(id),
nome:nomeJogador||"Jogador",
foto:foto||"",
numero:numero||"",
posicao:posicao||"",
equipa:equipa||"",
equipaId:String(equipaId||""),
codigo:String(codigo||"")

});

}

localStorage.setItem(
"futzone_jogadores_favoritos",
JSON.stringify(jogadoresFavoritos)
);

}

/* =========================
EQUIPA CLICÁVEL
========================= */

function clicarEquipa(
event,
id,
codigo,
nomeEquipa,
logoEquipa
){

event.stopPropagation();

if(!id){

alert(
"Não foi possível identificar esta equipa."
);

return;

}

mostrarEquipa(
id,
codigo,
nomeEquipa,
logoEquipa
);

}

function equipaLink(team,codigo){

return `

<div
class="equipa team-link"
onclick="clicarEquipa(
event,
'${esc(team.id)}',
'${esc(codigo)}',
'${esc(team.nome)}',
'${esc(team.logo)}'
)">

${logo(team.logo)}

${esc(team.nome)}

</div>

`;

}

/* =========================
CARTÃO MINI
========================= */

function cartaoMini(j){

return `

<div
class="card-mini"
onclick="abrirDetalhe(
'${esc(j.id)}',
'${esc(j.codigo)}'
)">

<button
class="fav-btn"
onclick="
event.stopPropagation();
alternarFavorito('${esc(j.id)}')
">

${favoritos.includes(j.id)?"★":"☆"}

</button>

<div class="jogo-top">

<span>${esc(j.liga)}</span>

<span class="${
aoVivo(j)
?"live"
:terminou(j)
?"final"
:"futuro"
}">

${esc(j.estado)}

</span>

</div>

<div class="equipas">

${equipaLink(j.home,j.codigo)}

<div class="resultado">

function txt(v){

?

(
v?.displayValue||

String(v??"");

}

function traduzirRelato(t){

let s=String(t||"");

const trocas=[

[/missed penalty/gi,"Penálti falhado"],
[/yellow card/gi,"Cartão amarelo"],
[/second yellow/gi,"Segundo cartão amarelo"],
[/red card/gi,"Cartão vermelho"],
[/substitution/gi,"Substituição"],
[/own goal/gi,"Autogolo"],
[/penalty/gi,"Penálti"],
[/goal/gi,"Golo"],
[/assist/gi,"Assistência"],
[/offside/gi,"Fora de jogo"],
[/corner kick/gi,"Pontapé de canto"],
[/free kick/gi,"Livre"],
[/shot on target/gi,"Remate à baliza"],
[/shot off target/gi,"Remate para fora"],
[/blocked shot/gi,"Remate bloqueado"],
[/foul/gi,"Falta"],
[/save/gi,"Defesa"],
[/kickoff/gi,"Pontapé de saída"],
[/throw-in/gi,"Lançamento lateral"],
[/header/gi,"Cabeceamento"]

];

trocas.forEach(x=>{
s=s.replace(x[0],x[1]);
});

return s;

}

/* =========================
EVENTOS
========================= */

function extrairEventos(d){

let out=[];
let seen=new Set();

let src=[
...(d.plays||[]),
...(d.keyEvents||[]),
...(d.scoringPlays||[])
];

for(let e of src){

let original=(
(e?.type?.text||"")+" "+
(e?.text||"")+" "+
(e?.shortText||"")+" "+
(e?.description||"")
);

let s=original.toLowerCase();

if(
!/goal|gol|yellow|amarelo|red|vermelho|substitut|penalty|autogol|assist|offside|corner|free kick|shot|foul|save/.test(s)
)
continue;

let t=
e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento";

let k=JSON.stringify([
e?.id,
e?.clock?.displayValue,
t
]);

if(seen.has(k))
continue;

seen.add(k);

let i=
/yellow|amarelo/.test(s)
?"🟨"
:
/red|vermelho/.test(s)
?"🟥"
:
/substitut/.test(s)
?"🔄"
:
/penalty/.test(s)
?"🎯"
:
/assist/.test(s)
?"🎯"
:
/shot|corner|free kick|foul|save|offside/.test(s)
?"🔵"
:
"⚽";

out.push({
m:e?.clock?.displayValue||
e?.period?.displayValue||
"",
t:traduzirRelato(t),
i
});

}

return out;

}

function extrairStats(d){

let grupos=[];

function add(team,ss){

if(!team||!Array.isArray(ss))
return;

let id=
team?.id||
team?.team?.id||
team?.displayName||
team?.team?.displayName;

let g=grupos.find(
x=>String(x.id)===String(id)
);

if(!g){

g={
id,
nome:
team?.displayName||
team?.name||
team?.team?.displayName||
team?.team?.name||
"Equipa",
s:[]
};

grupos.push(g);

}

ss.forEach(x=>{

let n=
x?.displayName||
x?.shortDisplayName||
x?.name||
x?.label||
x?.description;

if(n){

g.s.push({
n,
v:txt(
x?.displayValue||
x?.value||
x?.display
)
});

}

});

}

(d.boxscore?.teams||[])
.forEach(t=>
add(
t.team||t,
t.statistics||t.stats
)
);

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(
c.team||c,
c.statistics
)
);

(d.competitors||[])
.forEach(c=>
add(
c.team||c,
c.statistics
)
);

if(grupos.length<2)
return [];

let m=new Map();

grupos.forEach((g,gi)=>{

g.s.forEach(x=>{

let k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{
n:x.n,
h:"-",
a:"-"
});

let r=m.get(k);

if(gi===0)r.h=x.v;
if(gi===1)r.a=x.v;

});

});

return [...m.values()];

}

tit:

function extrairPlantelEquipa(d){

let arr=[];

function percorrer(obj){

if(!obj)
return;

if(Array.isArray(obj)){

obj.forEach(percorrer);

return;

}

if(typeof obj!=="object")
return;

if(obj.athlete){

let a=obj.athlete;

if(a.displayName||a.fullName){

arr.push({

id:a.id||"",

nome:
a.displayName||
a.fullName||
a.shortName||
"Jogador",

numero:
a.jersey||
obj.jersey||
a.uniformNumber||
"",

posicao:
a.position?.displayName||
a.position?.abbreviation||
obj.position?.displayName||
"",

foto:
a.headshot?.href||
a.headshot||
""

});

}

}

if(
obj.displayName||
obj.fullName
){

let a=obj;

if(
!arr.some(
x=>
String(x.id)===String(a.id)&&
a.id
)
){

arr.push({

id:a.id||"",

nome:
a.displayName||
a.fullName||
a.shortName||
"Jogador",

numero:
a.jersey||
a.uniformNumber||
"",

posicao:
a.position?.displayName||
a.position?.abbreviation||
"",

foto:
a.headshot?.href||
a.headshot||
""

});

}

}

Object.keys(obj).forEach(k=>{

if(k!=="athlete")
percorrer(obj[k]);

});

}

percorrer(d);

let unicos=[];
let nomes=new Set();

arr.forEach(p=>{

let chave=p.id?
"id-"+p.id:
"name-"+p.nome;

if(nomes.has(chave))
return;

nomes.add(chave);
unicos.push(p);

});

return unicos;

}

function procurarHistoricoClubes(obj,out=[]){

if(!obj)
return out;

if(Array.isArray(obj)){

obj.forEach(x=>
procurarHistoricoClubes(x,out)
);

return out;

}

if(typeof obj!=="object")
return out;

let nomeClube=
obj.team?.displayName||
obj.team?.name||
obj.teamName||
obj.club?.displayName||
obj.club?.name||
obj.organization?.displayName;

let logoClube=
obj.team?.logos?.[0]?.href||
obj.team?.logo||
obj.club?.logo||
obj.organization?.logo||
"";

let inicio=
obj.startDate||
obj.from||
obj.start||
obj.season?.displayName||
obj.season?.year||
"";

let fim=
obj.endDate||
obj.to||
obj.end||
"";

if(nomeClube){

let chave=
String(nomeClube)+"_"+String(inicio);

if(!out.some(
x=>x.chave===chave
)){

out.push({

chave,
nome:nomeClube,
logo:logoClube,
inicio,
fim

});

}

}

Object.keys(obj).forEach(k=>{

if(
k!=="team"&&
k!=="club"&&
k!=="organization"
){

procurarHistoricoClubes(
obj[k],
out
);

}

});

return out;

}

async function pedirPermissaoNotificacoes(){

if(!("Notification" in window)){

alert(
"Este navegador não suporta notificações."
);

return false;

}

if(Notification.permission==="granted")
return true;

if(Notification.permission==="denied"){

alert(
"As notificações estão bloqueadas no navegador. Ativa-as nas definições do navegador."
);

return false;

}

let p=await Notification.requestPermission();

return p==="granted";

}

)

)
);

let anterior=snapshotAnterior||{};

for(let id of Object.keys(atual)){

);

if(

novo.homeScore!=="-"
){

parseInt(novo.homeScore)-
parseInt(velho.homeScore);

enviarNotificacao(

j.home.nome+
" marcou! "+
j.home.score+
" - "+
j.away.score,

"golo-"+j.id+"-home-"+j.home.score

);

}

}

if(
String(novo.awayScore)!==
String(velho.awayScore)&&
novo.awayScore!=="-"
){

let diferenca=
parseInt(novo.awayScore)-
parseInt(velho.awayScore);

if(diferenca>0){

enviarNotificacao(

" marcou! "+
j.home.score+
" - "+
j.away.score,

"golo-"+j.id+"-away-"+j.away.score

);

}

}

if(
novo.final===true&&
velho.final!==true
){

enviarNotificacao(

j.home.nome+
" "+
j.home.score+

j.away.score+

);

}

if(aoVivo(j)){

);

snapshotAnterior=atual;

);

function obterStat(
stats,
names,
defaultValue=0
){

if(!Array.isArray(stats))
return defaultValue;

let s=stats.find(x=>{

let nomes=[

x?.name,
x?.abbreviation,
x?.displayName,
x?.shortDisplayName

]
.map(v=>
String(v||"").toLowerCase()
);

return names.some(
n=>nomes.includes(n)
);

});

if(!s)
return defaultValue;

return s?.displayValue??
s?.value??
defaultValue;

}

function procurarEquipas(
obj,
out=[]
){

if(!obj||
typeof obj!=="object")
return out;

if(Array.isArray(obj)){

obj.forEach(
x=>procurarEquipas(x,out)
);

return out;

}

if(obj.team){

let stats=
obj.stats||
obj.statistics||
obj.records||
[];

if(
Array.isArray(stats)||
Array.isArray(obj.records)
){

out.push(obj);

}

}

Object.keys(obj).forEach(k=>{

if(
k!=="team"&&
k!=="stats"&&
k!=="statistics"
){

procurarEquipas(
obj[k],
out
);

}

});

return out;

}
