<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#071326;border-bottom:1px solid #17243a;padding:14px 12px}
.logo{font-size:25px;font-weight:900}.logo span{color:#7ed957}
main{padding:12px 10px 85px;max-width:700px;margin:auto}
h2{font-size:18px;margin:15px 0 10px}

.seletor-ligas{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-bottom:15px
}

.liga-btn{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:12px 7px;
color:#fff;
text-align:center;
font-size:13px;
font-weight:bold
}

.liga-btn.active{
background:#0d1b30;
border-color:#3c6da8
}

.liga-icon{
font-size:22px;
display:block;
margin-bottom:5px
}

.jogo{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:12px;
margin-bottom:9px;
cursor:pointer
}

.jogo-top{
display:flex;
justify-content:space-between;
color:#9ca9bb;
font-size:11px;
margin-bottom:9px
}

.equipas{
display:grid;
grid-template-columns:1fr 50px 1fr;
align-items:center;
gap:5px
}

.equipa{
text-align:center;
font-size:13px;
font-weight:bold
}

.escudo{
width:32px;
height:32px;
object-fit:contain;
display:block;
margin:0 auto 5px
}

.resultado{
text-align:center;
font-size:19px;
font-weight:900
}

.vazio{
background:#0b1627;
border:1px solid #17243a;
border-radius:12px;
padding:20px;
text-align:center;
color:#9ca9bb
}

/* DIRETO */

.direto{
background:#071a15;
border:1px solid #7ed957;
border-radius:14px;
padding:12px;
margin:15px 0
}

.direto h2{
color:#7ed957;
margin-top:0
}

/* CARROSSÉIS */

.carrossel{
display:flex;
gap:9px;
overflow-x:auto;
padding-bottom:8px;
scrollbar-width:none
}

.carrossel::-webkit-scrollbar{
display:none
}

.card-mini{
min-width:190px;
max-width:190px;
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:11px;
cursor:pointer;
position:relative
}

.card-mini .equipas{
grid-template-columns:1fr 42px 1fr
}

.card-mini .equipa{
font-size:11px
}

.card-mini .escudo{
width:27px;
height:27px
}

.card-mini .resultado{
font-size:16px
}

.live{
color:#7ed957;
font-weight:bold
}

.futuro{
color:#75a9ff;
font-weight:bold
}

.final{
color:#9ca9bb;
font-weight:bold
}

.fav-btn{
position:absolute;
right:7px;
top:7px;
background:#071326;
border:1px solid #243653;
color:#fff;
border-radius:50%;
width:27px;
height:27px;
font-size:15px;
z-index:2
}

.team-link{
cursor:pointer;
border-radius:8px;
padding:3px
}

.team-link:active{
background:#17243a
}

/* MENU */

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#071326;
border-top:1px solid #17243a;
display:flex;
z-index:30
}

.bottom button{
background:none;
border:0;
color:#9ca9bb;
font-weight:bold;
width:33%;
font-size:12px
}

.bottom button.active{
color:#7ed957
}

/* DETALHE */

.overlay{
position:fixed;
inset:0;
background:#050b16;
z-index:50;
overflow:auto
}

.detalhe-header{
position:sticky;
top:0;
background:#071326;
border-bottom:1px solid #17243a;
padding:12px;
z-index:5
}

.voltar{
background:#0b1627;
border:1px solid #243653;
color:#fff;
border-radius:8px;
padding:8px 12px;
font-weight:bold
}

.detalhe{
max-width:700px;
margin:auto;
padding:10px 10px 35px
}

.jogo-grande{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px 10px;
margin-bottom:12px
}

.jogo-grande .equipas{
grid-template-columns:1fr 80px 1fr
}

.jogo-grande .escudo{
width:55px;
height:55px
}

.jogo-grande .equipa{
font-size:15px
}

.bigscore{
text-align:center;
font-size:30px;
font-weight:900
}

.estado{
text-align:center;
color:#7ed957;
font-size:12px;
margin-top:5px
}

/* SECÇÕES */

.secao{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
margin:10px 0;
padding:12px
}

.secao h3{
font-size:15px;
margin:0 0 10px
}

.evento{
display:flex;
gap:9px;
padding:8px 0;
border-bottom:1px solid #17243a;
font-size:13px
}

.evento:last-child{
border-bottom:0
}

.minuto{
color:#7ed957;
font-weight:bold;
min-width:38px
}

/* ESTATÍSTICAS */

.stats-head,
.stat-row{
display:grid;
grid-template-columns:1fr 90px 1fr;
text-align:center
}

.stats-head{
font-size:12px;
margin-bottom:7px
}

.stat-row{
align-items:center;
border-top:1px solid #17243a;
padding:8px 0;
font-size:12px
}

.stat-row .nome{
font-size:10px;
color:#9ca9bb
}

.stat-home{
text-align:right;
font-weight:bold
}

.stat-away{
text-align:left;
font-weight:bold
}

/* PLANTEL */

.lista-jogadores{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.jogador{
background:#071326;
border:1px solid #17243a;
border-radius:8px;
padding:9px;
font-size:12px;
display:flex;
align-items:center;
gap:7px
}

.jogador b{
color:#7ed957;
margin-right:2px
}

.jogador img{
width:35px;
height:35px;
border-radius:50%;
object-fit:cover
}

.subtitulo{
color:#9ca9bb;
font-size:11px;
margin:8px 0
}

.carregando{
text-align:center;
color:#9ca9bb;
padding:20px
}

.erro{
color:#ff8f8f;
text-align:center;
padding:15px
}

/* EQUIPA */

.equipa-cabecalho{
background:#0b1627;
border:1px solid #17243a;
border-radius:14px;
padding:18px;
text-align:center;
margin-bottom:12px
}

.equipa-logo-grande{
width:75px;
height:75px;
object-fit:contain;
display:block;
margin:0 auto 10px
}

.equipa-nome-grande{
font-size:20px;
font-weight:900
}

/* TABELAS */

.tabela-caixa{
background:#0b1627;
border:1px solid #17243a;
border-radius:13px;
padding:12px;
margin-top:10px
}

.tabela-scroll{
overflow-x:auto
}

.tabela{
width:100%;
border-collapse:collapse;
font-size:12px;
min-width:520px
}

.tabela th{
color:#9ca9bb;
font-size:10px;
padding:9px 5px;
border-bottom:1px solid #243653
}

.tabela td{
padding:9px 5px;
border-bottom:1px solid #17243a;
text-align:center
}

.tabela td:nth-child(2){
text-align:left;
font-weight:bold
}

.posicao{
color:#7ed957;
font-weight:bold
}

.logo-tabela{
width:21px;
height:21px;
object-fit:contain;
vertical-align:middle;
margin-right:5px
}

.equipa-tabela-link{
cursor:pointer;
display:flex;
align-items:center;
gap:4px;
min-width:150px;
padding:3px;
border-radius:7px
}

.equipa-tabela-link:active{
background:#17243a
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<main id="app"></main>

<div class="bottom">

<button id="navJogos"
class="active"
onclick="mostrarJogos()">
⚽<br>Jogos
</button>

<button id="navTabelas"
onclick="mostrarTabelas()">
🏆<br>Tabelas
</button>

<button id="navFav"
onclick="mostrarFavoritos()">
⭐<br>Favoritos
</button>

</div>

<script>

const ligas=[

{nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
{nome:"França",codigo:"fra.1",icone:"🇫🇷"},
{nome:"Países Baixos",codigo:"ned.1",icone:"🇳🇱"},
{nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
{nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}

];

let jogos=[];
let ligaSelecionada="Portugal";
let pagina="jogos";

let favoritos=JSON.parse(
localStorage.getItem("futzone_favoritos")||"[]"
);

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

function logo(u){

if(!u)
return "<div style='height:37px'></div>";

return `
<img
class="escudo"
src="${esc(u)}"
onerror="this.style.visibility='hidden'">
`;

}

function comp(j){
return j?.competitions?.[0]||{};
}

function nome(c){

return c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
"Equipa";

}

function normalizar(j,l){

let c=comp(j);
let cs=c.competitors||[];

let h=
cs.find(x=>x.homeAway==="home")||
cs[0]||
{};

let a=
cs.find(x=>x.homeAway==="away")||
cs[1]||
{};

return {

id:String(j.id),

codigo:l.codigo,

liga:l.nome,

data:j.date||"",

home:{
id:h?.team?.id||"",
nome:nome(h),
logo:h?.team?.logo||"",
score:h?.score??"-"
},

away:{
id:a?.team?.id||"",
nome:nome(a),
logo:a?.team?.logo||"",
score:a?.score??"-"
},

estado:
c?.status?.type?.shortDetail||
c?.status?.type?.detail||
c?.status?.type?.description||
"",

state:
c?.status?.type?.state||
"",

competicao:c

};

}

/* =========================
JOGOS
========================= */

async function carregarJogos(){

let todos=[];

await Promise.all(

ligas.map(async l=>{

try{

let url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(l.codigo)
+
"/scoreboard?limit=100&_="+Date.now();

let r=await fetch(url);

if(!r.ok)return;

let d=await r.json();

(d.events||[]).forEach(j=>{
todos.push(normalizar(j,l));
});

}catch(e){}

})

);

jogos=todos;

if(pagina==="jogos")
mostrarJogos();

if(pagina==="favoritos")
mostrarFavoritos();

}

/* =========================
ESTADOS
========================= */

function aoVivo(j){

let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="in"||
s==="live"||
/live|ao vivo|half|intervalo|1st|2nd|extra time|penalty/.test(e);

}

function terminou(j){

let s=(j.state||"").toLowerCase();
let e=(j.estado||"").toLowerCase();

return s==="post"||
s==="final"||
/final|finished|ft|terminou/.test(e);

}

/* =========================
LIGAS
========================= */

function botoes(){

return `

<div class="seletor-ligas">

${ligas.map(l=>`

<button
class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${esc(l.nome)}')">

<span class="liga-icon">
${l.icone}
</span>

${esc(l.nome)}

</button>

`).join("")}

</div>

`;

}

function selecionarLiga(n){

ligaSelecionada=n;

if(pagina==="tabelas"){

mostrarTabela(n);

}else{

mostrarJogos();

}

scrollTo(0,0);

}

/* =========================
FAVORITOS
========================= */

function alternarFavorito(id){

if(favoritos.includes(id)){

favoritos=
favoritos.filter(x=>x!==id);

}else{

favoritos.push(id);

}

localStorage.setItem(
"futzone_favoritos",
JSON.stringify(favoritos)
);

if(pagina==="favoritos")
mostrarFavoritos();
else
mostrarJogos();

}

/* =========================
EQUIPA CLICÁVEL
========================= */

function clicarEquipa(
event,
id,
codigo,
nomeEquipa,
logoEquipa
){

event.stopPropagation();

if(!id){

alert(
"Não foi possível identificar esta equipa."
);

return;

}

mostrarEquipa(
id,
codigo,
nomeEquipa,
logoEquipa
);

}

function equipaLink(team,codigo){

return `

<div
class="equipa team-link"
onclick="clicarEquipa(
event,
'${esc(team.id)}',
'${esc(codigo)}',
'${esc(team.nome)}',
'${esc(team.logo)}'
)">

${logo(team.logo)}

${esc(team.nome)}

</div>

`;

}

/* =========================
CARTÃO MINI
========================= */

function cartaoMini(j){

return `

<div
class="card-mini"
onclick="abrirDetalhe(
'${esc(j.id)}',
'${esc(j.codigo)}'
)">

<button
class="fav-btn"
onclick="
event.stopPropagation();
alternarFavorito('${esc(j.id)}')
">

${favoritos.includes(j.id)?"★":"☆"}

</button>

<div class="jogo-top">

<span>
${esc(j.liga)}
</span>

<span class="${
aoVivo(j)
?"live"
:terminou(j)
?"final"
:"futuro"
}">

${esc(j.estado)}

</span>

</div>

<div class="equipas">

${equipaLink(j.home,j.codigo)}

<div class="resultado">

${esc(j.home.score)}
-
${esc(j.away.score)}

</div>

${equipaLink(j.away,j.codigo)}

</div>

</div>

`;

}

/* =========================
CARTÃO NORMAL
========================= */

function cartao(j){

return `

<div
class="jogo"
onclick="abrirDetalhe(
'${esc(j.id)}',
'${esc(j.codigo)}'
)">

<button
class="fav-btn"
onclick="
event.stopPropagation();
alternarFavorito('${esc(j.id)}')
">

${favoritos.includes(j.id)?"★":"☆"}

</button>

<div class="jogo-top">

<span>
${esc(j.liga)}
</span>

<span class="${
aoVivo(j)
?"live"
:terminou(j)
?"final"
:"futuro"
}">

${esc(j.estado)}

</span>

</div>

<div class="equipas">

${equipaLink(j.home,j.codigo)}

<div class="resultado">

${esc(j.home.score)}
-
${esc(j.away.score)}

</div>

${equipaLink(j.away,j.codigo)}

</div>

</div>

`;

}

/* =========================
PÁGINA JOGOS
========================= */

function mostrarJogos(){

pagina="jogos";

nav("navJogos");

let liga=jogos.filter(
j=>j.liga===ligaSelecionada
);

let vivos=jogos.filter(aoVivo);

let proximos=liga.filter(
j=>!aoVivo(j)&&!terminou(j)
);

let resultados=liga.filter(
terminou
);

app.innerHTML=`

<h2>Ligas</h2>

${botoes()}

<div class="direto">

<h2>🔴 EM DIRETO</h2>

${
vivos.length

?

`<div class="carrossel">
${vivos.map(cartaoMini).join("")}
</div>`

:

`<div class="vazio">
Não existem jogos a decorrer neste momento.
</div>`

}

</div>

<h2>⏰ PRÓXIMOS JOGOS</h2>

${
proximos.length

?

`<div class="carrossel">
${proximos.map(cartaoMini).join("")}
</div>`

:

`<div class="vazio">
Não há próximos jogos disponíveis.
</div>`

}

<h2>✅ RESULTADOS</h2>

${
resultados.length

?

`<div class="carrossel">
${resultados
.slice()
.reverse()
.map(cartaoMini)
.join("")}
</div>`

:

`<div class="vazio">
Não há resultados disponíveis.
</div>`

}

`;

}

/* =========================
NAVEGAÇÃO
========================= */

function nav(id){

[
"navJogos",
"navTabelas",
"navFav"
]
.forEach(x=>{

document
.getElementById(x)
.classList.toggle(
"active",
x===id
);

});

}

/* =========================
TRADUÇÃO
========================= */

function txt(v){

return typeof v==="object"

?

(
v?.displayValue||
v?.value||
v?.text||
""
)

:

String(v??"");

}

function traduzirRelato(t){

let s=String(t||"");

const trocas=[

[/missed penalty/gi,"Penálti falhado"],

[/yellow card/gi,"Cartão amarelo"],

[/second yellow/gi,"Segundo cartão amarelo"],

[/red card/gi,"Cartão vermelho"],

[/substitution/gi,"Substituição"],

[/own goal/gi,"Autogolo"],

[/penalty/gi,"Penálti"],

[/goal/gi,"Golo"],

[/assist/gi,"Assistência"],

[/offside/gi,"Fora de jogo"],

[/corner kick/gi,"Pontapé de canto"],

[/free kick/gi,"Livre"],

[/shot on target/gi,"Remate à baliza"],

[/shot off target/gi,"Remate para fora"],

[/blocked shot/gi,"Remate bloqueado"],

[/foul/gi,"Falta"],

[/save/gi,"Defesa"],

[/kickoff/gi,"Pontapé de saída"],

[/throw-in/gi,"Lançamento lateral"],

[/header/gi,"Cabeceamento"]

];

trocas.forEach(x=>{
s=s.replace(x[0],x[1]);
});

return s;

}

/* =========================
EVENTOS
========================= */

function extrairEventos(d){

let out=[];
let seen=new Set();

let src=[

...(d.plays||[]),

...(d.keyEvents||[]),

...(d.scoringPlays||[])

];

for(let e of src){

let original=(

(e?.type?.text||"")+" "+

(e?.text||"")+" "+

(e?.shortText||"")+" "+

(e?.description||"")

);

let s=original.toLowerCase();

if(
!/goal|gol|yellow|amarelo|red|vermelho|substitut|penalty|autogol|assist|offside|corner|free kick|shot|foul|save/.test(s)
)
continue;

let t=

e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento";

let k=JSON.stringify([

e?.id,
e?.clock?.displayValue,
t

]);

if(seen.has(k))
continue;

seen.add(k);

let i=

/yellow|amarelo/.test(s)
?"🟨"

:

/red|vermelho/.test(s)
?"🟥"

:

/substitut/.test(s)
?"🔄"

:

/penalty/.test(s)
?"🎯"

:

/assist/.test(s)
?"🎯"

:

/shot|corner|free kick|foul|save|offside/.test(s)
?"🔵"

:

"⚽";

out.push({

m:
e?.clock?.displayValue||
e?.period?.displayValue||
"",

t:traduzirRelato(t),

i

});

}

return out;

}

/* =========================
ESTATÍSTICAS
========================= */

function extrairStats(d){

let grupos=[];

function add(team,ss){

if(!team||!Array.isArray(ss))
return;

let id=

team?.id||
team?.team?.id||
team?.displayName||
team?.team?.displayName;

let g=grupos.find(
x=>String(x.id)===String(id)
);

if(!g){

g={

id,

nome:

team?.displayName||
team?.name||
team?.team?.displayName||
team?.team?.name||
"Equipa",

s:[]

};

grupos.push(g);

}

ss.forEach(x=>{

let n=

x?.displayName||
x?.shortDisplayName||
x?.name||
x?.label||
x?.description;

if(n){

g.s.push({

n,

v:txt(
x?.displayValue||
x?.value||
x?.display
)

});

}

});

}

(d.boxscore?.teams||[])
.forEach(t=>
add(
t.team||t,
t.statistics||t.stats
)
);

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(
c.team||c,
c.statistics
)
);

(d.competitors||[])
.forEach(c=>
add(
c.team||c,
c.statistics
)
);

if(grupos.length<2)
return [];

let m=new Map();

grupos.forEach((g,gi)=>{

g.s.forEach(x=>{

let k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{
n:x.n,
h:"-",
a:"-"
});

let r=m.get(k);

if(gi===0)
r.h=x.v;

if(gi===1)
r.a=x.v;

});

});

return [...m.values()];

}

function extrairPlantel(d){

let gs=[];

function add(team,arr){

if(!team||!Array.isArray(arr))
return;

let id=

team?.id||
team?.team?.id||
team?.displayName;

let g=gs.find(
x=>String(x.id)===String(id)
);

if(!g){

g={

id,

nome:
team?.displayName||
team?.name||
team?.team?.displayName||
"Equipa",

p:[]

};

gs.push(g);

}

arr.forEach(x=>{

let a=x?.athlete||x?.player||x;

if(!a?.displayName&&!a?.fullName)
return;

let n=
a.displayName||
a.fullName||
a.shortName;

if(g.p.some(q=>q.n===n))
return;

g.p.push({

id:a.id||"",

n,

num:
a.jersey||
x.jersey||
a.uniformNumber||
"",

pos:
a?.position?.abbreviation||
a?.position?.displayName||
x?.position?.displayName||
"",

foto:
a?.headshot?.href||
a?.headshot||
"",

tit:
x.starter===true||
x.starter==="true"

});

});

}

(d.rosters||[])
.forEach(r=>
add(
r.team||r,
r.roster||r.athletes||r.players
)
);

(d.boxscore?.players||[])
.forEach(g=>
add(
g.team||g,
g.statistics||
g.athletes||
g.roster||
g.players
)
);

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(
c.team||c,
c.roster||
c.athletes||
c.players
)
);

return gs.filter(g=>g.p.length);

}

function posicaoGrupo(pos){

let p=String(pos||"").toLowerCase();

if(
/goal|keeper|gk|guarda/.test(p)
)
return "🧤 Guarda-redes";

if(
/def|back|centre back|full back|defesa/.test(p)
)
return "🛡️ Defesas";

if(
/mid|center mid|winger|méd|medio|meio/.test(p)
)
return "⚙️ Médios";

if(
/forward|striker|att|fwd|avanç|avanc/.test(p)
)
return "⚡ Avançados";

return "👤 Outros";

}

function extrairPlantelEquipa(d){

let arr=[];

function percorrer(obj){

if(!obj)
return;

if(Array.isArray(obj)){

obj.forEach(percorrer);

return;

}

if(typeof obj!=="object")
return;

if(obj.athlete){

let a=obj.athlete;

if(a.displayName||a.fullName){

arr.push({

id:a.id||"",

nome:
a.displayName||
a.fullName||
a.shortName||
"Jogador",

numero:
a.jersey||
obj.jersey||
a.uniformNumber||
"",

posicao:
a.position?.displayName||
a.position?.abbreviation||
obj.position?.displayName||
"",

foto:
a.headshot?.href||
a.headshot||
""

});

}

}

if(
obj.displayName||
obj.fullName
){

let a=obj;

if(
!arr.some(
x=>
String(x.id)===String(a.id)&&
a.id
)
){

arr.push({

id:a.id||"",

nome:
a.displayName||
a.fullName||
a.shortName||
"Jogador",

numero:
a.jersey||
a.uniformNumber||
"",

posicao:
a.position?.displayName||
a.position?.abbreviation||
"",

foto:
a.headshot?.href||
a.headshot||
""

});

}

}

Object.keys(obj).forEach(k=>{

if(k!=="athlete")
percorrer(obj[k]);

});

}

percorrer(d);

let unicos=[];
let nomes=new Set();

arr.forEach(p=>{

let chave=p.id?
"id-"+p.id:
"name-"+p.nome;

if(nomes.has(chave))
return;

nomes.add(chave);
unicos.push(p);

});

return unicos;

}

</div>

</div>

document.body.appendChild(o);

try{

"https://site.api.espn.com/apis/site/v2/sports/soccer/"

"/teams/"
+
encodeURIComponent(teamId)
+

if(!jogadores.length){

let r2=await fetch(

"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(codigo)
+
"/teams/"
+
encodeURIComponent(teamId)
+
"?_="+Date.now()

);

if(r2.ok){

let d2=await r2.json();

jogadores=
extrairPlantelEquipa(d2);

}

}

/* TERCEIRA TENTATIVA:
usar jogos recentes da equipa como fallback */

if(!jogadores.length){

let url3=

"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(codigo)
+
"/scoreboard?limit=100&_="+Date.now();

let r3=await fetch(url3);

let d3=await r3.json();

for(let ev of d3.events||[]){

let c=ev.competitions?.[0];

for(let tm of c?.competitors||[]){

if(String(tm.team?.id)===String(teamId)){

let resumo=await fetch(

"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(codigo)
+
"/summary?event="+
encodeURIComponent(ev.id)+
"&_="+Date.now()

);

if(resumo.ok){

let rd=await resumo.json();

let gs=extrairPlantel(rd);

let g=gs.find(
x=>String(x.id)===String(teamId)
);

if(g&&g.p.length){

jogadores=g.p.map(p=>({

id:p.id||"",

nome:p.n,

numero:p.num,

posicao:p.pos,

foto:p.foto

}));

break;

}

}

}

}

if(jogadores.length)
break;

}

}

}

let grupos={

"🧤 Guarda-redes":[],

"🛡️ Defesas":[],

"⚙️ Médios":[],

"⚡ Avançados":[],

"👤 Outros":[]

};

jogadores.forEach(p=>{

let g=posicaoGrupo(p.posicao);

grupos[g].push(p);

});

let html="";

Object.keys(grupos).forEach(g=>{

return;

html+=`

<div class="secao">

<h3>
${g}
</h3>

<div class="lista-jogadores">

${grupos[g].map(p=>`

<div class="jogador">

${
p.foto
?

`
<img
src="${esc(p.foto)}"
onerror="this.style.display='none'">
`

:""
}

<b>
${esc(p.numero)}
</b>

<span>

${esc(p.nome)}

<small style="display:block;color:#9ca9bb">

${esc(p.posicao)}

</small>

</span>

</div>

`).join("")}

</div>

</div>

`;

});

if(!html){

html=`

<div class="erro">

Não foi possível obter o plantel desta equipa.

</div>

}

o.querySelector(".detalhe")
.insertAdjacentHTML(

);

o.querySelector(".carregando")
.remove();

}catch(e){

o.querySelector(".carregando")
.outerHTML=`

<div class="erro">

Não foi possível carregar o plantel desta equipa.

</div>

`;

}

}

function obterStat(
stats,
names,
defaultValue=0
){

if(!Array.isArray(stats))
return defaultValue;

let s=stats.find(x=>{

let nomes=[

x?.name,
x?.abbreviation,
x?.displayName,
x?.shortDisplayName

]
.map(v=>
String(v||"").toLowerCase()
);

return names.some(
n=>nomes.includes(n)
);

});

if(!s)
return defaultValue;

return s?.displayValue??
s?.value??
defaultValue;

}

function procurarEquipas(
obj,
out=[]
){

if(!obj||
typeof obj!=="object")
return out;

if(Array.isArray(obj)){

obj.forEach(
x=>procurarEquipas(x,out)
);

return out;

}

if(obj.team){

let stats=
obj.stats||
obj.statistics||
obj.records||
[];

if(
Array.isArray(stats)||
Array.isArray(obj.records)
){

out.push(obj);

}

}

Object.keys(obj).forEach(k=>{

if(
k!=="team"&&
k!=="stats"&&
k!=="statistics"
){

procurarEquipas(
obj[k],
out
);

}

});

return out;

}

async function resultadosRecentesLiga(l){

try{

let agora=new Date();

let inicio=new Date(agora);

inicio.setDate(
inicio.getDate()-14
);

function dataAPI(x){

return x.getFullYear()+
String(x.getMonth()+1)
.padStart(2,"0")+
String(x.getDate())
.padStart(2,"0");

}

let url=

"https://site.api.espn.com/apis/site/v2/sports/soccer/"
+
encodeURIComponent(l.codigo)
+
"/scoreboard?dates="
+
dataAPI(inicio)
+
"-"
+
dataAPI(agora)
+
"&limit=1000&_="+Date.now();

let r=await fetch(url);

if(!r.ok)
return [];

let d=await r.json();

return (d.events||[])
.map(j=>normalizar(j,l))
.filter(terminou)
.sort(
(a,b)=>
new Date(b.data)-new Date(a.data)
)
.slice(0,20);

}catch(e){

return [];

}

}
