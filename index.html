function futsalPontos(){
const m={};
futsalEquipas.forEach(x=>m[x]={team:x,j:0,v:0,e:0,d:0,gf:0,ga:0,pts:0});
futsalJogos.filter(x=>x.hs!==null&&x.as!==null).forEach(x=>{
const h=m[x.casa],a=m[x.fora];if(!h||!a)return;
h.j++;a.j++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;
if(x.hs>x.as){h.v++;h.pts+=3;a.d++}
else if(x.hs<x.as){a.v++;a.pts+=3;h.d++}
else{h.e++;a.e++;h.pts++;a.pts++}
});
return Object.values(m).sort((a,b)=>b.pts-a.pts||b.gf-b.ga-a.gf+a.ga)
}

function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"").replace(/fc$|sc$|cp$|sad$|ad$|cr$|crc$|sl$/g,"")}

async function resolverEquipa(liga,id,nome){
if(id)return id;
const map=await obterTeamsLiga(liga);
const alvo=norm(nome);let found="";
for(const t of map.values()){if(norm(t.displayName||t.name)===alvo||norm(t.shortDisplayName||"")===alvo){found=t.id;break}}
if(!found){for(const t of map.values()){const n=norm(t.displayName||t.name);if(n.includes(alvo)||alvo.includes(n)){found=t.id;break}}}
return found
}

[a.teams,a.teamHistory,a.history,a.experience?.teams,a.career?.teams,a.contracts].forEach(v=>Array.isArray(v)?v.forEach(add):add(v));

document.getElementById("overlay").classList.add("show");
document.getElementById("overlayTitle").textContent=nome;
document.getElementById("overlayBody").innerHTML='<div class="loading">⏳ A carregar perfil, estatísticas e histórico...</div>';

const[d,o,g]=await Promise.all([
id?fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/"+encodeURIComponent(id)):null,
id?fetchJSON("https://site.web.api.espn.com/apis/common/v3/sports/soccer/por.1/athletes/"+encodeURIComponent(id)+"/overview"):null,
id?fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/"+encodeURIComponent(id)+"/gamelog"):null
]);

const a={...(d?.athlete||d||{}),...(o?.athlete||{}),overview:o};
const stats=a.statistics||a.stats||o?.statistics||o?.stats||[];
const hist=extrairHistoricoJogador(a);
let jogos=[];
if(Array.isArray(g?.events))jogos=g.events.slice(0,20);
else if(Array.isArray(g?.gamelog))jogos=g.gamelog.slice(0,20);

document.getElementById("overlayBody").innerHTML=`${a.headshot?.href?`<div class="detailCard" style="text-align:center"><img src="${escapeHtml(a.headshot.href)}" style="width:90px;height:90px;object-fit:contain;border-radius:50%"></div>`:""}<div class="detailCard"><h3>👤 ${escapeHtml(a.displayName||a.fullName||nome)}</h3><div style="color:var(--muted);font-size:13px">${escapeHtml(a.position?.displayName||a.position?.name||"Jogador")}</div></div>${cardJogadorExtra(a)}<div class="detailCard"><h3>📊 Estatísticas</h3><div style="color:var(--muted);font-size:13px">⚽ Golos: ${escapeHtml(obterStatAtleta(a,["goals","goal"]))}<br>🅰️ Assistências: ${escapeHtml(obterStatAtleta(a,["assists","totalAssists"]))}<br>🟨 Amarelos: ${escapeHtml(obterStatAtleta(a,["yellowCards","yellow"]))}<br>🟥 Vermelhos: ${escapeHtml(obterStatAtleta(a,["redCards","red"]))}</div></div>${jogos.length?`<div class="detailCard"><h3>🗓️ Jogos / registos disponíveis</h3>${jogos.map(x=>`<div class="event">${escapeHtml(x.name||x.displayName||x.text||"Registo")} ${x.date?`· ${escapeHtml(dataCurta(x.date))}`:""}</div>`).join("")}</div>`:""}`
}

function abrirCompeticaoFutsal(id){
const c=FPF_COMP.find(x=>x.id===id);if(!c)return;
document.getElementById("overlay").classList.add("show");
document.getElementById("overlayTitle").textContent=c.nome;
document.getElementById("overlayBody").innerHTML=`<div class="heroGame"><div class="heroTeam">🥅 ${escapeHtml(c.nome)}</div><div style="text-align:center;color:var(--muted);font-size:12px;margin-top:8px">${escapeHtml(c.tipo)} · ${escapeHtml(c.nivel)}</div></div><div class="detailCard"><h3>🏟️ Clubes</h3>${c.teams.length?c.teams.map(t=>`<div class="event clickTeam" onclick="abrirFutsalClube('${encodeURIComponent(t)}','${encodeURIComponent(c.nome)}')">${escapeHtml(t)} <span style="float:right">›</span></div>`).join(""):'<div style="color:var(--muted);font-size:13px">A lista completa desta competição ainda não está disponível na fonte integrada.</div>'}</div><div class="detailCard"><h3>📊 Dados</h3><div style="color:var(--muted);font-size:13px">A app não inventa classificações, resultados, plantéis ou estatísticas. Quando a fonte oficial disponibilizar os dados em formato acessível, estes serão apresentados aqui.</div></div>`
}

/* Datas da barra visual acompanham o dia atual. */
function atualizarDatasSkin(){
const strip=document.querySelectorAll(".fzDate");if(!strip.length)return;
const now=new Date();const nomes=["DO","SE","TE","QU","QT","SX","SA"];
strip.forEach((b,i)=>{
const d=new Date(now);d.setDate(now.getDate()+i);
const wd=nomes[d.getDay()];
b.querySelector("b").textContent=wd;
b.querySelector("span").textContent=d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})+".";
b.classList.toggle("active",i===0)
})
}

atualizarDatasSkin();
desenharLigas();
carregarJogos();
document.addEventListener("gesturestart",e=>e.preventDefault());
