<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050b16;
 color:#fff;
 font-family:Arial,sans-serif
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#071326;
 border-bottom:1px solid #17243a;
 padding:14px
}

.logo{
 font-size:26px;
 font-weight:900
}

.logo span{
 color:#7ed957
}

main{
 padding:12px 10px 90px;
 max-width:760px;
 margin:auto
}

h2{
 font-size:18px;
 margin:18px 0 10px
}

/* LIGAS */

.seletor{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}

.liga{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:12px;
 padding:11px 5px;
 color:#fff;
 font-weight:bold
}

.liga.active{
 border-color:#7ed957;
 background:#102039
}

.liga i{
 display:block;
 font-style:normal;
 font-size:22px;
 margin-bottom:3px
}

/* CARROSSEL */

.horizontal{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:2px 2px 10px
}

.horizontal::-webkit-scrollbar{
 display:none
}

/* JOGO */

.jogo{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:14px;
 padding:12px;
 flex:0 0 82%;
 max-width:330px;
 cursor:pointer
}

.jogo.live{
 border-color:#ff5c5c
}

.jogo-top{
 display:flex;
 justify-content:space-between;
 color:#9ca9bb;
 font-size:10px;
 margin-bottom:9px
}

.red{
 color:#ff5c5c;
 font-weight:bold
}

.green{
 color:#7ed957;
 font-weight:bold
}

.teams{
 display:grid;
 grid-template-columns:1fr 62px 1fr;
 align-items:center;
 gap:4px
}

.team{
 text-align:center;
 font-size:12px;
 font-weight:bold
}

.escudo{
 width:38px;
 height:38px;
 object-fit:contain;
 display:block;
 margin:0 auto 5px
}

.score{
 text-align:center;
 font-size:22px;
 font-weight:900
}

.time{
 text-align:center;
 color:#7ed957;
 font-size:11px;
 margin-top:4px
}

.livebig{
 flex-basis:100%;
 max-width:none;
 padding:17px
}

.livebig .escudo{
 width:48px;
 height:48px
}

.livebig .score{
 font-size:29px
}

/* CARTÕES */

.vazio,
.loading{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:12px;
 padding:18px;
 text-align:center;
 color:#9ca9bb
}

/* TABELA */

.card{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:13px;
 padding:12px;
 margin:10px 0
}

.tablewrap{
 overflow-x:auto
}

.thead,
.trow{
 display:grid;
 grid-template-columns:
 30px
 minmax(135px,1fr)
 35px
 35px
 35px
 35px
 42px;
 gap:3px;
 align-items:center;
 min-width:410px
}

.thead{
 color:#7f8da1;
 font-size:9px;
 padding:6px 4px
}

.trow{
 border-top:1px solid #17243a;
 padding:8px 4px;
 font-size:11px
}

.trow img{
 width:22px;
 height:22px;
 object-fit:contain;
 vertical-align:middle;
 margin-right:5px
}

.pts{
 color:#7ed957;
 font-weight:900
}

/* MENU */

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#071326;
 border-top:1px solid #17243a;
 display:flex;
 z-index:30
}

.bottom button{
 background:none;
 border:0;
 color:#9ca9bb;
 font-weight:bold;
 width:33%;
 font-size:12px
}

.bottom button.active{
 color:#7ed957
}

.erro{
 color:#ff8f8f;
 text-align:center;
 padding:12px
}
</style>
</head>

<body>

<header>
<div class="logo">
FUT<span>ZONE</span>
</div>
</header>

<main id="app"></main>

<div class="bottom">

<button id="nJogos"
class="active"
onclick="mostrarJogos()">
⚽<br>Jogos
</button>

<button id="nTab"
onclick="mostrarTabelas()">
🏆<br>Tabelas
</button>

<button id="nFav"
onclick="mostrarFavoritos()">
⭐<br>Favoritos
</button>

</div>

<script>

const ligas=[

{
 nome:"Portugal",
 codigo:"por.1",
 icone:"🇵🇹",
 arquivo:"data/primeira-liga.json"
},

{
 nome:"Inglaterra",
 codigo:"eng.1",
 icone:"🏴",
 arquivo:"data/premier-league.json"
},

{
 nome:"Espanha",
 codigo:"esp.1",
 icone:"🇪🇸",
 arquivo:"data/la-liga.json"
},

{
 nome:"Itália",
 codigo:"ita.1",
 icone:"🇮🇹",
 arquivo:"data/serie-a.json"
},

{
 nome:"Alemanha",
 codigo:"ger.1",
 icone:"🇩🇪",
 arquivo:"data/bundesliga.json"
},

{
 nome:"Champions League",
 codigo:"uefa.champions",
 icone:"🏆",
 arquivo:""
},

{
 nome:"Liga Europa",
 codigo:"uefa.europa",
 icone:"🏆",
 arquivo:""
},

{
 nome:"Liga Conferência",
 codigo:"uefa.europa.conf",
 icone:"🏆",
 arquivo:""

}

];

let ligaSelecionada=
localStorage.getItem("fz_liga")||"Portugal";

let jogos=[];

let tabelaAtual=[];

let favoritos=
JSON.parse(
localStorage.getItem("futzone_favoritos")||"[]"
);

const app=
document.getElementById("app");


/* SEGURANÇA */

const esc=x=>
String(x??"")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#039;"
}[m]));


/* MENU */

function nav(id){

[
"nJogos",
"nTab",
"nFav"

].forEach(x=>{

document
.getElementById(x)
.classList
.toggle("active",x===id);

});

}


/* BOTÕES DAS LIGAS */

function botoes(tipo="jogos"){

return `

<div class="seletor">

${ligas.map(l=>`

<button
class="liga ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${l.nome}','${tipo}')">

<i>${l.icone}</i>

${esc(l.nome)}

</button>

`).join("")}

</div>

`;

}


/* SELECIONAR LIGA */

function selecionarLiga(n,tipo="jogos"){

ligaSelecionada=n;

localStorage.setItem(
"fz_liga",
n
);

if(tipo==="tabela")
mostrarTabelas();
else
mostrarJogos();

scrollTo(0,0);

}


/* DATA */

function dataISO(d){

return d
.toISOString()
.slice(0,10)
.replaceAll("-","");

}


/* TIPO DE JOGO */

function tipo(j){

let s=
j?.competitions?.[0]?.status?.type||{};

if(
s.completed ||
s.state==="post"
)
return "final";

if(
s.state==="in" ||
/live|halftime|half time/i
.test(
(s.description||"")+" "+
(s.detail||"")
)
)
return "live";

return "future";

}


/* NORMALIZAR */

function normalizar(j,l){

let c=
j.competitions?.[0]||{};

let cs=
c.competitors||[];

let h=
cs.find(x=>x.homeAway==="home")||
cs[0]||
{};

let a=
cs.find(x=>x.homeAway==="away")||
cs[1]||
{};

return{

id:String(j.id),

codigo:l.codigo,

liga:l.nome,

date:
j.date||
c.date||
"",

estado:
c.status?.type?.shortDetail||
c.status?.type?.detail||
"",

state:
c.status?.type?.state||
"",

completed:
c.status?.type?.completed===true,

home:{

nome:
h.team?.displayName||
"Casa",

logo:
h.team?.logo||
"",

score:
h.score??"-"

},

away:{

nome:
a.team?.displayName||
"Fora",

logo:
a.team?.logo||
"",

score:
a.score??"-"

}

};

}


/* SCOREBOARD ESPN */

async function apiScore(l,range=false){

let url;

if(range){

let agora=
new Date();

let inicio=
new Date(agora);

inicio.setDate(
inicio.getDate()-7
);

let fim=
new Date(agora);

fim.setDate(
fim.getDate()+7
);

url=
`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.codigo}/scoreboard?dates=${dataISO(inicio)}-${dataISO(fim)}&_=${Date.now()}`;

}else{

url=
`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.codigo}/scoreboard?_=${Date.now()}`;

}

let r=
await fetch(url);

if(!r.ok)
throw Error(r.status);

return await r.json();

}


/* CARREGAR UMA LIGA */

async function carregarLiga(l){

try{

let d=
await apiScore(l,true);

return
(d.events||[])
.map(x=>
normalizar(x,l)
);

}catch(e){

/* FALLBACK PARA O JSON DO GITHUB */

if(!l.arquivo)
return [];

try{

let r=
await fetch(
l.arquivo+
"?_="+Date.now()
);

let d=
await r.json();

return
(d.events||[])
.map(x=>
normalizar(x,l)
);

}catch(_){

return [];

}

}

}


/* CARREGAR TODOS */

async function carregarJogos(){

jogos=[];

let todos=
await Promise.all(
ligas.map(carregarLiga)
);

todos.forEach(x=>
jogos.push(...x)
);

}


/* LOGO */

function logo(u){

if(!u)
return "<div style='height:43px'></div>";

return `
<img
class="escudo"
src="${esc(u)}"
onerror="this.style.visibility='hidden'"
>
`;

}


/* CARTÃO */

function cartao(j,extra=""){

let t=
tipo(j);

let marca=
t==="live"
?"🔴 EM DIRETO"
:
t==="future"
?"⏰ PRÓXIMO"
:
"✓ RESULTADO";

let d=
new Date(j.date);

let hora=
!isNaN(d)
?
d.toLocaleTimeString(
"pt-PT",
{
hour:"2-digit",
minute:"2-digit"
}
)
:"";

return `

<div
class="jogo ${t==="live"?"live":""} ${extra}"
onclick="abrir('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">

<span class="${
t==="live"
?"red"
:
t==="future"
?"green"
:""
}">

${marca}

</span>

<span>

${esc(j.liga)}

${esc(j.estado)}

</span>

</div>


<div class="teams">

<div class="team">

${logo(j.home.logo)}

${esc(j.home.nome)}

</div>


<div>

<div class="score">

${esc(j.home.score)}
 -
${esc(j.away.score)}

</div>

${
t==="future"
?
`
<div class="time">
${hora}
</div>
`
:
""
}

</div>


<div class="team">

${logo(j.away.logo)}

${esc(j.away.nome)}

</div>

</div>

</div>

`;

}


/* FAIXA */

function faixa(t,arr){

if(!arr.length)
return "";

return `

<h2>${t}</h2>

<div class="horizontal">

${arr.map(j=>
cartao(j)
).join("")}

</div>

`;

}


/* JOGOS */

async function mostrarJogos(){

nav("nJogos");

app.innerHTML=
`
<div class="loading">
A carregar jogos e dados atuais...
</div>
`;

await carregarJogos();

let sel=
ligas.find(
x=>x.nome===ligaSelecionada
)||
ligas[0];


/* TODOS OS DIRETOS */

let live=
jogos.filter(
x=>tipo(x)==="live"
);


/* JOGOS DA LIGA ESCOLHIDA */

let daLiga=
jogos.filter(
x=>x.liga===sel.nome
);


/* FUTUROS */

let futuros=
daLiga
.filter(x=>tipo(x)==="future")
.sort(
(a,b)=>
Date.parse(a.date)-
Date.parse(b.date)
);


/* RESULTADOS */

let finais=
daLiga
.filter(x=>tipo(x)==="final")
.sort(
(a,b)=>
Date.parse(b.date)-
Date.parse(a.date)
);


app.innerHTML=

`

<h2>🌍 Ligas</h2>

${botoes()}


${faixa(
"🔴 EM DIRETO — TODOS OS PAÍSES",
live
)}


${faixa(
"⏰ PRÓXIMOS JOGOS",
futuros
)}


${faixa(
"✅ RESULTADOS",
finais
)}


${
!daLiga.length
?
`
<div class="vazio">
Não há jogos disponíveis.
</div>
`
:
""
}


<h2>
🏆 ${esc(sel.nome)}
— CLASSIFICAÇÃO
</h2>

<div
id="miniTabela"
class="card">

<div class="loading">
A carregar classificação atual...
</div>

</div>

`;

await carregarTabela(sel);

document
.getElementById("miniTabela")
.innerHTML=
renderTabela(tabelaAtual);

}


/* CLASSIFICAÇÃO */

async function carregarTabela(l){

tabelaAtual=[];

try{

let r=
await fetch(
`https://site.api.espn.com/apis/v2/sports/soccer/${l.codigo}/standings?_=${Date.now()}`
);

if(!r.ok)
throw Error(r.status);

let d=
await r.json();

let entries=[];


/* LIGAS NORMAIS E GRUPOS */

(d.children||[])
.forEach(g=>{

let s=
g.standings||g;

entries.push(
...(s.entries||[])
);

});


if(
!entries.length &&
d.standings
){

entries=
d.standings.entries||[];

}

tabelaAtual=
entries;

}catch(e){

/* FALLBACK */

let mapa={

"Portugal":
"data/classificacao.json",

"Inglaterra":
"data/premier-league-classificacao.json",

"Espanha":
"data/la-liga-classificacao.json",

"Itália":
"data/serie-a-classificacao.json",

"Alemanha":
"data/bundesliga-classificacao.json"

};

if(mapa[l.nome]){

try{

let r=
await fetch(
mapa[l.nome]+
"?_="+Date.now()
);

let d=
await r.json();

let entries=[];

(d.children||[])
.forEach(g=>{

entries.push(
...(
(g.standings||g)
.entries||
[]
);

});

tabelaAtual=
entries;

}catch(_){}

}

}

}


/* STAT */

function stat(
e,
n,
def="0"
){

let x=
(e.stats||[])
.find(
s=>
s.name===n||
s.type===n||
s.abbreviation===n
);

return
x?.displayValue??
x?.value??
def;

}


/* RENDER TABELA */

function renderTabela(es){

if(!es.length)

return `
<div class="vazio">
Classificação indisponível.
</div>
`;


es.sort(
(a,b)=>
Number(
stat(a,"rank",999)
)-
Number(
stat(b,"rank",999)
)
);


return `

<div class="tablewrap">

<div class="thead">

<b>#</b>
<b>Equipa</b>
<b>J</b>
<b>V</b>
<b>E</b>
<b>D</b>
<b>PTS</b>

</div>


${es.map((e,i)=>`

<div class="trow">

<b>
${esc(
stat(e,"rank",i+1)
)}
</b>


<div>

${
e.team?.logos?.[0]?.href
?
`
<img
src="${esc(
e.team.logos[0].href
)}"
>
`
:
""
}

${esc(
e.team?.displayName||
e.team?.name||
"Equipa"
)}

</div>


<span>
${esc(
stat(e,"gamesPlayed")
)}
</span>


<span>
${esc(
stat(e,"wins")
)}
</span>


<span>
${esc(
stat(e,"ties")
)}
</span>


<span>
${esc(
stat(e,"losses")
)}
</span>


<span class="pts">
${esc(
stat(e,"points")
)}
</span>

</div>

`).join("")}

</div>

`;

}


/* PÁGINA TABELAS */

async function mostrarTabelas(){

nav("nTab");

app.innerHTML=

`

<h2>
🏆 CLASSIFICAÇÕES
</h2>

${botoes("tabela")}

<div
id="tabelaBox"
class="card">

<div class="loading">

A carregar
${esc(ligaSelecionada)}
...

</div>

</div>

`;

let l=
ligas.find(
x=>x.nome===ligaSelecionada
)||
ligas[0];

await carregarTabela(l);

document
.getElementById("tabelaBox")
.innerHTML=
renderTabela(tabelaAtual);

}


/* FAVORITOS */

function mostrarFavoritos(){

nav("nFav");

let arr=
jogos.filter(
j=>
favoritos.includes(j.id)
);

app.innerHTML=

`

<h2>
⭐ FAVORITOS
</h2>

${
arr.length
?
`
<div class="horizontal">
${arr.map(j=>
cartao(j)
).join("")}
</div>
`
:
`
<div class="vazio">
Ainda não tens jogos favoritos.
</div>
`
}

`;

}


/* DETALHES */

function abrir(id,codigo){

location.href=
`detalhes.html?id=${
encodeURIComponent(id)
}&liga=${
encodeURIComponent(codigo)
}`;

}


/* ATUALIZAÇÃO AUTOMÁTICA
   DOS DIRETOS */

setInterval(
async()=>{

if(
document
.getElementById("nJogos")
.classList
.contains("active")
){

await mostrarJogos();

}

},
60000
);


/* ARRANQUE */

mostrarJogos();

</script>

</body>
</html>
