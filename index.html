<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0057B8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>FUTZONE</title><style>
:root{--blue:#0057B8;--blue2:#1683FF;--bg:#03060B;--panel:#09111C;--panel2:#0D1724;--border:#1B2A3B;--text:#F5F7FA;--muted:#9DAABB;--red:#FF4054;--green:#20D68A;--yellow:#FFD43B}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(3,6,11,.98);border-bottom:1px solid var(--border);padding:12px 14px 10px}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900}.logo span{color:var(--blue2)}.sub{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px}.mode,.chips,.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.mode{margin-top:10px}.mode::-webkit-scrollbar,.chips::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.mode button,.chip,.filter{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-weight:800;font-size:12px;white-space:nowrap}.mode .active,.chip.active,.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}main{padding:10px 10px 88px;max-width:900px;margin:auto}.chips{padding:2px 0 10px}.filters{padding-bottom:9px}.search{width:100%;border:1px solid var(--border);background:var(--panel);color:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px}.section-title{font-weight:900;font-size:17px;margin:9px 2px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:15px;padding:12px;margin:8px 0}.card[role]{cursor:pointer}.card-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800}.league{color:#fff}.star{background:none;border:0;color:#718095;font-size:21px;padding:0}.star.on{color:var(--yellow)}.teams{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:8px;margin-top:10px}.team{text-align:center;font-weight:850;font-size:14px}.team.clickable{color:#fff;text-decoration:underline;text-decoration-color:#35506b}.score{text-align:center;font-size:21px;font-weight:950}.detail{text-align:center;color:var(--muted);font-size:11px;margin-top:4px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(9,17,28,.99);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:850;padding:5px}.bottom button.active{color:#fff}.bottom b{display:block;font-size:19px;line-height:20px}.overlay{position:fixed;inset:0;background:rgba(3,6,11,.995);z-index:50;display:none;overflow:auto}.overlay.show{display:block}.overlay-head{position:sticky;top:0;background:rgba(3,6,11,.99);border-bottom:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px;z-index:2}.back{border:1px solid var(--border);background:var(--panel);color:#fff;border-radius:10px;padding:8px 11px}.ov-content{max-width:900px;margin:auto;padding:10px}.event-title{text-align:center;font-size:22px;font-weight:950;margin:14px 0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px 7px;border-bottom:1px solid var(--border);font-size:12px;text-align:center}th{color:var(--muted);font-size:10px}td:first-child,th:first-child{text-align:left}.teambtn{border:0;background:none;color:#fff;font-weight:850;padding:0;text-decoration:underline;text-decoration-color:#35506b}.section-tabs{display:flex;gap:7px;overflow:auto;margin:8px 0}.section-tabs button{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:9px;padding:8px 10px;font-weight:800;font-size:11px}.section-tabs button.active{background:var(--blue);color:#fff}.player{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--border);padding:10px;border-radius:11px;margin:6px 0}.muted{color:var(--muted)}.badge{display:inline-block;background:rgba(0,87,184,.18);color:#75b7ff;border:1px solid rgba(0,87,184,.4);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #35506b;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.round{margin:14px 0 6px;font-size:12px;font-weight:900;color:#75b7ff}.note{color:var(--muted);font-size:11px;line-height:1.5;margin:10px 2px}.eventrow{display:grid;grid-template-columns:54px 1fr 35px;gap:7px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}.futsal-tabs{display:flex;gap:7px;overflow:auto;margin:8px 0}.futsal-tabs button{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-weight:800;font-size:11px;white-space:nowrap}.futsal-tabs button.active{background:var(--blue);color:#fff}
</style></head><body>
<header><div class="brand"><div><div class="logo">FUT<span>ZONE</span></div><div class="sub">FUTEBOL EM DIRETO</div></div><span class="badge">2026/27</span></div><div class="mode"><button id="mFut" class="active" onclick="setMode('futebol')">⚽ Futebol</button><button id="mBpi" onclick="setMode('bpi')">♀ Liga BPI</button><button id="mFutSal" onclick="setMode('futsal')">🥅 Futsal</button></div></header>
<main><div id="app"></div></main><nav class="bottom"><button id="nJogos" class="active" onclick="nav('jogos')"><b>⚽</b>Jogos</button><button id="nTab" onclick="nav('tabelas')"><b>▤</b>Tabelas</button><button id="nFav" onclick="nav('favoritos')"><b>★</b>Favoritos</button><button id="nEquip" onclick="nav('equipas')"><b>👕</b>Equipas</button><button id="nFutSal" onclick="setMode('futsal')"><b>🥅</b>Futsal</button></nav>
<div id="overlay" class="overlay"><div class="overlay-head"><button class="back" onclick="closeDetail()">← Voltar</button><strong id="ovTitle">Detalhe</strong></div><div id="ovContent" class="ov-content"></div></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';const STAND='https://site.api.espn.com/apis/v2/sports/soccer/';
const ligas=[['por.1','🇵🇹 Liga Portugal Betclic'],['por.2','🇵🇹 Liga Portugal 2 Meu Super'],['por.3','🇵🇹 Liga 3 Placard'],['eng.1','🏴 Premier League'],['eng.2','🏴 Championship'],['esp.1','🇪🇸 LaLiga'],['esp.2','🇪🇸 LaLiga 2'],['ita.1','🇮🇹 Serie A'],['ita.2','🇮🇹 Serie B'],['ger.1','🇩🇪 Bundesliga'],['ger.2','🇩🇪 2. Bundesliga'],['fra.1','🇫🇷 Ligue 1'],['fra.2','🇫🇷 Ligue 2'],['ned.1','🇳🇱 Eredivisie'],['bel.1','🇧🇪 Belgian Pro League'],['uefa.champions','🏆 Champions League'],['uefa.europa','🏆 Europa League'],['uefa.europa.conf','🏆 Conference League']];
let mode='futebol',page='jogos',liga='por.1',filtro='todos',jogos=[],favoritos=JSON.parse(localStorage.getItem('futzone_jogos_favoritos')||'[]'),equipas=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmtDate=d=>{let x=new Date(d);return isNaN(x)?d||'':x.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'2-digit'})};const fmtTime=d=>{let x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})};const fav=id=>favoritos.includes(String(id));function saveFav(){localStorage.setItem('futzone_jogos_favoritos',JSON.stringify(favoritos))}function toggleFav(id,e){e?.stopPropagation();id=String(id);favoritos=fav(id)?favoritos.filter(x=>x!==id):[...favoritos,id];saveFav();renderCards()}
async function get(url){let r=await fetch(url);if(!r.ok)throw Error(r.status);return r.json()}
function setMode(m){mode=m;page='jogos';document.getElementById('mFut').classList.toggle('active',m==='futebol');document.getElementById('mBpi').classList.toggle('active',m==='bpi');document.getElementById('mFutSal').classList.toggle('active',m==='futsal');render();if(m==='futebol')loadESPN();else if(m==='bpi')loadBPI();else loadFutsal()}
function nav(p){page=p;document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));let id={jogos:'nJogos',tabelas:'nTab',favoritos:'nFav',equipas:'nEquip'}[p];if(id)document.getElementById(id).classList.add('active');render();if(p==='tabelas'){if(mode==='bpi')renderBPITable();else if(mode==='futsal')renderFutsalTable();else loadStandings()}if(p==='equipas')loadEquipas()}
function render(){let a=document.getElementById('app');if(page==='tabelas'){a.innerHTML='<div class="section-title">Classificação</div><div id="tableBox" class="empty"><span class="spinner"></span> A carregar…</div>';return}if(page==='favoritos'){let x=jogos.filter(j=>fav(j.id));a.innerHTML='<div class="section-title">Favoritos</div><div id="cards">'+(x.length?x.map(card).join(''):'<div class="empty">Ainda não tens jogos favoritos.</div>')+'</div>';return}if(page==='equipas'){a.innerHTML='<div class="section-title">Equipas</div><div id="teamsBox" class="empty"><span class="spinner"></span> A carregar equipas…</div>';return}if(mode==='futsal'){a.innerHTML=futsalHead()+ '<div id="cards"></div>';renderCards();return}a.innerHTML='<div class="chips">'+(mode==='futebol'?ligas.map(x=>`<button class="chip ${liga===x[0]?'active':''}" onclick="selectLiga('${x[0]}')">${x[1]}</button>`).join(''):'<span class="chip active">♀ Liga BPI Feminina</span>')+'</div><input id="search" class="search" placeholder="Pesquisar equipa…" oninput="renderCards()"><div class="filters"><button class="filter '+(filtro==='todos'?'active':'')+'" onclick="setFiltro(\'todos\')">Todos</button><button class="filter '+(filtro==='live'?'active':'')+'" onclick="setFiltro(\'live\')">🔴 Live</button><button class="filter '+(filtro==='proximos'?'active':'')+'" onclick="setFiltro(\'proximos\')">Próximos</button><button class="filter '+(filtro==='resultados'?'active':'')+'" onclick="setFiltro(\'resultados\')">Resultados</button></div><div id="cards"></div>';renderCards()}
function selectLiga(x){liga=x;filtro='todos';render();loadESPN()}function setFiltro(x){filtro=x;renderCards()}
function renderCards(){let b=document.getElementById('cards');if(!b)return;let q=(document.getElementById('search')?.value||'').toLowerCase(),a=jogos.filter(j=>(j.home+' '+j.away).toLowerCase().includes(q)),now=Date.now();if(filtro==='live')a=a.filter(j=>j.live);if(filtro==='proximos')a=a.filter(j=>!j.completed&&new Date(j.date).getTime()>=now);if(filtro==='resultados')a=a.filter(j=>j.completed);a.sort((x,y)=>new Date(x.date)-new Date(y.date));b.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Não há jogos para este filtro.</div>'}
function card(j){let s=j.live?'<span style="color:var(--red)">● LIVE</span>':j.completed?'FINAL':(j.timeLabel||fmtTime(j.date)||'Hora a confirmar');let sc=(j.live||j.completed)?`${j.hs} - ${j.as}`:'—';return `<div class="card" role="button" onclick="openMatch('${esc(j.id)}')"><div class="card-head"><span class="league">${esc(j.leagueName||'')}</span><button class="star ${fav(j.id)?'on':''}" onclick="toggleFav('${esc(j.id)}',event)">★</button></div><div class="teams"><button class="team clickable" onclick="openTeam('${esc(j.homeId||'')}','${esc(j.home)}','${esc(j.league||liga)}',event)">${esc(j.home)}</button><div><div class="score">${sc}</div><div class="detail">${s}</div></div><button class="team clickable" onclick="openTeam('${esc(j.awayId||'')}','${esc(j.away)}','${esc(j.league||liga)}',event)">${esc(j.away)}</button></div><div class="detail">${esc(fmtDate(j.date))}</div></div>`}
function openMatch(id){let j=jogos.find(x=>x.id===id);if(!j)return;document.getElementById('ovTitle').textContent=j.home+' × '+j.away;document.getElementById('overlay').classList.add('show');document.getElementById('ovContent').innerHTML='<div class="empty"><span class="spinner"></span> A carregar estatísticas, eventos e onze…</div>';loadMatchDetail(j)}
async function loadMatchDetail(j){try{let d=await get(`${API}${j.league||liga}/summary?event=${encodeURIComponent(j.id)}`);let c=d.header?.competitions?.[0]||d.competitions?.[0],cs=c?.competitors||[],h=cs.find(x=>x.homeAway==='home')||{},a=cs.find(x=>x.homeAway==='away')||{};let hs=h.score??j.hs,as=a.score??j.as;let stats=extractStats(c),events=extractEvents(d),lineups=extractLineups(d);document.getElementById('ovContent').innerHTML=`<div class="event-title">${esc(j.home)}<br><small>vs</small><br>${esc(j.away)}</div><div class="statgrid"><div class="stat"><b>${hs}</b><span>${esc(j.home)}</span></div><div class="stat"><b>${j.live?'LIVE':j.completed?'FINAL':fmtTime(j.date)}</b><span>${fmtDate(j.date)}</span></div><div class="stat"><b>${as}</b><span>${esc(j.away)}</span></div></div><div class="section-tabs"><button class="active">📊 Estatísticas</button></div>${stats}<div class="section-title">⚡ Eventos</div>${events||'<div class="note">Sem eventos disponíveis.</div>'}<div class="section-title">👥 Onze titular / Plantel</div>${lineups||'<div class="note">Onze titular ainda não disponibilizado pelo fornecedor.</div>'}<div class="note">${esc(j.leagueName||'')}</div>`}catch(e){document.getElementById('ovContent').innerHTML='<div class="empty">Não foi possível carregar os detalhes deste jogo agora. O jogo continua clicável e será tentado novamente quando abrires.</div>'}}
function extractStats(c){let s=[];(c?.competitors||[]).forEach(x=>{let team=x.team?.displayName||x.team?.name||'';(x.statistics||[]).forEach(v=>s.push({team,name:v.name||v.label,value:v.displayValue??v.value??''}))});if(!s.length)return '<div class="note">Estatísticas detalhadas ainda não disponíveis.</div>';let names=[...new Set(s.map(x=>x.name))];return '<div class="table-wrap"><table><thead><tr><th>Estatística</th><th>'+esc((c?.competitors||[])[0]?.team?.displayName||'Casa')+'</th><th>'+esc((c?.competitors||[])[1]?.team?.displayName||'Fora')+'</th></tr></thead><tbody>'+names.map(n=>{let v=s.filter(x=>x.name===n);return `<tr><td>${esc(n)}</td><td>${esc(v[0]?.value??'—')}</td><td>${esc(v[1]?.value??'—')}</td></tr>`}).join('')+'</tbody></table></div>'}
function extractEvents(d){let ev=d.plays||d.keyEvents||[];return ev.map(e=>`<div class="eventrow"><b>${esc(e.clock?.displayValue||e.period?.displayValue||'')}</b><span>${esc(e.text||e.type?.text||'Evento')}</span><span>${esc(e.team?.displayName?'⚽':'')}</span></div>`).join('')}
function extractLineups(d){let a=d.rosters||d.lineups||[];if(!a.length)return '';return a.map(t=>`<div class="card"><strong>${esc(t.team?.displayName||t.team?.name||'Equipa')}</strong>${(t.roster||t.athletes||[]).map(p=>`<div class="player"><span>${esc(p.athlete?.displayName||p.athlete?.fullName||p.displayName||'Jogador')}</span><span class="muted">${esc(p.starter?'TITULAR':p.position?.abbreviation||p.position?.name||'')}</span></div>`).join('')}</div>`).join('')}
function closeDetail(){document.getElementById('overlay').classList.remove('show')}
async function openTeam(id,name,leagueCode,e){e?.stopPropagation();document.getElementById('ovTitle').textContent=name;document.getElementById('overlay').classList.add('show');document.getElementById('ovContent').innerHTML='<div class="empty"><span class="spinner"></span> A carregar plantel e estatísticas…</div>';try{let urls=id?[`${API}${leagueCode||liga}/teams/${id}`]:[];if(!id)throw Error('no id');let d=await get(urls[0]);let team=d.team||d;let roster=(d.athletes||d.roster||team.athletes||[]);document.getElementById('ovContent').innerHTML=`<div class="event-title">${esc(team.displayName||name)}</div><div class="statgrid"><div class="stat"><b>${esc(team.abbreviation||'')}</b><span>Sigla</span></div><div class="stat"><b>${esc(team.location||'')}</b><span>Localidade</span></div><div class="stat"><b>${roster.length}</b><span>Jogadores</span></div></div><div class="section-title">👥 Plantel</div>${roster.length?roster.map(p=>`<div class="player" onclick="openPlayer('${esc(p.id||p.athlete?.id||'')}','${esc(p.fullName||p.displayName||p.athlete?.displayName||'')}','${esc(leagueCode||liga)}','${esc(id)}',event)"><span><strong>${esc(p.fullName||p.displayName||p.athlete?.displayName||'Jogador')}</strong><br><span class="muted">${esc(p.position?.displayName||p.position?.name||'')}</span></span><span>›</span></div>`).join(''):'<div class="note">O fornecedor não devolveu o plantel desta equipa nesta competição.</div>'}`}catch(err){document.getElementById('ovContent').innerHTML='<div class="empty">Não foi possível carregar este clube através do fornecedor neste momento.</div>'}}
async function openPlayer(id,name,leagueCode,teamId,e){e?.stopPropagation();document.getElementById('ovTitle').textContent=name;document.getElementById('ovContent').innerHTML='<div class="empty"><span class="spinner"></span> A carregar estatísticas…</div>';try{let d=await get(`${API}${leagueCode||liga}/athletes/${id}`);let a=d.athlete||d;document.getElementById('ovContent').innerHTML=`<div class="event-title">${esc(a.displayName||name)}</div><div class="statgrid"><div class="stat"><b>${esc(a.position?.abbreviation||a.position?.displayName||'')}</b><span>Posição</span></div><div class="stat"><b>${esc(a.jersey||a.jerseyNumber||'')}</b><span>Número</span></div><div class="stat"><b>${esc(a.age||'—')}</b><span>Idade</span></div></div><div class="section-title">📈 Estatísticas</div>${playerStats(a)}`}catch(err){document.getElementById('ovContent').innerHTML='<div class="empty">Estatísticas individuais não disponíveis para este jogador neste momento.</div>'}}
function playerStats(a){let st=a.statistics||a.stats||[];if(!st.length)return '<div class="note">Sem estatísticas individuais disponíveis.</div>';return '<div class="table-wrap"><table><tbody>'+Object.entries(st).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(typeof v==='object'?(v.displayValue??v.value??''):v)}</td></tr>`).join('')+'</tbody></table></div>'}
function monthRanges(){let a=[],d=new Date('2026-07-01T00:00:00Z'),e=new Date('2027-06-30T23:59:59Z');while(d<e){let z=new Date(d);z.setUTCMonth(z.getUTCMonth()+1);z.setUTCDate(z.getUTCDate()-1);a.push([d.toISOString().slice(0,10),z.toISOString().slice(0,10)]);d=new Date(z);d.setUTCDate(d.getUTCDate()+1)}return a}
async function loadESPN(){let b=document.getElementById('cards');if(b)b.innerHTML='<div class="empty"><span class="spinner"></span> A carregar jogos…</div>';try{let packs=await Promise.all(monthRanges().map(r=>get(`${API}${liga}/scoreboard?dates=${r[0].replaceAll('-','')}-${r[1].replaceAll('-','')}`).catch(()=>({events:[]}))));let m=new Map();packs.flatMap(x=>x.events||[]).forEach(e=>{let c=e.competitions?.[0],cs=c?.competitors||[],h=cs.find(x=>x.homeAway==='home'),a=cs.find(x=>x.homeAway==='away');if(!h||!a)return;let st=e.status?.type?.state||'pre';m.set(String(e.id),{id:String(e.id),date:e.date,home:h.team?.displayName||h.team?.name||'',away:a.team?.displayName||a.team?.name||'',homeId:h.team?.id||'',awayId:a.team?.id||'',hs:Number(h.score??0),as:Number(a.score??0),completed:st==='post',live:st==='in',leagueName:(ligas.find(x=>x[0]===liga)||['',''])[1],league:liga});});jogos=[...m.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));renderCards()}catch(e){jogos=[];renderCards()}}
// BPI: calendário e resultados conhecidos, com cálculo da tabela.
const BPI_TEAMS=['Benfica','FC Porto','Sporting','SC Braga','Racing Power FC','Valadares Gaia','Vitória SC','Torreense','Rio Ave','Marítimo'];const BPI_R1=[['Valadares Gaia','FC Porto',1,3],['SC Braga','Marítimo'],['Sporting','Vitória SC'],['Benfica','Racing Power FC'],['Torreense','Rio Ave']];const BPI_R2=[['Rio Ave','Benfica'],['Vitória SC','Torreense'],['Racing Power FC','Valadares Gaia'],['FC Porto','SC Braga'],['Marítimo','Sporting']];
function roundRobin(){let arr=[...BPI_TEAMS],rs=[];for(let r=0;r<9;r++){let p=[];for(let i=0;i<5;i++){let g=[arr[i],arr[9-i]];if(r===0)g=BPI_R1[i].slice(0,2);if(r===1)g=BPI_R2[i].slice(0,2);p.push(g)}rs.push(p);arr=[arr[0],arr[9],...arr.slice(1,9)]}return rs.concat(rs.map(r=>r.map(g=>[g[1],g[0]])))}const BPI_ROUNDS=roundRobin();
function loadBPI(){jogos=[];BPI_ROUNDS.forEach((r,ri)=>r.forEach((g,i)=>jogos.push({id:`bpi-${ri+1}-${i+1}`,date:new Date(2026,8,12+ri*7,18).toISOString(),home:g[0],away:g[1],hs:ri===0&&i===0?1:0,as:ri===0&&i===0?3:0,completed:ri===0&&i===0,live:false,leagueName:'Liga BPI Feminina',league:'bpi'})));renderCards()}
function bpiRows(){let s={};BPI_TEAMS.forEach(t=>s[t]={team:t,j:0,w:0,d:0,l:0,gf:0,ga:0,p:0});jogos.filter(x=>x.completed).forEach(x=>{let h=s[x.home],a=s[x.away];if(!h||!a)return;h.j++;a.j++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;if(x.hs>x.as){h.w++;h.p+=3;a.l++}else if(x.hs<x.as){a.w++;a.p+=3;h.l++}else{h.d++;a.d++;h.p++;a.p++}});return Object.values(s).sort((a,b)=>b.p-a.p||b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function renderBPITable(){let b=document.getElementById('tableBox');if(b)b.innerHTML='<div class="section-title">Liga BPI Feminina 2026/27</div>'+table(bpiRows())+'<div class="note">Resultados confirmados integrados: Valadares Gaia 1-3 FC Porto. Os restantes ficam pendentes até confirmação.</div>'}
function table(r){return '<div class="table-wrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>P</th></tr></thead><tbody>'+r.map((x,i)=>`<tr><td>${i+1}</td><td><button class="teambtn" onclick="openTeamSearch('${esc(x.team)}')">${esc(x.team)}</button></td><td>${x.j}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td><strong>${x.p}</strong></td></tr>`).join('')+'</tbody></table></div>'}
async function loadStandings(){let b=document.getElementById('tableBox');if(!b)return;b.innerHTML='<div class="empty"><span class="spinner"></span> A carregar classificação…</div>';try{let d=await get(`${STAND}${liga}/standings`),rows=[];(d.children||[]).forEach(g=>(g.standings?.entries||[]).forEach(e=>{let s={team:e.team?.displayName||e.team?.name||'',stats:{},teamId:e.team?.id||''};(e.stats||[]).forEach(x=>s.stats[x.name]=x.value??x.displayValue);rows.push(s)}));if(!rows.length||rows.every(x=>Number(x.stats.points||0)===0&&Number(x.stats.gamesPlayed||0)===0)){await calculateStandings(b);return}b.innerHTML=tableESPN(rows,ligas.find(x=>x[0]===liga)?.[1]||liga)}catch(e){await calculateStandings(b)}}
async function calculateStandings(b){if(!jogos.length)await loadESPN();let map={};jogos.filter(x=>x.completed).forEach(x=>{for(let [n,id] of [[x.home,x.homeId],[x.away,x.awayId]])if(!map[id||n])map[id||n]={team:n,teamId:id,j:0,w:0,d:0,l:0,gf:0,ga:0,p:0};let h=map[x.homeId||x.home],a=map[x.awayId||x.away];if(!h||!a)return;h.j++;a.j++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;if(x.hs>x.as){h.w++;h.p+=3;a.l++}else if(x.hs<x.as){a.w++;a.p+=3;h.l++}else{h.d++;a.d++;h.p++;a.p++}});let r=Object.values(map).sort((a,b)=>b.p-a.p||b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);b.innerHTML='<div class="section-title">'+esc(ligas.find(x=>x[0]===liga)?.[1]||liga)+'</div>'+table(r)+'<div class="note">Classificação calculada automaticamente a partir dos resultados que o fornecedor devolveu. Assim, deixa de aparecer tudo a zeros quando a API de standings falha.</div>'}
function tableESPN(r,t){return '<div class="section-title">'+esc(t)+'</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>P</th></tr></thead><tbody>'+r.map((x,i)=>{let s=x.stats;return `<tr><td>${i+1}</td><td><button class="teambtn" onclick="openTeam('${esc(x.teamId)}','${esc(x.team)}','${esc(liga)}',event)">${esc(x.team)}</button></td><td>${s.gamesPlayed??s.games??0}</td><td>${s.wins??0}</td><td>${s.ties??s.draws??0}</td><td>${s.losses??0}</td><td>${s.pointsFor??s.goalsFor??0}</td><td>${s.pointsAgainst??s.goalsAgainst??0}</td><td>${s.pointDifferential??s.goalDifference??0}</td><td><strong>${s.points??0}</strong></td></tr>`}).join('')+'</tbody></table></div>'}
async function loadEquipas(){let b=document.getElementById('teamsBox');if(!b)return;try{let d=await get(`${API}${liga}/teams`),teams=d.sports?.[0]?.leagues?.[0]?.teams||d.teams||[];teams=teams.map(x=>x.team||x).filter(Boolean);equipas=teams;b.innerHTML=teams.length?teams.map(t=>`<div class="player" onclick="openTeam('${esc(t.id||'')}','${esc(t.displayName||t.name||'')}','${esc(liga)}',event)"><strong>${esc(t.displayName||t.name||'')}</strong><span>›</span></div>`).join(''):'<div class="empty">Não foi possível obter as equipas.</div>'}catch(e){b.innerHTML='<div class="empty">Não foi possível carregar as equipas desta liga.</div>'}}
function openTeamSearch(name){let t=equipas.find(x=>(x.displayName||x.name)===name);if(t)return openTeam(t.id,name,liga);openTeam('',name,liga)}

const FZ_FUTSAL=[['11/09','AD Fundão','SC Braga','3','2','final'],['11/09','Torreense','Eléctrico','1','3','final'],['11/09','Sporting','Portimonense','1','0','final'],['12/09','Leões Porto Salvo','Ferreira do Zêzere','','','scheduled'],['12/09','Benfica','UPVN','','','scheduled'],['13/09','Rio Ave','FC Famalicão','','','scheduled'],['16/09','Sporting','AD Fundão','','','scheduled'],['19/09','Portimonense','Benfica','','','scheduled'],['19/09','Eléctrico','Rio Ave','','','scheduled'],['19/09','SC Braga','Torreense','','','scheduled'],['20/09','FC Famalicão','Sporting','','','scheduled'],['20/09','UPVN','Leões Porto Salvo','','','scheduled'],['21/09','Ferreira do Zêzere','AD Fundão','','','scheduled']];
const FZ_FEM=[['12/09','Santa Luzia','Atlético CP'],['12/09','Torreense','Leões Porto Salvo'],['13/09','Maia Futsal','Nun’Álvares'],['13/09','GD Árvore','Novasemente'],['13/09','Futsal Feijó','Benfica']];let futsalTab='masculino';
function futsalHead(){return `<div class="futsal-tabs"><button class="${futsalTab==='masculino'?'active':''}" onclick="futsalTab='masculino';render();loadFutsal()">Liga Placard</button><button class="${futsalTab==='feminino'?'active':''}" onclick="futsalTab='feminino';render();loadFutsal()">Liga Feminina</button></div><div class="filters"><button class="filter active">Jogos e resultados</button></div>`}
function loadFutsal(){jogos=[];if(futsalTab==='masculino'){jogos=FZ_FUTSAL.map((x,i)=>({id:'fz-'+i,date:`2026-09-${x[0].slice(0,2)}T18:00:00`,home:x[1],away:x[2],hs:x[3],as:x[4],completed:x[5]==='final',live:false,leagueName:'Liga Placard Futsal',league:'futsal'}))}else{jogos=FZ_FEM.map((x,i)=>({id:'fzf-'+i,date:`2026-09-${x[0].slice(0,2)}T18:00:00`,home:x[1],away:x[2],hs:'',as:'',completed:false,live:false,leagueName:'Liga Feminina Futsal',league:'futsal'}))}renderCards()}
function renderFutsalTable(){let b=document.getElementById('tableBox');if(!b)return;let teams=[...new Set(jogos.flatMap(x=>[x.home,x.away]))],r=teams.map(t=>({team:t,j:0,w:0,d:0,l:0,gf:0,ga:0,p:0}));jogos.filter(x=>x.completed).forEach(x=>{let h=r.find(t=>t.team===x.home),a=r.find(t=>t.team===x.away);h.j++;a.j++;h.gf+=+x.hs;h.ga+=+x.as;a.gf+=+x.as;a.ga+=+x.hs;if(+x.hs>+x.as){h.w++;h.p+=3;a.l++}else if(+x.hs<+x.as){a.w++;a.p+=3;h.l++}else{h.d++;a.d++;h.p++;a.p++}});r.sort((a,b)=>b.p-a.p||b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga));b.innerHTML='<div class="section-title">Liga Placard Futsal</div>'+table(r)}
boot();function boot(){render();loadESPN()}setInterval(()=>{if(mode==='futebol'&&page==='jogos')loadESPN()},60000)
