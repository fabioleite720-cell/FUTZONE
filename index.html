<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#1683FF;
  --blue-dark:#003B7A;
  --blue-light:#0057B8;
  --bg:#03060B;
  --panel:#09111C;
  --card:#0D1724;
  --border:#1B2A3B;
  --text:#FFF;
  --muted:#9DAABB;
  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:10px 12px;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{color:var(--blue)}

.sub{
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

.modo-desporto{
  position:sticky;
  top:59px;
  z-index:45;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:7px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}

.modo{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:8px;
  padding:9px;
  font-size:11px;
  font-weight:900;
}

.modo.ativo{
  background:var(--blue-dark);
  border-color:var(--blue);
  color:#fff;
}

main{
  max-width:720px;
  margin:auto;
  padding:8px 8px 75px;
}

h2{
  font-size:17px;
  margin:8px 2px;
}

h3{
  font-size:12px;
  margin:0 0 7px;
}

.seletor-ligas{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.liga-btn{
  background:var(--panel);
  color:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 5px;
  font-size:10px;
  font-weight:900;
}

.liga-btn.active{
  background:var(--blue-dark);
  border-color:var(--blue);
}

.liga-icon{
  display:block;
  font-size:18px;
  margin-bottom:3px;
}

.filtros{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin:7px 0;
}

.filtro{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:8px;
  padding:8px 3px;
  font-size:10px;
  font-weight:900;
}

.filtro.ativo{
  color:#fff;
  background:var(--blue-dark);
  border-color:var(--blue);
}

.filtro.live{
  border-color:var(--red);
}

.voltar{
  width:100%;
  background:var(--panel);
  color:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px;
  margin-bottom:7px;
  font-size:10px;
  font-weight:900;
}

/* DIAS */

.dia{
  margin:8px 0;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--panel);
}

.dia-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#101C2A;
  border-bottom:1px solid var(--border);
  padding:8px 9px;
}

.dia-nome{
  font-size:12px;
  font-weight:900;
}

.dia-contagem{
  color:var(--muted);
  font-size:9px;
}

/* COMPETIÇÃO */

.competicao{
  border-bottom:1px solid var(--border);
}

.competicao:last-child{
  border-bottom:0;
}

.competicao-header{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 8px;
  background:#0A1420;
  color:#dbe6f5;
  font-size:10px;
  font-weight:900;
}

.competicao-header .bola{
  color:var(--blue);
}

/* JOGO */

.jogo{
  display:grid;
  grid-template-columns:55px 1fr 35px;
  gap:7px;
  align-items:center;
  min-height:66px;
  padding:7px 8px;
  border-bottom:1px solid #172332;
  background:var(--card);
  cursor:pointer;
}

.jogo:last-child{
  border-bottom:0;
}

.jogo:active{
  background:#122238;
}

.hora{
  text-align:center;
  color:#fff;
  font-size:11px;
  font-weight:900;
}

.hora.live{
  color:var(--red);
}

.hora.final{
  color:var(--muted);
}

.estado-live{
  display:block;
  color:var(--red);
  font-size:8px;
  margin-top:3px;
  font-weight:900;
}

.estado-final{
  display:block;
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

.equipas{
  display:grid;
  gap:5px;
}

.equipa-linha{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.equipa-linha img{
  width:22px;
  height:22px;
  object-fit:contain;
  flex:none;
}

.equipa-nome{
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.placar{
  text-align:right;
  font-size:13px;
  font-weight:900;
}

.estrela{
  color:#596779;
  font-size:17px;
}

.estrela.favorito{
  color:var(--yellow);
}

/* LIVE */

.live-bar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
  margin:7px 0;
  background:#241018;
  border:1px solid #5D1D2A;
  border-radius:9px;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

.live-dot{
  width:8px;
  height:8px;
  background:var(--red);
  border-radius:50%;
  box-shadow:0 0 8px var(--red);
}

/* CARDS */

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px;
  margin:7px 0;
}

.vazio,
.carregando,
.erro{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  padding:14px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
}

.erro{
  color:#ff8b96;
}

/* TABELAS */

.tabela{
  overflow-x:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
}

table{
  width:100%;
  min-width:480px;
  border-collapse:collapse;
  font-size:10px;
}

th,td{
  padding:7px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

th{
  color:var(--muted);
  font-size:9px;
}

td:first-child{
  color:var(--muted);
}

.team-cell{
  text-align:left;
  font-weight:900;
  cursor:pointer;
}

.team-cell div{
  display:flex;
  align-items:center;
  gap:6px;
}

.team-cell img{
  width:22px;
  height:22px;
  object-fit:contain;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  overflow:auto;
}

.overlay-header{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:9px;
}

.detalhe{
  max-width:720px;
  margin:auto;
  padding:8px 9px 35px;
}

.jogo-detalhe{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px 8px;
}

.jogo-detalhe-equipas{
  display:grid;
  grid-template-columns:1fr 75px 1fr;
  align-items:center;
}

.jogo-detalhe .equipa{
  text-align:center;
  font-size:12px;
  font-weight:900;
}

.jogo-detalhe img{
  width:48px;
  height:48px;
  display:block;
  object-fit:contain;
  margin:0 auto 5px;
}

.resultado-grande{
  text-align:center;
  font-size:25px;
  font-weight:900;
}

.estado-grande{
  text-align:center;
  color:var(--blue);
  font-size:9px;
  margin-top:3px;
}

.secao{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  margin-top:8px;
  padding:9px;
}

.evento{
  display:flex;
  gap:7px;
  padding:7px 0;
  border-bottom:1px solid var(--border);
  font-size:10px;
}

.minuto{
  color:var(--blue);
  font-weight:900;
  min-width:30px;
}

/* EQUIPA */

.equipa-header{
  text-align:center;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:11px;
  padding:16px 8px;
}

.equipa-header img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.equipa-titulo{
  font-size:18px;
  font-weight:900;
  margin-top:7px;
}

.jogadores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.jogador{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:7px;
  padding:7px;
  font-size:10px;
}

.jogador b{
  color:var(--blue);
}

/* FUTSAL */

.futsal-menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.futsal-btn{
  background:var(--card);
  color:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
  font-size:10px;
  font-weight:900;
}

.futsal-jogo{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px;
  margin:6px 0;
}

.futsal-jogo-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
}

.futsal-equipas{
  display:grid;
  grid-template-columns:1fr 45px 1fr;
  align-items:center;
  text-align:center;
  gap:5px;
}

.futsal-equipa{
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.futsal-equipa:active{
  color:var(--blue);
}

.futsal-score{
  font-size:15px;
  font-weight:900;
}

/* QUADRA */

.quadra{
  position:relative;
  min-height:470px;
  margin-top:8px;
  padding:10px;
  background:#07502d;
  border:2px solid #fff;
  border-radius:10px;
  overflow:hidden;
}

.quadra:before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:1px;
  background:rgba(255,255,255,.7);
}

.circulo-meio{
  position:absolute;
  top:50%;
  left:50%;
  width:80px;
  height:80px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
}

.area-cima,
.area-baixo{
  position:absolute;
  left:50%;
  width:150px;
  height:75px;
  transform:translateX(-50%);
  border:1px solid rgba(255,255,255,.8);
}

.area-cima{
  top:0;
  border-top:0;
}

.area-baixo{
  bottom:0;
  border-bottom:0;
}

.formacao{
  position:relative;
  z-index:2;
  height:220px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
}

.linha{
  display:flex;
  justify-content:center;
  gap:8px;
  width:100%;
}

.futsal-jogador{
  width:60px;
  min-height:43px;
  background:var(--panel);
  border:1px solid var(--blue);
  border-radius:8px;
  color:#fff;
  text-align:center;
  padding:4px 2px;
}

.futsal-jogador small{
  display:block;
  color:var(--blue);
  font-weight:900;
}

.futsal-jogador span{
  display:block;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:59px;
  z-index:80;
  display:flex;
  background:var(--panel);
  border-top:1px solid var(--border);
}

.bottom button{
  flex:1;
  border:0;
  background:none;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.bottom button.active{
  color:var(--blue);
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="sub">FUTEBOL EM DIRETO</div>
</header>

<div class="modo-desporto">
  <button id="btnFutebol" class="modo ativo" onclick="mudarDesporto('futebol')">
    ⚽ FUTEBOL
  </button>
  <button id="btnFutsal" class="modo" onclick="mudarDesporto('futsal')">
    🥅 FUTSAL
  </button>
</div>

<main id="app"></main>

<div class="bottom">
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
  <button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[
 {name:"Portugal",code:"por.1",icon:"🇵🇹"},
 {name:"Liga Portugal 2",code:"por.2",icon:"🇵🇹"},
 {name:"Liga 3",code:"por.3",icon:"🇵🇹"},
 {name:"Inglaterra",code:"eng.1",icon:"🏴"},
 {name:"Championship",code:"eng.2",icon:"🏴"},
 {name:"Espanha",code:"esp.1",icon:"🇪🇸"},
 {name:"LaLiga 2",code:"esp.2",icon:"🇪🇸"},
 {name:"Itália",code:"ita.1",icon:"🇮🇹"},
 {name:"Serie B",code:"ita.2",icon:"🇮🇹"},
 {name:"Alemanha",code:"ger.1",icon:"🇩🇪"},
 {name:"2. Bundesliga",code:"ger.2",icon:"🇩🇪"},
 {name:"França",code:"fra.1",icon:"🇫🇷"},
 {name:"Ligue 2",code:"fra.2",icon:"🇫🇷"},
 {name:"Países Baixos",code:"ned.1",icon:"🇳🇱"},
 {name:"Bélgica",code:"bel.1",icon:"🇧🇪"},
 {name:"Champions League",code:"uefa.champions",icon:"🏆"},
 {name:"Liga Europa",code:"uefa.europa",icon:"🏆"},
 {name:"Conference League",code:"uefa.europa.conf",icon:"🏆"}
];

let ligaAtual=ligas[0];
let jogos=[];
let filtro="todos";
let desporto="futebol";

/* =========================================================
   UTILITÁRIOS
========================================================= */

const app=document.getElementById("app");

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function data8(d){
 return d.getFullYear()+
 String(d.getMonth()+1).padStart(2,"0")+
 String(d.getDate()).padStart(2,"0");
}

function hora(d){
 try{
  return new Intl.DateTimeFormat("pt-PT",{
   hour:"2-digit",
   minute:"2-digit"
  }).format(new Date(d));
 }catch(e){return "--:--";}
}

function diaTexto(d){
 const x=new Date(d);
 const hoje=new Date();

 const a=new Date(hoje);
 a.setHours(0,0,0,0);

 const b=new Date(a);
 b.setDate(b.getDate()+1);

 const c=new Date(a);
 c.setDate(c.getDate()-1);

 const y=new Date(x);
 y.setHours(0,0,0,0);

 let nome;

 if(y.getTime()===a.getTime()) nome="HOJE";
 else if(y.getTime()===b.getTime()) nome="AMANHÃ";
 else if(y.getTime()===c.getTime()) nome="ONTEM";
 else{
  nome=new Intl.DateTimeFormat("pt-PT",{
   weekday:"long",
   day:"2-digit",
   month:"2-digit"
  }).format(x);
  nome=nome.charAt(0).toUpperCase()+nome.slice(1);
 }

 return nome;
}

function chaveDia(d){
 const x=new Date(d);
 return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}

/* =========================================================
   ESTADO
========================================================= */

function estado(ev){
 const s=ev?.status||ev?.competitions?.[0]?.status||{};
 const t=s.type||{};

 if(t.state==="in")
  return{
   live:true,
   final:false,
   texto:t.shortDetail||t.detail||t.displayClock||"AO VIVO"
  };

 if(t.state==="post")
  return{
   live:false,
   final:true,
   texto:t.shortDetail||t.detail||"FINAL"
  };

 return{
  live:false,
  final:false,
  texto:t.shortDetail||t.detail||""
 };
}

/* =========================================================
   NORMALIZAR
========================================================= */

function normalizar(ev,l){
 const c=ev.competitions?.[0]||{};
 const cs=c.competitors||[];

 const h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
 const a=cs.find(x=>x.homeAway==="away")||cs[1]||{};
 const s=estado(ev);

 return{
  id:String(ev.id),
  date:ev.date||"",
  code:l.code,
  liga:l.name,
  home:{
   id:h.team?.id||"",
   nome:h.team?.displayName||h.team?.shortDisplayName||"Casa",
   logo:h.team?.logo||h.team?.logos?.[0]?.href||"",
   score:h.score??"-"
  },
  away:{
   id:a.team?.id||"",
   nome:a.team?.displayName||a.team?.shortDisplayName||"Fora",
   logo:a.team?.logo||a.team?.logos?.[0]?.href||"",
   score:a.score??"-"
  },
  estado:s
 };
}

/* =========================================================
   BUSCAR JOGOS
========================================================= */

async function buscarLiga(l){

 const hoje=new Date();
 const inicio=new Date(hoje.getFullYear(),hoje.getMonth()-2,1);
 const fim=new Date(hoje.getFullYear(),hoje.getMonth()+10,0);

 let resultado=[];

 let atual=new Date(inicio);

 while(atual<fim){

  const blocoFim=new Date(atual);
  blocoFim.setDate(blocoFim.getDate()+89);

  const fimReal=blocoFim<fim?blocoFim:fim;

  const url=
   `${ESPN}${encodeURIComponent(l.code)}/scoreboard`+
   `?limit=500&dates=${data8(atual)}-${data8(fimReal)}`;

  try{
   const r=await fetch(url);
   if(r.ok){
    const d=await r.json();
    if(Array.isArray(d.events))
     resultado.push(...d.events.map(e=>normalizar(e,l)));
   }
  }catch(e){}

  atual=new Date(fimReal);
  atual.setDate(atual.getDate()+1);
 }

 return resultado;
}

async function carregarJogos(){

 app.innerHTML=`
  <div class="carregando">
   A atualizar jogos e competições...
  </div>
 `;

 let todos=[];

 for(const l of ligas){
  try{
   const arr=await buscarLiga(l);
   todos.push(...arr);
  }catch(e){}
 }

 const mapa=new Map();

 todos.forEach(j=>mapa.set(j.id,j));

 jogos=[...mapa.values()].sort(
  (a,b)=>new Date(a.date)-new Date(b.date)
 );

 mostrarJogos();
}

/* =========================================================
   LIGAS
========================================================= */

function listaLigas(){

 return`
 <div class="seletor-ligas">
 ${ligas.map(l=>`
  <button
   class="liga-btn ${ligaAtual.code===l.code?"active":""}"
   onclick="selecionarLiga('${esc(l.code)}')">
   <span class="liga-icon">${l.icon}</span>
   ${esc(l.name)}
  </button>
 `).join("")}
 </div>
 `;
}

function selecionarLiga(code){
 ligaAtual=ligas.find(x=>x.code===code)||ligas[0];
 filtro="todos";
 mostrarLiga();
}

/* =========================================================
   FILTROS
========================================================= */

function filtros(){

 return`
 <div class="filtros">

  <button
   class="filtro ${filtro==="todos"?"ativo":""}"
   onclick="filtro='todos';mostrarLiga()">
   📅 TODOS
  </button>

  <button
   class="filtro live ${filtro==="live"?"ativo":""}"
   onclick="filtro='live';mostrarLiga()">
   🔴 AO VIVO
  </button>

  <button
   class="filtro ${filtro==="resultados"?"ativo":""}"
   onclick="filtro='resultados';mostrarLiga()">
   ✅ RESULTADOS
  </button>

 </div>
 `;
}

/* =========================================================
   JOGO
========================================================= */

function jogoHTML(j){

 const favorito=
  JSON.parse(localStorage.getItem("futzone_jogos_favoritos")||"[]")
  .includes(j.id);

function mostrarJogosPorDia(){

 const area=document.getElementById("jogos-area");
 if(!area)return;

 let lista=jogos.filter(j=>j.code===ligaAtual.code);

 if(filtro==="live")
  lista=lista.filter(j=>j.estado.live);

 if(filtro==="resultados")
  lista=lista.filter(j=>j.estado.final);

 if(!lista.length){

  area.innerHTML=`
   <div class="vazio">
    Não existem jogos disponíveis nesta competição.
   </div>
  `;

  return;
 }

 const grupos={};

 lista.forEach(j=>{
  const k=chaveDia(j.date);
  if(!grupos[k])grupos[k]=[];
  grupos[k].push(j);
 });

 let html="";

 Object.keys(grupos)
 .sort((a,b)=>new Date(a)-new Date(b))
 .forEach(k=>{

  const arr=grupos[k];

  html+=`
   <div class="dia">

    <div class="dia-header">
     <span class="dia-nome">
      ${esc(diaTexto(arr[0].date))}
     </span>

     <span class="dia-contagem">
      ${arr.length} ${arr.length===1?"jogo":"jogos"}
     </span>
    </div>

    <div class="competicao">

     <div class="competicao-header">
      <span class="bola">${ligaAtual.icon}</span>
      ${esc(ligaAtual.name)}
     </div>

     ${arr.map(jogoHTML).join("")}

    </div>

   </div>
  `;
 });

 area.innerHTML=html;
}

/* =========================================================
   EVENTOS
========================================================= */

function extrairEventos(d){

 const arr=[
  ...(d.plays||[]),
  ...(d.keyEvents||[]),
  ...(d.scoringPlays||[])
 ];

 const vistos=new Set();
 const saida=[];

 arr.forEach(e=>{

  const texto=
   e?.text||
   e?.shortText||
   e?.description||
   e?.type?.text||
   "";

  const k=String(e?.id||"")+texto;

  if(vistos.has(k))return;

  vistos.add(k);

  const baixo=texto.toLowerCase();

  let icone="⚽";

  if(/yellow|amarelo/.test(baixo))
   icone="🟨";

  if(/red|vermelho/.test(baixo))
   icone="🟥";

  if(/substitut/.test(baixo))
   icone="🔄";

  saida.push({
   m:e?.clock?.displayValue||"",
   t:texto,
   i:icone
  });
 });

 return saida;
}

async function carregarTabela(l){

 const area=document.getElementById("tabela-area");

 if(!area)return;

 area.innerHTML=`
  <div class="carregando">
   A carregar ${esc(l.name)}...
  </div>
 `;

 try{

  const r=await fetch(
   `${ESPN2}${encodeURIComponent(l.code)}/standings`
  );

  if(!r.ok)throw new Error();

  const d=await r.json();

  let entries=[];

  function recolher(x){

   if(!x||typeof x!=="object")return;

   if(Array.isArray(x.entries))
    entries.push(...x.entries);

   if(Array.isArray(x.children))
    x.children.forEach(recolher);

   if(x.standings)
    recolher(x.standings);
  }

  recolher(d);

  if(!entries.length)throw new Error();

  const vistos=new Map();

  entries.forEach(x=>{
   const id=x.team?.id||x.id;
   if(!vistos.has(id))
    vistos.set(id,x);
  });

  entries=[...vistos.values()];

  area.innerHTML=`
   <div class="tabela">

    <table>

     <thead>
      <tr>
       <th>#</th>
       <th style="text-align:left">Equipa</th>
       <th>J</th>
       <th>V</th>
       <th>E</th>
       <th>D</th>
       <th>PTS</th>
      </tr>
     </thead>

     <tbody>

      ${
       entries.map((x,i)=>{

        const t=x.team||{};

        const stats=x.stats||[];

        function stat(names){

         for(const s of stats){

          const n=String(
           s.name||
           s.shortName||
           s.displayName||
           ""
          ).toLowerCase();

          if(names.some(z=>n.includes(z)))
           return s.value??s.displayValue??0;
         }

         return 0;
        }

        return`
         <tr>

          <td>${i+1}</td>

          <td
           class="team-cell"
           onclick="abrirEquipa(
            '${esc(l.code)}',
            '${esc(t.id||"")}',
            '${esc(t.displayName||t.name||"Equipa")}',
            '${esc(t.logos?.[0]?.href||t.logo||"")}'
           )">

           <div>

            ${
             t.logos?.[0]?.href
             ?`<img src="${esc(t.logos[0].href)}">`
             :""
            }

            ${esc(t.displayName||t.name||"Equipa")}

           </div>

          </td>

          <td>${stat(["gamesplayed","played","gp"])}</td>
          <td>${stat(["wins","w"])}</td>
          <td>${stat(["ties","draws","d"])}</td>
          <td>${stat(["losses","l"])}</td>
          <td><b>${stat(["points","pts"])}</b></td>

         </tr>
        `;

       }).join("")
      }

     </tbody>

    </table>

   </div>
  `;

 }catch(e){

  area.innerHTML=`
   <div class="erro">
    Não foi possível carregar a classificação.
   </div>
  `;
 }
}
