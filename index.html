<script>
(function(){

const AP='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const cache=new Map();

const timeoutGet=async(u,ms=8000)=>{
 const c=new AbortController();
 const t=setTimeout(()=>c.abort(),ms);
 try{
   const r=await fetch(u,{cache:'no-store',signal:c.signal});
   if(!r.ok)throw Error('HTTP '+r.status);
   return await r.json();
 }finally{
   clearTimeout(t);
 }
};

const clean=window.esc||((v)=>String(v??''));

function oddsVal(v){
 if(v==null)return null;
 if(typeof v==='number')return String(v);
 if(typeof v==='string'){
   const m=v.match(/[+-]?\d+(?:\.\d+)?/);
   return m?m[0]:null;
 }
 if(typeof v==='object')
   return oddsVal(v.odds)||oddsVal(v.close)||oddsVal(v.open);
 return null;
}

function extractOdds(d){
 const roots=[
   d?.odds,
   d?.header?.competitions?.[0]?.odds,
   d?.competitions?.[0]?.odds
 ].filter(Boolean);

 const findSide=(o,side)=>{
   if(!o||typeof o!=='object')return null;
   const direct=o?.[side];
   return oddsVal(direct?.close)||oddsVal(direct?.open)||oddsVal(direct);
 };

 let home=null,draw=null,away=null;

 for(const o of roots){
   home=home||findSide(o,'home');
   draw=draw||findSide(o,'draw');
   away=away||findSide(o,'away');
 }

 if(!home||!draw||!away){
   const z=JSON.stringify(roots);
   const nums=[
     ...z.matchAll(/\"odds\"\s*:\s*\"([+-]?\d+(?:\.\d+)?)\"/g)
   ].map(x=>x[1]);

   home=home||nums[0]||null;
   draw=draw||nums[2]||nums[1]||null;
   away=away||nums[1]||nums[2]||null;
 }

 return {home,draw,away};
}

function time(x){
 const n=Date.parse(x||'');
 return Number.isFinite(n)?n:0;
}

function compOf(e){
 return e?.competitions?.[0]||{};
}

function resultFor(e,id){
 const c=compOf(e);
 const cs=c.competitors||[];

 if(cs.length<2)return null;

 const st=c.status?.type;

 if(!(
   st?.state==='post'||
   st?.completed===true||
   st?.name==='STATUS_FINAL'
 ))return null;

 const me=cs.find(
   x=>String(x.team?.id)===String(id)
 );

 const op=cs.find(
   x=>String(x.team?.id)!==String(id)
 );

 if(!me||!op)return null;

 const a=Number(me.score);
 const b=Number(op.score);

 if(!Number.isFinite(a)||!Number.isFinite(b))
   return null;

 return {
   r:a>b?'V':a<b?'D':'E',
   gf:a,
   ga:b,
   date:e.date,
   homeAway:me.homeAway,
   opponent:op.team?.displayName||'Adversário',
   opponentId:op.team?.id
 };
}

async function getJSON(u){
 if(cache.has(u))
   return cache.get(u);

 const pr=timeoutGet(u).catch(()=>null);
 cache.set(u,pr);

 return pr;
}

async function teamSchedule(league,id,until){

 const direct=[
   AP+
   encodeURIComponent(league)+
   '/teams/'+
   encodeURIComponent(id)+
   '/schedule?limit=100',

   AP+
   encodeURIComponent(league)+
   '/teams/'+
   encodeURIComponent(id)+
   '/schedule?limit=50',

   'https://site.api.espn.com/apis/site/v2/sports/soccer/teams/'+
   encodeURIComponent(id)+
   '/schedule?limit=100'
 ];

 for(const u of direct){

   const d=await getJSON(u);

   const ev=
     d?.events||
     d?.schedule?.events||
     d?.data?.events||
     [];

   if(ev.length)
     return ev
       .filter(e=>time(e.date)<=time(until))
       .sort((a,b)=>time(b.date)-time(a.date));
 }

 return [];
}

const NATIONAL_FORM_LEAGUES=[
 'fifa.friendly',
 'uefa.nations',
 'fifa.worldq.uefa',
 'fifa.world',
 'uefa.euro',
 'uefa.euroq',
 'conmebol.america',
 'conmebol.america_qual',
 'fifa.worldq.conmebol',
 'caf.nations',
 'caf.nations_qual',
 'fifa.worldq.caf'
];

async function getForm(league,id,until){

 if(!id)return[];

 const pool=[];
 const seen=new Set();

 const add=ev=>{
   for(const e of(ev||[])){

     const k=String(
       e.id||
       e.uid||
       e.date+'|'+
       JSON.stringify(
         compOf(e).competitors||[]
       )
     );

     if(seen.has(k))continue;

     seen.add(k);

     if(time(e.date)<=time(until))
       pool.push(e);
   }
 };

 const global=[
   'https://site.api.espn.com/apis/site/v2/sports/soccer/teams/'+
   encodeURIComponent(id)+
   '/schedule?limit=200',

   'https://site.api.espn.com/apis/site/v2/sports/soccer/teams/'+
   encodeURIComponent(id)+
   '/schedule?limit=100'
 ];

 for(const u of global){
   try{
     const d=await getJSON(u);

     add(
       d?.events||
       d?.schedule?.events||
       []
     );

     if(
       pool
       .map(e=>resultFor(e,id))
       .filter(Boolean)
       .length>=5
     )break;

   }catch(_){}
 }

 if(
   pool
   .map(e=>resultFor(e,id))
   .filter(Boolean)
   .length<5
 ){
   try{
     add(
       await teamSchedule(
         league,
         id,
         until
       )
     );
   }catch(_){}
 }

 if(
   pool
   .map(e=>resultFor(e,id))
   .filter(Boolean)
   .length<5 &&
   NATIONAL_FORM_LEAGUES.includes(league)
 ){
   for(const lg of NATIONAL_FORM_LEAGUES){

     if(lg===league)continue;

     try{
       add(
         await teamSchedule(
           lg,
           id,
           until
         )
       );
     }catch(_){}

     if(
       pool
       .map(e=>resultFor(e,id))
       .filter(Boolean)
       .length>=5
     )break;
   }
 }

 if(
   pool
   .map(e=>resultFor(e,id))
   .filter(Boolean)
   .length<5
 ){
   try{
     add(
       await scoreboardChunks(
         league,
         id,
         until,
         730
       )
     );
   }catch(_){}
 }

 return pool
   .map(e=>resultFor(e,id))
   .filter(Boolean)
   .sort((a,b)=>time(b.date)-time(a.date))
   .slice(0,5);
}

async function scoreboardChunks(league,id,until,days){

 const end=new Date(until);
 const out=[];
 const chunk=45;
 const total=Math.min(days,730);
 const jobs=[];

 for(let n=0;n<total;n+=chunk){

   const b=new Date(
     end.getTime()-
     Math.min(n+chunk,total)*86400000
   );

   const e=new Date(
     end.getTime()-
     n*86400000
   );

   const ds=
     b.toISOString().slice(0,10).replaceAll('-','')+
     '-'+
     e.toISOString().slice(0,10).replaceAll('-','');

   jobs.push(
     getJSON(
       AP+
       encodeURIComponent(league)+
       '/scoreboard?dates='+
       ds+
       '&limit=500'
     )
   );
 }

 const rs=await Promise.all(jobs);

 rs.forEach(d=>{
   (d?.events||[]).forEach(e=>{
     if(
       (compOf(e).competitors||[])
       .some(
         c=>String(c.team?.id)===String(id)
       )
     ){
       out.push(e);
     }
   });
 });

 const seen=new Set();

 return out
   .filter(e=>{
     if(seen.has(e.id))return false;
     seen.add(e.id);
     return true;
   })
   .sort(
     (a,b)=>time(b.date)-time(a.date)
   );
}
 const formCache=new Map();

async function getLastFive(league,id,until){
  const key=String(league||'')+'|'+String(id||'')+'|'+String(until||'');
  if(formCache.has(key))return formCache.get(key);

  const p=getForm(league,id,until)
    .then(v=>Array.isArray(v)?v.slice(0,5):[])
    .catch(()=>[]);

  formCache.set(key,p);
  return p;
}

function formBadge(r){
  if(r==='V')return '<span class="pill" style="background:#123c2d;color:#20d68a">V</span>';
  if(r==='E')return '<span class="pill" style="background:#3b3212;color:#ffd43b">E</span>';
  if(r==='D')return '<span class="pill" style="background:#3b1820;color:#ff4054">D</span>';
  return '<span class="pill">-</span>';
}

function formatDate(v){
  const d=new Date(v);
  if(!Number.isFinite(d.getTime()))return '-';
  return d.toLocaleDateString('pt-PT',{
    day:'2-digit',
    month:'2-digit'
  });
}

function renderLastFive(items){
  if(!items||!items.length){
    return `
      <div class="card">
        <div class="sectionTitle">Últimos 5 jogos</div>
        <div class="status">
          Dados dos últimos cinco jogos não disponíveis.
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="sectionTitle">Últimos 5 jogos</div>

      <div style="display:flex;flex-direction:column;gap:5px">
        ${items.map(x=>`
          <div style="
            display:grid;
            grid-template-columns:42px 1fr auto;
            gap:7px;
            align-items:center;
            padding:7px 0;
            border-bottom:1px solid #223047
          ">
            <div>${formBadge(x.r)}</div>

            <div style="min-width:0">
              <div style="
                font-weight:700;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis
              ">
                ${clean(x.homeAway==='home'
                  ? 'Casa'
                  : 'Fora'
                )} · ${clean(x.opponent)}
              </div>

              <div class="status">
                ${formatDate(x.date)}
              </div>
            </div>

            <div style="font-weight:900">
              ${Number.isFinite(Number(x.gf))
                ? `${x.gf}-${x.ga}`
                : '-'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function formSummary(items){
  const a=(items||[]).map(x=>x.r);

  return {
    v:a.filter(x=>x==='V').length,
    e:a.filter(x=>x==='E').length,
    d:a.filter(x=>x==='D').length
  };
}

function formText(items){
  const f=formSummary(items);

  if(!(items||[]).length)
    return 'Sem dados';

  return `${f.v}V · ${f.e}E · ${f.d}D`;
}

function avgGoals(items){
  if(!items||!items.length)
    return null;

  const gf=items.reduce(
    (s,x)=>s+(Number(x.gf)||0),
    0
  );

  const ga=items.reduce(
    (s,x)=>s+(Number(x.ga)||0),
    0
  );

  return {
    gf:gf/items.length,
    ga:ga/items.length
  };
}

function makeSuggestion(home,away,homeForm,awayForm){

  const hf=formSummary(homeForm);
  const af=formSummary(awayForm);

  const hs=(hf.v*3)+hf.e;
  const as=(af.v*3)+af.e;

  let side='';

  if(hs>as)side='Casa';
  else if(as>hs)side='Fora';
  else side='Equilibrado';

  const ha=avgGoals(homeForm);
  const aa=avgGoals(awayForm);

  let goals='Sem indicação';

  if(ha&&aa){
    const total=(ha.gf+ha.ga+aa.gf+aa.ga)/2;

    if(total>=2.5)
      goals='Mais de 2.5';
    else
      goals='Menos de 2.5';
  }

  return {
    side,
    goals,
    home,
    away,
    homeForm,
    awayForm
  };
}

function suggestionHTML(s){

  if(!s)return '';

  const homeName=s.home||'Casa';
  const awayName=s.away||'Fora';

  let main='Análise equilibrada';

  if(s.side==='Casa')
    main=`Possível aposta: ${clean(homeName)}`;

  if(s.side==='Fora')
    main=`Possível aposta: ${clean(awayName)}`;

  return `
    <div class="card">
      <div class="sectionTitle">
        Sugestão de aposta
      </div>

      <div style="
        font-size:15px;
        font-weight:900;
        margin-bottom:8px
      ">
        ${clean(homeName)}
        <span style="color:#9daabb"> vs </span>
        ${clean(awayName)}
      </div>

      <div class="row">
        <span class="pill">${clean(main)}</span>
        <span class="pill">${clean(s.goals)}</span>
      </div>

      <div class="hint" style="margin-top:8px">
        Forma recente:
        ${clean(formText(s.homeForm))}
        — ${clean(homeName)}
        ·
        ${clean(formText(s.awayForm))}
        — ${clean(awayName)}
      </div>
    </div>
  `;
}

async function buildPremiumAnalysis(game){

  if(!game)return null;

  const c=compOf(game);
  const competitors=c.competitors||[];

  if(competitors.length<2)
    return null;

  const homeC=competitors.find(
    x=>x.homeAway==='home'
  )||competitors[0];

  const awayC=competitors.find(
    x=>x.homeAway==='away'
  )||competitors[1];

  const homeId=homeC?.team?.id;
  const awayId=awayC?.team?.id;

  const homeName=
    homeC?.team?.displayName||
    homeC?.team?.name||
    'Casa';

  const awayName=
    awayC?.team?.displayName||
    awayC?.team?.name||
    'Fora';

  const league=
    game?.league?.slug||
    game?.competitions?.[0]?.league?.slug||
    '';

  const until=game.date||new Date().toISOString();

  const [homeForm,awayForm]=await Promise.all([
    getLastFive(league,homeId,until),
    getLastFive(league,awayId,until)
  ]);

  const suggestion=makeSuggestion(
    homeName,
    awayName,
    homeForm,
    awayForm
  );

  return {
    homeName,
    awayName,
    homeForm,
    awayForm,
    suggestion
  };
}

<script>
function americanToProb(v){
  const n=Number(String(v).replace(',','.'));
  if(!Number.isFinite(n)||n===0)return null;
  return n>0?100/(n+100):(-n)/((-n)+100);
}

function rates(a){
  if(!a.length)return null;
  const w=a.filter(x=>x.r==='V').length,
        d=a.filter(x=>x.r==='E').length,
        l=a.filter(x=>x.r==='D').length,
        gf=a.reduce((s,x)=>s+x.gf,0)/a.length,
        ga=a.reduce((s,x)=>s+x.ga,0)/a.length;
  return {
    w,d,l,gf,ga,
    p:[w/a.length,d/a.length,l/a.length]
  };
}

function blend(mp,hf,af,hh){
  let p=[.5,.28,.22],parts=[];
  const hr=rates(hf),ar=rates(af),hhR=rates(hh);

  if(mp){
    p=mp.map(x=>x*.45);
    parts.push('odds');
  }

  if(hr&&ar){
    const fp=[
      (hr.p[0]+1-ar.p[2])/2,
      (hr.p[1]+ar.p[1])/2,
      (hr.p[2]+1-ar.p[0])/2
    ];
    const w=mp?.map(x=>x*.45)||[0,0,0];

    if(mp){
      for(let i=0;i<3;i++)p[i]+=fp[i]*.35;
    }else{
      p=fp.map(x=>x*.75);
    }
    parts.push('forma');
  }

  if(hhR){
    const hp=hhR.p;
    if(mp||hr&&ar){
      for(let i=0;i<3;i++)p[i]+=hp[i]*.20;
    }else{
      p=hp.map(x=>x*.25);
    }
    parts.push('H2H');
  }

  const sum=p.reduce((a,b)=>a+b,0);

  return {
    p:p.map(x=>Math.max(0,Math.min(1,x/sum))),
    parts,
    hr,
    ar,
    hh:hhR
  };
}

async function getDailySuggestionGames(home,away){
  const buttons=[...document.querySelectorAll('[onclick*="openGame"],.gameCard,.game')];
  const candidates=[],seen=new Set();

  const pushCandidate=(id,league,h,a)=>{
    if(!h||!a)return;
    const key=(h+'|'+a).toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    candidates.push({
      id:String(id||''),
      league:league||document.getElementById('league')?.value||'',
      home:h,
      away:a
    });
  };

  const current=buttons.find(btn=>{
    const t=[...btn.querySelectorAll('.gameTeam b')]
      .map(x=>x.textContent.trim());
    return t.length>=2&&t[0]===home&&t[1]===away;
  });

  if(current){
    pushCandidate(
      current.dataset.fzGame||
      current.getAttribute('onclick')?.match(/openGame\('([^']+)/)?.[1]||'',
      current.dataset.fzLeague||'',
      home,
      away
    );
  }

  buttons.forEach(btn=>{
    if(candidates.length>=8)return;

    const teams=[...btn.querySelectorAll('.gameTeam b')]
      .map(x=>x.textContent.trim())
      .filter(Boolean);

    if(teams.length>=2){
      pushCandidate(
        btn.dataset.fzGame||
        btn.getAttribute('onclick')?.match(/openGame\('([^']+)/)?.[1]||'',
        btn.dataset.fzLeague||'',
        teams[0],
        teams[1]
      );
    }
  });

  if(!candidates.length){
    pushCandidate(
      '',
      document.getElementById('league')?.value||'',
      home,
      away
    );
  }

  const quick=async c=>{
    try{
      if(!c.id)return null;

      const d=await getJSON(
        'https://site.api.espn.com/apis/site/v2/sports/soccer/'+
        encodeURIComponent(c.league)+
        '/summary?event='+encodeURIComponent(c.id)
      );

      const comp=d?.header?.competitions?.[0],
            cs=comp?.competitors||[];

      if(cs.length<2)return null;

      const hp=cs[0]?.team?.displayName||c.home,
            ap=cs[1]?.team?.displayName||c.away,
            od=extractOdds(d),
            until=comp?.date||d?.date||new Date().toISOString();

      let hf=[],af=[],hh=[];

      try{
        [hf,af]=await Promise.all([
          getForm(c.league,cs[0]?.team?.id,until),
          getForm(c.league,cs[1]?.team?.id,until)
        ]);
      }catch(_){}

      try{
        hh=await getH2H(
          c.league,
          cs[0]?.team?.id,
          cs[1]?.team?.id,
          until
        );
      }catch(_){}

      let mp=null;

      if(od.home||od.draw||od.away){
        const raw=[
          americanToProb(od.home),
          americanToProb(od.draw),
          americanToProb(od.away)
        ].map(v=>v||0);

        const sum=raw.reduce((a,b)=>a+b,0);

        if(sum>0)mp=raw.map(v=>v/sum);
      }

      const model=blend(mp,hf,af,hh),
            idx=model.p.indexOf(Math.max(...model.p)),
            labels=[
              `Vitória ${hp}`,
              `Empate`,
              `Vitória ${ap}`
            ],
            odds=[od.home,od.draw,od.away];

      if(idx<0||!Number.isFinite(model.p[idx])){
        return {
          m:`${hp} vs ${ap}`,
          d:'Escolha: dados insuficientes',
          odd:null
        };
      }

      const base=
        `Escolha do motor: ${labels[idx]} · `+
        `${Math.round(model.p[idx]*100)}%`;

      return {
        m:`${hp} vs ${ap}`,
        d:`${base}${odds[idx]?` · odd ${odds[idx]}`:''}`,
        odd:odds[idx]||null
      };

    }catch(_){
      return null;
    }
  };

  const rs=await Promise.all(
    candidates.slice(0,8).map(quick)
  );

  const out=[];
  rs.forEach(x=>{
    if(x&&out.length<5)out.push(x);
  });

  return out.slice(0,5);
}

async function setTopSuggestions(items,home,away){
  const root=document.getElementById('fzBetToday');

  const lists=root.querySelectorAll('.fz-bet-list');

  lists[0].innerHTML=make(pool.slice(0,5));

  const sub=root.querySelector('.sub');
  if(sub){

      '5 jogos diferentes · escolha do motor com base nos dados disponíveis';
  }
}

<script>
/* ===== FUTZONE — LIGAÇÕES FINAIS PREMIUM ===== */

(function(){

  function findGameButtons(){
    return [
      ...document.querySelectorAll(
        '.gameCard,.game,.matchCard,[data-fz-game]'
      )
    ];
  }

  function getGameId(btn){
    return (
      btn?.dataset?.fzGame ||
      btn?.getAttribute('data-fz-game') ||
      btn?.getAttribute('onclick')
        ?.match(/openGame\(['"]([^'"]+)/)?.[1] ||
      ''
    );
  }

  function getLeagueId(btn){
    return (
      btn?.dataset?.fzLeague ||
      btn?.getAttribute('data-fz-league') ||
      document.getElementById('league')?.value ||
      ''
    );
  }

  function getTeams(btn){
    const t=[
      ...btn.querySelectorAll('.gameTeam b')
    ]
    .map(x=>x.textContent.trim())
    .filter(Boolean);

    return {
      home:t[0]||'Casa',
      away:t[1]||'Fora'
    };
  }

  /*
   * Quando o utilizador abre um jogo,
   * mantém a função original do FUTZONE
   * e acrescenta a análise Premium depois
   * de o resumo do jogo estar disponível.
   */
  const originalOpenGame=window.openGame;

  if(typeof originalOpenGame==='function'){

    window.openGame=async function(){

      const args=[...arguments];

      const result=
        await originalOpenGame.apply(this,args);

      try{

        /*
         * Pequeno atraso para permitir que
         * o detalhe original termine de montar.
         */
        await new Promise(resolve=>
          setTimeout(resolve,350)
        );

        const game=
          document.getElementById('game');

        if(!game)return result;

        /*
         * Evita criar duas análises para
         * o mesmo jogo.
         */
        const old=
          game.querySelector('.fz-analysis');

        if(old)old.remove();

        /*
         * Procura o evento atualmente aberto.
         */
        const id=
          args[0] ||
          game.dataset?.event ||
          game.dataset?.gameId ||
          '';

        const league=
          game.dataset?.league ||
          document.getElementById('league')?.value ||
          '';

        if(!id||!league)return result;

        const d=
          await getJSON(
            'https://site.api.espn.com/apis/site/v2/sports/soccer/'+
            encodeURIComponent(league)+
            '/summary?event='+encodeURIComponent(id)
          );

        const cs=
          d?.header?.competitions?.[0]?.competitors||[];

        if(cs.length<2)return result;

        /*
         * A análise só entra depois do jogo
         * original estar carregado.
         */
        await runPremiumAnalysis(
          league,
          d,
          cs
        );

      }catch(err){
        console.warn(
          'FUTZONE Premium:',
          err
        );
      }

      return result;
    };
  }

  /*
   * Fallback: se a função original for
   * recriada pelo FUTZONE depois do carregamento,
   * tenta ligar novamente sem alterar o resto.
   */
  let attempts=0;

  const reconnect=setInterval(()=>{

    attempts++;

    if(
      typeof window.openGame==='function' &&
      !window.openGame.__fzPremium
    ){

      const base=window.openGame;

      const wrapped=async function(){

        const args=[...arguments];

        const result=
          await base.apply(this,args);

        try{

          await new Promise(resolve=>
            setTimeout(resolve,350)
          );

          const game=
            document.getElementById('game');

          if(!game)return result;

          const id=
            args[0]||
            game.dataset?.event||
            game.dataset?.gameId||
            '';

          const league=
            game.dataset?.league||
            document.getElementById('league')?.value||
            '';

          if(!id||!league)return result;

          const d=
            await getJSON(
              'https://site.api.espn.com/apis/site/v2/sports/soccer/'+
              encodeURIComponent(league)+
              '/summary?event='+encodeURIComponent(id)
            );

          const cs=
            d?.header?.competitions?.[0]?.competitors||[];

          if(cs.length>=2){
            const old=
              game.querySelector('.fz-analysis');

            if(old)old.remove();

            await runPremiumAnalysis(
              league,
              d,
              cs
            );
          }

        }catch(err){
          console.warn(
            'FUTZONE Premium:',
            err
          );
        }

        return result;
      };

      wrapped.__fzPremium=true;
      window.openGame=wrapped;
    }

    if(attempts>30){
      clearInterval(reconnect);
    }

  },500);

})();

/* ===== FIM DA CORREÇÃO PREMIUM ===== */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function localDate(d=new Date()){
  const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10)
}

async function get(u){
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  return r.json()
}

function posHome(i){
  return [
    [10,50],[18,28],[18,72],[28,15],[28,38],[28,62],
    [28,85],[38,25],[38,50],[38,75],[46,50]
  ][i]
}

function posAway(i){
  return [
    [90,50],[82,28],[82,72],[72,15],[72,38],[72,62],
    [72,85],[62,25],[62,50],[62,75],[54,50]
  ][i]
}

function playerName(p){
  return p?.athlete?.displayName||
         p?.displayName||
         p?.fullName||
         p?.name||
         'Jogador'
}

function athleteObj(p){
  return p?.athlete||p
}

function isStarter(p){
  return p?.starter===true||
         p?.starter==='true'||
         p?.status?.type?.name==='starter'||
         p?.status?.type?.id==='starter'
}

function normalizeRoster(r){
  let out=[];

  if(Array.isArray(r?.roster))
    out.push(...r.roster);

  if(Array.isArray(r?.athletes))
    out.push(...r.athletes);

  for(const g of (r?.athletes||[])){
    if(Array.isArray(g?.items))
      out.push(...g.items);

    if(Array.isArray(g?.athletes))
      out.push(...g.athletes);
  }

  return out.filter((p,i,a)=>
    (p?.athlete?.id||p?.id) &&
    i===a.findIndex(q=>
      (q?.athlete?.id||q?.id)===(p?.athlete?.id||p?.id)
    )
  )
}

function eventText(p){
  return p?.text||
         p?.type?.text||
         p?.type?.description||
         ''
}

function eventIcon(p){

  const t=(
    eventText(p)+' '+
    (p?.type?.name||'')
  ).toLowerCase();

  if(t.includes('goal')||t.includes('golo'))
    return '⚽';

  if(t.includes('yellow')||t.includes('amarelo'))
    return '🟨';

  if(t.includes('red')||t.includes('vermelho'))
    return '🟥';

  if(t.includes('substitut')||t.includes('sub'))
    return '🔄';

  return '•'
}

function eventRows(plays){

  return (plays||[])
    .filter(p=>{

      const t=(
        eventText(p)+' '+
        (p?.type?.name||'')
      ).toLowerCase();

      return /goal|golo|yellow|amarelo|red|vermelho|substitut|substitui|penalty|penálti/.test(t)

    })
    .map(p=>{

      const parts=(p?.participants||[])
        .map(x=>
          x?.athlete?.displayName||
          x?.athlete?.fullName||
          x?.displayName||
          x?.fullName
        )
        .filter(Boolean);

      const txt=
        eventText(p)||
        parts.join(' · ');

      const tm=
        p?.clock?.displayValue||
        p?.time?.displayValue||
        p?.period?.displayValue||
        '';

      return `<div class="event-row">
        <span class="event-icon">
          ${eventIcon(p)}
        </span>
        <b>${esc(tm)}</b>
        <span>${esc(txt)}</span>
      </div>`

    }).join('')
}

function statBlock(d){

  const groups=
    d?.boxscore?.teams||
    d?.stats||
    d?.statistics||
    [];

  const arr=
    Array.isArray(groups)?
    groups:
    Object.values(groups||{});

  if(arr.length<2)return '';

  const a=
    Array.isArray(arr[0]?.statistics)?
    arr[0].statistics:
    (Array.isArray(arr[0]?.stats)?
      arr[0].stats:[]);

  const b=
    Array.isArray(arr[1]?.statistics)?
    arr[1].statistics:
    (Array.isArray(arr[1]?.stats)?
      arr[1].stats:[]);

  if(!a.length&&!b.length)return '';

  const nameA=
    arr[0]?.team?.displayName||
    arr[0]?.team?.name||
    'Casa';

  const nameB=
    arr[1]?.team?.displayName||
    arr[1]?.team?.name||
    'Fora';

  const map=new Map();

  for(const x of a){

    const k=
      x?.label||
      x?.name||
      x?.displayName;

    if(k)
      map.set(k,{
        a:x?.displayValue??x?.value??'-',
        b:'-'
      })
  }

  for(const x of b){

    const k=
      x?.label||
      x?.name||
      x?.displayName;

    if(k){

      const z=
        map.get(k)||
        {a:'-',b:'-'};

      z.b=
        x?.displayValue??
        x?.value??
        '-';

      map.set(k,z)
    }
  }

  const rows=
    [...map.entries()]
      .slice(0,15)
      .map(([k,v])=>
        `<div class="statLine">
          <b>${esc(v.a)}</b>
          <span class="statName">${esc(k)}</span>
          <b>${esc(v.b)}</b>
        </div>`
      )
      .join('');

  return `<div class="statCompare">
    <div class="statTitle">
      <span>${esc(nameA)}</span>
      <span>ESTATÍSTICA DO JOGO</span>
      <span>${esc(nameB)}</span>
    </div>
    ${rows}
  </div>`
}
 <script>
function posForFormation(i,side='home'){
  const home=[
    [12,50],
    [25,18],[25,39],[25,61],[25,82],
    [43,28],[43,50],[43,72],
    [65,22],[72,50],[65,78]
  ];

  return side==='home'
    ? home
    : home.map(([x,y])=>[100-x,100-y]);
}

function formationPlayers(players){

  const arr=[...players];

  const pos=p=>
    String(
      p?.athlete?.position?.displayName||
      p?.position?.displayName||
      p?.position?.name||
      ''
    ).toLowerCase();

  const g=arr.filter(p=>
    /goal|keeper|guarda/.test(pos)
  );

  const d=arr.filter(p=>
    /back|defen|center back|lateral|zagueiro/.test(pos)&&
    !g.includes(p)
  );

  const m=arr.filter(p=>
    /mid|meio|wing|volante/.test(pos)&&
    !g.includes(p)&&
    !d.includes(p)
  );

  const a=arr.filter(p=>
    !g.includes(p)&&
    !d.includes(p)&&
    !m.includes(p)
  );

  const take=(x,n)=>x.splice(0,n);

  let out=[
    ...take(g,1),
    ...take(d,4),
    ...take(m,3),
    ...take(a,3),
    ...arr
  ];

  return out.filter(
    (p,i)=>out.indexOf(p)===i
  ).slice(0,11);
}

function fzPlayAthleteName(x){

  const a=
    x?.athlete||
    x?.player||
    x?.person||
    x;

  return a?.displayName||
         a?.fullName||
         a?.name||
         x?.displayName||
         x?.name||
         ''
}

function fzMinutePlay(p){

  const clock=
    p?.clock?.displayValue||
    p?.clock?.value||
    p?.displayClock||
    p?.clock?.display||
    '';

  const minute=
    clock?
    String(clock).replace(/^0:/,''):
    '';

  const type=String(
    p?.type?.text||
    p?.type?.description||
    p?.type?.name||
    p?.type?.abbreviation||
    p?.type?.type||
    ''
  ).toLowerCase();

  const text=String(
    p?.text||
    p?.shortText||
    p?.description||
    ''
  ).replace(/\s+/g,' ').trim();

  const all=
    (type+' '+text).toLowerCase();

  const participants=
    Array.isArray(p?.participants)?
    p.participants:[];

  const names=
    participants
      .map(fzPlayAthleteName)
      .filter(Boolean);

  let icon='•';

  const isGoal=
    !!p?.scoringPlay||
    /\b(goal|golo|penalty goal|own goal)\b/i.test(all);

  const isYellow=
    /yellow|amarelo|booking|caution/i.test(all);

  const isRed=
    /red card|vermelho|sent off|dismissed/i.test(all);

  const isSub=
    /substitut|substitution|replaced by|enters the match|comes on|comes off/i.test(all);

  if(isGoal)
    icon='⚽';
  else if(isYellow)
    icon='🟨';
  else if(isRed)
    icon='🟥';
  else if(isSub)
    icon='🔄';
  else if(/var|video review/i.test(all))
    icon='📺';

  let clean=text;

  const primary=
    fzPlayAthleteName(
      p?.athlete||
      p?.player||
      {}
    );

  const assistObj=
    p?.assist||
    p?.assistant||
    p?.assistBy||
    p?.assistedBy;

  let assist=
    fzPlayAthleteName(
      assistObj||{}
    );

  if(!assist){

    const m=text.match(
      /(?:assisted by|assist[eê]ncia(?: de)?|assist por)\s+(.+?)(?:\.|$)/i
    );

    if(m)
      assist=m[1].trim();
  }

  if(isGoal){

    if(
      primary &&
      !clean.toLowerCase()
        .includes(primary.toLowerCase())
    ){
      clean=
        primary+
        (clean?' — '+clean:'');
    }

    if(
      !primary &&
      names[0] &&
      !clean.toLowerCase()
        .includes(names[0].toLowerCase())
    ){
      clean=
        names[0]+
        (clean?' — '+clean:'');
    }

    if(
      assist &&
      !clean.toLowerCase()
        .includes(assist.toLowerCase())
    ){
      clean+=
        (clean?' — ':'')+
        'Assistência: '+
        assist;
    }

  }else if(isYellow){

    const who=
      primary||
      names[0]||
      '';

    if(
      who &&
      !clean.toLowerCase()
        .includes(who.toLowerCase())
    ){
      clean=
        who+
        (clean?' — ':'')+
        clean;
    }

  }else if(isRed){

    const who=
      primary||
      names[0]||
      '';

    if(
      who &&
      !clean.toLowerCase()
        .includes(who.toLowerCase())
    ){
      clean=
        who+
        (clean?' — ':'')+
        clean;
    }

  }else if(isSub){

    const inName=
      fzPlayAthleteName(
        p?.playerIn||
        p?.substitute||
        p?.entered||
        {}
      );

    const outName=
      fzPlayAthleteName(
        p?.playerOut||
        p?.replaced||
        p?.exited||
        {}
      );

    if(inName||outName){

      clean=
        (outName?
          'Sai: '+outName:
          '')+
        (inName?
          (outName?' · ':'')+
          'Entra: '+inName:
          '');
    }
  }

  if(!clean && names.length)
    clean=names.join(' · ');

  if(!clean)
    return '';

  return `
    <div class="fz-play">
      <span class="fz-play-min">
        ${esc(minute||'--')}
      </span>

      <span class="fz-play-icon">
        ${icon}
      </span>

      <span class="fz-play-text">
        ${esc(clean)}
      </span>
    </div>
  `;
}

function fzMinuteRows(plays){

  const arr=
    Array.isArray(plays)?
    plays:
    (plays?.items||
     plays?.plays||
     []);

  return arr
    .map(fzMinutePlay)
    .filter(Boolean)
    .join('');
}

 }

async function renderGamePitch(
  league,
  home,
  away,
  d
){

  const box=
    document.getElementById('fzPitch');

  if(!box)return;

  try{

    const homeId=
      home?.team?.id;

    const awayId=
      away?.team?.id;

    const [hr,ar]=
      await Promise.all([
        fetchRosterForTeam(
          league,
          homeId
        ),
        fetchRosterForTeam(
          league,
          awayId
        )
      ]);

    let hp=
      normalizeRoster(hr)
        .filter(isStarter);

    let ap=
      normalizeRoster(ar)
        .filter(isStarter);

    if(hp.length<11)
      hp=normalizeRoster(hr).slice(0,11);

    if(ap.length<11)
      ap=normalizeRoster(ar).slice(0,11);

    hp=formationPlayers(hp);
    ap=formationPlayers(ap);

    const homePositions=
      posForFormation(
        hp.length,
        'home'
      );

    const awayPositions=
      posForFormation(
        ap.length,
        'away'
      );

    const playerHtml=(
      players,
      positions,
      side
    )=>{

      return players.map((p,i)=>{

        const a=athleteObj(p);

        const name=
          playerName(p);

        const num=
          p?.jersey||
          p?.jerseyNumber||
          a?.jersey||
          a?.jerseyNumber||
          '';

        const pos=
          positions[i]||
          (side==='home'
            ? [20+i*3,50]
            : [80-i*3,50]);

        return `
          <button
            class="pitchPlayer ${side}"
            style="
              left:${pos[0]}%;
              top:${pos[1]}%;
            "
            onclick="openPlayer(

<script>
async function loadTables(){
  $('games').classList.remove('hidden');
  $('game').classList.add('hidden');
  $('profile').classList.add('hidden');
  $('teamProfile').classList.add('hidden');

  const league=$('league').value;
  const opt=$('league').selectedOptions[0];

  $('games').innerHTML=
    '<div class="card"><div class="sectionTitle">🏆 Tabelas</div><div class="status">A carregar classificação de '+
    esc(opt?.textContent||league)+'…</div></div>';

  try{
    const d=await get(
      'https://site.api.espn.com/apis/v2/sports/soccer/'+
      encodeURIComponent(league)+'/standings'
    );

    let entries=[];

    if(Array.isArray(d?.children))
      for(const c of d.children)
        entries.push(...(c?.standings?.entries||[]));

    if(!entries.length)
      entries=d?.standings?.entries||[];

    if(!entries.length)
      throw Error(
        'A classificação não está disponível para esta competição.'
      );

    const stat=(e,aliases)=>{
      const a=(e.stats||[]);
      const x=a.find(x=>
        aliases.includes(
          String(
            x.name||
            x.abbreviation||
            x.displayName||
            ''
          ).toLowerCase().replace(/\s/g,'')
        )
      );

      return x?.displayValue??x?.value??'-';
    };

    const rows=entries.map((e,i)=>{
      const t=e.team||{};
      const id=t.id;
      const logo=
        t.logos?.[0]?.href||
        t.logo||
        '';

      return '<tr onclick="openTeam(\''+
        esc(id||'')+
        '\',\''+
        esc(league)+
        '\')">'+

        '<td><b>'+
        esc(stat(e,['rank'])||i+1)+
        '</b></td>'+

        '<td><div class="clubCell">'+
        '<img src="'+esc(logo)+
        '" onerror="this.style.visibility=\'hidden\'">'+
        '<span>'+
        esc(t.displayName||t.name||'Clube')+
        '</span></div></td>'+

        '<td>'+
        esc(stat(e,['gamesplayed','gp','games']))+
        '</td>'+

        '<td>'+
        esc(stat(e,['wins','w']))+
        '</td>'+

        '<td>'+
        esc(stat(e,['ties','draws','d']))+
        '</td>'+

        '<td>'+
        esc(stat(e,['losses','l']))+
        '</td>'+

        '<td><b>'+
        esc(stat(e,['points','pts']))+
        '</b></td>'+

        '</tr>';
    }).join('');

    $('games').innerHTML=
      '<div class="card">'+
      '<div class="fz-pageTitle">'+
      '<div class="sectionTitle">🏆 Tabelas</div>'+
      '<span class="pill">'+
      esc(opt?.textContent||league)+
      '</span></div>'+

      '<div class="tablesBox">'+
      '<table class="tables">'+
      '<thead><tr>'+
      '<th>#</th>'+
      '<th>Clube</th>'+
      '<th>J</th>'+
      '<th>V</th>'+
      '<th>E</th>'+
      '<th>D</th>'+
      '<th>Pts</th>'+
      '</tr></thead>'+

      '<tbody>'+
      rows+
      '</tbody></table></div>'+

      '<div class="hint" style="margin-top:8px">'+
      'Toca numa equipa para abrir o plantel.'+
      '</div></div>';

  }catch(e){

    $('games').innerHTML=
      '<div class="card">'+
      '<div class="sectionTitle">🏆 Tabelas</div>'+
      '<div class="err">Não foi possível carregar a classificação.</div>'+
      '<div class="hint">'+
      esc(e.message)+
      '</div></div>';
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}
</script>

<script>
const FZ_FAV_KEY='futzone_favorite_games_v2';

function getFavs(){
  try{
    return JSON.parse(
      localStorage.getItem(FZ_FAV_KEY)||'[]'
    );
  }catch(e){
    return[];
  }
}

function saveFavs(a){
  localStorage.setItem(
    FZ_FAV_KEY,
    JSON.stringify(a)
  );
}

function isFavoriteGame(id){
  return getFavs().some(
    x=>String(x.id)===String(id)
  );
}

function toggleFavoriteCurrentGame(){

  if(!window.fzCurrentGame)return;

  let a=getFavs();

  const id=
    String(window.fzCurrentGame.id);

  if(a.some(x=>String(x.id)===id)){

    a=a.filter(
      x=>String(x.id)!==id
    );

  }else{

    a.unshift(
      window.fzCurrentGame
    );

    a=a.slice(0,50);
  }

  saveFavs(a);
  updateFavButton();
}

function updateFavButton(){

  const b=
    document.getElementById(
      'favGameBtn'
    );

  if(
    b&&
    window.fzCurrentGame
  ){

    b.textContent=
      isFavoriteGame(
        window.fzCurrentGame.id

      :'⭐ Adicionar aos favoritos';

const FZ_NEWS_FEEDS=[

 'https://news.google.com/rss/search?q=site%3Aabola.pt+desporto&hl=pt-PT&gl=PT&ceid=PT%3Apt-150',

 'https://news.google.com/rss/search?q=site%3Arecord.pt+desporto&hl=pt-PT&gl=PT&ceid=PT%3Apt-150',

 'https://news.google.com/rss/search?q=site%3Aojogo.pt+desporto&hl=pt-PT&gl=PT&ceid=PT%3Apt-150',

 'https://news.google.com/rss/search?q=site%3Artp.pt+desporto&hl=pt-PT&gl=PT&ceid=PT%3Apt-150'

];

async function fetchNewsFeed(feed){

  const proxy=
    'https://api.rss2json.com/v1/api.json?rss_url='+
    encodeURIComponent(feed);

  const r=
    await fetch(proxy,{
      cache:'no-store'
    });

  if(!r.ok)
    throw Error('feed');

  return r.json();
}

function newsSource(link,title){

  const s=(
    String(link)+' '+
    String(title)
  ).toLowerCase();

  if(s.includes('abola.pt'))
    return 'A BOLA';

  if(s.includes('record.pt'))
    return 'RECORD';

  if(s.includes('ojogo.pt'))
    return 'O JOGO';

  if(s.includes('rtp.pt'))
    return 'RTP Desporto';

  return 'Desporto Portugal';
}

async function loadNews(){

  const box=
    document.getElementById('games');

  document.getElementById('game')
    .classList.add('hidden');

  document.getElementById('profile')
    .classList.add('hidden');

  document.getElementById('teamProfile')
    .classList.add('hidden');

  box.classList.remove('hidden');

  box.innerHTML=
    '<div class="card">'+
    '<div class="sectionTitle">📰 Notícias desportivas portuguesas</div>'+
    '<div class="status">A carregar notícias…</div>'+
    '</div>';

  try{

    const results=
      await Promise.allSettled(
        FZ_NEWS_FEEDS.map(
          fetchNewsFeed
        )
      );

    let items=[];

    results.forEach(r=>{

      if(r.status==='fulfilled')

        (r.value.items||[])
          .forEach(x=>
            items.push({
              title:x.title,
              link:x.link,
              date:x.pubDate,
              source:
                newsSource(
                  x.link,
                  x.title
                )
            })
          );
    });

    const seen=new Set();

    items=items
      .filter(x=>{

        const k=
          (x.title||'').trim();

        if(!k||seen.has(k))
          return false;

        seen.add(k);
        return true;

      })
      .sort(
        (a,b)=>
          new Date(b.date||0)-
          new Date(a.date||0)
      )
      .slice(0,30);

    box.innerHTML=`

      <div class="card">

        <div class="sectionTitle">
          📰 Notícias desportivas portuguesas
        </div>

        <div
          class="status"
          style="margin-bottom:7px">

          Últimas notícias de fontes
          desportivas portuguesas.

        </div>

        ${
          items.length
          ?
          items.map(x=>`

            <button
              class="newsCard"
              onclick="window.open(
                '${esc(x.link||'')}',
                '_blank'
              )">

              <div class="newsMeta">

                <span class="newsSource">
                  ${esc(x.source)}
                </span>

                · DESPORTO

              </div>

              <div class="newsTitle">
                ${esc(x.title)}
              </div>

              <div class="newsDate">
                ${
                  esc(
                    x.date
                    ?
                    new Date(
                      x.date
                    ).toLocaleString(
                      'pt-PT',
                      {
                        day:'2-digit',
                        month:'2-digit',
                        hour:'2-digit',
                        minute:'2-digit'
                      }
                    )
                    :
                    ''
                  )
                }
              </div>

            </button>

          `).join('')

          :

          '<div class="empty">Não foi possível carregar as notícias neste momento.</div>'
        }

      </div>
    `;

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }catch(e){

    box.innerHTML=
      '<div class="card err">'+
      '<div class="sectionTitle">📰 Notícias</div>'+
      'Não foi possível carregar as notícias agora. Tenta novamente.'+
      '</div>';
  }
}

(function(){

  function initMore(){

    const more=
      document.getElementById('fzMoreLeague');

    const sel=
      document.getElementById('league');

    if(!more||!sel||more.dataset.ready)
      return;

    more.dataset.ready='1';

    more.addEventListener(
      'change',
      function(){

        if(!this.value)
          return;

        sel.value=this.value;

        if(typeof buildLeagueChips==='function')
          buildLeagueChips();

        if(typeof loadGames==='function')
          loadGames();

        this.value='';
      }
    );
  }

  if(document.readyState==='loading')
    document.addEventListener(
      'DOMContentLoaded',
      initMore
    );
  else
    initMore();

})();
</script>

<script id="fz-premium-hook-final">
(function(){

  const previous=
    window.openGame;

  if(typeof previous!=='function')
    return;

  window.openGame=
    async function(id,l){

      await previous.apply(
        this,
        arguments
      );

      try{

        const current=
          window.fzCurrentGame;

        if(
          !current||
          String(current.id)!==
          String(id)
        )
          return;

        const league=
          l||
          current.league||
          document.getElementById(
            'league'
          )?.value;

        const summary=
          await fetch(
            'https://site.api.espn.com/apis/site/v2/sports/soccer/'+
            encodeURIComponent(league)+
            '/summary?event='+
            encodeURIComponent(id),
            {
              cache:'no-store'
            }
          )
          .then(r=>
            r.ok?r.json():null
          );

        if(!summary)
          return;

        const comp=
          summary.header?.competitions?.[0];

        const cs=
          comp?.competitors||[];

        if(
          cs.length>=2&&
          typeof window.fzPremiumRun==='function'
        ){

          window.fzPremiumRun(
            league,
            summary,
            cs
          );
        }

      }catch(e){

        const g=
          document.getElementById(
            'game'
          );

        if(
          g&&
          !g.querySelector(
            '.fz-analysis'
          )
        ){

          const x=
            document.createElement(
              'div'
            );

          x.className=
            'card fz-analysis';

          x.innerHTML=
            '<div class="sectionTitle">📊 Análise Premium</div>'+
            '<div class="fz-mini">'+
            'A análise estatística não ficou disponível neste momento. '+
            'O jogo continua disponível normalmente.'+
            '</div>';

          g.appendChild(x);
        }
      }
    };

})();
</script>
