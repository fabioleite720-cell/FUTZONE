<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0057b8">

<title>FUTZONE PREMIUM</title>

<style>

:root{
  --blue:#0057b8;
  --blue2:#1683ff;
  --bg:#03060b;
  --card:#0a111b;
  --card2:#0e1723;
  --line:#1c2b3d;
  --text:#f4f7fb;
  --muted:#91a0b3;
  --green:#19c37d;
  --red:#ef5350;
  --yellow:#f5c542;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:70px;
}

header{
  background:linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
  );
  padding:14px 12px;
  box-shadow:0 3px 15px #0008;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.subtitle{
  margin-top:3px;
  font-size:11px;
  font-weight:700;
  opacity:.9;
}

main{
  max-width:1100px;
  margin:auto;
  padding:10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px;
  font-size:16px;
  font-weight:900;
}

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  margin-bottom:8px;
  box-shadow:0 4px 14px #0004;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:8px;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
}

.high{
  background:#70233c;
  color:#fff;
}

.low{
  background:#123f30;
  color:#75e6b7;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.loading{
  text-align:center;
  padding:20px 8px;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

button{
  font:inherit;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:64px;

  display:grid;
  grid-template-columns:
    repeat(5,1fr);

  background:#07101a;
  border-top:1px solid var(--line);
}

nav button{
  border:0;
  background:transparent;
  color:#8fa1b5;
  font-size:10px;
  font-weight:800;
}

nav button.active{
  color:#fff;
}

.suggestion{
  cursor:pointer;
}

.suggestion:active{
  transform:scale(.98);
}

.team-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.team{
  flex:1;
  min-width:0;
  font-weight:800;
}

.score{
  white-space:nowrap;
  font-size:17px;
  font-weight:900;
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:3px 1px 8px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid #28415e;
  background:#0b1521;
  color:#dce8f5;
  font-size:11px;
  font-weight:800;
}

.chip.active{
  background:var(--blue2);
  border-color:var(--blue2);
  color:#fff;
}

.err{
  color:#ff7777;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUTZONE PREMIUM
  </div>

  <div class="subtitle">
    FUTEBOL EM DIRETO
  </div>

</header>


<main>

  <!-- INÍCIO -->

  <section id="home">

    <div class="section-title">
      <span>🔥 Sugestões Média Alta</span>
      <span class="badge high">5</span>
    </div>

    <div id="highSuggestions"
         class="grid">

      <div class="card loading">
        A preparar sugestões...
      </div>

    </div>


    <div class="section-title">
      <span>🟢 Sugestões Média Baixa</span>
      <span class="badge low">5</span>
    </div>

    <div id="lowSuggestions"
         class="grid">

      <div class="card loading">
        A preparar sugestões...
      </div>

    </div>

  </section>


  <!-- JOGOS -->

  <section id="games"
           class="hidden">

    <div class="section-title">
      <span>⚽ Jogos</span>
    </div>

    <div id="leagueChips"
         class="chips">
    </div>

    <div id="gamesList">

      <div class="card loading">
        A carregar jogos...
      </div>

    </div>

  </section>


  <!-- TABELAS -->

  <section id="tables"
           class="hidden">

    <div class="section-title">
      <span>🏆 Tabelas</span>
    </div>

    <div class="card">

      <div class="muted">
        Tabelas serão carregadas nesta área.
      </div>

    </div>

  </section>


  <!-- NOTÍCIAS -->

  <section id="news"
           class="hidden">

    <div class="section-title">
      <span>📰 Notícias</span>
    </div>

    <div id="newsList">

      <div class="card loading">
        A carregar notícias...
      </div>

    </div>

  </section>


  <!-- FAVORITOS -->

  <section id="favorites"
           class="hidden">

    <div class="section-title">
      <span>⭐ Favoritos</span>
    </div>

    <div class="card">

      <div class="muted">
        Ainda não existem favoritos.
      </div>

    </div>

  </section>


  <!-- ANÁLISE -->

  <section id="analysis"
           class="hidden">

    <div id="analysisBox"></div>

  </section>

</main>


<nav>

  <button id="navHome"
          class="active"
          onclick="showPage('home')">
    🏠<br>Início
  </button>

  <button id="navGames"
          onclick="showPage('games')">
    ⚽<br>Jogos
  </button>

  <button id="navTables"
          onclick="showPage('tables')">
    🏆<br>Tabelas
  </button>

  <button id="navNews"
          onclick="showPage('news')">
    📰<br>Notícias
  </button>

  <button id="navFavorites"
          onclick="showPage('favorites')">
    ⭐<br>Favoritos
  </button>

</nav>


<script>

const API =
'https://site.api.espn.com/apis/site/v2/sports/soccer/';

let games=[];
let current=null;


function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function showPage(page){

  const pages=[
    'home',
    'games',
    'tables',
    'news',
    'favorites',
    'analysis'
  ];

  pages.forEach(name=>{

    const el=
      document.getElementById(name);

    if(el)
      el.classList.toggle(
        'hidden',
        name!==page
      );

  });


  document
    .querySelectorAll('nav button')
    .forEach(x=>
      x.classList.remove('active')
    );


  const nav={
    home:'navHome',
    games:'navGames',
    tables:'navTables',
    news:'navNews',
    favorites:'navFavorites'
  };


  if(nav[page]){

    document
      .getElementById(nav[page])
      ?.classList.add('active');

  }

}


const suggestionsHigh=[

  ['Benfica','Sporting'],
  ['FC Porto','Braga'],
  ['Real Madrid','Barcelona'],
  ['Manchester City','Liverpool'],
  ['Bayern München','Borussia Dortmund']

];


const suggestionsLow=[

  ['Arsenal','Chelsea'],
  ['Inter','Milan'],
  ['PSV','Ajax'],
  ['Galatasaray','Fenerbahçe'],
  ['Atlético Madrid','Sevilla']

];


function drawSuggestions(){

  const high=
    document.getElementById(
      'highSuggestions'
    );

  const low=
    document.getElementById(
      'lowSuggestions'
    );


  high.innerHTML=
    suggestionsHigh.map(
      (x,i)=>`

        <div class="card suggestion"
             onclick="showPage('games')">

          <span class="badge high">
            Médio-Alto
          </span>

          <div style="
            margin-top:9px;
            font-weight:900;
          ">
            ${esc(x[0])}
          </div>

          <div class="muted"
               style="margin:4px 0">
            vs
          </div>

          <div style="
            font-weight:900;
          ">
            ${esc(x[1])}
          </div>

        </div>

      `
    ).join('');


  low.innerHTML=
    suggestionsLow.map(
      (x,i)=>`

        <div class="card suggestion"
             onclick="showPage('games')">

          <span class="badge low">
            Médio-Baixo
          </span>

          <div style="
            margin-top:9px;
            font-weight:900;
          ">
            ${esc(x[0])}
          </div>

          <div class="muted"
               style="margin:4px 0">
            vs
          </div>

          <div style="
            font-weight:900;
          ">
            ${esc(x[1])}
          </div>

        </div>

      `
    ).join('');

}


drawSuggestions();

console.log(
  'FUTZONE TESTE — BLOCO 1 OK'
);

</script>

</body>
</html>
