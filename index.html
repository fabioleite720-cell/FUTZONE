<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}

header{
 background:#000;
 border-bottom:1px solid #222;
 padding:18px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 font-size:28px;
 font-weight:900;
 color:#168cff
}

.logo span{color:#fff}

.container{
 padding:15px;
 max-width:900px;
 margin:auto
}

button{
 border:0;
 border-radius:10px;
 padding:10px 14px;

 color:#fff;
 font-weight:bold
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:10px 0
}

 border:1px solid #333
}

.filters button.active{
 background:#168cff;

}

.card{
 background:#101010;
 border:1px solid #252525;
 border-radius:14px;

}

.league{

 font-size:13px;
 font-weight:bold;
 margin-bottom:8px
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:10px
}

.team{

 cursor:pointer
}

.team:last-child{
 text-align:right
}

.team:hover{

}

.team-logo{
 width:35px;
 height:35px;
 object-fit:contain;
 vertical-align:middle;
 margin-right:7px
}

.score{

 font-weight:900;
 white-space:nowrap
}

.status{
 font-size:12px;
 color:#aaa;
 margin-top:8px
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#080808;
 border-top:1px solid #252525;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30
}

.nav button{
 background:none;
 color:#aaa;
 padding:8px
}

.nav button.active{
 color:#168cff
}

.back{
 margin-bottom:15px;
 background:#202020
}

.plantel-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.player{
 background:#151515;
 border:1px solid #292929;
 border-radius:14px;
 padding:12px;
 text-align:center;
 cursor:pointer;
 transition:.2s
}

.player:hover{
 border-color:#168cff;
 transform:translateY(-2px)
}

.player img{
 width:80px;
 height:80px;
 object-fit:cover;
 border-radius:50%;
 background:#222;
 margin-bottom:8px
}

.player-name{
 font-weight:bold;
 font-size:14px
}

.player-info{
 color:#999;
 font-size:12px;
 margin-top:5px
}

.player-profile{
 text-align:center;
 padding:10px
}

.player-profile img{
 width:150px;
 height:150px;
 border-radius:50%;
 object-fit:cover;
 background:#181818;
 border:3px solid #168cff
}

.position{
 color:#168cff;
 font-weight:bold
}

.info-box{
 background:#111;
 border:1px solid #292929;
 border-radius:14px;
 margin-top:20px;
 overflow:hidden
}

.info-row{
 display:flex;
 justify-content:space-between;
 padding:14px;
 border-bottom:1px solid #222;
 gap:15px
}

.info-row:last-child{
 border-bottom:0
}

.info-label{
 color:#888
}

.info-value{
 font-weight:bold
}

.empty{
 text-align:center;
 color:#777;
 padding:30px
}

.table-wrap{
 overflow-x:auto
}

table{
 width:100%;
 border-collapse:collapse;
 background:#101010;
 min-width:520px
}

th,td{
 padding:10px 6px;
 border-bottom:1px solid #252525;
 text-align:center;
 font-size:13px
}

th{
 color:#168cff
}

.team-table{
 text-align:left;
 white-space:nowrap
}

.position-number{
 font-weight:bold
}

.points{
 font-weight:900;
 color:#168cff
}

@media(max-width:500px){

 .plantel-grid{
   grid-template-columns:repeat(2,1fr)
 }

 .player img{
   width:70px;
   height:70px
 }

 .teams{
   gap:5px
 }

 .team{
   font-size:13px
 }

 .score{
   font-size:18px
 }
}
</style>
</head>

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>
</header>

<div class="container" id="app"></div>

<div class="nav">

 <button id="navJogos" onclick="mostrarJogos()">
   ⚽<br>Jogos
 </button>

 <button id="navTabelas" onclick="mostrarTabelas()">
   📊<br>Tabelas
 </button>

 <button id="navFav" onclick="mostrarFavoritos()">
   ⭐<br>Favoritos
 </button>

</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;

const ligas=[
 {nome:"Portugal",arquivo:"data/primeira-liga.json"},
 {nome:"Inglaterra",arquivo:"data/premier-league.json"},
 {nome:"Espanha",arquivo:"data/la-liga.json"},
 {nome:"Itália",arquivo:"data/serie-a.json"},
 {nome:"Alemanha",arquivo:"data/bundesliga.json"}
];

function esc(v){

 return String(v ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function normalizarNome(nome){

 return String(nome || "")
 .toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/&/g,"and")
 .replace(/[^a-z0-9]/g,"");
}


/* =========================
   ALIASES DE EQUIPAS
========================= */

const aliasesEquipas={

 "sportingcp":[
   "sporting",
   "sportingclubedeportugal",
   "sportingcp"
 ],

 "benfica":[
   "slbenfica",
   "benfica",
   "sportlisboaebenfica"
 ],

 "portofc":[
   "fcporto",
   "porto",
   "portofutebolclube"
 ],

 "braga":[
   "scbraga",
   "braga",
   "sportingbraga"
 ],

 "bayernmunich":[
   "bayernmunich",
   "bayernmunchen",
   "fcbayernmunchen",
   "bayern"
 ],

 "inter":[
   "inter",
   "intermilan",
   "internazionale",
   "intermilano"
 ],

 "milan":[
   "acmilan",
   "milan"
 ],

 "roma":[
   "asroma",
   "roma"
 ],

 "psg":[
   "parissaintgermain",
   "psg"
 ],

 "manchesterunited":[
   "manchesterunited",
   "manutd"
 ],

 "manchestercity":[
   "mancity",
   "manchestercity"
 ],

 "tottenham":[
   "tottenham",
   "tottenhamhotspur"
 ]

};


function nomesEquivalentes(a,b){

 const x=normalizarNome(a);
 const y=normalizarNome(b);

 if(!x || !y)
   return false;

 if(x===y)
   return true;

 for(const grupo of Object.values(aliasesEquipas)){

   if(
     grupo.includes(x) &&
     grupo.includes(y)
   )
     return true;
 }

 if(
   x.includes(y) ||
   y.includes(x)
 )
   return true;

 return false;
}


/* =========================
   JOGOS
========================= */

function obterCompeticao(j){
 return j?.competitions?.[0] || {};
}

function obterEquipas(j){

 let c=obterCompeticao(j).competitors;

 if(!Array.isArray(c))
   c=j?.competitors;

 if(!Array.isArray(c))
   c=[];

 let home=
   c.find(x=>x.homeAway==="home") ||
   c[0] ||
   {};

 let away=
   c.find(x=>x.homeAway==="away") ||
   c[1] ||
   {};

 return {home,away};
}

function nomeEquipa(c){

 return (
   c?.team?.displayName ||
   c?.team?.shortDisplayName ||
   c?.team?.name ||
   c?.displayName ||
   c?.name ||
   null
 );
}

function nomeEquipaSeguro(c,j,home){

 const nome=nomeEquipa(c);

 if(nome)
   return nome;

 if(j?.name){

   const partes=j.name.split(" at ");

   if(partes.length===2)
     return home ? partes[1] : partes[0];
 }

 return "Equipa";
}

function idEquipa(c){

 return (
   c?.team?.id ||
   c?.id ||
   null
 );
}

function logoEquipa(c){

 return (
   c?.team?.logo ||
   c?.team?.logos?.[0]?.href ||
   c?.logo ||
   c?.logos?.[0]?.href ||
   ""
 );
}

function numeroResultado(c){

 let valor=c?.score;

 if(valor===undefined || valor===null)
   return null;

 if(typeof valor==="object")
   valor=valor.value ?? valor.displayValue ?? null;

 const n=Number(valor);

 return Number.isFinite(n) ? n : null;
}

function resultado(c){

 let valor=c?.score;

 if(valor===undefined || valor===null)
   return "-";

 if(typeof valor==="object")
   return valor.displayValue ?? valor.value ?? "-";

 return valor;
}

function estadoJogo(j){

 const s=obterCompeticao(j)?.status?.type;

 if(s?.state==="in")
   return "LIVE";

 if(s?.completed || s?.state==="post")
   return "RESULTADO";

 return "PRÓXIMO";
}

function dataJogo(j){

 if(!j?.date)
   return "";

 try{

   return new Date(j.date).toLocaleString(
     "pt-PT",
     {
       day:"2-digit",
       month:"2-digit",
       hour:"2-digit",
       minute:"2-digit"
     }
   );

 }catch(e){

   return j.date;
 }
}


/* =========================
   CARREGAR JOGOS
========================= */

async function carregar(){

 jogos=[];

 for(const liga of ligas){

   try{

     const r=await fetch(
       liga.arquivo+"?v="+Date.now()
     );

     if(!r.ok)
       continue;

     const d=await r.json();

     let lista=[];

     if(Array.isArray(d?.events))
       lista=d.events;

     else if(Array.isArray(d))
       lista=d;

     else if(Array.isArray(d?.games))
       lista=d.games;

     lista.forEach(j=>{

       j.__liga=liga.nome;
       jogos.push(j);

     });

   }catch(e){

     console.log("Erro jogos",e);
   }
 }

 mostrarJogos();
}


/* =========================
   MOSTRAR JOGOS
========================= */

function mostrarJogos(){

 document.getElementById("navJogos").classList.add("active");
 document.getElementById("navTabelas").classList.remove("active");
 document.getElementById("navFav").classList.remove("active");

 document.getElementById("app").innerHTML=`

 <h2>⚽ Jogos</h2>

 <div class="filters">

 ${
   ["Todos","LIVE","Próximos","Resultados"]
   .map(x=>`

     <button
       class="${filtroAtual===x?"active":""}"
       onclick="filtroAtual='${esc(x)}';mostrarJogos()">

       ${esc(x)}

     </button>

   `).join("")
 }

 </div>

 <div class="filters">

 ${
   ["Todos",...ligas.map(x=>x.nome)]
   .map(x=>`

     <button
       class="${ligaAtual===x?"active":""}"
       onclick="ligaAtual='${esc(x)}';mostrarJogos()">

       ${esc(x)}

     </button>

   `).join("")
 }

 </div>

 <div id="lista"></div>
 `;

 const lista=jogos.filter(j=>{

   const ligaOK=
     ligaAtual==="Todos" ||
     j.__liga===ligaAtual;

   const estado=estadoJogo(j);

   const filtroOK=
     filtroAtual==="Todos" ||
     (filtroAtual==="LIVE" && estado==="LIVE") ||
     (filtroAtual==="Próximos" && estado==="PRÓXIMO") ||
     (filtroAtual==="Resultados" && estado==="RESULTADO");

   return ligaOK && filtroOK;
 });

 const div=document.getElementById("lista");

 if(!lista.length){

   div.innerHTML=
     '<div class="empty">Não há jogos disponíveis.</div>';

   return;
 }

 div.innerHTML=
   lista.map(jogoCard).join("");
}


function jogoCard(j){

 const e=obterEquipas(j);

 const hn=nomeEquipaSeguro(e.home,j,true);
 const an=nomeEquipaSeguro(e.away,j,false);

 const hid=idEquipa(e.home);
 const aid=idEquipa(e.away);

 const hl=logoEquipa(e.home);
 const al=logoEquipa(e.away);

 const estado=estadoJogo(j);

 return`

 <div class="card">

   <div class="league">${esc(j.__liga)}</div>

   <div class="teams">

     <div
       class="team"
       onclick="abrirEquipaPorId(
         '${esc(hid || "")}',
         '${esc(hn)}',
         '${esc(j.__liga)}',
         '${esc(hl)}'
       )">

       ${
         hl
         ?
         `<img class="team-logo"
           src="${esc(hl)}"
           onerror="this.style.display='none'">`
         :
         ""
       }

       ${esc(hn)}

     </div>

     <div class="score">
       ${esc(resultado(e.home))}
       -
       ${esc(resultado(e.away))}
     </div>

     <div
       class="team"
       onclick="abrirEquipaPorId(
         '${esc(aid || "")}',
         '${esc(an)}',
         '${esc(j.__liga)}',
         '${esc(al)}'
       )">

       ${
         al
         ?
         `<img class="team-logo"
           src="${esc(al)}"
           onerror="this.style.display='none'">`
         :
         ""
       }

       ${esc(an)}

     </div>

   </div>

   <div class="status">

     ${
       estado==="LIVE"
       ? "🔴 AO VIVO"
       : estado
     }

     ${
       j.date
       ? " • "+esc(dataJogo(j))
       : ""
     }

   </div>

 </div>

 `;
}


/* =========================
   EQUIPA
========================= */

function abrirEquipaPorId(id,name,league,logo){

 equipaAtual={
   id:id,
   name:name,
   league:league,
   logo:logo
 };

 mostrarEquipa();
}

function abrirEquipa(e){

 equipaAtual=e;
 mostrarEquipa();
}


async function mostrarEquipa(){

 document.getElementById("app").innerHTML=`

 <button class="back" id="voltar">
   ← Voltar
 </button>

 <div style="text-align:center">

 ${
   equipaAtual.logo
   ?
   `<img
     src="${esc(equipaAtual.logo)}"
     style="
       width:80px;
       height:80px;
       object-fit:contain"
   >`
   :
   ""
 }

 <h2>${esc(equipaAtual.name)}</h2>

 <div class="league">
   ${esc(equipaAtual.league)}
 </div>

 </div>

 <h3>👥 Plantel</h3>

 <div id="plantel">
   <div class="empty">
     A carregar plantel...
   </div>
 </div>

 <h3>⚽ Jogos</h3>

 <div id="jogos-equipa"></div>
 `;

 document.getElementById("voltar").onclick=mostrarJogos;


 const relacionados=jogos.filter(j=>{

   const e=obterEquipas(j);

   const atual=equipaAtual.name;

   const home=nomeEquipaSeguro(e.home,j,true);
   const away=nomeEquipaSeguro(e.away,j,false);

   return (

     String(idEquipa(e.home))===
     String(equipaAtual.id)

     ||

     String(idEquipa(e.away))===
     String(equipaAtual.id)

     ||

     nomesEquivalentes(home,atual)

     ||

     nomesEquivalentes(away,atual)

   );

 });


 document.getElementById("jogos-equipa")
 .innerHTML=

 relacionados.length
 ?
 relacionados.map(jogoCard).join("")
 :
 '<div class="empty">Sem jogos encontrados.</div>';


 await carregarPlantel();
}


/* =========================
   IDADE
========================= */

function idadeAPartirData(data){

 if(!data)
   return "-";

 const d=new Date(data);

 if(isNaN(d.getTime()))
   return "-";

 const hoje=new Date();

 let idade=
   hoje.getFullYear()-
   d.getFullYear();

 const mes=
   hoje.getMonth()-
   d.getMonth();

 if(
   mes<0 ||
   (
     mes===0 &&
     hoje.getDate()<d.getDate()
   )
 )
   idade--;

 if(idade<0 || idade>100)
   return "-";

 return idade;
}


function obterDataNascimento(p){

 return (
   p.dateBorn ||
   p.dateOfBirth ||
   p.birthDate ||
   (
     typeof p.age==="string" &&
     /^\d{4}-\d{2}-\d{2}/.test(p.age)
       ? p.age
       : ""
   ) ||
   ""
 );
}


function extrairTexto(valor){

 if(!valor)
   return "";

 if(typeof valor==="string")
   return valor;

 if(typeof valor==="number")
   return String(valor);

 if(typeof valor==="object"){

   return (
     valor.displayName ||
     valor.name ||
     valor.description ||
     valor.value ||
     ""
   );
 }

 return "";
}


function criarJogador(p,i){

 const nascimento=obterDataNascimento(p);

 const idadeCalculada=
   idadeAPartirData(nascimento);

 let idadeFinal=
   idadeCalculada!=="-"
   ?
   idadeCalculada
   :
   (
     p.age &&
     !/^\d{4}-\d{2}-\d{2}/.test(String(p.age))
     ?
     p.age
     :
     "-"
   );


 let foto=
   typeof p.photo==="string"
   ? p.photo
   : "";

 if(!foto && typeof p.strThumb==="string")
   foto=p.strThumb;

 if(!foto && typeof p.strCutout==="string")
   foto=p.strCutout;

 if(!foto && typeof p.headshot==="string")
   foto=p.headshot;

 if(!foto && typeof p.image==="string")
   foto=p.image;

 if(!foto && typeof p.headshot==="object")
   foto=p.headshot?.href || "";


 return{

   id:
     p.id ||
     p.idPlayer ||
     p.playerId ||
     i,

   name:
     p.name ||
     p.strPlayer ||
     p.displayName ||
     p.fullName ||
     "Jogador",

   number:
     p.number ||
     p.strNumber ||
     p.jersey ||
     p.jerseyNumber ||
     "-",

   position:
     extrairTexto(
       p.position ||
       p.strPosition ||
       p.positionName
     ) || "-",

   age:idadeFinal,

   nationality:
     extrairTexto(
       p.nationality ||
       p.strNationality ||
       p.country
     ) || "-",

   photo:foto
 };
}


/* =========================
   ENCONTRAR PLANTEL
========================= */

function encontrarPlantel(dados){

 if(!dados)
   return null;

 const atualId=
   String(equipaAtual.id || "");

 const atualNome=
   equipaAtual.name || "";

 const atualLiga=
   equipaAtual.league || "";

 let candidatos=[];


 function recolher(obj){

   if(!obj)
     return;

   if(Array.isArray(obj)){

     obj.forEach(recolher);
     return;
   }

   if(typeof obj!=="object")
     return;


   const temJogadores=
     Array.isArray(obj.players) ||
     Array.isArray(obj.roster) ||
     Array.isArray(obj.squad);


   const nome=
     obj.name ||
     obj.strTeam ||
     obj.teamName ||
     obj.displayName ||
     "";


   if(temJogadores || nome)
     candidatos.push(obj);


   for(const chave of Object.keys(obj)){

     if(
       chave==="players" ||
       chave==="roster" ||
       chave==="squad"
     )
       continue;

     const valor=obj[chave];

     if(
       valor &&
       typeof valor==="object"
     )
       recolher(valor);
   }
 }


 recolher(dados);


 /* ID */

 let encontrado=
   candidatos.find(x=>
     String(
       x.id ||
       x.idTeam ||
       x.teamId ||
       ""
     )===atualId
   );


 if(encontrado){

   return (
     encontrado.players ||
     encontrado.roster ||
     encontrado.squad ||
     []
   );
 }


 /* NOME + ALIASES */

 encontrado=
   candidatos.find(x=>{

     const nomeDB=
       x.name ||
       x.strTeam ||
       x.teamName ||
       x.displayName ||
       "";

     return nomesEquivalentes(
       nomeDB,
       atualNome
     );
   });


 if(encontrado){

   return (
     encontrado.players ||
     encontrado.roster ||
     encontrado.squad ||
     []
   );
 }


 /* MELHOR CORRESPONDÊNCIA */

 let melhor=null;
 let melhorPontuacao=0;


 candidatos.forEach(x=>{

   const nomeDB=
     x.name ||
     x.strTeam ||
     x.teamName ||
     x.displayName ||
     "";

   if(!nomeDB)
     return;

   let pontos=0;

   const a=
     normalizarNome(atualNome);

   const b=
     normalizarNome(nomeDB);

   if(a===b)
     pontos+=100;

   if(nomesEquivalentes(a,b))
     pontos+=80;

   if(
     a.includes(b) ||
     b.includes(a)
   )
     pontos+=40;


   if(
     atualLiga &&
     x.league
   ){

     const la=
       normalizarNome(atualLiga);

     const lb=
       normalizarNome(x.league);

     if(
       la.includes(lb) ||
       lb.includes(la)
     )
       pontos+=20;
   }


   if(pontos>melhorPontuacao){

     melhorPontuacao=pontos;
     melhor=x;
   }

 });


 if(
   melhor &&
   melhorPontuacao>=40
 ){

   return (
     melhor.players ||
     melhor.roster ||
     melhor.squad ||
     []
   );
 }


 return null;
}


/* =========================
   CARREGAR PLANTEL
========================= */

async function carregarPlantel(){

 try{

   const r=await fetch(
     "data/planteis.json?v="+Date.now()
   );

   if(!r.ok)
     throw new Error("Plantel");

   const dados=await r.json();

   let plantel=
     encontrarPlantel(dados);

   if(!plantel){

     document.getElementById("plantel").innerHTML=
       '<div class="empty">Plantel não disponível.</div>';

     return;
   }

   if(!Array.isArray(plantel))
     plantel=Object.values(plantel);


   plantel=
     plantel.filter(p=>
       p &&
       (
         p.name ||
         p.strPlayer ||

async function mostrarTabelas(){

 document.getElementById("navJogos").classList.remove("active");
 document.getElementById("navTabelas").classList.add("active");
 document.getElementById("navFav").classList.remove("active");

 document.getElementById("app").innerHTML=`

 <h2>📊 Tabelas</h2>

 <div id="tabelas">
   <div class="empty">
     A carregar classificações...
   </div>
 </div>

 `;


 let html="";


 for(const liga of ligas){

   let encontrou=false;

   try{

     const ficheiro=
       liga.arquivo.replace(
         ".json",
         "-classificacao.json"
       );

     const r=await fetch(
       ficheiro+"?v="+Date.now()
     );


     if(r.ok){

       const d=await r.json();

       const entries=
         procurarEntries(d);


       if(entries.length){

         html+=criarTabela(
           liga.nome,
           entries
         );

         encontrou=true;
       }
     }

   }catch(e){

     console.log(
       "Erro classificação",
       liga.nome,
       e
     );
   }


   /*
      Se a classificação ESPN não
      estiver disponível, calcula
      pelos resultados existentes.
   */

   if(!encontrou){

     const tabela=
       construirTabelaDosJogos(
         liga.nome
       );

     if(tabela.length){

       html+=criarTabelaCalculada(
         liga.nome,
         tabela
       );
     }
   }

 }


 document.getElementById("tabelas").innerHTML=
   html ||
   '<div class="empty">Tabelas indisponíveis.</div>';
}


/* =========================
   PROCURAR ENTRIES ESPN
========================= */

function procurarEntries(d){

 if(!d)
   return [];


 if(Array.isArray(d))
   return d;


 /* entries diretamente */

 if(Array.isArray(d.entries))
   return d.entries;


 /* standings */

 if(d.standings){

   const x=
     procurarEntries(d.standings);

   if(x.length)
     return x;
 }


 /* leagues */

 if(Array.isArray(d.leagues)){

   for(const league of d.leagues){

     const x=
       procurarEntries(league);

     if(x.length)
       return x;
   }
 }


 /* children */

 if(Array.isArray(d.children)){

   for(const child of d.children){

     const x=
       procurarEntries(child);

     if(x.length)
       return x;
   }
 }


 /* procura recursiva */

 for(const chave of Object.keys(d)){

   const valor=d[chave];

   if(
     valor &&
     typeof valor==="object" &&
     chave!=="team"
   ){

     const x=
       procurarEntries(valor);

     if(x.length)
       return x;
   }
 }

 return [];
}


/* =========================
   STATS
========================= */

function stat(e,n){

 if(Array.isArray(e?.stats)){

   const s=
     e.stats.find(x=>
       x.name===n ||
       x.shortDisplayName===n ||
       x.abbreviation===n
     );

   if(s){

     return (
       s.value ??
       s.displayValue ??
       "-"
     );
   }
 }


 if(e?.stats && typeof e.stats==="object"){

   const s=e.stats[n];

   if(s!==undefined && s!==null){

     if(typeof s==="object"){

       return (
         s.value ??
         s.displayValue ??
         "-"
       );
     }

     return s;
   }
 }


 return e?.[n] ?? "-";
}


function numeroStat(e,...nomes){

 for(const n of nomes){

   const valor=stat(e,n);

   const numero=Number(valor);

   if(Number.isFinite(numero))
     return numero;
 }

 return 0;
}


/* =========================
   TABELA ESPN
========================= */

function criarTabela(nomeLiga,entries){

 const linhas=
   entries.map((e,i)=>{

     const t=
       e.team ||
       e.participant ||
       e;


     const id=
       t.id ||
       e.teamId ||
       "";


     const nome=
       t.displayName ||
       t.name ||
       e.team?.name ||
       "Equipa";


     const logo=
       t.logo ||
       t.logos?.[0]?.href ||
       "";


     return{

       id:id,
       nome:nome,
       logo:logo,

       jogos:
         numeroStat(
           e,
           "gamesPlayed",
           "played",
           "gp"
         ),

       vitorias:
         numeroStat(
           e,
           "wins",
           "win",
           "w"
         ),

       empates:
         numeroStat(
           e,
           "ties",
           "draws",
           "draw",
           "d"
         ),

       derrotas:
         numeroStat(
           e,
           "losses",
           "loss",
           "l"
         ),

       pontos:
         numeroStat(
           e,
           "points",
           "pts"
         )
     };

   });


 return criarHTMLTabela(
   nomeLiga,
   linhas
 );
}


/* =========================
   TABELA CALCULADA
========================= */

function construirTabelaDosJogos(nomeLiga){

 const mapa={};


 const jogosLiga=
   jogos.filter(j=>
     j.__liga===nomeLiga
   );


 jogosLiga.forEach(j=>{

   const e=obterEquipas(j);

   const homeNome=
     nomeEquipaSeguro(
       e.home,
       j,
       true
     );

   const awayNome=
     nomeEquipaSeguro(
       e.away,
       j,
       false
     );


   const homeScore=
     numeroResultado(e.home);

   const awayScore=
     numeroResultado(e.away);


   if(
     homeScore===null ||
     awayScore===null
   )
     return;


   const homeKey=
     normalizarNome(homeNome);

   const awayKey=
     normalizarNome(awayNome);


   if(!mapa[homeKey]){

     mapa[homeKey]={

       id:idEquipa(e.home),

       nome:homeNome,

       logo:logoEquipa(e.home),

       jogos:0,

       vitorias:0,

       empates:0,

       derrotas:0,

       golosMarcados:0,

       golosSofridos:0,

       pontos:0
     };
   }


   if(!mapa[awayKey]){

     mapa[awayKey]={

       id:idEquipa(e.away),

       nome:awayNome,

       logo:logoEquipa(e.away),

       jogos:0,

       vitorias:0,

       empates:0,

       derrotas:0,

       golosMarcados:0,

       golosSofridos:0,

       pontos:0
     };
   }


   const home=mapa[homeKey];
   const away=mapa[awayKey];


   home.jogos++;
   away.jogos++;


   home.golosMarcados+=homeScore;
   home.golosSofridos+=awayScore;


   away.golosMarcados+=awayScore;
   away.golosSofridos+=homeScore;


   if(homeScore>awayScore){

     home.vitorias++;
     home.pontos+=3;

     away.derrotas++;

   }else if(homeScore<awayScore){

     away.vitorias++;
     away.pontos+=3;

     home.derrotas++;

   }else{

     home.empates++;
     away.empates++;

     home.pontos++;
     away.pontos++;
   }

 });


 return Object.values(mapa)
 .sort((a,b)=>{

   if(b.pontos!==a.pontos)
     return b.pontos-a.pontos;


   const gdA=
     a.golosMarcados-a.golosSofridos;

   const gdB=
     b.golosMarcados-b.golosSofridos;


   if(gdB!==gdA)
     return gdB-gdA;


   if(
     b.golosMarcados!==a.golosMarcados
   )
     return b.golosMarcados-a.golosMarcados;


   return a.nome.localeCompare(
     b.nome,
     "pt"
   );
 });
}


function criarTabelaCalculada(nomeLiga,linhas){

 return criarHTMLTabela(
   nomeLiga,
   linhas
 );
}
