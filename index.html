<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;
  --text:#F5F7FA;
  --muted:#9DAABB;
  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:72px;
}

button{
  font-family:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
  padding:13px 14px 10px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--blue2);
}

.subtitle{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-top:2px;
  letter-spacing:.5px;
}

.topnav{
  display:flex;
  gap:7px;
  margin-top:11px;
  overflow-x:auto;
  scrollbar-width:none;
}

.topnav::-webkit-scrollbar{display:none}

.topbtn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:7px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.topbtn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.container{
  max-width:720px;
  margin:auto;
  padding:10px;
}

.section{
  margin-bottom:12px;
}

.sectionTitle{
  font-size:15px;
  font-weight:900;
  margin:12px 2px 8px;
}

.leagues{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{display:none}

.leagueBtn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:#c8d0dc;
  border-radius:6px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
}

.leagueBtn.active{
  background:var(--blue3);
  border-color:var(--blue2);
  color:#fff;
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin:4px 0 12px;
}

.filter{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:6px;
  padding:8px 3px;
  font-size:10px;
  font-weight:900;
}

.filter.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.day{
  margin:12px 0 8px;
}

.dayHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel2);
  border-left:4px solid var(--blue2);
  padding:9px 10px;
  border-radius:5px;
}

.dayName{
  font-size:12px;
  font-weight:900;
}

.dayCount{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.competition{
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  background:#07101a;
}

.compHead{
  padding:7px 9px;
  background:#0c1723;
  color:#cbd5e1;
  font-size:10px;
  font-weight:900;
  border-bottom:1px solid var(--border);
}

.match{
  position:relative;
  display:grid;
  grid-template-columns:54px 1fr 42px 28px;
  gap:6px;
  align-items:center;
  min-height:68px;
  padding:8px 7px;
  border-bottom:1px solid #152333;
}

.match:last-child{
  border-bottom:0;
}

.matchTime{
  text-align:center;
  font-size:12px;
  font-weight:900;
}

.matchTime.live{
  color:var(--red);
}

.status{
  display:block;
  font-size:8px;
  margin-top:3px;
  font-weight:900;
  color:var(--muted);
}

.status.live{
  color:var(--red);
}

.teams{
  min-width:0;
}

.teamRow{
  display:flex;
  align-items:center;
  min-height:23px;
  gap:6px;
  cursor:pointer;
}

.teamLogo{
  width:19px;
  height:19px;
  object-fit:contain;
  flex:0 0 19px;
}

.teamName{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scores{
  text-align:center;
  font-size:13px;
  font-weight:900;
  line-height:24px;
}

.star{
  border:0;
  background:transparent;
  color:#5e6b7b;
  font-size:21px;
  padding:0;
}

.star.on{
  color:var(--yellow);
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  overflow:hidden;
  margin-bottom:8px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 12px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:28px 10px;
  color:var(--muted);
  font-size:12px;
}

.error{
  background:#241017;
  border:1px solid #5a202d;
  color:#ff9daa;
  padding:12px;
  border-radius:7px;
  font-size:11px;
  line-height:1.5;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  overflow-y:auto;
  display:none;
}

.overlay.show{
  display:block;
}

.overlayHead{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  background:#050a10;
  border-bottom:1px solid var(--border);
  padding:12px;
}

.back{
  border:0;
  background:var(--panel2);
  color:white;
  border-radius:6px;
  padding:8px 11px;
  font-weight:900;
}

.overlayTitle{
  font-size:15px;
  font-weight:900;
}

.detail{
  padding:12px;
}

.bigTeams{
  text-align:center;
  padding:15px 5px;
}

.bigLogo{
  width:55px;
  height:55px;
  object-fit:contain;
}

.bigName{
  font-size:17px;
  font-weight:900;
  margin:7px 0;
}

.bigScore{
  font-size:30px;
  font-weight:900;
  margin:8px;
}

.eventBox{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  padding:12px;
  margin-top:9px;
}

.eventTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:9px;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

.table th,
.table td{
  padding:7px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:9px;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 5px;
  border-bottom:1px solid var(--border);
  font-size:11px;
}

.player:last-child{
  border-bottom:0;
}

.player small{
  color:var(--muted);
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  z-index:60;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#070d15;
  border-top:1px solid var(--border);
}

.bottom button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.bottom button.active{
  color:white;
}

.bottomIcon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.futsalTabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:10px;
}

.futsalTab{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:6px;
  padding:9px 2px;
  font-size:10px;
  font-weight:900;
}

.futsalTab.active{
  background:var(--blue);
  color:#fff;
}

.futsalTeam{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  margin-bottom:6px;
  cursor:pointer;
}

.futsalTeam strong{
  font-size:12px;
}

.futsalTeam span{
  color:var(--muted);
  font-size:10px;
}

.court{
  width:100%;
  max-width:330px;
  height:430px;
  margin:15px auto;
  background:#073f2b;
  border:3px solid white;
  border-radius:7px;
  position:relative;
  overflow:hidden;
}

.court:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  border-top:2px solid rgba(255,255,255,.8);
}

.circle{
  position:absolute;
  width:95px;
  height:95px;
  border:2px solid white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.goal{
  position:absolute;
  left:50%;
  width:120px;
  height:45px;
  border:2px solid white;
  transform:translateX(-50%);
}

.goal.top{top:-2px}
.goal.bottom{bottom:-2px}

.position{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--blue);
  border:3px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
}

.p1{left:50%;top:76%;transform:translateX(-50%)}
.p2{left:19%;top:58%}
.p3{right:19%;top:58%}
.p4{left:50%;top:47%;transform:translateX(-50%)}
.p5{left:50%;top:20%;transform:translateX(-50%)}

.notice{
  padding:10px;
  background:#0d1724;
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

@media(max-width:360px){
  .match{
    grid-template-columns:48px 1fr 36px 25px;
  }
  .teamName{font-size:11px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">FUT<span>ZONE</span></div>
  <div class="subtitle">FUTEBOL EM DIRETO</div>

  <div class="topnav">
    <button class="topbtn active" id="topFutebol" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
    <button class="topbtn" id="topFutsal" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
  </div>
</header>

<main class="container">

  <section id="futebolArea">

    <div class="sectionTitle">Competições</div>

    <div class="leagues" id="leagueList"></div>

    <div class="filters">
      <button class="filter active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filter" onclick="setFiltro('live',this)">🔴 Live</button>
      <button class="filter" onclick="setFiltro('proximos',this)">Próximos</button>
      <button class="filter" onclick="setFiltro('resultados',this)">Resultados</button>
    </div>

    <div id="footballContent">
      <div class="loading">A carregar jogos...</div>
    </div>

  </section>

  <section id="futsalArea" style="display:none">

    <div class="sectionTitle">Futsal</div>

    <div class="futsalTabs">
      <button class="futsalTab active" onclick="futsalPagina('jogos',this)">Jogos</button>
      <button class="futsalTab" onclick="futsalPagina('tabela',this)">Tabela</button>
      <button class="futsalTab" onclick="futsalPagina('equipas',this)">Equipas</button>
      <button class="futsalTab" onclick="futsalPagina('competicoes',this)">Competições</button>
    </div>

    <div id="futsalContent"></div>

  </section>

</main>

<div class="bottom">
  <button class="active" id="navJogos" onclick="irNav('jogos')">
    <span class="bottomIcon">⚽</span>Jogos
  </button>
  <button id="navTabelas" onclick="irNav('tabelas')">
    <span class="bottomIcon">📊</span>Tabelas
  </button>
  <button id="navFav" onclick="irNav('favoritos')">
    <span class="bottomIcon">★</span>Favoritos
  </button>
  <button onclick="irNav('futsal')">
    <span class="bottomIcon">🥅</span>Futsal
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="overlayHead">
    <button class="back" onclick="fecharOverlay()">← Voltar</button>
    <div class="overlayTitle" id="overlayTitle">FUTZONE</div>
  </div>
  <div class="detail" id="overlayContent"></div>
</div>

<script>
/* =========================================================
   FUTZONE - versão estável de ficheiro único
   ========================================================= */

const API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ligas = [
  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],
  ["esp.1","🇪🇸 LaLiga"],
  ["esp.2","🇪🇸 LaLiga 2"],
  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],
  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],
  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],
  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],
  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Liga Europa"],
  ["uefa.europa.conf","🏆 Conference League"]
];

let ligaAtual = "por.1";
let filtroAtual = "todos";
let jogosFutebol = [];
let desportoAtual = "futebol";

let favJogos = JSON.parse(localStorage.getItem("futzone_jogos_favoritos") || "[]");
let favEquipas = JSON.parse(localStorage.getItem("futzone_equipas_favoritas") || "[]");

const futsalEquipas = [
  "AD Fundão",
  "SC Braga",
  "Torreense",
  "Eléctrico",
  "Sporting CP",
  "Portimonense",
  "Leões Porto Salvo",
  "Ferreira do Zêzere",
  "Benfica",
  "UPVN",
  "Rio Ave",
  "FC Famalicão"
];

const futsalJogos = [
  {data:"2026-09-11",hora:"19:30",casa:"AD Fundão",fora:"SC Braga"},
  {data:"2026-09-11",hora:"20:30",casa:"Torreense",fora:"Eléctrico"},
  {data:"2026-09-11",hora:"21:15",casa:"Sporting CP",fora:"Portimonense"},
  {data:"2026-09-12",hora:"17:00",casa:"Leões Porto Salvo",fora:"Ferreira do Zêzere"},
  {data:"2026-09-12",hora:"19:00",casa:"Benfica",fora:"UPVN"},
  {data:"2026-09-12",hora:"15:00",casa:"Rio Ave",fora:"FC Famalicão"},
  {data:"2026-09-18",hora:"20:30",casa:"Portimonense",fora:"Benfica"},
  {data:"2026-09-18",hora:"21:00",casa:"Eléctrico",fora:"Rio Ave"},
  {data:"2026-09-19",hora:"19:00",casa:"SC Braga",fora:"Torreense"},
  {data:"2026-09-19",hora:"19:30",casa:"FC Famalicão",fora:"Sporting CP"},
  {data:"2026-09-20",hora:"17:00",casa:"UPVN",fora:"Leões Porto Salvo"},
  {data:"2026-09-20",hora:"18:00",casa:"Ferreira do Zêzere",fora:"AD Fundão"}
];

/* ---------- UTILITÁRIOS ---------- */

function escapeHtml(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function hojeISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatarData(data){
  const d = new Date(data+"T12:00:00");
  return new Intl.DateTimeFormat("pt-PT",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit"
  }).format(d);
}

function dataCurta(data){
  const d = new Date(data+"T12:00:00");
  return new Intl.DateTimeFormat("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  }).format(d);
}

function normalizarData(event){
  if(!event.date) return hojeISO();
  return event.date.slice(0,10);
}

function horaEvento(event){
  if(!event.date) return "--:--";
  return new Intl.DateTimeFormat("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  }).format(new Date(event.date));
}

function isLive(event){
  const s = event.status?.type;
  return !!(s && (s.state==="in" || s.name==="STATUS_IN_PROGRESS" || s.shortDetail==="LIVE"));
}

function isFinal(event){
  const s = event.status?.type;
  return !!(s && (s.completed || s.state==="post"));
}

function nomeEquipa(comp){
  return comp?.team?.displayName || comp?.team?.name || "Equipa";
}

function logoEquipa(comp){
  return comp?.team?.logo || comp?.team?.logos?.[0]?.href || "";
}

function getCompeticao(event){
  return event?.league?.name ||
         event?.season?.displayName ||
         event?.competitions?.[0]?.league?.name ||
         "Futebol";
}

/* ---------- LIGAS ---------- */

function desenharLigas(){
  const box = document.getElementById("leagueList");

  box.innerHTML = ligas.map(([id,nome])=>`
    <button class="leagueBtn ${id===ligaAtual?"active":""}"
      onclick="selecionarLiga('${id}')">
      ${escapeHtml(nome)}
    </button>
  `).join("");
}

function selecionarLiga(id){
  ligaAtual=id;
  desenharLigas();
  carregarJogos();
}

/* ---------- API FUTEBOL ---------- */

async function buscarJogosLiga(liga){
  const hoje = new Date();

  const datas = [];

  /* Apenas janela próxima para não rebentar a app */
  for(let i=-3;i<=10;i++){
    const d = new Date(hoje);
    d.setDate(d.getDate()+i);

    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");

    datas.push(`${y}${m}${day}`);
  }

  const pedidos = datas.map(async data=>{
    try{
      const r=await fetch(`${API}${liga}/scoreboard?dates=${data}`);
      if(!r.ok) return [];
      const j=await r.json();
      return j.events || [];
    }catch(e){
      return [];
    }
  });

  const resultados=await Promise.all(pedidos);

  const mapa=new Map();

  resultados.flat().forEach(e=>{
    if(e.id) mapa.set(e.id,e);
  });

  return Array.from(mapa.values());
}

async function carregarJogos(){
  const box=document.getElementById("footballContent");

  box.innerHTML='<div class="loading">A carregar jogos...</div>';

  try{
    const jogos=await buscarJogosLiga(ligaAtual);
    jogosFutebol=jogos;

    renderizarJogos();

  }catch(e){
    box.innerHTML=`
      <div class="error">
        Não foi possível carregar os jogos agora.
        <br><br>
        Verifica a ligação à internet e tenta novamente.
      </div>
    `;
  }
}

/* ---------- FILTROS ---------- */

function setFiltro(filtro,btn){
  filtroAtual=filtro;

  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  renderizarJogos();
}

function passaFiltro(event){
  if(filtroAtual==="todos") return true;
  if(filtroAtual==="live") return isLive(event);
  if(filtroAtual==="resultados") return isFinal(event);
  if(filtroAtual==="proximos") return !isFinal(event);
  return true;
}

/* ---------- RENDER FUTEBOL ---------- */

function renderizarJogos(){
  const box=document.getElementById("footballContent");

  const filtrados=jogosFutebol.filter(passaFiltro);

  if(!filtrados.length){
    box.innerHTML=`
      <div class="empty">
        Não existem jogos nesta seleção.
      </div>
    `;
    return;
  }

  filtrados.sort((a,b)=>{
    return new Date(a.date)-new Date(b.date);
  });

  const grupos={};

  filtrados.forEach(e=>{
    const d=normalizarData(e);
    if(!grupos[d]) grupos[d]=[];
    grupos[d].push(e);
  });

  const hoje=hojeISO();

  let html="";

  Object.keys(grupos).sort().forEach(data=>{
    const lista=grupos[data];

    let titulo=formatarData(data).toUpperCase();

    if(data===hoje){
      titulo="HOJE · "+titulo;
    }else{
      const amanha=new Date();
      amanha.setDate(amanha.getDate()+1);

      const ai=amanha.getFullYear()+"-"+
        String(amanha.getMonth()+1).padStart(2,"0")+"-"+
        String(amanha.getDate()).padStart(2,"0");

      if(data===ai) titulo="AMANHÃ · "+titulo;
    }

    html+=`
      <div class="day">
        <div class="dayHead">
          <div class="dayName">${escapeHtml(titulo)}</div>
          <div class="dayCount">${lista.length} ${lista.length===1?"jogo":"jogos"}</div>
        </div>
    `;

    lista.forEach(event=>{
      html+=cartaoJogo(event);
    });

    html+=`</div>`;
  });

  box.innerHTML=html;
}

function cartaoJogo(event){
  const comp=event.competitions?.[0];

  const competitors=comp?.competitors || [];

  const home=competitors.find(x=>x.homeAway==="home") || competitors[0];
  const away=competitors.find(x=>x.homeAway==="away") || competitors[1];

  const homeName=home?.team?.displayName || "Casa";
  const awayName=away?.team?.displayName || "Fora";

  const homeLogo=home?.team?.logo || "";
  const awayLogo=away?.team?.logo || "";

  const live=isLive(event);
  const final=isFinal(event);

  const status=live
    ? "LIVE"
    : final
      ? "FINAL"
      : event.status?.type?.shortDetail || "AGENDADO";

  const homeScore=home?.score ?? "-";
  const awayScore=away?.score ?? "-";

  const favorito=favJogos.includes(String(event.id));

  return `
    <div class="competition">
      <div class="compHead">
        ${escapeHtml(getCompeticao(event))}
      </div>

      <div class="match" onclick="abrirJogo('${escapeHtml(String(event.id))}')">

        <div class="matchTime ${live?"live":""}">
          ${horaEvento(event)}
          <span class="status ${live?"live":""}">
            ${escapeHtml(status)}
          </span>
        </div>

        <div class="teams">

          <div class="teamRow"
            onclick="event.stopPropagation();abrirEquipaPorEvento('${escapeHtml(String(event.id))}','home')">

            ${homeLogo
              ? `<img class="teamLogo" src="${escapeHtml(homeLogo)}">`
              : `<span class="teamLogo"></span>`
            }

            <span class="teamName">${escapeHtml(homeName)}</span>
          </div>

          <div class="teamRow"
            onclick="event.stopPropagation();abrirEquipaPorEvento('${escapeHtml(String(event.id))}','away')">

            ${awayLogo
              ? `<img class="teamLogo" src="${escapeHtml(awayLogo)}">`
              : `<span class="teamLogo"></span>`
            }

            <span class="teamName">${escapeHtml(awayName)}</span>
          </div>

        </div>

        <div class="scores">
          <div>${escapeHtml(String(homeScore))}</div>
          <div>${escapeHtml(String(awayScore))}</div>
        </div>

        <button class="star ${favorito?"on":""}"
          onclick="event.stopPropagation();toggleFavJogo('${escapeHtml(String(event.id))}')">
          ${favorito?"★":"☆"}
        </button>

      </div>
    </div>
  `;
}

/* ---------- FAVORITOS ---------- */

function toggleFavJogo(id){
  id=String(id);

  if(favJogos.includes(id)){
    favJogos=favJogos.filter(x=>x!==id);
  }else{
    favJogos.push(id);
  }

  localStorage.setItem(
    "futzone_jogos_favoritos",
    JSON.stringify(favJogos)
  );

  renderizarJogos();
}

function toggleFavEquipa(id){
  id=String(id);

  if(favEquipas.includes(id)){
    favEquipas=favEquipas.filter(x=>x!==id);
  }else{
    favEquipas.push(id);
  }

  localStorage.setItem(
    "futzone_equipas_favoritas",
    JSON.stringify(favEquipas)
  );
}

/* ---------- DETALHE JOGO ---------- */

function abrirJogo(id){
  const event=jogosFutebol.find(x=>String(x.id)===String(id));

  if(!event) return;

  const comp=event.competitions?.[0];
  const competitors=comp?.competitors || [];

  const home=competitors.find(x=>x.homeAway==="home") || competitors[0];
  const away=competitors.find(x=>x.homeAway==="away") || competitors[1];

  const live=isLive(event);

  document.getElementById("overlayTitle").textContent =
    getCompeticao(event);

  document.getElementById("overlayContent").innerHTML=`
    <div class="bigTeams">

      ${home?.team?.logo
        ? `<img class="bigLogo" src="${escapeHtml(home.team.logo)}">`
        : ""
      }

      <div class="bigName">
        ${escapeHtml(nomeEquipa(home))}
      </div>

      <div class="bigScore">
        ${escapeHtml(String(home?.score ?? "-"))}
        -
        ${escapeHtml(String(away?.score ?? "-"))}
      </div>

      <div class="bigName">
        ${escapeHtml(nomeEquipa(away))}
      </div>

      ${away?.team?.logo
        ? `<img class="bigLogo" src="${escapeHtml(away.team.logo)}">`
        : ""
      }

      <div class="notice">
        ${horaEvento(event)} ·
        ${live?"🔴 AO VIVO":escapeHtml(event.status?.type?.shortDetail || "Jogo")}
      </div>

    </div>

    <div class="eventBox">
      <div class="eventTitle">Informação</div>
      <div class="notice">
        ${escapeHtml(getCompeticao(event))}

        ${escapeHtml(formatarData(normalizarData(event)))}
        <br>
        ${horaEvento(event)}
      </div>
    </div>

}

function fecharOverlay(){
  document.getElementById("overlay").classList.remove("show");
}

/* ---------- EQUIPAS ---------- */

function abrirEquipaPorEvento(id,lado){
  const event=jogosFutebol.find(x=>String(x.id)===String(id));
  if(!event) return;

  const comp=event.competitions?.[0];
  const competitors=comp?.competitors || [];

  const team=competitors.find(x=>x.homeAway===lado);

  if(!team?.team) return;

  abrirEquipa(
    team.team.id,
    team.team.displayName,
    team.team.logo,
    ligaAtual
  );
}

async function abrirEquipa(id,nome,logo,liga){
  document.getElementById("overlayTitle").textContent=nome;

  document.getElementById("overlayContent").innerHTML=`
    <div class="bigTeams">
      ${logo?`<img class="bigLogo" src="${escapeHtml(logo)}">`:""}
      <div class="bigName">${escapeHtml(nome)}</div>

      <button class="topbtn"
        onclick="toggleFavEquipa('${escapeHtml(String(id))}');abrirEquipa(${JSON.stringify(id)},${JSON.stringify(nome)},${JSON.stringify(logo)},${JSON.stringify(liga)})">
        ${favEquipas.includes(String(id))?"★ Remover favorito":"☆ Adicionar aos favoritos"}
      </button>
    </div>

    <div class="eventBox">
      <div class="eventTitle">Plantel</div>
      <div id="rosterBox" class="loading">A carregar plantel...</div>
    </div>

    <div class="eventBox">
      <div class="eventTitle">Jogos da equipa</div>
      <div class="notice">
        Consulta os jogos da competição selecionada através da área Jogos.
      </div>
    </div>
  `;

  document.getElementById("overlay").classList.add("show");

  carregarPlantel(id,liga);
}

async function carregarPlantel(id,liga){
  const box=document.getElementById("rosterBox");

  try{
    const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${liga}/teams/${id}/roster`;

    const r=await fetch(url);

    if(!r.ok) throw new Error();

    const data=await r.json();

    const atletas=data.athletes || data.roster || [];

    if(!atletas.length){
      box.innerHTML=`<div class="notice">Plantel não disponível.</div>`;
      return;
    }

    box.innerHTML=atletas.slice(0,40).map(p=>{
      const atleta=p.athlete || p;

      return `
        <div class="player">
          <strong>${escapeHtml(atleta.displayName || atleta.fullName || "Jogador")}</strong>
          <small>${escapeHtml(atleta.position?.displayName || atleta.position?.name || "")}</small>
        </div>
      `;
    }).join("");

  }catch(e){
    box.innerHTML=`
      <div class="notice">
        Plantel não disponível neste momento.
      </div>
    `;
  }
}

/* ---------- TABELAS FUTEBOL ---------- */

async function mostrarTabelaFutebol(){
  mudarDesporto("futebol");

  document.getElementById("footballContent").innerHTML=
    `<div class="loading">A carregar classificação...</div>`;

  try{
    const r=await fetch(
      `https://site.api.espn.com/apis/v2/sports/soccer/${ligaAtual}/standings`
    );

    if(!r.ok) throw new Error();

    const data=await r.json();

    let entries=[];

    if(data.children?.length){
      data.children.forEach(c=>{
        if(c.standings?.entries){
          entries=entries.concat(c.standings.entries);
        }
      });
    }

    if(!entries.length && data.standings?.entries){
      entries=data.standings.entries;
    }

    if(!entries.length){
      throw new Error();
    }

    entries.sort((a,b)=>{
      const pa=(a.stats||[]).find(x=>x.name==="rank");
      const pb=(b.stats||[]).find(x=>x.name==="rank");
      return Number(pa?.value||999)-Number(pb?.value||999);
    });

    let rows="";

    entries.forEach((e,i)=>{
      const team=e.team?.displayName || "Equipa";

      const getStat=(names)=>{
        const s=(e.stats||[]).find(x=>names.includes(x.name));
        return s?.displayValue ?? s?.value ?? "-";
      };

      rows+=`
        <tr>
          <td>${i+1}. ${escapeHtml(team)}</td>
          <td>${getStat(["gamesPlayed","GP"])}</td>
          <td>${getStat(["wins","W"])}</td>
          <td>${getStat(["ties","T","draws"] )}</td>
          <td>${getStat(["losses","L"])}</td>
          <td><strong>${getStat(["points","PTS"])}</strong></td>
        </tr>
      `;
    });

    document.getElementById("footballContent").innerHTML=`
      <div class="card">
        <div class="compHead">
          ${escapeHtml(
            ligas.find(x=>x[0]===ligaAtual)?.[1] || "Classificação"
          )}
        </div>

        <div style="overflow-x:auto">
          <table class="table">
            <thead>
              <tr>
                <th>Equipa</th>
                <th>J</th>
                <th>V</th>
                <th>E</th>
                <th>D</th>
                <th>P</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;

  }catch(e){
    document.getElementById("footballContent").innerHTML=`
      <div class="notice">
        A classificação desta competição não está disponível neste momento.
      </div>
    `;
  }
}

  filtroAtual=anterior;
}

/* ---------- NAVEGAÇÃO ---------- */

function mudarDesporto(d){
  desportoAtual=d;

  document.getElementById("futebolArea").style.display=
    d==="futebol"?"block":"none";

  document.getElementById("futsalArea").style.display=
    d==="futsal"?"block":"none";

  document.getElementById("topFutebol").classList.toggle(
    "active",d==="futebol"
  );

  document.getElementById("topFutsal").classList.toggle(
    "active",d==="futsal"
  );

  if(d==="futsal"){
    futsalPagina("jogos");
  }
}

function irNav(nav){

  document.querySelectorAll(".bottom button")
    .forEach(x=>x.classList.remove("active"));

  if(nav==="jogos"){
    document.getElementById("navJogos").classList.add("active");
    mudarDesporto("futebol");
    carregarJogos();
  }

  if(nav==="tabelas"){
    document.getElementById("navTabelas").classList.add("active");
    mostrarTabelaFutebol();
  }

  if(nav==="favoritos"){
    document.getElementById("navFav").classList.add("active");
    mostrarFavoritos();
  }

  if(nav==="futsal"){
    mudarDesporto("futsal");
  }
}
