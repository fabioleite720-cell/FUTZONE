<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2
   JOGOS + DATAS + TODAS AS LIGAS + AO VIVO + TABELAS
   ========================================================= */

const FZ_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const FZ_STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [
  { id:"por.1", name:"Liga Portugal", flag:"🇵🇹" },
  { id:"por.2", name:"Liga Portugal 2", flag:"🇵🇹" },
  { id:"por.3", name:"Liga 3", flag:"🇵🇹" },
  { id:"por.w.1", name:"Liga BPI Feminina", flag:"🇵🇹" },

  { id:"eng.1", name:"Premier League", flag:"🇬🇧" },
  { id:"eng.2", name:"Championship", flag:"🇬🇧" },

  { id:"esp.1", name:"LaLiga", flag:"🇪🇸" },
  { id:"esp.2", name:"LaLiga 2", flag:"🇪🇸" },

  { id:"ita.1", name:"Serie A", flag:"🇮🇹" },
  { id:"ita.2", name:"Serie B", flag:"🇮🇹" },

  { id:"ger.1", name:"Bundesliga", flag:"🇩🇪" },
  { id:"ger.2", name:"2. Bundesliga", flag:"🇩🇪" },

  { id:"fra.1", name:"Ligue 1", flag:"🇫🇷" },
  { id:"fra.2", name:"Ligue 2", flag:"🇫🇷" },

  { id:"ned.1", name:"Eredivisie", flag:"🇳🇱" },
  { id:"bel.1", name:"Belgian Pro League", flag:"🇧🇪" },

  { id:"ksa.1", name:"Saudi Pro League", flag:"🇸🇦" },
  { id:"usa.1", name:"MLS", flag:"🇺🇸" },

  { id:"uefa.champions", name:"Champions League", flag:"🏆" },
  { id:"uefa.europa", name:"Europa League", flag:"🏆" },
  { id:"uefa.europa.conf", name:"Conference League", flag:"🏆" }
];

/* =========================================================
   ESTADO
   ========================================================= */

let FZ_ligaSelecionada = "ALL";
let FZ_modo = "jogos";
let FZ_dataSelecionada = FZ_dataISO(new Date());
let FZ_aAtualizar = null;
let FZ_carregando = false;

/* =========================================================
   DATAS
   ========================================================= */

function FZ_dataISO(data = new Date()) {
  const d = new Date(data);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2,"0");
  const dia = String(d.getDate()).padStart(2,"0");
  return `${ano}-${mes}-${dia}`;
}

function FZ_dataAPI(iso) {
  return String(iso).replace(/-/g,"");
}

function FZ_dataObj(iso) {
  const [a,m,d] = iso.split("-").map(Number);
  return new Date(a,m-1,d);
}

function FZ_formatarData(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function FZ_dataCurta(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    day:"2-digit",
    month:"2-digit"
  });
}

function FZ_mudarData(dias) {
  const d = FZ_dataObj(FZ_dataSelecionada);
  d.setDate(d.getDate() + dias);

  FZ_dataSelecionada = FZ_dataISO(d);

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_irHoje() {
  FZ_dataSelecionada = FZ_dataISO(new Date());

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_dataEscolhida(valor) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return;

  FZ_dataSelecionada = valor;

  FZ_renderDataBarra();
  FZ_carregarModo();
}

/* =========================================================
   FETCH SEGURO
   ========================================================= */

async function FZ_fetch(url) {

  const controlador = new AbortController();

  const tempo = setTimeout(() => {
    controlador.abort();
  }, 15000);

  try {

    const resposta = await fetch(url, {
      method:"GET",
      cache:"no-store",
      signal:controlador.signal
    });

    if (!resposta.ok) {
      throw new Error("HTTP " + resposta.status);
    }

    return await resposta.json();

  } finally {
    clearTimeout(tempo);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */

function FZ_liga(id) {
  return FZ_LIGAS.find(l => l.id === id);
}

function FZ_nomeLiga(id) {
  const liga = FZ_liga(id);
  return liga ? `${liga.flag} ${liga.name}` : id;
}

function FZ_escape(valor) {
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function FZ_horaEvento(evento) {

  if (!evento.date) return "--:--";

  const d = new Date(evento.date);

  return d.toLocaleTimeString("pt-PT", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function FZ_dataEvento(evento) {

  if (!evento.date) return "";

  return FZ_dataISO(new Date(evento.date));
}

function FZ_nomeEquipa(team) {

  return (
    team?.displayName ||
    team?.shortDisplayName ||
    team?.name ||
    "Equipa"
  );
}

function FZ_logoEquipa(team) {

  return (
    team?.logo ||
    team?.logos?.[0]?.href ||
    ""
  );
}

/* =========================================================
   BARRA DE COMPETIÇÕES
   ========================================================= */

function FZ_renderCompeticoes() {

  const el = document.getElementById("competicoes");

  if (!el) return;

  let html = `
    <button
      class="league-chip ${FZ_ligaSelecionada === "ALL" ? "active" : ""}"
      data-liga="ALL">
      🌍 Todas
    </button>
  `;

  for (const liga of FZ_LIGAS) {

    html += `
      <button
        class="league-chip ${FZ_ligaSelecionada === liga.id ? "active" : ""}"
        data-liga="${liga.id}">
        ${liga.flag} ${FZ_escape(liga.name)}
      </button>
    `;
  }

  el.innerHTML = html;
}

function FZ_selecionarLiga(id) {

  FZ_ligaSelecionada = id;

  FZ_renderCompeticoes();

  if (FZ_modo === "tabelas" && id === "ALL") {
    FZ_carregarModo();
    return;
  }

  FZ_carregarModo();
}

/* =========================================================
   BARRA DE DATA
   ========================================================= */

function FZ_renderDataBarra() {

  let barra = document.getElementById("fzDataBar");

  if (!barra) {

    barra = document.createElement("div");

    barra.id = "fzDataBar";

    const conteudo = document.getElementById("conteudo");

    if (conteudo && conteudo.parentNode) {
      conteudo.parentNode.insertBefore(barra, conteudo);
    } else {
      document.body.appendChild(barra);
    }
  }

  const hoje = FZ_dataISO(new Date());

  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);

  const amanha = new Date();
  amanha.setDate(amanha.getDate() + 1);

  const ontemISO = FZ_dataISO(ontem);
  const amanhaISO = FZ_dataISO(amanha);

  barra.innerHTML = `
    <div style="
      background:#03060B;
      border:1px solid #722F37;
      border-radius:14px;
      padding:10px;
      margin:10px 0;
    ">

      <div style="
        display:flex;
        align-items:center;
        gap:6px;
      ">

        <button
          onclick="FZ_mudarData(-1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ‹
        </button>

        <button
          onclick="FZ_dataEscolhida('${ontemISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === ontemISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === ontemISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          ONTEM
          <br>
          <small>${FZ_dataCurta(ontemISO)}</small>
        </button>

        <button
          onclick="FZ_irHoje()"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === hoje ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === hoje ? "#0057B8" : "#0D1724"};
            color:white;
            font-weight:700;
          ">
          HOJE
          <br>
          <small>${FZ_dataCurta(hoje)}</small>
        </button>

        <button
          onclick="FZ_dataEscolhida('${amanhaISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === amanhaISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === amanhaISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          AMANHÃ
          <br>
          <small>${FZ_dataCurta(amanhaISO)}</small>
        </button>

        <button
          onclick="FZ_mudarData(1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ›
        </button>

      </div>

      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-top:9px;
      ">

        <input
          id="fzCalendar"
          type="date"
          value="${FZ_dataSelecionada}"
          onchange="FZ_dataEscolhida(this.value)"
          style="
            flex:1;
            min-height:42px;
            border-radius:10px;
            border:1px solid #333;
            background:#0D1724;
            color:white;
            padding:0 10px;
          "
        >

        <button
          onclick="FZ_carregarModo()"
          style="
            min-width:46px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#0057B8;
            color:white;
            font-size:20px;
          ">
          🔄
        </button>

      </div>

      <div style="
        text-align:center;
        color:#D9DEE8;
        font-size:13px;
        margin-top:8px;
        text-transform:capitalize;
      ">
        ${FZ_escape(FZ_formatarData(FZ_dataSelecionada))}
      </div>

    </div>
  `;
}

/* =========================================================
   ESTADO
   ========================================================= */

function FZ_estado(texto, erro=false) {

  const el = document.getElementById("estado");

  if (!el) return;

  el.innerHTML = `
    <div style="
      padding:10px;
      text-align:center;
      color:${erro ? "#FF4054" : "#9DAABB"};
      font-size:13px;
    ">
      ${FZ_escape(texto)}
    </div>
  `;
}

/* =========================================================
   CARD DE JOGO
   ========================================================= */

function FZ_cardJogo(evento, ligaId) {

  const comp = evento.competitions?.[0];

  const competitors = comp?.competitors || [];

  const casa =
    competitors.find(x => x.homeAway === "home") ||
    competitors[0];

  const fora =
    competitors.find(x => x.homeAway === "away") ||
    competitors[1];

  const casaNome = FZ_nomeEquipa(casa?.team);
  const foraNome = FZ_nomeEquipa(fora?.team);

  const casaLogo = FZ_logoEquipa(casa?.team);
  const foraLogo = FZ_logoEquipa(fora?.team);

  const status = evento.status?.type;

  const concluido =
    status?.completed === true ||
    status?.state === "post";

  const aoVivo =
    status?.state === "in" ||
    status?.name === "STATUS_IN_PROGRESS";

  let hora = FZ_horaEvento(evento);

  if (aoVivo) {
    hora = "🔴 AO VIVO";
  }

  if (concluido) {
    hora = "FINAL";
  }

  const scoreCasa =
    casa?.score ??
    "-";

  const scoreFora =
    fora?.score ??
    "-";

  const ligaNome = FZ_nomeLiga(ligaId);

  return `
    <div
      class="fz-game-card"
      style="
        background:#09111C;
        border:1px solid ${aoVivo ? "#722F37" : "#1B2635"};
        border-radius:15px;
        padding:12px;
        margin:8px 0;
        box-shadow:0 3px 12px rgba(0,0,0,.25);
      "
      onclick="FZ_abrirJogoSeguro('${FZ_escape(evento.id)}','${FZ_escape(ligaId)}')"
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:#9DAABB;
        font-size:11px;
        margin-bottom:10px;
      ">
        <span>${FZ_escape(ligaNome)}</span>
        <strong style="
          color:${aoVivo ? "#FF4054" : concluido ? "#9DAABB" : "#1683FF"};
        ">
          ${hora}
        </strong>
      </div>

      <div style="
        display:grid;
        grid-template-columns:1fr 55px 1fr;
        align-items:center;
        gap:6px;
      ">

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            casaLogo
            ? `<img src="${FZ_escape(casaLogo)}"
                    style="width:38px;height:38px;object-fit:contain;display:block;margin:auto auto 5px;">`
            : `<div style="height:43px;"></div>`
          }

          <div>${FZ_escape(casaNome)}</div>
        </div>

        <div style="
          text-align:center;
          font-size:20px;
          font-weight:900;
          color:white;
        ">
          ${scoreCasa}
          <br>
          <span style="font-size:12px;color:#9DAABB;">-</span>
          <br>
          ${scoreFora}
        </div>

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            foraLogo

/* =========================================================
   BUSCAR JOGOS DE UMA LIGA
   ========================================================= */

async function FZ_buscarJogosLiga(ligaId, dataISO) {

  const data = FZ_dataAPI(dataISO);

  const url =
    `${FZ_API}${ligaId}/scoreboard?dates=${data}`;

  const json = await FZ_fetch(url);

  const eventos = Array.isArray(json.events)
    ? json.events
    : [];

  return {
    ligaId,
    eventos
  };
}

/* =========================================================
   BUSCAR TODAS AS LIGAS
   ========================================================= */

async function FZ_buscarTodasAsLigas(dataISO) {

  const resultados = [];

  const tamanhoLote = 5;

  for (
    let inicio = 0;
    inicio < FZ_LIGAS.length;
    inicio += tamanhoLote
  ) {

    const lote = FZ_LIGAS.slice(
      inicio,
      inicio + tamanhoLote
    );

    const respostas = await Promise.allSettled(
      lote.map(liga =>
        FZ_buscarJogosLiga(liga.id,dataISO)
      )
    );

    respostas.forEach((r,i) => {

      if (r.status === "fulfilled") {

        resultados.push(r.value);

      } else {

        console.warn(
          "Falha ao carregar",
          lote[i].id,
          r.reason
        );

        resultados.push({
          ligaId:lote[i].id,
          eventos:[]
        });
      }
    });
  }

  return resultados;
}

      await FZ_buscarTodasAsLigas(

/* =========================================================
   STANDINGS — EXTRAIR ENTRIES
   ========================================================= */

function FZ_extrairEntries(obj) {

  const encontrados = [];
  const vistos = new Set();

  function procurar(valor) {

    if (!valor || typeof valor !== "object") {
      return;
    }

    if (Array.isArray(valor.entries)) {

      valor.entries.forEach(entry => {

        if (
          entry &&
          entry.team &&
          entry.team.id
        ) {

          if (!vistos.has(entry.team.id)) {

            vistos.add(entry.team.id);
            encontrados.push(entry);
          }
        }
      });
    }

    Object.keys(valor).forEach(chave => {

      const item = valor[chave];

      if (
        item &&
        typeof item === "object"
      ) {
        procurar(item);
      }
    });
  }

  procurar(obj);

  return encontrados;
}

/* =========================================================
   STAT DAS CLASSIFICAÇÕES
   ========================================================= */

function FZ_stat(entry,nome,alternativas=[]) {

  const nomes = [
    nome,
    ...alternativas
  ];

  const stats =
    Array.isArray(entry.stats)
      ? entry.stats
      : [];

  const stat =
    stats.find(s =>
      nomes.includes(s.name)
    );

  if (!stat) return "-";

  return (
    stat.displayValue ??
    stat.value ??
    "-"
  );
}

/* =========================================================
   MODOS
   ========================================================= */

async function FZ_carregarModo() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();

  if (FZ_modo === "jogos") {
    await FZ_jogosDoDia();
    return;
  }

  if (FZ_modo === "jornadas") {
    await FZ_jornadas();
    return;
  }

  if (FZ_modo === "tabelas") {
    await FZ_carregarTabelas();
    return;
  }

  if (FZ_modo === "ao-vivo") {
    await FZ_aoVivo();
    return;
  }

  await FZ_jogosDoDia();
}

/* =========================================================
   MUDAR MODO
   ========================================================= */

function FZ_mudarModo(modo) {

  FZ_modo = modo;

  document
    .querySelectorAll("[data-modo]")
    .forEach(botao => {

      botao.classList.toggle(
        "active",
        botao.dataset.modo === modo
      );
    });

  FZ_carregarModo();
}

/* =========================================================
   CLIQUES
   ========================================================= */

document.addEventListener("click", function(event) {

  const liga =
    event.target.closest("[data-liga]");

  if (liga) {

    FZ_selecionarLiga(
      liga.dataset.liga
    );

    return;
  }

  const modo =
    event.target.closest("[data-modo]");

  if (modo) {

    const valor =
      modo.dataset.modo;

    if (valor === "aoVivo") {
      FZ_mudarModo("ao-vivo");
    } else {
      FZ_mudarModo(valor);
    }
  }
});

/* =========================================================
   AUTO REFRESH
   ========================================================= */

function FZ_configurarAtualizacao() {

  if (FZ_aAtualizar) {
    clearInterval(FZ_aAtualizar);
  }

  FZ_aAtualizar = setInterval(() => {

    const hoje =
      FZ_dataISO(new Date());

    if (
      FZ_dataSelecionada === hoje ||
      FZ_modo === "ao-vivo"
    ) {

      FZ_carregarModo();

    }

  }, FZ_modo === "ao-vivo" ? 30000 : 60000);
}

/* =========================================================
   INICIAR
   ========================================================= */

  FZ_configurarAtualizacao();

if (

  );

  const box = document.getElementById("fzEquipaConteudo");

  if(!box) return;

  box.innerHTML =
    `<div class="fz-loading">⏳ A procurar jogos...</div>`;

  try{

    const data = await FZ_fetch(
      FZ_API +
      liga +
      "/teams/" +
      encodeURIComponent(id) +
      "/schedule?limit=100"
    );

    const eventos =
      data?.events ||
      data?.schedule ||
      data?.items ||
      [];

    if(!eventos.length){

      box.innerHTML = `
        <div class="fz-section">
          <div class="fz-section-title">⚽ Jogos</div>
          <div class="fz-muted">
            Não existem jogos disponibilizados pela fonte para este clube.
          </div>
        </div>
      `;

      return;
    }

    const jogos = [...eventos].sort((a,b)=>{

      const da = new Date(
        a?.date ||
        a?.competitions?.[0]?.date ||
        0
      ).getTime();

      const db = new Date(
        b?.date ||
        b?.competitions?.[0]?.date ||
        0
      ).getTime();

      return da-db;
    });

    box.innerHTML = `
      <div class="fz-section">

        <div class="fz-section-title">
          ⚽ Jogos de ${FZ_esc(nome)}

                  </tr>

              }).join("")}

            </tbody>

          </table>

        </div>

      </div>
    `;

  }catch(e){

    console.error("FUTZONE tabela equipa:",e);

    box.innerHTML = `

/* =========================================================
   RESOLVER REFERÊNCIA ESPN
   ========================================================= */

async function FZ_resolverRef(valor){

  if(
    valor &&
    typeof valor === "object" &&
    typeof valor.$ref === "string"
  ){

    try{
      return await FZ_fetch(valor.$ref);
    }catch(e){
      return null;
    }

  }

  return valor;
}


/* =========================================================
   HISTÓRICO DE CARREIRA
   ========================================================= */

async function FZ_obterCarreira(jogador,core,liga){

  const resultados = [];

  const fontes = [
    core?.teams,
    core?.teamHistory,
    core?.career,
    core?.statistics,
    jogador?.teams,
    jogador?.teamHistory,
    jogador?.career,
    jogador?.statistics
  ];

  for(const fonte of fontes){

    if(!fonte) continue;

    let dados = await FZ_resolverRef(fonte);

    if(!dados) continue;

    const arrays = [];

    if(Array.isArray(dados)){
      arrays.push(dados);
    }

    if(Array.isArray(dados.items)){
      arrays.push(dados.items);
    }

    if(Array.isArray(dados.entries)){
      arrays.push(dados.entries);
    }

    if(Array.isArray(dados.splits)){
      arrays.push(dados.splits);
    }

    for(const arr of arrays){

      for(const item of arr){

        const team =
          item?.team ||
          item?.athlete?.team ||
          item?.statistics?.team ||
          null;

        const nome =
          team?.displayName ||
          team?.name ||
          item?.teamName ||
          "";

        if(nome){

          const temporada =
            item?.season?.displayName ||
            item?.season?.year ||
            item?.seasonDisplayName ||
            "";

          const competicao =
            item?.league?.name ||
            item?.competition?.name ||
            "";

          const chave =
            nome+"|"+temporada+"|"+competicao;

          if(!resultados.some(x=>x.chave===chave)){

            resultados.push({
              chave,
              nome,
              temporada,
              competicao
            });
          }
        }
      }
    }
  }

  return resultados;
}

/* =========================================================
   DETALHE DO JOGO
   ========================================================= */

function FZ_renderizarDetalheJogo(data,liga){

  const header =
    data?.header ||
    {};

  const competition =
    header?.competitions?.[0] ||
    data?.competitions?.[0] ||
    {};

  const competitors =
    competition?.competitors ||
    [];

  const home =
    competitors.find(x=>x.homeAway==="home") ||
    competitors[0] ||
    {};

  const away =
    competitors.find(x=>x.homeAway==="away") ||
    competitors[1] ||
    {};

  const homeId =
    home?.team?.id ||
    home?.id ||
    "";

  const awayId =
    away?.team?.id ||
    away?.id ||
    "";

  const homeName =
    home?.team?.displayName ||
    home?.displayName ||
    "Casa";

  const awayName =
    away?.team?.displayName ||
    away?.displayName ||
    "Fora";

  const homeScore =
    home?.score ??
    "-";

  const awayScore =
    away?.score ??
    "-";

  const status =
    competition?.status ||
    {};

  const statusText =
    status?.type?.detail ||
    status?.type?.description ||
    "";

  const eventoId =
    header?.id ||
    competition?.id ||
    FZ_EXTRA.eventoAtual?.id;

  const dataJogo =
    competition?.date ||
    header?.competitions?.[0]?.date ||
    "";

  let dataTexto = "";

  if(dataJogo){

    const d = new Date(dataJogo);

    if(!isNaN(d.getTime())){
      dataTexto =
        d.toLocaleDateString("pt-PT") +
        " " +
        d.toLocaleTimeString("pt-PT",{
          hour:"2-digit",
          minute:"2-digit"
        });
    }
  }

  const ligaNome =
    typeof FZ_nomeLiga === "function"
      ? FZ_nomeLiga(liga)
      : liga;

  FZ_conteudo.innerHTML = `

    <div class="fz-extra">

      <button class="fz-voltar"
        onclick="FZ_voltarJogos()">
        ← Voltar
      </button>

      <div class="fz-section">

        <div class="fz-muted" style="text-align:center">
          ${FZ_esc(ligaNome)}
        </div>

        <div class="fz-muted" style="text-align:center;margin:5px">
          ${FZ_esc(dataTexto)}
        </div>

        <div class="fz-detalhe-equipas">

          <div class="fz-detalhe-equipa">
            ${FZ_esc(homeName)}
          </div>

          <div>

            <div class="fz-detalhe-score">
              ${FZ_esc(homeScore)} - ${FZ_esc(awayScore)}
            </div>

            <div class="fz-detalhe-status">
              ${FZ_esc(statusText)}
            </div>

          </div>

          <div class="fz-detalhe-equipa">
            ${FZ_esc(awayName)}
          </div>

        </div>

      </div>

      ${FZ_renderizarEstatisticas(data)}

      ${FZ_renderizarOnze(data,liga)}

      ${FZ_renderizarEventos(data)}

    </div>
  `;
}


/* =========================================================
   ESTATÍSTICAS REAIS
   ========================================================= */

function FZ_renderizarEstatisticas(data){

  const teams =
    data?.boxscore?.teams ||
    data?.teamStats ||
    [];

  if(!Array.isArray(teams) || teams.length<1){
    return `
      <div class="fz-section">
        <div class="fz-section-title">
          📊 Estatísticas
        </div>
        <div class="fz-muted">
          Estatísticas detalhadas não disponibilizadas pela fonte.
        </div>
      </div>
    `;
  }

  const home =
    teams.find(t=>t?.homeAway==="home") ||
    teams[0];

  const away =
    teams.find(t=>t?.homeAway==="away") ||
    teams[1];

  const hs =
    home?.statistics ||
    home?.stats ||
    [];

  const as =
    away?.statistics ||
    away?.stats ||
    [];

  const mapH = {};
  const mapA = {};

  hs.forEach(s=>{
    const n =
      s?.name ||
      s?.label ||
      s?.displayName ||
      "";

    mapH[n] =
      s?.displayValue ??
      s?.value ??
      "";
  });

  as.forEach(s=>{
    const n =
      s?.name ||
      s?.label ||
      s?.displayName ||
      "";

    mapA[n] =
      s?.displayValue ??
      s?.value ??
      "";
  });

  const nomes =
    [...new Set([
      ...Object.keys(mapH),
      ...Object.keys(mapA)
    ])];

  if(!nomes.length){
    return "";
  }

  return `
    <div class="fz-section">

      <div class="fz-section-title">
        📊 Estatísticas
      </div>

      ${
        nomes.map(nome=>`

          <div class="fz-stat-row">

            <div>
              ${FZ_esc(mapH[nome] ?? "—")}
            </div>

            <div class="fz-stat-name">
              ${FZ_esc(nome)}
            </div>

            <div>
              ${FZ_esc(mapA[nome] ?? "—")}
            </div>

          </div>

        `).join("")
      }

    </div>
  `;
}


/* =========================================================
   EVENTOS / MARCADORES / CARTÕES / FALTAS / SUBSTITUIÇÕES
   ========================================================= */

function FZ_renderizarEventos(data){

  const plays =
    data?.plays ||
    data?.gameInfo?.plays ||
    [];

  if(!Array.isArray(plays) || !plays.length){

    return `
      <div class="fz-section">

        <div class="fz-section-title">
          📝 Eventos
        </div>

        <div class="fz-muted">
          Não existem eventos detalhados disponibilizados pela fonte.
        </div>

      </div>
    `;
  }

  return `
    <div class="fz-section">

      <div class="fz-section-title">
        📝 Eventos do jogo
      </div>

      ${plays.map(play=>{

        const texto =
          play?.text ||
          play?.type?.text ||
          play?.type?.description ||
          "";

        const minuto =
          play?.clock?.displayValue ||
          play?.clock?.value ||
          play?.period?.displayValue ||
          "";

        const participantes =
          (play?.participants || [])
            .map(p=>
              p?.athlete?.displayName ||
              p?.athlete?.shortName ||
              p?.displayName ||
              ""
            )
            .filter(Boolean);

        const tipoTexto =
          String(
            play?.type?.text ||
            play?.type?.description ||
            texto
          ).toLowerCase();

        let icone = "•";

        if(/goal|gol/.test(tipoTexto)){
          icone = "⚽";
        }else if(/yellow|amarelo/.test(tipoTexto)){
          icone = "🟨";
        }else if(/red|vermelho/.test(tipoTexto)){
          icone = "🟥";
        }else if(/substitut|substitui/.test(tipoTexto)){
          icone = "🔄";
        }else if(/foul|falta/.test(tipoTexto)){
          icone = "⚠️";
        }

        return `
          <div class="fz-evento">

            <div class="fz-evento-top">
              <span>${FZ_esc(minuto)}</span>
              <span>${icone}</span>
            </div>

              :

            }

function FZ_obterRosters(data){

  const rosters =
    data?.rosters ||
    data?.lineups ||
    data?.boxscore?.rosters ||
    [];

  if(!Array.isArray(rosters)){
    return [];
  }

  return rosters;
}

function FZ_formacaoNumeros(formacao){

  if(!formacao) return [4,3,3];

  const nums =
    String(formacao)
      .split("-")
      .map(Number)
      .filter(n=>Number.isFinite(n));

  if(nums.length>=2){
    return nums;
  }

  return [4,3,3];
}

function FZ_posicoesCampo(formation,home){

  const linhas =
    FZ_formacaoNumeros(formation);

  const posicoes = [];

  /* Guarda-redes */
  posicoes.push({
    x:home ? 8 : 92,
    y:50
  });

  const total = linhas.reduce((a,b)=>a+b,0);

  let acumulado = 0;

  linhas.forEach((quantidade,linha)=>{

    const xBase =
      home
      ? 20 + linha * 19
      : 80 - linha * 19;

    for(let i=0;i<quantidade;i++){

      const y =
        quantidade===1
        ? 50
        : 18 + (64 * i / (quantidade-1));

      posicoes.push({
        x:xBase,
        y
      });

    }

    acumulado += quantidade;
  });

  while(posicoes.length<11){

    posicoes.push({
      x:home ? 35 : 65,
      y:50
    });

  }

  return posicoes.slice(0,11);
}

function FZ_jogadoresRoster(roster){

  const lista =
    roster?.roster ||
    roster?.athletes ||
    roster?.players ||
    [];

  if(!Array.isArray(lista)) return [];

  return lista
    .filter(p=>{

      if(p?.starter===true) return true;

      if(p?.starter?.value===true) return true;

      return false;

    })
    .slice(0,11);
}

function FZ_renderizarOnze(data,liga){

    rosters[1];

  if(!homeRoster && !awayRoster){
    return "";
  }

  const homePlayers =
    FZ_jogadoresRoster(homeRoster);

  const awayPlayers =

  const homeFormation =

    "4-3-3";

  const awayFormation =
    awayRoster?.formation ||
    awayRoster?.team?.formation ||
    "4-3-3";

  const homePositions =
    FZ_posicoesCampo(homeFormation,true);

  const awayPositions =
    FZ_posicoesCampo(awayFormation,false);

  let html = `
    <div class="fz-section">

      <div class="fz-section-title">
        👥 Onze inicial
      </div>

      <div class="fz-muted" style="text-align:center">
        ${FZ_esc(homeFormation)} vs ${FZ_esc(awayFormation)}
      </div>

      <div class="fz-pitch-wrap">

        <div class="fz-pitch-title">
          🏟️ Distribuição dos titulares
        </div>

        <div class="fz-pitch">
  `;

  homePlayers.forEach((p,i)=>{

    const atleta =
      p?.athlete ||
      p?.player ||
      p;

    const id =
      atleta?.id ||
      p?.id ||
      "";

    const nome =
      atleta?.displayName ||
      atleta?.shortName ||
      "Jogador";

    const jersey =
      atleta?.jersey ||
      p?.jersey ||
      "";

    const pos =
      homePositions[i] ||
      {x:30,y:50};

    html += `
      <div class="fz-pitch-player"
        style="left:${pos.x}%;top:${pos.y}%"
        onclick="FZ_abrirJogadorSeguro('${FZ_esc(id)}','${FZ_esc(liga)}','','${FZ_esc(nome)}')">

        <div class="fz-pitch-ball">
          ${FZ_esc(jersey || "•")}
        </div>

        <div class="fz-pitch-name">
          ${FZ_esc(nome)}
        </div>

      </div>
    `;
  });

  awayPlayers.forEach((p,i)=>{

    const atleta =
      p?.athlete ||
      p?.player ||
      p;

    const id =
      atleta?.id ||
      p?.id ||
      "";

    const nome =
      atleta?.displayName ||
      atleta?.shortName ||
      "Jogador";

    const jersey =
      atleta?.jersey ||
      p?.jersey ||
      "";

    const pos =
      awayPositions[i] ||
      {x:70,y:50};

    html += `
      <div class="fz-pitch-player away"
        style="left:${pos.x}%;top:${pos.y}%"

        </div>

        <div class="fz-pitch-name">
          ${FZ_esc(nome)}
        </div>

      </div>
    `;
  });

  html += `
        </div>

  return html;
}

    FZ_futsalAoVivo =
      false;

    FZ_carregarFutsal();
  }


  async function FZ_futsalLive(){

    FZ_futsalData =
      new Date();

    FZ_futsalAoVivo =
      true;

    await FZ_carregarFutsal();
  }


  /* =======================================================
     VOLTAR AO FUTEBOL
     ======================================================= */

  function FZ_voltarFutebol(){

    const botao =
      document.getElementById("fzBtnFutsal");

    if(botao)
      botao.classList.remove("ativo");

    try{

      if(typeof FZ_modo!=="undefined")
        FZ_modo="jogos";

      if(typeof FZ_renderizar==="function"){
        FZ_renderizar();
        return;
      }

      if(typeof FZ_carregarJogos==="function"){
        FZ_carregarJogos();
        return;
      }

    }catch(e){}

    location.reload();
  }


  /* =======================================================
     EXPORTAÇÕES
     ======================================================= */

  window.FZ_abrirFutsal =
    FZ_abrirFutsal;

  window.FZ_carregarFutsal =
    FZ_carregarFutsal;

  window.FZ_futsalDia =
    FZ_futsalDia;

  window.FZ_futsalHoje =
    FZ_futsalHoje;

  window.FZ_futsalOntem =
    FZ_futsalOntem;

  window.FZ_futsalAmanha =
    FZ_futsalAmanha;

  window.FZ_futsalLive =
    FZ_futsalLive;

  window.FZ_futsalDetalhe =
    FZ_futsalDetalhe;

  window.FZ_voltarFutebol =
    FZ_voltarFutebol;


  /* =======================================================
     INICIALIZAÇÃO
     ======================================================= */

  function FZ_iniciarFutsal(){

    FZ_criarBotaoFutsal();

  }

  if(document.readyState==="loading"){

    document.addEventListener(
      "DOMContentLoaded",
      FZ_iniciarFutsal
    );

  }else{

    FZ_iniciarFutsal();

  }

  setTimeout(
    FZ_iniciarFutsal,
    1000
  );

  setTimeout(
    FZ_iniciarFutsal,
    3000
  );

})();

/* =========================================================
   FIM DO BLOCO 4
   ========================================================= */
      <script>
/* =========================================================
   FUTZONE — BLOCO 5
   LIGAÇÕES / CLIQUES / NAVEGAÇÃO
   ========================================================= */

(function(){

  function FZ_txt(el){
    return (el?.textContent || "")
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase();
  }


  /* =======================================================
     BOTÕES PRINCIPAIS
     ======================================================= */

  function FZ_ligarBotoes(){

    const botoes =
      document.querySelectorAll("button");

    botoes.forEach(btn=>{

      if(btn.dataset.fzLigado==="1")
        return;

      const texto = FZ_txt(btn);

      /* FUTSAL */

      if(
        texto.includes("futsal") &&
        typeof FZ_abrirFutsal==="function"
      ){

        btn.addEventListener(
          "click",
          function(e){
            e.stopPropagation();
            FZ_abrirFutsal();
          }
        );

        btn.dataset.fzLigado="1";
        return;
      }


      /* TABELAS */

      if(
        texto.includes("tabelas") ||
        texto.includes("classificação")
      ){

        if(typeof FZ_tabelas==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_tabelas();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }

        if(typeof FZ_mostrarTabelas==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_mostrarTabelas();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }
      }


      /* JORNADAS */

      if(texto.includes("jornadas")){

        if(typeof FZ_jornadas==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_jornadas();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }

        if(typeof FZ_mostrarJornadas==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_mostrarJornadas();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }
      }


      /* AO VIVO */

      if(
        texto.includes("ao vivo") ||
        texto.includes("ao vivo")
      ){

        if(typeof FZ_aoVivo==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_aoVivo();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }

        if(typeof FZ_mostrarAoVivo==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_mostrarAoVivo();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }

        if(typeof FZ_carregarAoVivo==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_carregarAoVivo();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }
      }


      /* FAVORITOS */

      if(
        texto.includes("favoritos") ||
        texto.includes("favorito")
      ){

        if(typeof FZ_favoritos==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_favoritos();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }

        if(typeof FZ_mostrarFavoritos==="function"){

          btn.addEventListener(
            "click",
            function(e){
              e.preventDefault();
              e.stopPropagation();
              FZ_mostrarFavoritos();
            }
          );

          btn.dataset.fzLigado="1";
          return;
        }
      }

    });

  }


  /* =======================================================
     GARANTIR QUE CARTÕES DE JOGO ABREM
     ======================================================= */

  document.addEventListener(
    "click",
    function(e){

      let card =
        e.target.closest(
          ".fz-game,.game-card,.match-card,.card-jogo"
        );

      if(!card)
        return;

      /* Se clicou num botão/equipa,
         não abrir novamente o jogo */

      if(
        e.target.closest("button") ||
        e.target.closest(".fz-game-team")
      ){
        return;
      }

      const onclick =
        card.getAttribute("onclick");

      if(onclick)
        return;

      const id =
        card.dataset.eventId ||
        card.dataset.id;

      const liga =
        card.dataset.liga ||
        card.dataset.league;

      if(
        id &&
        typeof FZ_abrirJogoSeguro==="function"
      ){

        FZ_abrirJogoSeguro(
          id,
          liga
        );
      }

    },
    true
  );


  /* =======================================================
     CLUBES — GARANTIR CLIQUE
     ======================================================= */

  document.addEventListener(
    "click",
    function(e){

      const equipa =
        e.target.closest(
          "[data-team-id],[data-equipa-id]"
        );

      if(!equipa)
        return;

      const id =
        equipa.dataset.teamId ||
        equipa.dataset.equipaId;

      const nome =
        equipa.dataset.teamName ||
        equipa.dataset.equipaNome ||
        equipa.textContent.trim();

      const liga =
        equipa.dataset.league ||
        equipa.dataset.liga ||
        window.FZ_ultimaLigaEquipa ||
        (
          typeof FZ_ligaSelecionada!=="undefined"
          ? FZ_ligaSelecionada
          : "por.1"
        );

      if(
        id &&
        typeof FZ_abrirEquipaSeguro==="function"
      ){

        e.preventDefault();
        e.stopPropagation();

        FZ_abrirEquipaSeguro(
          id,
          nome,
          liga
        );
      }

    },
    true
  );


  /* =======================================================
     TABELAS / JORNADAS / AO VIVO
     TAMBÉM FUNCIONAM POR TEXTO
     ======================================================= */
<script>
/* =========================================================
   FUTZONE — CORREÇÃO FINAL DE CLIQUES
   NÃO ALTERA A LÓGICA DOS JOGOS/DATAS
   ========================================================= */

(function(){

  "use strict";

  function fzExiste(nome){
    return typeof window[nome] === "function";
  }

  function fzChamar(nome, args){
    try{
      if(fzExiste(nome)){
        return window[nome].apply(window, args || []);
      }
    }catch(e){
      console.error("FUTZONE:", nome, e);
    }
  }

  /* =======================================================
     BOTÕES PRINCIPAIS
     ======================================================= */

  function FZ_ligarBotoes(){

    /* TABELAS */

    const tabelas = [
      document.getElementById("navTabelas"),
      document.getElementById("btnTabelas"),
      document.querySelector('[data-modo="tabelas"]'),
      document.querySelector('[data-action="tabelas"]')
    ].filter(Boolean);

    tabelas.forEach(function(btn){

      if(btn.dataset.fzLigado === "1")
        return;

      btn.dataset.fzLigado = "1";

      btn.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(fzExiste("FZ_mostrarTabelas"))
          return fzChamar("FZ_mostrarTabelas");

        if(fzExiste("FZ_carregarTabelas"))
          return fzChamar("FZ_carregarTabelas");

        if(fzExiste("FZ_renderizarTabelas"))
          return fzChamar("FZ_renderizarTabelas");

        if(fzExiste("FZ_modoTabelas"))
          return fzChamar("FZ_modoTabelas");

        console.warn("FUTZONE: função das tabelas não encontrada.");
      },true);
    });


    /* FAVORITOS */

    const favoritos = [
      document.getElementById("navFav"),
      document.getElementById("btnFavoritos"),
      document.getElementById("btnFav"),
      document.querySelector('[data-modo="favoritos"]'),
      document.querySelector('[data-action="favoritos"]')
    ].filter(Boolean);

    favoritos.forEach(function(btn){

      if(btn.dataset.fzLigado === "1")
        return;

      btn.dataset.fzLigado = "1";

      btn.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(fzExiste("FZ_mostrarFavoritos"))
          return fzChamar("FZ_mostrarFavoritos");

        if(fzExiste("FZ_carregarFavoritos"))
          return fzChamar("FZ_carregarFavoritos");

        if(fzExiste("FZ_renderizarFavoritos"))
          return fzChamar("FZ_renderizarFavoritos");

        if(fzExiste("FZ_abrirFavoritos"))
          return fzChamar("FZ_abrirFavoritos");

        console.warn("FUTZONE: função dos favoritos não encontrada.");
      },true);
    });


    /* AO VIVO */

    const live = [
      document.getElementById("btnAoVivo"),
      document.getElementById("btnLive"),
      document.getElementById("aoVivo"),
      document.querySelector('[data-modo="live"]'),
      document.querySelector('[data-action="live"]')
    ].filter(Boolean);

    live.forEach(function(btn){

      if(btn.dataset.fzLigado === "1")
        return;

      btn.dataset.fzLigado = "1";

      btn.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(fzExiste("FZ_abrirAoVivo"))
          return fzChamar("FZ_abrirAoVivo");

        if(fzExiste("FZ_carregarAoVivo"))
          return fzChamar("FZ_carregarAoVivo");

        if(fzExiste("FZ_mostrarAoVivo"))
          return fzChamar("FZ_mostrarAoVivo");

        if(fzExiste("FZ_aoVivo"))
          return fzChamar("FZ_aoVivo");

        console.warn("FUTZONE: função AO VIVO não encontrada.");
      },true);
    });


    /* =====================================================
       FUTSAL
       ===================================================== */

    const futsal = document.getElementById("fzBtnFutsal");

    if(futsal && futsal.dataset.fzLigado !== "1"){

      futsal.dataset.fzLigado = "1";

      futsal.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        fzChamar("FZ_abrirFutsal");

      },true);
    }

  }


  /* =======================================================
     CLIQUE DE EQUIPAS
     Evita que o onclick antigo fique bloqueado
     ======================================================= */

  document.addEventListener("click",function(e){

    let el =
      e.target.closest(
        "[data-equipa-id],[data-team-id],[data-teamid]"
      );

    if(!el)
      return;

    const id =
      el.dataset.equipaId ||
      el.dataset.teamId ||
      el.dataset.teamid;

    if(!id)
      return;

    const nome =
      el.dataset.equipaNome ||
      el.dataset.teamName ||
      el.textContent.trim();

    const liga =
      el.dataset.liga ||
      el.dataset.league ||
      window.FZ_ultimaLigaEquipa ||
      window.FZ_ligaSelecionada ||
      "por.1";

    e.preventDefault();
    e.stopPropagation();

    if(fzExiste("FZ_abrirEquipaSeguro"))
      fzChamar(
        "FZ_abrirEquipaSeguro",
        [id,nome,liga]
      );
    else
      fzChamar(
        "FZ_abrirEquipa",
        [id,nome,liga]
      );

  },true);


  <script>
/* =========================================================
   FUTZONE — LIGAÇÃO FINAL DOS BOTÕES
   USA OS IDs REAIS DO INDEX
   NÃO ALTERA JOGOS/DATAS
   ========================================================= */

(function(){

  function FZ_clickFuncao(nome){

    try{
      if(typeof window[nome] === "function"){
        window[nome]();
        return true;
      }
    }catch(e){
      console.error("FUTZONE:",nome,e);
    }

    return false;
  }


  function FZ_ligarBotoes(){

    /* =====================================================
       JOGOS
       ===================================================== */

    const jogos =
      document.getElementById("btnJogos");

    if(jogos && jogos.dataset.fzClick !== "1"){

      jogos.dataset.fzClick = "1";

      jogos.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_carregarJogos"))
          return;

        if(FZ_clickFuncao("FZ_renderizar"))
          return;

        window.FZ_modo = "jogos";

      },true);
    }


    const navJogos =
      document.getElementById("navJogos");

    if(navJogos && navJogos.dataset.fzClick !== "1"){

      navJogos.dataset.fzClick = "1";

      navJogos.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        FZ_clickFuncao("FZ_carregarJogos") ||
        FZ_clickFuncao("FZ_renderizar");

      },true);
    }


    /* =====================================================
       JORNADAS
       ===================================================== */

    const jornadas =
      document.getElementById("btnJornadas");

    if(jornadas && jornadas.dataset.fzClick !== "1"){

      jornadas.dataset.fzClick = "1";

      jornadas.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_mostrarJornadas"))
          return;

        if(FZ_clickFuncao("FZ_carregarJornadas"))
          return;

        if(FZ_clickFuncao("FZ_renderizarJornadas"))
          return;

        console.warn(
          "FUTZONE: função das jornadas não encontrada."
        );

      },true);
    }


    /* =====================================================
       TABELAS
       ===================================================== */

    const tabelas =
      document.getElementById("btnTabelas");

    if(tabelas && tabelas.dataset.fzClick !== "1"){

      tabelas.dataset.fzClick = "1";

      tabelas.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_mostrarTabelas"))
          return;

        if(FZ_clickFuncao("FZ_carregarTabelas"))
          return;

        if(FZ_clickFuncao("FZ_renderizarTabelas"))
          return;

        console.warn(
          "FUTZONE: função das tabelas não encontrada."
        );

      },true);
    }


    const navTabelas =
      document.getElementById("navTabelas");

    if(navTabelas && navTabelas.dataset.fzClick !== "1"){

      navTabelas.dataset.fzClick = "1";

      navTabelas.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_mostrarTabelas"))
          return;

        if(FZ_clickFuncao("FZ_carregarTabelas"))
          return;

        FZ_clickFuncao("FZ_renderizarTabelas");

      },true);
    }


    /* =====================================================
       AO VIVO
       ===================================================== */

    const live =
      document.getElementById("btnLive");

    if(live && live.dataset.fzClick !== "1"){

      live.dataset.fzClick = "1";

      live.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_abrirAoVivo"))
          return;

        if(FZ_clickFuncao("FZ_carregarAoVivo"))
          return;

        if(FZ_clickFuncao("FZ_mostrarAoVivo"))
          return;

        console.warn(
          "FUTZONE: função AO VIVO não encontrada."
        );

      },true);
    }


    /* =====================================================
       FAVORITOS
       ===================================================== */

    const favoritos =
      document.getElementById("navFavoritos");

    if(favoritos && favoritos.dataset.fzClick !== "1"){

      favoritos.dataset.fzClick = "1";

      favoritos.addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        if(FZ_clickFuncao("FZ_mostrarFavoritos"))
          return;

        if(FZ_clickFuncao("FZ_carregarFavoritos"))
          return;

        if(FZ_clickFuncao("FZ_renderizarFavoritos"))
          return;

        if(FZ_clickFuncao("FZ_abrirFavoritos"))
          return;

        console.warn(
          "FUTZONE: função FAVORITOS não encontrada."
        );

      },true);
    }

  }


  /* =======================================================
     EXECUTAR
     ======================================================= */

  function FZ_reforcar(){

    FZ_ligarBotoes();

  }


  FZ_reforcar();

  setTimeout(FZ_reforcar,300);
  setTimeout(FZ_reforcar,1000);
  setTimeout(FZ_reforcar,2000);


  const observer =
    new MutationObserver(function(){

      FZ_reforcar();

    });

  observer.observe(
    document.body,
    {
      childList:true,
      subtree:true
    }
  );


  window.FZ_ligarBotoes =
    FZ_ligarBotoes;

})();
</script>
