.score{text-align:center;font-size:18px;font-weight:1000}

.live{color:#FF5365;font-weight:1000}
.fav{border:0;background:none;color:#596D82;font-size:20px;padding:0}
.fav.on{color:#FFD43B}
.loading{text-align:center;padding:30px;color:#91A5BA;font-size:13px}

.tableWrap{overflow-x:auto;background:#09111C;border:1px solid #162B40;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:9px 6px;border-bottom:1px solid #14283B;text-align:center}

.event{padding:9px 0;border-bottom:1px solid #14283B;font-size:12px}

.playerItem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #14283B}

.playerInfo{min-width:0;flex:1}

.playerMeta{font-size:10px;color:#73879B;margin-top:2px}
.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(3,6,11,.97);border-top:1px solid #18314A;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}

.detailHeader{position:sticky;top:0;z-index:2;background:#07111C;border-bottom:1px solid #18314A;display:flex;align-items:center;padding:12px}

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function normalizarData(v){const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function hojeISO(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10).replaceAll("-","")}
function formatarData(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"2-digit"}):""}
function dataCurta(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"}):""}
function horaEvento(e){const d=normalizarData(e?.date);return d?d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}):"--:--"}
function nomeEquipa(t){return t?.displayName||t?.shortDisplayName||t?.name||"Equipa"}
function logoEquipa(t){return t?.logo||t?.logos?.[0]?.href||""}
function isLive(e){return e?.status?.type?.state==="in"||e?.status?.type?.name==="STATUS_IN_PROGRESS"}
function isFinal(e){return e?.status?.type?.completed===true||e?.status?.type?.state==="post"||e?.status?.type?.name==="STATUS_FINAL"}
function getCompeticao(id){return ligas.find(x=>x[0]===id)?.[1]||id}
function favoritoJogo(id){return favoritosJogos.includes(String(id))}
function guardarFavoritos(){localStorage.setItem("futzone_jogos_favoritos",JSON.stringify(favoritosJogos));localStorage.setItem("futzone_equipas_favoritas",JSON.stringify(favoritosEquipas))}
async function fetchJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function makeFallbackEvent(liga,row,i){const [date,home,away,hs,as]=row;const final=hs!==null&&as!==null;return {id:`fz-${liga}-${date}-${i}-${home.replace(/\W+/g,"")}`,date,name:`${home} vs ${away}`,league:{name:getCompeticao(liga)},competitions:[{league:{name:getCompeticao(liga)},competitors:[{id:`${liga}-h-${i}`,homeAway:"home",team:{displayName:home,shortDisplayName:home} ,...(final?{score:String(hs)}:{})},{id:`${liga}-a-${i}`,homeAway:"away",team:{displayName:away,shortDisplayName:away},...(final?{score:String(as)}:{})}],status:{type:{state:final?"post":"pre",completed:final}}}],__futzoneLiga:liga,__fallback:true}}
function fallbackGames(liga){return (FALLBACK[liga]?.games||[]).map((x,i)=>makeFallbackEvent(liga,x,i)).filter(e=>{const d=new Date(e.date);const now=new Date();return d>=new Date(now.getTime()-8*86400000)&&d<=new Date(now.getTime()+45*86400000)})}
async function buscarJogosLiga(liga){let eventos=[];const pedidos=[];for(let i=-7;i<=14;i++){const url=API+encodeURIComponent(liga)+"/scoreboard?dates="+hojeISO(i);pedidos.push(fetchJSON(url).then(x=>x.events||[]).catch(()=>[]))}const rs=await Promise.all(pedidos);rs.flat().forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});if(["por.2","por.3","por.w.1"].includes(liga)){const fb=fallbackGames(liga);fb.forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});if(liga==="por.w.1"&&!eventos.length)eventos=fb}eventos.sort((a,b)=>new Date(a.date)-new Date(b.date));return eventos}

async function fzBuscarWikidataJogador(nome){
 try{
  const q=encodeURIComponent(nome);
  const r=await Promise.race([fetch("https://www.wikidata.org/w/api.php?action=wbsearchentities&search="+q+"&language=pt&format=json&origin=*",{cache:"no-store"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))]);
  if(!r.ok)return null;
  const d=await r.json();return d?.search?.[0]?.id||null;
 }catch(e){return null}
}
async function fzDadosWikidata(qid){
 try{
  const r=await Promise.race([fetch("https://www.wikidata.org/wiki/Special:EntityData/"+encodeURIComponent(qid)+".json",{cache:"no-store"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))]);
  if(!r.ok)return null;
  const d=await r.json();return d?.entities?.[qid]||null;
 }catch(e){return null}
}

}
function fzAbrirJogador(id,nome,liga){
 id=decodeURIComponent(id||"");nome=decodeURIComponent(nome||"Jogador");liga=decodeURIComponent(liga||ligaAtual);
 document.getElementById("overlay").classList.add("show");document.getElementById("overlayTitle").textContent=nome;
 document.getElementById("overlayBody").innerHTML='<div class="loading">⏳ A carregar jogador...</div>';
 (async()=>{
  let a={};
  try{
   if(id){
    const url=API+encodeURIComponent(liga)+"/athletes/"+encodeURIComponent(id);
    const d=await Promise.race([fetchJSON(url),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),7000))]);
    a=d?.athlete||d||{};
   }
  }catch(e){}
  let wd=null,qid=null;
  if(!a.displayName&&!a.fullName||!(a.teams?.length||a.teamHistory?.length||a.history?.length)){
   qid=await fzBuscarWikidataJogador(nome);
   if(qid)wd=await fzDadosWikidata(qid);
  }
  const nomeFinal=a.displayName||a.fullName||wd?.labels?.pt?.value||wd?.labels?.en?.value||nome;
  const nat=a.nationality?.displayName||a.nationality||"";
  const dob=a.dateOfBirth||a.birthDate||"";
  const height=a.displayHeight||a.height||"";
  const weight=a.displayWeight||a.weight||"";
  let hist=[...(a.teams||[]),...(a.teamHistory||[]),...(a.history||[])].map(x=>typeof x==="string"?x:x?.displayName||x?.name||x?.team?.displayName).filter(Boolean);
  if(wd){
   const claims=wd.claims||{};
   const membros=claims.P54||[];
   for(const c of membros.slice(0,20)){
    const v=c?.mainsnak?.datavalue?.value?.id;if(!v)continue;
    try{
     const te=await fzDadosWikidata(v);const label=te?.labels?.pt?.value||te?.labels?.en?.value;
     if(label)hist.push(label)
    }catch(e){}
   }
  }
  hist=[...new Set(hist)];
  const nacionalidade=nat||((wd?.claims?.P27?.[0]?.mainsnak?.datavalue?.value?.id)||"");
  const dataNasc=dob||((wd?.claims?.P569?.[0]?.mainsnak?.datavalue?.value?.time||"").replace(/^\+/,"").split("T")[0]||"");
  const foto=a.headshot?.href||"";
  document.getElementById("overlayBody").innerHTML=`
  <div class="detailCard" style="text-align:center">
   ${foto?`<img src="${escapeHtml(foto)}" style="width:90px;height:90px;object-fit:contain;border-radius:50%">`:""}
   <h3>👤 ${escapeHtml(nomeFinal)}</h3>
   <div style="color:var(--muted)">${escapeHtml(a.position?.displayName||a.position?.name||"Jogador")}</div>
  </div>
  <div class="detailCard"><h3>📊 Dados</h3><div style="color:var(--muted);font-size:13px">Nacionalidade: ${escapeHtml(nacionalidade||"-")}<br>Data de nascimento: ${escapeHtml(dataNasc||"-")}<br>Altura: ${escapeHtml(height||"-")}<br>Peso: ${escapeHtml(weight||"-")}</div></div>
  <div class="detailCard"><h3>📚 Histórico de clubes</h3>${hist.length?hist.map(x=>`<div class="event">${escapeHtml(x)}</div>`).join(""):'<div style="color:var(--muted);font-size:13px">O histórico deste jogador não está disponível nas fontes consultadas.</div>'}</div>`;
 })()
}

function fzSelecionarFutsal(id){fzFutsalCompeticao=id;renderizarFutsalJogos()}
function futsalTab(tab,btn){document.querySelectorAll("#futsalSection .filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");if(tab==="jogos")renderizarFutsalJogos();if(tab==="tabela")renderizarFutsalTabela();if(tab==="equipas")renderizarFutsalEquipas();if(tab==="competicoes")renderizarFutsalCompeticoes()}

function renderizarFutsalTabela(){const c=document.getElementById("futsalContent");c.innerHTML=`${fzFutsalBar()}<div class="detailCard"><h3>🏆 ${escapeHtml(fzFutsalNome(fzFutsalCompeticao))}</h3><div style="color:var(--muted);font-size:12px">Classificação oficial da competição.</div><a href="https://resultados.fpf.pt/" target="_blank" rel="noopener" style="display:block;margin-top:12px;text-align:center;padding:12px;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;text-decoration:none">CONSULTAR CLASSIFICAÇÃO FPF</a></div>`}
function renderizarFutsalEquipas(){const c=document.getElementById("futsalContent");c.innerHTML=`${fzFutsalBar()}<div class="detailCard"><h3>🥅 Equipas — ${escapeHtml(fzFutsalNome(fzFutsalCompeticao))}</h3><div style="color:var(--muted);font-size:12px">Equipas da competição oficial. A lista é carregada a partir da fonte FPF quando disponível.</div><a href="https://resultados.fpf.pt/" target="_blank" rel="noopener" style="display:block;margin-top:12px;text-align:center;padding:12px;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;text-decoration:none">VER EQUIPAS NA FPF</a></div>`}
function renderizarFutsalCompeticoes(){document.getElementById("futsalContent").innerHTML=`<div class="fzFutsalBar">${FZ_FUTSAL_COMPETICOES.map(x=>`<button class="fzFutsalChip ${x.id===fzFutsalCompeticao?"active":""}" onclick="fzSelecionarFutsal('${x.id}')"><span>${x.emoji}</span><b>${escapeHtml(x.nome)}</b><small>${escapeHtml(x.tipo)}</small></button>`).join("")}</div>`}
