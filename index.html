<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;
  --text:#F5F7FA;
  --muted:#9DAABB;
  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
  --white:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:78px;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
}

.header{
  position:sticky;
  top:0;
  z-index:30;
  padding:16px 15px 13px;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue2);
}

.subtitle{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
  letter-spacing:1.3px;
  font-weight:700;
}

.sportSwitch{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.sportBtn{
  flex:1;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:10px 12px;
  border-radius:12px;
  font-weight:800;
}

.sportBtn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

main{
  padding:14px;
}

.sectionTitle{
  font-size:17px;
  font-weight:900;
  margin:5px 0 10px;
}

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.league{
  flex:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:12px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
}

.league.active{
  color:white;
  background:var(--blue3);
  border-color:var(--blue2);
}

.liveAll{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin:3px 0 12px;
  background:linear-gradient(135deg,#8f0012,#e01832);
  color:white;
  font-weight:900;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.filter.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.search{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  color:white;
  border-radius:12px;
  padding:12px;
  outline:none;
  margin-bottom:12px;
}

.search:focus{
  border-color:var(--blue2);
}

.loading,
.empty,
.error{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px 15px;
  text-align:center;
  color:var(--muted);
}

.error{
  color:#ff9ba6;
}

.dayTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 2px 8px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.game{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
  margin-bottom:9px;
  cursor:pointer;
}

.game:active{
  transform:scale(.99);
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.comp{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  font-size:10px;
  font-weight:900;
  color:var(--muted);
}

.status.live{
  color:var(--red);
}

.status.final{
  color:var(--green);
}

.teams{
  display:grid;
  grid-template-columns:1fr 58px 1fr;
  align-items:center;
  gap:7px;
}

.team{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.teamLogo{
  width:28px;
  height:28px;
  object-fit:contain;
  flex:none;
}

.teamName{
  font-size:13px;
  font-weight:800;
  line-height:1.15;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.scoreTime{
  text-align:center;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}

.star{
  border:0;
  background:none;
  color:#657284;
  font-size:21px;
  padding:2px;
}

.star.on{
  color:var(--yellow);
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  max-width:720px;
  margin:auto;
  height:68px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(9,17,28,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(15px);
}

.navBtn{
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.navBtn.active{
  color:white;
}

.navIcon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:var(--bg);
  overflow-y:auto;
}

.overlay.show{
  display:block;
}

.detailHeader{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:rgba(3,6,11,.96);
  border-bottom:1px solid var(--border);
}

.back{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--panel);
  color:white;
}

.detailTitle{
  font-weight:900;
}

.detailBody{
  padding:15px;
  max-width:720px;
  margin:auto;
}

.heroGame{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px 12px;
  margin-bottom:12px;
}

.heroTeams{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:10px;
}

.heroTeam{
  text-align:center;
  font-weight:900;
}

.heroLogo{
  width:50px;
  height:50px;
  object-fit:contain;
  display:block;
  margin:0 auto 8px;
}

.heroScore{
  text-align:center;
  font-size:28px;
  font-weight:900;
}

.detailTabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin:12px 0;
}

.detailTab{
  flex:none;
  padding:9px 12px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.detailTab.active{
  background:var(--blue);
  color:white;
}

.detailCard{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
}

.detailCard h3{
  margin:0 0 12px;
  font-size:15px;
}

.event{
  display:flex;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.event:last-child{
  border-bottom:0;
}

.eventTime{
  color:var(--muted);
  width:35px;
}

.tableWrap{
  overflow-x:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:480px;
}

th,td{
  padding:10px 8px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:12px;
}

th{
  color:var(--muted);
  font-size:10px;
}

td:first-child,
th:first-child{
  text-align:left;
}

.pos{
  width:25px;
  color:var(--muted);
}

.teamTable{
  display:flex;
  align-items:center;
  gap:7px;
}

.tableLogo{
  width:23px;
  height:23px;
  object-fit:contain;
}

.futsal{
  display:none;
}

.futsal.show{
  display:block;
}

.futsalCourt{
  position:relative;
  height:420px;
  border:3px solid white;
  border-radius:8px;
  margin-top:15px;
  background:#064f37;
  overflow:hidden;
}

.courtMid{
  position:absolute;
  top:50%;
  left:0;
  right:0;
  border-top:2px solid white;
}

.courtCircle{
  position:absolute;
  width:100px;
  height:100px;
  border:2px solid white;
  border-radius:50%;
  top:calc(50% - 50px);
  left:calc(50% - 50px);
}

.goal{
  position:absolute;
  width:70px;
  height:125px;
  border:2px solid white;
  top:calc(50% - 62px);
}

.goal.left{
  left:-2px;
}

.goal.right{
  right:-2px;
}

.playerDot{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--blue2);
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
}

.hide{
  display:none!important;
}

@media(min-width:700px){
  main{
    padding:18px;
  }
}
  /* =========================================================
   FUTZONE — DETALHE DO JOGO / CAMPO 11 TITULARES
   Mantém o design existente
   ========================================================= */

.matchStatsGrid{
  display:grid;
  gap:10px;
}

.statRow{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.statTeam{
  font-weight:900;
}

.statTeam.home{
  text-align:right;
}

.statName{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.statBar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
  margin-top:3px;
}

.statBar span{
  height:4px;
  background:var(--border);
  border-radius:10px;
  overflow:hidden;
}

.statBar span:first-child{
  background:var(--blue2);
}

.statBar span:last-child{
  background:var(--blue3);
}

.footballPitch{
  position:relative;
  width:100%;
  height:560px;
  margin-top:12px;
  border:3px solid #fff;
  border-radius:10px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      90deg,
      #075b3d 0,
      #075b3d 50px,
      #086443 50px,
      #086443 100px
    );
}

.pitchHalf{
  position:absolute;
  top:50%;
  left:0;
  right:0;
  border-top:2px solid rgba(255,255,255,.9);
}

.pitchCircle{
  position:absolute;
  width:105px;
  height:105px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:50%;
  top:calc(50% - 52px);
  left:calc(50% - 52px);
}

.pitchCenter{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  left:calc(50% - 5px);
  top:calc(50% - 5px);
}

.pitchBox{
  position:absolute;
  width:145px;
  height:85px;
  left:calc(50% - 72px);
  border:2px solid rgba(255,255,255,.9);
}

.pitchBox.top{
  top:-2px;
}

.pitchBox.bottom{
  bottom:-2px;
}

.pitchSmallBox{
  position:absolute;
  width:65px;
  height:35px;
  left:calc(50% - 32px);
  border:2px solid rgba(255,255,255,.9);
}

.pitchSmallBox.top{
  top:-2px;
}

.pitchSmallBox.bottom{
  bottom:-2px;
}

.pitchGoal{
  position:absolute;
  width:55px;
  height:10px;
  border:2px solid white;
  left:calc(50% - 27px);
}

.pitchGoal.top{
  top:-3px;
}

.pitchGoal.bottom{
  bottom:-3px;
}

.pitchPlayer{
  position:absolute;
  transform:translate(-50%,-50%);
  width:62px;
  text-align:center;
  z-index:3;
}

.pitchPlayerDot{
  width:32px;
  height:32px;
  margin:auto;
  border-radius:50%;
  background:var(--blue2);
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}

.pitchPlayer.away .pitchPlayerDot{
  background:var(--blue3);
}

.pitchPlayerName{
  margin-top:3px;
  font-size:8px;
  line-height:1.1;
  font-weight:900;
  color:white;
  text-shadow:0 1px 3px #000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.lineupLegend{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.lineupLegend span{
  display:flex;
  align-items:center;
  gap:5px;
}

.lineupDot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--blue2);
  border:1px solid white;
}

.lineupDot.away{
  background:var(--blue3);
}

.playerList{
  display:grid;
  gap:7px;
}

.playerItem{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  border-bottom:1px solid var(--border);
}

.playerItem:last-child{
  border-bottom:0;
}

.playerNumber{
  width:28px;
  height:28px;
  border-radius:8px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:var(--muted);
}

.playerInfo{
  min-width:0;
  flex:1;
}

.playerName{
  font-size:12px;
  font-weight:900;
}

.playerPosition{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.teamLineupTitle{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:13px;
  font-weight:900;
}

.teamLineupTitle img{
  width:25px;
  height:25px;
  object-fit:contain;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="subtitle">FUTEBOL EM DIRETO</div>

  <div class="sportSwitch">
    <button class="sportBtn active" id="btnFutebol" onclick="mudarDesporto('futebol')">⚽ Futebol</button>
    <button class="sportBtn" id="btnFutsal" onclick="mudarDesporto('futsal')">🥅 Futsal</button>
  </div>
</header>

<main>

<section id="footballSection">

  <div class="sectionTitle">Competições</div>

  <div class="leagues" id="leagueList"></div>

  <button class="liveAll" onclick="mostrarTodosLive()">🔴 LIVE — TODAS AS LIGAS</button>

  <input
    class="search"
    id="searchInput"
    type="search"
    placeholder="🔎 Procurar equipa..."
    oninput="renderizarJogos()"
  >

  <div class="filters">
    <button class="filter active" data-filter="todos" onclick="setFiltro('todos')">Todos</button>
    <button class="filter" data-filter="live" onclick="setFiltro('live')">🔴 Live</button>
    <button class="filter" data-filter="proximos" onclick="setFiltro('proximos')">Próximos</button>
    <button class="filter" data-filter="resultados" onclick="setFiltro('resultados')">Resultados</button>
  </div>

  <div id="footballContent"></div>

</section>

<section id="futsalSection" class="futsal">

  <div class="sectionTitle">🥅 Futsal</div>

  <div class="filters">
    <button class="filter active" onclick="futsalTab('jogos',this)">Jogos</button>
    <button class="filter" onclick="futsalTab('tabela',this)">Tabela</button>
    <button class="filter" onclick="futsalTab('equipas',this)">Equipas</button>
    <button class="filter" onclick="futsalTab('competicoes',this)">Competições</button>
  </div>

  <div id="futsalContent"></div>

</section>

</main>

<nav class="bottomNav">
  <button class="navBtn active" id="navJogos" onclick="irJogos()">
    <span class="navIcon">⚽</span>Jogos
  </button>

  <button class="navBtn" id="navTabelas" onclick="mostrarTabelaFutebol()">
    <span class="navIcon">🏆</span>Tabelas
  </button>

  <button class="navBtn" id="navFav" onclick="mostrarFavoritos()">
    <span class="navIcon">⭐</span>Favoritos
  </button>

  <button class="navBtn" id="navFutsal" onclick="mudarDesporto('futsal')">
    <span class="navIcon">🥅</span>Futsal
  </button>
</nav>

</div>

<div class="overlay" id="overlay">

  <div class="detailHeader">
    <button class="back" onclick="fecharOverlay()">←</button>
    <div class="detailTitle" id="overlayTitle">Detalhes</div>
  </div>

  <div class="detailBody" id="overlayBody"></div>

</div>

<script>
/* =========================================================
   FUTZONE
   VERSÃO ORGANIZADA
   Futebol + Futsal
   Liga BPI integrada
   ========================================================= */

const API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ligas = [

  /* PORTUGAL */
  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  /* INGLATERRA */
  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  /* ESPANHA */
  ["esp.1","🇪🇸 La Liga"],
  ["esp.2","🇪🇸 La Liga 2"],

  /* ITÁLIA */
  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  /* ALEMANHA */
  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  /* FRANÇA */
  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  /* OUTROS */
  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],

  /* UEFA */
  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]
];

let ligaAtual = "por.1";
let filtroAtual = "todos";
let jogosFutebol = [];
let desportoAtual = "futebol";

let favoritosJogos =
  JSON.parse(localStorage.getItem("futzone_jogos_favoritos") || "[]");

let favoritosEquipas =
  JSON.parse(localStorage.getItem("futzone_equipas_favoritas") || "[]");


/* =========================================================
   UTILIDADES
   ========================================================= */

function escapeHtml(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function hojeISO(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);

  return d.toISOString().slice(0,10).replaceAll("-","");
}

function normalizarData(data){
  if(!data) return null;

  const d = new Date(data);

  if(Number.isNaN(d.getTime())) return null;

  return d;
}

function formatarData(data){

  const d = normalizarData(data);

  if(!d) return "";

  return d.toLocaleDateString("pt-PT",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit"
  });
}

function dataCurta(data){

  const d = normalizarData(data);

  if(!d) return "";

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  });
}

function horaEvento(evento){

  const d = normalizarData(evento.date);

  if(!d) return "--:--";

  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function nomeEquipa(team){

  if(!team) return "Equipa";

  return team.displayName ||
         team.shortDisplayName ||
         team.name ||
         "Equipa";
}

function logoEquipa(team){

  if(!team) return "";

  return team.logo ||
         team.logos?.[0]?.href ||
         "";
}

function isLive(evento){

  const s = evento?.status;

  if(!s) return false;

  return (
    s.type?.state === "in" ||
    s.type?.name === "STATUS_IN_PROGRESS" ||
    s.type?.description === "In Progress" ||
    s.type?.shortDetail === "LIVE"
  );
}

function isFinal(evento){

  const s = evento?.status;

  if(!s) return false;

  return (
    s.type?.completed === true ||
    s.type?.state === "post" ||
    s.type?.name === "STATUS_FINAL" ||
    s.type?.name === "STATUS_FULL_TIME"
  );
}

function getCompeticao(id){

  const liga = ligas.find(x=>x[0]===id);

  return liga ? liga[1] : id;
}

function favoritoJogo(id){

  return favoritosJogos.includes(String(id));
}

function guardarFavoritos(){

  localStorage.setItem(
    "futzone_jogos_favoritos",
    JSON.stringify(favoritosJogos)
  );

  localStorage.setItem(
    "futzone_equipas_favoritas",
    JSON.stringify(favoritosEquipas)
  );
}

/* =========================================================
   API ESPN
   ========================================================= */

async function fetchJSON(url){

  const resposta = await fetch(url,{
    cache:"no-store"
  });

  if(!resposta.ok){
    throw new Error("Erro HTTP "+resposta.status);
  }

  return await resposta.json();
}


/*
  Carrega vários dias.

  Isto evita depender apenas do scoreboard de hoje,
  permitindo mostrar jogos anteriores e próximos.
*/
async function buscarJogosLiga(liga){

  const eventos = [];

  const pedidos = [];

  for(let i=-3;i<=10;i++){

    const data = hojeISO(i);

    const url =
      API +
      encodeURIComponent(liga) +
      "/scoreboard?dates=" +
      data;

    pedidos.push(
      fetchJSON(url)
        .then(data=>data.events || [])
        .catch(()=>[])
    );
  }

  const resultados = await Promise.all(pedidos);

  resultados.flat().forEach(evento=>{

    if(!eventos.some(x=>String(x.id)===String(evento.id))){
      eventos.push(evento);
    }

  });

  eventos.sort((a,b)=>{

    const da = new Date(a.date).getTime();
    const db = new Date(b.date).getTime();

    return da-db;

  });

  return eventos;
}

/* =========================================================
   FILTROS
   ========================================================= */

function setFiltro(filtro){

  filtroAtual=filtro;

  document.querySelectorAll(".filter").forEach(btn=>{

    if(!btn.dataset.filter) return;

    btn.classList.toggle(
      "active",
      btn.dataset.filter===filtro
    );

  });

  renderizarJogos();
}

function passaFiltro(evento){

  if(filtroAtual==="live"){
    return isLive(evento);
  }

  if(filtroAtual==="resultados"){
    return isFinal(evento) && !isLive(evento);
  }

  if(filtroAtual==="proximos"){
    return !isFinal(evento) && !isLive(evento);
  }

  return true;
}


/* =========================================================
   RENDER JOGOS
   ========================================================= */

function renderizarJogos(){

  const content =
    document.getElementById("footballContent");

  const pesquisa =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  let eventos =
    jogosFutebol
      .filter(passaFiltro)
      .filter(evento=>{

        if(!pesquisa) return true;

        const nomeCasa =
          nomeEquipa(evento.competitions?.[0]?.competitors?.find(
            x=>x.homeAway==="home"
          )?.team).toLowerCase();

        const nomeFora =
          nomeEquipa(evento.competitions?.[0]?.competitors?.find(
            x=>x.homeAway==="away"
          )?.team).toLowerCase();

        return (
          nomeCasa.includes(pesquisa) ||
          nomeFora.includes(pesquisa)
        );

      });

  if(!eventos.length){

    content.innerHTML = `
      <div class="empty">
        <div style="font-size:30px">⚽</div>
        <div style="margin-top:8px">
          Não existem jogos para mostrar neste filtro.
        </div>
      </div>
    `;

    return;
  }

  const grupos={};

  eventos.forEach(evento=>{

    const d =
      new Date(evento.date).toISOString().slice(0,10);

    if(!grupos[d]) grupos[d]=[];

    grupos[d].push(evento);

  });

  let html="";

  Object.keys(grupos)
    .sort()
    .forEach(data=>{

      html += `
        <div class="dayTitle">
          <span>${escapeHtml(formatarData(grupos[data][0].date))}</span>
          <span>${dataCurta(grupos[data][0].date)}</span>
        </div>
      `;

      html += grupos[data]
        .map(cartaoJogo)
        .join("");

    });

  content.innerHTML=html;
}


/* =========================================================
   CARTÃO DO JOGO
   ========================================================= */

function cartaoJogo(evento){

  const comp =
    evento.league?.name ||
    evento.competitions?.[0]?.league?.name ||
    getCompeticao(ligaAtual);

  const competicaoTexto =
    getCompeticao(ligaAtual) || comp;

  const competitors =
    evento.competitions?.[0]?.competitors || [];

  const casa =
    competitors.find(x=>x.homeAway==="home");

  const fora =
    competitors.find(x=>x.homeAway==="away");

  const nomeCasa =
    nomeEquipa(casa?.team);

  const nomeFora =
    nomeEquipa(fora?.team);

  const logoCasa =
    logoEquipa(casa?.team);

  const logoFora =
    logoEquipa(fora?.team);

  const live=isLive(evento);
  const final=isFinal(evento);

  let estado="";

  if(live){
    estado=`<span class="status live">🔴 AO VIVO</span>`;
  }
  else if(final){
    estado=`<span class="status final">FINAL</span>`;
  }
  else{
    estado=`<span class="status">${horaEvento(evento)}</span>`;
  }

  let score="";

  if(live || final){

    score=`
      <div class="score">
        ${escapeHtml(casa?.score ?? "-")}
        -
        ${escapeHtml(fora?.score ?? "-")}
      </div>
    `;

  }else{

    score=`
      <div class="scoreTime">
        ${horaEvento(evento)}
      </div>
    `;

  }

  return `
    <div class="game"
      onclick="abrirJogo('${String(evento.id).replaceAll("'","")}')">

      <div class="gameTop">

        <div class="comp">
          ${escapeHtml(competicaoTexto)}
        </div>

        ${estado}

        <button
          class="star ${favoritoJogo(evento.id)?"on":""}"
          onclick="event.stopPropagation();toggleFavoritoJogo('${String(evento.id).replaceAll("'","")}')"
        >
          ${favoritoJogo(evento.id)?"★":"☆"}
        </button>

      </div>

      <div class="teams">

        <div class="team">

          ${
            logoCasa
            ? `<img class="teamLogo"
                    src="${escapeHtml(logoCasa)}"
                    onerror="this.style.display='none'">`
            : ""
          }

          <div class="teamName">
            ${escapeHtml(nomeCasa)}
          </div>

        </div>

        ${score}

        <div class="team away">

          <div class="teamName">
            ${escapeHtml(nomeFora)}
          </div>

          ${
            logoFora
            ? `<img class="teamLogo"
                    src="${escapeHtml(logoFora)}"
                    onerror="this.style.display='none'">`
            : ""
          }

        </div>

      </div>

    </div>
  `;
}

async function mostrarTodosLive(){

    ligas.map(async liga=>{

      try{

        const data =
          await fetchJSON(
            API+
            encodeURIComponent(liga[0])+

          }

        });

      }catch(e){}

  content.innerHTML =
    resultados.map(evento=>{

      ligaAtual=evento.__futzoneLiga;

      const html=cartaoJogo(evento);

      ligaAtual=antiga;

function extrairTabela(data){

  const resultados=[];

  function procurar(obj){

    if(!obj || typeof obj!=="object") return;

    if(Array.isArray(obj)){

      obj.forEach(procurar);

      return;
    }

    if(
      obj.team &&
      (
        obj.stats ||
        obj.records ||
        obj.note ||
        obj.rank
      )
    ){

      resultados.push(obj);

    }

    Object.values(obj).forEach(valor=>{

      if(
        valor &&
        typeof valor==="object"
      ){
        procurar(valor);
      }

    });

  }

  procurar(data);

  const mapa=new Map();

  resultados.forEach(item=>{

    const id =
      item.team?.id ||
      item.team?.uid ||
      item.team?.displayName;

    if(!id) return;

    if(!mapa.has(id)){
      mapa.set(id,item);
    }

  });

  return [...mapa.values()];
}

function valorStat(item,nomes){

  const stats =
    item.stats ||
    item.records ||
    [];

  for(const nome of nomes){

    const encontrado =
      stats.find(s=>
        s.name===nome ||
        s.abbreviation===nome ||
        s.type===nome
      );

    if(encontrado){

      return encontrado.displayValue ??
             encontrado.value ??
             "0";
    }

  }

  return "0";
}

function numeroStat(item,nomes){

  const v=valorStat(item,nomes);

  const n=parseFloat(String(v).replace(",","."));

  return Number.isFinite(n)?n:0;
}

function renderTabela(tabela){

  tabela.sort((a,b)=>{

    const ra =
      a.rank ??
      numeroStat(a,["rank"]);

    const rb =
      b.rank ??
      numeroStat(b,["rank"]);

    return Number(ra)-Number(rb);

  });

  return `

    <div class="detailCard">
      <h3>${escapeHtml(getCompeticao(ligaAtual))}</h3>
      <div style="color:var(--muted);font-size:12px">
        Classificação atual
      </div>
    </div>

    <div class="tableWrap">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Equipa</th>
            <th>J</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>DG</th>
            <th>Pts</th>
          </tr>
        </thead>

        <tbody>

          ${tabela.map((item,index)=>{

            const team=item.team || {};

            const rank =
              item.rank ??
              index+1;

            const jogos =
              numeroStat(item,[
                "gamesPlayed",
                "GP",
                "played"
              ]);

            const vitorias =
              numeroStat(item,[
                "wins",
                "W"
              ]);

            const empates =
              numeroStat(item,[
                "ties",
                "draws",
                "D"
              ]);

            const derrotas =
              numeroStat(item,[
                "losses",
                "L"
              ]);

            const saldo =
              valorStat(item,[
                "pointDifferential",
                "GD",
                "goalDifference"
              ]);

            const pontos =
              valorStat(item,[
                "points",
                "PTS"
              ]);

            const logo =
              logoEquipa(team);

            return `

              <tr>

                <td class="pos">
                  ${escapeHtml(rank)}
                </td>

                <td>

                  <div class="teamTable">

                    ${
                      logo
                      ? `<img
                           class="tableLogo"
                           src="${escapeHtml(logo)}"
                           onerror="this.style.display='none'"
                         >`
                      : ""
                    }

                    <span>
                      ${escapeHtml(nomeEquipa(team))}
                    </span>

                  </div>

                </td>

                <td>${jogos}</td>
                <td>${vitorias}</td>
                <td>${empates}</td>
                <td>${derrotas}</td>
                <td>${escapeHtml(saldo)}</td>
                <td><strong>${escapeHtml(pontos)}</strong></td>

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}

function futsalTab(tab,button){

  document
    .querySelectorAll("#futsalSection .filter")
    .forEach(x=>x.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  if(tab==="jogos"){
    renderizarFutsalJogos();
  }

  if(tab==="tabela"){
    renderizarFutsalTabela();
  }

  if(tab==="equipas"){
    renderizarFutsalEquipas();
  }

  if(tab==="competicoes"){
    renderizarFutsalCompeticoes();
  }
}

function renderizarFutsalJogos(){

  const el=document.getElementById("futsalContent");

  el.innerHTML=futsalJogos.map(jogo=>`

    <div class="game">

      <div class="gameTop">

        <div class="comp">
          ${escapeHtml(jogo.comp)}
        </div>

        <div class="status">
          ${formatarData(jogo.data)}
        </div>

      </div>

      <div class="teams">

        <div class="team">
          <div class="teamName">
            ${escapeHtml(jogo.casa)}
          </div>
        </div>

        <div class="scoreTime">
          ${horaEvento({date:jogo.data})}
        </div>

        <div class="team away">
          <div class="teamName">
            ${escapeHtml(jogo.fora)}
          </div>
        </div>

      </div>

    </div>

  `).join("");

}

function renderizarFutsalTabela(){

  const el=document.getElementById("futsalContent");

    <div class="tableWrap">

        <thead>
