<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#03060B;
 color:#FFF;
 font-family:Arial,sans-serif
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#09111C;
 border-bottom:1px solid #1B2A3B;
 padding:14px 12px
}

.logo{
 font-size:25px;
 font-weight:900
}

.logo span{
 color:#1683FF
}

.sub{
 font-size:10px;
 color:#9DAABB;
 margin-top:2px
}

main{
 padding:12px 10px 85px;
 max-width:720px;
 margin:auto
}

h2{
 font-size:18px;
 margin:15px 0 10px
}

h3{
 font-size:14px
}

.seletor-ligas{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-bottom:14px
}

.liga-btn{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:10px 5px;
 color:#FFF;
 font-size:12px;
 font-weight:bold
}

.liga-btn.active{
 background:#003B7A;
 border-color:#1683FF
}

.liga-icon{
 display:block;
 font-size:20px;
 margin-bottom:4px
}

/* BOTÕES DE CATEGORIAS */

.categorias-jogos{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:10px 0 14px
}

.categoria-btn{
 background:#09111C;
 border:1px solid #1B2A3B;
 color:#9DAABB;
 border-radius:11px;
 padding:11px 4px;
 font-size:11px;
 font-weight:900
}

.categoria-btn.active{
 background:#003B7A;
 border-color:#1683FF;
 color:#FFF
}

.categoria-icon{
 display:block;
 font-size:19px;
 margin-bottom:4px
}

.categoria-btn.live{
 border-color:#FF4054
}

/* CASINHAS DAS SECÇÕES */

.grupo-jogos{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:13px;
 margin:10px 0;
 padding:10px
}

.grupo-titulo{
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-size:14px;
 font-weight:900;
 padding:2px 2px 10px
}

.grupo-contagem{
 color:#9DAABB;
 font-size:10px;
 font-weight:normal
}

.jogo{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:11px;
 margin-bottom:7px;
 cursor:pointer
}

.jogo:last-child{
 margin-bottom:0
}

.jogo-top{
 display:flex;
 justify-content:space-between;
 color:#9DAABB;
 font-size:10px;
 margin-bottom:8px
}

.equipas{
 display:grid;
 grid-template-columns:1fr 65px 1fr;
 align-items:center;
 gap:5px
}

.equipa{
 text-align:center;
 font-size:12px;
 font-weight:bold
}

.equipa-clicavel{
 cursor:pointer
}

.equipa-clicavel:active{
 opacity:.7
}

.escudo{
 width:31px;
 height:31px;
 object-fit:contain;
 display:block;
 margin:0 auto 4px
}

.resultado{
 text-align:center;
 font-size:18px;
 font-weight:900
}

.estado-live{
 color:#FF4054;
 font-weight:900
}

.estado-final{
 color:#9DAABB
}
