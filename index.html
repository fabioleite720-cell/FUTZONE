<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#07111f;
 color:#fff;
 font-family:Arial,sans-serif;
}

header{
 padding:18px 15px;
 text-align:center;
 background:#0b1728;
 position:sticky;
 top:0;
 z-index:5;
}

header h1{
 margin:0;
 font-size:28px;
}

header p{
 margin:5px 0 0;
 color:#9fb0c4;
 font-size:12px;
}

.wrap{
 max-width:850px;
 margin:auto;
 padding:12px 12px 90px;
}

.filters{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:5px 0 10px;
}

.filters button,
.nav button,
.back,
.favbtn{
 border:0;
 border-radius:10px;
 padding:10px 12px;
 background:#14243a;
 color:#fff;
 font-weight:bold;
}

.filters button.active,
.nav button.active{
 background:#1976d2;
}

.card{
 background:#0d1b2d;
 border:1px solid #1c3048;
 border-radius:14px;
 padding:12px;
 margin:9px 0;
}

.game{
 display:grid;
 grid-template-columns:1fr 70px 1fr;
 gap:8px;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.team{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 font-weight:bold;
}

.team img,
.logo{
 width:34px;
 height:34px;
 object-fit:contain;
}

.score{
 font-size:22px;
 font-weight:bold;
}

.status{
 font-size:11px;
 color:#9fb0c4;
 margin-top:4px;
}

.section{
 font-size:18px;
 margin:15px 2px 8px;
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#0b1728;
 display:flex;
 justify-content:center;
 gap:8px;
 padding:9px;
 z-index:10;
}

.nav button{
 flex:1;
 max-width:180px;
 background:#14243a;
}

.empty{
 text-align:center;
 padding:30px;
 color:#9fb0c4;
}

.back{
 margin-bottom:10px;
}

.teamhead{
 display:flex;
 align-items:center;
 gap:12px;
}

.teamhead h2{
 margin:0;
}

.star{
 font-size:25px;
 margin-left:auto;
 background:none;
 border:0;
 color:#ffd54a;
}

.small{
 font-size:12px;
 color:#9fb0c4;
}

.player{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:9px 0;
 border-bottom:1px solid #1c3048;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:8px 5px;
 border-bottom:1px solid #1c3048;
 text-align:center;
}

th:nth-child(2),
td:nth-child(2){
 text-align:left;
}

.error{
 color:#ff8a80;
}
</style>
</head>

<body>

<header>
 <h1>⚽ FUTZONE</h1>
 <p>Futebol em direto, resultados e estatísticas</p>
</header>

<div class="wrap">
 <div id="app"></div>
</div>

<div class="nav">
 <button id="navJogos" onclick="mostrarJogos()">⚽<br>Jogos</button>
 <button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
 <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;
let ultimaAtualizacao=null;
let intervaloLive=null;

const ligas=[
 {
  nome:"Portugal",
  arquivo:"data/primeira-liga.json"
 },
 {
  nome:"Inglaterra",
  arquivo:"data/premier-league.json"
 },
 {
  nome:"Espanha",
  arquivo:"data/la-liga.json"
 },
 {
  nome:"Itália",
  arquivo:"data/serie-a.json"
 },
 {
  nome:"Alemanha",
  arquivo:"data/bundesliga.json"
 }
];

function esc(x){
 return String(x ?? "").replace(
  /[&<>'"]/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   "'":"&#39;",
   '"':"&quot;"
  }[m])
 );
}

function nomeEquipa(t){
 if(typeof t==="string") return t;

 return t?.name ||
        t?.nome ||
        t?.team?.name ||
        "Equipa";
}

function idEquipa(t){
 return t?.id ??
        t?.team?.id ??
        nomeEquipa(t);
}

function logoEquipa(t){
 return t?.logo ||
        t?.image ||
        t?.team?.logo ||
        t?.team?.crest ||
        "";
}

function obterEquipa(j,casa){

 if(casa){
  return j.homeTeam ||
         j.home ||
         j.home_team ||
         j.teams?.home;
 }

 return j.awayTeam ||
        j.away ||
        j.away_team ||
        j.teams?.away;
}

function resultado(j){

 let h=
  j.homeScore ??
  j.home_score ??
  j.score?.home ??
  j.scores?.home ??
  j.home?.score;

 let a=
  j.awayScore ??
  j.away_score ??
  j.score?.away ??
  j.scores?.away ??
  j.away?.score;

 if(h!=null && a!=null){
  return `${h} - ${a}`;
 }

 return "-";
}

function dataJogo(j){

 return j.date ||
        j.datetime ||
        j.startTime ||
        j.start_time ||
        j.utcDate ||
        j.timestamp ||
        "";
}

function estadoJogo(j){

 let s=String(
  j.status ||
  j.state ||
  j.match_status ||
  j.status?.type?.short ||
  ""
 ).toLowerCase();

 if(
  s.includes("live") ||
  s.includes("progress") ||
  s.includes("1h") ||
  s.includes("2h") ||
  s.includes("inplay")
 ){
  return "🔴 AO VIVO";
 }

 if(
  s.includes("final") ||
  s.includes("finished") ||
  s.includes("complete")
 ){
  return "Final";
 }

 return "Próximo";
}

function ligaDoJogo(j){
 return j.__liga ||
        j.league?.name ||
        j.competition?.name ||
        "Futebol";
}


/* FAVORITOS */

function obterFavoritos(){

 try{
  return JSON.parse(
   localStorage.getItem("futzone_favoritos") || "[]"
  );
 }catch(e){
  return [];
 }
}

function eFavorito(id){

 return obterFavoritos().some(
  x=>String(x.id)===String(id)
 );
}

function alternarFavorito(
 id,
 name,
 league,
 logo
){

 let lista=obterFavoritos();

 let indice=lista.findIndex(
  x=>String(x.id)===String(id)
 );

 if(indice>=0){

  lista.splice(indice,1);

 }else{

  lista.push({
   id:id,
   name:name,
   league:league,
   logo:logo
  });

 }

 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(lista)
 );

 if(equipaAtual){
  mostrarEquipa();
 }else{
  mostrarFavoritos();
 }
}


/* EQUIPAS */

function abrirEquipaPorId(
 id,
 name,
 league,
 logo
){

 equipaAtual={
  id:id,
  name:name,
  league:league,
  logo:logo
 };

 mostrarEquipa();
}


/* DETALHES DO JOGO */

function abrirDetalhes(j){

 let id=
  j.id ??
  j.eventId ??
  j.event_id;

 if(!id) return;

 let liga=encodeURIComponent(
  ligaDoJogo(j)
 );

 location.href=
  `detalhes.html?id=${encodeURIComponent(id)}&liga=${liga}`;
}


/* CARREGAR JOGOS */

async function carregar(){

 let todos=[];

 for(const liga of ligas){

  try{

   const resposta=
    await fetch(
     liga.arquivo+
     "?v="+Date.now(),
     {
      cache:"no-store"
     }
    );

   if(!resposta.ok) continue;

   const dados=
    await resposta.json();

   const lista=
    Array.isArray(dados)
    ? dados
    : (
       dados.jogos ||
       dados.games ||
       dados.events ||
       dados.matches ||
       []
      );

   lista.forEach(j=>{
    j.__liga=liga.nome;
    todos.push(j);
   });

  }catch(e){

   console.log(
    "Erro a carregar",
    liga.nome,
    e
   );

  }
 }

 if(todos.length){
  jogos=todos;
 }

 ultimaAtualizacao=new Date();

 mostrarJogos();
}


/* FILTROS */

function filtros(){

 let filtrosTempo=[
  "Todos",
  "Hoje",
  "🔴 Ao vivo",
  "Resultados",
  "Próximos"
 ];

 return `

 <div class="filters">

 ${
  filtrosTempo.map(x=>`

   <button
    class="${filtroAtual===x?"active":""}"
    onclick="setFiltro('${x}')"
   >
    ${x}
   </button>

 `).join("")
 }

 </div>

 <div class="filters">

 ${
  ["Todos",...ligas.map(x=>x.nome)]
  .map(x=>`

   <button
    class="${ligaAtual===x?"active":""}"
    onclick="setLiga('${x}')"
   >
    ${x}
   </button>

 `).join("")
 }

 </div>

 `;
}

function setFiltro(x){

 filtroAtual=x;

 mostrarJogos();
}

function setLiga(x){

 ligaAtual=x;

 mostrarJogos();
}

function passaFiltro(j){

 if(
  ligaAtual!=="Todos" &&
  ligaDoJogo(j)!==ligaAtual
 ){
  return false;
 }

 let estado=estadoJogo(j);

 if(filtroAtual==="🔴 Ao vivo"){
  return estado==="🔴 AO VIVO";
 }

 if(filtroAtual==="Resultados"){
  return estado==="Final";
 }

 if(filtroAtual==="Próximos"){
  return estado==="Próximo";
 }

 if(filtroAtual==="Hoje"){

  let d=dataJogo(j);

  if(!d) return false;

  return new Date(d).toDateString()===
         new Date().toDateString();
 }

 return true;
}


/* CARTÃO DE JOGO */

function cardJogo(j){

 let casa=obterEquipa(j,true);
 let fora=obterEquipa(j,false);

 let nomeCasa=nomeEquipa(casa);
 let nomeFora=nomeEquipa(fora);

 let idCasa=idEquipa(casa);
 let idFora=idEquipa(fora);

 let logoCasa=logoEquipa(casa);
 let logoFora=logoEquipa(fora);

 return `

 <div class="card">

  <div class="small">
   ${esc(ligaDoJogo(j))}
  </div>

  <div
   class="game"
   onclick='abrirDetalhes(${JSON.stringify(j).replace(/</g,"\\u003c")})'
  >

   <div class="team">

    <img
     src="${esc(logoCasa)}"
     onerror="this.style.visibility='hidden'"
    >

    <span>
     ${esc(nomeCasa)}
    </span>

   </div>

   <div>

    <div class="score">
     ${esc(resultado(j))}
    </div>

    <div class="status">
     ${esc(estadoJogo(j))}
    </div>

   </div>

   <div class="team">

    <span>
     ${esc(nomeFora)}
    </span>

    <img
     src="${esc(logoFora)}"
     onerror="this.style.visibility='hidden'"
    >

   </div>

  </div>

  <div style="display:flex;gap:6px;margin-top:8px">

   <button
    class="favbtn"
    onclick="event.stopPropagation();abrirEquipaPorId('${esc(idCasa)}','${esc(nomeCasa)}','${esc(ligaDoJogo(j))}','${esc(logoCasa)}')"
   >
    🏠 ${esc(nomeCasa)}
   </button>

   <button
    class="favbtn"
    onclick="event.stopPropagation();abrirEquipaPorId('${esc(idFora)}','${esc(nomeFora)}','${esc(ligaDoJogo(j))}','${esc(logoFora)}')"
   >
    🏠 ${esc(nomeFora)}
   </button>

  </div>

 </div>

 `;
}


/* JOGOS */

function mostrarJogos(){

 document.getElementById("navJogos")
  .classList.add("active");

 document.getElementById("navTabelas")
  .classList.remove("active");

 document.getElementById("navFav")
  .classList.remove("active");

 let lista=
  jogos.filter(passaFiltro);

 document.getElementById("app").innerHTML=`

  <div class="section">
   ⚽ Jogos
  </div>

  ${filtros()}

  <div class="small">
   ${
    ultimaAtualizacao
    ? "Atualizado "+
      ultimaAtualizacao.toLocaleTimeString("pt-PT")
    : ""
   }
  </div>

  ${
   lista.length
   ? lista.map(cardJogo).join("")
   : `
    <div class="card">
     <div class="empty">
      Sem jogos para este filtro.
     </div>
    </div>
   `
  }

 `;

}


/* TABELAS */

async function mostrarTabelas(){

 document.getElementById("navJogos")
  .classList.remove("active");

 document.getElementById("navTabelas")
  .classList.add("active");

 document.getElementById("navFav")
  .classList.remove("active");

 document.getElementById("app").innerHTML=`

  <div class="section">
   📊 Tabelas
  </div>

  <div class="filters">

   ${
    ligas.map(l=>`

     <button
      onclick="carregarTabela(
       '${l.nome}',
       '${l.arquivo.replace(".json","-classificacao.json")}'
      )"
     >
      ${l.nome}
     </button>

    `).join("")
   }

  </div>

  <div
   id="tabela"
   class="card"
  >
   <div class="empty">
    Escolhe uma liga.
   </div>
  </div>

 `;
}


async function carregarTabela(
 nome,
 arquivo
){

 let el=document.getElementById("tabela");

 el.innerHTML=`
  <div class="empty">
   A carregar...
  </div>
 `;

 try{

  let resposta=
   await fetch(
    arquivo+"?v="+Date.now()
   );

  if(!resposta.ok){
   throw new Error("erro");
  }

  let dados=
   await resposta.json();

  let lista=
   Array.isArray(dados)
   ? dados
   : (
      dados.classificacao ||
      dados.table ||
      dados.standings ||
      dados.teams ||
      []
     );

  el.innerHTML=`

   <h3>
    ${esc(nome)}
   </h3>

   <table>

    <tr>
     <th>#</th>
     <th>Equipa</th>
     <th>J</th>
     <th>V</th>
     <th>E</th>
     <th>D</th>
     <th>Pts</th>
    </tr>

    ${
     lista.map((x,i)=>{

      let equipa=
       x.team ||
       x.equipa ||
       x;

      return `

       <tr>

        <td>
         ${x.position || i+1}
        </td>

        <td>
         ${esc(nomeEquipa(equipa))}
        </td>

        <td>
         ${x.played ?? x.jogos ?? 0}
        </td>

        <td>
         ${x.won ?? x.vitorias ?? 0}
        </td>

        <td>
         ${x.draw ?? x.empates ?? 0}
        </td>

        <td>
         ${x.lost ?? x.derrotas ?? 0}
        </td>

        <td>
         <b>
          ${x.points ?? x.pontos ?? 0}
         </b>
        </td>

       </tr>

      `;

     }).join("")
    }

   </table>

  `;

 }catch(e){

  el.innerHTML=`

   <div class="empty error">
    Não foi possível carregar
    a classificação.
   </div>

  `;

 }

}


/* FAVORITOS */

function mostrarFavoritos(){

 document.getElementById("navJogos")
  .classList.remove("active");

 document.getElementById("navTabelas")
  .classList.remove("active");

 document.getElementById("navFav")
  .classList.add("active");

 let lista=obterFavoritos();

 document.getElementById("app").innerHTML=`

  <div class="section">
   ⭐ Favoritos
  </div>

  ${
   lista.length

   ?

   lista.map(x=>`

    <div class="card">

     <div class="teamhead">

      <img
       class="logo"
       src="${esc(x.logo)}"
       onerror="this.style.visibility='hidden'"
      >

      <div>

       <h2>
        ${esc(x.name)}
       </h2>

       <div class="small">
        ${esc(x.league)}
       </div>

      </div>

      <button
       class="star"
       onclick="alternarFavorito('${esc(x.id)}')"
      >
       ⭐
      </button>

     </div>

    </div>

   `).join("")

   :

   `

    <div class="card">

     <div class="empty">

      Ainda não tens equipas favoritas.

      <br><br>

      Abre uma equipa nos jogos
      e adiciona ⭐.

     </div>

    </div>

   `
  }

 `;

}


/* PÁGINA DA EQUIPA */

function mostrarEquipa(){

 let e=equipaAtual;

 let fav=eFavorito(e.id);

 let relacionados=
  jogos.filter(j=>{

   let casa=obterEquipa(j,true);
   let fora=obterEquipa(j,false);

   return(
    String(idEquipa(casa))===String(e.id) ||
    String(idEquipa(fora))===String(e.id) ||
    nomeEquipa(casa)===e.name ||
    nomeEquipa(fora)===e.name
   );

  });

 document.getElementById("app").innerHTML=`

  <button
   class="back"
   onclick="mostrarJogos()"
  >
   ← Voltar
  </button>

  <div class="card">

   <div class="teamhead">

    <img
     class="logo"
     src="${esc(e.logo)}"
     onerror="this.style.visibility='hidden'"
    >

    <div>

     <h2>
      ${esc(e.name)}
     </h2>

     <div class="small">
      ${esc(e.league)}
     </div>

    </div>

    <button
     class="star"
     onclick="alternarFavorito(
      '${esc(e.id)}',
      '${esc(e.name)}',
      '${esc(e.league)}',
      '${esc(e.logo)}'
     )"
    >
     ${fav?"⭐":"☆"}
    </button>

   </div>

  </div>

  <div class="section">
   Jogos da equipa
  </div>

  ${
   relacionados.length

   ?

   relacionados.map(cardJogo).join("")

   :

   `

    <div class="card">

     <div class="empty">
      Sem jogos encontrados.
     </div>

    </div>

   `
  }

 `;

}


/* INICIAR */

carregar();

if(!intervaloLive){

 intervaloLive=
  setInterval(
   carregar,
   60000
  );

}

</script>

</body>
</html>
