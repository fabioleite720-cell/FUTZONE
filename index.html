<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0057b8"><title>FUTZONE PREMIUM</title><style>
:root{--b:#0057b8;--b2:#1683ff;--bg:#03060b;--c:#0a111b;--c2:#101a28;--g:#20d68a;--r:#ff4054;--y:#ffd43b;--t:#f5f7fb;--m:#8d9aaa;--l:#1b2635}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.header{position:sticky;top:0;z-index:5;background:#03060bf7;border-bottom:1px solid var(--l);padding:14px 12px}.logo{font-size:25px;font-weight:900}.logo span{color:var(--b2)}.sub{font-size:10px;color:var(--m);letter-spacing:2px}.nav,.quick,.chips{display:flex;gap:7px;overflow:auto;padding-top:12px}.nav button,.quick button,.chip{white-space:nowrap;background:var(--c2);color:#fff;border:1px solid var(--l);border-radius:9px;padding:9px 11px;font-weight:700;font-size:11px}.nav .active{background:linear-gradient(135deg,var(--b),var(--b2))}main{padding:12px;max-width:1100px;margin:auto}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:linear-gradient(var(--c2),var(--c));border:1px solid var(--l);border-radius:13px;padding:11px}.title{display:flex;justify-content:space-between;align-items:center;margin:7px 0 10px}.title h2{font-size:18px;margin:0}.muted{color:var(--m);font-size:10px}.suggest{min-height:145px}.orange{color:#ffad42}.green{color:var(--g)}.match{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800}.market{font-size:13px;margin-top:10px}.status{color:var(--m);font-size:10px;margin-top:8px}.live{color:var(--r);font-weight:900}.teamhead{display:grid;grid-template-columns:1fr 60px 1fr;text-align:center;align-items:center;gap:7px}.team{cursor:pointer}.team img{width:48px;height:48px;object-fit:contain}.name{display:block;font-size:13px;font-weight:900;margin-top:6px}.score{font-size:20px;font-weight:900}.row{border-top:1px solid var(--l);margin-top:12px;padding-top:10px}.label{font-size:10px;color:var(--m);text-transform:uppercase}.value{font-size:13px;font-weight:800;margin-top:5px}.watch{display:grid;gap:7px;margin-top:7px}.watch a{background:#111d2b;color:#fff;text-decoration:none;padding:9px;border-radius:8px;font-size:11px;border:1px solid #26364a}.lastgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.last{background:#08111c;border:1px solid var(--l);border-radius:9px;padding:8px;margin-top:8px}.form{display:flex;gap:4px;margin:7px 0}.form b{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px}.v{background:#124f3a;color:#54f2b0}.e{background:#554914;color:#ffe36b}.d{background:#571d29;color:#ff8290}.game{cursor:pointer}.leagueGroup{grid-column:1/-1}.leagueHead{font-size:15px;font-weight:900;padding:10px 4px 5px;border-bottom:1px solid var(--l);margin-top:8px}.eventList{display:grid;gap:7px}.eventItem{font-size:10px;padding:7px;border-top:1px solid var(--l)}.roster{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{background:#0a131f;border:1px solid var(--l);border-radius:8px;padding:8px;font-size:11px}.pos{color:var(--m);font-size:10px;margin-top:3px}.loading{text-align:center;color:var(--m);padding:25px}.err{color:#ff8290;font-size:11px;padding:12px}@media(max-width:600px){.lastgrid{grid-template-columns:1fr}}
</style></head><body><header class="header"><div class="logo">FUTZONE <span>PREMIUM</span></div><div class="sub">FUTEBOL EM DIRETO</div><nav class="nav"><button class="active" onclick="sec('premium',this)">🔥 Premium</button><button onclick="sec('games',this)">⚽ Jogos</button><button onclick="sec('tables',this)">📊 Tabelas</button><button onclick="sec('news',this)">📰 Notícias</button><button onclick="sec('favorites',this)">⭐ Favoritos</button><button onclick="sec('live',this)">🔴 Diretos</button></nav></header><main>
<section id="premium"><div class="title"><h2>🔥 Sugestões do dia</h2><span class="muted">10 sugestões</span></div><div id="suggestions" class="grid"><div class="loading">A carregar jogos...</div></div></section>
<section id="games" class="hidden"><div class="title"><h2>⚽ Jogos</h2><span id="count" class="muted"></span></div><div class="quick"><button onclick="showLive()">🔴 Jogos ao vivo</button><button onclick="showToday()">📅 Jogos de hoje</button><button onclick="showAll()">🌍 Todos carregados</button></div><div id="gamesList" class="grid"></div></section>
<section id="tables" class="hidden"><div class="title"><h2>📊 Tabelas</h2></div><div id="tablesList"><div class="loading">A carregar...</div></div></section>
<section id="news" class="hidden"><div class="title"><h2>📰 Notícias</h2></div><div id="newsList"><div class="loading">A carregar...</div></div></section>
<section id="favorites" class="hidden"><div class="title"><h2>⭐ Favoritos</h2></div><div class="card">Ainda não existem favoritos.</div></section>
<section id="live" class="hidden"><div class="title"><h2>🔴 Diretos</h2></div><div id="liveList"></div></section>
<section id="analysis" class="hidden"><div class="title"><h2>📋 Análise Premium</h2><button onclick="back()">← Voltar</button></div><div id="analysisBox"></div></section>
<section id="roster" class="hidden"><div class="title"><h2 id="rosterTitle">📋 Plantel</h2><button onclick="backRoster()">← Voltar</button></div><div id="rosterBox"></div></section></main>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';let games=[],teams={},current=null;
const leagues=['por.1','por.2','por.3','eng.1','esp.1','ita.1','ger.1','fra.1','tur.1','ksa.1','usa.1','uefa.champions','uefa.europa','uefa.europa.conf','uefa.nations','fifa.worldq.uefa','fifa.worldq.conmebol','fifa.friendly','conmebol.libertadores','conmebol.sudamericana'];
const lname={'por.1':'Liga Portugal','por.2':'Liga 2 Portugal','por.3':'Liga 3 Portugal','eng.1':'Premier League','esp.1':'LaLiga','ita.1':'Série A Italiana','ger.1':'Bundesliga','fra.1':'Ligue 1','tur.1':'Liga Turca','ksa.1':'Liga Saudita','usa.1':'MLS','uefa.champions':'Liga dos Campeões','uefa.europa':'Liga Europa','uefa.europa.conf':'Liga da Conference League','uefa.nations':'Liga das Nações'};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function ct(c){return c?.team||c||{}}function tn(t){return t?.displayName||t?.fullName||t?.shortDisplayName||t?.name||t?.abbreviation||'Equipa'}function cs(e){return e?.competitions?.[0]?.competitors||[]}function ha(e){let c=cs(e);return{h:c.find(x=>x.homeAway==='home')||c[0],a:c.find(x=>x.homeAway==='away')||c[1]}}function sc(c){let s=c?.score;let n=typeof s==='object'?s?.displayValue??s?.value:s;return Number.isFinite(Number(n))?Number(n):0}function dt(e){return new Date(e?.date||Date.now())}function live(e){return e?.status?.type?.state==='in'}function fin(e){return ['post','final','completed'].includes(e?.status?.type?.state)}function st(e){return live(e)?'🔴 EM DIRETO':fin(e)?'Terminado':dt(e).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})+' · '+dt(e).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}async function get(path,ms=8000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{let r=await fetch(API+path,{cache:'no-store',signal:c.signal});if(!r.ok)throw 0;return await r.json()}catch(e){return null}finally{clearTimeout(t)}}
function sec(id,b){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='live')showLive();if(id==='tables')loadTables();if(id==='news')loadNews()}
function add(d,id){(d?.events||[]).forEach(e=>{if(e?.id&&!games.some(x=>x.id===e.id)){e.leagueId=id;e.leagueName=lname[id]||e?.competitions?.[0]?.league?.name||'Futebol';games.push(e)}})}
function render(list=games){
 let b=document.getElementById('gamesList');
 let sorted=list.slice().sort((a,z)=>dt(a)-dt(z));
 document.getElementById('count').textContent=sorted.length+' jogos';
 if(!sorted.length){b.innerHTML='<div class="card err">Não foram encontrados jogos.</div>';return}
 const groups={}; sorted.forEach(e=>{let k=e.leagueName||e?.competitions?.[0]?.league?.name||'Outras competições';(groups[k]??=[]).push(e)});
 b.innerHTML=Object.entries(groups).map(([lg,arr])=>`<div class="leagueGroup"><div class="leagueHead">🏆 ${esc(lg)} <span class="muted">· ${arr.length} jogos</span></div><div class="eventList">${arr.map(e=>{let x=ha(e);return `<div class="card game" onclick="openMatch('${esc(e.id)}')"><div><button type="button" style="all:unset;cursor:pointer" onclick="event.stopPropagation();openTeam('${esc(ct(x.h)?.id||'')}')"><strong>${esc(tn(ct(x.h)))}</strong></button> <span class="muted">vs</span> <button type="button" style="all:unset;cursor:pointer" onclick="event.stopPropagation();openTeam('${esc(ct(x.a)?.id||'')}')"><strong>${esc(tn(ct(x.a)))}</strong></button></div><div class="status ${live(e)?'live':''}">${esc(st(e))}${live(e)||fin(e)?' · '+sc(x.h)+' - '+sc(x.a):''}</div></div>`}).join('')}</div></div>`).join('')
}

function showAll(){render()}function showToday(){let n=new Date();render(games.filter(e=>{let d=dt(e);return d.toDateString()===n.toDateString()}))}function showLive(){let l=games.filter(live);document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById('live').classList.remove('hidden');document.getElementById('liveList').innerHTML=l.length?l.map(e=>{let x=ha(e);return `<div class="card game" onclick="openMatch('${esc(e.id)}')"><div class="live">🔴 EM DIRETO</div><strong>${esc(tn(ct(x.h)))}</strong> ${sc(x.h)} - ${sc(x.a)} <strong>${esc(tn(ct(x.a)))}</strong><div class="muted">${esc(e.leagueName)}</div></div>`}).join(''):'<div class="card err">Não há jogos em direto nos dados carregados.</div>'}
function suggestMarket(i,e){let x=ha(e),h=tn(ct(x.h)),a=tn(ct(x.a));let hi=[h+' ou empate (1X)',a+' ou empate (X2)','Mais de 1,5 golos','Menos de 4,5 golos',h+' +0,5'];let lo=['Mais de 0,5 golos','Menos de 5,5 golos','1X — '+h,'X2 — '+a,'Mais de 1,5 cartões'];return i<5?hi[i]:lo[i-5]}
function suggestions(){let u=games.filter(e=>!fin(e)).sort((a,b)=>live(a)?-1:live(b)?1:dt(a)-dt(b));let seen=new Set(),a=[];for(let e of u){if(seen.has(e.id))continue;let x=ha(e);if(!x.h||!x.a)continue;seen.add(e.id);a.push(e);if(a.length===10)break}document.getElementById('suggestions').innerHTML=a.length?a.map((e,i)=>{let x=ha(e);return `<div class="card suggest game" onclick="openMatch('${esc(e.id)}')"><div class="${i<5?'orange':'green'}">${i<5?'🟠 Médio-alto':'🟢 Médio-baixo'}</div><div class="match"><span>${esc(tn(ct(x.h)))}</span><span class="muted">vs</span><span>${esc(tn(ct(x.a)))}</span></div><div class="market">${esc(suggestMarket(i,e))}</div><div class="muted">${esc(e.leagueName)}</div><div class="status">${esc(st(e))}</div></div>`}).join(''):'<div class="card err">Não foi possível obter jogos neste momento.</div>'}
function openMatch(id){
 let e=games.find(x=>String(x.id)===String(id)); if(!e)return; current=e;
 let x=ha(e),h=ct(x.h),a=ct(x.a); teams[h.id]=h; teams[a.id]=a;
 document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden')); document.getElementById('analysis').classList.remove('hidden');
 document.getElementById('analysisBox').innerHTML=`<div class="card"><div class="teamhead"><div class="team" onclick="openTeam('${esc(h.id)}')">${visual(h)}<span class="name">${esc(tn(h))}</span></div><div><div class="score">${live(e)||fin(e)?sc(x.h)+' - '+sc(x.a):'vs'}</div><div class="muted">${esc(st(e))}</div></div><div class="team" onclick="openTeam('${esc(a.id)}')">${visual(a)}<span class="name">${esc(tn(a))}</span></div></div>
 <div class="row"><div class="label">Médio-alto</div><div class="value">${esc(suggestMarket(0,e))}</div></div>
 <div class="row"><div class="label">Médio-baixo</div><div class="value">${esc(suggestMarket(5,e))}</div></div>
 <div class="row"><div class="label">Competição</div><div class="value">${esc(e.leagueName)}</div></div>
 <div class="row"><div class="label">Acontecimentos do jogo</div><div id="events" class="last"><div class="loading">A procurar acontecimentos...</div></div></div>
 <div class="row"><div class="label">Onde ver</div><div id="watch" class="watch"><div class="loading">A procurar...</div></div></div>
 <div class="row"><div class="label">Últimos 5 jogos</div><div class="lastgrid"><div class="last"><strong>${esc(tn(h))}</strong><div id="lh" class="loading">A carregar...</div></div><div class="last"><strong>${esc(tn(a))}</strong><div id="la" class="loading">A carregar...</div></div></div></div></div>`;
 Promise.all([last5(h,'lh',e.id),last5(a,'la',e.id),watch(e),gameEvents(e)]);
}
async function gameEvents(e){
 let b=document.getElementById('events'); if(!b)return;
 let d=await get('summary?event='+encodeURIComponent(e.id),10000); let arr=d?.keyEvents||d?.plays||d?.commentary||[];
 if(!Array.isArray(arr)||!arr.length){b.innerHTML='<div class="err">Não há acontecimentos detalhados disponibilizados para este jogo.</div>';return}
 let rows=arr.slice(-30).reverse().map(p=>{let minute=p.clock?.displayValue||p.clock?.value||p.period?.displayValue||'';let text=p.text||p.description||p.type?.text||p.shortText||'';let team=p.team?.displayName||p.team?.shortDisplayName||'';let icon=p.type?.text?.toLowerCase().includes('goal')?'⚽':p.type?.text?.toLowerCase().includes('card')?'🟨':'•';return `<div class="eventItem"><strong>${esc(minute)}</strong> ${icon} ${esc(text||'Acontecimento')} ${team?'<span class="muted">· '+esc(team)+'</span>':''}</div>`}).join(''); b.innerHTML=rows;
}

function visual(t){let u=t?.logos?.[0]?.href||t?.logo||t?.flag||t?.flags?.[0]?.href;return u?`<img src="${esc(u)}" alt="${esc(tn(t))}">`:'<div style="height:48px"></div>'}
async function last5(t,id,exclude){if(!t?.id){document.getElementById(id).innerHTML='<div class="err">Equipa não identificada.</div>';return}let d=await get('all/teams/'+encodeURIComponent(t.id)+'/schedule?limit=100',11000),ev=d?.events||[];let rows=[];for(let e of ev){if(!e?.id||e.id===exclude||!fin(e))continue;let c=cs(e),me=c.find(q=>String(ct(q).id)===String(t.id));if(!me) continue;let op=c.find(q=>String(ct(q).id)!==String(t.id));if(!op)continue;let ms=sc(me),os=sc(op),r=ms>os?'V':ms<os?'D':'E';rows.push({e,me,op,ms,os,r})}rows.sort((a,b)=>dt(b.e)-dt(a.e));rows=rows.slice(0,5);let b=document.getElementById(id);if(!rows.length){b.innerHTML='<div class="err">Últimos 5 jogos indisponíveis.</div>';return}b.innerHTML='<div class="form">'+rows.map(x=>`<b class="${x.r.toLowerCase()}">${x.r}</b>`).join('')+'</div>'+rows.map(x=>{let m=tn(ct(x.me)),o=tn(ct(x.op));return `<div style="font-size:10px;border-top:1px solid var(--l);padding:7px 0"><strong>${esc(m)}</strong> ${x.ms}-${x.os} ${esc(o)}<br><span class="${x.r==='V'?'green':x.r==='D'?'orange':'muted'}">${x.r==='V'?'VITÓRIA':x.r==='D'?'DERROTA':'EMPATE'}</span> · ${dt(x.e).toLocaleDateString('pt-PT')}</div>`}).join('')}
async function watch(e){let b=document.getElementById('watch'),a=e?.competitions?.[0]?.broadcasts||[],out=[];a.forEach(x=>(x.names||[x.media?.name,x.media?.shortName,x.station?.name,x.name]).forEach(n=>{if(n&&!out.some(y=>y.n===n))out.push({n,u:x?.links?.[0]?.href||x?.url||''})}));out=out.slice(0,4);b.innerHTML=out.length?out.map(x=>`<a href="${esc(x.u||'#')}" target="_blank" rel="noopener">📺 ${esc(x.n)}</a>`).join(''):'<div class="err">Não foi indicada uma transmissão para este jogo.</div>'}
function openTeam(id){let t=teams[id];if(!t)return;document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById('roster').classList.remove('hidden');document.getElementById('rosterTitle').textContent='📋 Plantel — '+tn(t);loadRoster(t)}async function loadRoster(t){let b=document.getElementById('rosterBox'),d=await get('all/teams/'+encodeURIComponent(t.id)+'/roster?limit=100',11000),a=d?.athletes||[];b.innerHTML=a.length?'<div class="roster">'+a.map(p=>`<div class="player"><strong>${esc(p.fullName||p.displayName||p.name||'Jogador')}</strong><div class="pos">${esc(p.position?.displayName||p.position?.abbreviation||'')}</div></div>`).join('')+'</div>':'<div class="card err">Plantel indisponível neste momento.</div>'}function back(){document.getElementById('analysis').classList.add('hidden');document.getElementById('premium').classList.remove('hidden')}function backRoster(){document.getElementById('roster').classList.add('hidden');document.getElementById('analysis').classList.remove('hidden')}
async function loadTables(){let b=document.getElementById('tablesList');b.innerHTML='<div class="loading">A carregar...</div>';let d=await get('por.1/standings?limit=100');let es=d?.standings?.entries||[];b.innerHTML=es.length?'<div class="card">'+es.map((x,i)=>`<div style="padding:7px;border-bottom:1px solid var(--l)">${i+1}. ${esc(tn(x.team))}</div>`).join('')+'</div>':'<div class="card err">Tabelas indisponíveis.</div>'}async function loadNews(){let b=document.getElementById('newsList'),d=await get('news'),a=d?.articles||[];b.innerHTML=a.length?a.slice(0,20).map(x=>`<div class="card" style="margin-bottom:8px"><strong>${esc(x.headline||x.title||'Notícia')}</strong><div class="muted">${esc(x.description||'')}</div></div>`).join(''):'<div class="card err">Notícias indisponíveis.</div>'}
async function load(){games=[];let ids=leagues;for(let i=0;i<ids.length;i+=4){await Promise.all(ids.slice(i,i+4).map(async id=>add(await get(id+'/scoreboard?limit=100'),id)));render(games);suggestions()}if(!games.length)document.getElementById('gamesList').innerHTML='<div class="card err">Não foi possível obter os jogos através da fonte de dados.</div>';suggestions()}load();setInterval(load,600000);
</script><!-- FUTZONE PREMIUM — BLOCO TABELAS + EQUIPAS + JOGADORES + ESTATÍSTICAS + ÚLTIMOS 5 -->
<script>
/* =========================================================
   FUTZONE PREMIUM — MELHORIAS
   1. Tabelas de várias competições
   2. Clubes/seleções clicáveis
   3. Plantel clicável
   4. Jogadores clicáveis
   5. Golos / assistências / cartões
   6. Estatísticas nos jogos
   7. Últimos 5 jogos com fallback por competição
   ========================================================= */

(function(){

const FZ_LEAGUES = [
 ['por.1','Liga Portugal'],
 ['por.2','Liga 2 Portugal'],
 ['por.3','Liga 3 Portugal'],
 ['por.w.1','Liga BPI Feminina'],
 ['eng.1','Premier League'],
 ['esp.1','LaLiga'],
 ['ita.1','Serie A'],
 ['ger.1','Bundesliga'],
 ['fra.1','Ligue 1'],
 ['tur.1','Liga Turca'],
 ['ksa.1','Liga Saudita'],
 ['usa.1','MLS'],
 ['uefa.champions','Liga dos Campeões'],
 ['uefa.europa','Liga Europa'],
 ['uefa.europa.conf','Liga Conference'],
 ['uefa.nations','Liga das Nações'],
 ['fifa.worldq.uefa','Qualificação Mundial UEFA'],
 ['fifa.worldq.conmebol','Qualificação Mundial CONMEBOL'],
 ['fifa.friendly','Amigáveis Internacionais'],
 ['conmebol.libertadores','Libertadores'],
 ['conmebol.sudamericana','Sul-Americana']
];

window.FZ_PLAYERS = {};
window.FZ_TEAM_CACHE = window.FZ_TEAM_CACHE || {};
window.FZ_TABLE_CACHE = {};

function fzEsc(v){
 return String(v ?? '').replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[m]));
}

async function fzGet(path,timeout=12000){
 const c=new AbortController();
 const timer=setTimeout(()=>c.abort(),timeout);
 try{
  const r=await fetch(API+path,{
   cache:'no-store',
   signal:c.signal
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
 }catch(e){
  return null;
 }finally{
  clearTimeout(timer);
 }
}

/* ---------------------------------------------------------
   TABELAS
   --------------------------------------------------------- */

window.loadTables = async function(){

 const box=document.getElementById('tablesList');

 if(!box) return;

 box.innerHTML=`
 <div class="chips" id="fzTableButtons"></div>
 <div id="fzTableContent" class="loading">
   A carregar classificações...
 </div>`;

 const buttons=document.getElementById('fzTableButtons');

 buttons.innerHTML=FZ_LEAGUES.map((l,i)=>`
   <button class="chip"
     onclick="fzLoadTable('${fzEsc(l[0])}')">
     ${fzEsc(l[1])}
   </button>
 `).join('');

 fzLoadTable('por.1');
};


window.fzLoadTable = async function(league){

 const box=document.getElementById('fzTableContent');

 if(!box) return;

 box.innerHTML='<div class="loading">A carregar classificação...</div>';

 let data=FZ_TABLE_CACHE[league];

 if(!data){
  data=await fzGet(
   league+'/standings?limit=100',
   15000
  );

  if(data)
   FZ_TABLE_CACHE[league]=data;
 }

 const entries=data?.standings?.entries || [];

 if(!entries.length){
  box.innerHTML=`
   <div class="card err">
    Classificação indisponível neste momento para esta competição.
   </div>`;
  return;
 }

 function stat(entry,name){
  const s=(entry.stats||[]).find(x=>x.name===name);
  return s?.displayValue ??
         s?.value ??
         '-';
 }

 entries.forEach(entry=>{
  const t=entry.team || {};

  if(t.id)
   teams[t.id]=t;

  FZ_TEAM_CACHE[t.id]=t;
 });

 box.innerHTML=`
 <div class="card">

  <div style="font-size:15px;font-weight:900;margin-bottom:10px">
   ${fzEsc(
    (FZ_LEAGUES.find(x=>x[0]===league)||[])[1] || league
   )}
  </div>

  <div style="overflow-x:auto">

   <table class="table">

    <thead>
     <tr>
      <th>#</th>
      <th>Equipa</th>
      <th>J</th>
      <th>V</th>
      <th>E</th>
      <th>D</th>
      <th>GM</th>
      <th>GS</th>
      <th>PTS</th>
     </tr>
    </thead>

    <tbody>

     ${entries.map((entry,i)=>{

       const t=entry.team||{};

       return `
       <tr
        class="click"
        onclick="fzOpenTeam('${fzEsc(t.id||'')}')">

        <td>
         <strong>${i+1}</strong>
        </td>

        <td>
         <strong>${fzEsc(
           t.displayName ||
           t.fullName ||
           t.shortDisplayName ||
           t.name ||
           'Equipa'
         )}</strong>
        </td>

        <td>${fzEsc(stat(entry,'gamesPlayed'))}</td>
        <td>${fzEsc(stat(entry,'wins'))}</td>
        <td>${fzEsc(stat(entry,'ties'))}</td>
        <td>${fzEsc(stat(entry,'losses'))}</td>
        <td>${fzEsc(stat(entry,'pointsFor'))}</td>
        <td>${fzEsc(stat(entry,'pointsAgainst'))}</td>

        <td>
         <strong>${fzEsc(stat(entry,'points'))}</strong>
        </td>

       </tr>`;
     }).join('')}

    </tbody>
   </table>

  </div>
 </div>`;
};

window.fzOpenTeam = async function(id){

 let t=teams[id] || FZ_TEAM_CACHE[id];

 if(!t) return;

 teams[id]=t;
 FZ_TEAM_CACHE[id]=t;

 document.querySelectorAll('main>section')
   .forEach(s=>s.classList.add('hidden'));

 const section=document.getElementById('roster');

 if(!section) return;

 section.classList.remove('hidden');

 document.getElementById('rosterTitle').textContent=
   '📋 '+(
     t.displayName ||
     t.fullName ||
     t.shortDisplayName ||
     t.name ||
     'Equipa'
   );

 await fzLoadRoster(t);
};


/* ---------------------------------------------------------
   PLANTEL
   --------------------------------------------------------- */

window.fzLoadRoster = async function(team){

 const box=document.getElementById('rosterBox');

 if(!box) return;

 box.innerHTML=
  '<div class="loading">A carregar jogadores...</div>';

 let data=null;

 const paths=[
  'all/teams/'+encodeURIComponent(team.id)+'/roster?limit=100'
 ];

 for(const path of paths){

  data=await fzGet(path,15000);

  if(data?.athletes?.length)
   break;
 }

 const players=data?.athletes || [];

 if(!players.length){

  box.innerHTML=`
   <div class="card err">
    Não foi possível obter o plantel desta equipa.
   </div>`;

  return;
 }

 players.forEach(p=>{
  if(p?.id)
   FZ_PLAYERS[p.id]=p;
 });

 box.innerHTML=`

 <div class="card">

  <div class="muted" style="margin-bottom:10px">
   Plantel · toque num jogador para abrir as estatísticas
  </div>

  <div class="roster">

   ${players.map(p=>{

    const name=
      p.fullName ||
      p.displayName ||
      p.name ||
      'Jogador';

    const pos=
      p.position?.displayName ||
      p.position?.abbreviation ||
      '—';

    return `
    <div
      class="player"
      onclick="fzOpenPlayer('${fzEsc(p.id)}')">

      <strong>${fzEsc(name)}</strong>

      <div class="pos">
       ${fzEsc(pos)}
      </div>

      <div class="muted" style="margin-top:5px">
       ⚽ Golos · 🎯 Assistências · 🟨 Cartões
      </div>

    </div>`;
   }).join('')}

  </div>
 </div>`;
};


/* ---------------------------------------------------------
   JANELA DO JOGADOR
   --------------------------------------------------------- */

window.fzOpenPlayer = async function(id){

 const p=FZ_PLAYERS[id];

 if(!p) return;

 let old=document.getElementById('fzPlayerSection');

 if(old)
  old.remove();

 const section=document.createElement('section');

 section.id='fzPlayerSection';

 section.innerHTML=`

 <div class="title">

  <h2>
   👤 ${fzEsc(
     p.fullName ||
     p.displayName ||
     p.name ||
     'Jogador'
   )}
  </h2>

  <button onclick="fzClosePlayer()">
   ← Voltar
  </button>

 </div>

 <div id="fzPlayerContent">
  <div class="loading">
   A carregar estatísticas...
  </div>
 </div>`;

 document.querySelector('main').appendChild(section);

 document.querySelectorAll('main>section')
  .forEach(s=>{
   if(s!==section)
    s.classList.add('hidden');
  });

 const box=document.getElementById('fzPlayerContent');

 let data=await fzGet(
  'athletes/'+encodeURIComponent(id),
  15000
 );

 const a=data?.athlete || data || p;

 let statistics=
  a?.statistics ||
  a?.stats ||
  [];

 function findStat(names){

  if(!Array.isArray(statistics))
   return '—';

  for(const s of statistics){

   const name=String(
    s.name ||
    s.displayName ||
    s.label ||
    ''
   ).toLowerCase();

   for(const wanted of names){

    if(name.includes(wanted))
     return s.displayValue ??
            s.value ??
            '—';
   }
  }

  return '—';
 }

 const goals=findStat([
  'goals',
  'goal'
 ]);

 const assists=findStat([
  'assists',
  'assist'
 ]);

 const yellow=findStat([
  'yellowcards',
  'yellow card',
  'yellow'
 ]);

 const red=findStat([
  'redcards',
  'red card',
  'red'
 ]);<!-- FUTZONE PREMIUM — BLOCO EXTRA: ESTATÍSTICAS DO JOGO + 11 TITULAR -->
<style>
.fz-match-extra{
  margin-top:12px;
}
.fz-match-title{
  font-size:13px;
  font-weight:900;
  margin:12px 0 8px;
}
.fz-match-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.fz-match-stat{
  background:#08111c;
  border:1px solid var(--l);
  border-radius:9px;
  padding:9px;
  text-align:center;
}
.fz-match-stat b{
  display:block;
  font-size:13px;
}
.fz-match-stat span{
  display:block;
  color:var(--m);
  font-size:9px;
  margin-top:4px;
}
.fz-lineups{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.fz-lineup{
  background:#08111c;
  border:1px solid var(--l);
  border-radius:9px;
  padding:9px;
}
.fz-lineup h4{
  margin:0 0 7px;
  font-size:11px;
}
.fz-lineup-player{
  padding:6px 0;
  border-top:1px solid var(--l);
  font-size:10px;
}
.fz-lineup-player small{
  color:var(--m);
}
.fz-event{
  padding:7px 0;
  border-top:1px solid var(--l);
  font-size:10px;
}
@media(max-width:600px){
  .fz-lineups{
    grid-template-columns:1fr;
  }
}
</style>

<script>
(function(){

  const FZ_ORIGINAL_OPEN_MATCH = window.openMatch;

  async function fzGameData(eventId){

    try{

      const controller = new AbortController();

      const timer = setTimeout(
        ()=>controller.abort(),
        12000
      );

      const r = await fetch(
        API + 'summary?event=' +
        encodeURIComponent(eventId),
        {
          cache:'no-store',
          signal:controller.signal
        }
      );

      clearTimeout(timer);

      if(!r.ok) return null;

      return await r.json();

    }catch(e){

      return null;

    }

  }

  function fzValue(stats,names){

    for(const name of names){

      const item = (stats || []).find(
        x =>
          x.name === name ||
          x.displayName === name
      );

      if(item){

        return item.displayValue ??
               item.value ??
               '—';

      }

    }

    return '—';

  }

  function fzPlayerName(p){

    return p?.athlete?.displayName ||
           p?.athlete?.fullName ||
           p?.displayName ||
           p?.fullName ||
           p?.name ||
           'Jogador';

  }

  function fzTeamName(t){

    return t?.team?.displayName ||
           t?.team?.fullName ||
           t?.team?.shortDisplayName ||
           t?.displayName ||
           t?.name ||
           'Equipa';

  }

  function fzEsc2(v){

    return String(v ?? '').replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );

  }

  function fzEvents(data){

    const events =
      data?.keyEvents ||
      data?.plays ||
      data?.commentary ||
      [];

    if(!Array.isArray(events) || !events.length){

      return '<div class="muted">' +
             'Não existem acontecimentos detalhados disponíveis.' +
             '</div>';

    }

    return events
      .slice()
      .reverse()
      .slice(0,30)
      .map(p=>{

        const text =
          p.text ||
          p.description ||
          p.shortText ||
          p.type?.text ||
          'Acontecimento';

        const clock =
          p.clock?.displayValue ||
          p.clock?.value ||
          '';

        const type =
          (
            p.type?.text ||
            ''
          ).toLowerCase();

        let icon='•';

        if(type.includes('goal'))
          icon='⚽';

        else if(
          type.includes('yellow') ||
          type.includes('card')
        )
          icon='🟨';

        else if(type.includes('red'))
          icon='🟥';

        else if(type.includes('sub'))
          icon='🔄';

        return `
          <div class="fz-event">
            <strong>${fzEsc2(clock)}</strong>
            ${icon}
            ${fzEsc2(text)}
          </div>
        `;

      })
      .join('');

  }

  function fzLineup(data,teamId,teamName){

    let rosters =
      data?.rosters ||
      data?.lineups ||
      [];

    if(!Array.isArray(rosters))
      rosters=[];

    let roster =
      rosters.find(r =>
        String(
          r?.team?.id ||
          r?.teamId
        ) === String(teamId)
      );

    let players =
      roster?.roster ||
      roster?.athletes ||
      roster?.players ||
      [];

    if(!players.length){

      return `
        <div class="fz-lineup">
          <h4>11 titular — ${fzEsc2(teamName)}</h4>
          <div class="muted">
            Onze titular não disponibilizado pela fonte.
          </div>
        </div>
      `;

    }

    let starters =
      players.filter(p =>
        p.starter === true ||
        p.starter === 'true' ||
        p.status?.type?.name === 'starter'
      );

    if(starters.length < 11)
      starters = players.slice(0,11);

    starters = starters.slice(0,11);

    return `
      <div class="fz-lineup">

        <h4>
          11 titular — ${fzEsc2(teamName)}
        </h4>

        ${starters.map((p,i)=>{

          const position =
            p?.position?.displayName ||
            p?.position?.abbreviation ||
            p?.athlete?.position?.displayName ||
            '';

          return `
            <div class="fz-lineup-player">

              <strong>
                ${i+1}. ${fzEsc2(fzPlayerName(p))}
              </strong>

              <br>

              <small>
                ${fzEsc2(position)}
              </small>

            </div>
          `;

        }).join('')}

      </div>
    `;

  }

  async function fzAddMatchInfo(eventId){

    const box =
      document.getElementById('analysisBox');

    if(!box) return;

    /*
      Evita duplicar o bloco se o jogo for aberto
      novamente.
    */

    const old =
      document.getElementById(
        'fz-match-extra'
      );

    if(old) old.remove();

    const data =
      await fzGameData(eventId);

    if(!data) return;

    const competition =
      data?.header?.competitions?.[0];

    const competitors =
      competition?.competitors || [];

    const home =
      competitors.find(
        x=>x.homeAway==='home'
      ) || competitors[0];

    const away =
      competitors.find(
        x=>x.homeAway==='away'
      ) || competitors[1];

    if(!home || !away) return;

    const homeStats =
      home.statistics || [];

    const awayStats =
      away.statistics || [];

    const stats = [

      [
        'Posse de bola',
        ['possession','possessionPct']
      ],

      [
        'Remates',
        ['shotsTotal','totalShots']
      ],

      [
        'Remates à baliza',
        ['shotsOnGoal','shotsOnTarget']
      ],

      [
        'Cantos',
        ['wonCorners','corners']
      ],

      [
        'Faltas',
        ['foulsCommitted','fouls']
      ],

      [
        'Foras de jogo',
        ['offsides']
      ],

      [
        'Defesas',
        ['saves']
      ],

      [
        'Passes',
        ['totalPasses','passes']
      ]

    ];

    const statsHTML =
      stats.map(item=>{

        const homeValue =
          fzValue(
            homeStats,
            item[1]
          );

        const awayValue =
          fzValue(
            awayStats,
            item[1]
          );

        return `
          <div class="fz-match-stat">

            <b>
              ${fzEsc2(homeValue)}
              —
              ${fzEsc2(awayValue)}
            </b>

            <span>
              ${fzEsc2(item[0])}
            </span>

          </div>
        `;

      }).join('');

    const html = `

      <div
        id="fz-match-extra"
        class="card fz-match-extra"
      >

        <div class="fz-match-title">
          📊 Estatísticas reais do jogo
        </div>

        <div class="fz-match-stats">
          ${statsHTML}
        </div>

        <div class="fz-match-title">
          ⚽ Golos · Assistências · Cartões · Substituições
        </div>

        <div class="last">
          ${fzEvents(data)}
        </div>

        <div class="fz-match-title">
          👥 11 titular
        </div>

        <div class="fz-lineups">

          ${fzLineup(
            data,
            home.team?.id,
            fzTeamName(home)
          )}

          ${fzLineup(
            data,
            away.team?.id,
            fzTeamName(away)
          )}

        </div>

      </div>

    `;

    box.insertAdjacentHTML(
      'beforeend',
      html
    );

  }

  /*
    Mantém o openMatch original.
    Apenas acrescenta as novas informações.
  */

  window.openMatch = function(id){

    if(typeof FZ_ORIGINAL_OPEN_MATCH === 'function'){

      FZ_ORIGINAL_OPEN_MATCH(id);

    }

    setTimeout(()=>{

      fzAddMatchInfo(id);

    },700);

  };

})();
</script></body></html>
