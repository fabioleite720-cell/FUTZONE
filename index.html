<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>
<style>
:root{--blue:#0057B8;--blue2:#1683FF;--blue3:#003B7A;--bg:#03060B;--panel:#09111C;--panel2:#0D1724;--border:#1B2A3B;--text:#F5F7FA;--muted:#9DAABB;--red:#FF4054;--green:#20D68A;--yellow:#FFD43B}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(3,6,11,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.logo{font-size:27px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--blue2)}.sub{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px}.mode{display:flex;gap:7px;margin-top:10px}.mode button,.chip,.filter{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-weight:800;font-size:12px}.mode .active,.chip.active,.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{padding:10px 10px 88px;max-width:800px;margin:auto}.chips,.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.chips{padding:2px 0 10px}.filters{padding-bottom:9px}.section-title{font-weight:900;font-size:17px;margin:9px 2px}.search{width:100%;border:1px solid var(--border);background:var(--panel);color:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;outline:none}.search:focus{border-color:var(--blue2)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:15px;padding:12px;margin:8px 0;box-shadow:0 8px 25px rgba(0,0,0,.16)}.card-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:800}.league{color:#fff}.live{color:var(--red)}.star{background:none;border:0;color:#6f7d8d;font-size:21px;padding:0}.star.on{color:var(--yellow)}.teams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px;margin-top:10px}.team{text-align:center;font-weight:850;font-size:14px}.score{text-align:center;font-size:21px;font-weight:950}.detail{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(9,17,28,.98);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:850;padding:5px}.bottom button.active{color:#fff}.bottom b{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.overlay{position:fixed;inset:0;background:rgba(3,6,11,.99);z-index:50;display:none;overflow:auto}.overlay.show{display:block}.overlay-head{position:sticky;top:0;background:rgba(3,6,11,.98);border-bottom:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}.back{border:1px solid var(--border);background:var(--panel);color:#fff;border-radius:10px;padding:8px 11px}.ov-content{max-width:800px;margin:auto;padding:10px}.event-title{text-align:center;font-size:22px;font-weight:950;margin:14px 0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:9px 7px;border-bottom:1px solid var(--border);font-size:12px;text-align:center}th{color:var(--muted);font-size:10px;text-transform:uppercase}td:first-child,th:first-child{text-align:left}.pos{width:32px;color:var(--muted)}.note{color:var(--muted);font-size:11px;line-height:1.5;margin:10px 2px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #35506b;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.badge{display:inline-block;background:rgba(0,87,184,.18);color:#75b7ff;border:1px solid rgba(0,87,184,.4);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.round{margin:14px 0 6px;font-size:12px;font-weight:900;color:#75b7ff}.series{display:flex;gap:7px;margin-bottom:8px}.small{font-size:10px}
</style>
</head>
<body>
<header><div class="brand"><div><div class="logo">FUT<span>ZONE</span></div><div class="sub">FUTEBOL EM DIRETO</div></div><span class="badge">2026/27</span></div><div class="mode"><button id="mFut" class="active" onclick="setMode('futebol')">⚽ Futebol</button><button id="mBpi" onclick="setMode('bpi')">♀ Liga BPI</button></div></header>
<main><div id="app"></div></main>
<nav class="bottom"><button id="nJogos" class="active" onclick="nav('jogos')"><b>⚽</b>Jogos</button><button id="nTab" onclick="nav('tabelas')"><b>▤</b>Tabelas</button><button id="nFav" onclick="nav('favoritos')"><b>★</b>Favoritos</button><button id="nBpi" onclick="setMode('bpi')"><b>♀</b>BPI</button></nav>
<div id="overlay" class="overlay"><div class="overlay-head"><button class="back" onclick="closeDetail()">← Voltar</button><strong id="ovTitle">Jogo</strong></div><div id="ovContent" class="ov-content"></div></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const STAND='https://site.api.espn.com/apis/v2/sports/soccer/';
const ligas=[['por.1','🇵🇹 Liga Portugal Betclic'],['por.2','🇵🇹 Liga Portugal 2 Meu Super'],['por.3','🇵🇹 Liga 3 Placard'],['eng.1','🏴 Premier League'],['eng.2','🏴 Championship'],['esp.1','🇪🇸 LaLiga'],['esp.2','🇪🇸 LaLiga 2'],['ita.1','🇮🇹 Serie A'],['ita.2','🇮🇹 Serie B'],['ger.1','🇩🇪 Bundesliga'],['ger.2','🇩🇪 2. Bundesliga'],['fra.1','🇫🇷 Ligue 1'],['fra.2','🇫🇷 Ligue 2'],['ned.1','🇳🇱 Eredivisie'],['bel.1','🇧🇪 Belgian Pro League'],['uefa.champions','🏆 Champions League'],['uefa.europa','🏆 Europa League'],['uefa.europa.conf','🏆 Conference League']];
let mode='futebol',page='jogos',liga='por.1',filtro='todos',jogos=[],favoritos=JSON.parse(localStorage.getItem('futzone_jogos_favoritos')||'[]');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtDate=d=>{let x=new Date(d);return isNaN(x)?d||'':x.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'2-digit'})};
const fmtTime=d=>{let x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})};
const fav=id=>favoritos.includes(String(id));function saveFav(){localStorage.setItem('futzone_jogos_favoritos',JSON.stringify(favoritos))}
function toggleFav(id,e){e?.stopPropagation();id=String(id);favoritos=fav(id)?favoritos.filter(x=>x!==id):[...favoritos,id];saveFav();renderCards()}
function setMode(m){mode=m;page='jogos';document.getElementById('mFut').classList.toggle('active',m==='futebol');document.getElementById('mBpi').classList.toggle('active',m==='bpi');render();m==='bpi'?loadBPI():loadESPN()}
function nav(p){page=p;document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.getElementById(p==='jogos'?'nJogos':p==='tabelas'?'nTab':'nFav').classList.add('active');render();if(p==='tabelas')mode==='bpi'?renderBPITable():loadStandings()}
function render(){const a=document.getElementById('app');if(page==='tabelas'){a.innerHTML='<div class="section-title">Classificação</div><div id="tableBox" class="empty"><span class="spinner"></span> A carregar…</div>';return}if(page==='favoritos'){let x=jogos.filter(j=>fav(j.id));a.innerHTML='<div class="section-title">Favoritos</div><div id="cards">'+(x.length?x.map(card).join(''):'<div class="empty">Ainda não tens jogos favoritos.</div>')+'</div>';return}a.innerHTML='<div class="chips">'+(mode==='futebol'?ligas.map(x=>`<button class="chip ${liga===x[0]?'active':''}" onclick="selectLiga('${x[0]}')">${x[1]}</button>`).join(''):'<span class="chip active">♀ Liga BPI Feminina</span>')+'</div><input id="search" class="search" placeholder="Pesquisar equipa…" oninput="renderCards()"><div class="filters"><button class="filter '+(filtro==='todos'?'active':'')+'" onclick="setFiltro(\'todos\')">Todos</button><button class="filter '+(filtro==='live'?'active':'')+'" onclick="setFiltro(\'live\')">🔴 Live</button><button class="filter '+(filtro==='proximos'?'active':'')+'" onclick="setFiltro(\'proximos\')">Próximos</button><button class="filter '+(filtro==='resultados'?'active':'')+'" onclick="setFiltro(\'resultados\')">Resultados</button></div><div id="cards"></div>';renderCards()}
function selectLiga(x){liga=x;filtro='todos';render();loadESPN()}function setFiltro(x){filtro=x;renderCards()}
function renderCards(){let b=document.getElementById('cards');if(!b)return;let q=(document.getElementById('search')?.value||'').toLowerCase(),a=jogos.filter(j=>(j.home+' '+j.away).toLowerCase().includes(q)),now=Date.now();if(filtro==='live')a=a.filter(j=>j.live);if(filtro==='proximos')a=a.filter(j=>!j.completed&&new Date(j.date).getTime()>=now);if(filtro==='resultados')a=a.filter(j=>j.completed);a.sort((x,y)=>new Date(x.date)-new Date(y.date));b.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Não há jogos para este filtro.</div>'}
function card(j){let s=j.live?'<span class="live">● LIVE</span>':j.completed?'FINAL':(j.timeLabel||fmtTime(j.date)||'Hora a confirmar');let sc=(j.live||j.completed)?`${j.hs} - ${j.as}`:'—';return `<div class="card" onclick="openDetail('${esc(j.id)}')"><div class="card-head"><span class="league">${esc(j.leagueName||'')}</span><button class="star ${fav(j.id)?'on':''}" onclick="toggleFav('${esc(j.id)}',event)">★</button></div><div class="teams"><div class="team">${esc(j.home)}</div><div><div class="score">${sc}</div><div class="detail">${esc(s)}</div></div><div class="team">${esc(j.away)}</div></div><div class="detail">${esc(fmtDate(j.date))}</div></div>`}
async function get(url){let r=await fetch(url);if(!r.ok)throw Error(r.status);return r.json()}
function monthRanges(){let a=[],d=new Date('2026-07-01T00:00:00Z'),e=new Date('2027-06-30T23:59:59Z');while(d<e){let z=new Date(d);z.setUTCMonth(z.getUTCMonth()+1);z.setUTCDate(z.getUTCDate()-1);a.push([d.toISOString().slice(0,10),z.toISOString().slice(0,10)]);d=new Date(z);d.setUTCDate(d.getUTCDate()+1)}return a}
async function loadESPN(){let b=document.getElementById('cards');if(b)b.innerHTML='<div class="empty"><span class="spinner"></span> A carregar jogos…</div>';try{let packs=await Promise.all(monthRanges().map(r=>get(`${API}${liga}/scoreboard?dates=${r[0].replaceAll('-','')}-${r[1].replaceAll('-','')}`).catch(()=>({events:[]}))));let m=new Map();packs.flatMap(x=>x.events||[]).forEach(e=>{let c=e.competitions?.[0],cs=c?.competitors||[],h=cs.find(x=>x.homeAway==='home'),a=cs.find(x=>x.homeAway==='away');if(!h||!a)return;let st=e.status?.type?.state||'pre';m.set(String(e.id),{id:String(e.id),date:e.date,home:h.team?.displayName||h.team?.name||'',away:a.team?.displayName||a.team?.name||'',hs:Number(h.score??0),as:Number(a.score??0),completed:st==='post',live:st==='in',leagueName:(ligas.find(x=>x[0]===liga)||['',''])[1]})});jogos=[...m.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));renderCards()}catch(e){jogos=[];renderCards()}}

/* LIGA BPI 2026/27: calendário completo das 18 jornadas.
   As datas/horários publicados são usados quando conhecidos; sem confirmação fica “Hora a confirmar”.
   Resultados não são inventados: entram apenas quando forem acrescentados/obtidos por fonte de resultados. */
const BPI_TEAMS=['Benfica','FC Porto','Sporting','SC Braga','Racing Power FC','Valadares Gaia','Vitória SC','Torreense','Rio Ave','Marítimo'];
const BPI_DATES=['2026-09-12','2026-09-19','2027-01-03','2026-10-18','2026-10-25','2026-11-01','2026-11-22','2026-12-20','2027-01-17','2027-01-31','2027-02-07','2027-03-14','2027-03-27','2027-04-11','2027-05-02','2027-05-09','2027-05-16','2027-05-23'];
const BPI_R1=[['Valadares Gaia','FC Porto'],['SC Braga','Marítimo'],['Sporting','Vitória SC'],['Benfica','Racing Power FC'],['Torreense','Rio Ave']];
const BPI_R2=[['Rio Ave','Benfica'],['Vitória SC','Torreense'],['Racing Power FC','Valadares Gaia'],['FC Porto','SC Braga'],['Marítimo','Sporting']];
function roundRobin(){let arr=['Valadares Gaia','Benfica','Marítimo','Torreense','Vitória SC','Sporting','Rio Ave','SC Braga','Racing Power FC','FC Porto'],rs=[];for(let r=0;r<9;r++){let p=[];for(let i=0;i<5;i++){let a=arr[i],b=arr[9-i];p.push(r===0?BPI_R1[i]:r===1?BPI_R2[i]:[a,b])}rs.push(p);arr=[arr[0],arr[9],...arr.slice(1,9)]}let out=[];for(let r=0;r<9;r++)out.push(rs[r]);for(let r=0;r<9;r++)out.push(rs[r].map(x=>[x[1],x[0]]));return out}
const BPI_ROUNDS=roundRobin();
const BPI_KNOWN={'Valadares Gaia|FC Porto|1':null,'SC Braga|Marítimo|1':null,'Sporting|Vitória SC|1':null,'Benfica|Racing Power FC|1':null,'Torreense|Rio Ave|1':null};
function loadBPI(){jogos=[];BPI_ROUNDS.forEach((games,r)=>games.forEach((g,i)=>{let time=(r===0&&i===0?'17:00':r===0&&i===1?'17:00':r===0&&i===2?'18:00':r===0&&i===3?'20:30':r===0&&i===4?'18:00':r===1&&i===0?'11:00':r===1&&i===1?'11:00':r===1&&i===2?'15:00':r===1&&i===3?'20:30':'Hora a confirmar');let known=BPI_KNOWN[`${g[0]}|${g[1]}|${r+1}`];jogos.push({id:`bpi-${r+1}-${i+1}`,date:`${BPI_DATES[r]}T12:00:00`,timeLabel:time,home:g[0],away:g[1],hs:known?.hs,as:known?.as,completed:!!known,live:false,leagueName:'Liga BPI Feminina',round:r+1})}));renderCards()}
function renderBPITable(){let b=document.getElementById('tableBox'),s={};BPI_TEAMS.forEach(t=>s[t]={team:t,j:0,w:0,d:0,l:0,gf:0,ga:0,p:0});jogos.filter(x=>x.completed).forEach(x=>{let h=s[x.home],a=s[x.away];if(!h||!a)return;h.j++;a.j++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;if(x.hs>x.as){h.w++;h.p+=3;a.l++}else if(x.hs<x.as){a.w++;a.p+=3;h.l++}else{h.d++;a.d++;h.p++;a.p++}});let r=Object.values(s).sort((a,b)=>b.p-a.p||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf);b.innerHTML='<div class="section-title">Liga BPI Feminina 2026/27</div>'+table(r)+'<div class="note">Calendário completo integrado. Resultados só entram quando confirmados; não são inventados.</div>'}
function table(r){return '<div class="table-wrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>P</th></tr></thead><tbody>'+r.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.team)}</strong></td><td>${x.j}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td><strong>${x.p}</strong></td></tr>`).join('')+'</tbody></table></div>'}
async function loadStandings(){let b=document.getElementById('tableBox');if(!b)return;b.innerHTML='<div class="empty"><span class="spinner"></span> A carregar classificação…</div>';try{let d=await get(`${STAND}${liga}/standings`),rows=[];(d.children||[]).forEach(g=>(g.standings?.entries||[]).forEach(e=>{let s={team:e.team?.displayName||e.team?.name||'',stats:{}};(e.stats||[]).forEach(x=>s.stats[x.name]=x.value??x.displayValue);rows.push(s)}));b.innerHTML=tableESPN(rows,ligas.find(x=>x[0]===liga)?.[1]||liga)}catch(e){b.innerHTML='<div class="empty">A classificação desta competição não está disponível neste momento.</div>'}}
function tableESPN(r,t){return '<div class="section-title">'+esc(t)+'</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th><th>P</th></tr></thead><tbody>'+r.map((x,i)=>{let s=x.stats;return `<tr><td>${i+1}</td><td><strong>${esc(x.team)}</strong></td><td>${s.gamesPlayed??s.games??0}</td><td>${s.wins??0}</td><td>${s.ties??s.draws??0}</td><td>${s.losses??0}</td><td>${s.pointsFor??s.goalsFor??0}</td><td>${s.pointsAgainst??s.goalsAgainst??0}</td><td>${s.pointDifferential??s.goalDifference??0}</td><td><strong>${s.points??0}</strong></td></tr>`}).join('')+'</tbody></table></div>'}
function openDetail(id){let j=jogos.find(x=>x.id===id);if(!j)return;document.getElementById('ovTitle').textContent=j.home+' × '+j.away;document.getElementById('ovContent').innerHTML=`<div class="event-title">${esc(j.home)}<br><small>vs</small><br>${esc(j.away)}</div><div class="statgrid"><div class="stat"><b>${j.completed||j.live?j.hs:'—'}</b><span>${esc(j.home)}</span></div><div class="stat"><b>${j.live?'LIVE':j.completed?'FINAL':esc(j.timeLabel||fmtTime(j.date)||'A confirmar')}</b><span>${esc(fmtDate(j.date))}</span></div><div class="stat"><b>${j.completed||j.live?j.as:'—'}</b><span>${esc(j.away)}</span></div></div><div class="note">${esc(j.leagueName)}${j.round?' · Jornada '+j.round:''}</div>`;document.getElementById('overlay').classList.add('show')}
function closeDetail(){document.getElementById('overlay').classList.remove('show')}
function boot(){render();mode==='bpi'?loadBPI():loadESPN()}boot();setInterval(()=>{if(mode==='futebol'&&page==='jogos')loadESPN()},60000);
</script>
</body>
</html>
