<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --azul:#0057B8;
  --azul2:#0077FF;
  --azul3:#003B7A;
  --preto:#02050A;
  --card:#08111D;
  --card2:#0C1725;
  --branco:#FFFFFF;
  --cinza:#9BA9BA;
  --linha:#17283D;
  --verde:#18D26E;
  --vermelho:#FF4052;
  --amarelo:#FFD23F;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(0,87,184,.35),transparent 40%),
    linear-gradient(180deg,#02050A 0%,#050B13 100%);
  color:var(--branco);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh
}

button{
  font-family:inherit;
  cursor:pointer
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:14px 15px 13px;
  background:rgba(2,5,10,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(0,119,255,.22);
  box-shadow:0 5px 25px rgba(0,0,0,.35)
}

header:after{
  content:"";
  display:block;
  height:2px;
  margin-top:12px;
  border-radius:10px;
  background:linear-gradient(90deg,transparent,var(--azul),var(--azul2),var(--azul),transparent);
  box-shadow:0 0 12px rgba(0,119,255,.65)
}

.logo{
  font-size:27px;
  font-weight:1000;
  letter-spacing:-1.5px;
  line-height:1
}

.logo span{
  color:var(--azul2);
  text-shadow:0 0 18px rgba(0,119,255,.6)
}

.slogan{
  color:var(--cinza);
  font-size:9px;
  letter-spacing:3px;
  margin-top:6px;
  font-weight:bold
}

/* MAIN */

main{
  padding:14px 11px 95px;
  max-width:760px;
  margin:auto
}

h2{
  font-size:19px;
  margin:17px 2px 11px;
  font-weight:900
}

h2:first-child{
  margin-top:4px
}

/* LIGAS */

.seletor-ligas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:18px
}

.liga-btn{
  position:relative;
  overflow:hidden;
  min-height:76px;
  background:linear-gradient(145deg,#0B1624,#060D16);
  border:1px solid var(--linha);
  border-radius:15px;
  padding:12px 7px;
  color:#fff;
  text-align:center;
  font-size:12px;
  font-weight:800;
  transition:.2s
}

.liga-btn:active{
  transform:scale(.97)
}

.liga-btn.active{
  background:
    linear-gradient(145deg,rgba(0,87,184,.55),rgba(0,59,122,.28)),
    #07111D;
  border-color:#1683FF;
  box-shadow:
    0 0 0 1px rgba(0,119,255,.15),
    0 8px 25px rgba(0,87,184,.22),
    inset 0 0 25px rgba(0,119,255,.08)
}

.liga-btn.active:after{
  content:"";
  position:absolute;
  bottom:0;
  left:22%;
  right:22%;
  height:2px;
  background:var(--azul2);
  box-shadow:0 0 10px var(--azul2)
}

.liga-icon{
  font-size:23px;
  display:block;
  margin-bottom:7px
}

/* JOGOS */

.jogo{
  position:relative;
  background:
    linear-gradient(145deg,rgba(12,23,37,.98),rgba(5,11,18,.98));
  border:1px solid var(--linha);
  border-radius:16px;
  padding:13px;
  margin-bottom:10px;
  cursor:pointer;
  box-shadow:0 7px 22px rgba(0,0,0,.22);
  transition:.2s;
  overflow:hidden
}

.jogo:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:linear-gradient(var(--azul2),var(--azul3));
  opacity:.8
}

.jogo:active{
  transform:scale(.985);
  border-color:#126BD0
}

.jogo-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--cinza);
  font-size:10px;
  margin-bottom:12px
}

.jogo-top span:last-child{
  color:#65AFFF;
  font-weight:bold
}

.equipas{
  display:grid;
  grid-template-columns:1fr 62px 1fr;
  align-items:center;
  gap:6px
}

.equipa{
  text-align:center;
  font-size:12px;
  font-weight:800;
  line-height:1.25
}

.escudo{
  width:37px;
  height:37px;
  object-fit:contain;
  display:block;
  margin:0 auto 7px
}

.resultado{
  text-align:center;
  font-size:20px;
  font-weight:1000;
  letter-spacing:-1px
}

.vazio{
  background:linear-gradient(145deg,#0B1624,#060D16);
  border:1px solid var(--linha);
  border-radius:14px;
  padding:24px 16px;
  text-align:center;
  color:var(--cinza);
  font-size:13px
}

/* LIVE */

.live{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#fff!important;
  background:rgba(255,64,82,.12);
  border:1px solid rgba(255,64,82,.4);
  padding:4px 7px;
  border-radius:20px
}

.live:before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--vermelho);
  box-shadow:0 0 8px var(--vermelho)
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(3,7,13,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(0,119,255,.18);
  display:flex;
  z-index:30;
  padding-bottom:3px
}

.bottom button{
  position:relative;
  background:none;
  border:0;
  color:#7F8EA1;
  font-weight:bold;
  width:33.333%;
  font-size:11px;
  transition:.2s
}

.bottom button:first-line{
  font-size:20px
}

.bottom button.active{
  color:#fff;
  text-shadow:0 0 12px rgba(0,119,255,.7)
}

.bottom button.active:after{
  content:"";
  position:absolute;
  bottom:0;
  left:28%;
  right:28%;
  height:3px;
  border-radius:5px 5px 0 0;
  background:var(--azul2);
  box-shadow:0 0 12px var(--azul2)
}

/* DETALHE */

.overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% -5%,rgba(0,87,184,.28),transparent 40%),
    #02050A;
  z-index:50;
  overflow:auto
}

.detalhe-header{
  position:sticky;
  top:0;
  background:rgba(2,5,10,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(0,119,255,.2);
  padding:12px;
  z-index:5
}

.voltar{
  background:#091625;
  border:1px solid #1C395B;
  color:#fff;
  border-radius:10px;
  padding:9px 14px;
  font-weight:bold
}

.voltar:active{
  transform:scale(.96)
}

.detalhe{
  max-width:760px;
  margin:auto;
  padding:12px 11px 40px
}

/* JOGO GRANDE */

.jogo-grande{
  position:relative;
  background:
    radial-gradient(circle at 50% 0%,rgba(0,119,255,.18),transparent 55%),
    linear-gradient(145deg,#0B1725,#050B13);
  border:1px solid #193451;
  border-radius:18px;
  padding:22px 10px;
  margin-bottom:13px;
  box-shadow:0 12px 35px rgba(0,0,0,.3)
}

.jogo-grande:before{
  content:"";
  position:absolute;
  top:0;
  left:18%;
  right:18%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--azul2),transparent);
  box-shadow:0 0 15px rgba(0,119,255,.7)
}

.jogo-grande .equipas{
  grid-template-columns:1fr 90px 1fr
}

.jogo-grande .escudo{
  width:58px;
  height:58px
}

.jogo-grande .equipa{
  font-size:14px
}

.bigscore{
  text-align:center;
  font-size:31px;
  font-weight:1000;
  letter-spacing:-1px
}

.estado{
  text-align:center;
  color:#61AEFF;
  font-size:11px;
  margin-top:6px;
  font-weight:bold
}

/* SECÇÕES */

.secao{
  background:
    linear-gradient(145deg,rgba(12,23,37,.98),rgba(5,11,18,.98));
  border:1px solid var(--linha);
  border-radius:16px;
  margin:11px 0;
  padding:14px;
  box-shadow:0 7px 24px rgba(0,0,0,.2)
}

.secao h3{
  font-size:15px;
  margin:0 0 12px;
  font-weight:900
}

.secao h3:first-letter{
  color:var(--azul2)
}

/* EVENTOS */

.evento{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #142438;
  font-size:12px
}

.evento:last-child{
  border-bottom:0
}

.minuto{
  color:#5EABFF;
  font-weight:900;
  min-width:42px
}

/* STATS */

.stats-head,
.stat-row{
  display:grid;
  grid-template-columns:1fr 95px 1fr;
  text-align:center
}

.stats-head{
  font-size:10px;
  color:var(--cinza);
  margin-bottom:7px;
  font-weight:bold
}

.stat-row{
  align-items:center;
  border-top:1px solid #142438;
  padding:10px 0;
  font-size:12px
}

.stat-row .nome{
  font-size:10px;
  color:var(--cinza);
  font-weight:bold
}

.stat-home{
  text-align:right;
  font-weight:900
}

.stat-away{
  text-align:left;
  font-weight:900
}

/* JOGADORES */

.lista-jogadores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.jogador{
  background:#07111D;
  border:1px solid #172B42;
  border-radius:11px;
  padding:10px;
  font-size:11px;
  min-height:48px
}

.jogador b{
  color:#55A9FF;
  margin-right:5px
}

.subtitulo{
  color:var(--cinza);
  font-size:10px;
  margin:8px 0
}

.carregando{
  text-align:center;
  color:var(--cinza);
  padding:25px
}

.erro{
  color:#FF858F;
  text-align:center;
  padding:18px
}

/* TABELAS */

.tabela{
  width:100%;
  border-collapse:collapse;
  font-size:11px
}

.tabela th{
  color:#66AEFF;
  padding:9px 5px;
  border-bottom:1px solid #21415F
}

.tabela td{
  padding:10px 5px;
  border-bottom:1px solid #142438;
  text-align:center
}

.tabela td:nth-child(2){
  text-align:left;
  font-weight:bold
}

@media(max-width:380px){
  .equipas{
    grid-template-columns:1fr 54px 1fr
  }

  .resultado{
    font-size:18px
  }

  .jogo-grande .equipas{
    grid-template-columns:1fr 72px 1fr
  }

  .jogo-grande .escudo{
    width:50px;
    height:50px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span></div>
  <div class="slogan">FUTEBOL EM DIRETO</div>
</header>

<main id="app"></main>

<div class="bottom">
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
  <button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ligas=[
 {nome:"Portugal",arquivo:"data/primeira-liga.json",codigo:"por.1",icone:"🇵🇹"},
 {nome:"Inglaterra",arquivo:"data/premier-league.json",codigo:"eng.1",icone:"🏴"},
 {nome:"Espanha",arquivo:"data/la-liga.json",codigo:"esp.1",icone:"🇪🇸"},
 {nome:"Itália",arquivo:"data/serie-a.json",codigo:"ita.1",icone:"🇮🇹"},
 {nome:"Alemanha",arquivo:"data/bundesliga.json",codigo:"ger.1",icone:"🇩🇪"},
 {nome:"Champions League",arquivo:"data/champions-league.json",codigo:"uefa.champions",icone:"🏆"},
 {nome:"Liga Europa",arquivo:"data/liga-europa.json",codigo:"uefa.europa",icone:"🏆"},
 {nome:"Liga Conferência",arquivo:"data/liga-conferencia.json",codigo:"uefa.europa.conf",icone:"🏆"}
];

let jogos=[];
let ligaSelecionada="Portugal";

let favoritos=JSON.parse(
 localStorage.getItem("futzone_favoritos")||"[]"
);

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(
 /[&<>"']/g,
 m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
 }[m])
);

function logo(u){
 return u
 ? `<img class="escudo" src="${esc(u)}"
     onerror="this.style.visibility='hidden'">`
 : `<div style="height:44px"></div>`;
}

function comp(j){
 return j?.competitions?.[0]||{};
}

function nome(c){
 return c?.team?.displayName||
 c?.team?.shortDisplayName||
 c?.team?.name||
 c?.displayName||
 "Equipa";
}

function jogo(j,l){

 let c=comp(j);
 let cs=c.competitors||[];

 let h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
 let a=cs.find(x=>x.homeAway==="away")||cs[1]||{};

 let estado=
 c?.status?.type?.shortDetail||
 c?.status?.type?.detail||
 c?.status?.type?.description||
 "";

 return {
  id:String(j.id),
  codigo:l.codigo,
  liga:l.nome,

  home:{
   nome:nome(h),
   logo:h?.team?.logo||"",
   score:h?.score??"-"
  },

  away:{
   nome:nome(a),
   logo:a?.team?.logo||"",
   score:a?.score??"-"
  },

  estado:estado
 };
}

async function carregarJogos(){

 jogos=[];

 for(const l of ligas){

  try{

   let r=await fetch(
    l.arquivo+"?_="+Date.now()
   );

   if(r.ok){

    let d=await r.json();

    (d.events||[]).forEach(j=>{
      jogos.push(jogo(j,l));
    });

   }

  }catch(e){}

 }

 mostrarJogos();
}

function botoes(){

 return `
 <div class="seletor-ligas">

 ${ligas.map(l=>`

 <button
   class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
   onclick="selecionarLiga('${l.nome}')">

   <span class="liga-icon">${l.icone}</span>

   ${esc(l.nome)}

 </button>

 `).join("")}

 </div>
 `;
}

function selecionarLiga(n){

 ligaSelecionada=n;

 mostrarJogos();

 window.scrollTo(0,0);
}

function cartao(j){

 let favorito=favoritos.includes(j.id);

 return `

 <div
   class="jogo"
   onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

   <div class="jogo-top">

     <span>${esc(j.liga)}</span>

     <span class="${/live|ao vivo|ht|half/i.test(j.estado)?"live":""}">
       ${esc(j.estado)}
     </span>

   </div>

   <div class="equipas">

     <div class="equipa">
       ${logo(j.home.logo)}
       ${esc(j.home.nome)}
     </div>

     <div class="resultado">
       ${esc(j.home.score)}
       -
       ${esc(j.away.score)}
     </div>

     <div class="equipa">
       ${logo(j.away.logo)}
       ${esc(j.away.nome)}
     </div>

   </div>

 </div>

 `;
}

function mostrarJogos(){

 nav("navJogos");

 let l=jogos.filter(
   j=>j.liga===ligaSelecionada
 );

 app.innerHTML=`

   <h2>⚡ Jogos</h2>

   ${botoes()}

   <h2>${esc(ligaSelecionada)}</h2>

   ${
     l.length
     ? l.map(cartao).join("")
     : `
       <div class="vazio">
         ⚽ Não há jogos disponíveis neste momento.
       </div>
       `
   }

 `;
}

function nav(id){

 ["navJogos","navTabelas","navFav"].forEach(x=>{

   document
    .getElementById(x)
    .classList.toggle(
      "active",
      x===id
    );

 });

}

function txt(v){

 return typeof v==="object"
 ? (
    v?.displayValue||
    v?.value||
    v?.text||
    ""
   )
 : String(v??"");

}

/* EVENTOS */

function extrairEventos(d){

 let out=[];
 let seen=new Set();

 let src=[
  ...(d.plays||[]),
  ...(d.keyEvents||[]),
  ...(d.scoringPlays||[])
 ];

 for(let e of src){

  let s=(
   (e?.type?.text||"")+" "+
   (e?.text||
    e?.shortText||
    e?.description||
    "")
  ).toLowerCase();

  let t=
   e?.text||
   e?.shortText||
   e?.description||
   e?.type?.text||
   "Evento";

  if(
   !/goal|gol|yellow|amarelo|red|vermelho|substitut|penalt/.test(s)
  ) continue;

  let k=JSON.stringify([
   e?.id,
   e?.clock?.displayValue,
   t
  ]);

  if(seen.has(k)) continue;

  seen.add(k);

  let i=
   /yellow|amarelo/.test(s) ? "🟨" :
   /red|vermelho/.test(s) ? "🟥" :
   /penalt/.test(s) ? "⚽" :
   /substitut/.test(s) ? "🔄" :
   "⚽";

  out.push({
   m:e?.clock?.displayValue||
      e?.period?.displayValue||
      "",
   t:t,
   i:i
  });

 }

 return out;
}

/* ESTATÍSTICAS */

function extrairStats(d){

 let grupos=[];

 function add(team,ss){

  if(!team||!Array.isArray(ss)) return;

  let id=
   team?.id||
   team?.team?.id||
   team?.displayName||
   team?.team?.displayName;

  let g=grupos.find(
   x=>String(x.id)===String(id)
  );

  if(!g){

   g={
    id:id,
    nome:
     team?.displayName||
     team?.name||
     team?.team?.displayName||
     team?.team?.name||
     "Equipa",
    s:[]
   };

   grupos.push(g);
  }

  ss.forEach(x=>{

   let n=
    x?.displayName||
    x?.shortDisplayName||
    x?.name||
    x?.label||
    x?.description;

   if(n){

    g.s.push({
     n:n,
     v:txt(
       x?.displayValue||
       x?.value||
       x?.display
     )
    });

   }

  });

 }

 (d.boxscore?.teams||[])
 .forEach(t=>
   add(
     t.team||t,
     t.statistics||t.stats
   )
 );

 (d.header?.competitions?.[0]?.competitors||
  d.competitions?.[0]?.competitors||
  [])
 .forEach(c=>
   add(
     c.team||c,
     c.statistics
   )
 );

 (d.competitors||[])
 .forEach(c=>
   add(
     c.team||c,
     c.statistics
   )
 );

 if(grupos.length<2) return [];

 let m=new Map();

 grupos.forEach(g=>{

  g.s.forEach(x=>{

   let k=x.n.toLowerCase();

   if(!m.has(k)){

    m.set(k,{
     n:x.n,
     h:"-",
     a:"-"
    });

   }

   let r=m.get(k);

   if(r.h==="-")
     r.h=x.v;
   else if(r.a==="-")
     r.a=x.v;

  });

 });

 return [...m.values()];
}

/* PLANTÉIS */

function extrairPlantel(d){

 let gs=[];

 function add(team,arr){

  if(!team||!Array.isArray(arr))
   return;

  let id=
   team?.id||
   team?.team?.id||
   team?.displayName;

  let g=gs.find(
   x=>String(x.id)===String(id)
  );

  if(!g){

   g={
    id:id,
    nome:
     team?.displayName||
     team?.name||
     team?.team?.displayName||
     "Equipa",
    p:[]
   };

   gs.push(g);
  }

  arr.forEach(x=>{

   let a=
    x?.athlete||
    x?.player||
    x;

   if(!a?.displayName&&!a?.fullName)
    return;

   let n=
    a.displayName||
    a.fullName||
    a.shortName;

   if(g.p.some(q=>q.n===n))
    return;

   g.p.push({

    n:n,

    num:
     a.jersey||
     x.jersey||
     a.uniformNumber||
     "",

    pos:
     a?.position?.abbreviation||
     a?.position?.displayName||
     x?.position?.displayName||
     "",

    tit:
     x.starter===true||
     x.starter==="true"

   });

  });

 }

 (d.rosters||[])
 .forEach(r=>
   add(
    r.team||r,
    r.roster||
    r.athletes||
    r.players
   )
 );

 (d.boxscore?.players||[])
 .forEach(g=>
   add(
    g.team||g,
    g.statistics||
    g.athletes||
    g.roster||
    g.players
   )
 );

 (d.header?.competitions?.[0]?.competitors||[])
 .forEach(c=>
   add(
    c.team||c,
    c.roster||
    c.athletes||
    c.players
   )
 );

 return gs.filter(
   g=>g.p.length
 );
}

/* BLOCOS */

function blocoEventos(a){

 return `

 <div class="secao">

   <h3>⚽ Golos e eventos</h3>

   ${
    a.length

    ? a.map(e=>`

      <div class="evento">

        <span class="minuto">
          ${esc(e.m)}
        </span>

        <span>
          ${e.i} ${esc(e.t)}
        </span>

      </div>

    `).join("")

    : `
      <div class="vazio">
        Não há golos ou eventos disponíveis.
      </div>
      `
   }

 </div>

 `;
}

function blocoStats(a){

 return `

 <div class="secao">

  <h3>📊 Estatísticas do jogo</h3>

  ${
   a.length

   ? `

    <div class="stats-head">
      <span>CASA</span>
      <span>ESTAT.</span>
      <span>FORA</span>
    </div>

    ${
     a.map(x=>`

      <div class="stat-row">

       <div class="stat-home">
         ${esc(x.h)}
       </div>

       <div class="nome">
         ${esc(x.n)}
       </div>

       <div class="stat-away">
         ${esc(x.a)}
       </div>

      </div>

     `).join("")
    }

   `

   : `
     <div class="vazio">
       Estatísticas não disponíveis para este jogo.
     </div>
     `
  }

 </div>

 `;
}

function blocoPlantel(gs){

 if(!gs.length) return "";

 return `

 <div class="secao">

  <h3>👥 Equipas e jogadores</h3>

  ${
   gs.map(g=>`

    <div style="margin-bottom:18px">

      <b>${esc(g.nome)}</b>

      <div class="subtitulo">
        ${
         g.p.some(x=>x.tit)
         ? "Titulares"
         : "Jogadores disponíveis"
        }
      </div>

      <div class="lista-jogadores">

       ${
        g.p.map(p=>`

         <div class="jogador">

          <b>${esc(p.num)}</b>

          ${esc(p.n)}

          ${
           p.pos
           ? `
            <small style="
             display:block;
             color:#8EA0B5;
             margin-top:4px
            ">
             ${esc(p.pos)}
            </small>
           `
           : ""
          }

         </div>

        `).join("")
       }

      </div>

    </div>

   `).join("")
  }

 </div>

 `;
}

/* DETALHE */

async function abrirDetalhe(id,codigo){

 let j=jogos.find(
   x=>x.id===id
 );

 if(!j) return;

 let o=document.createElement("div");

 o.className="overlay";

 o.innerHTML=`

  <div class="detalhe-header">

   <button
    class="voltar"
    onclick="this.closest('.overlay').remove()">

    ← Voltar

   </button>

  </div>

  <div class="detalhe">

   <div class="jogo-grande">

    <div class="equipas">

     <div class="equipa">

      ${logo(j.home.logo)}

      ${esc(j.home.nome)}

     </div>

     <div>

      <div class="bigscore">

       ${esc(j.home.score)}
       -
       ${esc(j.away.score)}

      </div>

      <div class="estado">

       ${esc(j.estado)}

      </div>

     </div>

     <div class="equipa">

      ${logo(j.away.logo)}

      ${esc(j.away.nome)}

     </div>

    </div>

   </div>

   <div class="carregando">
    ⏳ A carregar detalhes do jogo...
   </div>

  </div>

 `;

 document.body.appendChild(o);

 try{

  let r=await fetch(
   "https://site.api.espn.com/apis/site/v2/sports/soccer/"
   +encodeURIComponent(codigo)
   +"/summary?event="
   +encodeURIComponent(id)
   +"&_="+Date.now()
  );

  if(!r.ok) throw 0;

  let d=await r.json();

  o.querySelector(".detalhe")
   .insertAdjacentHTML(
    "beforeend",
    blocoEventos(
     extrairEventos(d)
    )+
    blocoStats(
     extrairStats(d)
    )+
    blocoPlantel(
     extrairPlantel(d)
    )
   );

  o.querySelector(".carregando").remove();

 }catch(e){

  o.querySelector(".carregando").outerHTML=`

   <div class="erro">

    ❌ Não foi possível carregar
    os dados deste jogo.

   </div>

  `;

 }

}

/* FAVORITOS */

function guardarFavorito(id){

 if(favoritos.includes(id)){

  favoritos=favoritos.filter(
   x=>x!==id
  );

 }else{

  favoritos.push(id);

 }

 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(favoritos)
 );

 mostrarFavoritos();
}

function mostrarFavoritos(){

 nav("navFav");

 let l=jogos.filter(
  j=>favoritos.includes(j.id)
 );

 app.innerHTML=`

  <h2>⭐ Favoritos</h2>

  ${
   l.length

   ? l.map(cartao).join("")

   : `
     <div class="vazio">

       ⭐ Ainda não tens jogos favoritos.

       <br><br>

       Abre um jogo para adicionares aos favoritos.

     </div>
     `
  }

 `;

}

/* TABELAS */

async function mostrarTabelas(){

 nav("navTabelas");

 app.innerHTML=`

  <h2>🏆 Tabelas</h2>

  ${botoes()}

  <div class="carregando">
    ⏳ A carregar classificação...
  </div>

 `;

 let l=ligas.find(
  x=>x.nome===ligaSelecionada
 );

 if(!l) return;

 try{

  let r=await fetch(
   "https://site.api.espn.com/apis/site/v2/sports/soccer/"
   +encodeURIComponent(l.codigo)
   +"/scoreboard?limit=1&_="+Date.now()
  );

  if(!r.ok) throw 0;

  /*
   As tabelas podem não estar disponíveis
   através deste endpoint para todas as competições.
  */

  app.querySelector(".carregando").innerHTML=`

   <div class="vazio">

    📊 A tabela desta competição
    será apresentada quando os dados
    de classificação estiverem disponíveis.

   </div>

  `;

 }catch(e){

  app.querySelector(".carregando").innerHTML=`

   <div class="erro">

    Não foi possível carregar a tabela.

   </div>

  `;

 }

}

 60000
);
