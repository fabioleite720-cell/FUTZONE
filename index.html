<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTZONE">
<link rel="manifest" href="./manifest.json">

<title>FUTZONE — Futebol em Direto</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --black:#03060B;
  --bg:#050A11;
  --card:#09111C;
  --card2:#0D1724;
  --line:#1A2A3C;
  --text:#FFFFFF;
  --muted:#9DAABB;
  --red:#FF4054;
  --yellow:#FFD43B;
  --green:#20D68A;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================================================
   APP
   ========================================================= */

#app{
  min-height:100vh;
  padding-bottom:82px;
}

.container{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:0 14px;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.headerInner{
  max-width:760px;
  margin:auto;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
}

.logo{
  font-size:27px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue2);
}

.subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
}

/* =========================================================
   SPORT SWITCH
   ========================================================= */

.sportSwitch{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.sportBtn{
  flex:1;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:12px;
  padding:10px 8px;
  font-size:13px;
  font-weight:900;
}

.sportBtn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* =========================================================
   SECTION TITLES
   ========================================================= */

.sectionTitle{
  margin:18px 0 10px;
  font-size:16px;
  font-weight:950;
}

.sectionTitle small{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

/* =========================================================
   LEAGUES
   ========================================================= */

.leagues{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 5px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{
  display:none;
}

.leagueChip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:850;
  white-space:nowrap;
}

.leagueChip.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* =========================================================
   FILTERS
   ========================================================= */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  margin:12px 0;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:10px;
  padding:8px 12px;
  font-size:11px;
  font-weight:850;
}

.filter.active{
  background:var(--blue3);
  color:white;
  border-color:var(--blue);
}

/* =========================================================
   LIVE GLOBAL
   ========================================================= */

.liveGlobal{
  margin:12px 0;
  border:1px solid rgba(255,64,84,.35);
  background:linear-gradient(
    135deg,
    rgba(255,64,84,.12),
    rgba(9,17,28,.95)
  );
  border-radius:15px;
  overflow:hidden;
}

.liveGlobalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 13px;
}

.liveGlobalTitle{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:950;
}

.liveDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(255,64,84,.8);
}

.liveCount{
  background:var(--red);
  color:white;
  border-radius:999px;
  padding:3px 8px;
  font-size:10px;
  font-weight:950;
}

.liveGlobalBody{
  padding:0 10px 10px;
}

/* =========================================================
   MATCH CARD
   ========================================================= */

.games{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.gameCard{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  overflow:hidden;
}

.gameCard:active{
  transform:scale(.995);
}

.gameTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}

.gameLeague{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.gameStatus{
  flex:0 0 auto;
  font-size:10px;
  font-weight:950;
  color:var(--muted);
}

.gameStatus.live{
  color:var(--red);
}

.gameTeams{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  align-items:center;
  gap:7px;
}

.team{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
}

.team.away{
  flex-direction:row-reverse;
  text-align:right;
}

.teamLogo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:0 0 34px;
  background:#101B28;
  border-radius:50%;
  padding:3px;
}

.teamName{
  min-width:0;
  font-size:12px;
  font-weight:850;
  line-height:1.2;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scoreBox{
  text-align:center;
}

.score{
  font-size:20px;
  line-height:1;
  font-weight:1000;
}

.vs{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.gameBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.05);
}

.gameDate{
  color:var(--muted);
  font-size:10px;
  font-weight:750;
}

.favoriteBtn{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#101B28;
  color:#6F7D8E;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.favoriteBtn.active{
  color:var(--yellow);
}

/* =========================================================
   SEARCH
   ========================================================= */

.searchBox{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
}

.searchBox input{
  width:100%;
  background:var(--card);
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  outline:none;
}

.searchBox input:focus{
  border-color:var(--blue);
}

/* =========================================================
   LOADING / EMPTY / ERROR
   ========================================================= */

.loading,
.empty,
.errorBox{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 14px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.errorBox{
  color:#FF8795;
}

/* =========================================================
   TABLE
   ========================================================= */

.tableCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  margin-bottom:12px;
}

.tableHeader{
  padding:12px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.tableTitle{
  font-size:14px;
  font-weight:950;
}

.tableScroll{
  overflow-x:auto;
}

.standings{
  width:100%;
  min-width:470px;
  border-collapse:collapse;
}

.standings th{
  color:var(--muted);
  font-size:9px;
  font-weight:850;
  text-align:center;
  padding:9px 5px;
  border-bottom:1px solid var(--line);
}

.standings th:first-child,
.standings th:nth-child(2){
  text-align:left;
}

.standings td{
  padding:9px 5px;
  border-bottom:1px solid rgba(255,255,255,.04);
  text-align:center;
  font-size:11px;
  font-weight:750;
}

.standings td:first-child{
  color:var(--muted);
  width:25px;
}

.standings td:nth-child(2){
  text-align:left;
}

.tableTeam{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:145px;
  color:white;
  font-weight:850;
}

.tableTeam img{
  width:25px;
  height:25px;
  object-fit:contain;
  border-radius:50%;
}

.teamClickable{
  cursor:pointer;
}

.teamClickable:hover{
  color:#5CA7FF;
}

.points{
  color:white;
  font-weight:1000;
}

/* =========================================================
   DETAIL
   ========================================================= */

#detailView{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  overflow-y:auto;
  display:none;
}

#detailView.active{
  display:block;
}

.detailHeader{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(3,6,11,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.detailHeaderInner{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    10px;
}

.backBtn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  border-radius:11px;
  font-size:20px;
}

.detailHeaderTitle{
  font-size:15px;
  font-weight:950;
}

.detailContent{
  max-width:760px;
  margin:auto;
  padding:14px 14px 40px;
}

/* =========================================================
   DETAIL MATCH
   ========================================================= */

.matchHero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px 12px;
  text-align:center;
}

.matchHeroLeague{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-bottom:14px;
}

.matchHeroTeams{
  display:grid;
  grid-template-columns:1fr 75px 1fr;
  align-items:center;
  gap:5px;
}

.heroTeam{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  min-width:0;
}

.heroTeam img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.heroTeamName{
  font-size:12px;
  font-weight:900;
}

.heroScore{
  font-size:27px;
  font-weight:1000;
}

.heroStatus{
  margin-top:6px;
  font-size:10px;
  color:var(--muted);
  font-weight:850;
}

.heroStatus.live{
  color:var(--red);
}

.detailTabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin:12px 0;
  scrollbar-width:none;
}

.detailTabs::-webkit-scrollbar{
  display:none;
}

.detailTab{
  flex:0 0 auto;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 11px;
  font-size:10px;
  font-weight:850;
}

.detailTab.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.detailCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
  margin-bottom:11px;
}

.detailCardTitle{
  font-size:14px;
  font-weight:950;
  margin-bottom:11px;
}

.teamLineupTitle{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:950;
  margin-bottom:12px;
}

.teamLineupTitle img{
  width:27px;
  height:27px;
  object-fit:contain;
}

/* =========================================================
   FOOTBALL PITCH
   ========================================================= */

.footballPitch{
  position:relative;
  width:100%;
  max-width:390px;
  height:520px;
  margin:0 auto;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0 50%,
      rgba(0,0,0,.035) 50% 100%
    ),
    #075D38;
  border:2px solid rgba(255,255,255,.35);
}

.footballPitch:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 49.7%,
      rgba(255,255,255,.65) 49.7%,
      rgba(255,255,255,.65) 50.3%,
      transparent 50.3%
    );
}

.pitchHalf{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.5);
}

.pitchCenter{
  position:absolute;
  left:50%;
  top:50%;
  width:85px;
  height:85px;
  border:1px solid rgba(255,255,255,.7);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.pitchCenter:after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:white;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.pitchCircle{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  background:white;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.pitchBox{
  position:absolute;
  left:50%;
  top:0;
  width:45%;
  height:18%;
  transform:translateX(-50%);
  border:1px solid rgba(255,255,255,.7);
  border-top:0;
}

.pitchSmallBox{
  position:absolute;
  left:50%;
  top:0;
  width:21%;
  height:8%;
  transform:translateX(-50%);
  border:1px solid rgba(255,255,255,.7);
  border-top:0;
}

.pitchGoal{
  position:absolute;
  left:50%;
  top:0;
  width:11%;
  height:3%;
  transform:translateX(-50%);
  border:1px solid rgba(255,255,255,.8);
  border-top:0;
}

.pitchPlayer{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  width:58px;
  z-index:3;
}

.pitchPlayerDot{
  width:31px;
  height:31px;
  margin:auto;
  border-radius:50%;
  background:var(--blue);
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:1000;
  color:white;
  box-shadow:0 3px 8px rgba(0,0,0,.35);
}

.pitchPlayerName{
  margin-top:3px;
  padding:2px 4px;
  border-radius:5px;
  background:rgba(0,0,0,.72);
  color:white;
  font-size:8px;
  font-weight:850;
  white-space:nowrap;
  max-width:72px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.lineupLegend{
  margin-top:10px;
  color:var(--muted);
  text-align:center;
  font-size:10px;
}

.lineupDot{
  display:inline-block;
  width:9px;
  height:9px;
  background:var(--blue);
  border-radius:50%;
  margin-right:4px;
}

/* =========================================================
   ROSTER
   ========================================================= */

.rosterTitle{
  color:var(--muted);
  font-size:11px;
  font-weight:850;
  margin-bottom:8px;
}

.rosterGroup{
  margin-bottom:12px;
}

.rosterGroupTitle{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  color:var(--blue2);
  font-weight:950;
  margin-bottom:6px;
}

.rosterList{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.rosterPlayer{
  display:flex;
  align-items:center;
  gap:7px;
  background:#0D1724;
  border:1px solid rgba(255,255,255,.04);
  border-radius:9px;
  padding:7px;
}

.rosterNumber{
  width:25px;
  height:25px;
  border-radius:50%;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:1000;
}

.rosterInfo{
  min-width:0;
}

.rosterName{
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rosterPosition{
  color:var(--muted);
  font-size:8px;
  margin-top:2px;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  background:rgba(3,6,11,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:
    7px
    7px
    calc(7px + env(safe-area-inset-bottom));
}

.bottomNavInner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.navBtn{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:11px;
  padding:8px 3px;
  font-size:10px;
  font-weight:850;
}

.navBtn.active{
  background:rgba(0,87,184,.18);
  color:#5CA7FF;
}

.navIcon{
  display:block;
  font-size:18px;
  line-height:18px;
  margin-bottom:3px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(min-width:600px){
  .container,
  .headerInner,
  .detailHeaderInner,
  .detailContent{
    padding-left:20px;
    padding-right:20px;
  }

  .rosterList{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div id="app">

  <header>
    <div class="headerInner">

      <div class="logo">
        FUT<span>ZONE</span>
      </div>

      <div class="subtitle">
        FUTEBOL EM DIRETO
      </div>

      <div class="sportSwitch">
        <button
          id="sportFutebol"
          class="sportBtn active"
          onclick="mudarDesporto('futebol')">
          ⚽ Futebol
        </button>

        <button
          id="sportFutsal"
          class="sportBtn"
          onclick="mudarDesporto('futsal')">
          🥅 Futsal
        </button>
      </div>

    </div>
  </header>


  <main class="container">

    <!-- =====================================================
         FUTEBOL
         ===================================================== -->

    <section id="futebolSection">

      <div class="sectionTitle">
        Competições
      </div>

      <div
        class="leagues"
        id="leagueList">
      </div>


      <div class="filters">

        <button
          id="fTodos"
          class="filter active"
          onclick="setFiltro('todos')">
          Todos
        </button>

        <button
          id="fLive"
          class="filter"
          onclick="setFiltro('live')">
          🔴 Ao vivo
        </button>

        <button
          id="fProximos"
          class="filter"
          onclick="setFiltro('proximos')">
          Próximos
        </button>

        <button
          id="fResultados"
          class="filter"
          onclick="setFiltro('resultados')">
          Resultados
        </button>

      </div>


      <!-- AO VIVO GLOBAL -->

      <div
        id="liveGlobal"
        class="liveGlobal hidden">

        <div class="liveGlobalHeader">

          <div class="liveGlobalTitle">
            <span class="liveDot"></span>
            JOGOS AO VIVO
          </div>

          <span
            id="liveCount"
            class="liveCount">
            0
          </span>

        </div>

        <div
          id="liveGlobalBody"
          class="liveGlobalBody">
        </div>

      </div>


      <!-- PESQUISA -->

      <div class="searchBox">

        <input
          id="searchInput"
          type="search"
          placeholder="🔎 Procurar equipa..."
          autocomplete="off"
          oninput="renderJogos()">

      </div>


      <!-- JOGOS -->

      <div
        id="footballContent"
        class="games">
      </div>

    </section>


    <!-- =====================================================
         TABELAS
         ===================================================== -->

    <section
      id="tabelasSection"
      class="hidden">

      <div class="sectionTitle">

function escapeHtml(valor){

  if(valor === null || valor === undefined){
    return "";
  }

  return String(valor)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function fetchJSON(url){

    method:"GET",

    headers:{
      "Accept":"application/json"
    }
  }).then(async response=>{

    if(!response.ok){
      throw new Error(
        "HTTP "+response.status

    }

    return response.json();

  });

}

function posicaoJogador(atleta){

  const pos =
    atleta?.position?.displayName ||
    atleta?.position?.name ||
    atleta?.position?.abbreviation ||
    "";

  const p = String(pos).toLowerCase();

  if(
    p.includes("goal") ||
    p.includes("keeper") ||
    p.includes("guarda")
  ){
    return "Guarda-redes";
  }

  if(
    p.includes("back") ||
    p.includes("def") ||
    p.includes("center") &&
    !p.includes("mid")
  ){
    return "Defesa";
  }

  if(
    p.includes("mid") ||
    p.includes("meio")
  ){
    return "Médio";
  }

  if(
    p.includes("forward") ||
    p.includes("attack") ||
    p.includes("striker") ||
    p.includes("avanç")
  ){
    return "Avançado";
  }

  return pos || "Jogador";

}


/* =========================================================

function dataLocal(dateString){

  if(!dateString){
    return "";
  }

  const d = new Date(dateString);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function horaLocal(dateString){

  if(!dateString){
    return "";
  }

  const d = new Date(dateString);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function dataHoraLocal(dateString){

    }
  );

}


/* =========================================================
   ESTADO DO JOGO
   ========================================================= */

function eventoEmDireto(event){

  if(!event){
    return false;
  }

  const status =
    event?.status?.type;

  if(
    status?.state === "in"
  ){
    return true;
  }

  const nome =
    String(
      status?.name ||
      status?.description ||
      ""
    ).toLowerCase();

  return (
    nome.includes("in progress") ||
    nome.includes("live") ||
    nome.includes("ao vivo") ||
    nome.includes("half")
  );

}


function eventoTerminado(event){

  if(!event){
    return false;
  }

  const state =
    event?.status?.type?.state;

  if(state === "post"){
    return true;
  }

  const nome =
    String(
      event?.status?.type?.name ||
      ""
    ).toLowerCase();

  return (
    nome.includes("final") ||
    nome.includes("post")
  );

}


/* =========================================================
   TEXTO DO ESTADO
   ========================================================= */

function estadoJogo(event){

  if(eventoEmDireto(event)){

    return {
      texto:
        event?.status?.type?.shortDetail ||
        event?.status?.type?.detail ||
        "AO VIVO",
      live:true
    };

  }

  if(eventoTerminado(event)){

    return {
      texto:
        event?.status?.type?.shortDetail ||
        "Final",
      live:false
    };

  }

  return {
    texto:
      horaLocal(event?.date) ||
      "Por definir",
    live:false
  };

}

  return obterCompetidores(event)

        c.homeAway === "home"

}


function equipaFora(event){

  return obterCompetidores(event)

    ) ||
    obterCompetidores(event)[1] ||

}

   CARREGAR JOGOS DA LIGA
   ========================================================= */

async function carregarJogos(){

  const box =
    document.getElementById(
      "footballContent"
    );

  box.innerHTML =
    '<div class="loading">⏳ A atualizar jogos...</div>';

  jogosFutebol=[];
  tabelaAtual=[];

  try{

    const url =
      API +
      encodeURIComponent(ligaAtual) +
      "/scoreboard?limit=100";

    const data =
      await fetchJSON(url);

    if(
      Array.isArray(data.events)
    ){

      jogosFutebol =
        data.events.map(e=>{

          e.__futzoneLiga =
            ligaAtual;

          return e;

        });

    }

  }catch(err){

    console.warn(
      "ESPN indisponível:",
      err
    );

  }


  /*
   * Se a ESPN não devolver dados,
   * utiliza o fallback existente.
   */

  if(
    !jogosFutebol.length &&
    FALLBACK[ligaAtual]
  ){

    jogosFutebol =
      (
        FALLBACK[ligaAtual].jogos ||
        []
      ).map(
        j =>
          dataFallbackParaESPN(
            j,
            ligaAtual
          )
      );

  }


  renderJogos();

  /*
   * Atualiza também o bloco
   * global de jogos ao vivo.
   */

  carregarTodosJogosAoVivo();

}


/* =========================================================
   FALLBACK → FORMATO ESPN
   ========================================================= */

function dataFallbackParaESPN(
  jogo,
  liga
){

  const casa =
    jogo.casa ||
    jogo.home ||
    "Casa";

  const fora =
    jogo.fora ||
    jogo.away ||
    "Fora";

  const data =
    jogo.data ||
    jogo.date ||
    new Date().toISOString();

  const hora =
    jogo.hora ||
    jogo.time ||
    "";

  const id =
    jogo.id ||
    (
      "fallback-" +
      liga +
      "-" +
      Math.random()
        .toString(36)
        .slice(2)
    );

  return {

    id:id,

    date:data,

    __futzoneLiga:liga,

    competitions:[{

      competitors:[

        {
          id:"home-"+id,
          homeAway:"home",
          team:{
            id:"home-"+id,
            displayName:casa,
            shortDisplayName:casa,
            logos:[]
          },
          score:
            jogo.golosCasa ??
            jogo.homeScore ??
            ""
        },

        {
          id:"away-"+id,
          homeAway:"away",
          team:{
            id:"away-"+id,
            displayName:fora,
            shortDisplayName:fora,
            logos:[]
          },
          score:
            jogo.golosFora ??
            jogo.awayScore ??
            ""
        }

      ]

    }],

    status:{
      type:{
        state:
          jogo.estado==="final"
            ? "post"
            : "pre",

        name:
          jogo.estado==="final"
            ? "STATUS_FINAL"
            : "STATUS_SCHEDULED",

        shortDetail:
          jogo.estado==="final"
            ? "Final"
            : (
              hora ||
              "Por definir"
            )
      }
    }

  };

}

   ========================================================= */

function setFiltro(f){

  filtroAtual=f;

    );

    todos:"fTodos",

    live:"fLive",

    proximos:"fProximos",

    resultados:"fResultados"

  };

  const botao =

  if(botao){
    botao.classList.add("active");
  }

  renderJogos();

}


/* =========================================================
   FILTRAR JOGOS
   ========================================================= */

function filtrarJogos(){

  let lista =
    Array.isArray(jogosFutebol)
      ? [...jogosFutebol]
      : [];


  if(filtroAtual==="live"){

    lista =
      lista.filter(
        eventoEmDireto
      );

  }


  if(filtroAtual==="proximos"){

    lista =
      lista.filter(
        jogo =>
          !eventoEmDireto(jogo) &&
          !eventoTerminado(jogo)
      );

  }


  if(filtroAtual==="resultados"){

    lista =
      lista.filter(
        eventoTerminado
      );

  }


  const pesquisa =
    String(
      document
        .getElementById(
          "searchInput"
        )?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  if(pesquisa){

    lista =
      lista.filter(
        jogo => {

          const casa =
            nomeEquipa(
              equipaCasa(jogo)?.team
            ).toLowerCase();

          const fora =
            nomeEquipa(
              equipaFora(jogo)?.team
            ).toLowerCase();

          return (
            casa.includes(pesquisa) ||
            fora.includes(pesquisa)
          );

        }
      );

  }


  lista.sort(
    (a,b)=>{

      const da =
        new Date(a.date || 0)
          .getTime();

      const db =
        new Date(b.date || 0)
          .getTime();

      return da-db;

    }
  );


  return lista;

}


/* =========================================================
   RENDER JOGOS
   ========================================================= */

function renderJogos(){

  const box =
    document.getElementById(
      "footballContent"
    );

  if(!box){
    return;
  }

  const lista =
    filtrarJogos();


  if(!lista.length){

    let mensagem =
      "Não existem jogos para mostrar.";

    if(
      filtroAtual==="live"
    ){

      mensagem =
        "Não há jogos ao vivo nesta competição.";

    }

    if(
      filtroAtual==="proximos"
    ){

      mensagem =
        "Não existem próximos jogos disponíveis.";

    }

    if(
      filtroAtual==="resultados"
    ){

      mensagem =
        "Não existem resultados disponíveis.";

    }

    box.innerHTML =
      `<div class="empty">
        ${escapeHtml(mensagem)}
      </div>`;

    return;

  }


  box.innerHTML =
    lista
      .map(
        jogoCardHTML
      )
      .join("");

}

/* =========================================================
   AO VIVO GLOBAL
   ========================================================= */

async function carregarTodosJogosAoVivo(){

  /*
   * Evita pedidos demasiado frequentes.
   */

  const agora =
    Date.now();

  if(
    agora-cacheLiveGlobalTime <
    30000 &&
    cacheJogosLiveGlobal.length
  ){

    renderLiveGlobal();

    return;

  }


  cacheLiveGlobalTime=agora;


  const resultados=[];


  /*
   * Consulta todas as competições
   * configuradas na FUTZONE.
   */

  const pedidos =
    LIGAS.map(
      async liga=>{

        try{

          const url =
            API +
            encodeURIComponent(
              liga.id
            ) +
            "/scoreboard?limit=100";

          const data =
            await fetchJSON(url);

          if(
            !Array.isArray(
              data.events
            )
          ){
            return [];
          }

          return data.events
            .filter(
              eventoEmDireto
            )
            .map(event=>{

              event.__futzoneLiga =
                liga.id;

              return event;

            });

        }catch(err){

          console.warn(
            "Liga ao vivo indisponível:",
            liga.id
          );

          return [];

        }

      }
    );


  const blocos =
    await Promise.all(
      pedidos
    );


  blocos.forEach(
    bloco=>{

      if(
        Array.isArray(bloco)
      ){

        resultados.push(
          ...bloco
        );

      }

    }
  );


  /*
   * Remove duplicados.
   */

  const mapa =
    new Map();

  resultados.forEach(
    jogo=>{

      mapa.set(
        String(jogo.id),
        jogo
      );

    }
  );


  cacheJogosLiveGlobal =
    [...mapa.values()];


  renderLiveGlobal();

}


/* =========================================================
   RENDER AO VIVO GLOBAL
   ========================================================= */

function renderLiveGlobal(){

  const box =
    document.getElementById(
      "liveGlobal"
    );

  const body =
    document.getElementById(
      "liveGlobalBody"
    );

  const count =
    document.getElementById(
      "liveCount"
    );


  if(
    !box ||
    !body ||
    !count
  ){
    return;
  }


  const jogos =
    Array.isArray(
      cacheJogosLiveGlobal
    )
      ? cacheJogosLiveGlobal
      : [];


  count.textContent =
    jogos.length;


  if(!jogos.length){

    box.classList.add(
      "hidden"
    );

    body.innerHTML="";

    return;

  }


  box.classList.remove(
    "hidden"
  );


  body.innerHTML =
    jogos
      .map(
        jogoCardHTML
      )
      .join("");

}


/* =========================================================
   CLASSIFICAÇÃO
   ========================================================= */

async function carregarTabela(){

  let dados=null;

  try{

    const url =
      API_CORE +
      "leagues/" +
      encodeURIComponent(
        ligaAtual
      ) +
      "/standings";

    dados =
      await fetchJSON(url);

  }catch(err){

    console.warn(
      "Standings ESPN indisponível:",
      err
    );

  }


  tabelaAtual=[];


  if(dados){

    const grupos =
      dados.children ||
      dados.standings ||
      [];


    for(
      const grupo of grupos
    ){

      const entries =
        grupo.standings?.entries ||
        grupo.entries ||
        [];


      for(
        const e of entries
      ){

        const team =
          e.team ||
          e;

        const stats =
          e.stats ||
          [];


        const getStat =
          nome=>{

            const s =
              stats.find(
                x =>
                  x.name===nome ||
                  x.displayName===nome
              );

            return (
              s?.value ??
              0
            );

          };


        tabelaAtual.push({

          grupo:
            grupo.name ||
            "",

          id:
            team?.id ||
            "",

          nome:
            nomeEquipa(team),

          logo:
            logoEquipa(team),

          j:
            getStat(
              "gamesPlayed"
            ),

          v:
            getStat(
              "wins"
            ),

          e:
            getStat(
              "ties"
            ),

          d:
            getStat(
              "losses"
            ),

          gm:
            getStat(
              "pointsFor"
            ),

          gs:
            getStat(
              "pointsAgainst"
            ),

          pts:
            getStat(
              "points"
            )

        });

      }

    }

  }


  /*
   * Fallback das competições
   * portuguesas caso a ESPN
   * não responda.
   */

  if(!tabelaAtual.length){

    const f =
      FALLBACK[ligaAtual];


    if(
      f?.tabela &&
      Array.isArray(f.tabela)
    ){

      tabelaAtual =
        f.tabela.map(
          (x,i)=>({

            grupo:"",

            id:
              "fallback-team-"+i,

            nome:
              x[0],

            logo:"",

            j:
              x[2] || 0,

            v:
              x[3] || 0,

            e:
              x[4] || 0,

            d:
              x[5] || 0,

            gm:
              x[6] || 0,

            gs:
              x[7] || 0,

            pts:
              x[1] || 0

          })
        );

    }

  }


  /*
   * Ordenação:
   * pontos → diferença de golos → golos marcados.
   */

  tabelaAtual.sort(
    (a,b)=>{

      const pontos =
        Number(b.pts||0) -
        Number(a.pts||0);

      if(pontos!==0){
        return pontos;
      }

      const saldoA =
        Number(a.gm||0) -
        Number(a.gs||0);

      const saldoB =
        Number(b.gm||0) -
        Number(b.gs||0);

      if(
        saldoB!==saldoA
      ){
        return saldoB-saldoA;
      }

      return (
        Number(b.gm||0) -
        Number(a.gm||0)
      );

    }
  );


  return tabelaAtual;

}

/* =========================================================
   OBTER ATLETAS
   ========================================================= */

function obterAtletas(
  data,
  competitor
){

  if(!data){
    return [];
  }


  const box =
    data?.boxscore?.players ||
    [];


  const teamId =
    competitor?.team?.id ||
    competitor?.id;


  const bloco =
    box.find(
      x =>
        String(
          x.team?.id
        ) ===
        String(teamId)
    );


  if(
    bloco?.statistics
  ){

    return bloco.statistics
      .flatMap(
        x =>
          x.athletes ||
          []
      )
      .map(
        x =>
          x.athlete ||
          x
      )
      .filter(Boolean);

  }


  return [];

}

    atleta=>{

      const pos =
        posicaoJogador(
          atleta
        );

      if(
        !grupos[pos]
      ){

        grupos.Jogador
          .push(atleta);

      }else{

        grupos[pos]
          .push(atleta);

      }

    }
  );


  return Object.entries(
    grupos
  )
  .filter(
    ([,lista]) =>
      lista.length
  )
  .map(
    ([nome,lista])=>`

      <div class="rosterGroup">

        <div class="rosterGroupTitle">

          ${escapeHtml(
            nome
          )}

        </div>


        <div class="rosterList">

          ${
            lista
              .map(
                atleta=>`

                  <div class="rosterPlayer">

                    <div class="rosterNumber">

                      ${escapeHtml(
                        numeroCamisola(
                          atleta
                        ) ||
                        "—"
                      )}

                    </div>


                    <div class="rosterInfo">

                      <div class="rosterName">

                        ${escapeHtml(
                          nomeAtleta(
                            atleta
                          )
                        )}

                      </div>


                      <div class="rosterPosition">

                        ${escapeHtml(
                          posicaoJogador(
                            atleta
                          )
                        )}

                      </div>

                    </div>

                  </div>

                `
              )
              .join("")
          }

        </div>

      </div>

    `
  )
  .join("");

}

  /* =========================================================
   11 INICIAL — CAMPO DE FUTEBOL
   ========================================================= */

function obterTitulares(
  data,
  competitor
){

  if(!data){
    return [];
  }

  const teamId =
    competitor?.team?.id ||
    competitor?.id;

  /*
   * Primeiro tenta a informação de
   * rosters/lineups do resumo ESPN.
   */

  const possiveis = [

    data?.rosters,
    data?.lineups,
    data?.boxscore?.players,
    data?.header?.competitions?.[0]?.competitors

  ];

  /*
   * Caso exista uma estrutura de
   * atletas dentro de rosters.
   */

  for(
    const fonte of possiveis
  ){

    if(!Array.isArray(fonte)){
      continue;
    }

    const bloco =
      fonte.find(
        x =>
          String(
            x?.team?.id
          ) ===
          String(teamId)
      );

    if(!bloco){
      continue;
    }

    const atletas =
      bloco?.roster ||
      bloco?.athletes ||
      bloco?.players ||
      bloco?.statistics
        ?.flatMap(
          x =>
            x?.athletes || []
        )
        ?.map(
          x =>
            x?.athlete || x
        ) ||
      [];

    if(
      Array.isArray(atletas) &&
      atletas.length
    ){

      return atletas
        .map(
          x =>
            x?.athlete || x
        )
        .filter(Boolean)
        .filter(
          x =>
            x?.starter === true ||
            x?.isStarter === true ||
            x?.starter === 1
        );

    }

  }


  /*
   * Fallback: utiliza atletas do
   * boxscore quando não existe uma
   * marcação explícita de titular.
   */

  const roster =
    obterAtletas(
      data,
      competitor
    );


  if(!roster.length){
    return [];
  }


  /*
   * Mantemos no máximo 11 jogadores.
   */

  return roster.slice(
    0,
    11
  );

}


/* =========================================================
   DISTRIBUIR JOGADORES NO CAMPO
   ========================================================= */

function distribuirTitularesCampo(
  titulares
){

  if(
    !Array.isArray(titulares) ||
    !titulares.length
  ){
    return [];
  }


  /*
   * Tentamos respeitar as posições
   * reais dos jogadores.
   */

  const guarda=[];
  const defesa=[];
  const medio=[];
  const avancado=[];
  const outros=[];


  titulares.forEach(
    atleta=>{

      const pos =
        posicaoJogador(
          atleta
        );


      if(
        pos==="Guarda-redes"
      ){

        guarda.push(
          atleta
        );

      }else if(
        pos==="Defesa"
      ){

        defesa.push(
          atleta
        );

      }else if(
        pos==="Médio"
      ){

        medio.push(
          atleta
        );

      }else if(
        pos==="Avançado"
      ){

        avancado.push(
          atleta
        );

      }else{

        outros.push(
          atleta
        );

      }

    }
  );


  /*
   * Se a ESPN não fornecer
   * posições suficientes, distribui
   * os restantes de forma equilibrada.
   */

  while(
    guarda.length < 1 &&
    outros.length
  ){

    guarda.push(
      outros.shift()
    );

  }


  while(
    defesa.length < 4 &&
    outros.length
  ){

    defesa.push(
      outros.shift()
    );

  }


  while(
    medio.length < 3 &&
    outros.length
  ){

    medio.push(
      outros.shift()
    );

  }


  while(
    avancado.length < 3 &&
    outros.length
  ){

    avancado.push(
      outros.shift()
    );

  }


  const linhas=[];


  /*
   * Guarda-redes
   */

  guarda
    .slice(0,1)
    .forEach(
      (atleta,i)=>{

        linhas.push({
          atleta,
          x:50,
          y:90
        });

      }
    );


  /*
   * Defesa
   */

  defesa
    .slice(0,5)
    .forEach(
      (atleta,i,lista)=>{

        linhas.push({

          atleta,

          x:
            lista.length===1
              ? 50
              : 15 +
                (
                  i *
                  (
                    70 /
                    (lista.length-1)
                  )
                ),

          y:72

        });

      }
    );


  /*
   * Meio-campo
   */

  medio
    .slice(0,5)
    .forEach(
      (atleta,i,lista)=>{

        linhas.push({

          atleta,

          x:
            lista.length===1
              ? 50
              : 15 +
                (
                  i *
                  (
                    70 /
                    (lista.length-1)
                  )
                ),

          y:49

        });

      }
    );


  /*
   * Ataque
   */

  avancado
    .slice(0,4)
    .forEach(
      (atleta,i,lista)=>{

        linhas.push({

          atleta,

          x:
            lista.length===1
              ? 50
              : 20 +
                (
                  i *
                  (
                    60 /
                    (lista.length-1)
                  )
                ),

          y:25

        });

      }
    );


  /*
   * Caso ainda faltem jogadores,
   * coloca-os numa zona intermédia.
   */

  outros
    .forEach(
      (atleta,i)=>{

        if(
          linhas.length >= 11
        ){
          return;
        }

        linhas.push({

          atleta,

          x:
            15 +
            (
              (i%5) *
              17.5
            ),

          y:
            20 +
            (
              Math.floor(i/5) *
              20
            )

        });

      }
    );


  return linhas.slice(
    0,
    11
  );

}


/* =========================================================
   CAMPO — 11 INICIAL
   ========================================================= */

function renderCampoOnze(
  titulares
){

  if(
    !Array.isArray(titulares) ||
    !titulares.length
  ){

    return `

      <div class="empty">

        Onze inicial não disponível.

      </div>

    `;

  }


  const jogadores =
    distribuirTitularesCampo(
      titulares
    );


  return `

    <div class="footballPitch">

      <div class="pitchHalf"></div>

      <div class="pitchCenter"></div>

      <div class="pitchCircle"></div>

      <div class="pitchBox"></div>

      <div class="pitchSmallBox"></div>

      <div class="pitchGoal"></div>


      ${
        jogadores
          .map(
            jogador=>{

              const atleta =
                jogador.atleta;

              const numero =
                numeroCamisola(
                  atleta
                ) || "—";

              const nome =
                nomeAtleta(
                  atleta
                );


              return `

                <div
                  class="pitchPlayer"
                  style="
                    left:${jogador.x}%;
                    top:${jogador.y}%;
                  ">

                  <div
                    class="pitchPlayerDot">

                    ${escapeHtml(
                      numero
                    )}

                  </div>


                  <div
                    class="pitchPlayerName">

                    ${escapeHtml(
                      nome
                    )}

                  </div>

                </div>

              `;

            }
          )
          .join("")
      }

    </div>


    <div class="lineupLegend">

      <span class="lineupDot"></span>

      Número da camisola

    </div>

  `;

}


/* =========================================================
   ONZES — CAMPO + PLANTEL
   ========================================================= */

function onzesHTML(
  data,
  e
){

  const comps =
    data?.header?.competitions?.[0] ||
    data?.competitions?.[0] ||
    e?.competitions?.[0];


  const competitors =
    comps?.competitors ||
    [];


  if(
    !competitors.length
  ){
    return "";
  }


  let html = `

    <div class="detailCard">

      <div class="detailCardTitle">

        ⚽ Onze inicial

      </div>

  `;


  let encontrouOnze=false;


  for(
    const c of competitors
  ){

    const titulares =
      obterTitulares(
        data,
        c
      );


    if(!titulares.length){
      continue;
    }


    encontrouOnze=true;


    html += `

      <div
        style="
          margin-bottom:18px;
        ">

        <div class="teamLineupTitle">

          ${
            logoEquipa(c.team)
              ? `
                <img
                  src="${escapeHtml(
                    logoEquipa(
                      c.team
                    )
                  )}"
                  alt="">
              `
              : ""
          }

          ${escapeHtml(
            nomeEquipa(
              c.team
            )
          )}

        </div>


        ${renderCampoOnze(
          titulares
        )}

      </div>

    `;

  }


  html += `

    </div>

  `;


  /*
   * Se não existir informação de
   * titulares, não mostra um campo
   * vazio e tenta mostrar o plantel.
   */

  if(!encontrouOnze){

    let rosterHtml="";


    for(
      const c of competitors
    ){

      const roster =
        obterAtletas(
          data,
          c
        );


      if(!roster.length){
        continue;
      }


      rosterHtml += `

        <div class="detailCard">

          <div class="teamLineupTitle">

            ${
              logoEquipa(c.team)
                ? `
                  <img
                    src="${escapeHtml(
                      logoEquipa(
                        c.team
                      )
                    )}"
                    alt="">
                `
                : ""
            }

            ${escapeHtml(
              nomeEquipa(
                c.team
              )
            )}

          </div>


          <div class="rosterTitle">

            👥 Plantel disponível

          </div>


          ${renderRoster(
            roster
          )}

        </div>

      `;

    }


    return rosterHtml;

  }


  return html;

}


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA DOS JOGOS
   ========================================================= */

let ultimoRefresh =
  0;


async function atualizarAgora(){

  const agora =
    Date.now();


  /*
   * Evita vários refreshes
   * ao mesmo tempo.
   */

  if(
    agora -
    ultimoRefresh <
    5000
  ){
    return;
  }


  ultimoRefresh =
    agora;


  try{

    await carregarJogos();

  }catch(err){

    console.warn(
      "Erro ao atualizar:",
      err
    );

  }

}
