<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#0057B8">
<link rel="manifest" href="./manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050b16;
  color:#fff;
  font-family:Arial,sans-serif
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#071326;
  border-bottom:1px solid #17243a;
  padding:14px 12px
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#fff
}

.logo span{
  color:#0057B8
}

main{
  padding:12px 10px 85px;
  max-width:700px;
  margin:auto
}

h2{
  font-size:18px;
  margin:15px 0 10px
}

.seletor-ligas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:15px
}

.liga-btn{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:12px;
  padding:12px 7px;
  color:#fff;
  text-align:center;
  font-size:13px;
  font-weight:bold
}

.liga-btn.active{
  background:#0d1b30;
  border-color:#0057B8;
  box-shadow:0 0 0 1px #0057B8
}

.liga-icon{
  font-size:22px;
  display:block;
  margin-bottom:5px
}

.jogo{
  position:relative;
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  padding:12px;
  margin-bottom:9px;
  cursor:pointer
}

.jogo-top{
  display:flex;
  justify-content:space-between;
  color:#9ca9bb;
  font-size:11px;
  margin-bottom:9px
}

.equipas{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:5px
}

.equipa{
  text-align:center;
  font-size:13px;
  font-weight:bold
}

.escudo{
  width:34px;
  height:34px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px
}

.resultado{
  text-align:center;
  font-size:19px;
  font-weight:900
}

.estado-live{
  color:#ff4545;
  font-size:10px;
  margin-top:3px
}

.estado-fim{
  color:#9ca9bb;
  font-size:10px;
  margin-top:3px
}

.fav-btn{
  position:absolute;
  top:8px;
  right:8px;
  background:none;
  border:0;
  color:#9ca9bb;
  font-size:18px;
  z-index:2
}

.fav-btn.on{
  color:#ffd400
}

.vazio{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:12px;
  padding:20px;
  text-align:center;
  color:#9ca9bb
}

.carregando{
  text-align:center;
  color:#9ca9bb;
  padding:25px
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #17243a;
  border-top-color:#0057B8;
  border-radius:50%;
  animation:girar .8s linear infinite;
  margin:0 auto 12px
}

@keyframes girar{
  to{transform:rotate(360deg)}
}

.erro{
  color:#ff8f8f;
  text-align:center;
  padding:15px
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#071326;
  border-top:1px solid #17243a;
  display:flex;
  z-index:30
}

.bottom button{
  background:none;
  border:0;
  color:#9ca9bb;
  font-weight:bold;
  width:33%;
  font-size:12px
}

.bottom button.active{
  color:#fff;
  border-top:2px solid #0057B8
}

.overlay{
  position:fixed;
  inset:0;
  background:#050b16;
  z-index:50;
  overflow:auto
}

.detalhe-header{
  position:sticky;
  top:0;
  background:#071326;
  border-bottom:1px solid #17243a;
  padding:12px;
  z-index:5
}

.voltar{
  background:#0b1627;
  border:1px solid #243653;
  color:#fff;
  border-radius:8px;
  padding:8px 12px;
  font-weight:bold
}

.detalhe{
  max-width:700px;
  margin:auto;
  padding:10px 10px 35px
}

.jogo-grande{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:14px;
  padding:18px 10px;
  margin-bottom:12px
}

.jogo-grande .equipas{
  grid-template-columns:1fr 90px 1fr
}

.jogo-grande .escudo{
  width:55px;
  height:55px
}

.jogo-grande .equipa{
  font-size:15px
}

.bigscore{
  text-align:center;
  font-size:30px;
  font-weight:900
}

.estado{
  text-align:center;
  color:#0057B8;
  font-size:12px;
  margin-top:5px
}

.secao{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  margin:10px 0;
  padding:12px
}

.secao h3{
  font-size:15px;
  margin:0 0 10px
}

.evento{
  display:flex;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid #17243a;
  font-size:13px
}

.evento:last-child{
  border-bottom:0
}

.minuto{
  color:#0057B8;
  font-weight:bold;
  min-width:38px
}

.stats-head,
.stat-row{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  text-align:center
}

.stats-head{
  font-size:12px;
  margin-bottom:7px
}

.stat-row{
  align-items:center;
  border-top:1px solid #17243a;
  padding:9px 0;
  font-size:12px
}

.stat-row .nome{
  font-size:11px;
  color:#9ca9bb
}

.stat-home{
  text-align:right;
  font-weight:bold
}

.stat-away{
  text-align:left;
  font-weight:bold
}

.lista-jogadores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.jogador{
  background:#071326;
  border:1px solid #17243a;
  border-radius:8px;
  padding:9px;
  font-size:12px
}

.jogador b{
  color:#0057B8;
  margin-right:5px
}

.subtitulo{
  color:#9ca9bb;
  font-size:11px;
  margin:8px 0
}

.tabela{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  overflow:hidden;
  margin-bottom:12px
}

.tabela-titulo{
  padding:12px;
  font-weight:bold;
  border-bottom:1px solid #17243a
}

.linha-tabela{
  display:grid;
  grid-template-columns:32px 1fr 35px 35px 40px;
  padding:10px 8px;
  border-bottom:1px solid #17243a;
  font-size:12px;
  align-items:center
}

.linha-tabela:last-child{
  border-bottom:0
}

.linha-tabela.cabecalho{
  color:#9ca9bb;
  font-size:10px
}

.pos{
  color:#0057B8;
  font-weight:bold
}

.nome-equipa{
  font-weight:bold
}

.pontos{
  font-weight:bold
}

@media(max-width:420px){
  .equipas{
    grid-template-columns:1fr 60px 1fr
  }

  .equipa{
    font-size:12px
  }

  .resultado{
    font-size:17px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span></div>
</header>

<main id="app"></main>

<div class="bottom">
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
  <button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ligas=[
  {nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
  {nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
  {nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
  {nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
  {nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
  {nome:"França",codigo:"fra.1",icone:"🇫🇷"},
  {nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
  {nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
  {nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
  {nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}
];

let ligaSelecionada="Portugal";
let jogos=[];
let favoritos=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");

const app=document.getElementById("app");

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function logo(url){
  if(!url)return `<div style="height:39px"></div>`;

  return `
    <img class="escudo"
         src="${esc(url)}"
         onerror="this.style.visibility='hidden'">
  `;
}

function nomeEquipa(c){
  return c?.team?.displayName ||
         c?.team?.shortDisplayName ||
         c?.team?.name ||
         "Equipa";
}

function guardarFavoritos(){
  localStorage.setItem(
    "futzone_favoritos",
    JSON.stringify(favoritos)
  );
}

function favorito(id){
  return favoritos.includes(String(id));
}

function alternarFavorito(id,event){
  event.stopPropagation();

  id=String(id);

  if(favorito(id)){
    favoritos=favoritos.filter(x=>x!==id);
  }else{
    favoritos.push(id);
  }

  guardarFavoritos();

  mostrarJogos();
}

function transformarJogo(evento,liga){

  const c=evento?.competitions?.[0]||{};
  const cs=c.competitors||[];

  const h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
  const a=cs.find(x=>x.homeAway==="away")||cs[1]||{};

  return{
    id:String(evento.id),
    original:evento,
    codigo:liga.codigo,
    liga:liga.nome,

    data:evento.date,

    home:{
      nome:nomeEquipa(h),
      logo:h?.team?.logo||"",
      score:h?.score??"-",
      id:h?.team?.id||""
    },

    away:{
      nome:nomeEquipa(a),
      logo:a?.team?.logo||"",
      score:a?.score??"-",
      id:a?.team?.id||""
    },

    estado:
      c?.status?.type?.shortDetail ||
      c?.status?.type?.detail ||
      c?.status?.type?.description ||
      "",

    estadoTipo:c?.status?.type?.state||""
  };
}

async function buscarLiga(liga){

  try{

    const urls=[
      `${ESPN}${encodeURIComponent(liga.codigo)}/scoreboard?limit=100&_=${Date.now()}`,
      `${ESPN}${encodeURIComponent(liga.codigo)}/scoreboard?_=${Date.now()}`
    ];

    for(const url of urls){

      try{

        const r=await fetch(url);

        if(!r.ok)continue;

        const d=await r.json();

        if(Array.isArray(d.events)){
          return d.events.map(e=>transformarJogo(e,liga));
        }

      }catch(e){}

    }

  }catch(e){}

  return [];
}

async function carregarJogos(){

  jogos=[];

  mostrarCarregando();

  const resultados=await Promise.all(
    ligas.map(l=>buscarLiga(l))
  );

  resultados.forEach(lista=>{
    jogos.push(...lista);
  });

  jogos.sort((a,b)=>{
    return new Date(a.data)-new Date(b.data);
  });

  mostrarJogos();
}

function mostrarCarregando(){

  app.innerHTML=`
    <h2>⚽ Jogos</h2>

    <div class="carregando">
      <div class="spinner"></div>
      A carregar jogos...
    </div>
  `;
}

function botoesLigas(){

  return `
    <div class="seletor-ligas">

      ${ligas.map(l=>`

        <button
          class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
          onclick="selecionarLiga('${esc(l.nome)}')">

          <span class="liga-icon">${l.icone}</span>
          ${esc(l.nome)}

        </button>

      `).join("")}

    </div>
  `;
}

function selecionarLiga(nome){

  ligaSelecionada=nome;

  mostrarJogos();

  window.scrollTo(0,0);
}

function formatarData(data){

  if(!data)return "";

  try{

    return new Date(data).toLocaleString("pt-PT",{
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    });

  }catch(e){
    return "";
  }
}

function cartao(j){

  const fav=favorito(j.id);

  const aoVivo=
    j.estadoTipo==="in" ||
    /live|ao vivo/i.test(j.estado);

  return `
    <div class="jogo"
         onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

      <button
        class="fav-btn ${fav?"on":""}"
        onclick="alternarFavorito('${esc(j.id)}',event)">
        ${fav?"★":"☆"}
      </button>

      <div class="jogo-top">

        <span>${esc(formatarData(j.data))}</span>

        <span class="${aoVivo?"estado-live":"estado-fim"}">
          ${esc(j.estado)}
        </span>

      </div>

      <div class="equipas">

        <div class="equipa">
          ${logo(j.home.logo)}
          ${esc(j.home.nome)}
        </div>

        <div class="resultado">
          ${esc(j.home.score)} - ${esc(j.away.score)}
        </div>

        <div class="equipa">
          ${logo(j.away.logo)}
          ${esc(j.away.nome)}
        </div>

      </div>

    </div>
  `;
}

function mostrarJogos(){

  nav("navJogos");

  const lista=jogos.filter(
    j=>j.liga===ligaSelecionada
  );

  app.innerHTML=`

    <h2>🌍 Ligas</h2>

    ${botoesLigas()}

    <h2>${esc(ligaSelecionada)}</h2>

    ${
      lista.length
      ?
      lista.map(cartao).join("")
      :
      `
        <div class="vazio">
          Não há jogos disponíveis nesta competição neste momento.
        </div>
      `
    }

  `;
}

function nav(id){

  ["navJogos","navTabelas","navFav"].forEach(x=>{

    document
      .getElementById(x)
      .classList.toggle("active",x===id);

  });
}

function txt(v){

  if(typeof v==="object"){

    return v?.displayValue ??
           v?.value ??
           v?.text ??
           "";

  }

  return String(v??"");
}

function extrairEventos(d){

  const out=[];
  const seen=new Set();

  const fontes=[
    ...(d.plays||[]),
    ...(d.keyEvents||[]),
    ...(d.scoringPlays||[])
  ];

  for(const e of fontes){

    const texto=(
      (e?.type?.text||"")+" "+
      (e?.text||"")+" "+
      (e?.shortText||"")+" "+
      (e?.description||"")
    ).toLowerCase();

    const tipo=
      e?.text ||
      e?.shortText ||
      e?.description ||
      e?.type?.text ||
      "Evento";

    if(!/goal|gol|yellow|amarelo|red|vermelho|substitut|penalty|penálti|assist/.test(texto)){
      continue;
    }

    const chave=JSON.stringify([
      e?.id,
      e?.clock?.displayValue,
      tipo
    ]);

    if(seen.has(chave))continue;

    seen.add(chave);

    let icone="⚽";

    if(/yellow|amarelo/.test(texto)){
      icone="🟨";
    }else if(/red|vermelho/.test(texto)){
      icone="🟥";
    }else if(/substitut/.test(texto)){
      icone="🔄";
    }else if(/assist/.test(texto)){
      icone="🅰️";
    }

    out.push({
      minuto:e?.clock?.displayValue ||
             e?.period?.displayValue ||
             "",
      texto:tipo,
      icone
    });

  }

  return out;
}

function extrairStats(d){

  const grupos=[];

  function adicionar(team,stats){

    if(!team||!Array.isArray(stats))return;

    const id=
      team?.id ||
      team?.team?.id ||
      team?.displayName ||
      team?.team?.displayName;

    let g=grupos.find(
      x=>String(x.id)===String(id)
    );

    if(!g){

      g={
        id,
        nome:
          team?.displayName ||
          team?.name ||
          team?.team?.displayName ||
          team?.team?.name ||
          "Equipa",
        stats:[]
      };

      grupos.push(g);
    }

    stats.forEach(x=>{

      const n=
        x?.displayName ||
        x?.shortDisplayName ||
        x?.name ||
        x?.label ||
        x?.description;

      if(!n)return;

      g.stats.push({
        nome:n,
        valor:txt(
          x?.displayValue ??
          x?.value ??
          x?.display ??
          ""
        )
      });

    });

  }

  (d.boxscore?.teams||[]).forEach(t=>{
    adicionar(
      t.team||t,
      t.statistics||t.stats||[]
    );
  });

  (
    d.header?.competitions?.[0]?.competitors ||
    d.competitions?.[0]?.competitors ||
    []
  ).forEach(c=>{
    adicionar(
      c.team||c,
      c.statistics||[]
    );
  });

  (d.competitors||[]).forEach(c=>{
    adicionar(
      c.team||c,
      c.statistics||[]
    );
  });

  if(grupos.length<2)return[];

  const mapa=new Map();

  grupos.forEach((g,index)=>{

    g.stats.forEach(s=>{

      const chave=s.nome.toLowerCase();

      if(!mapa.has(chave)){

        mapa.set(chave,{
          nome:s.nome,
          casa:"-",
          fora:"-"
        });

      }

      const r=mapa.get(chave);

      if(index===0){
        r.casa=s.valor;
      }else{
        r.fora=s.valor;
      }

    });

  });

  return [...mapa.values()];
}

function extrairPlantel(d){

  const grupos=[];

  function adicionar(team,array){

    if(!team||!Array.isArray(array))return;

    const id=
      team?.id ||
      team?.team?.id ||
      team?.displayName ||
      team?.team?.displayName;

    let g=grupos.find(
      x=>String(x.id)===String(id)
    );

    if(!g){

      g={
        id,
        nome:
          team?.displayName ||
          team?.name ||
          team?.team?.displayName ||
          "Equipa",
        jogadores:[]
      };

      grupos.push(g);
    }

    array.forEach(x=>{

      const a=x?.athlete||x?.player||x;

      if(!a?.displayName&&!a?.fullName)return;

      const nome=
        a.displayName||
        a.fullName||
        a.shortName;

      if(
        g.jogadores.some(
          p=>p.nome===nome
        )
      )return;

      g.jogadores.push({

        nome,

        numero:
          a.jersey ||
          x?.jersey ||
          a.uniformNumber ||
          "",

        posicao:
          a?.position?.abbreviation ||
          a?.position?.displayName ||
          x?.position?.displayName ||
          "",

        titular:
          x?.starter===true ||
          x?.starter==="true"

      });

    });

  }

  (d.rosters||[]).forEach(r=>{
    adicionar(
      r.team||r,
      r.roster||
      r.athletes||
      r.players||
      []
    );
  });

  (d.boxscore?.players||[]).forEach(g=>{
    adicionar(
      g.team||g,
      g.statistics||
      g.athletes||
      g.roster||
      g.players||
      []
    );
  });

  (
    d.header?.competitions?.[0]?.competitors||
    []
  ).forEach(c=>{
    adicionar(
      c.team||c,
      c.roster||
      c.athletes||
      c.players||
      []
    );
  });

  return grupos.filter(
    g=>g.jogadores.length
  );
}

function blocoEventos(eventos){

  return `

    <div class="secao">

      <h3>⚽ Golos e eventos</h3>

      ${
        eventos.length
        ?
        eventos.map(e=>`

          <div class="evento">

            <span class="minuto">
              ${esc(e.minuto)}
            </span>

            <span>
              ${e.icone}
              ${esc(e.texto)}
            </span>

          </div>

        `).join("")
        :
        `
          <div class="vazio">
            Não há golos ou eventos disponíveis.
          </div>
        `
      }

    </div>
  `;
}

function blocoStats(stats){

  return `

    <div class="secao">

      <h3>📊 Estatísticas do jogo</h3>

      ${
        stats.length
        ?
        `

          <div class="stats-head">
            <span>Casa</span>
            <span>ESTAT.</span>
            <span>Fora</span>
          </div>

          ${stats.map(s=>`

            <div class="stat-row">

              <div class="stat-home">
                ${esc(s.casa)}
              </div>

              <div class="nome">
                ${esc(s.nome)}
              </div>

              <div class="stat-away">
                ${esc(s.fora)}
              </div>

            </div>

          `).join("")}

        `
        :
        `
          <div class="vazio">
            Estatísticas não disponíveis para este jogo.
          </div>
        `
      }

    </div>
  `;
}

function blocoPlantel(grupos){

  if(!grupos.length)return"";

  return `

    <div class="secao">

      <h3>👥 Equipas</h3>

      ${grupos.map(g=>`

        <div style="margin-bottom:15px">

          <b>${esc(g.nome)}</b>

          <div class="subtitulo">
            ${
              g.jogadores.some(x=>x.titular)
              ?
              "Titulares"
              :
              "Jogadores disponíveis"
            }
          </div>

          <div class="lista-jogadores">

            ${g.jogadores.map(p=>`

              <div class="jogador">

                <b>${esc(p.numero)}</b>

                ${esc(p.nome)}

                ${
                  p.posicao
                  ?
                  `<small style="display:block;color:#9ca9bb">
                    ${esc(p.posicao)}
                  </small>`
                  :
                  ""
                }

              </div>

            `).join("")}

          </div>

        </div>

      `).join("")}

    </div>
  `;
}

async function abrirDetalhe(id,codigo){

  const j=jogos.find(
    x=>x.id===String(id)
  );

  if(!j)return;

  const overlay=document.createElement("div");

  overlay.className="overlay";

  overlay.innerHTML=`

    <div class="detalhe-header">

      <button
        class="voltar"
        onclick="this.closest('.overlay').remove()">
        ← Voltar
      </button>

    </div>

    <div class="detalhe">

      <div class="jogo-grande">

        <div class="equipas">

          <div class="equipa">
            ${logo(j.home.logo)}
            ${esc(j.home.nome)}
          </div>

          <div>

            <div class="bigscore">
              ${esc(j.home.score)}
              -
              ${esc(j.away.score)}
            </div>

            <div class="estado">
              ${esc(j.estado)}
            </div>

          </div>

          <div class="equipa">
            ${logo(j.away.logo)}
            ${esc(j.away.nome)}
          </div>

        </div>

      </div>

      <div class="carregando">
        <div class="spinner"></div>
        A carregar detalhes...
      </div>

    </div>
  `;

  document.body.appendChild(overlay);

  try{

    const url=
      `${ESPN}${encodeURIComponent(codigo)}`+
      `/summary?event=${encodeURIComponent(id)}`+
      `&_=${Date.now()}`;

    const r=await fetch(url);

    if(!r.ok)throw new Error("summary");

    const d=await r.json();

    const eventos=extrairEventos(d);
    const stats=extrairStats(d);
    const plantel=extrairPlantel(d);

    const loading=
      overlay.querySelector(".carregando");

    loading.insertAdjacentHTML(
      "afterend",
      blocoEventos(eventos)+
      blocoStats(stats)+
      blocoPlantel(plantel)
    );

    loading.remove();

  }catch(e){

    const loading=
      overlay.querySelector(".carregando");

    if(loading){

      loading.outerHTML=`

        <div class="erro">

          Não foi possível carregar
          todos os detalhes deste jogo.

        </div>

      `;

    }

  }

}

async function mostrarTabelas(){

  nav("navTabelas");

  app.innerHTML=`

    <h2>🏆 Tabelas</h2>

    ${botoesLigas()}

    <div class="carregando">
      <div class="spinner"></div>
      A carregar classificação...
    </div>
  `;

  const liga=ligas.find(
    x=>x.nome===ligaSelecionada
  );

  if(!liga)return;

  try{

    const url=
      `${ESPN}${encodeURIComponent(liga.codigo)}`+
      `/standings?_=${Date.now()}`;

    const r=await fetch(url);

    if(!r.ok)throw 0;

    const d=await r.json();

    let entries=[];

    if(d?.children?.length){

      d.children.forEach(child=>{

        if(Array.isArray(child.standings?.entries)){
          entries.push(...child.standings.entries);
        }

      });

    }

    if(!entries.length){

      entries=d?.standings?.entries||[];

    }

    if(!entries.length){

      app.innerHTML=`

        <h2>🏆 Tabela</h2>

        ${botoesLigas()}

        <div class="vazio">
          Classificação não disponível neste momento.
        </div>

      `;

      return;
    }

    app.innerHTML=`

      <h2>🏆 ${esc(liga.nome)}</h2>

      ${botoesLigas()}

      <div class="tabela">

        <div class="tabela-titulo">
          ${esc(liga.nome)}
        </div>

        <div class="linha-tabela cabecalho">
          <span>#</span>
          <span>Equipa</span>
          <span>J</span>
          <span>DG</span>
          <span>P</span>
        </div>

        ${entries.map((e,i)=>{

          const team=e.team||{};

          const stats={};

          (e.stats||[]).forEach(s=>{
            stats[s.name]=
              s.value ??
              s.displayValue ??
              "-";
          });

          return `

            <div class="linha-tabela">

              <span class="pos">
                ${i+1}
              </span>

              <span class="nome-equipa">
                ${esc(
                  team.shortDisplayName||
                  team.displayName||
                  team.name||
                  "Equipa"
                )}
              </span>

              <span>
                ${esc(
                  stats.gamesPlayed||
                  stats.played||
                  "-"
                )}
              </span>

              <span>
                ${esc(
                  stats.pointDifferential||
                  stats.differential||
                  stats.goalDifference||
                  "-"
                )}
              </span>

              <span class="pontos">
                ${esc(
                  stats.points||
                  "-"
                )}
              </span>

            </div>

          `;

        }).join("")}

      </div>
    `;

  }catch(e){

    app.innerHTML=`

      <h2>🏆 Tabelas</h2>

      ${botoesLigas()}

      <div class="erro">
        Não foi possível carregar a classificação.
      </div>
    `;
  }
}
