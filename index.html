<script>

 ["uefa.europa","🏆 Europa League"],
 ["uefa.europa.conf","🏆 Conference League"]
];

const LIGAS_FUTEBOL=ligas;

let ligaAtual="por.1";
let filtroAtual="todos";
let jogosFutebol=[];
let desportoAtual="futebol";

let favoritosJogos=JSON.parse(localStorage.getItem("futzone_jogos_favoritos")||"[]");
let favoritosEquipas=JSON.parse(localStorage.getItem("futzone_equipas_favoritas")||"[]");
let favoritosJogadores=JSON.parse(localStorage.getItem("futzone_jogadores_favoritos")||"[]");

const CACHE=new Map();
const INFLIGHT=new Map();

let modoTodos=false;
let diaSelecionado="";
let requestToken=0;
let searchTimer=null;

/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function escapeHtml(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function hojeISO(offset=0){
 const d=new Date();
 d.setDate(d.getDate()+offset);
 return localISO(d);
}

function localISO(d=new Date()){
 return [
   d.getFullYear(),
   String(d.getMonth()+1).padStart(2,"0"),
   String(d.getDate()).padStart(2,"0")
 ].join("-");
}

function ymd(d){
 return localISO(d).replaceAll("-","");
}

function dataCurta(v){
 const d=new Date(v);
 if(isNaN(d.getTime()))return "";
 return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"});
}

function formatarData(v){
 const d=new Date(v);
 if(isNaN(d.getTime()))return "";
 return d.toLocaleDateString("pt-PT",{
   day:"2-digit",month:"2-digit",year:"numeric"
 });
}

function horaEvento(e){
 const d=new Date(e?.date);
 if(isNaN(d.getTime()))return "--:--";
 return d.toLocaleTimeString("pt-PT",{
   hour:"2-digit",minute:"2-digit"
 });
}

function nomeEquipa(c){
  if(!c) return "";

  const t=c.team || c;

  const candidatos=[
    t.displayName,
    t.fullName,
    t.shortDisplayName,
    t.name,
    c.displayName,
    c.fullName,
    c.shortDisplayName,
    c.name
  ];

  for(const nome of candidatos){
    if(nome && String(nome).trim()){
      return String(nome).trim();
    }
  }

  if(t.location && t.name){
    return String(t.location+" "+t.name).trim();
  }

  return "";
}

function idEquipa(c){
  if(!c) return "";

  return String(
    c.team?.id ||
    c.id ||
    c.team?.uid ||
    ""
  );
}

function logoEquipa(c){
  if(!c) return "";

  const t=c.team || c;

  return (
    t.logo ||
    t.logos?.[0]?.href ||
    t.logos?.[0]?.url ||
    c.logo ||
    c.logos?.[0]?.href ||
    c.logos?.[0]?.url ||
    ""
  );
}


function isFinal(e){
 const s=e?.status?.type||{};
 return !!(
   s.completed ||
   s.state==="post" ||
   /FINAL|POST|COMPLETED/i.test(
     (s.name||"")+" "+(s.description||"")
   )
 );
}

function guardarFavoritos(){
 localStorage.setItem(
   "futzone_jogos_favoritos",
   JSON.stringify(favoritosJogos)
 );
 localStorage.setItem(
   "futzone_equipas_favoritas",
   JSON.stringify(favoritosEquipas)
 );
 localStorage.setItem(
   "futzone_jogadores_favoritos",
   JSON.stringify(favoritosJogadores)
 );
}

/* =========================================================
   CACHE / API
   ========================================================= */

async function fetchJSON(url,timeout=7000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeout);

 try{
   const r=await fetch(url,{signal:controller.signal});
   if(!r.ok)throw new Error("HTTP "+r.status);
   return await r.json();
 }catch(e){
   return null;
 }finally{
   clearTimeout(timer);
 }
}

function cacheGet(key,ttl){
 const x=CACHE.get(key);
 if(!x)return null;

 if(Date.now()-x.time>ttl){
   CACHE.delete(key);
   return null;
 }

 return x.data;
}

async function fetchAPI(url,timeout=7000,ttl=30000){
 const cached=cacheGet(url,ttl);
 if(cached!==null)return cached;

 if(INFLIGHT.has(url))
   return INFLIGHT.get(url);

 const p=fetchJSON(url,timeout)
 .then(data=>{
   if(data!==null)
     CACHE.set(url,{time:Date.now(),data});
   return data;
 })
 .catch(()=>null)
 .finally(()=>INFLIGHT.delete(url));

 INFLIGHT.set(url,p);
 return p;
}

function fallbackEvent(liga,row,i){

 return {
   id:"fallback-"+liga+"-"+i,

   name:home+" vs "+away,
   __futzoneLiga:liga,
   competitions:[{
     name:getCompeticao(liga),

   }],

       state:(hs!==""&&as!=="")?"post":"pre",

     }
   },

    }
   ]

}

function deduplicarEventos(arr){
 const map=new Map();

 arr.forEach(e=>{
   if(!e)return;

   const id=String(e.id||"");

   if(id){
     if(!map.has(id))map.set(id,e);
     return;
   }

   const key=[
     e.date,
     nomeEquipa(e.competitors?.[0]),
     nomeEquipa(e.competitors?.[1])
   ].join("|");

   if(!map.has(key))map.set(key,e);
 });

 return [...map.values()];
}

async function buscarJogosLiga(liga){
 if(!liga || liga.startsWith("futsal:"))
   return [];

 const hoje=new Date();
 const inicio=new Date(hoje);
 const fim=new Date(hoje);

 inicio.setDate(inicio.getDate()-2);
 fim.setDate(fim.getDate()+8);

 const range=ymd(inicio)+"-"+ymd(fim);

 const url=
   API+
   encodeURIComponent(liga)+
   "/scoreboard?dates="+range+"&limit=100";

 let data=await fetchAPI(url,7000,30000);

 let eventos=Array.isArray(data?.events)
   ?data.events
   :[];

 eventos=eventos.map(e=>{
   e.__futzoneLiga=liga;
   return e;
 });

 /*
  * Se a API não devolver jogos, fazemos consultas
  * individuais apenas nesta competição.
  */
 if(!eventos.length){

   const dias=[];

   for(let i=-1;i<=7;i++)
     dias.push(hojeISO(i).replaceAll("-",""));

   for(let i=0;i<dias.length;i+=3){

     const grupo=dias.slice(i,i+3);

     const respostas=await Promise.all(
       grupo.map(async dia=>{
         const u=
           API+
           encodeURIComponent(liga)+
           "/scoreboard?dates="+dia+"&limit=100";

         const d=await fetchAPI(u,7000,20000);

         return Array.isArray(d?.events)
           ?d.events
           :[];
       })
     );

     respostas.flat().forEach(e=>{
       e.__futzoneLiga=liga;
       eventos.push(e);
     });
   }
 }

 /*
  * Dados locais para as três competições portuguesas
  * quando a ESPN não fornece os dados necessários.
  */
 if(["por.2","por.3","por.w.1"].includes(liga)){

   fallbackGames(liga).forEach(e=>{

     const existe=eventos.some(x=>{
       const a=nomeEquipa(x.competitors?.[0]);
       const b=nomeEquipa(x.competitors?.[1]);

       return (
         localISO(new Date(x.date))===
         localISO(new Date(e.date)) &&
         (
           (a===nomeEquipa(e.competitors?.[0]) &&
            b===nomeEquipa(e.competitors?.[1])) ||
           (a===nomeEquipa(e.competitors?.[1]) &&
            b===nomeEquipa(e.competitors?.[0]))
         )
       );
     });

     if(!existe)
       eventos.push(e);
   });
 }

 eventos=deduplicarEventos(eventos);

 eventos.sort(
   (a,b)=>new Date(a.date)-new Date(b.date)
 );

 return eventos;
}

    competitors[0] ||
    null;

  let away=
    competitors.find(x=>x.homeAway==="away") ||
    competitors[1] ||
    null;

  const homeName=nomeEquipa(home);
  const awayName=nomeEquipa(away);

  /*
   * Não mostrar cartões incompletos.
   * Evita aparecer "⚽ Equipa".
   */
  if(!homeName || !awayName){
    return "";
  }

  const homeLogo=logoEquipa(home);
  const awayLogo=logoEquipa(away);

  const live=isLive(e);
  const final=isFinal(e);

  const hs=
    home?.score ??
    home?.scoreValue ??
    "";

  const as=
    away?.score ??
    away?.scoreValue ??
    "";

  const estado=
    live
      ?"AO VIVO"
      :final
        ?"FINAL"
        :horaEvento(e);

  const favorito=
    favoritosJogos
      .map(String)
      .includes(String(e.id));

  const liga=e.__futzoneLiga || ligaAtual;

  return `
  <article
    class="gameCard"
    onclick="abrirJogo('${escapeHtml(e.id)}')">

    <div class="gameTop">

      <span class="competition">
        ${escapeHtml(
          e.competitions?.[0]?.name ||
          getCompeticao(liga)
        )}
      </span>

      <button
        class="favBtn"
        onclick="
          event.stopPropagation();
          toggleFavoritoJogo('${escapeHtml(e.id)}')
        ">
        ${favorito ? "★" : "☆"}
      </button>

    </div>

    <div class="gameDate">
      ${escapeHtml(dataCurta(e.date))}
    </div>

    <div class="teams">

      <div
        class="team"
        onclick="
          event.stopPropagation();
          fzAbrirEquipa(
            '${escapeHtml(idEquipa(home))}',
            '${escapeHtml(homeName)}',
            '${escapeHtml(homeLogo)}',
            '${escapeHtml(liga)}'
          )
        ">

        ${
          homeLogo
            ? `<img
                 src="${escapeHtml(homeLogo)}"
                 loading="lazy"
                 alt="">`
            : `<div class="teamLogo">⚽</div>`
        }

        <span>
          ${escapeHtml(homeName)}
        </span>

      </div>

      <div class="scoreBox">

        <div class="matchState ${live ? "live" : ""}">
          ${escapeHtml(estado)}
        </div>

        <strong>
          ${
            final || live
              ? escapeHtml(String(hs)) +
                " - " +
                escapeHtml(String(as))
              : "VS"
          }
        </strong>

      </div>

      <div
        class="team"
        onclick="
          event.stopPropagation();
          fzAbrirEquipa(
            '${escapeHtml(idEquipa(away))}',
            '${escapeHtml(awayName)}',
            '${escapeHtml(awayLogo)}',
            '${escapeHtml(liga)}'
          )
        ">

        ${
          awayLogo
            ? `<img
                 src="${escapeHtml(awayLogo)}"
                 loading="lazy"
                 alt="">`
            : `<div class="teamLogo">⚽</div>`
        }

        <span>
          ${escapeHtml(awayName)}
        </span>

      </div>

    </div>

    ${
      live
        ? `<div class="liveBar">
             ● EM DIRETO
           </div>`
        : ""
    }

async function buscarTodosDia(iso,liveOnly=false){

 const dia=iso.replaceAll("-","");
 const cacheKey="ALL|"+dia;

 const cached=cacheGet(cacheKey,15000);

 if(cached){
   return liveOnly
     ?cached.filter(isLive)
     :cached;
 }

 const resultado=[];
 const seen=new Set();

 /*
  * Cinco ligas de cada vez para não bloquear
  * o telemóvel nem saturar o browser.
  */

 for(let i=0;i<LIGAS_FUTEBOL.length;i+=5){

   const grupo=LIGAS_FUTEBOL.slice(i,i+5);

   const respostas=await Promise.all(
     grupo.map(async liga=>{

       const url=
         API+
         encodeURIComponent(liga[0])+
         "/scoreboard?dates="+
         dia+
         "&limit=100";

       const data=
         await fetchAPI(url,7000,15000);

       return (data?.events||[])
       .map(e=>{
         e.__futzoneLiga=liga[0];
         return e;
       });
     })
   );

   respostas.flat().forEach(e=>{

     const id=String(e.id||"");

     if(id && seen.has(id))
       return;

     if(id)
       seen.add(id);

     resultado.push(e);
   });
 }

 /*
  * Acrescentar fallback português.
  */

 ["por.2","por.3","por.w.1"].forEach(liga=>{

   fallbackGames(liga).forEach(e=>{

     if(localISO(new Date(e.date))!==iso)
       return;

     const chave=
       [
         localISO(new Date(e.date)),
         nomeEquipa(e.competitors?.[0]),
         nomeEquipa(e.competitors?.[1])
       ].join("|");

     const existe=resultado.some(x=>{

       const outra=[
         localISO(new Date(x.date)),
         nomeEquipa(x.competitors?.[0]),
         nomeEquipa(x.competitors?.[1])
       ].join("|");

       return outra===chave;
     });

     if(!existe)
       resultado.push(e);
   });
 });

 const final=deduplicarEventos(resultado);

 final.sort(
   (a,b)=>new Date(a.date)-new Date(b.date)
 );

 CACHE.set(
   cacheKey,
   {time:Date.now(),data:final}
 );

 return liveOnly
   ?final.filter(isLive)
   :final;
}

/* =========================================================

   ========================================================= */

function extrairValor(stats,names){

 if(!Array.isArray(stats))
   return null;

 for(const nome of names){

   const s=stats.find(x=>
     String(
       x?.name||
       x?.type||
       x?.abbreviation||
       ""
     ).toLowerCase()===
     nome.toLowerCase()
   );

   if(s){

     if(s.value!==undefined)
       return s.value;

     if(s.displayValue!==undefined)
       return s.displayValue;
   }
 }

 return null;
}

function normalizarTabela(tabela){

 if(!Array.isArray(tabela))
   return [];

 return tabela.map((x,i)=>{

   const team=
     x?.team||
     x?.competitor||
     x?.entry||
     x;

   const stats=
     Array.isArray(x?.stats)
     ?x.stats
     :Array.isArray(x?.statistics)
     ?x.statistics
     :[];

   function valor(names,fallback=0){

     const v=extrairValor(stats,names);

     if(v!==null)
       return Number(v)||0;

     for(const n of names){

       if(x[n]!==undefined)
         return Number(x[n])||0;
     }

     return fallback;
   }

   return {
     pos:Number(
       x?.rank||
       x?.position||
       x?.order||
       i+1
     ),

     id:String(
       team?.id||
       x?.teamId||
       "team-"+i
     ),

     nome:
       team?.displayName||
       team?.name||
       team?.shortDisplayName||

function extrairTabelaESPN(data){

 const resultado=[];

 function procurar(obj){

   if(!obj || typeof obj!=="object")
     return;

   if(Array.isArray(obj.entries))
     resultado.push(...obj.entries);

   if(Array.isArray(obj.standings))
     resultado.push(...obj.standings);

   if(Array.isArray(obj.rows))
     resultado.push(...obj.rows);

   if(Array.isArray(obj.children))
     obj.children.forEach(procurar);
 }

 procurar(data);

 const map=new Map();

 resultado.forEach(x=>{

   const id=
     x?.team?.id||
     x?.competitor?.id||
     x?.id;

   const key=id
     ?String(id)
     :JSON.stringify(x);

   if(!map.has(key))
     map.set(key,x);
 });

 return [...map.values()];
}

function renderEstatisticas(stats){

 if(!Array.isArray(stats)||!stats.length)
   return "";

     x?.statistics||
     x?.stats||
     [];

     return;

   statistics.forEach(s=>{

     const nome=
       s?.name||
       s?.label||
       s?.displayName;

     if(!nome)return;

     const val=
       s?.displayValue||
       s?.value||
       "";

     rows.push({
       nome,
       val
     });
   });
 });

 return rows.slice(0,25).map(r=>`
   <div class="statRow">
     <div class="home">${escapeHtml(r.val)}</div>
