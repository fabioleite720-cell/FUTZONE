<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE</title>

<style>
:root{
  --blue:#0057B8;
  --blue2:#1683FF;
  --blue3:#003B7A;
  --bg:#03060B;
  --panel:#09111C;
  --panel2:#0D1724;
  --border:#1B2A3B;
  --text:#F5F7FA;
  --muted:#9DAABB;
  --red:#FF4054;
  --green:#20D68A;
  --yellow:#FFD43B;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:72px;
}

button{
  font-family:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(3,6,11,.97);
  border-bottom:1px solid var(--border);
  padding:13px 14px 10px;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--blue2);
}

.subtitle{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-top:2px;
  letter-spacing:.5px;
}

.topnav{
  display:flex;
  gap:7px;
  margin-top:11px;
  overflow-x:auto;
  scrollbar-width:none;
}

.topnav::-webkit-scrollbar{display:none}

.topbtn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:7px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.topbtn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.container{
  max-width:720px;
  margin:auto;
  padding:10px;
}

.section{
  margin-bottom:12px;
}

.sectionTitle{
  font-size:15px;
  font-weight:900;
  margin:12px 2px 8px;
}

.leagues{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}

.leagues::-webkit-scrollbar{display:none}

.leagueBtn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:#c8d0dc;
  border-radius:6px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
}

.leagueBtn.active{
  background:var(--blue3);
  border-color:var(--blue2);
  color:#fff;
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin:4px 0 12px;
}

.filter{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:6px;
  padding:8px 3px;
  font-size:10px;
  font-weight:900;
}

.filter.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.day{
  margin:12px 0 8px;
}

.dayHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel2);
  border-left:4px solid var(--blue2);
  padding:9px 10px;
  border-radius:5px;
}

.dayName{
  font-size:12px;
  font-weight:900;
}

.dayCount{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.competition{
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  background:#07101a;
}

.compHead{
  padding:7px 9px;
  background:#0c1723;
  color:#cbd5e1;
  font-size:10px;
  font-weight:900;
  border-bottom:1px solid var(--border);
}

.match{
  position:relative;
  display:grid;
  grid-template-columns:54px 1fr 42px 28px;
  gap:6px;
  align-items:center;
  min-height:68px;
  padding:8px 7px;
  border-bottom:1px solid #152333;
}

.match:last-child{
  border-bottom:0;
}

.matchTime{
  text-align:center;
  font-size:12px;
  font-weight:900;
}

.matchTime.live{
  color:var(--red);
}

.status{
  display:block;
  font-size:8px;
  margin-top:3px;
  font-weight:900;
  color:var(--muted);
}

.status.live{
  color:var(--red);
}

.teams{
  min-width:0;
}

.teamRow{
  display:flex;
  align-items:center;
  min-height:23px;
  gap:6px;
  cursor:pointer;
}

.teamLogo{
  width:19px;
  height:19px;
  object-fit:contain;
  flex:0 0 19px;
}

.teamName{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scores{
  text-align:center;
  font-size:13px;
  font-weight:900;
  line-height:24px;
}

.star{
  border:0;
  background:transparent;
  color:#5e6b7b;
  font-size:21px;
  padding:0;
}

.star.on{
  color:var(--yellow);
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  overflow:hidden;
  margin-bottom:8px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 12px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:28px 10px;
  color:var(--muted);
  font-size:12px;
}

.error{
  background:#241017;
  border:1px solid #5a202d;
  color:#ff9daa;
  padding:12px;
  border-radius:7px;
  font-size:11px;
  line-height:1.5;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  overflow-y:auto;
  display:none;
}

.overlay.show{
  display:block;
}

.overlayHead{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  background:#050a10;
  border-bottom:1px solid var(--border);
  padding:12px;
}

.back{
  border:0;
  background:var(--panel2);
  color:white;
  border-radius:6px;
  padding:8px 11px;
  font-weight:900;
}

.overlayTitle{
  font-size:15px;
  font-weight:900;
}

.detail{
  padding:12px;
}

.bigTeams{
  text-align:center;
  padding:15px 5px;
}

.bigLogo{
  width:55px;
  height:55px;
  object-fit:contain;
}

.bigName{
  font-size:17px;
  font-weight:900;
  margin:7px 0;
}

.bigScore{
  font-size:30px;
  font-weight:900;
  margin:8px;
}

.eventBox{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  padding:12px;
  margin-top:9px;
}

.eventTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:9px;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

.table th,
.table td{
  padding:7px 4px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:9px;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 5px;
  border-bottom:1px solid var(--border);
  font-size:11px;
}

.player:last-child{
  border-bottom:0;
}

.player small{
  color:var(--muted);
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  z-index:60;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#070d15;
  border-top:1px solid var(--border);
}

.bottom button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.bottom button.active{
  color:white;

.bottomIcon{
  display:block;
  font-size:20px;
  margin-bottom:3px;

.futsalTabs{

  gap:5px;
  margin-bottom:10px;

  background:var(--panel);
  color:var(--muted);
  border-radius:6px;

  font-size:10px;
  font-weight:900;

.futsalTab.active{

  color:#fff;

  border:1px solid var(--border);
  border-radius:7px;
  margin-bottom:6px;
  cursor:pointer;

.futsalTeam strong{

.futsalTeam span{
  color:var(--muted);
  font-size:10px;

.court{

  max-width:330px;
  height:430px;
  margin:15px auto;
  background:#073f2b;
  border:3px solid white;
  border-radius:7px;
  position:relative;
  overflow:hidden;
}

.court:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  border-top:2px solid rgba(255,255,255,.8);
}

.circle{
  position:absolute;
  width:95px;
  height:95px;
  border:2px solid white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.goal{
  position:absolute;
  left:50%;
  width:120px;
  height:45px;
  border:2px solid white;
  transform:translateX(-50%);
}

.goal.top{top:-2px}
.goal.bottom{bottom:-2px}

.position{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--blue);
  border:3px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
}

.p1{left:50%;top:76%;transform:translateX(-50%)}
.p2{left:19%;top:58%}
.p3{right:19%;top:58%}
.p4{left:50%;top:47%;transform:translateX(-50%)}
.p5{left:50%;top:20%;transform:translateX(-50%)}

.notice{
  padding:10px;
  background:#0d1724;
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

@media(max-width:360px){
  .match{
    grid-template-columns:48px 1fr 36px 25px;
  }
  .teamName{font-size:11px}
}
</style>
</head>

/* ---------- UTILITÁRIOS ---------- */

function escapeHtml(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function hojeISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatarData(data){
  const d = new Date(data+"T12:00:00");
  return new Intl.DateTimeFormat("pt-PT",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit"
  }).format(d);
}

function dataCurta(data){
  const d = new Date(data+"T12:00:00");
  return new Intl.DateTimeFormat("pt-PT",{
    day:"2-digit",
    month:"2-digit"
  }).format(d);
}

function normalizarData(event){
  if(!event.date) return hojeISO();
  return event.date.slice(0,10);
}

function horaEvento(event){
  if(!event.date) return "--:--";
  return new Intl.DateTimeFormat("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  }).format(new Date(event.date));
}

function isLive(event){
  const s = event.status?.type;
  return !!(s && (s.state==="in" || s.name==="STATUS_IN_PROGRESS" || s.shortDetail==="LIVE"));
}

function isFinal(event){
  const s = event.status?.type;
  return !!(s && (s.completed || s.state==="post"));
}

function nomeEquipa(comp){
  return comp?.team?.displayName || comp?.team?.name || "Equipa";
}

function logoEquipa(comp){
  return comp?.team?.logo || comp?.team?.logos?.[0]?.href || "";
}

function getCompeticao(event){
  return event?.league?.name ||
         event?.season?.displayName ||
         event?.competitions?.[0]?.league?.name ||
         "Futebol";
}

function criarEventoLocal(id,casa,fora,gc,gf,data="2026-09-05"){
  return {
    id:id,
    date:data+"T15:00:00Z",
    league:{
      name:"Liga Portugal"
    },
    season:{
      displayName:"2026/27"
    },
    status:{
      type:{
        completed:true,
        state:"post",
        shortDetail:"FINAL"
      }
    },
    competitions:[
      {
        competitors:[
          {
            homeAway:"home",
            score:gc,
            team:{
              id:"local-"+id+"-1",
              displayName:casa,
              name:casa
            }
          },
          {
            homeAway:"away",
            score:gf,
            team:{
              id:"local-"+id+"-2",
              displayName:fora,
              name:fora
            }
          }
        ]
      }
    ]
  };
}

async function buscarJogosLiga(liga){
  
  if (liga === "por.2") {
  return await jogosLiga2();
}

if (liga === "por.3") {
  return await jogosLiga3();
}
  const hoje = new Date();

  const datas = [];

  /* Apenas janela próxima para não rebentar a app */
  for(let i=-3;i<=10;i++){
    const d = new Date(hoje);
    d.setDate(d.getDate()+i);

    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");

    datas.push(`${y}${m}${day}`);
  }

  const pedidos = datas.map(async data=>{
    try{
      const r=await fetch(`${API}${liga}/scoreboard?dates=${data}`);
      if(!r.ok) return [];
      const j=await r.json();
      return j.events || [];
    }catch(e){
      return [];
    }
  });

  const resultados=await Promise.all(pedidos);

  const mapa=new Map();

  resultados.flat().forEach(e=>{
    if(e.id) mapa.set(e.id,e);
  });

  return Array.from(mapa.values());
}

async function carregarJogos(){
  const box=document.getElementById("footballContent");

  box.innerHTML='<div class="loading">A carregar jogos...</div>';

  try{
    const jogos=await buscarJogosLiga(ligaAtual);
    jogosFutebol=jogos;

    renderizarJogos();

  }catch(e){
    box.innerHTML=`
      <div class="error">
        Não foi possível carregar os jogos agora.
        <br><br>
        Verifica a ligação à internet e tenta novamente.
      </div>
    `;
  }
}

/* ---------- FILTROS ---------- */

function setFiltro(filtro,btn){
  filtroAtual=filtro;

  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  renderizarJogos();
}

function passaFiltro(event){
  if(filtroAtual==="todos") return true;
  if(filtroAtual==="live") return isLive(event);
  if(filtroAtual==="resultados") return isFinal(event);
  if(filtroAtual==="proximos") return !isFinal(event);
  return true;
}

/* ---------- RENDER FUTEBOL ---------- */

function renderizarJogos(){
  const box=document.getElementById("footballContent");

  const filtrados=jogosFutebol.filter(passaFiltro);

  if(!filtrados.length){
    box.innerHTML=`
      <div class="empty">
        Não existem jogos nesta seleção.
      </div>
    `;
    return;
  }

  filtrados.sort((a,b)=>{
    return new Date(a.date)-new Date(b.date);
  });

  const grupos={};

  filtrados.forEach(e=>{
    const d=normalizarData(e);
    if(!grupos[d]) grupos[d]=[];
    grupos[d].push(e);
  });

  const hoje=hojeISO();

  let html="";

  Object.keys(grupos).sort().forEach(data=>{
    const lista=grupos[data];

    let titulo=formatarData(data).toUpperCase();

    if(data===hoje){
      titulo="HOJE · "+titulo;
    }else{
      const amanha=new Date();
      amanha.setDate(amanha.getDate()+1);

      const ai=amanha.getFullYear()+"-"+
        String(amanha.getMonth()+1).padStart(2,"0")+"-"+
        String(amanha.getDate()).padStart(2,"0");

      if(data===ai) titulo="AMANHÃ · "+titulo;
    }

    html+=`
      <div class="day">
        <div class="dayHead">
          <div class="dayName">${escapeHtml(titulo)}</div>
          <div class="dayCount">${lista.length} ${lista.length===1?"jogo":"jogos"}</div>
        </div>
    `;

    lista.forEach(event=>{
      html+=cartaoJogo(event);
    });

    html+=`</div>`;
  });

  box.innerHTML=html;
}

function cartaoJogo(event){
  const comp=event.competitions?.[0];

  const competitors=comp?.competitors || [];

  const home=competitors.find(x=>x.homeAway==="home") || competitors[0];
  const away=competitors.find(x=>x.homeAway==="away") || competitors[1];

  const homeName=home?.team?.displayName || "Casa";
  const awayName=away?.team?.displayName || "Fora";

  const homeLogo=home?.team?.logo || "";
  const awayLogo=away?.team?.logo || "";

  const live=isLive(event);
  const final=isFinal(event);

  const status=live
    ? "LIVE"
    : final
      ? "FINAL"
      : event.status?.type?.shortDetail || "AGENDADO";

  const homeScore=home?.score ?? "-";
  const awayScore=away?.score ?? "-";

  const favorito=favJogos.includes(String(event.id));

  return `
    <div class="competition">
      <div class="compHead">
        ${escapeHtml(getCompeticao(event))}
      </div>

      <div class="match" onclick="abrirJogo('${escapeHtml(String(event.id))}')">

        <div class="matchTime ${live?"live":""}">
          ${horaEvento(event)}
          <span class="status ${live?"live":""}">
            ${escapeHtml(status)}
          </span>
        </div>

        <div class="teams">

          <div class="teamRow"
            onclick="event.stopPropagation();abrirEquipaPorEvento('${escapeHtml(String(event.id))}','home')">

            ${homeLogo
              ? `<img class="teamLogo" src="${escapeHtml(homeLogo)}">`
              : `<span class="teamLogo"></span>`
            }

            <span class="teamName">${escapeHtml(homeName)}</span>
          </div>

          <div class="teamRow"
            onclick="event.stopPropagation();abrirEquipaPorEvento('${escapeHtml(String(event.id))}','away')">

            ${awayLogo
              ? `<img class="teamLogo" src="${escapeHtml(awayLogo)}">`
              : `<span class="teamLogo"></span>`
            }

            <span class="teamName">${escapeHtml(awayName)}</span>
          </div>

        </div>

        <div class="scores">
          <div>${escapeHtml(String(homeScore))}</div>
          <div>${escapeHtml(String(awayScore))}</div>
        </div>

        <button class="star ${favorito?"on":""}"
          onclick="event.stopPropagation();toggleFavJogo('${escapeHtml(String(event.id))}')">
          ${favorito?"★":"☆"}
        </button>

      </div>
    </div>
  `;
}

/* ---------- FAVORITOS ---------- */

function toggleFavJogo(id){
  id=String(id);

  if(favJogos.includes(id)){
    favJogos=favJogos.filter(x=>x!==id);
  }else{
    favJogos.push(id);
  }

  localStorage.setItem(
    "futzone_jogos_favoritos",
    JSON.stringify(favJogos)
  );

  renderizarJogos();
}

function toggleFavEquipa(id){
  id=String(id);

  if(favEquipas.includes(id)){
    favEquipas=favEquipas.filter(x=>x!==id);
  }else{
    favEquipas.push(id);
  }

  localStorage.setItem(
    "futzone_equipas_favoritas",
    JSON.stringify(favEquipas)
  );
}

  const competitors=comp?.competitors || [];

  const home=competitors.find(x=>x.homeAway==="home") || competitors[0];

/* ---------- EQUIPAS ---------- */

function abrirEquipaPorEvento(id,lado){
  const event=jogosFutebol.find(x=>String(x.id)===String(id));
  if(!event) return;

  const comp=event.competitions?.[0];
  const competitors=comp?.competitors || [];

  const team=competitors.find(x=>x.homeAway===lado);

  if(!team?.team) return;

  abrirEquipa(
    team.team.id,
    team.team.displayName,
    team.team.logo,
    ligaAtual
  );
}

async function carregarPlantel(id,liga){
  const box=document.getElementById("rosterBox");

  try{
    const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${liga}/teams/${id}/roster`;

    const r=await fetch(url);

    if(!r.ok) throw new Error();

    const data=await r.json();

    const atletas=data.athletes || data.roster || [];

    if(!atletas.length){
      box.innerHTML=`<div class="notice">Plantel não disponível.</div>`;
      return;
    }

    box.innerHTML=atletas.slice(0,40).map(p=>{
      const atleta=p.athlete || p;

      return `
        <div class="player">
          <strong>${escapeHtml(atleta.displayName || atleta.fullName || "Jogador")}</strong>
          <small>${escapeHtml(atleta.position?.displayName || atleta.position?.name || "")}</small>
        </div>
      `;
    }).join("");

  }catch(e){
    box.innerHTML=`
      <div class="notice">
        Plantel não disponível neste momento.
      </div>
    `;
  }
}

function bpiClassificacao(){

  const tabela = BPI_EQUIPAS.map(nome => ({
    nome: nome,
    J: 0,
    V: 0,
    E: 0,
    D: 0,
    GM: 0,
    GS: 0,
    P: 0
  }));

  const mapa = {};

  tabela.forEach(e => {
    mapa[e.nome] = e;
  });

  BPI_RESULTADOS.forEach(jogo => {

    const casa = mapa[jogo.home];
    const fora = mapa[jogo.away];

    if(!casa || !fora) return;

    casa.J++;
    fora.J++;

    casa.GM += jogo.homeScore;
    casa.GS += jogo.awayScore;

    fora.GM += jogo.awayScore;
    fora.GS += jogo.homeScore;

    if(jogo.homeScore > jogo.awayScore){

      casa.V++;
      casa.P += 3;
      fora.D++;

    }else if(jogo.homeScore < jogo.awayScore){

      fora.V++;
      fora.P += 3;
      casa.D++;

    }else{

      casa.E++;
      fora.E++;

      casa.P++;
      fora.P++;

    }

  });

  tabela.sort((a,b) => {

    if(b.P !== a.P){
      return b.P - a.P;
    }

    const dgA = a.GM - a.GS;
    const dgB = b.GM - b.GS;

    if(dgB !== dgA){
      return dgB - dgA;
    }

    return b.GM - a.GM;

  });

  return tabela;
}

(function(){

  let fzDetalheTimer = null;

  function fzTexto(v){
    return escapeHtml(v || "");
  }

  function fzEquipaPorId(summary, id){
    const comps =
      summary?.header?.competitions?.[0]?.competitors ||
      summary?.competitions?.[0]?.competitors ||
      [];

    return comps.find(c =>
      String(c?.team?.id || c?.id || "") === String(id)
    );
  }

  function fzNomeJogador(a){
    return a?.displayName ||
           a?.fullName ||
           a?.athlete?.displayName ||
           a?.athlete?.fullName ||
           "Jogador";
  }

  function fzNomeEquipaId(summary,id){
    const c=fzEquipaPorId(summary,id);
    return c?.team?.displayName ||
           c?.team?.name ||
           "";
  }

  function fzMinuto(play){

    if(play?.clock?.displayValue)
      return play.clock.displayValue;

    if(play?.clock?.value != null){
      const segundos=Number(play.clock.value);
      if(!isNaN(segundos)){
        return Math.floor(segundos/60)+":"
          +String(Math.floor(segundos%60)).padStart(2,"0");
      }
    }

    return "";
  }

  function fzTipoEvento(play){

    const t=String(
      play?.type?.text ||
      play?.type?.name ||
      play?.type?.id ||
      ""
    ).toLowerCase();

    const texto=String(play?.text || "").toLowerCase();

    if(play?.scoringPlay || t.includes("goal") ||
       t.includes("score") ||
       texto.includes("goal")){
      return "goal";
    }

    if(play?.redCard || t.includes("red") ||
       texto.includes("red card")){
      return "red";
    }

    if(play?.yellowCard || t.includes("yellow") ||
       texto.includes("yellow card")){
      return "yellow";
    }

    if(t.includes("substitution") ||
       t.includes("sub") ||
       texto.includes("substitution")){
      return "sub";
    }

    return "other";
  }

  function fzIconeEvento(tipo){
    if(tipo==="goal") return "⚽";
    if(tipo==="red") return "🟥";
    if(tipo==="yellow") return "🟨";
    if(tipo==="sub") return "🔄";
    return "•";
  }

  function fzEventos(summary){

    let plays =
      summary?.plays ||
      summary?.keyEvents ||
      [];

    if(!Array.isArray(plays)) plays=[];

    return plays
      .filter(p=>{
        const tipo=fzTipoEvento(p);
        return ["goal","red","yellow","sub"].includes(tipo);
      })
      .map(p=>{

        const tipo=fzTipoEvento(p);

        let jogadores=[];

        if(Array.isArray(p.athletesInvolved))
          jogadores=p.athletesInvolved;

        if(Array.isArray(p.participants))
          jogadores=jogadores.concat(p.participants);

        const nomes=[...new Set(
          jogadores
            .map(x=>fzNomeJogador(x))
            .filter(Boolean)
        )];

        return {
          tipo:tipo,
          minuto:fzMinuto(p),
          equipa:fzNomeEquipaId(
            summary,
            p?.team?.id
          ),
          nomes:nomes,
          texto:p?.text || ""
        };

      });
  }

  function fzRenderEventos(summary){

    const eventos=fzEventos(summary);

    if(!eventos.length){
      return `
        <div class="notice">
          Não existem eventos detalhados disponíveis para este jogo.
        </div>
      `;
    }

    return eventos.map(e=>{

      let descricao=e.texto;

      if(!descricao){

        if(e.nomes.length){
          descricao=e.nomes.join(" · ");
        }else{
          descricao=e.equipa || "Evento";
        }

      }

      return `
        <div class="player">

          <div>
            <strong>
              ${fzIconeEvento(e.tipo)}
              ${fzTexto(descricao)}
            </strong>

            ${
              e.equipa
              ? `<small style="display:block;margin-top:3px">
                   ${fzTexto(e.equipa)}
                 </small>`
              : ""
            }
          </div>

          <small>
            ${fzTexto(e.minuto || "")}
          </small>

        </div>
      `;

    }).join("");
  }

  function fzRenderTitulares(summary){

    const rosters=summary?.rosters || [];

    if(!Array.isArray(rosters) || !rosters.length){
      return `
        <div class="notice">
          Os 11 titulares não estão disponíveis para este jogo.
        </div>
      `;
    }

    return rosters.map(r=>{

      const equipa=
        r?.team?.displayName ||
        r?.team?.name ||
        fzNomeEquipaId(summary,r?.team?.id) ||
        "Equipa";

      const jogadores=
        r?.roster ||
        r?.athletes ||
        [];

      const titulares=jogadores.filter(p=>
        p?.starter === true ||
        p?.starter === "true" ||
        p?.isStarter === true
      );

      if(!titulares.length) return "";

      return `
        <div class="eventBox">

          <div class="eventTitle">
            👥 ${fzTexto(equipa)} — 11 titular
          </div>

          ${
            titulares.map((p,i)=>{

              const a=p?.athlete || p;

              const nome=
                a?.displayName ||
                a?.fullName ||
                "Jogador";

              const pos=
                a?.position?.displayName ||
                a?.position?.abbreviation ||
                p?.position?.displayName ||
                "";

              const numero=
                a?.jersey ||
                p?.jersey ||
                "";

              return `
                <div class="player">

                  <strong>
                    ${i+1}. ${fzTexto(nome)}
                  </strong>

                  <small>
                    ${numero ? "#"+fzTexto(numero)+" " : ""}
                    ${fzTexto(pos)}
                  </small>

                </div>
              `;

            }).join("")
          }

        </div>
      `;

    }).join("");
  }

  function fzRenderEstatisticas(summary){

    const teams=summary?.boxscore?.teams || [];

    if(!Array.isArray(teams) || teams.length<1){

      return `
        <div class="notice">
          As estatísticas deste jogo ainda não estão disponíveis.
        </div>
      `;

    }

    const dados=teams.map(t=>({

      nome:
        t?.team?.displayName ||
        t?.team?.name ||
        "Equipa",

      stats:t?.statistics || []

    }));

    const nomes=new Set();

    dados.forEach(t=>{
      t.stats.forEach(s=>{
        if(s?.name || s?.label){
          nomes.add(s.name || s.label);
        }
      });
    });

    const lista=[...nomes];

    const mapaNome={
      possession:"Posse de bola",
      shots:"Remates",
      shotsOnTarget:"Remates à baliza",
      corners:"Cantos",
      fouls:"Faltas",
      yellowCards:"Amarelos",
      redCards:"Vermelhos",
      offsides:"Fora de jogo",
      saves:"Defesas",
      totalShots:"Remates",
      accuratePasses:"Passes certos",
      totalPasses:"Passes"
    };

    return `
      <div style="overflow-x:auto">

        <table class="table">

          <thead>
            <tr>
              <th>Estatística</th>

              ${
                dados.map(t=>
                  `<th>${fzTexto(t.nome)}</th>`
                ).join("")
              }

            </tr>
          </thead>

          <tbody>

            ${
              lista.map(nome=>{

                const valores=dados.map(t=>{

                  const s=t.stats.find(x=>
                    x?.name===nome ||
                    x?.label===nome
                  );

                  return s?.displayValue ??
                         s?.value ??
                         "-";
                });

                return `
                  <tr>

                    <td>
                      ${fzTexto(
                        mapaNome[nome] ||
                        nome
                      )}
                    </td>

                    ${
                      valores.map(v=>
                        `<td><strong>
                          ${fzTexto(v)}
                        </strong></td>`
                      ).join("")
                    }

                  </tr>
                `;

              }).join("")
            }

          </tbody>

        </table>

      </div>
    `;
  }

  function fzRenderJogadores(summary){

    const jogadores=summary?.boxscore?.players || [];

    if(!Array.isArray(jogadores) || !jogadores.length){
      return "";
    }

    let html="";

    jogadores.forEach(grupo=>{

      const equipa=
        grupo?.team?.displayName ||
        grupo?.team?.name ||
        "";

      const atletas=grupo?.statistics || [];

      if(!Array.isArray(atletas) || !atletas.length)
        return;

      html+=`
        <div class="eventBox">

          <div class="eventTitle">
            📈 ${fzTexto(equipa)} — jogadores
          </div>

          ${
            atletas.slice(0,30).map(p=>{

              const a=p?.athlete || {};

              const nome=
                a?.displayName ||
                p?.displayName ||
                "Jogador";

              let resumo="";

              if(Array.isArray(p?.statistics)){
                resumo=p.statistics
                  .slice(0,4)
                  .map(s=>
                    `${s?.label || s?.name || ""}: ${s?.displayValue || s?.value || ""}`
                  )
                  .filter(x=>x.trim())
                  .join(" · ");
              }

              return `
                <div class="player">

                  <strong>
                    ${fzTexto(nome)}
                  </strong>

                  <small>
                    ${fzTexto(resumo)}
                  </small>

                </div>
              `;

            }).join("")
          }

        </div>
      `;

    });

    return html;
  }

  async function fzCarregarDetalhe(id){

    const event=jogosFutebol.find(
      x=>String(x.id)===String(id)
    );

    if(!event) return;

    const box=document.getElementById("overlayContent");

    if(!box) return;

    const liga=ligaAtual;

    /*
      Liga 2/Liga 3 são dados locais no FUTZONE.

    */

    if(
      liga==="por.2" ||
      liga==="por.3"
    ){

      box.innerHTML+=`
        <div class="eventBox">
          <div class="eventTitle">
            ℹ️ Detalhes
          </div>

          <div class="notice">
            Esta competição está a usar dados locais no FUTZONE.

            fonte de dados que forneça eventos e estatísticas.
          </div>
        </div>
      `;

      return;
    }

    try{

      const url=
        `${API}${liga}/summary?event=${encodeURIComponent(id)}`;

      const r=await fetch(url,{
        cache:"no-store"

      if(!r.ok)
        throw new Error("summary");

      const summary=await r.json();

      /*

        ${titularesHtml}

        Atualização automática durante jogos LIVE
      */

        summary?.header?.competitions?.[0]
          ?.status?.type?.state==="in" ||
        summary?.header?.competitions?.[0]
          ?.status?.type?.name==="STATUS_IN_PROGRESS";

      if(liveAtual){

        fzDetalheTimer=setTimeout(()=>{

          <div class="notice">
            Os detalhes completos deste jogo

        </div>

        <div class="loading">
          Golos, cartões, titulares e estatísticas.
        </div>

      </div>

    `;

    document.getElementById("overlay")
      .classList.add("show");

    await fzCarregarDetalhe(id);
  };

  /*
    Fecha o temporizador quando se fecha o jogo.
  */

  const fzFecharOverlayOriginal=window.fecharOverlay;

  window.fecharOverlay=function(){

    clearTimeout(fzDetalheTimer);

    if(typeof fzFecharOverlayOriginal==="function"){
      fzFecharOverlayOriginal();
    }else{
      document.getElementById("overlay")
        ?.classList.remove("show");
    }

  };

  console.log(
    "FUTZONE: detalhe completo dos jogos ativado."
  );

})();
</script>
