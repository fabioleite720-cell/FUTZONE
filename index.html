<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#061a40">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fa;
 color:#111827;
}
header{
 background:#061a40;
 color:white;
 padding:16px;
 position:sticky;
 top:0;
 z-index:20;
}
.top{
 max-width:850px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.logo{font-size:28px;font-weight:900}
.logo span{color:#19d36b}
.subtitle{font-size:12px;opacity:.7}
.refresh{
 border:0;
 background:#19d36b;
 color:white;
 border-radius:10px;
 padding:9px 13px;
 font-size:18px;
}
.container{
 max-width:850px;
 margin:auto;
 padding:12px 12px 85px;
}
.tabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding-bottom:4px;
}
.tab{
 border:0;
 background:white;
 padding:10px 13px;
 border-radius:20px;
 white-space:nowrap;
 font-weight:bold;
}
.tab.active{background:#061a40;color:white}

.filters{
 display:flex;
 gap:8px;
 margin:12px 0;
}
.filter{
 flex:1;
 border:0;
 padding:11px;
 border-radius:11px;
 background:white;
 font-weight:bold;
}
.filter.active{
 background:#061a40;
 color:white;
}

.card{
 background:white;
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 3px 15px #0000000d;
}
.title{
 font-size:18px;
 font-weight:900;
 margin-bottom:12px;
}
.match{
 border-top:1px solid #edf0f3;
 padding:14px 0;
}
.match:first-child{border-top:0}
.teams{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
}
.team{
 width:38%;
 text-align:center;
 font-size:13px;
 font-weight:800;
}
.team img{
 width:42px;
 height:42px;
 object-fit:contain;
 display:block;
 margin:auto auto 6px;
}
.score{
 min-width:65px;
 text-align:center;
 font-size:20px;
 font-weight:900;
}
.status{
 text-align:center;
 margin-top:7px;
 font-size:11px;
 color:#6b7280;
}
.live{
 color:#e11d48;
 font-weight:900;
}
.date{
 color:#64748b;
 font-size:11px;
}
.star{
 border:0;
 background:none;
 font-size:18px;
 margin-top:4px;
}
.empty{
 text-align:center;
 padding:30px 10px;
 color:#64748b;
}
.loading{
 text-align:center;
 padding:35px;
 color:#64748b;
}
.error{
 background:#fff1f2;
 color:#be123c;
 padding:15px;
 border-radius:12px;
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}
th,td{
 padding:9px 4px;
 border-bottom:1px solid #edf0f3;
 text-align:center;
}
th:nth-child(2),td:nth-child(2){
 text-align:left;
}
.club{
 display:flex;
 align-items:center;
 gap:6px;
 font-weight:bold;
}
.club img{
 width:25px;
 height:25px;
 object-fit:contain;
}
.search{
 width:100%;
 border:1px solid #ddd;
 border-radius:12px;
 padding:12px;
 font-size:15px;
 margin-bottom:12px;
}
.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:65px;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30;
}
.bottom button{
 border:0;
 background:none;
 color:#64748b;
 font-size:11px;
}
.bottom button.active{
 color:#061a40;
 font-weight:900;
}
.icon{
 display:block;
 font-size:21px;
 margin-bottom:2px;
}
.badge{
 display:inline-block;
 padding:4px 7px;
 border-radius:7px;
 background:#f1f5f9;
 font-size:10px;
 font-weight:bold;
}
.badge.live{
 background:#ffe4e6;
 color:#be123c;
}
</style>
</head>

<body>

<header>
 <div class="top">
  <div>
   <div class="logo">FUT<span>ZONE</span></div>
   <div class="subtitle">Futebol em direto</div>
  </div>
  <button class="refresh" onclick="carregar()">↻</button>
 </div>
</header>

<div class="container">

 <div class="tabs" id="tabs"></div>

 <div class="filters">
  <button class="filter active" onclick="filtro('todos',this)">Todos</button>
  <button class="filter" onclick="filtro('live',this)">🔴 LIVE</button>
  <button class="filter" onclick="filtro('proximos',this)">🕐 Próximos</button>
  <button class="filter" onclick="filtro('resultados',this)">✅ Resultados</button>
 </div>

 <div id="conteudo">
  <div class="loading">⚽ A carregar FUTZONE...</div>
 </div>

</div>

<nav class="bottom">

 <button id="bInicio" class="active" onclick="pagina('inicio')">
  <span class="icon">🏠</span>Início
 </button>

 <button id="bJogos" onclick="pagina('jogos')">
  <span class="icon">⚽</span>Jogos
 </button>

 <button id="bTabela" onclick="pagina('tabela')">
  <span class="icon">📊</span>Tabela
 </button>

 <button id="bFav" onclick="pagina('favoritos')">
  <span class="icon">⭐</span>Favoritos
 </button>

</nav>

<script>

const ligas={
 portugal:{
  nome:"🇵🇹 Primeira Liga",
  jogos:"data/primeira-liga.json",
  tabela:"data/classificacao.json"
 },
 inglaterra:{
  nome:"🏴 Premier League",
  jogos:"data/premier-league.json",
  tabela:"data/premier-league-classificacao.json"
 },
 espanha:{
  nome:"🇪🇸 La Liga",
  jogos:"data/la-liga.json",
  tabela:"data/la-liga-classificacao.json"
 },
 italia:{
  nome:"🇮🇹 Serie A",
  jogos:"data/serie-a.json",
  tabela:"data/serie-a-classificacao.json"
 },
 alemanha:{
  nome:"🇩🇪 Bundesliga",
  jogos:"data/bundesliga.json",
  tabela:"data/bundesliga-classificacao.json"
 }
};

let jogos={};
let tabelas={};
let ligaAtual="portugal";
let paginaAtual="inicio";
let filtroAtual="todos";

let favoritos=JSON.parse(
 localStorage.getItem("futzone_favoritos")||"[]"
);

function normalizar(x){
 return String(x||"")
 .toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"");
}

function guardar(){
 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(favoritos)
 );
}

function isFav(nome){
 return favoritos.includes(normalizar(nome));
}

function toggleFav(nome){

 const n=normalizar(nome);
 const i=favoritos.indexOf(n);

 if(i>=0) favoritos.splice(i,1);
 else favoritos.push(n);

 guardar();
 render();
}

async function json(url){

 const r=await fetch(url+"?t="+Date.now());

 if(!r.ok) throw Error(r.status);

 return await r.json();
}

async function carregar(){

 document.getElementById("conteudo").innerHTML=
 `<div class="loading">⚽ A atualizar dados...</div>`;

 for(const chave of Object.keys(ligas)){

  try{
   jogos[chave]=await json(ligas[chave].jogos);
  }catch(e){
   jogos[chave]={events:[]};
  }

  try{
   tabelas[chave]=await json(ligas[chave].tabela);
  }catch(e){
   tabelas[chave]={};
  }
 }

 criarTabs();
 render();
}

function eventos(chave){

 const j=jogos[chave];

 if(!j) return [];

 if(Array.isArray(j.events)) return j.events;
 if(Array.isArray(j)) return j;
 if(Array.isArray(j.data)) return j.data;

 return [];
}

function comp(e){
 return e?.competitions?.[0]||null;
}

function dadosJogo(e){

 const c=comp(e);

 if(c?.competitors){

  const h=c.competitors.find(x=>x.homeAway==="home");
  const a=c.competitors.find(x=>x.homeAway==="away");

  return {
   home:h?.team||{},
   away:a?.team||{},
   hs:h?.score??"-",
   as:a?.score??"-",
   status:e.status?.type?.state||"",
   detalhe:e.status?.type?.shortDetail||
           e.status?.type?.detail||"",
   data:e.date
  };
 }

 return {
  home:e.home_team||{},
  away:e.away_team||{},
  hs:e.score?.home??"-",
  as:e.score?.away??"-",
  status:"",
  detalhe:e.status||"",
  data:e.date||e.match_date
 };
}

function nome(t){
 return t?.displayName||
        t?.shortDisplayName||
        t?.name||
        t?.team_name||
        "Equipa";
}

function logo(t){
 return t?.logo||
        t?.logos?.[0]?.href||
        "";
}

function eLive(d){

 const s=String(d.status||"").toLowerCase();

 return s==="in" ||
        s.includes("live") ||
        s.includes("in progress");
}

function terminado(d){

 const s=String(d.status||"").toLowerCase();

 return s==="post" ||
        s==="postponed" ||
        s.includes("final") ||
        s.includes("finished");
}

function dataJogo(d){

 if(!d.data) return "";

 const dt=new Date(d.data);

 if(isNaN(dt)) return "";

 return dt.toLocaleString("pt-PT",{
  day:"2-digit",
  month:"2-digit",
  hour:"2-digit",
  minute:"2-digit"
 });
}

function tipoJogo(d){

 if(eLive(d)) return "live";
 if(terminado(d)) return "resultados";
 return "proximos";
}

function criarJogo(e){

 const d=dadosJogo(e);

 const h=nome(d.home);
 const a=nome(d.away);

 const lh=logo(d.home);
 const la=logo(d.away);

 const live=eLive(d);

 return `
 <div class="match">

  <div class="teams">

   <div class="team">

    ${
     lh
     ? `<img src="${lh}"
             onerror="this.style.display='none'">`
     : "⚽"
    }

    ${h}

    <button class="star"
     onclick="toggleFav('${h.replace(/'/g,"")}')">
     ${isFav(h)?"⭐":"☆"}
    </button>

   </div>

   <div class="score">
    ${d.hs} - ${d.as}
   </div>

   <div class="team">

    ${
     la
     ? `<img src="${la}"
             onerror="this.style.display='none'">`
     : "⚽"
    }

    ${a}

    <button class="star"
     onclick="toggleFav('${a.replace(/'/g,"")}')">
     ${isFav(a)?"⭐":"☆"}
    </button>

   </div>

  </div>

  <div class="status">

   ${
    live
    ? `<span class="badge live">🔴 LIVE</span>`
    : `<span class="date">${dataJogo(d)}</span>`
   }

   ${
    d.detalhe
    ? `<br>${d.detalhe}`
    : ""
   }

  </div>

 </div>
 `;
}

function criarTabs(){

 const el=document.getElementById("tabs");

 el.innerHTML="";

 Object.keys(ligas).forEach(k=>{

  const b=document.createElement("button");

  b.className=
   "tab "+(k===ligaAtual?"active":"");

  b.textContent=ligas[k].nome;

  b.onclick=()=>{

   ligaAtual=k;
   criarTabs();
   render();

  };

  el.appendChild(b);

 });
}

function listaFiltrada(){

 let arr=eventos(ligaAtual);

 if(filtroAtual!=="todos"){

  arr=arr.filter(e=>{

   const d=dadosJogo(e);

   return tipoJogo(d)===filtroAtual;

  });

 }

 return arr;
}

function renderInicio(){

 const arr=listaFiltrada();

 let html=`
 <div class="card">
  <div class="title">${ligas[ligaAtual].nome}</div>
  <div class="badge">
   ${arr.length} jogos
  </div>
 </div>
 `;

 if(!arr.length){

  html+=`
  <div class="card empty">
   Não existem jogos nesta categoria.
  </div>
  `;

 }else{

  html+=`
  <div class="card">
   <div class="title">
    ${filtroAtual==="live"?"🔴 Em direto":
      filtroAtual==="proximos"?"🕐 Próximos":
      filtroAtual==="resultados"?"✅ Resultados":
      "⚽ Jogos"}
   </div>
   ${arr.map(criarJogo).join("")}
  </div>
  `;
 }

 document.getElementById("conteudo").innerHTML=html;
}

function renderJogos(){

 const arr=listaFiltrada();

 document.getElementById("conteudo").innerHTML=`

 <div class="card">

  <div class="title">
   ⚽ ${ligas[ligaAtual].nome}
  </div>

  ${
   arr.length
   ? arr.map(criarJogo).join("")
   : `<div class="empty">
       Não existem jogos disponíveis.
      </div>`
  }

 </div>

 `;
}

function entradasTabela(j){

 if(!j) return [];

 if(Array.isArray(j.entries))
  return j.entries;

 if(j.children){

  for(const c of j.children){

   if(c.standings?.entries)
    return c.standings.entries;

  }
 }

 if(j.standings?.entries)
  return j.standings.entries;

 return [];
}

function stat(e,n){

 const s=e.stats?.find(
  x=>x.name===n ||
     x.abbreviation===n
 );

 return s?.displayValue ??
        s?.value ??
        "-";
}

function renderTabela(){

 const arr=entradasTabela(tabelas[ligaAtual]);

 let html=`

 <div class="card">

  <div class="title">
   📊 ${ligas[ligaAtual].nome}
  </div>

  <div style="overflow-x:auto">

  <table>

   <thead>
    <tr>
     <th>#</th>
     <th>Equipa</th>
     <th>J</th>
     <th>V</th>
     <th>E</th>
     <th>D</th>
     <th>Pts</th>
    </tr>
   </thead>

   <tbody>
 `;

 if(!arr.length){

  html+=`
   <tr>
    <td colspan="7">
     Classificação indisponível.
    </td>
   </tr>
  `;

 }else{

  arr.forEach((e,i)=>{

   const t=e.team||{};

   const n=nome(t);
   const l=logo(t);

   html+=`

   <tr>

    <td>${i+1}</td>

    <td>
     <div class="club">

      ${
       l
       ? `<img src="${l}"
                onerror="this.style.display='none'">`
       : "⚽"
      }

      ${n}

     </div>
    </td>

    <td>${stat(e,"gamesPlayed")}</td>
    <td>${stat(e,"wins")}</td>
    <td>${stat(e,"ties")}</td>
    <td>${stat(e,"losses")}</td>
    <td><b>${stat(e,"points")}</b></td>

   </tr>

   `;

  });

 }

 html+=`
   </tbody>
  </table>

  </div>

 </div>
 `;

 document.getElementById("conteudo").innerHTML=html;
}

function renderFavoritos(){

 let html=`

 <div class="card">

  <div class="title">
   ⭐ Favoritos
  </div>

  <input
   class="search"
   placeholder="🔎 Procurar equipa..."
   oninput="pesquisarFav(this.value)"
  >

  <div id="favlista">
 `;

 if(!favoritos.length){

  html+=`
   <div class="empty">
    Ainda não tens equipas favoritas.
    <br><br>
    Adiciona ⭐ nos jogos.
   </div>
  `;

 }else{

  favoritos.forEach(f=>{

   html+=`

   <div class="match favitem">

    ⚽ ${f}

    <button
     onclick="toggleFav('${f}')"
     style="float:right;border:0;background:none">
     ❌
    </button>

   </div>

   `;

  });

 }

 html+=`
  </div>
 </div>
 `;

 document.getElementById("conteudo").innerHTML=html;
}

function pesquisarFav(v){

 const q=normalizar(v);

 document.querySelectorAll(".favitem")
 .forEach(x=>{

  x.style.display=
   normalizar(x.textContent).includes(q)
   ? "block"
   : "none";

 });

}

function render(){

 if(paginaAtual==="inicio")
  renderInicio();

 if(paginaAtual==="jogos")
  renderJogos();

 if(paginaAtual==="tabela")
  renderTabela();

 if(paginaAtual==="favoritos")
  renderFavoritos();
}

function filtro(tipo,botao){

 filtroAtual=tipo;

 document.querySelectorAll(".filter")
 .forEach(x=>x.classList.remove("active"));

 botao.classList.add("active");

 paginaAtual="inicio";

 render();
}

function pagina(p){

 paginaAtual=p;

 document.querySelectorAll(".bottom button")
 .forEach(x=>x.classList.remove("active"));

 if(p==="inicio")
  document.getElementById("bInicio")
  .classList.add("active");

 if(p==="jogos")
  document.getElementById("bJogos")
  .classList.add("active");

 if(p==="tabela")
  document.getElementById("bTabela")
  .classList.add("active");

 if(p==="favoritos")
  document.getElementById("bFav")
  .classList.add("active");

 render();
}

carregar();

</script>

</body>
</html>
