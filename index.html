<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<title>FUTZONE PREMIUM</title>

<style>
:root{
--b:#0057b8;
--b2:#1683ff;
--bg:#03060b;
--c:#0a111b;
--c2:#101a28;
--g:#20d68a;
--r:#ff4054;
--y:#ffd43b;
--t:#f5f7fb;
--m:#8d9aaa;
--l:#1b2635
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--t);
font-family:Arial,sans-serif
}
.header{
position:sticky;
top:0;
z-index:5;
background:#03060bf7;
border-bottom:1px solid var(--l);
padding:14px 12px
}
.logo{font-size:25px;font-weight:900}
.logo span{color:var(--b2)}
.sub{
font-size:10px;
color:var(--m);
letter-spacing:2px
}
.nav,.quick,.chips{
display:flex;
gap:7px;
overflow:auto;
padding-top:12px
}
.nav button,.quick button,.chip,.title button{
white-space:nowrap;
background:var(--c2);
color:#fff;
border:1px solid var(--l);
border-radius:9px;
padding:9px 11px;
font-weight:700;
font-size:11px
}
.nav .active{
background:linear-gradient(135deg,var(--b),var(--b2))
}
main{
padding:12px;
max-width:1100px;
margin:auto
}
.hidden{display:none!important}
.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px
}
.card{
background:linear-gradient(var(--c2),var(--c));
border:1px solid var(--l);
border-radius:13px;
padding:11px
}
.title{
display:flex;
justify-content:space-between;
align-items:center;
margin:7px 0 10px
}
.title h2{
font-size:18px;
margin:0
}
.muted{
color:var(--m);
font-size:10px
}
.suggest{min-height:145px}
.orange{color:#ffad42}
.green{color:var(--g)}
.match{
display:flex;
justify-content:space-between;
gap:6px;
font-size:12px;
font-weight:800
}
.market{
font-size:13px;
margin-top:10px
}
.status{
color:var(--m);
font-size:10px;
margin-top:8px
}
.live{
color:var(--r);
font-weight:900
}
.teamhead{
display:grid;
grid-template-columns:1fr 60px 1fr;
text-align:center;
align-items:center;
gap:7px
}
.team{cursor:pointer}
.team img{
width:48px;
height:48px;
object-fit:contain
}
.name{
display:block;
font-size:13px;
font-weight:900;
margin-top:6px
}
.score{
font-size:20px;
font-weight:900
}
.row{
border-top:1px solid var(--l);
margin-top:12px;
padding-top:10px
}
.label{
font-size:10px;
color:var(--m);
text-transform:uppercase
}
.value{
font-size:13px;
font-weight:800;
margin-top:5px
}
.watch{
display:grid;
gap:7px;
margin-top:7px
}
.watch a{
background:#111d2b;
color:#fff;
text-decoration:none;
padding:9px;
border-radius:8px;
font-size:11px;
border:1px solid #26364a
}
.lastgrid,.statsgrid,.lineups{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
.last,.statbox,.lineup{
background:#08111c;
border:1px solid var(--l);
border-radius:9px;
padding:8px;
margin-top:8px
}
.form{
display:flex;
gap:4px;
margin:7px 0
}
.form b{
width:22px;
height:22px;
display:flex;
align-items:center;
justify-content:center;
border-radius:5px;
font-size:10px
}
.v{background:#124f3a;color:#54f2b0}
.e{background:#554914;color:#ffe36b}
.d{background:#571d29;color:#ff8290}
.game{cursor:pointer}
.leagueGroup{grid-column:1/-1}
.leagueHead{
font-size:15px;
font-weight:900;
padding:10px 4px 5px;
border-bottom:1px solid var(--l);
margin-top:8px
}
.eventList{
display:grid;
gap:7px
}
.eventItem{
font-size:10px;
padding:7px;
border-top:1px solid var(--l)
}
.roster{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}
.player{
background:#0a131f;
border:1px solid var(--l);
border-radius:8px;
padding:8px;
font-size:11px;
cursor:pointer
}
.pos{
color:var(--m);
font-size:10px;
margin-top:3px
}
.loading{
text-align:center;
color:var(--m);
padding:25px
}
.err{
color:#ff8290;
font-size:11px;
padding:12px
}
.statbox{text-align:center}
.statbox b{font-size:13px}
.statbox span{
display:block;
color:var(--m);
font-size:9px;
margin-top:4px
}
.tablewrap{overflow-x:auto}
.table{
width:100%;
border-collapse:collapse;
font-size:10px
}
.table th,.table td{
padding:8px 5px;
border-bottom:1px solid var(--l);
text-align:left;
white-space:nowrap
}
.table th{color:var(--m)}
.click{cursor:pointer}
.chip{padding:7px 9px}

@media(max-width:600px){
.grid,.lastgrid,.statsgrid,.lineups{
grid-template-columns:1fr
}
.teamhead{
grid-template-columns:1fr 50px 1fr
}
}
</style>
</head>

<body>

<header class="header">

<div class="logo">
FUTZONE <span>PREMIUM</span>
</div>

FUTEBOL EM DIRETO

<nav class="nav">

<main>

<section id="premium">

🌍 Todos carregados
</button>

<div id="gamesList" class="grid"></div>

<section id="tables" class="hidden">

<div class="title">
<h2>📊 Tabelas</h2>
</div>

<div id="tablesList">
<div class="loading">
A carregar...
</div>
</div>

</section>


<section id="news" class="hidden">

<div class="title">
<h2>📰 Notícias</h2>
</div>

<div id="newsList">
<div class="loading">
A carregar...
</div>
</div>

</section>


<section id="favorites" class="hidden">

<div class="title">
<h2>⭐ Favoritos</h2>
</div>

Ainda não existem favoritos.
</div>

<div class="title">

<div class="title">

<h2>

</h2>

</button>

<div class="title">

<h2 id="rosterTitle">
📋 Plantel
</h2>

<button onclick="backRoster()">
← Voltar
</button>

</div>

<div id="rosterBox"></div>

</section>

<div class="title">

<h2 id="playerTitle">
👤 Jogador
</h2>

← Voltar
</button>

<div id="playerBox"></div>

</main>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const CORE='https://sports.core.api.espn.com/v2/sports/soccer/leagues/';
const SOFA='https://www.sofascore.com/api/v1';

let games=[];
let teams={};
let current=null;
let controller=null;

const LEAGUES=[
['por.1','Liga Portugal'],
['por.2','Liga 2'],
['por.3','Liga 3'],
['por.w.1','Liga BPI Feminina'],
['eng.1','Premier League'],
['esp.1','La Liga'],
['ita.1','Serie A'],
['ger.1','Bundesliga'],
['fra.1','Ligue 1'],
['tur.1','Super Lig'],
['ksa.1','Saudi Pro League'],
['usa.1','MLS'],
['uefa.champions','Liga dos Campeões'],
['uefa.europa','Liga Europa'],
['uefa.europa.conf','Liga Conferência'],
['uefa.nations','Liga das Nações'],
['fifa.worldq.uefa','Qualificação Mundial UEFA'],
['fifa.worldq.conmebol','Qualificação Mundial CONMEBOL'],
['fifa.friendly','Amigáveis'],
['conmebol.libertadores','Libertadores'],
['conmebol.sudamericana','Sul-Americana']
];

const esc=s=>String(s??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');

function sec(id,btn){
document.querySelectorAll('main>section')
.forEach(x=>x.classList.add('hidden'));

const el=document.getElementById(id);
if(el)el.classList.remove('hidden');

document.querySelectorAll('.nav button')
.forEach(x=>x.classList.remove('active'));

if(btn)btn.classList.add('active');

if(id==='tables')loadTables();
if(id==='news')loadNews();
if(id==='live')showLive();
}

function add(parent,html){
const el=document.createElement('div');
el.innerHTML=html;
parent.appendChild(el.firstElementChild);
}

function fmtDate(d){
try{
return new Date(d).toLocaleDateString('pt-PT',{
day:'2-digit',
month:'2-digit',
year:'numeric'
});
}catch(e){return ''}
}

function fmtTime(d){
try{
return new Date(d).toLocaleTimeString('pt-PT',{
hour:'2-digit',
minute:'2-digit'
});
}catch(e){return ''}
}

async function get(path){
if(controller)controller.abort();

controller=new AbortController();

const timer=setTimeout(()=>{
try{controller.abort()}catch(e){}
},12000);

try{

const r=await fetch(API+path,{
cache:'no-store',
signal:controller.signal
});

if(!r.ok)throw new Error('HTTP '+r.status);

return await r.json();

}finally{
clearTimeout(timer);
}
}


async function jsonUrl(url,timeout=10000){

const c=new AbortController();

const timer=setTimeout(()=>{
try{c.abort()}catch(e){}
},timeout);

try{

const r=await fetch(url,{
cache:'no-store',
signal:c.signal
});

if(!r.ok)throw new Error('HTTP '+r.status);

return await r.json();

}catch(e){
return null;
}finally{
clearTimeout(timer);
}

}


function teamFromEvent(e,home=true){

const c=e?.competitions?.[0]?.competitors||[];

return c.find(x=>home?
x.homeAway==='home':
x.homeAway==='away')||c[home?0:1]||null;

}


function teamIdFromEvent(e,home=true){

return teamFromEvent(e,home)?.team?.id||'';

}


function teamNameFromEvent(e,home=true){

return teamFromEvent(e,home)?.team?.displayName||
teamFromEvent(e,home)?.team?.shortDisplayName||
'Equipa';

}


function scoreValue(c){

if(!c)return null;

const v=[
c.score?.value,
c.score?.displayValue,
c.score,
c.statistics?.find?.(x=>x.name==='goals')?.value
];

for(const x of v){

if(x!==undefined&&x!==null&&x!==''){

const n=parseFloat(String(x).replace(',','.'));

if(Number.isFinite(n))return n;

}

}

if(Array.isArray(c.linescores)){

const s=c.linescores.reduce((a,x)=>a+(Number(x.value)||0),0);

if(Number.isFinite(s))return s;

}

return null;

}


function completed(e){

return !!(
e?.status?.type?.completed===true||
['post','final','finished','completed']
.includes(String(e?.status?.type?.state||'').toLowerCase())
);

}


function resultForTeam(e,teamId){

const cs=e?.competitions?.[0]?.competitors||[];

const me=cs.find(c=>String(c.team?.id)===String(teamId));

if(!me)return null;

const op=cs.find(c=>String(c.team?.id)!==String(teamId));

const gf=scoreValue(me);
const ga=scoreValue(op);

if(gf===null||ga===null)return null;

return{
date:e.date,
opponent:op?.team?.displayName||'Adversário',
gf,
ga,
result:gf>ga?'V':gf===ga?'E':'D',
event:e
};

}


async function last5(team,id,exclude){

const box=document.getElementById(id);

if(!box)return;

box.innerHTML='<div class="loading">A procurar os últimos 5 jogos...</div>';

let events=[];

const urls=[
API+'all/teams/'+encodeURIComponent(team)+'/schedule?limit=100',
API+'teams/'+encodeURIComponent(team)+'/schedule?limit=100'
];

for(const u of urls){

const d=await jsonUrl(u);

if(Array.isArray(d?.events)){
events.push(...d.events);
}

if(events.length)break;

}

let rows=events
.filter(e=>completed(e))
.filter(e=>String(e.id)!==String(exclude))
.map(e=>resultForTeam(e,team))
.filter(Boolean)
.sort((a,b)=>new Date(b.date)-new Date(a.date))
.slice(0,5);

if(!rows.length){

box.innerHTML='<div class="muted">Não foi possível obter os últimos jogos.</div>';
return;

}

box.innerHTML=rows.map(r=>`

<div class="last">

<div class="muted">${fmtDate(r.date)}</div>

<div class="match">
<span>${esc(r.opponent)}</span>
<b>${r.gf}-${r.ga}</b>
</div>

<div class="form">
<b class="${r.result==='V'?'v':r.result==='E'?'e':'d'}">
${r.result}
</b>
</div>

</div>

`).join('');

}


function marketLabel(m){

const s=String(m||'');

if(/over/i.test(s))return s.replace(/Over/ig,'Mais de');
if(/under/i.test(s))return s.replace(/Under/ig,'Menos de');
if(/draw/i.test(s))return 'Empate';
if(/home win/i.test(s))return 'Vitória da casa';
if(/away win/i.test(s))return 'Vitória visitante';

return s;

}


function suggestMarket(e){

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

if(!h||!a)return null;

return{
high:h.team.displayName+' ou empate (1X)',
low:'Mais de 0,5 golos'
};

}


function suggestions(){

const box=document.getElementById('suggestions');

if(!box)return;

const valid=games
.filter(e=>e.competitions?.[0])
.slice(0,10);

if(!valid.length){

box.innerHTML='<div class="loading">Sem sugestões disponíveis.</div>';
return;

}

box.innerHTML=valid.map((e,i)=>{

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

const s=suggestMarket(e);

return`

<div class="card suggest game"
onclick="openMatch('${esc(e.id)}')">

<div class="match">

<span>${esc(h?.team?.displayName||'Casa')}</span>

<span>vs</span>

<span>${esc(a?.team?.displayName||'Visitante')}</span>

</div>

<div class="market orange">
Médio-alto
</div>

<div class="value">
${esc(s?.high||'Análise Premium')}
</div>

<div class="market green">
Médio-baixo
</div>

<div class="value">
${esc(s?.low||'Mais de 0,5 golos')}
</div>

<div class="status">
${fmtDate(e.date)} ${fmtTime(e.date)}
</div>

</div>

`;

}).join('');

}


function render(list=games){

const box=document.getElementById('gamesList');

if(!box)return;

if(!list.length){

box.innerHTML='<div class="loading">Não existem jogos disponíveis.</div>';
return;

}

const groups={};

list.forEach(e=>{

const l=e.leagueName||
e.league?.name||
e.competitions?.[0]?.league?.name||
'Futebol';

(groups[l]??=[]).push(e);

});

box.innerHTML=Object.entries(groups).map(([league,arr])=>`

<div class="leagueGroup">

<div class="leagueHead">
${esc(league)}
</div>

<div class="eventList">

${arr.map(e=>{

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

return`

<div class="card game" onclick="openMatch('${esc(e.id)}')">

<div class="match">

<span>${esc(h?.team?.displayName||'Casa')}</span>

<b>
${completed(e)?
(scoreValue(h)||0)+' - '+(scoreValue(a)||0):
'vs'}
</b>

<span>${esc(a?.team?.displayName||'Visitante')}</span>

</div>

<div class="status">

${completed(e)?
'Terminado':
(e.status?.type?.shortDetail||
fmtDate(e.date)+' '+fmtTime(e.date))}

</div>

</div>

`;

}).join('')}

</div>

</div>

`).join('');

}


function showAll(){

render(games);

sec('games');

}


function showToday(){

const now=new Date();

const day=now.toISOString().slice(0,10);

render(
games.filter(e=>String(e.date||'').slice(0,10)===day)
);

}


function showLive(){

const live=games.filter(e=>
e?.status?.type?.state==='in'
);

const box=document.getElementById('liveList');

if(!box)return;

if(!live.length){

box.innerHTML='<div class="card muted">Não existem jogos ao vivo neste momento.</div>';

}else{

box.innerHTML=live.map(e=>{

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

return`

<div class="card game"
onclick="openMatch('${esc(e.id)}')">

<div class="match">
<span>${esc(h?.team?.displayName)}</span>
<b>${scoreValue(h)||0}-${scoreValue(a)||0}</b>
<span>${esc(a?.team?.displayName)}</span>
</div>

<div class="live">🔴 AO VIVO</div>

</div>

`;

}).join('');

}

sec('live');

}
 </script>
 <script>

async function openMatch(id){

current=games.find(e=>String(e.id)===String(id));

if(!current){
document.getElementById('analysisBox').innerHTML=
'<div class="err">Não foi possível encontrar este jogo.</div>';
sec('analysis');
return;
}

sec('analysis');

const box=document.getElementById('analysisBox');

const h=teamFromEvent(current,true);
const a=teamFromEvent(current,false);

const homeId=h?.team?.id||'';
const awayId=a?.team?.id||'';

box.innerHTML=`

<div class="card">

<div class="teamhead">

<div class="team" onclick="openTeam('${esc(homeId)}','${esc(h?.team?.displayName||'Casa')}')">

${h?.team?.logo?
`<img src="${esc(h.team.logo)}">`:''}

<span class="name">
${esc(h?.team?.displayName||'Casa')}
</span>

</div>

<div>

<div class="score">

${completed(current)?
(scoreValue(h)||0)+' - '+(scoreValue(a)||0):
'vs'}

</div>

<div class="status">

${completed(current)?
'Terminado':
(current.status?.type?.shortDetail||fmtDate(current.date)+' '+fmtTime(current.date))}

</div>

</div>

<div class="team" onclick="openTeam('${esc(awayId)}','${esc(a?.team?.displayName||'Visitante')}')">

${a?.team?.logo?
`<img src="${esc(a.team.logo)}">`:''}

<span class="name">
${esc(a?.team?.displayName||'Visitante')}
</span>

</div>

</div>

<div class="row">

<div class="label">Médio-alto</div>

<div class="value orange">
${esc(suggestMarket(current)?.high||'Análise Premium')}
</div>

</div>

<div class="row">

<div class="label">Médio-baixo</div>

<div class="value green">
${esc(suggestMarket(current)?.low||'Mais de 0,5 golos')}
</div>

</div>

</div>


<div id="matchDetails">

<div class="loading">
A carregar informações do jogo...
</div>

</div>

`;

await loadMatchDetails(current);

}


async function loadMatchDetails(e){

const box=document.getElementById('matchDetails');

if(!box)return;

const eventId=e.id;

const home=teamFromEvent(e,true);
const away=teamFromEvent(e,false);

box.innerHTML=`

<div class="card row">

<div class="label">
Acontecimentos do jogo
</div>

<div id="incidentsBox">
<div class="loading">A carregar...</div>
</div>

</div>


<div class="card row">

<div class="label">
Estatísticas
</div>

<div id="statsBox">
<div class="loading">A carregar...</div>
</div>

</div>


<div class="card row">

<div class="label">
11 titular
</div>

<div id="lineupBox">
<div class="loading">A carregar...</div>
</div>

</div>


<div class="card row">

<div class="label">
Últimos 5 jogos
</div>

<div class="lastgrid">

<div>

<div class="value">
${esc(home?.team?.displayName||'Casa')}
</div>

<div id="lastHome">
<div class="loading">A carregar...</div>
</div>

</div>

<div>

<div class="value">
${esc(away?.team?.displayName||'Visitante')}
</div>

<div id="lastAway">
<div class="loading">A carregar...</div>
</div>

</div>

</div>

</div>


<div class="card row">

<div class="label">
Onde ver
</div>

<div id="watchBox">
<div class="loading">A procurar transmissão...</div>
</div>

</div>

`;

await Promise.allSettled([

loadIncidents(e),

loadStatistics(e),

loadLineups(e),

last5(home?.team?.id,'lastHome',eventId),

last5(away?.team?.id,'lastAway',eventId),

loadWatch(e)

]);

async function sofaEventId(e){

const h=teamFromEvent(e,true);
const a=teamFromEvent(e,false);

const hn=String(
h?.team?.displayName||
h?.team?.shortDisplayName||
''
).toLowerCase();

const an=String(
a?.team?.displayName||
a?.team?.shortDisplayName||
''
).toLowerCase();

const date=String(e.date||'').slice(0,10);

const searchNames=[

`${hn} ${an}`,
`${an} ${hn}`

];

for(const q of searchNames){

const u=
'https://www.sofascore.com/api/v1/sport/football/search/'+
encodeURIComponent(q);

const d=await jsonUrl(u);

const ev=d?.results||d?.events||[];

if(Array.isArray(ev)){

for(const x of ev){

const evh=String(
x?.homeTeam?.name||
x?.homeTeam?.shortName||
''
).toLowerCase();

const eva=String(
x?.awayTeam?.name||
x?.awayTeam?.shortName||
''
).toLowerCase();

const xd=String(
x?.startTimestamp?
new Date(x.startTimestamp*1000).toISOString().slice(0,10):
''
);

if(
(
evh.includes(hn.split(' ')[0])||
hn.includes(evh.split(' ')[0])
)&&
(
eva.includes(an.split(' ')[0])||
an.includes(eva.split(' ')[0])
)&&
(!date||!xd||date===xd)
){

return x.id;

}

}

}

}

return null;

}

function statNumber(x){

if(x==null)return null;

if(typeof x==='number')return x;

const v=
x.displayValue??
x.value??
x.displayValue;

if(v==null)return null;

const n=parseFloat(
String(v).replace('%','').replace(',','.')
);

return Number.isFinite(n)?n:null;

}


function normaliseStatName(s){

return String(s||'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/[^a-z0-9]/g,'');

}


function statLabel(name){

const n=normaliseStatName(name);

const map={

possession:'Posse',
possessionpercentage:'Posse',

shots:'Remates',
totalshots:'Remates',
attemptedshots:'Remates',

shotsontarget:'Remates à baliza',
shotsontargettotal:'Remates à baliza',
ontarget:'Remates à baliza',

corners:'Cantos',
cornerkicks:'Cantos',

fouls:'Faltas',
foulscommitted:'Faltas',

offsides:'Foras de jogo',
offside:'Foras de jogo',

saves:'Defesas',
goalkeepersaves:'Defesas',

passes:'Passes',
totalpasses:'Passes',
accuratepasses:'Passes certos',

passaccuracy:'Precisão de passe',
passingaccuracy:'Precisão de passe'

};

return map[n]||null;

}


function extractStats(d){

const out=[];

function walk(node,teamName=''){

if(!node)return;

if(Array.isArray(node)){

node.forEach(x=>walk(x,teamName));
return;

}

if(typeof node!=='object')return;

const name=
node.name||
node.label||
node.displayName||
node.shortName;

const label=statLabel(name);

if(label){

const value=
node.displayValue??
node.value;

if(value!=null){

out.push({
label,
value,
team:teamName
});

}

}

const nextTeam=
node.team?.displayName||
node.team?.shortDisplayName||
teamName;

for(const k of Object.keys(node)){

if(
k==='statistics'||
k==='stats'||
k==='groups'||
k==='entries'||
k==='data'||
k==='content'||
k==='teams'||
k==='boxscore'
){

walk(node[k],nextTeam);

}

}

}

walk(d);

return out;

}

function findStandings(d){

const out=[];

function walk(x){

if(!x)return;

if(Array.isArray(x)){

x.forEach(walk);
return;

}

if(typeof x!=='object')return;

if(Array.isArray(x.entries)){

out.push(...x.entries);

}

if(Array.isArray(x.standings?.entries)){

out.push(...x.standings.entries);

}

if(Array.isArray(x.children)){

x.children.forEach(walk);

}

if(Array.isArray(x.groups)){

x.groups.forEach(walk);

}

}

walk(d);

const map=new Map();

out.forEach(x=>{

const id=
x?.team?.id||
x?.team?.uid||
x?.id;

if(id&&!map.has(id))
map.set(id,x);

});

return [...map.values()];

}
