<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2 CORRIGIDO
   RESULTADOS / JORNADAS / TABELAS / AO VIVO
   ATUALIZAÇÃO AUTOMÁTICA EM TODAS AS LIGAS
   ========================================================= */

const FZ_API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const FZ_STANDINGS =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [
  { id:"por.1",          nome:"🇵🇹 Liga Portugal" },
  { id:"por.2",          nome:"🇵🇹 Liga Portugal 2" },
  { id:"por.3",          nome:"🇵🇹 Liga 3" },
  { id:"por.w.1",        nome:"🇵🇹 Liga BPI Feminina" },

  { id:"eng.1",          nome:"🏴 Premier League" },
  { id:"eng.2",          nome:"🏴 Championship" },

  { id:"esp.1",          nome:"🇪🇸 LaLiga" },
  { id:"esp.2",          nome:"🇪🇸 LaLiga 2" },

  { id:"ita.1",          nome:"🇮🇹 Serie A" },
  { id:"ita.2",          nome:"🇮🇹 Serie B" },

  { id:"ger.1",          nome:"🇩🇪 Bundesliga" },
  { id:"ger.2",          nome:"🇩🇪 2. Bundesliga" },

  { id:"fra.1",          nome:"🇫🇷 Ligue 1" },
  { id:"fra.2",          nome:"🇫🇷 Ligue 2" },

  { id:"ned.1",          nome:"🇳🇱 Eredivisie" },
  { id:"bel.1",          nome:"🇧🇪 Jupiler Pro League" },

  { id:"ksa.1",          nome:"🇸🇦 Saudi Pro League" },
  { id:"usa.1",          nome:"🇺🇸 MLS" },

  { id:"uefa.champions",   nome:"🏆 Champions League" },
  { id:"uefa.europa",      nome:"🏆 Europa League" },
  { id:"uefa.europa.conf", nome:"🏆 Conference League" }
];

let FZ_ligaSelecionada = "por.1";
let FZ_modo = "jogos";

let FZ_atualizacaoJogos = null;
let FZ_atualizacaoLive = null;
let FZ_atualizando = false;


/* =========================================================
   DATA / HORA
   ========================================================= */

function FZ_dataISO(data = new Date()) {
  const d = new Date(data);
  return d.toISOString().slice(0,10);
}

function FZ_dataTexto(data) {
  const d = new Date(data + "T12:00:00");

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"2-digit"
  });
}

function FZ_dataLonga(data) {
  const d = new Date(data + "T12:00:00");

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function FZ_hora(data) {
  if (!data) return "--:--";

  const d = new Date(data);

  if (isNaN(d.getTime())) return "--:--";

  return d.toLocaleTimeString("pt-PT", {
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================================
   FETCH SEM CACHE
   ========================================================= */

async function FZ_fetch(url) {

  const separador = url.includes("?") ? "&" : "?";

  const urlFinal =
    url +
    separador +
    "_fz=" +
    Date.now() +
    Math.random().toString(36).slice(2);

  const resposta = await fetch(urlFinal, {
    method:"GET",
    cache:"no-store",
    headers:{
      "Accept":"application/json"
    }
  });

  if (!resposta.ok) {
    throw new Error(
      "Erro HTTP " +
      resposta.status +
      " em " +
      url
    );
  }

  return await resposta.json();
}


/* =========================================================
   NOME DA LIGA
   ========================================================= */

function FZ_nomeLiga(id) {

  const liga = FZ_LIGAS.find(x => x.id === id);

  return liga ? liga.nome : id;
}


/* =========================================================
   COMPETIÇÕES
   ========================================================= */

function FZ_renderizarCompeticoes() {

  const el = document.getElementById("competicoes");

  if (!el) return;

  el.innerHTML = "";

  FZ_LIGAS.forEach(liga => {

    const botao = document.createElement("button");

    botao.className =
      "chip " +
      (liga.id === FZ_ligaSelecionada ? "active" : "");

    botao.textContent = liga.nome;

    botao.onclick = () => {
      FZ_selecionarLiga(liga.id);
    };

    el.appendChild(botao);
  });
}


async function FZ_selecionarLiga(id) {

  FZ_ligaSelecionada = id;

  FZ_renderizarCompeticoes();

  if (FZ_modo === "tabelas") {
    await FZ_tabelas();
  }

  else if (FZ_modo === "jornadas") {
    await FZ_jornadas();
  }

  else if (FZ_modo === "live") {
    await FZ_aoVivo();
  }

  else {
    await FZ_jogosDoDia();
  }
}


/* =========================================================
   ESTADO
   ========================================================= */

function FZ_estado(texto) {

  const el = document.getElementById("estado");

  if (!el) return;

  el.textContent = texto;
}


/* =========================================================
   CARTÃO DE JOGO
   ========================================================= */

function FZ_cartaoJogo(evento, ligaOverride = null) {

  if (!evento) return "";

  const competicao =
    ligaOverride ||
    FZ_nomeLiga(FZ_ligaSelecionada);

  const comp =
    evento.competitions &&
    evento.competitions[0];

  if (!comp) return "";

  const casa =
    comp.competitors?.find(
      x => x.homeAway === "home"
    );

  const fora =
    comp.competitors?.find(
      x => x.homeAway === "away"
    );

  const nomeCasa =
    casa?.team?.displayName ||
    casa?.team?.shortDisplayName ||
    "Casa";

  const nomeFora =
    fora?.team?.displayName ||
    fora?.team?.shortDisplayName ||
    "Fora";

  const logoCasa =
    casa?.team?.logo || "";

  const logoFora =
    fora?.team?.logo || "";

  const scoreCasa =
    casa?.score ?? "-";

  const scoreFora =
    fora?.score ?? "-";

  const estado =
    evento.status?.type?.state || "";

  const detalhe =
    evento.status?.type?.shortDetail ||
    evento.status?.type?.detail ||
    "";

  const data =
    evento.date;

  let estadoTexto = "";

  if (estado === "in") {

    estadoTexto =
      '<span class="liveBadge">● AO VIVO</span>';

  } else if (estado === "post") {

    estadoTexto =
      '<span class="resultado">FINAL</span>';

  } else if (estado === "pre") {

    estadoTexto =
      '<span class="horaJogo">' +
      FZ_hora(data) +
      "</span>";

  } else {

    estadoTexto =
      '<span class="resultado">' +
      detalhe +
      "</span>";
  }


  const jogoJSON =
    JSON.stringify(evento)
      .replace(/\\/g,"\\\\")
      .replace(/'/g,"&#39;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");


  return `
    <div class="jogo-card"
         onclick='FZ_abrirJogo(${jogoJSON})'>

      <div class="jogo-topo">
        <span>${competicao}</span>
        <span>${FZ_dataTexto(FZ_dataISO(data))}</span>
      </div>

      <div class="equipa">
        <div class="equipaNome">

          ${
            logoCasa
              ? `<img src="${logoCasa}"
                      class="equipaLogo"
                      loading="lazy">`
              : ""
          }

          <span>${nomeCasa}</span>

        </div>

        <strong>${scoreCasa}</strong>
      </div>

      <div class="equipa">

        <div class="equipaNome">

          ${
            logoFora
              ? `<img src="${logoFora}"
                      class="equipaLogo"
                      loading="lazy">`
              : ""
          }

          <span>${nomeFora}</span>

        </div>

        <strong>${scoreFora}</strong>

      </div>

      <div class="jogo-estado">
        ${estadoTexto}
      </div>

    </div>
  `;
}


/* =========================================================
   JOGOS DE UMA LIGA — HOJE
   ========================================================= */

async function FZ_jogosDoDia() {

  FZ_modo = "jogos";

  FZ_estado(
    "A atualizar " +
    FZ_nomeLiga(FZ_ligaSelecionada) +
    "..."
  );

  const hoje = FZ_dataISO();

  const url =
    FZ_API +
    FZ_ligaSelecionada +
    "/scoreboard?dates=" +
    hoje;

  try {

    const data = await FZ_fetch(url);

    const eventos =
      Array.isArray(data.events)
        ? data.events
        : [];

    const conteudo =
      document.getElementById("conteudo");

    if (!conteudo) return;

    conteudo.innerHTML = "";

    if (!eventos.length) {

      conteudo.innerHTML = `
        <div class="vazio">
          Não existem jogos desta competição
          para hoje.
        </div>
      `;

    } else {

      eventos
        .sort(
          (a,b) =>
            new Date(a.date) -
            new Date(b.date)
        )
        .forEach(evento => {

          conteudo.insertAdjacentHTML(
            "beforeend",
            FZ_cartaoJogo(evento)
          );

        });
    }

    FZ_estado(
      FZ_nomeLiga(FZ_ligaSelecionada) +
      " • atualizado às " +
      new Date().toLocaleTimeString(
        "pt-PT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    );

  } catch (erro) {

    console.error(
      "FUTZONE jogos:",
      erro
    );

    FZ_estado(
      "Não foi possível atualizar os jogos."
    );
  }
}


/* =========================================================
   JORNADAS / RESULTADOS PASSADOS / FUTUROS
   ========================================================= */

async function FZ_jornadas() {

  FZ_modo = "jornadas";

  FZ_estado(
    "A atualizar jornadas de " +
    FZ_nomeLiga(FZ_ligaSelecionada) +
    "..."
  );

  const hoje =
    new Date();

  const datas = [];

  /*
    Procuramos 30 dias para trás
    e 45 dias para a frente.
  */

  for (let i = -30; i <= 45; i++) {

    const d =
      new Date(hoje);

    d.setDate(
      d.getDate() + i
    );

    datas.push(
      FZ_dataISO(d)
    );
  }


  const conteudo =
    document.getElementById("conteudo");

  if (!conteudo) return;

  conteudo.innerHTML = `
    <div class="carregando">
      A carregar resultados e próximos jogos...
    </div>
  `;


  const resultados = [];

  /*
    Pedimos em grupos pequenos para
    evitar excesso de pedidos.
  */

  for (
    let inicio = 0;
    inicio < datas.length;
    inicio += 5
  ) {

    const grupo =
      datas.slice(
        inicio,
        inicio + 5
      );

    const respostas =
      await Promise.all(
        grupo.map(async data => {

          try {

            const json =
              await FZ_fetch(
                FZ_API +
                FZ_ligaSelecionada +
                "/scoreboard?dates=" +
                data
              );

            return {
              data,
              eventos:
                Array.isArray(json.events)
                  ? json.events
                  : []
            };

          } catch (e) {

            console.warn(
              "Erro data",
              data,
              e
            );

            return {
              data,
              eventos:[]
            };
          }

        })
      );

    resultados.push(
      ...respostas
    );
  }


  const grupos =
    resultados
      .filter(x => x.eventos.length)
      .sort(
        (a,b) =>
          a.data.localeCompare(b.data)
      );


  conteudo.innerHTML = "";


  if (!grupos.length) {

    conteudo.innerHTML = `
      <div class="vazio">
        Não foram encontrados jogos
        para esta competição.
      </div>
    `;

    return;
  }


  grupos.forEach(grupo => {

    const titulo =
      document.createElement("div");

    titulo.className =
      "jornadaTitulo";

    titulo.innerHTML =
      FZ_dataLonga(grupo.data);

    conteudo.appendChild(
      titulo
    );


    grupo.eventos
      .sort(
        (a,b) =>
          new Date(a.date) -
          new Date(b.date)
      )
      .forEach(evento => {

        conteudo.insertAdjacentHTML(
          "beforeend",
          FZ_cartaoJogo(evento)
        );

      });

  });


  FZ_estado(
    "Jornadas atualizadas • " +
    new Date().toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  );
}


/* =========================================================
   AO VIVO — TODAS AS LIGAS
   ========================================================= */

async function FZ_aoVivo() {

  FZ_modo = "live";

  FZ_estado(
    "A procurar jogos ao vivo em todas as competições..."
  );

  const conteudo =
    document.getElementById("conteudo");

  if (!conteudo) return;

  conteudo.innerHTML = `
    <div class="carregando">
      🔴 A procurar jogos ao vivo...
    </div>
  `;


  const jogosLive = [];


  /*
    Todas as ligas são pesquisadas.
    Em grupos de 4 para não disparar
    demasiados pedidos ao mesmo tempo.
  */

  for (
    let inicio = 0;
    inicio < FZ_LIGAS.length;
    inicio += 4
  ) {

    const grupo =
      FZ_LIGAS.slice(
        inicio,
        inicio + 4
      );


    const respostas =
      await Promise.all(
        grupo.map(async liga => {

          try {

            const data =
              await FZ_fetch(
                FZ_API +
                liga.id +
                "/scoreboard"
              );

            const eventos =
              Array.isArray(data.events)
                ? data.events
                : [];

            return eventos
              .filter(
                evento =>
                  evento.status?.type?.state === "in"
              )
              .map(evento => ({
                evento,
                liga: liga.nome,
                ligaId: liga.id
              }));

          } catch (e) {

            console.warn(
              "Erro live",
              liga.id,
              e
            );

            return [];
          }

        })
      );


    respostas.forEach(lista => {

      jogosLive.push(
        ...lista
      );

    });

  }


  conteudo.innerHTML = "";


  if (!jogosLive.length) {

    conteudo.innerHTML = `
      <div class="vazio">
        <div style="font-size:40px">
          ⚽
        </div>

        <h3>Nenhum jogo ao vivo</h3>

        <p>
          Neste momento não existem jogos
          em direto nas competições configuradas.
        </p>
      </div>
    `;

  } else {

    jogosLive.forEach(item => {

      conteudo.insertAdjacentHTML(
        "beforeend",
        FZ_cartaoJogo(
          item.evento,
          item.liga
        )
      );

    });

  }


  FZ_estado(
    jogosLive.length +
    " jogo(s) ao vivo • atualizado às " +
    new Date().toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  );
}


/* =========================================================
   CLASSIFICAÇÕES
   ========================================================= */

async function FZ_tabelas() {

  FZ_modo = "tabelas";

  FZ_estado(
    "A atualizar classificação..."
  );

  const conteudo =
    document.getElementById("conteudo");

  if (!conteudo) return;


  try {

    const url =
      FZ_STANDINGS +
      FZ_ligaSelecionada +
      "/standings";

    const data =
      await FZ_fetch(url);


    let entries = [];


    if (
      Array.isArray(data?.children)
    ) {

      for (
        const child of data.children
      ) {

        if (
          Array.isArray(
            child?.standings?.entries
          )
        ) {

          entries.push(
            ...child.standings.entries
          );

        }

      }

    }


    if (
      !entries.length &&
      Array.isArray(
        data?.standings?.entries
      )
    ) {

      entries =
        data.standings.entries;

    }


    conteudo.innerHTML = "";


    if (!entries.length) {

      conteudo.innerHTML = `
        <div class="vazio">
          A classificação desta competição
          não está disponível neste momento.
        </div>
      `;

      return;
    }


    const tabela =
      document.createElement("div");

    tabela.className =
      "tabela";


    tabela.innerHTML = `
      <div class="tabela-header">
        <span>#</span>
        <span>Equipa</span>
        <span>J</span>
        <span>V</span>
        <span>E</span>
        <span>D</span>
        <span>PTS</span>
      </div>
    `;


    entries.forEach(
      (entry, index) => {

        const equipa =
          entry.team || {};

        const stats =
          {};

        (
          entry.stats || []
        ).forEach(s => {

          stats[s.name] =
            s.value ??
            s.displayValue ??
            0;

        });


        const id =
          equipa.id || "";


        const linha =
          document.createElement("div");

        linha.className =
          "tabela-row";


        if (id) {

          linha.onclick = () => {

            FZ_abrirEquipa(
              id,
              equipa.displayName ||
              equipa.name ||
              "Equipa"
            );

          };

        }


        linha.innerHTML = `
          <span>${index + 1}</span>

          <span class="tabela-equipa">

            ${
              equipa.logo
                ? `<img src="${equipa.logo}"
                        class="equipaLogo"
                        loading="lazy">`
                : ""
            }

            ${
              equipa.displayName ||
              equipa.name ||
              "Equipa"
            }

          </span>

          <span>${stats.gamesPlayed ?? "-"}</span>
          <span>${stats.wins ?? "-"}</span>
          <span>${stats.ties ?? "-"}</span>
          <span>${stats.losses ?? "-"}</span>
          <strong>${stats.points ?? "-"}</strong>
        `;


        tabela.appendChild(
          linha
        );

      }
    );


    conteudo.appendChild(
      tabela
    );


    FZ_estado(
      "Classificação atualizada às " +
      new Date().toLocaleTimeString(
        "pt-PT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    );


  } catch (erro) {

    console.error(
      "FUTZONE tabela:",
      erro
    );

    conteudo.innerHTML = `
      <div class="vazio">
        Não foi possível carregar
        a classificação desta competição.
      </div>
    `;

  }
}


/* =========================================================
   MODOS
   ========================================================= */

async function FZ_mudarModo(modo) {

  FZ_modo = modo;


  document
    .querySelectorAll(".top-btn")
    .forEach(botao => {

      botao.classList.remove(
        "active"
      );

    });


  const botao =
    document.querySelector(
      `[data-modo="${modo}"]`
    );

  if (botao) {

    botao.classList.add(
      "active"
    );

  }


  if (modo === "live") {

    await FZ_aoVivo();

  }

  else if (modo === "jornadas") {

    await FZ_jornadas();

  }

  else if (modo === "tabelas") {

    await FZ_tabelas();

  }

  else {

    await FZ_jogosDoDia();

  }
}


/* =========================================================
   ATUALIZAÇÃO FORÇADA
   ========================================================= */

async function FZ_atualizarAgora() {

  if (FZ_atualizando) return;

  FZ_atualizando = true;

  try {

    if (FZ_modo === "live") {

      await FZ_aoVivo();

    }

    else if (FZ_modo === "jornadas") {

      await FZ_jornadas();

    }

    else if (FZ_modo === "tabelas") {

      await FZ_tabelas();

    }

    else {

      await FZ_jogosDoDia();

    }

  } finally {

    FZ_atualizando = false;

  }
}

    const botao =

  }
);

function FZ_criarBotaoAtualizar() {

  if (
    document.getElementById(

    )

  const botao =
    document.createElement(
      "button"
    );

  botao.id =

  botao.textContent =

  };


  document.body.appendChild(
    botao
  );
}


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
   ========================================================= */

function FZ_iniciarAtualizacaoAutomatica() {

  if (FZ_atualizacaoJogos) {

    clearInterval(
      FZ_atualizacaoJogos
    );

  }

  if (FZ_atualizacaoLive) {

    clearInterval(
      FZ_atualizacaoLive
    );

  }


  /*
    Jogos/resultados:
    atualiza a cada 2 minutos.
  */

  FZ_atualizacaoJogos =
    setInterval(
      () => {

        if (
          FZ_modo !== "live"
        ) {

          FZ_atualizarAgora();

        }

      },
      120000
    );


  /*
    AO VIVO:
    atualiza a cada 30 segundos.
  */

  FZ_atualizacaoLive =
    setInterval(
      () => {

        if (
          FZ_modo === "live"
        ) {

          FZ_atualizarAgora();

        }

      },
      30000
    );
}


/* =========================================================
   VOLTAR A ATUALIZAR QUANDO A APP VOLTA AO PRIMEIRO PLANO
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden
    ) {

      FZ_atualizarAgora();

    }

  }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

function FZ_iniciar() {

  FZ_renderizarCompeticoes();

  FZ_criarBotaoAtualizar();

async function FZ_equipaJogos(
  id,
  nome
){

  const area =
    FZ("fz-equipa-conteudo");


  if(!area)
    return;


  area.innerHTML = `

    <div class="carregar">
      A carregar calendário...
    </div>

  `;


  try{

    /*
      Endpoint específico da equipa.
    */

    const data =
      await FZ_fetch(

        FZ_API +
        FZ_ligaSelecionada +
        "/teams/" +
        encodeURIComponent(id) +
        "/schedule?limit=100"

      );


    const jogos =
      data.events ||
      data.schedule ||
      [];


    if(!jogos.length){

      area.innerHTML = `

        <div class="vazio">

          Não existem jogos fornecidos
          para esta equipa.

        </div>

      `;

      return;

    }


    const ordenados =
      [...jogos].sort(
        (a,b) =>
          new Date(a.date) -
          new Date(b.date)
      );


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          📅 Calendário

        </div>

        ${
          ordenados
            .map(
              jogo =>
                FZ_cartaoJogo(
                  jogo,
                  FZ_nomeLiga(
                    FZ_ligaSelecionada
                  )
                )
            )
            .join("")
        }

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    area.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        o calendário desta equipa.

      </div>

    `;

  }

}

    dados.displayName ||
    dados.fullName ||
    dados.shortName ||
    "Jogador";


  const foto =
    dados.headshot?.href ||
    dados.photo ||

  const posicao =
    dados.position?.displayName ||
    dados.position?.abbreviation ||
    "";


  return `

    <div

      onclick="FZ_abrirJogador('${id}','${nome.replace(/'/g,"")}','${equipaId}')">

}

async function FZ_abrirJogador(
  id,
  nome,
  equipaId
){

  FZ_EXTRA.jogadorAtual = {
    id,
    nome,
    equipaId
  };


  FZ_conteudo.innerHTML = `

    <div class="carregar">

      A carregar carreira do jogador...

    </div>

  `;


  /*

    individual real.
  */

  try{

    const data =
      await FZ_fetch(

        "https://sports.core.api.espn.com/v2/sports/soccer/athletes/" +
        encodeURIComponent(id) +
        "?lang=en&region=us"

      );


    const jogador =
      data;

    FZ_renderizarJogador(

  }

  catch(erro){

    console.error(erro);

      id,

/* ---------------------------------------------------------
   CLASSIFICAÇÃO DA EQUIPA
--------------------------------------------------------- */

async function FZ_equipaTabela(){

  const area =
    FZ("fz-equipa-conteudo");


  if(!area)
    return;


  area.innerHTML = `

    <div class="carregar">
      A carregar classificação...
    </div>

  `;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      area.innerHTML = `

        <div class="vazio">

          Classificação não disponível.

        </div>

      `;

      return;

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const nome =
            entrada.team?.displayName ||
            entrada.team?.name ||
            "Equipa";


          const pts =
            (
              entrada.stats || []
            ).find(
              s =>
                s.name === "points" ||
                s.abbreviation === "PTS"
            );


          return `

            <div class="fz-historico">

              <div class="fz-historico-data">

                ${index + 1}º

              </div>

              <div class="fz-historico-nome">

                ${nome}

                ${
                  pts
                  ? " · " +
                    (
                      pts.displayValue ??
                      pts.value
                    ) +
                    " pts"
                  : ""
                }

              </div>

            </div>

          `;

        }
      ).join("");


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          🏆 Classificação

        </div>

        ${linhas}

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    area.innerHTML = `

      <div class="vazio erro">

        Não foi possível carregar
        a classificação.

      </div>

    `;

  }

}

async function FZ_abrirJogo(

    info.fora?.team?.displayName

  let resultado =
    "-";


  if(

    estado === "post"

      (info.fora?.score ?? "-");

  FZ_conteudo.innerHTML = `

            ${casa}

          </div>

            ${resultado}

          </div>

          <div class="fz-detalhe-equipa">

            ${fora}

          </div>

        </div>


        <div class="fz-detalhe-status">

          ${
            estado === "in"
            ? "🔴 AO VIVO"
            : estado === "post"
            ? "FINAL"
            : FZ_hora(info.data)
          }

        </div>

      </div>


      <div class="fz-section">

        <div class="fz-section-title">

          📊 Estatísticas

        </div>

        <div class="vazio">

          As estatísticas individuais

--------------------------------------------------------- */

const FZ_tabelasOriginal =
  FZ_tabelas;


/*
  Mantemos a função principal e acrescentamos
  identificação dos clubes quando o ESPN fornece ID.
*/

FZ_tabelas = async function(){

  FZ_estado.textContent =
    "A carregar classificação real...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A carregar classificação...
    </div>`;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      FZ_conteudo.innerHTML =
        `<div class="vazio">
          Classificação não disponível.
        </div>`;

      return;

    }


    function stat(
      entrada,
      nomes
    ){

      const encontrado =
        (
          entrada.stats ||
          []
        ).find(
          s =>
            nomes.includes(s.name) ||
            nomes.includes(s.abbreviation)
        );


      return encontrado
        ? (
            encontrado.displayValue ??
            encontrado.value ??
            "-"
          )
        : "-";

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const equipa =
            entrada.team ||
            {};


          const id =
            equipa.id ||
            "";


          const nome =
            equipa.displayName ||
            equipa.name ||
            "Equipa";


          return `

            <tr>

              <td class="posicao">

                ${index + 1}

              </td>

              <td
                class="fz-clickable"
                onclick="FZ_abrirEquipa('${id}','${nome.replace(/'/g,"")}')">

                <strong>

                  ${nome}

                </strong>

              </td>

              <td>
                ${stat(
                  entrada,
                  ["gamesPlayed","GP"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["wins","W"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["ties","draws","D"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["losses","L"]
                )}
              </td>

              <td>
                <strong>
                  ${stat(
                    entrada,
                    ["points","PTS"]
                  )}
                </strong>
              </td>

            </tr>

          `;

        }
      ).join("");


    FZ_conteudo.innerHTML = `

      <div class="seccao-titulo">

        🏆 ${FZ_nomeLiga(
          FZ_ligaSelecionada
        )}

      </div>

      <div class="tabela-wrap">

        <table class="tabela">

          <thead>

            <tr>

              <th>#</th>
              <th>Equipa</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>Pts</th>

            </tr>

          </thead>

          <tbody>

            ${linhas}

          </tbody>

        </table>

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        a classificação.

      </div>

    `;

  }

};
