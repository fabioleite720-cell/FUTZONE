<!DOCTYPE html>
<html lang="pt-PT">
<head>

<title>FUTZONE</title>

*{box-sizing:border-box}

body{

.filters button.active{

.card{

.league{

.teams{

.team{

.team:last-child{text-align:right}

.team:hover{color:#168cff}

.team-logo{

 vertical-align:middle;
 margin-right:7px
}

.score{

.status{

.nav{

 align-items:center;
 z-index:30
}

.nav button{
 background:none;
 color:#aaa;
 padding:8px
}

.nav button.active{color:#168cff}

.back{
 margin-bottom:15px;
 background:#202020
}

.plantel-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.player{
 background:#151515;
 border:1px solid #292929;
 border-radius:14px;
 padding:12px;
 text-align:center;
 cursor:pointer
}

.player:hover{
 border-color:#168cff;
 transform:translateY(-2px)
}

.player img{
 width:80px;
 height:80px;
 object-fit:cover;
 border-radius:50%;
 background:#222;
 margin-bottom:8px
}

.player-name{
 font-weight:bold;
 font-size:14px
}

.player-info{
 color:#999;
 font-size:12px;
 margin-top:5px
}

.player-profile{
 text-align:center;
 padding:10px
}
