<style>
*{box-sizing:border-box}body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#071326;border-bottom:1px solid #17243a;padding:14px 12px}.logo{font-size:25px;font-weight:900}.logo span{color:#7ed957}

.seletor-ligas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}.liga-btn{background:#0b1627;border:1px solid #17243a;border-radius:12px;padding:12px 7px;color:#fff;text-align:center;font-size:13px;font-weight:bold}.liga-btn.active{background:#0d1b30;border-color:#3c6da8}.liga-icon{font-size:22px;display:block;margin-bottom:5px}
.jogo{background:#0b1627;border:1px solid #17243a;border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}.jogo-top{display:flex;justify-content:space-between;color:#9ca9bb;font-size:11px;margin-bottom:9px}.equipas{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:5px}.equipa{text-align:center;font-size:13px;font-weight:bold}.escudo{width:32px;height:32px;object-fit:contain;display:block;margin:0 auto 5px}.resultado{text-align:center;font-size:19px;font-weight:900}.vazio{background:#0b1627;border:1px solid #17243a;border-radius:12px;padding:20px;text-align:center;color:#9ca9bb}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#071326;border-top:1px solid #17243a;display:flex;z-index:30}.bottom button{background:none;border:0;color:#9ca9bb;font-weight:bold;width:33%;font-size:12px}.bottom button.active{color:#7ed957}
.overlay{position:fixed;inset:0;background:#050b16;z-index:50;overflow:auto}.detalhe-header{position:sticky;top:0;background:#071326;border-bottom:1px solid #17243a;padding:12px;z-index:5}.voltar{background:#0b1627;border:1px solid #243653;color:#fff;border-radius:8px;padding:8px 12px;font-weight:bold}.detalhe{max-width:700px;margin:auto;padding:10px 10px 35px}
.jogo-grande{background:#0b1627;border:1px solid #17243a;border-radius:14px;padding:18px 10px;margin-bottom:12px}.jogo-grande .equipas{grid-template-columns:1fr 80px 1fr}.jogo-grande .escudo{width:55px;height:55px}.jogo-grande .equipa{font-size:15px}.bigscore{text-align:center;font-size:30px;font-weight:900}.estado{text-align:center;color:#7ed957;font-size:12px;margin-top:5px}
.secao{background:#0b1627;border:1px solid #17243a;border-radius:13px;margin:10px 0;padding:12px}.secao h3{font-size:15px;margin:0 0 10px}.evento{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #17243a;font-size:13px}.evento:last-child{border-bottom:0}.minuto{color:#7ed957;font-weight:bold;min-width:38px}
.stats-head,.stat-row{display:grid;grid-template-columns:1fr 90px 1fr;text-align:center}.stats-head{font-size:12px;margin-bottom:7px}.stat-row{align-items:center;border-top:1px solid #17243a;padding:9px 0;font-size:12px}.stat-row .nome{font-size:11px;color:#9ca9bb}.stat-home{text-align:right;font-weight:bold}.stat-away{text-align:left;font-weight:bold}
.carregando{text-align:center;color:#9ca9bb;padding:20px}.erro{color:#ff8f8f;text-align:center;padding:15px}.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:7px}.jogador{background:#071326;border:1px solid #17243a;border-radius:8px;padding:9px;font-size:12px}.jogador b{color:#7ed957;margin-right:5px}.subtitulo{color:#9ca9bb;font-size:11px;margin:8px 0}

/* FUTSAL — apenas funcionalidade adicional, sem alterar o design existente */
.seletor-desporto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.desporto-btn{background:#0b1627;border:1px solid #17243a;border-radius:10px;padding:10px;color:#fff;font-weight:900}.desporto-btn.active{background:#0d1b30;border-color:#3c6da8}.futsal-filtros{display:flex;gap:7px;margin:8px 0 12px}.futsal-filtros button{flex:1;background:#0b1627;border:1px solid #17243a;color:#9ca9bb;border-radius:8px;padding:8px;font-size:11px;font-weight:bold}.futsal-filtros button.active{color:#fff;border-color:#3c6da8;background:#0d1b30}.equipa-link{cursor:pointer;text-decoration:underline;text-decoration-color:#3c6da8;text-underline-offset:3px}.quadra{background:#071326;border:1px solid #243653;border-radius:14px;padding:10px;margin-top:10px}.quadra-area{position:relative;height:330px;border:3px solid #fff;border-radius:12px;background:linear-gradient(90deg,#0d1b30,#10253d,#0d1b30);overflow:hidden}.quadra-area:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-50%)}.quadra-area:after{content:"";position:absolute;left:50%;top:50%;width:72px;height:72px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}.jogador-campo{position:absolute;transform:translate(-50%,-50%);width:58px;text-align:center;font-size:9px;font-weight:bold;z-index:2}.jogador-campo .bola{width:30px;height:30px;border-radius:50%;margin:auto;background:#0b1627;border:2px solid #fff;display:flex;align-items:center;justify-content:center}.tatico{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tatico .secao{margin:0}.tatico h4{margin:0 0 8px;font-size:12px;color:#9ca9bb}.tatico-formacao{font-size:22px;font-weight:900}.classificacao{width:100%;border-collapse:collapse;font-size:11px}.classificacao th,.classificacao td{padding:8px 4px;border-bottom:1px solid #17243a;text-align:center}.classificacao th:first-child,.classificacao td:first-child{text-align:left}.classificacao tr.clicavel{cursor:pointer}.futsal-badge{font-size:11px;color:#9ca9bb;margin-left:5px}
</style>

<body>
<header><div class="logo">FUT<span>ZONE</span></div></header>
<main id="app"></main>
<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>
<script>
const ligas=[
{nome:"Portugal",arquivo:"data/primeira-liga.json",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",arquivo:"data/premier-league.json",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",arquivo:"data/la-liga.json",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",arquivo:"data/serie-a.json",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",arquivo:"data/bundesliga.json",codigo:"ger.1",icone:"🇩🇪"},
{nome:"Champions League",arquivo:"data/champions-league.json",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",arquivo:"data/liga-europa.json",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",arquivo:"data/liga-conferencia.json",codigo:"uefa.europa.conf",icone:"🏆"}];
let jogos=[],ligaSelecionada="Portugal",favoritos=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function logo(u){return u?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`:`<div style='height:37px'></div>`}
function comp(j){return j?.competitions?.[0]||{}}
function nome(c){return c?.team?.displayName||c?.team?.shortDisplayName||c?.team?.name||c?.displayName||"Equipa"}
function jogo(j,l){
 let c=comp(j),cs=c.competitors||[],h=cs.find(x=>x.homeAway==="home")||cs[0]||{},a=cs.find(x=>x.homeAway==="away")||cs[1]||{},st=c?.status||j?.status||{};
 let estado=st?.type?.state==="post"?"FINAL":st?.type?.state==="in"?(st?.displayClock||"DIRETO"):st?.type?.name==="STATUS_POSTPONED"?"ADIADO":st?.type?.name==="STATUS_CANCELED"?"CANCELADO":(st?.type?.shortDetail||st?.type?.detail||st?.type?.description||"");
 return{id:String(j.id),codigo:l.codigo,liga:l.nome,data:j.date||c?.date||"",home:{nome:nome(h),logo:h?.team?.logo||"",score:h?.score??"-"},away:{nome:nome(a),logo:a?.team?.logo||"",score:a?.score??"-"},estado};
}
function dataESPN(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}
function estadoPost(j){return j.estado==="FINAL"}
function ordenarJogos(a,b){const ao=a.estado==="DIRETO",bo=b.estado==="DIRETO";if(ao!==bo)return ao?-1:1;const ap=estadoPost(a),bp=estadoPost(b);if(ap!==bp)return ap?1:-1;const da=new Date(a.data||0).getTime(),db=new Date(b.data||0).getTime();return ap&&bp?db-da:da-db}
function dataHoraJogo(j){if(!j.data)return "";const d=new Date(j.data);if(isNaN(d))return "";return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})+" · "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}
async function carregarJogos(){
 jogos=[];
 const hoje=new Date(),inicio=new Date(hoje),fim=new Date(hoje);
 inicio.setDate(inicio.getDate()-30);fim.setDate(fim.getDate()+14);
 for(const l of ligas)try{
  const url="https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(l.codigo)+"/scoreboard?limit=300&dates="+dataESPN(inicio)+"-"+dataESPN(fim)+"&_="+Date.now();
  const r=await fetch(url);
  if(r.ok){const d=await r.json();(d.events||[]).forEach(j=>jogos.push(jogo(j,l)))}
 }catch(e){}
 const mapa=new Map();jogos.forEach(j=>mapa.set(j.id,j));jogos=[...mapa.values()].sort(ordenarJogos);
 mostrarJogos();
}
function botoes(){return`<div class="seletor-ligas">${ligas.map(l=>`<button class="liga-btn ${ligaSelecionada===l.nome?"active":""}" onclick="selecionarLiga('${l.nome}')"><span class="liga-icon">${l.icone}</span>${esc(l.nome)}</button>`).join("")}</div>`}
function selecionarLiga(n){ligaSelecionada=n;mostrarJogos();scrollTo(0,0)}
function cartao(j){return`<div class="jogo" onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')"><div class="jogo-top"><span>${esc(j.liga)}${j.data?` · ${esc(dataHoraJogo(j))}`:""}</span><span>${esc(j.estado)}</span></div><div class="equipas"><div class="equipa">${logo(j.home.logo)}${esc(j.home.nome)}</div><div class="resultado">${esc(j.home.score)} - ${esc(j.away.score)}</div><div class="equipa">${logo(j.away.logo)}${esc(j.away.nome)}</div></div></div>`}
function mostrarJogos(){nav("navJogos");let l=jogos.filter(j=>j.liga===ligaSelecionada);app.innerHTML=`<h2>Ligas</h2>${botoes()}<h2>${esc(ligaSelecionada)}</h2>${l.length?l.map(cartao).join(""):`<div class="vazio">Não há jogos disponíveis.</div>`}`}
function nav(id){["navJogos","navTabelas","navFav"].forEach(x=>document.getElementById(x).classList.toggle("active",x===id))}
function txt(v){return typeof v==="object"?(v?.displayValue??v?.value??v?.text??""):String(v??"")}
function extrairEventos(d){let out=[],seen=new Set(),src=[...(d.plays||[]),...(d.keyEvents||[]),...(d.scoringPlays||[])];for(let e of src){let s=((e?.type?.text||"")+" "+(e?.text||e?.shortText||e?.description||"")).toLowerCase(),t=e?.text||e?.shortText||e?.description||e?.type?.text||"Evento";if(!/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(s))continue;let k=JSON.stringify([e?.id,e?.clock?.displayValue,t]);if(seen.has(k))continue;seen.add(k);let i=/yellow|amarelo/.test(s)?"🟨":/red|vermelho/.test(s)?"🟥":/substitut/.test(s)?"🔄":"⚽";out.push({m:e?.clock?.displayValue||e?.period?.displayValue||"",t,i})}return out}
function extrairStats(d){let grupos=[];function add(team,ss){if(!team||!Array.isArray(ss))return;let id=team?.id||team?.team?.id||team?.displayName||team?.team?.displayName,g=grupos.find(x=>String(x.id)===String(id));if(!g){g={id,nome:team?.displayName||team?.name||team?.team?.displayName||team?.team?.name||"Equipa",s:[]};grupos.push(g)}ss.forEach(x=>{let n=x?.displayName||x?.shortDisplayName||x?.name||x?.label||x?.description;if(n)g.s.push({n,v:txt(x?.displayValue??x?.value??x?.display)})})}(d.boxscore?.teams||[]).forEach(t=>add(t.team||t,t.statistics||t.stats));(d.header?.competitions?.[0]?.competitors||d.competitions?.[0]?.competitors||[]).forEach(c=>add(c.team||c,c.statistics));(d.competitors||[]).forEach(c=>add(c.team||c,c.statistics));if(grupos.length<2)return[];let m=new Map();grupos.forEach(g=>g.s.forEach(x=>{let k=x.n.toLowerCase();if(!m.has(k))m.set(k,{n:x.n,h:"-",a:"-"});let r=m.get(k);if(r.h==="-")r.h=x.v;else if(r.a==="-")r.a=x.v}));return[...m.values()]}
function extrairPlantel(d){let gs=[];function add(team,arr){if(!team||!Array.isArray(arr))return;let id=team?.id||team?.team?.id||team?.displayName,g=gs.find(x=>String(x.id)===String(id));if(!g){g={id,nome:team?.displayName||team?.name||team?.team?.displayName||"Equipa",p:[]};gs.push(g)}arr.forEach(x=>{let a=x?.athlete||x?.player||x;if(!a?.displayName&&!a?.fullName)return;let n=a.displayName||a.fullName||a.shortName;if(g.p.some(q=>q.n===n))return;g.p.push({n,num:a.jersey||x.jersey||a.uniformNumber||"",pos:a?.position?.abbreviation||a?.position?.displayName||x?.position?.displayName||"",tit:x.starter===true||x.starter==="true"})})}(d.rosters||[]).forEach(r=>add(r.team||r,r.roster||r.athletes||r.players));(d.boxscore?.players||[]).forEach(g=>add(g.team||g,g.statistics||g.athletes||g.roster||g.players));(d.header?.competitions?.[0]?.competitors||[]).forEach(c=>add(c.team||c,c.roster||c.athletes||c.players));return gs.filter(g=>g.p.length)}
function blocoEventos(a){return`<div class="secao"><h3>⚽ Golos e eventos</h3>${a.length?a.map(e=>`<div class="evento"><span class="minuto">${esc(e.m)}</span><span>${e.i} ${esc(e.t)}</span></div>`).join(""):`<div class="vazio">Não há golos ou eventos disponíveis.</div>`}</div>`}
function blocoStats(a){return`<div class="secao"><h3>📊 Estatísticas do jogo</h3>${a.length?`<div class="stats-head"><span>Casa</span><span>ESTAT.</span><span>Fora</span></div>${a.map(x=>`<div class="stat-row"><div class="stat-home">${esc(x.h)}</div><div class="nome">${esc(x.n)}</div><div class="stat-away">${esc(x.a)}</div></div>`).join("")}`:`<div class="vazio">Estatísticas não disponíveis para este jogo.</div>`}</div>`}
function blocoPlantel(gs){if(!gs.length)return"";return`<div class="secao"><h3>👥 Equipas</h3>${gs.map(g=>`<div style="margin-bottom:15px"><b>${esc(g.nome)}</b><div class="subtitulo">${g.p.some(x=>x.tit)?"Titulares":"Jogadores disponíveis"}</div><div class="lista-jogadores">${g.p.map(p=>`<div class="jogador"><b>${esc(p.num)}</b>${esc(p.n)}${p.pos?`<small style="display:block;color:#9ca9bb">${esc(p.pos)}</small>`:""}</div>`).join("")}</div></div>`).join("")}</div>`}
async function abrirDetalhe(id,codigo){let j=jogos.find(x=>x.id===id),o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="detalhe-header"><button class="voltar" onclick="this.closest('.overlay').remove()">← Voltar</button></div><div class="detalhe"><div class="jogo-grande"><div class="equipas"><div class="equipa">${logo(j.home.logo)}${esc(j.home.nome)}</div><div><div class="bigscore">${esc(j.home.score)} - ${esc(j.away.score)}</div><div class="estado">${esc(j.estado)}</div></div><div class="equipa">${logo(j.away.logo)}${esc(j.away.nome)}</div></div></div><div class="carregando">A carregar golos e estatísticas...</div></div>`;document.body.appendChild(o);try{let r=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(codigo)+"/summary?event="+encodeURIComponent(id)+"&_="+Date.now());if(!r.ok)throw 0;let d=await r.json();o.querySelector(".detalhe").insertAdjacentHTML("beforeend",blocoEventos(extrairEventos(d))+blocoStats(extrairStats(d))+blocoPlantel(extrairPlantel(d)));o.querySelector(".carregando").remove()}catch(e){o.querySelector(".carregando").outerHTML=`<div class="erro">Não foi possível carregar os dados deste jogo.</div>`}}
function mostrarFavoritos(){nav("navFav");let l=jogos.filter(j=>favoritos.includes(j.id));app.innerHTML=`<h2>⭐ Favoritos</h2>${l.length?l.map(cartao).join(""):`<div class="vazio">Ainda não tens jogos favoritos.</div>`}`}
async function mostrarTabelas(){nav("navTabelas");app.innerHTML=`<h2>🏆 Tabelas</h2>${botoes()}<div class="carregando">A carregar...</div>`}
carregarJogos();setInterval(carregarJogos,60000);
</script>
<script>
/* FUTSAL: dados reais via SofaScore; o restante do FUTZONE permanece intacto. */
const SOFA="https://api.sofascore.com/api/v1";
let desportoAtual=localStorage.getItem("futzone_desporto")||"futebol";
let futsalDados={tid:null,sid:null,nome:"Liga Placard",jogos:[],tabela:[]};
let futsalFiltro="todos";
async function sofa(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(String(r.status));return r.json()}
function botaoDesporto(){return `<div class="seletor-desporto"><button class="desporto-btn ${desportoAtual==="futebol"?"active":""}" onclick="mudarDesporto('futebol')">⚽ Futebol</button><button class="desporto-btn ${desportoAtual==="futsal"?"active":""}" onclick="mudarDesporto('futsal')">🥅 Futsal</button></div>`}
function mudarDesporto(x){desportoAtual=x;localStorage.setItem("futzone_desporto",x);mostrarJogos();scrollTo(0,0)}
function nS(t){return t?.shortName||t?.name||"Equipa"}
function lS(id){return id?`<img class="escudo" src="https://api.sofascore.com/api/v1/team/${Number(id)}/image" onerror="this.style.visibility='hidden'">`:`<div style='height:37px'></div>`}
function dS(ts){if(!ts)return "";const d=new Date(ts*1000);return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})+" · "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}
function eS(e){const t=e?.status?.type||"";if(t==="inprogress")return"DIRETO";if(t==="finished")return"FINAL";if(t==="canceled")return"CANCELADO";if(t==="postponed")return"ADIADO";return e?.status?.description||""}
function sS(e){return{h:e?.homeScore?.current??e?.homeScore?.normaltime??"-",a:e?.awayScore?.current??e?.awayScore?.normaltime??"-"}}
function nf(e){const s=sS(e);return{id:String(e.id),data:e.startTimestamp||0,round:e.roundInfo?.round??e.roundInfo?.name??"",home:{id:e.homeTeam?.id,nome:nS(e.homeTeam)},away:{id:e.awayTeam?.id,nome:nS(e.awayTeam)},hs:s.h,as:s.a,estado:eS(e),raw:e}}
async function descobrirLP(){if(futsalDados.tid&&futsalDados.sid)return futsalDados;const base=new Date(),dates=[];for(let i=-21;i<=21;i++){const d=new Date(base);d.setDate(d.getDate()+i);dates.push(d.toISOString().slice(0,10))}const rs=await Promise.allSettled(dates.map(x=>sofa(`${SOFA}/sport/futsal/scheduled-events/${x}`)));for(const r of rs){if(r.status!=="fulfilled")continue;for(const e of r.value.events||[]){const n=(e.tournament?.name||e.uniqueTournament?.name||"").toLowerCase();if(n.includes("liga placard")&&!n.includes("feminina")){futsalDados.tid=e.uniqueTournament?.id||e.tournament?.uniqueTournament?.id||e.tournament?.id;futsalDados.sid=e.season?.id;futsalDados.nome=e.tournament?.name||e.uniqueTournament?.name||"Liga Placard";if(futsalDados.tid&&futsalDados.sid)return futsalDados}}}throw new Error("Liga Placard não encontrada")}
async function eventosLP(tipo){let a=[];for(let p=0;p<8;p++){try{const d=await sofa(`${SOFA}/unique-tournament/${futsalDados.tid}/season/${futsalDados.sid}/events/${tipo}/${p}`);a.push(...(d.events||[]));if(!d.hasNextPage)break}catch(e){break}}return a}
async function carregarFutsal(){app.innerHTML=botaoDesporto()+`<h2>🥅 Liga Placard</h2><div class="carregando">A carregar jogos, resultados e jornadas...</div>`;try{await descobrirLP();const [a,b]=await Promise.all([eventosLP("last"),eventosLP("next")]);const m=new Map();[...a,...b].forEach(e=>m.set(String(e.id),e));futsalDados.jogos=[...m.values()].map(nf).sort((x,y)=>x.data-y.data);mostrarFutsal()}catch(e){app.innerHTML=botaoDesporto()+`<h2>🥅 Futsal</h2><div class="erro">Não foi possível carregar a Liga Placard agora. Tenta novamente.</div>`}}
function fBtns(){return`<div class="futsal-filtros">${[["todos","Todos"],["live","Ao Vivo"],["up","Próximos"],["past","Resultados"]].map(x=>`<button class="${futsalFiltro===x[0]?"active":""}" onclick="filtroFutsal('${x[0]}')">${x[1]}</button>`).join("")}</div>`}
function filtroFutsal(x){futsalFiltro=x;mostrarFutsal()}
function mostrarFutsal(){nav("navJogos");let a=futsalDados.jogos.filter(j=>futsalFiltro==="todos"||(futsalFiltro==="live"&&j.estado==="DIRETO")||(futsalFiltro==="up"&&j.estado!=="FINAL"&&j.estado!=="DIRETO")||(futsalFiltro==="past"&&j.estado==="FINAL"));a.sort((x,y)=>{if(x.estado==="DIRETO"&&y.estado!=="DIRETO")return-1;if(y.estado==="DIRETO"&&x.estado!=="DIRETO")return 1;if(x.estado==="FINAL"&&y.estado!=="FINAL")return 1;if(y.estado==="FINAL"&&x.estado!=="FINAL")return-1;return x.data-y.data});let h=botaoDesporto()+`<h2>🥅 Liga Placard <span class="futsal-badge">${esc(futsalDados.nome)}</span></h2>${fBtns()}`;if(!a.length)h+=`<div class="vazio">Não há jogos nesta categoria.</div>`;let rr="";for(const j of a){if(j.round!==rr){h+=`<h3 style="margin:15px 3px 8px">Jornada ${esc(j.round||"—")}</h3>`;rr=j.round}h+=cartaoF(j)}app.innerHTML=h}
function cartaoF(j){return`<div class="jogo" onclick="abrirDetalheFutsal('${esc(j.id)}')"><div class="jogo-top"><span>Jornada ${esc(j.round||"—")} · ${esc(dS(j.data))}</span><span>${esc(j.estado)}</span></div><div class="equipas"><div class="equipa"><div class="equipa-link" onclick="event.stopPropagation();abrirEquipaFutsal(${Number(j.home.id)})">${lS(j.home.id)}${esc(j.home.nome)}</div></div><div class="resultado">${esc(j.hs)} - ${esc(j.as)}</div><div class="equipa"><div class="equipa-link" onclick="event.stopPropagation();abrirEquipaFutsal(${Number(j.away.id)})">${lS(j.away.id)}${esc(j.away.nome)}</div></div></div></div>`}
async function abrirDetalheFutsal(id){const j=futsalDados.jogos.find(x=>x.id===String(id));if(!j)return;const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="detalhe-header"><button class="voltar" onclick="this.closest('.overlay').remove()">← Voltar</button></div><div class="detalhe"><div class="jogo-grande"><div class="equipas"><div class="equipa"><div class="equipa-link" onclick="abrirEquipaFutsal(${Number(j.home.id)})">${lS(j.home.id)}${esc(j.home.nome)}</div></div><div><div class="bigscore">${esc(j.hs)} - ${esc(j.as)}</div><div class="estado">${esc(j.estado)}</div></div><div class="equipa"><div class="equipa-link" onclick="abrirEquipaFutsal(${Number(j.away.id)})">${lS(j.away.id)}${esc(j.away.nome)}</div></div></div></div><div class="carregando">A carregar detalhes, quadra e tática...</div></div>`;document.body.appendChild(o);try{const [i,s,l]=await Promise.allSettled([sofa(`${SOFA}/event/${id}/incidents`),sofa(`${SOFA}/event/${id}/statistics`),sofa(`${SOFA}/event/${id}/lineups`)]);const d=o.querySelector(".detalhe");if(i.status==='fulfilled')d.insertAdjacentHTML('beforeend',incF(i.value));if(s.status==='fulfilled')d.insertAdjacentHTML('beforeend',statF(s.value));if(l.status==='fulfilled'){d.insertAdjacentHTML('beforeend',quadF(l.value));d.insertAdjacentHTML('beforeend',tacF(l.value))}o.querySelector('.carregando')?.remove()}catch(e){o.querySelector('.carregando').outerHTML='<div class="erro">Não foi possível carregar os detalhes.</div>'}}
function incF(d){const a=(d.incidents||[]).filter(x=>["goal","card","substitution"].includes(x.incidentType));return`<div class="secao"><h3>⚽ Golos e eventos</h3>${a.length?a.map(x=>`<div class="evento"><span class="minuto">${esc(x.time?x.time+"'":"")}</span><span>${x.incidentType==='goal'?'⚽':x.incidentClass==='yellow'?'🟨':x.incidentClass==='red'?'🟥':'🔄'} ${esc(x.player?.name||x.playerName||'Evento')}</span></div>`).join(''):'<div class="vazio">Não há eventos registados.</div>'}</div>`}
function statF(d){let a=[];for(const p of d.statistics||[])for(const g of p.groups||[])for(const x of g.statisticsItems||[])if(x.name)a.push({n:x.name,h:x.home??'-',a:x.away??'-'});a=[...new Map(a.map(x=>[x.n,x])).values()];return`<div class="secao"><h3>📊 Estatísticas</h3>${a.length?`<div class="stats-head"><span>Casa</span><span>ESTAT.</span><span>Fora</span></div>${a.map(x=>`<div class="stat-row"><div class="stat-home">${esc(x.h)}</div><div class="nome">${esc(x.n)}</div><div class="stat-away">${esc(x.a)}</div></div>`).join('')}`:'<div class="vazio">Estatísticas não disponíveis.</div>'}</div>`}
function cinco(side){return(side?.players||[]).filter(x=>x.substitute===false||x.starter===true).slice(0,5)}
function posF(p,i,side){const x=p?.position?.x??p?.position?.xCoordinate,y=p?.position?.y??p?.position?.yCoordinate;if(Number.isFinite(Number(x))&&Number.isFinite(Number(y)))return{x:Math.max(8,Math.min(92,Number(x))),y:Math.max(8,Math.min(92,Number(y)))};const q=i===0?{x:50,y:88}:i===1?{x:25,y:68}:i===2?{x:50,y:58}:i===3?{x:75,y:68}:{x:50,y:38};return side==='home'?q:{x:100-q.x,y:100-q.y}}
function jogadoresF(side,tag){return cinco(side).map((x,i)=>{const p=x.player||x.athlete||{},q=posF(p,i,tag);return`<div class="jogador-campo" style="left:${q.x}%;top:${q.y}%"><div class="bola">${esc(x.shirtNumber??p.jerseyNumber??'')}</div><div>${esc(p.shortName||p.name||'')}</div></div>`}).join('')}
function quadF(d){return`<div class="secao"><h3>🥅 Quadra · 5 inicial</h3><div class="quadra"><div class="quadra-area">${jogadoresF(d.home,'home')}${jogadoresF(d.away,'away')}</div></div><div class="subtitulo">A posição vem da escalação quando disponível; caso contrário é apresentada uma disposição 1-2-1.</div></div>`}
function tacF(d){const h=d.home?.formation||d.home?.tactic?.formation||'—',a=d.away?.formation||d.away?.tactic?.formation||'—';return`<div class="tatico"><div class="secao"><h4>Casa · Tática</h4><div class="tatico-formacao">${esc(h)}</div></div><div class="secao"><h4>Fora · Tática</h4><div class="tatico-formacao">${esc(a)}</div></div></div>`}
async function abrirEquipaFutsal(id){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="detalhe-header"><button class="voltar" onclick="this.closest('.overlay').remove()">← Voltar</button></div><div class="detalhe"><div class="carregando">A carregar equipa...</div></div>`;document.body.appendChild(o);try{const [t,p,n,l]=await Promise.allSettled([sofa(`${SOFA}/team/${id}`),sofa(`${SOFA}/team/${id}/players`),sofa(`${SOFA}/team/${id}/events/next/0`),sofa(`${SOFA}/team/${id}/events/last/0`)]);const team=t.status==='fulfilled'?t.value.team:{};let h=`<div class="jogo-grande"><div style="text-align:center">${lS(id)}<h2>${esc(team.name||'Equipa')}</h2><div class="subtitulo">Futsal · Liga Placard</div></div></div>`;if(p.status==='fulfilled'){const ps=(p.value.players||[]).map(x=>x.player||x).filter(x=>x.name);h+=`<div class="secao"><h3>👥 Plantel</h3><div class="lista-jogadores">${ps.map(x=>`<div class="jogador">${esc(x.shirtNumber??'')} ${esc(x.name)}</div>`).join('')||'<div class="vazio">Plantel indisponível.</div>'}</div></div>`}h+=`<div class="secao"><h3>📅 Próximos jogos</h3>${listaEF(n.status==='fulfilled'?n.value.events||[]:[])}</div><div class="secao"><h3>↩️ Resultados</h3>${listaEF(l.status==='fulfilled'?l.value.events||[]:[])}</div>`;o.querySelector('.detalhe').innerHTML=h}catch(e){o.querySelector('.detalhe').innerHTML='<div class="erro">Não foi possível carregar a equipa.</div>'}}
function listaEF(a){if(!a.length)return'<div class="vazio">Sem jogos disponíveis.</div>';return a.slice(0,12).map(e=>{const s=sS(e);return`<div class="evento"><span class="minuto">${esc(dS(e.startTimestamp))}</span><span>${esc(nS(e.homeTeam))} ${esc(s.h)} - ${esc(s.a)} ${esc(nS(e.awayTeam))}</span></div>`}).join('')}
async function mostrarTabelasFutsal(){nav('navTabelas');app.innerHTML=botaoDesporto()+`<h2>🏆 Liga Placard · Classificação</h2><div class="carregando">A carregar classificação...</div>`;try{await descobrirLP();const d=await sofa(`${SOFA}/unique-tournament/${futsalDados.tid}/season/${futsalDados.sid}/standings/total`),r=d.standings?.[0]?.rows||[];app.innerHTML=botaoDesporto()+`<h2>🏆 Liga Placard · Classificação</h2><table class="classificacao"><thead><tr><th># Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>${r.map(x=>`<tr class="clicavel" onclick="abrirEquipaFutsal(${Number(x.team?.id)})"><td>${esc(x.position||'')} ${esc(x.team?.name||'')}</td><td>${esc(x.matches??'')}</td><td>${esc(x.wins??'')}</td><td>${esc(x.draws??'')}</td><td>${esc(x.losses??'')}</td><td>${esc(x.scoresFor??0)}:${esc(x.scoresAgainst??0)}</td><td><b>${esc(x.points??'')}</b></td></tr>`).join('')}</tbody></table>`}catch(e){app.innerHTML=botaoDesporto()+`<h2>🏆 Liga Placard</h2><div class="erro">Não foi possível carregar a classificação.</div>`}}
const mostrarJogosBase=mostrarJogos;const mostrarTabelasBase=mostrarTabelas;
mostrarJogos=function(){if(desportoAtual==='futsal'){carregarFutsal();return}mostrarJogosBase();app.insertAdjacentHTML('afterbegin',botaoDesporto())};
mostrarTabelas=async function(){if(desportoAtual==='futsal'){await mostrarTabelasFutsal();return}await mostrarTabelasBase();app.insertAdjacentHTML('afterbegin',botaoDesporto())};
if(desportoAtual==='futsal')mostrarJogos();
setInterval(()=>{if(desportoAtual==='futsal'&&document.getElementById('navJogos')?.classList.contains('active'))carregarFutsal()},120000);
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").then(()=>console.log("FUTZONE PWA ativa")).catch(err=>console.log("Erro PWA:",err));});}
</script>
