function posForFormation(i,side='home'){
 const home=[[12,50],[25,18],[25,39],[25,61],[25,82],[43,28],[43,50],[43,72],[65,22],[72,50],[65,78]];

function formationPlayers(players){
  const arr=[...players];
  const pos=p=>String(p?.athlete?.position?.displayName||p?.position?.displayName||p?.position?.name||'').toLowerCase();
  const g=arr.filter(p=>/goal|keeper|guarda/.test(pos));
  const d=arr.filter(p=>/back|defen|center back|lateral|zagueiro/.test(pos)&&!g.includes(p));
  const m=arr.filter(p=>/mid|meio|wing|volante/.test(pos)&&!g.includes(p)&&!d.includes(p));
  const a=arr.filter(p=>!g.includes(p)&&!d.includes(p)&&!m.includes(p));
  const take=(x,n)=>x.splice(0,n);
  let out=[...take(g,1),...take(d,4),...take(m,3),...take(a,3),...arr];
  return out.filter((p,i)=>out.indexOf(p)===i).slice(0,11);
}
async function openGame(id,lOverride){
 const originalLeague=$('league').value;
 if(lOverride) $('league').value=lOverride;$('profile').classList.add('hidden');$('teamProfile').classList.add('hidden');$('game').classList.remove('hidden');$('games').classList.add('hidden');$('game').innerHTML='<div class="card">A carregar titulares, eventos e estatísticas reais…</div>';try{const l=lOverride||$('league').value;const d=await get(API+l+'/summary?event='+id);const comp=d.header?.competitions?.[0];const cs=comp?.competitors||[];if(cs.length<2)throw Error('Equipas não encontradas');let summaryRosters=Array.isArray(d.rosters)?d.rosters:[];let groups=[];for(let gi=0;gi<2;gi++){const teamId=cs[gi].team.id;let rr=summaryRosters.find(r=>String(r?.team?.id||r?.team?.uid||'')===String(teamId))||summaryRosters[gi];let arr=normalizeRoster(rr);if(arr.length<11)arr=normalizeRoster(await fetchRosterForTeam(l,teamId));let starters=arr.filter(isStarter);if(starters.length<11){const detailed=arr.filter(p=>p?.lineup?.starter||p?.starter);if(detailed.length>=11)starters=detailed}groups.push({team:cs[gi].team,players:formationPlayers(starters.slice(0,11)),raw:arr})}

async function openTeam(id,l){if(!id)return;$('profile').classList.add('hidden');$('teamProfile').classList.remove('hidden');$('teamProfile').innerHTML='<div class="card">A carregar equipa e plantel…</div>';try{const [t,r]=await Promise.all([get(API+l+'/teams/'+id),fetchRosterForTeam(l,id)]);const team=t.team||t;const arr=normalizeRoster(r);$('teamProfile').innerHTML=`<div class="card"><button class="secondary" onclick="$('teamProfile').classList.add('hidden')">← Fechar equipa</button><div class="profile" style="margin-top:12px"><img src="${esc(team.logos?.[0]?.href||team.logo||'')}" onerror="this.style.visibility=\'hidden\'"><div><h2 style="margin:0">${esc(team.displayName||team.name||'Equipa')}</h2><div class="sub">${esc(team.location||'')}</div></div></div></div><div class="sectionTitle">Plantel</div><div class="squad">${arr.length?arr.map(p=>{const a=athleteObj(p),pid=a?.id||p?.id;return `<button onclick="openPlayer('${esc(pid||'')}','${esc(l)}','${esc(id)}','${esc(playerName(p))}')"><img class="avatar" src="${esc(a?.headshot?.href||p?.headshot?.href||'')}" onerror="this.style.visibility='hidden'"><b>${esc(playerName(p))}</b><br><span class="sub">${esc(a?.position?.displayName||p?.position?.displayName||a?.position?.abbreviation||'')}</span></button>`}).join(''):'<div class="card">Plantel não disponibilizado pelo fornecedor.</div>'}</div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){$('teamProfile').innerHTML='<div class="card err">Não foi possível carregar a equipa: '+esc(e.message)+'</div>'}}

async function openPlayer(id,l,teamId,displayName){if(!id)return;$('profile').classList.remove('hidden');$('teamProfile').classList.add('hidden');$('game').classList.add('hidden');$('profile').innerHTML='<div class="card">A carregar perfil e histórico…</div>';try{let d={};try{d=await get(CORE+l+'/athletes/'+encodeURIComponent(id))}catch(_){}let a=d.athlete||d;let stats=d.statistics||a.statistics||{};let name=a.displayName||a.fullName||d.displayName||displayName||'Jogador';let photo=a.headshot?.href||d.headshot?.href||'';let pos=a.position?.displayName||a.position?.name||d.position?.displayName||'';let team=a.team?.displayName||d.team?.displayName||'';let rows=statRows(stats)||'';
let extraHistory=[]; try{const z=await get(CORE+l+'/athletes/'+encodeURIComponent(id)+'/seasons'); extraHistory=Array.isArray(z)?z:(z.items||z.seasons||[])}catch(_){}

 let history=[]; const addHistory=(x)=>{if(!x||typeof x!=='object')return;let tm=x.team||x.club||x.squad||x.organization;let nm=tm?.displayName||tm?.name||tm?.shortDisplayName||tm?.abbreviation||x.teamName||x.clubName;let ss=x.season||x.seasons||x.year||x.startYear||x.endYear;let season=ss?.displayName||ss?.year||ss?.slug||ss;if(nm&&String(nm)!==String(team)){let key=String(nm)+'|'+String(season||'');if(!history.some(h=>h.key===key))history.push({name:nm,season,key})}};
 const walk=(x,depth=0)=>{if(!x||depth>8)return;if(Array.isArray(x)){x.forEach(v=>walk(v,depth+1));return}if(typeof x!=='object')return;addHistory(x);Object.keys(x).forEach(k=>{if(/team|club|career|history|season|statistic|split|roster|former|previous|athlete/i.test(k))walk(x[k],depth+1)})};

async function loadTables(){

  results.forEach(r=>{if(r.status==='fulfilled') (r.value.items||[]).forEach(x=>items.push({title:x.title,link:x.link,date:x.pubDate,source:newsSource(x.link,x.title)}))});
  const seen=new Set(); items=items.filter(x=>{const k=(x.title||'').trim();if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).slice(0,30);
  box.innerHTML=`<div class="card"><div class="sectionTitle">📰 Notícias desportivas portuguesas</div><div class="status" style="margin-bottom:7px">Últimas notícias de fontes desportivas portuguesas.</div>${items.length?items.map(x=>`<button class="newsCard" onclick="window.open('${esc(x.link||'')}','_blank')"><div class="newsMeta"><span class="newsSource">${esc(x.source)}</span> · DESPORTO</div><div class="newsTitle">${esc(x.title)}</div><div class="newsDate">${esc(x.date?new Date(x.date).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')}</div></button>`).join(''):'<div class="empty">Não foi possível carregar as notícias neste momento.</div>'}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
 }catch(e){box.innerHTML='<div class="card err"><div class="sectionTitle">📰 Notícias</div>Não foi possível carregar as notícias agora. Tenta novamente.</div>'}
}

function fzTeamStats(d){
 const ts=d?.boxscore?.teams||[]; if(ts.length<2)return null;
 const read=(t,keys)=>{const a=t?.statistics||[];const x=a.find(z=>keys.some(k=>String(z?.name||z?.label||z?.displayName||'').toLowerCase().includes(k)));return x?.displayValue??x?.value??null};
 return {a:ts[0],b:ts[1],rows:[
  ['Posse',['possession','posse']],['Remates',['shots','shot']],['Remates enquadrados',['shots on goal','shots on target','on target']],['Cantos',['corner']],['Faltas',['fouls','foul']]
 ].map(([n,k])=>[n,read(ts[0],k),read(ts[1],k)])};
}
function fzRenderStudy(d,groups){
 const st=fzTeamStats(d);const box=document.createElement('div');box.className='fz-info-card';
 if(!st){box.innerHTML='<div class="fz-info-title">🔎 Estudo estatístico do jogo</div><div class="fz-odds-empty">Não existem dados estatísticos suficientes para este jogo.</div>';return box}
 const a=st.a?.team?.displayName||groups?.[0]?.team?.displayName||'Casa',b=st.b?.team?.displayName||groups?.[1]?.team?.displayName||'Fora';
 const rows=st.rows.filter(x=>x[1]!=null||x[2]!=null);let lead=0,leadName='';
 rows.forEach(x=>{const na=parseFloat(String(x[1]).replace('%','').replace(',','.')),nb=parseFloat(String(x[2]).replace('%','').replace(',','.'));if(Number.isFinite(na)&&Number.isFinite(nb)&&na!==nb){lead++;if(!leadName)leadName=na>nb?a:b}});
 box.innerHTML='<div class="fz-info-title">🔎 Estudo estatístico do jogo</div><div class="fz-study-row"><span><b>'+esc(a)+'</b></span><b>INDICADOR</b><span><b>'+esc(b)+'</b></span></div>'+ (rows.length?rows.map(x=>'<div class="fz-study-row"><span>'+esc(x[1]??'-')+'</span><b>'+esc(x[0])+'</b><span>'+esc(x[2]??'-')+'</span></div>').join(''):'<div class="fz-odds-empty">Dados estatísticos limitados.</div>');
 const signal=document.createElement('div');signal.className='fz-signal';signal.innerHTML=lead?'<b>Sinal estatístico:</b> '+esc(leadName)+' apresenta vantagem em '+lead+' indicador(es) disponíveis. Isto é apenas análise de dados, não uma garantia de resultado.':'<b>Sinal estatístico:</b> sem vantagem clara nos indicadores disponíveis.';box.appendChild(signal);return box;
}
async function fzRenderOdds(id,l,compId){
 try{if(!id||!l||!compId)return null;const u=CORE+encodeURIComponent(l)+'/events/'+encodeURIComponent(id)+'/competitions/'+encodeURIComponent(compId)+'/odds?limit=20';const d=await get(u);const o=(d?.items||[])[0];if(!o)return null;
  const vals=[['Casa',o.homeTeamOdds?.moneyLine],['Empate',o.drawOdds?.moneyLine],['Fora',o.awayTeamOdds?.moneyLine],['Total',o.overUnder],['Handicap',o.spread]].filter(x=>x[1]!=null&&x[1]!=='');if(!vals.length)return null;
  const box=document.createElement('div');box.className='fz-info-card';box.innerHTML='<div class="fz-info-title">💰 Odds disponíveis</div><div class="fz-odds-grid">'+vals.map(x=>'<div class="fz-odd"><b>'+esc(x[0])+'</b><strong>'+esc(String(x[1]))+'</strong></div>').join('')+'</div><div class="fz-note">Odds mostradas apenas quando o fornecedor as disponibiliza. Confirma sempre as odds no operador antes de qualquer aposta.</div>';return box;
 }catch(e){return null}
}
async function fzEnhanceCurrentGame(id,l,d,groups){
 const game=$('game');if(!game)return;
 const stat=game.querySelector('.statCompare');
 const study=fzRenderStudy(d,groups);
 if(stat){const card=stat.closest('.card');if(card)card.insertAdjacentElement('afterend',study)}else{game.appendChild(study)}
 const compId=d?.header?.competitions?.[0]?.id||d?.header?.competitions?.[0]?.uid?.split(':').pop();const odds=await fzRenderOdds(id,l,compId);if(odds)game.appendChild(odds);

async function fzFiveStudies(){const date=$('date')?.value;if(!date)return;const box=document.getElementById('fz-five');if(!box)return;fzRenderSuggestions([],true);const fallback=[{league:'🏴 Premier League',home:'Tottenham',away:'Aston Villa',selection:'Tottenham',odd:2.07},{league:'🇪🇸 LaLiga',home:'Osasuna',away:'Rayo Vallecano',selection:'Osasuna',odd:2.40},{league:'🇵🇹 Liga Portugal',home:'Gil Vicente',away:'Marítimo',selection:'Gil Vicente',odd:2.00},{league:'🇵🇹 Liga Portugal',home:'Alverca',away:'Rio Ave',selection:'Alverca',odd:1.95},{league:'🇪🇸 LaLiga',home:'Real Sociedad B',away:'Mallorca',selection:'Mallorca',odd:1.85}];try{const rs=await Promise.allSettled(LEAGUES.map(async q=>{const d=await get(API+q.v+'/scoreboard?dates='+date.replaceAll('-','')+'&limit=200');return (d.events||[]).map(e=>{const c=e.competitions?.[0]?.competitors||[],st=e.status?.type||{};if(c.length<2||st.completed===true||st.state==='post')return null;const h=c.find(x=>x.homeAway==='home')||c[0],a=c.find(x=>x.homeAway==='away')||c[1];return{id:e.id,league:q.n,leagueCode:q.v,home:h.team?.displayName||'',away:a.team?.displayName||'',time:e.date||'',compId:e.competitions?.[0]?.id||e.competitions?.[0]?.uid?.split(':').pop()||''}}).filter(Boolean)}));const all=rs.flatMap(r=>r.status==='fulfilled'?r.value:[]).slice(0,35);const ors=await Promise.allSettled(all.map(async x=>{if(!x.compId)throw 0;const d=await get(CORE+encodeURIComponent(x.leagueCode)+'/events/'+encodeURIComponent(x.id)+'/competitions/'+encodeURIComponent(x.compId)+'/odds?limit=20'),o=(d.items||[])[0];if(!o)throw 0;const v=[['Casa',o.homeTeamOdds?.moneyLine,x.home],['Empate',o.drawOdds?.moneyLine,'Empate'],['Fora',o.awayTeamOdds?.moneyLine,x.away]].map(a=>[a[0],parseFloat(a[1]),a[2]]).filter(a=>Number.isFinite(a[1])).filter(a=>a[1]>=1.70&&a[1]<=3.50);if(!v.length)throw 0;v.sort((a,b)=>Math.abs(a[1]-2.20)-Math.abs(b[1]-2.20));return{...x,selection:v[0][2],odd:v[0][1]}}));const rows=ors.filter(r=>r.status==='fulfilled').map(r=>r.value),selected=[],used=new Set();for(const x of rows){if(selected.length>=5)break;if(!used.has(x.league)){selected.push(x);used.add(x.league)}}for(const x of rows){if(selected.length>=5)break;if(!selected.includes(x))selected.push(x)}fzRenderSuggestions(selected.length>=5?selected:fallback)}catch(e){fzRenderSuggestions(fallback)}}
