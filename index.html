function fzLocalISO(d=new Date()){
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function fzYmdDate(d){
  return fzLocalISO(d).replaceAll("-","");
}

function fzDateRange(a,b){
  return fzYmdDate(a)+"-"+fzYmdDate(b);
}

function escapeHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function hojeISO(offset=0){
  const d=new Date();
  d.setDate(d.getDate()+offset);
  return fzLocalISO(d);
}

function dataCurta(v){
  const d=v instanceof Date?v:new Date(v);
  if(isNaN(d.getTime()))return "";
  return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"});
}

function formatarData(v){
  const d=new Date(v);
  if(isNaN(d.getTime()))return "";
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function horaEvento(e){
  if(!e?.date)return "--:--";
  const d=new Date(e.date);
  if(isNaN(d.getTime()))return "--:--";
  return d.toLocaleTimeString("pt-PT",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function nomeEquipa(t){
  return t?.team?.displayName||
         t?.team?.shortDisplayName||
         t?.team?.name||
         t?.displayName||
         t?.name||
         "Equipa";
}

function logoEquipa(t){
  return t?.team?.logo||
         t?.team?.logos?.[0]?.href||
         t?.logo||
         "";
}

function isLive(e){
  const s=e?.status?.type;
  return !!(
    s?.state==="in"||
    s?.name==="STATUS_IN_PROGRESS"||
    /LIVE|IN_PROGRESS|IN_PLAY/i.test(s?.name||"")||
    /LIVE|IN_PROGRESS/i.test(s?.description||"")
  );
}

function isFinal(e){
  const s=e?.status?.type;
  return !!(
    s?.completed||
    s?.state==="post"||
    /FINAL|POST/i.test(s?.name||"")
  );
}

function getCompeticao(id){
  const x=ligas.find(a=>a[0]===id);

function favoritoJogo(id){

async function fetchJSON(url,timeoutMs=7000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);

  try{
    const r=await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    return null;
  }finally{
    clearTimeout(timer);
  }
}

function fzCacheGet(key,ttl){
  const x=FZ_CACHE.get(key);
  if(!x)return null;

  if(Date.now()-x.t>ttl){
    FZ_CACHE.delete(key);
    return null;
  }

  return x.data;
}

async function fzFetch(url,timeoutMs=7000,ttl=30000){
  const hit=fzCacheGet(url,ttl);
  if(hit!==null)return hit;

  if(FZ_INFLIGHT.has(url)){
    return FZ_INFLIGHT.get(url);
  }

  const p=fetchJSON(url,timeoutMs)
    .then(data=>{
      if(data!==null){
        FZ_CACHE.set(url,{t:Date.now(),data});
      }
      return data;
    })
    .catch(()=>null)
    .finally(()=>{
      FZ_INFLIGHT.delete(url);
    });

  FZ_INFLIGHT.set(url,p);
  return p;
}

  const [date,home,away,hs,as]=row;

  return {
    id:"fz-fallback-"+liga+"-"+i,
    date,
    name:home+" vs "+away,
    __futzoneLiga:liga,
    competitions:[{name:getCompeticao(liga)}],
    status:{
      type:{
        state:(hs!==""&&as!=="")?"post":"pre",
        completed:(hs!==""&&as!=="")
      }
    },
    competitors:[
      {
        id:"fz-"+home,
        team:{
          id:"fz-"+home,
          displayName:home
        },
        homeAway:"home",
        score:hs===""?undefined:String(hs)
      },
      {
        id:"fz-"+away,
        team:{
          id:"fz-"+away,
          displayName:away
        },
        homeAway:"away",
        score:as===""?undefined:String(as)
      }
    ]
  };
}

function fallbackGames(liga){
  const data=FALLBACK[liga];
  if(!data?.games)return [];

  return data.games.map((x,i)=>
    makeFallbackEvent(liga,x,i)
  );
}

async function buscarJogosLiga(liga){
  if(String(liga).startsWith("futsal:"))return [];

  const inicio=new Date();
  inicio.setDate(inicio.getDate()-1);

  const fim=new Date();
  fim.setDate(fim.getDate()+7);

  const url=
    API+encodeURIComponent(liga)+
    "/scoreboard?dates="+
    fzDateRange(inicio,fim)+
    "&limit=100";

  let data=await fzFetch(url,7000,30000);

  let eventos=Array.isArray(data?.events)
    ?data.events:[ ];

  eventos.forEach(e=>e.__futzoneLiga=liga);

  if(["por.2","por.3","por.w.1"].includes(liga)){
    fallbackGames(liga).forEach(e=>{
      if(!eventos.some(x=>String(x.id)===String(e.id))){
        eventos.push(e);
      }
    });
  }

  eventos.sort((a,b)=>
    new Date(a.date)-new Date(b.date)
  );

  return eventos;
}

    .forEach((b,i)=>{

      b.classList.toggle("active",vals[i]===f);
    });

  if(f==="live"){
    fzModoTodos=true;
    fzDiaSelecionado=fzLocalISO();
    mostrarTodosLive();

  renderizarJogos();

  if(filtroAtual==="final")return isFinal(e);
  if(filtroAtual==="proximos")return !isFinal(e)&&!isLive(e);
  return true;
}

async function fzBuscarTodosDia(iso,liveOnly=false){
  const dia=iso.replaceAll("-","");
  const key="ALL|"+dia;

  const cached=fzCacheGet(key,15000);

  if(cached){
    return liveOnly?cached.filter(isLive):cached;
  }

  const resultado=[];
  const seen=new Set();

  /*
   * IMPORTANTE:
   * Só 4 ligas em simultâneo.
   * Evita o congelamento no telemóvel.
   */
  for(let i=0;i<LIGAS_FUTEBOL.length;i+=4){

    const grupo=LIGAS_FUTEBOL.slice(i,i+4);

    const rs=await Promise.all(
      grupo.map(async ([liga])=>{
        const url=
          API+encodeURIComponent(liga)+
          "/scoreboard?dates="+dia+
          "&limit=100";

        const data=await fzFetch(url,7000,15000);

        return (data?.events||[]).map(e=>{
          e.__futzoneLiga=liga;
          return e;
        });
      })
    );

    rs.flat().forEach(e=>{
      if(!seen.has(String(e.id))){
        seen.add(String(e.id));
        resultado.push(e);
      }
    });
  }

  ["por.2","por.3","por.w.1"].forEach(liga=>{
    fallbackGames(liga).forEach(e=>{
      if(fzLocalISO(new Date(e.date))===iso &&
         !seen.has(String(e.id))){
        seen.add(String(e.id));
        resultado.push(e);
      }
    });
  });

  resultado.sort((a,b)=>
    new Date(a.date)-new Date(b.date)
  );

  FZ_CACHE.set(key,{
    t:Date.now(),
    data:resultado
  });

  return liveOnly?resultado.filter(isLive):resultado;
}

  if(token!==fzRequestToken)return;

  let arr=eventos.filter(e=>
    fzLocalISO(new Date(e.date))===iso
  );

  const q=
    document.getElementById("searchInput")
      ?.value.trim().toLowerCase()||"";

  if(q){
    arr=arr.filter(e=>
      String(e.name||"").toLowerCase().includes(q)||
      e.competitors?.some(x=>
        nomeEquipa(x).toLowerCase().includes(q)

  arr=arr.filter(passaFiltro);

        Não existem jogos para este dia.

  const grupos={};

  arr.forEach(e=>{
    const id=e.__futzoneLiga||ligaAtual;
    if(!grupos[id])grupos[id]=[];
    grupos[id].push(e);

  c.innerHTML=Object.entries(grupos).map(([id,items])=>`

        ${escapeHtml(getCompeticao(id))}

function normalizarTabela(t){
  if(!Array.isArray(t))return [];

  return t.map((x,i)=>{
    const team=x?.team||x?.competitor||x?.entry||x;

    const stats=x?.stats||x?.statistics||[];

    function stat(names){
      const s=stats.find(z=>
        names.some(n=>
          String(z.name||z.type||"")
            .toLowerCase()
            .includes(n)
        )
      );

      return s?.value??s?.displayValue;
    }

    return {
      pos:Number(x?.rank||x?.position||x?.order||i+1),
      id:String(team?.id||x?.teamId||"team-"+i),
      nome:team?.displayName||
           team?.name||
           team?.shortDisplayName||
           x?.name||
           "Equipa",
      logo:team?.logos?.[0]?.href||team?.logo||"",
      pj:Number(stat(["played","gamesplayed","gp"])??x?.played??0),
      v:Number(stat(["wins"])??x?.wins??0),
      e:Number(stat(["ties","draws"])??x?.draws??0),
      d:Number(stat(["losses"])??x?.losses??0),
      pts:Number(stat(["points","pts"])??x?.points??0),
      gd:Number(stat(["pointdiffer","goaldiff"])??x?.goalDifference??0)
    };
  });
}

function renderTabela(t,titulo,ligaId=ligaAtual,target=null){
  const c=target||document.getElementById("tableContent");
  if(!c)return;

  const rows=normalizarTabela(t);

  if(!rows.length){
    c.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">📊</div>
        Classificação indisponível.
      </div>
    `;
    return;
  }

  c.innerHTML=`
    ${target?"":`<div class="tableTitle">${escapeHtml(titulo)}</div>`}

    <div class="tableWrap">
      <table class="standingsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Equipa</th>
            <th>PJ</th>
            <th>V</th>
            <th>E</th>
            <th>D</th>
            <th>DG</th>
            <th>Pts</th>
          </tr>
        </thead>

        <tbody>
          ${rows.map((r,i)=>`
            <tr onclick="fzAbrirEquipa(
              '${escapeHtml(r.id)}',
              '${escapeHtml(r.nome)}',
              '${escapeHtml(r.logo)}',

            )">

                  ?`<img src="${escapeHtml(r.logo)}" loading="lazy">`
                  :"⚽"}

                <span>${escapeHtml(r.nome)}</span>
              </td>

              <td>${r.pj}</td>

              <td>${r.e}</td>

              <td>${r.gd}</td>
              <td><strong>${r.pts}</strong></td>

          `).join("")}

}

function extrairTabela(data){
  const out=[];

  function procurar(obj){
    if(!obj||typeof obj!=="object")return;

    if(Array.isArray(obj.entries))
      out.push(...obj.entries);

    if(Array.isArray(obj.standings))
      out.push(...obj.standings);

    if(Array.isArray(obj.rows))
      out.push(...obj.rows);

    if(Array.isArray(obj.children))
      obj.children.forEach(procurar);
  }

  procurar(data);

  const seen=new Set();

  return out.filter(x=>{
    const id=x?.team?.id||
            x?.competitor?.id||
            x?.id||
            JSON.stringify(x);

    if(seen.has(String(id)))return false;

    seen.add(String(id));
    return true;
  });
}

          '${escapeHtml(nomeEquipa(home))}',
          '${escapeHtml(logoEquipa(home))}',
          '${escapeHtml(liga)}'
        )">

        ${logoEquipa(home)
          ?`<img src="${escapeHtml(logoEquipa(home))}">`
          :`<div class="teamLogo big">⚽</div>`}

        <span>${escapeHtml(nomeEquipa(home))}</span>
      </div>

      <div class="detailMiddle">
        <small>
          ${isLive(e)?"AO VIVO":
            isFinal(e)?"FINAL":
            horaEvento(e)}
        </small>

        <strong>
          ${isLive(e)||isFinal(e)
            ?`${escapeHtml(home?.score??"")} - ${escapeHtml(away?.score??"")}`
            :"VS"}
        </strong>
      </div>

      <div class="detailTeam"
        onclick="fzAbrirEquipa(
          '${escapeHtml(away?.id||"")}',
          '${escapeHtml(nomeEquipa(away))}',
          '${escapeHtml(logoEquipa(away))}',
          '${escapeHtml(liga)}'
        )">

        ${logoEquipa(away)
          ?`<img src="${escapeHtml(logoEquipa(away))}">`
          :`<div class="teamLogo big">⚽</div>`}

        <span>${escapeHtml(nomeEquipa(away))}</span>
      </div>

    </div>

    <div id="detailBody">
      <div class="loading">
        A carregar estatísticas...
      </div>
    </div>
  `;

  const data=await fzFetch(
    API+encodeURIComponent(liga)+
    "/summary?event="+encodeURIComponent(e.id),
    8000,
    30000
  );

  const body=document.getElementById("detailBody");

  if(!data){
    body.innerHTML=`
      <div class="empty">
        Informação detalhada indisponível.
      </div>
    `;
    return;
  }

  body.innerHTML=`
    ${eventosHTML(data.plays||[])}
    ${estatisticasHTML(data.boxscore?.teams||[])}

    <div class="detailSection">
      <h3>👥 Jogadores</h3>
      ${listaJogadoresHTML(data,liga)}
    </div>
  `;
}

function eventosHTML(events){
  if(!Array.isArray(events)||!events.length)return "";

  return `
    <div class="detailSection">
      <h3>⚡ Acontecimentos</h3>

      ${events.slice(-30).reverse().map(x=>`
        <div class="eventRow">
          <span>${escapeHtml(x.clock?.displayValue||"")}</span>
          <span>${escapeHtml(
            x.text||x.type?.text||x.type?.name||""
          )}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function estatisticasHTML(teams){
  if(!Array.isArray(teams)||!teams.length)return "";

  return `
    <div class="detailSection">
      <h3>📊 Estatísticas</h3>

      ${teams.map(t=>`
        <div class="statTeam">
          <strong>${escapeHtml(
            t.team?.displayName||""
          )}</strong>

          ${(t.statistics||[]).slice(0,12).map(s=>`
            <div class="statRow">
              <span>${escapeHtml(s.name||"")}</span>
              <b>${escapeHtml(
                s.displayValue??s.value??""
              )}</b>
            </div>
          `).join("")}
        </div>
      `).join("")}
    </div>
  `;
}

function listaJogadoresHTML(data,liga){
  const athletes=[];

  (data?.boxscore?.players||[]).forEach(t=>{
    (t.statistics||[]).forEach(group=>{
      (group.athletes||[]).forEach(a=>{
        athletes.push({
          ...a,
          team:t.team
        });
      });
    });
  });

  if(!athletes.length)
    return `<div class="muted">Dados dos jogadores indisponíveis.</div>`;

  return athletes.map(a=>{
    const atleta=a.athlete||a;

    return `
      <div class="playerRow"
        onclick="fzAbrirJogador(
          '${escapeHtml(atleta.id||"")}',
          '${escapeHtml(atleta.displayName||"Jogador")}',
          '${escapeHtml(liga)}'
        )">

        <span>${escapeHtml(
          atleta.jersey||atleta.number||""
        )}</span>

        <strong>${escapeHtml(
          atleta.displayName||"Jogador"
        )}</strong>

        <small>${escapeHtml(
          atleta.position?.abbreviation||
          atleta.position?.displayName||""
        )}</small>
      </div>
    `;
  }).join("");
}

/* =========================
   CLUBES
========================= */

async function fzAbrirEquipa(id,nome,logo,liga){
  const overlay=document.getElementById("overlay");
  overlay.classList.add("open");

  overlay.innerHTML=`
    <div class="detailHeader">
      <button onclick="fecharOverlay()">←</button>
      <strong>${escapeHtml(nome)}</strong>
    </div>

    <div class="clubHero">
      ${logo
        ?`<img src="${escapeHtml(logo)}">`
        :`<div class="teamLogo big">⚽</div>`}

      <h2>${escapeHtml(nome)}</h2>
      <span>${escapeHtml(getCompeticao(liga||ligaAtual))}</span>
    </div>

    <div id="clubBody">
      <div class="loading">
        A carregar equipa...
      </div>
    </div>
  `;

  if(!id||String(id).startsWith("fz-")){
    document.getElementById("clubBody").innerHTML=`
      <div class="empty">
        Dados detalhados da equipa indisponíveis.
      </div>
    `;
    return;
  }

  const base=
    API+encodeURIComponent(liga||ligaAtual)+
    "/teams/"+encodeURIComponent(id);

  const [teamData,roster,schedule]=await Promise.all([
    fzFetch(base,8000,120000),
    fzFetch(base+"/roster",8000,120000),
    fzFetch(base+"/schedule?limit=50",8000,30000)
  ]);

  const body=document.getElementById("clubBody");

  if(!body)return;

  const atletas=roster?.athletes||[];
  const jogos=schedule?.events||[];

  body.innerHTML=`
    <div class="detailSection">
      <h3>👥 Plantel</h3>

      <div class="playersGrid">
        ${atletas.length
          ?atletas.map(a=>{
            const at=a.athlete||a;

            return `
              <div class="playerCard"
                onclick="fzAbrirJogador(
                  '${escapeHtml(at.id||"")}',
                  '${escapeHtml(at.displayName||"Jogador")}',
                  '${escapeHtml(liga||ligaAtual)}'
                )">

                <strong>${escapeHtml(
                  at.displayName||"Jogador"
                )}</strong>

                <span>${escapeHtml(
                  at.position?.displayName||
                  at.position?.abbreviation||""
                )}</span>

                <small>
                  Nº ${escapeHtml(at.jersey||"-")}
                </small>
              </div>
            `;
          }).join("")
          :`<div class="muted">Plantel indisponível.</div>`
        }
      </div>
    </div>

    <div class="detailSection">
      <h3>📅 Jogos</h3>

      ${jogos.length
        ?jogos.slice(0,20).map(e=>{
          e.__futzoneLiga=liga||ligaAtual;
          return cartaoJogo(e);
        }).join("")
        :`<div class="muted">Jogos indisponíveis.</div>`
      }
    </div>
  `;
}

/* =========================
   JOGADORES
========================= */

async function fzAbrirJogador(id,nome,liga){
  const overlay=document.getElementById("overlay");
  overlay.classList.add("open");

  overlay.innerHTML=`
    <div class="detailHeader">
      <button onclick="fecharOverlay()">←</button>
      <strong>${escapeHtml(nome)}</strong>
    </div>

    <div id="playerBody">
      <div class="loading">
        A carregar jogador...
      </div>
    </div>
  `;

  const body=document.getElementById("playerBody");

  if(!id){
    body.innerHTML=`
      <div class="empty">
        Informação do jogador indisponível.
      </div>
    `;
    return;
  }

  const atleta=await fzFetch(
    "https://sports.core.api.espn.com/v2/sports/soccer/athletes/"+
    encodeURIComponent(id),
    8000,
    120000
  );

  if(!atleta){
    body.innerHTML=`
      <div class="empty">
        Informação do jogador indisponível.
      </div>
    `;
    return;
  }

  const a=atleta.athlete||atleta;

  const nacionalidade=
    a.birthPlace?.country||
    a.citizenship||
    a.nationality||
    "—";

  const nascimento=a.dateOfBirth||a.birthDate||"—";
  const altura=a.displayHeight||a.height||"—";
  const peso=a.displayWeight||a.weight||"—";

  body.innerHTML=`
    <div class="playerHero">

      ${a.headshot?.href
        ?`<img src="${escapeHtml(a.headshot.href)}">`
        :`<div class="playerPlaceholder">👤</div>`
      }

      <h2>${escapeHtml(
        a.displayName||a.fullName||nome
      )}</h2>

      <span>${escapeHtml(
        a.position?.displayName||
        a.position?.abbreviation||""
      )}</span>
    </div>

    <div class="detailSection">
      <h3>ℹ️ Dados</h3>

      <div class="playerInfoGrid">
        <div>
          <small>Nacionalidade</small>
          <strong>${escapeHtml(nacionalidade)}</strong>
        </div>

        <div>
          <small>Nascimento</small>
          <strong>${escapeHtml(
            nascimento==="—"?"—":formatarData(nascimento)
          )}</strong>
        </div>

        <div>
          <small>Altura</small>
          <strong>${escapeHtml(altura)}</strong>
        </div>

        <div>
          <small>Peso</small>
          <strong>${escapeHtml(peso)}</strong>
        </div>
      </div>
    </div>

    <div class="detailSection">
      <h3>🏟️ Histórico de clubes</h3>

      <div class="muted">
        ${Array.isArray(a.careerHistory)&&a.careerHistory.length
          ?"Histórico disponível."
          :"O histórico de clubes não está disponível na fonte de dados."
        }
      </div>
    </div>
  `;
}

function fecharOverlay(){
  document.getElementById("overlay")
    ?.classList.remove("open");
}

/* =========================
   FUTSAL
========================= */

const FZ_FUTSAL_COMPETICOES=[
["liga","Liga Placard"],
["ii","Futsal II Divisão"],
["iii","Futsal III Divisão"],
["sub19i","Futsal Sub-19 I Divisão"],
["sub19ii","Futsal Sub-19 II Divisão"],
["sub17","Futsal Sub-17"],
["sub15","Futsal Sub-15"],
["fem1","Liga Feminina Placard"],
["fem2","Feminino II Divisão"],
["fem19","Feminino Sub-19"],
["fem15","Feminino Sub-15"],
["taca","Taça de Portugal Futsal"],
["tacaliga","Taça da Liga Futsal"],
["supertaca","Supertaça Futsal"],
["tacas","Taças FPF"]
];

function fzFutsalNome(id){
  const x=FZ_FUTSAL_COMPETICOES.find(a=>a[0]===id);
  return x?x[1]:"Futsal";
}

function renderizarFutsalNoFutebol(id){
  const c=document.getElementById("gamesList");
  if(!c)return;

  c.innerHTML=`
    <div class="futsalPage">

      <div class="futsalTitle">
        🥅 ${escapeHtml(fzFutsalNome(
          id.replace("futsal:","")
        ))}
      </div>

      <iframe
        src="https://resultados.fpf.pt/api/1c/links/comparator"
        loading="lazy"
        style="
          width:100%;
          min-height:700px;
          border:0;
          border-radius:16px;
          background:#fff;
        ">
      </iframe>

    </div>
  `;
}

function renderizarFutsalTabela(){
  renderizarFutsalNoFutebol("futsal:liga");
}

/* =========================
   NAVEGAÇÃO
========================= */

function mostrarTabela(){
  if(desportoAtual==="futsal"){
    renderizarFutsalTabela();
    return;
  }

  mostrarTabelaFutebol();
}

function irTabelas(){
  fzModoTodos=false;

  document.getElementById("navJogos")
    ?.classList.remove("active");

  document.getElementById("navTabelas")
    ?.classList.add("active");

  document.getElementById("navFav")
    ?.classList.remove("active");

  mostrarTabela();
}

/* =========================
   INICIALIZAÇÃO
========================= */

function fzInicializar(){

  desenharLigas();

  fzCriarCabecalhoDias();

  fzTodosButton();

  fzPrepararPesquisa();

  fzDiaSelecionado=fzLocalISO();

  fzModoTodos=false;

  filtroAtual="todos";

  carregarJogos();

  setInterval(async()=>{
    if(
      desportoAtual!=="futebol"||
      fzRefreshing||
      !fzModoTodos||
      filtroAtual!=="live"
    ){
      return;
    }

    fzRefreshing=true;

    try{
      const dia=fzLocalISO();

      FZ_CACHE.delete("ALL|"+dia);

      await mostrarTodosLive();
    }finally{
      fzRefreshing=false;
    }

  },60000);
}

if(document.readyState==="loading"){
  document.addEventListener(
    "DOMContentLoaded",
    fzInicializar,
    {once:true}
  );
}else{
  fzInicializar();
}
</script>
