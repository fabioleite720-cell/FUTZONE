<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#071326;border-bottom:1px solid #17243a;padding:14px 14px}
.logo{font-size:26px;font-weight:900}.logo span{color:#7ed957}
main{padding:12px 10px 85px;max-width:760px;margin:auto}
h2{font-size:18px;margin:18px 0 10px}

/* LIGAS */
.seletor-ligas{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.liga-btn{background:#0b1627;border:1px solid #17243a;border-radius:12px;padding:12px 5px;color:#fff;font-size:13px;font-weight:bold}
.liga-btn.active{border-color:#7ed957;background:#102039}
.liga-icon{font-size:22px;display:block;margin-bottom:4px}

/* SECÇÕES HORIZONTAIS */
.horizontal{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:2px 2px 10px;
 scroll-snap-type:x mandatory
}
.horizontal::-webkit-scrollbar{display:none}

/* CARTÕES */
.jogo{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:14px;
 padding:12px;
 cursor:pointer;
 flex:0 0 88%;
 scroll-snap-align:start
}

.horizontal .jogo{
 flex:0 0 82%;
 max-width:330px
}

.jogo.live{
 border-color:#7ed957;
 box-shadow:0 0 0 1px #7ed95722
}

.jogo-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 color:#9ca9bb;
 font-size:11px;
 margin-bottom:10px
}

.live-label{color:#ff5c5c;font-weight:bold}
.next-label{color:#7ed957;font-weight:bold}
.final-label{color:#9ca9bb;font-weight:bold}

.equipas{
 display:grid;
 grid-template-columns:1fr 65px 1fr;
 align-items:center;
 gap:5px
}

.equipa{text-align:center;font-size:13px;font-weight:bold}
.escudo{width:36px;height:36px;object-fit:contain;display:block;margin:0 auto 5px}
.resultado{text-align:center;font-size:22px;font-weight:900}
.hora{text-align:center;color:#7ed957;font-size:11px;margin-top:5px}

.live-card{
 flex:1 0 100%!important;
 max-width:none!important;
 padding:17px
}
.live-card .escudo{width:48px;height:48px}
.live-card .resultado{font-size:29px}

.vazio{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:12px;
 padding:18px;
 text-align:center;
 color:#9ca9bb
}

/* MENU */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#071326;
 border-top:1px solid #17243a;
 display:flex;
 z-index:30
}
.bottom button{
 background:none;border:0;color:#9ca9bb;font-weight:bold;width:33%;font-size:12px
}
.bottom button.active{color:#7ed957}

/* DETALHE */
.overlay{
 position:fixed;
 inset:0;
 background:#050b16;
 z-index:50;
 overflow:auto
}
.detalhe-header{
 position:sticky;
 top:0;
 background:#071326;
 border-bottom:1px solid #17243a;
 padding:12px;
 z-index:5
}
.voltar{
 background:#0b1627;
 border:1px solid #243653;
 color:#fff;
 border-radius:8px;
 padding:8px 12px;
 font-weight:bold
}
.detalhe{max-width:760px;margin:auto;padding:10px 10px 35px}

.jogo-grande{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:14px;
 padding:18px 10px;
 margin-bottom:12px
}
.jogo-grande .equipas{grid-template-columns:1fr 80px 1fr}
.jogo-grande .escudo{width:55px;height:55px}
.jogo-grande .equipa{font-size:15px}
.bigscore{text-align:center;font-size:30px;font-weight:900}
.estado{text-align:center;color:#7ed957;font-size:12px;margin-top:5px}

/* SECÇÕES */
.secao{
 background:#0b1627;
 border:1px solid #17243a;
 border-radius:13px;
 margin:10px 0;
 padding:12px
}
.secao h3{font-size:15px;margin:0 0 10px}

/* EVENTOS */
.evento{
 display:flex;
 gap:7px;
 padding:6px 0;
 border-bottom:1px solid #17243a;
 font-size:12px
}
.evento:last-child{border:0}
.minuto{color:#7ed957;font-weight:bold;min-width:38px}

/* STATS */
.stats-head,.stat-row{
 display:grid;
 grid-template-columns:58px 1fr 58px;
 text-align:center;
 align-items:center
}
.stats-head{font-size:10px;color:#6f8097}
.stat-row{
 border-top:1px solid #17243a;
 padding:7px 2px;
 font-size:12px
}
.stat-row .nome{font-size:10px;color:#9ca9bb}
.stat-home{text-align:right;font-weight:bold}
.stat-away{text-align:left;font-weight:bold}
.stats-list{max-height:420px;overflow:auto}

/* JOGADORES */
.lista-jogadores{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.jogador{
 background:#071326;
 border:1px solid #17243a;
 border-radius:8px;
 padding:9px;
 font-size:12px
}
.jogador b{color:#7ed957;margin-right:5px}
.subtitulo{color:#9ca9bb;font-size:11px;margin:8px 0}

/* TABELA */
.tabela{
 overflow-x:auto
}
.tabela-head,.tabela-row{
 display:grid;
 grid-template-columns:32px minmax(120px,1fr) 35px 35px 35px 35px 45px;
 gap:4px;
 align-items:center;
 min-width:380px
}
.tabela-head{
 color:#7f8da1;
 font-size:9px;
 padding:7px 4px
}
.tabela-row{
 border-top:1px solid #17243a;
 padding:9px 4px;
 font-size:11px
}
.tabela-row b{font-size:12px}
.pts{color:#7ed957;font-weight:900}

.carregando{text-align:center;color:#9ca9bb;padding:20px}
.erro{text-align:center;color:#ff8f8f;padding:15px}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<main id="app"></main>

<div class="bottom">
<button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ligas=[
{nome:"Portugal",arquivo:"data/primeira-liga.json",codigo:"por.1",icone:"🇵🇹"},
{nome:"Inglaterra",arquivo:"data/premier-league.json",codigo:"eng.1",icone:"🏴"},
{nome:"Espanha",arquivo:"data/la-liga.json",codigo:"esp.1",icone:"🇪🇸"},
{nome:"Itália",arquivo:"data/serie-a.json",codigo:"ita.1",icone:"🇮🇹"},
{nome:"Alemanha",arquivo:"data/bundesliga.json",codigo:"ger.1",icone:"🇩🇪"},
{nome:"Champions League",arquivo:"data/champions-league.json",codigo:"uefa.champions",icone:"🏆"},
{nome:"Liga Europa",arquivo:"data/liga-europa.json",codigo:"uefa.europa",icone:"🏆"},
{nome:"Liga Conferência",arquivo:"data/liga-conferencia.json",codigo:"uefa.europa.conf",icone:"🏆"}
];

let jogos=[];
let ligaSelecionada="Portugal";
let favoritos=JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");

const app=document.getElementById("app");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function logo(u){
return u
?`<img class="escudo" src="${esc(u)}" onerror="this.style.visibility='hidden'">`
:"<div style='height:37px'></div>";
}

function comp(j){return j?.competitions?.[0]||{}}

function nome(c){
return c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
"Equipa";
}

function jogo(j,l){

let c=comp(j);
let cs=c.competitors||[];

let h=cs.find(x=>x.homeAway==="home")||cs[0]||{};
let a=cs.find(x=>x.homeAway==="away")||cs[1]||{};

return{
id:String(j.id),
codigo:l.codigo,
liga:l.nome,
home:{
nome:nome(h),
logo:h?.team?.logo||"",
score:h?.score??"-"
},
away:{
nome:nome(a),
logo:a?.team?.logo||"",
score:a?.score??"-"
},
estado:c?.status?.type?.shortDetail||
c?.status?.type?.detail||
c?.status?.type?.description||"",
state:c?.status?.type?.state||"",
completed:c?.status?.type?.completed===true,
date:j.date||c?.date||j.startDate||""
};
}

async function carregarJogos(){

jogos=[];

for(const l of ligas){

try{

let r=await fetch(l.arquivo+"?_="+Date.now());

if(r.ok){

let d=await r.json();

(d.events||[]).forEach(j=>{
jogos.push(jogo(j,l));
});

}

}catch(e){}

}

mostrarJogos();
}

function botoes(){

return`
<div class="seletor-ligas">

${ligas.map(l=>`

<button class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
onclick="selecionarLiga('${l.nome}')">

<span class="liga-icon">${l.icone}</span>
${esc(l.nome)}

</button>

`).join("")}

</div>`;
}

function selecionarLiga(n){

ligaSelecionada=n;
mostrarJogos();
scrollTo(0,0);

}

function tipoJogo(j){

if(j.completed||j.state==="post")return"final";

if(j.state==="in")return"live";

let s=(j.estado||"").toLowerCase();

if(/ft|final|ended|finished|aet/.test(s))return"final";

if(/1h|2h|ht|live|in progress|ao vivo|intervalo/.test(s))return"live";

let d=Date.parse(j.date);

if(!isNaN(d)&&d<=Date.now()+120000)return"live";

return"future";
}

function horaJogo(j){

let d=Date.parse(j.date);

if(isNaN(d))return"";

return new Date(d).toLocaleTimeString(
"pt-PT",
{hour:"2-digit",minute:"2-digit"}
);
}

function cartao(j,classe=""){

let tipo=tipoJogo(j);

let marca=
tipo==="live"?"🔴 EM DIRETO":
tipo==="future"?"⏰ PRÓXIMO":
"✓ RESULTADO";

return`

<div class="jogo ${classe} ${tipo==="live"?"live":""}"
onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')">

<div class="jogo-top">

<span class="${
tipo==="live"?"live-label":
tipo==="future"?"next-label":
"final-label"
}">

${marca}

</span>

<span>${esc(j.estado)}</span>

</div>

<div class="equipas">

<div class="equipa">
${logo(j.home.logo)}
${esc(j.home.nome)}
</div>

<div>

<div class="resultado">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

${
tipo==="future"
?
`<div class="hora">${horaJogo(j)}</div>`
:""
}

</div>

<div class="equipa">
${logo(j.away.logo)}
${esc(j.away.nome)}
</div>

</div>

</div>`;
}

function faixa(titulo,lista,classe=""){

if(!lista.length)return"";

return`

<h2>${titulo}</h2>

<div class="horizontal ${classe}">

${lista.map(j=>cartao(j,classe)).join("")}

</div>`;
}

function mostrarJogos(){

nav("navJogos");

let l=jogos.filter(j=>j.liga===ligaSelecionada);

let live=l.filter(j=>tipoJogo(j)==="live");
let future=l.filter(j=>tipoJogo(j)==="future");
let final=l.filter(j=>tipoJogo(j)==="final");

app.innerHTML=`

<h2>🌍 Ligas</h2>

${botoes()}

${faixa("🔴 EM DIRETO",live,"live-card")}

${faixa("⏰ PRÓXIMOS JOGOS",future)}

${faixa("✅ RESULTADOS",final)}

${
!l.length
?
`<div class="vazio">Não há jogos disponíveis.</div>`
:""
}

`;
}

function nav(id){

["navJogos","navTabelas","navFav"].forEach(x=>{
document.getElementById(x)
.classList.toggle("active",x===id);
});

}

/* EVENTOS */

function traduzEvento(t){

let s=String(t||"");

const r=[
[/second yellow card/gi,"Segundo cartão amarelo"],
[/yellow card/gi,"Cartão amarelo"],
[/red card/gi,"Cartão vermelho"],
[/substitution/gi,"Substituição"],
[/substituted/gi,"Substituído"],
[/own goal/gi,"Autogolo"],
[/missed penalty/gi,"Penálti falhado"],
[/penalty/gi,"Penálti"],
[/offside/gi,"Fora de jogo"],
[/handball/gi,"Mão na bola"],
[/free kick/gi,"Livre"],
[/corner/gi,"Canto"],
[/shot on target/gi,"Remate à baliza"],
[/blocked shot/gi,"Remate bloqueado"],
[/shot/gi,"Remate"],
[/save/gi,"Defesa"],
[/assist/gi,"assistência"],
[/goal/gi,"Golo"],
[/foul/gi,"Falta"],
[/var/gi,"VAR"],
[/kick off/gi,"Pontapé de saída"],
[/half time/gi,"Intervalo"],
[/full time/gi,"Final do jogo"]
];

r.forEach(([a,b])=>s=s.replace(a,b));

return s;
}

function extrairEventos(d){

let out=[];
let seen=new Set();

let src=[
...(d.plays||[]),
...(d.keyEvents||[]),
...(d.scoringPlays||[])
];

for(let e of src){

let raw=e?.text||
e?.shortText||
e?.description||
e?.type?.text||
"Evento";

let s=((e?.type?.text||"")+" "+raw).toLowerCase();

if(!/goal|yellow|red|substitut|assist|penalty|offside|foul|handball|corner|free kick|shot|save|blocked|var|kick off|half time|full time/.test(s))continue;

let k=JSON.stringify([e?.id,e?.clock?.displayValue,raw]);

if(seen.has(k))continue;

seen.add(k);

let i=/yellow/.test(s)?"🟨":
/red/.test(s)?"🟥":
/substitut/.test(s)?"🔄":
/goal/.test(s)?"⚽":"•";

out.push({
m:e?.clock?.displayValue||e?.period?.displayValue||"",
t:traduzEvento(raw),
i
});
}

return out;
}

/* ESTATÍSTICAS */

function txt(v){

return typeof v==="object"
?(v?.displayValue??v?.value??v?.text??"")
:String(v??"");

}

function extrairStats(d){

let grupos=[];

function add(team,ss){

if(!team||!Array.isArray(ss))return;

let id=team?.id||
team?.team?.id||
team?.displayName||
team?.team?.displayName;

let g=grupos.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:team?.displayName||
team?.name||
team?.team?.displayName||
team?.team?.name||
"Equipa",
s:[]
};

grupos.push(g);
}

ss.forEach(x=>{

let n=x?.displayName||
x?.shortDisplayName||
x?.name||
x?.label||
x?.description;

if(n)g.s.push({
n,
v:txt(x?.displayValue??x?.value??x?.display)
});

});

}

(d.boxscore?.teams||[]).forEach(t=>
add(t.team||t,t.statistics||t.stats)
);

(d.header?.competitions?.[0]?.competitors||
d.competitions?.[0]?.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

(d.competitors||[])
.forEach(c=>add(c.team||c,c.statistics));

if(grupos.length<2)return[];

let m=new Map();

grupos.forEach((g,gi)=>{

g.s.forEach(x=>{

let k=x.n.toLowerCase();

if(!m.has(k))
m.set(k,{n:x.n,h:"-",a:"-"});

let q=m.get(k);

if(gi===0)q.h=x.v;
else if(gi===1)q.a=x.v;

});

});

return[...m.values()];
}

/* PLANTEL */

function extrairPlantel(d){

let gs=[];

function add(team,arr){

if(!team||!Array.isArray(arr))return;

let id=team?.id||
team?.team?.id||
team?.displayName;

let g=gs.find(x=>String(x.id)===String(id));

if(!g){

g={
id,
nome:team?.displayName||
team?.name||
team?.team?.displayName||
"Equipa",
p:[]
};

gs.push(g);
}

arr.forEach(x=>{

let a=x?.athlete||x?.player||x;

if(!a?.displayName&&!a?.fullName)return;

let n=a.displayName||
a.fullName||
a.shortName;

if(g.p.some(q=>q.n===n))return;

g.p.push({
n,
num:a.jersey||x.jersey||a.uniformNumber||"",
pos:a?.position?.abbreviation||
a?.position?.displayName||
x?.position?.displayName||
"",
tit:x.starter===true||x.starter==="true"
});

});

}

(d.rosters||[]).forEach(r=>
add(r.team||r,r.roster||r.athletes||r.players)
);

(d.boxscore?.players||[]).forEach(g=>
add(g.team||g,g.statistics||g.athletes||g.roster||g.players)
);

(d.header?.competitions?.[0]?.competitors||[])
.forEach(c=>
add(c.team||c,c.roster||c.athletes||c.players)
);

return gs.filter(g=>g.p.length);
}

function blocoEventos(a){

return`

<div class="secao">

<h3>⚽ Golos e eventos</h3>

${
a.length
?
a.map(e=>`

<div class="evento">

<span class="minuto">${esc(e.m)}</span>

<span>${e.i} ${esc(e.t)}</span>

</div>

`).join("")
:
`<div class="vazio">Sem eventos disponíveis.</div>`
}

</div>`;
}

function blocoStats(a){

return`

<div class="secao">

<h3>📊 Estatísticas</h3>

${
a.length
?
`

<div class="stats-head">
<span>Casa</span>
<span>ESTAT.</span>
<span>Fora</span>
</div>

<div class="stats-list">

${a.map(x=>`

<div class="stat-row">

<div class="stat-home">${esc(x.h)}</div>

<div class="nome">${esc(x.n)}</div>

<div class="stat-away">${esc(x.a)}</div>

</div>

`).join("")}

</div>
`
:
`<div class="vazio">Estatísticas não disponíveis.</div>`
}

</div>`;
}

function blocoPlantel(gs){

if(!gs.length)return"";

return`

<div class="secao">

<h3>👥 Equipas</h3>

${gs.map(g=>{

let tit=g.p.filter(x=>x.tit);
let sup=g.p.filter(x=>!x.tit);

return`

<div style="margin-bottom:18px">

<b>${esc(g.nome)}</b>

${
tit.length
?
`
<div class="subtitulo">🟢 TITULARES</div>

<div class="lista-jogadores">

${tit.map(p=>`

<div class="jogador">

<b>${esc(p.num)}</b>
${esc(p.n)}

${
p.pos
?
`<small style="display:block;color:#9ca9bb">
${esc(p.pos)}
</small>`
:""
}

</div>

`).join("")}

</div>
`
:""
}

${
sup.length
?
`
<div class="subtitulo">🔵 SUPLENTES</div>

<div class="lista-jogadores">

${sup.map(p=>`

<div class="jogador">

<b>${esc(p.num)}</b>
${esc(p.n)}

${
p.pos
?
`<small style="display:block;color:#9ca9bb">
${esc(p.pos)}
</small>`
:""
}

</div>

`).join("")}

</div>
`
:""
}

</div>`;

}).join("")}

</div>`;
}

/* DETALHE */

async function abrirDetalhe(id,codigo){

let j=jogos.find(x=>x.id===id);

if(!j)return;

let o=document.createElement("div");

o.className="overlay";

o.innerHTML=`

<div class="detalhe-header">

<button class="voltar"
onclick="this.closest('.overlay').remove()">
← Voltar
</button>

</div>

<div class="detalhe">

<div class="jogo-grande">

<div class="equipas">

<div class="equipa">

${logo(j.home.logo)}
${esc(j.home.nome)}

</div>

<div>

<div class="bigscore">
${esc(j.home.score)} - ${esc(j.away.score)}
</div>

<div class="estado">
${esc(j.estado)}
</div>

</div>

<div class="equipa">

${logo(j.away.logo)}
${esc(j.away.nome)}

</div>

</div>

</div>

<div class="carregando">
A carregar informações...
</div>

</div>`;

document.body.appendChild(o);

try{

let r=await fetch(
"https://site.api.espn.com/apis/site/v2/sports/soccer/"+
encodeURIComponent(codigo)+
"/summary?event="+
encodeURIComponent(id)+
"&_="+Date.now()
);

if(!r.ok)throw 0;

let d=await r.json();

o.querySelector(".detalhe")
.insertAdjacentHTML(
"beforeend",
blocoEventos(extrairEventos(d))+
blocoStats(extrairStats(d))+
blocoPlantel(extrairPlantel(d))
);

o.querySelector(".carregando").remove();

}catch(e){

o.querySelector(".carregando").outerHTML=
`<div class="erro">Não foi possível carregar os dados.</div>`;

}

}

/* CLASSIFICAÇÃO */

function criarTabela(lista){

let tabela={};

lista.forEach(j=>{

if(tipoJogo(j)!=="final")return;

let hs=parseInt(j.home.score);
let as=parseInt(j.away.score);

if(isNaN(hs)||isNaN(as))return;

let hn=j.home.nome;
let an=j.away.nome;

if(!tabela[hn])
tabela[hn]={nome:hn,j:0,v:0,e:0,d:0,gf:0,ga:0,p:0};

if(!tabela[an])
tabela[an]={nome:an,j:0,v:0,e:0,d:0,gf:0,ga:0,p:0};

let h=tabela[hn];
let a=tabela[an];

h.j++;
a.j++;

h.gf+=hs;
h.ga+=as;

a.gf+=as;
a.ga+=hs;

if(hs>as){
h.v++;
a.d++;
h.p+=3;
}else if(hs<as){
a.v++;
h.d++;
a.p+=3;
}else{
h.e++;
a.e++;
h.p++;
a.p++;
}

});

return Object.values(tabela).sort((a,b)=>
b.p-a.p||
(b.gf-b.ga)-(a.gf-a.ga)||
b.gf-a.gf
);

}

function tabelaHTML(lista){

if(!lista.length)
return`<div class="vazio">
Ainda não existem resultados suficientes para criar a classificação.
</div>`;

return`

<div class="secao tabela">

<div class="tabela-head">
<span>#</span>
<span>Equipa</span>
<span>J</span>
<span>V</span>
<span>E</span>
<span>D</span>
<span>PTS</span>
</div>

${lista.map((x,i)=>`

<div class="tabela-row">

<b>${i+1}</b>

<span>${esc(x.nome)}</span>

<span>${x.j}</span>
<span>${x.v}</span>
<span>${x.e}</span>
<span>${x.d}</span>

<span class="pts">${x.p}</span>

</div>

`).join("")}

</div>`;
}

function mostrarTabelas(){

nav("navTabelas");

let l=jogos.filter(j=>j.liga===ligaSelecionada);

let tabela=criarTabela(l);

app.innerHTML=`

<h2>🏆 Classificação</h2>

${botoes()}

<div class="secao">

<h3>🏆 ${esc(ligaSelecionada)}</h3>

${tabelaHTML(tabela)}

</div>

`;
}
