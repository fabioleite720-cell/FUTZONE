<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:80px
}

header{
background:#000;
border-bottom:1px solid #222;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:28px;
font-weight:900;
color:#168cff
}

.logo span{color:#fff}

.container{
padding:15px;
max-width:900px;
margin:auto
}

button{
border:0;
border-radius:10px;
padding:10px 14px;
background:#168cff;
color:#fff;
font-weight:bold
}

.filters{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 0
}

.filters button{
white-space:nowrap;
background:#151515;
border:1px solid #333
}

.filters button.active{
background:#168cff;
border-color:#168cff
}

.card{
background:#101010;
border:1px solid #252525;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.league{
color:#168cff;
font-size:13px;
font-weight:bold;
margin-bottom:8px
}

.teams{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:10px
}

.team{
font-weight:bold;
cursor:pointer
}

.team:last-child{text-align:right}

.team:hover{color:#168cff}

.team-logo{
width:35px;
height:35px;
object-fit:contain;
vertical-align:middle;
margin-right:7px
}

.score{
font-size:20px;
font-weight:900;
white-space:nowrap
}

.status{
font-size:12px;
color:#aaa;
margin-top:8px
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#080808;
border-top:1px solid #252525;
display:flex;
justify-content:space-around;
align-items:center;
z-index:30
}

.nav button{
background:none;
color:#aaa;
padding:8px
}

.nav button.active{color:#168cff}

.back{
margin-bottom:15px;
background:#202020
}

.plantel-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.player{
background:#151515;
border:1px solid #292929;
border-radius:14px;
padding:12px;
text-align:center;
cursor:pointer
}

.player:hover{
border-color:#168cff;
transform:translateY(-2px)
}

.player img{
width:80px;
height:80px;
object-fit:cover;
border-radius:50%;
background:#222;
margin-bottom:8px
}

.player-name{
font-weight:bold;
font-size:14px
}

.player-info{
color:#999;
font-size:12px;
margin-top:5px
}

.player-profile{
text-align:center;
padding:10px
}

.player-profile img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
background:#181818;
border:3px solid #168cff
}

.position{
color:#168cff;
font-weight:bold
}

.info-box{
background:#111;
border:1px solid #292929;
border-radius:14px;
margin-top:20px;
overflow:hidden
}

.info-row{
display:flex;
justify-content:space-between;
padding:14px;
border-bottom:1px solid #222
}

.info-row:last-child{border-bottom:0}

.info-label{color:#888}

.info-value{font-weight:bold}

.empty{
text-align:center;
color:#777;
padding:30px
}

.table-wrap{
overflow-x:auto
}

table{
width:100%;
min-width:430px;
border-collapse:collapse;
background:#101010
}

th,td{
padding:10px 6px;
border-bottom:1px solid #252525;
text-align:center;
font-size:13px
}

th{color:#168cff}

@media(max-width:500px){
.plantel-grid{grid-template-columns:repeat(2,1fr)}
.player img{width:70px;height:70px}
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
</header>

<div class="container" id="app"></div>

<div class="nav">
<button id="navJogos" onclick="mostrarJogos()">⚽<br>Jogos</button>
<button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
<button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;

const ligas=[
{nome:"Portugal",arquivo:"data/primeira-liga.json"},
{nome:"Inglaterra",arquivo:"data/premier-league.json"},
{nome:"Espanha",arquivo:"data/la-liga.json"},
{nome:"Itália",arquivo:"data/serie-a.json"},
{nome:"Alemanha",arquivo:"data/bundesliga.json"}
];

/* SEGURANÇA */

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function normalizar(texto){
return String(texto||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]/g,"");
}

/* EQUIPAS */

function obterCompeticao(j){
return j?.competitions?.[0] || {};
}

function obterEquipas(j){

let c=obterCompeticao(j).competitors;

if(!Array.isArray(c))
c=j?.competitors;

if(!Array.isArray(c))
c=[];

return{
home:c.find(x=>x.homeAway==="home")||c[0]||{},
away:c.find(x=>x.homeAway==="away")||c[1]||{}
};
}

function nomeEquipa(c){

return(
c?.team?.displayName||
c?.team?.shortDisplayName||
c?.team?.name||
c?.displayName||
c?.name||
null
);
}

function nomeEquipaSeguro(c,j,home){

const nome=nomeEquipa(c);

if(nome)return nome;

if(j?.name){

const partes=j.name.split(" at ");

if(partes.length===2)
return home?partes[1]:partes[0];

}

return"Equipa";
}

function idEquipa(c){

return(
c?.team?.id||
c?.id||
null
);
}

function logoEquipa(c){

return(
c?.team?.logo||
c?.team?.logos?.[0]?.href||
c?.logo||
c?.logos?.[0]?.href||
""
);
}

/* JOGOS */

function resultado(c){

if(c?.score===undefined||c?.score===null)
return"-";

if(typeof c.score==="object")
return c.score.displayValue||c.score.value||"-";

return c.score;
}

function estadoJogo(j){

const s=obterCompeticao(j)?.status?.type;

if(s?.state==="in")
return"LIVE";

if(s?.completed||s?.state==="post")
return"RESULTADO";

return"PRÓXIMO";
}

function dataJogo(j){

if(!j?.date)return"";

try{

return new Date(j.date).toLocaleString(
"pt-PT",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}catch(e){

return j.date;

}
}

/* CARREGAR JOGOS */

async function carregar(){

jogos=[];

for(const liga of ligas){

try{

const r=await fetch(
liga.arquivo+"?v="+Date.now()
);

if(!r.ok)continue;

const d=await r.json();

let lista=[];

if(Array.isArray(d?.events))
lista=d.events;
else if(Array.isArray(d))
lista=d;

lista.forEach(j=>{
j.__liga=liga.nome;
jogos.push(j);
});

}catch(e){

console.log("Erro jogos",liga.arquivo,e);

}

}

mostrarJogos();

}

/* MOSTRAR JOGOS */

function mostrarJogos(){

document.getElementById("navJogos").classList.add("active");
document.getElementById("navTabelas").classList.remove("active");
document.getElementById("navFav").classList.remove("active");

document.getElementById("app").innerHTML=`

<h2>⚽ Jogos</h2>

<div class="filters">

${
["Todos","LIVE","Próximos","Resultados"].map(x=>`

<button
class="${filtroAtual===x?"active":""}"
onclick="filtroAtual='${x}';mostrarJogos()">

${x}

</button>

`).join("")
}

</div>

<div class="filters">

${
["Todos",...ligas.map(x=>x.nome)].map(x=>`

<button
class="${ligaAtual===x?"active":""}"
onclick="ligaAtual='${x}';mostrarJogos()">

${x}

</button>

`).join("")
}

</div>

<div id="lista"></div>

`;

const lista=jogos.filter(j=>{

const ligaOK=
ligaAtual==="Todos"||
j.__liga===ligaAtual;

const estado=estadoJogo(j);

const filtroOK=
filtroAtual==="Todos"||
(filtroAtual==="LIVE"&&estado==="LIVE")||
(filtroAtual==="Próximos"&&estado==="PRÓXIMO")||
(filtroAtual==="Resultados"&&estado==="RESULTADO");

return ligaOK&&filtroOK;

});

const div=document.getElementById("lista");

if(!lista.length){

div.innerHTML=
'<div class="empty">Não há jogos disponíveis.</div>';

return;

}

div.innerHTML=lista.map(jogoCard).join("");

}

/* CARTÃO DO JOGO */

function jogoCard(j){

const e=obterEquipas(j);

const hn=nomeEquipaSeguro(e.home,j,true);
const an=nomeEquipaSeguro(e.away,j,false);

const hid=idEquipa(e.home);
const aid=idEquipa(e.away);

const hl=logoEquipa(e.home);
const al=logoEquipa(e.away);

const estado=estadoJogo(j);

return`

<div class="card">

<div class="league">
${esc(j.__liga)}
</div>

<div class="teams">

<div class="team"
onclick="abrirEquipaPorId(
'${esc(hid||"")}',
'${esc(hn)}',
'${esc(j.__liga)}',
'${esc(hl)}'
)">

${
hl
?`<img class="team-logo" src="${esc(hl)}">`
:""
}

${esc(hn)}

</div>

<div class="score">

${esc(resultado(e.home))}
-
${esc(resultado(e.away))}

</div>

<div class="team"
onclick="abrirEquipaPorId(
'${esc(aid||"")}',
'${esc(an)}',
'${esc(j.__liga)}',
'${esc(al)}'
)">

${
al
?`<img class="team-logo" src="${esc(al)}">`
:""
}

${esc(an)}

</div>

</div>

<div class="status">

${
estado==="LIVE"
?"🔴 AO VIVO"
:estado
}

${
j.date
?" • "+esc(dataJogo(j))
:""
}

</div>

</div>

`;

}

/* EQUIPA */

function abrirEquipaPorId(id,name,league,logo){

equipaAtual={
id:id,
name:name,
league:league,
logo:logo
};

mostrarEquipa();

}

async function mostrarEquipa(){

document.getElementById("app").innerHTML=`

<button class="back" id="voltar">
← Voltar
</button>

<div style="text-align:center">

${
equipaAtual.logo
?`
<img
src="${esc(equipaAtual.logo)}"
style="width:80px;height:80px;object-fit:contain">
`
:""
}

<h2>${esc(equipaAtual.name)}</h2>

<div class="league">
${esc(equipaAtual.league)}
</div>

</div>

<h3>👥 Plantel</h3>

<div id="plantel">

<div class="empty">
A carregar plantel...
</div>

</div>

<h3>⚽ Jogos</h3>

<div id="jogos-equipa"></div>

`;

document.getElementById("voltar").onclick=mostrarJogos;

const relacionados=jogos.filter(j=>{

const e=obterEquipas(j);

return(
String(idEquipa(e.home))===String(equipaAtual.id)||
String(idEquipa(e.away))===String(equipaAtual.id)
);

});

document.getElementById("jogos-equipa").innerHTML=
relacionados.length
?relacionados.map(jogoCard).join("")
:'<div class="empty">Sem jogos encontrados.</div>';

await carregarPlantel();

}

/* =========================
   PLANTÉIS
========================= */

async function carregarPlantel(){

try{

const resposta=await fetch(
"data/planteis.json?v="+Date.now()
);

if(!resposta.ok)
throw new Error("Não foi possível carregar planteis.json");

const dados=await resposta.json();

let plantel=null;

/* TENTAR PELO ID */

if(dados && !Array.isArray(dados)){

const entrada=dados[String(equipaAtual.id)];

if(entrada){

plantel=
entrada.players||
entrada.roster||
entrada.squad||
entrada;

}

}

/* TENTAR PELO NOME */

if(!plantel && dados && !Array.isArray(dados)){

const nomeAtual=normalizar(equipaAtual.name);

const chaves=Object.keys(dados);

for(const chave of chaves){

const item=dados[chave];

if(!item)continue;

const nome=normalizar(
item.name||
item.strTeam||
""
);

if(
nome &&
(
nome===nomeAtual||
nome.includes(nomeAtual)||
nomeAtual.includes(nome)
)
){

plantel=
item.players||
item.roster||
item.squad||
[];

break;

}

}

}

/* ARRAY */

if(Array.isArray(dados) && !plantel){

const nomeAtual=normalizar(equipaAtual.name);

const item=dados.find(x=>{

const nome=normalizar(
x?.name||
x?.strTeam||
""
);

return(
String(x?.id)===String(equipaAtual.id)||
nome===nomeAtual
);

});

if(item){

plantel=
item.players||
item.roster||
item.squad||
[];

}

}

/* SEM PLANTEL */

if(!plantel){

document.getElementById("plantel").innerHTML=
'<div class="empty">Plantel não disponível.</div>';

return;

}

if(!Array.isArray(plantel))
plantel=Object.values(plantel);

if(!plantel.length){

document.getElementById("plantel").innerHTML=
'<div class="empty">Plantel vazio.</div>';

return;

}

/* CRIAR CARTÕES */

let html='<div class="plantel-grid">';

plantel.forEach((p,i)=>{

const nome=
p.name||
p.strPlayer||
p.displayName||
p.fullName||
"Jogador";

const numero=
p.number||
p.strNumber||
p.jersey||
p.jerseyNumber||
"-";

const posicao=
p.position||
p.strPosition||
p.positionName||
"-";

const foto=
p.photo||
p.strThumb||
p.strCutout||
p.headshot||
p.image||
"";

html+=`

<div class="player"
onclick='abrirJogador(${JSON.stringify({
id:p.id||p.idPlayer||i,
name:nome,
number:numero,
position:posicao,
age:p.age||p.dateBorn||"-",
nationality:p.nationality||p.strNationality||p.country||"-",
photo:foto
})})'>

${
foto
?`
<img
src="${esc(foto)}"
onerror="this.style.display='none'">
`
:`
<div style="
width:80px;
height:80px;
border-radius:50%;
background:#222;
margin:auto auto 8px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px">
⚽
</div>
`
}

<div class="player-name">
${esc(nome)}
</div>

<div class="player-info">
#${esc(numero)} • ${esc(posicao)}
</div>

</div>

`;

});

html+='</div>';

document.getElementById("plantel").innerHTML=html;

}catch(e){

console.log("Erro plantel:",e);

const div=document.getElementById("plantel");

if(div){

div.innerHTML=
'<div class="empty">Não foi possível carregar o plantel.</div>';

}

}

}

/* JOGADOR */

function abrirJogador(p){

document.getElementById("app").innerHTML=`

<button class="back" id="voltarJogador">
← Voltar ao plantel
</button>

<div class="player-profile">

${
p.photo
?`
<img
src="${esc(p.photo)}"
onerror="this.style.display='none'">
`
:`
<div style="
width:150px;
height:150px;
border-radius:50%;
background:#181818;
border:3px solid #168cff;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:60px">
⚽
</div>
`
}

<h1>${esc(p.name)}</h1>

<div class="position">
${esc(p.position)}
</div>

<div class="info-box">

<div class="info-row">
<span class="info-label">Número</span>
<span class="info-value">
#${esc(p.number)}
</span>
</div>

<div class="info-row">
<span class="info-label">Posição</span>
<span class="info-value">
${esc(p.position)}
</span>
</div>

<div class="info-row">
<span class="info-label">Idade</span>
<span class="info-value">
${esc(p.age)}
</span>
</div>

<div class="info-row">
<span class="info-label">Nacionalidade</span>
<span class="info-value">
${esc(p.nationality)}
</span>
</div>

</div>

</div>

`;

document.getElementById("voltarJogador").onclick=mostrarEquipa;

}

/* CLASSIFICAÇÕES */

function encontrarListaClassificacao(obj){

if(!obj)
return null;

if(Array.isArray(obj)){

const pareceTabela=obj.some(x=>
x&&(
x.team||
x.stats||
x.teamId||
x.points!==undefined||
x.wins!==undefined||
x.losses!==undefined
)
);

if(pareceTabela)
return obj;

for(const item of obj){

const resultado=
encontrarListaClassificacao(item);

if(resultado)
return resultado;

}

return null;

}

if(typeof
