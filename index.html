<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}
header{
 background:#000;
 border-bottom:1px solid #222;
 padding:18px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:20
}
.logo{font-size:28px;font-weight:900;color:#168cff}
.logo span{color:#fff}

.container{padding:15px;max-width:900px;margin:auto}

button{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:#168cff;
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:10px 0
}
.filters button{
 white-space:nowrap;
 background:#151515;
 border:1px solid #333
}
.filters button.active{
 background:#168cff;
 border-color:#168cff
}

.card{
 background:#101010;
 border:1px solid #252525;
 border-radius:14px;
 padding:14px;
 margin-bottom:12px
}

.league{
 color:#168cff;
 font-size:13px;
 font-weight:bold;
 margin-bottom:8px
}

.teams{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.team{
 font-weight:bold;
 cursor:pointer
}
.team:hover{color:#168cff}

.score{
 font-size:20px;
 font-weight:900
}

.status{
 font-size:12px;
 color:#aaa;
 margin-top:8px
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#080808;
 border-top:1px solid #252525;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:30
}
.nav button{
 background:none;
 color:#aaa;
 padding:8px
}
.nav button.active{color:#168cff}

h2{margin-top:5px}

.back{
 margin-bottom:15px;
 background:#202020
}

/* PLANTEL */

.plantel-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.player{
 background:#151515;
 border:1px solid #292929;
 border-radius:14px;
 padding:12px;
 text-align:center;
 cursor:pointer;
 transition:.15s
}
.player:hover{
 border-color:#168cff;
 transform:translateY(-2px)
}

.player img{
 width:80px;
 height:80px;
 object-fit:cover;
 border-radius:50%;
 background:#222;
 margin-bottom:8px
}

.player-name{
 font-weight:bold;
 font-size:14px
}

.player-info{
 color:#999;
 font-size:12px;
 margin-top:5px
}

/* FICHA DO JOGADOR */

.player-profile{
 text-align:center;
 padding:10px
}

.player-profile img{
 width:150px;
 height:150px;
 border-radius:50%;
 object-fit:cover;
 background:#181818;
 border:3px solid #168cff
}

.player-profile h1{
 margin:15px 0 5px
}

.player-profile .position{
 color:#168cff;
 font-weight:bold
}

.info-box{
 background:#111;
 border:1px solid #292929;
 border-radius:14px;
 margin-top:20px;
 overflow:hidden
}

.info-row{
 display:flex;
 justify-content:space-between;
 padding:14px;
 border-bottom:1px solid #222
}
.info-row:last-child{border-bottom:0}
.info-label{color:#888}
.info-value{font-weight:bold}

.empty{
 text-align:center;
 color:#777;
 padding:30px
}

table{
 width:100%;
 border-collapse:collapse;
 background:#101010;
 border-radius:12px;
 overflow:hidden
}
th,td{
 padding:10px 6px;
 border-bottom:1px solid #252525;
 text-align:center;
 font-size:13px
}
th{color:#168cff}

@media(max-width:500px){
 .plantel-grid{grid-template-columns:repeat(2,1fr)}
 .player img{width:70px;height:70px}
}
</style>
</head>

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>
</header>

<div class="container" id="app"></div>

<div class="nav">
 <button id="navJogos" onclick="mostrarJogos()">⚽<br>Jogos</button>
 <button id="navTabelas" onclick="mostrarTabelas()">📊<br>Tabelas</button>
 <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

let jogos=[];
let ligaAtual="Todos";
let filtroAtual="Todos";
let equipaAtual=null;

const ligas=[
 {nome:"Portugal",arquivo:"data/primeira-liga.json"},
 {nome:"Inglaterra",arquivo:"data/premier-league.json"},
 {nome:"Espanha",arquivo:"data/la-liga.json"},
 {nome:"Itália",arquivo:"data/serie-a.json"},
 {nome:"Alemanha",arquivo:"data/bundesliga.json"}
];

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

async function carregar(){

 jogos=[];

 for(const liga of ligas){
  try{
   const r=await fetch(liga.arquivo+"?v="+Date.now());
   if(!r.ok)continue;

   const d=await r.json();

   let lista=[];

   if(Array.isArray(d)) lista=d;
   else if(Array.isArray(d.events)) lista=d.events;
   else if(Array.isArray(d.games)) lista=d.games;
   else if(Array.isArray(d.jogos)) lista=d.jogos;

   lista.forEach(j=>{
    j.__liga=liga.nome;
    jogos.push(j);
   });

  }catch(e){}
 }

 mostrarJogos();
}

function obterEquipas(j){

 let home=j.homeTeam||j.home||j.teams?.[0]||{};
 let away=j.awayTeam||j.away||j.teams?.[1]||{};

 return {
  home:home,
  away:away
 };
}

function nomeEquipa(t){
 return t.name||t.displayName||t.shortDisplayName||"Equipa";
}

function idEquipa(t){
 return t.id||t.teamId||t.uid||null;
}

function dataJogo(j){
 return j.date||j.startDate||j.start_time||"";
}

function estadoJogo(j){

 let s=(j.status?.type?.name||j.status||"").toString().toLowerCase();

 if(
  s.includes("live")||
  s.includes("in_progress")||
  s.includes("progress")
 ) return "LIVE";

 if(
  s.includes("final")||
  s.includes("complete")||
  s.includes("finished")
 ) return "RESULTADO";

 return "PRÓXIMO";
}

function mostrarJogos(){

 equipaAtual=null;

 document.getElementById("navJogos").classList.add("active");
 document.getElementById("navTabelas").classList.remove("active");
 document.getElementById("navFav").classList.remove("active");

 let html=`
 <h2>Jogos</h2>

 <div class="filters">
  ${["Todos","LIVE","Próximos","Resultados"].map(x=>
   `<button class="${filtroAtual===x?"active":""}"
    onclick="filtroAtual='${x}';mostrarJogos()">${x}</button>`
  ).join("")}
 </div>

 <div class="filters">
  ${["Todos",...ligas.map(x=>x.nome)].map(x=>
   `<button class="${ligaAtual===x?"active":""}"
    onclick="ligaAtual='${x}';mostrarJogos()">${x}</button>`
  ).join("")}
 </div>

 <div id="lista"></div>
 `;

 document.getElementById("app").innerHTML=html;

 let lista=jogos.filter(j=>{
  let okLiga=ligaAtual==="Todos"||j.__liga===ligaAtual;

  let estado=estadoJogo(j);

  let okFiltro=
   filtroAtual==="Todos"||
   (filtroAtual==="LIVE"&&estado==="LIVE")||
   (filtroAtual==="Próximos"&&estado==="PRÓXIMO")||
   (filtroAtual==="Resultados"&&estado==="RESULTADO");

  return okLiga&&okFiltro;
 });

 const div=document.getElementById("lista");

 if(!lista.length){
  div.innerHTML='<div class="empty">Não há jogos disponíveis.</div>';
  return;
 }

 div.innerHTML=lista.map(jogoCard).join("");
}

function jogoCard(j){

 let e=obterEquipas(j);

 let h=nomeEquipa(e.home);
 let a=nomeEquipa(e.away);

 let hid=idEquipa(e.home);
 let aid=idEquipa(e.away);

 let estado=estadoJogo(j);

 let hs=e.home.score??e.home.scoreValue??j.homeScore??"-";
 let as=e.away.score??e.away.scoreValue??j.awayScore??"-";

 if(estado==="PRÓXIMO"){
  hs="-";as="-";
 }

 return `
 <div class="card">

  <div class="league">${esc(j.__liga)}</div>

  <div class="teams">

   <div class="team"
    onclick='abrirEquipa(${JSON.stringify({
     id:hid,name:h,league:j.__liga
    })})'>
    ${esc(h)}
   </div>

   <div class="score">${esc(hs)} - ${esc(as)}</div>

   <div class="team"
    onclick='abrirEquipa(${JSON.stringify({
     id:aid,name:a,league:j.__liga
    })})'>
    ${esc(a)}
   </div>

  </div>

  <div class="status">${esc(estado)} ${dataJogo(j)? "• "+esc(dataJogo(j)):""}</div>

 </div>
 `;
}

/* EQUIPA */

function abrirEquipa(e){

 equipaAtual=e;

 document.getElementById("navJogos").classList.add("active");
 document.getElementById("navTabelas").classList.remove("active");
 document.getElementById("navFav").classList.remove("active");

 mostrarEquipa();
}

async function mostrarEquipa(){

 const app=document.getElementById("app");

 app.innerHTML=`
 <button class="back" id="voltarEquipa">← Voltar</button>

 <h2>${esc(equipaAtual.name)}</h2>
 <div class="league">${esc(equipaAtual.league||"")}</div>

 <h3>👥 Plantel</h3>

 <div id="plantel">
  <div class="empty">A carregar plantel...</div>
 </div>

 <h3>⚽ Jogos da equipa</h3>
 <div id="jogos-equipa"></div>
 `;

 document.getElementById("voltarEquipa").onclick=mostrarJogos;

 /* JOGOS */

 const relacionados=jogos.filter(j=>{

  const e=obterEquipas(j);

  return String(idEquipa(e.home))===String(equipaAtual.id)||
         String(idEquipa(e.away))===String(equipaAtual.id);

 });

 const jogosDiv=document.getElementById("jogos-equipa");

 if(relacionados.length){
  jogosDiv.innerHTML=relacionados.map(jogoCard).join("");
 }else{
  jogosDiv.innerHTML='<div class="empty">Sem jogos encontrados.</div>';
 }

 /* PLANTEL */

 try{

  const r=await fetch("data/planteis.json?v="+Date.now());

  if(!r.ok)throw new Error("plantel");

  const dados=await r.json();

  let plantel=null;

  /*
   Aceita:
   {
     "12345":[...]
   }

   ou:
   {
     "teams":[...]
   }

   ou um array de equipas.
  */

  if(!Array.isArray(dados)){

   plantel=dados[String(equipaAtual.id)];

   if(!plantel && dados.teams){

    const equipa=dados.teams.find(x=>
     String(x.id)===String(equipaAtual.id)
    );

    plantel=equipa?.players||equipa?.roster;
   }

  }else{

   const equipa=dados.find(x=>
    String(x.id)===String(equipaAtual.id)
   );

   plantel=equipa?.players||equipa?.roster;
  }

  if(!plantel){

   document.getElementById("plantel").innerHTML=
   `<div class="empty">
    Plantel não disponível para esta equipa.
   </div>`;

   return;
  }

  if(!Array.isArray(plantel)){
   plantel=Object.values(plantel);
  }

  document.getElementById("plantel").innerHTML=`

   <div class="plantel-grid">

    ${plantel.map((p,i)=>{

     const jogador={
      id:p.id||p.playerId||i,
      name:p.name||p.displayName||p.fullName||"Jogador",
      number:p.number||p.jersey||p.jerseyNumber||"-",
      position:p.position||p.positionName||"—",
      age:p.age||"—",
      nationality:p.nationality||p.country||"—",
      photo:p.photo||p.headshot||p.image||""
     };

     return `
      <div class="player"
       onclick='abrirJogador(${JSON.stringify(jogador)})'>

       ${
        jogador.photo
        ? `<img src="${esc(jogador.photo)}" alt="">`
        : `<div style="
            width:80px;
            height:80px;
            border-radius:50%;
            background:#222;
            margin:auto auto 8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px">⚽</div>`
       }

       <div class="player-name">
        ${esc(jogador.name)}
       </div>

       <div class="player-info">
        #${esc(jogador.number)} • ${esc(jogador.position)}
       </div>

      </div>
     `;

    }).join("")}

   </div>
  `;

 }catch(e){

  document.getElementById("plantel").innerHTML=
  `<div class="empty">
   Não foi possível carregar o plantel.
  </div>`;

 }
}

/* JOGADOR */

function abrirJogador(p){

 const app=document.getElementById("app");

 app.innerHTML=`

 <button class="back" id="voltarJogador">
  ← Voltar ao plantel
 </button>

 <div class="player-profile">

  ${
   p.photo
   ? `<img src="${esc(p.photo)}" alt="">`
   : `<div style="
       width:150px;
       height:150px;
       border-radius:50%;
       background:#181818;
       border:3px solid #168cff;
       margin:auto;
       display:flex;
       align-items:center;
       justify-content:center;
       font-size:60px">⚽</div>`
  }

  <h1>${esc(p.name)}</h1>

  <div class="position">
   ${esc(p.position)}
  </div>

  <div class="info-box">

   <div class="info-row">
    <span class="info-label">Número</span>
    <span class="info-value">#${esc(p.number)}</span>
   </div>

   <div class="info-row">
    <span class="info-label">Posição</span>
    <span class="info-value">${esc(p.position)}</span>
   </div>

   <div class="info-row">
    <span class="info-label">Idade</span>
    <span class="info-value">${esc(p.age)}</span>
   </div>

   <div class="info-row">
    <span class="info-label">Nacionalidade</span>
    <span class="info-value">${esc(p.nationality)}</span>
   </div>

  </div>

 </div>
 `;

 document.getElementById("voltarJogador").onclick=mostrarEquipa;
}

/* TABELAS */

async function mostrarTabelas(){

 document.getElementById("navJogos").classList.remove("active");
 document.getElementById("navTabelas").classList.add("active");
 document.getElementById("navFav").classList.remove("active");

 document.getElementById("app").innerHTML=`
 <h2>Tabelas</h2>
 <div id="tabelas">
  <div class="empty">A carregar...</div>
 </div>
 `;
