<!DOCTYPE html>

<style>
*{box-sizing:border-box}

html,body{

.app{

.header{

.logo{

.sportSwitch{

.sportBtn{

.sectionTitle{

}

.leagues,

.leagueChip{

.actionRow{

.allGamesBtn,

.search{

.search input{

.tableTeam img{

</style>

<body>

<div class="app">

<header class="header">

  <div>

          class="navBtn"

</div>

            onclick="fecharOverlay()">

    <div id="overlayTitle" class="overlayTitle">
      FUTZONE
    </div>

  </div>

  <div id="overlayContent" class="detailContent"></div>

<script>
"use strict";

/* =========================================================
   FUTZONE
   MOTOR DE DADOS
   ========================================================= */

const API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const STANDINGS_API =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas = [

  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  ["esp.1","🇪🇸 La Liga"],
  ["esp.2","🇪🇸 La Liga 2"],

  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Jupiler Pro League"],

  ["ksa.1","🇸🇦 Liga Saudita"],
  ["usa.1","🇺🇸 MLS"],

  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]

];

let ligaSelecionada = "por.1";
let filtroAtual = "todos";
let diaSelecionado = "";
let modoTodos = false;
let modoLive = false;
let desporto = "futebol";
let eventosAtuais = [];
let tabelaAtual = [];
let requestToken = 0;

const CACHE = new Map();
const INFLIGHT = new Map();

const favoritos =
  JSON.parse(localStorage.getItem("futzone_jogos_favoritos") || "[]");

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function cacheGet(key,ttl){

  const item = CACHE.get(key);

  if(!item) return null;

  if(Date.now()-item.time > ttl){

    CACHE.delete(key);
    return null;

  }

  return item.data;

}

async function fetchJSON(url,timeout=9000){

  const controller = new AbortController();

  const timer = setTimeout(
    ()=>controller.abort(),
    timeout
  );

  try{

    const response =
      await fetch(url,{
        signal:controller.signal,
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    return await response.json();

  }catch(error){

    console.warn("FUTZONE API:",url,error);
    return null;

  }finally{

    clearTimeout(timer);

  }

}

async function fetchAPI(url,timeout=9000,ttl=30000){

  const cached = cacheGet(url,ttl);

  if(cached !== null){
    return cached;
  }

  if(INFLIGHT.has(url)){
    return INFLIGHT.get(url);
  }

  const promise =
    fetchJSON(url,timeout)
      .then(data=>{

        if(data !== null){

          CACHE.set(
            url,
            {
              time:Date.now(),
              data
            }
          );

        }

        return data;

      })
      .catch(()=>null)
      .finally(()=>{
        INFLIGHT.delete(url);
      });

  INFLIGHT.set(url,promise);

  return promise;

}

/* =========================================================
   CORREÇÃO PRINCIPAL ESPN
   ========================================================= */

function getCompetidores(evento){

  if(Array.isArray(evento?.competitors)){
    return evento.competitors;
  }

  if(Array.isArray(evento?.competition?.competitors)){
    return evento.competition.competitors;
  }

  if(Array.isArray(evento?.competitions?.[0]?.competitors)){
    return evento.competitions[0].competitors;
  }

  return [];

}

function getTeamObject(c){

  return (
    c?.team ||
    c?.competitor?.team ||
    c?.competitor ||
    c ||
    {}
  );

}

function nomeEquipa(c){

  const t = getTeamObject(c);

  const candidatos = [

    t.displayName,
    t.fullName,
    t.shortDisplayName,
    t.name,

    c?.displayName,
    c?.fullName,
    c?.shortDisplayName,
    c?.name,

    c?.competitor?.displayName,
    c?.competitor?.fullName,
    c?.competitor?.shortDisplayName,
    c?.competitor?.name

  ];

  for(const nome of candidatos){

    if(
      typeof nome === "string" &&
      nome.trim()
    ){
      return nome.trim();
    }

  }

  if(t.location && t.name){

    return (
      String(t.location)+" "+
      String(t.name)
    ).trim();

  }

  return "";

}

function idEquipa(c){

  const t = getTeamObject(c);

  return String(
    t.id ||
    c?.id ||
    t.uid ||
    c?.uid ||
    ""
  );

}

function logoEquipa(c){

  const t = getTeamObject(c);

  return (
    t.logo ||
    t.logos?.[0]?.href ||
    t.logos?.[0]?.url ||
    c?.logo ||
    c?.logos?.[0]?.href ||
    c?.logos?.[0]?.url ||
    ""
  );

}

function obterCasaFora(evento){

  const lista = getCompetidores(evento);

  const casa =
    lista.find(x=>x.homeAway==="home") ||
    lista[0] ||
    null;

  const fora =
    lista.find(x=>x.homeAway==="away") ||
    lista[1] ||
    null;

  return {
    casa,
    fora
  };

}

/* =========================================================
   DATAS
   ========================================================= */

function dataHoje(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function formatarDataISO(data){

  if(!data) return "";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

function formatarHora(data){

  if(!data) return "--:--";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())){
    return "--:--";
  }

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function criarDias(){

  const box =
    document.getElementById("dayList");

  const hoje = new Date();

  box.innerHTML = "";

  for(let i=-1;i<=7;i++){

    const d = new Date(hoje);

    d.setDate(
      hoje.getDate()+i
    );

    const iso =
      d.toISOString().slice(0,10);

    const nome =
      d.toLocaleDateString(
        "pt-PT",
        {weekday:"short"}
      ).replace(".","");

    const numero =
      d.toLocaleDateString(
        "pt-PT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      );

    const button =
      document.createElement("button");

    button.className =
      "dayChip";

    if(i===0){
      button.classList.add("active");
      diaSelecionado=iso;
    }

    button.innerHTML =
      `<strong>${i===0 ? "HOJE" : nome.toUpperCase()}</strong>
       <span>${numero}</span>`;

    button.onclick = ()=>{

      document
        .querySelectorAll(".dayChip")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      diaSelecionado=iso;
      modoTodos=false;
      modoLive=false;

      carregarJogos();

    };

    box.appendChild(button);

  }

}

/* =========================================================
   LIGAS
   ========================================================= */

function criarLigas(){

  const box =
    document.getElementById("leagueList");

  box.innerHTML = "";

  ligas.forEach(
    ([id,nome])=>{

      const button =
        document.createElement("button");

      button.className =
        "leagueChip";

      if(id===ligaSelecionada){
        button.classList.add("active");
      }

      button.textContent=nome;

      button.onclick=()=>{

        ligaSelecionada=id;

        modoTodos=false;
        modoLive=false;

        document
          .querySelectorAll(".leagueChip")
          .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        carregarJogos();

      };

      box.appendChild(button);

    }
  );

}

/* =========================================================
   EVENTOS
   ========================================================= */

function isLive(e){

  const s = e?.status?.type || {};

  const texto =
    `${s.name || ""} ${s.description || ""} ${s.detail || ""}`
      .toUpperCase();

  return (
    s.state==="in" ||
    s.name==="STATUS_IN_PROGRESS" ||
    s.type==="in" ||
    texto.includes("LIVE") ||
    texto.includes("IN PROGRESS") ||
    texto.includes("IN PLAY")
  );

}

function isFinal(e){

  const s = e?.status?.type || {};

  return (
    s.completed===true ||
    s.state==="post" ||
    s.name==="STATUS_FINAL" ||
    s.type==="final"
  );

}

function nomeCompeticao(e,liga){

  return (
    e?.competitions?.[0]?.name ||
    e?.league?.name ||
    ligas.find(x=>x[0]===liga)?.[1] ||
    "Futebol"
  );

}

function normalizarEvento(e,liga){

  if(!e) return null;

  e.__futzoneLiga =
    liga ||
    e.__futzoneLiga ||
    "";

  return e;

}

function deduplicarEventos(lista){

  const map = new Map();

  lista.forEach(e=>{

    if(!e) return;

    const c =
      getCompetidores(e);

    const a =
      nomeEquipa(c[0]);

    const b =
      nomeEquipa(c[1]);

    const chave =
      e.id ||
      `${e.date||""}-${a}-${b}`;

    if(!map.has(chave)){
      map.set(chave,e);
    }

  });

  return [...map.values()];

}

/* =========================================================
   BUSCAR JOGOS
   ========================================================= */

async function buscarJogosLiga(liga,iso){

  const data =
    iso ||
    diaSelecionado ||
    dataHoje();

  const range =
    data.replaceAll("-","");

  const url =
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    range+
    "&limit=100";

  const json =
    await fetchAPI(
      url,
      9000,
      20000
    );

  let eventos =
    Array.isArray(json?.events)
      ? json.events
      : [];

  eventos =
    eventos
      .map(e=>normalizarEvento(e,liga))
      .filter(Boolean);

  return deduplicarEventos(eventos);

}

/* =========================================================
   CARREGAR JOGOS
   ========================================================= */

async function carregarJogos(){

  if(desporto==="futsal"){

    mostrarFutsal();
    return;

  }

  const token =
    ++requestToken;

  const box =
    document.getElementById("gamesList");

  document
    .getElementById("tableContent")
    .classList.add("hidden");

  box.classList.remove("hidden");

  box.innerHTML =
    `<div class="loading">
       <div class="spinner"></div>
       A carregar jogos...
     </div>`;

  let eventos=[];

  if(modoTodos || modoLive){

    const resultados=[];

    const limite=5;

    for(
      let i=0;
      i<ligas.length;
      i+=limite
    ){

      const grupo =
        ligas.slice(i,i+limite);

      const grupoResultados =
        await Promise.all(
          grupo.map(
            x=>buscarJogosLiga(
              x[0],
              diaSelecionado
            )
          )
        );

      grupoResultados.forEach(
        x=>resultados.push(...x)
      );

      if(token!==requestToken){
        return;
      }

    }

    eventos =
      deduplicarEventos(resultados);

  }else{

    eventos =
      await buscarJogosLiga(
        ligaSelecionada,
        diaSelecionado
      );

  }

  if(token!==requestToken){
    return;
  }

  eventosAtuais=eventos;

  if(!eventos.length){

    const fallback =
      FALLBACK[ligaSelecionada] || [];

    if(
      !modoTodos &&
      !modoLive &&
      fallback.length
    ){

      eventos =
        fallback.map(
          x=>criarEventoFallback(
            x[0],
            x[1],
            ligaSelecionada
          )
        );

      eventosAtuais=eventos;

    }

  }

  renderizarJogos(eventos);

}

/* =========================================================
   RENDER JOGOS
   ========================================================= */

function renderizarJogos(eventos){

  const box =
    document.getElementById("gamesList");

  let lista=[...eventos];

  if(modoLive){

    lista =
      lista.filter(isLive);

  }

  if(filtroAtual==="live"){

    lista =
      lista.filter(isLive);

  }

  if(filtroAtual==="proximos"){

    lista =
      lista.filter(
        e=>!isLive(e) && !isFinal(e)
      );

  }

  if(filtroAtual==="final"){

    lista =
      lista.filter(isFinal);

  }

  const q =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(q){

    lista =
      lista.filter(e=>{

        const c =
          getCompetidores(e);

        return c.some(
          x=>
            nomeEquipa(x)
              .toLowerCase()
              .includes(q)
        );

      });

  }

  if(!lista.length){

    box.innerHTML =
      `<div class="empty">
        <div class="emptyIcon">⚽</div>
        <strong>Sem jogos encontrados</strong>
        <div style="margin-top:7px">
          Tenta outra data, competição ou filtro.
        </div>
      </div>`;

    return;

  }

  lista.sort(
    (a,b)=>
      new Date(a.date||0) -
      new Date(b.date||0)
  );

  const grupos = new Map();

  lista.forEach(e=>{

    const liga =
      e.__futzoneLiga ||
      ligaSelecionada;

    if(!grupos.has(liga)){
      grupos.set(liga,[]);
    }

    grupos.get(liga).push(e);

  });

  box.innerHTML="";

  grupos.forEach(
    (items,liga)=>{

      const bloco =
        document.createElement("div");

      bloco.className="leagueBlock";

      const nome =
        ligas.find(x=>x[0]===liga)?.[1] ||
        nomeCompeticao(items[0],liga);

      bloco.innerHTML =
        `<div class="leagueBlockTitle">
          ${escapeHtml(nome)}
        </div>`;

      items.forEach(
        e=>{
          bloco.insertAdjacentHTML(
            "beforeend",
            cartaoJogo(e)
          );
        }
      );

      box.appendChild(bloco);

    }
  );

}

async function buscarTabelaLiga(liga){

  const urls=[

    STANDINGS_API+
    encodeURIComponent(liga)+
    "/standings",

    API+
    encodeURIComponent(liga)+
    "/standings"

  ];

  for(const url of urls){

    const data =
      await fetchAPI(
        url,
        9000,
        120000
      );

    if(data){
      return data;
    }

  }

  return null;

}

function valorStat(stats,names){

  if(!Array.isArray(stats)){
    return "";
  }

  for(const nome of names){

    const s =
      stats.find(
        x=>
          x?.name===nome ||
          x?.abbreviation===nome ||
          x?.shortDisplayName===nome
      );

    if(s){

      return (
        s.value ??
        s.displayValue ??
        ""
      );

    }

  }

  return "";

}

function extrairTabelaESPN(data){

  const resultado=[];

  const grupos=[];

  if(Array.isArray(data?.children)){
    grupos.push(...data.children);
  }

  grupos.push(data);

  for(const grupo of grupos){

    const entries =

      grupo?.standings?.entries ||
      grupo?.entries ||
      grupo?.standings?.results ||
      [];

    if(!Array.isArray(entries)){
      continue;
    }

    entries.forEach(entry=>{

      const team =
        entry?.team ||
        entry?.competitor ||
        {};

      const stats =
        entry?.stats ||
        entry?.statistics ||
        [];

      const nome =
        team.displayName ||
        team.fullName ||
        team.shortDisplayName ||
        team.name ||
        "";

      if(!nome) return;

      const pos =
        valorStat(
          stats,
          ["rank","position","POS"]
        );

      const jogados =
        valorStat(
          stats,
          [
            "gamesPlayed",
            "GP",
            "played",
            "games"
          ]
        );

      const vitorias =
        valorStat(
          stats,
          [
            "wins",
            "W"
          ]
        );

      const empates =
        valorStat(
          stats,
          [
            "ties",
            "draws",
            "D",
            "T"
          ]
        );

      const derrotas =
        valorStat(
          stats,
          [
            "losses",
            "L"
          ]
        );

      const gf =
        valorStat(
          stats,
          [
            "goalsFor",
            "pointsFor",
            "GF",
            "PF"
          ]
        );

      const ga =
        valorStat(
          stats,
          [
            "goalsAgainst",
            "pointsAgainst",
            "GA",
            "PA"
          ]
        );

      const gd =
        valorStat(
          stats,
          [
            "goalDifference",
            "pointDifferential",
            "GD",
            "PD"
          ]
        );

      const pontos =
        valorStat(
          stats,
          [
            "points",
            "PTS"
          ]
        );

      resultado.push({

        id:
          team.id ||
          team.uid ||
          "",

        nome,

        logo:
          team.logo ||
          team.logos?.[0]?.href ||
          team.logos?.[0]?.url ||
          "",

        pos:
          pos || resultado.length+1,

        jogados,

        vitorias,

        empates,

        derrotas,

        gf,

        ga,

        gd,

        pontos

      });

    });

  }

  const mapa = new Map();

  resultado.forEach(x=>{

    const key =
      x.id ||
      x.nome;

    if(!mapa.has(key)){
      mapa.set(key,x);
    }

  });

  return [...mapa.values()];

}

    "por.w.1":[
      "Sporting CP",
      "Benfica",
      "SC Braga",
      "Famalicão",
      "Damaiense",
      "Estoril Praia",
      "Torreense",
      "Valadares Gaia"
    ]

  };

  return (nomes[liga] || [])
    .map(
      (nome,i)=>({

        id:"",
        nome,
        logo:"",
        pos:i+1,
        jogados:"",
        vitorias:"",
        empates:"",
        derrotas:"",
        gf:"",
        ga:"",
        gd:"",
        pontos:""

      })
    );

}

async function mostrarTabelaFutebol(){

  document
    .getElementById("gamesList")
    .classList.add("hidden");

  const box =
    document.getElementById("tableContent");

  box.classList.remove("hidden");

  box.innerHTML =
    `<div class="loading">
      <div class="spinner"></div>
      A carregar classificação...
    </div>`;

  const data =
    await buscarTabelaLiga(
      ligaSelecionada
    );

  let tabela =
    data
      ? extrairTabelaESPN(data)
      : [];

  if(!tabela.length){

    tabela =
      tabelaFallback(
        ligaSelecionada
      );

  }

  tabelaAtual=tabela;

  const nomeLiga =
    ligas.find(
      x=>x[0]===ligaSelecionada
    )?.[1] ||
    "Classificação";

  if(!tabela.length){

    box.innerHTML =
      `<div class="empty">
        <div class="emptyIcon">📊</div>
        <strong>Classificação indisponível</strong>
        <div style="margin-top:7px">
          A competição ainda não forneceu a tabela.
        </div>
      </div>`;

    return;

  }

  box.innerHTML =
    `<div class="tableTitle">
      ${escapeHtml(nomeLiga)}
    </div>
    ${renderTabela(tabela)}`;

}

function renderTabela(tabela){

  return `
  <div class="tableWrap">

    <table class="standingsTable">

      <thead>

        <tr>
          <th>#</th>
          <th style="text-align:left">Equipa</th>
          <th>J</th>
          <th>V</th>
          <th>E</th>
          <th>D</th>
          <th>DG</th>
          <th>Pts</th>
        </tr>

      </thead>

      <tbody>

        ${tabela.map(
          (x,i)=>`

          <tr
            onclick="fzAbrirEquipa(
              '${escapeHtml(x.id)}',
              '${escapeHtml(x.nome)}',
              '${escapeHtml(x.logo)}'
            )">

            <td>
              ${escapeHtml(
                x.pos || i+1
              )}
            </td>

            <td class="tableTeam">

              ${
                x.logo
                  ? `<img src="${escapeHtml(x.logo)}"
                           onerror="this.style.display='none'"
                           alt="">`
                  : `<span>⚽</span>`
              }

              ${escapeHtml(x.nome)}

            </td>

            <td>${escapeHtml(x.jogados)}</td>
            <td>${escapeHtml(x.vitorias)}</td>
            <td>${escapeHtml(x.empates)}</td>
            <td>${escapeHtml(x.derrotas)}</td>
            <td>${escapeHtml(x.gd)}</td>
            <td><strong>${escapeHtml(x.pontos)}</strong></td>

          </tr>

        `
        ).join("")}

      </tbody>

    </table>

  </div>`;

}

/* =========================================================

   ========================================================= */

function ativarNav(id){

  document
    .querySelectorAll(".navBtn")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    ?.classList.add("active");

}

function irJogos(){

  ativarNav("navJogos");

  document
    .getElementById("tableContent")
    .classList.add("hidden");

  document
    .getElementById("gamesList")
    .classList.remove("hidden");

  carregarJogos();

}

function irTabelas(){

  ativarNav("navTabelas");

  mostrarTabelaFutebol();

}

   FUTSAL
   ========================================================= */

function mudarDesporto(tipo){

  desporto=tipo;

  document
    .getElementById("sportFutebol")
    .classList.toggle(
      "active",
      tipo==="futebol"
    );

  document
    .getElementById("sportFutsal")
    .classList.toggle(
      "active",
      tipo==="futsal"
    );

  if(tipo==="futsal"){

    mostrarFutsal();

  }else{

    carregarJogos();

  }

}

function mostrarFutsal(){

  document
    .getElementById("gamesList")
    .classList.remove("hidden");

  document
    .getElementById("tableContent")
    .classList.add("hidden");

  document
    .getElementById("gamesList")
    .innerHTML = `

      <div class="empty">

        <div class="emptyIcon">🥅</div>

        <strong>FUTSAL</strong>

        <div style="margin-top:8px">
          A área de futsal está disponível
          no FUTZONE.
        </div>

      </div>

    `;

}
