<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d"><meta name="mobile-web-app-capable" content="yes">
<title>FUTZONE — Teste funcional</title>
<style>
:root{--blue:#0057b8;--blue2:#1683ff;--wine:#72243a;--wine2:#9b3150;--black:#03060b;--card:#0a111b;--card2:#101a28;--line:#223047;--text:#fff;--muted:#9daabb;--green:#20d68a;--red:#ff4054;--yellow:#ffd43b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#03060b,#07111d 45%,#03060b);color:var(--text);font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(3,6,11,.96);border-bottom:1px solid var(--line);padding:14px 15px}.brand{font-size:29px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--blue2)}.sub{font-size:11px;color:var(--muted);margin-top:2px}.nav,.bottom{display:flex;gap:7px;overflow:auto;background:#070d16;border-bottom:1px solid var(--line);padding:9px}.nav button,.bottom button{border:0;border-radius:12px;background:#101a28;color:#fff;font-weight:800;padding:10px 13px;white-space:nowrap}.nav button.active,.bottom button.active{background:linear-gradient(135deg,var(--blue),var(--wine));}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;justify-content:space-around;border-top:1px solid var(--line);border-bottom:0;padding:8px}.bottom button{background:transparent;font-size:11px}.content{max-width:900px;margin:auto;padding:12px 12px 88px}.title{font-size:21px;font-weight:900;margin:10px 0}.subtle{color:var(--muted);font-size:12px}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.chip{border:1px solid var(--line);background:#0d1724;color:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap}.chip.active{background:var(--blue);border-color:var(--blue2)}.card{background:linear-gradient(145deg,#0a111b,#101a28);border:1px solid var(--line);border-radius:17px;padding:13px;margin:9px 0;box-shadow:0 8px 25px #0004}.league{font-size:12px;color:#c5d0df;font-weight:800}.date{font-size:11px;color:var(--muted);margin-top:3px}.match{display:grid;grid-template-columns:1fr 75px 1fr;align-items:center;gap:8px;text-align:center}.club{font-weight:850}.club.click{cursor:pointer}.logo{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 5px}.score{font-size:21px;font-weight:950}.live{color:var(--green)}.future{color:var(--yellow)}.win{color:var(--green)}.actions{display:flex;gap:7px;margin-top:10px}.smallbtn{border:1px solid var(--line);background:#0d1724;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 5px;border-bottom:1px solid #1c2a3d;text-align:center}.table th:nth-child(2),.table td:nth-child(2){text-align:left}.teamrow{cursor:pointer}.teamcell{display:flex;align-items:center;gap:8px}.mini{width:28px;height:28px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.squad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{cursor:pointer}.player .logo{width:64px;height:64px;border-radius:50%;background:#0b1420}.hero{display:flex;align-items:center;gap:14px}.hero .logo{width:80px;height:80px;margin:0}.back{border:0;background:transparent;color:#fff;font-weight:900;padding:0;margin:4px 0 10px}.loading{text-align:center;color:var(--muted);padding:25px}.error{background:#35131b;border:1px solid #7b2c3c;padding:12px;border-radius:12px;color:#ffd7dd}.empty{text-align:center;color:var(--muted);padding:28px}.section{margin-top:15px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#0d1724;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.toast{position:fixed;left:12px;right:12px;bottom:78px;background:#111d2c;border:1px solid var(--blue2);padding:11px;border-radius:12px;z-index:50;display:none}
@media(min-width:700px){.squad{grid-template-columns:repeat(3,minmax(0,1fr))}.content{padding-left:20px;padding-right:20px}}
</style></head>
<body>
<header class="top"><div class="brand">FUT<span>ZONE</span></div><div class="sub">FUTEBOL EM DIRETO</div></header>
<nav class="nav" id="topnav"><button data-view="games" class="active">⚽ Jogos</button><button data-view="rounds">📅 Jornadas</button><button data-view="tables">📊 Tabelas</button><button data-view="live">🔴 Ao Vivo</button></nav>
<main class="content" id="app"></main>
<nav class="bottom"><button data-view="games" class="active">⚽<br>Jogos</button><button data-view="tables">📊<br>Tabelas</button><button data-view="favs">⭐<br>Favoritos</button></nav>
<div id="toast" class="toast"></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const API2='https://site.api.espn.com/apis/v2/sports/soccer/';
const CORE='https://sports.core.api.espn.com/v2/sports/soccer/leagues/';
const leagues={
 'por.1':['🇵🇹 Liga Portugal','Liga Portugal'], 'por.2':['🇵🇹 Liga 2','Liga 2'], 'por.3':['🇵🇹 Liga 3','Liga 3'], 'por.w.1':['🇵🇹 Liga BPI Feminina','Liga BPI'],
 'eng.1':['🏴 Premier League','Premier League'],'eng.2':['🏴 Championship','Championship'],'esp.1':['🇪🇸 La Liga','La Liga'],'esp.2':['🇪🇸 La Liga 2','La Liga 2'],
 'ita.1':['🇮🇹 Serie A','Serie A'],'ita.2':['🇮🇹 Serie B','Serie B'],'ger.1':['🇩🇪 Bundesliga','Bundesliga'],'ger.2':['🇩🇪 2. Bundesliga','2. Bundesliga'],
 'fra.1':['🇫🇷 Ligue 1','Ligue 1'],'fra.2':['🇫🇷 Ligue 2','Ligue 2'],'ned.1':['🇳🇱 Eredivisie','Eredivisie'],'bel.1':['🇧🇪 Liga Belga','Liga Belga'],
 'ksa.1':['🇸🇦 Liga Saudita','Liga Saudita'],'usa.1':['🇺🇸 MLS','MLS'],'uefa.champions':['🏆 Liga dos Campeões','Champions'],'uefa.europa':['🏆 Liga Europa','Europa'],'uefa.europa.conf':['🏆 Liga Conferência','Conference']
};
let state={view:'games',league:'por.1',date:fmtDate(new Date()),cache:{},fav:JSON.parse(localStorage.getItem('futzone_jogos_favoritos')||'[]')};
function fmtDate(d){return d.toISOString().slice(0,10)} function ymd(d){return d.replaceAll('-','')} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view; render()});}
function leagueBar(){return `<div class="chips">${Object.entries(leagues).map(([id,v])=>`<button class="chip ${state.league===id?'active':''}" data-league="${id}">${v[0]}</button>`).join('')}</div>`}
function bindLeague(){document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{state.league=b.dataset.league;state.view='games';render()})}
function loading(t='A carregar dados reais…'){return `<div class="loading">${t}</div>`}
function err(e){return `<div class="error">Não foi possível carregar estes dados agora.<br><span class="subtle">${esc(e.message||e)}</span></div>`}
function eventData(e){const c=e.competitions?.[0],teams=c?.competitors||[];let h=teams.find(x=>x.homeAway==='home')||teams[0],a=teams.find(x=>x.homeAway==='away')||teams[1];return {id:e.id,home:h?.team||{},away:a?.team||{},hs:h?.score,as:a?.score,status:c?.status||e.status,date:e.date,league:e.league?.name||''}}
function matchCard(e,leagueId){const x=eventData(e), st=x.status||{};const completed=st.type?.completed, live=st.type?.state==='in';const fav=state.fav.includes(x.id);return `<div class="card"><div class="league">${esc(leagues[leagueId]?.[0]||x.league)}</div><div class="date">${new Date(x.date).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})}</div><div class="match" onclick="openGame('${x.id}','${leagueId}')"><div class="club click"><img class="logo" src="${esc(x.home.logo||'')}" onerror="this.style.visibility='hidden'"><div>${esc(x.home.displayName)}</div></div><div class="score ${live?'live':(!completed?'future':'')}">${completed||live?esc(x.hs)+' - '+esc(x.as):'vs'}</div><div class="club click"><img class="logo" src="${esc(x.away.logo||'')}" onerror="this.style.visibility='hidden'"><div>${esc(x.away.displayName)}</div></div></div><div class="actions"><button class="smallbtn" onclick="event.stopPropagation();openGame('${x.id}','${leagueId}')">Detalhes</button><button class="smallbtn" onclick="event.stopPropagation();toggleFav('${x.id}')">${fav?'★':'☆'} Favorito</button></div></div>`}
async function scoreboard(league,date){const key=league+'|'+date;if(state.cache[key])return state.cache[key];const data=await get(API+league+'/scoreboard?dates='+ymd(date)+'&limit=200');state.cache[key]=data;return data}
async function games(){app.innerHTML=leagueBar()+`<div class="title">Jogos — ${leagues[state.league][1]}</div><div class="actions"><button class="smallbtn" id="prev">◀ Dia anterior</button><input id="date" type="date" value="${state.date}" style="background:#0d1724;color:white;border:1px solid #223047;border-radius:10px;padding:8px"><button class="smallbtn" id="next">Dia seguinte ▶</button></div>`+loading();bindLeague();date.onchange=e=>{state.date=e.target.value;render()};prev.onclick=()=>{let d=new Date(state.date);d.setDate(d.getDate()-1);state.date=fmtDate(d);render()};next.onclick=()=>{let d=new Date(state.date);d.setDate(d.getDate()+1);state.date=fmtDate(d);render()};try{const data=await scoreboard(state.league,state.date);app.innerHTML=leagueBar()+`<div class="title">Jogos — ${leagues[state.league][1]}</div><div class="actions"><button class="smallbtn" id="prev">◀ Dia anterior</button><input id="date" type="date" value="${state.date}" style="background:#0d1724;color:white;border:1px solid #223047;border-radius:10px;padding:8px"><button class="smallbtn" id="next">Dia seguinte ▶</button></div>`+(data.events?.length?data.events.map(e=>matchCard(e,state.league)).join(''):'<div class="empty">Não há jogos nesta data nesta competição.</div>');bindLeague();date.onchange=e=>{state.date=e.target.value;render()};prev.onclick=()=>shift(-1);next.onclick=()=>shift(1)}catch(e){app.innerHTML=leagueBar()+err(e);bindLeague()}}
function shift(n){let d=new Date(state.date);d.setDate(d.getDate()+n);state.date=fmtDate(d);render()}
async function live(){app.innerHTML=leagueBar()+`<div class="title">🔴 Ao Vivo — todas as competições</div>`+loading();bindLeague();try{let all=[];await Promise.all(Object.keys(leagues).map(async l=>{try{const d=await scoreboard(l,fmtDate(new Date()));(d.events||[]).forEach(e=>{const x=eventData(e);if(x.status?.type?.state==='in')all.push([e,l])})}catch(_){}}));app.innerHTML=leagueBar()+`<div class="title">🔴 Ao Vivo</div>`+(all.length?all.map(([e,l])=>matchCard(e,l)).join(''):'<div class="empty">Não há jogos ao vivo neste momento.</div>');bindLeague()}catch(e){app.innerHTML=err(e)}}
async function tables(){app.innerHTML=leagueBar()+`<div class="title">📊 Tabela — ${leagues[state.league][1]}</div>`+loading();bindLeague();try{const d=await get(API2+state.league+'/standings');const rows=[];(d.children||[]).forEach(g=>(g.standings?.entries||[]).forEach(x=>rows.push(x)));const data=rows.length?rows:(d.standings?.entries||[]);app.innerHTML=leagueBar()+`<div class="title">📊 ${leagues[state.league][1]}</div><div class="card"><table class="table"><thead><tr><th>#</th><th>Clube</th><th>J</th><th>V</th><th>E</th><th>D</th><th>Pts</th></tr></thead><tbody>${data.map((r,i)=>{const t=r.team||r.note?.team||{};const stats={};(r.stats||[]).forEach(s=>stats[s.name]=s.value??s.displayValue);return `<tr class="teamrow" onclick="openTeam('${t.id}','${state.league}')"><td>${i+1}</td><td><div class="teamcell"><img class="mini" src="${esc(t.logos?.[0]?.href||t.logo||'')}" onerror="this.style.visibility='hidden'"><span>${esc(t.displayName||t.name)}</span></div></td><td>${stats.gamesPlayed??stats.gp??'-'}</td><td>${stats.wins??'-'}</td><td>${stats.ties??stats.draws??'-'}</td><td>${stats.losses??'-'}</td><td><b>${stats.points??'-'}</b></td></tr>`}).join('')}</tbody></table></div>`;bindLeague()}catch(e){app.innerHTML=leagueBar()+err(e);bindLeague()}}
async function rounds(){app.innerHTML=leagueBar()+`<div class="title">📅 Jornadas — ${leagues[state.league][1]}</div>`+loading();bindLeague();try{const d=await get(API+state.league+'/scoreboard?limit=200');const events=d.events||[];const groups={};events.forEach(e=>{const w=e.week?.number||e.season?.slug||'Calendário';(groups[w]??=[]).push(e)});app.innerHTML=leagueBar()+`<div class="title">📅 Jornadas</div>`+Object.entries(groups).map(([w,es])=>`<div class="card"><b>Jornada ${esc(w)}</b>${es.map(e=>matchCard(e,state.league)).join('')}</div>`).join('')||'<div class="empty">Sem calendário disponível.</div>';bindLeague()}catch(e){app.innerHTML=err(e)}}
async function favs(){app.innerHTML=`<div class="title">⭐ Favoritos</div>`+(state.fav.length?loading():'<div class="empty">Ainda não tens jogos favoritos.</div>');if(!state.fav.length)return;let arr=[];for(const l of Object.keys(leagues)){try{const d=await scoreboard(l,fmtDate(new Date()));(d.events||[]).forEach(e=>{if(state.fav.includes(e.id))arr.push([e,l])})}catch(_){}}app.innerHTML=`<div class="title">⭐ Favoritos</div>`+(arr.length?arr.map(([e,l])=>matchCard(e,l)).join(''):'<div class="empty">Os favoritos guardados não estão no dia atual. Podes encontrá-los no calendário da competição.</div>')}
function toggleFav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];localStorage.setItem('futzone_jogos_favoritos',JSON.stringify(state.fav));render()}
window.openGame=async(id,l)=>{app.innerHTML=loading('A carregar detalhes do jogo…');try{const d=await get(API+l+'/summary?event='+id);app.innerHTML=`<button class="back" onclick="render()">← Voltar</button><div class="title">${esc(d.header?.competitions?.[0]?.displayName||'Jogo')}</div><div class="card"><div class="match"><div class="club"><img class="logo" src="${esc(d.header?.competitions?.[0]?.competitors?.[0]?.team?.logo||'')}">${esc(d.header?.competitions?.[0]?.competitors?.[0]?.team?.displayName||'')}</div><div class="score">${esc(d.header?.competitions?.[0]?.competitors?.[0]?.score||'-')} - ${esc(d.header?.competitions?.[0]?.competitors?.[1]?.score||'-')}</div><div class="club"><img class="logo" src="${esc(d.header?.competitions?.[0]?.competitors?.[1]?.team?.logo||'')}">${esc(d.header?.competitions?.[0]?.competitors?.[1]?.team?.displayName||'')}</div></div></div><div class="card"><h3>Eventos</h3>${(d.rosters?.length||d.plays?.length)?'Dados detalhados disponíveis.':(d.header?.competitions?.[0]?.status?.type?.description||'Detalhes disponíveis no resumo da competição.')}</div>`}catch(e){app.innerHTML=err(e)}};
window.openTeam=async(id,l)=>{app.innerHTML=loading('A carregar clube e plantel…');try{const [team,roster,schedule]=await Promise.all([get(API+l+'/teams/'+id),get(API+l+'/teams/'+id+'/roster'),get(API+l+'/teams/'+id+'/schedule')]);const t=team.team||team;const athletes=(roster.athletes||[]).flatMap(x=>x.items||x.athletes||[]);app.innerHTML=`<button class="back" onclick="render()">← Voltar</button><div class="card"><div class="hero"><img class="logo" src="${esc(t.logos?.[0]?.href||t.logo||'')}"><div><div class="title">${esc(t.displayName||t.name)}</div><div class="subtle">${esc(t.location||'')}</div></div></div></div><div class="title">Plantel</div><div class="squad">${athletes.map(p=>`<div class="card player" onclick="openPlayer('${p.id}','${l}')"><img class="logo" src="${esc(p.headshot?.href||p.photo?.href||'')}" onerror="this.style.visibility='hidden'"><b>${esc(p.fullName||p.displayName||p.name)}</b><div class="subtle">${esc(p.position?.displayName||p.position?.abbreviation||'Jogador')}</div></div>`).join('')||'<div class="empty">O fornecedor não disponibilizou o plantel desta equipa.</div>'}</div><div class="title">Próximos / últimos jogos</div>${(schedule.events||[]).slice(0,20).map(e=>matchCard(e,l)).join('')}` }catch(e){app.innerHTML=err(e)}};
window.openPlayer=async(id,l)=>{app.innerHTML=loading('A carregar histórico do jogador…');try{const u=CORE+l+'/athletes/'+id;const d=await get(u);const stats=d.statistics||{};const name=d.displayName||d.fullName||d.athlete?.displayName||'Jogador';app.innerHTML=`<button class="back" onclick="history.back();render()">← Voltar</button><div class="card"><div class="hero"><img class="logo" src="${esc(d.headshot?.href||d.athlete?.headshot?.href||'')}" onerror="this.style.visibility='hidden'"><div><div class="title">${esc(name)}</div><div class="subtle">${esc(d.position?.displayName||d.position?.name||'')}</div></div></div></div><div class="title">Histórico / dados</div><div class="card"><div class="subtle">ID ESPN</div><b>${esc(id)}</b><div class="section">${Object.keys(stats).length?'<div class="grid">'+Object.entries(stats).slice(0,12).map(([k,v])=>`<div class="stat"><span class="subtle">${esc(k)}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')+'</div>':'O fornecedor não disponibilizou estatísticas de carreira detalhadas para este jogador nesta competição.'}</div></div>`}catch(e){app.innerHTML=err(e)}};
async function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='games')return games();if(state.view==='rounds')return rounds();if(state.view==='tables')return tables();if(state.view==='live')return live();return favs()}
nav();render();
</script></body></html>
