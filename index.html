function escapeHtml(valor){

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function cacheGet(url){

  const item=CACHE.get(url);

  if(!item) return null;

  if(Date.now()>item.expires){

    CACHE.delete(url);
    return null;

  }

  return item.data;

}

async function fetchJSON(url,timeout=9000){

  const cached=cacheGet(url);

  if(cached!==null){
    return cached;
  }

  if(INFLIGHT.has(url)){
    return INFLIGHT.get(url);
  }

  const promise=(async()=>{

    const controller=
      new AbortController();

    const timer=
      setTimeout(
        ()=>controller.abort(),
        timeout
      );

    try{

      const response=
        await fetch(
          url,
          {
            signal:controller.signal,
            cache:"no-store"
          }
        );

      if(!response.ok){
        throw new Error(
          "HTTP "+response.status
        );
      }

      const data=
        await response.json();

      CACHE.set(
        url,
        {
          data,
          expires:
            Date.now()+120000
        }
      );

      return data;

    }finally{

      clearTimeout(timer);
      INFLIGHT.delete(url);

    }

  })();

  INFLIGHT.set(url,promise);

  try{

    return await promise;

  }catch(error){

    INFLIGHT.delete(url);
    console.warn("FUTZONE fetch:",url,error);
    return null;

  }

}

async function fetchAPI(
  url,
  timeout=9000,
  cacheMs=120000
){

  const cached=CACHE.get(url);

  if(cached && Date.now()<cached.expires){
    return cached.data;
  }

  const data=
    await fetchJSON(url,timeout);

  if(data){

    CACHE.set(
      url,
      {
        data,
        expires:
          Date.now()+cacheMs
      }
    );

  }

  return data;

}

/* =========================================================
   EQUIPAS / COMPETIDORES
   ========================================================= */

function getCompetidores(evento){

  if(
    Array.isArray(
      evento?.competitors
    )
  ){

    return evento.competitors;

  }

  if(
    Array.isArray(
      evento?.competition?.competitors
    )
  ){

    return evento.competition.competitors;

  }

  if(
    Array.isArray(
      evento?.competitions?.[0]?.competitors
    )
  ){

    return evento.competitions[0].competitors;

  }

  return [];

}

function getTeamObject(competidor){

  if(!competidor){
    return {};
  }

  return (
    competidor.team ||
    competidor.athlete ||
    competidor
  );

}

function nomeEquipa(competidor){

  const t=
    getTeamObject(competidor);

  return (
    t.displayName ||
    t.fullName ||
    t.shortDisplayName ||
    t.name ||
    t.abbreviation ||
    competidor?.displayName ||
    competidor?.name ||
    "Equipa"
  );

}

function idEquipa(competidor){

  const t=
    getTeamObject(competidor);

  return String(
    t.id ||
    competidor?.id ||
    t.uid ||
    competidor?.uid ||
    ""
  );

}

function logoEquipa(competidor){

  const t=
    getTeamObject(competidor);

  return (
    t.logo ||
    t.logos?.[0]?.href ||
    t.logos?.[0]?.url ||
    competidor?.logo ||
    competidor?.logos?.[0]?.href ||
    competidor?.logos?.[0]?.url ||
    ""
  );

}

function obterCasaFora(evento){

  const lista=
    getCompetidores(evento);

  const casa=
    lista.find(
      x=>x.homeAway==="home"
    ) ||
    lista[0] ||
    null;

  const fora=
    lista.find(
      x=>x.homeAway==="away"
    ) ||
    lista[1] ||
    null;

  return {
    casa,
    fora
  };

}

/* =========================================================
   DATAS
   ========================================================= */

function dataHoje(){

  const d=new Date();

  const y=d.getFullYear();

  const m=
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day=
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function dataOffset(iso,delta){

  const d=
    new Date(
      iso+"T12:00:00Z"
    );

  d.setUTCDate(
    d.getUTCDate()+delta
  );

  return d
    .toISOString()
    .slice(0,10);

}

function formatarDataISO(data){

  if(!data) return "";

  const d=new Date(data);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

function formatarHora(data){

  if(!data) return "--:--";

  const d=new Date(data);

  if(Number.isNaN(d.getTime())){
    return "--:--";
  }

  return d.toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function criarDias(){

  const box=
    document.getElementById(
      "dayList"
    );

  const hoje=new Date();

  box.innerHTML="";

  for(let i=-1;i<=7;i++){

    const d=new Date(hoje);

    d.setDate(
      hoje.getDate()+i
    );

    const iso=
      d.toISOString()
       .slice(0,10);

    const nome=
      d.toLocaleDateString(
        "pt-PT",
        {weekday:"short"}
      ).replace(".","");

    const numero=
      d.toLocaleDateString(
        "pt-PT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      );

    const button=
      document.createElement(
        "button"
      );

    button.className="dayChip";

    if(i===0){

      button.classList.add(
        "active"
      );

      diaSelecionado=iso;

    }

    button.innerHTML=
      `<strong>${
        i===0
          ? "HOJE"
          : nome.toUpperCase()
      }</strong>
       <span>${numero}</span>`;

    button.onclick=()=>{

      document
        .querySelectorAll(
          ".dayChip"
        )
        .forEach(
          x=>x.classList.remove(
            "active"
          )
        );

      button.classList.add(
        "active"
      );

      diaSelecionado=iso;

      modoTodos=false;
      modoLive=false;

      carregarJogos();

    };

    box.appendChild(button);

  }

}

/* =========================================================
   ESTADOS DO JOGO
   ========================================================= */

function isLive(e){

  const s=
    e?.status?.type || {};

  const texto=
    `${s.name || ""} ${
      s.description || ""
    } ${
      s.detail || ""
    }`.toUpperCase();

  return (
    s.state==="in" ||
    s.name==="STATUS_IN_PROGRESS" ||
    s.type==="in" ||
    texto.includes("LIVE") ||
    texto.includes("IN PROGRESS") ||
    texto.includes("IN PLAY") ||
    texto.includes("AO VIVO")
  );

}

function isFinal(e){

  const s=
    e?.status?.type || {};

  return (
    s.completed===true ||
    s.state==="post" ||
    s.name==="STATUS_FINAL" ||
    s.type==="final"
  );

}

function nomeCompeticao(e,liga){

  return (
    e?.competitions?.[0]?.name ||
    e?.league?.name ||
    ligas.find(
      x=>x[0]===liga
    )?.[1] ||
    "Futebol"
  );

}

function normalizarEvento(e,liga){

  if(!e) return null;

  e.__futzoneLiga=
    liga ||
    e.__futzoneLiga ||
    "";

  return e;

}

function deduplicarEventos(lista){

  const map=new Map();

  lista.forEach(e=>{

    if(!e) return;

    const c=
      getCompetidores(e);

    const a=
      nomeEquipa(c[0]);

    const b=
      nomeEquipa(c[1]);

    const chave=
      e.id ||
      `${e.date||""}-${a}-${b}`;

    if(!map.has(chave)){
      map.set(chave,e);
    }

  });

  return [...map.values()];

}

/* =========================================================
   JOGOS DE UMA LIGA
   ========================================================= */

async function buscarJogosLiga(
  liga,
  iso
){

  const data=
    iso ||
    diaSelecionado ||
    dataHoje();

  const range=
    data.replaceAll("-","");

  const url=
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    range+
    "&limit=100";

  const json=
    await fetchAPI(
      url,
      9000,
      20000
    );

  let eventos=
    Array.isArray(
      json?.events
    )
      ? json.events
      : [];

  eventos=
    eventos
      .map(
        e=>normalizarEvento(
          e,
          liga
        )
      )
      .filter(Boolean);

  return deduplicarEventos(
    eventos
  );

}

/* =========================================================
   RESULTADOS HISTÓRICOS — 30 DIAS
   ========================================================= */

async function buscarJogosDiaHistorico(
  liga,
  iso
){

  const api=
    iso.replaceAll("-","");

  const url=
    API+
    encodeURIComponent(liga)+
    "/scoreboard?dates="+
    api+
    "&limit=100";

  const json=
    await fetchAPI(
      url,
      10000,
      180000
    );

  if(
    !json ||
    !Array.isArray(json.events)
  ){

    return [];

  }

  return json.events
    .map(
      e=>normalizarEvento(
        e,
        liga
      )
    )
    .filter(
      e=>e && isFinal(e)
    );

}

async function buscarResultadosHistoricosLiga(
  liga,
  dias=RESULTADOS_DIAS
){

  const base=
    diaSelecionado ||
    dataHoje();

  const datas=[];

  for(
    let i=1;
    i<=dias;
    i++
  ){

    datas.push(
      dataOffset(
        base,
        -i
      )
    );

  }

  const resultados=[];

  for(
    let i=0;
    i<datas.length;
    i+=RESULTADOS_GRUPO
  ){

    const grupo=
      datas.slice(
        i,
        i+RESULTADOS_GRUPO
      );

    const respostas=
      await Promise.all(
        grupo.map(
          data=>
            buscarJogosDiaHistorico(
              liga,
              data
            )
        )
      );

    respostas.forEach(
      lista=>
        resultados.push(
          ...lista
        )
    );

    if(
      i+RESULTADOS_GRUPO
      <
      datas.length
    ){

      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            80
          )
      );

    }

  }

  return deduplicarEventos(
    resultados
  )
  .filter(isFinal)
  .sort(
    (a,b)=>
      new Date(b.date||0) -
      new Date(a.date||0)
  );

}

      }

    ]

  };

}

/* =========================================================
   CARREGAR JOGOS
   ========================================================= */

async function carregarJogos(){

  if(
    desporto==="futsal"
  ){

    mostrarFutsal();
    return;

  }

  const token=
    ++requestToken;

  const box=
    document.getElementById(
      "gamesList"
    );

  document
    .getElementById(
      "tableContent"
    )
    .classList.add("hidden");

  box.classList.remove(
    "hidden"
  );

  box.innerHTML=
    `<div class="loading">
       <div class="spinner"></div>
       A carregar jogos...
     </div>`;

  let eventos=[];

  /*
     RESULTADOS:
     só fazemos os 30 dias quando
     o utilizador escolhe o filtro
     Resultados.
  */

  if(
    filtroAtual==="final" &&
    !modoTodos &&
    !modoLive
  ){

    eventos=
      await buscarResultadosHistoricosLiga(
        ligaSelecionada,
        RESULTADOS_DIAS
      );

  }

  else if(
    modoTodos ||
    modoLive
  ){

    /*
       AO VIVO GLOBAL:
       utiliza sempre a data de hoje.
       Assim o botão AO VIVO não fica
       limitado à competição selecionada.
    */

    const resultados=[];
    const limite=5;

    const dataGlobalLive=
      modoLive
        ? dataHoje()
        : (
            diaSelecionado ||
            dataHoje()
          );

    for(
      let i=0;
      i<ligas.length;
      i+=limite
    ){

      const grupo=
        ligas.slice(
          i,
          i+limite
        );

      const grupoResultados=
        await Promise.all(
          grupo.map(
            x=>
              buscarJogosLiga(
                x[0],
                dataGlobalLive
              )
          )
        );

      grupoResultados.forEach(
        x=>
          resultados.push(...x)
      );

      if(
        token!==requestToken
      ){

        return;

      }

    }

    eventos=
      deduplicarEventos(
        resultados
      );

    if(modoLive){

      eventos=
        eventos.filter(
          isLive
        );

    }

  }

  else{

    eventos=
      await buscarJogosLiga(
        ligaSelecionada,
        diaSelecionado
      );

  }

  if(
    token!==requestToken
  ){

    return;

  }

  eventosAtuais=
    eventos;

  /*
     Fallback apenas para a competição
     selecionada e apenas quando não
     estamos no modo global/histórico.
  */

  if(
    !eventos.length &&
    !modoTodos &&
    !modoLive &&
    filtroAtual!=="final"
  ){

    const fallback=
      FALLBACK[
        ligaSelecionada
      ] || [];

    if(fallback.length){

      eventos=
        fallback.map(
          x=>
            criarEventoFallback(
              x[0],
              x[1],
              ligaSelecionada
            )
        );

      eventosAtuais=
        eventos;

    }

  }

  renderizarJogos(
    eventos
  );

}

/* =========================================================
   RENDERIZAR JOGOS
   ========================================================= */

function renderizarJogos(eventos){

  const box=
    document.getElementById(
      "gamesList"
    );

  let lista=[
    ...eventos
  ];

  if(modoLive){

    lista=
      lista.filter(
        isLive
      );

  }

  if(
    filtroAtual==="live"
  ){

    lista=
      lista.filter(
        isLive
      );

  }

  if(
    filtroAtual==="proximos"
  ){

    lista=
      lista.filter(
        e=>
          !isLive(e) &&
          !isFinal(e)
      );

  }

  if(
    filtroAtual==="final"
  ){

    lista=
      lista.filter(
        isFinal
      );

  }

  const input=
    document.getElementById(
      "searchInput"
    );

  const q=
    input
      ? input.value
          .trim()
          .toLowerCase()
      : "";

  if(q){

    lista=
      lista.filter(
        e=>{

          const c=
            getCompetidores(e);

          return c.some(
            x=>
              nomeEquipa(x)
                .toLowerCase()
                .includes(q)
          );

        }
      );

  }

  if(!lista.length){

    box.innerHTML=
      `<div class="empty">
        <div class="emptyIcon">⚽</div>
        <strong>Sem jogos encontrados</strong>
        <div style="margin-top:7px">
          Tenta outra data, competição ou filtro.
        </div>
      </div>`;

    return;

  }

  lista.sort(
    (a,b)=>
      new Date(
        a.date||0
      ) -
      new Date(
        b.date||0
      )
  );

  const grupos=
    new Map();

  lista.forEach(e=>{

    const liga=
      e.__futzoneLiga ||
      ligaSelecionada;

    if(
      !grupos.has(liga)
    ){

      grupos.set(
        liga,
        []
      );

    }

    grupos
      .get(liga)
      .push(e);

  });

  box.innerHTML="";

  grupos.forEach(
    (items,liga)=>{

      const bloco=
        document.createElement(
          "div"
        );

      bloco.className=
        "leagueBlock";

      const nome=
        ligas.find(
          x=>x[0]===liga
        )?.[1] ||
        nomeCompeticao(
          items[0],
          liga
        );

      bloco.innerHTML=
        `<div class="leagueBlockTitle">
          ${escapeHtml(nome)}
        </div>`;

      items.forEach(e=>{

        bloco.insertAdjacentHTML(
          "beforeend",
          cartaoJogo(e)
        );

      });

      box.appendChild(
        bloco
      );

    }
  );

}

async function buscarPerfilJogador(liga,id){
  if(!id) return null;

  const urls=[
    CORE_API+encodeURIComponent(liga)+"/athletes/"+encodeURIComponent(id),
    API+encodeURIComponent(liga)+"/athletes/"+encodeURIComponent(id),
    "https://sports.core.api.espn.com/v2/sports/soccer/athletes/"+encodeURIComponent(id)
  ];

  for(const url of urls){
    const data=await fetchAPI(url,8000,300000);
    if(data) return data;
  }

  return null;
}

function nomeJogador(j){
  return j?.displayName ||
         j?.fullName ||
         j?.name ||
         j?.athlete?.displayName ||
         "Jogador";
}

function fotoJogador(j){
  return j?.headshot?.href ||
         j?.headshot ||
         j?.athlete?.headshot?.href ||
         "";
}

function idJogador(j){
  return String(
    j?.id ||
    j?.athlete?.id ||
    ""
  );
}

function extrairEquipaDeReferencia(obj){
  if(!obj) return null;

  const team=
    obj.team ||
    obj.athlete?.team ||
    obj.competitor?.team ||
    obj.competitor ||
    null;

  if(!team) return null;

  return {
    id:String(team.id || ""),
    nome:team.displayName || team.name || team.shortDisplayName || "",
    logo:team.logo || team.logos?.[0]?.href || ""
  };
}

function extrairHistoricoJogador(data){
  const resultado=[];

  function adicionar(team,epoca){
    if(!team) return;

    const id=String(team.id || "");
    const nome=team.displayName || team.name || team.shortDisplayName || "";

    if(!nome) return;

    resultado.push({
      id,
      nome,
      logo:team.logo || team.logos?.[0]?.href || "",
      epoca:epoca || ""
    });
  }

  const fontes=[
    data?.teamHistory,
    data?.formerTeams,
    data?.teams,
    data?.history
  ];

  fontes.forEach(lista=>{
    if(Array.isArray(lista)){
      lista.forEach(item=>{
        adicionar(
          item?.team || item,
          item?.season?.displayName ||
          item?.season?.slug ||
          item?.season?.year ||
          ""
        );
      });
    }
  });

  if(data?.team){
    adicionar(data.team,"Atual");
  }

  if(data?.athlete?.team){
    adicionar(data.athlete.team,"Atual");
  }

  return resultado.filter((item,index,self)=>
    index===self.findIndex(x=>
      x.id===item.id &&
      x.epoca===item.epoca
    )
  );
}

async function buscarHistoricoJogador(liga,id){
  const perfil=await buscarPerfilJogador(liga,id);

  const historico=extrairHistoricoJogador(perfil);

  const anoAtual=new Date().getUTCFullYear();

  /*
   * Procura temporadas recentes através do eventlog.
   * Não bloqueia a aplicação se alguma temporada não existir.
   */
  const anos=[];

  for(let i=0;i<6;i++){
    anos.push(anoAtual-i);
  }

  for(const ano of anos){
    const url=
      "https://sports.core.api.espn.com/v2/sports/soccer/leagues/"+
      encodeURIComponent(liga)+
      "/seasons/"+
      encodeURIComponent(ano)+
      "/athletes/"+
      encodeURIComponent(id)+
      "/eventlog";

    const data=await fetchAPI(url,6500,300000);

    if(!data) continue;

    if(Array.isArray(data.teams)){
      data.teams.forEach(t=>{
        const team=
          t.team ||
          t;

        if(team){
          const nome=
            team.displayName ||
            team.name ||
            team.shortDisplayName ||
            "";

          if(nome){
            historico.push({
              id:String(team.id || ""),
              nome,
              logo:team.logo || team.logos?.[0]?.href || "",
              epoca:String(ano)
            });
          }
        }
      });
    }

    const eventos=
      Array.isArray(data.events)
        ? data.events
        : Array.isArray(data.events?.items)
          ? data.events.items
          : [];

    eventos.forEach(ev=>{
      const lista=
        ev?.competitors ||
        ev?.competition?.competitors ||
        ev?.competitions?.[0]?.competitors ||
        [];

      lista.forEach(comp=>{
        const team=comp?.team;

        if(team){
          const nome=
            team.displayName ||
            team.name ||
            team.shortDisplayName ||
            "";

          if(nome){
            historico.push({
              id:String(team.id || ""),
              nome,
              logo:team.logo || team.logos?.[0]?.href || "",
              epoca:String(ano)
            });
          }
        }
      });
    });
  }

  const unicos=[];

  historico.forEach(item=>{
    if(!item?.nome) return;

    const existe=unicos.some(x=>
      x.id===item.id &&
      x.epoca===item.epoca
    );

    if(!existe) unicos.push(item);
  });

  return {
    perfil,
    historico:unicos
  };
}

/* =========================================================
   TABELAS — PESQUISA ROBUSTA
   ========================================================= */

async function buscarTabelaLiga(liga){
  const urls=[
    STANDINGS_API+encodeURIComponent(liga)+"/standings",
    API+encodeURIComponent(liga)+"/standings"
  ];

  for(const url of urls){
    const data=await fetchAPI(url,10000,180000);

    if(!data) continue;

    const tabela=extrairTabelaESPN(data);

    if(tabela.length) return tabela;
  }

  return tabelaFallback(liga);
}

function valorStat(stats,names){
  if(!Array.isArray(stats)) return "";

  for(const nome of names){
    const stat=stats.find(s=>
      String(
        s?.name ||
        s?.shortName ||
        s?.abbreviation ||
        ""
      ).toLowerCase()===nome.toLowerCase()
    );

    if(stat){
      if(stat.value!==undefined) return stat.value;
      if(stat.displayValue!==undefined) return stat.displayValue;
    }
  }

  return "";
}

function extrairTabelaESPN(data){
  const resultado=[];

  function processarGrupo(grupo){

    if(!grupo || typeof grupo!=="object") return;

    const entries=
      grupo?.standings?.entries ||
      grupo?.entries ||
      grupo?.standings?.results ||
      [];

    if(Array.isArray(entries)){
      entries.forEach((entry,index)=>{

        const team=
          entry?.team ||
          entry?.competitor?.team ||
          entry?.competitor ||
          {};

        const stats=
          entry?.stats ||
          entry?.statistics ||
          entry?.teamStats ||
          [];

        const nome=
          team.displayName ||
          team.name ||
          team.shortDisplayName ||
          team.abbreviation ||
          "";

        if(!nome) return;

        const posRaw=
          valorStat(stats,[
            "rank",
            "position",
            "pos"
          ]) ||
          entry?.rank ||
          entry?.position ||
          entry?.note?.rank ||
          index+1;

        const jogados=
          valorStat(stats,[
            "gamesPlayed",
            "played",
            "gp",
            "games"
          ]);

        const vitorias=
          valorStat(stats,[
            "wins",
            "win"
          ]);

        const empates=
          valorStat(stats,[
            "ties",
            "draws",
            "draw"
          ]);

        const derrotas=
          valorStat(stats,[
            "losses",
            "loss"
          ]);

        const gf=
          valorStat(stats,[
            "pointsFor",
            "goalsFor",
            "gf"
          ]);

        const ga=
          valorStat(stats,[
            "pointsAgainst",
            "goalsAgainst",
            "ga"
          ]);

        const gd=
          valorStat(stats,[
            "pointDifferential",
            "goalDifference",
            "gd"
          ]);

        const pontos=
          valorStat(stats,[
            "points",
            "pts"
          ]);

        resultado.push({
          id:String(team.id || ""),
          nome,
          logo:
            team.logo ||
            team.logos?.[0]?.href ||
            "",
          pos:posRaw,
          jogados,
          vitorias,
          empates,
          derrotas,
          gf,
          ga,
          gd,
          pontos
        });
      });
    }

    const filhos=[];

    if(Array.isArray(grupo.children)){
      filhos.push(...grupo.children);
    }

    if(Array.isArray(grupo.groups)){
      filhos.push(...grupo.groups);
    }

    if(Array.isArray(grupo.standings?.children)){
      filhos.push(...grupo.standings.children);
    }

    filhos.forEach(processarGrupo);
  }

  processarGrupo(data);

  if(Array.isArray(data?.children)){
    data.children.forEach(processarGrupo);
  }

  const unicos=[];

  resultado.forEach(item=>{
    if(!item.nome) return;

    const existe=unicos.some(x=>
      x.id &&
      item.id &&
      x.id===item.id
    );

    if(!existe) unicos.push(item);
  });

  return unicos.map((item,index)=>({
    ...item,
    pos:item.pos || index+1
  }));
}

function abrirOverlay(){
  const overlay=document.getElementById("overlay");

  if(overlay){
    overlay.classList.add("open");
  }
}

function fecharOverlay(){
  overlayRequestToken++;

  const overlay=document.getElementById("overlay");

  if(overlay){
    overlay.classList.remove("open");
  }
}

}

function mostrarFavoritos(){

document
