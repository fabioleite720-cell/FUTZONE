<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 padding-bottom:75px
}

header{
 background:#000;
 padding:18px 16px;
 border-bottom:1px solid #222;
 position:sticky;
 top:0;
 z-index:10
}

.logo{
 font-size:30px;
 font-weight:900;
 letter-spacing:-1px
}

.logo span{
 color:#1976ff
}

.subtitle{
 color:#aaa;
 font-size:12px;
 margin-top:3px
}

.filters,.leagues{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:12px 14px 4px
}

.filters button,.leagues button{
 flex:none;
 border:1px solid #292929;
 background:#111;
 color:#ddd;
 border-radius:20px;
 padding:9px 14px;
 font-size:13px
}

.filters button.active,
.leagues button.active{
 background:#1976ff;
 border-color:#1976ff;
 color:#fff;
 font-weight:bold
}

#app{
 padding:12px
}

.section-title{
 font-size:20px;
 font-weight:800;
 margin:12px 2px
}

.card{
 background:#0d0d0d;
 border:1px solid #252525;
 border-radius:14px;
 margin-bottom:12px;
 overflow:hidden
}

.card-head{
 padding:10px 12px;
 display:flex;
 justify-content:space-between;
 color:#999;
 font-size:11px;
 border-bottom:1px solid #202020
}

.game{
 padding:16px 10px
}

.teams{
 display:flex;
 align-items:center;
 justify-content:space-between;
 text-align:center;
 gap:8px
}

.team{
 width:38%;
 font-size:14px;
 font-weight:bold;
 cursor:pointer
}

.team:hover{
 color:#1976ff
}

.score{
 width:24%;
 font-size:23px;
 font-weight:900
}

.status{
 text-align:center;
 color:#888;
 font-size:11px;
 margin-top:9px
}

.live{
 color:#ff304f;
 font-weight:bold
}

.next{
 color:#1976ff
}

.result{
 color:#aaa
}

.table-wrap{
 overflow-x:auto;
 background:#0d0d0d;
 border:1px solid #252525;
 border-radius:14px;
 margin-bottom:18px
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:500px
}

th,td{
 padding:11px 7px;
 border-bottom:1px solid #202020;
 font-size:12px;
 text-align:center
}

th{
 color:#888;
 font-weight:normal
}

td:nth-child(2){
 text-align:left;
 font-weight:bold
}

.team-link{
 cursor:pointer
}

.team-link:hover{
 color:#1976ff
}

.position{
 color:#777;
 width:30px
}

.pts{
 color:#1976ff;
 font-weight:900
}

.team-page{
 background:#0d0d0d;
 border:1px solid #252525;
 border-radius:15px;
 overflow:hidden
}

.team-cover{
 padding:24px 16px;
 background:#0a0a0a;
 border-bottom:1px solid #222
}

.team-name{
 font-size:25px;
 font-weight:900
}

.team-league{
 color:#1976ff;
 font-size:13px;
 margin-top:5px
}

.back{
 border:0;
 background:#1976ff;
 color:white;
 padding:10px 15px;
 border-radius:9px;
 font-weight:bold;
 margin-bottom:18px
}

.team-games{
 padding:15px
}

.loading,.empty{
 text-align:center;
 color:#888;
 padding:45px 15px
}

.error{
 color:#ff5065;
 text-align:center;
 padding:30px
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:68px;
 background:#000;
 border-top:1px solid #222;
 display:flex;
 z-index:20
}

nav button{
 flex:1;
 background:none;
 border:0;
 color:#777;
 font-size:11px
}

nav button.active{
 color:#1976ff
}

nav span{
 display:block;
 font-size:22px;
 margin-bottom:3px
}
</style>
</head>

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>
 <div class="subtitle">Futebol em direto</div>
</header>

<div class="filters">
 <button class="filter active" data-filter="todos">Todos</button>
 <button class="filter" data-filter="live">🔴 LIVE</button>
 <button class="filter" data-filter="proximo">🕐 Próximos</button>
 <button class="filter" data-filter="resultado">✅ Resultados</button>
</div>

<div class="leagues">
 <button class="league active" data-league="todos">Todas</button>
 <button class="league" data-league="por">🇵🇹 Portugal</button>
 <button class="league" data-league="eng">🏴 Inglaterra</button>
 <button class="league" data-league="esp">🇪🇸 Espanha</button>
 <button class="league" data-league="ita">🇮🇹 Itália</button>
 <button class="league" data-league="ger">🇩🇪 Alemanha</button>
</div>

<main id="app">
 <div class="loading">A carregar FUTZONE...</div>
</main>

<nav>
 <button class="active" data-page="jogos">
  <span>⚽</span>Jogos
 </button>

 <button data-page="tabelas">
  <span>🏆</span>Tabelas
 </button>

 <button data-page="favoritos">
  <span>⭐</span>Favoritos
 </button>
</nav>

<script>

const LIGAS={
 por:{
  nome:"Primeira Liga",
  jogos:"primeira-liga.json",
  tabela:"classificacao.json"
 },
 eng:{
  nome:"Premier League",
  jogos:"premier-league.json",
  tabela:"premier-league-classificacao.json"
 },
 esp:{
  nome:"La Liga",
  jogos:"la-liga.json",
  tabela:"la-liga-classificacao.json"
 },
 ita:{
  nome:"Serie A",
  jogos:"serie-a.json",
  tabela:"serie-a-classificacao.json"
 },
 ger:{
  nome:"Bundesliga",
  jogos:"bundesliga.json",
  tabela:"bundesliga-classificacao.json"
 }
};

let jogos=[];
let tabelas={};
let filtro="todos";
let ligaAtual="todos";
let pagina="jogos";
let equipaAtual=null;

const app=document.getElementById("app");

async function carregar(){

 jogos=[];

 const pedidos=Object.keys(LIGAS).map(async codigo=>{

  try{

   const r=await fetch(
    "data/"+LIGAS[codigo].jogos+"?v="+Date.now()
   );

   if(!r.ok)return;

   const d=await r.json();

   if(!d.events)return;

   d.events.forEach(j=>{
    j.__liga=codigo;
    jogos.push(j);
   });

  }catch(e){
   console.log(e);
  }

 });

 await Promise.all(pedidos);

 render();
}

function render(){

 if(pagina==="jogos"){
  mostrarJogos();
  return;
 }

 if(pagina==="tabelas"){
  mostrarTabelas();
  return;
 }

 if(pagina==="favoritos"){
  mostrarFavoritos();
  return;
 }

 if(pagina==="equipa"){
  mostrarEquipa();
 }
}

function estado(j){

 const c=j.competitions &&
 j.competitions[0];

 if(!c)return"proximo";

 const s=c.status;

 if(!s)return"proximo";

 if(s.type && s.type.state==="in")
  return"live";

 if(s.type && s.type.completed)
  return"resultado";

 if(s.type && s.type.state==="post")
  return"resultado";

 return"proximo";
}

function dataJogo(j){

 const c=j.competitions &&
 j.competitions[0];

 if(c && c.date)
  return new Date(c.date);

 if(j.date)
  return new Date(j.date);

 return null;
}

function equipaNome(t){

 if(!t)return"?";

 return t.displayName ||
 t.shortDisplayName ||
 t.name ||
 "?";
}

function equipaId(t){

 if(!t)return"";

 return String(t.id || "");
}

function mostrarJogos(){

 let lista=jogos.slice();

 if(ligaAtual!=="todos"){
  lista=lista.filter(j=>j.__liga===ligaAtual);
 }

 if(filtro!=="todos"){
  lista=lista.filter(j=>estado(j)===filtro);
 }

 lista.sort((a,b)=>{

  const da=dataJogo(a);
  const db=dataJogo(b);

  if(!da || !db)return 0;

  return da-db;
 });

 if(!lista.length){
  app.innerHTML=
  '<div class="empty">Não existem jogos para mostrar.</div>';
  return;
 }

 let html="";

 lista.forEach(j=>{
  html+=jogoCard(j);
 });

 app.innerHTML=html;
}

function jogoCard(j){

 const c=j.competitions &&
 j.competitions[0];

 if(!c)return"";

 const casa=c.competitors &&
 c.competitors.find(x=>x.homeAway==="home");

 const fora=c.competitors &&
 c.competitors.find(x=>x.homeAway==="away");

 const e=estado(j);
 const d=dataJogo(j);

 let hora="";

 if(d){
  hora=d.toLocaleString(
   "pt-PT",
   {
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
   }
  );
 }

 let estadoTexto="Próximo";

 if(e==="live")estadoTexto="🔴 LIVE";
 if(e==="resultado")estadoTexto="Final";

 return `
 <div class="card">

  <div class="card-head">
   <span>${LIGAS[j.__liga].nome}</span>
   <span>${hora}</span>
  </div>

  <div class="game">

   <div class="teams">

    <div class="team"
     data-team-id="${equipaId(casa&&casa.team)}"
     data-team-name="${esc(
      equipaNome(casa&&casa.team)
     )}"
     data-team-league="${j.__liga}">
     ${esc(equipaNome(casa&&casa.team))}
    </div>

    <div class="score">
     ${
      casa&&casa.score!==undefined
      ? esc(String(casa.score))
      : "-"
     }
     -
     ${
      fora&&fora.score!==undefined
      ? esc(String(fora.score))
      : "-"
     }
    </div>

    <div class="team"
     data-team-id="${equipaId(fora&&fora.team)}"
     data-team-name="${esc(
      equipaNome(fora&&fora.team)
     )}"
     data-team-league="${j.__liga}">
     ${esc(equipaNome(fora&&fora.team))}
    </div>

   </div>

   <div class="status ${
    e==="live"?"live":
    e==="proximo"?"next":"result"
   }">
    ${estadoTexto}
   </div>

  </div>

 </div>
 `;
}

function esc(text){

 return String(text||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


/* =========================
   TABELAS
========================= */

async function carregarTabela(codigo){

 if(tabelas[codigo])
  return tabelas[codigo];

 try{

  const r=await fetch(
   "data/"+LIGAS[codigo].tabela+"?v="+Date.now()
  );

  if(!r.ok)return null;

  const d=await r.json();

  tabelas[codigo]=d;

  return d;

 }catch(e){

  console.log(e);
  return null;

 }
}

function procurarEntries(obj){

 if(!obj || typeof obj!=="object")
  return null;

 if(Array.isArray(obj)){

  if(obj.length){

   const valido=obj.some(x=>
    x &&
    typeof x==="object" &&
    x.team &&
    Array.isArray(x.stats)
   );

   if(valido)return obj;
  }

  for(const item of obj){

   const resultado=
    procurarEntries(item);

   if(resultado)return resultado;
  }

 }

 for(const key in obj){

  if(!Object.prototype.hasOwnProperty.call(obj,key))
   continue;

  const resultado=
   procurarEntries(obj[key]);

  if(resultado)return resultado;
 }

 return null;
}

function valorStat(item,nome){

 if(!item || !Array.isArray(item.stats))
  return 0;

 const s=item.stats.find(x=>
  x.name===nome ||
  x.abbreviation===nome
 );

 if(!s)return 0;

 if(s.displayValue!==undefined)
  return s.displayValue;

 if(s.value!==undefined)
  return s.value;

 return 0;
}

async function mostrarTabelas(){

 app.innerHTML=
 '<div class="loading">A carregar tabelas...</div>';

 let codigos=
  ligaAtual==="todos"
  ? Object.keys(LIGAS)
  : [ligaAtual];

 let html="";

 for(const codigo of codigos){

  const dados=
   await carregarTabela(codigo);

  html+=criarTabela(codigo,dados);
 }

 app.innerHTML=html ||
 '<div class="empty">Sem classificações.</div>';
}

function criarTabela(codigo,dados){

 const entries=
  procurarEntries(dados);

 if(!entries){

  return `
  <div class="section-title">
   ${LIGAS[codigo].nome}
  </div>

  <div class="card">
   <div class="empty">
    Classificação indisponível.
   </div>
  </div>
  `;
 }

 let rows="";

 entries.forEach((item,index)=>{

  const t=item.team || {};

  const nome=
   t.displayName ||
   t.name ||
   "Equipa";

  const id=esc(t.id||"");

  const jogos=
   valorStat(item,"gamesPlayed") ||
   valorStat(item,"GP");

  const v=
   valorStat(item,"wins") ||
   valorStat(item,"W");

  const e=
   valorStat(item,"ties") ||
   valorStat(item,"draws") ||
   valorStat(item,"D");

  const d=
   valorStat(item,"losses") ||
   valorStat(item,"L");

  const pts=
   valorStat(item,"points") ||
   valorStat(item,"PTS");

  rows+=`
  <tr>

   <td class="position">
    ${index+1}
   </td>

   <td>
    <span
     class="team-link"
     data-team-id="${id}"
     data-team-name="${esc(nome)}"
     data-team-league="${codigo}">
     ${esc(nome)}
    </span>
   </td>

   <td>${esc(jogos)}</td>
   <td>${esc(v)}</td>
   <td>${esc(e)}</td>
   <td>${esc(d)}</td>

   <td class="pts">
    ${esc(pts)}
   </td>

  </tr>
  `;
 });

 return `
 <div class="section-title">
  ${LIGAS[codigo].nome}
 </div>

 <div class="table-wrap">

  <table>

   <thead>
    <tr>
     <th>#</th>
     <th>Equipa</th>
     <th>J</th>
     <th>V</th>
     <th>E</th>
     <th>D</th>
     <th>Pts</th>
    </tr>
   </thead>

   <tbody>
    ${rows}
   </tbody>

  </table>

 </div>
 `;
}


/* =========================
   EQUIPA
========================= */

function mostrarEquipa(){

 if(!equipaAtual){
  pagina="jogos";
  render();
  return;
 }

 const nome=equipaAtual.nome;
 const codigo=equipaAtual.liga;

 const relacionados=
  jogos.filter(j=>{

   if(j.__liga!==codigo)
    return false;

   const c=j.competitions &&
   j.competitions[0];

   if(!c)return false;

   return c.competitors &&
   c.competitors.some(x=>
    equipaId(x.team)===equipaAtual.id ||
    equipaNome(x.team)===nome
   );

  });

 let html=`

 <div class="team-page">

  <div class="team-cover">

   <button class="back" id="voltar">
    ← Voltar
   </button>

   <div class="team-name">
    ${esc(nome)}
   </div>

   <div class="team-league">
    ${esc(LIGAS[codigo].nome)}
   </div>

  </div>

  <div class="team-games">

   <div class="section-title">
    Jogos da equipa
   </div>
 `;

 if(!relacionados.length){

  html+=`
   <div class="empty">
    Não existem jogos disponíveis.
   </div>
  `;

 }else{

  relacionados
  .sort((a,b)=>{
   const da=dataJogo(a);
   const db=dataJogo(b);
   if(!da||!db)return 0;
   return da-db;
  })
  .forEach(j=>{
   html+=jogoCard(j);
  });

 }

 html+=`
  </div>
 </div>
 `;

 app.innerHTML=html;

 document
 .getElementById("voltar")
 .addEventListener("click",()=>{
  pagina="jogos";
  equipaAtual=null;
  render();
 });

}


/* =========================
   FAVORITOS
========================= */

function getFavoritos(){

 try{

  return JSON.parse(
   localStorage.getItem(
    "futzone_favoritos"
   )||"[]"
  );

 }catch(e){

  return [];

 }
}

function mostrarFavoritos(){

 const fav=getFavoritos();

 if(!fav.length){

  app.innerHTML=`
   <div class="empty">
    ⭐ Ainda não tens equipas favoritas.
   </div>
  `;

  return;
 }

 let html=
 '<div class="section-title">⭐ Favoritos</div>';

 fav.forEach(x=>{

  html+=`
  <div class="card">

   <div class="game">

    <div class="team"
     data-team-id="${esc(x.id)}"
     data-team-name="${esc(x.nome)}"
     data-team-league="${esc(x.liga)}">

     ${esc(x.nome)}

    </div>

   </div>

  </div>
  `;

 });

 app.innerHTML=html;
}


/* =========================
   EVENTOS
========================= */

document
 .querySelectorAll(".filter")
 .forEach(btn=>{

  btn.addEventListener("click",()=>{

   document
    .querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   filtro=btn.dataset.filter;

   pagina="jogos";

   document
    .querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

   document
    .querySelector(
     'nav button[data-page="jogos"]'
    )
    .classList.add("active");

   render();

  });

 });


document
 .querySelectorAll(".league")
 .forEach(btn=>{

  btn.addEventListener("click",()=>{

   document
    .querySelectorAll(".league")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   ligaAtual=btn.dataset.league;

   render();

  });

 });


document
 .querySelectorAll("nav button")
 .forEach(btn=>{

  btn.addEventListener("click",()=>{

   document
    .querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   pagina=btn.dataset.page;

   render();

  });

 });


app.addEventListener("click",event=>{

 const team=event.target.closest(
  ".team,.team-link"
 );

 if(!team)return;

 const id=team.dataset.teamId;
 const nome=team.dataset.teamName;
 const liga=team.dataset.teamLeague;

 if(!nome)return;

 equipaAtual={
  id:id||"",
  nome:nome,
  liga:liga||"por"
 };

 pagina="equipa";

 render();

});


carregar();

</script>

</body>
</html>
