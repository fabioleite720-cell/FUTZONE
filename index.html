<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:75px
}

header{
background:#000;
padding:18px 16px;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:30px;
font-weight:900
}

.logo span{
color:#1976ff
}

.subtitle{
color:#999;
font-size:12px;
margin-top:3px
}

.filters,.leagues{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 14px 4px
}

.filters button,.leagues button{
flex:none;
border:1px solid #292929;
background:#111;
color:#ddd;
border-radius:20px;
padding:9px 14px
}

.filters button.active,
.leagues button.active{
background:#1976ff;
border-color:#1976ff;
color:#fff;
font-weight:bold
}

#app{
padding:12px
}

.card{
background:#0d0d0d;
border:1px solid #252525;
border-radius:14px;
margin-bottom:12px;
overflow:hidden
}

.card-head{
padding:10px 12px;
color:#888;
font-size:11px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #202020
}

.game{
padding:16px 10px
}

.teams{
display:flex;
align-items:center;
justify-content:space-between;
text-align:center;
gap:8px
}

.team{
width:38%;
font-size:14px;
font-weight:bold;
cursor:pointer
}

.team:hover,
.team-link:hover{
color:#1976ff
}

.score{
width:24%;
font-size:23px;
font-weight:900
}

.status{
text-align:center;
color:#888;
font-size:11px;
margin-top:9px
}

.live{
color:#ff304f;
font-weight:bold
}

.next{
color:#1976ff
}

.result{
color:#aaa
}

.section-title{
font-size:20px;
font-weight:900;
margin:16px 2px 12px
}

.table-wrap{
overflow-x:auto;
background:#0d0d0d;
border:1px solid #252525;
border-radius:14px;
margin-bottom:18px
}

table{
width:100%;
border-collapse:collapse;
min-width:500px
}

th,td{
padding:11px 7px;
border-bottom:1px solid #202020;
font-size:12px;
text-align:center
}

th{
color:#888
}

td:nth-child(2){
text-align:left;
font-weight:bold
}

.team-link{
cursor:pointer
}

.position{
color:#777
}

.pts{
color:#1976ff;
font-weight:900
}

.team-page{
background:#0d0d0d;
border:1px solid #252525;
border-radius:15px;
overflow:hidden
}

.team-cover{
padding:22px 16px;
background:#090909;
border-bottom:1px solid #222
}

.team-name{
font-size:25px;
font-weight:900
}

.team-league{
color:#1976ff;
font-size:13px;
margin-top:5px
}

.back{
border:0;
background:#1976ff;
color:white;
padding:10px 15px;
border-radius:9px;
font-weight:bold;
margin-bottom:18px
}

.team-games{
padding:15px
}

.player{
display:flex;
align-items:center;
gap:12px;
background:#111;
border:1px solid #252525;
border-radius:12px;
padding:10px;
margin-bottom:8px
}

.player-photo{
width:58px;
height:58px;
min-width:58px;
border-radius:50%;
background:#191919;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:28px
}

.player-photo img{
width:100%;
height:100%;
object-fit:cover
}

.player-info{
min-width:0
}

.player-name{
font-size:15px;
font-weight:bold
}

.player-details{
color:#1976ff;
font-size:12px;
margin-top:5px
}

.player-country{
color:#888;
font-size:11px;
margin-top:4px
}

.loading,.empty{
text-align:center;
color:#888;
padding:40px 15px
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:68px;
background:#000;
border-top:1px solid #222;
display:flex;
z-index:20
}

nav button{
flex:1;
background:none;
border:0;
color:#777;
font-size:11px
}

nav button.active{
color:#1976ff
}

nav span{
display:block;
font-size:22px;
margin-bottom:3px
}
</style>
</head>

<body>

<header>
<div class="logo">FUT<span>ZONE</span></div>
<div class="subtitle">Futebol em direto</div>
</header>

<div class="filters">
<button class="filter active" data-filter="todos">Todos</button>
<button class="filter" data-filter="live">🔴 LIVE</button>
<button class="filter" data-filter="proximo">🕐 Próximos</button>
<button class="filter" data-filter="resultado">✅ Resultados</button>
</div>

<div class="leagues">
<button class="league active" data-league="todos">Todas</button>
<button class="league" data-league="por">🇵🇹 Portugal</button>
<button class="league" data-league="eng">🏴 Inglaterra</button>
<button class="league" data-league="esp">🇪🇸 Espanha</button>
<button class="league" data-league="ita">🇮🇹 Itália</button>
<button class="league" data-league="ger">🇩🇪 Alemanha</button>
</div>

<main id="app">
<div class="loading">A carregar FUTZONE...</div>
</main>

<nav>

<button class="active" data-page="jogos">
<span>⚽</span>Jogos
</button>

<button data-page="tabelas">
<span>🏆</span>Tabelas
</button>

<button data-page="favoritos">
<span>⭐</span>Favoritos
</button>

</nav>

<script>

const LIGAS={
por:{
nome:"Primeira Liga",
jogos:"primeira-liga.json",
tabela:"classificacao.json"
},
eng:{
nome:"Premier League",
jogos:"premier-league.json",
tabela:"premier-league-classificacao.json"
},
esp:{
nome:"La Liga",
jogos:"la-liga.json",
tabela:"la-liga-classificacao.json"
},
ita:{
nome:"Serie A",
jogos:"serie-a.json",
tabela:"serie-a-classificacao.json"
},
ger:{
nome:"Bundesliga",
jogos:"bundesliga.json",
tabela:"bundesliga-classificacao.json"
}
};

let jogos=[];
let tabelas={};
let filtro="todos";
let ligaAtual="todos";
let pagina="jogos";
let equipaAtual=null;

const app=document.getElementById("app");

function esc(t){
return String(t||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function equipaNome(t){
if(!t)return"?";
return t.displayName||t.shortDisplayName||t.name||"?";
}

function equipaId(t){
if(!t)return"";
return String(t.id||"");
}

function dataJogo(j){

const c=j.competitions&&j.competitions[0];

if(c&&c.date)return new Date(c.date);

if(j.date)return new Date(j.date);

return null;
}

function estado(j){

const c=j.competitions&&j.competitions[0];

if(!c)return"proximo";

const s=c.status;

if(!s)return"proximo";

if(s.type&&s.type.state==="in")
return"live";

if(s.type&&s.type.completed)
return"resultado";

if(s.type&&s.type.state==="post")
return"resultado";

return"proximo";
}

async function carregar(){

jogos=[];

const pedidos=Object.keys(LIGAS).map(async codigo=>{

try{

const r=await fetch(
"data/"+LIGAS[codigo].jogos+"?v="+Date.now()
);

if(!r.ok)return;

const d=await r.json();

if(!d.events)return;

d.events.forEach(j=>{
j.__liga=codigo;
jogos.push(j);
});

}catch(e){
console.log(e);
}

});

await Promise.all(pedidos);

render();
}

function render(){

if(pagina==="jogos"){
mostrarJogos();
return;
}

if(pagina==="tabelas"){
mostrarTabelas();
return;
}

if(pagina==="favoritos"){
mostrarFavoritos();
return;
}

if(pagina==="equipa"){
mostrarEquipa();
}

}

function mostrarJogos(){

let lista=jogos.slice();

if(ligaAtual!=="todos")
lista=lista.filter(j=>j.__liga===ligaAtual);

if(filtro!=="todos")
lista=lista.filter(j=>estado(j)===filtro);

lista.sort((a,b)=>{
const da=dataJogo(a);
const db=dataJogo(b);

if(!da||!db)return 0;

return da-db;
});

if(!lista.length){

app.innerHTML=
'<div class="empty">Não existem jogos para mostrar.</div>';

return;
}

let html="";

lista.forEach(j=>{
html+=jogoCard(j);
});

app.innerHTML=html;
}

function jogoCard(j){

const c=j.competitions&&j.competitions[0];

if(!c)return"";

const casa=c.competitors&&
c.competitors.find(x=>x.homeAway==="home");

const fora=c.competitors&&
c.competitors.find(x=>x.homeAway==="away");

const e=estado(j);
const d=dataJogo(j);

let hora="";

if(d){

hora=d.toLocaleString("pt-PT",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
});

}

let texto="Próximo";

if(e==="live")texto="🔴 LIVE";

if(e==="resultado")texto="Final";

return`

<div class="card">

<div class="card-head">
<span>${esc(LIGAS[j.__liga].nome)}</span>
<span>${esc(hora)}</span>
</div>

<div class="game">

<div class="teams">

<div class="team"
data-team-id="${esc(equipaId(casa&&casa.team))}"
data-team-name="${esc(equipaNome(casa&&casa.team))}"
data-team-league="${esc(j.__liga)}">

${esc(equipaNome(casa&&casa.team))}

</div>

<div class="score">

${
casa&&casa.score!==undefined
?esc(casa.score)
:"-"
}

-

${
fora&&fora.score!==undefined
?esc(fora.score)
:"-"
}

</div>

<div class="team"
data-team-id="${esc(equipaId(fora&&fora.team))}"
data-team-name="${esc(equipaNome(fora&&fora.team))}"
data-team-league="${esc(j.__liga)}">

${esc(equipaNome(fora&&fora.team))}

</div>

</div>

<div class="status ${
e==="live"?"live":
e==="proximo"?"next":"result"
}">
${texto}
</div>

</div>

</div>

`;

}


/* =====================
TABELAS
===================== */

async function carregarTabela(codigo){

if(tabelas[codigo])
return tabelas[codigo];

try{

const r=await fetch(
"data/"+LIGAS[codigo].tabela+"?v="+Date.now()
);

if(!r.ok)return null;

const d=await r.json();

tabelas[codigo]=d;

return d;

}catch(e){

return null;

}

}

function procurarEntries(obj){

if(!obj||typeof obj!=="object")
return null;

if(Array.isArray(obj)){

if(obj.length){

const valido=obj.some(x=>
x&&typeof x==="object"&&x.team
);

if(valido)return obj;
}

for(const x of obj){

const r=procurarEntries(x);

if(r)return r;

}

}

for(const key in obj){

const r=procurarEntries(obj[key]);

if(r)return r;

}

return null;
}

function stat(item,nome){

if(!item||!Array.isArray(item.stats))
return 0;

const s=item.stats.find(x=>
x.name===nome||
x.abbreviation===nome
);

if(!s)return 0;

return s.displayValue!==undefined
?s.displayValue
:s.value||0;
}

async function mostrarTabelas(){

app.innerHTML=
'<div class="loading">A carregar tabelas...</div>';

const codigos=
ligaAtual==="todos"
?Object.keys(LIGAS)
:[ligaAtual];

let html="";

for(const codigo of codigos){

const dados=
await carregarTabela(codigo);

html+=criarTabela(codigo,dados);

}

app.innerHTML=html||
'<div class="empty">Sem classificações.</div>';
}

function criarTabela(codigo,dados){

const entries=procurarEntries(dados);

if(!entries){

return`

<div class="section-title">
${esc(LIGAS[codigo].nome)}
</div>

<div class="card">
<div class="empty">
Classificação indisponível.
</div>
</div>

`;

}

let rows="";

entries.forEach((item,index)=>{

const t=item.team||{};

const nome=
t.displayName||
t.name||
"Equipa";

const id=esc(t.id||"");

const j=
stat(item,"gamesPlayed")||
stat(item,"GP");

const v=
stat(item,"wins")||
stat(item,"W");

const e=
stat(item,"ties")||
stat(item,"draws")||
stat(item,"D");

const d=
stat(item,"losses")||
stat(item,"L");

const pts=
stat(item,"points")||
stat(item,"PTS");

rows+=`

<tr>

<td class="position">
${index+1}
</td>

<td>

<span
class="team-link"
data-team-id="${id}"
data-team-name="${esc(nome)}"
data-team-league="${codigo}">

${esc(nome)}

</span>

</td>

<td>${esc(j)}</td>
<td>${esc(v)}</td>
<td>${esc(e)}</td>
<td>${esc(d)}</td>
<td class="pts">${esc(pts)}</td>

</tr>

`;

});

return`

<div class="section-title">
${esc(LIGAS[codigo].nome)}
</div>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>#</th>
<th>Equipa</th>
<th>J</th>
<th>V</th>
<th>E</th>
<th>D</th>
<th>Pts</th>
</tr>

</thead>

<tbody>
${rows}
</tbody>

</table>

</div>

`;
}


/* =====================
EQUIPA + PLANTEL
===================== */

async function mostrarEquipa(){

if(!equipaAtual){

pagina="jogos";
render();
return;

}

const nome=equipaAtual.nome;
const codigo=equipaAtual.liga;
const id=equipaAtual.id;

app.innerHTML=`

<div class="team-page">

<div class="team-cover">

<button class="back" id="voltar">
← Voltar
</button>

<div class="team-name">
${esc(nome)}
</div>

<div class="team-league">
${esc(LIGAS[codigo].nome)}
</div>

</div>

<div class="team-games">

<div class="section-title">
👥 Plantel
</div>

<div id="plantel">
<div class="loading">
A carregar jogadores...
</div>
</div>

<div class="section-title">
⚽ Jogos da equipa
</div>

<div id="jogos-equipa">
<div class="loading">
A carregar jogos...
</div>
</div>

</div>

</div>
`;

document
.getElementById("voltar")
.addEventListener("click",()=>{
pagina="jogos";
equipaAtual=null;
render();
});


/* JOGOS */

const relacionados=jogos.filter(j=>{

if(j.__liga!==codigo)
return false;

const c=j.competitions&&j.competitions[0];

if(!c||!c.competitors)
return false;

return c.competitors.some(x=>
equipaId(x.team)===id||
equipaNome(x.team)===nome
);

});

let jhtml="";

relacionados
.sort((a,b)=>{

const da=dataJogo(a);
const db=dataJogo(b);

if(!da||!db)return 0;

return da-db;

})
.forEach(j=>{
jhtml+=jogoCard(j);
});

document
.getElementById("jogos-equipa")
.innerHTML=
jhtml||
'<div class="empty">Sem jogos disponíveis.</div>';


/* PLANTEL */

try{

const r=await fetch(
"data/planteis.json?v="+Date.now()
);

if(!r.ok)
throw new Error("Erro");

const dados=await r.json();

const plantel=dados[id];

if(!plantel||
!Array.isArray(plantel.jogadores)||
!plantel.jogadores.length){

document
.getElementById("plantel")
.innerHTML=
'<div class="empty">Plantel não disponível.</div>';

return;

}

let phtml="";

plantel.jogadores.forEach(j=>{

let foto="";

if(j.foto)
foto=j.foto;

let detalhes="";

if(j.numero)
detalhes+="🔢 "+esc(j.numero);

if(j.posicao){

if(detalhes)
detalhes+=" · ";

detalhes+="⚽ "+esc(j.posicao);

}

let pais="";

if(j.nacionalidade)
pais=
'<div class="player-country">🌍 '+
esc(j.nacionalidade)+
'</div>';

phtml+=`

<div class="player">

<div class="player-photo">

${
foto
?'<img src="'+
esc(foto)+
'" alt="'+
esc(j.nome)+
'">'
:"👤"
}

</div>

<div class="player-info">

<div class="player-name">
${esc(j.nome)}
</div>

<div class="player-details">
${detalhes}
</div>

${pais}

</div>

</div>

`;

});

document
.getElementById("plantel")
.innerHTML=phtml;

}catch(e){

console.log(e);

document
.getElementById("plantel")
.innerHTML=
'<div class="empty">Não foi possível carregar o plantel.</div>';

}

}


/* =====================
FAVORITOS
===================== */

function mostrarFavoritos(){

app.innerHTML=`

<div class="section-title">
⭐ Favoritos
</div>

<div class="empty">
Em breve poderás guardar aqui as tuas equipas favoritas.
</div>

`;

}


/* =====================
CLIQUE EQUIPA
===================== */

app.addEventListener("click",function(event){

const el=event.target.closest(
".team,.team-link"
);

if(!el)return;

const nome=el.dataset.teamName;

if(!nome)return;

equipaAtual={
id:el.dataset.teamId||"",
nome:nome,
liga:el.dataset.teamLeague||"por"
};

pagina="equipa";

render();

});


/* FILTROS */

document
.querySelectorAll(".filter")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

filtro=btn.dataset.filter;

pagina="jogos";

document
.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

document
.querySelector(
'nav button[data-page="jogos"]'
)
.classList.add("active");

render();

});

});


/* LIGAS */

document
.querySelectorAll(".league")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll(".league")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

ligaAtual=btn.dataset.league;

render();

});

});


/* MENU */

document
.querySelectorAll("nav button")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

pagina=btn.dataset.page;

render();

});

});


carregar();

</script>

</body>
</html>
