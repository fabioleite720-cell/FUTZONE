<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2
   JOGOS + DATAS + TODAS AS LIGAS + AO VIVO + TABELAS
   ========================================================= */

const FZ_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const FZ_STANDINGS = "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [
  { id:"por.1", name:"Liga Portugal", flag:"🇵🇹" },
  { id:"por.2", name:"Liga Portugal 2", flag:"🇵🇹" },
  { id:"por.3", name:"Liga 3", flag:"🇵🇹" },
  { id:"por.w.1", name:"Liga BPI Feminina", flag:"🇵🇹" },

  { id:"eng.1", name:"Premier League", flag:"🇬🇧" },
  { id:"eng.2", name:"Championship", flag:"🇬🇧" },

  { id:"esp.1", name:"LaLiga", flag:"🇪🇸" },
  { id:"esp.2", name:"LaLiga 2", flag:"🇪🇸" },

  { id:"ita.1", name:"Serie A", flag:"🇮🇹" },
  { id:"ita.2", name:"Serie B", flag:"🇮🇹" },

  { id:"ger.1", name:"Bundesliga", flag:"🇩🇪" },
  { id:"ger.2", name:"2. Bundesliga", flag:"🇩🇪" },

  { id:"fra.1", name:"Ligue 1", flag:"🇫🇷" },
  { id:"fra.2", name:"Ligue 2", flag:"🇫🇷" },

  { id:"ned.1", name:"Eredivisie", flag:"🇳🇱" },
  { id:"bel.1", name:"Belgian Pro League", flag:"🇧🇪" },

  { id:"ksa.1", name:"Saudi Pro League", flag:"🇸🇦" },
  { id:"usa.1", name:"MLS", flag:"🇺🇸" },

  { id:"uefa.champions", name:"Champions League", flag:"🏆" },
  { id:"uefa.europa", name:"Europa League", flag:"🏆" },
  { id:"uefa.europa.conf", name:"Conference League", flag:"🏆" }
];

/* =========================================================
   ESTADO
   ========================================================= */

let FZ_ligaSelecionada = "ALL";
let FZ_modo = "jogos";
let FZ_dataSelecionada = FZ_dataISO(new Date());
let FZ_aAtualizar = null;
let FZ_carregando = false;

/* =========================================================
   DATAS
   ========================================================= */

function FZ_dataISO(data = new Date()) {
  const d = new Date(data);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2,"0");
  const dia = String(d.getDate()).padStart(2,"0");
  return `${ano}-${mes}-${dia}`;
}

function FZ_dataAPI(iso) {
  return String(iso).replace(/-/g,"");
}

function FZ_dataObj(iso) {
  const [a,m,d] = iso.split("-").map(Number);
  return new Date(a,m-1,d);
}

function FZ_formatarData(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function FZ_dataCurta(iso) {
  const d = FZ_dataObj(iso);

  return d.toLocaleDateString("pt-PT", {
    day:"2-digit",
    month:"2-digit"
  });
}

function FZ_mudarData(dias) {
  const d = FZ_dataObj(FZ_dataSelecionada);
  d.setDate(d.getDate() + dias);

  FZ_dataSelecionada = FZ_dataISO(d);

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_irHoje() {
  FZ_dataSelecionada = FZ_dataISO(new Date());

  FZ_renderDataBarra();
  FZ_carregarModo();
}

function FZ_dataEscolhida(valor) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return;

  FZ_dataSelecionada = valor;

  FZ_renderDataBarra();
  FZ_carregarModo();
}

/* =========================================================
   FETCH SEGURO
   ========================================================= */

async function FZ_fetch(url) {

  const controlador = new AbortController();

  const tempo = setTimeout(() => {
    controlador.abort();
  }, 15000);

  try {

    const resposta = await fetch(url, {
      method:"GET",
      cache:"no-store",
      signal:controlador.signal
    });

    if (!resposta.ok) {
      throw new Error("HTTP " + resposta.status);
    }

    return await resposta.json();

  } finally {
    clearTimeout(tempo);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */

function FZ_liga(id) {
  return FZ_LIGAS.find(l => l.id === id);
}

function FZ_nomeLiga(id) {
  const liga = FZ_liga(id);
  return liga ? `${liga.flag} ${liga.name}` : id;
}

function FZ_escape(valor) {
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function FZ_horaEvento(evento) {

  if (!evento.date) return "--:--";

  const d = new Date(evento.date);

  return d.toLocaleTimeString("pt-PT", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function FZ_dataEvento(evento) {

  if (!evento.date) return "";

  return FZ_dataISO(new Date(evento.date));
}

function FZ_nomeEquipa(team) {

  return (
    team?.displayName ||
    team?.shortDisplayName ||
    team?.name ||
    "Equipa"
  );
}

function FZ_logoEquipa(team) {

  return (
    team?.logo ||
    team?.logos?.[0]?.href ||
    ""
  );
}

/* =========================================================
   BARRA DE COMPETIÇÕES
   ========================================================= */

function FZ_renderCompeticoes() {

  const el = document.getElementById("competicoes");

  if (!el) return;

  let html = `
    <button
      class="league-chip ${FZ_ligaSelecionada === "ALL" ? "active" : ""}"
      data-liga="ALL">
      🌍 Todas
    </button>
  `;

  for (const liga of FZ_LIGAS) {

    html += `
      <button
        class="league-chip ${FZ_ligaSelecionada === liga.id ? "active" : ""}"
        data-liga="${liga.id}">
        ${liga.flag} ${FZ_escape(liga.name)}
      </button>
    `;
  }

  el.innerHTML = html;
}

function FZ_selecionarLiga(id) {

  FZ_ligaSelecionada = id;

  FZ_renderCompeticoes();

  if (FZ_modo === "tabelas" && id === "ALL") {
    FZ_carregarModo();
    return;
  }

  FZ_carregarModo();
}

/* =========================================================
   BARRA DE DATA
   ========================================================= */

function FZ_renderDataBarra() {

  let barra = document.getElementById("fzDataBar");

  if (!barra) {

    barra = document.createElement("div");

    barra.id = "fzDataBar";

    const conteudo = document.getElementById("conteudo");

    if (conteudo && conteudo.parentNode) {
      conteudo.parentNode.insertBefore(barra, conteudo);
    } else {
      document.body.appendChild(barra);
    }
  }

  const hoje = FZ_dataISO(new Date());

  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);

  const amanha = new Date();
  amanha.setDate(amanha.getDate() + 1);

  const ontemISO = FZ_dataISO(ontem);
  const amanhaISO = FZ_dataISO(amanha);

  barra.innerHTML = `
    <div style="
      background:#03060B;
      border:1px solid #722F37;
      border-radius:14px;
      padding:10px;
      margin:10px 0;
    ">

      <div style="
        display:flex;
        align-items:center;
        gap:6px;
      ">

        <button
          onclick="FZ_mudarData(-1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ‹
        </button>

        <button
          onclick="FZ_dataEscolhida('${ontemISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === ontemISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === ontemISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          ONTEM
          <br>
          <small>${FZ_dataCurta(ontemISO)}</small>
        </button>

        <button
          onclick="FZ_irHoje()"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === hoje ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === hoje ? "#0057B8" : "#0D1724"};
            color:white;
            font-weight:700;
          ">
          HOJE
          <br>
          <small>${FZ_dataCurta(hoje)}</small>
        </button>

        <button
          onclick="FZ_dataEscolhida('${amanhaISO}')"
          style="
            flex:1;
            min-height:42px;
            border:1px solid ${FZ_dataSelecionada === amanhaISO ? "#1683FF" : "#333"};
            border-radius:10px;
            background:${FZ_dataSelecionada === amanhaISO ? "#0057B8" : "#0D1724"};
            color:white;
          ">
          AMANHÃ
          <br>
          <small>${FZ_dataCurta(amanhaISO)}</small>
        </button>

        <button
          onclick="FZ_mudarData(1)"
          style="
            width:42px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#722F37;
            color:white;
            font-size:22px;
          ">
          ›
        </button>

      </div>

      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-top:9px;
      ">

        <input
          id="fzCalendar"
          type="date"
          value="${FZ_dataSelecionada}"
          onchange="FZ_dataEscolhida(this.value)"
          style="
            flex:1;
            min-height:42px;
            border-radius:10px;
            border:1px solid #333;
            background:#0D1724;
            color:white;
            padding:0 10px;
          "
        >

        <button
          onclick="FZ_carregarModo()"
          style="
            min-width:46px;
            height:42px;
            border:0;
            border-radius:10px;
            background:#0057B8;
            color:white;
            font-size:20px;
          ">
          🔄
        </button>

      </div>

      <div style="
        text-align:center;
        color:#D9DEE8;
        font-size:13px;
        margin-top:8px;
        text-transform:capitalize;
      ">
        ${FZ_escape(FZ_formatarData(FZ_dataSelecionada))}
      </div>

    </div>
  `;
}

/* =========================================================
   ESTADO
   ========================================================= */

function FZ_estado(texto, erro=false) {

  const el = document.getElementById("estado");

  if (!el) return;

  el.innerHTML = `
    <div style="
      padding:10px;
      text-align:center;
      color:${erro ? "#FF4054" : "#9DAABB"};
      font-size:13px;
    ">
      ${FZ_escape(texto)}
    </div>
  `;
}

/* =========================================================
   CARD DE JOGO
   ========================================================= */

function FZ_cardJogo(evento, ligaId) {

  const comp = evento.competitions?.[0];

  const competitors = comp?.competitors || [];

  const casa =
    competitors.find(x => x.homeAway === "home") ||
    competitors[0];

  const fora =
    competitors.find(x => x.homeAway === "away") ||
    competitors[1];

  const casaNome = FZ_nomeEquipa(casa?.team);
  const foraNome = FZ_nomeEquipa(fora?.team);

  const casaLogo = FZ_logoEquipa(casa?.team);
  const foraLogo = FZ_logoEquipa(fora?.team);

  const status = evento.status?.type;

  const concluido =
    status?.completed === true ||
    status?.state === "post";

  const aoVivo =
    status?.state === "in" ||
    status?.name === "STATUS_IN_PROGRESS";

  let hora = FZ_horaEvento(evento);

  if (aoVivo) {
    hora = "🔴 AO VIVO";
  }

  if (concluido) {
    hora = "FINAL";
  }

  const scoreCasa =
    casa?.score ??
    "-";

  const scoreFora =
    fora?.score ??
    "-";

  const ligaNome = FZ_nomeLiga(ligaId);

  return `
    <div
      class="fz-game-card"
      style="
        background:#09111C;
        border:1px solid ${aoVivo ? "#722F37" : "#1B2635"};
        border-radius:15px;
        padding:12px;
        margin:8px 0;
        box-shadow:0 3px 12px rgba(0,0,0,.25);
      "
      onclick="FZ_abrirJogoSeguro('${FZ_escape(evento.id)}','${FZ_escape(ligaId)}')"
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:#9DAABB;
        font-size:11px;
        margin-bottom:10px;
      ">
        <span>${FZ_escape(ligaNome)}</span>
        <strong style="
          color:${aoVivo ? "#FF4054" : concluido ? "#9DAABB" : "#1683FF"};
        ">
          ${hora}
        </strong>
      </div>

      <div style="
        display:grid;
        grid-template-columns:1fr 55px 1fr;
        align-items:center;
        gap:6px;
      ">

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            casaLogo
            ? `<img src="${FZ_escape(casaLogo)}"
                    style="width:38px;height:38px;object-fit:contain;display:block;margin:auto auto 5px;">`
            : `<div style="height:43px;"></div>`
          }

          <div>${FZ_escape(casaNome)}</div>
        </div>

        <div style="
          text-align:center;
          font-size:20px;
          font-weight:900;
          color:white;
        ">
          ${scoreCasa}
          <br>
          <span style="font-size:12px;color:#9DAABB;">-</span>
          <br>
          ${scoreFora}
        </div>

        <div style="
          text-align:center;
          color:white;
          font-weight:700;
        ">

          ${
            foraLogo

/* =========================================================
   BUSCAR JOGOS DE UMA LIGA
   ========================================================= */

async function FZ_buscarJogosLiga(ligaId, dataISO) {

  const data = FZ_dataAPI(dataISO);

  const url =
    `${FZ_API}${ligaId}/scoreboard?dates=${data}`;

  const json = await FZ_fetch(url);

  const eventos = Array.isArray(json.events)
    ? json.events
    : [];

  return {
    ligaId,
    eventos
  };
}

/* =========================================================
   BUSCAR TODAS AS LIGAS
   ========================================================= */

async function FZ_buscarTodasAsLigas(dataISO) {

  const resultados = [];

  const tamanhoLote = 5;

  for (
    let inicio = 0;
    inicio < FZ_LIGAS.length;
    inicio += tamanhoLote
  ) {

    const lote = FZ_LIGAS.slice(
      inicio,
      inicio + tamanhoLote
    );

    const respostas = await Promise.allSettled(
      lote.map(liga =>
        FZ_buscarJogosLiga(liga.id,dataISO)
      )
    );

    respostas.forEach((r,i) => {

      if (r.status === "fulfilled") {

        resultados.push(r.value);

      } else {

        console.warn(
          "Falha ao carregar",
          lote[i].id,
          r.reason
        );

        resultados.push({
          ligaId:lote[i].id,
          eventos:[]
        });
      }
    });
  }

  return resultados;
}

      await FZ_buscarTodasAsLigas(

/* =========================================================
   STANDINGS — EXTRAIR ENTRIES
   ========================================================= */

function FZ_extrairEntries(obj) {

  const encontrados = [];
  const vistos = new Set();

  function procurar(valor) {

    if (!valor || typeof valor !== "object") {
      return;
    }

    if (Array.isArray(valor.entries)) {

      valor.entries.forEach(entry => {

        if (
          entry &&
          entry.team &&
          entry.team.id
        ) {

          if (!vistos.has(entry.team.id)) {

            vistos.add(entry.team.id);
            encontrados.push(entry);
          }
        }
      });
    }

    Object.keys(valor).forEach(chave => {

      const item = valor[chave];

      if (
        item &&
        typeof item === "object"
      ) {
        procurar(item);
      }
    });
  }

  procurar(obj);

  return encontrados;
}

/* =========================================================
   STAT DAS CLASSIFICAÇÕES
   ========================================================= */

function FZ_stat(entry,nome,alternativas=[]) {

  const nomes = [
    nome,
    ...alternativas
  ];

  const stats =
    Array.isArray(entry.stats)
      ? entry.stats
      : [];

  const stat =
    stats.find(s =>
      nomes.includes(s.name)
    );

  if (!stat) return "-";

  return (
    stat.displayValue ??
    stat.value ??
    "-"
  );
}

      );

}

/* =========================================================
   MODOS
   ========================================================= */

async function FZ_carregarModo() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();

  if (FZ_modo === "jogos") {
    await FZ_jogosDoDia();
    return;
  }

  if (FZ_modo === "jornadas") {
    await FZ_jornadas();
    return;
  }

  if (FZ_modo === "tabelas") {
    await FZ_carregarTabelas();
    return;
  }

  if (FZ_modo === "ao-vivo") {
    await FZ_aoVivo();
    return;
  }

  await FZ_jogosDoDia();
}

/* =========================================================
   MUDAR MODO
   ========================================================= */

function FZ_mudarModo(modo) {

  FZ_modo = modo;

  document
    .querySelectorAll("[data-modo]")
    .forEach(botao => {

      botao.classList.toggle(
        "active",
        botao.dataset.modo === modo
      );
    });

  FZ_carregarModo();
}

/* =========================================================
   CLIQUES
   ========================================================= */

document.addEventListener("click", function(event) {

  const liga =
    event.target.closest("[data-liga]");

  if (liga) {

    FZ_selecionarLiga(
      liga.dataset.liga
    );

    return;
  }

  const modo =
    event.target.closest("[data-modo]");

  if (modo) {

    const valor =
      modo.dataset.modo;

    if (valor === "aoVivo") {
      FZ_mudarModo("ao-vivo");
    } else {
      FZ_mudarModo(valor);
    }
  }
});

/* =========================================================
   AUTO REFRESH
   ========================================================= */

function FZ_configurarAtualizacao() {

  if (FZ_aAtualizar) {
    clearInterval(FZ_aAtualizar);
  }

  FZ_aAtualizar = setInterval(() => {

    const hoje =
      FZ_dataISO(new Date());

    if (
      FZ_dataSelecionada === hoje ||
      FZ_modo === "ao-vivo"
    ) {

      FZ_carregarModo();

    }

  }, FZ_modo === "ao-vivo" ? 30000 : 60000);
}

/* =========================================================
   INICIAR
   ========================================================= */

function FZ_iniciar() {

  FZ_renderCompeticoes();
  FZ_renderDataBarra();
  FZ_configurarAtualizacao();

  FZ_carregarModo();
}

window.FZ_dataEscolhida = FZ_dataEscolhida;

if (

  if(!area)
    return;


  area.innerHTML = `

    <div class="carregar">
      A carregar calendário...

        "/teams/" +
        encodeURIComponent(id) +

    const jogos =

      [];


    if(!jogos.length){

      area.innerHTML = `

          para esta equipa.

          new Date(a.date) -

      );


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          📅 Calendário

        ${
          ordenados
            .map(
              jogo =>

                  jogo,

                    FZ_ligaSelecionada

                )
            )
            .join("")
        }

    area.innerHTML = `

      <div class="vazio erro">

      </div>

async function FZ_equipaTabela(){

  const area =
    FZ("fz-equipa-conteudo");


  if(!area)
    return;


  area.innerHTML = `

    <div class="carregar">
      A carregar classificação...
    </div>

  `;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      area.innerHTML = `

        <div class="vazio">

          Classificação não disponível.

        </div>

      `;

      return;

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const nome =
            entrada.team?.displayName ||
            entrada.team?.name ||
            "Equipa";


          const pts =
            (
              entrada.stats || []
            ).find(
              s =>
                s.name === "points" ||
                s.abbreviation === "PTS"
            );


          return `

            <div class="fz-historico">

              <div class="fz-historico-data">

                ${index + 1}º

              </div>

              <div class="fz-historico-nome">

                ${nome}

                ${
                  pts
                  ? " · " +
                    (
                      pts.displayValue ??
                      pts.value
                    ) +
                    " pts"
                  : ""
                }

              </div>

            </div>

          `;

        }
      ).join("");


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          🏆 Classificação

        </div>

        ${linhas}

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    area.innerHTML = `

      <div class="vazio erro">

        Não foi possível carregar
        a classificação.

      </div>

    `;

  }

}

  area.innerHTML = `

  try{

      await FZ_fetch(

        <div class="fz-player">

}

    estado === "post"

  FZ_conteudo.innerHTML = `

            ${casa}

          </div>

          <div class="fz-detalhe-score">

            ${resultado}

          </div>

          <div class="fz-detalhe-equipa">

            ${fora}

          </div>

        </div>


        <div class="fz-detalhe-status">

          ${
            estado === "in"
            ? "🔴 AO VIVO"
            : estado === "post"
            ? "FINAL"
            : FZ_hora(info.data)
          }

        </div>

      </div>


      <div class="fz-section">

        <div class="fz-section-title">

          📊 Estatísticas

/* ---------------------------------------------------------
   TORNAR AS EQUIPAS CLICÁVEIS NA CLASSIFICAÇÃO
--------------------------------------------------------- */

const FZ_tabelasOriginal =
  FZ_tabelas;


/*
  Mantemos a função principal e acrescentamos
  identificação dos clubes quando o ESPN fornece ID.
*/

FZ_tabelas = async function(){

  FZ_estado.textContent =
    "A carregar classificação real...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A carregar classificação...
    </div>`;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      FZ_conteudo.innerHTML =
        `<div class="vazio">
          Classificação não disponível.
        </div>`;

      return;

    }


    function stat(
      entrada,
      nomes
    ){

      const encontrado =
        (
          entrada.stats ||
          []
        ).find(
          s =>
            nomes.includes(s.name) ||
            nomes.includes(s.abbreviation)
        );


      return encontrado
        ? (
            encontrado.displayValue ??
            encontrado.value ??
            "-"
          )
        : "-";

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const equipa =
            entrada.team ||
            {};


          const id =
            equipa.id ||
            "";


          const nome =
            equipa.displayName ||
            equipa.name ||
            "Equipa";


          return `

            <tr>

              <td class="posicao">

                ${index + 1}

              </td>

              <td
                class="fz-clickable"
                onclick="FZ_abrirEquipa('${id}','${nome.replace(/'/g,"")}')">

                <strong>

                  ${nome}

                </strong>

              </td>

              <td>
                ${stat(
                  entrada,
                  ["gamesPlayed","GP"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["wins","W"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["ties","draws","D"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["losses","L"]
                )}
              </td>

              <td>
                <strong>
                  ${stat(
                    entrada,
                    ["points","PTS"]
                  )}
                </strong>
              </td>

            </tr>

          `;

        }
      ).join("");


    FZ_conteudo.innerHTML = `

      <div class="seccao-titulo">

        🏆 ${FZ_nomeLiga(
          FZ_ligaSelecionada
        )}

      </div>

      <div class="tabela-wrap">

        <table class="tabela">

          <thead>

            <tr>

              <th>#</th>
              <th>Equipa</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>Pts</th>

            </tr>

          </thead>

          <tbody>

            ${linhas}

          </tbody>

        </table>

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        a classificação.

      </div>

    `;

  }

};
