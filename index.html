<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUTZONE — Futebol em Direto</title>
<style>
:root{--blue:#0057B8;--blue2:#1683FF;--blue3:#003B7A;--bg:#03060B;--panel:#09111C;--panel2:#0D1724;--border:#1B2A3B;--text:#F5F7FA;--muted:#9DAABB;--red:#FF4054;--green:#20D68A;--yellow:#FFD43B;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:78px}
.app{width:100%;max-width:720px;margin:auto}
.header{position:sticky;top:0;z-index:30;padding:16px 15px 13px;background:rgba(3,6,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.logo{font-size:28px;line-height:1;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--blue2)}
.subtitle{margin-top:4px;font-size:11px;color:var(--muted);letter-spacing:1.3px;font-weight:700}
.sportSwitch{display:flex;gap:8px;margin-top:14px}
.sportBtn{flex:1;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:12px;font-weight:800}
.sportBtn.active{background:var(--blue);color:white;border-color:var(--blue)}
main{padding:14px}
.sectionTitle{font-size:17px;font-weight:900;margin:5px 0 10px}
.leagues{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.leagues::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.league{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800}
.league.active{color:white;background:var(--blue3);border-color:var(--blue2)}
.liveAll{width:100%;border:0;border-radius:13px;padding:13px;margin:3px 0 12px;background:linear-gradient(135deg,#8f0012,#e01832);color:white;font-weight:900}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.filter{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}
.filter.active{background:var(--blue);border-color:var(--blue);color:white}
.search{width:100%;background:var(--panel);border:1px solid var(--border);color:white;border-radius:12px;padding:12px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--blue2)}
.loading,.empty,.error{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:22px 15px;text-align:center;color:var(--muted)}
.error{color:#ff9ba6}
.dayTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-size:13px;font-weight:900;color:var(--muted)}
.game{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:12px;margin-bottom:9px;cursor:pointer}
.game:active{transform:scale(.99)}
.gameTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.comp{color:var(--muted);font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:10px;font-weight:900;color:var(--muted)}
.status.live{color:var(--red)}
.status.final{color:var(--green)}
.teams{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:7px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.away{justify-content:flex-end;text-align:right}
.teamLogo{width:28px;height:28px;object-fit:contain;flex:none}
.teamName{font-size:13px;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.score{text-align:center;font-size:19px;font-weight:900}
.scoreTime{text-align:center;font-size:13px;font-weight:900;color:var(--muted)}
.star{border:0;background:none;color:#657284;font-size:21px;padding:2px}
.star.on{color:var(--yellow)}
.bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:720px;margin:auto;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(9,17,28,.97);border-top:1px solid var(--border);backdrop-filter:blur(15px)}
.navBtn{border:0;background:none;color:var(--muted);font-size:11px;font-weight:800}
.navBtn.active{color:white}
.navIcon{display:block;font-size:20px;margin-bottom:3px}
.overlay{position:fixed;inset:0;z-index:100;display:none;background:var(--bg);overflow-y:auto}
.overlay.show{display:block}
.detailHeader{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px;background:rgba(3,6,11,.96);border-bottom:1px solid var(--border)}
.back{width:38px;height:38px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:white}
.detailTitle{font-weight:900}
.detailBody{padding:15px;max-width:720px;margin:auto}
.heroGame,.detailCard{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px 12px;margin-bottom:12px}
.heroTeams{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:10px}
.heroTeam{text-align:center;font-weight:900}
.heroLogo{width:50px;height:50px;object-fit:contain;display:block;margin:0 auto 8px}
.heroScore{text-align:center;font-size:28px;font-weight:900}
.detailCard{border-radius:15px;padding:14px;margin-bottom:10px}
.detailCard h3{margin:0 0 12px;font-size:15px}
.event{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.event:last-child{border-bottom:0}
.eventTime{color:var(--muted);width:35px;flex:none}
.tableWrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:center;font-size:12px}
th{color:var(--muted);font-size:10px}
td:first-child,th:first-child{text-align:left}
.pos{width:25px;color:var(--muted)}
.teamTable{display:flex;align-items:center;gap:7px}
.tableLogo{width:23px;height:23px;object-fit:contain}
.clickTeam{cursor:pointer}
.futsal{display:none}
.futsal.show{display:block}
.matchStatsGrid{display:grid;gap:10px}
.statRow{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;font-size:12px}
.statTeam{font-weight:900}
.statTeam.home{text-align:right}
.statName{text-align:center;color:var(--muted);font-size:10px;font-weight:800}
.footballPitch{position:relative;width:100%;height:560px;margin-top:12px;border:3px solid #fff;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(90deg,#075b3d 0,#075b3d 50px,#086443 50px,#086443 100px)}
.pitchHalf{position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(255,255,255,.9)}
.pitchCircle{position:absolute;width:105px;height:105px;border:2px solid rgba(255,255,255,.9);border-radius:50%;top:calc(50% - 52px);left:calc(50% - 52px)}
.pitchCenter{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:calc(50% - 5px);top:calc(50% - 5px)}
.pitchBox{position:absolute;width:145px;height:85px;left:calc(50% - 72px);border:2px solid rgba(255,255,255,.9)}
.pitchBox.top{top:-2px}.pitchBox.bottom{bottom:-2px}
.pitchSmallBox{position:absolute;width:65px;height:35px;left:calc(50% - 32px);border:2px solid rgba(255,255,255,.9)}
.pitchSmallBox.top{top:-2px}.pitchSmallBox.bottom{bottom:-2px}
.pitchGoal{position:absolute;width:55px;height:10px;border:2px solid white;left:calc(50% - 27px)}
.pitchGoal.top{top:-3px}.pitchGoal.bottom{bottom:-3px}
.pitchPlayer{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;z-index:3}
.pitchPlayerDot{width:32px;height:32px;margin:auto;border-radius:50%;background:var(--blue2);border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pitchPlayer.away .pitchPlayerDot{background:var(--blue3)}
.pitchPlayerName{margin-top:3px;font-size:8px;line-height:1.1;font-weight:900;color:white;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lineupLegend{display:flex;justify-content:center;gap:16px;margin-top:10px;color:var(--muted);font-size:10px;font-weight:800}
.lineupLegend span{display:flex;align-items:center;gap:5px}
.lineupDot{width:10px;height:10px;border-radius:50%;background:var(--blue2);border:1px solid white}
.lineupDot.away{background:var(--blue3)}
.playerList{display:grid}
.playerItem{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.playerNumber{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--muted);flex:none}
.playerInfo{min-width:0;flex:1}
.playerName{font-size:12px;font-weight:900}
.playerPosition{font-size:10px;color:var(--muted);margin-top:2px}
.teamLineupTitle{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:900}
.teamLineupTitle img{width:25px;height:25px;object-fit:contain}
.futsalCourt{position:relative;height:420px;border:3px solid white;border-radius:8px;margin-top:15px;background:#064f37;overflow:hidden}
.courtMid{position:absolute;top:50%;left:0;right:0;border-top:2px solid white}
.courtCircle{position:absolute;width:100px;height:100px;border:2px solid white;border-radius:50%;top:calc(50% - 50px);left:calc(50% - 50px)}
.goal{position:absolute;width:70px;height:125px;border:2px solid white;top:calc(50% - 62px)}
.goal.left{left:-2px}.goal.right{right:-2px}
.hide{display:none!important}
@media(max-width:420px){.footballPitch{height:520px}.pitchPlayer{width:55px}.pitchPlayerName{font-size:7px}.pitchPlayerDot{width:29px;height:29px}}
</style>

<style id="futzone-skin-safe">
:root{--blue:#0088FF;--blue2:#1683FF;--blue3:#003B7A;--bg:#02080F;--panel:#03111B;--panel2:#071A28;--border:#0C2636;--text:#F7F9FC;--muted:#AAB4C1}
html,body{background:#02080F;color:#F7F9FC}.app{max-width:720px;background:#02080F}
.header{background:linear-gradient(180deg,#03111B 0%,#020B13 100%);border-bottom:1px solid #0B2637}
.logo{font-size:31px;font-style:italic;letter-spacing:-1.5px;text-transform:uppercase}.logo span{color:#1683FF}
.subtitle{color:#F7F9FC;letter-spacing:1.7px}
.sportBtn{background:#061520;border-color:#12354A}.sportBtn.active{background:#0088FF;border-color:#1683FF}
.fzDateStrip{background:#02080F;border-bottom:1px solid #0B2637}
.fzDate.active,.fzDate.active span{color:#1683FF}.fzDate.active:after{background:#1683FF}
.leagues{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;gap:8px!important;padding:10px 14px 12px!important;background:#02080F;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}.league{display:block!important;flex:0 0 auto!important;white-space:nowrap!important;background:#061520!important;border-color:#12354A!important;color:#C4CDD7!important;border-radius:9px!important}
.league.active{background:#0057B8!important;border-color:#1683FF!important;color:#fff!important}
#footballSection>.sectionTitle,#futsalSection>.sectionTitle{background:#001C2A;color:#1683FF;text-transform:uppercase;letter-spacing:1.2px}
.game{background:#020D15;border-color:#0A2533}.filter{background:#061520;border-color:#12354A}.filter.active{background:#0057B8;border-color:#1683FF}.search{background:#061520;border-color:#12354A}
.liveAll{background:#0057B8;border-radius:8px}.bottomNav{height:78px;grid-template-columns:repeat(4,1fr);background:#03131E;border-top:1px solid #0B2A3B}.navBtn.active{color:#1683FF}.navIcon{font-size:25px}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="logo">FUT<span>ZONE</span></div><div class="subtitle">FUTEBOL EM DIRETO</div><div class="sportSwitch"><button class="sportBtn active" id="btnFutebol" onclick="mudarDesporto('futebol')">⚽ Futebol</button><button class="sportBtn" id="btnFutsal" onclick="mudarDesporto('futsal')">🥅 Futsal</button></div></header>
<main>
<section id="footballSection"><div class="sectionTitle">Competições</div><div class="leagues" id="leagueList"></div><button class="liveAll" onclick="mostrarTodosLive()">🔴 LIVE — TODAS AS LIGAS</button><input class="search" id="searchInput" type="search" placeholder="🔎 Procurar equipa..." oninput="renderizarJogos()"><div class="filters"><button class="filter active" data-filter="todos" onclick="setFiltro('todos')">Todos</button><button class="filter" data-filter="live" onclick="setFiltro('live')">🔴 Live</button><button class="filter" data-filter="proximos" onclick="setFiltro('proximos')">Próximos</button><button class="filter" data-filter="resultados" onclick="setFiltro('resultados')">Resultados</button></div><div id="footballContent"></div></section>
<section id="futsalSection" class="futsal"><div class="sectionTitle">🥅 Futsal</div><div class="filters"><button class="filter active" onclick="futsalTab('jogos',this)">Jogos</button><button class="filter" onclick="futsalTab('tabela',this)">Tabela</button><button class="filter" onclick="futsalTab('equipas',this)">Equipas</button><button class="filter" onclick="futsalTab('competicoes',this)">Competições</button></div><div id="futsalContent"></div></section>
</main>
<nav class="bottomNav"><button class="navBtn active" id="navJogos" onclick="mostrarJogos()"><span class="navIcon">⚽</span>Jogos</button><button class="navBtn" id="navTabelas" onclick="mostrarTabelaGeral()"><span class="navIcon">📊</span>Tabelas</button><button class="navBtn" id="navFav" onclick="mostrarFavoritos()"><span class="navIcon">⭐</span>Favoritos</button><button class="navBtn" id="navFutsal" onclick="mudarDesporto('futsal')"><span class="navIcon">🥅</span>Futsal</button></nav>
</div>
<div class="overlay" id="overlay"><div class="detailHeader"><button class="back" onclick="fecharOverlay()">←</button><div class="detailTitle" id="overlayTitle">Detalhes</div></div><div class="detailBody" id="overlayBody"></div></div>
<script>
  const API="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const STANDINGS_API="https://site.api.espn.com/apis/v2/sports/soccer/";
const CORE_API="https://sports.core.api.espn.com/v2/sports/soccer/leagues/";
let ligaAtual="por.1",filtroAtual="todos",jogos=[],modoGlobalLive=false;

const ligas=[
{id:"por.1",nome:"🇵🇹 Liga Portugal"},
{id:"por.2",nome:"🇵🇹 Liga Portugal 2"},
{id:"por.3",nome:"🇵🇹 Liga 3"},
{id:"por.w.1",nome:"🇵🇹 Liga BPI Feminina"},
{id:"eng.1",nome:"🏴 Premier League"},
{id:"eng.2",nome:"🏴 Championship"},
{id:"esp.1",nome:"🇪🇸 La Liga"},
{id:"esp.2",nome:"🇪🇸 La Liga 2"},
{id:"ita.1",nome:"🇮🇹 Serie A"},
{id:"ita.2",nome:"🇮🇹 Serie B"},
{id:"ger.1",nome:"🇩🇪 Bundesliga"},
{id:"ger.2",nome:"🇩🇪 2. Bundesliga"},
{id:"fra.1",nome:"🇫🇷 Ligue 1"},
{id:"fra.2",nome:"🇫🇷 Ligue 2"},
{id:"ned.1",nome:"🇳🇱 Eredivisie"},
{id:"bel.1",nome:"🇧🇪 Jupiler Pro League"},
{id:"uefa.champions",nome:"⭐ Champions League"},
{id:"uefa.europa",nome:"🏆 Europa League"},
{id:"uefa.europa.conf",nome:"🏆 Conference League"}
];

const fallbackStandings={
"por.2":[
["Alverca","AVC"],["Marítimo","MAR"],["Académico Viseu","ACV"],["Penafiel","PEN"],["Torreense","TOR"],["Feirense","FEI"],["Leixões","LEX"],["Benfica B","BNB"],["Vizela","VIZ"],["Portimonense","POR"],["Chaves","CHA"],["Felgueiras","FEL"],["União de Leiria","UDL"],["Académica","ACA"],["Mafra","MAF"],["Oliveirense","OLI"]
],
"por.3":[
["Amarante","AMA"],["Varzim","VAR"],["Atlético CP","ATL"],["Sporting CP B","SCPB"],["Belenenses","BEL"],["1º Dezembro","1DE"],["Caldas","CAL"],["Lusitânia","LUS"],["Fafe","FAF"],["Sanjoanense","SAN"],["Tirsense","TIR"],["Braga B","SCB"],["Trofense","TRO"],["Anadia","ANA"],["São João Ver","SJV"],["Académica","ACA"]
],
"por.w.1":[
["Benfica","SLB"],["Sporting CP","SCP"],["FC Porto","FCP"],["SC Braga","SCB"],["Valadares Gaia","VGA"],["Damaiense","DAM"],["Marítimo","MAR"],["Estoril","EST"],["Famalicão","FAM"],["Torreense","TOR"],["Clube de Albergaria","ALB"],["Racing Power","RAC"]
]
};

function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function dataCurta(d){try{return new Date(d).toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})}catch(e){return""}}
function formatarData(d){try{return new Date(d).toLocaleDateString("pt-PT",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}catch(e){return""}}
function horaEvento(e){try{return new Date(e.date).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}catch(x){return"—"}}
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}

function desenharLigas(){
 const el=document.getElementById("leagueList");
 el.innerHTML=ligas.map(l=>`<button class="league ${l.id===ligaAtual?"active":""}" onclick="selecionarLiga('${l.id}')">${l.nome}</button>`).join("");
}

function selecionarLiga(id){
 ligaAtual=id;modoGlobalLive=false;
 document.querySelectorAll(".league").forEach(x=>x.classList.toggle("active",x.getAttribute("onclick")===`selecionarLiga('${id}')`));
 carregarJogos();
}

function setFiltro(f){
 filtroAtual=f;
 document.querySelectorAll(".filter").forEach(x=>{if(x.dataset.filter)x.classList.toggle("active",x.dataset.filter===f)});
 renderizarJogos();
}

function nomeEquipa(t){return t?.displayName||t?.shortDisplayName||t?.name||"Equipa"}
function logoEquipa(t){return t?.logo||t?.logos?.[0]?.href||""}

function statusJogo(e){
 const c=e.competitions?.[0],s=c?.status||e.status||{};
 const st=s.type?.state||"";
 if(st==="in")return"live";
 if(st==="post"||st==="over")return"final";
 return"upcoming";
}

function buscarJogosLiga(id){
 return fetch(API+encodeURIComponent(id)+"/scoreboard?limit=100").then(r=>r.json()).then(d=>d.events||[]);
}

async function carregarJogos(){
 const el=document.getElementById("footballContent");
 el.innerHTML='<div class="loading">⏳ A carregar jogos...</div>';
 try{
  let arr=[];
  const dias=[];
  for(let i=-7;i<=14;i++)dias.push(new Date(Date.now()+i*86400000).toISOString().slice(0,10));
  for(const day of dias){
   try{
    const u=API+encodeURIComponent(ligaAtual)+"/scoreboard?dates="+day+"&limit=100";
    const d=await fetchJSON(u);
    (d.events||[]).forEach(e=>{e.__futzoneLiga=ligaAtual;arr.push(e)});
   }catch(e){}
  }
  if(!arr.length){
   try{
    arr=await buscarJogosLiga(ligaAtual);
    arr.forEach(e=>e.__futzoneLiga=ligaAtual);
   }catch(e){}
  }
  const seen=new Set();
  jogos=arr.filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  renderizarJogos();
 }catch(e){
  el.innerHTML='<div class="error">Não foi possível carregar os jogos desta competição.</div>';
 }
}

function renderizarJogos(){
 let arr=[...jogos];
 const q=(document.getElementById("searchInput")?.value||"").toLowerCase().trim();
 if(q)arr=arr.filter(e=>{const c=e.competitions?.[0]?.competitors||[];return c.some(x=>nomeEquipa(x.team).toLowerCase().includes(q))});
 if(filtroAtual==="live")arr=arr.filter(e=>statusJogo(e)==="live");
 if(filtroAtual==="proximos")arr=arr.filter(e=>statusJogo(e)==="upcoming");
 if(filtroAtual==="resultados")arr=arr.filter(e=>statusJogo(e)==="final");
 if(modoGlobalLive)arr=arr.filter(e=>statusJogo(e)==="live");
 const el=document.getElementById("footballContent");
 if(!arr.length){el.innerHTML='<div class="empty">Não há jogos para mostrar.</div>';return}
 const grupos={};
 arr.forEach(e=>{const d=new Date(e.date).toISOString().slice(0,10);(grupos[d]??=[]).push(e)});
 el.innerHTML=Object.entries(grupos).map(([d,items])=>`<div class="dayTitle"><span>${formatarData(d)}</span><span>${items.length} jogo(s)</span></div>${items.map(cartaoJogo).join("")}`).join("");
}

function cartaoJogo(e){
 const c=e.competitions?.[0]?.competitors||[],h=c.find(x=>x.homeAway==="home")||c[0],a=c.find(x=>x.homeAway==="away")||c[1];
 const st=statusJogo(e),hs=h?.score??"",as=a?.score??"";
 const score=st==="upcoming"?horaEvento(e):`${hs} - ${as}`;
 const fav=localStorage.getItem("futzone_jogos_favoritos")?.split(",").includes(String(e.id));
 return `<div class="game" onclick="abrirJogo('${String(e.id).replaceAll("'","")}')">

async function abrirJogo(id){
 const e=jogos.find(x=>String(x.id)===String(id));
 if(!e)return;
 const c=e.competitions?.[0]?.competitors||[],h=c.find(x=>x.homeAway==="home")||c[0],a=c.find(x=>x.homeAway==="away")||c[1];
 document.getElementById("overlay").classList.add("show");
 document.getElementById("overlayTitle").textContent=e.name||"Detalhes";
 document.getElementById("overlayBody").innerHTML='<div class="loading">⏳ A carregar detalhes...</div>';
 let detail={};
 try{detail=await fetchJSON(API+encodeURIComponent(e.__futzoneLiga||ligaAtual)+"/summary?event="+encodeURIComponent(id))}catch(x){}
 const ev=detail?.plays||detail?.keyEvents||[];
 const stats=detail?.boxscore?.teams||detail?.boxscore?.teams||[];
 let html=`<div class="heroGame"><div class="heroTeams">
 <div class="heroTeam">${logoEquipa(h?.team)?`<img class="heroLogo" src="${escapeHtml(logoEquipa(h.team))}">`:''}${escapeHtml(nomeEquipa(h?.team))}</div>
 <div class="heroScore">${h?.score??"-"}<br><span style="font-size:13px;color:var(--muted)">—</span><br>${a?.score??"-"}</div>
 <div class="heroTeam">${logoEquipa(a?.team)?`<img class="heroLogo" src="${escapeHtml(logoEquipa(a.team))}">`:''}${escapeHtml(nomeEquipa(a?.team))}</div>
 </div></div>`;
 html+=`<div class="detailCard"><h3>📊 Estatísticas</h3>${renderStats(stats)}</div>`;
 html+=`<div class="detailCard"><h3>⚽ Onze inicial</h3>${renderLineups(detail,h,a)}</div>`;
 html+=`<div class="detailCard"><h3>📝 Acontecimentos</h3>${ev.length?ev.map(x=>`<div class="event"><div class="eventTime">${escapeHtml(x.clock?.displayValue||x.clock||"")}</div><div>${escapeHtml(x.text||x.shortText||"")}</div></div>`).join(""):'<div style="color:var(--muted)">Sem acontecimentos disponíveis.</div>'}</div>`;
 document.getElementById("overlayBody").innerHTML=html;
}

function renderStats(stats){
 if(!stats||!stats.length)return'<div style="color:var(--muted)">Estatísticas não disponíveis para este jogo.</div>';
 return`<div class="matchStatsGrid">${stats.map(t=>{const team=t.team||{};return `<div class="detailCard"><div class="statTeam">${escapeHtml(nomeEquipa(team))}</div>${(t.statistics||[]).map(s=>`<div class="statRow"><div>${escapeHtml(s.displayValue??s.value??"-")}</div><div class="statName">${escapeHtml(s.name||s.label||"")}</div><div></div></div>`).join("")}</div>`}).join("")}</div>`;
}

function renderLineups(detail,h,a){
 const teams=detail?.rosters||detail?.lineups||detail?.boxscore?.players||[];
 if(!teams.length)return'<div style="color:var(--muted)">As escalações não estão disponíveis para este jogo.</div>';
 return teams.map(t=>{
  const players=t.athletes||t.players||[];
  const starters=players.filter(p=>p.starter||p.starter===true).slice(0,11);
  return`<div class="teamLineupTitle">${escapeHtml(nomeEquipa(t.team))}</div>${renderPitch(starters,t.team?.id===a?.team?.id)}`;
 }).join("");
}

function renderPitch(players,away){
 if(!players.length)return'<div style="color:var(--muted)">Onze inicial não disponível.</div>';
 const pos=[[50,90],[18,72],[38,78],[62,78],[82,72],[18,52],[38,58],[62,58],[82,52],[35,28],[65,28]];
 return`<div class="footballPitch"><div class="pitchHalf"></div><div class="pitchCircle"></div><div class="pitchCenter"></div><div class="pitchBox top"></div><div class="pitchBox bottom"></div><div class="pitchSmallBox top"></div><div class="pitchSmallBox bottom"></div><div class="pitchGoal top"></div><div class="pitchGoal bottom"></div>${players.map((p,i)=>{const at=p.athlete||p;return`<div class="pitchPlayer ${away?"away":""}" style="left:${pos[i]?.[0]||50}%;top:${pos[i]?.[1]||50}%"><div class="pitchPlayerDot">${escapeHtml(at.jersey||p.jersey||"—")}</div><div class="pitchPlayerName">${escapeHtml(at.displayName||at.fullName||"Jogador")}</div></div>`}).join("")}</div><div class="lineupLegend"><span><i class="lineupDot"></i> Casa</span><span><i class="lineupDot away"></i> Fora</span></div>`;
}

async function renderTabela(liga=ligaAtual){
 document.getElementById("footballContent").innerHTML='<div class="loading">⏳ A carregar classificação...</div>';
 try{
  const d=await fetchJSON(STANDINGS_API+encodeURIComponent(liga)+"/standings");

  if(entries.length){document.getElementById("footballContent").innerHTML=`<div class="tableWrap"><table><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr></thead><tbody>${entries.map((x,i)=>{const t=x.team||x;const st={};(x.stats||[]).forEach(s=>st[s.name]=s.value);return`<tr class="clickTeam" onclick="abrirEquipa('${encodeURIComponent(nomeEquipa(t))}')"><td>${i+1}</td><td><div class="teamTable">${logoEquipa(t)?`<img class="tableLogo" src="${escapeHtml(logoEquipa(t))}">`:''}${escapeHtml(nomeEquipa(t))}</div></td><td>${st.gamesPlayed??st.gp??"-"}</td><td>${st.wins??"-"}</td><td>${st.ties??st.draws??"-"}</td><td>${st.losses??"-"}</td><td>${st.pointDifferential??"-"}</td><td><strong>${st.points??"-"}</strong></td></tr>`}).join("")}</tbody></table></div>`;return}
 }catch(e){}
 const fb=fallbackStandings[liga];
 if(fb){document.getElementById("footballContent").innerHTML=`<div class="detailCard"><h3>${escapeHtml(ligas.find(x=>x.id===liga)?.nome||"Classificação")}</h3><div style="color:var(--muted);font-size:12px">A fonte de dados não devolveu a classificação atual. Equipas disponíveis:</div></div><div class="tableWrap"><table><thead><tr><th>#</th><th>Equipa</th></tr></thead><tbody>${fb.map((x,i)=>`<tr class="clickTeam" onclick="abrirEquipa('${encodeURIComponent(x[0])}')"><td>${i+1}</td><td>${escapeHtml(x[0])}</td></tr>`).join("")}</tbody></table></div>`;return}
 document.getElementById("footballContent").innerHTML='<div class="empty">Classificação não disponível para esta competição.</div>';
}

function futsalPontos(){
 const m={};
 futsalEquipas.forEach(x=>m[x]={team:x,j:0,v:0,e:0,d:0,gf:0,ga:0,pts:0});
 futsalJogos.filter(x=>x.hs!==null&&x.as!==null).forEach(x=>{
  const h=m[x.casa],a=m[x.fora];if(!h||!a)return;
  h.j++;a.j++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;
  if(x.hs>x.as){h.v++;h.pts+=3;a.d++}
  else if(x.hs<x.as){a.v++;a.pts+=3;h.d++}
  else{h.e++;a.e++;h.pts++;a.pts++}
 });
 return Object.values(m).sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf);
}

function futsalDataPassou(j){return new Date(j.data)<new Date()}

function renderizarFutsalJogos(){
 const arr=futsalJogos.sort((a,b)=>new Date(a.data)-new Date(b.data));
 document.getElementById("futsalContent").innerHTML=`<div class="detailCard"><h3>🥅 Liga Placard</h3><div style="color:var(--muted);font-size:12px">Jogos disponíveis.</div></div>${arr.map(j=>{
  const final=j.hs!==null&&j.as!==null;
  const passado=futsalDataPassou(j);
  const estado=final?"FINAL":passado?"RESULTADO POR CONFIRMAR":horaEvento({date:j.data});
  const score=final?`${j.hs} - ${j.as}`:horaEvento({date:j.data});
  return`<div class="game"><div class="gameTop"><div class="comp">${escapeHtml(j.comp)}</div><div class="status ${final?"final":""}">${escapeHtml(estado)}</div></div><div class="teams"><div class="team"><div class="teamName">${escapeHtml(j.casa)}</div></div><div class="scoreTime">${escapeHtml(score)}</div><div class="team away"><div class="teamName">${escapeHtml(j.fora)}</div></div></div><div style="text-align:center;color:var(--muted);font-size:10px;margin-top:8px">${escapeHtml(formatarData(j.data))}</div></div>`;
 }).join("")}`;
}

function fzAbrirEquipa(id,nome,logo,liga){
 id=decodeURIComponent(id||"");
 nome=decodeURIComponent(nome||"");
 logo=decodeURIComponent(logo||"");
 liga=decodeURIComponent(liga||ligaAtual);
 document.getElementById("overlay").classList.add("show");
 document.getElementById("overlayTitle").textContent=nome||"Clube";
 document.getElementById("overlayBody").innerHTML='<div class="loading">⏳ A carregar plantel e informação do clube...</div>';
 (async()=>{
  let teamId=id;
  if(!teamId){
   try{
    const d=await fetchJSON(API+encodeURIComponent(liga)+"/teams");
    const arr=d?.sports?.[0]?.leagues?.[0]?.teams||d?.teams||[];
    const n=String(nome).toLowerCase();
    const t=arr.map(x=>x.team||x).find(x=>String(x.displayName||x.name||"").toLowerCase()===n||String(x.shortDisplayName||"").toLowerCase()===n);
    teamId=t?.id||"";
    if(!logo)logo=t?.logo||t?.logos?.[0]?.href||"";
   }catch(e){}
  }
  if(!teamId){
   document.getElementById("overlayBody").innerHTML='<div class="empty">Não foi possível obter o clube nesta fonte de dados.</div>';
   return;
  }
  const [td,rd,sd]=await Promise.all([
   fetchJSON(API+encodeURIComponent(liga)+"/teams/"+encodeURIComponent(teamId)),
   fetchJSON(API+encodeURIComponent(liga)+"/teams/"+encodeURIComponent(teamId)+"/roster"),
   fetchJSON(API+encodeURIComponent(liga)+"/teams/"+encodeURIComponent(teamId)+"/schedule?limit=50")
  ]);
  const team=td?.team||td||{};
  const players=rd?.athletes||rd?.entries||rd?.roster||[];
  const games=sd?.events||[];
  logo=logo||team.logo||team.logos?.[0]?.href||"";
  document.getElementById("overlayBody").innerHTML=`<div class="heroGame"><div class="heroTeam">${logo?`<img class="heroLogo" src="${escapeHtml(logo)}">`:''}${escapeHtml(team.displayName||team.name||nome)}</div></div><div class="detailCard"><h3>🏟️ Clube</h3><div style="color:var(--muted);font-size:13px">${escapeHtml(team.description||team.location||"Informação adicional disponível quando fornecida pela fonte.")}</div></div><div class="detailCard"><h3>👥 Plantel (${players.length})</h3>${players.length?`<div class="playerList">${players.map(x=>{const a=x.athlete||x.player||x;return `<div class="playerItem clickTeam" onclick="fzAbrirJogador('${encodeURIComponent(a.id||"")}','${encodeURIComponent(a.displayName||a.fullName||"Jogador")}','${encodeURIComponent(liga)}')"><div class="playerNumber">${escapeHtml(a.jersey||x.jersey||"—")}</div><div class="playerInfo"><div class="playerName">${escapeHtml(a.displayName||a.fullName||"Jogador")}</div><div class="playerPosition">${escapeHtml(a.position?.displayName||a.position?.abbreviation||"Jogador")}</div></div></div>`}).join("")}</div>`:'<div style="color:var(--muted);font-size:13px">O plantel não está disponível pela fonte.</div>'}</div><div class="detailCard"><h3>📅 Jogos</h3>${games.length?games.slice(0,20).map(e=>{const c=e.competitions?.[0]?.competitors||[];const h=c.find(x=>x.homeAway==="home"),a=c.find(x=>x.homeAway==="away");return `<div class="event" onclick="abrirJogo('${String(e.id).replaceAll("'","")}')"><div class="eventTime">${escapeHtml(dataCurta(e.date))}</div><div>${escapeHtml(nomeEquipa(h?.team))} — ${escapeHtml(nomeEquipa(a?.team))}</div></div>`}).join(""):'<div style="color:var(--muted)">Sem jogos disponíveis.</div>'}</div>`;
 })();
}

function fzAbrirJogador(id,nome,liga){
 id=decodeURIComponent(id||"");
 nome=decodeURIComponent(nome||"Jogador");
 liga=decodeURIComponent(liga||ligaAtual);
 document.getElementById("overlay").classList.add("show");
 document.getElementById("overlayTitle").textContent=nome;

 (async()=>{
  const d=id?await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/soccer/athletes/"+encodeURIComponent(id)):null;

 })();
}
