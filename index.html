<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#722F37">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>FUTZONE — Futebol em Direto</title>

<style>

:root{
  --vinho:#722F37;
  --vinho2:#9B4650;
  --azul:#0057B8;
  --azul2:#1683FF;

  --preto:#050608;
  --preto2:#0B0E13;
  --card:#11151C;
  --card2:#171C24;

  --texto:#F7F9FC;
  --cinza:#AAB2BE;
  --linha:#252B35;

  --verde:#20D68A;
  --vermelho:#FF4054;
  --amarelo:#FFD43B;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--preto);
  color:var(--texto);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:
    linear-gradient(
      135deg,
      #050608 0%,
      #160D10 50%,
      #07111E 100%
    );

  border-bottom:1px solid var(--linha);

  padding:
    calc(13px + env(safe-area-inset-top))
    14px
    12px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--azul2);
}

.subtitulo{
  margin-top:2px;

  color:#D7DBE2;

  font-size:10px;
  font-weight:800;

  letter-spacing:1.6px;
}

.top-actions{
  display:flex;
  gap:8px;

  margin-top:13px;

  overflow-x:auto;
  scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
  display:none;
}

.top-btn{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card2);
  color:var(--texto);

  border-radius:999px;

  padding:9px 13px;

  font-size:12px;
  font-weight:800;
}

.top-btn.active{
  background:var(--vinho);
  border-color:var(--vinho2);
}

.top-btn.live{
  border-color:#8E2631;
}

main{
  width:100%;
  max-width:900px;

  margin:auto;

  padding:
    12px
    12px
    calc(90px + env(safe-area-inset-bottom));
}

.competicoes{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.competicoes::-webkit-scrollbar{
  display:none;
}

.competicao{
  flex:none;

  border:1px solid var(--linha);

  background:var(--card);

  color:#DDE2E9;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;
  font-weight:700;
}

.competicao.active{
  background:var(--azul);
  border-color:var(--azul2);
  color:white;
}

.estado{
  margin:12px 2px;

  color:var(--cinza);

  font-size:11px;
}

.seccao-titulo{
  margin:
    17px
    2px
    9px;

  font-size:18px;
  font-weight:900;
}

.jogo{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--preto2)
    );

  border:1px solid var(--linha);

  border-radius:16px;

  padding:13px;

  margin-bottom:9px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.18);
}

.jogo-competicao{
  color:#C9CED7;

  font-size:10px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.jogo-data{
  margin-top:4px;

  color:var(--cinza);

  font-size:11px;
}

.jogo-equipas{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;

  gap:8px;

  margin-top:13px;
}

.equipa{
  text-align:center;

  font-size:13px;
  font-weight:900;
}

.resultado{
  text-align:center;

  font-size:20px;
  font-weight:900;
}

.resultado.live{
  color:var(--verde);
}

.resultado.proximo{
  color:var(--amarelo);
}

.vazio{
  padding:25px 15px;

  border:
    1px dashed
    var(--linha);

  border-radius:15px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.erro{
  color:#FF9CA6;
}

.carregar{
  padding:30px 10px;

  text-align:center;

  color:var(--cinza);

  font-size:13px;
}

.jornada{
  margin-bottom:18px;

  border-left:
    3px solid
    var(--vinho2);

  padding-left:10px;
}

.jornada-titulo{
  margin-bottom:8px;

  font-size:14px;
  font-weight:900;

  text-transform:capitalize;
}

.tabela-wrap{
  overflow-x:auto;

  border:
    1px solid
    var(--linha);

  border-radius:15px;
}

.tabela{
  width:100%;

  min-width:500px;

  border-collapse:collapse;
}

.tabela th,
.tabela td{
  padding:9px 7px;

  border-bottom:
    1px solid
    var(--linha);

  font-size:12px;

  text-align:center;
}

.tabela th{
  color:var(--cinza);
  background:#090B0F;
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left;
}

.posicao{
  color:#AEB7C4;
  font-weight:900;
}

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:90;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(5,6,8,.96);

  backdrop-filter:blur(14px);

  border-top:
    1px solid
    var(--linha);
}

.bottom-btn{
  border:0;

  background:transparent;

  color:var(--cinza);

  padding:8px 4px;

  font-size:11px;
  font-weight:800;
}

.bottom-btn.active{
  color:white;
}

.bottom-btn.active::before{
  content:"";

  display:block;

  width:35px;
  height:3px;

  margin:0 auto 5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--vinho2),
      var(--azul2)
    );
}

</style>
</head>

<body>

<header>

  <div class="logo">
    FUT<span>ZONE</span>
  </div>

  <div class="subtitulo">
    FUTEBOL EM DIRETO
  </div>

  <div class="top-actions">

    <button
      class="top-btn active"
      id="btnJogos">
      ⚽ Jogos
    </button>

    <button
      class="top-btn"
      id="btnJornadas">
      📅 Jornadas
    </button>

    <button
      class="top-btn"
      id="btnTabelas">
      🏆 Tabelas
    </button>

    <button
      class="top-btn live"
      id="btnLive">
      🔴 AO VIVO
    </button>

  </div>

</header>

<main>

  <div
    class="competicoes"
    id="competicoes">
  </div>

  <div
    class="estado"
    id="estado">
    A carregar dados reais...
  </div>

  <div
    id="conteudo"
    class="carregar">
    A carregar...
  </div>

</main>

<nav class="bottom-nav">

  <button
    class="bottom-btn active"
    id="navJogos">
    ⚽<br>Jogos
  </button>

  <button
    class="bottom-btn"
    id="navTabelas">
    🏆<br>Tabelas
  </button>

  <button
    class="bottom-btn"
    id="navFavoritos">
    ⭐<br>Favoritos
  </button>

</nav>
<script>
/* =========================================================
   FUTZONE — BLOCO 2
   DADOS REAIS
   Resultados • Próximos • Jornadas • Ao Vivo • Tabelas
   ========================================================= */

const FZ_API =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const FZ_STANDINGS =
  "https://site.api.espn.com/apis/v2/sports/soccer/";

const FZ_LIGAS = [

  ["por.1","🇵🇹 Liga Portugal"],
  ["por.2","🇵🇹 Liga Portugal 2"],
  ["por.3","🇵🇹 Liga 3"],
  ["por.w.1","🇵🇹 Liga BPI Feminina"],

  ["eng.1","🏴 Premier League"],
  ["eng.2","🏴 Championship"],

  ["esp.1","🇪🇸 LaLiga"],
  ["esp.2","🇪🇸 LaLiga 2"],

  ["ita.1","🇮🇹 Serie A"],
  ["ita.2","🇮🇹 Serie B"],

  ["ger.1","🇩🇪 Bundesliga"],
  ["ger.2","🇩🇪 2. Bundesliga"],

  ["fra.1","🇫🇷 Ligue 1"],
  ["fra.2","🇫🇷 Ligue 2"],

  ["ned.1","🇳🇱 Eredivisie"],
  ["bel.1","🇧🇪 Pro League"],

  ["ksa.1","🇸🇦 Saudi Pro League"],
  ["usa.1","🇺🇸 MLS"],

  ["uefa.champions","🏆 Champions League"],
  ["uefa.europa","🏆 Europa League"],
  ["uefa.europa.conf","🏆 Conference League"]

];

let FZ_ligaSelecionada = "por.1";
let FZ_modo = "jogos";

/* ---------------------------------------------------------
   ELEMENTOS
--------------------------------------------------------- */

const FZ = id => document.getElementById(id);

const FZ_competicoes = FZ("competicoes");
const FZ_conteudo = FZ("conteudo");
const FZ_estado = FZ("estado");


/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */

function FZ_dataISO(data = new Date()) {

  const d = new Date(data);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );
}


function FZ_dataTexto(data) {

  return new Date(data).toLocaleDateString(
    "pt-PT",
    {
      weekday:"short",
      day:"2-digit",
      month:"2-digit"
    }
  );
}


function FZ_dataLonga(data) {

  return new Date(data).toLocaleDateString(
    "pt-PT",
    {
      weekday:"long",
      day:"2-digit",
      month:"long"
    }
  );
}


function FZ_hora(data) {

  return new Date(data).toLocaleTimeString(
    "pt-PT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ---------------------------------------------------------
   FETCH
--------------------------------------------------------- */

async function FZ_fetch(url) {

  const resposta = await fetch(
    url,
    {
      cache:"no-store"
    }
  );

  if(!resposta.ok){

    throw new Error(
      "HTTP " + resposta.status
    );

  }

  return await resposta.json();

}


/* ---------------------------------------------------------
   NOME DA LIGA
--------------------------------------------------------- */

function FZ_nomeLiga(id){

  const liga = FZ_LIGAS.find(
    l => l[0] === id
  );

  return liga
    ? liga[1]
    : id;

}


/* ---------------------------------------------------------
   BOTÕES DAS COMPETIÇÕES
--------------------------------------------------------- */

function FZ_renderizarCompeticoes(){

  FZ_competicoes.innerHTML =
    FZ_LIGAS.map(
      liga => `

        <button
          class="competicao ${
            liga[0] === FZ_ligaSelecionada
            ? "active"
            : ""
          }"
          onclick="FZ_selecionarLiga('${liga[0]}')">

          ${liga[1]}

        </button>

      `
    ).join("");

}


function FZ_selecionarLiga(id){

  FZ_ligaSelecionada = id;

  FZ_renderizarCompeticoes();

  FZ_carregar();

}


/* ---------------------------------------------------------
   PROCESSAMENTO DE JOGOS
--------------------------------------------------------- */

function FZ_infoJogo(evento){

  const competicao =
    evento.competitions &&
    evento.competitions[0];

  const casa =
    competicao &&
    competicao.competitors
      ? competicao.competitors.find(
          x => x.homeAway === "home"
        )
      : null;

  const fora =
    competicao &&
    competicao.competitors
      ? competicao.competitors.find(
          x => x.homeAway === "away"
        )
      : null;

  const estado =
    competicao &&
    competicao.status
      ? competicao.status.type
      : {};

  return {

    casa,
    fora,

    estado,

    data:
      evento.date,

    nome:
      evento.name || ""

  };

}


/* ---------------------------------------------------------
   CARTÃO DE JOGO
--------------------------------------------------------- */

function FZ_cartaoJogo(evento, ligaOverride = null){

  const info =
    FZ_infoJogo(evento);

  const casa =
    info.casa?.team?.displayName
    || "Casa";

  const fora =
    info.fora?.team?.displayName
    || "Fora";

  const estado =
    info.estado?.state
    || "pre";

  let classe = "proximo";

  let textoEstado = "";

  if(estado === "in"){

    classe = "live";

    textoEstado =
      info.estado?.shortDetail
      || "AO VIVO";

  }

  else if(estado === "post"){

    classe = "";

    textoEstado =
      info.estado?.shortDetail
      || "FINAL";

  }

  else{

    textoEstado =
      FZ_hora(info.data);

  }


  let resultado = "";

  if(
    estado === "in" ||
    estado === "post"
  ){

    resultado = `

      ${info.casa?.score ?? "-"}
      -
      ${info.fora?.score ?? "-"}

    `;

  }

  else{

    resultado = textoEstado;

  }


  return `

    <div class="jogo">

      <div class="jogo-competicao">

        ${
          ligaOverride
          || FZ_nomeLiga(
               FZ_ligaSelecionada
             )
        }

      </div>

      <div class="jogo-data">

        ${FZ_dataTexto(info.data)}

        ·

        <span class="${
          classe === "live"
          ? "resultado live"
          : classe === "proximo"
          ? "resultado proximo"
          : ""
        }">

          ${
            estado === "in"
              ? "🔴 AO VIVO"
              : estado === "post"
              ? "FINAL"
              : FZ_hora(info.data)
          }

        </span>

      </div>

      <div class="jogo-equipas">

        <div class="equipa">

          ${casa}

        </div>

        <div class="resultado ${classe}">

          ${resultado}

        </div>

        <div class="equipa">

          ${fora}

        </div>

      </div>

    </div>

  `;

}


/* ---------------------------------------------------------
   JOGOS DO DIA
--------------------------------------------------------- */

async function FZ_jogosDoDia(){

  FZ_estado.textContent =
    "A carregar resultados reais de hoje...";

  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A procurar jogos...
    </div>`;


  try{

    const data =
      await FZ_fetch(
        FZ_API +
        FZ_ligaSelecionada +
        "/scoreboard?dates=" +
        FZ_dataISO() +
        "&limit=100"
      );


    const jogos =
      data.events || [];


    if(!jogos.length){

      FZ_conteudo.innerHTML = `

        <div class="vazio">

          Não existem jogos fornecidos
          pela fonte para esta competição
          na data de hoje.

        </div>

      `;

      return;

    }


    FZ_conteudo.innerHTML = `

      <div class="seccao-titulo">

        ${FZ_nomeLiga(FZ_ligaSelecionada)}

      </div>

      ${
        jogos
          .sort(
            (a,b) =>
              new Date(a.date) -
              new Date(b.date)
          )
          .map(
            jogo =>
              FZ_cartaoJogo(jogo)
          )
          .join("")
      }

    `;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter os
        resultados reais neste momento.

        <br><br>

        Tenta atualizar a página.

      </div>

    `;

  }

}


/* ---------------------------------------------------------
   JORNADAS
   PASTA: PASSADOS + FUTUROS
--------------------------------------------------------- */

async function FZ_jornadas(){

  FZ_estado.textContent =
    "A carregar resultados anteriores e próximos jogos...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A carregar jornadas...
    </div>`;


  try{

    const hoje =
      new Date();

    const datas = [];


    /*
      14 dias anteriores
      +
      21 dias seguintes

      Assim temos uma janela suficiente
      para mostrar resultados e próximos jogos.
    */

    for(
      let i = -14;
      i <= 21;
      i++
    ){

      const d =
        new Date(hoje);

      d.setDate(
        hoje.getDate() + i
      );

      datas.push(
        FZ_dataISO(d)
      );

    }


    const jogos = [];


    /*
      Fazemos pedidos em grupos
      para não sobrecarregar a API.
    */

    for(
      let i = 0;
      i < datas.length;
      i += 5
    ){

      const grupo =
        datas.slice(
          i,
          i + 5
        );


      const respostas =
        await Promise.all(

          grupo.map(
            async data => {

              try{

                return await FZ_fetch(

                  FZ_API +
                  FZ_ligaSelecionada +
                  "/scoreboard?dates=" +
                  data +
                  "&limit=100"

                );

              }

              catch{

                return {
                  events:[]
                };

              }

            }
          )

        );


      respostas.forEach(
        resposta => {

          (resposta.events || [])
            .forEach(
              jogo =>
                jogos.push(jogo)
            );

        }
      );

    }


    jogos.sort(
      (a,b) =>
        new Date(a.date) -
        new Date(b.date)
    );


    if(!jogos.length){

      FZ_conteudo.innerHTML = `

        <div class="vazio">

          Não foram encontrados jogos
          desta competição neste período.

        </div>

      `;

      return;

    }


    /*
      Agrupar por dia
    */

    const grupos = {};


    jogos.forEach(
      jogo => {

        const dia =
          FZ_dataISO(
            jogo.date
          );

        if(!grupos[dia])
          grupos[dia] = [];

        grupos[dia].push(
          jogo
        );

      }
    );


    let html = `

      <div class="seccao-titulo">

        📅 Jornadas ·
        ${FZ_nomeLiga(FZ_ligaSelecionada)}

      </div>

    `;


    Object.keys(grupos)
      .sort()
      .forEach(
        dia => {

          html += `

            <div class="jornada">

              <div class="jornada-titulo">

                ${FZ_dataLonga(
                  dia + "T12:00:00"
                )}

              </div>

              ${
                grupos[dia]
                  .map(
                    jogo =>
                      FZ_cartaoJogo(jogo)
                  )
                  .join("")
              }

            </div>

          `;

        }
      );


    FZ_conteudo.innerHTML =
      html;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível carregar
        as jornadas.

      </div>

    `;

  }

}


/* ---------------------------------------------------------
   AO VIVO — TODOS OS CAMPEONATOS
--------------------------------------------------------- */

async function FZ_aoVivo(){

  FZ_estado.textContent =
    "A procurar jogos AO VIVO em todos os campeonatos...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      🔴 A procurar jogos ao vivo...
    </div>`;


  const jogosAoVivo = [];


  /*
    Dividimos em grupos de 4.
  */

  for(
    let i = 0;
    i < FZ_LIGAS.length;
    i += 4
  ){

    const grupo =
      FZ_LIGAS.slice(
        i,
        i + 4
      );


    const respostas =
      await Promise.all(

        grupo.map(
          async liga => {

            try{

              const data =
                await FZ_fetch(

                  FZ_API +
                  liga[0] +
                  "/scoreboard?dates=" +
                  FZ_dataISO() +
                  "&limit=100"

                );

              return {
                liga,
                eventos:
                  data.events || []
              };

            }

            catch{

              return {
                liga,
                eventos:[]
              };

            }

          }
        )

      );


    respostas.forEach(
      resposta => {

        resposta.eventos
          .forEach(
            jogo => {

              const info =
                FZ_infoJogo(jogo);


              if(
                info.estado?.state ===
                "in"
              ){

                jogosAoVivo.push({

                  jogo,

                  liga:
                    resposta.liga[1]

                });

              }

            }
          );

      }
    );

  }


  if(!jogosAoVivo.length){

    FZ_conteudo.innerHTML = `

      <div class="vazio">

        🔴

        <br><br>

        Não existem jogos AO VIVO
        fornecidos pela fonte neste momento.

      </div>

    `;

    return;

  }


  FZ_conteudo.innerHTML = `

    <div class="seccao-titulo">

      🔴 AO VIVO ·
      ${jogosAoVivo.length}

    </div>

    ${
      jogosAoVivo
        .map(
          item =>
            FZ_cartaoJogo(
              item.jogo,
              item.liga
            )
        )
        .join("")
    }

  `;

}


/* ---------------------------------------------------------
   CLASSIFICAÇÕES
--------------------------------------------------------- */

async function FZ_tabelas(){

  FZ_estado.textContent =
    "A carregar classificação real...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A carregar tabela...
    </div>`;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas = [];


    if(
      Array.isArray(
        data.children
      )
    ){

      data.children.forEach(
        grupo => {

          if(
            Array.isArray(
              grupo.standings?.entries
            )
          ){

            entradas =
              entradas.concat(
                grupo.standings.entries
              );

          }

        }
      );

    }


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      FZ_conteudo.innerHTML = `

        <div class="vazio">

          A classificação desta competição
          não está disponível pela fonte.

        </div>

      `;

      return;

    }


    function estatistica(
      entrada,
      nomes
    ){

      const stats =
        entrada.stats || [];


      const encontrada =
        stats.find(
          stat =>
            nomes.includes(
              stat.name
            ) ||
            nomes.includes(
              stat.abbreviation
            )
        );


      if(!encontrada)
        return "-";


      return
        encontrada.displayValue ??
        encontrada.value ??
        "-";

    }


    let linhas = "";


    entradas.forEach(
      (entrada,index) => {

        const equipa =
          entrada.team?.displayName ||
          entrada.team?.name ||
          "Equipa";


        const jogos =
          estatistica(
            entrada,
            [
              "gamesPlayed",
              "GP"
            ]
          );


        const vitorias =
          estatistica(
            entrada,
            [
              "wins",
              "W"
            ]
          );


        const empates =
          estatistica(
            entrada,
            [
              "ties",
              "draws",
              "D"
            ]
          );


        const derrotas =
          estatistica(
            entrada,
            [
              "losses",
              "L"
            ]
          );


        const pontos =
          estatistica(
            entrada,
            [
              "points",
              "PTS"
            ]
          );


        linhas += `

          <tr>

            <td class="posicao">
              ${index + 1}
            </td>

            <td>
              ${equipa}
            </td>

            <td>
              ${jogos}
            </td>

            <td>
              ${vitorias}
            </td>

            <td>
              ${empates}
            </td>

            <td>
              ${derrotas}
            </td>

            <td>
              <strong>
                ${pontos}
              </strong>
            </td>

          </tr>

        `;

      }
    );


    FZ_conteudo.innerHTML = `

      <div class="seccao-titulo">

        🏆 ${FZ_nomeLiga(
          FZ_ligaSelecionada
        )}

      </div>

      <div class="tabela-wrap">

        <table class="tabela">

          <thead>

            <tr>

              <th>#</th>
              <th>Equipa</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>Pts</th>

            </tr>

          </thead>

          <tbody>

            ${linhas}

          </tbody>

        </table>

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        a classificação neste momento.

      </div>

    `;

  }

}


/* ---------------------------------------------------------

--------------------------------------------------------- */

function FZ_mudarModo(modo){

  FZ_modo = modo;


  document
    .querySelectorAll(".top-btn")
    .forEach(
      botao =>
        botao.classList.remove(
          "active"
        )
    );


  if(modo === "jogos")
    FZ("btnJogos")
      .classList.add("active");


  if(modo === "jornadas")
    FZ("btnJornadas")
      .classList.add("active");


  if(modo === "tabelas")
    FZ("btnTabelas")
      .classList.add("active");


  if(modo === "live")
    FZ("btnLive")
      .classList.add("active");


  FZ_carregar();

}


/* ---------------------------------------------------------
   CARREGAR
--------------------------------------------------------- */

function FZ_carregar(){

  if(FZ_modo === "jogos")
    return FZ_jogosDoDia();


  if(FZ_modo === "jornadas")
    return FZ_jornadas();


  if(FZ_modo === "tabelas")
    return FZ_tabelas();


  if(FZ_modo === "live")
    return FZ_aoVivo();

}

FZ("btnJogos").onclick =

FZ("btnJornadas").onclick =

FZ("btnTabelas").onclick =

FZ("navJogos").onclick =

FZ("navTabelas").onclick =

FZ_renderizarCompeticoes();

setInterval(

  },

async function FZ_equipaJogos(
  id,
  nome
){

  const area =
    FZ("fz-equipa-conteudo");


  if(!area)
    return;


  area.innerHTML = `

    <div class="carregar">
      A carregar calendário...
    </div>

  `;


  try{

    /*
      Endpoint específico da equipa.
    */

    const data =
      await FZ_fetch(

        FZ_API +
        FZ_ligaSelecionada +
        "/teams/" +
        encodeURIComponent(id) +
        "/schedule?limit=100"

      );


    const jogos =
      data.events ||
      data.schedule ||
      [];


    if(!jogos.length){

      area.innerHTML = `

        <div class="vazio">

          Não existem jogos fornecidos
          para esta equipa.

        </div>

      `;

      return;

    }


    const ordenados =
      [...jogos].sort(
        (a,b) =>
          new Date(a.date) -
          new Date(b.date)
      );


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          📅 Calendário

        </div>

        ${
          ordenados
            .map(
              jogo =>
                FZ_cartaoJogo(
                  jogo,
                  FZ_nomeLiga(
                    FZ_ligaSelecionada
                  )
                )
            )
            .join("")
        }

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    area.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        o calendário desta equipa.

      </div>

    `;

  }

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      area.innerHTML = `

        <div class="vazio">

          Classificação não disponível.

        </div>

      `;

      return;

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const nome =
            entrada.team?.displayName ||
            entrada.team?.name ||
            "Equipa";


          const pts =
            (
              entrada.stats || []
            ).find(
              s =>
                s.name === "points" ||
                s.abbreviation === "PTS"
            );


          return `

            <div class="fz-historico">

              <div class="fz-historico-data">

                ${index + 1}º

              </div>

              <div class="fz-historico-nome">

                ${nome}

                ${
                  pts
                  ? " · " +
                    (
                      pts.displayValue ??
                      pts.value
                    ) +
                    " pts"
                  : ""
                }

              </div>

            </div>

          `;

        }
      ).join("");


    area.innerHTML = `

      <div class="fz-section">

        <div class="fz-section-title">

          🏆 Classificação

        </div>

        ${linhas}

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    area.innerHTML = `

      <div class="vazio erro">

        Não foi possível carregar
        a classificação.

      </div>

    `;

  }

}

async function FZ_abrirJogo(

){

  FZ_EXTRA.eventoAtual =
    evento;


  const info =
    FZ_infoJogo(evento);


  const casa =
    info.casa?.team?.displayName
    || "Casa";


  const fora =
    info.fora?.team?.displayName
    || "Fora";


  const estado =
    info.estado?.state
    || "pre";


  let resultado =
    "-";


  if(
    estado === "in" ||
    estado === "post"
  ){

    resultado =
      (info.casa?.score ?? "-") +
      " - " +
      (info.fora?.score ?? "-");

  }


  FZ_conteudo.innerHTML = `

    <div class="fz-extra">

      <button
        class="fz-voltar"

              info.data
            )}

          </span>

        </div>


        <div class="fz-detalhe-equipas">

          <div class="fz-detalhe-equipa">

            ${casa}

          </div>

          <div class="fz-detalhe-score">

            ${resultado}

          </div>

          <div class="fz-detalhe-equipa">

            ${fora}

          </div>

        </div>


        <div class="fz-detalhe-status">

          ${
            estado === "in"
            ? "🔴 AO VIVO"
            : estado === "post"
            ? "FINAL"
            : FZ_hora(info.data)
          }

        </div>

      </div>


      <div class="fz-section">

        <div class="fz-section-title">

          📊 Estatísticas

        </div>

        <div class="vazio">

          As estatísticas individuais
          e do jogo aparecem aqui quando
          forem disponibilizadas pela fonte.

        </div>

      </div>


      <div class="fz-section">

        <div class="fz-section-title">

          👥 Titulares

        </div>

        <div class="fz-campo">

          <div
            class="fz-jogador-campo"
            style="left:20%;top:50%">
            GR
          </div>

          <div
            class="fz-jogador-campo"
            style="left:40%;top:25%">
            DEF
          </div>

          <div
            class="fz-jogador-campo"
            style="left:40%;top:75%">
            DEF
          </div>

          <div
            class="fz-jogador-campo"
            style="left:62%;top:35%">
            MED
          </div>

          <div
            class="fz-jogador-campo"

            MED

   TORNAR AS EQUIPAS CLICÁVEIS NA CLASSIFICAÇÃO
--------------------------------------------------------- */

const FZ_tabelasOriginal =
  FZ_tabelas;


/*
  Mantemos a função principal e acrescentamos
  identificação dos clubes quando o ESPN fornece ID.
*/

FZ_tabelas = async function(){

  FZ_estado.textContent =
    "A carregar classificação real...";


  FZ_conteudo.innerHTML =
    `<div class="carregar">
      A carregar classificação...
    </div>`;


  try{

    const data =
      await FZ_fetch(

        FZ_STANDINGS +
        FZ_ligaSelecionada +
        "/standings?region=us&lang=en"

      );


    let entradas=[];


    (
      data.children ||
      []
    ).forEach(
      grupo => {

        if(
          grupo.standings?.entries
        ){

          entradas.push(
            ...grupo.standings.entries
          );

        }

      }
    );


    if(
      !entradas.length &&
      data.standings?.entries
    ){

      entradas =
        data.standings.entries;

    }


    if(!entradas.length){

      FZ_conteudo.innerHTML =
        `<div class="vazio">
          Classificação não disponível.
        </div>`;

      return;

    }


    function stat(
      entrada,
      nomes
    ){

      const encontrado =
        (
          entrada.stats ||
          []
        ).find(
          s =>
            nomes.includes(s.name) ||
            nomes.includes(s.abbreviation)
        );


      return encontrado
        ? (
            encontrado.displayValue ??
            encontrado.value ??
            "-"
          )
        : "-";

    }


    const linhas =
      entradas.map(
        (entrada,index) => {

          const equipa =
            entrada.team ||
            {};


          const id =
            equipa.id ||
            "";


          const nome =
            equipa.displayName ||
            equipa.name ||
            "Equipa";


          return `

            <tr>

              <td class="posicao">

                ${index + 1}

              </td>

              <td
                class="fz-clickable"
                onclick="FZ_abrirEquipa('${id}','${nome.replace(/'/g,"")}')">

                <strong>

                  ${nome}

                </strong>

              </td>

              <td>
                ${stat(
                  entrada,
                  ["gamesPlayed","GP"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["wins","W"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["ties","draws","D"]
                )}
              </td>

              <td>
                ${stat(
                  entrada,
                  ["losses","L"]
                )}
              </td>

              <td>
                <strong>
                  ${stat(
                    entrada,
                    ["points","PTS"]
                  )}
                </strong>
              </td>

            </tr>

          `;

        }
      ).join("");


    FZ_conteudo.innerHTML = `

      <div class="seccao-titulo">

        🏆 ${FZ_nomeLiga(
          FZ_ligaSelecionada
        )}

      </div>

      <div class="tabela-wrap">

        <table class="tabela">

          <thead>

            <tr>

              <th>#</th>
              <th>Equipa</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>Pts</th>

            </tr>

          </thead>

          <tbody>

            ${linhas}

          </tbody>

        </table>

      </div>

    `;

  }

  catch(erro){

    console.error(erro);

    FZ_conteudo.innerHTML = `

      <div class="vazio erro">

        Não foi possível obter
        a classificação.

      </div>

    `;

  }

};
