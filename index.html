  const uniq=new Map();historico.forEach(x=>uniq.set(x.equipa+'|'+(x.inicio||'')+'|'+(x.fim||''),x));
  const hist=[...uniq.values()].sort((x,y)=>String(y.inicio||'').localeCompare(String(x.inicio||'')));
  const temporada=(x)=>x.inicio?(x.inicio.slice(0,4)+(x.fim&&x.fim.slice(0,4)!==x.inicio.slice(0,4)?'â€“'+x.fim.slice(0,4):'') ):'';
  let histHtml=hist.length?hist.map(x=>`<div class="event"><strong>${escapeHtml(temporada(x)||'Percurso')}</strong><br>${escapeHtml(x.equipa)}${x.inicio||x.fim?`<div style="color:var(--muted);font-size:11px;margin-top:3px">${escapeHtml(x.inicio||'')} ${x.fim?'â†’ '+escapeHtml(x.fim):'â†’ atual'}</div>`:''}</div>`).join(''):'<div style="color:var(--muted);font-size:13px">O histÃ³rico deste jogador nÃ£o estÃ¡ registado na fonte consultada.</div>';
  const temDados=Object.keys(a).length||wikidata;
  if(!temDados){histHtml='<div style="color:var(--muted);font-size:13px">NÃ£o foi possÃ­vel obter dados deste jogador.</div>'}
  document.getElementById('overlayBody').innerHTML=`<div class="detailCard" style="text-align:center">${foto?`<img src="${escapeHtml(foto)}" style="width:90px;height:90px;object-fit:contain">`:''}<h3>ðŸ‘¤ ${escapeHtml(nomeFinal)}</h3><div style="color:var(--muted)">${escapeHtml(posicao)}</div></div><div class="detailCard"><h3>ðŸ“Š Dados</h3><div style="color:var(--muted);font-size:13px">Nacionalidade: ${escapeHtml(nacionalidade)}<br>Data de nascimento: ${escapeHtml(nascimento)}<br>Altura: ${escapeHtml(altura)}<br>Peso: ${escapeHtml(peso)}</div></div><div class="detailCard"><h3>ðŸ“š HistÃ³rico de clubes</h3>${histHtml}</div>`;
 })().catch(e=>{console.warn('FUTZONE jogador final:',e);document.getElementById('overlayBody').innerHTML='<div class="detailCard"><h3>ðŸ‘¤ '+escapeHtml(nome)+'</h3><div style="color:var(--muted);font-size:13px">NÃ£o foi possÃ­vel carregar todos os dados deste jogador neste momento.</div></div>'});
}

function fzCriarCabecalhoDias(){

function fzMostrarTodosJogosDoDia(btn){

async function fzBuscarTodos(){
 const agora=new Date(),ini=new Date(agora);ini.setDate(ini.getDate()-1);const fim=new Date(agora);fim.setDate(fim.getDate()+14);
 const ds=x=>x.toISOString().slice(0,10).replaceAll('-','');const range=ds(ini)+'-'+ds(fim);
 const out=[];const seen=new Set();
 for(let i=0;i<ligas.length;i+=5){
   const lote=ligas.slice(i,i+5);await Promise.all(lote.map(async l=>{try{const d=await fetchJSON(API+encodeURIComponent(l[0])+'/scoreboard?dates='+range);(d.events||[]).forEach(e=>{e.__futzoneLiga=l[0];if(!seen.has(String(e.id))){seen.add(String(e.id));out.push(e)}})}catch(e){}}));
 }
 out.sort((a,b)=>new Date(a.date)-new Date(b.date));return out;
}

async function fzRenderTodos(){

 const ev=await fzBuscarTodos();let arr=ev;
 if(fzDiaSelecionado)arr=arr.filter(e=>new Date(e.date).toISOString().slice(0,10)===fzDiaSelecionado);
 const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();if(q)arr=arr.filter(e=>{const cs=e.competitions?.[0]?.competitors||[];return cs.some(x=>nomeEquipa(x.team).toLowerCase().includes(q))});
 const grupos={};arr.forEach(e=>{const d=new Date(e.date).toISOString().slice(0,10);(grupos[d]??=[]).push(e)});
 if(!arr.length){c.innerHTML='<div class="empty">âš½<br><br>NÃ£o existem jogos para esta data.</div>';return}
 c.innerHTML=`<div class="fzAllHead"><b>âš½ FUTEBOL â€” TODAS AS COMPETIÃ‡Ã•ES</b><span>${arr.length} jogos</span></div>`+Object.keys(grupos).sort().map(d=>`<div class="dayTitle"><span>${escapeHtml(formatarData(grupos[d][0].date))}</span><span>${dataCurta(grupos[d][0].date)}</span></div>${grupos[d].map(fzCartaoComLiga).join('')}`).join('');
}
