<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07111f;
 color:#fff;
 padding-bottom:80px
}
header{
 padding:20px 16px;
 background:#081827;
 position:sticky;
 top:0;
 z-index:10;
 border-bottom:1px solid #1c3045
}
.logo{
 font-size:28px;
 font-weight:900;
 color:#35d06f
}
.sub{
 color:#8fa3b8;
 font-size:13px;
 margin-top:4px
}
.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:12px 16px
}
.filter{
 border:1px solid #294057;
 background:#102337;
 color:#fff;
 border-radius:20px;
 padding:9px 14px;
 white-space:nowrap
}
.filter.active{
 background:#35d06f;
 color:#06120b;
 border-color:#35d06f;
 font-weight:bold
}
.leagues{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:4px 16px 14px
}
.league{
 background:#102337;
 border:1px solid #294057;
 color:#fff;
 padding:8px 12px;
 border-radius:8px;
 white-space:nowrap
}
.league.active{
 border-color:#35d06f;
 color:#35d06f
}
#app{
 padding:0 12px
}
.card{
 background:#0d1e30;
 border:1px solid #1c344b;
 border-radius:14px;
 margin-bottom:12px;
 overflow:hidden
}
.cardhead{
 padding:10px 12px;
 color:#8fa3b8;
 font-size:12px;
 display:flex;
 justify-content:space-between
}
.game{
 padding:14px;
 text-align:center
}
.teams{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px
}
.team{
 width:38%;
 font-weight:bold;
 font-size:14px
}
.score{
 font-size:22px;
 font-weight:900;
 width:24%
}
.status{
 margin-top:8px;
 font-size:12px;
 color:#8fa3b8
}
.live{
 color:#ff4d5d;
 font-weight:bold
}
.green{
 color:#35d06f
}
.section-title{
 font-size:20px;
 font-weight:bold;
 margin:18px 4px 12px
}
.table{
 width:100%;
 border-collapse:collapse;
 background:#0d1e30;
 border-radius:12px;
 overflow:hidden
}
.table th,.table td{
 padding:10px 7px;
 border-bottom:1px solid #1c344b;
 font-size:12px;
 text-align:center
}
.table th{
 color:#8fa3b8
}
.table td:nth-child(2){
 text-align:left;
 font-weight:bold
}
.empty{
 text-align:center;
 padding:35px 15px;
 color:#8fa3b8
}
.loading{
 text-align:center;
 padding:40px;
 color:#8fa3b8
}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:68px;
 background:#081827;
 border-top:1px solid #1c3045;
 display:flex;
 z-index:20
}
nav button{
 flex:1;
 background:none;
 border:0;
 color:#7890a6;
 font-size:12px
}
nav button.active{
 color:#35d06f
}
nav span{
 display:block;
 font-size:22px;
 margin-bottom:3px
}
</style>
</head>

<body>

<header>
 <div class="logo">FUTZONE</div>
 <div class="sub">Futebol em direto</div>
</header>

<div class="filters">
 <button class="filter active" data-filter="todos">Todos</button>
 <button class="filter" data-filter="live">🔴 LIVE</button>
 <button class="filter" data-filter="proximos">🕐 Próximos</button>
 <button class="filter" data-filter="resultados">✅ Resultados</button>
</div>

<div class="leagues">
 <button class="league active" data-league="todos">🌍 Todas</button>
 <button class="league" data-league="por">🇵🇹 Portugal</button>
 <button class="league" data-league="eng">🏴 Inglaterra</button>
 <button class="league" data-league="esp">🇪🇸 Espanha</button>
 <button class="league" data-league="ita">🇮🇹 Itália</button>
 <button class="league" data-league="ger">🇩🇪 Alemanha</button>
</div>

<main id="app">
 <div class="loading">A carregar jogos...</div>
</main>

<nav>
 <button class="active" onclick="mudarPagina('jogos',this)">
  <span>⚽</span>Jogos
 </button>
 <button onclick="mudarPagina('tabela',this)">
  <span>🏆</span>Tabelas
 </button>
 <button onclick="mudarPagina('favoritos',this)">
  <span>⭐</span>Favoritos
 </button>
</nav>

<script>

const ligas = {
 por:{
  nome:"Primeira Liga",
  ficheiro:"primeira-liga.json"
 },
 eng:{
  nome:"Premier League",
  ficheiro:"premier-league.json"
 },
 esp:{
  nome:"La Liga",
  ficheiro:"la-liga.json"
 },
 ita:{
  nome:"Serie A",
  ficheiro:"serie-a.json"
 },
 ger:{
  nome:"Bundesliga",
  ficheiro:"bundesliga.json"
 }
};

let jogos=[];
let filtro="todos";
let ligaSelecionada="todos";
let pagina="jogos";
let tabelas={};

async function carregar(){

 try{

  const pedidos=Object.entries(ligas).map(async ([codigo,liga])=>{

   try{
    const resposta=await fetch("data/"+liga.ficheiro+"?v="+Date.now());

    if(!resposta.ok) return;

    const dados=await resposta.json();

    if(dados.events){
     dados.events.forEach(j=>{
      j._liga=codigo;
      j._nomeLiga=liga.nome;
      jogos.push(j);
     });
    }

   }catch(e){
    console.log("Erro liga:",codigo,e);
   }

  });

  await Promise.all(pedidos);

  render();

 }catch(e){

  document.getElementById("app").innerHTML=
   '<div class="empty">Não foi possível carregar os dados.</div>';

 }

}

function estadoJogo(j){

 const comp=j.competitions && j.competitions[0];

 if(!comp) return "proximo";

 if(comp.status){

  const tipo=comp.status.type;

  if(tipo && (tipo.state==="in")) return "live";

  if(tipo && (tipo.completed===true || tipo.state==="post"))
   return "resultado";
 }

 return "proximo";
}

function dataJogo(j){

 const comp=j.competitions && j.competitions[0];

 if(comp && comp.date){
  return new Date(comp.date);
 }

 if(j.date){
  return new Date(j.date);
 }

 return null;
}

function nomeEquipa(team){

 if(!team) return "?";

 return team.displayName ||
        team.shortDisplayName ||
        team.name ||
        "?";
}

function placar(team){

 if(!team) return "-";

 if(team.score!==undefined)
  return team.score;

 return "-";
}

function render(){

 if(pagina==="tabela"){
  mostrarTabelas();
  return;
 }

 if(pagina==="favoritos"){
  mostrarFavoritos();
  return;
 }

 mostrarJogos();
}

function mostrarJogos(){

 let lista=jogos.slice();

 if(ligaSelecionada!=="todos"){
  lista=lista.filter(j=>j._liga===ligaSelecionada);
 }

 if(filtro!=="todos"){
  lista=lista.filter(j=>estadoJogo(j)===filtro);
 }

 lista.sort((a,b)=>{

  const da=dataJogo(a);
  const db=dataJogo(b);

  if(!da || !db) return 0;

  return da-db;
 });

 const app=document.getElementById("app");

 if(lista.length===0){
  app.innerHTML='<div class="empty">Não existem jogos para mostrar.</div>';
  return;
 }

 let html="";

 lista.forEach(j=>{
  html+=jogoHTML(j);
 });

 app.innerHTML=html;
}

function jogoHTML(j){

 const comp=j.competitions && j.competitions[0];

 if(!comp) return "";

 const casa=comp.competitors ?
  comp.competitors.find(x=>x.homeAway==="home") : null;

 const fora=comp.competitors ?
  comp.competitors.find(x=>x.homeAway==="away") : null;

 const estado=estadoJogo(j);
 const data=dataJogo(j);

 let hora="";

 if(data){
  hora=data.toLocaleString("pt-PT",{
   day:"2-digit",
   month:"2-digit",
   hour:"2-digit",
   minute:"2-digit"
  });
 }

 let status="Próximo";

 if(estado==="live") status="🔴 LIVE";
 if(estado==="resultado") status="Final";

 return `
 <div class="card">

  <div class="cardhead">
   <span>${j._nomeLiga}</span>
   <span>${hora}</span>
  </div>

  <div class="game">

   <div class="teams">

    <div class="team">
     ${nomeEquipa(casa && casa.team)}
    </div>

    <div class="score">
     ${placar(casa)} - ${placar(fora)}
    </div>

    <div class="team">
     ${nomeEquipa(fora && fora.team)}
    </div>

   </div>

   <div class="status ${estado==="live"?"live":""}">
    ${status}
   </div>

  </div>

 </div>
 `;
}

async function carregarTabela(codigo){

 if(tabelas[codigo]) return tabelas[codigo];

 const ficheiro=
  codigo==="por" ? "classificacao.json" :
  codigo==="eng" ? "premier-league-classificacao.json" :
  codigo==="esp" ? "la-liga-classificacao.json" :
  codigo==="ita" ? "serie-a-classificacao.json" :
  "bundesliga-classificacao.json";

 try{

  const resposta=await fetch("data/"+ficheiro+"?v="+Date.now());

  if(!resposta.ok) return null;

  const dados=await resposta.json();

  tabelas[codigo]=dados;

  return dados;

 }catch(e){
  return null;
 }
}

async function mostrarTabelas(){

 const app=document.getElementById("app");

 app.innerHTML='<div class="loading">A carregar classificações...</div>';

 let codigos=
  ligaSelecionada==="todos"
  ? Object.keys(ligas)
  : [ligaSelecionada];

 let html="";

 for(const codigo of codigos){

  const dados=await carregarTabela(codigo);

  html+=tabelaHTML(codigo,dados);

 }

 app.innerHTML=html;
}

function extrairEquipes(dados){

 if(!dados) return [];

 if(dados.standings){
  if(Array.isArray(dados.standings))
   return dados.standings;
 }

 if(Array.isArray(dados))
  return dados;

 return [];
}

function tabelaHTML(codigo,dados){

 const lista=extrairEquipes(dados);

 let rows="";

 lista.forEach((item,index)=>{

  const entry=item.team ? item : item;

  const team=
   item.team ||
   item;

  const nome=
   team.displayName ||
   team.name ||
   item.name ||
   "Equipa";

  let stats=item.stats || [];

  function stat(nomeStat){

   const s=stats.find(x=>
    x.name===nomeStat ||
    x.abbreviation===nomeStat
   );

   if(!s) return 0;

   return s.value!==undefined ? s.value : s.displayValue;
  }

  const pts=stat("points") || stat("PTS");
  const j=stat("gamesPlayed") || stat("GP");
  const v=stat("wins") || stat("W");
  const e=stat("ties") || stat("D");
  const d=stat("losses") || stat("L");

  rows+=`
   <tr>
    <td>${index+1}</td>
    <td>${nome}</td>
    <td>${j}</td>
    <td>${v}</td>
    <td>${e}</td>
    <td>${d}</td>
    <td><b>${pts}</b></td>
   </tr>
  `;

 });

 return `
 <div class="section-title">${ligas[codigo].nome}</div>

 <table class="table">

  <thead>
   <tr>
    <th>#</th>
    <th>Equipa</th>
    <th>J</th>
    <th>V</th>
    <th>E</th>
    <th>D</th>
    <th>Pts</th>
   </tr>
  </thead>

  <tbody>
   ${rows || `
    <tr>
     <td colspan="7">Sem dados</td>
    </tr>
   `}
  </tbody>

 </table>
 `;
}

function favoritos(){

 try{
  return JSON.parse(localStorage.getItem("futzone_favoritos")||"[]");
 }catch(e){
  return [];
 }

}

function mostrarFavoritos(){

 const lista=favoritos();

 if(lista.length===0){

  document.getElementById("app").innerHTML=
   '<div class="empty">⭐ Ainda não tens favoritos.</div>';

  return;
 }

 document.getElementById("app").innerHTML=
  '<div class="section-title">⭐ Favoritos</div>'+
  lista.map(x=>`
   <div class="card">
    <div class="game">
     <b>${x}</b>
    </div>
   </div>
  `).join("");
}

function mudarPagina(nome,botao){

 pagina=nome;

 document.querySelectorAll("nav button").forEach(x=>{
  x.classList.remove("active");
 });

 botao.classList.add("active");

 render();
}

document.querySelectorAll(".filter").forEach(botao=>{

 botao.addEventListener("click",()=>{

  document.querySelectorAll(".filter")
   .forEach(x=>x.classList.remove("active"));

  botao.classList.add("active");

  filtro=botao.dataset.filter;

  render();

 });

});

document.querySelectorAll(".league").forEach(botao=>{

 botao.addEventListener("click",()=>{

  document.querySelectorAll(".league")
   .forEach(x=>x.classList.remove("active"));

  botao.classList.add("active");

  ligaSelecionada=botao.dataset.league;

  render();

 });

});

carregar();

</script>

</body>
</html>
