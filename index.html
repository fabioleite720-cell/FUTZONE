<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>FUTZONE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050b16;
  color:#fff;
  font-family:Arial,sans-serif
}
button{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#071326;
  border-bottom:1px solid #17243a;
  padding:14px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:25px;
  font-weight:900
}

.logo span{color:#7ed957}

.bell{
  background:#0b1627;
  border:1px solid #243653;
  color:#fff;
  border-radius:10px;
  padding:8px 10px
}

main{
  padding:12px 10px 90px;
  max-width:700px;
  margin:auto
}

h2{
  font-size:18px;
  margin:15px 0 10px
}

h3{
  font-size:15px;
  margin:0 0 10px
}

.seletor-ligas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:15px
}

.liga-btn,
.acao{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:12px;
  padding:12px 7px;
  color:#fff;
  text-align:center;
  font-size:13px;
  font-weight:bold
}

.liga-btn.active{
  border-color:#7ed957;
  color:#7ed957
}

.liga-icon{
  font-size:22px;
  display:block;
  margin-bottom:5px
}

.jogo{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  padding:12px;
  margin-bottom:9px
}

.jogo-top{
  display:flex;
  justify-content:space-between;
  color:#9ca9bb;
  font-size:11px;
  margin-bottom:9px
}

.equipas{
  display:grid;
  grid-template-columns:1fr 65px 1fr;
  align-items:center;
  gap:5px
}

.equipa{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  cursor:pointer
}

.escudo{
  width:34px;
  height:34px;
  object-fit:contain;
  display:block;
  margin:0 auto 5px
}

.resultado{
  text-align:center;
  font-size:19px;
  font-weight:900
}

.estado{
  text-align:center;
  color:#7ed957;
  font-size:12px;
  margin-top:5px
}

.live{
  color:#ff6565!important;
  font-weight:bold
}

.vazio,
.erro,
.carregando{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:12px;
  padding:20px;
  text-align:center;
  color:#9ca9bb;
  margin:10px 0
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#071326;
  border-top:1px solid #17243a;
  display:flex;
  z-index:30
}

.bottom button{
  background:none;
  border:0;
  color:#9ca9bb;
  font-weight:bold;
  width:25%;
  font-size:11px
}

.bottom button.active{
  color:#7ed957
}

.overlay{
  position:fixed;
  inset:0;
  background:#050b16;
  z-index:50;
  overflow:auto
}

.detalhe-header{
  position:sticky;
  top:0;
  background:#071326;
  border-bottom:1px solid #17243a;
  padding:12px;
  z-index:5;
  display:flex;
  justify-content:space-between
}

.voltar{
  background:#0b1627;
  border:1px solid #243653;
  color:#fff;
  border-radius:8px;
  padding:8px 12px;
  font-weight:bold
}

.detalhe{
  padding:10px;
  max-width:700px;
  margin:auto
}

.jogo-grande{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:14px;
  padding:18px 10px;
  margin-bottom:12px
}

.jogo-grande .escudo{
  width:55px;
  height:55px
}

.jogo-grande .equipa{
  font-size:15px
}

.bigscore{
  text-align:center;
  font-size:30px;
  font-weight:900
}

.secao{
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  margin:10px 0;
  padding:12px
}

.evento{
  display:flex;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #17243a;
  font-size:13px
}

.evento:last-child{
  border-bottom:0
}

.minuto{
  color:#7ed957;
  font-weight:bold;
  min-width:38px
}

.stats-head,
.stat-row{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  text-align:center
}

.stats-head{
  font-size:12px;
  margin-bottom:7px
}

.stat-row{
  align-items:center;
  border-top:1px solid #17243a;
  padding:9px 0;
  font-size:12px
}

.stat-home{
  text-align:right;
  font-weight:bold
}

.stat-away{
  text-align:left;
  font-weight:bold
}

.stat-name{
  font-size:11px;
  color:#9ca9bb
}

.noticia{
  display:block;
  background:#0b1627;
  border:1px solid #17243a;
  border-radius:13px;
  padding:12px;
  margin-bottom:9px;
  color:#fff;
  text-decoration:none
}

.noticia b{
  display:block;
  font-size:14px;
  margin-bottom:7px
}

.noticia small{
  color:#9ca9bb
}

.lista{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.jogador{
  background:#071326;
  border:1px solid #17243a;
  border-radius:9px;
  padding:10px;
  color:#fff;
  text-align:left
}

.jogador b{
  display:block;
  color:#7ed957;
  margin-bottom:4px
}

.tabela{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

.tabela th,
.tabela td{
  padding:9px 5px;
  border-bottom:1px solid #17243a;
  text-align:center
}

.tabela th:nth-child(2),
.tabela td:nth-child(2){
  text-align:left
}

.favbtn{
  background:none;
  border:0;
  color:#ffd84d;
  font-size:23px;
  cursor:pointer
}

.favbtn2{
  background:#0b1627;
  border:1px solid #243653;
  color:#ffd84d;
  border-radius:9px;
  padding:8px 12px
}
</style>
</head>

<body>

<header>
  <div class="logo">FUT<span>ZONE</span></div>
  <button class="bell" onclick="pedirNotificacoes()">🔔</button>
</header>

<main id="app"></main>

<div class="bottom">
  <button id="navJogos" class="active" onclick="mostrarJogos()">⚽<br>Jogos</button>
  <button id="navNoticias" onclick="mostrarNoticias()">📰<br>Notícias</button>
  <button id="navTabelas" onclick="mostrarTabelas()">🏆<br>Tabelas</button>
  <button id="navFav" onclick="mostrarFavoritos()">⭐<br>Favoritos</button>
</div>

<script>

const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ligas=[
 {nome:"Portugal",codigo:"por.1",icone:"🇵🇹"},
 {nome:"Inglaterra",codigo:"eng.1",icone:"🏴"},
 {nome:"Espanha",codigo:"esp.1",icone:"🇪🇸"},
 {nome:"Itália",codigo:"ita.1",icone:"🇮🇹"},
 {nome:"Alemanha",codigo:"ger.1",icone:"🇩🇪"},
 {nome:"França",codigo:"fra.1",icone:"🇫🇷"},
 {nome:"Países Baixos",codigo:"ned.1",icone:"🇳🇱"},
 {nome:"Bélgica",codigo:"bel.1",icone:"🇧🇪"},
 {nome:"Champions League",codigo:"uefa.champions",icone:"🏆"},
 {nome:"Liga Europa",codigo:"uefa.europa",icone:"🏆"},
 {nome:"Liga Conferência",codigo:"uefa.europa.conf",icone:"🏆"}
];

let jogos=[];
let ligaSelecionada="Portugal";

let favoritos=JSON.parse(
 localStorage.getItem("futzone_favoritos")||"[]"
);

let favoritosEquipas=JSON.parse(
 localStorage.getItem("futzone_fav_equipas")||"[]"
);

const app=document.getElementById("app");

function esc(v){
 return String(v??"")
 .replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function save(){
 localStorage.setItem(
  "futzone_favoritos",
  JSON.stringify(favoritos)
 );

 localStorage.setItem(
  "futzone_fav_equipas",
  JSON.stringify(favoritosEquipas)
 );
}

function nav(id){

 ["navJogos","navNoticias","navTabelas","navFav"]
 .forEach(x=>{
   document.getElementById(x)
   .classList.toggle("active",x===id);
 });

}

function logo(url){

 if(!url)
 return "<div style='height:39px'></div>";

 return `
 <img
 class="escudo"
 src="${esc(url)}"
 onerror="this.style.display='none'"
 >
 `;
}

function comp(j){
 return j?.competitions?.[0]||{};
}

function nome(c){

 return c?.team?.displayName||
 c?.team?.shortDisplayName||
 c?.team?.name||
 c?.displayName||
 "Equipa";

}

function jogo(j,l){

 const c=comp(j);

 const cs=c.competitors||[];

 const h=
 cs.find(x=>x.homeAway==="home")||
 cs[0]||{};

 const a=
 cs.find(x=>x.homeAway==="away")||
 cs[1]||{};

 return {

  id:String(j.id),

  codigo:l.codigo,

  liga:l.nome,

  home:{
   id:String(h?.team?.id||""),
   nome:nome(h),
   logo:h?.team?.logo||"",
   score:h?.score??"-"
  },

  away:{
   id:String(a?.team?.id||""),
   nome:nome(a),
   logo:a?.team?.logo||"",
   score:a?.score??"-"
  },

  estado:
   c?.status?.type?.shortDetail||
   c?.status?.type?.detail||
   "",

  state:c?.status?.type?.state||""

 };

}

async function carregarJogos(){

 jogos=[];

 await Promise.all(

  ligas.map(async l=>{

   try{

    const r=await fetch(
     ESPN+
     l.codigo+
     "/scoreboard?limit=100&_="+
     Date.now()
    );

    if(!r.ok)return;

    const d=await r.json();

    (d.events||[]).forEach(j=>{
      jogos.push(jogo(j,l));
    });

   }catch(e){}

  })

 );

 mostrarJogos();

}

function botoesLigas(){

 return `
 <div class="seletor-ligas">

 ${ligas.map(l=>`

 <button
 class="liga-btn ${ligaSelecionada===l.nome?"active":""}"
 onclick="selecionarLiga('${esc(l.nome)}')"
 >

 <span class="liga-icon">${l.icone}</span>

 ${esc(l.nome)}

 </button>

 `).join("")}

 </div>
 `;

}

function selecionarLiga(nome){

 ligaSelecionada=nome;

 mostrarJogos();

 window.scrollTo(0,0);

}

function alternarFav(id){

 id=String(id);

 const i=favoritos.indexOf(id);

 if(i>=0)
 favoritos.splice(i,1);
 else
 favoritos.push(id);

 save();

 if(
  document.getElementById("navFav")
  .classList.contains("active")
 )
 mostrarFavoritos();
 else
 mostrarJogos();

}

function cartao(j){

 const fav=favoritos.includes(String(j.id));

 return `

 <div class="jogo">

  <div class="jogo-top">

   <span>${esc(j.liga)}</span>

   <span class="${j.state==="in"?"live":""}">
    ${esc(j.estado)}
   </span>

  </div>

  <div class="equipas">

   <div
    class="equipa"
    onclick="abrirEquipa(
      '${esc(j.home.id)}',
      '${esc(j.home.nome)}',
      '${esc(j.home.logo)}',
      '${esc(j.codigo)}'
    )"
   >

    ${logo(j.home.logo)}

    ${esc(j.home.nome)}

   </div>

   <div>

    <div
     class="resultado"
     onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')"
    >
     ${esc(j.home.score)}
     -
     ${esc(j.away.score)}
    </div>

    <div class="estado">
     ${j.state==="in"?"🔴 AO VIVO":""}
    </div>

   </div>

   <div
    class="equipa"
    onclick="abrirEquipa(
      '${esc(j.away.id)}',
      '${esc(j.away.nome)}',
      '${esc(j.away.logo)}',
      '${esc(j.codigo)}'
    )"
   >

    ${logo(j.away.logo)}

    ${esc(j.away.nome)}

   </div>

  </div>

  <div style="text-align:center;margin-top:7px">

   <button
    class="favbtn"
    onclick="alternarFav('${esc(j.id)}')"
   >
    ${fav?"★":"☆"}
   </button>

   <button
    class="acao"
    onclick="abrirDetalhe('${esc(j.id)}','${esc(j.codigo)}')"
   >
    Detalhes
   </button>

  </div>

 </div>

 `;

}

function mostrarJogos(){

 nav("navJogos");

 const lista=jogos.filter(
  j=>j.liga===ligaSelecionada
 );

 app.innerHTML=`

 <h2>⚽ FUTZONE</h2>

 ${botoesLigas()}

 <h2>${esc(ligaSelecionada)}</h2>

 ${
 lista.length
 ?
 lista.map(cartao).join("")
 :
 `<div class="vazio">
 Não há jogos disponíveis neste momento.
 </div>`
 }

 `;

}

function criarOverlay(titulo){

 const o=document.createElement("div");

 o.className="overlay";

 o.innerHTML=`

 <div class="detalhe-header">

  <button
   class="voltar"
   onclick="this.closest('.overlay').remove()"
  >
   ← Voltar
  </button>

  <b style="padding:9px">
   ${esc(titulo)}
  </b>

 </div>

 <div class="detalhe"></div>

 `;

 document.body.appendChild(o);

 return o;

}

function nomeAtleta(x){

 return x?.athlete?.displayName||
 x?.athlete?.fullName||
 x?.player?.displayName||
 x?.player?.fullName||
 x?.athletesInvolved?.[0]?.displayName||
 x?.athletesInvolved?.[0]?.fullName||
 x?.participants?.[0]?.athlete?.displayName||
 x?.participants?.[0]?.displayName||
 "";

}

function segundoAtleta(x){

 return x?.athletesInvolved?.[1]?.displayName||
 x?.athletesInvolved?.[1]?.fullName||
 x?.participants?.[1]?.athlete?.displayName||
 x?.participants?.[1]?.displayName||
 "";

}

function extrairEventos(d){

 const resultado=[];
 const vistos=new Set();

 const fontes=[];

 function adicionar(v){

  if(Array.isArray(v))
   v.forEach(x=>fontes.push(x));

 }

 adicionar(d?.plays);
 adicionar(d?.keyEvents);
 adicionar(d?.scoringPlays);

 for(const e of fontes){

  if(!e)continue;

  const tipoTexto=
   (
    e?.type?.text||
    e?.type?.description||
    e?.text||
    e?.shortText||
    e?.description||
    ""
   ).toLowerCase();

  let tipo="";

  if(
   tipoTexto.includes("yellow")||
   tipoTexto.includes("amarelo")
  )
   tipo="🟨";

  else if(
   tipoTexto.includes("red")||
   tipoTexto.includes("vermelho")
  )
   tipo="🟥";

  else if(
   tipoTexto.includes("substitut")
  )
   tipo="🔄";

  else if(
   tipoTexto.includes("goal")||
   tipoTexto.includes("golo")
  )
   tipo="⚽";

  if(!tipo)continue;

  const atleta=
   nomeAtleta(e)||
   e?.athlete?.name||
   "";

  const segundo=
   segundoAtleta(e);

  let assist="";

  if(e?.assist?.athlete)
   assist=
    e.assist.athlete.displayName||
    e.assist.athlete.fullName||
    "";

  if(!assist && e?.assist?.displayName)
   assist=e.assist.displayName;

  const chave=
   tipo+"|"+
   (e?.clock?.displayValue||"")+"|"+
   atleta+"|"+
   (e?.text||"");

  if(vistos.has(chave))continue;

  vistos.add(chave);

  resultado.push({

   tipo,

   minuto:
    e?.clock?.displayValue||
    e?.period?.displayValue||
    "",

   atleta,

   segundo,

   assist,

   texto:
    e?.text||
    e?.shortText||
    e?.description||
    ""

  });

 }

 return resultado;

}

function blocoEventos(eventos){

 if(!eventos.length){

  return `
  <div class="secao">
   <h3>📋 Acontecimentos</h3>
   <div class="vazio">
    Ainda não há acontecimentos disponíveis.
   </div>
  </div>
  `;

 }

 let html=`
 <div class="secao">
 <h3>📋 Acontecimentos</h3>
 `;

 eventos.forEach(e=>{

  let texto="";

  if(e.tipo==="⚽"){

   texto=
   `<b>${esc(e.atleta||"Marcador não disponível")}</b>`;

   if(e.assist)
   texto+=
   `<br>🎯 Assistência: <b>${esc(e.assist)}</b>`;

  }

  else if(e.tipo==="🟨"){

   texto=
   `<b>${esc(e.atleta||"Jogador não disponível")}</b>`;

  }

  else if(e.tipo==="🟥"){

   texto=
   `<b>${esc(e.atleta||"Jogador não disponível")}</b>`;

  }

  else if(e.tipo==="🔄"){

   texto=
   `<b>${esc(e.atleta||"Jogador")}</b>`;

   if(e.segundo)
   texto+=
   `<br>↔️ ${esc(e.segundo)}`;

  }

  html+=`

  <div class="evento">

   <span class="minuto">
    ${esc(e.minuto)}
   </span>

   <span>
    ${e.tipo} ${texto}
   </span>

  </div>

  `;

 });

 html+=`</div>`;

 return html;

}

function extrairStats(d){

 const grupos=[];

 function adicionar(team,stats){

  if(!team||!Array.isArray(stats))
   return;

  const id=
   team?.id||
   team?.team?.id||
   team?.displayName||
   team?.team?.displayName;

  let g=grupos.find(
   x=>String(x.id)===String(id)
  );

  if(!g){

   g={id,s:[]};

   grupos.push(g);

  }

  stats.forEach(x=>{

   const n=
    x?.displayName||
    x?.shortDisplayName||
    x?.name||
    x?.label||
    x?.description;

   if(n){

    g.s.push({

     n,

     v:
      x?.displayValue||
      x?.value||
      "-"

    });

   }

  });

 }

 (d?.boxscore?.teams||[])
 .forEach(t=>
  adicionar(
   t.team||t,
   t.statistics||t.stats
  )
 );

 (d?.header?.competitions?.[0]?.competitors||[])
 .forEach(c=>
  adicionar(
   c.team||c,
   c.statistics
  )
 );

 if(grupos.length<2)
 return [];

 const mapa=new Map();

 grupos.forEach((g,index)=>{

  g.s.forEach(x=>{

   const chave=x.n.toLowerCase();

   if(!mapa.has(chave)){

    mapa.set(chave,{
     n:x.n,
     h:"-",
     a:"-"
    });

   }

   mapa.get(chave)[
    index===0?"h":"a"
   ]=x.v;

  });

 });

 return [...mapa.values()];

}

function blocoStats(stats){

 if(!stats.length){

  return `
  <div class="secao">

   <h3>📊 Estatísticas</h3>

   <div class="vazio">
    Estatísticas não disponíveis.
   </div>

  </div>
  `;

 }

 return `

 <div class="secao">

  <h3>📊 Estatísticas</h3>

  <div class="stats-head">

   <span>Casa</span>
   <span>ESTAT.</span>
   <span>Fora</span>

  </div>

  ${
   stats.map(s=>`

   <div class="stat-row">

    <div class="stat-home">
     ${esc(s.h)}
    </div>

    <div class="stat-name">
     ${esc(s.n)}
    </div>

    <div class="stat-away">
     ${esc(s.a)}
    </div>

   </div>

   `).join("")
  }

 </div>

 `;

}

async function abrirDetalhe(id,codigo){

 const j=jogos.find(
  x=>x.id===String(id)
 );

 if(!j)return;

 const o=criarOverlay("Detalhes");

 const d=o.querySelector(".detalhe");

 d.innerHTML=`

 <div class="jogo-grande">

  <div class="equipas">

   <div
    class="equipa"
    onclick="abrirEquipa(
      '${esc(j.home.id)}',
      '${esc(j.home.nome)}',
      '${esc(j.home.logo)}',
      '${esc(j.codigo)}'
    )"
   >

    ${logo(j.home.logo)}

    ${esc(j.home.nome)}

   </div>

   <div>

    <div class="bigscore">
     ${esc(j.home.score)}
     -
     ${esc(j.away.score)}
    </div>

    <div class="estado">
     ${esc(j.estado)}
    </div>

   </div>

   <div
    class="equipa"
    onclick="abrirEquipa(
      '${esc(j.away.id)}',
      '${esc(j.away.nome)}',
      '${esc(j.away.logo)}',
      '${esc(j.codigo)}'
    )"
   >

    ${logo(j.away.logo)}

    ${esc(j.away.nome)}

   </div>

  </div>

 </div>

 <div class="carregando">
  A carregar acontecimentos e estatísticas...
 </div>

 `;

 try{

  const r=await fetch(
   ESPN+
   codigo+
   "/summary?event="+
   encodeURIComponent(id)+
   "&_="+Date.now()
  );

  if(!r.ok)
   throw Error();

  const data=await r.json();

  const loading=
   d.querySelector(".carregando");

  if(loading)loading.remove();

  d.insertAdjacentHTML(
   "beforeend",
   blocoEventos(extrairEventos(data))
  );

  d.insertAdjacentHTML(
   "beforeend",
   blocoStats(extrairStats(data))
  );

 }catch(e){

  const loading=
   d.querySelector(".carregando");

  if(loading)
   loading.outerHTML=`
   <div class="erro">
    Não foi possível carregar os dados.
   </div>
   `;

 }

}

async function abrirEquipa(
 id,
 nomeEquipa,
 logoUrl,
 codigo
){

 if(!id)return;

 const o=criarOverlay("Equipa");

 const d=o.querySelector(".detalhe");

 d.innerHTML=`

 <div class="secao" style="text-align:center">

  ${logo(logoUrl)}

  <h2>${esc(nomeEquipa)}</h2>

  <button
   class="acao"
   onclick="guardarEquipa('${esc(id)}',this)"
  >
   ⭐ Guardar equipa
  </button>

 </div>

 <div class="carregando">
  A carregar jogadores...
 </div>

 `;

 try{

  const r=await fetch(
   ESPN+
   codigo+
   "/teams/"+
   encodeURIComponent(id)+
   "/roster?limit=100&_="+Date.now()
  );

  if(!r.ok)
   throw Error();

  const data=await r.json();

  const jogadores=[];

  function procurar(x){

   if(!x)return;

   if(Array.isArray(x)){

    x.forEach(procurar);
    return;

   }

   if(typeof x!=="object")
   return;

   const a=x.athlete||x;

   if(
    a?.id&&
    (a.displayName||a.fullName)&&
    !jogadores.some(
     p=>String(p.id)===String(a.id)
    )
   ){

    jogadores.push({

     id:a.id,

     nome:
      a.displayName||
      a.fullName,

     numero:
      a.jersey||
      x.jersey||
      "",

     posicao:
      a.position?.displayName||
      a.position?.abbreviation||
      ""

    });

   }

   Object.keys(x).forEach(k=>{

    if(
     k!=="athlete"&&
     k!=="player"
    )
    procurar(x[k]);

   });

  }

  procurar(data);

  const loading=
   d.querySelector(".carregando");

  if(loading)loading.remove();

  if(!jogadores.length){

   d.insertAdjacentHTML(
    "beforeend",
    `<div class="vazio">
     Plantel não disponível.
    </div>`
   );

   return;

  }

  d.insertAdjacentHTML(
   "beforeend",

   `

   <div class="secao">

    <h3>👤 Jogadores</h3>

    <div class="lista">

    ${
     jogadores.map(p=>`

     <button
      class="jogador"
      onclick="abrirJogador('${esc(p.id)}')"
     >

      <b>
       ${p.numero?"#"+esc(p.numero):"Jogador"}
      </b>

      ${esc(p.nome)}

      ${
       p.posicao
       ?
       `<small style="display:block;color:#9ca9bb;margin-top:4px">
        ${esc(p.posicao)}
       </small>`
       :""
      }

     </button>

     `).join("")
    }

    </div>

   </div>

   `

  );

 }catch(e){

  const loading=
   d.querySelector(".carregando");

  if(loading)
   loading.outerHTML=`
   <div class="erro">
    Não foi possível carregar o plantel.
   </div>
   `;

 }

}

function guardarEquipa(id,botao){

 id=String(id);

 const i=
 favoritosEquipas.indexOf(id);

 if(i>=0){

  favoritosEquipas.splice(i,1);

  botao.innerText="⭐ Guardar equipa";

 }else{

  favoritosEquipas.push(id);

  botao.innerText="✓ Equipa guardada";

 }

 save();

}

async function pedirNotificacoes(){

 if(!("Notification" in window)){

  alert(
   "Este navegador não suporta notificações."
  );

  return;

 }

 if(Notification.permission==="granted"){

  alert(
   "As notificações já estão ativas."
  );

  return;

 }

 try{

  const permissao=
   await Notification.requestPermission();

  if(permissao==="granted"){

   new Notification(
    "FUTZONE",
    {
     body:"🔔 Notificações ativadas!"
    }
   );

  }else{

   alert(
    "As notificações ficaram desativadas. "+
    "Podes ativá-las nas definições do navegador."
   );

  }

 }catch(e){

  alert(
   "Não foi possível ativar as notificações."
  );

 }

}
