<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const ESPN=
 "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const ESPN2=
 "https://site.api.espn.com/apis/v2/sports/soccer/";

const ligas=[

 {
  name:"Portugal",
  code:"por.1",
  icon:"🇵🇹"
 },

 {
  name:"Inglaterra",
  code:"eng.1",
  icon:"🏴"
 },

 {
  name:"Espanha",
  code:"esp.1",

 },

 {
  name:"Itália",
  code:"ita.1",
  icon:"🇮🇹"
 },

 {
  name:"Alemanha",
  code:"ger.1",
  icon:"🇩🇪"
 },

 {
  name:"França",
  code:"fra.1",
  icon:"🇫🇷"
 },

 {
  name:"Países Baixos",
  code:"ned.1",
  icon:"🇳🇱"
 },

 {
  name:"Bélgica",
  code:"bel.1",
  icon:"🇧🇪"
 },

 {
  name:"Champions",
  code:"uefa.champions",
  icon:"🏆"
 },

 {
  name:"Liga Europa",
  code:"uefa.europa",
  icon:"🏆"
 },

 {
  name:"Conference",
  code:"uefa.europa.conf",
  icon:"🏆"
 }

];

let ligaAtual=ligas[0];

let jogosAtuais=[];

let modoJogos="todos";

let paginaJogos="ligas";

let paginaTabelas="ligas";

let clubeAtual=null;

const app=
 document.getElementById("app");


/* =====================================================
   SEGURANÇA
===================================================== */

const esc=v=>
 String(v??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );


/* =====================================================
   LOGO
===================================================== */

function logo(u){

 return u
 ?
 `<img
   class="escudo"
   src="${esc(u)}"
   onerror="this.style.visibility='hidden'"
  >`
 :
 `<div style="height:30px"></div>`;

}


/* =====================================================
   MODO FUTEBOL / FUTSAL
===================================================== */

let desportoAtual="futebol";

function mudarDesporto(tipo){

 desportoAtual=tipo;

 document
  .getElementById("btnFutebol")
  ?.classList
  .toggle(
   "ativo",
   tipo==="futebol"
  );

 document
  .getElementById("btnFutsal")
  ?.classList
  .toggle(
   "ativo",
   tipo==="futsal"
  );

 if(tipo==="futsal"){

  mostrarFutsal();

 }else{

  mostrarJogos();

 }

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function nav(id){

 [
  "navJogos",
  "navTabelas",
  "navFav"
 ].forEach(x=>{

  document
   .getElementById(x)
   ?.classList
   .toggle(
    "active",
    x===id
   );

 });

}


/* =====================================================
   DATA
===================================================== */

function data8(d){

 return d.getFullYear()+
 String(
  d.getMonth()+1
 ).padStart(2,"0")+
 String(
  d.getDate()
 ).padStart(2,"0");

}


/* =====================================================
   ESTADO DO JOGO
===================================================== */

function estado(ev){

 const s=
  ev?.status||
  ev?.competitions?.[0]?.status||
  {};

 const t=
  s.type||
  {};

 if(t.state==="in"){

  return{

   txt:
    t.shortDetail||
    t.detail||
    t.displayClock||
    "DIRETO",

   live:true,

   final:false

  };

 }

 if(t.state==="post"){

  return{

   txt:
    t.shortDetail||
    t.detail||
    "FINAL",

   live:false,

   final:true

  };

 }

 return{

  txt:
   t.shortDetail||
   t.detail||
   t.name||
   "",

  live:false,

  final:false

 };

}

/* =====================================================
   JORNADAS
===================================================== */

function extrairJornada(ev){

 const candidatos=[

  ev?.week?.number,
  ev?.week?.displayValue,
  ev?.week?.text,

  ev?.round?.number,
  ev?.round?.displayValue,
  ev?.round?.text,

  ev?.competition?.round?.number,
  ev?.competition?.round?.displayValue,
  ev?.competition?.round?.text,

  ev?.competitions?.[0]?.week?.number,
  ev?.competitions?.[0]?.week?.displayValue,
  ev?.competitions?.[0]?.week?.text,

  ev?.competitions?.[0]?.round?.number,
  ev?.competitions?.[0]?.round?.displayValue,
  ev?.competitions?.[0]?.round?.text,

  ev?.season?.week?.number

 ];

 const v=candidatos.find(
  x=>
   x!==undefined&&
   x!==null&&
   String(x).trim()!==""
 );

 return v===undefined
  ?""
  :String(v).trim();

}


function nomeJornada(v){

 const s=
  String(v||"").trim();

 if(!s)
  return "Jornada não indicada";

 if(/^jornada/i.test(s))
  return s;

 return /^\d+$/.test(s)
  ?`Jornada ${s}`
  :s;

}


function numeroJornada(v){

 const m=
  String(v||"").match(/\d+/);

 return m
  ?Number(m[0])
  :999999;

}


function agruparJornadas(lista){

 const mapa=
  new Map();

 lista.forEach(j=>{

  const key=
   j.jornada
   ?String(j.jornada)
   :"sem";

  if(!mapa.has(key))
   mapa.set(key,[]);

  mapa.get(key).push(j);

 });

 return[
  ...mapa.entries()
 ].sort(
  (a,b)=>{

   const na=
    numeroJornada(a[0]);

   const nb=
    numeroJornada(b[0]);

   if(na!==nb)
    return na-nb;

   const da=
    a[1][0]?.date||"";

   const db=
    b[1][0]?.date||"";

   return new Date(da)-new Date(db);

  }
 );

}
/* =====================================================
   NORMALIZAR JOGO
===================================================== */

function normalizar(ev,l){

 const c=
  ev.competitions?.[0]||
  {};

 const cs=
  c.competitors||
  [];

 const h=
  cs.find(
   x=>x.homeAway==="home"
  )||
  cs[0]||
  {};

 const a=
  cs.find(
   x=>x.homeAway==="away"
  )||
  cs[1]||
  {};

 const s=
  estado(ev);

 return{

  id:String(ev.id),

  date:ev.date||"",

  jornada:extrairJornada(ev),

  status:
   ev.status||
   c.status||
   {},

  home:{

   nome:
    h.team?.displayName||
    h.team?.shortDisplayName||
    "Casa",

   logo:
    h.team?.logo||
    h.team?.logos?.[0]?.href||
    "",

   score:
    h.score??"-",

   id:
    h.team?.id||
    ""

  },

  away:{

   nome:
    a.team?.displayName||

/* =====================================================
   BUSCAR EVENTOS
===================================================== */

async function buscarEventos(l){

 const hoje=
  new Date();

 const ini=
  new Date(hoje);

 const fim=
  new Date(hoje);

 ini.setDate(
  ini.getDate()-120
 );

 fim.setDate(
  fim.getDate()+120
 );

 const urls=[

  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=500&dates=${data8(ini)}-${data8(fim)}&_=${Date.now()}`,

  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&dates=${data8(hoje)}&_=${Date.now()}`,

  `${ESPN}${encodeURIComponent(l.code)}/scoreboard?limit=100&_=${Date.now()}`

 ];

 for(
  const u of urls
 ){

  try{

   const r=
    await fetch(u);

   if(!r.ok)
    continue;

   const d=
    await r.json();

   if(
    Array.isArray(d.events)&&
    d.events.length
   ){

    return d.events;

   }

  }catch(e){}

 }

 return[];

}

/* =====================================================
   NORMALIZAR TABELA
===================================================== */

function normalizarTabela(d){

 const entries=[];

 function recolher(obj){

  if(
   !obj||
   typeof obj!=="object"
  )
   return;

  if(
   Array.isArray(obj.entries)
  ){

   obj.entries.forEach(e=>{

    if(
     e&&
     typeof e==="object"
    ){

     entries.push(e);

    }

   });

  }

  if(
   Array.isArray(obj.children)
  ){

   obj.children.forEach(
    recolher
   );

  }

  if(obj.standings){

   if(
    Array.isArray(obj.standings)
   ){

    obj.standings.forEach(
     recolher
    );

   }else{

    recolher(
     obj.standings
    );

   }

  }

 }

 recolher(d);

 if(
  !entries.length&&
  Array.isArray(d?.entries)
 ){

  entries.push(
   ...d.entries
  );

 }

 const mapa=
  new Map();

 entries.forEach(e=>{

  const id=
   e?.team?.id||
   e?.teamId||
   e?.id||
   "";

  const chave=
   id||
   JSON.stringify(e);

  if(
   !mapa.has(chave)
  ){

   mapa.set(
    chave,
    e
   );

  }

 });

 return[
  ...mapa.values()
 ];

}


/* =====================================================
   ESTATÍSTICAS DA TABELA
===================================================== */

function numeroStat(
 entry,
 nomes
){

 const stats=
  Array.isArray(entry?.stats)
  ?entry.stats
  :[];

 for(
  const s of stats
 ){

  const nomesStat=[

   s?.name,
   s?.shortName,
   s?.abbreviation,
   s?.displayName,
   s?.label

  ]
  .filter(Boolean)
  .map(
   x=>
    String(x)
     .toLowerCase()
     .replace(
      /[^a-z0-9]/g,
      ""
     )
  );

  const corresponde=
   nomes.some(
    nome=>{

     const n=
      String(nome)
       .toLowerCase()
       .replace(
        /[^a-z0-9]/g,
        ""
       );

     return nomesStat.includes(n);

    }
   );

  if(!corresponde)
   continue;

  let valor=
   s?.value??
   s?.displayValue??
   s?.display??
   0;

  if(
   typeof valor==="string"
  ){

   valor=
    valor
     .replace(",",".")
     .replace(
      /[^\d.-]/g,
      ""
     );

  }

  const n=
   parseFloat(valor);

  if(
   Number.isFinite(n)
  ){

   return n;

  }

 }

 return 0;

}

===================================================== */

function txt(v){

 return typeof v==="object"
 ?
 (
  v?.displayValue??
  v?.value??
  v?.text??
  ""
 )
 :
 String(v??"");

}


/* =====================================================
   EVENTOS
===================================================== */

function extrairEventos(d){

 let out=[];

 let seen=
  new Set();

 let arr=[

  ...(d.plays||[]),

  ...(d.keyEvents||[]),

  ...(d.scoringPlays||[])

 ];

 for(
  const e of arr
 ){

  const raw=(

   (e?.type?.text||"")+
   " "+
   (
    e?.text||
    e?.shortText||
    e?.description||
    ""
   )

  ).toLowerCase();

  if(
   !/goal|gol|yellow|amarelo|red|vermelho|substitut/.test(raw)
  ){

   continue;

  }

  const k=
   String(e?.id||"")+
   raw+
   (
    e?.clock?.displayValue||
    ""
   );

  if(
   seen.has(k)
  )
   continue;

  seen.add(k);

  const ic=
   /yellow|amarelo/.test(raw)
   ?"🟨"
   :/red|vermelho/.test(raw)
   ?"🟥"
   :/substitut/.test(raw)
   ?"🔄"
   :"⚽";

  out.push({

   m:
    e?.clock?.displayValue||
    "",

   t:
    e?.text||
    e?.shortText||
    e?.description||
    e?.type?.text||
    "Evento",

   i:ic

  });

 }

 return out;

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

function extrairStats(d){

 const gs=[];

 function add(
  team,
  stats
 ){

  if(
   !team||
   !Array.isArray(stats)
  )
   return;

  const id=
   team.id||
   team.team?.id||
   team.displayName||
   team.team?.displayName;

  let g=
   gs.find(
    x=>String(x.id)===String(id)
   );

  if(!g){

   g={

    id,

    nome:
     team.displayName||
     team.name||
     team.team?.displayName||
     "Equipa",

    s:[]

   };

   gs.push(g);

  }

  stats.forEach(x=>{

   const n=
    x.displayName||
    x.shortDisplayName||
    x.name||
    x.label||
    x.description;

   if(n){

    g.s.push({

     n,

     v:
      txt(
       x.displayValue??
       x.value??
       x.display
      )

    });

   }

  });

 }

 (
  d.boxscore?.teams||
  []
 ).forEach(
  x=>
   add(
    x.team||x,
    x.statistics||
    x.stats
   )
 );

 (
  d.header?.competitions?.[0]?.competitors||
  []
 ).forEach(
  x=>
   add(
    x.team||x,
    x.statistics
   )
 );

 (
  d.competitions?.[0]?.competitors||
  []
 ).forEach(
  x=>
   add(
    x.team||x,
    x.statistics
   )
 );

 if(gs.length<2)
  return[];

 const m=
  new Map();

 gs.slice(0,2)
  .forEach(
   (g,i)=>{

    g.s.forEach(x=>{

     const k=
      x.n.toLowerCase();

     if(!m.has(k)){

      m.set(
       k,
       {
        n:x.n,
        h:"-",
        a:"-"
       }
      );

     }

     if(i===0){

      m.get(k).h=
       x.v;

     }else{

      m.get(k).a=
       x.v;

     }

    });

   }
  );

 return[
  ...m.values()
 ];

}


/* =====================================================
   PLANTEL DO JOGO
===================================================== */

function extrairPlantel(d){

 const gs=[];

 function add(
  team,
  arr
 ){

  if(
   !team||
   !Array.isArray(arr)
  )
   return;

  const id=
   team.id||
   team.team?.id||
   team.displayName||
   team.team?.displayName;

  let g=
   gs.find(
    x=>String(x.id)===String(id)
   );

  if(!g){

   g={

    id,

    nome:
     team.displayName||
     team.name||
     team.team?.displayName||
     "Equipa",

    p:[]

   };

   gs.push(g);

  }

  arr.forEach(x=>{

   const a=
    x?.athlete||
    x?.player||
    x;

   if(
    !a?.displayName&&
    !a?.fullName
   )
    return;

   const n=
    a.displayName||
    a.fullName;

   if(
    !g.p.some(
     p=>p.n===n
    )
   ){

    g.p.push({

     n,

     num:
      a.jersey||
      x.jersey||
      "",

     pos:
      a.position?.abbreviation||
      a.position?.displayName||
      "",

     tit:
      x.starter===true,

     rating:
      x.rating||
      a.rating||
      null

    });

   }

  });

 }

 (
  d.rosters||
  []
 ).forEach(
  r=>
   add(
    r.team||r,
    r.roster||
    r.athletes||
    r.players
   )
 );

 (
  d.boxscore?.players||
  []
 ).forEach(
  r=>
   add(
    r.team||r,
    r.statistics||
    r.athletes||
    r.roster||
    r.players
   )
 );

 return gs.filter(
  x=>x.p.length
 );

}

}


/* =====================================================
   CAMPO — JOGADOR
===================================================== */

function ratingFutzone(p){

 const r =
  p.rating ??
  p.nota ??
  p.score ??
  null;

 if(
  r===null||
  r===""
 )
  return "—";

 const n=
  Number(r);

 return Number.isFinite(n)
  ?n.toFixed(1)
  :"—";

}

/* =====================================================
   CAMPO FUTZONE
   RECEBE O PLANTEL DO JOGO
===================================================== */

function campoFutzoneJogo(
 gs,
 jogo
){

 if(
  !Array.isArray(gs)||
  gs.length<1
 )
  return "";

 const casaId=
  String(
   jogo?.home?.id||
   ""
  );

 const foraId=
  String(
   jogo?.away?.id||
   ""
  );

 let casa=
  gs.find(
   g=>
    String(g.id)===casaId
  );

 let fora=
  gs.find(
   g=>
    String(g.id)===foraId
  );

 /*
  Se a API não devolver os IDs
  exatamente iguais, usamos a ordem
  das duas equipas recebidas.
 */

 if(!casa)
  casa=gs[0];

 if(!fora)
  fora=
   gs.find(
    g=>g!==casa
   )||
   gs[1];

 if(!casa||!fora)
  return "";

 /*
  Primeiro tentamos usar apenas
  os jogadores marcados como titulares.
  Se a API não indicar titulares,
  usamos os primeiros 11.
 */

 function titulares(g){

  if(!g?.p?.length)
   return [];

  const t=
   g.p.filter(
    p=>p.tit===true
   );

  if(t.length>=7)
   return t.slice(0,11);

  return g.p.slice(0,11);

 }

 const jogadoresCasa=
  titulares(casa);

 const jogadoresFora=
  titulares(fora);

 if(
  !jogadoresCasa.length||
  !jogadoresFora.length
 )
  return "";

 function jogador(p,lado){

  const nome=
   p.n||
   p.nome||
   "Jogador";

  const num=
   p.num||
   "";

  const nota=
   ratingFutzone(p);

  return `

   <button
    class="campo-jogador campo-${lado}"
    onclick="detalheJogadorFutzone(this)"
    data-nome="${esc(nome)}"
    data-num="${esc(num)}"
    data-pos="${esc(p.pos||"")}"
    data-rating="${esc(nota)}">

    <span class="campo-num">
     ${esc(num)}
    </span>

    <span class="campo-nome">
     ${esc(nome)}
    </span>

    <span class="campo-nota">
     ⭐ ${esc(nota)}
    </span>

   </button>

  `;

 }

 /*
  Organização visual:
  Guarda-redes
  Defesa
  Meio-campo
  Ataque
 */

 function linhas(jogadores){

  const n=
   jogadores.length;

  if(n>=11){

   return [

    jogadores.slice(0,1),

    jogadores.slice(1,5),

    jogadores.slice(5,9),

    jogadores.slice(9,11)

   ];

  }

  if(n>=8){

   return [

    jogadores.slice(0,1),

    jogadores.slice(1,4),

    jogadores.slice(4,6),

    jogadores.slice(6,8)

   ];

  }

  if(n>=5){

   return [

    jogadores.slice(0,1),

    jogadores.slice(1,3),

    jogadores.slice(3,4),

    jogadores.slice(4,5)

   ];

  }

  return[
   jogadores
  ];

 }

 const linhasCasa=
  linhas(jogadoresCasa);

 const linhasFora=
  linhas(jogadoresFora);

 return `

  <div class="secao">

   <h3>
    ⚽ Titulares — Casa vs Fora
   </h3>

   <div class="campo-futzone">

    <div class="campo-area top"></div>

    <div class="campo-area bottom"></div>

    <div class="campo-meio"></div>

    <div class="campo-ponto"></div>

    <div class="campo-titulo">
     ${esc(casa.nome||jogo.home.nome)}
    </div>

    <div class="campo-equipa">

     ${linhasCasa.map(
      linha=>`

       <div class="campo-linha">

        ${linha.map(
         p=>
          jogador(
           p,
           "casa"
          )
        ).join("")}

       </div>

      `
     ).join("")}

    </div>

    <div class="campo-separador"></div>

    <div class="campo-equipa">

     ${linhasFora
      .slice()
      .reverse()
      .map(
       linha=>`

        <div class="campo-linha">

         ${linha.map(
          p=>
           jogador(
            p,
            "fora"
           )
         ).join("")}

        </div>

       `
      ).join("")}

    </div>

    <div class="campo-titulo campo-titulo-fora">

     ${esc(fora.nome||jogo.away.nome)}

    </div>

   </div>

   <div class="subtitulo">

    👆 Toca num jogador para ver
    os dados disponíveis.

   </div>

  </div>

 `;

}


/* =====================================================
   COMPATIBILIDADE
===================================================== */

function campoFutzone(
 rosterCasa,
 rosterFora
){

 if(
  !Array.isArray(rosterCasa)||
  !Array.isArray(rosterFora)
 )
  return "";

 if(
  !rosterCasa.length||
  !rosterFora.length
 )
  return "";

 const casa={
  id:"casa",
  nome:"CASA",
  p:rosterCasa.map(
   p=>({
    n:p.n||p.nome,
    num:p.num||"",
    pos:p.pos||"",
    tit:true,
    rating:p.rating||null
   })
  )
 };

 const fora={
  id:"fora",
  nome:"FORA",
  p:rosterFora.map(
   p=>({
    n:p.n||p.nome,
    num:p.num||"",
    pos:p.pos||"",
    tit:true,
    rating:p.rating||null
   })
  )
 };

 return campoFutzoneJogo(
  [casa,fora],
  {
   home:{
    id:"casa",
    nome:"CASA"
   },
   away:{
    id:"fora",
    nome:"FORA"
   }
  }
 );

}

   ABRIR JOGO
===================================================== */

async function abrirJogo(
 id,
 code
){

 const j=
  jogosAtuais.find(
   x=>x.id===id
  );

 if(!j)
  return;

 const o=
  document.createElement(
   "div"
  );

 o.className="overlay";

 o.innerHTML=`

  <div class="detalhe-header">

   <button
    class="voltar"
    onclick="
     this.closest('.overlay').remove()
    ">

    ← Voltar

   </button>

  </div>

  <div class="detalhe">

   <div class="jogo-grande">

    <div class="equipas">

     ${teamHtml(
      j.home,
      code
     )}

     <div>

      <div class="bigscore">

       ${esc(j.home.score)}
       -
       ${esc(j.away.score)}

      </div>

      <div class="estado">

       ${esc(
        j.estado.txt||
        dataLocal(j.date)
       )}

      </div>

     </div>

     ${teamHtml(
      j.away,
      code
     )}

    </div>

   </div>

   <div class="carregando">

    A carregar detalhes...

   </div>

  </div>

 `;

 document.body.appendChild(o);

 try{

  const r=
   await fetch(
    `${ESPN}${encodeURIComponent(code)}/summary?event=${encodeURIComponent(id)}&_=${Date.now()}`
   );

  if(!r.ok)
   throw new Error("Erro no resumo");

  const d=
   await r.json();

  const detalhe=
   o.querySelector(
    ".detalhe"
   );

  const plantelJogo=
   extrairPlantel(d);

  const campo=
   campoFutzoneJogo(
    plantelJogo,
    j
   );

  detalhe.insertAdjacentHTML(

   "beforeend",

   blocoEventos(
    extrairEventos(d)
   )+

   blocoStats(
    extrairStats(d)
   )+

   campo+

   blocoPlantel(
    plantelJogo
   )

  );

  o.querySelector(
   ".carregando"
  )?.remove();

 }catch(e){

  console.log(
   "Erro jogo:",
   e
  );

  const loading=
   o.querySelector(
    ".carregando"
   );

  if(loading){

   loading.outerHTML=`

    <div class="erro">

     Não foi possível carregar
     os detalhes deste jogo.

    </div>

   `;

  }

 }

}


/* =====================================================

===================================================== */

async function carregarNoticias(){

 const box=
  document.getElementById(
   "listaNoticias"
  );

 if(!box)
  return;

 const feeds=[

  "https://news.google.com/rss/search?q=futebol%20Portugal&hl=pt-PT&gl=PT&ceid=PT:pt",

  "https://news.google.com/rss/search?q=futebol%20internacional&hl=pt-PT&gl=PT&ceid=PT:pt"

 ];

 try{

  let noticias=[];

  for(
   const feed of feeds
  ){

   try{

    const url=
     "https://api.rss2json.com/v1/api.json?rss_url="+
     encodeURIComponent(feed);

    const r=
     await fetch(
      url,
      {
       method:"GET",
       cache:"no-store"
      }
     );

    if(!r.ok)
     continue;

    const data=
     await r.json();

    if(
     data.status==="ok"&&
     Array.isArray(data.items)
    ){

     noticias.push(
      ...data.items
     );

    }

   }catch(e){

    console.log(
     "Erro feed:",
     e
    );

   }

  }

  const mapa=
   new Map();

  noticias.forEach(
   n=>{

    const chave=
     String(
      n.title||
      ""
     ).trim();

    if(
     chave&&
     !mapa.has(chave)
    ){

     mapa.set(
      chave,
      n
     );

    }

   }
  );

  noticias=
   [...mapa.values()]
    .slice(0,10);

  if(!noticias.length)
   throw new Error(
    "Sem notícias"
   );

  box.outerHTML=`

   <div id="listaNoticias">

    ${noticias.map(
     n=>{

      const titulo=
       n.title||
       "Notícia desportiva";

      const link=
       n.link||
       "#";

      const fonte=
       n.author||
       n.feedTitle||
       "Notícias desportivas";

      let dataPT="";

      if(n.pubDate){

       try{

        dataPT=
         new Intl.DateTimeFormat(
          "pt-PT",
          {
           day:"2-digit",
           month:"2-digit",
           hour:"2-digit",
           minute:"2-digit"
          }
         ).format(
          new Date(n.pubDate)
         );

       }catch(e){}

      }

      return `

       <a
        class="noticia"
        href="${esc(link)}"
        target="_blank"
        rel="noopener noreferrer">

        <div class="noticia-titulo">

         📰 ${esc(titulo)}

        </div>

        ${
         dataPT
         ?`
          <div class="noticia-info">
           ${esc(dataPT)}
          </div>
         `
         :""
        }

        <div class="noticia-fonte">

         ${esc(fonte)}

        </div>

       </a>

      `;

     }
    ).join("")}

   </div>

  `;

 }catch(e){

  console.log(
   "Erro notícias:",
   e
  );

  box.outerHTML=`

   <div
    id="listaNoticias"
    class="vazio">

    Não foi possível carregar
    as notícias neste momento.

   </div>

  `;

 }

}
