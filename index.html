<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTZONE">
<meta name="description" content="FUTZONE — Futebol em direto">
<title>FUTZONE — Futebol em Direto</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#03060B;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}

body{padding-bottom:82px}
button{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}

.app{
 width:100%;
 max-width:760px;
 margin:0 auto;
 min-height:100vh;
}

.header{
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(3,6,11,.96);
 backdrop-filter:blur(12px);
 border-bottom:1px solid #172331;
 padding:14px 14px 10px;
}

.headerTop{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.logo{
 font-size:29px;
 line-height:1;
 font-weight:900;
 letter-spacing:-1px;
 color:#fff;
}

.logo span{color:#1683FF}

.subtitle{
 margin-top:4px;
 font-size:10px;
 letter-spacing:1.8px;
 font-weight:800;
 color:#9DAABB;
}

.sportSwitch{
 display:flex;
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:13px;
 padding:3px;
}

.sportSwitch button{
 border:0;
 border-radius:9px;
 background:transparent;
 color:#9DAABB;
 padding:8px 10px;
 font-weight:800;
 font-size:12px;
}

.sportSwitch button.active{
 background:#0057B8;
 color:#fff;
}

.liveGlobal{
 margin:12px 12px 0;
 width:calc(100% - 24px);
 border:1px solid #FF4054;
 background:linear-gradient(135deg,#42121B,#17090D);
 color:#fff;
 border-radius:14px;
 min-height:48px;
 font-weight:900;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
}

.liveDot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:#FF4054;
 box-shadow:0 0 12px #FF4054;
 animation:pulse 1.3s infinite;
}

@keyframes pulse{
 0%,100%{opacity:1;transform:scale(1)}
 50%{opacity:.45;transform:scale(.75)}
}

.content{padding:12px}

.sectionTitle{
 font-size:17px;
 font-weight:900;
 margin:10px 2px;
}

.leagues{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:2px 1px 8px;
 scrollbar-width:none;
}

.leagues::-webkit-scrollbar{display:none}

.leagueChip{
 flex:0 0 auto;
 border:1px solid #1B2A3B;
 background:#09111C;
 color:#AEBACA;
 padding:9px 12px;
 border-radius:999px;
 font-size:12px;
 font-weight:800;
}

.leagueChip.active{
 background:#0057B8;
 border-color:#1683FF;
 color:#fff;
}

.filters{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:3px 1px 10px;
 scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filterBtn{
 flex:0 0 auto;
 border:1px solid #1B2A3B;
 background:#0D1724;
 color:#AEBACA;
 padding:8px 12px;
 border-radius:10px;
 font-size:12px;
 font-weight:800;
}

.filterBtn.active{
 color:#fff;
 background:#003B7A;
 border-color:#1683FF;
}

.searchBox{
 position:relative;
 margin:4px 0 12px;
}

.searchBox input{
 width:100%;
 border:1px solid #1B2A3B;
 background:#09111C;
 color:#fff;
 border-radius:13px;
 padding:12px 13px 12px 39px;
 outline:none;
}

.searchBox input:focus{border-color:#1683FF}

.searchIcon{
 position:absolute;
 left:13px;
 top:10px;
 color:#728197;
}

.games{
 display:flex;
 flex-direction:column;
 gap:9px;
}

.gameCard{
 background:linear-gradient(145deg,#0D1724,#09111C);
 border:1px solid #172638;
 border-radius:16px;
 padding:11px;
 cursor:pointer;
 transition:.15s;
}

.gameCard:active{transform:scale(.985)}

.gameTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 margin-bottom:5px;
}

.gameLeague{
 color:#8EA0B6;
 font-size:10px;
 font-weight:800;
 text-transform:uppercase;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.favoriteBtn{
 border:0;
 background:transparent;
 color:#66768B;
 font-size:21px;
 line-height:1;
 padding:3px;
}

.favoriteBtn.active{color:#FFD43B}

.gameStatus{
 text-align:center;
 margin:3px 0 8px;
}

.liveBadge{
 display:inline-block;
 color:#fff;
 background:#9C1E2F;
 padding:4px 8px;
 border-radius:7px;
 font-size:10px;
 font-weight:900;
}

.matchTime,
.statusBadge{
 display:inline-block;
 color:#AEBACA;
 background:#182536;
 padding:4px 8px;
 border-radius:7px;
 font-size:10px;
 font-weight:900;
}

.teams{
 display:grid;
 grid-template-columns:1fr 60px 1fr;
 align-items:center;
 gap:8px;
}

.team{
 display:flex;
 flex-direction:column;
 align-items:center;
 text-align:center;
 min-width:0;
 cursor:pointer;
}

.team img{
 width:40px;
 height:40px;
 object-fit:contain;
 margin-bottom:5px;
}

.team strong{
 font-size:12px;
 font-weight:800;
 line-height:1.15;
 max-width:110px;
}

.team b{
 font-size:18px;
 margin-top:4px;
}

.vs{
 text-align:center;
 color:#6F8096;
 font-size:11px;
 font-weight:900;
}

.liveLine{
 margin-top:8px;
 text-align:center;
 color:#FF6878;
 font-size:10px;
 font-weight:900;
}

.empty{
 text-align:center;
 padding:35px 15px;
 border:1px dashed #25364A;
 border-radius:15px;
 color:#8392A7;
 background:#08101A;
}

.empty strong{
 display:block;
 color:#fff;
 margin-bottom:7px;
}

.loading{
 text-align:center;
 padding:30px;
 color:#8796AA;
}

.errorBox{
 padding:15px;
 border-radius:14px;
 border:1px solid #54212A;
 background:#180B0E;
 color:#FF9BA6;
 font-size:13px;
 line-height:1.45;
}

.spinner{
 width:22px;
 height:22px;
 margin:0 auto 10px;
 border:3px solid #24364A;
 border-top-color:#1683FF;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.bottomNav{
 position:fixed;
 z-index:60;
 left:50%;
 bottom:0;
 transform:translateX(-50%);
 width:100%;
 max-width:760px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 background:rgba(5,10,16,.97);
 border-top:1px solid #1A2838;
 padding:8px 8px calc(8px + env(safe-area-inset-bottom));
 backdrop-filter:blur(15px);
}

.navBtn{
 border:0;
 background:transparent;
 color:#718198;
 padding:7px 3px;
 font-size:11px;
 font-weight:800;
 border-radius:11px;
}

.navIcon{
 display:block;
 font-size:19px;
 margin-bottom:3px;
}

.navBtn.active{
 color:#fff;
 background:#003B7A;
}

.view{display:none}
.view.active{display:block}

/* TABELAS */

.tableWrap{
 overflow-x:auto;
 border:1px solid #172638;
 border-radius:15px;
 background:#09111C;
}

.standings{
 width:100%;
 border-collapse:collapse;
 min-width:470px;
}

.standings th{
 color:#708097;
 font-size:10px;
 text-transform:uppercase;
 padding:10px 6px;
 text-align:center;
 border-bottom:1px solid #1A293A;
}

.standings th:nth-child(2){text-align:left}

.standings td{
 padding:9px 6px;
 text-align:center;
 font-size:12px;
 font-weight:700;
 border-bottom:1px solid #111F2E;
}

.standings td:nth-child(2){text-align:left}

.position{
 width:28px;
 color:#8291A6;
}

.clubCell{
 display:flex;
 align-items:center;
 gap:8px;
 min-width:170px;
 cursor:pointer;
}

.clubCell img{
 width:25px;
 height:25px;
 object-fit:contain;
}

.clubCell strong{font-size:12px}
.pts{color:#fff;font-size:13px!important}

.zoneChampions{border-left:3px solid #1683FF}
.zoneEuropa{border-left:3px solid #FFD43B}
.zoneDown{border-left:3px solid #FF4054}

/* DETALHE */

.detailOverlay{
 position:fixed;
 z-index:100;
 inset:0;
 background:#03060B;
 overflow-y:auto;
 display:none;
}

.detailOverlay.open{display:block}

.detailHeader{
 position:sticky;
 top:0;
 z-index:5;
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
 background:rgba(3,6,11,.96);
 border-bottom:1px solid #172638;
}

.backBtn{
 border:0;
 background:#0D1724;
 color:#fff;
 width:40px;
 height:40px;
 border-radius:12px;
 font-size:20px;
}

.detailTitle{
 font-weight:900;
 font-size:15px;
}

.detailBody{
 padding:13px;
 max-width:760px;
 margin:auto;
}

.detailScore{
 display:grid;
 grid-template-columns:1fr 100px 1fr;
 align-items:center;
 gap:8px;
 background:linear-gradient(145deg,#0D1724,#09111C);
 border:1px solid #172638;
 border-radius:18px;
 padding:18px 10px;
}

.detailTeam{
 text-align:center;
 cursor:pointer;
}

.detailTeam img{
 width:55px;
 height:55px;
 object-fit:contain;
}

.detailTeam strong{
 display:block;
 margin-top:7px;
 font-size:13px;
}

.detailMainScore{text-align:center}

.bigScore{
 font-size:26px;
 font-weight:900;
 white-space:nowrap;
}

.detailDate{
 color:#7C8BA0;
 font-size:10px;
 margin-top:6px;
}

.detailTabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 margin:12px 0;
}

.detailTabs button{
 flex:0 0 auto;
 border:1px solid #1B2A3B;
 background:#09111C;
 color:#8392A6;
 border-radius:10px;
 padding:9px 12px;
 font-size:11px;
 font-weight:900;
}

.detailTabs button.active{
 background:#0057B8;
 color:#fff;
 border-color:#1683FF;
}

.detailSection{
 background:#09111C;
 border:1px solid #172638;
 border-radius:15px;
 margin-bottom:10px;
 overflow:hidden;
}

.detailSectionTitle{
 padding:12px;
 font-size:13px;
 font-weight:900;
 border-bottom:1px solid #172638;
}

.eventRow{
 display:grid;
 grid-template-columns:42px 1fr 42px;
 gap:8px;
 align-items:center;
 padding:10px 12px;
 border-bottom:1px solid #101D2A;
 font-size:12px;
}

.eventMinute{
 color:#8290A3;
 font-weight:900;
}

.eventCenter{
 text-align:center;
 font-weight:800;
}

.eventIcon{
 text-align:center;
 font-size:18px;
}

.statRow{
 display:grid;
 grid-template-columns:70px 1fr 70px;
 gap:7px;
 align-items:center;
 padding:9px 12px;
}

.statVal{
 font-weight:900;
 font-size:12px;
 text-align:center;
}

.statLabel{
 text-align:center;
 color:#8997A9;
 font-size:10px;
 font-weight:800;
}

.statBar{
 height:5px;
 background:#1A2939;
 border-radius:999px;
 overflow:hidden;
}

.statBar i{
 display:block;
 height:100%;
 background:#1683FF;
 border-radius:999px;
}

/* CAMPO */

.pitch{
 position:relative;
 margin:12px auto;
 width:min(100%,430px);
 aspect-ratio:.68;
 border:2px solid rgba(255,255,255,.65);
 border-radius:8px;
 overflow:hidden;
 background:
 linear-gradient(
  90deg,
  rgba(255,255,255,.025) 0 14%,
  transparent 14% 28%,
  rgba(255,255,255,.025) 28% 42%,
  transparent 42% 56%,
  rgba(255,255,255,.025) 56% 70%,
  transparent 70% 84%,
  rgba(255,255,255,.025) 84% 100%
 ),
 #146B42;
}

.pitch:before{
 content:"";
 position:absolute;
 left:50%;
 top:50%;
 width:29%;
 aspect-ratio:1;
 transform:translate(-50%,-50%);
 border:2px solid rgba(255,255,255,.65);
 border-radius:50%;
}

.pitch:after{
 content:"";
 position:absolute;
 left:0;
 top:50%;
 width:100%;
 border-top:2px solid rgba(255,255,255,.65);
}

.penalty{
 position:absolute;
 left:50%;
 width:48%;
 height:15%;
 transform:translateX(-50%);
 border:2px solid rgba(255,255,255,.65);
}

.penalty.top{
 top:-1px;
 border-top:0;
}

.penalty.bottom{
 bottom:-1px;
 border-bottom:0;
}

.goalArea{
 position:absolute;
 left:50%;
 width:22%;
 height:6%;
 transform:translateX(-50%);
 border:2px solid rgba(255,255,255,.65);
}

.goalArea.top{
 top:-1px;
 border-top:0;
}

.goalArea.bottom{
 bottom:-1px;
 border-bottom:0;
}

.playerDot{
 position:absolute;
 transform:translate(-50%,-50%);
 width:45px;
 height:45px;
 border-radius:50%;
 background:#0057B8;
 border:2px solid #fff;
 box-shadow:0 2px 7px rgba(0,0,0,.4);
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 z-index:2;
 cursor:pointer;
}

.playerDot span{
 font-size:14px;
 font-weight:900;
}

.playerDot small{
 display:block;
 position:absolute;
 top:42px;
 width:95px;
 color:#fff;
 text-shadow:0 1px 3px #000;
 text-align:center;
 font-size:8px;
 font-weight:900;
 white-space:nowrap;
}

.pitchLegend{
 text-align:center;
 color:#8291A5;
 font-size:10px;
 margin-bottom:12px;
}

/* EQUIPA */

.teamHero{
 display:flex;
 align-items:center;
 gap:13px;
 background:#09111C;
 border:1px solid #172638;
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
}

.teamHero img{
 width:62px;
 height:62px;
 object-fit:contain;
}

.teamHero h2{
 margin:0 0 4px;
 font-size:19px;
}

.teamHero p{
 margin:0;
 color:#8190A4;
 font-size:11px;
}

.favTeamBtn{
 margin-left:auto;
 border:1px solid #1B2A3B;
 background:#0D1724;
 color:#FFD43B;
 border-radius:10px;
 padding:8px;
 font-size:10px;
 font-weight:900;
}

/* FAVORITOS */

.favoriteTeam{
 display:flex;
 align-items:center;
 gap:12px;
 background:#09111C;
 border:1px solid #172638;
 border-radius:14px;
 padding:12px;
 margin-bottom:8px;
 cursor:pointer;
}

.favoriteTeam img{
 width:42px;
 height:42px;
 object-fit:contain;
}

.favoriteTeam strong{
 display:block;
 font-size:12px;
}

.favoriteTeam small{
 display:block;
 color:#75859A;
 margin-top:3px;
 font-size:10px;
}

.teamPlaceholder{
 width:42px;
 height:42px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#0D1724;
 border-radius:50%;
}

/* RESPONSIVO */

@media(max-width:390px){

 .logo{font-size:25px}

 .teams{
  grid-template-columns:1fr 50px 1fr;
 }

 .team img{
  width:35px;
  height:35px;
 }

 .playerDot{
  width:39px;
  height:39px;
 }

 .detailScore{
  grid-template-columns:1fr 80px 1fr;
 }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

 <div class="headerTop">

  <div>
   <div class="logo">FUT<span>ZONE</span></div>
   <div class="subtitle">FUTEBOL EM DIRETO</div>
  </div>

  <div class="sportSwitch">

   <button
    id="btnFutebol"
    class="active"
    onclick="mudarDesporto('futebol')">
    ⚽ Futebol
   </button>

   <button
    id="btnFutsal"
    onclick="mudarDesporto('futsal')">
    🥅 Futsal
   </button>

  </div>

 </div>

</header>

<button
 class="liveGlobal"
 id="liveGlobalBtn"
 onclick="abrirLiveGlobal()">

 <span class="liveDot"></span>

 <span id="liveGlobalText">
  AO VIVO — TODOS OS CAMPEONATOS
 </span>

</button>

<main class="content">

<section id="viewJogos" class="view active">

 <div class="sectionTitle">
  Competições
 </div>

 <div
  class="leagues"
  id="leagueList">
 </div>

 <div class="filters">

  <button
   class="filterBtn active"
   data-filter="todos"
   onclick="alterarFiltro('todos',this)">
   Todos
  </button>

  <button
   class="filterBtn"
   data-filter="live"
   onclick="alterarFiltro('live',this)">
   🔴 Ao vivo
  </button>

  <button
   class="filterBtn"
   data-filter="upcoming"
   onclick="alterarFiltro('upcoming',this)">
   Próximos
  </button>

  <button
   class="filterBtn"
   data-filter="finished"
   onclick="alterarFiltro('finished',this)">
   Resultados
  </button>

 </div>

 <div class="searchBox">

  <span class="searchIcon">⌕</span>

  <input
   id="searchInput"
   type="search"
   placeholder="Procurar equipa..."
   oninput="renderJogos()">

 </div>

 <div id="games" class="games">

  <div class="loading">
   A carregar jogos...
  </div>

 </div>

</section>

<section id="viewTabelas" class="view">

 <div class="sectionTitle">
  Classificações
 </div>

 <div
  class="leagues"
  id="tableLeagueList">
 </div>

 <div id="standingsContainer">

  <div class="loading">
   A carregar classificação...
  </div>

 </div>

</section>

<section id="viewFavoritos" class="view">

 <div class="sectionTitle">
  Favoritos
 </div>

 <div class="filters">

  <button
   class="filterBtn active"
   data-fav="jogos"
   onclick="mostrarFavTipo('jogos',this)">
   ⚽ Jogos
  </button>

  <button
   class="filterBtn"
   data-fav="equipas"
   onclick="mostrarFavTipo('equipas',this)">
   🛡️ Equipas
  </button>

 </div>

 <div id="favoritesContainer"></div>

</section>

</main>

<nav class="bottomNav">

 <button
  class="navBtn active"
  id="navJogos"
  onclick="mostrarPagina('jogos')">

  <span class="navIcon">⚽</span>
  Jogos

 </button>

 <button
  class="navBtn"
  id="navTabelas"
  onclick="mostrarPagina('tabelas')">

  <span class="navIcon">📊</span>
  Tabelas

 </button>

 <button
  class="navBtn"
  id="navFav"
  onclick="mostrarPagina('favoritos')">

  <span class="navIcon">⭐</span>
  Favoritos

 </button>

</nav>

</div>

<!-- DETALHE DO JOGO -->

<div id="detailOverlay" class="detailOverlay">

 <div class="detailHeader">

  <button
   class="backBtn"
   id="closeDetail"
   onclick="fecharDetalhe()">
   ‹
  </button>

  <div
   class="detailTitle"
   id="detailHeaderTitle">
   Detalhe do jogo
  </div>

 </div>

 <div
  class="detailBody"
  id="detailBody">
 </div>

</div>

<!-- DETALHE DA EQUIPA -->

<div id="teamOverlay" class="detailOverlay">

 <div class="detailHeader">

  <button
   class="backBtn"
   onclick="fecharEquipa()">
   ‹
  </button>

  <div
   class="detailTitle"
   id="teamHeaderTitle">
   Equipa
  </div>

 </div>

 <div
  class="detailBody"
  id="teamBody">
 </div>

</div>

<!-- AO VIVO GLOBAL -->

<div id="liveOverlay" class="detailOverlay">

 <div class="detailHeader">

  <button
   class="backBtn"
   id="closeLive"
   onclick="fecharLiveGlobal()">
   ‹
  </button>

  <div class="detailTitle">
   🔴 Jogos ao vivo
  </div>

 </div>

 <div
  class="detailBody"
  id="liveBody">
 </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const API =
 "https://site.api.espn.com/apis/site/v2/sports/soccer/";

const API_CORE =
 "https://site.api.espn.com/apis/v2/sports/soccer/";


/* =========================================================
   LIGAS
========================================================= */

const LIGAS = [

 {id:"por.1",nome:"Liga Portugal",curto:"🇵🇹 Liga Portugal"},
 {id:"por.2",nome:"Liga Portugal 2",curto:"🇵🇹 Liga 2"},
 {id:"por.3",nome:"Liga 3",curto:"🇵🇹 Liga 3"},
 {id:"por.w.1",nome:"Liga BPI Feminina",curto:"🇵🇹 Liga BPI"},

 {id:"eng.1",nome:"Premier League",curto:"🏴 Premier League"},
 {id:"eng.2",nome:"Championship",curto:"🏴 Championship"},

 {id:"esp.1",nome:"LaLiga",curto:"🇪🇸 LaLiga"},
 {id:"esp.2",nome:"LaLiga 2",curto:"🇪🇸 LaLiga 2"},

 {id:"ita.1",nome:"Serie A",curto:"🇮🇹 Serie A"},
 {id:"ita.2",nome:"Serie B",curto:"🇮🇹 Serie B"},

async function fetchJSON(url){

 const resposta = await fetch(
  url,
  {cache:"no-store"}
 );

 if(!resposta.ok){
  throw new Error("HTTP "+resposta.status);
 }

 return await resposta.json();
}


function escapeHTML(valor){

 return String(valor ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function escapeAttr(valor){
 return escapeHTML(valor);
}


function guardarStorage(chave,valor){

 try{
  localStorage.setItem(
   chave,
   JSON.stringify(valor)
  );
 }catch(e){}

}


function carregarStorage(chave,valorPadrao){

 try{

    localStorage.getItem(chave)
   );

  return valor ?? valorPadrao;

 }catch(e){

}

/*
 * CORREÇÃO IMPORTANTE:
 * a função agora aceita "home" e "away".
 */

function obterCompetidor(evento,lado){

 const lista =
  evento?.competitions?.[0]?.competitors ||
  evento?.competitors ||
  [];

 if(!lista.length) return null;

 if(lado==="home"){
  return (
   lista.find(
    c=>c.homeAway==="home"
   ) || lista[0]
  );
 }

 if(lado==="away"){
  return (
   lista.find(
    c=>c.homeAway==="away"
   ) || lista[1] || null
  );
 }

 if(typeof lado==="number"){
  return lista[lado] || null;
 }

 return lista[0] || null;
}


function eventoEmDireto(evento){

 const estado =
  evento?.status?.type || {};

 return !!(
  estado.state==="in" ||
  estado.name==="STATUS_IN_PROGRESS" ||
  estado.type==="in" ||
  estado.description==="In Progress" ||
  String(estado.shortDetail||"")
   .toLowerCase()
   .includes("live")
 );
}


function eventoTerminado(evento){

 const estado =
  evento?.status?.type || {};

 return !!(
  estado.completed===true ||
  estado.state==="post" ||
  estado.name==="STATUS_FINAL"
 );
}


function eventoAdiado(evento){

 const estado =
  evento?.status?.type || {};

 const texto =
  String(
   estado.description ||
   estado.detail ||
   estado.name ||
   ""
  ).toLowerCase();

 return (
  texto.includes("postpon") ||
  texto.includes("delay") ||
  texto.includes("adiad")
 );
}


function eventoFuturo(evento){

 return (
  !eventoEmDireto(evento) &&
  !eventoTerminado(evento) &&
  !eventoAdiado(evento)
 );
}


function formatoData(data){

 if(!data) return "";

 const d = new Date(data);

 if(Number.isNaN(d.getTime()))
  return "";

 return d.toLocaleDateString(
  "pt-PT",
  {
   day:"2-digit",
   month:"2-digit"
  }
 );
}


function formatoHora(data){

 if(!data) return "";

 const d = new Date(data);

 if(Number.isNaN(d.getTime()))
  return "";

 return d.toLocaleTimeString(
  "pt-PT",
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


function ordenarEventos(a,b){

 const da =
  new Date(
   a?.date ||
   a?.competitions?.[0]?.date ||
   0
  ).getTime();

 const db =
  new Date(
   b?.date ||
   b?.competitions?.[0]?.date ||
   0
  ).getTime();

 const la = eventoEmDireto(a);
 const lb = eventoEmDireto(b);

 if(la && !lb) return -1;
 if(!la && lb) return 1;

 return da-db;
}

async function obterScoreboardLiga(ligaId,data){

 const dataRef =
  data ||
  new Date()
   .toISOString()
   .slice(0,10);

 const url =
  `${API}${ligaId}/scoreboard?dates=${dataRef}`;

 try{

  const resposta =
   await fetchJSON(url);

  return (resposta.events || [])
   .map(evento=>{
    evento.__ligaId = ligaId;
    return evento;
   });

 }catch(e){

  return [];

 }
}


async function obterJogosLiga(ligaId){

 const hoje = new Date();

 const datas = [];

 for(let i=-7;i<=14;i++){

  const d = new Date(hoje);

  d.setDate(
   hoje.getDate()+i
  );

  datas.push(
   d.toISOString().slice(0,10)
  );
 }

 const mapa = new Map();

 /*
  * Pedidos em grupos para não sobrecarregar
  * a API.
  */

 for(let i=0;i<datas.length;i+=5){

  const grupo =
   datas.slice(i,i+5);

  const resultados =
   await Promise.all(
    grupo.map(
     data =>
      obterScoreboardLiga(
       ligaId,
       data
      )
    )
   );

  resultados.flat().forEach(
   evento=>{

    if(evento?.id){

     mapa.set(
      String(evento.id),
      evento
     );

    }

   }
  );

 }

 return Array.from(
  mapa.values()
 );
}

async function obterStandings(ligaId){

 const urls=[

  `${API_CORE}leagues/${encodeURIComponent(liga.id)}/standings?limit=100`,

  `${API}${encodeURIComponent(liga.id)}/standings`

 ];

 for(const url of urls){

  try{

   const data =
    await fetchJSON(url);

   if(data)
    return data;

  }catch(e){

   console.warn(
    "Classificação indisponível:",
    url
   );

  }

 }

 return null;

}


function extrairGruposStandings(data){

 if(!data)
  return [];

 const grupos=[];

 /*
  * Formato mais comum:
  * children[].standings.entries
  */

 if(Array.isArray(data.children)){

  data.children.forEach(
   child=>{

    const standings =
     child?.standings;

    if(
     standings &&
     Array.isArray(
      standings.entries
     )
    ){

     grupos.push({

      nome:
       child.name ||
       child.abbreviation ||
       "",

      entries:
       standings.entries

     });

    }

   }
  );

 }

 /*
  * Algumas respostas trazem diretamente
  * standings.entries.
  */

 if(
  Array.isArray(
   data?.standings?.entries
  )
 ){

  grupos.push({

   nome:"",
   entries:
    data.standings.entries

  });

 }

 /*
  * Algumas respostas usam
  * standings como array.
  */

 if(
  Array.isArray(
   data?.standings
  )
 ){

  data.standings.forEach(
   grupo=>{

    if(
     Array.isArray(
      grupo?.entries
     )
    ){

     grupos.push({

      nome:
       grupo.name ||
       grupo.abbreviation ||
       "",

      entries:
       grupo.entries

     });

    }

   }
  );

 }

 return grupos;

}


function valorStat(entry,nome,alternativas=[]){

 const stats =
  Array.isArray(entry?.stats)
   ? entry.stats
   : [];

 const nomes =
  [nome,...alternativas]
   .map(
    x=>String(x).toLowerCase()
   );

 const stat =
  stats.find(
   s=>
    nomes.includes(
     String(
      s?.name ||
      s?.shortDisplayName ||
      ""
     ).toLowerCase()
    )
  );

 if(!stat)
  return "";

 return (
  stat.displayValue ??
  stat.value ??
  ""
 );

}


function numeroStat(entry,nome,alternativas=[]){

 const valor =
  valorStat(
   entry,
   nome,
   alternativas
  );

 const numero =
  Number(
   String(valor)
    .replace(",",".")
  );

 return Number.isFinite(numero)
  ? numero
  : 0;

}


function extrairDadosClassificacao(entry){

 const team =
  entry?.team ||
  {};

 const nome =
  team.displayName ||
  team.shortDisplayName ||
  team.name ||
  "Equipa";

 const id =
  String(
   team.id ||
   ""
  );

 const logo =
  team.logos?.[0]?.href ||
  team.logo ||
  "";

 const pos =
  Number(
   entry?.rank ||
   entry?.position ||
   valorStat(
    entry,
    "rank",
    ["position"]
   ) ||
   0
  );

 const jogos =
  numeroStat(
   entry,
   "gamesPlayed",
   ["played","gp"]
  );

 const vitorias =
  numeroStat(
   entry,
   "wins",
   ["win","w"]
  );

 const empates =
  numeroStat(
   entry,
   "ties",
   ["draws","draw","t"]
  );

 const derrotas =
  numeroStat(
   entry,
   "losses",
   ["loss","l"]
  );

 const golosMarcados =
  numeroStat(
   entry,
   "pointsFor",
   ["goalsFor","gf","runsFor"]
  );

 const golosSofridos =
  numeroStat(
   entry,
   "pointsAgainst",
   ["goalsAgainst","ga","runsAgainst"]
  );

 const diferenca =
  numeroStat(
   entry,
   "pointDifferential",
   ["goalDifference","gd"]
  );

 let pontos =
  numeroStat(
   entry,
   "points",
   ["pts"]
  );

 /*
  * Se a API não fornecer jogos,
  * calculamos quando possível.
  */

 const jogosCalculados =
  vitorias +
  empates +
  derrotas;

 const jogosFinal =
  jogos || jogosCalculados;

 /*
  * Algumas competições não usam "pointsFor"
  * para golos. Tentamos também stats alternativos.
  */

 const gf =
  golosMarcados ||
  numeroStat(
   entry,
   "goalsFor",
   ["gf"]
  );

 const ga =
  golosSofridos ||
  numeroStat(
   entry,
   "goalsAgainst",
   ["ga"]
  );

 const gd =
  diferenca ||
  (gf || ga
   ? gf-ga
   : 0);

 /*
  * No futebol normal:
  * 3 pontos vitória + 1 empate.
  * Só usamos este cálculo se a API não
  * tiver pontos.
  */

 if(
  !pontos &&
  jogosFinal
 ){

  pontos =
   vitorias*3 +
   empates;

 }

 equipasCache.set(
  id,
  {
   id,
   nome,
   logo,
   liga:nomeLiga(ligaAtual)
  }
 );

 return {

  id,
  nome,
  logo,
  pos,
  jogos:jogosFinal,
  vitorias,
  empates,
  derrotas,
  gf,
  ga,
  gd,
  pontos

 };

}

 if(pos<=4)

 if(pos<=6)
  return "zoneEuropa";

 return "";

}

async function carregarLiveGlobal(){

 const agora =
  Date.now();

 /*
  * Cache de 30 segundos para evitar
  * pedidos repetidos.
  */

 if(
  liveGlobalCache.length &&
  agora-liveGlobalTimestamp < 30000
 ){

  return liveGlobalCache;

 }

 const hoje =
  new Date()
   .toISOString()
   .slice(0,10);

 /*
  * Todas as ligas, não apenas a liga
  * atualmente selecionada.
  */

 const resultados =
  await Promise.all(
   LIGAS.map(
    liga=>
     obterScoreboardLiga(
      liga.id,
      hoje
     )
   )
  );

 const todos =
  resultados
   .flat()
   .filter(
    eventoEmDireto
   );

 /*
  * Retirar duplicados.
  */

 const mapa =
  new Map();

 todos.forEach(
  jogo=>{
   mapa.set(
    String(jogo.id),
    jogo
   );
  }
 );

 liveGlobalCache =
  Array.from(
   mapa.values()
  ).sort(
   ordenarEventos
  );

 liveGlobalTimestamp =
  Date.now();

 const contador =
  document.getElementById(
   "liveGlobalText"
  );

 if(contador){

  contador.textContent =
   liveGlobalCache.length
   ? `AO VIVO — ${liveGlobalCache.length} JOGO${
      liveGlobalCache.length===1
       ? ""
       : "S"
     }`
   : "AO VIVO — SEM JOGOS";

 }

 return liveGlobalCache;

}

 const urls=[

  `${API}${ligaId}/summary?event=${encodeURIComponent(id)}`,

  `${API}${ligaId}/summary?eventId=${encodeURIComponent(id)}`

 ];

function extrairStats(data){

 const grupos=[];

 const possiveis=[

  data?.boxscore?.teams,

  data?.boxscore?.players,

  data?.statistics,

  data?.competitions?.[0]
   ?.competitors

 ];

 for(const grupo of possiveis){

  if(
   Array.isArray(grupo) &&
   grupo.length
  ){

   grupos.push(
    ...grupo
   );

  }

 }

 const encontrados=[];

 grupos.forEach(
  grupo=>{

   const team =
    grupo?.team ||
    grupo?.athlete ||
    {};

   const teamId =
    String(
     team?.id ||
     grupo?.id ||
     ""
    );

   const teamName =
    team?.displayName ||
    team?.shortDisplayName ||
    team?.name ||
    "";

   const stats =
    grupo?.statistics ||
    grupo?.stats ||
    [];

   if(
    Array.isArray(stats)
   ){

    stats.forEach(
     stat=>{

      encontrados.push({

       teamId,
       teamName,

       nome:
        stat?.label ||
        stat?.name ||
        stat?.displayName ||
        "Estatística",

       valor:
        stat?.displayValue ??
        stat?.value ??
        "0"

      });

     }
    );

   }

  }
 );

 return encontrados;

}

 }

 /*

  */

 const mapa =

 stats.forEach(

 );

/* =========================================================

========================================================= */

function obterTitulares(data){

 const encontrados = [];

 const possiveis = [

  data?.boxscore?.players,

  data?.rosters,

  data?.lineups,

  data?.competitions?.[0]?.competitors

 ];

 function adicionarJogador(jogador,team){

  if(!jogador) return;

  const athlete =
   jogador?.athlete ||
   jogador?.player ||
   jogador;

  /*
   * IMPORTANTE:
   * só consideramos titular quando a API
   * indica explicitamente que é titular.
   * Não usamos a posição para inventar titulares.
   */

  const titular =
   jogador?.starter === true ||
   jogador?.isStarter === true ||
   jogador?.starter?.value === true ||
   jogador?.isStarter?.value === true ||
   athlete?.starter === true ||
   athlete?.isStarter === true ||
   athlete?.starter?.value === true ||
   athlete?.isStarter?.value === true;

  if(!titular) return;

  const id =
   String(
    athlete?.id ||
    jogador?.id ||
    ""
   );

  const nome =
   athlete?.displayName ||
   athlete?.fullName ||
   athlete?.shortName ||
   jogador?.displayName ||
   jogador?.name ||
   "Jogador";

  const numero =
   athlete?.jersey ||
   athlete?.jerseyNumber ||
   jogador?.jersey ||
   jogador?.jerseyNumber ||
   "?";

  const posicao =
   athlete?.position?.abbreviation ||
   athlete?.position?.displayName ||
   jogador?.position?.abbreviation ||
   jogador?.position?.displayName ||
   "";

  encontrados.push({

   id,
   nome,
   numero,
   posicao,

   teamId:
    String(
     team?.id ||
     team?.team?.id ||
     ""
    ),

   teamNome:
    team?.displayName ||
    team?.name ||
    team?.team?.displayName ||
    "",

   logo:
    team?.logos?.[0]?.href ||
    team?.logo ||
    team?.team?.logos?.[0]?.href ||
    ""

  });

 }


 possiveis.forEach(
  grupo=>{

   if(!Array.isArray(grupo))
    return;

   grupo.forEach(
    item=>{

     const team =
      item?.team ||
      item;

     const jogadores =
      item?.statistics ||
      item?.players ||
      item?.athletes ||
      item?.roster ||
      [];

     if(
      Array.isArray(jogadores)
     ){

      jogadores.forEach(
       jogador=>
        adicionarJogador(
         jogador,
         team
        )
      );

     }

    }
   );

  }
 );


 /*
  * Remover duplicados.
  */

 const mapa =
  new Map();

 encontrados.forEach(
  jogador=>{

   const chave =
    jogador.id ||
    `${jogador.teamId}-${jogador.nome}`;

   if(!mapa.has(chave))
    mapa.set(
     chave,
     jogador
    );

  }
 );

 return Array.from(
  mapa.values()
 );

}


function separarTitularesPorEquipa(data){

 const titulares =
  obterTitulares(data);

 const jogo =
  jogoDetalheAtual;

 const home =
  obterCompetidor(
   jogo,
   "home"
  );

 const away =
  obterCompetidor(
   jogo,
   "away"
  );

 const homeId =
  idEquipa(home);

 const awayId =
  idEquipa(away);

 let casa =
  titulares.filter(
   jogador=>
    String(jogador.teamId)===String(homeId)
  );

 let fora =
  titulares.filter(
   jogador=>
    String(jogador.teamId)===String(awayId)
  );


 /*
  * Algumas respostas ESPN não trazem o teamId
  * diretamente. Nesse caso tentamos pelo nome.
  */

 if(!casa.length){

  casa =
   titulares.filter(
    jogador=>
     jogador.teamNome &&
     jogador.teamNome===
      nomeEquipa(home)
   );

 }

 if(!fora.length){

  fora =
   titulares.filter(
    jogador=>
     jogador.teamNome &&
     jogador.teamNome===
      nomeEquipa(away)
   );

 }

 return {
  casa,
  fora
 };

}

const POSICOES_433 = [

 {x:50,y:93},

 {x:18,y:77},
 {x:39,y:81},
 {x:61,y:81},
 {x:82,y:77},

 {x:27,y:57},
 {x:50,y:62},
 {x:73,y:57},

 {x:24,y:29},
 {x:50,y:23},
 {x:76,y:29}

];


function renderJogadoresCampo(
 jogadores,
 lado
){

 if(!jogadores?.length)
  return "";

 const lista =
  jogadores.slice(0,11);

 /*
  * Para a equipa visitante colocamos
  * o campo no sentido contrário.
  */

 return lista.map(
  (jogador,index)=>{

   const pos =
    POSICOES_433[
     Math.min(
      index,
      POSICOES_433.length-1
     )
    ];

   let x=pos.x;
   let y=pos.y;

   if(lado==="away")
    y=100-y;

   const nome =
    jogador.nome ||
    "Jogador";

   const numero =
    jogador.numero ||
    "?";

   return `

    <div
     class="playerDot"
     style="
      left:${x}%;
      top:${y}%;
     "
     title="${escapeAttr(nome)}">

     <span>
      ${escapeHTML(numero)}
     </span>

     <small>
      ${escapeHTML(nome)}
     </small>

    </div>

   `;

  }
 ).join("");

}

async function carregarJogosEquipa(
 id,
 nome,
 logo
){

 const container =
  document.getElementById(
   "teamGames"
  );

 if(!container)
  return;

 let jogos =
  jogosFutebol.filter(
   jogo=>{

    const home =
     obterCompetidor(
      jogo,
      "home"
     );

    const away =
     obterCompetidor(
      jogo,
      "away"
     );

    return (
     String(
      idEquipa(home)
     )===String(id) ||

     String(
      idEquipa(away)
     )===String(id)
    );

   }
  );

 /*
  * Também procuramos no cache global
  * dos jogos ao vivo.
  */

 const mapa =
  new Map();

 jogos.forEach(
  jogo=>
   mapa.set(
    String(jogo.id),
    jogo
   )
 );

 liveGlobalCache.forEach(
  jogo=>{

   const home =
    obterCompetidor(
     jogo,
     "home"
    );

   const away =
    obterCompetidor(
     jogo,
     "away"
    );

   if(
    String(idEquipa(home))===String(id) ||
    String(idEquipa(away))===String(id)
   ){

    mapa.set(
     String(jogo.id),
     jogo
    );

   }

  }
 );

 jogos =
  Array.from(
   mapa.values()
  ).sort(
   ordenarEventos
  );

 if(!jogos.length){

  container.innerHTML=`

   <div class="empty">

    <strong>
     Jogos da equipa indisponíveis
    </strong>

    <div>
     Não existem jogos desta equipa
     nos dados carregados neste momento.
    </div>

   </div>

  `;

  return;

 }

 container.innerHTML =
  jogos
   .map(criarCardJogo)
   .join("");

}
