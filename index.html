function normalizarData(v){const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function hojeISO(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10).replaceAll("-","")}
function formatarData(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{weekday:"long",day:"2-digit",month:"2-digit"}):""}
function dataCurta(v){const d=normalizarData(v);return d?d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"}):""}
function horaEvento(e){const d=normalizarData(e?.date);return d?d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}):"--:--"}
function nomeEquipa(t){return t?.displayName||t?.shortDisplayName||t?.name||"Equipa"}
function logoEquipa(t){return t?.logo||t?.logos?.[0]?.href||""}
function isLive(e){return e?.status?.type?.state==="in"||e?.status?.type?.name==="STATUS_IN_PROGRESS"}
function isFinal(e){return e?.status?.type?.completed===true||e?.status?.type?.state==="post"||e?.status?.type?.name==="STATUS_FINAL"}
function getCompeticao(id){return ligas.find(x=>x[0]===id)?.[1]||id}
function favoritoJogo(id){return favoritosJogos.includes(String(id))}
function guardarFavoritos(){localStorage.setItem("futzone_jogos_favoritos",JSON.stringify(favoritosJogos));localStorage.setItem("futzone_equipas_favoritas",JSON.stringify(favoritosEquipas))}
async function fetchJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}

function makeFallbackEvent(liga,row,i){
const [date,home,away,hs,as]=row;const final=hs!==null&&as!==null;
return {id:`fz-${liga}-${date}-${i}-${home.replace(/\W+/g,"")}`,date,name:`${home} vs ${away}`,league:{name:getCompeticao(liga)},competitions:[{league:{name:getCompeticao(liga)},competitors:[
{id:`${liga}-h-${i}`,homeAway:"home",team:{displayName:home,shortDisplayName:home},...(final?{score:String(hs)}:{})},
{id:`${liga}-a-${i}`,homeAway:"away",team:{displayName:away,shortDisplayName:away},...(final?{score:String(as)}:{})}
],status:{type:{state:final?"post":"pre",completed:final}}}],__futzoneLiga:liga,__fallback:true}
}

function fallbackGames(liga){
return (FALLBACK[liga]?.games||[]).map((x,i)=>makeFallbackEvent(liga,x,i)).filter(e=>{
const d=new Date(e.date);const now=new Date();
return d>=new Date(now.getTime()-8*86400000)&&d<=new Date(now.getTime()+45*86400000)
})
}

async function buscarJogosLiga(liga){
let eventos=[];const pedidos=[];
for(let i=-7;i<=14;i++){
const url=API+encodeURIComponent(liga)+"/scoreboard?dates="+hojeISO(i);
pedidos.push(fetchJSON(url).then(x=>x.events||[]).catch(()=>[]))
}
const rs=await Promise.all(pedidos);
rs.flat().forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});
if(["por.2","por.3","por.w.1"].includes(liga)){
const fb=fallbackGames(liga);
fb.forEach(e=>{if(!eventos.some(x=>String(x.id)===String(e.id)))eventos.push(e)});
if(liga==="por.w.1"&&!eventos.length)eventos=fb
}
eventos.sort((a,b)=>new Date(a.date)-new Date(b.date));
return eventos
}

function extrairTabela(data){
const out=[];
function walk(o){
if(!o||typeof o!=="object")return;
if(Array.isArray(o))return o.forEach(walk);
if(o.team&&(o.stats||o.records||o.rank))out.push(o);
Object.values(o).forEach(walk)
}
walk(data);
const m=new Map();
out.forEach(x=>m.set(x.team.id||x.team.uid||x.team.displayName,x));
return [...m.values()]
}

function statVal(item,names){
const a=item.stats||item.records||[];
for(const n of names){
const x=a.find(s=>s.name===n||s.abbreviation===n||s.type===n);
if(x)return x.displayValue??x.value??"0"
}
return "0"
}

function nStat(item,n){
const x=parseFloat(String(statVal(item,n)).replace(",","."));
return Number.isFinite(x)?x:0
}

function obterRosters(s){
return s?[s.rosters,s.roster,s.boxscore?.players,s.players,s.gamepackageJSON?.rosters].find(x=>Array.isArray(x)&&x.length)||[]:[]
}

function obterJogadoresEquipa(s,id){
const r=obterRosters(s);
for(const b of r){
const bid=b.team?.id||b.teamId||b.team?.uid;
if(String(bid)===String(id))return (b.roster||b.players||[]).map(x=>({...x,athlete:x.athlete||x.player||x}))
}
return []
}

function jogadorEhTitular(j){
return j.starter===true||j.starting===true||j.isStarter===true||j.starter===1||j.starter==="true"||j.status?.type==="starter"
}

function nomeJogador(j){
const a=j.athlete||j.player||j;
return a.displayName||a.fullName||a.shortName||a.name||"Jogador"
}

function numeroJogador(j){
const a=j.athlete||j.player||j;
return j.jersey||j.jerseyNumber||a.jersey||a.jerseyNumber||""
}

function posicaoJogador(j){
const a=j.athlete||j.player||j;
return j.position?.abbreviation||j.position?.displayName||a.position?.abbreviation||a.position?.displayName||""
}

function posicoesCampo(js){
const t=js.filter(jogadorEhTitular).slice(0,11),gr=[],df=[],mf=[],fw=[],out=[];
t.forEach(j=>{
const p=posicaoJogador(j).toLowerCase();
if(/gk|goal|keeper|gr/.test(p))gr.push(j);
else if(/df|def|back|cb|lb|rb/.test(p))df.push(j);
else if(/mf|mid|mc|dm|am/.test(p))mf.push(j);
else if(/fw|fwd|st|cf|att|forward/.test(p))fw.push(j);
else out.push(j)
});
const res=[];
const add=(a,y)=>a.forEach((j,i)=>res.push({jogador:j,x:a.length===1?50:15+70*i/(a.length-1),y}));
add(gr,91);add(df,72);add(mf,51);add(fw,28);add(out,28);
return res.slice(0,11)
}

function campoOnze(h,a){
const H=posicoesCampo(h),A=posicoesCampo(a);

}

async function fzBuscarTodos(){
const agora=new Date(),ini=new Date(agora);ini.setDate(ini.getDate()-1);
const fim=new Date(agora);fim.setDate(fim.getDate()+14);
const ds=x=>x.toISOString().slice(0,10).replaceAll('-','');
const range=ds(ini)+'-'+ds(fim);
const out=[];const seen=new Set();

for(let i=0;i<ligas.length;i+=5){
const lote=ligas.slice(i,i+5);
await Promise.all(lote.map(async l=>{
try{
const d=await fetchJSON(API+encodeURIComponent(l[0])+'/scoreboard?dates='+range);
(d.events||[]).forEach(e=>{
e.__futzoneLiga=l[0];
if(!seen.has(String(e.id))){seen.add(String(e.id));out.push(e)}
})
}catch(e){}
}))
}
out.sort((a,b)=>new Date(a.date)-new Date(b.date));
return out
}

function fzCartaoComLiga(e){return cartaoJogo(e)}

async function fzRenderTodos(){
const c=document.getElementById('footballContent');if(!c)return;
c.innerHTML='<div class="loading">⏳ A carregar todas as competições...</div>';
const ev=await fzBuscarTodos();let arr=ev;

if(fzDiaSelecionado)arr=arr.filter(e=>new Date(e.date).toISOString().slice(0,10)===fzDiaSelecionado);

const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
if(q)arr=arr.filter(e=>{
const cs=e.competitions?.[0]?.competitors||[];
return cs.some(x=>nomeEquipa(x.team).toLowerCase().includes(q))
});

const grupos={};
arr.forEach(e=>{
const d=new Date(e.date).toISOString().slice(0,10);
(grupos[d]??=[]).push(e)
});

if(!arr.length){
c.innerHTML='<div class="empty">⚽<br><br>Não existem jogos para esta data.</div>';
return
}

c.innerHTML=
`<div class="fzAllHead"><b>⚽ FUTEBOL — TODAS AS COMPETIÇÕES</b><span>${arr.length} jogos</span></div>`+
Object.keys(grupos).sort().map(d=>`<div class="dayTitle"><span>${escapeHtml(formatarData(grupos[d][0].date))}</span><span>${dataCurta(grupos[d][0].date)}</span></div>${grupos[d].map(fzCartaoComLiga).join('')}`).join('')
}
