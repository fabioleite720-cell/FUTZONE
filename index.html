   function conciseEvents(d){

      const isSub=low.includes('substitution')||low.includes('substituição')||low.includes('substitute')||low.includes('entered')||low.includes('replaced');
      if(!(isGoal||isYellow||isRed||isSub))continue;

   }   function removeMinuteByMinute(){
