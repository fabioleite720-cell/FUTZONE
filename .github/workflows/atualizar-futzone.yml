name: Atualizar FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: python -m pip install requests

      - name: Atualizar dados
        run: |
          python - <<'PY'
          import requests
          import json
          import os
          import time
          import unicodedata

          os.makedirs("data", exist_ok=True)

          TSDB_KEY = "123"

          ligas = {
              "por.1": "primeira-liga",
              "eng.1": "premier-league",
              "esp.1": "la-liga",
              "ita.1": "serie-a",
              "ger.1": "bundesliga"
          }

          sessao = requests.Session()
          sessao.headers.update({
              "User-Agent": "FUTZONE"
          })

          def normalizar(texto):
              texto = str(texto or "")
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  c for c in texto
                  if unicodedata.category(c) != "Mn"
              )
              return "".join(
                  c.lower()
                  for c in texto
                  if c.isalnum()
              )

          def obter(url):
              try:
                  r = sessao.get(url, timeout=30)

                  if r.status_code == 200:
                      return r.json()

                  print("HTTP", r.status_code)

              except Exception as e:
                  print("ERRO:", e)

              return None

          def encontrar_entries(obj):
              if isinstance(obj, dict):

                  if isinstance(obj.get("entries"), list):
                      return obj["entries"]

                  if isinstance(obj.get("standings"), list):
                      for item in obj["standings"]:
                          resultado = encontrar_entries(item)
                          if resultado:
                              return resultado

                  if isinstance(obj.get("children"), list):
                      for item in obj["children"]:
                          resultado = encontrar_entries(item)
                          if resultado:
                              return resultado

              return []

          print("================================")
          print("ATUALIZAR CLASSIFICACOES")
          print("================================")

          equipas = []

          for liga, nome_ficheiro in ligas.items():

              print("A atualizar:", liga)

              url = (
                  "https://site.api.espn.com/apis/v2/"
                  "sports/soccer/"
                  + liga +
                  "/standings"
              )

              dados = obter(url)

              if not dados:
                  print("ERRO:", liga)
                  continue

              entries = encontrar_entries(dados)

              if not entries:
                  print("SEM CLASSIFICACAO:", liga)
                  continue

              caminho = (
                  "data/"
                  + nome_ficheiro
                  + "-classificacao.json"
              )

              with open(
                  caminho,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      {"entries": entries},
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "OK:",
                  len(entries),
                  "equipas"
              )

              for entrada in entries:

                  team = entrada.get("team", {})

                  nome = (
                      team.get("displayName")
                      or team.get("name")
                      or team.get("shortDisplayName")
                      or entrada.get("name")
                  )

                  if nome:
                      equipas.append({
                          "name": nome,
                          "liga": nome_ficheiro
                      })

          print("================================")
          print("ATUALIZAR PLANTEIS")
          print("================================")

          planteis = {}

          for equipa in equipas:

              nome = equipa["name"]
              liga = equipa["liga"]

              print("Equipa:", nome)

              pesquisas = [nome]

              nome_normalizado = normalizar(nome)

              if nome_normalizado == "fcporto":
                  pesquisas = ["FC Porto", "Porto"]

              elif nome_normalizado == "sportingcp":
                  pesquisas = ["Sporting CP", "Sporting"]

              elif nome_normalizado in ["benfica", "slbenfica"]:
                  pesquisas = ["Benfica", "SL Benfica"]

              equipa_db = None

              for pesquisa in pesquisas:

                  url = (
                      "https://www.thesportsdb.com/api/v1/json/"
                      + TSDB_KEY
                      + "/searchteams.php?t="
                      + requests.utils.quote(pesquisa)
                  )

                  dados = obter(url)

                  if dados and dados.get("teams"):

                      alvo = normalizar(pesquisa)

                      for t in dados["teams"]:

                          nome_db = normalizar(
                              t.get("strTeam")
                          )

                          if nome_db == alvo:
                              equipa_db = t
                              break

                      if equipa_db is None:
                          equipa_db = dados["teams"][0]

                      break

                  time.sleep(1)

              if equipa_db is None:
                  print("NAO ENCONTRADA:", nome)
                  continue

              id_equipa = equipa_db.get("idTeam")

              if not id_equipa:
                  print("SEM ID:", nome)
                  continue

              print(
                  "TheSportsDB:",
                  equipa_db.get("strTeam"),
                  id_equipa
              )

              url = (
                  "https://www.thesportsdb.com/api/v1/json/"
                  + TSDB_KEY
                  + "/lookup_all_players.php?id="
                  + str(id_equipa)
              )

              dados_jogadores = obter(url)

              if not dados_jogadores:
                  print("SEM PLANTEL:", nome)
                  continue

              lista = dados_jogadores.get("player") or []

              jogadores = []

              for p in lista:

                  posicao = (
                      p.get("strPosition")
                      or ""
                  ).strip()

                  if normalizar(posicao) in [
                      "manager",
                      "coach",
                      "headcoach",
                      "assistantmanager"
                  ]:
                      continue

                  jogadores.append({
                      "id": p.get("idPlayer") or "",
                      "name": p.get("strPlayer") or "Jogador",
                      "number": p.get("strNumber") or "",
                      "position": posicao,
                      "age": p.get("dateBorn") or "",
                      "nationality": p.get("strNationality") or "",
                      "photo": (
                          p.get("strCutout")
                          or p.get("strThumb")
                          or ""
                      )
                  })

              if jogadores:

                  chave = str(id_equipa)

                  planteis[chave] = {
                      "id": chave,
                      "name": nome,
                      "league": liga,
                      "players": jogadores
                  }

                  print(
                      "PLANTEL OK:",
                      len(jogadores)
                  )

              else:
                  print("PLANTEL VAZIO:", nome)

              time.sleep(1)

          print("================================")
          print("VERIFICAR FC PORTO")
          print("================================")

          porto_encontrado = False

          for valor in planteis.values():

              if normalizar(
                  valor.get("name")
              ) in ["fcporto", "porto"]:

                  porto_encontrado = True

                  print(
                      "FC PORTO OK -",
                      len(
                          valor.get(
                              "players",
                              []
                          )
                      ),
                      "jogadores"
                  )

          if not porto_encontrado:
              print("FC PORTO NAO ENCONTRADO")

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  planteis,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FUTZONE TERMINADO")
          print("================================")
          PY

      - name: Guardar alteracoes
        run: |
          git config user.name "FUTZONE Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualizar dados FUTZONE"
            git push
          fi
