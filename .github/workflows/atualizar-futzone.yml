name: Atualizar FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Atualizar dados FUTZONE
        run: |
          python <<'PY'
          import requests
          import json
          import os
          import time
          import unicodedata

          os.makedirs("data", exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "FUTZONE/1.0"
          })

          TSDB_KEY = "123"

          LIGAS = {
              "por.1": "primeira-liga",
              "eng.1": "premier-league",
              "esp.1": "la-liga",
              "ita.1": "serie-a",
              "ger.1": "bundesliga"
          }

          def normalizar(texto):
              texto = str(texto or "")
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  c for c in texto
                  if unicodedata.category(c) != "Mn"
              )
              return "".join(
                  c.lower()
                  for c in texto
                  if c.isalnum()
              )

          def buscar(url):
              try:
                  resposta = session.get(
                      url,
                      timeout=30
                  )

                  print(
                      resposta.status_code,
                      url
                  )

                  if resposta.status_code == 200:
                      return resposta.json()

              except Exception as erro:
                  print("ERRO:", erro)

              return None

          # =====================================================
          # CLASSIFICACOES
          # =====================================================

          print("")
          print("======================================")
          print("ATUALIZAR CLASSIFICACOES")
          print("======================================")

          equipas = []

          for liga, ficheiro in LIGAS.items():

              print("")
              print("Liga:", liga)

              url = (
                  "https://site.api.espn.com/apis/v2/"
                  "sports/soccer/"
                  + liga +
                  "/standings"
              )

              dados = buscar(url)

              if not dados:
                  print("ERRO: nao foi possivel obter dados")
                  continue

              entries = []

              def procurar(obj):

                  if isinstance(obj, dict):

                      if isinstance(
                          obj.get("entries"),
                          list
                      ):
                          return obj["entries"]

                      if isinstance(
                          obj.get("standings"),
                          list
                      ):
                          for item in obj["standings"]:
                              resultado = procurar(item)

                              if resultado:
                                  return resultado

                      if isinstance(
                          obj.get("children"),
                          list
                      ):
                          for item in obj["children"]:
                              resultado = procurar(item)

                              if resultado:
                                  return resultado

                  return []

              entries = procurar(dados)

              if not entries:
                  print(
                      "ERRO: classificacao vazia para",
                      liga
                  )
                  continue

              caminho = (
                  "data/"
                  + ficheiro
                  + "-classificacao.json"
              )

              with open(
                  caminho,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      {
                          "entries": entries
                      },
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "OK:",
                  len(entries),
                  "equipas"
              )

              for entrada in entries:

                  team = entrada.get(
                      "team",
                      {}
                  )

                  nome = (
                      team.get("displayName")
                      or team.get("name")
                      or team.get("shortDisplayName")
                      or entrada.get("name")
                  )

                  if nome:

                      equipas.append({
                          "name": nome,
                          "league": ficheiro
                      })

          # =====================================================
          # PLANTEIS
          # =====================================================

          print("")
          print("======================================")
          print("ATUALIZAR PLANTEIS")
          print("======================================")

          planteis = {}

          for equipa in equipas:

              nome = equipa["name"]
              liga = equipa["league"]

              print("")
              print("Equipa:", nome)

              pesquisas = [
                  nome
              ]

              # Aliases
              n = normalizar(nome)

              if n == "fcporto":
                  pesquisas = [
                      "FC Porto",
                      "Porto"
                  ]

              elif n in [
                  "sportingcp",
                  "sporting"
              ]:
                  pesquisas = [
                      "Sporting CP",
                      "Sporting"
                  ]

              elif n in [
                  "benfica",
                  "slbenfica"
              ]:
                  pesquisas = [
                      "Benfica",
                      "SL Benfica"
                  ]

              equipa_tsdb = None

              for pesquisa in pesquisas:

                  url = (
                      "https://www.thesportsdb.com/"
                      "api/v1/json/"
                      + TSDB_KEY
                      + "/searchteams.php?t="
                      + requests.utils.quote(
                          pesquisa
                      )
                  )

                  dados = buscar(url)

                  if dados and dados.get("teams"):

                      alvo = normalizar(
                          pesquisa
                      )

                      for t in dados["teams"]:

                          nome_tsdb = normalizar(
                              t.get("strTeam")
                          )

                          if nome_tsdb == alvo:

                              equipa_tsdb = t
                              break

                      if not equipa_tsdb:

                          equipa_tsdb = dados["teams"][0]

                      if equipa_tsdb:
                          break

                  time.sleep(2)

              if not equipa_tsdb:

                  print(
                      "NAO ENCONTRADA:",
                      nome
                  )

                  continue

              tsdb_id = equipa_tsdb.get(
                  "idTeam"
              )

              nome_tsdb = equipa_tsdb.get(
                  "strTeam"
              )

              print(
                  "TheSportsDB:",
                  nome_tsdb,
                  tsdb_id
              )

              if not tsdb_id:
                  continue

              url = (
                  "https://www.thesportsdb.com/"
                  "api/v1/json/"
                  + TSDB_KEY
                  + "/lookup_all_players.php?id="
                  + str(tsdb_id)
              )

              dados_players = buscar(url)

              if not dados_players:
                  print(
                      "SEM PLANTEL:",
                      nome
                  )
                  continue

              lista = dados_players.get(
                  "player"
              ) or []

              jogadores = []

              for p in lista:

                  posicao = (
                      p.get("strPosition")
                      or ""
                  ).strip()

                  if normalizar(posicao) in [
                      "manager",
                      "coach",
                      "headcoach",
                      "assistantmanager"
                  ]:
                      continue

                  jogadores.append({

                      "id":
                          p.get("idPlayer")
                          or "",

                      "name":
                          p.get("strPlayer")
                          or "Jogador",

                      "number":
                          p.get("strNumber")
                          or "",

                      "position":
                          posicao,

                      "age":
                          p.get("dateBorn")
                          or "",

                      "nationality":
                          p.get("strNationality")
                          or "",

                      "photo":
                          p.get("strCutout")
                          or p.get("strThumb")
                          or ""
                  })

              if jogadores:

                  planteis[str(tsdb_id)] = {

                      "id":
                          str(tsdb_id),

                      "name":
                          nome,

                      "league":
                          liga,

                      "players":
                          jogadores
                  }

                  print(
                      "PLANTEL OK:",
                      len(jogadores),
                      "jogadores"
                  )

              else:

                  print(
                      "PLANTEL VAZIO:",
                      nome
                  )

              # Limite gratuito TheSportsDB
              time.sleep(2)

          # =====================================================
          # GARANTIR FC PORTO
          # =====================================================

          print("")
          print("======================================")
          print("VERIFICACAO FC PORTO")
          print("======================================")

          porto = None

          for chave, valor in planteis.items():

              if normalizar(
                  valor.get("name")
              ) in [
                  "fcporto",
                  "porto"
              ]:

                  porto = valor
                  break

          if porto:

              print(
                  "FC PORTO OK
