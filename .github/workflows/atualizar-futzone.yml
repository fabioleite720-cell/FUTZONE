name: Atualizar FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Atualizar classificacoes e planteis
        run: |

          python - <<'PY'
          import requests
          import json
          import os
          import time
          import unicodedata
          from datetime import datetime

          os.makedirs("data", exist_ok=True)

          ESPN = {
              "por.1": "primeira-liga",
              "eng.1": "premier-league",
              "esp.1": "la-liga",
              "ita.1": "serie-a",
              "ger.1": "bundesliga"
          }

          THE_SPORTS_DB = "123"

          session = requests.Session()

          session.headers.update({
              "User-Agent": "FUTZONE/1.0"
          })


          def normalizar(texto):
              texto = str(texto or "")
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  c for c in texto
                  if unicodedata.category(c) != "Mn"
              )
              return "".join(
                  c.lower()
                  for c in texto
                  if c.isalnum()
              )


          def get_json(url, tentativas=3):

              for tentativa in range(tentativas):

                  try:

                      r = session.get(
                          url,
                          timeout=30
                      )

                      if r.status_code == 200:
                          return r.json()

                      print(
                          "HTTP",
                          r.status_code,
                          url
                      )

                  except Exception as e:
                      print(
                          "Erro:",
                          e
                      )

                  time.sleep(3)

              return None


          # ==================================================
          # CLASSIFICACOES
          # ==================================================

          print("")
          print("================================")
          print("ATUALIZAR CLASSIFICACOES")
          print("================================")

          for liga, nome in ESPN.items():

              url = (
                  "https://site.api.espn.com/"
                  "apis/v2/sports/soccer/"
                  + liga +
                  "/standings"
              )

              print("")
              print("Liga:", liga)

              dados = get_json(url)

              if not dados:
                  print("ERRO: sem classificacao")
                  continue

              entries = []

              def procurar(obj):

                  if isinstance(obj, dict):

                      if isinstance(
                          obj.get("entries"),
                          list
                      ):
                          return obj["entries"]

                      if isinstance(
                          obj.get("standings"),
                          list
                      ):
                          for x in obj["standings"]:

                              resultado = procurar(x)

                              if resultado:
                                  return resultado

                      if isinstance(
                          obj.get("children"),
                          list
                      ):
                          for x in obj["children"]:

                              resultado = procurar(x)

                              if resultado:
                                  return resultado

                  return []


              entries = procurar(dados)

              if not entries:

                  print(
                      "ERRO: formato de classificacao desconhecido"
                  )

                  continue


              saida = {
                  "entries": entries
              }

              ficheiro = (
                  "data/"
                  + nome
                  + "-classificacao.json"
              )

              with open(
                  ficheiro,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      saida,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "OK:",
                  ficheiro,
                  "-",
                  len(entries),
                  "equipas"
              )


          # ==================================================
          # PLANTEIS
          # ==================================================

          print("")
          print("================================")
          print("ATUALIZAR PLANTEIS")
          print("================================")


          # Equipas obtidas das classificacoes
          equipas = {}


          for liga, nome_liga in ESPN.items():

              ficheiro = (
                  "data/"
                  + nome_liga
                  + "-classificacao.json"
              )

              if not os.path.exists(ficheiro):
                  continue

              try:

                  with open(
                      ficheiro,
                      encoding="utf-8"
                  ) as f:

                      dados = json.load(f)

              except:
                  continue


              for entrada in dados.get(
                  "entries",
                  []
              ):

                  team = entrada.get(
                      "team",
                      {}
                  )

                  team_id = (
                      team.get("id")
                      or entrada.get("id")
                  )

                  team_name = (
                      team.get("displayName")
                      or team.get("name")
                      or team.get("shortDisplayName")
                  )

                  if team_id and team_name:

                      equipas[
                          normalizar(team_name)
                      ] = {
                          "name": team_name,
                          "league": nome_liga,
                          "espn_id": str(team_id)
                      }


          print(
              "Equipas encontradas:",
              len(equipas)
          )


          # ==================================================
          # ALIAS IMPORTANTES
          # ==================================================

          aliases = {

              "fcporto": [
                  "FC Porto",
                  "Porto"
              ],

              "sportingcp": [
                  "Sporting CP",
                  "Sporting",
                  "Sporting Lisbon"
              ],

              "slbenfica": [
                  "Benfica",
                  "SL Benfica"
              ],

              "atleticomadrid": [
                  "Atletico Madrid",
                  "Atlético Madrid"
              ],

              "intermilano": [
                  "Inter",
                  "Inter Milan",
                  "Inter Milano"
              ],

              "psveindhoven": [
                  "PSV",
                  "PSV Eindhoven"
              ],

              "bayerleverkusen": [
                  "Bayer Leverkusen"
              ],

              "borussiadortmund": [
                  "Borussia Dortmund"
              ]
          }


          # ==================================================
          # DADOS EXISTENTES
          # ==================================================

          antigo = {}

          if os.path.exists(
              "data/planteis.json"
          ):

              try:

                  with open(
                      "data/planteis.json",
                      encoding="utf-8"
                  ) as f:

                      antigo = json.load(f)

              except:
                  antigo = {}


          resultado = {}


          # Preservar IDs TheSportsDB já conhecidos
          for k, v in antigo.items():

              if isinstance(v, dict):

                  resultado[str(k)] = v


          # ==================================================
          # PROCURAR EQUIPAS NO THESPORTSDB
          # ==================================================

          for chave, info in equipas.items():

              nome = info["name"]

              candidatos = [
                  nome
              ]

              if chave in aliases:
                  candidatos += aliases[chave]

              encontrados = []

              for pesquisa in candidatos:

                  url = (
                      "https://www.thesportsdb.com/"
                      "api/v1/json/"
                      + THE_SPORTS_DB
                      + "/searchteams.php?t="
                      + requests.utils.quote(pesquisa)
                  )

                  dados = get_json(url)

                  if dados and dados.get("teams"):

                      encontrados = dados["teams"]

                      break

                  time.sleep(2.2)


              if not encontrados:

                  print(
                      "SEM EQUIPA:",
                      nome
                  )

                  continue


              # Escolher a equipa mais parecida
              escolhida = None

              alvo = normalizar(nome)

              for equipa in encontrados:

                  nome_db = normalizar(
                      equipa.get("strTeam")
                  )

                  if nome_db == alvo:

                      escolhida = equipa
                      break


              if not escolhida:

                  for equipa in encontrados:

                      nome_db = normalizar(
                          equipa.get("strTeam")
                      )

                      if (
                          alvo in nome_db
                          or nome_db in alvo
                      ):

                          escolhida = equipa
                          break


              if not escolhida:

                  escolhida = encontrados[0]


              tsdb_id = escolhida.get(
                  "idTeam"
              )

              nome_tsdb = escolhida.get(
                  "strTeam"
              )


              if not tsdb_id:

                  print(
                      "SEM ID:",
                      nome
                  )

                  continue


              print(
                  "",
                  nome,
                  "->",
                  nome_tsdb,
                  "(",
                  tsdb_id,
                  ")"
              )


              # ==================================================
              # PLANTEL
              # ==================================================

              url = (
                  "https://www.thesportsdb.com/"
                  "api/v1/json/"
                  + THE_SPORTS_DB
                  + "/lookup_all_players.php?id="
                  + str(tsdb_id)
              )

              dados_players = get_json(url)

              if not dados_players:

                  print(
                      "SEM PLANTEL:",
                      nome
                  )

                  continue


              players_raw = (
                  dados_players.get(
                      "player"
                  )
                  or []
              )


              players = []


              for p in players_raw:

                  posicao = (
                      p.get("strPosition")
                      or ""
                  ).strip()


                  # Remover treinadores
                  if normalizar(posicao) in [
                      "manager",
                      "coach",
                      "headcoach",
                      "assistantmanager"
                  ]:
                      continue


                  players.append({

                      "id":
                          p.get("idPlayer")
                          or "",

                      "name":
                          p.get("strPlayer")
                          or "Jogador",

                      "number":
                          p.get("strNumber")
                          or "",

                      "position":
                          posicao,

                      "age":
                          p.get("dateBorn")
                          or "",

                      "nationality":
                          p.get("strNationality")
                          or "",

                      "photo":
                          p.get("strCutout")
                          or p.get("strThumb")
                          or ""
                  })


              if players:

                  resultado[str(tsdb_id)] = {

                      "id": str(tsdb_id),

                      "name":
                          nome,

                      "league":
                          info["league"],

                      "players":
                          players
                  }


                  print(
                      "PLANTEL OK:",
                      len(players),
                      "jogadores"
                  )

              else:

                  print(
                      "PLANTEL VAZIO:",
                      nome
                  )


              # Limite gratuito TheSportsDB
              time.sleep(2.2)


          # ==================================================
          # GARANTIR FC PORTO
          # ==================================================

          porto = None

          for k, v in resultado.items():

              if normalizar(
                  v.get("name")
              ) in [
                  "fcporto",
                  "porto"
              ]:

                  porto = v
                  break


          if porto:

              print("")
              print(
                  "FC PORTO GARANTIDO:",
                  len(
                      porto.get(
                          "players",
                          []
                      )
                  ),
                  "jogadores"
              )

          else:

              print("")
              print(
                  "AVISO: FC PORTO ainda nao encontrado"
              )


          # ==================================================
          # GUARDAR
          # ==================================================

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("================================")
          print("ATUALIZACAO TERMINADA")
          print("================================")

          PY


      - name: Guardar alteracoes
        run: |

          git config user.name "FUTZONE Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualizar classificacoes e planteis"
            git push
          fi
