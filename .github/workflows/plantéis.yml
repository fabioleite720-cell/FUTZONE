name: Atualizar planteis FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar ficheiro de planteis
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse

          ligas = [
              ("por.1", "Portugal"),
              ("eng.1", "Inglaterra"),
              ("esp.1", "Espanha"),
              ("ita.1", "Italia"),
              ("ger.1", "Alemanha")
          ]

          resultado = {}

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as r:
                  return json.load(r)

          for league, nome_liga in ligas:

              print("A procurar jogadores:", nome_liga)

              try:

                  url = (
                      "https://sports.core.api.espn.com/v3/"
                      "sports/soccer/"
                      + league
                      + "/athletes"
                      "?limit=1000&active=true"
                  )

                  dados = buscar(url)

                  atletas = (
                      dados.get("items")
                      or dados.get("athletes")
                      or []
                  )

                  print(
                      "Jogadores encontrados:",
                      len(atletas)
                  )

                  for jogador in atletas:

                      if not isinstance(jogador, dict):
                          continue

                      jogador_id = jogador.get("id")

                      if not jogador_id:
                          continue

                      nome = (
                          jogador.get("fullName")
                          or jogador.get("displayName")
                          or jogador.get("shortName")
                          or "Jogador"
                      )

                      pos = jogador.get("position")

                      if isinstance(pos, dict):
                          pos = (
                              pos.get("displayName")
                              or pos.get("name")
                              or "-"
                          )

                      foto = jogador.get("headshot")

                      if isinstance(foto, dict):
                          foto = foto.get("href")

                      # Alguns dados da ESPN vêm dentro
                      # de objetos de referência.
                      equipa = jogador.get("team")

                      if isinstance(equipa, dict):
                          equipa_id = equipa.get("id")
                          equipa_nome = (
                              equipa.get("displayName")
                              or equipa.get("name")
                          )
                      else:
                          equipa_id = None
                          equipa_nome = None

                      if not equipa_id:
                          continue

                      if str(equipa_id) not in resultado:

                          resultado[str(equipa_id)] = {
                              "id": str(equipa_id),
                              "name":
                                  equipa_nome
                                  or "Equipa",
                              "league":
                                  nome_liga,
                              "players": []
                          }

                      resultado[
                          str(equipa_id)
                      ]["players"].append({

                          "id":
                              str(jogador_id),

                          "name":
                              nome,

                          "number":
                              jogador.get("jersey")
                              or "-",

                          "position":
                              pos
                              or "-",

                          "age":
                              jogador.get("age")
                              or "-",

                          "nationality":
                              jogador.get(
                                  "nationality"
                              )
                              or "-",

                          "photo":
                              foto
                              or ""
                      })

              except Exception as erro:

                  print(
                      "ERRO:",
                      nome_liga,
                      erro
                  )

          if not resultado:

              raise Exception(
                  "Nenhum jogador encontrado."
              )

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          total = sum(
              len(x["players"])
              for x in resultado.values()
          )

          print(
              "Equipas:",
              len(resultado)
          )

          print(
              "Jogadores:",
              total
          )

          if total == 0:

              raise Exception(
                  "O ficheiro foi criado mas não contém jogadores."
              )

          PY

      - name: Verificar ficheiro
        run: |
          test -s data/planteis.json
          echo "planteis.json criado com sucesso"
          wc -c data/planteis.json

      - name: Guardar alterações
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          git diff --cached --quiet || \
            git commit -m "FUTZONE - atualizar planteis"

          git push
