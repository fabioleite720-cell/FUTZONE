name: Criar planteis FUTZONE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar planteis
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import time

          ligas = [
              ("por.1", "Portugal"),
              ("eng.1", "Inglaterra"),
              ("esp.1", "Espanha"),
              ("ita.1", "Italia"),
              ("ger.1", "Alemanha")
          ]

          resultado = {}

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          for liga, nome_liga in ligas:

              print("================================")
              print("LIGA:", nome_liga)
              print("================================")

              with open(
                  "data/" + {
                      "por.1": "primeira-liga.json",
                      "eng.1": "premier-league.json",
                      "esp.1": "la-liga.json",
                      "ita.1": "serie-a.json",
                      "ger.1": "bundesliga.json"
                  }[liga],
                  encoding="utf-8"
              ) as f:
                  dados = json.load(f)

              equipas = {}

              for evento in dados.get("events", []):

                  for comp in evento.get("competitions", []):

                      for c in comp.get("competitors", []):

                          team = c.get("team", {})

                          tid = team.get("id") or c.get("id")
                          nome = (
                              team.get("displayName")
                              or team.get("name")
                          )

                          if tid and nome:
                              equipas[str(tid)] = nome

              print("Equipas:", len(equipas))

              for tid, nome_equipa in equipas.items():

                  url = (
                      "https://site.api.espn.com/apis/site/v2/"
                      "sports/soccer/"
                      + liga
                      + "/teams/"
                      + tid
                      + "?enable=roster"
                  )

                  try:

                      dados_equipa = buscar(url)

                      athletes = (
                          dados_equipa.get("athletes")
                          or dados_equipa.get("team", {}).get("athletes")
                          or []
                      )

                      if not athletes:
                          print(
                              "Sem jogadores:",
                              nome_equipa
                          )
                          continue

                      jogadores = []

                      for p in athletes:

                          if not isinstance(p, dict):
                              continue

                          jogador_id = p.get("id")

                          nome = (
                              p.get("fullName")
                              or p.get("displayName")
                              or p.get("shortName")
                              or "Jogador"
                          )

                          if not jogador_id:
                              continue

                          pos = p.get("position")

                          if isinstance(pos, dict):
                              pos = (
                                  pos.get("displayName")
                                  or pos.get("name")
                                  or "-"
                              )

                          headshot = p.get("headshot")

                          if isinstance(headshot, dict):
                              headshot = headshot.get("href")

                          jogadores.append({
                              "id": str(jogador_id),
                              "name": nome,
                              "number": (
                                  p.get("jersey")
                                  or p.get("jerseyNumber")
                                  or "-"
                              ),
                              "position": pos or "-",
                              "age": p.get("age") or "-",
                              "nationality": (
                                  p.get("nationality")
                                  or "-"
                              ),
                              "photo": headshot or ""
                          })

                      if jogadores:

                          resultado[tid] = {
                              "id": tid,
                              "name": nome_equipa,
                              "league": nome_liga,
                              "players": jogadores
                          }

                          print(
                              "OK:",
                              nome_equipa,
                              "-",
                              len(jogadores),
                              "jogadores"
                          )

                  except Exception as erro:

                      print(
                          "ERRO:",
                          nome_equipa,
                          "-",
                          erro
                      )

                  time.sleep(0.2)

          total = sum(
              len(x["players"])
              for x in resultado.values()
          )

          print("================================")
          print("EQUIPAS COM PLANTEL:", len(resultado))
          print("TOTAL JOGADORES:", total)
          print("================================")

          if total == 0:
              raise Exception(
                  "Nenhum jogador foi obtido."
              )

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Guardar ficheiro
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          git commit -m "FUTZONE - atualizar planteis" || true

          git push
