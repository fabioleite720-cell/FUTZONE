name: Criar plantéis FUTZONE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar plantéis a partir dos jogos
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import os

          ligas = [
              ("por.1", "primeira-liga.json"),
              ("eng.1", "premier-league.json"),
              ("esp.1", "la-liga.json"),
              ("ita.1", "serie-a.json"),
              ("ger.1", "bundesliga.json")
          ]

          resultado = {}

          def carregar(ficheiro):
              with open(
                  "data/" + ficheiro,
                  "r",
                  encoding="utf-8"
              ) as f:
                  return json.load(f)

          for liga, ficheiro in ligas:
              print("A ler:", ficheiro)

              dados = carregar(ficheiro)

              for evento in dados.get("events", []):
                  competicoes = evento.get("competitions", [])

                  if not competicoes:
                      continue

                  jogadores = evento.get("details", [])

                  for comp in competicoes:
                      for equipa in comp.get("competitors", []):
                          team = equipa.get("team", {})

                          equipa_id = str(
                              equipa.get("id")
                              or team.get("id")
                              or ""
                          )

                          nome_equipa = (
                              team.get("displayName")
                              or team.get("name")
                              or "Equipa"
                          )

                          if not equipa_id:
                              continue

                          if equipa_id not in resultado:
                              resultado[equipa_id] = {
                                  "id": equipa_id,
                                  "name": nome_equipa,
                                  "league": liga,
                                  "players": []
                              }

                  for jogador in jogadores:
                      if not isinstance(jogador, dict):
                          continue

                      atleta = jogador.get("athlete", jogador)

                      if not isinstance(atleta, dict):
                          continue

                      jogador_id = atleta.get("id")

                      nome = (
                          atleta.get("displayName")
                          or atleta.get("fullName")
                          or atleta.get("shortName")
                      )

                      if not jogador_id or not nome:
                          continue

                      for equipa in comp.get("competitors", []):
                          equipa_id = str(
                              equipa.get("id")
                              or equipa.get("team", {}).get("id")
                              or ""
                          )

                          if not equipa_id:
                              continue

                          jogadores_equipa = resultado[
                              equipa_id
                          ]["players"]

                          if not any(
                              str(p["id"]) == str(jogador_id)
                              for p in jogadores_equipa
                          ):
                              jogadores_equipa.append({
                                  "id": str(jogador_id),
                                  "name": nome,
                                  "number": atleta.get(
                                      "jersey", "-"
                                  ),
                                  "position": (
                                      atleta.get("position")
                                      or "-"
                                  ),
                                  "age": atleta.get("age", "-"),
                                  "nationality": (
                                      atleta.get(
                                          "nationality", "-"
                                      )
                                  ),
                                  "photo": (
                                      atleta.get(
                                          "headshot", ""
                                      )
                                  )
                              })

          if not resultado:
              raise Exception(
                  "Não foram encontradas equipas."
              )

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          total = sum(
              len(e["players"])
              for e in resultado.values()
          )

          print("Equipas criadas:", len(resultado))
          print("Jogadores encontrados:", total)

          if total == 0:
              raise Exception(
                  "Não foram encontrados jogadores nos jogos."
              )
          PY

      - name: Guardar alterações
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"
          git add data/planteis.json
          git commit -m "FUTZONE - criar planteis" || true
          git push
