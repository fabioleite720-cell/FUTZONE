name: Criar planteis FUTZONE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar planteis
        env:
          TSDB_KEY: "123"
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          FICHEIROS = [
              ("primeira-liga.json", "Portugal"),
              ("premier-league.json", "England"),
              ("la-liga.json", "Spain"),
              ("serie-a.json", "Italy"),
              ("bundesliga.json", "Germany")
          ]

          API = "https://www.thesportsdb.com/api/v1/json/123"

          def normalizar(texto):
              if not texto:
                  return ""
              return "".join(
                  c.lower()
                  for c in texto
                  if c.isalnum()
              )

          def buscar(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "FUTZONE/1.0"}
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=20
                  ) as resposta:
                      return json.loads(
                          resposta.read().decode("utf-8")
                      )

              except Exception as e:
                  print("ERRO API:", e)
                  return None

          # -----------------------------------------
          # CARREGAR PLANTEIS ANTIGOS
          # -----------------------------------------

          ficheiro_saida = "data/planteis.json"

          try:
              with open(
                  ficheiro_saida,
                  "r",
                  encoding="utf-8"
              ) as f:
                  planteis = json.load(f)

              if not isinstance(planteis, dict):
                  planteis = {}

          except Exception:
              planteis = {}

          # -----------------------------------------
          # ENCONTRAR EQUIPAS NOS JOGOS
          # -----------------------------------------

          equipas = {}

          for ficheiro, pais in FICHEIROS:

              caminho = "data/" + ficheiro

              print("")
              print("================================")
              print("A ler:", caminho)
              print("================================")

              try:
                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      dados = json.load(f)

              except Exception as e:
                  print("Não foi possível ler:", e)
                  continue

              eventos = dados.get("events", [])

              if not isinstance(eventos, list):
                  print("Formato inválido:", ficheiro)
                  continue

              for evento in eventos:

                  for comp in evento.get(
                      "competitions", []
                  ):

                      for c in comp.get(
                          "competitors", []
                      ):

                          team = c.get(
                              "team",
                              {}
                          )

                          tid = (
                              team.get("id")
                              or c.get("id")
                          )

                          nome = (
                              team.get("displayName")
                              or team.get("name")
                              or c.get("displayName")
                              or c.get("name")
                          )

                          if tid and nome:

                              equipas[str(tid)] = {
                                  "name": nome,
                                  "league": pais
                              }

          # -----------------------------------------
          # GARANTIR FC PORTO
          # -----------------------------------------

          porto_existe = False

          for info in equipas.values():

              n = normalizar(
                  info.get("name", "")
              )

              if n in [
                  "porto",
                  "fcporto",
                  "futebolclubeporto",
                  "futebolclubedoporto",
                  "portofutebolclube"
              ]:
                  porto_existe = True
                  break

          if not porto_existe:

              print("")
              print("================================")
              print("A adicionar FC PORTO manualmente")
              print("================================")

              equipas["FC_PORTO_FIXO"] = {
                  "name": "FC Porto",
                  "league": "Portugal"
              }

          print("")
          print("================================")
          print("EQUIPAS ENCONTRADAS:", len(equipas))
          print("================================")

          # -----------------------------------------
          # PROCESSAR EQUIPAS
          # -----------------------------------------

          for espn_id, info in equipas.items():

              nome_equipa = info["name"]
              pais = info["league"]

              print("")
              print("--------------------------------")
              print("Equipa:", nome_equipa)
              print("ESPN ID:", espn_id)
              print("--------------------------------")

              n = normalizar(nome_equipa)

              candidatos = [nome_equipa]

              # FC PORTO
              if n in [
                  "porto",
                  "fcporto",
                  "futebolclubeporto",
                  "futebolclubedoporto",
                  "portofutebolclube"
              ]:

                  candidatos = [
                      "FC Porto",
                      "Porto",
                      "Futebol Clube do Porto"
                  ]

              # BENFICA
              elif n in [
                  "benfica",
                  "slbenfica",
                  "sportlisboaebenfica"
              ]:

                  candidatos = [
                      "Benfica",
                      "SL Benfica"
                  ]

              # SPORTING
              elif n in [
                  "sporting",
                  "sportingcp",
                  "sportingclubedeportugal"
              ]:

                  candidatos = [
                      "Sporting CP",
                      "Sporting"
                  ]

              # BRAGA
              elif n in [
                  "braga",
                  "scbraga",
                  "sportingbraga"
              ]:

                  candidatos = [
                      "SC Braga",
                      "Braga"
                  ]

              encontrado = None
              team_id = None

              # -----------------------------------------
              # PROCURAR EQUIPA NO THESPORTSDB
              # -----------------------------------------

              for candidato in candidatos:

                  print(
                      "A procurar:",
                      candidato
                  )

                  url = (
                      API
                      + "/searchteams.php?t="
                      + urllib.parse.quote(candidato)
                  )

                  dados_equipa = buscar(url)

                  time.sleep(2)

                  if not dados_equipa:
                      continue

                  teams = dados_equipa.get(
                      "teams"
                  )

                  if not isinstance(
                      teams,
                      list
                  ):
                      continue

                  # Tentar correspondência exata
                  for team in teams:

                      nome_db = team.get(
                          "strTeam",
                          ""
                      )

                      if normalizar(
                          nome_db
                      ) == normalizar(
                          candidato
                      ):

                          encontrado = team
                          break

                  # Se não houver exacta,
                  # usar primeira equipa
                  if encontrado is None and teams:

                      encontrado = teams[0]

                  if encontrado:
                      team_id = encontrado.get(
                          "idTeam"
                      )
                      break

              if not team_id:

                  print(
                      "⚠️ Equipa não encontrada:",
                      nome_equipa
                  )

                  continue

              print(
                  "TheSportsDB ID:",
                  team_id
              )

              # -----------------------------------------
              # OBTER JOGADORES
              # -----------------------------------------

              url_players = (
                  API
                  + "/lookup_all_players.php?id="
                  + urllib.parse.quote(
                      str(team_id)
                  )
              )

              dados_players = buscar(
                  url_players
              )

              time.sleep(2)

              if not dados_players:

                  print(
                      "⚠️ Sem resposta de jogadores"
                  )

                  continue

              players = dados_players.get(
                  "player"
              )

              if not isinstance(
                  players,
                  list
              ):

                  print(
                      "⚠️ Sem jogadores:",
                      nome_equipa
                  )

                  continue

              lista = []

              for p in players:

                  nome = (
                      p.get("strPlayer")
                      or p.get("name")
                      or ""
                  ).strip()

                  if not nome:
                      continue

                  posicao = (
                      p.get("strPosition")
                      or p.get("position")
                      or ""
                  )

                  # Não mostrar treinadores
                  if any(
                      palavra in posicao.lower()
                      for palavra in [
                          "coach",
                          "manager",
                          "managerial"
                      ]
                  ):
                      continue

                  numero = (
                      p.get("strNumber")
                      or p.get("number")
                      or ""
                  )

                  nascimento = (
                      p.get("dateBorn")
                      or p.get("dateOfBirth")
                      or p.get("birthDate")
                      or ""
                  )

                  nacionalidade = (
                      p.get("strNationality")
                      or p.get("nationality")
                      or ""
                  )

                  foto = (
                      p.get("strThumb")
                      or p.get("strCutout")
                      or p.get("photo")
                      or ""
                  )

                  lista.append({
                      "id": str(
                          p.get(
                              "idPlayer",
                              ""
                          )
                      ),
                      "name": nome,
                      "number": str(numero),
                      "position": posicao,
                      "age": nascimento,
                      "nationality": nacionalidade,
                      "photo": foto
                  })

              if lista:

                  chave = str(team_id)

                  planteis[chave] = {
                      "id": chave,
                      "name": (
                          encontrado.get(
                              "strTeam"
                          )
                          or nome_equipa
                      ),
                      "league": pais,
                      "players": lista
                  }

                  print(
                      "✅ Jogadores:",
                      len(lista)
                  )

              else:

                  print(
                      "⚠️ Nenhum jogador válido"
                  )

          # -----------------------------------------
          # GUARDAR
          # -----------------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              ficheiro_saida,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  planteis,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("PLANTEIS GUARDADOS")
          print("Total:", len(planteis))
          print("================================")
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'FUTZONE'
          git config user.email 'futzone@users.noreply.github.com'

          git add data/planteis.json

          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m 'FUTZONE - actualizar planteis'
            git push
          fi
