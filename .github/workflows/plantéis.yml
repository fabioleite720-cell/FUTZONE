name: Atualizar planteis FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar planteis
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import time

          ligas = [
              ("por.1", "primeira-liga.json", "Portugal"),
              ("eng.1", "premier-league.json", "Inglaterra"),
              ("esp.1", "la-liga.json", "Espanha"),
              ("ita.1", "serie-a.json", "Italia"),
              ("ger.1", "bundesliga.json", "Alemanha")
          ]

          equipas = {}

          for league, ficheiro, nome_liga in ligas:

              try:
                  with open(
                      "data/" + ficheiro,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      dados = json.load(f)

                  for evento in dados.get("events", []):

                      for comp in evento.get(
                          "competitions", []
                      ):

                          for item in comp.get(
                              "competitors", []
                          ):

                              team = item.get(
                                  "team", {}
                              )

                              tid = str(
                                  team.get("id", "")
                              )

                              if tid:
                                  equipas[tid] = {
                                      "id": tid,
                                      "nome":
                                          team.get(
                                              "displayName"
                                          )
                                          or team.get(
                                              "name"
                                          )
                                          or "Equipa",
                                      "liga":
                                          nome_liga,
                                      "league":
                                          league
                                  }

              except Exception as erro:
                  print(
                      "Erro em",
                      ficheiro,
                      erro
                  )

          print(
              "Equipas encontradas:",
              len(equipas)
          )

          resultado = {}

          for tid, equipa in equipas.items():

              url = (
                  "https://site.api.espn.com/apis/site/v2/"
                  "sports/soccer/"
                  + equipa["league"]
                  + "/teams/"
                  + tid
                  + "/roster"
              )

              print(
                  "A procurar:",
                  equipa["nome"]
              )

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 FUTZONE"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as resposta:

                      dados = json.load(
                          resposta
                      )

                  jogadores = []

                  atletas = dados.get(
                      "athletes",
                      []
                  )

                  for grupo in atletas:

                      lista = []

                      if isinstance(
                          grupo,
                          dict
                      ):

                          if isinstance(
                              grupo.get("items"),
                              list
                          ):
                              lista = grupo["items"]

                          elif grupo.get("id"):
                              lista = [grupo]

                      for jogador in lista:

                          posicao = jogador.get(
                              "position"
                          )

                          if isinstance(
                              posicao,
                              dict
                          ):
                              posicao = (
                                  posicao.get(
                                      "displayName"
                                  )
                                  or posicao.get(
                                      "name"
                                  )
                              )

                          nacionalidade = (
                              jogador.get(
                                  "birthPlace",
                                  {}
                              )
                          )

                          if isinstance(
                              nacionalidade,
                              dict
                          ):
                              nacionalidade = (
                                  nacionalidade.get(
                                      "country"
                                  )
                              )
                          else:
                              nacionalidade = None

                          foto = jogador.get(
                              "headshot"
                          )

                          if isinstance(
                              foto,
                              dict
                          ):
                              foto = foto.get(
                                  "href"
                              )

                          jogadores.append({
                              "id":
                                  jogador.get(
                                      "id"
                                  ),

                              "name":
                                  jogador.get(
                                      "fullName"
                                  )
                                  or jogador.get(
                                      "displayName"
                                  )
                                  or "Jogador",

                              "number":
                                  jogador.get(
                                      "jersey"
                                  ),

                              "position":
                                  posicao
                                  or "-",

                              "age":
                                  jogador.get(
                                      "age"
                                  )
                                  or "-",

                              "nationality":
                                  nacionalidade
                                  or "-",

                              "photo":
                                  foto
                                  or ""
                          })

                  resultado[tid] = {
                      "id": tid,
                      "name": equipa["nome"],
                      "league": equipa["liga"],
                      "players": jogadores
                  }

                  print(
                      "  Jogadores:",
                      len(jogadores)
                  )

              except Exception as erro:

                  print(
                      "  ERRO:",
                      erro
                  )

              time.sleep(0.2)

          if not resultado:
              raise Exception(
                  "Nenhum plantel foi obtido."
              )

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "PLANTEIS CRIADOS:",
              len(resultado)
          )

          PY

      - name: Verificar ficheiro
        run: |
          test -s data/planteis.json
          echo "planteis.json criado:"
          wc -c data/planteis.json

      - name: Guardar no GitHub
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          git diff --cached --quiet || \
            git commit -m "FUTZONE - atualizar planteis"

          git push
