name: Criar planteis FUTZONE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar planteis com TheSportsDB
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import time

          BASE = "https://www.thesportsdb.com/api/v1/json/123"

          ficheiros = [
              ("primeira-liga.json", "Portugal"),
              ("premier-league.json", "Inglaterra"),
              ("la-liga.json", "Espanha"),
              ("serie-a.json", "Italia"),
              ("bundesliga.json", "Alemanha")
          ]

          resultado = {}

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          for ficheiro, pais in ficheiros:

              print("")
              print("================================")
              print("LIGA:", pais)
              print("================================")

              with open(
                  "data/" + ficheiro,
                  "r",
                  encoding="utf-8"
              ) as f:
                  dados = json.load(f)

              equipas = {}

              for evento in dados.get("events", []):

                  for comp in evento.get("competitions", []):

                      for c in comp.get("competitors", []):

                          team = c.get("team", {})

                          tid = (
                              team.get("id")
                              or c.get("id")
                          )

                          nome = (
                              team.get("displayName")
                              or team.get("name")
                          )

                          if tid and nome:
                              equipas[str(tid)] = nome

              print("Equipas encontradas:", len(equipas))

              for _, nome_equipa in equipas.items():

                  print("A procurar:", nome_equipa)

                  try:

                      nome_url = urllib.parse.quote(
                          nome_equipa.replace(" ", "_")
                      )

                      url = (
                          BASE
                          + "/searchteams.php?t="
                          + nome_url
                      )

                      dados_equipa = buscar(url)

                      teams = dados_equipa.get("teams") or []

                      if not teams:
                          print(
                              "  SEM EQUIPA:",
                              nome_equipa
                          )
                          time.sleep(2.2)
                          continue

                      equipa = teams[0]

                      id_team = equipa.get("idTeam")

                      if not id_team:
                          print(
                              "  SEM ID:",
                              nome_equipa
                          )
                          time.sleep(2.2)
                          continue

                      print(
                          "  ID TheSportsDB:",
                          id_team
                      )

                      time.sleep(2.2)

                      url_players = (
                          BASE
                          + "/lookup_all_players.php?id="
                          + str(id_team)
                      )

                      dados_players = buscar(url_players)

                      players = (
                          dados_players.get("player")
                          or []
                      )

                      jogadores = []

                      for p in players:

                          if not isinstance(p, dict):
                              continue

                          jogador_id = (
                              p.get("idPlayer")
                              or p.get("id")
                          )

                          nome = (
                              p.get("strPlayer")
                              or p.get("strPlayerAlternate")
                          )

                          if not jogador_id or not nome:
                              continue

                          jogadores.append({
                              "id": str(jogador_id),
                              "name": nome,
                              "number": (
                                  p.get("strNumber")
                                  or "-"
                              ),
                              "position": (
                                  p.get("strPosition")
                                  or "-"
                              ),
                              "age": (
                                  p.get("dateBorn")
                                  or "-"
                              ),
                              "nationality": (
                                  p.get("strNationality")
                                  or "-"
                              ),
                              "photo": (
                                  p.get("strThumb")
                                  or p.get("strCutout")
                                  or ""
                              )
                          })

                      if jogadores:

                          resultado[str(id_team)] = {
                              "id": str(id_team),
                              "name": (
                                  equipa.get("strTeam")
                                  or nome_equipa
                              ),
                              "league": pais,
                              "players": jogadores
                          }

                          print(
                              "  OK:",
                              len(jogadores),
                              "jogadores"
                          )

                      else:

                          print(
                              "  SEM JOGADORES:",
                              nome_equipa
                          )

                  except Exception as erro:

                      print(
                          "  ERRO:",
                          nome_equipa,
                          "-",
                          erro
                      )

                  time.sleep(2.2)

          total_equipas = len(resultado)

          total_jogadores = sum(
              len(e["players"])
              for e in resultado.values()
          )

          print("")
          print("================================")
          print("RESULTADO FINAL")
          print("Equipas:", total_equipas)
          print("Jogadores:", total_jogadores)
          print("================================")

          if total_jogadores == 0:
              raise Exception(
                  "Nenhum jogador foi encontrado."
              )

          with open(
              "data/planteis.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/planteis.json criado com sucesso."
          )
          PY

      - name: Guardar alterações
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          git commit -m "FUTZONE - actualizar planteis" || true

          git push
