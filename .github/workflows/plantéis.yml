name: Criar planteis FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar plantéis FUTZONE
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import time
          import os
          import re
          import unicodedata

          BASE = "https://www.thesportsdb.com/api/v1/json/123"

          FICHEIROS = [
              ("primeira-liga.json", "Portugal"),
              ("premier-league.json", "Inglaterra"),
              ("la-liga.json", "Espanha"),
              ("serie-a.json", "Italia"),
              ("bundesliga.json", "Alemanha")
          ]

          def normalizar(texto):
              texto = str(texto or "").lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  c for c in texto
                  if unicodedata.category(c) != "Mn"
              )
              return re.sub(r"[^a-z0-9]", "", texto)

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "FUTZONE/1.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          caminho = "data/planteis.json"

          # -----------------------------------------
          # CARREGAR PLANTEIS EXISTENTES
          # -----------------------------------------

          resultado = {}

          if os.path.exists(caminho):
              try:
                  with open(caminho, "r", encoding="utf-8") as f:
                      resultado = json.load(f)

                  if not isinstance(resultado, dict):
                      resultado = {}

                  print(
                      "Plantéis existentes:",
                      len(resultado)
                  )

              except Exception as e:
                  print(
                      "Erro a carregar plantéis anteriores:",
                      e
                  )

          # -----------------------------------------
          # DESCOBRIR EQUIPAS
          # -----------------------------------------

          equipas = {}

          for ficheiro, pais in FICHEIROS:

              print("")
              print("================================")
              print("A ler:", ficheiro)
              print("================================")

              try:
                  with open(
                      "data/" + ficheiro,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      dados = json.load(f)
              except Exception as e:
                  print("Não foi possível ler:", e)
                  continue

              eventos = dados.get("events", [])

              if not isinstance(eventos, list):
                  print("Formato de jogos inválido:", ficheiro)
                  continue

              for evento in eventos:

                  for comp in evento.get(
                      "competitions", []
                  ):

                      for c in comp.get(
                          "competitors", []
                      ):

                          team = c.get("team", {})

                          tid = (
                              team.get("id")
                              or c.get("id")
                          )

                          nome = (
                              team.get("displayName")
                              or team.get("name")
                              or c.get("displayName")
                              or c.get("name")
                          )

                          if tid and nome:
                              equipas[str(tid)] = {
                                  "name": nome,
                                  "league": pais
                              }

          print("")
          print("================================")
          print("EQUIPAS ENCONTRADAS:", len(equipas))
          print("================================")

          # -----------------------------------------
          # PROCESSAR EQUIPAS
          # -----------------------------------------

          for espn_id, info in equipas.items():

              nome_equipa = info["name"]
              pais = info["league"]

              print("")
              print("--------------------------------")
              print("Equipa:", nome_equipa)
              print("ESPN ID:", espn_id)
              print("--------------------------------")

              n = normalizar(nome_equipa)

              candidatos = [nome_equipa]

              # FC PORTO
              if n in [
                  "fcporto",
                  "porto",
                  "futebolclubeporto",
                  "futebolclubedoporto"
              ]:
                  candidatos = [
                      "FC Porto",
                      "Porto"
                  ]

              # BENFICA
              elif n in [
                  "benfica",
                  "slbenfica",
                  "sportlisboabenfica"
              ]:
                  candidatos = [
                      "SL Benfica",
                      "Benfica"
                  ]

              # SPORTING
              elif n in [
                  "sportingcp",
                  "sporting",
                  "sportingclubedeportugal"
              ]:
                  candidatos = [
                      "Sporting CP",
                      "Sporting"
                  ]

              # BRAGA
              elif n in [
                  "braga",
                  "scbraga",
                  "sportingbraga"
              ]:
                  candidatos = [
                      "SC Braga",
                      "Braga"
                  ]

              encontrado = None

              # -----------------------------------------
              # PROCURAR EQUIPA NO THESPORTSDB
              # -----------------------------------------

              for candidato in candidatos:

                  try:

                      nome_url = urllib.parse.quote(
                          candidato
                      )

                      url = (
                          BASE
                          + "/searchteams.php?t="
                          + nome_url
                      )

                      dados_equipa = buscar(url)

                      teams = (
                          dados_equipa.get("teams")
                          or []
                      )

                      if teams:

                          alvo = normalizar(candidato)

                          # Correspondência exata
                          for t in teams:

                              nome_teste = normalizar(
                                  t.get("strTeam")
                              )

                              if nome_teste == alvo:
                                  encontrado = t
                                  break

                          # Se não houver exata
                          if not encontrado:
                              encontrado = teams[0]

                          if encontrado.get("idTeam"):
                              break

                  except Exception as e:

                      print(
                          "Erro na pesquisa:",
                          candidato,
                          e
                      )

                  # respeitar limite da API
                  time.sleep(2.2)

              if not encontrado:

                  print(
                      "SEM EQUIPA:",
                      nome_equipa
                  )

                  continue

              id_team = encontrado.get("idTeam")

              if not id_team:

                  print(
                      "SEM ID:",
                      nome_equipa
                  )

                  continue

              nome_thesportsdb = (
                  encontrado.get("strTeam")
                  or nome_equipa
              )

              print(
                  "TheSportsDB:",
                  nome_thesportsdb
              )

              print(
                  "ID:",
                  id_team
              )

              # -----------------------------------------
              # PROCURAR JOGADORES
              # -----------------------------------------

              try:

                  time.sleep(2.2)

                  url_players = (
                      BASE
                      + "/lookup_all_players.php?id="
                      + str(id_team)
                  )

                  dados_players = buscar(
                      url_players
                  )

                  players = (
                      dados_players.get("player")
                      or []
                  )

              except Exception as e:

                  print(
                      "Erro ao obter jogadores:",
                      e
                  )

                  # NÃO apagar plantel anterior
                  continue

              jogadores = []

              # -----------------------------------------
              # CONVERTER JOGADORES
              # -----------------------------------------

              for p in players:

                  if not isinstance(p, dict):
                      continue

                  jogador_id = (
                      p.get("idPlayer")
                      or p.get("id")
                  )

                  nome = (
                      p.get("strPlayer")
                      or p.get("strPlayerAlternate")
                  )

                  if not jogador_id or not nome:
                      continue

                  posicao = (
                      p.get("strPosition")
                      or "-"
                  )

                  pos_norm = normalizar(posicao)
                  nome_norm = normalizar(nome)

                  # Excluir treinadores
                  if (
                      "coach" in pos_norm
                      or "manager" in pos_norm
                      or "coach" in nome_norm
                      or "manager" in nome_norm
                  ):
                      continue

                  jogadores.append({
                      "id": str(jogador_id),

                      "name": nome,

                      "number": (
                          p.get("strNumber")
                          or "-"
                      ),

                      "position": posicao,

                      "age": (
                          p.get("dateBorn")
                          or "-"
                      ),

                      "nationality": (
                          p.get("strNationality")
                          or "-"
                      ),

                      "photo": (
                          p.get("strThumb")
                          or p.get("strCutout")
                          or ""
                      )
                  })

              # -----------------------------------------
              # GUARDAR APENAS SE HOUVER JOGADORES
              # -----------------------------------------

              if jogadores:

                  resultado[str(id_team)] = {

                      "id": str(id_team),

                      "name": nome_thesportsdb,

                      "league": pais,

                      "espnId": str(espn_id),

                      "players": jogadores
                  }

                  print(
                      "OK:",
                      len(jogadores),
                      "jogadores"
                  )

              else:

                  print(
                      "SEM JOGADORES:",
                      nome_equipa
                  )

                  # Não apagar eventual plantel anterior

              time.sleep(2.2)

          # -----------------------------------------
          # RESULTADO
          # -----------------------------------------

          total_equipas = len(resultado)

          total_jogadores = sum(
              len(
                  e.get("players", [])
              )
              for e in resultado.values()
              if isinstance(e, dict)
          )

          print("")
          print("================================")
          print("RESULTADO FINAL")
          print("================================")
          print(
              "Equipas:",
              total_equipas
          )
          print(
              "Jogadores:",
              total_jogadores
          )
          print("================================")

          if total_jogadores == 0:
              raise Exception(
                  "Nenhum jogador encontrado."
              )

          # -----------------------------------------
          # GUARDAR
          # -----------------------------------------

          with open(
              caminho,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/planteis.json atualizado com sucesso."
          )

          PY

      - name: Guardar alterações
        run: |
          git config user.name 'FUTZONE'
          git config user.email 'futzone@users.noreply.github.com'

          git add data/planteis.json

          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m 'FUTZONE - actualizar planteis'
            git push
          fi
