name: Criar planteis FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */12 * * *"

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar planteis automaticamente
        shell: python
        run: |
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          os.makedirs("data", exist_ok=True)

          API = "https://www.thesportsdb.com/api/v1/json/123"

          def normalizar(texto):
              if not texto:
                  return ""
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(texto).lower()
              )

          def buscar(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "FUTZONE/1.0"}
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=20
                  ) as resposta:

                      return json.loads(
                          resposta.read().decode("utf-8")
                      )

              except Exception as erro:
                  print("Erro API:", erro)
                  return {}

          # ==================================================
          # LIGAS
          # ==================================================

          ficheiros = [
              ("data/primeira-liga.json", "Portugal"),
              ("data/premier-league.json", "Inglaterra"),
              ("data/la-liga.json", "Espanha"),
              ("data/serie-a.json", "Itália"),
              ("data/bundesliga.json", "Alemanha")
          ]

          equipas = {}

          # ==================================================
          # LER EQUIPAS DOS JOGOS
          # ==================================================

          for ficheiro, liga in ficheiros:

              if not os.path.exists(ficheiro):
                  continue

              print("")
              print("A ler:", ficheiro)

              try:
                  with open(
                      ficheiro,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      dados = json.load(f)

              except Exception as erro:
                  print("Erro:", erro)
                  continue

              eventos = dados.get("events", [])

              for jogo in eventos:

                  try:
                      competicao = jogo.get(
                          "competitions",
                          [{}]
                      )[0]

                      participantes = competicao.get(
                          "competitors",
                          []
                      )

                      for participante in participantes:

                          equipa = participante.get(
                              "team",
                              {}
                          )

                          nome = equipa.get(
                              "displayName"
                          ) or equipa.get(
                              "name"
                          )

                          team_id = equipa.get(
                              "id"
                          )

                          if not nome:
                              continue

                          chave = normalizar(nome)

                          if chave:

                              equipas[chave] = {
                                  "id": str(team_id or ""),
                                  "nome": nome,
                                  "liga": liga
                              }

                  except Exception:
                      continue

          print("")
          print("====================================")
          print("EQUIPAS ENCONTRADAS:", len(equipas))
          print("====================================")

          # ==================================================
          # EQUIPAS IMPORTANTES GARANTIDAS
          # ==================================================

          fixas = [
              ("FC Porto", "Portugal"),
              ("Sporting CP", "Portugal"),
              ("Benfica", "Portugal"),
              ("SC Braga", "Portugal"),
              ("Liverpool", "Inglaterra"),
              ("Manchester City", "Inglaterra"),
              ("Manchester United", "Inglaterra"),
              ("Arsenal", "Inglaterra"),
              ("Chelsea", "Inglaterra"),
              ("Real Madrid", "Espanha"),
              ("Barcelona", "Espanha"),
              ("Atletico Madrid", "Espanha"),
              ("Juventus", "Itália"),
              ("Inter", "Itália"),
              ("AC Milan", "Itália"),
              ("Napoli", "Itália"),
              ("Bayern Munich", "Alemanha"),
              ("Borussia Dortmund", "Alemanha"),
              ("Bayer Leverkusen", "Alemanha")
          ]

          for nome, liga in fixas:

              chave = normalizar(nome)

              if chave not in equipas:

                  equipas[chave] = {
                      "id": "",
                      "nome": nome,
                      "liga": liga
                  }

          # ==================================================
          # CARREGAR PLANTÉIS EXISTENTES
          # ==================================================

          ficheiro_saida = "data/planteis.json"

          resultado = {}

          if os.path.exists(ficheiro_saida):

              try:

                  with open(
                      ficheiro_saida,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      resultado = json.load(f)

                  if not isinstance(resultado, dict):
                      resultado = {}

              except Exception:
                  resultado = {}

          # ==================================================
          # PROCURAR EQUIPAS NO THESPORTSDB
          # ==================================================

          total = 0

          for chave, equipa in equipas.items():

              nome = equipa["nome"]
              liga = equipa["liga"]

              print("")
              print("------------------------------------")
              print("🔎", nome)
              print("------------------------------------")

              pesquisas = [
                  nome
              ]

              if nome == "FC Porto":
                  pesquisas += [
                      "Porto",
                      "Futebol Clube do Porto"
                  ]

              elif nome == "Sporting CP":
                  pesquisas += [
                      "Sporting",
                      "Sporting Lisbon"
                  ]

              elif nome == "Benfica":
                  pesquisas += [
                      "SL Benfica",
                      "Sport Lisboa e Benfica"
                  ]

              elif nome == "SC Braga":
                  pesquisas += [
                      "Braga",
                      "Sporting Braga"
                  ]

              team = None

              for pesquisa in pesquisas:

                  url = (
                      API
                      + "/searchteams.php?t="
                      + urllib.parse.quote(pesquisa)
                  )

                  dados = buscar(url)

                  encontrados = dados.get(
                      "teams"
                  ) or []

                  # Primeiro procurar melhor correspondência
                  alvo = normalizar(nome)

                  for candidato in encontrados:

                      nome_api = candidato.get(
                          "strTeam"
                      ) or ""

                      normal_api = normalizar(
                          nome_api
                      )

                      if (
                          alvo in normal_api
                          or normal_api in alvo
                      ):
                          team = candidato
                          break

                  if team is None and encontrados:
                      team = encontrados[0]

                  if team:
                      break

                  time.sleep(1)

              if not team:

                  print("⚠️ Equipa não encontrada")
                  continue

              team_id = team.get("idTeam")

              nome_api = (
                  team.get("strTeam")
                  or nome
              )

              if not team_id:

                  print("⚠️ Sem ID")
                  continue

              print(
                  "✅ Encontrada:",
                  nome_api,
                  "| ID:",
                  team_id
              )

              # ==================================================
              # JOGADORES
              # ==================================================

              time.sleep(1)

              url = (
                  API
                  + "/lookup_all_players.php?id="
                  + urllib.parse.quote(
                      str(team_id)
                  )
              )

              dados_players = buscar(url)

              jogadores_api = (
                  dados_players.get("player")
                  or []
              )

              jogadores = []

              for jogador in jogadores_api:

                  jogador_nome = jogador.get(
                      "strPlayer"
                  )

                  if not jogador_nome:
                      continue

                  jogadores.append({
                      "id": str(
                          jogador.get("idPlayer")
                          or ""
                      ),
                      "name": jogador_nome,
                      "number": (
                          jogador.get("strNumber")
                          or ""
                      ),
                      "position": (
                          jogador.get("strPosition")
                          or ""
                      ),
                      "age": (
                          jogador.get("dateBorn")
                          or ""
                      ),
                      "nationality": (
                          jogador.get("strNationality")
                          or ""
                      ),
                      "photo": (
                          jogador.get("strThumb")
                          or jogador.get("strCutout")
                          or ""
                      )
                  })

              print(
                  "👤 Jogadores:",
                  len(jogadores)
              )

              resultado[str(team_id)] = {
                  "id": str(team_id),
                  "name": nome,
                  "league": liga,
                  "players": jogadores
              }

              total += 1

              time.sleep(1)

          # ==================================================
          # GUARDAR
          # ==================================================

          with open(
              ficheiro_saida,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("====================================")
          print("✅ FUTZONE - PLANTÉIS ATUALIZADOS")
          print("====================================")
          print("Equipas processadas:", total)
          print("Total no ficheiro:", len(resultado))
          print("====================================")

          # ==================================================
          # VERIFICAÇÕES
          # ==================================================

          for procurada in [
              "FC Porto",
              "Sporting CP",
              "Benfica",
              "SC Braga"
          ]:

              encontrada = False

              for equipa in resultado.values():

                  nome = equipa.get(
                      "name",
                      ""
                  )

                  if normalizar(procurada) in normalizar(nome):

                      encontrada = True

                      print(
                          "✅",
                          procurada,
                          "|",
                          nome,
                          "| Jogadores:",
                          len(
                              equipa.get(
                                  "players",
                                  []
                              )
                          )
                      )

                      break

              if not encontrada:
                  print(
                      "⚠️",
                      procurada,
                      "NÃO ENCONTRADO"
                  )

      - name: Guardar alterações
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          if git diff --cached --quiet; then
            echo "ℹ️ Não houve alterações."
          else
            git commit -m "FUTZONE - atualizar planteis automaticamente"
            git push
          fi
