name: Criar planteis FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */12 * * *"

permissions:
  contents: write

jobs:
  planteis:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar planteis
        shell: python
        run: |
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          os.makedirs("data", exist_ok=True)

          API = "https://www.thesportsdb.com/api/v1/json/123"

          def normalizar(texto):
              if not texto:
                  return ""
              texto = str(texto).lower()
              return re.sub(r"[^a-z0-9]", "", texto)

          def buscar(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "FUTZONE/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as resposta:
                      return json.loads(resposta.read().decode("utf-8"))
              except Exception as erro:
                  print("Erro API:", erro)
                  return {}

          # --------------------------------------------------
          # Equipas que queremos garantir
          # --------------------------------------------------

          equipas_fixas = [
              {
                  "nome": "FC Porto",
                  "liga": "Portugal",
                  "pesquisas": [
                      "FC Porto",
                      "Porto",
                      "Futebol Clube do Porto"
                  ]
              },
              {
                  "nome": "Sporting CP",
                  "liga": "Portugal",
                  "pesquisas": [
                      "Sporting CP",
                      "Sporting",
                      "Sporting Lisbon"
                  ]
              },
              {
                  "nome": "Benfica",
                  "liga": "Portugal",
                  "pesquisas": [
                      "Benfica",
                      "SL Benfica",
                      "Sport Lisboa e Benfica"
                  ]
              },
              {
                  "nome": "Braga",
                  "liga": "Portugal",
                  "pesquisas": [
                      "Braga",
                      "SC Braga",
                      "Sporting Braga"
                  ]
              }
          ]

          resultado = {}

          # --------------------------------------------------
          # Procurar cada equipa diretamente no TheSportsDB
          # --------------------------------------------------

          for equipa in equipas_fixas:

              print("")
              print("====================================")
              print("A procurar:", equipa["nome"])
              print("====================================")

              team = None

              for pesquisa in equipa["pesquisas"]:

                  print("Pesquisa:", pesquisa)

                  url = (
                      API
                      + "/searchteams.php?t="
                      + urllib.parse.quote(pesquisa)
                  )

                  dados = buscar(url)

                  encontrados = dados.get("teams") or []

                  # Tentar encontrar o nome mais parecido
                  for candidato in encontrados:

                      nome_api = candidato.get("strTeam") or ""

                      if normalizar(equipa["nome"]) in normalizar(nome_api):
                          team = candidato
                          break

                  # Se não encontrou correspondência exata,
                  # aceita o primeiro resultado
                  if team is None and encontrados:
                      team = encontrados[0]

                  if team:
                      break

                  time.sleep(2)

              if not team:
                  print("❌ Não encontrou", equipa["nome"])
                  continue

              team_id = team.get("idTeam")
              team_nome = team.get("strTeam") or equipa["nome"]

              print("✅ Equipa encontrada:", team_nome)
              print("ID:", team_id)

              if not team_id:
                  continue

              time.sleep(2)

              # ------------------------------------------------
              # Procurar jogadores
              # ------------------------------------------------

              url_players = (
                  API
                  + "/lookup_all_players.php?id="
                  + urllib.parse.quote(str(team_id))
              )

              dados_players = buscar(url_players)

              jogadores_api = dados_players.get("player") or []

              jogadores = []

              for jogador in jogadores_api:

                  nome = jogador.get("strPlayer")

                  if not nome:
                      continue

                  jogadores.append({
                      "id": jogador.get("idPlayer") or "",
                      "name": nome,
                      "number": jogador.get("strNumber") or "",
                      "position": jogador.get("strPosition") or "",
                      "age": jogador.get("dateBorn") or "",
                      "nationality": jogador.get("strNationality") or "",
                      "photo": jogador.get("strThumb") or jogador.get("strCutout") or ""
                  })

              print("Jogadores encontrados:", len(jogadores))

              # ------------------------------------------------
              # Guardar
              # ------------------------------------------------

              resultado[str(team_id)] = {
                  "id": str(team_id),
                  "name": equipa["nome"],
                  "league": equipa["liga"],
                  "players": jogadores
              }

              time.sleep(2)

          # --------------------------------------------------
          # Preservar outros planteis já existentes
          # --------------------------------------------------

          ficheiro = "data/planteis.json"

          antigo = {}

          if os.path.exists(ficheiro):

              try:
                  with open(
                      ficheiro,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      antigo = json.load(f)

                  if not isinstance(antigo, dict):
                      antigo = {}

              except Exception:
                  antigo = {}

          # Manter equipas antigas
          for chave, equipa in antigo.items():

              if chave not in resultado:
                  resultado[chave] = equipa

          # --------------------------------------------------
          # Gravar
          # --------------------------------------------------

          with open(
              ficheiro,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("====================================")
          print("FUTZONE - PLANTÉIS ATUALIZADOS")
          print("Equipas:", len(resultado))
          print("====================================")

          # Verificação especial do FC Porto
          encontrou_porto = False

          for equipa in resultado.values():

              nome = str(equipa.get("name", ""))

              if "porto" in normalizar(nome):
                  encontrou_porto = True
                  print("✅ FC PORTO PRESENTE")
                  print("Nome:", nome)
                  print(
                      "Jogadores:",
                      len(equipa.get("players", []))
                  )

          if not encontrou_porto:
              print("⚠️ FC PORTO NÃO FOI ENCONTRADO")

      - name: Guardar alterações
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/planteis.json

          git diff --cached --quiet || \
            git commit -m "FUTZONE - atualizar planteis"

          git push
