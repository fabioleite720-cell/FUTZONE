name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Atualizar jogos
        shell: bash
        run: |
          set -e

          mkdir -p data

          ONTEM=$(date -u -d "3 days ago" +%Y%m%d)
          FUTURO=$(date -u -d "14 days" +%Y%m%d)

          echo "===================================="
          echo "FUTZONE - ATUALIZAÇÃO DE JOGOS"
          echo "Período: $ONTEM até $FUTURO"
          echo "===================================="

          buscar_jogos() {

            LIGA="$1"
            FICHEIRO="$2"

            echo ""
            echo "⚽ A atualizar: $LIGA"

            TEMP="data/${FICHEIRO}.tmp"

            URL="https://site.api.espn.com/apis/site/v2/sports/soccer/${LIGA}/scoreboard?dates=${ONTEM}-${FUTURO}&limit=1000"

            if curl -fLsS \
              --connect-timeout 15 \
              --max-time 60 \
              "$URL" \
              -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          ficheiro=sys.argv[1]

          try:
              with open(ficheiro,"r",encoding="utf-8") as f:
                  dados=json.load(f)

              eventos=dados.get("events")

              if isinstance(eventos,list):
                  print("✅ JSON válido")
                  print("Jogos encontrados:",len(eventos))

                  vivos=0

                  for jogo in eventos:

                      try:
                          status=(
                              jogo
                              .get("competitions",[{}])[0]
                              .get("status",{})
                              .get("type",{})
                              .get("state")
                          )

                          if status=="in":
                              vivos+=1

                      except Exception:
                          pass

                  print("🔴 Jogos LIVE encontrados:",vivos)

                  sys.exit(0)

              print("❌ O JSON não contém events")
              sys.exit(1)

          except Exception as e:

              print("❌ JSON inválido:",e)
              sys.exit(1)
          PY
              then

                mv "$TEMP" "data/${FICHEIRO}.json"

                echo "✅ $FICHEIRO atualizado"

              else

                rm -f "$TEMP"

                echo "⚠️ Resposta inválida."
                echo "O ficheiro anterior será mantido."

              fi

            else

              rm -f "$TEMP"

              echo "⚠️ Falha na API."
              echo "O ficheiro anterior será mantido."

            fi
          }

          buscar_jogos "por.1" "primeira-liga"
          buscar_jogos "eng.1" "premier-league"
          buscar_jogos "esp.1" "la-liga"
          buscar_jogos "ita.1" "serie-a"
          buscar_jogos "ger.1" "bundesliga"

          echo ""
          echo "===================================="
          echo "📊 ATUALIZAR CLASSIFICAÇÕES"
          echo "===================================="

          buscar_classificacao() {

            LIGA="$1"
            FICHEIRO="$2"

            TEMP="data/${FICHEIRO}.tmp"

            echo ""
            echo "📊 $LIGA"

            URL="https://site.api.espn.com/apis/v2/sports/soccer/${LIGA}/standings"

            if curl -fLsS \
              --connect-timeout 15 \
              --max-time 60 \
              "$URL" \
              -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          try:

              with open(sys.argv[1],"r",encoding="utf-8") as f:
                  dados=json.load(f)

              if isinstance(dados,dict):

                  print("✅ Classificação válida")
                  sys.exit(0)

              sys.exit(1)

          except Exception:

              sys.exit(1)
          PY
              then

                mv "$TEMP" "data/${FICHEIRO}.json"

                echo "✅ Classificação atualizada"

              else

                rm -f "$TEMP"

                echo "⚠️ Classificação inválida — anterior mantida"

              fi

            else

              rm -f "$TEMP"

              echo "⚠️ Falha na classificação — anterior mantida"

            fi
          }

          buscar_classificacao "por.1" "classificacao"

          buscar_classificacao "eng.1" "premier-league-classificacao"

          buscar_classificacao "esp.1" "la-liga-classificacao"

          buscar_classificacao "ita.1" "serie-a-classificacao"

          buscar_classificacao "ger.1" "bundesliga-classificacao"

          echo ""
          echo "===================================="
          echo "🔎 VERIFICAÇÃO LIVE"
          echo "===================================="

          python3 <<'PY'
          import json
          import glob

          total_live=0

          for ficheiro in glob.glob("data/*.json"):

              if "classificacao" in ficheiro:
                  continue

              try:

                  with open(ficheiro,"r",encoding="utf-8") as f:
                      dados=json.load(f)

                  eventos=dados.get("events",[])

                  for jogo in eventos:

                      try:

                          status=(
                              jogo
                              .get("competitions",[{}])[0]
                              .get("status",{})
                              .get("type",{})
                              .get("state")
                          )

                          if status=="in":

                              total_live+=1

                              nome=jogo.get("name","Jogo")

                              print("🔴 LIVE:",nome)

                      except Exception:
                          pass

              except Exception:
                  pass

          print("")
          print("TOTAL LIVE:",total_live)

          if total_live==0:
              print("ℹ️ Neste momento não foram encontrados jogos LIVE.")
          PY

          echo ""
          echo "===================================="
          echo "✅ ATUALIZAÇÃO TERMINADA"
          echo "===================================="

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "ℹ️ Não houve alterações."
          else
            git commit -m "FUTZONE - atualizar jogos LIVE"
            git push
          fi
