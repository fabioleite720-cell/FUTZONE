name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Buscar jogos das 5 ligas
        run: |
          mkdir -p data

          echo "🇵🇹 Primeira Liga"
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/soccer/por.1/scoreboard?limit=1000" \
            -o data/primeira-liga.json

          echo "🏴 Premier League"
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?limit=1000" \
            -o data/premier-league.json

          echo "🇪🇸 La Liga"
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard?limit=1000" \
            -o data/la-liga.json

          echo "🇮🇹 Serie A"
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard?limit=1000" \
            -o data/serie-a.json

          echo "🇩🇪 Bundesliga"
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard?limit=1000" \
            -o data/bundesliga.json

          echo "📊 Classificações"

          curl -sS "https://site.api.espn.com/apis/v2/sports/soccer/por.1/standings" \
            -o data/classificacao.json

          curl -sS "https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings" \
            -o data/premier-league-classificacao.json

          curl -sS "https://site.api.espn.com/apis/v2/sports/soccer/esp.1/standings" \
            -o data/la-liga-classificacao.json

          curl -sS "https://site.api.espn.com/apis/v2/sports/soccer/ita.1/standings" \
            -o data/serie-a-classificacao.json

          curl -sS "https://site.api.espn.com/apis/v2/sports/soccer/ger.1/standings" \
            -o data/bundesliga-classificacao.json

          echo "✅ Dados das 5 ligas descarregados."

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "FUTZONE - dados das 5 ligas"

          git push
