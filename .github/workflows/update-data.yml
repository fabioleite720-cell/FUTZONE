name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Buscar dados
        env:
          API_KEY: ${{ secrets.FOOTBALLDATA_API_KEY }}
        run: |
          mkdir -p data

          echo "A procurar ligas..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues" \
            -o data/leagues.json

          echo "A procurar Primeira Liga..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/94/matches?limit=100" \
            -o data/primeira-liga.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/94/standings" \
            -o data/classificacao.json

          echo "A procurar Premier League..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/15/matches?limit=100" \
            -o data/premier-league.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/15/standings" \
            -o data/premier-league-classificacao.json

          echo "A procurar La Liga..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/16/matches?limit=100" \
            -o data/la-liga.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/16/standings" \
            -o data/la-liga-classificacao.json

          echo "A procurar Serie A..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/17/matches?limit=100" \
            -o data/serie-a.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/17/standings" \
            -o data/serie-a-classificacao.json

          echo "A procurar Bundesliga..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/18/matches?limit=100" \
            -o data/bundesliga.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/18/standings" \
            -o data/bundesliga-classificacao.json

          echo "Dados atualizados."

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Atualizar dados das 5 ligas"

          git push
