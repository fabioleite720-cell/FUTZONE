name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Buscar dados
        env:
          API_KEY: ${{ secrets.FOOTBALLDATA_API_KEY }}
        run: |
          mkdir -p data

          echo "A procurar competições..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues" \
            -o data/leagues.json

          echo "A procurar jogos..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/fixtures/upcoming?limit=100" \
            -o data/proximos.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/fixtures/today?limit=100" \
            -o data/hoje.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/fixtures/live" \
            -o data/live.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/fixtures/results?limit=100" \
            -o data/resultados.json

          echo "A procurar jogos das competições..."

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/15/matches?limit=100" \
            -o data/premier-league.json

          curl -sS \
            -H "Authorization: Bearer $API_KEY" \
            "https://footballdata.io/api/v1/leagues/15/standings" \
            -o data/premier-league-classificacao.json

          echo "Dados atualizados."

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Atualizar dados FUTZONE"

          git push
