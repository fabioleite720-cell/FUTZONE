name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Buscar jogos e classificações
        shell: bash
        run: |
          set -e

          mkdir -p data

          ONTEM=$(date -u -d "3 days ago" +%Y%m%d)
          FUTURO=$(date -u -d "14 days" +%Y%m%d)

          echo "📅 Período: $ONTEM até $FUTURO"

          buscar_jogos() {
            LIGA="$1"
            FICHEIRO="$2"

            echo "⚽ A procurar $LIGA"

            TEMP="data/${FICHEIRO}.tmp"

            if curl -fLsS \
              "https://site.api.espn.com/apis/site/v2/sports/soccer/${LIGA}/scoreboard?dates=${ONTEM}-${FUTURO}&limit=1000" \
              -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          ficheiro = sys.argv[1]

          try:
              with open(ficheiro, "r", encoding="utf-8") as f:
                  dados = json.load(f)

              if isinstance(dados, dict) and "events" in dados:
                  if isinstance(dados["events"], list):
                      print("JSON válido com events:", len(dados["events"]))
                      sys.exit(0)

              print("Resposta sem events")
              sys.exit(1)

          except Exception as e:
              print("JSON inválido:", e)
              sys.exit(1)
          PY
              then
                mv "$TEMP" "data/${FICHEIRO}.json"
                echo "✅ $FICHEIRO atualizado"
              else
                rm -f "$TEMP"
                echo "⚠️ Resposta inválida para $FICHEIRO — ficheiro anterior mantido"
              fi

            else
              rm -f "$TEMP"
              echo "⚠️ Falha na API para $FICHEIRO — ficheiro anterior mantido"
            fi
          }

          buscar_jogos "por.1" "primeira-liga"
          buscar_jogos "eng.1" "premier-league"
          buscar_jogos "esp.1" "la-liga"
          buscar_jogos "ita.1" "serie-a"
          buscar_jogos "ger.1" "bundesliga"

          echo ""
          echo "📊 A atualizar classificações..."

          buscar_classificacao() {
            LIGA="$1"
            FICHEIRO="$2"

            echo "📊 $LIGA"

            TEMP="data/${FICHEIRO}.tmp"

            if curl -fLsS \
              "https://site.api.espn.com/apis/v2/sports/soccer/${LIGA}/standings" \
              -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          ficheiro = sys.argv[1]

          try:
              with open(ficheiro, "r", encoding="utf-8") as f:
                  dados = json.load(f)

              if isinstance(dados, dict):
                  print("Classificação JSON válida")
                  sys.exit(0)

              print("Formato inválido")
              sys.exit(1)

          except Exception as e:
              print("JSON inválido:", e)
              sys.exit(1)
          PY
              then
                mv "$TEMP" "data/${FICHEIRO}.json"
                echo "✅ $FICHEIRO atualizado"
              else
                rm -f "$TEMP"
                echo "⚠️ Classificação inválida — ficheiro anterior mantido"
              fi

            else
              rm -f "$TEMP"
              echo "⚠️ Falha na classificação — ficheiro anterior mantido"
            fi
          }

          # PORTUGAL
          # IMPORTANTE:
          # O site guarda a classificação portuguesa em:
          # data/classificacao.json
          buscar_classificacao "por.1" "classificacao"

          buscar_classificacao "eng.1" "premier-league-classificacao"
          buscar_classificacao "esp.1" "la-liga-classificacao"
          buscar_classificacao "ita.1" "serie-a-classificacao"
          buscar_classificacao "ger.1" "bundesliga-classificacao"

          echo ""
          echo "🔎 Verificação dos ficheiros..."

          python3 <<'PY'
          import json
          import os

          ficheiros = [
              "data/primeira-liga.json",
              "data/premier-league.json",
              "data/la-liga.json",
              "data/serie-a.json",
              "data/bundesliga.json",
              "data/classificacao.json",
              "data/premier-league-classificacao.json",
              "data/la-liga-classificacao.json",
              "data/serie-a-classificacao.json",
              "data/bundesliga-classificacao.json"
          ]

          for ficheiro in ficheiros:
              if not os.path.exists(ficheiro):
                  print("⚠️ NÃO EXISTE:", ficheiro)
                  continue

              try:
                  with open(ficheiro, "r", encoding="utf-8") as f:
                      dados = json.load(f)

                  if "classificacao" in ficheiro:
                      print("✅", ficheiro, "OK")
                  else:
                      eventos = dados.get("events", [])
                      print("✅", ficheiro, "OK - jogos:", len(eventos))

              except Exception as e:
                  print("❌", ficheiro, e)
          PY

          echo ""
          echo "✅ Atualização terminada."

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit -m "FUTZONE - atualizar jogos e classificacoes"

          git push
