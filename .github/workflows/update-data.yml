name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Buscar jogos Primeira Liga
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          mkdir -p data
          curl -s \
            -H "X-Auth-Token: $API_KEY" \
            "https://api.football-data.org/v4/competitions/PPL/matches?status=SCHEDULED" \
            -o data/primeira-liga.json

      - name: Buscar classificação Primeira Liga
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          curl -s \
            -H "X-Auth-Token: $API_KEY" \
            "https://api.football-data.org/v4/competitions/PPL/standings" \
            -o data/classificacao.json

      - name: Guardar dados
        run: |
          git config user.name "FUTZONE"
          git config user.email "futzone@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualizar jogos e classificação"
          git push
