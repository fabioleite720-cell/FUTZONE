name: Atualizar dados FUTZONE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Atualizar jogos e classificações
        shell: bash
        run: |
          set -u

          mkdir -p data

          ONTEM=$(date -u -d "3 days ago" +%Y%m%d)
          FUTURO=$(date -u -d "14 days" +%Y%m%d)

          echo "Periodo: $ONTEM ate $FUTURO"

          baixar_jogos() {
            LIGA="$1"
            FICHEIRO="$2"

            echo ""
            echo "================================"
            echo "JOGOS: $LIGA"
            echo "================================"

            TEMP="data/${FICHEIRO}.tmp"

            URL="https://site.api.espn.com/apis/site/v2/sports/soccer/${LIGA}/scoreboard?dates=${ONTEM}-${FUTURO}&limit=1000"

            if curl -fLsS --max-time 60 "$URL" -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          ficheiro = sys.argv[1]

          try:
              with open(ficheiro, "r", encoding="utf-8") as f:
                  d = json.load(f)

              eventos = d.get("events")

              if isinstance(eventos, list):
                  print("JSON valido:", len(eventos), "jogos")
                  sys.exit(0)

              print("Resposta sem events.")
              sys.exit(1)

          except Exception as e:
              print("JSON invalido:", e)
              sys.exit(1)
          PY
              then

                mv "$TEMP" "data/$FICHEIRO"

                echo "OK: $FICHEIRO"

              else

                rm -f "$TEMP"

                echo "AVISO: resposta invalida."
                echo "Ficheiro anterior mantido."
              fi

            else

              rm -f "$TEMP"

              echo "AVISO: API indisponivel."
              echo "Ficheiro anterior mantido."
            fi
          }

          baixar_classificacao() {
            LIGA="$1"
            FICHEIRO="$2"

            echo ""
            echo "================================"
            echo "TABELA: $LIGA"
            echo "================================"

            TEMP="data/${FICHEIRO}.tmp"

            URL="https://site.api.espn.com/apis/v2/sports/soccer/${LIGA}/standings"

            if curl -fLsS --max-time 60 "$URL" -o "$TEMP"; then

              if python3 - "$TEMP" <<'PY'
          import json
          import sys

          ficheiro = sys.argv[1]

          try:
              with open(ficheiro, "r", encoding="utf-8") as f:
                  d = json.load(f)

              if isinstance(d, dict) and (
                  "children" in d or
                  "standings" in d or
                  "entries" in d
              ):
                  print("Classificacao valida.")
                  sys.exit(0)

              print("Estrutura de classificacao inesperada.")
              sys.exit(1)

          except Exception as e:
              print("JSON invalido:", e)
              sys.exit(1)
          PY
              then

                mv "$TEMP" "data/$FICHEIRO"

                echo "OK: $FICHEIRO"

              else

                rm -f "$TEMP"

                echo "AVISO: classificacao invalida."
                echo "Ficheiro anterior mantido."
              fi

            else

              rm -f "$TEMP"

              echo "AVISO: API de classificacoes indisponivel."
              echo "Ficheiro anterior mantido."
            fi
          }

          # =========================================
          # JOGOS
          # =========================================

          baixar_jogos "por.1" "primeira-liga.json"
          baixar_jogos "eng.1" "premier-league.json"
          baixar_jogos "esp.1" "la-liga.json"
          baixar_jogos "ita.1" "serie-a.json"
          baixar_jogos "ger.1" "bundesliga.json"

          # =========================================
          # CLASSIFICACOES
          # =========================================

          baixar_classificacao \
            "por.1" \
            "classificacao.json"

          baixar_classificacao \
            "eng.1" \
            "premier-league-classificacao.json"

          baixar_classificacao \
            "esp.1" \
            "la-liga-classificacao.json"

         
