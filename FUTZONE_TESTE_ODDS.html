<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE PREMIUM — TESTE ESPN ODDS</title>

<style>
body{
margin:0;
padding:15px;
background:#03060b;
color:#fff;
font-family:Arial,sans-serif;
}
h1{
color:#1683ff;
text-align:center;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#1683ff;
color:#fff;
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}
.card{
background:#0a111b;
border:1px solid #26384d;
border-radius:12px;
padding:15px;
margin-bottom:12px;
}
.ok{
color:#39d353;
font-weight:bold;
}
.erro{
color:#ff5252;
font-weight:bold;
}
.nome{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}
pre{
white-space:pre-wrap;
word-break:break-word;
font-size:12px;
color:#bbb;
}
</style>
</head>

<body>

<h1>🔥 FUTZONE PREMIUM</h1>

<button onclick="testar()">TESTAR ODDS ESPN</button>

<div id="resultado">
Carrega no botão para testar.
</div>

<script>

async function testar(){

const box=document.getElementById("resultado");

box.innerHTML=`
<div class="card">
A testar ligação às odds do ESPN...
</div>
`;

try{

/*
 Endpoint de teste.
 Usamos um evento de futebol conhecido apenas
 para verificar a estrutura da resposta.
*/

const url=
"https://sports.core.api.espn.com/v2/sports/soccer/leagues/eng.1/events?limit=1";

const resposta=await fetch(url);

if(!resposta.ok){

throw new Error(
"HTTP "+resposta.status
);

}

const dados=await resposta.json();

box.innerHTML=`

<div class="card">

<div class="ok">
✅ ESPN respondeu corretamente
</div>

<div class="nome">
Eventos encontrados
</div>

<pre>
${JSON.stringify(dados,null,2).substring(0,6000)}
</pre>

</div>

`;

}catch(erro){

box.innerHTML=`

<div class="card">

<div class="erro">
❌ Falha na ligação
</div>

<pre>
${erro.message}
</pre>

</div>

`;

}

}

</script>

</body>
</html>
