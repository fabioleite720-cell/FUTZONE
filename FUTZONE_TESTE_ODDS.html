<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE TESTE ODDS</title>

<style>
body{
margin:0;
padding:15px;
background:#03060b;
color:#fff;
font-family:Arial,sans-serif;
}
h1{
text-align:center;
color:#1683ff;
}
.card{
background:#0a111b;
border:1px solid #1c2a3a;
border-radius:12px;
padding:14px;
margin:12px 0;
}
.teams{
font-size:17px;
font-weight:bold;
margin-bottom:10px;
}
.odd{
color:#aaa;
font-size:13px;
margin-bottom:10px;
}
.high{
color:#ff9800;
font-weight:bold;
}
.low{
color:#39d353;
font-weight:bold;
}
.label{
font-size:12px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>⚽ FUTZONE — TESTE ODDS</h1>

<div id="app"></div>

<script>

const jogos=[

{
casa:"Índia",
fora:"Brasil",
oddCasa:12.00,
oddEmpate:5.50,
oddFora:1.15
},

{
casa:"Azerbaijan",
fora:"Lithuania",
oddCasa:2.60,
oddEmpate:3.10,
oddFora:2.55
},

{
casa:"Comoros",
fora:"Senegal",
oddCasa:7.00,
oddEmpate:3.80,
oddFora:1.40
},

{
casa:"Kyrgyz Republic",
fora:"Lebanon",
oddCasa:2.20,
oddEmpate:3.10,
oddFora:3.20
},

{
casa:"Kosovo",
fora:"Austria",
oddCasa:3.60,
oddEmpate:3.30,
oddFora:1.95
},

{
casa:"Portugal",
fora:"Espanha",
oddCasa:2.70,
oddEmpate:3.20,
oddFora:2.55
},

{
casa:"Sporting",
fora:"Arouca",
oddCasa:1.45,
oddEmpate:4.20,
oddFora:7.00
},

{
casa:"Liverpool",
fora:"Arsenal",
oddCasa:2.30,
oddEmpate:3.40,
oddFora:2.90
},

{
casa:"Real Madrid",
fora:"Getafe",
oddCasa:1.30,
oddEmpate:5.00,
oddFora:9.00
},

{
casa:"Escócia",
fora:"França",
oddCasa:5.50,
oddEmpate:3.80,
oddFora:1.55
}

];


function analisar(j){

const h=j.oddCasa;
const d=j.oddEmpate;
const a=j.oddFora;

if(!h || !d || !a){

return{
high:"Análise indisponível",
low:"Mais de 0,5 golos"
};

}


if(a<=1.50){

return{
high:"Vitória "+j.fora,
low:j.fora+" ou empate (X2)"
};

}


if(h<=1.50){

return{
high:"Vitória "+j.casa,
low:j.casa+" ou empate (1X)"
};

}


if(a<h && a<d){

return{
high:j.fora+" ou empate (X2)",
low:"Mais de 0,5 golos"
};

}


if(h<a && h<d){

return{
high:j.casa+" ou empate (1X)",
low:"Mais de 0,5 golos"
};

}


return{
high:"Dupla possibilidade",
low:"Mais de 0,5 golos"
};

}


function mostrar(){

const box=document.getElementById("app");

box.innerHTML=jogos.map(j=>{

const s=analisar(j);

return`

<div class="card">

<div class="teams">
${j.casa} ⚔️ ${j.fora}
</div>

<div class="odd">
Odds 1X2:
${j.oddCasa.toFixed(2)}
/
${j.oddEmpate.toFixed(2)}
/
${j.oddFora.toFixed(2)}
</div>

<div class="label high">
🟠 MÉDIO-ALTO
</div>

<div>
${s.high}
</div>

<div class="label low">
🟢 MÉDIO-BAIXO
</div>

<div>
${s.low}
</div>

</div>

`;

}).join("");

}


mostrar();

</script>

</body>
</html>
