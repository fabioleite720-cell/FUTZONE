<!doctype html>

<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Odds ESPN - FUTZONE</title><style>
body{
font-family:Arial,sans-serif;
background:#03060b;
color:#fff;
padding:15px;
margin:0;
}
h2{color:#1683ff}
.card{
background:#0a111b;
border:1px solid #1c2b3a;
border-radius:10px;
padding:15px;
margin-bottom:15px;
}
.ok{color:#35d07f}
.erro{color:#ff5252}
pre{
white-space:pre-wrap;
word-break:break-word;
font-size:12px;
background:#05080d;
padding:10px;
border-radius:8px;
overflow:auto;
}
button{
background:#1683ff;
color:white;
border:0;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
}
</style></head><body><h2>⚽ FUTZONE — TESTE ODDS ESPN</h2><div id="estado">A testar ESPN...</div><div id="resultado"></div><script>

const EVENT_ID="";

async function getJSON(url){

const r=await fetch(url);

if(!r.ok)
throw new Error("HTTP "+r.status);

return await r.json();

}


async function testar(){

const box=document.getElementById("resultado");
const estado=document.getElementById("estado");

try{

/*
 Primeiro vamos buscar os jogos de hoje
*/

const hoje=new Date();

const data=
hoje.getUTCFullYear()+
String(hoje.getUTCMonth()+1).padStart(2,"0")+
String(hoje.getUTCDate()).padStart(2,"0");

const scoreboard=
"https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates="+data;

const jogos=await getJSON(scoreboard);

const eventos=jogos?.events||[];

if(!eventos.length){

estado.innerHTML=
'<span class="erro">Não foram encontrados jogos.</span>';

return;

}


/*
 Escolher o primeiro jogo
*/

const evento=eventos[0];

const comp=evento?.competitions?.[0];

const eventId=evento?.id;
const compId=comp?.id;

const home=
comp?.competitors?.find(x=>x.homeAway==="home")
?.team?.displayName||"Casa";

const away=
comp?.competitors?.find(x=>x.homeAway==="away")
?.team?.displayName||"Fora";


const league="eng.1";


const oddsURL=
"https://sports.core.api.espn.com/v2/sports/soccer/leagues/"+
league+
"/events/"+
eventId+
"/competitions/"+
compId+
"/odds";


estado.innerHTML=
'<span class="ok">✓ ESPN respondeu aos jogos</span>';


box.innerHTML+=`

<div class="card">

<b>Jogo escolhido</b><br><br>

${home} vs ${away}

<br><br>

<b>Event ID:</b> ${eventId}<br>

<b>Competition ID:</b> ${compId}<br>

<b>URL das odds:</b><br>

<pre>${oddsURL}</pre></div>`;

/*
Agora buscar odds
*/

const odds=await getJSON(oddsURL);

box.innerHTML+=`

<div class="card"><b>Resposta original das odds:</b>

<pre>${escapeHTML(
JSON.stringify(odds,null,2)
)}</pre></div>`;

/*
Analisar os items
*/

const items=Array.isArray(odds?.items)
?odds.items
:[];

box.innerHTML+=`

<div class="card"><b>Quantidade de items:</b> ${items.length}

</div>`;

for(let i=0;i<items.length;i++){

const item=items[i];

box.innerHTML+=`

<div class="card"><b>ITEM ${i+1}</b>

<pre>${escapeHTML(
JSON.stringify(item,null,2)
)}</pre></div>`;

}

}catch(err){

estado.innerHTML=
'<span class="erro">✗ Erro: '+
escapeHTML(String(err))+
'</span>';

}

}

function escapeHTML(v){

return String(v)
.replace(/&/g,"&")
.replace(/</g,"<")
.replace(/>/g,">")
.replace(/"/g,""")
.replace(/'/g,"'");

}

testar();

</script></body>
</html>
