<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE PREMIUM — TESTE</title>

<style>
body{
  margin:0;
  padding:15px;
  background:#03060b;
  color:#fff;
  font-family:Arial,sans-serif;
}
h1{
  font-size:21px;
  color:#1683ff;
}
.card{
  background:#0a111b;
  border:1px solid #26384d;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
}
.teams{
  font-size:17px;
  font-weight:bold;
}
.label{
  margin-top:13px;
  font-size:11px;
  font-weight:bold;
}
.orange{color:#ff9d00}
.green{color:#35d07f}
.value{
  margin-top:5px;
  font-size:16px;
  font-weight:bold;
}
.info{
  margin-top:10px;
  color:#9aa8b8;
  font-size:12px;
}
</style>
</head>

<body>

<h1>🔥 FUTZONE PREMIUM — TESTE</h1>

<div id="resultado"></div>

<script>

/*
=========================================================
 FUTZONE PREMIUM — MOTOR DE TESTE
 SEM INTERNET
 SEM FETCH
 SEM ESPN
=========================================================
*/

/*
 Estes são apenas jogos de teste.
 A análise NÃO dá automaticamente vantagem
 à equipa da casa.
*/

const jogosTeste=[

{
 casa:'Índia',
 fora:'Brasil',
 casaForca:35,
 foraForca:92
},

{
 casa:'Portugal',
 fora:'Espanha',
 casaForca:82,
 foraForca:84
},

{
 casa:'Sporting',
 fora:'Arouca',
 casaForca:88,
 foraForca:60
},

{
 casa:'Manchester City',
 fora:'Everton',
 casaForca:94,
 foraForca:66
},

{
 casa:'Inter',
 fora:'Juventus',
 casaForca:86,
 foraForca:84
},

{
 casa:'Bayern',
 fora:'Mainz',
 casaForca:93,
 foraForca:65
},

{
 casa:'Liverpool',
 fora:'Arsenal',
 casaForca:90,
 foraForca:88
},

{
 casa:'Real Madrid',
 fora:'Getafe',
 casaForca:92,
 foraForca:62
},

{
 casa:'PSG',
 fora:'Lyon',
 casaForca:89,
 foraForca:75
},

{
 casa:'Escócia',
 fora:'França',
 casaForca:62,
 foraForca:91
}

];


/*
=========================================================
 ANÁLISE
=========================================================
*/

function analisar(jogo){

const h=jogo.casaForca;
const a=jogo.foraForca;

const diferenca=Math.abs(h-a);

let favorito;
let high;
let low;


/*
 Visitante claramente superior
*/

if(a-h>=15){

favorito='fora';

if(a-h>=25){

high='Vitória '+jogo.fora;

}else{

high=jogo.fora+' ou empate (X2)';

}

low=jogo.fora+' ou empate (X2)';

}


/*
 Casa claramente superior
*/

else if(h-a>=15){

favorito='casa';

if(h-a>=25){

high='Vitória '+jogo.casa;

}else{

high=jogo.casa+' ou empate (1X)';

}

low=jogo.casa+' ou empate (1X)';

}


/*
 Jogo equilibrado
*/

else{

favorito='equilibrado';

high='Dupla possibilidade';

low='Mais de 0,5 golos';

}


return{

high,
low,
favorito,
diferenca

};

}


/*
=========================================================
 MOSTRAR
=========================================================
*/

function mostrar(){

const box=document.getElementById('resultado');

box.innerHTML=jogosTeste.map(jogo=>{

const r=analisar(jogo);

let info='';

if(r.favorito==='fora'){

info=
'⚠️ Visitante mais forte — '+
jogo.fora+
' tem vantagem de '+
r.diferenca+
' pontos';

}

else if(r.favorito==='casa'){

info=
'🏠 Casa mais forte — '+
jogo.casa+
' tem vantagem de '+
r.diferenca+
' pontos';

}

else{

info=
'⚖️ Equipas equilibradas';

}


return`

<div class="card">

<div class="teams">
${jogo.casa}
</div>

<div style="color:#77889b;margin:4px 0">
vs
</div>

<div class="teams">
${jogo.fora}
</div>

<div class="label orange">
MÉDIO-ALTO
</div>

<div class="value">
${r.high}
</div>

<div class="label green">
MÉDIO-BAIXO
</div>

<div class="value">
${r.low}
</div>

<div class="info">
${info}
</div>

</div>

`;

}).join('');

}


mostrar();

</script>

</body>
</html>
