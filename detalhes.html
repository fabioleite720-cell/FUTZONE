<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FUTZONE - Detalhes</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
header{background:#07111f;color:#fff;padding:16px;text-align:center;font-size:24px;font-weight:bold}
.container{max-width:700px;margin:auto;padding:14px}
.topo{display:flex;justify-content:space-between;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold}
.voltar{background:#111827;color:white}
.atualizar{background:#e5e7eb}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.competicao{text-align:center;color:#777;font-size:13px;font-weight:bold;margin-bottom:14px}
.jogo{display:flex;align-items:center;justify-content:space-between;text-align:center}
.equipa{width:38%;font-weight:bold}
.logo{width:55px;height:55px;object-fit:contain;display:block;margin:auto}
.resultado{width:24%}
.golos{font-size:30px;font-weight:900}
.estado{font-size:12px;color:#777;margin-top:5px}
.titulo{font-size:18px;font-weight:900;margin-bottom:10px}
.evento{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee}
.minuto{width:40px;font-weight:bold}
.icone{width:25px;text-align:center}
.info{flex:1}
.nome{font-weight:bold}
.extra{font-size:12px;color:#777;margin-top:3px}
.stat{margin:13px 0}
.statline{display:flex;justify-content:space-between;font-weight:bold;font-size:13px}
.bar{height:7px;background:#e5e7eb;border-radius:10px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:#111827}
.sem{color:#777;font-size:13px;padding:8px 0}
.erro{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;font-weight:bold}
</style>
</head>

<body>

<header>FUTZONE</header>

<div class="container">

<div class="topo">
<button class="voltar" onclick="history.back()">← Voltar</button>
<button class="atualizar" onclick="carregar()">↻ Atualizar</button>
</div>

<div id="conteudo">
<div class="sem">A carregar...</div>
</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const eventId=params.get("id");
const ligaOriginal=params.get("liga")||"Portugal";

const ligas={
"Portugal":"por.1",
"Inglaterra":"eng.1",
"Espanha":"esp.1",
"Itália":"ita.1",
"Alemanha":"ger.1",
"Champions League":"uefa.champions",
"Liga Europa":"uefa.europa",
"Liga Conferência":"uefa.europa.conf",
"por.1":"por.1",
"eng.1":"eng.1",
"esp.1":"esp.1",
"ita.1":"ita.1",
"ger.1":"ger.1",
"uefa.champions":"uefa.champions",
"uefa.europa":"uefa.europa",
"uefa.europa.conf":"uefa.europa.conf"
};

const liga=ligas[ligaOriginal]||"por.1";

const nomesLigas={
"por.1":"Primeira Liga",
"eng.1":"Premier League",
"esp.1":"La Liga",
"ita.1":"Serie A",
"ger.1":"Bundesliga",
"uefa.champions":"Champions League",
"uefa.europa":"Liga Europa",
"uefa.europa.conf":"Liga Conferência"
};

function esc(x){
return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

function nomePessoa(x){
if(!x)return"";
if(typeof x==="string")return x;
return x.displayName||x.fullName||x.shortName||x.name||x.athlete?.displayName||x.player?.displayName||"";
}

function hora(x){
return x?.clock?.displayValue||x?.time?.displayValue||x?.minute||"";
}

function tipo(x){

const t=(
(x?.text||"")+" "+
(x?.type?.text||"")+" "+
(x?.type?.description||"")+" "+
(x?.type?.name||"")
).toLowerCase();

if(t.includes("goal")||t.includes("golo")||t.includes("score"))return"golo";
if(t.includes("yellow")||t.includes("amarelo"))return"amarelo";
if(t.includes("red")||t.includes("vermelho"))return"vermelho";
if(t.includes("substitution")||t.includes("substitu"))return"sub";
return"";
}

function marcador(x){
return nomePessoa(x.athlete)||
nomePessoa(x.player)||
nomePessoa(x.scorer)||
"";
}

function assist(x){
return nomePessoa(x.assist)||
nomePessoa(x.assistant)||
(x.assists?.length?nomePessoa(x.assists[0]):"")||
"";
}

function equipas(data){

let c=
data?.header?.competitions?.[0]?.competitors||
data?.competitions?.[0]?.competitors||
[];

return{
casa:c.find(x=>x.homeAway==="home")||c[0],
fora:c.find(x=>x.homeAway==="away")||c[1]
};
}

function eventos(data){

let a=[];

if(Array.isArray(data.plays))a.push(...data.plays);
if(Array.isArray(data.keyEvents))a.push(...data.keyEvents);
if(Array.isArray(data.scoringPlays))a.push(...data.scoringPlays);

const vistos=new Set();

return a.filter(x=>{
const id=x.id||x.text+hora(x);
if(vistos.has(id))return false;
vistos.add(id);
return tipo(x);
});
}

function estatisticas(data){

if(Array.isArray(data?.boxscore?.teams))
return data.boxscore.teams;

if(Array.isArray(data?.competitions?.[0]?.competitors))
return data.competitions[0].competitors;

return[];
}

function render(data){

const e=equipas(data);

if(!e.casa||!e.fora){
document.getElementById("conteudo").innerHTML=
'<div class="erro">Não foi possível encontrar este jogo.</div>';
return;
}

const nc=e.casa.team?.displayName||e.casa.team?.name||"Casa";
const nf=e.fora.team?.displayName||e.fora.team?.name||"Fora";

const lc=e.casa.team?.logo||"";
const lf=e.fora.team?.logo||"";

const sc=e.casa.score??"0";
const sf=e.fora.score??"0";

const status=
data?.header?.competitions?.[0]?.status?.type?.shortDetail||
data?.header?.competitions?.[0]?.status?.type?.detail||
"";

let html=`

<div class="card">

<div class="competicao">
${esc(nomesLigas[liga]||ligaOriginal)}
</div>

<div class="jogo">

<div class="equipa">
${lc?`<img class="logo" src="${esc(lc)}">`:""}
${esc(nc)}
</div>

<div class="resultado">
<div class="golos">${esc(sc)} - ${esc(sf)}</div>
<div class="estado">${esc(status)}</div>
</div>

<div class="equipa">
${lf?`<img class="logo" src="${esc(lf)}">`:""}
${esc(nf)}
</div>

</div>
</div>

<div class="card">

<div class="titulo">⚽ Acontecimentos</div>
`;

const ev=eventos(data);

if(!ev.length){

html+=`<div class="sem">Sem acontecimentos disponíveis.</div>`;

}else{

ev.forEach(x=>{

const t=tipo(x);

let icon="•";

if(t==="golo")icon="⚽";
if(t==="amarelo")icon="🟨";
if(t==="vermelho")icon="🟥";
if(t==="sub")icon="🔄";

let n=marcador(x)||x.text||"Acontecimento";
let a=assist(x);

html+=`

<div class="evento">

<div class="minuto">${esc(hora(x))}</div>

<div class="icone">${icon}</div>

<div class="info">

<div class="nome">${esc(n)}</div>

${t==="golo"&&a?
`<div class="extra">Assistência: ${esc(a)}</div>`:""}

${t==="sub"&&!marcador(x)?
`<div class="extra">${esc(x.text||"Substituição")}</div>`:""}

</div>

</div>

`;
});
}

html+=`</div>`;

const stats=estatisticas(data);

html+=`

<div class="card">

<div class="titulo">📊 Estatísticas</div>
`;

if(!stats.length){

html+=`<div class="sem">Estatísticas ainda não disponíveis.</div>`;

}else{

const casa=stats.find(x=>x.homeAway==="home")||stats[0];
const fora=stats.find(x=>x.homeAway==="away")||stats[1];

const cs=casa?.statistics||[];
const fs=fora?.statistics||[];

const mapa={};

cs.forEach(x=>{
const n=x.displayName||x.label||x.name;
if(n)mapa[n]={c:x.displayValue??x.value??"",f:""};
});

fs.forEach(x=>{
const n=x.displayName||x.label||x.name;
if(n){
if(!mapa[n])mapa[n]={c:"",f:""};
mapa[n].f=x.displayValue??x.value??"";
}
});

Object.entries(mapa).forEach(([n,v])=>{

let a=parseFloat(String(v.c).replace("%",""))||0;
let b=parseFloat(String(v.f).replace("%",""))||0;
let total=a+b;
let width=total?(a/total)*100:50;

html+=`

<div class="stat">

<div class="statline">
<span>${esc(n)}</span>
<span>${esc(v.c)} - ${esc(v.f)}</span>
</div>

<div class="bar">
<div class="fill" style="width:${width}%"></div>
</div>

</div>

`;
});
}

html+=`</div>`;

document.getElementById("conteudo").innerHTML=html;
}

async function carregar(){

if(!eventId){

document.getElementById("conteudo").innerHTML=
'<div class="erro">ID do jogo não encontrado.</div>';

return;
}

try{

const url=
"https://site.api.espn.com/apis/site/v2/sports/soccer/"+
liga+
"/summary?event="+
encodeURIComponent(eventId)+
"&_="+Date.now();

const r=await fetch(url);

if(!r.ok)throw new Error("Erro "+r.status);

const data=await r.json();

render(data);

}catch(e){

console.error(e);

document.getElementById("conteudo").innerHTML=
'<div class="erro">Não foi possível carregar os detalhes. Tenta atualizar.</div>';

}
}

carregar();

</script>

</body>
</html>
