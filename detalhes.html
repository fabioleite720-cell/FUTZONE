<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTZONE - Detalhes</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:30px
}

header{
 background:#000;
 border-bottom:1px solid #222;
 padding:17px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:10
}

.logo{
 font-size:28px;
 font-weight:900;
 color:#168cff
}

.logo span{color:#fff}

.container{
 max-width:700px;
 margin:auto;
 padding:15px
}

button{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 background:#168cff;
 color:#fff;
 font-weight:bold
}

.back{
 background:#202020;
 margin-bottom:15px
}

.card{
 background:#101010;
 border:1px solid #292929;
 border-radius:16px;
 padding:20px;
 text-align:center
}

.competition{
 color:#168cff;
 font-weight:bold;
 margin-bottom:18px
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:10px
}

.team{
 font-size:16px;
 font-weight:bold
}

.team img{
 width:55px;
 height:55px;
 object-fit:contain;
 display:block;
 margin:0 auto 8px
}

.score{
 font-size:32px;
 font-weight:900;
 white-space:nowrap
}

.status{
 margin-top:12px;
 font-weight:bold
}

.live{color:#ff3030}

.dot{
 display:inline-block;
 width:9px;
 height:9px;
 background:#ff3030;
 border-radius:50%;
 margin-right:5px
}

.section{
 background:#101010;
 border:1px solid #292929;
 border-radius:16px;
 margin-top:15px;
 overflow:hidden
}

.section h3{
 margin:0;
 padding:14px;
 border-bottom:1px solid #292929;
 color:#168cff
}

.event{
 display:flex;
 gap:10px;
 padding:13px;
 border-bottom:1px solid #222;
 align-items:flex-start
}

.event:last-child{border:0}

.minute{
 width:42px;
 min-width:42px;
 color:#aaa;
 font-weight:bold
}

.icon{
 width:25px;
 min-width:25px;
 font-size:20px
}

.event-text{flex:1}

.scorer{
 font-weight:bold;
 font-size:16px
}

.assist{
 color:#aaa;
 font-size:13px;
 margin-top:5px
}

.original{
 color:#666;
 font-size:11px;
 margin-top:5px
}

.stat{
 display:grid;
 grid-template-columns:1fr 1.3fr 1fr;
 padding:13px;
 border-bottom:1px solid #222;
 text-align:center
}

.stat:last-child{border:0}

.stat-name{
 color:#888;
 font-size:12px
}

.stat-value{
 font-weight:bold
}

.info{
 display:flex;
 justify-content:space-between;
 gap:15px;
 padding:13px;
 border-bottom:1px solid #222
}

.info:last-child{border:0}

.label{color:#888}

.value{
 font-weight:bold;
 text-align:right
}

.loading{
 text-align:center;
 padding:40px;
 color:#888
}

.empty{
 text
