<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0057B8">
<title>FUTZONE Futsal</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#fff;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#0057B8,#003b80);padding:18px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:13px;opacity:.85}
nav{display:flex;background:#081426;position:sticky;top:0;z-index:10}
nav button{flex:1;border:0;background:none;color:#9fb4d0;padding:14px 3px;font-size:12px}
nav button.active{background:#0057B8;color:#fff;font-weight:bold}
main{padding:14px 14px 35px}
h2{font-size:20px;margin:8px 0 14px}
h3{margin:0 0 10px}
.card,.match,.league{background:#0b192d;border:1px solid #17345c;border-radius:14px;padding:14px;margin-bottom:12px}
.league{display:flex;align-items:center;gap:12px;cursor:pointer}
.ball{font-size:30px}
.league strong{display:block;font-size:16px}
.info{color:#91a8c5;font-size:13px}
.tabs{display:flex;gap:7px;margin-bottom:14px}
.tabs button{flex:1;background:#0b192d;color:#b8c9df;border:1px solid #234b7c;border-radius:9px;padding:10px 4px;font-size:12px}
.tabs button.active{background:#0057B8;color:white}
.match{cursor:pointer}
.match-top{display:flex;justify-content:space-between;color:#8ea7c5;font-size:12px;margin-bottom:10px}
.teams{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;text-align:center;gap:5px}
.team{font-weight:bold;font-size:14px}
.score{font-size:21px;font-weight:bold}
.status{text-align:center;margin-top:9px;color:#8ea7c5;font-size:12px}
.back{border:0;background:#17345c;color:#fff;padding:10px 15px;border-radius:9px;margin-bottom:14px}
.empty{text-align:center;padding:30px 10px;color:#8299b5}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #17345c;font-size:13px}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{background:#0057B8;padding:9px 3px}
.table td{padding:9px 3px;border-bottom:1px solid #17345c;text-align:center}
.table td:nth-child(2){text-align:left}
.team-link{font-weight:bold;cursor:pointer}
.note{background:#101f34;border-left:4px solid #0057B8;padding:10px;border-radius:6px;color:#a9bdd5;font-size:12px}
.formation{text-align:center;color:#48a5ff;font-size:18px;font-weight:bold;margin:8px}
.field{position:relative;width:100%;max-width:380px;height:430px;margin:15px auto;background:linear-gradient(#087a45,#075f37);border:3px solid #fff;border-radius:12px;overflow:hidden}
.field:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid white}
.circle{position:absolute;width:105px;height:105px;border:2px solid white;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.goal-top,.goal-bottom{position:absolute;left:50%;transform:translateX(-50%);width:105px;height:45px;border:2px solid white}
.goal-top{top:0;border-top:0}.goal-bottom{bottom:0;border-bottom:0}
.player{position:absolute;width:58px;height:58px;border-radius:50%;background:#0057B8;border:3px solid white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:bold}
.p-gk{top:12px;left:50%;transform:translateX(-50%)}
.p-fixo{top:115px;left:50%;transform:translateX(-50%)}
.p-ala1{top:190px;left:18%}.p-ala2{top:190px;right:18%}
.p-pivot{top:300px;left:50%;transform:translateX(-50%)}
.player-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.player-card{background:#081426;border:1px solid #17345c;border-radius:9px;padding:10px;font-size:12px}
.red{color:#ff4545}.yellow{color:#ffd32a}.green{color:#3bd16f}
</style>
</head>

<body>

<header>
<h1>⚽ FUTZONE FUTSAL</h1>
<p>Liga Placard · 2026/27</p>
</header>

<nav>
<button id="nJogos" class="active" onclick="inicio()">🏠 Jogos</button>
<button id="nTabela" onclick="tabela()">🏆 Tabela</button>
<button id="nLive" onclick="aoVivo()">🔴 Ao vivo</button>
</nav>

<main id="app"></main>

<script>

const equipas=[
"AD Fundão","Benfica","Eléctrico","FC Famalicão",
"Ferreira do Zêzere","Leões Porto Salvo","Portimonense",
"Rio Ave","SC Braga","Sporting CP","Torreense","UPVN"
];

const jornadas=[
{
n:1,
jogos:[
["11/09","19:30","AD Fundão","SC Braga"],
["11/09","20:30","Torreense","Eléctrico"],
["11/09","21:15","Sporting CP","Portimonense"],
["12/09","17:00","Leões Porto Salvo","Ferreira do Zêzere"],
["12/09","19:00","Benfica","UPVN"],
["13/09","15:00","Rio Ave","FC Famalicão"]
]},
{
n:2,
jogos:[
["19/09","15:00","Portimonense","Benfica"],
["19/09","17:00","Eléctrico","Rio Ave"],
["19/09","17:00","SC Braga","Torreense"],
["20/09","17:00","FC Famalicão","Sporting CP"],
["20/09","18:00","UPVN","Leões Porto Salvo"],
["21/09","19:00","Ferreira do Zêzere","AD Fundão"]
]}
];

function nav(x){
nJogos.classList.remove("active");
nTabela.classList.remove("active");
nLive.classList.remove("active");
x.classList.add("active");
}

function inicio(){
nav(nJogos);
app.innerHTML=`
<h2>⚽ Futsal</h2>
<div class="league" onclick="liga()">
<div class="ball">⚽</div>
<div><strong>Liga Placard</strong><small>Portugal · 2026/27</small></div>
</div>
<div class="card">
<h3>📰 Futsal</h3>
<p class="info">Liga Placard 2026/27. Calendário oficial carregado.</p>
</div>`;
}

function liga(){
app.innerHTML=`
<button class="back" onclick="inicio()">← Voltar</button>
<h2>🏆 Liga Placard</h2>
<div class="tabs">
<button class="active" onclick="jogosLiga(this)">📅 Jogos</button>
<button onclick="aoVivoLiga(this)">🔴 Ao vivo</button>
<button onclick="realizados(this)">✅ Realizados</button>
</div>
<div id="conteudo"></div>`;
jogosLiga(document.querySelector(".tabs button"));
}

function jogosLiga(btn){
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");

conteudo.innerHTML=jornadas.map(j=>`
<div class="card"><b>JORNADA ${j.n}</b></div>
${j.jogos.map((g,i)=>`
<div class="match" onclick="jogo(${j.n},${i})">
<div class="match-top"><span>${g[0]}</span><span>${g[1]}</span></div>
<div class="teams">
<div class="team">${g[2]}</div>
<div class="score">-</div>
<div class="team">${g[3]}</div>
</div>
<div class="status">Pré-jogo · Ver detalhes</div>
</div>`).join("")}`).join("");
}

function aoVivoLiga(btn){
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
conteudo.innerHTML=`<div class="empty">🔴<br><br>Não existem jogos ao vivo neste momento.</div>`;
}

function realizados(btn){
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
conteudo.innerHTML=`<div class="empty">Ainda não existem resultados realizados.</div>`;
}

function jogo(jornada,index){
let g=jornadas[jornada-1].jogos[index];

app.innerHTML=`
<button class="back" onclick="liga()">← Voltar</button>

<div class="card">
<div class="match-top"><span>${g[0]}</span><span>${g[1]}</span></div>
<div class="teams">
<div class="team">${g[2]}</div>
<div class="score">-</div>
<div class="team">${g[3]}</div>
</div>
<div class="status">PRÉ-JOGO</div>
</div>

<div class="card">
<h3>🧠 Tática</h3>
<div class="formation">1-2-1</div>
<p class="info">Modelo tático experimental.</p>

<div class="field">
<div class="goal-top"></div>
<div class="goal-bottom"></div>
<div class="circle"></div>
<div class="player p-gk">GR</div>
<div class="player p-fixo">FIXO</div>
<div class="player p-ala1">ALA</div>
<div class="player p-ala2">ALA</div>
<div class="player p-pivot">PIVÔ</div>
</div>

<div class="note">
Os nomes e posições oficiais serão apresentados quando existirem dados reais.
</div>
</div>

<div class="card">
<h3>⚽ Golos</h3>
<div class="empty">Sem acontecimentos.</div>
</div>

<div class="card">
<h3>🟨 Cartões</h3>
<div class="empty">Sem cartões.</div>
</div>

<div class="card">
<h3>🔄 Substituições</h3>
<div class="empty">Sem substituições.</div>
</div>

<div class="card">
<h3>📊 Estatísticas</h3>
<div class="row"><span>Posse</span><b>— / —</b></div>
<div class="row"><span>Remates</span><b>— / —</b></div>
<div class="row"><span>Remates à baliza</span><b>— / —</b></div>
<div class="row"><span>Cantos</span><b>— / —</b></div>
<div class="row"><span>Faltas</span><b>— / —</b></div>
</div>

<div class="card">
<h3>👥 5 inicial</h3>
<div class="player-list">
<div class="player-card">GR<br>Informação não disponível</div>
<div class="player-card">FIXO<br>Informação não disponível</div>
<div class="player-card">ALA<br>Informação não disponível</div>
<div class="player-card">ALA<br>Informação não disponível</div>
<div class="player-card">PIVÔ<br>Informação não disponível</div>
</div>
</div>`;
}

function tabela(){
nav(nTabela);

let linhas=equipas.map((e,i)=>`
<tr>
<td>${i+1}</td>
<td><span class="team-link" onclick="equipa('${e}')">${e}</span></td>
<td>0</td><td>0</td><td>0</td><td>0</td>
</tr>`).join("");

app.innerHTML=`
<h2>🏆 Classificação</h2>
<div class="card">
<h3>Liga Placard 2026/27</h3>
<table class="table">
<thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>E</th><th>P</th></tr></thead>
<tbody>${linhas}</tbody>
</table>
<p class="note">A classificação será preenchida automaticamente quando ligarmos os resultados reais.</p>
</div>`;
}

function aoVivo(){
nav(nLive);
app.innerHTML=`
<h2>🔴 Ao vivo</h2>
<div class="card">
<div class="empty">🔴<br><br>
Não existem jogos de futsal ao vivo neste momento.
<br><br>
<span class="info">Quando existirem, todos os jogos ao vivo aparecerão aqui.</span>
</div>
</div>`;
}

function equipa(nome){
app.innerHTML=`
<button class="back" onclick="tabela()">← Voltar</button>
<div class="card" style="text-align:center">
<div style="font-size:50px">⚽</div>
<h2>${nome}</h2>
<p class="info">Liga Placard · 2026/27</p>
</div>

<div class="card">
<h3>📅 Jogos</h3>
<div class="empty">Calendário da equipa será ligado aos dados reais.</div>
</div>

<div class="card">
<h3>👥 Plantel</h3>
<div class="player-list">
<div class="player-card">GR<br>Informação não disponível</div>
<div class="player-card">FIXO<br>Informação não disponível</div>
<div class="player-card">ALA<br>Informação não disponível</div>
<div class="player-card">ALA<br>Informação não disponível</div>
<div class="player-card">PIVÔ<br>Informação não disponível</div>
</div>
</div>`;
}

inicio();

</script>
</body>
</html>
