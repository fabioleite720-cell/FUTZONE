<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0057B8">

<title>FUTZONE - Futsal</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#03060B;
 color:#FFF;
 font-family:Arial,sans-serif;
}

header{
 background:#09111C;
 border-bottom:1px solid #1B2A3B;
 padding:12px;
}

.logo{
 font-size:24px;
 font-weight:900;
}

.logo span{
 color:#1683FF;
}

.sub{
 font-size:9px;
 color:#9DAABB;
 margin-top:2px;
}

main{
 max-width:720px;
 margin:auto;
 padding:12px 9px 30px;
}

h2{
 font-size:17px;
 margin:10px 0;
}

h3{
 margin:7px 0;
}

button{
 background:#09111C;
 border:1px solid #1B2A3B;
 color:#FFF;
 border-radius:9px;
 padding:10px 6px;
 font-weight:900;
}

button.active{
 background:#003B7A;
 border-color:#1683FF;
}

.tabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-bottom:10px;
}

.card{
 background:#09111C;
 border:1px solid #1B2A3B;
 border-radius:11px;
 padding:10px;
 margin:7px 0;
}

.game{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:9px;
 padding:11px;
 margin:6px 0;
 text-align:center;
}

.game.clickable{
 cursor:pointer;
}

.date{
 font-size:9px;
 color:#9DAABB;
 margin-bottom:7px;
}

.teams{
 font-size:13px;
 font-weight:bold;
}

.vs{
 color:#1683FF;
 font-size:14px;
 margin:5px;
}

.live{
 color:#FF4054;
 font-size:10px;
 font-weight:900;
}

.note{
 color:#9DAABB;
 font-size:10px;
 line-height:1.45;
}

.back{
 margin-bottom:8px;
 width:100%;
}

.score{
 font-size:25px;
 font-weight:900;
 margin:8px 0;
}

.badge{
 display:inline-block;
 background:#003B7A;
 border:1px solid #1683FF;
 border-radius:20px;
 padding:5px 9px;
 font-size:9px;
 font-weight:bold;
}

.section-title{
 margin-top:14px;
 font-size:13px;
 font-weight:900;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:5px;
 margin-top:7px;
}

.stat{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:8px;
 padding:8px 4px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:13px;
}

.stat span{
 font-size:8px;
 color:#9DAABB;
}

.event{
 border-bottom:1px solid #1B2A3B;
 padding:7px 2px;
 font-size:10px;
}

.event:last-child{
 border-bottom:0;
}

.field{
 position:relative;
 width:100%;
 max-width:420px;
 height:500px;
 margin:12px auto;
 background:#123E2A;
 border:2px solid #FFF;
 border-radius:8px;
 overflow:hidden;
}

.field:before{
 content:"";
 position:absolute;
 left:8%;
 right:8%;
 top:50%;
 border-top:1px solid rgba(255,255,255,.7);
}

.center-circle{
 position:absolute;
 width:90px;
 height:90px;
 border:1px solid rgba(255,255,255,.7);
 border-radius:50%;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
}

.player{
 position:absolute;
 transform:translate(-50%,-50%);
 width:64px;
 text-align:center;
 font-size:8px;
 font-weight:bold;
}

.player .ball{
 width:34px;
 height:34px;
 border-radius:50%;
 background:#1683FF;
 border:2px solid #FFF;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
}

.player small{
 display:block;
 margin-top:3px;
 background:#09111C;
 border-radius:5px;
 padding:3px;
 white-space:nowrap;
}

.home .ball{
 background:#1683FF;
}

.away .ball{
 background:#FF4054;
}

.tactic{
 text-align:center;
 font-size:11px;
 color:#9DAABB;
 margin-bottom:5px;
}

.lineup{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}

.player-row{
 background:#0D1724;
 border:1px solid #1B2A3B;
 border-radius:8px;
 padding:7px;
 font-size:10px;
}

.player-row b{
 color:#1683FF;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:10px;
}

th,td{
 padding:7px 3px;
 border-bottom:1px solid #1B2A3B;
 text-align:center;
}

th{
 color:#9DAABB;
}

.team{
 text-align:left;
 font-weight:bold;
}
</style>
</head>

<body>

<header>
 <div class="logo">FUT<span>ZONE</span></div>

</header>

<main>

</main>

const equipas = [

function inicio(){

 document.getElementById("app").innerHTML = `

 <h2>🥅 Liga Placard 2026/27</h2>

 <div class="tabs">

  <button id="btnJogos"
   class="active"
   onclick="mostrarJogos()">
   📅<br>Jogos
  </button>

  <button id="btnTabela"
   onclick="mostrarTabela()">
   🏆<br>Classificação
  </button>

  <button id="btnLive"
   onclick="mostrarLive()">
   🔴<br>Ao vivo
  </button>

 </div>

 <div id="conteudo"></div>

 `;

 mostrarJogos();
}

function limparTabs(){

 document.getElementById("btnJogos")
 .classList.remove("active");

 document.getElementById("btnTabela")
 .classList.remove("active");

 document.getElementById("btnLive")
 .classList.remove("active");
}

function mostrarJogos(){

 limparTabs();

 document.getElementById("btnJogos")
 .classList.add("active");

 document.getElementById("conteudo").innerHTML = `

 <div class="card">

  <b>🇵🇹 1.ª Jornada</b>

  ${jogos.map(j => `

   <div class="game clickable"
    onclick="abrirJogo(${j.id})">

    <div class="date">
     ${j.data} • ${j.hora}
    </div>

    <div class="teams">
     ${j.casa}
     <span class="vs">vs</span>
     ${j.fora}
    </div>

    <div class="note">
     Tocar para ver o jogo
    </div>

   </div>

  `).join("")}

 </div>

 <p class="note">
  🔵 Versão experimental de futsal.
  Toca num jogo para abrir a ficha completa.
 </p>

 `;

}

function mostrarTabela(){

 limparTabs();

 document.getElementById("btnTabela")
 .classList.add("active");

 document.getElementById("conteudo").innerHTML = `

 <div class="card">

  <b>🏆 Classificação</b>

  <table>

   <tr>
    <th>#</th>
    <th>Equipa</th>
    <th>J</th>
    <th>P</th>
   </tr>

   ${equipas.map((e,i)=>`

   <tr>
    <td>${i+1}</td>
    <td class="team">${e}</td>
    <td>0</td>
    <td>0</td>
   </tr>

   `).join("")}

  </table>

  <p class="note">
   Os valores reais serão ligados à fonte de resultados.
  </p>

 </div>

 `;

}

function mostrarLive(){

 limparTabs();

 document.getElementById("btnLive")
 .classList.add("active");

 const aoVivo = jogos.filter(
  j => j.estado === "Ao vivo"
 );

 if(!aoVivo.length){

  document.getElementById("conteudo").innerHTML = `

   <div class="card">

    <div class="live">
     🔴 AO VIVO
    </div>

    <h3>
     Não há jogos ao vivo neste momento.
    </h3>

    <p class="note">
     Quando existir um jogo em direto,
     aparecerá aqui automaticamente.
    </p>

   </div>

  `;

  return;
 }

 document.getElementById("conteudo").innerHTML = `

  ${aoVivo.map(j=>`

   <div class="game clickable"
    onclick="abrirJogo(${j.id})">

    <div class="live">
     🔴 AO VIVO
    </div>

    <div class="teams">
     ${j.casa} ${j.scoreCasa}
     -
     ${j.scoreFora} ${j.fora}
    </div>

   </div>

  `).join("")}

 `;

}
